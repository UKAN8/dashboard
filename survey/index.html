let TOK='', SKEY='', DEF=null, ANS={}, NAME='';
const 치환=s=>String(s||'').replace(/\{이름\}/g,E(NAME));
const 문항만=()=>DEF.문항.filter(q=>!q.sec);
function 보임(q){ return !q.sec && (!q.when||q.when(ANS)); }
function visible(){ return 문항만().filter(보임); }
function 선택(q){ return q.free||q.num||q.opt; }
function 필수(){ return visible().filter(q=>!선택(q)); }
// 글 칸이 여럿이면 서버 크기 가드(8000B)에 걸리지 않게 칸당 300자
const ML=()=>문항만().filter(q=>q.free).length>1?300:500;
function 답함(q){ const v=ANS[q.k]; return Array.isArray(v)?v.length>0:!!v; }

function draw(){
  const H=[]; let n=0;
  DEF.문항.forEach((q,i)=>{
    if(q.sec){ H.push(`<div class="sec">${E(q.sec)}</div>`); return; }
    const on=보임(q);
    if(!on) return;
    const lab = 선택(q) ? (q.free&&DEF===SURVEYS.hw0827?'끝으로':'선택') : 'Q'+(++n);
    const head=`<div class="n">${lab}</div><div class="t">${q.t}</div>`+(q.s?`<div class="s">${q.s}</div>`:'');
    let body='';
    if(q.free){
      const v=ANS[q.k]||'';
      body=`<textarea id="f_${E(q.k)}" data-k="${E(q.k)}" maxlength="${ML()}" placeholder="${E(q.ph||'')}">${E(v)}</textarea>
        <div class="cnt"><span id="c_${E(q.k)}">${v.length}</span>/${ML()}</div>`;
    }else if(q.num){
      body=`<input class="num" type="number" inputmode="numeric" min="0" max="100" id="f_${E(q.k)}" data-k="${E(q.k)}" placeholder="예) 87" value="${E(ANS[q.k]||'')}">`;
    }else{
      const cur=ANS[q.k];
      body='<div class="opts">'+q.o.map(o=>{
        const sel = q.multi ? (Array.isArray(cur)&&cur.includes(o)) : cur===o;
        return `<button class="opt${sel?' on':''}" data-i="${i}" data-v="${E(o)}">${E(o)}</button>`;}).join('')+'</div>';
    }
    H.push(`<div class="q" data-k="${E(q.k)}">${head}${body}</div>`);
  });
  $('qs').innerHTML=H.join('');
  $('qs').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const q=DEF.문항[+b.dataset.i], v=b.dataset.v;
    if(q.multi){
      let a=Array.isArray(ANS[q.k])?[...ANS[q.k]]:[];
      if(a.includes(v)) a=a.filter(x=>x!==v);
      else if(EX.includes(v)) a=[v];
      else { a=a.filter(x=>!EX.includes(x)); if(a.length>=q.multi) a.shift(); a.push(v); }
      ANS[q.k]=a;
    } else ANS[q.k] = (ANS[q.k]===v ? '' : v);   // 한 번 더 누르면 해제
    save(); draw();
  });
  $('qs').querySelectorAll('textarea,input.num').forEach(f=>f.oninput=()=>{
    ANS[f.dataset.k]=f.value; const c=$('c_'+f.dataset.k); if(c) c.textContent=f.value.length; save(); gauge(); });
  gauge();
}

function gauge(){
  const need=필수(), got=need.filter(답함).length;
  $('pg').style.width = Math.round(got/Math.max(need.length,1)*100)+'%';
  const b=$('send');
  b.disabled = got<need.length;
  b.textContent = got<need.length ? `${need.length-got}개 남았어요` : '제출하기';
}

/* 임시 저장 — 폰에서 카톡 알림에 튕겨 나갔다 돌아와도 답이 남아 있어야 한다.
   ⚠ 사생활 모드·저장 차단이면 던진다. 실패해도 설문은 그냥 돌아가야 하므로 통째로 감싼다. */
const LK=()=>'survey:'+SKEY+':'+TOK.slice(0,8);
function save(){ try{ localStorage.setItem(LK(), JSON.stringify(ANS)); }catch(e){} }
function load(){ try{ return JSON.parse(localStorage.getItem(LK())||'{}'); }catch(e){ return {}; } }

function say(t,s){ $('msg').innerHTML=`<b>${E(t)}</b>${E(s||'')}`; $('msg').style.display=''; }

function 완료(수정){
  const d=DEF.완료||['제출됐어요. 고마워요~','다음 과제에 반영할게요.<br>바꾸고 싶으면 다시 눌러서 고치셔도 돼요.'];
  $('app').style.display='none'; $('bar').style.display='none';
  $('msg').style.display='';
  $('msg').className='done';
  $('msg').innerHTML=`<div class="k">✓</div><b>${수정?'다시 제출됐어요~':치환(d[0])}</b>
    <p>${치환(d[1])}</p>
    <button class="again" id="again">답 고치기</button>`;
  $('again').onclick=()=>{ $('msg').style.display='none'; $('msg').className='msg';
    $('app').style.display=''; $('bar').style.display=''; draw(); };
}

async function send(){
  const b=$('send'); b.disabled=true; b.textContent='보내는 중이에요…';
  const 낼것={}; visible().forEach(q=>{ if(답함(q)) 낼것[q.k]=ANS[q.k]; });
  if(DEF.부모) 낼것._응답자='학부모';
  let data,err;
  try{ ({data,error:err}=await sb.rpc('survey_submit',{tok:TOK,skey:SKEY,ans:낼것})); }
  catch(e){ err=e; }
  if(err||!data||!data.ok){ b.disabled=false; b.textContent='전송이 안 됐어요. 다시 눌러주세요'; return; }
  save(); 완료(false);
}

  NAME=data.이름||'';
  $('nm').textContent=NAME+(DEF.부모?' 학부모님':'');
  $('cl').textContent=data.반||'';
  $('lead').innerHTML=치환(DEF.제목);
  $('note').innerHTML=치환(DEF.안내||'답은 <b>성적이랑 아무 상관 없어요.</b> 다음 과제 만들 때 반영하려고 여쭤보는 거라, 솔직할수록 도움이 됩니다~ 1분이면 끝나요.');
  $('foot').innerHTML=DEF.말미?치환(DEF.말미):`이 주소는 ${E(NAME)} 개인 링크예요. 다른 사람에게 전달하지 마세요.<br>
    답은 쌤만 봅니다. 다른 친구들에게 공개되지 않아요.`;
  // 학부모 키는 지난 답을 서버에서 복원하지 않는다(같은 토큰으로 학생이 열 수 있으므로). 기기 임시저장만.
  ANS = Object.assign({}, DEF.부모?{}:(data.지난답||{}), load());
  $('msg').style.display='none'; $('app').style.display=''; $('bar').style.display='';
  draw();
  $('send').onclick=send;
  if(data.제출함 && !Object.keys(load()).length) 완료(true);
})();
