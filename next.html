<style>/* ── UI 키트 (00_대시보드/_ui) ── */
/* 수학은유강 UI 토큰 (1118) — Meta Astryx 의 "토큰 층" 벤치마킹: 부품은 그대로, 토큰만 바꾸면 테마가 바뀐다.

   쓰는 법:  <html data-theme="light|dark">  — 부품(kit.css)은 var(--u-*) 만 쓴다. 색 값을 부품에 직접 쓰지 않는다. */
:root, [data-theme="light"] {
  color-scheme: light;
  /* 색 */
  --u-bg: #f6f7f9;          --u-surface: #ffffff;     --u-surface-2: #f3f4f7;
  --u-line: #e3e6eb;        --u-line-strong: #cfd4dc;

  --u-accent: #1f5eff;      --u-accent-soft: #e8efff; --u-on-accent: #ffffff;
  --u-ok: #0f8a5f;          --u-ok-soft: #e3f5ee;
  --u-warn: #b45309;        --u-warn-soft: #fdf1e1;
  --u-bad: #c62828;         --u-bad-soft: #fde8e8;
  --u-slip: #d9730d;        --u-slip-soft: #fff0e0;
  --u-overlay: rgba(15, 20, 30, .38);
  --u-shadow-pop: 0 20px 50px rgba(15, 20, 30, .18);
}
[data-theme="dark"] {
  color-scheme: dark;
  --u-bg: #0a0a0f;          --u-surface: rgba(255,255,255,.03); --u-surface-2: rgba(255,255,255,.06);
  --u-line: rgba(255,255,255,.08); --u-line-strong: rgba(255,255,255,.16);
  --u-text: #f5f5fa;        --u-text-2: #b8b8c5;      --u-muted: #8a8a98;    --u-faint: #5d5d6b;
  --u-accent: #f5a0a0;      --u-accent-soft: rgba(245,160,160,.16); --u-on-accent: #2a0d0d;
  --u-ok: #c8f0da;          --u-ok-soft: rgba(200,240,218,.12);
  --u-warn: #ffd59a;        --u-warn-soft: rgba(255,213,154,.12);
  --u-bad: #ff8f8f;         --u-bad-soft: rgba(255,143,143,.10);
  --u-slip: #ffb46b;        --u-slip-soft: rgba(255,180,107,.10);
  --u-overlay: rgba(0, 0, 0, .6);
  --u-shadow-pop: 0 20px 50px rgba(0, 0, 0, .5);
}
:root {

  --u-h-control: 36px; --u-h-control-sm: 28px;     /* 폰 화면은 kit.css 가 44px 로 키운다 */
  --u-motion: 160ms ease;
}

/* 수학은유강 UI 부품 (1118) — 모든 부품은 u- 접두어, 색은 tokens.css 의 var(--u-*) 만 쓴다.

@font-face{font-family:'Paperlogy';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-6SemiBold.woff2') format('woff2');font-weight:600;font-display:swap}
*{box-sizing:border-box}

<script>/* ── UI 키트 (00_대시보드/_ui/kit.js) ── */
/* 수학은유강 UI 도우미 (1118) — window.U. 단일 파일 페이지에 ui_inline.py 가 그대로 넣는다(빌드 도구 없음).
   유강 규칙을 코드로 박아 둔 것: 모든 표 = 정렬 + 첫 열 번호, 정렬은 머리글 누른 순서대로 우선순위(1031) ·
   되돌릴 수 없는 버튼 = 두 번 누르기 · 시각은 KST · 목록은 manifest.json 에 같은 이름으로 적혀 있다. */
(function () {
  'use strict';
  const U = {};
  U.E = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const z2 = n => String(n).padStart(2, '0');
  U.kst = t => new Date(new Date(t).getTime() + 9 * 3600e3);                       // getUTC* 로 읽는다
  U.fmt = (t, withDate = true) => { if (!t) return ''; const d = U.kst(t);
    return (withDate ? (d.getUTCMonth() + 1) + '/' + d.getUTCDate() + ' ' : '') + z2(d.getUTCHours()) + ':' + z2(d.getUTCMinutes()); };
  U.day = t => { const d = U.kst(t); return (d.getUTCMonth() + 1) + '월 ' + d.getUTCDate() + '일 (' + '일월화수목금토'[d.getUTCDay()] + ')'; };
  U.today = () => { const d = U.kst(Date.now()); return d.getUTCFullYear() + '-' + z2(d.getUTCMonth() + 1) + '-' + z2(d.getUTCDate()); };
  U.pct = (a, b) => b ? Math.round(a / b * 100) : null;

  /* 토스트 */
  U.toast = msg => { let el = document.querySelector('.u-toast'); if (!el) { el = document.createElement('div'); el.className = 'u-toast'; document.body.appendChild(el); }
    el.textContent = msg; el.classList.add('on'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('on'), 2500); };

  /* 두 번 누르기 확인 — 첫 번째는 빨갛게 '정말요?', 두 번째에 실행 */
  U.sure = (btn, label, fn) => { btn.onclick = async ev => { ev.stopPropagation();
    if (btn.dataset.sure !== '1') { btn.dataset.sure = '1'; btn.dataset.orig = btn.textContent; btn.classList.add('sure'); btn.textContent = label || '정말요? 한 번 더';
      clearTimeout(btn._t); btn._t = setTimeout(() => { btn.dataset.sure = ''; btn.classList.remove('sure'); btn.textContent = btn.dataset.orig; }, 4000); return; }
    btn.disabled = true; try { await fn(); } finally { btn.disabled = false; } }; };

  /* 표 — U.table(key, cols, rows, {rowAttr, foot}) → HTML 문자열
     cols: [{h:'머리글', v:row=>정렬값, f:row=>칸 HTML(없으면 v), l:true 왼쪽 정렬, num:true 숫자(첫 클릭 내림차순), ns:true 정렬 안 함, tip:'설명'}]
     정렬 상태는 U.SORT[key] — 누른 순서대로 우선순위, 같은 머리글을 다시 누르면 방향만 바뀐다. 다시 그리려면 opts.redraw 를 넘긴다. */
  U.SORT = {}; U.COLS = {}; U.REDRAW = {};
  function sorted(key, rows, cols) {
    const ks = U.SORT[key] || []; if (!ks.length) return rows;
    const val = (r, c) => { const v = cols[c].v(r); return v == null || v === '' ? null : v; };
    return rows.map((r, i) => [r, i]).sort((A, B) => {
      for (const { c, d } of ks) { const x = val(A[0], c), y = val(B[0], c);
        if (x === y) continue; if (x == null) return 1; if (y == null) return -1;
        const r = (typeof x === 'number' && typeof y === 'number') ? x - y : String(x).localeCompare(String(y), 'ko');
        if (r) return d * r; }
      return A[1] - B[1]; }).map(x => x[0]);
  }
  U.table = (key, cols, rows, opts = {}) => {
    U.COLS[key] = cols; if (opts.redraw) U.REDRAW[key] = opts.redraw;
    const ks = U.SORT[key] || [], E = U.E;
    const head = '<thead><tr><th class="ns">#</th>' + cols.map((c, i) => { const k = ks.findIndex(x => x.c === i);
      return '<th class="' + (c.l ? 'l ' : '') + (c.ns ? 'ns' : '') + '" data-u-sk="' + key + '" data-u-ci="' + i + '" title="' + E(c.tip || '') + '">' + E(c.h)
        + (k >= 0 ? '<span class="k">' + (k + 1) + (ks[k].d > 0 ? '▲' : '▼') + '</span>' : '') + '</th>'; }).join('') + '</tr></thead>';
    const body = sorted(key, rows, cols).map((r, i) => '<tr ' + (opts.rowAttr ? opts.rowAttr(r) : '') + '><td class="n">' + (i + 1) + '</td>'
      + cols.map(c => '<td class="' + (c.l ? 'l' : '') + '">' + (c.f ? c.f(r) : E(c.v(r) == null ? '—' : c.v(r))) + '</td>').join('') + '</tr>').join('');
    return '<div class="u-table"><table>' + head + '<tbody>' + body + '</tbody></table></div>'
      + (ks.length ? '<div class="u-table-foot"><button class="u-btn ghost sm" data-u-sreset="' + key + '">정렬 초기화</button></div>' : '')
      + (opts.foot || '');
  };
  document.addEventListener('click', ev => {
    const th = ev.target.closest('th[data-u-sk]');
    if (th && !th.classList.contains('ns')) { const k = th.dataset.uSk, c = +th.dataset.uCi, ks = U.SORT[k] = U.SORT[k] || [], i = ks.findIndex(x => x.c === c);
      if (i < 0) ks.push({ c, d: (U.COLS[k] && U.COLS[k][c] && U.COLS[k][c].num) ? -1 : 1 }); else ks[i].d *= -1;
      (U.REDRAW[k] || U.redraw || (() => {}))(); return; }
    const rs = ev.target.closest('[data-u-sreset]'); if (rs) { U.SORT[rs.dataset.uSreset] = []; (U.REDRAW[rs.dataset.uSreset] || U.redraw || (() => {}))(); }
  });

  /* 팝업 — U.modal({title, body, ok:'저장', wide, danger:{label, fn}, hint, onOk: async ($, err) => true면 닫힘})
     body 안 입력칸은 id 로 찾는다: $('id'). 실패 메시지는 err('…') — 팝업 안에 빨갛게. */
  U.modal = o => {
    let m = document.querySelector('.u-modal'); if (!m) { m = document.createElement('div'); m.className = 'u-modal'; m.innerHTML = '<div class="sheet"></div>'; document.body.appendChild(m);
      m.addEventListener('click', ev => { if (ev.target === m) U.close(); }); document.addEventListener('keydown', ev => { if (ev.key === 'Escape') U.close(); }); }
    const sh = m.querySelector('.sheet'); sh.classList.toggle('wide', !!o.wide);
    sh.innerHTML = (o.title ? '<h2>' + U.E(o.title) + '</h2>' : '') + (o.body || '') + (o.hint ? '<div class="u-hint">' + o.hint + '</div>' : '') + '<div class="u-err"></div>'
      + (o.onOk || o.danger ? '<div class="act">' + (o.danger ? '<button class="u-btn danger" data-u-del style="margin-right:auto">' + U.E(o.danger.label) + '</button>' : '')
        + '<button class="u-btn" data-u-cancel>' + (o.onOk ? '취소' : '닫기') + '</button>' + (o.onOk ? '<button class="u-btn pri" data-u-ok>' + U.E(o.ok || '저장') + '</button>' : '') + '</div>' : '');
    m.classList.add('on');
    const $ = id => sh.querySelector('#' + id), err = t => { sh.querySelector('.u-err').textContent = t || ''; };
    const c = sh.querySelector('[data-u-cancel]'); if (c) c.onclick = U.close;
    const ok = sh.querySelector('[data-u-ok]'); if (ok) ok.onclick = async () => { ok.disabled = true; err(''); try { if (await o.onOk($, err)) U.close(); } finally { ok.disabled = false; } };
    const d = sh.querySelector('[data-u-del]'); if (d) U.sure(d, '정말요? 한 번 더', async () => { if (await o.danger.fn($, err)) U.close(); });
    const f = sh.querySelector('input:not([type=checkbox]),select,textarea'); if (f) f.focus();
    return { $, err, sheet: sh };
  };
  U.close = () => { const m = document.querySelector('.u-modal'); if (m) m.classList.remove('on'); };
  U.field = (label, inner, wide) => '<label class="f' + (wide ? ' wide' : '') + '"><span>' + label + '</span>' + inner + '</label>';

  /* RPC — U.rpc(sb, 'fn', {…}) → data 또는 null(실패면 err/토스트로 알림). DB 함수가 {오류:'…'} 를 돌려주는 우리 관례를 그대로 처리 */
  U.rpc = async (sb, fn, args, err) => { let data = null, error = null;
    try { ({ data, error } = await sb.rpc(fn, args || {})); } catch (e) { error = e; }
    if (error || data == null || (data && data.오류)) { const m = (data && data.오류) || (error && error.message) || '실패했어요'; (err || U.toast)(m); return null; }
    return data; };

  window.U = U;
})();

<script>
/* ═══ _app/exam_read.js ═══ */
/* 시험 점수를 해석하는 규칙 — 대시보드(app.js)와 학생 포털(portal)이 같이 쓴다.

 * ⚠ **단일 진실원은 `01_운영/시험DB/시험메타조회.py`** 다. 이 파일은 그 이식본이고,

 *   0815 에 app.js 안에 있던 것을 여기로 빼냈다 — 포털이 같은 규칙을 써야 하는데
 *   복사해 가면 그날부터 학원 화면과 학부모 화면이 서로 다른 등급을 말한다.

 * ⚠ **원점수 단독 해석 금지.** 그래서 이 파일이 주는 것은 늘 (등급 · 컷 · 난이도) 묶음이다.
 *   점수만 크게 띄우고 싶어질 때 이 주석을 다시 읽어라 — 컷 없이 낙폭을 판단하면 사고가 난다.

/* '고림고등학교'·'고림고'·'고림' 을 한 학교로 본다 */
const 학교키 = s => (String(s || '').trim().replace(/(고등학교|고)$/, '') || String(s || '').trim());
const mi = (m, k) => { const v = m ? m[k] : null; return v === '' || v == null ? null : parseInt(v, 10); };

/* 성적 한 줄(r)에 맞는 시험메타를 찾는다. 학교·학년·시행년·학기·시험구분이 다 맞아야 한다 */
function metaFindIn(metas, r) {
  const y = parseInt(r['시행년'], 10), gr = parseInt(r['학년'], 10), sm = parseInt(r['학기'], 10);
  return (metas || []).find(m => 학교키(m['학교']) === 학교키(r['학교'])
    && mi(m, '학년') === gr && mi(m, '시행년') === y && mi(m, '학기') === sm
    && (m['시험구분'] || '') === (r['시험구분'] || '')) || null;
}

function metaGrade(score, m) {          // 시험메타조회.grade 이식
  if (!m || score == null) return null;
  const s = Number(score);
  if (!isFinite(s)) return null;
  for (const g of [1, 2, 3, 4]) { const c = mi(m, '등급컷' + g); if (c != null && s >= c) return g; }
  return mi(m, '등급컷5하한') != null ? 5 : null;
}
function metaRead(score, m) {           // 시험메타조회.해석 이식
  if (!m) return '시험 정보 없음 — 원점수만으로는 판단 불가';
  const g = metaGrade(score, m), nan = m['전체난이도'] || '?', c1 = mi(m, '등급컷1');
  if (g == null) return `등급컷 미확보 (난이도 ${nan})`;
  return `${g}등급권 (${c1 != null ? '1등급컷 ' + c1 : '컷 미확보'} · 난이도 ${nan} · 예상)`;
}

  mock: ['exam', 'mock'], score: ['exam', 'mock'], sched: ['exam', 'sched'], exam: null,

const ARCHIVED = ['today', 'clinic', 'loop', 'loopstu', 'weak', 'cliniclog', 'exammeta', 'typemap', 'video', 'tower', 'apply', 'haebu', 'cs-load', 'cs-clinic'];   // 1119 삭제
function translate() {
  const h = decodeURIComponent(location.hash.slice(1)), [a, ...rest] = h.split('/'), b = rest.join('/');
  const to = (m, s) => history.replaceState(null, '', '#' + m + (s ? '/' + s : ''));
  if (a === 'student') return to('stu', b);
  if (a === 'gichul') return b ? to('stu', b) : to('exam', 'mock');
  if (a === 'cs-console' && b) { CTX.ban = b; saveCtx(); return to('class', 'input'); }
  if (a === 'cs-ct' && b) { NEXT = 'cs-ct/' + b; return to('admin', 'ct'); }
  if (OLDMAP[a]) return to(...OLDMAP[a]);
  if (ARCHIVED.includes(a)) { to('home'); setTimeout(() => toast('보관함 화면은 1119에 지웠어요 — 데이터는 DB에 그대로 있어요'), 300); }
}
function go(m, s) { const h = '#' + m + (s ? '/' + s : ''); if (location.hash !== h) location.hash = h; else route(); }

function route() {
  translate();
  const [m, s] = decodeURIComponent(location.hash.slice(1)).split('/');
  const M = mine().find(x => x.k === m) || mine()[0];
  let sub = M.subs ? (M.subs.find(x => x[0] === s) || M.subs[0]) : null;
  CUR = { m: M.k, s: sub ? sub[0] : (s || '') };
  $('menu').innerHTML = mine().map(x => `<button data-m="${x.k}" class="${x.k === M.k ? 'on' : ''}">${E(x.t)}</button>`).join('');
  $('menu').querySelectorAll('[data-m]').forEach(b => b.onclick = () => go(b.dataset.m));
  $('subbar').hidden = !M.subs;
  if (M.subs) {
    $('subs').innerHTML = M.subs.map(([k, t]) => `<button data-s="${k}" class="${k === CUR.s ? 'on' : ''}">${E(t)}</button>`).join('')
      + (M.ctx ? '<span class="ctx" id="ctx"></span>' : '');
    $('subs').querySelectorAll('[data-s]').forEach(b => b.onclick = () => go(M.k, b.dataset.s));
  }
  const tgt = sub ? sub[2] : M.view;
  document.title = (sub ? sub[1] : M.t) + ' · 대시보드';
  if (tgt.ext) { window.open(tgt.ext, '_blank', 'noopener'); return; }
  if (M.ctx) drawCtx();
  const native = !!tgt.n;
  $('view').hidden = !native; $('frames').hidden = native;

  else {
    if (M.k === 'stu' && CUR.s) NEXT = '/dashboard/stu/?sid=' + encodeURIComponent(CUR.s);
    showFrame(tgt);
  }
}
const alive = id => id === RENDER_ID;   // 화면을 그리는 동안 다른 화면으로 옮겼으면 그리지 않는다

/* 옛 화면은 iframe 하나를 계속 쓰고 주소(#)만 바꾼다. 페이지는 페이지마다 하나 */
function showFrame(t) {
  const old = t.old ? (typeof t.old === 'function' ? t.old() : t.old) : null;
  const key = old != null ? 'old' : t.page, nx = NEXT; NEXT = null;
  const hash = old != null ? (nx || old) : null, src = old != null ? LEGACY + hash : (nx || t.page);
  let f = [...$('frames').children].find(x => x.dataset.key === key);
  if (!f) { f = document.createElement('iframe'); f.dataset.key = key; f.title = key; f.src = src; $('frames').appendChild(f); }
  else if (old != null) { try { f.contentWindow.location.hash = hash; } catch (e) { f.src = src; } }
  else if (nx) f.src = nx;
  [...$('frames').children].forEach(x => x.classList.toggle('on', x === f));
  if (key === 'old' && CUR.m === 'class' && CUR.s === 'input') syncConsoleDay(f);
}

/* 수업 메뉴 위 '반 · 날짜' — 한 번 고르면 [수업 입력]·[결과]·[과제]·[CORE] 가 같이 따른다 */
let CTX = (() => { try { return JSON.parse(localStorage.getItem('v2ctx') || '{}'); } catch (e) { return {}; } })();
const saveCtx = () => { try { localStorage.setItem('v2ctx', JSON.stringify(CTX)); } catch (e) {} };
let BANS = [], DAYS = {};
async function initCtx() {
  const [s] = await Promise.all([students(), timetable()]);
  const td = ttToday().map(r => r.반);
  BANS = [...new Set(s.map(x => x.ban))].sort((a, b) => (td.includes(b) - td.includes(a)) || a.localeCompare(b));
  if (!CTX.ban || !BANS.includes(CTX.ban)) CTX.ban = td[0] || BANS[0];
  if (!CTX.day || CTX.dayAuto !== today()) { CTX.day = today(); CTX.dayAuto = today(); }   // 날이 바뀌면 오늘로
}
async function daysOf(ban) {
  if (DAYS[ban]) return DAYS[ban];
  const d = await soft(sb.from('class_log').select('날짜').eq('반', ban).order('날짜', { ascending: false }).limit(40));
  const set = new Set((d || []).map(r => r.날짜)); set.add(today());
  return (DAYS[ban] = [...set].filter(x => x <= today()).sort().reverse());
}
async function drawCtx() {
  const el = $('ctx'); if (!el) return;
  const td = ttToday(), days = await daysOf(CTX.ban);
  if (!days.includes(CTX.day)) CTX.day = days[0];
  el.innerHTML = BANS.map(b => { const t = td.find(r => r.반 === b);
    return `<button class="cb${b === CTX.ban ? ' on' : ''}${t ? ' today' : ''}" data-ban="${E(b)}" title="${t ? '오늘 ' + t.시작 + '~' + t.끝 + '시' : ''}">${E(b)}${t ? ` <small>${E(t.시작)}시</small>` : ''}</button>`; }).join('')
    + `<select id="ctxday" aria-label="날짜">${days.map(d => `<option value="${d}"${d === CTX.day ? ' selected' : ''}>${mdw(d)}${d === today() ? ' 오늘' : ''}</option>`).join('')}</select>`;
  el.querySelectorAll('[data-ban]').forEach(b => b.onclick = () => { CTX.ban = b.dataset.ban; CTX.day = today(); saveCtx(); route(); });
  $('ctxday').onchange = e => { CTX.day = e.target.value; saveCtx(); route(); };
}
/* 수업 입력(옛 콘솔)에 고른 날짜를 넣어 준다 — 같은 출처라 콘솔 함수를 바로 부른다 */
function syncConsoleDay(f) {
  const tryIt = (n) => { try {
    const w = f.contentWindow, d = w.document, v = d.getElementById('v_date'), on = d.querySelector('#classbtns button.on');
    if (!v || !on) { if (n < 40) setTimeout(() => tryIt(n + 1), 250); return; }   // 콘솔의 CLS 는 let 이라 window 에 없다 → 눌린 반 버튼으로 본다
    if (on.dataset.cls !== CTX.ban && w.selectClass) { w.selectClass(CTX.ban); setTimeout(() => tryIt(n + 1), 400); return; }
    if (v.value !== CTX.day) { v.value = CTX.day; if (w.changeViewDay) w.changeViewDay(); }
  } catch (e) {} };
  tryIt(0);
}

const clinicTxt = h => {
  if (!h) return dash;
  if (h.완료 || h.상태 === '완료') return tag('ok', '보완 완료' + (h.보완후 != null ? ` ${h.이행률}→${h.보완후}%` : ''));
  if (h.상태 === '면제' || h.상태 === '닫힘') return tag('', h.상태);
  if (h.예약 && new Date(h.예약) < Date.now() - 2 * 3600e3) return tag('bad', '예약 지남 · 미완료', U.fmt(h.예약));
  if (h.예약) return tag('warn', (h.결석 ? '결석 보강 ' : '보완 ') + U.fmt(h.예약));
  return tag('bad', (h.결석 ? '결석 보강' : '보완') + ' 예약 안 함');
};

   옛 화면은 표 아래로 상세가 펼쳐졌다 → 줄을 누르면 넓은 팝업(왼쪽 사진·풀이, 오른쪽 채점). DB = staff_sw_queue / staff_sw_photos / staff_sw_decide(schema_v75). */
const SW_ST = [['확인대기', '확인 대기'], ['제출', '채점 전'], ['채점중', 'AI 채점 중'], ['재촬영', '재촬영 요청'], ['공개', '공개됨'], ['전체', '전체']];
const SW_CODES = [['형식', '요구한 형식'], ['검토', '조건 확인'], ['생략', '과정 생략'], ['방향', '풀이 방향'], ['계산', '계산'], ['미완', '답 미완성']];
let SW = { st: '확인대기', rows: [], photos: {} };
const swN = v => { const n = Number(v); return Number.isFinite(n) ? Math.round(n * 10) / 10 : null; };
const shortName = n => { n = String(n || '').trim(); if (!n) return ''; if (/T$/.test(n)) return n; return (n.length >= 3 ? n.slice(1) : n) + 'T'; };   // 학생에게 보이는 이름 = 성 빼고 T

let KX = null;   // KaTeX — 문항·풀이에 수식이 있어 처음 열 때 한 번만 불러온다
function katex(el) {
  const run = () => { try { renderMathInElement(el, { delimiters: [{ left: '$', right: '$', display: false }], throwOnError: false }); } catch (e) {} };
  if (window.renderMathInElement) return run();
  if (!KX) KX = new Promise(res => {
    const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = 'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css'; document.head.appendChild(l);
    const a = document.createElement('script'); a.src = 'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js';
    a.onload = () => { const b = document.createElement('script'); b.src = 'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js'; b.onload = res; document.head.appendChild(b); };
    document.head.appendChild(a);
  });
  KX.then(run);
}

async function viewSw(id) {
  const { data, error } = await sb.rpc('staff_sw_queue', { p_state: SW.st, p_days: ['공개', '전체'].includes(SW.st) ? 60 : 30 });
  if (!alive(id)) return;
  SW.rows = data || [];
  let h = head('서술형 채점', 'AI가 먼저 채점 → 사진과 대조해 고치고 [공개] · 학생에겐 공개한 판정만 보여요', '<button class="u-btn sm ghost" id="swre">새로고침</button>');
  h += `<div class="tabs2">${SW_ST.map(([k, t]) => `<button data-swst="${k}" class="${SW.st === k ? 'on' : ''}">${t}</button>`).join('')}</div>`;
  if (error) h += `<div class="u-card u-err">불러오지 못함 — ${E(error.message)}</div>`;
  else if (!SW.rows.length) h += `<div class="u-card u-empty">${SW.st === '확인대기' ? '확인할 제출이 없어요 👍' : '해당하는 제출이 없어요'}</div>`;
  else h += table('sw', [
    { h: '제출', v: r => r.제출시각, f: r => `<span class="mini">${E(U.fmt(r.제출시각))}</span>` },
    { h: '학생', l: 1, v: r => r.학생 || r.학생ID, f: r => `<b>${E(r.학생 || r.학생ID)}</b>` },
    { h: '반', v: r => r.반 },
    { h: '문항', l: 1, v: r => r.세트 + r.문항.라벨, f: r => `${E(r.세트)} · <b>${E(r.문항.라벨)}</b>${r.회차 > 1 ? ' ' + tag('', '고쳐 쓰기') : ''}` },
    { h: 'AI', num: 1, v: r => r.ai ? swN(r.ai.총점) : null, f: r => { const a = r.ai || {}, flag = r.ai && (a.재촬영권고 || a.사진 === '흐림' || (a.신뢰 != null && a.신뢰 < 0.6));
      return (r.ai ? `${swN(a.총점)}/${swN(r.문항.배점)}` : dash) + (flag ? ' ' + tag('warn', '확인 필요', 'AI가 사진 상태·확신이 낮다고 표시') : ''); } },
    { h: '최종', num: 1, v: r => r.최종 ? swN(r.최종.총점) : null, f: r => r.최종 ? `<b>${swN(r.최종.총점)}/${swN(r.문항.배점)}</b>` : dash },
    { h: '상태', v: r => r.상태, f: r => tag(r.상태 === '확인대기' ? 'warn' : r.상태 === '공개' ? 'ok' : r.상태 === '재촬영' ? 'bad' : '', r.상태) },
    { h: '확인', l: 1, v: r => r.확인자, f: r => `<span class="mini">${E(r.확인자 || '')}${r.학생봄 ? ' · 학생 봄' : ''}</span>` },
  ], SW.rows, { rowAttr: r => `class="click" data-swo="${E(r.sid)}"`, redraw: () => viewSw(RENDER_ID) });
  $('view').innerHTML = h;
  $('swre').onclick = () => viewSw(RENDER_ID);
  $('view').querySelectorAll('[data-swst]').forEach(b => b.onclick = () => { SW.st = b.dataset.swst; viewSw(RENDER_ID); });
  $('view').querySelectorAll('[data-swo]').forEach(tr => tr.onclick = () => swOpen(SW.rows.find(r => r.sid === tr.dataset.swo)));
}
async function swOpen(r) {
  const src = r.최종 || r.ai || {}, it = r.문항, ai = r.ai || {};
  const e = { 항목: (it.루브릭 || []).map(k => { const a = (src.항목 || []).find(x => x.key === k.key) || {}; return { key: k.key, 소문항: k.소문항 || null, 항목: k.항목, 배점: k.배점, 기준: k.기준 || '', 점수: a.점수 != null ? a.점수 : null, 근거: a.근거 || '' }; }),
    코드: (src.코드 || []).slice(), 피드백: src.피드백 || '' };
  const tot = () => e.항목.reduce((s, x) => s + (Number(x.점수) || 0), 0);
  const M = modal({ title: `${r.학생 || r.학생ID} · ${r.세트} ${it.라벨}`, wide: true, body: `<div class="swd"><div class="swl"><div id="swph" class="swph"><div class="u-empty">사진 불러오는 중…</div></div>`
      + (r.메모 ? `<div class="u-hint">학생 한 줄 — ${E(r.메모)}</div>` : '')
      + (ai.전사 ? `<details><summary class="mini">AI가 읽은 풀이</summary><div class="kx">${E(ai.전사)}</div></details>` : '')
      + `<details><summary class="mini">문항 · 모범답안</summary><div class="kx">${it.본문 || ''}${(it.소문항 || []).map(s => `<div><b>${E(s.라벨)}.</b> ${s.본문} (${swN(s.배점)}점)</div>`).join('')}</div><div class="kx">${it.모범 || ''}</div></details></div>`
      + `<div class="swr">${r.ai ? `<div class="mini" style="margin-bottom:6px">AI ${swN(ai.총점)}점${ai.신뢰 != null ? ' · 확신 ' + Math.round(ai.신뢰 * 100) + '%' : ''}${ai.사진 && ai.사진 !== 'ok' ? ' · 사진 ' + E(ai.사진) : ''}${ai.메모 ? ' · ' + E(ai.메모) : ''}</div>` : ''}`
      + e.항목.map((x, j) => `<div class="swi"><div><b>${x.소문항 ? E(x.소문항) + ' ' : ''}${E(x.항목)}</b><div class="mini">${E(x.기준)}</div></div>`
        + `<div class="sws"><input type="number" min="0" max="${x.배점}" step="0.5" value="${x.점수 ?? ''}" data-sc="${j}"> / ${swN(x.배점)}</div>`
        + `<input type="text" class="swg" value="${E(x.근거)}" placeholder="감점 이유 (학생에게 보임)" data-why="${j}"></div>`).join('')
      + `<div class="swt">합계 <b id="swtot">${swN(tot())}</b> / ${swN(it.배점)}</div>`
      + `<div class="swc">${SW_CODES.map(([k, l]) => `<button class="u-btn sm${e.코드.includes(k) ? ' pri' : ''}" data-cd="${k}">${l}</button>`).join('')}</div>`
      + `<textarea id="swfb" rows="2" placeholder="피드백 한 줄 (학생에게 보임) — 무엇을 고치면 만점인지">${E(e.피드백)}</textarea>`
      + (['확인대기', '제출', '채점중'].includes(r.상태) ? `<div class="swre"><input type="text" id="swwhy" placeholder="재촬영 사유 (비우면 기본 문구)"><button class="u-btn sm" id="swretake">다시 찍어 주세요</button></div>` : '')
      + `</div></div>`, ok: r.상태 === '공개' ? '고쳐서 다시 공개' : '공개',
    onOk: async ($, err) => {
      if (e.항목.some(x => x.점수 == null || x.점수 === '')) { err('점수가 빈 항목이 있어요'); return false; }
      const who = shortName(MYNAME);
      const result = { 항목: e.항목.map(x => ({ key: x.key, 소문항: x.소문항, 항목: x.항목, 배점: x.배점, 점수: Number(x.점수), 근거: String(x.근거 || '').trim() })),
        총점: tot(), 배점: Number(it.배점), 코드: e.코드, 피드백: String(e.피드백 || '').trim(), 확인자: who, AI총점: r.ai ? r.ai.총점 : null };
      const { data, error } = await sb.rpc('staff_sw_decide', { sid: r.sid, p_action: '공개', p_result: result, p_who: who });
      if (error || !data || data.오류) { err((data && data.오류) || (error && error.message) || '실패'); return false; }
      toast('공개했어요'); viewSw(RENDER_ID); return true;
    } });
  const sh = M.sheet;
  sh.querySelectorAll('[data-sc]').forEach(x => x.oninput = () => { const it2 = e.항목[+x.dataset.sc]; it2.점수 = x.value === '' ? null : Math.max(0, Math.min(Number(it2.배점), Number(x.value))); $('swtot').textContent = swN(tot()); });
  sh.querySelectorAll('[data-why]').forEach(x => x.oninput = () => { e.항목[+x.dataset.why].근거 = x.value; });
  sh.querySelectorAll('[data-cd]').forEach(b => b.onclick = () => { const k = b.dataset.cd, i = e.코드.indexOf(k); if (i < 0) e.코드.push(k); else e.코드.splice(i, 1); b.classList.toggle('pri', i < 0); });
  sh.querySelector('#swfb').oninput = ev => { e.피드백 = ev.target.value; };
  const rt = sh.querySelector('#swretake');
  if (rt) sure(rt, '재촬영 요청? 한 번 더', async () => {
    const { data, error } = await sb.rpc('staff_sw_decide', { sid: r.sid, p_action: '재촬영', p_who: shortName(MYNAME), p_reason: (sh.querySelector('#swwhy') || {}).value || null });
    if (error || !data || data.오류) { M.err((data && data.오류) || (error && error.message) || '실패'); return; }
    U.close(); toast('재촬영을 요청했어요'); viewSw(RENDER_ID);
  });
  sh.querySelectorAll('.kx').forEach(katex);
  if (!SW.photos[r.sid]) { const d = await soft(sb.rpc('staff_sw_photos', { sid: r.sid })); SW.photos[r.sid] = (d || []).map(x => x.url); }
  const ph = sh.querySelector('#swph');
  if (ph) ph.innerHTML = SW.photos[r.sid].length ? SW.photos[r.sid].map(u => `<a href="${u}" target="_blank" rel="noopener"><img src="${u}" alt="풀이 사진"></a>`).join('') : '<div class="u-empty">사진 없음</div>';
}

/* ── ⚙ 관리 › 조교 관리 · 포털 ── (P17 1119)
   [조교 관리] = 옛 콘솔 '조교 관리' — 이메일 넣으면 명단(staff_list), 본인이 로그인하는 순간 권한. 추가는 버튼 → 팝업.
   [포털] = 옛 '학생 포털 링크' + '방문 기록'을 한 표로: 학생·학부모 링크, 마지막 열람, 최근 14일 방문(학생/학부모).
     방문 기록은 유강 계정만 읽힌다(page_visit_owner_read) — 다른 계정이면 방문 칸이 빈다. 이 화면을 열면 이 기기는 방문 집계에서 빠진다. */
async function viewStaff(id) {
  const { data, error } = await sb.rpc('staff_overview');
  if (!alive(id)) return;
  const rows = data || [];
  let h = head('조교 관리', '추가하면 그 사람은 바로 로그인 화면에서 이메일 → 6자리 코드로 들어와요', '<button class="u-btn pri sm" id="stadd">＋ 조교 추가</button>');
  if (error) h += `<div class="u-card u-err">명단을 못 읽었어요 — ${E(error.message)}</div>`;
  h += table('staff', [
    { h: '이름', l: 1, v: r => r.이름 || r.email, f: r => `<b>${E(r.이름 || '')}</b>${r.본인 ? ' ' + tag('accent', '나') : ''}<div class="mini">${E(r.email)}</div>` },
    { h: '역할', v: r => r.role, f: r => tag(r.role === 'admin' ? 'accent' : '', r.role === 'admin' ? '관리자' : '조교') },
    { h: '상태', v: r => r.계정 ? 1 : 0, f: r => r.계정 ? tag('ok', '사용 중') : tag('warn', '로그인 대기', '본인이 한 번 로그인하면 붙어요') },
    { h: '마지막 로그인', v: r => r.마지막로그인, f: r => `<span class="mini">${r.마지막로그인 ? E(U.fmt(r.마지막로그인)) : ''}</span>` },
    { h: '', ns: 1, v: () => 0, f: r => r.본인 ? '' : `<button class="u-btn sm danger" data-strm="${E(r.email)}">빼기</button>` },
  ], rows, { redraw: () => viewStaff(RENDER_ID) });
  $('view').innerHTML = h;
  $('stadd').onclick = () => modal({ title: '조교 추가', ok: '추가',
    body: '<div class="u-form">' + U.field('이메일', '<input type="email" id="se" placeholder="assistant@gmail.com">', 1) + U.field('이름 (성 빼고)', '<input type="text" id="sn" placeholder="동현">')
      + U.field('역할', '<select id="sr"><option value="staff">조교</option><option value="admin">관리자</option></select>') + '</div>',
    hint: '학생에게는 이름 뒤에 T 를 붙여 보여요 (동현T)',
    onOk: async ($, err) => { const email = $('se').value.trim().toLowerCase(); if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { err('이메일 형식이 아니에요'); return false; }
      const { data, error } = await sb.rpc('staff_set', { p_email: email, p_name: $('sn').value.trim() || null, p_role: $('sr').value });
      if (error) { err(error.message); return false; }
      toast(data && data.attached ? '등록 — 지금부터 쓸 수 있어요' : '등록 — 본인이 로그인하면 권한이 붙어요'); viewStaff(RENDER_ID); return true; } });
  $('view').querySelectorAll('[data-strm]').forEach(b => sure(b, '정말 뺄까요?', async () => {
    const { error } = await sb.rpc('staff_remove', { p_email: b.dataset.strm }); if (error) { toast('실패: ' + error.message); return; }
    toast('뺐어요'); viewStaff(RENDER_ID); }));
}

async function viewPortal(id) {
  try { localStorage.setItem('mt_skip', '1'); localStorage.setItem('skipgc', 't'); } catch (e) {}
  const since = new Date(Date.now() - 14 * 864e5).toISOString();
  const [stu, tk, vs] = await Promise.all([students(), soft(sb.from('portal_token').select('*').limit(2000)),
    all(() => sb.from('page_visit_v').select('시각,"학생ID",보는사람').gte('시각', since).order('시각', { ascending: false }))]);
  if (!alive(id)) return;
  const live = t => t && !t.회수 && (!t.만료일 || t.만료일 >= today());
  const url = t => 'https://ukan8.github.io/dashboard/me/?t=' + encodeURIComponent(t.토큰);
  const isPar = w => w === '학부모', isStu = w => String(w || '').startsWith('학생'), canVisit = vs.length > 0;
  const rows = stu.map(s => {
    const ts = (tk || []).filter(t => t.학생ID === s.학생ID && live(t)), st = ts.find(t => t.대상 !== '학부모'), pa = ts.find(t => t.대상 === '학부모');
    const v = vs.filter(x => x.학생ID === s.학생ID);
    return { s, st, pa, seen: [st, pa].map(t => t && t.마지막열람).filter(Boolean).sort().pop() || null, views: (st ? st.열람수 || 0 : 0) + (pa ? pa.열람수 || 0 : 0),
      vS: v.filter(x => isStu(x.보는사람)).length, vP: v.filter(x => isPar(x.보는사람)).length };
  });
  const quiet = rows.filter(r => !r.seen || ageH(r.seen) > 24 * 14);
  let h = head('포털', '학생·학부모 포털 링크와 열람 · 이 화면을 연 기기는 방문 집계에서 빠져요');
  h += '<div class="u-kpis">' + kpi(rows.filter(r => r.st).length + '/' + rows.length, '학생 링크 있음') + kpi(rows.filter(r => r.pa).length, '학부모 링크')
    + kpi(quiet.length, '2주 넘게 안 연 학생', quiet.length ? 'warn' : '', quiet.map(r => r.s.이름).join(', '))
    + (canVisit ? kpi(vs.length, '최근 14일 방문') : '') + '</div>';
  const cell = t => t ? `<a class="u-btn sm" href="${E(url(t))}" target="_blank" rel="noopener">열기 ↗</a> <button class="u-btn sm ghost" data-cp="${E(url(t))}">복사</button>` : '<span class="u-faint">없음</span>';
  h += table('portal', [
    { h: '학생', l: 1, v: r => r.s.이름, f: r => stuLink(r.s.학생ID, r.s.이름) },
    { h: '반', v: r => r.s.ban },
    { h: '학생 링크', ns: 1, v: () => 0, f: r => cell(r.st) },
    { h: '학부모 링크', ns: 1, v: () => 0, f: r => cell(r.pa) },
    { h: '마지막 열람', v: r => r.seen, f: r => r.seen ? `<span class="mini ${ageH(r.seen) > 24 * 14 ? 'u-bad' : ''}">${E(U.fmt(r.seen))}</span>` : tag('warn', '안 열어 봄') },
    { h: '열람 수', num: 1, v: r => r.views },
    ...(canVisit ? [{ h: '14일 학생', num: 1, v: r => r.vS }, { h: '14일 학부모', num: 1, v: r => r.vP }] : []),
  ], rows, { redraw: () => viewPortal(RENDER_ID) });
  $('view').innerHTML = h;
  $('view').querySelectorAll('[data-cp]').forEach(b => b.onclick = async () => { try { await navigator.clipboard.writeText(b.dataset.cp); toast('링크를 복사했어요'); } catch (e) { prompt('링크', b.dataset.cp); } });
}

/* ── 시작 ── */
async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { login(); return; }
  ME = session.user.email || '';
  $('out').hidden = false; $('out').onclick = async () => { await sb.auth.signOut({ scope: 'local' }); location.reload(); };   // local = 이 브라우저만
  const pr = await soft(sb.from('profiles').select('role,이름').eq('user_id', session.user.id).limit(1));
  ROLE = (pr && pr[0] && pr[0].role) || 'staff'; MYNAME = (pr && pr[0] && pr[0].이름) || ME.split('@')[0];
  $('who').textContent = ROLE === 'admin' ? '원장' : '조교 ' + MYNAME;
  const sk = seasonKey();
  $('sea').innerHTML = [['26-2중간', '2학기 중간'], ['26-2기말', '2학기 기말'], ['*', '전체']].map(([k, t]) => `<option value="${k}"${k === sk ? ' selected' : ''}>${t}</option>`).join('');
  $('sea').onchange = e => { try { localStorage.setItem('season', e.target.value); } catch (er) {} location.reload(); };
  await initCtx();
  window.addEventListener('hashchange', route);
  route();
}
boot();

</script></body></html>
