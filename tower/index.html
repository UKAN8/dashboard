<style>
:root{color-scheme:dark;
 --bg:#0a0a0f; --card:rgba(255,255,255,.03); --bd:rgba(255,255,255,.08);
 --tx:#f5f5fa; --tx2:#b8b8c5; --dim:#8a8a98; --acc:#f5a0a0; --ok:#c8f0da; --okb:#7ee0a3;
 --no:#ff8fa8; --gold:#e8c56a; --mid:#f0d58a;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{max-width:100%;overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--tx);
 font:15px/1.6 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;
 padding:18px clamp(12px,4vw,28px) calc(40px + env(safe-area-inset-bottom))}
main{max-width:620px;margin:0 auto}
button{font:inherit;cursor:pointer}
.brand{font-weight:800;color:var(--acc);font-size:15px;letter-spacing:.02em}
.who{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin:6px 0 2px}
.who b{font-size:23px}
.who .ban{font-size:12px;color:var(--acc);background:rgba(245,160,160,.12);padding:2px 9px;border-radius:9px}
.title{font-size:13px;color:var(--tx2);margin-bottom:14px}
.title b{color:var(--gold)}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 18px}
.sum div{background:var(--card);border:1px solid var(--bd);border-radius:13px;padding:10px 8px;text-align:center}
.sum b{display:block;font-size:20px;line-height:1.2}
.sum span{font-size:11px;color:var(--dim)}
.guide{color:var(--dim);font-size:12.5px;margin:-8px 0 16px;line-height:1.7}
.guide b{color:var(--tx2)}
.unit{font-size:11px;letter-spacing:.16em;color:var(--dim);margin:16px 2px 6px}
.fl{display:flex;align-items:center;gap:11px;width:100%;text-align:left;color:var(--tx);
 background:var(--card);border:1px solid var(--bd);border-radius:13px;padding:11px 13px;margin-bottom:7px}
.fl .no{flex:none;width:40px;font-weight:800;color:var(--acc);font-size:15px}
.fl .nm{flex:1;min-width:0;overflow-wrap:anywhere;font-size:14.5px}
.fl .nm small{display:block;color:var(--dim);font-size:11.5px}
.fl .st{flex:none;font-size:13px;color:var(--gold);letter-spacing:.05em}
.fl .st.new{color:var(--dim);font-size:12px;letter-spacing:0}
.fl.clear{border-color:rgba(232,197,106,.35)}
.fl.nextf{border-color:rgba(245,160,160,.55);background:rgba(245,160,160,.07)}
@media (hover:hover) and (pointer:fine){ .fl:hover{border-color:rgba(245,160,160,.4)} }
.foot{color:var(--dim);font-size:11.5px;line-height:1.7;margin-top:26px;border-top:1px solid var(--bd);padding-top:14px}
.msg{color:var(--dim);font-size:14px;padding:40px 2px}
.msg b{display:block;color:var(--tx);font-size:16px;margin-bottom:6px}
/* 풀이 화면 */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.back{background:none;border:1px solid var(--bd);color:var(--tx2);border-radius:10px;padding:6px 12px;font-size:13px}
.fname{font-size:13px;color:var(--tx2);text-align:right;min-width:0;overflow-wrap:anywhere}
.fname b{color:var(--acc)}
.dots{display:flex;gap:5px;margin:6px 0 16px;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.12)}
.dots i.o{background:var(--okb)} .dots i.x{background:var(--no)} .dots i.cur{outline:2px solid var(--acc);outline-offset:1px}
.qcard{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px 16px;margin-bottom:14px}
.qcard .kind{font-size:11px;letter-spacing:.14em;color:var(--acc);margin-bottom:8px}
.qcard .q{font-size:17px;line-height:1.75;font-weight:600;overflow-wrap:anywhere;word-break:keep-all}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.ox button{font-size:30px;font-weight:800;padding:14px 0;border-radius:14px;border:1px solid var(--bd);
 background:rgba(255,255,255,.035);color:var(--tx2)}
.ch{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.ch button{text-align:left;font-size:15px;padding:12px 14px;border-radius:12px;border:1px solid var(--bd);
 background:rgba(255,255,255,.035);color:var(--tx2);overflow-wrap:anywhere}
.ox button.on,.ch button.on{background:rgba(245,160,160,.16);border-color:rgba(245,160,160,.55);color:#ffe9e9}
.ox button.right,.ch button.right{background:rgba(126,224,163,.14);border-color:rgba(126,224,163,.55);color:var(--ok)}
.ox button.wrong,.ch button.wrong{background:rgba(255,143,168,.13);border-color:rgba(255,143,168,.55);color:#ffd0da}
.ox button[disabled],.ch button[disabled]{cursor:default}
.conf{display:none}
.conf.show{display:block}
.conf p{margin:4px 2px 8px;color:var(--tx2);font-size:13px}
.conf .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.conf button{padding:13px 0;border-radius:12px;font-weight:800;font-size:15px;border:none}
.conf .sure{background:var(--acc);color:#1a0d12}
.conf .unsure{background:rgba(255,255,255,.08);color:var(--tx)}
.res{display:none;border-radius:14px;padding:14px 15px;margin-bottom:12px;border:1px solid var(--bd)}
.res.show{display:block}
.res.o{background:rgba(126,224,163,.07);border-color:rgba(126,224,163,.3)}
.res.x{background:rgba(255,143,168,.07);border-color:rgba(255,143,168,.3)}
.res .h{font-weight:800;font-size:16px;margin-bottom:4px}
.res.o .h{color:var(--ok)} .res.x .h{color:var(--no)}
.res .w{color:var(--tx);font-size:14.5px;line-height:1.7;overflow-wrap:anywhere;word-break:keep-all}
.cardbtn{margin-top:10px;background:none;border:1px solid rgba(232,197,106,.45);color:var(--gold);
 border-radius:10px;padding:7px 12px;font-size:13px;font-weight:700}
.cbox{background:rgba(232,197,106,.05);border:1px solid rgba(232,197,106,.28);border-radius:14px;padding:12px 14px;margin:10px 0 12px}
.cbox .ct{font-size:11px;letter-spacing:.14em;color:var(--gold);margin-bottom:8px}
.cbox .cl{display:flex;gap:9px;align-items:baseline;padding:6px 0;border-top:1px solid var(--bd)}
.cbox .cl:first-of-type{border-top:none}
.cbox .cl em{flex:none;font-style:normal;font-size:11px;font-weight:800;color:var(--gold);min-width:30px}
.cbox .cl em.ju{color:var(--no)}
.cbox .cl span{flex:1;min-width:0;font-size:14px;line-height:1.7;overflow-wrap:anywhere;word-break:keep-all}
.intro{padding:6px 0}
.intro h2{font-size:22px;margin:4px 0 2px}
.intro .sub{color:var(--tx2);font-size:13px;margin-bottom:14px}
.next{width:100%;padding:14px;border-radius:13px;border:none;background:var(--acc);color:#1a0d12;font-weight:800;font-size:15px;display:none}
.next.show{display:block}
/* 층 결과 */
.done{text-align:center;padding:26px 6px 10px}
.done .stars{font-size:40px;letter-spacing:.1em;color:var(--gold);line-height:1.2}
.done .stars .off{color:rgba(255,255,255,.14)}
.done b{display:block;font-size:20px;margin:10px 0 4px}
.done p{color:var(--tx2);font-size:14px;margin:0 0 6px}
.done .save{font-size:12px;color:var(--dim);margin-bottom:16px}
.done .save.bad{color:var(--no)}
.list{text-align:left;margin:10px 0 16px}
.list div{font-size:13.5px;padding:9px 12px;border:1px solid var(--bd);border-radius:11px;margin-bottom:6px;color:var(--tx2);overflow-wrap:anywhere}
.list div em{font-style:normal;font-size:11px;margin-right:6px;padding:1px 7px;border-radius:7px}
.list .lx em{background:rgba(255,143,168,.16);color:var(--no)}
.list .lu em{background:rgba(240,213,138,.14);color:var(--mid)}
.btns{display:flex;flex-direction:column;gap:9px}
.btns button{padding:13px;border-radius:13px;font-weight:800;font-size:15px;border:none}
.btns .p{background:var(--acc);color:#1a0d12}
.btns .s{background:rgba(255,255,255,.08);color:var(--tx)}
</style></head>

/* 개념의 탑 — 개념 점검 (0930)
 *
 * 주소: /tower/?t=<토큰>            포털(/me/) 학생 토큰 그대로

const BANK={"set": "g1m2_mid", "제목": "개념의 탑 · 고1 공통수학2", "범위": "평면좌표 ~ 집합의 연산", "floors": [{"no": 1, "unit": "평면좌표", "name": "두 점 사이의 거리", "card": [["정리", "수직선 위의 두 점 A(x₁), B(x₂) 사이의 거리는 AB = |x₂ − x₁|"], ["정리", "좌표평면 위의 두 점 A(x₁, y₁), B(x₂, y₂) 사이의 거리는 AB = √{(x₂ − x₁)² + (y₂ − y₁)²}"], ["특히", "원점 O(0, 0)과 점 A(x₁, y₁) 사이의 거리는 OA = √(x₁² + y₁²)"], ["방법", "두 점을 지나고 좌표축에 평행한 직선들로 직각삼각형을 만들고 피타고라스 정리를 쓴 것이다."], ["주의", "좌표의 차를 제곱하므로 빼는 순서는 상관없다. 같은 거리에 있는 점은 AP = BP 대신 AP² = BP²으로 식을 세운다."]], "n": 8}, {"no": 2, "unit": "평면좌표", "name": "선분의 내분점", "card": [["뜻", "선분 AB 위의 점 P에 대하여 AP : PB = m : n (m > 0, n > 0)일 때, 점 P는 선분 AB를 m : n으로 내분한다고 하며 점 P를 선분 AB의 내분점이라 한다."], ["정리", "수직선 위의 두 점 A(x₁), B(x₂)에 대하여 선분 AB를 m : n으로 내분하는 점의 좌표는 (mx₂ + nx₁)/(m + n)"], ["정리", "좌표평면 위의 두 점 A(x₁, y₁), B(x₂, y₂)에 대하여 선분 AB를 m : n으로 내분하는 점의 좌표는 ((mx₂ + nx₁)/(m + n), (my₂ + ny₁)/(m + n))"], ["특히", "m = n이면 선분 AB의 중점이고, 그 좌표는 ((x₁ + x₂)/2, (y₁ + y₂)/2)"], ["주의", "m은 B의 좌표에, n은 A의 좌표에 곱한다. m이 n보다 크면 내분점은 B에 더 가깝다."]], "n": 8}, {"no": 3, "unit": "평면좌표", "name": "무게중심과 좌표로 보는 도형", "card": [["뜻", "삼각형의 세 중선은 한 점에서 만나고, 이 점을 무게중심이라 한다. 무게중심은 각 중선을 꼭짓점으로부터 2 : 1로 내분한다."], ["정리", "세 점 A(x₁, y₁), B(x₂, y₂), C(x₃, y₃)을 꼭짓점으로 하는 삼각형 ABC의 무게중심 G의 좌표는 ((x₁ + x₂ + x₃)/3, (y₁ + y₂ + y₃)/3)"], ["방법", "변 BC의 중점 M을 구한 뒤, 선분 AM을 2 : 1로 내분하는 점을 구하면 위 공식이 나온다."], ["참고", "평행사변형의 두 대각선은 서로를 이등분한다. 따라서 두 대각선의 중점이 일치하고, 이것으로 네 번째 꼭짓점을 구한다."], ["참고", "좌표를 이용하여 도형의 성질을 증명할 때는 계산이 간단하도록 한 꼭짓점을 원점에, 한 변을 좌표축 위에 놓아도 된다."], ["주의", "세 변의 수직이등분선의 교점은 외심이다. 무게중심과 다르다."]], "n": 8}, {"no": 4, "unit": "직선의 방정식", "name": "직선의 방정식", "card": [["정리", "점 (x₁, y₁)을 지나고 기울기가 m인 직선의 방정식은 y − y₁ = m(x − x₁)"], ["정리", "서로 다른 두 점 (x₁, y₁), (x₂, y₂)를 지나는 직선의 방정식은 x₁ ≠ x₂일 때 y − y₁ = {(y₂ − y₁)/(x₂ − x₁)}(x − x₁), x₁ = x₂일 때 x = x₁"], ["특히", "x절편이 a, y절편이 b인 직선의 방정식은 x/a + y/b = 1 (단, a ≠ 0, b ≠ 0)"], ["정리", "x, y에 대한 일차방정식 ax + by + c = 0 (a ≠ 0 또는 b ≠ 0)은 좌표평면 위의 직선을 나타낸다. 모든 직선은 이 꼴로 나타낼 수 있다."], ["주의", "x축에 평행한 직선 y = k의 기울기는 0이다. y축에 평행한 직선 x = k는 기울기를 정할 수 없고, y = mx + n 꼴로 나타낼 수 없다."], ["참고", "직선 (ax + by + c) + k(a′x + b′y + c′) = 0은 k의 값에 관계없이 두 직선 ax + by + c = 0, a′x + b′y + c′ = 0의 교점을 지난다."]], "n": 10}, {"no": 5, "unit": "직선의 방정식", "name": "두 직선의 평행과 수직", "card": [["정리", "두 직선 y = mx + n, y = m′x + n′에서 두 직선이 서로 평행하면 m = m′, n ≠ n′이다. 거꾸로 m = m′, n ≠ n′이면 두 직선은 서로 평행하다."], ["특히", "m = m′이고 n = n′이면 두 직선은 일치한다."], ["정리", "두 직선 y = mx + n, y = m′x + n′에서 두 직선이 서로 수직이면 mm′ = −1이다. 거꾸로 mm′ = −1이면 두 직선은 서로 수직이다."], ["참고", "두 직선 ax + by + c = 0, a′x + b′y + c′ = 0이 서로 수직일 조건은 aa′ + bb′ = 0"], ["주의", "직선 x = k와 직선 y = k′은 서로 수직이지만, x = k는 기울기가 없으므로 mm′ = −1로 나타낼 수 없다."], ["참고", "선분 AB의 수직이등분선은 선분 AB의 중점을 지나고 직선 AB에 수직인 직선이다."]], "n": 10}, {"no": 6, "unit": "직선의 방정식", "name": "점과 직선 사이의 거리", "card": [["뜻", "점 P에서 직선 l에 내린 수선의 발을 H라 할 때, 선분 PH의 길이를 점 P와 직선 l 사이의 거리라 한다."], ["정리", "점 (x₁, y₁)과 직선 ax + by + c = 0 사이의 거리 d는 d = |ax₁ + by₁ + c| / √(a² + b²)"], ["특히", "원점과 직선 ax + by + c = 0 사이의 거리는 |c| / √(a² + b²)"], ["주의", "공식을 쓰기 전에 직선의 방정식을 ax + by + c = 0 꼴로 고친다. 분모에는 c가 들어가지 않는다."], ["참고", "평행한 두 직선 사이의 거리는 한 직선 위의 한 점과 다른 직선 사이의 거리와 같다."]], "n": 9}, {"no": 7, "unit": "원의 방정식", "name": "원의 방정식", "card": [["뜻", "평면 위의 한 점 C에서 일정한 거리에 있는 점 전체의 집합을 원이라 한다. 점 C를 원의 중심, 일정한 거리를 반지름의 길이라 한다."], ["정리", "중심이 (a, b)이고 반지름의 길이가 r인 원의 방정식은 (x − a)² + (y − b)² = r²"], ["특히", "중심이 원점이고 반지름의 길이가 r인 원의 방정식은 x² + y² = r²"], ["정리", "방정식 x² + y² + Ax + By + C = 0은 (x + A/2)² + (y + B/2)² = (A² + B² − 4C)/4로 변형할 수 있다. A² + B² − 4C > 0일 때 중심이 (−A/2, −B/2)인 원을 나타낸다."], ["참고", "x축에 접하는 원의 반지름의 길이는 |중심의 y좌표|, y축에 접하는 원의 반지름의 길이는 |중심의 x좌표|이다."], ["참고", "두 점 A, B를 지름의 양 끝점으로 하는 원의 중심은 선분 AB의 중점이고, 반지름의 길이는 AB/2이다."]], "n": 9}, {"no": 8, "unit": "원의 방정식", "name": "원과 직선의 위치 관계", "card": [["정리", "원과 직선의 방정식에서 한 문자를 없앤 이차방정식의 판별식을 D라 하면 D > 0이면 서로 다른 두 점에서 만나고, D = 0이면 한 점에서 만나고(접하고), D < 0이면 만나지 않는다."], ["정리", "원의 중심과 직선 사이의 거리를 d, 반지름의 길이를 r라 하면 d < r이면 서로 다른 두 점에서 만나고, d = r이면 한 점에서 만나고(접하고), d > r이면 만나지 않는다."], ["참고", "원의 중심에서 현에 내린 수선은 그 현을 이등분한다. 따라서 현의 길이는 2√(r² − d²)이다."], ["주의", "원과 직선은 많아야 두 점에서 만난다."]], "n": 9}, {"no": 9, "unit": "원의 방정식", "name": "원의 접선", "card": [["정리", "원의 접선은 접점을 지나는 반지름에 수직이다."], ["정리", "원 x² + y² = r²에 접하고 기울기가 m인 접선의 방정식은 y = mx ± r√(m² + 1)"], ["정리", "원 x² + y² = r² 위의 점 (x₁, y₁)에서의 접선의 방정식은 x₁x + y₁y = r²"], ["방법", "원 밖의 점에서 그은 접선은 접점을 (x₁, y₁)로 놓고, 접선 x₁x + y₁y = r²이 그 점을 지난다는 조건과 x₁² + y₁² = r²을 연립하여 구한다. 기울기를 m으로 놓고 (중심과 직선 사이의 거리) = r을 이용해도 된다."], ["주의", "원 위의 점에서 그을 수 있는 접선은 1개, 원 밖의 점에서는 2개이다. x₁x + y₁y = r²은 중심이 원점인 원 위의 점에서만 쓴다."]], "n": 9}, {"no": 10, "unit": "도형의 이동", "name": "평행이동", "card": [["정리", "점 P(x, y)를 x축의 방향으로 a만큼, y축의 방향으로 b만큼 평행이동한 점은 P′(x + a, y + b)"], ["정리", "방정식 f(x, y) = 0이 나타내는 도형을 x축의 방향으로 a만큼, y축의 방향으로 b만큼 평행이동한 도형의 방정식은 f(x − a, y − b) = 0"], ["방법", "도형의 방정식에서 x 대신 x − a를, y 대신 y − b를 대입한다. 점은 더하고, 도형의 방정식에서는 뺀다."], ["참고", "평행이동해도 도형의 모양과 크기는 변하지 않는다. 직선의 기울기와 원의 반지름의 길이는 그대로이다."]], "n": 9}, {"no": 11, "unit": "도형의 이동", "name": "점의 대칭이동", "card": [["정리", "점 (x, y)를 대칭이동한 점은 x축에 대하여 (x, −y), y축에 대하여 (−x, y), 원점에 대하여 (−x, −y), 직선 y = x에 대하여 (y, x)"], ["특히", "직선 y = −x에 대하여 대칭이동한 점은 (−y, −x)"], ["참고", "점 P를 점 M에 대하여 대칭이동한 점을 P′이라 하면 점 M은 선분 PP′의 중점이다."], ["주의", "x축에 대하여 대칭이동하면 y좌표의 부호가, y축에 대하여 대칭이동하면 x좌표의 부호가 바뀐다."]], "n": 8}, {"no": 12, "unit": "도형의 이동", "name": "도형의 대칭이동", "card": [["정리", "방정식 f(x, y) = 0이 나타내는 도형을 대칭이동한 도형의 방정식은 x축에 대하여 f(x, −y) = 0, y축에 대하여 f(−x, y) = 0, 원점에 대하여 f(−x, −y) = 0, 직선 y = x에 대하여 f(y, x) = 0"], ["참고", "대칭이동해도 도형의 모양과 크기는 변하지 않는다. 원은 중심만 대칭이동하면 된다."], ["주의", "평행이동과 대칭이동을 이어서 할 때는 주어진 순서대로 하나씩 적용한다. 순서가 바뀌면 결과가 달라질 수 있다."], ["참고", "직선 l 위의 점 P에 대하여 AP + PB의 최솟값은, 점 A를 직선 l에 대하여 대칭이동한 점 A′에 대하여 선분 A′B의 길이이다. (두 점 A, B가 l의 같은 쪽에 있을 때)"]], "n": 9}, {"no": 13, "unit": "집합", "name": "집합과 원소", "card": [["뜻", "어떤 기준에 따라 대상을 분명히 정할 수 있을 때, 그 대상들의 모임을 집합이라 하고 집합을 이루는 대상 하나하나를 그 집합의 원소라 한다."], ["뜻", "a가 집합 A의 원소일 때 a ∈ A, a가 집합 A의 원소가 아닐 때 a ∉ A로 나타낸다."], ["정리", "집합을 나타내는 방법에는 원소나열법 {1, 2, 3, 6}, 조건제시법 {x | x는 6의 약수}, 벤 다이어그램이 있다."], ["주의", "원소나열법에서 원소를 나열하는 순서는 생각하지 않으며, 같은 원소는 중복하여 쓰지 않는다."], ["뜻", "원소가 유한개인 집합을 유한집합, 원소가 무수히 많은 집합을 무한집합이라 한다. 원소가 하나도 없는 집합을 공집합이라 하고 ∅로 나타낸다. 공집합은 유한집합이다."], ["뜻", "유한집합 A의 원소의 개수를 n(A)로 나타낸다. n(∅) = 0이고, n({∅}) = 1이다."]], "n": 9}, {"no": 14, "unit": "집합", "name": "포함 관계와 부분집합", "card": [["뜻", "집합 A의 모든 원소가 집합 B에 속할 때 A를 B의 부분집합이라 하고 A ⊂ B로 나타낸다."], ["정리", "공집합은 모든 집합의 부분집합이고, 모든 집합은 자기 자신의 부분집합이다. 즉 ∅ ⊂ A, A ⊂ A"], ["뜻", "A ⊂ B이고 B ⊂ A일 때 두 집합 A, B는 서로 같다고 하며 A = B로 나타낸다."], ["뜻", "A ⊂ B이고 A ≠ B일 때 A를 B의 진부분집합이라 한다."], ["정리", "원소가 n개인 집합의 부분집합의 개수는 2ⁿ, 진부분집합의 개수는 2ⁿ − 1이다. 특정한 원소 k개를 반드시 원소로 갖는(또는 갖지 않는) 부분집합의 개수는 2ⁿ⁻ᵏ이다."], ["주의", "∈는 원소와 집합 사이에, ⊂는 집합과 집합 사이에 쓴다. 1 ∈ {1, 2, 3}, {1} ⊂ {1, 2, 3}"]], "n": 9}, {"no": 15, "unit": "집합의 연산", "name": "합집합·교집합·여집합·차집합", "card": [["뜻", "합집합 A ∪ B = {x | x ∈ A 또는 x ∈ B}, 교집합 A ∩ B = {x | x ∈ A 그리고 x ∈ B}"], ["뜻", "A ∩ B = ∅일 때 두 집합 A와 B는 서로소라 한다."], ["뜻", "전체집합 U의 부분집합 A에 대하여 여집합 Aᶜ = {x | x ∈ U 그리고 x ∉ A}, 차집합 A − B = {x | x ∈ A 그리고 x ∉ B}"], ["정리", "A ∪ Aᶜ = U, A ∩ Aᶜ = ∅, Uᶜ = ∅, ∅ᶜ = U, A − B = A ∩ Bᶜ, (Aᶜ)ᶜ = A"], ["참고", "A ⊂ B이면 A ∪ B = B, A ∩ B = A, A − B = ∅"]], "n": 9}, {"no": 16, "unit": "집합의 연산", "name": "연산 법칙과 드모르간 법칙", "card": [["정리", "교환법칙: A ∪ B = B ∪ A, A ∩ B = B ∩ A"], ["정리", "결합법칙: (A ∪ B) ∪ C = A ∪ (B ∪ C), (A ∩ B) ∩ C = A ∩ (B ∩ C)"], ["정리", "분배법칙: A ∩ (B ∪ C) = (A ∩ B) ∪ (A ∩ C), A ∪ (B ∩ C) = (A ∪ B) ∩ (A ∪ C)"], ["정리", "드모르간의 법칙: (A ∪ B)ᶜ = Aᶜ ∩ Bᶜ, (A ∩ B)ᶜ = Aᶜ ∪ Bᶜ"], ["방법", "차집합이 섞여 있으면 A − B = A ∩ Bᶜ로 바꾼 뒤 위의 법칙을 쓴다."], ["참고", "A ⊂ B이면 Bᶜ ⊂ Aᶜ이다. 여집합을 잡으면 포함 관계가 뒤집힌다."]], "n": 9}, {"no": 17, "unit": "집합의 연산", "name": "원소의 개수", "card": [["정리", "두 집합 A, B가 유한집합일 때 n(A ∪ B) = n(A) + n(B) − n(A ∩ B)"], ["특히", "A ∩ B = ∅이면 n(A ∪ B) = n(A) + n(B)"], ["정리", "n(Aᶜ) = n(U) − n(A), n(A − B) = n(A) − n(A ∩ B) = n(A ∪ B) − n(B)"], ["참고", "세 집합일 때: n(A ∪ B ∪ C) = n(A) + n(B) + n(C) − n(A ∩ B) − n(B ∩ C) − n(C ∩ A) + n(A ∩ B ∩ C)"], ["방법", "최댓값·최솟값은 n(A ∩ B) ≤ n(A), n(A ∩ B) ≤ n(B), n(A ∪ B) ≤ n(U)를 이용한다."]], "n": 9}], "items": [{"k": "ox", "q": "수직선 위의 두 점 A(a), B(b) 사이의 거리는 |b−a|이다.", "a": "O", "w": "수직선 위의 거리는 좌표의 차의 절댓값이다.", "t": "두 점 사이의 거리", "id": "m2-01-01", "f": 1}, {"k": "ox", "q": "두 점 A(x₁, y₁), B(x₂, y₂) 사이의 거리는 √{(x₂−x₁)² + (y₂−y₁)²}이다.", "a": "O", "w": "가로·세로 차를 두 변으로 하는 직각삼각형에 피타고라스 정리를 쓴 것이다.", "t": "두 점 사이의 거리", "id": "m2-01-02", "f": 1}, {"k": "ox", "q": "두 점 사이의 거리를 구할 때 B−A 대신 A−B 순서로 좌표를 빼면 결과가 달라진다.", "a": "X", "w": "차를 제곱하므로 (x₂−x₁)² = (x₁−x₂)²이다. 순서와 상관없다.", "t": "두 점 사이의 거리", "id": "m2-01-03", "f": 1}, {"k": "ox", "q": "원점 O와 점 P(a, b) 사이의 거리는 a² + b²이다.", "a": "X", "w": "OP = √(a² + b²)이다. 제곱근을 빼먹으면 안 된다.", "t": "두 점 사이의 거리", "id": "m2-01-04", "f": 1}, {"k": "c3", "q": "두 점 A(−1, 3), B(2, −1) 사이의 거리는?", "a": "5", "c": ["5", "4", "√7"], "w": "x좌표 차 3, y좌표 차 4 → √(9+16) = 5", "t": "두 점 사이의 거리", "id": "m2-01-05", "f": 1}, {"k": "ox", "q": "두 점 A, B에서 같은 거리에 있는 점 P를 구할 때는 AP² = BP²을 세우면 된다.", "a": "O", "w": "AP, BP는 0 이상이므로 AP = BP와 AP² = BP²은 같은 조건이고, 근호가 사라져 계산이 편하다.", "t": "같은 거리에 있는 점", "id": "m2-01-06", "f": 1}, {"k": "ox", "q": "삼각형 ABC에서 AB² + BC² = CA²이면 ∠A = 90°인 직각삼각형이다.", "a": "X", "w": "빗변이 CA이므로 직각은 CA의 맞은편, 즉 ∠B = 90°이다.", "t": "거리의 활용 - 삼각형의 모양", "id": "m2-01-07", "f": 1}, {"k": "c3", "q": "삼각형 ABC에서 AB = BC ≠ CA이면 이 삼각형은?", "a": "∠B가 꼭지각인 이등변삼각형", "c": ["∠B가 꼭지각인 이등변삼각형", "∠A가 꼭지각인 이등변삼각형", "정삼각형"], "w": "같은 두 변 AB, BC가 만나는 꼭짓점이 B이다.", "t": "거리의 활용 - 삼각형의 모양", "id": "m2-01-08", "f": 1}, {"k": "ox", "q": "점 P가 선분 AB 위에 있고 AP : PB = m : n (m>0, n>0)이면, 점 P는 선분 AB를 m : n으로 내분한다고 한다.", "a": "O", "w": "내분의 뜻 그대로다.", "t": "선분의 내분점", "id": "m2-02-01", "f": 2}, {"k": "ox", "q": "수직선 위의 두 점 A(a), B(b)에 대하여 선분 AB를 m : n으로 내분하는 점의 좌표는 (mb + na)/(m + n)이다.", "a": "O", "w": "m은 B 쪽 좌표에, n은 A 쪽 좌표에 곱한다(엇갈려 곱한다).", "t": "선분의 내분점", "id": "m2-02-02", "f": 2}, {"k": "ox", "q": "A(x₁, y₁), B(x₂, y₂)일 때 선분 AB를 m : n으로 내분하는 점의 x좌표는 (mx₁ + nx₂)/(m + n)이다.", "a": "X", "w": "엇갈려 곱해야 한다. (mx₂ + nx₁)/(m + n)이 맞다.", "t": "선분의 내분점", "id": "m2-02-03", "f": 2}, {"k": "ox", "q": "선분 AB를 2 : 1로 내분하는 점은 A보다 B에 더 가깝다.", "a": "O", "w": "AP : PB = 2 : 1이면 PB가 더 짧다. 즉 B에 더 가깝다.", "t": "내분점의 위치", "id": "m2-02-04", "f": 2}, {"k": "ox", "q": "선분 AB를 1 : 2로 내분하는 점과 선분 BA를 1 : 2로 내분하는 점은 같은 점이다.", "a": "X", "w": "선분 BA를 1 : 2로 내분하는 점은 B에 가깝다. 선분 AB를 2 : 1로 내분하는 점과 같다.", "t": "내분점의 위치", "id": "m2-02-05", "f": 2}, {"k": "ox", "q": "선분 AB의 중점은 선분 AB를 1 : 1로 내분하는 점이다.", "a": "O", "w": "중점 공식 ((x₁+x₂)/2, (y₁+y₂)/2)는 내분점 공식에 m = n = 1을 넣은 것이다.", "t": "선분의 내분점", "id": "m2-02-06", "f": 2}, {"k": "c3", "q": "두 점 A(0, 1), B(6, 7)에 대하여 선분 AB를 1 : 2로 내분하는 점은?", "a": "(2, 3)", "c": ["(2, 3)", "(4, 5)", "(3, 4)"], "w": "x = (1·6 + 2·0)/3 = 2, y = (1·7 + 2·1)/3 = 3", "t": "선분의 내분점", "id": "m2-02-07", "f": 2}, {"k": "ox", "q": "선분 AB를 m : n으로 내분하는 점은 n에 비해 m이 클수록 A에 더 가까워진다.", "a": "X", "w": "AP : PB = m : n이므로 m이 클수록 AP가 길어진다. 즉 B에 더 가까워진다.", "t": "내분점의 위치", "id": "m2-02-08", "f": 2}, {"k": "ox", "q": "삼각형의 무게중심은 세 중선의 교점이다.", "a": "O", "w": "중선은 꼭짓점과 마주 보는 변의 중점을 잇는 선분이다.", "t": "삼각형의 무게중심", "id": "m2-03-01", "f": 3}, {"k": "ox", "q": "삼각형의 무게중심은 각 중선을 꼭짓점으로부터 1 : 2로 내분한다.", "a": "X", "w": "꼭짓점으로부터 2 : 1로 내분한다.", "t": "삼각형의 무게중심", "id": "m2-03-02", "f": 3}, {"k": "ox", "q": "세 점 A(x₁, y₁), B(x₂, y₂), C(x₃, y₃)을 꼭짓점으로 하는 삼각형의 무게중심은 ((x₁+x₂+x₃)/3, (y₁+y₂+y₃)/3)이다.", "a": "O", "w": "세 꼭짓점 좌표의 평균이다.", "t": "삼각형의 무게중심", "id": "m2-03-03", "f": 3}, {"k": "c3", "q": "세 점 A(1, 2), B(3, 4), C(5, 0)을 꼭짓점으로 하는 삼각형의 무게중심은?", "a": "(3, 2)", "c": ["(3, 2)", "(2, 3)", "(3, 3)"], "w": "x = (1+3+5)/3 = 3, y = (2+4+0)/3 = 2", "t": "삼각형의 무게중심", "id": "m2-03-04", "f": 3}, {"k": "ox", "q": "삼각형의 무게중심은 세 변의 수직이등분선의 교점이다.", "a": "X", "w": "세 변의 수직이등분선의 교점은 외심이다. 무게중심은 세 중선의 교점이다.", "t": "삼각형의 무게중심", "id": "m2-03-05", "f": 3}, {"k": "ox", "q": "평행사변형 ABCD에서 두 대각선 AC, BD의 중점은 일치한다.", "a": "O", "w": "평행사변형의 두 대각선은 서로를 이등분한다. 그래서 네 번째 꼭짓점을 구할 때 이 사실을 쓴다.", "t": "평행사변형과 마름모의 성질", "id": "m2-03-06", "f": 3}, {"k": "ox", "q": "삼각형 ABC의 세 변의 중점을 꼭짓점으로 하는 삼각형의 무게중심은 삼각형 ABC의 무게중심과 같다.", "a": "O", "w": "중점 세 개의 좌표를 더해 3으로 나누면 결국 A, B, C 좌표의 합을 3으로 나눈 것과 같다.", "t": "삼각형의 무게중심", "id": "m2-03-07", "f": 3}, {"k": "ox", "q": "좌표를 이용해 도형의 성질을 증명할 때, 한 꼭짓점을 원점에 두거나 한 변을 x축 위에 놓으면 일반적인 증명이 되지 않는다.", "a": "X", "w": "도형을 옮기거나 돌려도 길이·각 같은 성질은 변하지 않는다. 계산이 간단하도록 좌표를 잡아도 일반적인 증명이다.", "t": "좌표를 이용한 도형의 성질 증명", "id": "m2-03-08", "f": 3}, {"k": "ox", "q": "점 (x₁, y₁)을 지나고 기울기가 m인 직선의 방정식은 y − y₁ = m(x − x₁)이다.", "a": "O", "w": "기울기가 m이라는 것은 (y − y₁)/(x − x₁) = m이라는 뜻이다.", "t": "직선의 방정식: 한 점과 기울기", "id": "m2-04-01", "f": 4}, {"k": "ox", "q": "x₁ ≠ x₂일 때 두 점 (x₁, y₁), (x₂, y₂)를 지나는 직선의 기울기는 (y₂ − y₁)/(x₂ − x₁)이다.", "a": "O", "w": "기울기는 (y의 증가량)/(x의 증가량)이다.", "t": "직선의 방정식: 두 점", "id": "m2-04-02", "f": 4}, {"k": "ox", "q": "두 점 (2, 1), (2, 5)를 지나는 직선의 방정식은 y = 2이다.", "a": "X", "w": "x좌표가 둘 다 2이므로 y축에 평행한 직선 x = 2이다.", "t": "직선의 방정식: 두 점", "id": "m2-04-03", "f": 4}, {"k": "ox", "q": "x절편이 a, y절편이 b (ab ≠ 0)인 직선의 방정식은 x/a + y/b = 1이다.", "a": "O", "w": "두 점 (a, 0), (0, b)를 지나는 직선을 정리한 꼴이다.", "t": "x절편과 y절편", "id": "m2-04-04", "f": 4}, {"k": "ox", "q": "직선 x = 3의 기울기는 0이다.", "a": "X", "w": "기울기가 0인 직선은 y = 3처럼 x축에 평행한 직선이다. x = 3은 y축에 평행해서 기울기를 정의하지 않는다.", "t": "직선의 방정식: 두 점", "id": "m2-04-05", "f": 4}, {"k": "ox", "q": "좌표평면 위의 모든 직선은 y = mx + n 꼴로 나타낼 수 있다.", "a": "X", "w": "x = k 꼴(y축에 평행한 직선)은 y = mx + n으로 나타낼 수 없다.", "t": "직선의 방정식: 두 점", "id": "m2-04-06", "f": 4}, {"k": "ox", "q": "좌표평면 위의 모든 직선은 ax + by + c = 0 (a, b 중 적어도 하나는 0이 아님) 꼴로 나타낼 수 있다.", "a": "O", "w": "b = 0이면 x = k 꼴, b ≠ 0이면 y = mx + n 꼴이 된다. 그래서 일반형이라고 부른다.", "t": "직선의 방정식: 두 점", "id": "m2-04-07", "f": 4}, {"k": "c3", "q": "직선 2x + 3y − 6 = 0의 기울기는?", "a": "−2/3", "c": ["−2/3", "2/3", "−3/2"], "w": "y = −(2/3)x + 2로 고치면 기울기는 −2/3이다.", "t": "직선의 방정식: 두 점", "id": "m2-04-08", "f": 4}, {"k": "ox", "q": "직선 (x − y + 1) + k(x + y − 3) = 0은 k의 값에 관계없이 항상 점 (1, 2)를 지난다.", "a": "O", "w": "두 직선 x − y + 1 = 0, x + y − 3 = 0의 교점 (1, 2)에서 두 괄호가 모두 0이 되기 때문이다.", "t": "직선이 항상 지나는 점", "id": "m2-04-09", "f": 4}, {"k": "c3", "q": "직선 ax + by + c = 0에서 ab > 0, bc < 0일 때, 이 직선이 지나지 않는 사분면은?", "a": "제3사분면", "c": ["제3사분면", "제1사분면", "제2사분면"], "w": "y = −(a/b)x − c/b에서 기울기 −a/b < 0이고 y절편 −c/b > 0이다. 제1, 2, 4사분면을 지난다.", "t": "계수의 부호에 따른 직선의 개형", "id": "m2-04-10", "f": 4}, {"k": "ox", "q": "두 직선 y = mx + n, y = m′x + n′이 서로 평행하면 m = m′, n ≠ n′이다.", "a": "O", "w": "기울기가 같고 y절편이 달라야 평행이다. y절편도 같으면 일치한다.", "t": "두 직선의 위치 관계", "id": "m2-05-01", "f": 5}, {"k": "ox", "q": "두 직선 y = mx + n, y = m′x + n′이 서로 수직이면 mm′ = −1이다.", "a": "O", "w": "두 직선이 수직이면 기울기의 곱이 −1이고, 거꾸로 기울기의 곱이 −1이면 수직이다.", "t": "두 직선의 위치 관계", "id": "m2-05-02", "f": 5}, {"k": "ox", "q": "기울기가 같은 두 직선은 항상 서로 평행하다.", "a": "X", "w": "y절편까지 같으면 두 직선은 일치한다. 평행은 기울기가 같고 y절편이 다를 때다.", "t": "두 직선의 위치 관계", "id": "m2-05-03", "f": 5}, {"k": "ox", "q": "두 직선 ax + by + c = 0, a′x + b′y + c′ = 0이 서로 수직일 조건은 aa′ + bb′ = 0이다.", "a": "O", "w": "일반형에서는 기울기로 고치지 않고 이 조건을 바로 쓸 수 있다.", "t": "두 직선의 위치 관계", "id": "m2-05-04", "f": 5}, {"k": "ox", "q": "직선 y = 1과 직선 y = −2는 서로 수직이다.", "a": "X", "w": "둘 다 x축에 평행하므로 서로 평행하다. x = 1과 y = −2라면 수직이다.", "t": "두 직선의 위치 관계", "id": "m2-05-05", "f": 5}, {"k": "ox", "q": "서로 수직인 두 직선의 기울기의 곱은 항상 −1이다.", "a": "X", "w": "직선 x = 1과 y = −2처럼 한 직선의 기울기가 정의되지 않으면 곱을 말할 수 없다. mm′ = −1은 두 기울기가 모두 있을 때의 조건이다.", "t": "두 직선의 위치 관계", "id": "m2-05-06", "f": 5}, {"k": "c3", "q": "점 (0, 0)을 지나고 직선 y = 3x + 1에 수직인 직선은?", "a": "y = −(1/3)x", "c": ["y = −(1/3)x", "y = (1/3)x", "y = −3x"], "w": "수직이면 기울기의 곱이 −1이므로 기울기는 −1/3이다.", "t": "평행 또는 수직인 직선", "id": "m2-05-07", "f": 5}, {"k": "ox", "q": "선분 AB의 수직이등분선은 선분 AB의 중점을 지나고 직선 AB에 수직인 직선이다.", "a": "O", "w": "\"수직\" + \"이등분(중점)\" 두 조건으로 식을 세운다.", "t": "수직이등분선의 방정식", "id": "m2-05-08", "f": 5}, {"k": "ox", "q": "서로 다른 세 점 A, B, C가 한 직선 위에 있으면 직선 AB와 직선 BC의 기울기가 같다. (단, 직선 AB는 y축에 평행하지 않다.)", "a": "O", "w": "세 점이 한 직선 위에 있을 조건을 기울기로 확인하는 방법이다.", "t": "세 점이 한 직선 위에 있을 조건", "id": "m2-05-09", "f": 5}, {"k": "ox", "q": "두 직선 x + 2y − 1 = 0, 2x + 4y − 2 = 0은 서로 평행하다.", "a": "X", "w": "두 번째 식은 첫 번째 식에 2를 곱한 것이다. 두 직선은 일치한다.", "t": "두 직선의 위치 관계", "id": "m2-05-10", "f": 5}, {"k": "ox", "q": "점 P와 직선 l 사이의 거리는 직선 l 위의 어느 점을 잡아 P까지 재어도 항상 같다.", "a": "X", "w": "점과 직선 사이의 거리는 P에서 l에 내린 수선의 길이, 즉 가장 짧은 거리 하나다. 다른 점까지는 더 길다.", "t": "점과 직선 사이의 거리", "id": "m2-06-01", "f": 6}, {"k": "ox", "q": "점 (x₁, y₁)과 직선 ax + by + c = 0 사이의 거리는 |ax₁ + by₁ + c| / √(a² + b²)이다.", "a": "O", "w": "분자에는 절댓값이, 분모에는 a² + b²의 제곱근이 들어간다.", "t": "점과 직선 사이의 거리", "id": "m2-06-02", "f": 6}, {"k": "ox", "q": "점과 직선 y = 2x + 3 사이의 거리를 공식으로 구하려면 먼저 직선을 ax + by + c = 0 꼴(예: 2x − y + 3 = 0)로 고쳐야 한다.", "a": "O", "w": "공식은 ax + by + c = 0 꼴에서 쓴다.", "t": "점과 직선 사이의 거리", "id": "m2-06-03", "f": 6}, {"k": "ox", "q": "점 (x₁, y₁)과 직선 ax + by + c = 0 사이의 거리 공식에서 분모는 √(a² + b² + c²)이다.", "a": "X", "w": "분모는 √(a² + b²)이다. c는 분모에 들어가지 않는다.", "t": "점과 직선 사이의 거리", "id": "m2-06-04", "f": 6}, {"k": "c3", "q": "원점과 직선 3x + 4y − 10 = 0 사이의 거리는?", "a": "2", "c": ["2", "10", "10/7"], "w": "|0 + 0 − 10| / √(9 + 16) = 10/5 = 2", "t": "점과 직선 사이의 거리", "id": "m2-06-05", "f": 6}, {"k": "ox", "q": "점 (2, 5)와 직선 y = 1 사이의 거리는 4이다.", "a": "O", "w": "x축에 평행한 직선까지의 거리는 y좌표의 차 |5 − 1| = 4이다.", "t": "점과 직선 사이의 거리", "id": "m2-06-06", "f": 6}, {"k": "ox", "q": "점 (3, −4)와 x축 사이의 거리는 3이다.", "a": "X", "w": "x축까지의 거리는 |y좌표| = 4이다.", "t": "점과 직선 사이의 거리", "id": "m2-06-07", "f": 6}, {"k": "ox", "q": "평행한 두 직선 사이의 거리는 한 직선 위의 어느 점을 잡아도 다른 직선까지의 거리가 같다.", "a": "O", "w": "평행한 두 직선 사이의 거리는 일정하다. 그래서 계산하기 쉬운 점을 잡으면 된다.", "t": "평행한 두 직선 사이의 거리", "id": "m2-06-08", "f": 6}, {"k": "c3", "q": "평행한 두 직선 x + y − 1 = 0, x + y + 3 = 0 사이의 거리는?", "a": "2√2", "c": ["2√2", "4", "√2"], "w": "|−1 − 3| / √2 = 4/√2 = 2√2", "t": "평행한 두 직선 사이의 거리", "id": "m2-06-09", "f": 6}, {"k": "ox", "q": "원은 평면 위의 한 점에서 일정한 거리에 있는 점 전체의 집합이다.", "a": "O", "w": "그 한 점이 중심, 일정한 거리가 반지름이다.", "t": "중심의 좌표가 주어진 원의 방정식", "id": "m2-07-01", "f": 7}, {"k": "ox", "q": "중심이 (a, b)이고 반지름의 길이가 r인 원의 방정식은 (x − a)² + (y − b)² = r²이다.", "a": "O", "w": "원 위의 점 (x, y)와 중심 사이의 거리가 r이라는 식을 제곱한 것이다.", "t": "중심의 좌표가 주어진 원의 방정식", "id": "m2-07-02", "f": 7}, {"k": "c3", "q": "원 (x + 1)² + (y − 2)² = 9의 중심과 반지름의 길이는?", "a": "중심 (−1, 2), 반지름 3", "c": ["중심 (−1, 2), 반지름 3", "중심 (1, −2), 반지름 3", "중심 (−1, 2), 반지름 9"], "w": "(x − (−1))² + (y − 2)² = 3²이다. 부호와 제곱에 주의한다.", "t": "중심의 좌표가 주어진 원의 방정식", "id": "m2-07-03", "f": 7}, {"k": "ox", "q": "방정식 x² + y² + Ax + By + C = 0은 A, B, C의 값에 관계없이 항상 원을 나타낸다.", "a": "X", "w": "A² + B² − 4C > 0일 때만 원이다. 0이면 점 하나이고, 음수면 나타내는 도형이 없다.", "t": "원의 방정식이 되기 위한 조건", "id": "m2-07-04", "f": 7}, {"k": "ox", "q": "방정식 x² + y² + Ax + By + C = 0이 원을 나타낼 때, 그 중심은 (−A/2, −B/2)이다.", "a": "O", "w": "완전제곱식으로 고치면 (x + A/2)² + (y + B/2)² = (A² + B² − 4C)/4이다.", "t": "원의 방정식이 되기 위한 조건", "id": "m2-07-05", "f": 7}, {"k": "ox", "q": "방정식 x² + y² − 2x + 4y + 5 = 0은 원을 나타낸다.", "a": "X", "w": "(x − 1)² + (y + 2)² = 0이 되어 점 (1, −2) 하나만 나타낸다.", "t": "원의 방정식이 되기 위한 조건", "id": "m2-07-06", "f": 7}, {"k": "ox", "q": "중심이 (3, −2)이고 x축에 접하는 원의 반지름의 길이는 3이다.", "a": "X", "w": "x축에 접하면 반지름은 중심의 |y좌표| = 2이다.", "t": "x축 또는 y축에 접하는 원의 방정식", "id": "m2-07-07", "f": 7}, {"k": "ox", "q": "중심이 제1사분면에 있고 x축과 y축에 동시에 접하는 원은 (x − r)² + (y − r)² = r² 꼴이다.", "a": "O", "w": "두 축에 모두 접하면 중심은 (r, r)이고 반지름은 r이다.", "t": "x축과 y축에 동시에 접하는 원의 방정식", "id": "m2-07-08", "f": 7}, {"k": "ox", "q": "두 점 A, B를 지름의 양 끝점으로 하는 원의 반지름의 길이는 선분 AB의 길이와 같다.", "a": "X", "w": "AB는 지름이다. 반지름은 AB의 절반이고, 중심은 AB의 중점이다.", "t": "지름의 양 끝점이 주어진 원의 방정식", "id": "m2-07-09", "f": 7}, {"k": "ox", "q": "원과 직선의 방정식을 연립한 이차방정식의 판별식 D가 D > 0이면, 원과 직선은 서로 다른 두 점에서 만난다.", "a": "O", "w": "서로 다른 실근의 개수가 교점의 개수다.", "t": "원과 직선의 위치 관계: 두 점에서 만날 때", "id": "m2-08-01", "f": 8}, {"k": "ox", "q": "원과 직선의 방정식을 연립한 이차방정식의 판별식이 D = 0이면, 원과 직선은 만나지 않는다.", "a": "X", "w": "D = 0이면 중근이 하나라서 한 점에서 접한다. 만나지 않는 것은 D < 0일 때다.", "t": "원과 직선의 위치 관계: 한 점에서 접할 때", "id": "m2-08-02", "f": 8}, {"k": "ox", "q": "원의 중심과 직선 사이의 거리를 d, 반지름의 길이를 r라 할 때, d < r이면 원과 직선은 서로 다른 두 점에서 만난다.", "a": "O", "w": "중심에서 직선까지가 반지름보다 가까우면 직선이 원을 뚫고 지나간다.", "t": "원과 직선의 위치 관계: 두 점에서 만날 때", "id": "m2-08-03", "f": 8}, {"k": "c3", "q": "반지름의 길이가 r인 원과 직선이 접할 조건은? (d는 원의 중심과 직선 사이의 거리)", "a": "d = r", "c": ["d = r", "d < r", "d > r"], "w": "접하면 중심에서 접점까지가 반지름이고, 그 선분이 직선에 수직이다.", "t": "원과 직선의 위치 관계: 한 점에서 접할 때", "id": "m2-08-04", "f": 8}, {"k": "ox", "q": "원 x² + y² = 4와 직선 y = 3은 한 점에서 만난다.", "a": "X", "w": "중심 (0, 0)과 직선 y = 3 사이의 거리는 3으로, 반지름 2보다 크다. 만나지 않는다.", "t": "원과 직선의 위치 관계: 만나지 않을 때", "id": "m2-08-05", "f": 8}, {"k": "ox", "q": "원과 직선은 최대 세 점에서 만날 수 있다.", "a": "X", "w": "연립하면 이차방정식이 나와서 교점은 많아야 2개다.", "t": "원과 직선의 위치 관계: 두 점에서 만날 때", "id": "m2-08-06", "f": 8}, {"k": "ox", "q": "원의 중심에서 현에 내린 수선은 그 현을 이등분한다.", "a": "O", "w": "현의 길이를 구할 때 이 성질로 직각삼각형을 만든다.", "t": "현의 길이", "id": "m2-08-07", "f": 8}, {"k": "ox", "q": "반지름의 길이가 r인 원에서 중심과의 거리가 d인 직선이 원과 만나 생기는 현의 길이는 2√(r² − d²)이다.", "a": "O", "w": "반지름, 중심-직선 거리, 현의 절반이 직각삼각형을 이룬다.", "t": "현의 길이", "id": "m2-08-08", "f": 8}, {"k": "ox", "q": "원의 중심을 지나는 직선은 그 원에 접할 수 있다.", "a": "X", "w": "중심과 직선 사이의 거리가 0 < r이라서 항상 서로 다른 두 점에서 만난다.", "t": "원과 직선의 위치 관계: 두 점에서 만날 때", "id": "m2-08-09", "f": 8}, {"k": "ox", "q": "원 위의 한 점에서 그은 접선은 그 점을 지나는 반지름에 수직이다.", "a": "O", "w": "접선의 방정식을 구하는 모든 방법이 이 성질에서 나온다.", "t": "원의 접선의 방정식: 원 위의 점이 주어질 때", "id": "m2-09-01", "f": 9}, {"k": "ox", "q": "원 x² + y² = r² 위의 점 (x₁, y₁)에서의 접선의 방정식은 x₁x + y₁y = r²이다.", "a": "O", "w": "접선은 중심과 접점을 잇는 반지름에 수직이라는 조건을 정리하면 이 꼴이 된다. (x₁ = 0 또는 y₁ = 0일 때도 성립)", "t": "원의 접선의 방정식: 원 위의 점이 주어질 때", "id": "m2-09-02", "f": 9}, {"k": "ox", "q": "원 (x − a)² + (y − b)² = r² 위의 점 (x₁, y₁)에서의 접선의 방정식도 x₁x + y₁y = r²이다.", "a": "X", "w": "x₁x + y₁y = r²은 중심이 원점일 때의 공식이다. 중심이 (a, b)이면 (x₁ − a)(x − a) + (y₁ − b)(y − b) = r²이다.", "t": "원의 접선의 방정식: 원 위의 점이 주어질 때", "id": "m2-09-03", "f": 9}, {"k": "ox", "q": "원 x² + y² = r²에 접하고 기울기가 m인 직선의 방정식은 y = mx ± r√(m² + 1)이다.", "a": "O", "w": "중심과 직선 사이의 거리가 r라는 조건으로 y절편을 구한 결과다.", "t": "원의 접선의 방정식: 기울기가 주어질 때", "id": "m2-09-04", "f": 9}, {"k": "c3", "q": "원 x² + y² = 1에 접하고 기울기가 1인 직선은 몇 개인가?", "a": "2개", "c": ["2개", "1개", "0개"], "w": "y = x ± √2 두 개다. 기울기가 정해지면 원의 양쪽에 하나씩 있다.", "t": "원의 접선의 방정식: 기울기가 주어질 때", "id": "m2-09-05", "f": 9}, {"k": "ox", "q": "원 밖의 한 점에서 그 원에 그을 수 있는 접선은 2개이다.", "a": "O", "w": "원 밖의 점에서는 원의 양쪽으로 접선이 하나씩 생긴다.", "t": "원의 접선의 방정식: 원 밖의 점이 주어질 때", "id": "m2-09-06", "f": 9}, {"k": "ox", "q": "원 위의 한 점에서 그 원에 그을 수 있는 접선은 2개이다.", "a": "X", "w": "원 위의 점에서는 접선이 딱 1개다.", "t": "원의 접선의 방정식: 원 위의 점이 주어질 때", "id": "m2-09-07", "f": 9}, {"k": "c3", "q": "원 x² + y² = 5 위의 점 (1, 2)에서의 접선의 방정식은?", "a": "x + 2y = 5", "c": ["x + 2y = 5", "2x + y = 5", "x + 2y = √5"], "w": "x₁x + y₁y = r²에 넣으면 1·x + 2·y = 5이다. 우변은 r이 아니라 r²이다.", "t": "원의 접선의 방정식: 원 위의 점이 주어질 때", "id": "m2-09-08", "f": 9}, {"k": "ox", "q": "원 x² + y² = r² 밖의 점 P(p, q)에서 그은 접선의 방정식은 px + qy = r²이다.", "a": "X", "w": "x₁x + y₁y = r²은 원 위의 점(접점)에서 쓰는 공식이다. 원 밖의 점이면 접점을 (x₁, y₁)로 놓고 그 접선이 P를 지난다는 조건으로 구한다.", "t": "원의 접선의 방정식: 원 밖의 점이 주어질 때", "id": "m2-09-09", "f": 9}, {"k": "ox", "q": "점 (x, y)를 x축의 방향으로 a만큼, y축의 방향으로 b만큼 평행이동한 점은 (x + a, y + b)이다.", "a": "O", "w": "점은 옮기는 만큼 더한다.", "t": "점의 평행이동", "id": "m2-10-01", "f": 10}, {"k": "ox", "q": "도형 f(x, y) = 0을 x축의 방향으로 a만큼, y축의 방향으로 b만큼 평행이동한 도형의 방정식은 f(x + a, y + b) = 0이다.", "a": "X", "w": "도형의 방정식은 x 대신 x − a, y 대신 y − b를 넣는다. f(x − a, y − b) = 0이다.", "t": "방정식 f(x, y)=0이 나타내는 도형의 이동", "id": "m2-10-02", "f": 10}, {"k": "c3", "q": "점 (2, −1)을 x축의 방향으로 −3만큼, y축의 방향으로 4만큼 평행이동한 점은?", "a": "(−1, 3)", "c": ["(−1, 3)", "(5, −5)", "(−1, −5)"], "w": "(2 + (−3), −1 + 4) = (−1, 3)", "t": "점의 평행이동", "id": "m2-10-03", "f": 10}, {"k": "c3", "q": "직선 y = 2x + 1을 x축의 방향으로 1만큼 평행이동한 직선은?", "a": "y = 2x − 1", "c": ["y = 2x − 1", "y = 2x + 3", "y = 2x + 2"], "w": "x 대신 x − 1을 넣는다. y = 2(x − 1) + 1 = 2x − 1", "t": "직선의 평행이동", "id": "m2-10-04", "f": 10}, {"k": "ox", "q": "원을 평행이동해도 반지름의 길이는 변하지 않는다.", "a": "O", "w": "평행이동은 모양과 크기를 바꾸지 않고 위치만 바꾼다.", "t": "원의 평행이동", "id": "m2-10-05", "f": 10}, {"k": "ox", "q": "직선을 평행이동하면 기울기가 바뀔 수 있다.", "a": "X", "w": "평행이동한 직선은 처음 직선과 평행하거나 일치한다. 기울기는 그대로다.", "t": "직선의 평행이동", "id": "m2-10-06", "f": 10}, {"k": "ox", "q": "원 (x − 1)² + (y + 2)² = 4를 x축의 방향으로 2만큼, y축의 방향으로 3만큼 평행이동한 원의 중심은 (3, 1)이다.", "a": "O", "w": "중심 (1, −2)를 옮기면 (1 + 2, −2 + 3) = (3, 1)이다.", "t": "원의 평행이동", "id": "m2-10-07", "f": 10}, {"k": "ox", "q": "포물선 y = x²을 x축의 방향으로 2만큼 평행이동하면 y = x² + 2가 된다.", "a": "X", "w": "x 대신 x − 2를 넣어 y = (x − 2)²이 된다. y = x² + 2는 y축의 방향으로 2만큼 옮긴 것이다.", "t": "포물선의 평행이동", "id": "m2-10-08", "f": 10}, {"k": "ox", "q": "점 (1, 1)을 점 (3, −2)로 옮기는 평행이동에 의해 원점은 점 (2, −3)으로 옮겨진다.", "a": "O", "w": "이 평행이동은 x축 방향 +2, y축 방향 −3이다. 모든 점을 똑같이 옮긴다.", "t": "점의 평행이동", "id": "m2-10-09", "f": 10}, {"k": "ox", "q": "점 (a, b)를 x축에 대하여 대칭이동한 점은 (a, −b)이다.", "a": "O", "w": "x축 대칭은 y좌표의 부호만 바뀐다.", "t": "점의 대칭이동", "id": "m2-11-01", "f": 11}, {"k": "ox", "q": "점 (a, b)를 y축에 대하여 대칭이동한 점은 (a, −b)이다.", "a": "X", "w": "y축 대칭은 x좌표의 부호가 바뀐다. (−a, b)이다.", "t": "점의 대칭이동", "id": "m2-11-02", "f": 11}, {"k": "c3", "q": "점 (3, −2)를 원점에 대하여 대칭이동한 점은?", "a": "(−3, 2)", "c": ["(−3, 2)", "(3, 2)", "(−2, 3)"], "w": "원점 대칭은 두 좌표의 부호가 모두 바뀐다.", "t": "점의 대칭이동", "id": "m2-11-03", "f": 11}, {"k": "ox", "q": "점 (a, b)를 직선 y = x에 대하여 대칭이동한 점은 (b, a)이다.", "a": "O", "w": "y = x 대칭은 x좌표와 y좌표를 서로 바꾼다.", "t": "점의 대칭이동", "id": "m2-11-04", "f": 11}, {"k": "ox", "q": "점 (a, b)를 직선 y = −x에 대하여 대칭이동한 점은 (−b, −a)이다.", "a": "O", "w": "좌표를 서로 바꾸고 둘 다 부호를 바꾼다.", "t": "점의 대칭이동", "id": "m2-11-05", "f": 11}, {"k": "ox", "q": "점을 x축에 대하여 대칭이동한 뒤 다시 y축에 대하여 대칭이동한 결과는 원점에 대하여 대칭이동한 것과 같다.", "a": "O", "w": "(a, b) → (a, −b) → (−a, −b)", "t": "점의 대칭이동", "id": "m2-11-06", "f": 11}, {"k": "ox", "q": "점 P를 점 M에 대하여 대칭이동한 점을 P′이라 하면, 점 P′은 선분 PM의 중점이다.", "a": "X", "w": "거꾸로다. 점 M이 선분 PP′의 중점이다.", "t": "점에 대한 대칭이동", "id": "m2-11-07", "f": 11}, {"k": "c3", "q": "점 (1, 4)를 점 (2, 1)에 대하여 대칭이동한 점은?", "a": "(3, −2)", "c": ["(3, −2)", "(0, 7)", "(3, 5)"], "w": "(2, 1)이 중점이므로 (2·2 − 1, 2·1 − 4) = (3, −2)", "t": "점에 대한 대칭이동", "id": "m2-11-08", "f": 11}, {"k": "ox", "q": "도형 f(x, y) = 0을 x축에 대하여 대칭이동한 도형의 방정식은 f(x, −y) = 0이다.", "a": "O", "w": "x축 대칭은 y 대신 −y를 넣는다.", "t": "방정식 f(x, y)=0이 나타내는 도형의 이동", "id": "m2-12-01", "f": 12}, {"k": "ox", "q": "도형 f(x, y) = 0을 직선 y = x에 대하여 대칭이동한 도형의 방정식은 f(y, x) = 0이다.", "a": "O", "w": "x와 y를 서로 바꿔 넣는다.", "t": "방정식 f(x, y)=0이 나타내는 도형의 이동", "id": "m2-12-02", "f": 12}, {"k": "c3", "q": "직선 y = 2x + 1을 y축에 대하여 대칭이동한 직선은?", "a": "y = −2x + 1", "c": ["y = −2x + 1", "y = −2x − 1", "y = 2x − 1"], "w": "x 대신 −x를 넣으면 y = −2x + 1이다.", "t": "직선의 대칭이동", "id": "m2-12-03", "f": 12}, {"k": "ox", "q": "원 (x − 1)² + (y − 2)² = 4를 x축에 대하여 대칭이동한 원의 방정식은 (x + 1)² + (y − 2)² = 4이다.", "a": "X", "w": "x축 대칭은 y 대신 −y를 넣는다. (x − 1)² + (y + 2)² = 4이다. 보기의 식은 y축 대칭이다.", "t": "원의 대칭이동", "id": "m2-12-04", "f": 12}, {"k": "ox", "q": "원을 직선 y = x에 대하여 대칭이동하면 반지름의 길이가 바뀔 수 있다.", "a": "X", "w": "대칭이동은 모양과 크기를 바꾸지 않는다. 중심만 대칭이동하고 반지름은 그대로다.", "t": "원의 대칭이동", "id": "m2-12-05", "f": 12}, {"k": "c3", "q": "직선 y = 2x + 1을 직선 y = x에 대하여 대칭이동한 직선은?", "a": "y = (x − 1)/2", "c": ["y = (x − 1)/2", "y = (x + 1)/2", "y = −2x + 1"], "w": "x와 y를 바꾸면 x = 2y + 1, 즉 y = (x − 1)/2", "t": "직선의 대칭이동", "id": "m2-12-06", "f": 12}, {"k": "ox", "q": "포물선 y = x² − 2x를 원점에 대하여 대칭이동하면 y = −x² − 2x가 된다.", "a": "O", "w": "x 대신 −x, y 대신 −y를 넣으면 −y = x² + 2x, 즉 y = −x² − 2x", "t": "포물선의 대칭이동", "id": "m2-12-07", "f": 12}, {"k": "ox", "q": "점을 평행이동한 뒤 대칭이동한 결과와, 대칭이동한 뒤 같은 평행이동을 한 결과는 항상 같다.", "a": "X", "w": "순서가 바뀌면 결과가 달라질 수 있다. (1, 0)을 x축 방향 +2 → y축 대칭하면 (−3, 0), y축 대칭 → +2 하면 (1, 0)이다.", "t": "평행이동과 대칭이동의 합성", "id": "m2-12-08", "f": 12}, {"k": "ox", "q": "두 점 A, B가 x축보다 위쪽에 있을 때, x축 위의 점 P에 대하여 AP + PB의 최솟값은 A를 x축에 대하여 대칭이동한 점 A′에 대하여 선분 A′B의 길이이다.", "a": "O", "w": "AP = A′P이므로 AP + PB = A′P + PB ≥ A′B이다. 꺾인 길을 곧게 편다.", "t": "대칭이동을 이용한 거리의 최솟값", "id": "m2-12-09", "f": 12}, {"k": "ox", "q": "\"키가 큰 학생의 모임\"은 집합이다.", "a": "X", "w": "\"크다\"는 기준이 분명하지 않다. 대상을 분명히 정할 수 없으면 집합이 아니다.", "t": "집합과 원소, 집합의 표현", "id": "m2-13-01", "f": 13}, {"k": "ox", "q": "\"10보다 작은 자연수의 모임\"은 집합이다.", "a": "O", "w": "1부터 9까지로 대상이 분명히 정해진다.", "t": "집합과 원소, 집합의 표현", "id": "m2-13-02", "f": 13}, {"k": "ox", "q": "a가 집합 A의 원소일 때, 기호로 a ⊂ A와 같이 나타낸다.", "a": "X", "w": "원소와 집합의 관계는 a ∈ A이다. ⊂는 집합과 집합 사이의 관계에 쓴다.", "t": "기호의 사용과 포함 관계", "id": "m2-13-03", "f": 13}, {"k": "ox", "q": "집합 {1, 2, 3}과 집합 {3, 1, 2}는 서로 같은 집합이다.", "a": "O", "w": "원소를 나열하는 순서는 상관없다.", "t": "집합과 원소, 집합의 표현", "id": "m2-13-04", "f": 13}, {"k": "ox", "q": "집합을 원소나열법으로 나타낼 때, 같은 원소는 중복하여 쓰지 않는다.", "a": "O", "w": "같은 원소는 한 번만 쓴다.", "t": "집합과 원소, 집합의 표현", "id": "m2-13-05", "f": 13}, {"k": "ox", "q": "{x | x는 6의 약수}를 원소나열법으로 나타내면 {2, 3}이다.", "a": "X", "w": "1과 6도 6의 약수다. {1, 2, 3, 6}이다.", "t": "집합과 원소, 집합의 표현", "id": "m2-13-06", "f": 13}, {"k": "ox", "q": "공집합 ∅은 원소가 하나도 없는 집합이고, 유한집합이다.", "a": "O", "w": "원소가 0개로 유한하므로 유한집합이다. n(∅) = 0이다.", "t": "유한·무한집합과 원소의 개수", "id": "m2-13-07", "f": 13}, {"k": "c3", "q": "n({∅})의 값은?", "a": "1", "c": ["1", "0", "2"], "w": "{∅}는 공집합 ∅ 하나를 원소로 갖는 집합이다. 원소는 1개다.", "t": "유한·무한집합과 원소의 개수", "id": "m2-13-08", "f": 13}, {"k": "ox", "q": "{x | x는 0 < x < 1인 실수}는 유한집합이다.", "a": "X", "w": "0과 1 사이의 실수는 무수히 많다. 무한집합이다.", "t": "유한·무한집합과 원소의 개수", "id": "m2-13-09", "f": 13}, {"k": "ox", "q": "공집합은 모든 집합의 부분집합이다.", "a": "O", "w": "약속이다. ∅ ⊂ A는 어떤 집합 A에 대해서도 성립한다.", "t": "부분집합과 서로 같은 집합", "id": "m2-14-01", "f": 14}, {"k": "ox", "q": "모든 집합은 자기 자신의 부분집합이다.", "a": "O", "w": "A의 모든 원소가 A의 원소이므로 A ⊂ A이다.", "t": "부분집합과 서로 같은 집합", "id": "m2-14-02", "f": 14}, {"k": "ox", "q": "A ⊂ B이고 B ⊂ A이면 A = B이다.", "a": "O", "w": "서로 같은 집합의 뜻이다. 두 집합이 같음을 보일 때 이 방법을 쓴다.", "t": "부분집합과 서로 같은 집합", "id": "m2-14-03", "f": 14}, {"k": "ox", "q": "집합 A = {1, 2, 3}에 대하여 {1} ∈ A이다.", "a": "X", "w": "{1}은 원소가 아니라 A의 부분집합이다. {1} ⊂ A가 맞다.", "t": "기호의 사용과 포함 관계", "id": "m2-14-04", "f": 14}, {"k": "ox", "q": "집합 A = {1, {2}}에 대하여 2 ∈ A이다.", "a": "X", "w": "A의 원소는 1과 {2}이다. 2는 원소가 아니고 {2} ∈ A가 맞다.", "t": "기호의 사용과 포함 관계", "id": "m2-14-05", "f": 14}, {"k": "c3", "q": "원소가 n개인 집합의 부분집합의 개수는?", "a": "2ⁿ", "c": ["2ⁿ", "2n", "n²"], "w": "원소마다 \"넣는다/안 넣는다\" 두 가지이므로 2를 n번 곱한다.", "t": "부분집합의 개수", "id": "m2-14-06", "f": 14}, {"k": "ox", "q": "원소가 n개인 집합의 진부분집합의 개수는 2ⁿ − 2이다.", "a": "X", "w": "진부분집합은 부분집합 중 자기 자신만 뺀 것이다. 2ⁿ − 1개다. (공집합은 진부분집합에 들어간다.)", "t": "부분집합의 개수", "id": "m2-14-07", "f": 14}, {"k": "c3", "q": "집합 {1, 2, 3, 4, 5}의 부분집합 중 1을 반드시 원소로 갖는 것의 개수는?", "a": "16", "c": ["16", "32", "15"], "w": "1은 넣기로 정했으니 나머지 4개만 고르면 된다. 2⁴ = 16", "t": "조건이 붙은 부분집합의 개수", "id": "m2-14-08", "f": 14}, {"k": "ox", "q": "집합 {1, 2, 3, 4}의 부분집합 중 1, 2를 반드시 원소로 갖고 3은 원소로 갖지 않는 것의 개수는 4이다.", "a": "X", "w": "1, 2, 3이 모두 정해졌으니 남은 원소는 4 하나다. 2¹ = 2개다.", "t": "조건이 붙은 부분집합의 개수", "id": "m2-14-09", "f": 14}, {"k": "ox", "q": "A ∩ B = ∅이면 두 집합 A, B는 서로소이다.", "a": "O", "w": "공통인 원소가 없으면 서로소다.", "t": "합집합·교집합과 서로소", "id": "m2-15-01", "f": 15}, {"k": "ox", "q": "공집합과 서로소인 집합은 공집합뿐이다.", "a": "X", "w": "∅ ∩ A = ∅이므로 공집합은 모든 집합과 서로소다.", "t": "합집합·교집합과 서로소", "id": "m2-15-02", "f": 15}, {"k": "ox", "q": "A − B = A ∩ Bᶜ이다.", "a": "O", "w": "A에는 속하고 B에는 속하지 않는 원소의 집합이다. 차집합을 연산 법칙으로 다룰 때 가장 많이 쓴다.", "t": "여집합과 차집합", "id": "m2-15-03", "f": 15}, {"k": "c3", "q": "A = {1, 2, 3}, B = {2, 4, 6}일 때 A − B는?", "a": "{1, 3}", "c": ["{1, 3}", "{4, 6}", "{1, 3, 4, 6}"], "w": "A의 원소 중 B에 없는 것만 남긴다.", "t": "여집합과 차집합", "id": "m2-15-04", "f": 15}, {"k": "ox", "q": "두 집합 A, B에 대하여 A − B와 B − A는 항상 같다.", "a": "X", "w": "예를 들어 A = {1, 2, 3}, B = {2, 4, 6}이면 A − B = {1, 3}, B − A = {4, 6}으로 다르다. 차집합은 순서가 중요하다.", "t": "여집합과 차집합", "id": "m2-15-05", "f": 15}, {"k": "ox", "q": "A ⊂ B이면 A ∩ B = A, A ∪ B = B이다.", "a": "O", "w": "A가 B 안에 들어 있으면 공통 부분은 A, 합친 것은 B이다.", "t": "집합의 연산과 포함 관계", "id": "m2-15-06", "f": 15}, {"k": "ox", "q": "A ⊂ B이면 A − B = ∅이다.", "a": "O", "w": "A의 모든 원소가 B에 있어서 남는 것이 없다.", "t": "집합의 연산과 포함 관계", "id": "m2-15-07", "f": 15}, {"k": "ox", "q": "전체집합 U의 부분집합 A에 대하여 (Aᶜ)ᶜ = Aᶜ이다.", "a": "X", "w": "여집합의 여집합은 자기 자신이다. (Aᶜ)ᶜ = A", "t": "여집합과 차집합", "id": "m2-15-08", "f": 15}, {"k": "ox", "q": "전체집합 U의 부분집합 A에 대하여 A ∪ Aᶜ = ∅이다.", "a": "X", "w": "A ∪ Aᶜ = U이고, A ∩ Aᶜ = ∅이다.", "t": "여집합과 차집합", "id": "m2-15-09", "f": 15}, {"k": "ox", "q": "A ∪ B = B ∪ A, A ∩ B = B ∩ A가 성립한다.", "a": "O", "w": "합집합과 교집합은 교환법칙이 성립한다.", "t": "연산의 성질과 드모르간 법칙", "id": "m2-16-01", "f": 16}, {"k": "ox", "q": "A ∩ (B ∪ C) = (A ∩ B) ∪ (A ∩ C)이다.", "a": "O", "w": "분배법칙이다. 벤 다이어그램으로 확인해 보자.", "t": "연산의 성질과 드모르간 법칙", "id": "m2-16-02", "f": 16}, {"k": "ox", "q": "A ∪ (B ∩ C) = (A ∪ B) ∩ C가 항상 성립한다.", "a": "X", "w": "분배법칙은 A ∪ (B ∩ C) = (A ∪ B) ∩ (A ∪ C)이다. C에도 A를 합쳐야 한다.", "t": "연산의 성질과 드모르간 법칙", "id": "m2-16-03", "f": 16}, {"k": "ox", "q": "(A ∪ B)ᶜ = Aᶜ ∪ Bᶜ가 항상 성립한다.", "a": "X", "w": "드모르간 법칙: 여집합을 풀면 ∪와 ∩가 바뀐다. (A ∪ B)ᶜ = Aᶜ ∩ Bᶜ", "t": "연산의 성질과 드모르간 법칙", "id": "m2-16-04", "f": 16}, {"k": "ox", "q": "(A ∩ B)ᶜ = Aᶜ ∪ Bᶜ이다.", "a": "O", "w": "드모르간 법칙이다.", "t": "연산의 성질과 드모르간 법칙", "id": "m2-16-05", "f": 16}, {"k": "c3", "q": "A ∩ (A ∪ B)를 간단히 하면?", "a": "A", "c": ["A", "B", "A ∩ B"], "w": "A ⊂ A ∪ B이므로 A ∩ (A ∪ B) = A이다.", "t": "연산의 성질과 드모르간 법칙", "id": "m2-16-06", "f": 16}, {"k": "ox", "q": "A − (B ∪ C) = (A − B) ∩ (A − C)이다.", "a": "O", "w": "양변 모두 A ∩ Bᶜ ∩ Cᶜ이다. 차집합을 ∩ᶜ로 바꾸면 드모르간으로 풀린다.", "t": "연산의 성질과 드모르간 법칙", "id": "m2-16-07", "f": 16}, {"k": "ox", "q": "A ⊂ B이면 항상 Aᶜ ⊂ Bᶜ이다.", "a": "X", "w": "여집합을 잡으면 포함 관계의 방향이 뒤집힌다. Bᶜ ⊂ Aᶜ가 맞다.", "t": "집합의 연산과 포함 관계", "id": "m2-16-08", "f": 16}, {"k": "ox", "q": "(A − B) ∪ B = A가 항상 성립한다.", "a": "X", "w": "(A ∩ Bᶜ) ∪ B = A ∪ B이다. B ⊂ A일 때만 A가 된다.", "t": "연산의 성질과 드모르간 법칙", "id": "m2-16-09", "f": 16}, {"k": "ox", "q": "n(A ∪ B) = n(A) + n(B) − n(A ∩ B)이다.", "a": "O", "w": "두 번 센 공통 부분을 한 번 빼 준다.", "t": "유한집합의 원소의 개수", "id": "m2-17-01", "f": 17}, {"k": "ox", "q": "두 집합 A, B가 서로소이면 n(A ∪ B) = n(A) + n(B)이다.", "a": "O", "w": "n(A ∩ B) = 0이기 때문이다.", "t": "유한집합의 원소의 개수", "id": "m2-17-02", "f": 17}, {"k": "ox", "q": "두 집합 A, B에 대하여 n(A − B) = n(A) − n(B)가 항상 성립한다.", "a": "X", "w": "n(A − B) = n(A) − n(A ∩ B)이다. B ⊂ A일 때만 n(A) − n(B)와 같다.", "t": "유한집합의 원소의 개수", "id": "m2-17-03", "f": 17}, {"k": "c3", "q": "n(A) = 7, n(B) = 5, n(A ∩ B) = 3일 때 n(A ∪ B)는?", "a": "9", "c": ["9", "12", "15"], "w": "7 + 5 − 3 = 9", "t": "유한집합의 원소의 개수", "id": "m2-17-04", "f": 17}, {"k": "ox", "q": "전체집합 U의 부분집합 A에 대하여 n(Aᶜ) = n(U) − n(A)이다.", "a": "O", "w": "여집합은 전체에서 A를 뺀 것이다.", "t": "유한집합의 원소의 개수", "id": "m2-17-05", "f": 17}, {"k": "ox", "q": "n(A) = 5, n(B) = 3이면 n(A ∩ B)의 최댓값은 3이다.", "a": "O", "w": "A ∩ B ⊂ B이므로 n(A ∩ B) ≤ 3이다. B ⊂ A일 때 3이 된다.", "t": "원소의 개수의 최댓값·최솟값", "id": "m2-17-06", "f": 17}, {"k": "c3", "q": "n(U) = 20인 전체집합 U의 두 부분집합 A, B에서 n(A) = 12, n(B) = 15일 때, n(A ∩ B)의 최솟값은?", "a": "7", "c": ["7", "3", "12"], "w": "n(A ∪ B) ≤ 20이므로 n(A ∩ B) = 12 + 15 − n(A ∪ B) ≥ 7", "t": "원소의 개수의 최댓값·최솟값", "id": "m2-17-07", "f": 17}, {"k": "ox", "q": "n(A ∪ B ∪ C) = n(A) + n(B) + n(C) − n(A ∩ B ∩ C)가 항상 성립한다.", "a": "X", "w": "두 개씩 겹친 부분을 빼고 셋 다 겹친 부분을 다시 더한다. n(A) + n(B) + n(C) − n(A∩B) − n(B∩C) − n(C∩A) + n(A∩B∩C)", "t": "유한집합의 원소의 개수", "id": "m2-17-08", "f": 17}, {"k": "ox", "q": "n(A) = n(B)이면 항상 A = B이다.", "a": "X", "w": "{1, 2}와 {3, 4}처럼 개수가 같아도 원소가 다를 수 있다.", "t": "부분집합과 서로 같은 집합", "id": "m2-17-09", "f": 17}]};
const sb=(typeof supabase!=='undefined')?supabase.createClient(SB_URL,SB_ANON):null;
const E=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#x27;');
const $=id=>document.getElementById(id);

let TOK='', DEMO=false, NAME='', BAN='';
let ONLY=null;                 // &f= 로 좁힌 층 번호 Set
const REC={};                  // 문항ID → {o:정오, c:'확실'|'애매', n:시도수}  (가장 최근 시도)
const ITEMS={}; BANK.items.forEach(x=>ITEMS[x.id]=x);
const BYF={}; BANK.items.forEach(x=>(BYF[x.f]=BYF[x.f]||[]).push(x));

/* ── 기기 임시 저장: 못 보낸 기록 대기열 + 로컬 기록(사생활 모드면 조용히 포기) ── */
const LK=k=>'tower:'+BANK.set+':'+(DEMO?'demo':TOK.slice(0,8))+':'+k;
const lget=(k,d)=>{ try{ const v=localStorage.getItem(LK(k)); return v?JSON.parse(v):d; }catch(e){ return d; } };
const lset=(k,v)=>{ try{ localStorage.setItem(LK(k),JSON.stringify(v)); }catch(e){} };

function floorsShown(){ return BANK.floors.filter(f=>!ONLY||ONLY.has(f.no)); }
function stat(fno){
  const its=BYF[fno]||[]; let done=0,ok=0,sure=0;
  its.forEach(x=>{ const r=REC[x.id]; if(!r) return; done++; if(r.o){ ok++; if(r.c==='확실') sure++; } });
  const stars = done<its.length ? 0 : (ok===its.length ? (sure===its.length?3:2) : (ok*2>=its.length?1:0));
  return {n:its.length,done,ok,sure,stars};
}
const starStr=s=>'★'.repeat(s)+'<span style="opacity:.25">'+'★'.repeat(3-s)+'</span>';

/* ── 탑 화면 ── */
function drawTower(){
  const fs=floorsShown();
  let tot=0,ok=0,sure=0,clear=0,nextNo=null;
  fs.forEach(f=>{ const s=stat(f.no); tot+=s.n; ok+=s.ok; sure+=s.sure; if(s.stars>=2) clear++;
    if(nextNo==null && s.stars<2) nextNo=f.no; });
  const H=[];
  H.push(`<div class="brand">수학은유강</div>`
    +`<div class="who"><b>${E(NAME)}</b>${BAN?`<span class="ban">${E(BAN)}</span>`:''}</div>`
    +`<div class="title"><b>개념의 탑</b> · ${E(BANK.범위)}${ONLY?' · 오늘 범위':''}</div>`
    +`<div class="sum"><div><b>${clear}<small style="font-size:12px;color:var(--dim)">/${fs.length}</small></b><span>오른 층</span></div>`
    +`<div><b>${sure}</b><span>확실히 아는 개념</span></div>`
    +`<div><b>${ok}<small style="font-size:12px;color:var(--dim)">/${tot}</small></b><span>맞힌 개념</span></div></div>`
    +`<div class="guide">층마다 교과서 개념을 OX로 확인해요. 막히면 층마다 있는 <b>개념 정리</b>를 펼쳐 봐요.<br> 답을 고르고 <b>확실해요 / 애매해요</b>까지 눌러야 채점돼요.<br>`
    +`모두 맞히면 ★★, 전부 <b>확실하게</b> 맞히면 ★★★. 틀려도 떨어지지 않아요. 해설 읽고 다시 오르면 돼요.</div>`);
  let lastUnit='';
  // 탑이니까 위층이 위에 오게 — 단원 안에서는 거꾸로, 단원도 거꾸로
  [...fs].reverse().forEach(f=>{
    if(f.unit!==lastUnit){ H.push(`<div class="unit">${E(f.unit)}</div>`); lastUnit=f.unit; }
    const s=stat(f.no);
    const st = s.done===0 ? '<span class="st new">도전 전</span>'
      : s.done<s.n ? `<span class="st new">${s.done}/${s.n}</span>`
      : `<span class="st">${starStr(s.stars)}</span>`;
    const cls = (s.stars>=2?' clear':'')+(f.no===nextNo?' nextf':'');
    H.push(`<button class="fl${cls}" data-f="${f.no}"><span class="no">${f.no}F</span>`
      +`<span class="nm">${E(f.name)}<small>${s.n}문항${f.no===nextNo?' · 다음 층':''}</small></span>${st}</button>`);
  });
  H.push(`<div class="foot">${DEMO?'<b>미리보기</b>예요. 기록이 저장되지 않아요.<br>'
    :`이 주소는 ${E(NAME)} 개인 링크예요. 다른 사람에게 전달하지 마세요.<br>`}`
    +`점수는 성적이랑 상관없어요. 쌤은 <b>어느 개념이 애매한지</b>만 봐요. 그걸로 다음 수업을 준비해요.</div>`);
  $('app').innerHTML=H.join('');
  $('app').querySelectorAll('.fl').forEach(b=>b.onclick=()=>startFloor(+b.dataset.f,null));
  window.scrollTo(0,0);
}

/* ── 개념 정리 카드 (교과서 정리 상자) ── */
function cardHTML(F){
  return `<div class="cbox"><div class="ct">개념 정리 · ${E(F.name)}</div>`
    +F.card.map(([t,x])=>`<div class="cl"><em class="${t==='주의'?'ju':''}">${E(t)}</em><span>${E(x)}</span></div>`).join('')+`</div>`;
}

/* ── 층 풀기 ── */
let PLAY=null;   // {f, list:[item], i, pick, t0, out:[row]}
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function startFloor(fno, onlyIds){
  let list=BYF[fno]||[];
  if(onlyIds) list=list.filter(x=>onlyIds.includes(x.id));
  PLAY={f:fno, list:shuffle(list).map(x=>({...x, cs: x.k==='c3'?shuffle(x.c):['O','X']})), i:0, out:[], retry:!!onlyIds, pre:false};
  if(onlyIds) drawQ(); else drawIntro();
}
/* 층 입구 — 개념 정리는 접어 둔다. 먼저 읽으면 첫 시도가 '읽고 푼 것'으로 기록된다(카드=1). */
function drawIntro(){
  const P=PLAY, F=BANK.floors.find(f=>f.no===P.f);
  $('app').innerHTML=
    `<div class="top"><button class="back" id="back">← 탑</button><div class="fname"><b>${P.f}F</b> ${E(F.unit)}</div></div>`
    +`<div class="intro"><h2>${E(F.name)}</h2><div class="sub">${P.list.length}문항 · 답을 고르고 확실해요/애매해요까지 누르면 채점돼요</div>`
    +`<div id="cardhost"><button class="cardbtn" id="pre" style="margin:0 0 14px">개념 정리 먼저 읽기</button></div>`
    +`<div class="btns"><button class="p" id="start">풀기 시작</button></div></div>`;
  $('back').onclick=drawTower;
  $('pre').onclick=()=>{ P.pre=true; $('cardhost').innerHTML=cardHTML(F); };
  $('start').onclick=drawQ;
  window.scrollTo(0,0);
}
function drawQ(){
  const P=PLAY, x=P.list[P.i], F=BANK.floors.find(f=>f.no===P.f);
  P.pick=null; P.t0=Date.now();
  const dots=P.list.map((y,j)=>{ const r=P.out[j]; return `<i class="${r?(r.o?'o':'x'):''}${j===P.i?' cur':''}"></i>`; }).join('');
  const opts = x.k==='ox'
    ? `<div class="ox">${x.cs.map(c=>`<button data-v="${c}">${c}</button>`).join('')}</div>`
    : `<div class="ch">${x.cs.map(c=>`<button data-v="${E(c)}">${E(c)}</button>`).join('')}</div>`;
  $('app').innerHTML=
    `<div class="top"><button class="back" id="back">← 탑</button><div class="fname"><b>${P.f}F</b> ${E(F.name)}${P.retry?' · 다시':''}</div></div>`
    +`<div class="dots">${dots}</div>`
    +`<div class="qcard"><div class="kind">${P.i+1} / ${P.list.length} · ${x.k==='ox'?'맞으면 O, 틀리면 X':'알맞은 것을 고르세요'}</div><div class="q">${E(x.q)}</div></div>`
    +opts
    +`<div class="conf" id="conf"><p>이 답, 얼마나 자신 있어요?</p><div class="row2"><button class="sure" data-c="확실">확실해요</button><button class="unsure" data-c="애매">애매해요</button></div></div>`
    +`<div class="res" id="res"></div>`
    +`<button class="next" id="next">${P.i+1<P.list.length?'다음 →':'이 층 결과 보기'}</button>`;
  $('back').onclick=()=>{ if(P.out.length) finishFloor(true); else drawTower(); };
  const bs=$('app').querySelectorAll('.ox button,.ch button');
  bs.forEach(b=>b.onclick=()=>{
    if(P.graded) return;
    P.pick=b.dataset.v; bs.forEach(y=>y.classList.toggle('on',y===b));
    $('conf').classList.add('show');
  });
  $('conf').querySelectorAll('button').forEach(b=>b.onclick=()=>grade(b.dataset.c));
  $('next').onclick=()=>{ P.graded=false; P.i++; if(P.i<P.list.length) drawQ(); else finishFloor(false); };
  P.graded=false;
  window.scrollTo(0,0);
}
function grade(conf){
  const P=PLAY, x=P.list[P.i];
  if(P.graded||P.pick==null) return;
  P.graded=true;
  // data-v 는 E() 로 넣었다가 dataset 이 되돌려 준다 — 원문과 그대로 비교된다
  const o = P.pick===x.a;
  const prev=REC[x.id];
  const row={i:x.id, f:x.f, a:P.pick, o, c:conf, ms:Math.min(Date.now()-P.t0, 600000), n:(prev?prev.n:0)+1, k:P.pre?1:0};
  P.out.push(row); REC[x.id]={o, c:conf, n:row.n};
  $('app').querySelectorAll('.ox button,.ch button').forEach(b=>{
    b.disabled=true; b.classList.remove('on');
    if(b.dataset.v===x.a) b.classList.add('right'); else if(b.dataset.v===P.pick) b.classList.add('wrong');
  });
  $('conf').classList.remove('show');
  const F=BANK.floors.find(f=>f.no===P.f);
  const head = o ? (conf==='확실'?'맞았어요!':'맞았어요. 애매했다면 해설로 굳혀요') : '아쉬워요. 정답은 '+(x.k==='ox'?x.a:'「'+x.a+'」')+'예요';
  const r=$('res'); r.className='res show '+(o?'o':'x');
  r.innerHTML=`<div class="h">${E(head)}</div><div class="w">${E(x.w)}</div>`
    +`<div id="cardhost"><button class="cardbtn" id="cardbtn">${(!o||conf==='애매')?'개념 정리 다시 보기':'개념 정리 보기'}</button></div>`;
  $('cardbtn').onclick=()=>{ row.k|=2; $('cardhost').innerHTML=cardHTML(F); };
  $('next').classList.add('show');
  const d=$('app').querySelectorAll('.dots i')[P.i]; if(d) d.className=o?'o cur':'x cur';
  lset('rec',REC);
}

/* ── 층 결과 + 보내기 ── */
async function finishFloor(quit){
  const P=PLAY, F=BANK.floors.find(f=>f.no===P.f), s=stat(P.f);
  const rows=P.out;
  const q=lget('queue',[]).concat(rows.map(r=>({...r,set:BANK.set})));
  lset('queue',q);
  const bad=P.list.filter(x=>{ const r=REC[x.id]; return r && (!r.o||r.c==='애매'); });
  const wrongN=P.list.filter(x=>REC[x.id]&&!REC[x.id].o).length;
  const H=[];
  H.push(`<div class="top"><button class="back" id="back">← 탑</button><div class="fname"><b>${P.f}F</b> ${E(F.name)}</div></div>`);
  H.push(`<div class="done"><div class="stars">${s.done<s.n?'':starStr(s.stars)}</div>`
    +`<b>${quit?'여기까지 저장할게요':s.stars===3?'완벽해요! 이 층 정복':s.stars===2?'다 맞았어요!':'이 층 한 바퀴 끝'}</b>`
    +`<p>이 층 ${s.n}문항 중 <b style="display:inline;font-size:inherit;color:var(--ok)">${s.ok}</b>개 맞힘 · 확실하게 맞힘 ${s.sure}개</p>`
    +`<div class="save" id="save">${DEMO?'미리보기라 저장하지 않아요':'기록 보내는 중…'}</div></div>`);
  if(bad.length){
    H.push(`<div class="list">`+bad.map(x=>{ const r=REC[x.id];
      return `<div class="${r.o?'lu':'lx'}"><em>${r.o?'애매':'틀림'}</em>${E(x.q)}</div>`; }).join('')+`</div>`);
  }
  H.push(`<div class="btns">`
    +(bad.length?`<button class="p" id="redo">틀리거나 애매한 ${bad.length}개 다시 풀기</button>`:'')
    +(s.stars>=2 && nextFloor(P.f)?`<button class="${bad.length?'s':'p'}" id="go">다음 층(${nextFloor(P.f)}F) 오르기 →</button>`:'')
    +`<button class="s" id="tower">탑으로</button></div>`);
  $('app').innerHTML=H.join('');
  window.scrollTo(0,0);
  $('back').onclick=$('tower').onclick=()=>drawTower();
  if($('redo')) $('redo').onclick=()=>startFloor(P.f, bad.map(x=>x.id));
  if($('go')) $('go').onclick=()=>startFloor(nextFloor(P.f),null);
  const ok=await flush();
  const el=$('save'); if(!el||DEMO) return;
  if(ok){ el.textContent='기록 저장됨 ✓'; }
  else { el.textContent='지금은 저장이 안 됐어요. 기기에 남겨 두고 다음에 열 때 다시 보낼게요.'; el.className='save bad'; }
}
function nextFloor(f){ const fs=floorsShown().map(x=>x.no); const i=fs.indexOf(f); return i>=0&&i+1<fs.length?fs[i+1]:null; }

/* 대기열을 서버로. 30행씩. 성공한 만큼만 지운다. */
async function flush(){
  if(DEMO){ lset('queue',[]); return true; }
  let q=lget('queue',[]);
  while(q.length){
    const chunk=q.slice(0,30);
    let data,err;
    try{ ({data,error:err}=await sb.rpc('tower_submit',{tok:TOK, skey:BANK.set,
      recs:chunk.map(r=>({i:r.i,f:r.f,a:r.a,o:r.o,c:r.c,ms:r.ms,n:r.n,k:r.k||0}))})); }
    catch(e){ err=e; }
    if(err||!data||!data.ok) return false;
    q=q.slice(chunk.length); lset('queue',q);
  }
  return true;
}

function say(t,s){ $('msg').innerHTML=`<b>${E(t)}</b>${E(s||'')}`; $('msg').style.display=''; $('app').style.display='none'; }

(async()=>{
  const p=new URLSearchParams(location.search);
  TOK=p.get('t')||''; DEMO=p.get('demo')==='1';
  const fq=p.get('f');
  if(fq){ const S=new Set(); fq.split(',').forEach(t=>{ const m=t.trim().match(/^(\d+)(?:-(\d+))?$/); if(!m) return;
    const a=+m[1], b=m[2]?+m[2]:a; for(let k=Math.min(a,b);k<=Math.max(a,b);k++) S.add(k); });
    if(S.size) ONLY=S; }
  if(DEMO){ NAME='미리보기'; Object.assign(REC, lget('rec',{})); }
  else{
    if(!TOK) return say('링크가 올바르지 않아요.','포털에서 [개념의 탑]을 눌러 들어와 주세요~');
    if(!sb) return say('지금은 열 수 없어요.','잠시 뒤에 다시 열어 주세요.');
    let data,err;
    try{ ({data,error:err}=await sb.rpc('tower_open',{tok:TOK, skey:BANK.set})); }
    catch(e){ err=e; }
    if(err) return say('지금은 열 수 없어요.','잠시 뒤에 다시 열어 주세요. 계속 이러면 쌤한테 알려 주세요~');
    if(!data) return say('만료되었거나 잘못된 링크예요.','새 링크가 필요하면 쌤한테 말해 주세요~');
    NAME=data.이름||''; BAN=data.반||'';
    // 서버 기록(다른 기기 포함) 위에 이 기기에서 아직 못 보낸 것을 얹는다
    Object.assign(REC, data.기록||{});
    lget('queue',[]).forEach(r=>{ REC[r.i]={o:r.o,c:r.c,n:r.n}; });
    flush();
  }
  $('msg').style.display='none'; $('app').style.display='';
  drawTower();
})();
