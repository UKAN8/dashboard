<style>
:root{color-scheme:dark;
 --bg:#0a0a0f; --card:rgba(255,255,255,.03); --bd:rgba(255,255,255,.08);
 --tx:#f5f5fa; --tx2:#b8b8c5; --dim:#8a8a98; --acc:#f5a0a0; --ok:#c8f0da; --okb:#7ee0a3;
 --no:#ff8fa8; --gold:#e8c56a; --mid:#f0d58a;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{max-width:100%;overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--tx);
 font:15px/1.6 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;
 padding:18px clamp(12px,4vw,28px) calc(40px + env(safe-area-inset-bottom))}
main{max-width:620px;margin:0 auto}
button{font:inherit;cursor:pointer}
.brand{font-weight:800;color:var(--acc);font-size:15px;letter-spacing:.02em}
.who{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin:6px 0 2px}
.who b{font-size:23px}
.who .ban{font-size:12px;color:var(--acc);background:rgba(245,160,160,.12);padding:2px 9px;border-radius:9px}
.title{font-size:13px;color:var(--tx2);margin-bottom:14px}
.title b{color:var(--gold)}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 18px}
.sum div{background:var(--card);border:1px solid var(--bd);border-radius:13px;padding:10px 8px;text-align:center}
.sum b{display:block;font-size:20px;line-height:1.2}
.sum span{font-size:11px;color:var(--dim)}
.guide{color:var(--dim);font-size:12.5px;margin:-8px 0 16px;line-height:1.7}
.guide b{color:var(--tx2)}
.unit{font-size:11px;letter-spacing:.16em;color:var(--dim);margin:16px 2px 6px}
.fl{display:flex;align-items:center;gap:11px;width:100%;text-align:left;color:var(--tx);
 background:var(--card);border:1px solid var(--bd);border-radius:13px;padding:11px 13px;margin-bottom:7px}
.fl .no{flex:none;width:40px;font-weight:800;color:var(--acc);font-size:15px}
.fl .nm{flex:1;min-width:0;overflow-wrap:anywhere;font-size:14.5px}
.fl .nm small{display:block;color:var(--dim);font-size:11.5px}
.fl .st{flex:none;font-size:13px;color:var(--gold);letter-spacing:.05em}
.fl .st.new{color:var(--dim);font-size:12px;letter-spacing:0}
.fl.clear{border-color:rgba(232,197,106,.35)}
.fl.nextf{border-color:rgba(245,160,160,.55);background:rgba(245,160,160,.07)}
@media (hover:hover) and (pointer:fine){ .fl:hover{border-color:rgba(245,160,160,.4)} }
.foot{color:var(--dim);font-size:11.5px;line-height:1.7;margin-top:26px;border-top:1px solid var(--bd);padding-top:14px}
.msg{color:var(--dim);font-size:14px;padding:40px 2px}
.msg b{display:block;color:var(--tx);font-size:16px;margin-bottom:6px}
/* 풀이 화면 */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.back{background:none;border:1px solid var(--bd);color:var(--tx2);border-radius:10px;padding:6px 12px;font-size:13px}
.fname{font-size:13px;color:var(--tx2);text-align:right;min-width:0;overflow-wrap:anywhere}
.fname b{color:var(--acc)}
.dots{display:flex;gap:5px;margin:6px 0 16px;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.12)}
.dots i.o{background:var(--okb)} .dots i.x{background:var(--no)} .dots i.cur{outline:2px solid var(--acc);outline-offset:1px}
.qcard{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px 16px;margin-bottom:14px}
.qcard .kind{font-size:11px;letter-spacing:.14em;color:var(--acc);margin-bottom:8px}
.qcard .q{font-size:17px;line-height:1.75;font-weight:600;overflow-wrap:anywhere;word-break:keep-all}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.ox button{font-size:30px;font-weight:800;padding:14px 0;border-radius:14px;border:1px solid var(--bd);
 background:rgba(255,255,255,.035);color:var(--tx2)}
.ch{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.ch button{text-align:left;font-size:15px;padding:12px 14px;border-radius:12px;border:1px solid var(--bd);
 background:rgba(255,255,255,.035);color:var(--tx2);overflow-wrap:anywhere}

.ox button.right,.ch button.right{background:rgba(126,224,163,.14);border-color:rgba(126,224,163,.55);color:var(--ok)}

.conf .sure{background:var(--acc);color:#1a0d12}
.conf .unsure{background:rgba(255,255,255,.08);color:var(--tx)}
.res{display:none;border-radius:14px;padding:14px 15px;margin-bottom:12px;border:1px solid var(--bd)}
.res.show{display:block}
.res.o{background:rgba(126,224,163,.07);border-color:rgba(126,224,163,.3)}
.res.x{background:rgba(255,143,168,.07);border-color:rgba(255,143,168,.3)}
.res .h{font-weight:800;font-size:16px;margin-bottom:4px}
.res.o .h{color:var(--ok)} .res.x .h{color:var(--no)}
.res .w{color:var(--tx);font-size:14.5px;line-height:1.7;overflow-wrap:anywhere;word-break:keep-all}
.cardbtn{margin-top:10px;background:none;border:1px solid rgba(232,197,106,.45);color:var(--gold);
 border-radius:10px;padding:7px 12px;font-size:13px;font-weight:700}
.cbox{background:rgba(232,197,106,.05);border:1px solid rgba(232,197,106,.28);border-radius:14px;padding:12px 14px;margin:10px 0 12px}
.cbox .ct{font-size:11px;letter-spacing:.14em;color:var(--gold);margin-bottom:8px}
.cbox .cl{display:flex;gap:9px;align-items:baseline;padding:6px 0;border-top:1px solid var(--bd)}
.cbox .cl:first-of-type{border-top:none}
.cbox .cl em{flex:none;font-style:normal;font-size:11px;font-weight:800;color:var(--gold);min-width:30px}
.cbox .cl em.ju{color:var(--no)}
.cbox .cl span{flex:1;min-width:0;font-size:14px;line-height:1.7;overflow-wrap:anywhere;word-break:keep-all}
.intro{padding:6px 0}
.intro h2{font-size:22px;margin:4px 0 2px}
.intro .sub{color:var(--tx2);font-size:13px;margin-bottom:14px}
.next{width:100%;padding:14px;border-radius:13px;border:none;background:var(--acc);color:#1a0d12;font-weight:800;font-size:15px;display:none}
.next.show{display:block}
/* 층 결과 */
.done{text-align:center;padding:26px 6px 10px}
.done .stars{font-size:40px;letter-spacing:.1em;color:var(--gold);line-height:1.2}
.done .stars .off{color:rgba(255,255,255,.14)}
.done b{display:block;font-size:20px;margin:10px 0 4px}
.done p{color:var(--tx2);font-size:14px;margin:0 0 6px}
.done .save{font-size:12px;color:var(--dim);margin-bottom:16px}
.done .save.bad{color:var(--no)}
.list{text-align:left;margin:10px 0 16px}
.list div{font-size:13.5px;padding:9px 12px;border:1px solid var(--bd);border-radius:11px;margin-bottom:6px;color:var(--tx2);overflow-wrap:anywhere}
.list div em{font-style:normal;font-size:11px;margin-right:6px;padding:1px 7px;border-radius:7px}
.list .lx em{background:rgba(255,143,168,.16);color:var(--no)}
.list .lu em{background:rgba(240,213,138,.14);color:var(--mid)}
.btns{display:flex;flex-direction:column;gap:9px}
.btns button{padding:13px;border-radius:13px;font-weight:800;font-size:15px;border:none}
.btns .p{background:var(--acc);color:#1a0d12}
.btns .s{background:rgba(255,255,255,.08);color:var(--tx)}
.katex{font-size:1.04em}
.katex .mpunct{margin-right:.16em}
.ch button .katex{font-size:1em}
.olink{display:block;margin-top:10px;color:var(--acc);text-decoration:none;font-weight:700}
</style></head>

<script>

const SB_URL='https://bkgerndnwukvuuqdgnxt.supabase.co';

const BANK={"set": "g1m2_fin", "제목": "개념의 탑 · 고1 공통수학2 기말", "범위": "명제 ~ 무리함수", "floors": [{"no": 1, "unit": "명제", "name": "명제와 조건", "card": [["뜻", "참인지 거짓인지를 분명하게 판별할 수 있는 문장이나 식을 명제, 변수의 값에 따라 참, 거짓이 달라지는 문장이나 식을 조건이라 한다."], ["뜻", "전체집합 $U$의 원소 중 조건 $p$를 참이 되게 하는 모든 원소의 집합을 $p$의 진리집합이라 한다. ‘$p$가 아니다’를 $p$의 부정이라 하고 $\\sim p$로 나타낸다."], ["정리", "조건 $p$, $q$의 진리집합이 $P$, $Q$일 때 $\\sim p$의 진리집합은 $P^{C}$, ‘$p$ 또는 $q$’는 $P\\cup Q$, ‘$p$ 그리고 $q$’는 $P\\cap Q$이다. $\\sim(\\sim p)=p$"], ["정리", "‘$p$ 또는 $q$’의 부정은 ‘$\\sim p$ 그리고 $\\sim q$’, ‘$p$ 그리고 $q$’의 부정은 ‘$\\sim p$ 또는 $\\sim q$’이다."], ["주의", "‘$x\\ge a$’의 부정은 ‘$x<a$’, ‘$=$’의 부정은 ‘$\\ne$’이다. 등호는 한쪽에만 붙는다."]], "n": 10}, {"no": 2, "unit": "명제", "name": "명제의 참과 거짓", "card": [["뜻", "명제 ‘$p$이면 $q$이다.’를 $p\\to q$로 나타내고 $p$를 가정, $q$를 결론이라 한다."], ["정리", "$P\\subset Q$이면 $p\\to q$는 참이고, $P\\not\\subset Q$이면 거짓이다."], ["방법", "거짓임을 보일 때는 반례 하나를 든다. 반례는 $P$에는 속하고 $Q$에는 속하지 않는 원소, 곧 $P-Q$의 원소이다."], ["정리", "‘모든 $x$에 대하여 $p$이다.’는 $P=U$이면 참, ‘어떤 $x$에 대하여 $p$이다.’는 $P\\ne\\varnothing$이면 참이다."], ["정리", "‘모든 $x$에 대하여 $p$이다.’의 부정은 ‘어떤 $x$에 대하여 $\\sim p$이다.’, ‘어떤 $x$에 대하여 $p$이다.’의 부정은 ‘모든 $x$에 대하여 $\\sim p$이다.’"]], "n": 10}, {"no": 3, "unit": "명제", "name": "명제의 역과 대우", "card": [["뜻", "명제 $p\\to q$에서 가정과 결론을 바꾼 $q\\to p$를 역, 가정과 결론을 바꾸고 각각 부정한 $\\sim q\\to\\sim p$를 대우라 한다."], ["정리", "명제 $p\\to q$가 참이면 그 대우 $\\sim q\\to\\sim p$도 참이다. ($P\\subset Q\\Longleftrightarrow Q^{C}\\subset P^{C}$) 명제와 대우의 참, 거짓은 같다."], ["주의", "명제가 참이라도 그 역은 참이 아닐 수 있다."], ["정리", "삼단논법: $p\\to q$, $q\\to r$가 모두 참이면 $p\\to r$도 참이다."]], "n": 10}, {"no": 4, "unit": "명제", "name": "충분조건과 필요조건", "card": [["뜻", "명제 $p\\to q$가 참일 때 $p\\Longrightarrow q$로 나타내고, $p$는 $q$이기 위한 충분조건, $q$는 $p$이기 위한 필요조건이라 한다."], ["뜻", "$p\\Longrightarrow q$이고 $q\\Longrightarrow p$일 때 $p\\Longleftrightarrow q$로 나타내고, $p$는 $q$이기 위한 필요충분조건이라 한다."], ["정리", "$P\\subset Q$이면 $p$는 $q$이기 위한 충분조건, $q$는 $p$이기 위한 필요조건이다. $P=Q$이면 필요충분조건이다."], ["방법", "화살표가 나가는 쪽이 충분조건, 들어오는 쪽이 필요조건이다. 진리집합에서는 작은 쪽이 충분조건, 큰 쪽이 필요조건이다."]], "n": 10}, {"no": 5, "unit": "명제", "name": "명제의 증명", "card": [["뜻", "용어의 뜻을 명확하게 정한 문장을 정의, 정의나 이미 알려진 성질로 명제가 참임을 밝히는 것을 증명, 참임이 증명된 명제 중 기본이 되는 것을 정리라 한다."], ["방법", "대우를 이용한 증명: $p\\to q$ 대신 대우 $\\sim q\\to\\sim p$가 참임을 보인다."], ["방법", "귀류법: 명제의 결론을 부정하면 가정이나 이미 알려진 사실에 모순이 생김을 보여 명제가 참임을 증명한다."], ["주의", "참임은 모든 경우에 성립함을 보여야 한다. 반례 하나로 보일 수 있는 것은 거짓임이다."]], "n": 9}, {"no": 6, "unit": "명제", "name": "절대부등식", "card": [["뜻", "문자에 어떤 실수를 대입해도 항상 성립하는 부등식을 절대부등식이라 한다."], ["정리", "$a$, $b$, $c$가 실수일 때 (1) $a^{2}\\pm 2ab+b^{2}\\ge 0$ (2) $a^{2}+b^{2}+c^{2}-ab-bc-ca\\ge 0$ (3) $|a|+|b|\\ge|a+b|$"], ["정리", "$a>0$, $b>0$일 때 $\\dfrac{a+b}{2}\\ge\\sqrt{ab}$ (등호는 $a=b$일 때 성립) — 산술평균과 기하평균의 관계"], ["방법", "$A\\ge B$를 보일 때는 $A-B\\ge 0$을 보인다. $A\\ge 0$, $B\\ge 0$이면 $A^{2}-B^{2}\\ge 0$을 보여도 된다."], ["방법", "양수 두 개의 합이 일정하면 곱의 최댓값, 곱이 일정하면 합의 최솟값을 산술평균과 기하평균의 관계로 구한다. 등호 조건을 꼭 확인한다."], ["참고", "$a$, $b$, $x$, $y$가 실수일 때 $(a^{2}+b^{2})(x^{2}+y^{2})\\ge(ax+by)^{2}$ (등호는 $ay=bx$일 때 성립)"]], "n": 10}, {"no": 7, "unit": "함수", "name": "함수의 뜻", "card": [["뜻", "두 집합 $X$, $Y$에 대하여 $X$의 각 원소에 $Y$의 원소가 오직 하나씩 대응할 때, 이 대응을 $X$에서 $Y$로의 함수라 하고 $f:X\\to Y$로 나타낸다."], ["뜻", "$X$를 정의역, $Y$를 공역, 함숫값 전체의 집합 $\\{f(x)\\mid x\\in X\\}$를 치역이라 한다. 치역은 공역의 부분집합이다."], ["정리", "두 함수 $f$, $g$는 정의역과 공역이 각각 같고 정의역의 모든 원소 $x$에 대하여 $f(x)=g(x)$일 때 서로 같다고 하고 $f=g$로 나타낸다."], ["뜻", "함수 $f:X\\to Y$의 그래프는 $\\{(x,\\ f(x))\\mid x\\in X\\}$이다."], ["참고", "정의역의 각 원소 $a$에서 $y$축에 평행한 직선 $x=a$를 그으면 함수의 그래프와 오직 한 점에서 만난다. 정의역이 주어지지 않으면 $f(x)$가 정의되는 실수 전체를 정의역으로 한다."]], "n": 10}, {"no": 8, "unit": "함수", "name": "여러 가지 함수", "card": [["뜻", "일대일함수: 정의역의 두 원소 $x_{1}$, $x_{2}$에 대하여 $x_{1}\\ne x_{2}$이면 $f(x_{1})\\ne f(x_{2})$인 함수"], ["뜻", "일대일대응: 일대일함수이고 치역과 공역이 같은 함수"], ["뜻", "항등함수: $X$에서 $X$로의 함수 $f(x)=x$ ($I$로 나타낸다). 상수함수: 정의역의 모든 원소에 공역의 한 원소만 대응하는 함수 $f(x)=c$"], ["참고", "$n(X)=n(Y)=n$일 때 $X$에서 $Y$로의 함수는 $n^{n}$개, 일대일대응은 $n\\times(n-1)\\times\\cdots\\times 1$개이다."]], "n": 10}, {"no": 9, "unit": "함수", "name": "합성함수", "card": [["뜻", "두 함수 $f:X\\to Y$, $g:Y\\to Z$에 대하여 $X$의 각 원소 $x$에 $g(f(x))$를 대응시키는 함수를 $f$와 $g$의 합성함수라 하고 $g\\circ f$로 나타낸다. $(g\\circ f)(x)=g(f(x))$"], ["주의", "일반적으로 $g\\circ f\\ne f\\circ g$이다. 교환법칙이 성립하지 않는다."], ["정리", "$h\\circ(g\\circ f)=(h\\circ g)\\circ f$ (결합법칙), $f\\circ I=I\\circ f=f$"]], "n": 9}, {"no": 10, "unit": "함수", "name": "역함수", "card": [["뜻", "함수 $f:X\\to Y$가 일대일대응일 때 $Y$의 각 원소 $y$에 $f(x)=y$인 $X$의 원소 $x$를 대응시키는 함수를 $f$의 역함수라 하고 $f^{-1}:Y\\to X$로 나타낸다."], ["정리", "역함수가 존재할 조건은 $f$가 일대일대응인 것이다. $y=f(x)\\Longleftrightarrow x=f^{-1}(y)$"], ["방법", "역함수 구하기: ① 일대일대응인지 확인 ② $y=f(x)$를 $x$에 대하여 푼다 ③ $x$와 $y$를 바꾼다 ④ $f^{-1}$의 정의역은 $f$의 치역이다."], ["주의", "$f^{-1}(x)$는 $\\dfrac{1}{f(x)}$이 아니다."]], "n": 9}, {"no": 11, "unit": "함수", "name": "역함수의 성질과 그래프", "card": [["정리", "$f:X\\to Y$의 역함수 $f^{-1}$에 대하여 $(f^{-1})^{-1}=f$, $(f^{-1}\\circ f)(x)=x$ $(x\\in X)$, $(f\\circ f^{-1})(y)=y$ $(y\\in Y)$"], ["정리", "두 함수 $f$, $g$의 역함수가 존재하면 $(g\\circ f)^{-1}=f^{-1}\\circ g^{-1}$"], ["정리", "함수 $y=f(x)$의 그래프와 그 역함수 $y=f^{-1}(x)$의 그래프는 직선 $y=x$에 대하여 대칭이다."], ["주의", "두 그래프의 교점이 모두 직선 $y=x$ 위에 있는 것은 아니다. $f$가 증가하는 함수일 때 $y=x$와의 교점을 구하면 된다."]], "n": 9}, {"no": 12, "unit": "유리함수", "name": "유리식", "card": [["뜻", "두 다항식 $A$, $B$ $(B\\ne 0)$에 대하여 $\\dfrac{A}{B}$ 꼴로 나타낼 수 있는 식을 유리식이라 한다. 다항식도 유리식이다."], ["정리", "$\\dfrac{A}{B}=\\dfrac{A\\times C}{B\\times C}$, $\\dfrac{A}{B}=\\dfrac{A\\div C}{B\\div C}$ (단, $C\\ne 0$)"], ["정리", "$\\dfrac{A}{C}+\\dfrac{B}{C}=\\dfrac{A+B}{C}$, $\\dfrac{A}{B}\\times\\dfrac{C}{D}=\\dfrac{AC}{BD}$, $\\dfrac{A}{B}\\div\\dfrac{C}{D}=\\dfrac{AD}{BC}$"], ["방법", "부분분수: $\\dfrac{1}{AB}=\\dfrac{1}{B-A}\\left(\\dfrac{1}{A}-\\dfrac{1}{B}\\right)$ (단, $A\\ne B$)"]], "n": 9}, {"no": 13, "unit": "유리함수", "name": "유리함수 $y=\\dfrac{k}{x}$의 그래프", "card": [["뜻", "함수 $y=f(x)$에서 $f(x)$가 $x$에 대한 유리식일 때 유리함수라 한다. 정의역이 주어지지 않으면 분모가 $0$이 되지 않는 실수 전체를 정의역으로 한다."], ["정리", "$y=\\dfrac{k}{x}$ $(k\\ne 0)$의 정의역과 치역은 모두 $0$을 제외한 실수 전체의 집합이다."], ["정리", "$k>0$이면 그래프는 제1, 3사분면, $k<0$이면 제2, 4사분면에 있다. 원점, 직선 $y=x$, $y=-x$에 대하여 대칭이다."], ["정리", "점근선은 $x$축과 $y$축이다. $|k|$가 클수록 그래프는 원점에서 멀어진다."]], "n": 10}, {"no": 14, "unit": "유리함수", "name": "유리함수 $y=\\dfrac{k}{x-p}+q$의 그래프", "card": [["정리", "$y=\\dfrac{k}{x-p}+q$ $(k\\ne 0)$의 그래프는 $y=\\dfrac{k}{x}$의 그래프를 $x$축의 방향으로 $p$만큼, $y$축의 방향으로 $q$만큼 평행이동한 것이다."], ["정리", "정의역은 $\\{x\\mid x\\ne p$인 실수$\\}$, 치역은 $\\{y\\mid y\\ne q$인 실수$\\}$, 점근선은 두 직선 $x=p$, $y=q$이다."], ["정리", "그래프는 점 $(p,\\ q)$와 두 직선 $y=(x-p)+q$, $y=-(x-p)+q$에 대하여 대칭이다."], ["방법", "$y=\\dfrac{ax+b}{cx+d}$ $(c\\ne 0,\\ ad-bc\\ne 0)$는 분자를 분모로 나누어 $y=\\dfrac{k}{x-p}+q$ 꼴로 바꾼다. 점근선은 $x=-\\dfrac{d}{c}$, $y=\\dfrac{a}{c}$이다."]], "n": 9}, {"no": 15, "unit": "무리함수", "name": "무리식", "card": [["뜻", "근호 안에 문자를 포함한 식 중에서 유리식으로 나타낼 수 없는 식을 무리식이라 한다."], ["정리", "무리식의 값이 실수가 되려면 (근호 안의 식) $\\ge 0$, 분모에 있으면 (분모) $\\ne 0$이어야 한다."], ["정리", "$a\\ge 0$, $b\\ge 0$일 때 $\\sqrt{a}\\sqrt{b}=\\sqrt{ab}$, $a\\ge 0$, $b>0$일 때 $\\dfrac{\\sqrt{a}}{\\sqrt{b}}=\\sqrt{\\dfrac{a}{b}}$"], ["방법", "분모의 유리화: $\\dfrac{1}{\\sqrt{a}+\\sqrt{b}}=\\dfrac{\\sqrt{a}-\\sqrt{b}}{a-b}$ (단, $a\\ne b$)"], ["주의", "$\\sqrt{a^{2}}=|a|$이다. $\\sqrt{a+b}\\ne\\sqrt{a}+\\sqrt{b}$"]], "n": 9}, {"no": 16, "unit": "무리함수", "name": "무리함수 $y=\\pm\\sqrt{ax}$의 그래프", "card": [["뜻", "함수 $y=f(x)$에서 $f(x)$가 $x$에 대한 무리식일 때 무리함수라 한다. 정의역이 주어지지 않으면 근호 안의 식의 값이 $0$ 이상인 실수 전체를 정의역으로 한다."], ["정리", "$y=\\sqrt{ax}$ $(a\\ne 0)$: $a>0$이면 정의역 $\\{x\\mid x\\ge 0\\}$, $a<0$이면 정의역 $\\{x\\mid x\\le 0\\}$이고 치역은 $\\{y\\mid y\\ge 0\\}$이다."], ["정리", "$y=\\sqrt{ax}$의 그래프를 $x$축에 대하여 대칭이동하면 $y=-\\sqrt{ax}$, $y$축에 대하여 대칭이동하면 $y=\\sqrt{-ax}$, 원점에 대하여 대칭이동하면 $y=-\\sqrt{-ax}$이다."], ["참고", "$|a|$의 값이 클수록 그래프는 $x$축에서 멀어진다."]], "n": 10}, {"no": 17, "unit": "무리함수", "name": "무리함수 $y=\\sqrt{a(x-p)}+q$의 그래프", "card": [["정리", "$y=\\sqrt{a(x-p)}+q$의 그래프는 $y=\\sqrt{ax}$의 그래프를 $x$축의 방향으로 $p$만큼, $y$축의 방향으로 $q$만큼 평행이동한 것이다. 그래프는 점 $(p,\\ q)$에서 시작한다."], ["정리", "$a>0$이면 정의역 $\\{x\\mid x\\ge p\\}$, $a<0$이면 정의역 $\\{x\\mid x\\le p\\}$이고 치역은 $\\{y\\mid y\\ge q\\}$이다."], ["방법", "$y=\\sqrt{ax+b}+c$는 $y=\\sqrt{a\\left(x+\\dfrac{b}{a}\\right)}+c$ 꼴로 바꾸어 그린다."], ["정리", "$y=\\sqrt{x}$의 역함수는 $y=x^{2}$ $(x\\ge 0)$이다. 무리함수의 역함수의 정의역은 처음 함수의 치역이다."], ["주의", "무리방정식을 양변을 제곱해 풀면 처음 식을 만족시키지 않는 근이 생길 수 있다. 구한 근을 처음 식에 넣어 확인한다."]], "n": 9}], "items": [{"k": "ox", "q": "‘$x+3=5$’는 명제이다.", "a": "X", "w": "$x$의 값에 따라 참, 거짓이 달라지므로 명제가 아니라 조건이다.", "t": "명제와 조건의 부정", "id": "f2-01-01", "f": 1}, {"k": "ox", "q": "‘$2$는 소수이다.’는 명제이다.", "a": "O", "w": "참인지 거짓인지 분명하게 판별할 수 있으므로 명제이다(참인 명제).", "t": "명제와 조건의 부정", "id": "f2-01-02", "f": 1}, {"k": "ox", "q": "‘$3>5$’는 명제이다.", "a": "O", "w": "거짓이지만 거짓이라고 분명하게 판별할 수 있으므로 명제이다. 거짓인 문장도 명제이다.", "t": "명제와 조건의 부정", "id": "f2-01-03", "f": 1}, {"k": "ox", "q": "‘수학은 재미있는 과목이다.’는 명제이다.", "a": "X", "w": "‘재미있다’는 사람마다 기준이 달라 참, 거짓을 판별할 수 없다. 명제가 아니다.", "t": "명제와 조건의 부정", "id": "f2-01-04", "f": 1}, {"k": "ox", "q": "전체집합 $U$에서 조건 $p$의 진리집합이 $P$이면 $\\sim p$의 진리집합은 $P^{C}$이다.", "a": "O", "w": "$p$를 참이 되게 하지 않는 원소 전체, 곧 $P$의 여집합이다.", "t": "명제와 조건의 부정", "id": "f2-01-05", "f": 1}, {"k": "ox", "q": "실수 $x$에 대하여 조건 ‘$x\\ge 3$’의 부정은 ‘$x\\le 3$’이다.", "a": "X", "w": "부정은 ‘$x<3$’이다. 등호는 한쪽에만 붙는다 — $x=3$은 $x\\ge 3$에 들어 있으니 부정에는 없다.", "t": "명제와 조건의 부정", "id": "f2-01-06", "f": 1}, {"k": "ox", "q": "조건 ‘$p$ 또는 $q$’의 부정은 ‘$\\sim p$ 그리고 $\\sim q$’이다.", "a": "O", "w": "진리집합으로 $(P\\cup Q)^{C}=P^{C}\\cap Q^{C}$이다. 부정하면 ‘또는’과 ‘그리고’가 바뀐다.", "t": "명제와 조건의 부정", "id": "f2-01-07", "f": 1}, {"k": "ox", "q": "조건 ‘$x=1$ 그리고 $y=2$’의 부정은 ‘$x\\ne 1$ 그리고 $y\\ne 2$’이다.", "a": "X", "w": "부정은 ‘$x\\ne 1$ 또는 $y\\ne 2$’이다. ‘그리고’가 ‘또는’으로 바뀐다.", "t": "명제와 조건의 부정", "id": "f2-01-08", "f": 1}, {"k": "c3", "q": "두 조건 $p$, $q$의 진리집합이 각각 $P$, $Q$일 때 조건 ‘$p$ 그리고 $q$’의 진리집합은?", "a": "$P\\cap Q$", "c": ["$P\\cap Q$", "$P\\cup Q$", "$P-Q$"], "w": "$p$와 $q$를 모두 참이 되게 하는 원소의 집합이므로 교집합이다. ‘또는’이면 합집합이다.", "t": "명제와 조건의 부정", "id": "f2-01-09", "f": 1}, {"k": "c3", "q": "실수 $x$에 대하여 조건 ‘$-1<x\\le 2$’의 부정은?", "a": "$x\\le -1$ 또는 $x>2$", "c": ["$x\\le -1$ 또는 $x>2$", "$x<-1$ 또는 $x\\ge 2$", "$x\\le -1$ 그리고 $x>2$"], "w": "‘$-1<x$ 그리고 $x\\le 2$’의 부정이므로 ‘$x\\le -1$ 또는 $x>2$’이다.", "t": "명제와 조건의 부정", "id": "f2-01-10", "f": 1}, {"k": "ox", "q": "두 조건 $p$, $q$의 진리집합 $P$, $Q$에 대하여 $P\\subset Q$이면 명제 $p\\to q$는 참이다.", "a": "O", "w": "$P$의 모든 원소가 $Q$에 속하므로 $p$이면 반드시 $q$이다.", "t": "진리집합과 명제의 참·거짓", "id": "f2-02-01", "f": 2}, {"k": "ox", "q": "명제 $p\\to q$가 참이면 $Q\\subset P$이다.", "a": "X", "w": "$p\\to q$가 참이면 $P\\subset Q$이다. 포함 관계의 방향을 거꾸로 쓰지 않게 한다.", "t": "진리집합과 명제의 참·거짓", "id": "f2-02-02", "f": 2}, {"k": "ox", "q": "명제 $p\\to q$가 거짓임을 보이려면 $P$에는 속하고 $Q$에는 속하지 않는 원소를 하나 들면 된다.", "a": "O", "w": "그 원소가 반례이다. 반례는 $P-Q$, 곧 $P\\cap Q^{C}$의 원소이다.", "t": "거짓인 명제의 반례", "id": "f2-02-03", "f": 2}, {"k": "ox", "q": "실수 $x$에 대하여 명제 ‘$x^{2}=1$이면 $x=1$이다.’는 참이다.", "a": "X", "w": "$x=-1$이면 $x^{2}=1$이지만 $x\\ne 1$이다. 반례가 있으므로 거짓이다.", "t": "거짓인 명제의 반례", "id": "f2-02-04", "f": 2}, {"k": "ox", "q": "실수 $x$에 대하여 명제 ‘$x=2$이면 $x^{2}=4$이다.’는 참이다.", "a": "O", "w": "$P=\\{2\\}$, $Q=\\{-2,\\ 2\\}$이고 $P\\subset Q$이므로 참이다.", "t": "진리집합과 명제의 참·거짓", "id": "f2-02-05", "f": 2}, {"k": "ox", "q": "전체집합 $U$에서 명제 ‘모든 $x$에 대하여 $p$이다.’는 $P=U$일 때 참이다.", "a": "O", "w": "$U$의 모든 원소가 $p$를 만족시켜야 참이다. 하나라도 만족시키지 않으면 거짓이다.", "t": "'모든'과 '어떤'이 있는 명제", "id": "f2-02-06", "f": 2}, {"k": "ox", "q": "전체집합 $U$에서 명제 ‘어떤 $x$에 대하여 $p$이다.’는 $P=U$일 때만 참이다.", "a": "X", "w": "$p$를 만족시키는 원소가 하나라도 있으면, 곧 $P\\ne\\varnothing$이면 참이다.", "t": "'모든'과 '어떤'이 있는 명제", "id": "f2-02-07", "f": 2}, {"k": "ox", "q": "명제 ‘모든 실수 $x$에 대하여 $x^{2}\\ge 0$이다.’는 참이다.", "a": "O", "w": "실수의 제곱은 항상 $0$ 이상이다.", "t": "'모든'과 '어떤'이 있는 명제", "id": "f2-02-08", "f": 2}, {"k": "ox", "q": "명제 ‘어떤 실수 $x$에 대하여 $x^{2}<0$이다.’는 참이다.", "a": "X", "w": "제곱해서 음수가 되는 실수는 없다. $P=\\varnothing$이므로 거짓이다.", "t": "'모든'과 '어떤'이 있는 명제", "id": "f2-02-09", "f": 2}, {"k": "c3", "q": "명제 ‘모든 $x$에 대하여 $p$이다.’의 부정은?", "a": "어떤 $x$에 대하여 $\\sim p$이다.", "c": ["어떤 $x$에 대하여 $\\sim p$이다.", "모든 $x$에 대하여 $\\sim p$이다.", "어떤 $x$에 대하여 $p$이다."], "w": "‘모든’은 ‘어떤’으로 바뀌고 $p$는 $\\sim p$로 바뀐다. 거꾸로 ‘어떤 $x$에 대하여 $p$’의 부정은 ‘모든 $x$에 대하여 $\\sim p$’이다.", "t": "'모든'과 '어떤'이 있는 명제", "id": "f2-02-10", "f": 2}, {"k": "ox", "q": "명제 $p\\to q$의 역은 $q\\to p$이다.", "a": "O", "w": "가정과 결론을 서로 바꾼 것이 역이다.", "t": "명제의 역과 대우", "id": "f2-03-01", "f": 3}, {"k": "ox", "q": "명제 $p\\to q$의 대우는 $\\sim p\\to\\sim q$이다.", "a": "X", "w": "대우는 가정과 결론을 바꾸고 각각 부정한 $\\sim q\\to\\sim p$이다.", "t": "명제의 역과 대우", "id": "f2-03-02", "f": 3}, {"k": "ox", "q": "명제가 참이면 그 대우도 반드시 참이다.", "a": "O", "w": "$P\\subset Q$이면 $Q^{C}\\subset P^{C}$이다. 명제와 대우는 참, 거짓이 항상 같다.", "t": "명제의 역과 대우", "id": "f2-03-03", "f": 3}, {"k": "ox", "q": "명제가 참이면 그 역도 반드시 참이다.", "a": "X", "w": "‘$x=2$이면 $x^{2}=4$이다.’는 참이지만 역 ‘$x^{2}=4$이면 $x=2$이다.’는 거짓이다($x=-2$).", "t": "명제의 역과 대우", "id": "f2-03-04", "f": 3}, {"k": "ox", "q": "실수 $x$에 대하여 명제 ‘$x>2$이면 $x>1$이다.’의 역은 참이다.", "a": "X", "w": "역은 ‘$x>1$이면 $x>2$이다.’이고 $x=1.5$가 반례이므로 거짓이다.", "t": "명제의 역과 대우", "id": "f2-03-05", "f": 3}, {"k": "c3", "q": "실수 $x$에 대하여 명제 ‘$x=1$이면 $x^{2}=1$이다.’의 대우는?", "a": "$x^{2}\\ne 1$이면 $x\\ne 1$이다.", "c": ["$x^{2}\\ne 1$이면 $x\\ne 1$이다.", "$x^{2}=1$이면 $x=1$이다.", "$x\\ne 1$이면 $x^{2}\\ne 1$이다."], "w": "결론 ‘$x^{2}=1$’의 부정을 가정으로, 가정 ‘$x=1$’의 부정을 결론으로 둔다. 두 번째 보기는 역이다.", "t": "명제의 역과 대우", "id": "f2-03-06", "f": 3}, {"k": "ox", "q": "두 명제 $p\\to q$, $q\\to r$가 모두 참이면 명제 $p\\to r$도 참이다.", "a": "O", "w": "$P\\subset Q$, $Q\\subset R$이면 $P\\subset R$이다. 이것을 삼단논법이라 한다.", "t": "삼단논법과 명제의 추론", "id": "f2-03-07", "f": 3}, {"k": "ox", "q": "두 명제 $p\\to q$, $q\\to r$가 모두 참이면 명제 $r\\to p$도 참이다.", "a": "X", "w": "참인 것은 $p\\to r$와 그 대우 $\\sim r\\to\\sim p$이다. $r\\to p$는 참이라고 할 수 없다.", "t": "삼단논법과 명제의 추론", "id": "f2-03-08", "f": 3}, {"k": "ox", "q": "명제 $p\\to\\sim q$가 참이면 명제 $q\\to\\sim p$도 참이다.", "a": "O", "w": "$p\\to\\sim q$의 대우는 $\\sim(\\sim q)\\to\\sim p$, 곧 $q\\to\\sim p$이다.", "t": "삼단논법과 명제의 추론", "id": "f2-03-09", "f": 3}, {"k": "ox", "q": "명제가 거짓이면 그 역도 반드시 거짓이다.", "a": "X", "w": "‘$x^{2}=4$이면 $x=2$이다.’는 거짓이지만 역 ‘$x=2$이면 $x^{2}=4$이다.’는 참이다. 명제와 참, 거짓이 늘 같은 것은 대우이다.", "t": "명제의 역과 대우", "id": "f2-03-10", "f": 3}, {"k": "ox", "q": "명제 $p\\to q$가 참일 때 $p$는 $q$이기 위한 충분조건이다.", "a": "O", "w": "$p\\Longrightarrow q$이면 $p$는 $q$이기 위한 충분조건, $q$는 $p$이기 위한 필요조건이다.", "t": "충분·필요·필요충분조건", "id": "f2-04-01", "f": 4}, {"k": "ox", "q": "명제 $p\\to q$가 참일 때 $q$는 $p$이기 위한 필요조건이다.", "a": "O", "w": "$p$가 성립하려면 $q$는 꼭 필요하다. 화살표가 들어오는 쪽이 필요조건이다.", "t": "충분·필요·필요충분조건", "id": "f2-04-02", "f": 4}, {"k": "ox", "q": "명제 $p\\to q$가 참이면 $p$는 $q$이기 위한 필요조건이다.", "a": "X", "w": "화살표가 나가는 쪽 $p$는 충분조건이다. 필요조건은 $q$이다.", "t": "충분·필요·필요충분조건", "id": "f2-04-03", "f": 4}, {"k": "ox", "q": "두 조건 $p$, $q$의 진리집합 $P$, $Q$에 대하여 $P\\subset Q$이면 $p$는 $q$이기 위한 충분조건이다.", "a": "O", "w": "$P\\subset Q$는 $p\\Longrightarrow q$와 같다. 작은 집합 쪽이 충분조건이다.", "t": "충분·필요·필요충분조건", "id": "f2-04-04", "f": 4}, {"k": "ox", "q": "$P=Q$이면 $p$는 $q$이기 위한 필요충분조건이다.", "a": "O", "w": "$p\\Longrightarrow q$이고 $q\\Longrightarrow p$, 곧 $p\\Longleftrightarrow q$이다.", "t": "충분·필요·필요충분조건", "id": "f2-04-05", "f": 4}, {"k": "ox", "q": "실수 $x$에 대하여 ‘$x=2$’는 ‘$x^{2}=4$’이기 위한 필요조건이다.", "a": "X", "w": "$x=2\\Longrightarrow x^{2}=4$이므로 ‘$x=2$’는 충분조건이다. 역은 거짓($x=-2$)이라 필요조건은 아니다.", "t": "충분·필요·필요충분조건", "id": "f2-04-06", "f": 4}, {"k": "ox", "q": "실수 $x$에 대하여 ‘$x^{2}=4$’는 ‘$x=2$’이기 위한 필요조건이다.", "a": "O", "w": "$x=2\\Longrightarrow x^{2}=4$이므로 화살표가 들어오는 ‘$x^{2}=4$’는 필요조건이다.", "t": "충분·필요·필요충분조건", "id": "f2-04-07", "f": 4}, {"k": "c3", "q": "실수 $x$에 대하여 ‘$x>3$’은 ‘$x>1$’이기 위한 어떤 조건인가?", "a": "충분조건(필요조건은 아님)", "c": ["충분조건(필요조건은 아님)", "필요조건(충분조건은 아님)", "필요충분조건"], "w": "$\\{x\\mid x>3\\}\\subset\\{x\\mid x>1\\}$이므로 충분조건이다. $x=2$이면 $x>1$이지만 $x>3$이 아니므로 필요조건은 아니다.", "t": "충분·필요·필요충분조건", "id": "f2-04-08", "f": 4}, {"k": "c3", "q": "실수 $x$, $y$에 대하여 ‘$xy=0$’은 ‘$x=0$ 또는 $y=0$’이기 위한 어떤 조건인가?", "a": "필요충분조건", "c": ["필요충분조건", "충분조건(필요조건은 아님)", "필요조건(충분조건은 아님)"], "w": "$xy=0\\Longleftrightarrow x=0$ 또는 $y=0$이다. 두 진리집합이 같다.", "t": "충분·필요·필요충분조건", "id": "f2-04-09", "f": 4}, {"k": "ox", "q": "$p$가 $q$이기 위한 충분조건이면 $\\sim p$는 $\\sim q$이기 위한 충분조건이다.", "a": "X", "w": "$p\\to q$가 참이면 대우 $\\sim q\\to\\sim p$가 참이다. 그래서 $\\sim q$가 $\\sim p$이기 위한 충분조건이다. 방향이 반대이다.", "t": "조건이 되게 하는 미지수와 연산", "id": "f2-04-10", "f": 4}, {"k": "ox", "q": "용어의 뜻을 명확하게 정한 문장을 그 용어의 정의라 한다.", "a": "O", "w": "예를 들어 ‘세 변의 길이가 같은 삼각형을 정삼각형이라 한다.’는 정의이다.", "t": "대우법과 귀류법", "id": "f2-05-01", "f": 5}, {"k": "ox", "q": "참임이 증명된 명제 중에서 기본이 되는 것이나 다른 명제를 증명할 때 이용할 수 있는 것을 정리라 한다.", "a": "O", "w": "정의는 약속이고, 정리는 증명된 참인 명제이다.", "t": "대우법과 귀류법", "id": "f2-05-02", "f": 5}, {"k": "ox", "q": "명제 $p\\to q$가 참임을 보이는 대신 그 대우 $\\sim q\\to\\sim p$가 참임을 보여 증명할 수 있다.", "a": "O", "w": "명제와 대우는 참, 거짓이 같으므로 대우가 참이면 원래 명제도 참이다(대우를 이용한 증명).", "t": "대우법과 귀류법", "id": "f2-05-03", "f": 5}, {"k": "ox", "q": "귀류법은 명제의 역이 참임을 보여 원래 명제를 증명하는 방법이다.", "a": "X", "w": "귀류법은 명제의 결론을 부정하면 가정이나 이미 알려진 사실에 모순이 생김을 보여 증명하는 방법이다.", "t": "대우법과 귀류법", "id": "f2-05-04", "f": 5}, {"k": "ox", "q": "‘$\\sqrt{2}$는 무리수이다.’는 귀류법으로 증명할 수 있다.", "a": "O", "w": "$\\sqrt{2}$를 유리수 $\\dfrac{n}{m}$ ($m$, $n$은 서로소인 자연수)이라 하면 $m$, $n$이 모두 짝수가 되어 모순이다.", "t": "대우법과 귀류법", "id": "f2-05-05", "f": 5}, {"k": "ox", "q": "귀류법에서는 결론을 부정했을 때 모순이 생긴다는 것을 보인다.", "a": "O", "w": "결론을 부정한 가정에서 출발해 모순에 이르면, 결론을 부정할 수 없으므로 결론이 참이다.", "t": "대우법과 귀류법", "id": "f2-05-06", "f": 5}, {"k": "ox", "q": "자연수 $n$에 대하여 ‘$n^{2}$이 짝수이면 $n$은 짝수이다.’를 대우로 증명하려면 ‘$n$이 짝수이면 $n^{2}$이 짝수이다.’를 보이면 된다.", "a": "X", "w": "그것은 역이다. 대우는 ‘$n$이 홀수이면 $n^{2}$이 홀수이다.’이다.", "t": "대우법과 귀류법", "id": "f2-05-07", "f": 5}, {"k": "c3", "q": "자연수 $n$에 대하여 명제 ‘$n^{2}$이 홀수이면 $n$은 홀수이다.’의 대우는?", "a": "$n$이 짝수이면 $n^{2}$은 짝수이다.", "c": ["$n$이 짝수이면 $n^{2}$은 짝수이다.", "$n$이 홀수이면 $n^{2}$은 홀수이다.", "$n^{2}$이 짝수이면 $n$은 짝수이다."], "w": "결론 ‘$n$은 홀수’를 부정하면 ‘$n$은 짝수’, 가정 ‘$n^{2}$이 홀수’를 부정하면 ‘$n^{2}$은 짝수’이다.", "t": "대우법과 귀류법", "id": "f2-05-08", "f": 5}, {"k": "ox", "q": "명제가 참임을 보이려면 그 명제가 성립하는 예를 몇 개 들면 된다.", "a": "X", "w": "참임은 모든 경우에 성립함을 보여야 한다. 예를 드는 것으로 충분한 것은 거짓임을 보일 때(반례)이다.", "t": "대우법과 귀류법", "id": "f2-05-09", "f": 5}, {"k": "ox", "q": "문자에 어떤 실수를 대입해도 항상 성립하는 부등식을 절대부등식이라 한다.", "a": "O", "w": "예를 들어 실수 $x$에 대하여 $x^{2}+1>0$은 절대부등식이다.", "t": "절대부등식의 증명", "id": "f2-06-01", "f": 6}, {"k": "ox", "q": "실수 $x$에 대하여 $x^{2}>0$은 절대부등식이다.", "a": "X", "w": "$x=0$이면 $x^{2}=0$이라 성립하지 않는다. $x^{2}\\ge 0$이 절대부등식이다.", "t": "절대부등식의 증명", "id": "f2-06-02", "f": 6}, {"k": "ox", "q": "실수 $a$, $b$에 대하여 $a^{2}+b^{2}\\ge 2ab$이다.", "a": "O", "w": "$a^{2}+b^{2}-2ab=(a-b)^{2}\\ge 0$이다. 등호는 $a=b$일 때 성립한다.", "t": "절대부등식의 증명", "id": "f2-06-03", "f": 6}, {"k": "ox", "q": "두 식 $A$, $B$에 대하여 $A-B\\ge 0$을 보이면 $A\\le B$가 증명된다.", "a": "X", "w": "$A-B\\ge 0$이면 $A\\ge B$이다.", "t": "절대부등식의 증명", "id": "f2-06-04", "f": 6}, {"k": "ox", "q": "실수 $a$, $b$에 대하여 $|a|+|b|\\ge|a+b|$이다.", "a": "O", "w": "양변이 $0$ 이상이므로 제곱해서 비교한다. $(|a|+|b|)^{2}-|a+b|^{2}=2(|ab|-ab)\\ge 0$, 등호는 $ab\\ge 0$일 때 성립한다.", "t": "절대부등식의 증명", "id": "f2-06-05", "f": 6}, {"k": "ox", "q": "$a>0$, $b>0$일 때 $\\dfrac{a+b}{2}\\ge\\sqrt{ab}$이고, 등호는 $a=b$일 때 성립한다.", "a": "O", "w": "$a+b-2\\sqrt{ab}=(\\sqrt{a}-\\sqrt{b})^{2}\\ge 0$이다. 산술평균과 기하평균의 관계이다.", "t": "산술·기하평균 : 전개와 변형", "id": "f2-06-06", "f": 6}, {"k": "ox", "q": "부등식 $\\dfrac{a+b}{2}\\ge\\sqrt{ab}$는 모든 실수 $a$, $b$에 대하여 성립한다.", "a": "X", "w": "$a>0$, $b>0$일 때의 부등식이다. 음수이면 $\\sqrt{ab}$가 정의되지 않거나 성립하지 않는다($a=b=-1$).", "t": "산술·기하평균 : 전개와 변형", "id": "f2-06-07", "f": 6}, {"k": "c3", "q": "$x>0$일 때 $x+\\dfrac{1}{x}$의 최솟값은?", "a": "$2$", "c": ["$2$", "$1$", "$4$"], "w": "$x+\\dfrac{1}{x}\\ge 2\\sqrt{x\\cdot\\dfrac{1}{x}}=2$이고, 등호는 $x=\\dfrac{1}{x}$, 곧 $x=1$일 때 성립한다.", "t": "산술·기하평균 : 합·곱이 일정", "id": "f2-06-08", "f": 6}, {"k": "ox", "q": "$a>0$, $b>0$이고 $a+b=4$이면 $ab$의 최솟값은 $4$이다.", "a": "X", "w": "$4=a+b\\ge 2\\sqrt{ab}$에서 $ab\\le 4$이다. $4$는 최댓값이다. 합이 일정하면 곱의 최댓값을 구한다.", "t": "산술·기하평균 : 합·곱이 일정", "id": "f2-06-09", "f": 6}, {"k": "ox", "q": "실수 $a$, $b$, $x$, $y$에 대하여 $(a^{2}+b^{2})(x^{2}+y^{2})\\ge(ax+by)^{2}$이다.", "a": "O", "w": "좌변에서 우변을 빼면 $(ay-bx)^{2}\\ge 0$이다. 등호는 $ay=bx$일 때 성립한다.", "t": "코시-슈바르츠 부등식", "id": "f2-06-10", "f": 6}, {"k": "ox", "q": "두 집합 $X$, $Y$에 대하여 $X$의 각 원소에 $Y$의 원소가 오직 하나씩 대응할 때, 이 대응을 $X$에서 $Y$로의 함수라 한다.", "a": "O", "w": "함수 $f:X\\to Y$의 뜻이다. ‘각 원소’와 ‘오직 하나’ 두 조건을 모두 확인한다.", "t": "함수의 뜻과 정의역·치역", "id": "f2-07-01", "f": 7}, {"k": "ox", "q": "$X$의 원소 중 $Y$의 어떤 원소에도 대응하지 않는 원소가 있어도 함수가 될 수 있다.", "a": "X", "w": "$X$의 모든 원소가 빠짐없이 대응해야 함수이다.", "t": "함수의 뜻과 정의역·치역", "id": "f2-07-02", "f": 7}, {"k": "ox", "q": "$X$의 서로 다른 두 원소가 $Y$의 같은 원소에 대응하면 함수가 아니다.", "a": "X", "w": "같은 원소에 대응해도 각 원소마다 하나씩만 대응하면 함수이다. 함수가 아닌 것은 한 원소가 두 개 이상에 대응할 때이다.", "t": "함수의 뜻과 정의역·치역", "id": "f2-07-03", "f": 7}, {"k": "ox", "q": "함수 $f:X\\to Y$에서 $X$를 정의역, $Y$를 공역이라 한다.", "a": "O", "w": "함숫값 전체의 집합 $\\{f(x)\\mid x\\in X\\}$는 치역이라 한다.", "t": "함수의 뜻과 정의역·치역", "id": "f2-07-04", "f": 7}, {"k": "ox", "q": "함수의 치역은 공역의 부분집합이다.", "a": "O", "w": "함숫값은 모두 $Y$의 원소이므로 치역 $\\subset$ 공역이다.", "t": "함수의 뜻과 정의역·치역", "id": "f2-07-05", "f": 7}, {"k": "ox", "q": "함수의 치역과 공역은 항상 같다.", "a": "X", "w": "$f:\\{1,\\ 2\\}\\to\\{1,\\ 2,\\ 3\\}$, $f(x)=x$의 치역은 $\\{1,\\ 2\\}$로 공역과 다르다.", "t": "함수의 뜻과 정의역·치역", "id": "f2-07-06", "f": 7}, {"k": "ox", "q": "두 함수 $f$, $g$가 서로 같으려면 정의역과 공역이 각각 같고, 정의역의 모든 원소 $x$에 대하여 $f(x)=g(x)$이어야 한다.", "a": "O", "w": "이때 $f=g$로 나타낸다. 식의 모양이 달라도 같은 함수일 수 있다.", "t": "서로 같은 함수", "id": "f2-07-07", "f": 7}, {"k": "c3", "q": "$X=\\{-1,\\ 0,\\ 1\\}$에서 정의된 두 함수 $f(x)=x^{2}$, $g(x)=|x|$에 대하여 옳은 것은? (공역은 같다)", "a": "$f=g$이다.", "c": ["$f=g$이다.", "$f\\ne g$이다.", "식이 달라 비교할 수 없다."], "w": "$f(-1)=g(-1)=1$, $f(0)=g(0)=0$, $f(1)=g(1)=1$이다. 정의역의 모든 원소에서 함숫값이 같다.", "t": "서로 같은 함수", "id": "f2-07-08", "f": 7}, {"k": "ox", "q": "함수의 그래프는 $x$축에 평행한 직선과 항상 한 점에서만 만난다.", "a": "X", "w": "$y=x^{2}$의 그래프는 직선 $y=1$과 두 점에서 만난다. 함수의 그래프가 한 점에서만 만나는 것은 $y$축에 평행한 직선 $x=a$ ($a$는 정의역의 원소)이다.", "t": "함수의 뜻과 정의역·치역", "id": "f2-07-09", "f": 7}, {"k": "ox", "q": "원 $x^{2}+y^{2}=1$은 어떤 함수 $y=f(x)$의 그래프이다.", "a": "X", "w": "$x=0$일 때 $y=1$, $y=-1$ 두 값이 대응한다. 함수의 그래프는 $y$축에 평행한 직선과 많아야 한 점에서 만난다.", "t": "함수의 뜻과 정의역·치역", "id": "f2-07-10", "f": 7}, {"k": "ox", "q": "함수 $f:X\\to Y$에서 정의역의 두 원소 $x_{1}$, $x_{2}$에 대하여 $x_{1}\\ne x_{2}$이면 $f(x_{1})\\ne f(x_{2})$일 때, $f$를 일대일함수라 한다.", "a": "O", "w": "서로 다른 원소는 서로 다른 함숫값을 가진다는 뜻이다.", "t": "일대일대응과 항등함수·상수함수", "id": "f2-08-01", "f": 8}, {"k": "ox", "q": "일대일함수이면서 치역과 공역이 같은 함수를 일대일대응이라 한다.", "a": "O", "w": "두 조건 ① 일대일함수 ② 치역 $=$ 공역을 모두 만족시켜야 한다.", "t": "일대일대응과 항등함수·상수함수", "id": "f2-08-02", "f": 8}, {"k": "ox", "q": "일대일함수는 모두 일대일대응이다.", "a": "X", "w": "$f:\\{1,\\ 2\\}\\to\\{1,\\ 2,\\ 3\\}$, $f(x)=x$는 일대일함수이지만 치역이 공역과 달라 일대일대응이 아니다.", "t": "일대일대응과 항등함수·상수함수", "id": "f2-08-03", "f": 8}, {"k": "ox", "q": "일대일대응은 모두 일대일함수이다.", "a": "O", "w": "일대일대응의 뜻에 일대일함수라는 조건이 들어 있다.", "t": "일대일대응과 항등함수·상수함수", "id": "f2-08-04", "f": 8}, {"k": "ox", "q": "함수 $f:X\\to X$에서 $X$의 각 원소 $x$에 자기 자신 $x$가 대응하는 함수를 $X$에서의 항등함수라 한다.", "a": "O", "w": "$f(x)=x$이고 보통 $I$로 나타낸다. 항등함수는 일대일대응이다.", "t": "일대일대응과 항등함수·상수함수", "id": "f2-08-05", "f": 8}, {"k": "ox", "q": "정의역의 원소가 $2$개 이상인 상수함수는 일대일함수이다.", "a": "X", "w": "상수함수는 모든 원소가 같은 함숫값을 가지므로 일대일함수가 아니다.", "t": "일대일대응과 항등함수·상수함수", "id": "f2-08-06", "f": 8}, {"k": "ox", "q": "실수 전체의 집합에서 정의된 함수 $f(x)=ax+b$ $(a\\ne 0)$는 일대일대응이다.", "a": "O", "w": "$a\\ne 0$이면 그래프가 기울어진 직선이라 $x$축에 평행한 직선과 한 점에서만 만나고, 치역이 실수 전체이다.", "t": "일대일대응과 항등함수·상수함수", "id": "f2-08-07", "f": 8}, {"k": "ox", "q": "실수 전체의 집합에서 실수 전체의 집합으로의 함수 $f(x)=x^{2}$은 일대일대응이다.", "a": "X", "w": "$f(-1)=f(1)=1$이라 일대일함수가 아니고, 치역도 $\\{y\\mid y\\ge 0\\}$이다.", "t": "일대일대응과 항등함수·상수함수", "id": "f2-08-08", "f": 8}, {"k": "c3", "q": "$X=\\{1,\\ 2,\\ 3\\}$일 때 $X$에서 $X$로의 일대일대응의 개수는?", "a": "$6$", "c": ["$6$", "$27$", "$9$"], "w": "$1$, $2$, $3$에 차례로 대응시킬 수 있는 원소가 $3$개, $2$개, $1$개이므로 $3\\times 2\\times 1=6$이다.", "t": "함수의 개수", "id": "f2-08-09", "f": 8}, {"k": "c3", "q": "$X=\\{1,\\ 2,\\ 3\\}$일 때 $X$에서 $X$로의 함수의 개수는?", "a": "$27$", "c": ["$27$", "$6$", "$9$"], "w": "각 원소마다 대응시킬 수 있는 원소가 $3$개씩이므로 $3\\times 3\\times 3=27$이다.", "t": "함수의 개수", "id": "f2-08-10", "f": 8}, {"k": "ox", "q": "두 함수 $f:X\\to Y$, $g:Y\\to Z$에 대하여 $X$의 각 원소 $x$에 $Z$의 원소 $g(f(x))$를 대응시키는 함수를 $f$와 $g$의 합성함수라 하고 $g\\circ f$로 나타낸다.", "a": "O", "w": "$(g\\circ f)(x)=g(f(x))$이다. 먼저 $f$, 그다음 $g$이다.", "t": "합성함수 구하기", "id": "f2-09-01", "f": 9}, {"k": "ox", "q": "$(g\\circ f)(x)=f(g(x))$이다.", "a": "X", "w": "$(g\\circ f)(x)=g(f(x))$이다. 오른쪽에 쓴 $f$를 먼저 적용한다.", "t": "합성함수 구하기", "id": "f2-09-02", "f": 9}, {"k": "ox", "q": "두 함수 $f$, $g$에 대하여 항상 $g\\circ f=f\\circ g$이다.", "a": "X", "w": "일반적으로 교환법칙이 성립하지 않는다. $f(x)=x+1$, $g(x)=2x$이면 $g(f(x))=2x+2$, $f(g(x))=2x+1$이다.", "t": "합성함수의 규칙성과 미정계수", "id": "f2-09-03", "f": 9}, {"k": "ox", "q": "세 함수 $f$, $g$, $h$에 대하여 $h\\circ(g\\circ f)=(h\\circ g)\\circ f$이다.", "a": "O", "w": "합성함수는 결합법칙이 성립한다.", "t": "합성함수의 규칙성과 미정계수", "id": "f2-09-04", "f": 9}, {"k": "ox", "q": "함수 $f:X\\to X$와 $X$에서의 항등함수 $I$에 대하여 $f\\circ I=I\\circ f=f$이다.", "a": "O", "w": "항등함수는 수의 곱셈에서 $1$과 같은 역할을 한다.", "t": "합성함수의 규칙성과 미정계수", "id": "f2-09-05", "f": 9}, {"k": "c3", "q": "$f(x)=x+1$, $g(x)=2x$일 때 $(g\\circ f)(1)$의 값은?", "a": "$4$", "c": ["$4$", "$3$", "$2$"], "w": "$f(1)=2$이므로 $(g\\circ f)(1)=g(2)=4$이다.", "t": "합성함수 구하기", "id": "f2-09-06", "f": 9}, {"k": "c3", "q": "$f(x)=x+1$, $g(x)=x^{2}$일 때 $(f\\circ g)(x)$는?", "a": "$x^{2}+1$", "c": ["$x^{2}+1$", "$(x+1)^{2}$", "$x^{2}+x$"], "w": "$(f\\circ g)(x)=f(g(x))=g(x)+1=x^{2}+1$이다. $(x+1)^{2}$은 $(g\\circ f)(x)$이다.", "t": "합성함수 구하기", "id": "f2-09-07", "f": 9}, {"k": "ox", "q": "합성함수 $g\\circ f$가 정의되려면 $f$의 치역이 $g$의 정의역에 포함되어야 한다.", "a": "O", "w": "$f(x)$가 $g$에 넣을 수 있는 값이어야 $g(f(x))$를 구할 수 있다.", "t": "합성함수 구하기", "id": "f2-09-08", "f": 9}, {"k": "ox", "q": "$f(x)=2x+1$이면 $(f\\circ f)(x)=4x+1$이다.", "a": "X", "w": "$f(f(x))=2(2x+1)+1=4x+3$이다.", "t": "합성함수 구하기", "id": "f2-09-09", "f": 9}, {"k": "ox", "q": "함수 $f:X\\to Y$가 일대일대응이면 역함수 $f^{-1}:Y\\to X$가 존재한다.", "a": "O", "w": "$Y$의 각 원소 $y$에 $f(x)=y$인 $X$의 원소 $x$가 오직 하나씩 있기 때문이다.", "t": "역함수의 함숫값과 존재 조건", "id": "f2-10-01", "f": 10}, {"k": "ox", "q": "모든 함수는 역함수를 가진다.", "a": "X", "w": "역함수가 존재하는 것은 일대일대응일 때뿐이다.", "t": "역함수의 함숫값과 존재 조건", "id": "f2-10-02", "f": 10}, {"k": "ox", "q": "함수 $f$의 역함수가 존재할 때 $f(a)=b$이면 $f^{-1}(b)=a$이다.", "a": "O", "w": "$y=f(x)\\Longleftrightarrow x=f^{-1}(y)$이다.", "t": "역함수의 함숫값과 존재 조건", "id": "f2-10-03", "f": 10}, {"k": "ox", "q": "$f^{-1}(x)=\\dfrac{1}{f(x)}$이다.", "a": "X", "w": "$f^{-1}$은 역함수를 나타내는 기호이지 역수가 아니다.", "t": "역함수의 함숫값과 존재 조건", "id": "f2-10-04", "f": 10}, {"k": "c3", "q": "일대일대응인 함수 $f$에 대하여 $f(2)=5$일 때 $f^{-1}(5)$의 값은?", "a": "$2$", "c": ["$2$", "$5$", "$\\dfrac{1}{5}$"], "w": "$f(2)=5\\Longleftrightarrow f^{-1}(5)=2$이다.", "t": "역함수의 함숫값과 존재 조건", "id": "f2-10-05", "f": 10}, {"k": "ox", "q": "역함수를 구할 때는 $y=f(x)$를 $x$에 대하여 푼 뒤 $x$와 $y$를 서로 바꾼다.", "a": "O", "w": "$x=f^{-1}(y)$를 얻고, $x$와 $y$를 바꾸어 $y=f^{-1}(x)$로 나타낸다.", "t": "역함수 구하기", "id": "f2-10-06", "f": 10}, {"k": "c3", "q": "$f(x)=2x-4$의 역함수는?", "a": "$f^{-1}(x)=\\dfrac{1}{2}x+2$", "c": ["$f^{-1}(x)=\\dfrac{1}{2}x+2$", "$f^{-1}(x)=\\dfrac{1}{2x-4}$", "$f^{-1}(x)=-2x+4$"], "w": "$y=2x-4$를 $x$에 대하여 풀면 $x=\\dfrac{1}{2}y+2$이고, $x$와 $y$를 바꾸면 $y=\\dfrac{1}{2}x+2$이다.", "t": "역함수 구하기", "id": "f2-10-07", "f": 10}, {"k": "ox", "q": "역함수 $f^{-1}$의 정의역은 $f$의 정의역과 같다.", "a": "X", "w": "$f^{-1}$의 정의역은 $f$의 치역(일대일대응이므로 공역)이고, $f^{-1}$의 치역이 $f$의 정의역이다.", "t": "역함수 구하기", "id": "f2-10-08", "f": 10}, {"k": "ox", "q": "실수 전체의 집합에서 정의된 함수 $f(x)=x^{2}+1$은 역함수를 가진다.", "a": "X", "w": "$f(-1)=f(1)=2$라 일대일대응이 아니다. 역함수가 존재하지 않는다.", "t": "역함수의 함숫값과 존재 조건", "id": "f2-10-09", "f": 10}, {"k": "ox", "q": "역함수가 존재하는 함수 $f$에 대하여 $(f^{-1})^{-1}=f$이다.", "a": "O", "w": "역함수의 역함수는 처음 함수이다.", "t": "역함수의 성질", "id": "f2-11-01", "f": 11}, {"k": "ox", "q": "$f:X\\to Y$가 일대일대응일 때 $(f^{-1}\\circ f)(x)=x$ $(x\\in X)$, $(f\\circ f^{-1})(y)=y$ $(y\\in Y)$이다.", "a": "O", "w": "$f$와 $f^{-1}$를 합성하면 항등함수가 된다.", "t": "합성함수와 역함수", "id": "f2-11-02", "f": 11}, {"k": "ox", "q": "두 함수 $f$, $g$의 역함수가 존재할 때 $(g\\circ f)^{-1}=g^{-1}\\circ f^{-1}$이다.", "a": "X", "w": "$(g\\circ f)^{-1}=f^{-1}\\circ g^{-1}$이다. 나중에 한 것을 먼저 되돌린다.", "t": "합성함수와 역함수", "id": "f2-11-03", "f": 11}, {"k": "ox", "q": "두 함수 $f$, $g$의 역함수가 존재할 때 $(g\\circ f)^{-1}=f^{-1}\\circ g^{-1}$이다.", "a": "O", "w": "$(f^{-1}\\circ g^{-1})\\circ(g\\circ f)=f^{-1}\\circ(g^{-1}\\circ g)\\circ f=I$이다.", "t": "합성함수와 역함수", "id": "f2-11-04", "f": 11}, {"k": "ox", "q": "함수 $y=f(x)$의 그래프와 그 역함수 $y=f^{-1}(x)$의 그래프는 직선 $y=x$에 대하여 대칭이다.", "a": "O", "w": "$y=f^{-1}(x)$는 $x=f(y)$와 같으므로 $x$와 $y$를 바꾼 것이다.", "t": "역함수 그래프의 성질", "id": "f2-11-05", "f": 11}, {"k": "ox", "q": "함수 $y=f(x)$의 그래프와 그 역함수 $y=f^{-1}(x)$의 그래프는 원점에 대하여 대칭이다.", "a": "X", "w": "직선 $y=x$에 대하여 대칭이다.", "t": "역함수 그래프의 성질", "id": "f2-11-06", "f": 11}, {"k": "ox", "q": "점 $(a,\\ b)$가 함수 $y=f(x)$의 그래프 위에 있으면 점 $(-a,\\ -b)$는 $y=f^{-1}(x)$의 그래프 위에 있다.", "a": "X", "w": "$f(a)=b\\Longleftrightarrow f^{-1}(b)=a$이므로 $y=f^{-1}(x)$ 위에 있는 점은 $(b,\\ a)$이다.", "t": "역함수 그래프의 성질", "id": "f2-11-07", "f": 11}, {"k": "ox", "q": "함수 $y=f(x)$의 그래프와 $y=f^{-1}(x)$의 그래프의 교점은 항상 직선 $y=x$ 위에 있다.", "a": "X", "w": "$f(x)=-x+1$은 $f^{-1}(x)=-x+1$이라 두 그래프가 겹쳐 $y=x$ 밖에도 교점이 있다. $y=x$ 위에서 찾아도 되는 것은 $f$가 증가하는 함수일 때이다.", "t": "역함수 그래프의 성질", "id": "f2-11-08", "f": 11}, {"k": "c3", "q": "일대일대응인 함수 $f$의 역함수를 $g$라 할 때 $(f\\circ g)(3)$의 값은?", "a": "$3$", "c": ["$3$", "$f(3)$", "$g(3)$"], "w": "$f\\circ f^{-1}$는 항등함수이므로 $(f\\circ g)(3)=3$이다.", "t": "합성함수와 역함수", "id": "f2-11-09", "f": 11}, {"k": "ox", "q": "두 다항식 $A$, $B$ $(B\\ne 0)$에 대하여 $\\dfrac{A}{B}$ 꼴로 나타낼 수 있는 식을 유리식이라 한다.", "a": "O", "w": "$B$가 $0$이 아닌 상수이면 $\\dfrac{A}{B}$는 다항식이다.", "t": "유리식의 사칙연산", "id": "f2-12-01", "f": 12}, {"k": "ox", "q": "다항식도 유리식이다.", "a": "O", "w": "다항식 $A$는 $\\dfrac{A}{1}$로 나타낼 수 있다.", "t": "유리식의 사칙연산", "id": "f2-12-02", "f": 12}, {"k": "ox", "q": "$\\dfrac{x^{2}+1}{3}$은 다항식이 아닌 유리식이다.", "a": "X", "w": "분모가 상수이므로 $\\dfrac{1}{3}x^{2}+\\dfrac{1}{3}$, 곧 다항식이다.", "t": "유리식의 사칙연산", "id": "f2-12-03", "f": 12}, {"k": "ox", "q": "$\\dfrac{1}{x}$은 다항식이 아닌 유리식이다.", "a": "O", "w": "분모에 문자가 있어 다항식으로 나타낼 수 없다.", "t": "유리식의 사칙연산", "id": "f2-12-04", "f": 12}, {"k": "ox", "q": "유리식의 분모와 분자에 같은 다항식을 더해도 처음 식과 같다. 곧 $\\dfrac{A}{B}=\\dfrac{A+C}{B+C}$이다.", "a": "X", "w": "$\\dfrac{1}{2}\\ne\\dfrac{1+1}{2+1}$이다. 분모와 분자에 $0$이 아닌 같은 식을 곱하거나 나눌 때만 같다.", "t": "유리식의 사칙연산", "id": "f2-12-05", "f": 12}, {"k": "ox", "q": "$\\dfrac{1}{x}+\\dfrac{1}{y}=\\dfrac{2}{x+y}$이다.", "a": "X", "w": "통분하면 $\\dfrac{1}{x}+\\dfrac{1}{y}=\\dfrac{x+y}{xy}$이다.", "t": "유리식의 사칙연산", "id": "f2-12-06", "f": 12}, {"k": "ox", "q": "$\\dfrac{1}{x(x+1)}=\\dfrac{1}{x}-\\dfrac{1}{x+1}$이다.", "a": "O", "w": "우변을 통분하면 $\\dfrac{(x+1)-x}{x(x+1)}=\\dfrac{1}{x(x+1)}$이다.", "t": "부분분수", "id": "f2-12-07", "f": 12}, {"k": "c3", "q": "$\\dfrac{1}{(x+1)(x+3)}$을 부분분수로 나타낸 것은?", "a": "$\\dfrac{1}{2}\\left(\\dfrac{1}{x+1}-\\dfrac{1}{x+3}\\right)$", "c": ["$\\dfrac{1}{2}\\left(\\dfrac{1}{x+1}-\\dfrac{1}{x+3}\\right)$", "$\\dfrac{1}{x+1}-\\dfrac{1}{x+3}$", "$2\\left(\\dfrac{1}{x+1}-\\dfrac{1}{x+3}\\right)$"], "w": "$\\dfrac{1}{x+1}-\\dfrac{1}{x+3}=\\dfrac{2}{(x+1)(x+3)}$이므로 앞에 $\\dfrac{1}{2}$을 곱한다. 분모의 두 인수의 차($2$)로 나눈다.", "t": "부분분수", "id": "f2-12-08", "f": 12}, {"k": "c3", "q": "$\\dfrac{x}{x-1}-\\dfrac{1}{x-1}$을 간단히 하면?", "a": "$1$", "c": ["$1$", "$x$", "$\\dfrac{x-1}{x}$"], "w": "분모가 같으므로 $\\dfrac{x-1}{x-1}=1$이다.", "t": "유리식의 사칙연산", "id": "f2-12-09", "f": 12}, {"k": "ox", "q": "함수 $y=f(x)$에서 $f(x)$가 $x$에 대한 유리식일 때 이 함수를 유리함수라 한다.", "a": "O", "w": "예를 들어 $y=\\dfrac{1}{x}$, $y=\\dfrac{2x+1}{x-1}$은 유리함수이다.", "t": "정의역과 치역", "id": "f2-13-01", "f": 13}, {"k": "ox", "q": "다항함수도 유리함수이다.", "a": "O", "w": "다항식도 유리식이기 때문이다. 다항함수가 아닌 유리함수는 분모에 $x$가 있다.", "t": "정의역과 치역", "id": "f2-13-02", "f": 13}, {"k": "ox", "q": "유리함수에서 정의역이 주어지지 않으면 분모가 $0$이 되지 않는 실수 전체의 집합을 정의역으로 한다.", "a": "O", "w": "$y=\\dfrac{1}{x-2}$의 정의역은 $\\{x\\mid x\\ne 2$인 실수$\\}$이다.", "t": "정의역과 치역", "id": "f2-13-03", "f": 13}, {"k": "ox", "q": "함수 $y=\\dfrac{k}{x}$ $(k\\ne 0)$의 정의역은 실수 전체의 집합이다.", "a": "X", "w": "분모가 $0$이 되는 $x=0$은 제외한다. 정의역은 $\\{x\\mid x\\ne 0$인 실수$\\}$이다.", "t": "정의역과 치역", "id": "f2-13-04", "f": 13}, {"k": "ox", "q": "함수 $y=\\dfrac{2}{x}$의 치역은 $\\{y\\mid y>0\\}$이다.", "a": "X", "w": "치역은 $\\{y\\mid y\\ne 0$인 실수$\\}$이다. $x<0$이면 $y<0$이다.", "t": "정의역과 치역", "id": "f2-13-05", "f": 13}, {"k": "ox", "q": "함수 $y=\\dfrac{k}{x}$ $(k\\ne 0)$의 그래프는 원점에 대하여 대칭이다.", "a": "O", "w": "점 $(a,\\ b)$가 그래프 위에 있으면 점 $(-a,\\ -b)$도 그래프 위에 있다.", "t": "점근선과 그래프의 대칭성", "id": "f2-13-06", "f": 13}, {"k": "ox", "q": "함수 $y=\\dfrac{k}{x}$ $(k\\ne 0)$의 그래프의 점근선은 $x$축과 $y$축이다.", "a": "O", "w": "그래프가 $x$축, $y$축에 한없이 가까워지지만 만나지는 않는다.", "t": "점근선과 그래프의 대칭성", "id": "f2-13-07", "f": 13}, {"k": "ox", "q": "함수 $y=\\dfrac{k}{x}$ $(k\\ne 0)$의 그래프는 $y$축에 대하여 대칭이다.", "a": "X", "w": "원점과 두 직선 $y=x$, $y=-x$에 대하여 대칭이다. $y$축에 대하여 대칭이면 $(a,\\ b)$와 $(-a,\\ b)$가 함께 있어야 하는데 $(-a,\\ -b)$가 있다.", "t": "점근선과 그래프의 대칭성", "id": "f2-13-08", "f": 13}, {"k": "ox", "q": "$k<0$이면 함수 $y=\\dfrac{k}{x}$의 그래프는 제1사분면과 제3사분면에 있다.", "a": "X", "w": "$k<0$이면 제2사분면과 제4사분면에, $k>0$이면 제1사분면과 제3사분면에 있다.", "t": "그래프가 지나는 사분면", "id": "f2-13-09", "f": 13}, {"k": "c3", "q": "함수 $y=\\dfrac{k}{x}$ $(k\\ne 0)$에서 $|k|$의 값이 커질수록 그래프는?", "a": "원점에서 멀어진다.", "c": ["원점에서 멀어진다.", "원점에 가까워진다.", "점근선이 바뀐다."], "w": "같은 $x$에서 $|y|=\\dfrac{|k|}{|x|}$가 커지므로 원점에서 멀어진다. 점근선은 그대로 두 좌표축이다.", "t": "점근선과 그래프의 대칭성", "id": "f2-13-10", "f": 13}, {"k": "ox", "q": "함수 $y=\\dfrac{k}{x-p}+q$의 그래프는 $y=\\dfrac{k}{x}$의 그래프를 $x$축의 방향으로 $p$만큼, $y$축의 방향으로 $q$만큼 평행이동한 것이다.", "a": "O", "w": "$x$ 대신 $x-p$, $y$ 대신 $y-q$를 넣은 꼴이다.", "t": "그래프의 평행이동·대칭이동", "id": "f2-14-01", "f": 14}, {"k": "ox", "q": "함수 $y=\\dfrac{k}{x-p}+q$ $(k\\ne 0)$의 그래프의 점근선은 두 직선 $x=p$, $y=q$이다.", "a": "O", "w": "$y=\\dfrac{k}{x}$의 점근선 $x=0$, $y=0$을 함께 평행이동한 것이다.", "t": "점근선과 그래프의 대칭성", "id": "f2-14-02", "f": 14}, {"k": "ox", "q": "함수 $y=\\dfrac{1}{x+2}-3$의 그래프의 점근선은 두 직선 $x=2$, $y=-3$이다.", "a": "X", "w": "$x+2=x-(-2)$이므로 점근선은 $x=-2$, $y=-3$이다.", "t": "점근선과 그래프의 대칭성", "id": "f2-14-03", "f": 14}, {"k": "ox", "q": "함수 $y=\\dfrac{k}{x-p}+q$ $(k\\ne 0)$의 치역은 실수 전체의 집합이다.", "a": "X", "w": "$\\dfrac{k}{x-p}\\ne 0$이므로 $y\\ne q$이다. 치역은 $\\{y\\mid y\\ne q$인 실수$\\}$, 정의역은 $ const sb=(typeof supabase!=='undefined')?supabase.createClient(SB_URL,SB_ANON):null;
const E=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#x27;');
const $=id=>document.getElementById(id);

let TOK='', DEMO=false, NAME='', BAN='';
let ONLY=null;                 // &f= 로 좁힌 층 번호 Set
const REC={};                  // 문항ID → {o:정오, c:'확실'|'애매', n:시도수}  (가장 최근 시도)
const ITEMS={}; BANK.items.forEach(x=>ITEMS[x.id]=x);
const BYF={}; BANK.items.forEach(x=>(BYF[x.f]=BYF[x.f]||[]).push(x));

/* ── 기기 임시 저장: 못 보낸 기록 대기열 + 로컬 기록(사생활 모드면 조용히 포기) ── */
const LK=k=>'tower:'+BANK.set+':'+(DEMO?'demo':TOK.slice(0,8))+':'+k;
const lget=(k,d)=>{ try{ const v=localStorage.getItem(LK(k)); return v?JSON.parse(v):d; }catch(e){ return d; } };
const lset=(k,v)=>{ try{ localStorage.setItem(LK(k),JSON.stringify(v)); }catch(e){} };

function floorsShown(){ return BANK.floors.filter(f=>!ONLY||ONLY.has(f.no)); }
function stat(fno){
  const its=BYF[fno]||[]; let done=0,ok=0,sure=0;
  its.forEach(x=>{ const r=REC[x.id]; if(!r) return; done++; if(r.o){ ok++; if(r.c==='확실') sure++; } });
  const stars = done<its.length ? 0 : (ok===its.length ? (sure===its.length?3:2) : (ok*2>=its.length?1:0));
  return {n:its.length,done,ok,sure,stars};
}
const starStr=s=>'★'.repeat(s)+'<span style="opacity:.25">'+'★'.repeat(3-s)+'</span>';

/* ── 탑 화면 ── */
function drawTower(){
  const fs=floorsShown();
  let tot=0,ok=0,sure=0,clear=0,nextNo=null;
  fs.forEach(f=>{ const s=stat(f.no); tot+=s.n; ok+=s.ok; sure+=s.sure; if(s.stars>=2) clear++;
    if(nextNo==null && s.stars<2) nextNo=f.no; });
  const H=[];
  H.push(`<div class="brand">수학은유강</div>`
    +`<div class="who"><b>${E(NAME)}</b>${BAN?`<span class="ban">${E(BAN)}</span>`:''}</div>`
    +`<div class="title"><b>개념의 탑</b> · ${E(BANK.범위)}${ONLY?' · 오늘 범위':''}</div>`
    +`<div class="sum"><div><b>${clear}<small style="font-size:12px;color:var(--dim)">/${fs.length}</small></b><span>오른 층</span></div>`
    +`<div><b>${sure}</b><span>확실히 아는 개념</span></div>`
    +`<div><b>${ok}<small style="font-size:12px;color:var(--dim)">/${tot}</small></b><span>맞힌 개념</span></div></div>`
    +`<div class="guide">층마다 교과서 개념을 OX로 확인해요. 막히면 층마다 있는 <b>개념 정리</b>를 펼쳐 봐요.<br> 답을 고르고 <b>확실해요 / 애매해요</b>까지 눌러야 채점돼요.<br>`
    +`모두 맞히면 ★★, 전부 <b>확실하게</b> 맞히면 ★★★. 틀려도 떨어지지 않아요. 해설 읽고 다시 오르면 돼요.</div>`);
  let lastUnit='';
  // 탑이니까 위층이 위에 오게 — 단원 안에서는 거꾸로, 단원도 거꾸로
  [...fs].reverse().forEach(f=>{
    if(f.unit!==lastUnit){ H.push(`<div class="unit">${E(f.unit)}</div>`); lastUnit=f.unit; }
    const s=stat(f.no);
    const st = s.done===0 ? '<span class="st new">도전 전</span>'
      : s.done<s.n ? `<span class="st new">${s.done}/${s.n}</span>`
      : `<span class="st">${starStr(s.stars)}</span>`;
    const cls = (s.stars>=2?' clear':'')+(f.no===nextNo?' nextf':'');
    H.push(`<button class="fl${cls}" data-f="${f.no}"><span class="no">${f.no}F</span>`
      +`<span class="nm">${E(f.name)}<small>${s.n}문항${f.no===nextNo?' · 다음 층':''}</small></span>${st}</button>`);
  });
  H.push(`<div class="foot">${DEMO?'<b>미리보기</b>예요. 기록이 저장되지 않아요.<br>'
    :`이 주소는 ${E(NAME)} 개인 링크예요. 다른 사람에게 전달하지 마세요.<br>`}`
    +`점수는 성적이랑 상관없어요. 쌤은 <b>어느 개념이 애매한지</b>만 봐요. 그걸로 다음 수업을 준비해요.`
    +(BANK.links||[]).map(l=>`<a class="olink" href="${E(l.p+location.search)}">${E(l.t)} →</a>`).join('')+`</div>`);
  $('app').innerHTML=H.join('');
  $('app').querySelectorAll('.fl').forEach(b=>b.onclick=()=>startFloor(+b.dataset.f,null));
  window.scrollTo(0,0);
}

/* ── 개념 정리 카드 (교과서 정리 상자) ── */
function cardHTML(F){
  return `<div class="cbox"><div class="ct">개념 정리 · ${E(F.name)}</div>`
    +F.card.map(([t,x])=>`<div class="cl"><em class="${t==='주의'?'ju':''}">${E(t)}</em><span>${E(x)}</span></div>`).join('')+`</div>`;
}

/* ── 층 풀기 ── */
let PLAY=null;   // {f, list:[item], i, pick, t0, out:[row]}
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function startFloor(fno, onlyIds){
  let list=BYF[fno]||[];
  if(onlyIds) list=list.filter(x=>onlyIds.includes(x.id));
  PLAY={f:fno, list:shuffle(list).map(x=>({...x, cs: x.k==='c3'?shuffle(x.c):['O','X']})), i:0, out:[], retry:!!onlyIds, pre:false};
  if(onlyIds) drawQ(); else drawIntro();
}
/* 층 입구 — 개념 정리는 접어 둔다. 먼저 읽으면 첫 시도가 '읽고 푼 것'으로 기록된다(카드=1). */
function drawIntro(){
  const P=PLAY, F=BANK.floors.find(f=>f.no===P.f);
  $('app').innerHTML=
    `<div class="top"><button class="back" id="back">← 탑</button><div class="fname"><b>${P.f}F</b> ${E(F.unit)}</div></div>`
    +`<div class="intro"><h2>${E(F.name)}</h2><div class="sub">${P.list.length}문항 · 답을 고르고 확실해요/애매해요까지 누르면 채점돼요</div>`
    +`<div id="cardhost"><button class="cardbtn" id="pre" style="margin:0 0 14px">개념 정리 먼저 읽기</button></div>`
    +`<div class="btns"><button class="p" id="start">풀기 시작</button></div></div>`;
  $('back').onclick=drawTower;
  $('pre').onclick=()=>{ P.pre=true; $('cardhost').innerHTML=cardHTML(F); };
  $('start').onclick=drawQ;
  window.scrollTo(0,0);
}
function drawQ(){
  const P=PLAY, x=P.list[P.i], F=BANK.floors.find(f=>f.no===P.f);
  P.pick=null; P.t0=Date.now();
  const dots=P.list.map((y,j)=>{ const r=P.out[j]; return `<i class="${r?(r.o?'o':'x'):''}${j===P.i?' cur':''}"></i>`; }).join('');
  const opts = x.k==='ox'
    ? `<div class="ox">${x.cs.map(c=>`<button data-v="${c}">${c}</button>`).join('')}</div>`
    : `<div class="ch">${x.cs.map(c=>`<button data-v="${E(c)}">${E(c)}</button>`).join('')}</div>`;
  $('app').innerHTML=
    `<div class="top"><button class="back" id="back">← 탑</button><div class="fname"><b>${P.f}F</b> ${E(F.name)}${P.retry?' · 다시':''}</div></div>`
    +`<div class="dots">${dots}</div>`
    +`<div class="qcard"><div class="kind">${P.i+1} / ${P.list.length} · ${x.k==='ox'?'맞으면 O, 틀리면 X':'알맞은 것을 고르세요'}</div><div class="q">${E(x.q)}</div></div>`
    +opts
    +`<div class="conf" id="conf"><p>이 답, 얼마나 자신 있어요?</p><div class="row2"><button class="sure" data-c="확실">확실해요</button><button class="unsure" data-c="애매">애매해요</button></div></div>`
    +`<div class="res" id="res"></div>`
    +`<button class="next" id="next">${P.i+1<P.list.length?'다음 →':'이 층 결과 보기'}</button>`;
  $('back').onclick=()=>{ if(P.out.length) finishFloor(true); else drawTower(); };
  const bs=$('app').querySelectorAll('.ox button,.ch button');
  bs.forEach(b=>b.onclick=()=>{
    if(P.graded) return;
    P.pick=b.dataset.v; bs.forEach(y=>y.classList.toggle('on',y===b));
    $('conf').classList.add('show');
  });
  $('conf').querySelectorAll('button').forEach(b=>b.onclick=()=>grade(b.dataset.c));
  $('next').onclick=()=>{ P.graded=false; P.i++; if(P.i<P.list.length) drawQ(); else finishFloor(false); };
  P.graded=false;
  window.scrollTo(0,0);
}
function grade(conf){
  const P=PLAY, x=P.list[P.i];
  if(P.graded||P.pick==null) return;
  P.graded=true;
  // data-v 는 E() 로 넣었다가 dataset 이 되돌려 준다 — 원문과 그대로 비교된다
  const o = P.pick===x.a;
  const prev=REC[x.id];
  const row={i:x.id, f:x.f, a:P.pick, o, c:conf, ms:Math.min(Date.now()-P.t0, 600000), n:(prev?prev.n:0)+1, k:P.pre?1:0};
  P.out.push(row); REC[x.id]={o, c:conf, n:row.n};
  $('app').querySelectorAll('.ox button,.ch button').forEach(b=>{
    b.disabled=true; b.classList.remove('on');
    if(b.dataset.v===x.a) b.classList.add('right'); else if(b.dataset.v===P.pick) b.classList.add('wrong');
  });
  $('conf').classList.remove('show');
  const F=BANK.floors.find(f=>f.no===P.f);
  const head = o ? (conf==='확실'?'맞았어요!':'맞았어요. 애매했다면 해설로 굳혀요') : '아쉬워요. 정답은 '+(x.k==='ox'?x.a:'「'+x.a+'」')+'예요';
  const r=$('res'); r.className='res show '+(o?'o':'x');
  r.innerHTML=`<div class="h">${E(head)}</div><div class="w">${E(x.w)}</div>`
    +`<div id="cardhost"><button class="cardbtn" id="cardbtn">${(!o||conf==='애매')?'개념 정리 다시 보기':'개념 정리 보기'}</button></div>`;
  $('cardbtn').onclick=()=>{ row.k|=2; $('cardhost').innerHTML=cardHTML(F); };
  $('next').classList.add('show');
  const d=$('app').querySelectorAll('.dots i')[P.i]; if(d) d.className=o?'o cur':'x cur';
  lset('rec',REC);
}

/* ── 층 결과 + 보내기 ── */
async function finishFloor(quit){
  const P=PLAY, F=BANK.floors.find(f=>f.no===P.f), s=stat(P.f);
  const rows=P.out;
  const q=lget('queue',[]).concat(rows.map(r=>({...r,set:BANK.set})));
  lset('queue',q);
  const bad=P.list.filter(x=>{ const r=REC[x.id]; return r && (!r.o||r.c==='애매'); });
  const wrongN=P.list.filter(x=>REC[x.id]&&!REC[x.id].o).length;
  const H=[];
  H.push(`<div class="top"><button class="back" id="back">← 탑</button><div class="fname"><b>${P.f}F</b> ${E(F.name)}</div></div>`);
  H.push(`<div class="done"><div class="stars">${s.done<s.n?'':starStr(s.stars)}</div>`
    +`<b>${quit?'여기까지 저장할게요':s.stars===3?'완벽해요! 이 층 정복':s.stars===2?'다 맞았어요!':'이 층 한 바퀴 끝'}</b>`
    +`<p>이 층 ${s.n}문항 중 <b style="display:inline;font-size:inherit;color:var(--ok)">${s.ok}</b>개 맞힘 · 확실하게 맞힘 ${s.sure}개</p>`
    +`<div class="save" id="save">${DEMO?'미리보기라 저장하지 않아요':'기록 보내는 중…'}</div></div>`);
  if(bad.length){
    H.push(`<div class="list">`+bad.map(x=>{ const r=REC[x.id];
      return `<div class="${r.o?'lu':'lx'}"><em>${r.o?'애매':'틀림'}</em>${E(x.q)}</div>`; }).join('')+`</div>`);
  }
  H.push(`<div class="btns">`
    +(bad.length?`<button class="p" id="redo">틀리거나 애매한 ${bad.length}개 다시 풀기</button>`:'')
    +(s.stars>=2 && nextFloor(P.f)?`<button class="${bad.length?'s':'p'}" id="go">다음 층(${nextFloor(P.f)}F) 오르기 →</button>`:'')
    +`<button class="s" id="tower">탑으로</button></div>`);
  $('app').innerHTML=H.join('');
  window.scrollTo(0,0);
  $('back').onclick=$('tower').onclick=()=>drawTower();
  if($('redo')) $('redo').onclick=()=>startFloor(P.f, bad.map(x=>x.id));
  if($('go')) $('go').onclick=()=>startFloor(nextFloor(P.f),null);
  const ok=await flush();
  const el=$('save'); if(!el||DEMO) return;
  if(ok){ el.textContent='기록 저장됨 ✓'; }
  else { el.textContent='지금은 저장이 안 됐어요. 기기에 남겨 두고 다음에 열 때 다시 보낼게요.'; el.className='save bad'; }
}
function nextFloor(f){ const fs=floorsShown().map(x=>x.no); const i=fs.indexOf(f); return i>=0&&i+1<fs.length?fs[i+1]:null; }

/* 대기열을 서버로. 30행씩. 성공한 만큼만 지운다. */
async function flush(){
  if(DEMO){ lset('queue',[]); return true; }
  let q=lget('queue',[]);
  while(q.length){
    const chunk=q.slice(0,30);
    let data,err;
    try{ ({data,error:err}=await sb.rpc('tower_submit',{tok:TOK, skey:BANK.set,
      recs:chunk.map(r=>({i:r.i,f:r.f,a:r.a,o:r.o,c:r.c,ms:r.ms,n:r.n,k:r.k||0}))})); }
    catch(e){ err=e; }
    if(err||!data||!data.ok) return false;
    q=q.slice(chunk.length); lset('queue',q);
  }
  return true;
}

/* (1110) 수식 — #app 이 바뀌면 $…$ 를 KaTeX 로. 그리는 동안은 관찰을 끊어 되먹임을 막는다 */
let TEXOB=null;
function texApp(){
  const el=$('app'); if(!el || typeof renderMathInElement!=='function') return;
  if(TEXOB) TEXOB.disconnect();
  try{ renderMathInElement(el,{delimiters:[{left:'$',right:'$',display:false}],throwOnError:false,strict:'ignore'}); }catch(e){}
  if(TEXOB) TEXOB.observe(el,{childList:true,subtree:true});
}
function texInit(n=0){
  if(typeof renderMathInElement!=='function'){ if(n<50) setTimeout(()=>texInit(n+1),100); return; }
  TEXOB=new MutationObserver(()=>texApp()); texApp();
}
function say(t,s){ $('msg').innerHTML=`<b>${E(t)}</b>${E(s||'')}`; $('msg').style.display=''; $('app').style.display='none'; }

texInit();
(async()=>{
  const p=new URLSearchParams(location.search);
  TOK=p.get('t')||''; DEMO=p.get('demo')==='1';
  const fq=p.get('f');
  if(fq){ const S=new Set(); fq.split(',').forEach(t=>{ const m=t.trim().match(/^(\d+)(?:-(\d+))?$/); if(!m) return;
    const a=+m[1], b=m[2]?+m[2]:a; for(let k=Math.min(a,b);k<=Math.max(a,b);k++) S.add(k); });
    if(S.size) ONLY=S; }
  if(DEMO){ NAME='미리보기'; Object.assign(REC, lget('rec',{})); }
  else{
    if(!TOK) return say('링크가 올바르지 않아요.','포털에서 [개념의 탑]을 눌러 들어와 주세요~');
    if(!sb) return say('지금은 열 수 없어요.','잠시 뒤에 다시 열어 주세요.');
    let data,err;
    try{ ({data,error:err}=await sb.rpc('tower_open',{tok:TOK, skey:BANK.set})); }
    catch(e){ err=e; }
    if(err) return say('지금은 열 수 없어요.','잠시 뒤에 다시 열어 주세요. 계속 이러면 쌤한테 알려 주세요~');
    if(!data) return say('만료되었거나 잘못된 링크예요.','새 링크가 필요하면 쌤한테 말해 주세요~');
    NAME=data.이름||''; BAN=data.반||'';
    // 서버 기록(다른 기기 포함) 위에 이 기기에서 아직 못 보낸 것을 얹는다
    Object.assign(REC, data.기록||{});
    lget('queue',[]).forEach(r=>{ REC[r.i]={o:r.o,c:r.c,n:r.n}; });
    flush();
  }
  $('msg').style.display='none'; $('app').style.display='';
  drawTower();
})();
