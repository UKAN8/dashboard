<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>파이널 모의고사 신청 · 수학은유강</title>
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="고3 파이널 모의고사 신청 · 수학은유강">
<meta property="og:description" content="11/13(금) 10:30~12:10 · 필탑학원 신관 · 응시 무료">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2/dist/umd/supabase.min.js"></script>
<style>
:root{color-scheme:dark;
 --bg:#0a0a0f; --card:rgba(255,255,255,.03); --bd:rgba(255,255,255,.07);
 --tx:#f5f5fa; --tx2:#b8b8c5; --dim:#8a8a98; --acc:#f5a0a0;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{max-width:100%;overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--tx);
 font:15px/1.6 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;
 padding:22px clamp(16px,4vw,28px) calc(110px + env(safe-area-inset-bottom))}
main{max-width:620px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:7px;font-family:'Paperlogy',sans-serif;font-weight:700;font-size:16px}
.dots{position:relative;width:26px;height:16px}
.dots i{position:absolute;top:0;width:16px;height:16px;border-radius:50%}
.dots i:first-child{left:0;background:var(--acc)}
.dots i:last-child{left:9px;background:#f5f5fa}
.dday{font-family:'Paperlogy',sans-serif;font-weight:800;font-size:12.5px;color:#1a0d12;background:var(--acc);border-radius:99px;padding:4px 11px}
.eye{font-family:'Paperlogy',sans-serif;color:var(--acc);font-weight:700;font-size:14px;margin:22px 0 2px}
h1{font-family:'Paperlogy',sans-serif;font-weight:900;font-size:34px;line-height:1.15;margin:0 0 6px;letter-spacing:-.02em}
.lead{color:var(--tx2);font-size:14px;margin:0 0 16px}
.ticket{position:relative;display:grid;grid-template-columns:1fr 104px;background:#f4f1ec;color:#141418;border-radius:18px;overflow:hidden;margin-bottom:22px;font-family:'Paperlogy','Pretendard',sans-serif}
.ticket .main{padding:18px 20px 18px}
.ticket .ttl{font-size:11px;font-weight:700;letter-spacing:.14em;color:#8a7f78}
.ticket .nm{font-size:21px;font-weight:900;letter-spacing:-.02em;margin:2px 0 12px}
.ticket dl{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin:0;padding-top:12px;border-top:1.5px solid #e2ddd5}
.ticket dt{font-size:11.5px;color:#8a7f78;font-weight:600;margin-bottom:2px}
.ticket dd{margin:0;font-weight:800;font-size:15px;line-height:1.35;letter-spacing:-.01em}
.ticket dd small{display:block;font-family:'Pretendard',sans-serif;font-weight:500;font-size:12px;color:#6d655f;margin-top:2px}
.stub{background:var(--acc);border-left:3px dashed #f4f1ec;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#160b0d}
.stub small{font-size:12px;font-weight:700;color:#5a2c2b}
.stub b{font-size:52px;font-weight:900;line-height:1;margin:4px 0 2px}
.stub span{font-weight:800;font-size:15px}
.notch{position:absolute;right:93px;width:22px;height:22px;border-radius:50%;background:var(--bg)}
.notch.a{top:-11px}.notch.b{bottom:-11px}
@media (max-width:420px){.ticket dl{grid-template-columns:1fr}.ticket{grid-template-columns:1fr 88px}.notch{right:77px}.stub b{font-size:44px}}
.q{background:var(--card);border:1px solid var(--bd);border-radius:15px;padding:15px 16px;margin-bottom:11px}
.q .n{font-size:11px;letter-spacing:.14em;color:var(--acc);margin-bottom:5px}
.q .t{font-weight:700;margin-bottom:3px}
.q .s{color:var(--dim);font-size:12.5px;margin-bottom:10px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:14px;color:var(--tx2);
 background:rgba(255,255,255,.035);border:1px solid var(--bd);border-radius:11px;
 padding:11px 13px;cursor:pointer;transition:background .12s,border-color .12s,color .12s}
.opt.on{background:rgba(245,160,160,.16);border-color:rgba(245,160,160,.5);color:#ffe9e9;font-weight:700}
@media (hover:hover) and (pointer:fine){ .opt:hover{border-color:rgba(245,160,160,.35);color:var(--tx)} }
.opt small{display:block;font-weight:400;font-size:12px;color:var(--dim)}
.opt.on small{color:#f3caca}
input.tx,textarea{width:100%;font:inherit;font-size:16px;color:var(--tx);background:rgba(255,255,255,.035);
 border:1px solid var(--bd);border-radius:11px;padding:11px 13px;margin-top:8px}
textarea{min-height:76px;resize:vertical;font-size:15px}
input::placeholder,textarea::placeholder{color:var(--dim)}
.bar{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(to top,#0a0a0f 62%,rgba(10,10,15,0));
 padding:14px clamp(16px,4vw,28px) calc(16px + env(safe-area-inset-bottom))}
.bar .in{max-width:620px;margin:0 auto}
.hint{color:var(--dim);font-size:12px;text-align:center;margin-bottom:8px;min-height:18px}
button.send{width:100%;font:inherit;font-size:16px;font-weight:800;color:#1a0d12;
 background:var(--acc);border:none;border-radius:13px;padding:15px;cursor:pointer}
button.send[disabled]{background:rgba(255,255,255,.08);color:var(--dim);cursor:default}
.done{text-align:center;padding:60px 10px}
.done .k{font-size:44px;line-height:1}
.done b{display:block;font-size:20px;margin:16px 0 8px}
.done p{color:var(--tx2);font-size:14px;margin:0 0 6px}
.done button{margin-top:22px;font:inherit;font-size:14px;color:var(--tx2);background:none;border:1px solid var(--bd);border-radius:11px;padding:10px 16px;cursor:pointer}
.closed{padding:60px 4px;color:var(--tx2)}
.closed b{display:block;color:var(--tx);font-size:18px;margin-bottom:6px}
footer{color:var(--dim);font-size:12px;text-align:center;margin-top:26px}
</style></head>
<body><main id="app"></main>
<div class="bar" id="bar"><div class="in"><div class="hint" id="hint"></div><button class="send" id="send" disabled>신청하기</button></div></div>
<script>
const SB_URL='https://bkgerndnwukvuuqdgnxt.supabase.co';
const SB_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJrZ2VybmRud3VrdnV1cWRnbnh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyNjA3MzgsImV4cCI6MjEwMTgzNjczOH0.VcfcTc9QkecKWFPUiYVXKGEXLxmVp8ugfiF6EV5_kjk';
/* 1101 고3 파이널 모의고사(11/13) 신청 — extra_study_submit RPC 재사용 (신청키 final1113)
 * 칸 대응: 반=수강생/외부 학생 · 단원=[선택과목, 고3 재학/재수생] · 희망일=['11/13(금)'] · 메모='연락처 …' + 남길 말 */
const KEY='final1113', CLOSE='2026-11-12';
const app=document.getElementById('app');
const $=s=>app.querySelector(s);
const st={신청자:'',학생이름:'',학교:'',반:'',구분:'',과목:'',연락처:'',메모:''};

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function today(){return new Date(Date.now()+9*3600e3).toISOString().slice(0,10)}
const head=()=>`<div class="top"><div class="brand"><span class="dots"><i></i><i></i></span>수학은유강</div><div class="dday">수능 D-6</div></div>`;

function render(){
 if(today()>CLOSE){
  app.innerHTML=`${head()}<div class="closed"><b>신청이 마감되었습니다</b>문의는 선생님께 직접 연락 주세요.</div>`;
  document.getElementById('bar').style.display='none';return;
 }
 app.innerHTML=`${head()}
 <div class="eye">고3 · 11/13(금)</div>
 <h1>파이널 모의고사 신청</h1>
 <p class="lead">수능 수학과 같은 시간에 진행합니다.</p>
 <div class="ticket">
  <div class="notch a"></div><div class="notch b"></div>
  <div class="main">
   <div class="ttl">ADMISSION</div>
   <div class="nm">파이널 모의고사</div>
   <dl>
    <div><dt>일시</dt><dd>11/13(금) 10:30~12:10<small>10:20까지 입실 완료</small></dd></div>
    <div><dt>장소</dt><dd>필탑학원 신관<small>응시는 누구나</small></dd></div>
    <div><dt>과목</dt><dd>공통 + 선택<small>미적분 · 확률과 통계 중 택1</small></dd></div>
    <div><dt>풀이 수업</dt><dd>시험 직후 진행<small>수강생만 참여</small></dd></div>
   </dl>
  </div>
  <div class="stub"><small>응시료</small><b>0</b><span>원</span></div>
 </div>

 <div class="q"><div class="n">01</div><div class="t">작성하시는 분</div>
  <div class="opts">${['학생','학부모'].map(v=>opt('신청자',v,v)).join('')}</div></div>

 <div class="q"><div class="n">02</div><div class="t">학생 이름</div>
  <input class="tx" id="nm" maxlength="10" placeholder="예) 홍길동" autocomplete="off" value="${esc(st.학생이름)}"></div>

 <div class="q"><div class="n">03</div><div class="t">학교</div><div class="s">재수생은 출신 고등학교를 적어 주세요.</div>
  <input class="tx" id="sc" maxlength="20" placeholder="예) 필탑고" autocomplete="off" value="${esc(st.학교)}"></div>

 <div class="q"><div class="n">04</div><div class="t">수강 여부</div>
  <div class="opts">${opt('반','수강생','필탑 수강생','풀이 수업 참여')}${opt('반','외부 학생','외부 학생','시험만 응시')}</div></div>

 <div class="q"><div class="n">05</div><div class="t">재학생 / 재수생</div>
  <div class="opts">${opt('구분','고3 재학','고3 재학생')}${opt('구분','재수생','재수생','N수 포함')}</div></div>

 <div class="q"><div class="n">06</div><div class="t">선택과목</div>
  <div class="opts">${['미적분','확률과 통계'].map(v=>opt('과목',v,v)).join('')}</div></div>

 <div class="q"><div class="n">07</div><div class="t">연락처</div><div class="s">시험 안내를 보내 드릴 번호예요.</div>
  <input class="tx" id="ph" type="tel" inputmode="numeric" maxlength="13" placeholder="010-0000-0000" autocomplete="tel" value="${esc(st.연락처)}"></div>

 <div class="q"><div class="n">08</div><div class="t">남길 말 <span style="color:var(--dim);font-weight:400">(선택)</span></div>
  <textarea id="memo" maxlength="300" placeholder="궁금한 점 등">${esc(st.메모)}</textarea></div>
 <footer>필탑학원 고등수학 · 수학은유강</footer>`;
 app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{st[b.dataset.k]=b.dataset.v;render()});
 $('#nm').oninput=e=>{st.학생이름=e.target.value;check()};
 $('#sc').oninput=e=>{st.학교=e.target.value;check()};
 $('#ph').oninput=e=>{st.연락처=e.target.value;check()};
 $('#memo').oninput=e=>{st.메모=e.target.value};
 check();
}
function opt(k,v,l,sub){return `<button class="opt ${st[k]===v?'on':''}" data-k="${k}" data-v="${esc(v)}">${esc(l)}${sub?`<small>${esc(sub)}</small>`:''}</button>`}
const digits=s=>String(s).replace(/\D/g,'');
function phone(){const d=digits(st.연락처);return d.length===11?d.replace(/(\d{3})(\d{4})(\d{4})/,'$1-$2-$3'):d.length===10?d.replace(/(\d{3})(\d{3})(\d{4})/,'$1-$2-$3'):''}

function missing(){
 const m=[];
 if(!st.신청자)m.push('작성자');
 if(st.학생이름.replace(/\s/g,'').length<2)m.push('이름');
 if(st.학교.trim().length<2)m.push('학교');
 if(!st.반)m.push('수강 여부');
 if(!st.구분)m.push('재학/재수');
 if(!st.과목)m.push('선택과목');
 if(!phone())m.push('연락처');
 return m;
}
function check(){
 const m=missing();
 document.getElementById('send').disabled=m.length>0;
 document.getElementById('hint').textContent=m.length?('남은 항목: '+m.join(' · ')):'';
}

const sb=supabase.createClient(SB_URL,SB_ANON);
document.getElementById('send').onclick=async()=>{
 if(missing().length)return;
 const btn=document.getElementById('send');btn.disabled=true;btn.textContent='보내는 중…';
 const memo=('연락처 '+phone()+(st.메모.trim()?' · '+st.메모.trim():'')).slice(0,500);
 const p={신청키:KEY,신청자:st.신청자,학생이름:st.학생이름.replace(/\s/g,''),학교:st.학교.trim(),반:st.반,희망일:['11/13(금)'],단원:[st.과목,st.구분],메모:memo};
 try{
  const {data,error}=await sb.rpc('extra_study_submit',{p});
  if(error||!data||!data.ok) throw error||new Error(data&&data.why||'실패');
  done(p,data.수정);
 }catch(e){
  btn.disabled=false;btn.textContent='신청하기';
  document.getElementById('hint').textContent='전송에 실패했습니다. 잠시 뒤 다시 눌러 주세요.';
 }
};
function done(p,upd){
 document.getElementById('bar').style.display='none';
 app.innerHTML=`${head()}
 <div class="done"><div class="k">✓</div><b>${upd?'신청 내용이 수정되었습니다':'신청이 접수되었습니다'}</b>
 <p>${esc(p.학생이름)} · ${esc(p.학교)} · ${esc(st.구분)} · ${esc(st.과목)}</p>
 <p style="margin-top:14px"><b style="display:inline;font-size:15px;color:var(--acc)">11/13(금) 10:20까지</b> 필탑학원 신관으로 와 주세요.</p>
 <button id="again">내용 고치기</button></div>`;
 document.getElementById('again').onclick=()=>{document.getElementById('bar').style.display='';const b=document.getElementById('send');b.textContent='신청하기';render()};
}
render();
</script></body></html>
