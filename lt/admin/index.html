let D=null, EX={}, ROWS=[], TAB='slot', FX='', SORT={}, sureGate=false;

/* ── 계산: 응시 한 건 → 지표 ── */
function calc(r,a){
  const e=EX[a.시험]; if(!e) return null;
  const J=e.판정||{}, up=J.상위레벨||[3,4], cut=J.심화||{총점:999,상위:999};
  const o={r,a,e,id:r.id+':'+a.시험,이름:r.이름,학교:r.학교||'',소속:r.소속||'',현장:r.현장등록,형:e.형,

    찍음점:0,실수점:0,찍음상위:0,실수상위:0,개념틀림:[],설문:a.설문||{}};
  e.문항.forEach(q=>{
    const no=String(q.번호), an=(a.답||{})[no]||{}, ok=!!(a.정오||{})[no], rv=(a.복기||{})[no]||null, isUp=up.includes(q.레벨);
    o.lv[q.레벨]=(o.lv[q.레벨]||0)+(ok?q.배점:0); o.lvF[q.레벨]=(o.lvF[q.레벨]||0)+q.배점;
    o.un[q.단원]=(o.un[q.단원]||0)+(ok?1:0); o.unF[q.단원]=(o.unF[q.단원]||0)+1;
    let kind;
    if(ok){ if(an.c==='찍음'){o.찍음정답++;o.찍음점+=q.배점; if(isUp)o.찍음상위+=q.배점; kind='luck';} else if(an.c==='애매'){o.애매정답++;kind='luck';} else {o.확실정답++;kind='ok';} }
    else {
      o.오답++; if(an.c==='안풂') o.안풂++;
      if(q.레벨===1) o.개념틀림.push(q);
      if(!rv){o.미확인++;kind=an.c==='안풂'?'skip':'nr';}
      else if(rv.k==='실수'){o.실수++;o.실수점+=q.배점;if(isUp)o.실수상위+=q.배점;kind='slip';}
      else if(rv.k==='모름'){o.모름++;kind='no';}
      else if(rv.k==='시간'){o.시간++;kind='skip';}
      else {o.못댐++;kind='skip';}
    }
    o.items.push({q,an,ok,rv,kind});
  });
  o.상위=up.reduce((s,l)=>s+(o.lv[l]||0),0);
  const pass=(sc,u)=>sc>=cut.총점&&u>=cut.상위;
  o.심화=pass(o.점수,o.상위);
  o.찍음보정=o.점수-o.찍음점; o.실수보정=o.점수+o.실수점;

/* ── 정렬: 누른 순서대로 우선순위 (1031 유강) ── */
function sortRows(key,rows,cols){
  const ks=SORT[key]||[]; if(!ks.length) return rows;
  const val=(row,c)=>{ const v=cols[c].v(row); return v==null||v===''?null:v; };
  return rows.map((r,i)=>[r,i]).sort((A,B)=>{
    for(const {c,d} of ks){ const x=val(A[0],c), y=val(B[0],c);
      if(x===y) continue; if(x==null) return 1; if(y==null) return -1;
      const r=(typeof x==='number'&&typeof y==='number')?x-y:String(x).localeCompare(String(y),'ko');
      if(r) return d*r; }
    return A[1]-B[1]; }).map(x=>x[0]);
}

    +((SORT[key]||[]).length?'<div style="text-align:right;margin-top:4px"><button class="link" data-sreset="'+key+'" style="background:none;border:0">정렬 초기화</button></div>':'');

document.addEventListener('click',ev=>{

/* ── 탭: 회차 (1117 유강 — 사전 예약제 · 시험 끝나면 자동으로 입력 열고 알림톡 · 일정 밖 신규생은 개별 회차) ── */
const KST=t=>new Date(new Date(t).getTime()+9*3600e3);
const z2=n=>String(n).padStart(2,'0');
const hm=t=>{ const d=KST(t); return z2(d.getUTCHours())+':'+z2(d.getUTCMinutes()); };
const addMin=(t,m)=>new Date(new Date(t).getTime()+m*60e3).toISOString();
function slotState(sl){
  const n=Date.now(), st=new Date(sl.시작).getTime(), end=st+sl.시험분*60e3, inEnd=end+sl.입력분*60e3;
  if(sl.열림시각){ const cl=sl.닫힘?new Date(sl.닫힘).getTime():inEnd; return n<cl?['on','입력 중 · '+hm(cl)+'까지']:['done','끝']; }
  if(n<st) return ['wait','예정 · '+hm(end)+'에 '+(sl.자동?'자동으로 열림':'수동')];
  if(n<end) return ['test','시험 중 · '+hm(end)+'에 '+(sl.자동?'자동으로 열림':'수동')];
  if(n<inEnd) return [sl.자동?'test':'wait', sl.자동?'곧 열림(1분 안)':'수동 — [지금 열고 알림]을 눌러 주세요'];
  return ['miss','안 열림(지남)'];
}
const STC={on:'t-deep',done:'t-dim',wait:'t-base',test:'t-warn',miss:'t-bad'};

  const res=String(a.결과||''); const c=res.startsWith('성공')||res.startsWith('건너뜀')?'t-deep':res.startsWith('번호')?'t-warn':'t-bad';
  return '<span class="tag '+c+'" title="'+E(res+' · '+fmtT(a.시각))+'">'+E(res.startsWith('성공(문자)')?'문자 감':res.startsWith('성공')?'알림톡 감':res.startsWith('번호')?'번호 없음':res.startsWith('건너뜀')?'보냄':'실패')+'</span>'; }

    h+='<div class="slot '+k+'"><div class="sh"><span class="tm">'+slotLabelShort(sl)+'</span>'+(sl.메모?'<span class="memo">'+E(sl.메모)+'</span>':'')
      +'<span class="tag '+STC[k]+'">'+E(txt)+'</span><span class="sp"></span>'
      +'<span class="meta">'+exs.filter(e=>sl.시험.includes(e.id)).map(e=>e.형).join('·')+' · 배정 <b>'+rs.length+'</b> · 제출 <b>'+sub+'</b>'+(sl.열림시각?' · 알림 <b>'+ok+'/'+rs.length+'</b>':'')+'</span>'

      +(!sl.열림시각?'<span class="menu"><button class="ghost" data-open-slot="'+sl.id+'" title="시험이 일찍 끝났을 때">지금 열기</button><button class="ghost" data-del-slot="'+sl.id+'">삭제</button></span>':'')+'</div>'
      +(rs.length?'<div class="sb">'+table('sl'+sl.id,COLS['sl'+sl.id],rs)+'</div>':'<div class="empty">배정된 학생 없음 — 오른쪽 목록에서 이 회차로 배정해 주세요</div>')+'</div>';
  });
  h+='</div><aside class="side"><div class="card"><div class="sideh"><b>회차 미정</b><span class="tag '+(un.length?'t-warn':'t-deep')+'">'+un.length+'명</span></div>'
    +(un.length?'<div class="dim" style="font-size:12.5px;margin:2px 0 10px">예약받은 회차를 골라 주세요</div>'
      +un.map(r=>'<div class="urow"><div><b>'+E(r.이름)+'</b><div class="dim">'+E(r.학교||'')+(r.소속?' · '+E(mathCls(r.소속)):'')+'</div></div><select data-asg="'+r.id+'">'+slotOpts(null,true)+'</select></div>').join('')
      :'<div class="dim" style="font-size:13px">모두 배정됐어요 🙂</div>')+'</div></aside></div>';
  return h;
}

    foot='<div class="hint">번호 하나는 꼭 넣어 주세요 — 뒷 4자리가 학생 확인 번호가 되고, 알림도 이 번호로 가요.</div>'; }

      +fld('시작','<select id="wwhen"><option value="now">지금 시작</option><option value="at">시각 지정</option></select>')+fld('시각','<input type="time" id="wt" step="600" disabled>')+fld('시험지',exBox('wex'),1);
    foot='<div class="hint">그 학생만의 회차가 생겨요. 50분 뒤 입력이 열리고 알림이 가요. 명단에 없으면 [학생 추가]부터.</div>'; }
  if(kind==='edit'){ const r=ros.find(x=>x.id===rid); if(!r) return; t='학생 정보 수정';
    b=fld('이름','<input type="text" id="en" value="'+E(r.이름)+'">')+fld('학교','<input type="text" id="es" value="'+E(r.학교||'')+'">')
      +fld('학생 번호','<input type="text" id="ep" value="'+E(r.학생폰||'')+'">')+fld('학부모 번호','<input type="text" id="eq" value="'+E(r.부모폰||'')+'">')
      +fld('중등 반','<input type="text" id="eg" value="'+E(r.소속||'')+'">')+fld('회차','<select id="eslot">'+slotOpts(r.회차,true)+'</select>')+fld('메모','<input type="text" id="em" value="'+E(r.메모||'')+'">',1);
    foot='<div class="hint">'+(r.수정?'마지막 수정 · '+E(r.수정.누가||'')+' '+fmtT(r.수정.언제):'')+((r.응시||[]).length?' · 제출 기록이 있어 삭제는 안 돼요':'')+'</div>'; }
  sheet.innerHTML='<h2 style="font-size:19px;margin-bottom:14px">'+t+'</h2><div class="fgrid">'+b+'</div>'+foot+'<div class="err" id="ferr"></div>'
    +'<div class="act">'+(kind==='edit'&&!(ros.find(x=>x.id===rid).응시||[]).length?'<button id="fdel" style="margin-right:auto;color:var(--bad)">학생 삭제</button>':'')+'<button id="fcancel">취소</button><button class="pri" id="fok">'+(kind==='edit'?'저장':kind==='walk'?'만들기':'추가')+'</button></div>';
  sheet.style.maxWidth='560px'; dlg.classList.add('on');

  $('fcancel').onclick=()=>dlg.classList.remove('on');

  const rpc=async(fn,a)=>{ const {data,error}=await sb.rpc(fn,a); if(error||!data||data.오류){ err((data&&data.오류)||(error&&error.message)||'실패'); return null; } return data; };
  $('fok').onclick=async()=>{
    if(kind==='slot'){ if(!$('fd').value||!$('ft').value) return err('날짜·시각을 넣어 주세요');

      if($('wwhen').value==='at'){ if(!$('wt').value) return err('시각을 넣어 주세요'); start=today+'T'+$('wt').value+':00+09:00'; }
      const s1=await rpc('staff_lt_slot_save',{p_id:null,p_start:start,p_exams:pickEx('wex'),p_test:50,p_input:120,p_memo:'개별 · '+r.이름,p_auto:true}); if(!s1) return;
      if(!await rpc('staff_lt_assign',{p_rid:id,p_slot:s1.id})) return; toast(r.이름+' 개별 회차를 만들었어요'); }
    if(kind==='edit'){ const r=ros.find(x=>x.id===rid);
      if(!await rpc('staff_lt_roster_edit',{p_rid:rid,p_name:$('en').value,p_school:$('es').value,p_group:$('eg').value,p_stu:$('ep').value,p_par:$('eq').value,p_memo:$('em').value})) return;
      const ns=$('eslot').value?+$('eslot').value:null; if(ns!==(r.회차||null)){ const d=await rpc('staff_lt_assign',{p_rid:rid,p_slot:ns}); if(!d) return; if(d.알림) toast('이미 열린 회차라 알림을 보냈어요'); }
      toast('저장했어요'); }
    dlg.classList.remove('on'); sheet.style.maxWidth=''; load();
  };
  const del=$('fdel'); if(del) del.onclick=async()=>{ if(del.dataset.sure!=='1'){ del.dataset.sure='1'; del.className='sure'; del.style.color=''; del.textContent='정말 지울까요? 한 번 더'; return; }
    if(!await rpc('staff_lt_roster_del',{p_rid:rid})) return; toast('학생을 지웠어요'); dlg.classList.remove('on'); load(); };
  const f=sheet.querySelector('input:not([type=checkbox]),select'); if(f) f.focus();
}
async function call(fn,args,okMsg){ const {data,error}=await sb.rpc(fn,args); if(error||!data||data.오류){ alert((data&&data.오류)||(error&&error.message)||'실패'); return null; } if(okMsg) toast(okMsg); return data; }
function toast(t){ let el=document.getElementById('toast'); if(!el){ el=document.createElement('div'); el.id='toast';  document.body.appendChild(el); } el.textContent=t; el.style.display='block'; clearTimeout(el._t); el._t=setTimeout(()=>el.style.display='none',2500); }
const pickEx=cls=>[...document.querySelectorAll('.'+cls+':checked')].map(x=>x.value);
function wireSlot(){
  app.querySelectorAll('[data-form]').forEach(b=>b.onclick=()=>openForm(b.dataset.form));
  app.querySelectorAll('[data-edit]').forEach(b=>b.onclick=ev=>{ ev.stopPropagation(); openForm('edit',+b.dataset.edit); });
  app.querySelectorAll('[data-asg]').forEach(el=>el.onchange=async ev=>{ ev.stopPropagation(); const v=el.value;
    const d=await call('staff_lt_assign',{p_rid:+el.dataset.asg,p_slot:v?+v:null}, v?'배정했어요':'회차를 비웠어요'); if(d){ if(d.알림) toast('이미 열린 회차라 그 학생에게 알림을 보냈어요'); load(); } });
  app.querySelectorAll('[data-link]').forEach(b=>b.onclick=async ev=>{ ev.stopPropagation(); const d=await call('staff_lt_link',{p_rid:+b.dataset.link}); if(!d) return;
    try{ await navigator.clipboard.writeText(d.주소); toast('개인 링크를 복사했어요'); }catch(e){ prompt('개인 링크', d.주소); } });
  app.querySelectorAll('[data-rn]').forEach(b=>b.onclick=async ev=>{ ev.stopPropagation(); if(await call('staff_lt_renotify',{p_rid:+b.dataset.rn},'알림을 다시 보내요(1~2분)')) load(); });
  app.querySelectorAll('[data-open-slot]').forEach(b=>b.onclick=async()=>{ if(b.dataset.sure!=='1'){ b.dataset.sure='1'; b.className='sure'; b.textContent='지금 열까요?'; return; }
    if(await call('staff_lt_slot_open',{p_id:+b.dataset.openSlot},'입력을 열고 알림을 보내요')) load(); });
  app.querySelectorAll('[data-del-slot]').forEach(b=>b.onclick=async()=>{ if(b.dataset.sure!=='1'){ b.dataset.sure='1'; b.className='sure'; b.textContent='지울까요?'; return; }
    if(await call('staff_lt_slot_del',{p_id:+b.dataset.delSlot},'회차를 지웠어요')) load(); });
}

    const {data,error}=await sb.rpc('staff_lt_reset',{p_rid:o.r.id,p_exam:o.e.id});
    if(error||!data||data.오류){ rb.textContent='실패: '+((data&&data.오류)||(error&&error.message)||''); return; }
    dlg.classList.remove('on'); load(); };
}
dlg.addEventListener('click',ev=>{ if(ev.target===dlg){ dlg.classList.remove('on'); sheet.style.maxWidth=''; } });
document.addEventListener('keydown',ev=>{ if(ev.key==='Escape') dlg.classList.remove('on'); });

/* ── CSV ── */
function csv(){
  const cols=stuCols(), rows=sortRows('stu',ROWS.filter(o=>!FX||o.e.id===FX),cols);
  const strip=s=>String(s==null?'':s).replace(/<[^>]+>/g,'');
  const lines=[['#',...cols.map(c=>c.h),'학생 번호','학부모 번호'].join(',')].concat(rows.map((o,i)=>[i+1,...cols.map(c=>c.v(o)),o.r.학생폰||'',o.r.부모폰||''].map(v=>'"'+strip(v).replace(/"/g,'""')+'"').join(',')));
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['﻿'+lines.join('\n')],{type:'text/csv'})); a.download='레벨테스트_결과.csv'; a.click();
}

/* ── 입력 창 ── */
function gateBox(){
  const s=D.열린, ex=D.시험||[];
  if(s) return '<div class="card gate"><span class="st on">● 학생 입력 열림</span><b>'+E(s.이름)+'</b><span class="dim">'+ex.filter(e=>s.시험.includes(e.id)).map(e=>e.형).join('·')+' · '+fmtT(s.닫힘)+'까지 · 점수 '+(s.점수공개?'보여 줌':'숨김')+'</span>'
    +'<span class="dim">학생 주소 <b class="link">ukan8.github.io/dashboard/lt</b></span><span style="flex:1"></span><button id="gclose">'+(sureGate?'정말 닫을까요? 한 번 더':'입력 닫기')+'</button></div>';
  const d=new Date(Date.now()+9*3600e3), md=(d.getUTCMonth()+1)+'/'+d.getUTCDate();
  return '<div class="card gate"><span class="st off">○ 학생 입력 닫힘</span><span class="dim">회차 없이 지금 바로 열 때만 (보통은 회차가 알아서 열어요)</span><input type="text" id="gname" value="'+md+' 레벨테스트" size="16">'
    +ex.map(e=>'<label><input type="checkbox" class="gex" value="'+E(e.id)+'" checked>'+E(e.형)+'</label>').join('')
    +'<select id="gmin"><option value="60">1시간</option><option value="120" selected>2시간</option><option value="180">3시간</option><option value="300">5시간</option></select>'
    +'<label><input type="checkbox" id="gshow" checked>제출 직후 점수 보여 주기</label><span style="flex:1"></span><button class="pri" id="gopen">학생 입력 열기</button></div>';
}
async function gate(open){
  let a;
  if(open) a={p_name:document.getElementById('gname').value,p_exams:[...document.querySelectorAll('.gex:checked')].map(x=>x.value),p_min:+document.getElementById('gmin').value,p_show:document.getElementById('gshow').checked};
  else a={p_name:null,p_exams:null,p_min:0,p_show:true};
  const {data,error}=await sb.rpc('staff_lt_gate',a);
  if(error||!data||data.오류){ alert((data&&data.오류)||(error&&error.message)||'실패'); return; }
  sureGate=false; load();
}

/* ── 그리기 ── */
const TABS=[['slot','회차·예약','회차를 만들고 예약한 학생을 배정해요. 시험이 끝나는 시각에 입력이 열리고 개인 링크 알림이 가요.'],
            ['stu','학생 결과','레벨별 점수·확실/찍음/실수까지 — 줄을 누르면 상담 카드'],
            ['item','문항 분석','정답률·선지 분포·많이 고른 오답의 오개념'],
            ['heat','레벨·단원','학생 × 단원 정답 히트맵'],
            ['ro','명단','응시 명단 · 회차 · 알림 상태'],
            ['key','선생님 링크','가입 없이 들어오는 선생님별 링크 — 관리자만 보여요']];
function draw(){
  const exs=D.시험||[], tabs=TABS.filter(t=>t[0]!=='key'||(WHO&&WHO.관리));
  if(!tabs.find(t=>t[0]===TAB)) TAB='slot';
  const T=tabs.find(t=>t[0]===TAB);
  document.getElementById('tabs').innerHTML=tabs.map(([k,t])=>'<button data-tab="'+k+'" class="'+(TAB===k?'on':'')+'">'+t+'</button>').join('');
  document.getElementById('who').innerHTML=WHO?('<span class="tag '+(WHO.관리?'t-base':'t-deep')+'">'+E(WHO.이름||'선생님')+'</span>'+(WHO.방식==='링크'?'<span>링크로 접속</span>':'')):'';
  document.querySelectorAll('#tabs [data-tab]').forEach(b=>b.onclick=()=>{TAB=b.dataset.tab;draw();window.scrollTo(0,0);});
  const body = TAB==='slot'?vSlot() : TAB==='stu'?vStu() : TAB==='item'?vItem() : TAB==='heat'?vHeat() : TAB==='key'?vKey() : vRoster();
  const fx=['stu','item','heat'].includes(TAB)?'<select id="fx"><option value="">전체 형</option>'+exs.map(e=>'<option value="'+E(e.id)+'"'+(FX===e.id?' selected':'')+'>'+E(e.형)+' · '+E(e.범위)+'</option>').join('')+'</select>':'';
  app.innerHTML='<div class="top"><div><h1>'+E(T[1])+'</h1><div class="sub">'+E(T[2])+'</div></div><span class="sp"></span>'+fx
    +'<button id="rl">새로고침</button>'+(TAB==='stu'?'<button id="csv">CSV 받기</button>':'')+'</div>'
    +(D.열린?gateBox():'')
    +body
    +(TAB==='slot'&&!D.열린?gateBox():'')
    +'';
  document.getElementById('rl').onclick=load; const cv=document.getElementById('csv'); if(cv) cv.onclick=csv;
  const f=document.getElementById('fx'); if(f) f.onchange=ev=>{FX=ev.target.value;draw();};
  app.querySelectorAll('[data-open]').forEach(tr=>tr.onclick=()=>openCard(tr.dataset.open));
  app.querySelectorAll('[data-asg2]').forEach(el=>el.onchange=async()=>{ const v=el.value; const d=await call('staff_lt_assign',{p_rid:+el.dataset.asg2,p_slot:v?+v:null},v?'배정했어요':'회차를 비웠어요'); if(d){ if(d.알림) toast('이미 열린 회차라 그 학생에게 알림을 보냈어요'); load(); } });
  app.querySelectorAll('[data-ok]').forEach(b=>b.onclick=async ev=>{ ev.stopPropagation();
    const {data}=await sb.rpc('staff_lt_roster',{p_rid:+b.dataset.ok,p_name:null,p_school:null,p_group:null,p_memo:null,p_ok:true}); if(data&&data.ok) load(); });
  if(TAB==='slot') wireSlot();
  if(TAB==='ro'){ app.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openForm('edit',+b.dataset.edit)); const ad=document.getElementById('roadd'); if(ad) ad.onclick=()=>openForm('add'); }
  if(TAB==='key') wireKey();
  const go=document.getElementById('gopen'); if(go) go.onclick=()=>gate(true);
  const gc=document.getElementById('gclose'); if(gc) gc.onclick=()=>{ if(!sureGate){ sureGate=true; draw(); return; } gate(false); };
}

/* ── 탭: 선생님 링크 (관리자만) ── */
let KEYS=[];
function vKey(){
  COLS.key=[{h:'선생님',l:1,v:k=>k.이름,f:k=>'<b>'+E(k.이름)+'</b>'},{h:'상태',v:k=>k.끔?'꺼짐':'사용 중',f:k=>k.끔?'<span class="tag t-dim">꺼짐</span>':'<span class="tag t-deep">사용 중</span>'},
    {h:'만든 때',v:k=>k.만든때,f:k=>'<span class="dim">'+fmtT(k.만든때)+'</span>'},{h:'마지막 접속',v:k=>k.마지막||'',f:k=>'<span class="dim">'+(k.마지막?fmtT(k.마지막):'아직 없음')+'</span>'},
    {h:'',ns:1,v:k=>0,f:k=>k.끔?'':'<button data-kcopy="'+E(k.키)+'">링크 복사</button> <button data-koff="'+E(k.키)+'">끄기</button>'}];
  return '<div class="card"><b>선생님 링크 만들기</b> <span class="dim">링크를 받은 선생님은 로그인 없이 이 페이지를 보고, 회차 배정·학생 추가까지 할 수 있어요. 학생 번호도 보이니 선생님께만 보내 주세요.</span>'
    +'<div class="gate" style="margin-top:10px"><input type="text" id="kn" placeholder="예: 임재범쌤" size="14"><button class="pri" id="kadd">링크 만들기</button></div></div>'
    +(KEYS.length?table('key',COLS.key,KEYS):'<div class="card dim">아직 만든 링크가 없어요.</div>');
}
function wireKey(){
  const b=document.getElementById('kadd'); if(b) b.onclick=async()=>{ const n=document.getElementById('kn').value.trim(); if(!n) return alert('선생님 이름을 넣어 주세요');
    const d=await call('lt_admin_key_new',{p_name:n}); if(!d) return; await copyKey(d.키); load(); };
  app.querySelectorAll('[data-kcopy]').forEach(x=>x.onclick=()=>copyKey(x.dataset.kcopy));
  app.querySelectorAll('[data-koff]').forEach(x=>x.onclick=async()=>{ if(x.dataset.sure!=='1'){ x.dataset.sure='1'; x.className='sure'; x.textContent='끌까요? 한 번 더'; return; }
    if(await call('lt_admin_key_off',{p_key:x.dataset.koff},'링크를 껐어요 — 그 선생님은 더 못 들어와요')) load(); });
}
async function copyKey(k){ const u=location.origin+location.pathname+'?key='+k; try{ await navigator.clipboard.writeText(u); toast('링크를 복사했어요 — 선생님께 보내 주세요'); }catch(e){ prompt('선생님 링크',u); } }

async function load(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session && !KEY){ return noAccess('선생님 링크로 들어오거나, 콘솔에서 로그인한 뒤 새로고침해 주세요.'); }
  const w=await sb.rpc('lt_staff_whoami'); WHO=w.data||null;
  if(w.error && /lt_staff_whoami/.test(w.error.message)) WHO={staff:!!session,관리:!!session,이름:'관리자',방식:'로그인'};   // v85 전
  if(!WHO||!WHO.staff){ if(KEY){ try{localStorage.removeItem('lt:staffkey');}catch(e){} } return noAccess(KEY?'링크가 꺼졌거나 잘못됐어요. 유강쌤께 새 링크를 받아 주세요.':'직원 계정만 볼 수 있어요.'); }
  const {data,error}=await sb.rpc('staff_lt_status');
  if(error){ app.innerHTML='<div class="card">불러오지 못함 — '+E(error.message)+'</div>'; return; }
  if(!data){ return noAccess('볼 수 있는 권한이 없어요.'); }
  D=data; build();
  if(WHO.관리){ const k=await sb.rpc('lt_admin_keys'); KEYS=(k.data||[]); }
  draw();
}
function noAccess(msg){ document.getElementById('tabs').innerHTML=''; app.innerHTML='<div class="card" style="max-width:520px;margin:60px auto;text-align:center;padding:30px"><div style="font-size:30px">🔒</div><h1 style="margin:8px 0">레벨테스트 관리</h1><div class="sub">'+E(msg)+'</div></div>'; }
load();
setInterval(()=>{ if(D&&D.열린&&!dlg.classList.contains('on')&&document.visibilityState==='visible') load(); }, 30000);  // 열려 있는 동안 30초마다
</script></body></html>
