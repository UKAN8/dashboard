/* 중3 단원 → 이어지는 공통수학1 단원 (A형 응시생 안내용) */
const BRIDGE={'다항식의 곱셈':'다항식의 연산','인수분해':'인수분해','이차방정식':'이차방정식','이차함수':'이차방정식과 이차함수','제곱근과 실수':'복소수','근호를 포함한 식의 계산':'복소수'};
/* 학생이 고른 이유 → 공부 방법 */
const HOW={'개념·공식이 기억 안 남':'개념과 공식을 다시 정리하는 것부터','풀이 방법이 안 떠오름':'대표 유형으로 풀이 방법을 익히는 연습','풀다가 막힘':'중간 과정을 정리하며 끝까지 푸는 연습','배운 적 없음':'수업에서 처음부터 차근차근',
  '계산 실수':'계산을 한 줄씩 정리하고 검산하는 습관','문제·조건을 잘못 읽음':'조건에 표시하며 읽는 습관','답 옮기기 실수':'답을 옮긴 뒤 다시 확인하는 습관','기타':'틀린 과정을 다시 짚어 보는 연습'};

function kindOf(q){
  if(q.ok) return q.c==='확실'?'ok':'luck';
  if(q.c==='안풂'||q.k==='시간'||q.k==='못댐') return 'skip';
  return q.k==='실수'?'slip':q.k==='모름'?'no':'nr';
}
const KIND={ok:['k-ok','확실히 맞힘'],luck:['k-luck','애매·찍어서 맞힘'],slip:['k-slip','실수로 틀림'],no:['k-no','몰라서 틀림'],nr:['k-no','틀림(이유 응답 없음)'],skip:['k-skip','풀지 못함']};

function analyze(a){
  const qs=(a.문항||[]).map(q=>{ const x={...q}; if(x.ok){ x.k=null; x.r=null; x.m=null; } x.kind=kindOf(x); return x; });
  const lv={},lvF={},unN={},unOk={};
  qs.forEach(q=>{ lvF[q.레벨]=(lvF[q.레벨]||0)+q.배점; if(q.ok) lv[q.레벨]=(lv[q.레벨]||0)+q.배점; unN[q.단원]=(unN[q.단원]||0)+1; if(q.ok) unOk[q.단원]=(unOk[q.단원]||0)+1; });
  const units=(a.단원&&a.단원.length?a.단원:Object.keys(unN)).filter(u=>unN[u]);
  const rate=u=>(unOk[u]||0)/unN[u];
  const pts=arr=>arr.reduce((s,q)=>s+q.배점,0);
  const low=(lv[1]||0)+(lv[2]||0), lowF=(lvF[1]||0)+(lvF[2]||0), up=(lv[3]||0)+(lv[4]||0), upF=(lvF[3]||0)+(lvF[4]||0);
  const strong=units.filter(u=>rate(u)>=.75).sort((x,y)=>rate(y)-rate(x)||unN[y]-unN[x]).slice(0,3);
  const weak=units.filter(u=>rate(u)<.75).sort((x,y)=>rate(x)-rate(y)||unN[y]-unN[x]).slice(0,3);
  const wrong=qs.filter(q=>!q.ok);
  const howFor=u=>{ const w=wrong.filter(q=>q.단원===u), m={};
    w.forEach(q=>{ const key=q.r||(q.kind==='skip'?'__시간':''); if(key) m[key]=(m[key]||0)+1; });
    const top=Object.entries(m).sort((x,y)=>y[1]-x[1])[0];
    if(top&&top[0]==='__시간') return '시간 안에 끝까지 푸는 연습';
    if(top&&HOW[top[0]]) return HOW[top[0]];
    return w.some(q=>q.레벨<=2)?'기본 개념과 대표 문제부터 다시':'응용 문항을 단계별로 풀어 보는 연습'; };
  return {a,qs,lv,lvF,unN,unOk,units,rate,pts,low,lowF,up,upF,strong,weak,wrong,howFor};
}

function hero(d,X){
  const c=CLS[d.반배정], a=X.a;
  const sure=X.qs.filter(q=>q.c==='확실'), sureOk=sure.filter(q=>q.ok).length;
  const lv1=X.qs.filter(q=>q.레벨===1), lv1ok=lv1.filter(q=>q.ok).length;
  const F=[];
  F.push('응용·심화(Ⅲ·Ⅳ) 문항 <b>'+X.up+' / '+X.upF+'점</b>, 개념·기본(Ⅰ·Ⅱ) 문항 '+X.low+' / '+X.lowF+'점');
  if(sure.length) F.push('확실하다고 답한 '+sure.length+'문항 중 <b>'+sureOk+'문항</b>을 맞혔어요 ('+pct(sureOk,sure.length)+'%)');
  if(X.strong.length) F.push('<b>'+X.strong.slice(0,2).map(E).join(', ')+'</b> 단원을 안정적으로 풀었어요');
  else if(lv1.length) F.push('기본 개념 문항(Ⅰ) '+lv1ok+' / '+lv1.length+'문항을 맞혔어요');
  const avgOk=a.평균!=null&&a.인원>=3;
  return '<div class="hero"><div class="kicker">2027 예비고1 레벨테스트 · 반 배치 안내</div>'
    +'<h1>'+E(d.이름)+'<small>학생</small></h1>'
    +'<div class="meta">'+[E(d.학교||''),ymd(a.제출)+' 응시',E(a.형)+' · '+E(a.범위||'')].filter(Boolean).join(' · ')+'</div>'
    +(c?'<div class="place"><div class="lb">추천 반</div><div class="nm">'+c.t+'</div><div class="dy">'+E(c.d)+'</div><div class="ds">'+COURSE+'</div></div>'
       :'<div class="place none"><div class="lb">추천 반</div><div class="nm">반 배치 상담 중</div><div class="ds">데스크에서 연락드려 함께 정해요. '+COURSE+'</div></div>')
    +'<div class="score"><div class="big">'+a.점수+'<small> / '+a.만점+'점</small></div><div class="sb"><div class="cap">총점'+(avgOk?' · '+E(a.형)+' 응시자 평균 <b>'+a.평균+'점</b> ('+a.인원+'명)':'')+'</div>'
    +(avgOk?'<div class="track"><div class="me" style="width:'+pct(a.점수,a.만점)+'%"></div><div class="av" style="left:'+pct(a.평균,a.만점)+'%" title="응시자 평균"></div></div>':'')+'</div></div>'
    +'<div class="facts"><h3>이번 시험에서 보인 모습</h3><ul style="margin:0;padding-left:20px">'+F.map(x=>'<li>'+x+'</li>').join('')+'</ul></div></div>';
}

function diag(X,title){
  const st=p=>p>=80?['hi','잘함']:p>=50?['md','보통']:['lo','보완'];
  const lvs=[1,2,3,4].filter(l=>X.lvF[l]).map(l=>{ const p=pct(X.lv[l]||0,X.lvF[l]), s=st(p);
    return '<div class="lv"><span>'+LVN[l]+'</span><span class="bg"><i class="i-'+s[0]+'" style="width:'+Math.max(p,2)+'%"></i></span><span class="v">'+(X.lv[l]||0)+' / '+X.lvF[l]+'점</span><span class="st '+s[0]+'">'+s[1]+'</span></div>'; }).join('');
  return '<div class="sec"><h2>잘한 것과 다음에 보완할 것'+(title||'')+'</h2><p class="sub">단원별로 맞힌 문항을 보고, 보완할 단원은 학생이 고른 틀린 이유에 맞춰 공부 방법을 붙였어요.</p>'
    +'<div class="dg"><div class="two"><div class="box"><h3><i class="i-hi"></i>잘한 단원</h3>'
    +(X.strong.length?'<ul>'+X.strong.map(u=>'<li><span class="u">'+E(u)+'</span><span class="n">'+(X.unOk[u]||0)+' / '+X.unN[u]+'문항 맞힘</span></li>').join('')+'</ul>':'<div class="empty">아직 안정적인 단원은 없어요 — 개념부터 차근차근 쌓아요.</div>')+'</div>'
    +'<div class="box"><h3><i class="i-lo"></i>먼저 보완할 단원</h3>'
    +(X.weak.length?'<ul>'+X.weak.map(u=>'<li><span class="u">'+E(u)+'</span><span class="n">'+(X.unOk[u]||0)+' / '+X.unN[u]+'문항 맞힘</span><span class="how">'+X.howFor(u)+'</span></li>').join('')+'</ul>':'<div class="empty">크게 비는 단원 없이 고르게 풀었어요.</div>')+'</div></div>'
    +'<div class="lvs">'+lvs+'<div class="crit">잘함 = 그 수준 점수의 80% 이상 · 보통 = 50~79% · 보완 = 50% 미만</div></div></div></div>';
}

function habit(X,title){
  const qs=X.qs, pts=X.pts;
  const cnt=k=>qs.filter(q=>q.kind===k).length;
  const strip=qs.map(q=>'<div class="'+KIND[q.kind][0]+'" title="'+E(q.단원)+' · '+KIND[q.kind][1]+'">'+q.번호+'</div>').join('');
  const legend=['ok','luck','slip','no','nr','skip'].filter(k=>k!=='nr'||cnt('nr')).map(k=>'<span><i class="'+KIND[k][0]+'"></i>'+KIND[k][1]+' <b>'+cnt(k)+'</b></span>').join('');
  const CF=[['확실','확실하다고 한 문항'],['애매','애매했던 문항'],['찍음','찍은 문항']];
  const calib=CF.map(([c,t])=>{ const g=qs.filter(q=>q.c===c), y=g.filter(q=>q.ok).length, x=g.length-y; if(!g.length) return '';
    return '<div class="cal"><span class="cl">'+t+' <b>'+g.length+'</b></span><span class="cb"><i style="width:'+pct(y,g.length)+'%;background:var(--ok)"></i><i style="width:'+pct(x,g.length)+'%;background:var(--bad)"></i></span>'
      +'<span class="cv">맞힘 <b>'+y+'</b> · 틀림 <b class="'+(c==='확실'&&x?'hot':'')+'">'+x+'</b></span></div>'; }).join('');
  const slipQ=qs.filter(q=>q.kind==='slip'), noQ=qs.filter(q=>q.kind==='no'), skipQ=qs.filter(q=>q.kind==='skip');
  const unrev=qs.filter(q=>!q.ok&&q.c!=='안풂'&&!q.k);
  const tally=arr=>{ const m={}; arr.forEach(q=>{ const r=q.r||'응답 없음'; m[r]=(m[r]||0)+1; }); return Object.entries(m).sort((a,b)=>b[1]-a[1]); };
  const chips=arr=>arr.length?tally(arr).map(([r,n])=>'<span class="chip">'+E(r)+'<b>'+n+'</b></span>').join(''):'<span class="none">없음</span>';
  const skipChips=skipQ.length?[['시간이 부족했어요',skipQ.filter(q=>q.k==='시간').length],['손을 못 댔어요',skipQ.filter(q=>q.k==='못댐').length],['응답 없음',skipQ.filter(q=>q.k!=='시간'&&q.k!=='못댐').length]].filter(x=>x[1]).map(([r,n])=>'<span class="chip">'+r+'<b>'+n+'</b></span>').join(''):'<span class="none">없음</span>';
  const why3=(!slipQ.some(q=>q.k)&&!noQ.some(q=>q.k)&&unrev.length)
    ?'<div class="none">학생이 시험 뒤 ‘틀린 이유 돌아보기’를 마치지 않아 이 부분은 비어 있어요.</div>'
    :'<div class="why3"><div><div class="wh">실수였어요<b>'+slipQ.length+'</b></div>'+chips(slipQ)+'</div><div><div class="wh">몰랐어요<b>'+noQ.length+'</b></div>'+chips(noQ)+'</div><div><div class="wh">못 풀었어요<b>'+skipQ.length+'</b></div>'+skipChips+'</div></div>';
  const words=qs.filter(q=>!q.ok&&q.m);
  const sayHTML=words.slice(0,3).map(q=>'<div class="say"><span class="sn">'+q.번호+'번 · '+E(q.단원)+'</span>“'+E(q.m)+'”</div>').join('');
  const confWrong=qs.filter(q=>q.c==='확실'&&!q.ok), luckQ=qs.filter(q=>q.ok&&q.c==='찍음');
  const T=[];
  if(confWrong.length) T.push(['key','<b class="hot">확실하다고 했는데 틀린 문항이 '+confWrong.length+'개</b>예요('+confWrong.map(q=>q.번호+'번').join(', ')+'). 스스로 맞다고 믿고 있는 착각이라, 모르는 문항보다 <b>먼저 바로잡아야 할 부분</b>이에요.']);
  else if(X.wrong.length) T.push(['','틀린 문항은 모두 학생도 확신이 없던 문항이에요 — <b>자기가 어디를 모르는지 정확히 알고 있어요.</b>']);
  if(luckQ.length) T.push(['','찍어서 맞힌 문항이 '+luckQ.length+'개('+pts(luckQ)+'점)예요. 점수에는 들어갔지만 실력으로 보긴 어려워요.']);
  const topNo=tally(noQ.filter(q=>q.r))[0], topSlip=tally(slipQ.filter(q=>q.r))[0];
  if(topNo&&HOW[topNo[0]]) T.push(['','몰랐던 문항의 이유로 <b>‘'+E(topNo[0])+'’</b>을 가장 많이 골랐어요('+topNo[1]+'문항) → '+HOW[topNo[0]]+'이 필요해요.']);
  if(slipQ.length) T.push(['','실수로 놓친 점수가 <b>'+pts(slipQ)+'점</b>이에요'+(topSlip&&HOW[topSlip[0]]?' — 주로 ‘'+E(topSlip[0])+'’ → '+HOW[topSlip[0]]+'이 필요해요.':'.')]);
  if(skipQ.filter(q=>q.k==='시간').length||(X.a.설문||{}).시간==='모자랐어요') T.push(['','시험 시간이 모자랐다고 답했어요 — 시간 배분 연습도 함께 해요.']);
  if(unrev.length&&(slipQ.some(q=>q.k)||noQ.some(q=>q.k))) T.push(['',unrev.length+'문항은 학생이 틀린 이유를 고르지 않았어요(응답 없음).']);
  return '<div class="sec self"><span class="badge">필탑 레벨테스트 학생 셀프평가 분석</span><h2>풀이 습관'+(title||'')+'</h2>'
    +'<p class="sub">답만 채점하지 않았어요. 학생이 문항마다 <b>얼마나 확신했는지</b>, 틀린 문항은 <b>왜 틀렸다고 생각하는지</b> 시험 직후 스스로 돌아본 결과예요.</p>'
    +'<div class="strip">'+strip+'</div><div class="legend">'+legend+'</div>'
    +'<div class="hb"><div><h3>확신과 실제 결과</h3>'+calib+'</div>'
    +'<div><h3>학생이 고른 틀린 이유</h3>'+why3+'</div></div>'
    +(sayHTML?'<div class="sayblk"><h3>학생이 직접 쓴 말</h3>'+sayHTML+(words.length>3?'<div class="none">나머지 '+(words.length-3)+'개는 아래 문항별 분석에 있어요.</div>':'')+'</div>':'')
    +(T.length?'<h3>이렇게 읽을 수 있어요</h3><ul class="read">'+T.map(([c,x],i)=>'<li class="'+c+(i>=3?' px':'')+'">'+x+'</li>').join('')+'</ul>':'')
    +'</div>';
}

function nextStep(d,XS){
  const weakU=new Set(), isA=XS.some(X=>X.a.형&&X.a.형.startsWith('A'));
  XS.forEach(X=>X.weak.forEach(u=>{ if(UNITS1.includes(u)) weakU.add(u); else if(BRIDGE[u]) weakU.add(BRIDGE[u]); }));
  const weeks=UNITS1.map((u,i)=>'<div class="'+(weakU.has(u)?'fx':'')+'"><small>'+(weakU.has(u)?'특히 집중':(i+1)+'단원')+'</small>'+E(u)+'</div>').join('');
  return '<div class="sec"><h2>앞으로 이렇게 공부해요</h2><p class="sub">12월~2월 정규 수업에서 공통수학1을 이 순서로 다뤄요. '+(weakU.size?(isA?'중3 때 보완이 필요했던 내용과 이어지는 단원':'이번 시험에서 보완이 필요했던 단원')+'은 <b style="color:var(--mid)">특히 집중</b>으로 표시했어요.':'')+'</p>'
    +'<div class="weeks">'+weeks+'</div>'
    +'<div class="call">곧 데스크에서 상담 전화를 드려요. 반 시간표 · 교재 · 궁금한 점을 편하게 물어봐 주세요.</div></div>';
}

function appendix(XS){
  return XS.map((X,xi)=>{
    const wr=X.wrong.slice().sort((a,b)=>(b.c==='확실')-(a.c==='확실')||b.레벨-a.레벨);
    const card=(q,i)=>'<div class="qc'+(q.c==='확실'?' key':'')+(i>=3?' hide':'')+'"><div class="h"><span class="no">'+q.번호+'번</span><span class="tp">'+tex(q.유형)+'</span><span class="ut">'+LVN[q.레벨]+' · '+E(q.단원)+' · '+q.배점+'점</span></div>'
      +'<div class="row"><b>풀 때 확신</b><span>'+({확실:'<span class="tag t-bad">확실했음</span>',애매:'<span class="tag t-mid">애매했음</span>',찍음:'<span class="tag t-gray">찍었음</span>',안풂:'<span class="tag t-gray">풀지 못함</span>'}[q.c]||'응답 없음')+'</span>'
      +'<b>틀린 이유</b><span>'+(q.k==='실수'?'실수 · ':q.k==='모름'?'몰랐음 · ':q.k==='시간'?'시간 부족':q.k==='못댐'?'손을 못 댐':'')+(q.r?E(q.r):(q.k==='시간'||q.k==='못댐'?'':'응답 없음'))+'</span>'
      +(q.m?'<b>학생이 쓴 말</b><span>“'+E(q.m)+'”</span>':'')
      +(q.오개념?'<b>자주 하는 착각</b><span>'+tex(q.오개념)+' <span class="est">· 선택한 선지를 바탕으로 한 추정</span></span>':'')+'</div></div>';
    const s=X.a.설문||{};
    return '<div class="sec appx"><h2>문항별 분석'+(XS.length>1?' · '+E(X.a.형):'')+'<small>틀린 문항 '+wr.length+'개 · 확실했는데 틀린 문항부터</small></h2>'
      +(wr.length?'<div class="qcs">'+wr.map(card).join('')+'</div>':'<div class="none">틀린 문항이 없어요.</div>')
      +'<div class="hide"><h3 style="font-size:15.5px;margin:20px 0 4px">전체 문항</h3></div>'
      +'<div class="allw">'+[X.qs.slice(0,Math.ceil(X.qs.length/2)),X.qs.slice(Math.ceil(X.qs.length/2))].map(part=>'<table class="all hide"><thead><tr><th>번호</th><th>수준</th><th>단원</th><th>결과</th><th class="m-hide">확신</th></tr></thead><tbody>'
        +part.map(q=>'<tr><td>'+q.번호+'</td><td>'+LVN[q.레벨]+'</td><td>'+E(q.단원)+'</td><td><span class="dot '+KIND[q.kind][0]+'"></span>'+KIND[q.kind][1]+'</td><td class="m-hide">'+E({확실:'확실',애매:'애매',찍음:'찍음',안풂:'못 풂'}[q.c]||'')+'</td></tr>').join('')+'</tbody></table>').join('')+'</div>'
      +((s.선행||s.시간||s.체감)?'<div class="hide"><h3 style="font-size:15.5px;margin:20px 0 6px">학생이 답한 학습 이력</h3><div class="kv"><b>공통수학1 선행</b><span>'+E(s.선행||'—')+(s.단원?' · 마지막으로 배운 단원 '+E(s.단원):'')+'</span><b>시험 시간</b><span>'+E(s.시간||'—')+'</span><b>체감 난이도</b><span>'+E(s.체감||'—')+'</span></div></div>':'')
      +'<button class="more" data-x="'+xi+'">'+(wr.length>3?'나머지 '+(wr.length-3)+'문항과 전체 문항 펼쳐보기':'전체 문항 · 학습 이력 펼쳐보기')+'</button></div>';
  }).join('');
}

function render(d){
  const app=document.getElementById('app'), XS=(d.응시||[]).map(analyze);
  if(!XS.length){ app.innerHTML='<div class="msg">아직 결과가 없어요.</div>'; return; }
  document.title=d.이름+' · 레벨테스트 반 배치 안내 · 필탑학원';
  const multi=XS.length>1;
  app.innerHTML='<div class="top"><div class="logo">PI<span>L</span>TOP</div><div class="org"><b>필탑학원 고등수학과</b>2027 예비고1 레벨테스트</div></div>'
    +hero(d,XS[0])
    +XS.map(X=>diag(X,multi?' · '+E(X.a.형):'')+habit(X,multi?' · '+E(X.a.형):'')).join('')
    +(d.코멘트?'<div class="sec"><h2>선생님 한마디</h2><div class="note">'+E(d.코멘트)+'</div></div>':'')
    +nextStep(d,XS)
    +appendix(XS)
    +'<div class="foot">이 안내지는 학생이 시험지에 쓴 답과, 문항마다 스스로 고른 풀이 상태(확실 · 애매 · 찍음 · 못 풂)와 틀린 이유를 바탕으로 만들었어요. '
    +'반 배치는 상담을 거쳐 조정될 수 있어요.<br><b style="color:var(--b)">필탑학원 고등수학과</b></div>';
  app.querySelectorAll('.more').forEach(b=>b.onclick=()=>{ b.closest('.appx').querySelectorAll('.hide').forEach(e=>e.classList.remove('hide')); b.remove(); });
}

async function main(){
  const app=document.getElementById('app'), k=new URLSearchParams(location.search).get('k')||'';
  let d;
  try{
    const r=await fetch(SB_URL+'/rest/v1/rpc/lt_report',{method:'POST',headers:{apikey:SB_ANON,Authorization:'Bearer '+SB_ANON,'Content-Type':'application/json'},body:JSON.stringify({p_key:k})});
    d=await r.json();
  }catch(e){ app.innerHTML='<div class="msg">결과를 불러오지 못했어요. 잠시 뒤 다시 열어 주세요.</div>'; return; }
  if(!d||d.오류||d.message){ app.innerHTML='<div class="msg">'+E((d&&d.오류)||'리포트를 찾을 수 없어요. 학원에 문의해 주세요.')+'</div>'; return; }
  render(d);
}
main();
</script>
</body></html>
