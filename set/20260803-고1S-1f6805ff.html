\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y</mi></mrow></math> 축 대칭은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x</mi></mrow></math> 좌표만 부호가 바뀐다.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;</mo><mn>3</mn><mo>&#x0002C;</mo><mtext>&#x000A0;</mtext><mo>&#x02212;</mo><mn>2</mn><mo stretchy=\"false\">&#x00029;</mo><mo>&#x02192;</mo><mo stretchy=\"false\">&#x00028;</mo><mo>&#x02212;</mo><mn>3</mn><mo>&#x0002C;</mo><mtext>&#x000A0;</mtext><mo>&#x02212;</mo><mn>2</mn><mo stretchy=\"false\">&#x00029;</mo></mrow></math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y</mi></mrow></math> 좌표는 건드리지 않는다는 것이 핵심이다."]}, {"파트": 1, "유형": "원의 대칭이동", "형식": "선택", "출처": "20260803 수업", "발문": "원 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;</mo><mi>x</mi><mo>&#x02212;</mo><mn>1</mn><msup><mo stretchy=\"false\">&#x00029;</mo><mn>2</mn></msup><mo>&#x0002B;</mo><mo stretchy=\"false\">&#x00028;</mo><mi>y</mi><mo>&#x0002B;</mo><mn>2</mn><msup><mo stretchy=\"false\">&#x00029;</mo><mn>2</mn></msup><mo>&#x0003D;</mo><mn>4</mn></mrow></math> 를 원점에 대하여 대칭이동한 원의 중심은?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;</mo><mo>&#x02212;</mo><mn>1</mn><mo>&#x0002C;</mo><mtext>&#x000A0;</mtext><mo>&#x02212;</mo><mn>2</mn><mo stretchy=\"false\">&#x00029;</mo></mrow></math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;</mo><mo>&#x02212;</mo><mn>1</mn><mo>&#x0002C;</mo><mtext>&#x000A0;</mtext><mn>2</mn><mo stretchy=\"false\">&#x00029;</mo></mrow></math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;</mo><mn>1</mn><mo>&#x0002C;</mo><mtext>&#x000A0;</mtext><mn>2</mn><mo stretchy=\"false\">&#x00029;</mo></mrow></math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;</mo><mn>1</mn><mo>&#x0002C;</mo><mtext>&#x000A0;</mtext><mo>&#x02212;</mo><mn>2</mn><mo stretchy=\"false\">&#x00029;</mo></mrow></math>"], "정답": 1, "풀이": ["원래 원의 중심은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;</mo><mn>1</mn><mo>&#x0002C;</mo><mtext>&#x000A0;</mtext><mo>&#x02212;</mo><mn>2</mn><mo stretchy=\"false\">&#x00029;</mo></mrow></math> 다. 괄호 안 부호와 반대라는 점을 먼저 확인한다.", "원점 대칭은 두 좌표 모두 부호가 바뀌므로 중심은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;</mo><mo>&#x02212;</mo><mn>1</mn><mo>&#x0002C;</mo><mtext>&#x000A0;</mtext><mn>2</mn><mo stretchy=\"false\">&#x00029;</mo></mrow></math>", "반지름 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2</mn></mrow></math> 는 그대로다. 대칭이동은 크기를 바꾸지 않는다."]}];

const KEY = 'piltop-set:' + META.세트ID;
const state = ITEMS.map(()=>null);
const picks = {};

function norm(s){return (s||'').toString().trim().replace(/\s+/g,'')
  .replace(/[−–—]/g,'-').replace(/[（）]/g,'').replace(/^\+/,'');}

function save(){
  try{ localStorage.setItem(KEY, JSON.stringify({state:state, picks:picks})); }catch(e){}
}
function restore(){
  let d=null;
  try{ d=JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  if(!d || !d.state) return;
  Object.assign(picks, d.picks||{});
  d.state.forEach((st,i)=>{
    if(!st) return;
    state[i]=st;
    // 골랐던 선지를 화면에 되살린다
    st.detail.forEach((dt,k)=>{
      const id = (ITEMS[i].형식==='단계형') ? 'q'+i+'a'+k : 'q'+i+'a0';
      const el = document.getElementById(id);
      if(!el) return;
      if(el.tagName==='INPUT') el.value = dt.입력;
      else { const b=el.querySelectorAll('.ch')[dt.입력]; if(b) b.classList.add('sel'); }
    });
    applyResult(i);
  });
  if(state.every(s=>s!==null)) finish(true);
}

function pick(g,el,i){
  if(el.disabled) return;
  document.querySelectorAll('#'+g+' .ch').forEach(c=>c.classList.remove('sel'));
  el.classList.add('sel'); picks[g]=i;
}

function applyResult(i){
  const K=ITEMS[i], st=state[i], detail=st.detail, ok=st.ok;
  const sec=document.querySelector('.q[data-i="'+i+'"]');
  sec.querySelectorAll('input[type=text]').forEach(e=>e.disabled=true);
  sec.querySelectorAll('button').forEach(e=>e.disabled=true);
  const mark=(gid,right)=>{
    document.querySelectorAll('#'+gid+' .ch').forEach((c,k)=>{
      if(k===right) c.classList.add('ans');
      else if(c.classList.contains('sel')){c.classList.remove('sel');c.classList.add('miss');}
      else c.classList.add('dim');
    });
  };
  if(K.형식==='선택') mark('q'+i+'a0', K.정답);
  else if(K.형식==='단계형')
    K.슬롯.forEach((sl,s2)=>{ if(sl.종류==='choice') mark('q'+i+'a'+s2, sl.정답); });

  let head;
  if(ok) head='정답';
  else if(K.형식==='단계형'){
    const w=detail.map((d,k)=>d.정답?null:k+1).filter(Boolean);
    head = w.length===detail.length ? '처음부터 다시 보자'
         : w.join('번, ')+'번에서 갈렸어';
  } else head='아쉽다';

  const v=document.getElementById('v'+i);
  v.className='verdict show '+(ok?'ok':'no');
  v.innerHTML='<div class="vt">'+head+'</div><div class="sol"><div class="sl">왜 그런지</div>'
    +K.풀이.map(p=>'<p>'+p+'</p>').join('')+'</div>';
  document.querySelectorAll('#bar i')[i].className = ok?'done':'wrong';
}

function grade(i){
  if(state[i]!==null) return;
  const K=ITEMS[i]; let ok, detail=[];
  if(K.형식==='단답'){
    const v=norm(document.getElementById('q'+i+'a0').value);
    if(!v){ alert('답을 적어야 넘어가'); return; }
    ok=K.정답.map(norm).includes(v); detail.push({슬롯:'답',입력:v,정답:ok});
  }else if(K.형식==='선택'){
    const v=picks['q'+i+'a0'];
    if(v===undefined){ alert('하나 골라야 해'); return; }
    ok=(v===K.정답); detail.push({슬롯:'답',입력:v,정답:ok});
  }else{
    let all=true;
    for(let s=0;s<K.슬롯.length;s++){
      const sl=K.슬롯[s], id='q'+i+'a'+s; let v,hit;
      if(sl.종류==='choice'){
        v=picks[id]; if(v===undefined){ alert('아직 안 고른 게 있어'); return; }
        hit=(v===sl.정답);
      }else{
        v=norm(document.getElementById(id).value);
        if(!v){ alert('빈칸이 남았어'); return; }
        hit=sl.정답.map(norm).includes(v);
      }
      detail.push({슬롯:(s+1)+'번',입력:v,정답:hit}); if(!hit) all=false;
    }
    ok=all;
  }
  state[i]={ok:ok, detail:detail};
  applyResult(i);
  save();
  if(state.every(s=>s!==null)) finish();
}

function rowsOf(p,box){
  const el=document.getElementById(box); if(!el) return;
  el.innerHTML=ITEMS.map((it,i)=>it.파트!==p?'':
    '<div class="ri"><span>'+(i+1)+'. '+it.유형+'</span><span class="'+(state[i].ok?'o':'x')+'">'
    +(state[i].ok?'O':'X')+'</span></div>').join('');
}

function finish(silent){
  const n=state.filter(s=>s.ok).length;
  const i1=ITEMS.map((it,i)=>it.파트===1?i:-1).filter(i=>i>=0);
  const i2=ITEMS.map((it,i)=>it.파트===2?i:-1).filter(i=>i>=0);
  const p1=i1.filter(i=>state[i].ok).length, p2=i2.filter(i=>state[i].ok).length;

  document.getElementById('sc').textContent=n+' / '+ITEMS.length;
  document.getElementById('scl').textContent=
    p1===i1.length ? '어제 배운 건 잡혔네'
    : (p1>=i1.length-1 ? '어제 배운 건 거의 잡았어' : '어제 것부터 다시 보자');
  rowsOf(1,'r1'); rowsOf(2,'r2');

  const rot=i2.map(i=>{
    const ok=state[i].ok, st=ok?(ITEMS[i].연속정답||0)+1:0;
    return {유형:ITEMS[i].유형, 정답:ok, 연속정답:st,
      다음: st>=2 ? '한동안 안 나와' : (ok ? '한 번만 더 맞히면 졸업' : '좀 더 쉬운 걸로 다시')};
  });
  document.getElementById('nextbox').innerHTML='<b>다음엔 이렇게 나와</b>'
    +rot.map(r=>'<div class="nl"><span>'+r.유형+'</span><em>'+r.다음+'</em></div>').join('')
    +'<div class="nl"><span>어제 배운 것</span><em>'
      +(p1===i1.length?'안 나와':'틀린 것만 다시')+'</em></div>';

  document.getElementById('payload').textContent=JSON.stringify({
    학생ID:META.학생.학생ID, 이름:META.학생.이름, 반:META.학생.반,
    세트ID:META.세트ID, 제출시각:new Date().toISOString(),
    문항:ITEMS.map((it,i)=>({번호:i+1,파트:it.파트,유형:it.유형,출처:it.출처,형식:it.형식,
      정답여부:state[i].ok, STEP:state[i].detail})),
    점수:{맞은개수:n, PART1:p1+'/'+i1.length, PART2:p2+'/'+i2.length},
    로테이션갱신:rot},null,2);

  document.getElementById('result').classList.add('show');
  save();
  if(!silent) document.getElementById('result').scrollIntoView({behavior:'smooth'});
}

document.addEventListener('DOMContentLoaded', restore);

</script></body></html>
