2, "w": "[핵심] $\\frac{D}{4}\\le0$이 완전제곱식이면 등호가 되는 값 하나만 남는다.\n$f'(x)=3x^{2}-6(a+1)x+12a$, $\\frac{D}{4}=9(a+1)^{2}-36a=9(a-1)^{2}\\le0$.\n따라서 $a=1$이고 $f(x)=x^{3}-6x^{2}+12x$.\n$f(2)=8-24+24=8$.", "key": "Tm05-12"}, "tm05-12-3": {"id": "tm05-12-3", "unit": "m05", "theme": "12", "벌": 3, "k": "num", "q": "함수 $f(x)=x^{3}+3ax^{2}+3bx$가 극값을 갖지 않도록 하는 두 실수 $a$, $b$에 대하여 $f(1)$의 최솟값을 구하시오.", "a": "1/4", "lvl": 3, "w": "[핵심] 극값을 갖지 않을 조건 $D\\le0$을 두 미지수의 관계식으로 쓴다.\n$f'(x)=3x^{2}+6ax+3b$, $\\frac{D}{4}=9a^{2}-9b\\le0$이므로 $b\\ge a^{2}$.\n$f(1)=1+3a+3b\\ge1+3a+3a^{2}=3\\left(a+\\frac12\\right)^{2}+\\frac14$.\n$a=-\\frac12$, $b=\\frac14$일 때 최솟값 $\\frac14$.", "key": "Tm05-12"}, "tm05-13-1": {"id": "tm05-13-1", "unit": "m05", "theme": "13", "벌": 1, "k": "num", "q": "함수 $f(x)=x^{3}-6x^{2}+ax$가 열린구간 $(0,\\,5)$에서 극댓값과 극솟값을 모두 갖도록 하는 정수 $a$의 개수를 구하시오.", "a": "11", "lvl": 2, "w": "[핵심] $f'(x)=0$이 구간 안에서 서로 다른 두 실근: 판별식·축·양 끝 값.\n$f'(x)=3x^{2}-12x+a$, 축 $x=2$는 $(0,5)$ 안에 있다.\n$\\frac{D}{4}=36-3a\\gt 0$ → $a\\lt 12$, $f'(0)=a\\gt 0$, $f'(5)=15+a\\gt 0$.\n$0\\lt a\\lt 12$이므로 정수 $a$는 $11$개.", "key": "Tm05-13"}, "tm05-13-2": {"id": "tm05-13-2", "unit": "m05", "theme": "13", "벌": 2, "k": "num", "q": "함수 $f(x)=2x^{3}-3(a+2)x^{2}+12ax$가 열린구간 $(0,\\,4)$에서 극댓값과 극솟값을 모두 갖도록 하는 모든 정수 $a$의 값의 합을 구하시오.", "a": "4", "lvl": 2, "w": "[핵심] $f'(x)$가 인수분해되면 두 근의 위치를 직접 본다.\n$f'(x)=6x^{2}-6(a+2)x+12a=6(x-2)(x-a)$.\n두 근 $2$, $a$가 $(0,4)$ 안에 있고 서로 달라야 하므로 $0\\lt a\\lt 4$, $a\\ne2$.\n($a=2$이면 $f'(x)=6(x-2)^{2}$으로 극값이 없다.) 정수 $a=1,\\,3$, 합은 $4$.", "key": "Tm05-13"}, "tm05-13-3": {"id": "tm05-13-3", "unit": "m05", "theme": "13", "벌": 3, "k": "num", "q": "함수 $f(x)=x^{3}-3x^{2}-9x$가 열린구간 $(a,\\,a+6)$에서 극댓값은 갖지만 극솟값은 갖지 않도록 하는 모든 정수 $a$의 값의 합을 구하시오.", "a": "-18", "lvl": 3, "w": "[핵심] 극대·극소의 위치를 먼저 구하고, 열린구간이므로 끝점 포함 여부를 따진다.\n$f'(x)=3(x+1)(x-3)$: $x=-1$에서 극대, $x=3$에서 극소.\n극대점 포함: $a\\lt -1\\lt a+6$ → $-7\\lt a\\lt -1$.\n극소점 미포함: $a+6\\le3$ 또는 $a\\ge3$ → $a\\le-3$ (열린구간이라 $a+6=3$이면 $3$은 안 들어간다).\n$-7\\lt a\\le-3$: $a=-6,-5,-4,-3$, 합 $-18$.", "key": "Tm05-13"}, "tm05-14-1": {"id": "tm05-14-1", "unit": "m05", "theme": "14", "벌": 1, "k": "num", "q": "함수 $f(x)=x^{4}+4x^{3}+2ax^{2}$이 극댓값을 갖도록 하는 정수 $a$ 중에서 $|a|\\le5$인 것의 개수를 구하시오.", "a": "7", "lvl": 2, "w": "[핵심] 최고차항의 계수가 양수인 사차함수가 극댓값을 가질 조건: $f'(x)=0$이 서로 다른 세 실근.\n$f'(x)=4x(x^{2}+3x+a)$. $x^{2}+3x+a=0$이 $0$이 아닌 서로 다른 두 실근을 가져야 한다.\n$9-4a\\gt 0$ → $a\\lt \\frac94$, 그리고 $x=0$이 근이 아니어야 하므로 $a\\ne0$.\n$|a|\\le5$: $-5,\\cdots,-1,\\,1,\\,2$의 $7$개.", "key": "Tm05-14"}, "tm05-14-2": {"id": "tm05-14-2", "unit": "m05", "theme": "14", "벌": 2, "k": "num", "q": "함수 $f(x)=x^{4}-4ax^{3}+6x^{2}$이 극댓값을 갖지 않도록 하는 정수 $a$의 개수를 구하시오.", "a": "3", "lvl": 2, "w": "[핵심] 극댓값이 없으려면 $f'(x)=0$이 서로 다른 세 실근을 갖지 않아야 한다.\n$f'(x)=4x(x^{2}-3ax+3)$. $x=0$은 $x^{2}-3ax+3=0$의 근이 될 수 없으므로 조건은 $x^{2}-3ax+3=0$의 $D\\le0$.\n$9a^{2}-12\\le0$ → $a^{2}\\le\\frac43$.\n정수 $a=-1,\\,0,\\,1$의 $3$개.", "key": "Tm05-14"}, "tm05-14-3": {"id": "tm05-14-3", "unit": "m05", "theme": "14", "벌": 3, "k": "num", "q": "사차함수 $f(x)$의 도함수가 $f'(x)=4(x-1)(x^{2}-2ax+4)$일 때, $f(x)$가 극댓값을 갖지 않도록 하는 실수 $a$의 최댓값을 구하시오.", "a": "5/2", "lvl": 3, "w": "[핵심] 세 실근이 '서로 다른지'는 판별식과 '이미 있는 근과 겹치는지' 두 가지로 따진다.\n극댓값을 가질 조건: $x^{2}-2ax+4=0$이 $1$이 아닌 서로 다른 두 실근 → $a^{2}\\gt 4$이고 $1-2a+4\\ne0$.\n따라서 극댓값이 없으려면 $-2\\le a\\le2$ 또는 $a=\\frac52$.\n$a=\\frac52$이면 $f'(x)=4(x-1)^{2}(x-4)$로 부호가 한 번만 바뀐다. 최댓값은 $\\frac52$.", "key": "Tm05-14"}, "tm05-15-1": {"id": "tm05-15-1", "unit": "m05", "theme": "15", "벌": 1, "k": "num", "q": "닫힌구간 $[-1,\\,4]$에서 함수 $f(x)=x^{3}-6x^{2}+9x+1$의 최댓값을 $M$, 최솟값을 $m$이라 할 때, $M+m$의 값을 구하시오.", "a": "-10", "lvl": 2, "w": "[핵심] 후보는 구간 안의 극값과 양 끝 값.\n$f'(x)=3(x-1)(x-3)$. $f(-1)=-15$, $f(1)=5$, $f(3)=1$, $f(4)=5$.\n$M=5$, $m=-15$이므로 $M+m=-10$.", "key": "Tm05-15"}, "tm05-15-2": {"id": "tm05-15-2", "unit": "m05", "theme": "15", "벌": 2, "k": "num", "q": "닫힌구간 $[-1,\\,3]$에서 함수 $f(x)=x^{4}-8x^{2}+3$의 최댓값과 최솟값의 차를 구하시오.", "a": "25", "lvl": 2, "w": "[핵심] 구간 밖의 극값($x=-2$)은 후보가 아니다.\n$f'(x)=4x(x+2)(x-2)$. 구간 안의 후보 $x=0,\\,2$와 양 끝.\n$f(-1)=-4$, $f(0)=3$, $f(2)=-13$, $f(3)=12$.\n최댓값 $12$, 최솟값 $-13$, 차는 $25$.", "key": "Tm05-15"}, "tm05-15-3": {"id": "tm05-15-3", "unit": "m05", "theme": "15", "벌": 3, "k": "num", "q": "닫힌구간 $[0,\\,3]$에서 함수 $f(x)=(x^{2}-2x)^{3}-3(x^{2}-2x)$의 최댓값을 $M$, 최솟값을 $m$이라 할 때, $M+m$의 값을 구하시오.", "a": "16", "lvl": 3, "w": "[핵심] $t=x^{2}-2x$로 치환하고 $t$의 범위부터 구한다.\n$0\\le x\\le3$에서 $t=(x-1)^{2}-1$의 범위는 $-1\\le t\\le3$.\n$g(t)=t^{3}-3t$, $g'(t)=3(t+1)(t-1)$. $g(-1)=2$, $g(1)=-2$, $g(3)=18$.\n$M=18$, $m=-2$, $M+m=16$.", "key": "Tm05-15"}, "tm05-16-1": {"id": "tm05-16-1", "unit": "m05", "theme": "16", "벌": 1, "k": "num", "q": "닫힌구간 $[-1,\\,4]$에서 함수 $f(x)=x^{3}-3x^{2}+a$의 최솟값이 $-2$일 때, 최댓값을 구하시오. (단, $a$는 상수이다.)", "a": "18", "lvl": 2, "w": "[핵심] 최솟값 후보를 모두 $a$로 나타내 비교한다.\n$f'(x)=3x(x-2)$. $f(-1)=a-4$, $f(0)=a$, $f(2)=a-4$, $f(4)=a+16$.\n최솟값 $a-4=-2$ → $a=2$. 최댓값은 $f(4)=18$.", "key": "Tm05-16"}, "tm05-16-2": {"id": "tm05-16-2", "unit": "m05", "theme": "16", "벌": 2, "k": "num", "q": "닫힌구간 $[-1,\\,2]$에서 함수 $f(x)=ax^{4}-2ax^{2}+b$의 최댓값이 $13$, 최솟값이 $4$일 때, $a+b$의 값을 구하시오. (단, $a$, $b$는 상수이고 $a\\gt 0$이다.)", "a": "6", "lvl": 2, "w": "[핵심] $a\\gt 0$이므로 증감표가 정해지고, 후보값을 비교할 수 있다.\n$f'(x)=4ax(x+1)(x-1)$. $f(-1)=f(1)=b-a$, $f(0)=b$, $f(2)=8a+b$.\n$a\\gt 0$이므로 최댓값 $8a+b=13$, 최솟값 $b-a=4$.\n$a=1$, $b=5$, $a+b=6$.", "key": "Tm05-16"}, "tm05-16-3": {"id": "tm05-16-3", "unit": "m05", "theme": "16", "벌": 3, "k": "num", "q": "양수 $a$에 대하여 닫힌구간 $[0,\\,2]$에서 함수 $f(x)=x^{3}-3ax$의 최솟값이 $-28$일 때, $a$의 값을 구하시오.", "a": "6", "lvl": 3, "w": "[핵심] 극소점 $x=\\sqrt{a}$가 구간 안에 있는지로 경우를 나눈다.\n$f'(x)=3(x^{2}-a)$, 극소점 $x=\\sqrt a$.\n(i) $\\sqrt a\\le2$($0\\lt a\\le4$): 최솟값 $f(\\sqrt a)=-2a\\sqrt a=-28$ → $a\\sqrt a=14$ → $a=14^{\\frac23}\\gt 4$이므로 모순.\n(ii) $a\\gt 4$: 구간에서 감소하므로 최솟값 $f(2)=8-6a=-28$ → $a=6$ (조건 만족).\n$a=6$.", "key": "Tm05-16"}, "tm05-17-1": {"id": "tm05-17-1", "unit": "m05", "theme": "17", "벌": 1, "k": "num", "q": "곡선 $y=12-x^{2}$ $(0\\lt x\\lt 2\\sqrt3)$ 위의 점 $\\mathrm{P}$에서 $x$축, $y$축에 내린 수선의 발을 각각 $\\mathrm{H}$, $\\mathrm{K}$라 하자. 직사각형 $\\mathrm{OHPK}$의 넓이의 최댓값을 구하시오. (단, $\\mathrm{O}$는 원점이다.)", "a": "16", "lvl": 2, "w": "[핵심] 변수 $t$와 그 범위를 먼저 정하고 넓이를 $t$의 함수로 쓴다.\n$\\mathrm{P}(t,\\,12-t^{2})$ $(0\\lt t\\lt 2\\sqrt3)$, $S(t)=t(12-t^{2})=12t-t^{3}$.\n$S'(t)=12-3t^{2}=0$ → $t=2$. $t=2$의 좌우에서 $+$에서 $-$로 바뀌므로 극대이자 최대.\n$S(2)=2\\cdot8=16$.", "key": "Tm05-17"}, "tm05-17-2": {"id": "tm05-17-2", "unit": "m05", "theme": "17", "벌": 2, "k": "num", "q": "밑면이 정사각형인 직육면체의 모든 모서리의 길이의 합이 $48$일 때, 이 직육면체의 부피의 최댓값을 구하시오.", "a": "64", "lvl": 2, "w": "[핵심] 조건식으로 변수를 하나로 줄이고 범위를 적는다.\n밑면의 한 변을 $x$, 높이를 $h$라 하면 $8x+4h=48$, $h=12-2x$ $(0\\lt x\\lt 6)$.\n$V(x)=x^{2}(12-2x)=12x^{2}-2x^{3}$, $V'(x)=6x(4-x)=0$ → $x=4$.\n$x=4$에서 극대이자 최대, $V(4)=16\\cdot4=64$.", "key": "Tm05-17"}, "tm05-17-3": {"id": "tm05-17-3", "unit": "m05", "theme": "17", "벌": 3, "k": "c5", "q": "반지름의 길이가 $3$인 구에 내접하는 원뿔 중에서 부피가 최대인 원뿔의 부피는?", "a": "$\\dfrac{32}{3}\\pi$", "lvl": 3, "w": "[핵심] 높이 $h$를 변수로, 밑면의 반지름을 $h$로 나타낸다.\n구의 중심에서 밑면까지의 거리는 $|h-3|$이므로 $r^{2}=9-(h-3)^{2}=6h-h^{2}$ $(0\\lt h\\lt 6)$.\n$V(h)=\\frac{\\pi}{3}r^{2}h=\\frac{\\pi}{3}(6h^{2}-h^{3})$, $V'(h)=\\frac{\\pi}{3}(12h-3h^{2})=0$ → $h=4$.\n$h=4$에서 최대, $V(4)=\\frac{\\pi}{3}(96-64)=\\frac{32}{3}\\pi$.", "c": ["$9\\pi$", "$\\dfrac{32}{3}\\pi$", "$12\\pi$", "$\\dfrac{16}{3}\\pi$", "$32\\pi$"], "key": "Tm05-17"}, "tm06-01-1": {"id": "tm06-01-1", "unit": "m06", "theme": "01", "벌": 1, "k": "num", "q": "방정식 $2x^{3}-3x^{2}-12x+5=0$의 서로 다른 실근의 개수를 구하시오.", "a": "3", "lvl": 2, "w": "[핵심] 삼차방정식은 극댓값과 극솟값의 부호로 실근의 개수를 판단한다.\n$f(x)=2x^{3}-3x^{2}-12x+5$라 하면 $f'(x)=6(x+1)(x-2)$\n극댓값 $f(-1)=12$, 극솟값 $f(2)=-15$\n(극댓값)$\\times$(극솟값)$<0$이므로 서로 다른 실근은 $3$개", "key": "Tm06-01"}, "tm06-01-2": {"id": "tm06-01-2", "unit": "m06", "theme": "01", "벌": 2, "k": "num", "q": "방정식 $x^{4}-4x^{3}+10=0$의 서로 다른 실근의 개수를 구하시오.", "a": "2", "lvl": 2, "w": "[핵심] 증감표를 그려 그래프와 $x$축의 교점을 센다.\n$f(x)=x^{4}-4x^{3}+10$이라 하면 $f'(x)=4x^{2}(x-3)$\n$x=0$의 좌우에서 $f'(x)<0$이라 극값이 아니고, $x=3$에서 극소이자 최소이다.\n최솟값 $f(3)=81-108+10=-17<0$이고 양쪽 끝은 한없이 커지므로 $x$축과 두 번 만난다.\n서로 다른 실근은 $2$개", "key": "Tm06-01"}, "tm06-01-3": {"id": "tm06-01-3", "unit": "m06", "theme": "01", "벌": 3, "k": "num", "q": "방정식 $(x^{3}-3x)^{2}=4$의 서로 다른 실근의 개수를 구하시오.", "a": "4", "lvl": 3, "w": "[핵심] $x^{3}-3x=2$ 또는 $x^{3}-3x=-2$로 나누어 곡선 $y=x^{3}-3x$와 두 직선의 교점을 센다.\n$f(x)=x^{3}-3x$의 극댓값은 $f(-1)=2$, 극솟값은 $f(1)=-2$\n직선 $y=2$는 극대인 점에서 접하므로 교점 $2$개 ($x=-1$, $x=2$)\n직선 $y=-2$는 극소인 점에서 접하므로 교점 $2$개 ($x=1$, $x=-2$)\n겹치는 근이 없으므로 서로 다른 실근은 $4$개", "key": "Tm06-01"}, "tm06-02-1": {"id": "tm06-02-1", "unit": "m06", "theme": "02", "벌": 1, "k": "num", "q": "방정식 $x^{3}-3x^{2}-24x+k=0$이 서로 다른 두 개의 양의 실근과 한 개의 음의 실근을 갖도록 하는 정수 $k$의 개수를 구하시오.", "a": "79", "lvl": 2, "w": "[핵심] $x^{3}-3x^{2}-24x=-k$로 바꾸어 곡선과 직선 $y=-k$의 교점이 $y$축 오른쪽에 두 개, 왼쪽에 한 개이게 한다.\n$f(x)=x^{3}-3x^{2}-24x$에서 $f'(x)=3(x+2)(x-4)$, $f(-2)=28$, $f(0)=0$, $f(4)=-80$\n$x>0$에서 $f(x)$는 $0$에서 $-80$까지 감소한 뒤 증가하므로 양의 교점 두 개는 $-80<-k<0$\n이때 $x<0$에서 $f(x)$의 값이 음수인 부분은 $x<-2$의 한 갈래뿐이라 교점은 한 개이다.\n$0<k<80$이므로 정수 $k$는 $79$개", "key": "Tm06-02"}, "tm06-02-2": {"id": "tm06-02-2", "unit": "m06", "theme": "02", "벌": 2, "k": "c5", "q": "방정식 $x^{3}+3x^{2}-a=0$이 한 개의 양의 실근과 서로 다른 두 개의 음의 실근을 갖도록 하는 실수 $a$의 값의 범위는?", "a": "$0<a<4$", "c": ["$0<a<4$", "$-4<a<0$", "$0\\le a\\le 4$", "$a>4$", "$0<a<2$"], "lvl": 2, "w": "[핵심] $x^{3}+3x^{2}=a$로 바꾸어 곡선 $y=x^{3}+3x^{2}$과 직선 $y=a$의 교점의 위치를 본다.\n$f(x)=x^{3}+3x^{2}$에서 $f'(x)=3x(x+2)$, 극댓값 $f(-2)=4$, 극솟값 $f(0)=0$\n$x<0$에서 교점이 두 개이려면 $0<a<4$\n이때 $x>0$에서 $f(x)$는 $0$부터 증가하므로 교점이 한 개이다.\n따라서 $0<a<4$", "key": "Tm06-02"}, "tm06-02-3": {"id": "tm06-02-3", "unit": "m06", "theme": "02", "벌": 3, "k": "num", "q": "방정식 $x^{3}-3ax^{2}+32=0$이 서로 다른 두 개의 양의 실근과 한 개의 음의 실근을 갖도록 하는 실수 $a$의 값의 범위가 $a>p$일 때, $p$의 값을 구하시오.", "a": "2", "lvl": 3, "w": "[핵심] $f(0)=32>0$이므로 음의 실근은 항상 하나 있고, 양의 실근 두 개는 $x>0$에서의 극솟값이 음수일 때 생긴다.\n$f(x)=x^{3}-3ax^{2}+32$, $f'(x)=3x(x-2a)$\n$a\\le 0$이면 $x>0$에서 $f(x)$가 증가하므로 양의 실근이 없다.\n$a>0$이면 극솟값 $f(2a)=32-4a^{3}<0$이어야 하므로 $a^{3}>8$, $a>2$\n따라서 $p=2$", "key": "Tm06-02"}, "tm06-03-1": {"id": "tm06-03-1", "unit": "m06", "theme": "03", "벌": 1, "k": "num", "q": "방정식 $x^{3}+3x^{2}-9x-k=0$이 서로 다른 세 실근을 갖도록 하는 정수 $k$의 개수를 구하시오.", "a": "31", "lvl": 2, "w": "[핵심] $x^{3}+3x^{2}-9x=k$로 바꾸어 직선 $y=k$가 극댓값과 극솟값 사이에 있게 한다.\n$f(x)=x^{3}+3x^{2}-9x$에서 $f'(x)=3(x+3)(x-1)$\n극댓값 $f(-3)=27$, 극솟값 $f(1)=-5$\n$-5<k<27$이므로 정수 $k$는 $31$개", "key": "Tm06-03"}, "tm06-03-2": {"id": "tm06-03-2", "unit": "m06", "theme": "03", "벌": 2, "k": "num", "q": "방정식 $2x^{3}-6x+k=0$이 서로 다른 두 실근을 갖도록 하는 모든 실수 $k$의 값의 곱을 구하시오.", "a": "-16", "lvl": 2, "w": "[핵심] 서로 다른 두 실근은 직선이 극대 또는 극소인 점에서 접할 때이다.\n$2x^{3}-6x=-k$로 바꾸면 $f(x)=2x^{3}-6x$의 극댓값 $f(-1)=4$, 극솟값 $f(1)=-4$\n$-k=4$ 또는 $-k=-4$이므로 $k=-4$ 또는 $k=4$\n곱은 $-16$", "key": "Tm06-03"}, "tm06-03-3": {"id": "tm06-03-3", "unit": "m06", "theme": "03", "벌": 3, "k": "num", "q": "방정식 $3x^{4}-4x^{3}-12x^{2}=k$의 서로 다른 실근의 개수가 $3$이 되도록 하는 모든 실수 $k$의 값의 합을 구하시오.", "a": "-5", "lvl": 3, "w": "[핵심] 사차함수의 증감표를 그리고 직선 $y=k$를 위아래로 움직이며 교점을 센다.\n$f(x)=3x^{4}-4x^{3}-12x^{2}$, $f'(x)=12x(x+1)(x-2)$\n극솟값 $f(-1)=-5$, 극댓값 $f(0)=0$, 극솟값 $f(2)=-32$\n교점이 $3$개인 것은 직선이 극대인 점이나 높은 쪽 극소인 점을 지날 때, 곧 $k=0$ 또는 $k=-5$\n합은 $-5$", "key": "Tm06-03"}, "tm06-04-1": {"id": "tm06-04-1", "unit": "m06", "theme": "04", "벌": 1, "k": "num", "q": "두 곡선 $y=x^{3}+2x^{2}$, $y=-x^{2}+24x+k$가 서로 다른 세 점에서 만나도록 하는 정수 $k$의 개수를 구하시오.", "a": "107", "lvl": 2, "w": "[핵심] 두 식을 빼서 $h(x)=k$ 꼴로 만들고 곡선 $y=h(x)$와 직선 $y=k$의 교점을 센다.\n$x^{3}+2x^{2}=-x^{2}+24x+k$에서 $x^{3}+3x^{2}-24x=k$\n$h(x)=x^{3}+3x^{2}-24x$, $h'(x)=3(x+4)(x-2)$\n극댓값 $h(-4)=80$, 극솟값 $h(2)=-28$\n$-28<k<80$이므로 정수 $k$는 $107$개", "key": "Tm06-04"}, "tm06-04-2": {"id": "tm06-04-2", "unit": "m06", "theme": "04", "벌": 2, "k": "num", "q": "두 곡선 $y=2x^{3}+x^{2}$, $y=4x^{2}+12x+k$가 오직 한 점에서 만나도록 하는 자연수 $k$의 최솟값을 구하시오.", "a": "8", "lvl": 2, "w": "[핵심] $h(x)=k$로 정리한 뒤 직선 $y=k$가 극댓값보다 위나 극솟값보다 아래에 있을 때 교점이 한 개이다.\n$2x^{3}-3x^{2}-12x=k$, $h(x)=2x^{3}-3x^{2}-12x$\n$h'(x)=6(x+1)(x-2)$, 극댓값 $h(-1)=7$, 극솟값 $h(2)=-20$\n교점이 한 개이려면 $k>7$ 또는 $k<-20$\n자연수 $k$의 최솟값은 $8$", "key": "Tm06-04"}, "tm06-04-3": {"id": "tm06-04-3", "unit": "m06", "theme": "04", "벌": 3, "k": "num", "q": "두 곡선 $y=x^{4}-2x^{2}$, $y=2x^{2}+k$의 서로 다른 교점의 개수를 $N(k)$라 할 때, $N(-5)+N(-4)+N(-1)+N(0)+N(1)$의 값을 구하시오.", "a": "11", "lvl": 3, "w": "[핵심] $x^{4}-4x^{2}=k$로 바꾸어 곡선 $y=x^{4}-4x^{2}$과 직선 $y=k$의 교점을 센다.\n$h(x)=x^{4}-4x^{2}$, $h'(x)=4x(x+\\sqrt{2})(x-\\sqrt{2})$\n극솟값 $h(\\pm\\sqrt{2})=-4$, 극댓값 $h(0)=0$\n$N(-5)=0$, $N(-4)=2$, $N(-1)=4$, $N(0)=3$, $N(1)=2$\n합은 $11$", "key": "Tm06-04"}, "tm06-05-1": {"id": "tm06-05-1", "unit": "m06", "theme": "05", "벌": 1, "k": "num", "q": "점 $(2,\\,k)$에서 곡선 $y=x^{3}$에 서로 다른 세 개의 접선을 그을 수 있도록 하는 정수 $k$의 개수를 구하시오.", "a": "7", "lvl": 2, "w": "[핵심] 접점을 $(t,\\,t^{3})$으로 놓고, 접선이 점을 지나는 조건을 $t$에 대한 방정식으로 세운다.\n접선 $y=3t^{2}(x-t)+t^{3}$이 $(2,\\,k)$를 지나면 $k=-2t^{3}+6t^{2}$\n$g(t)=-2t^{3}+6t^{2}$, $g'(t)=-6t(t-2)$, 극솟값 $g(0)=0$, 극댓값 $g(2)=8$\n$t$에 대한 실근이 $3$개이려면 $0<k<8$\n정수 $k$는 $7$개", "key": "Tm06-05"}, "tm06-05-2": {"id": "tm06-05-2", "unit": "m06", "theme": "05", "벌": 2, "k": "num", "q": "곡선 $y=x^{3}+3x^{2}$ 위에 있지 않은 점 $(0,\\,a)$에서 이 곡선에 그을 수 있는 접선이 정확히 두 개일 때, 실수 $a$의 값을 구하시오.", "a": "-1", "lvl": 2, "w": "[핵심] 접선의 개수는 접점의 $x$좌표 $t$에 대한 방정식의 서로 다른 실근의 개수이다.\n접선 $y=(3t^{2}+6t)(x-t)+t^{3}+3t^{2}$에 $x=0$, $y=a$를 넣으면 $a=-2t^{3}-3t^{2}$\n$g(t)=-2t^{3}-3t^{2}$, $g'(t)=-6t(t+1)$, 극솟값 $g(-1)=-1$, 극댓값 $g(0)=0$\n실근이 두 개이려면 $a=0$ 또는 $a=-1$\n$a=0$이면 점 $(0,\\,0)$이 곡선 위에 있으므로 $a=-1$", "key": "Tm06-05"}, "tm06-05-3": {"id": "tm06-05-3", "unit": "m06", "theme": "05", "벌": 3, "k": "c5", "q": "점 $(a,\\,0)$에서 곡선 $y=x^{3}-x$에 서로 다른 세 개의 접선을 그을 수 있도록 하는 실수 $a$의 값의 범위는?", "a": "$a<-1$ 또는 $a>1$", "c": ["$a<-1$ 또는 $a>1$", "$-1<a<1$", "$a<-1$ 또는 $0<a<1$", "$a>1$", "$-1<a<0$ 또는 $a>1$"], "lvl": 3, "w": "[핵심] $t$에 대한 삼차방정식이 서로 다른 세 실근을 가질 조건은 (극댓값)$\\times$(극솟값)$<0$이다.\n접선 $y=(3t^{2}-1)(x-t)+t^{3}-t$가 $(a,\\,0)$을 지나면 $-2t^{3}+3at^{2}-a=0$\n$g(t)=-2t^{3}+3at^{2}-a$, $g'(t)=-6t(t-a)$이므로 $a\\ne 0$이고 $g(0)\\,g(a)<0$\n$(-a)(a^{3}-a)=-a^{2}(a^{2}-1)<0$에서 $a^{2}>1$\n따라서 $a<-1$ 또는 $a>1$", "key": "Tm06-05"}, "tm06-06-1": {"id": "tm06-06-1", "unit": "m06", "theme": "06", "벌": 1, "k": "num", "q": "모든 실수 $x$에 대하여 부등식 $3x^{4}-16x^{3}+18x^{2}+k\\ge 0$이 성립하도록 하는 실수 $k$의 최솟값을 구하시오.", "a": "27", "lvl": 2, "w": "[핵심] 모든 실수 $x$에 대하여 $f(x)\\ge 0$ $\\iff$ $f(x)$의 최솟값 $\\ge 0$\n$f(x)=3x^{4}-16x^{3}+18x^{2}+k$, $f'(x)=12x(x-1)(x-3)$\n극솟값 $f(0)=k$, $f(3)=k-27$ 중 작은 것이 최솟값 $k-27$\n$k-27\\ge 0$에서 최솟값 $27$", "key": "Tm06-06"}, "tm06-06-2": {"id": "tm06-06-2", "unit": "m06", "theme": "06", "벌": 2, "k": "num", "q": "모든 실수 $x$에 대하여 부등식 $x^{4}-4a^{3}x+12\\ge 0$이 성립하도록 하는 정수 $a$의 개수를 구하시오.", "a": "3", "lvl": 2, "w": "[핵심] 최솟값을 $a$로 나타내어 $0$ 이상이 되게 한다.\n$f'(x)=4x^{3}-4a^{3}=4(x-a)(x^{2}+ax+a^{2})$이므로 $f(x)$는 $x=a$에서 최소이다.\n최솟값 $f(a)=a^{4}-4a^{4}+12=12-3a^{4}\\ge 0$에서 $a^{4}\\le 4$\n정수 $a$는 $-1$, $0$, $1$의 $3$개", "key": "Tm06-06"}, "tm06-06-3": {"id": "tm06-06-3", "unit": "m06", "theme": "06", "벌": 3, "k": "num", "q": "모든 실수 $x$에 대하여 부등식 $x^{4}-2ax^{2}+a+6\\ge 0$이 성립하도록 하는 정수 $a$의 개수를 구하시오.", "a": "10", "lvl": 3, "w": "[핵심] $f'(x)=4x(x^{2}-a)$이므로 $a$의 부호에 따라 최소인 점이 달라진다.\n$a\\le 0$이면 $x=0$에서 최소이고 $f(0)=a+6\\ge 0$에서 $-6\\le a\\le 0$\n$a>0$이면 $x=\\pm\\sqrt{a}$에서 최소이고 $f(\\sqrt{a})=-a^{2}+a+6\\ge 0$\n$(a-3)(a+2)\\le 0$에서 $0<a\\le 3$\n따라서 $-6\\le a\\le 3$, 정수 $a$는 $10$개", "key": "Tm06-06"}, "tm06-07-1": {"id": "tm06-07-1", "unit": "m06", "theme": "07", "벌": 1, "k": "num", "q": "닫힌구간 $[-2,\\,2]$에서 부등식 $x^{3}-3x^{2}-9x+k\\ge 0$이 성립하도록 하는 실수 $k$의 최솟값을 구하시오.", "a": "22", "lvl": 2, "w": "[핵심] 구간에서의 최솟값은 구간 안의 극값과 양 끝값을 비교해 정한다.\n$f(x)=x^{3}-3x^{2}-9x+k$, $f'(x)=3(x+1)(x-3)$\n$f(-2)=k-2$, $f(-1)=k+5$, $f(2)=k-22$\n최솟값 $k-22\\ge 0$에서 $k$의 최솟값은 $22$", "key": "Tm06-07"}, "tm06-07-2": {"id": "tm06-07-2", "unit": "m06", "theme": "07", "벌": 2, "k": "num", "q": "닫힌구간 $[0,\\,2]$에서 부등식 $x^{3}+3x^{2}-9x+k\\le 0$이 성립하도록 하는 실수 $k$의 최댓값을 구하시오.", "a": "-2", "lvl": 2, "w": "[핵심] $f(x)\\le 0$이 구간에서 성립하려면 그 구간에서의 최댓값이 $0$ 이하이어야 한다.\n$f(x)=x^{3}+3x^{2}-9x+k$, $f'(x)=3(x+3)(x-1)$\n$f(0)=k$, $f(1)=k-5$, $f(2)=k+2$\n최댓값 $k+2\\le 0$에서 $k$의 최댓값은 $-2$", "key": "Tm06-07"}, "tm06-07-3": {"id": "tm06-07-3", "unit": "m06", "theme": "07", "벌": 3, "k": "num", "q": "$x\\ge 0$인 모든 실수 $x$에 대하여 부등식 $2x^{3}-3ax^{2}+27\\ge 0$이 성립하도록 하는 실수 $a$의 최댓값을 구하시오.", "a": "3", "lvl": 3, "w": "[핵심] $f'(x)=6x(x-a)$이므로 $a$의 부호에 따라 $x\\ge 0$에서의 최솟값이 달라진다.\n$a\\le 0$이면 $x\\ge 0$에서 증가하고 최솟값 $f(0)=27>0$\n$a>0$이면 최솟값 $f(a)=2a^{3}-3a^{3}+27=27-a^{3}\\ge 0$에서 $0<a\\le 3$\n따라서 $a\\le 3$, 최댓값 $3$", "key": "Tm06-07"}, "tm06-08-1": {"id": "tm06-08-1", "unit": "m06", "theme": "08", "벌": 1, "k": "num", "q": "두 함수 $f(x)=x^{4}+2x^{3}-5x^{2}+k$, $g(x)=-2x^{3}+3x^{2}$에 대하여 모든 실수 $x$에서 $f(x)\\ge g(x)$가 성립하도록 하는 실수 $k$의 최솟값을 구하시오.", "a": "128", "lvl": 2, "w": "[핵심] $h(x)=f(x)-g(x)$의 최솟값이 $0$ 이상이면 된다.\n$h(x)=x^{4}+4x^{3}-8x^{2}+k$, $h'(x)=4x(x+4)(x-1)$\n극솟값 $h(-4)=k-128$, $h(1)=k-3$ 중 작은 $k-128$이 최솟값\n$k-128\\ge 0$에서 최솟값 $128$", "key": "Tm06-08"}, "tm06-08-2": {"id": "tm06-08-2", "unit": "m06", "theme": "08", "벌": 2, "k": "num", "q": "두 함수 $f(x)=x^{3}+2x^{2}$, $g(x)=8x^{2}+15x-k$에 대하여 $x\\ge 0$인 모든 실수 $x$에서 $f(x)\\ge g(x)$가 성립하도록 하는 실수 $k$의 최솟값을 구하시오.", "a": "100", "lvl": 2, "w": "[핵심] $h(x)=f(x)-g(x)$의 $x\\ge 0$에서의 최솟값이 $0$ 이상이면 된다.\n$h(x)=x^{3}-6x^{2}-15x+k$, $h'(x)=3(x+1)(x-5)$\n$x\\ge 0$에서 최솟값은 $h(5)=125-150-75+k=k-100$\n$k-100\\ge 0$에서 최솟값 $100$", "key": "Tm06-08"}, "tm06-08-3": {"id": "tm06-08-3", "unit": "m06", "theme": "08", "벌": 3, "k": "num", "q": "$x\\ge 0$인 모든 실수 $x$에 대하여 곡선 $y=x^{3}+2$가 직선 $y=kx$보다 아래쪽에 있지 않도록 하는 실수 $k$의 최댓값을 구하시오.", "a": "3", "lvl": 3, "w": "[핵심] $h(x)=x^{3}-kx+2\\ge 0$이 $x\\ge 0$에서 성립할 조건을 찾는다.\n$k\\le 0$이면 $x\\ge 0$에서 $h(x)\\ge 2>0$\n$k>0$이면 $3\\alpha^{2}=k$인 $\\alpha>0$에 대하여 $h'(x)=3(x-\\alpha)(x+\\alpha)$이므로 $x=\\alpha$에서 최소\n$h(\\alpha)=\\alpha^{3}-3\\alpha^{3}+2=2-2\\alpha^{3}\\ge 0$에서 $\\alpha\\le 1$\n$k=3\\alpha^{2}\\le 3$이므로 최댓값 $3$", "key": "Tm06-08"}, "tm06-09-1": {"id": "tm06-09-1", "unit": "m06", "theme": "09", "벌": 1, "k": "num", "q": "수직선 위를 움직이는 점 $\\mathrm{P}$의 시각 $t$에서의 위치 $x$가 $x=t^{3}-4t^{2}+3t$이다. 점 $\\mathrm{P}$의 가속도가 $4$인 순간 점 $\\mathrm{P}$의 속도를 구하시오.", "a": "-1", "lvl": 2, "w": "[핵심] 위치를 $t$에 대하여 미분하면 속도, 속도를 $t$에 대하여 미분하면 가속도이다.\n$v=3t^{2}-8t+3$, $a=6t-8$\n$6t-8=4$에서 $t=2$\n$t=2$에서 속도는 $12-16+3=-1$", "key": "Tm06-09"}, "tm06-09-2": {"id": "tm06-09-2", "unit": "m06", "theme": "09", "벌": 2, "k": "num", "q": "수직선 위를 움직이는 점 $\\mathrm{P}$의 시각 $t$에서의 위치 $x$가 $x=2t^{3}-9t^{2}+12t+1$이다. 점 $\\mathrm{P}$의 속도가 $0$인 모든 시각에서의 점 $\\mathrm{P}$의 위치의 합을 구하시오.", "a": "11", "lvl": 2, "w": "[핵심] 속도 $v=\\dfrac{dx}{dt}$가 $0$인 시각을 구해 위치에 넣는다.\n$v=6t^{2}-18t+12=6(t-1)(t-2)$에서 $t=1$, $t=2$\n$x(1)=2-9+12+1=6$, $x(2)=16-36+24+1=5$\n합은 $11$", "key": "Tm06-09"}, "tm06-09-3": {"id": "tm06-09-3", "unit": "m06", "theme": "09", "벌": 3, "k": "num", "q": "원점을 출발하여 수직선 위를 움직이는 점 $\\mathrm{P}$의 시각 $t\\,(t\\ge 0)$에서의 위치 $x$가 $x=t^{3}-7t^{2}+10t$이다. 점 $\\mathrm{P}$가 출발한 후 처음으로 다시 원점을 지나는 순간 점 $\\mathrm{P}$의 가속도를 구하시오.", "a": "-2", "lvl": 3, "w": "[핵심] 원점을 지나는 순간은 위치가 $0$인 순간이다.\n$x=t(t-2)(t-5)=0$에서 $t>0$인 첫 시각은 $t=2$\n$v=3t^{2}-14t+10$, $a=6t-14$\n$t=2$에서 가속도는 $12-14=-2$", "key": "Tm06-09"}, "tm06-10-1": {"id": "tm06-10-1", "unit": "m06", "theme": "10", "벌": 1, "k": "num", "q": "수직선 위를 움직이는 두 점 $\\mathrm{P}$, $\\mathrm{Q}$의 시각 $t\\,(t\\ge 0)$에서의 위치가 각각 $x_{\\mathrm{P}}=t^{3}-2t^{2}$, $x_{\\mathrm{Q}}=t^{2}+9t+1$이다. 두 점의 속도가 같아지는 순간 두 점 사이의 거리를 구하시오.", "a": "28", "lvl": 2, "w": "[핵심] 두 속도를 같게 놓고 $t\\ge 0$인 해를 고른다.\n$v_{\\mathrm{P}}=3t^{2}-4t$, $v_{\\mathrm{Q}}=2t+9$\n$3t^{2}-6t-9=0$, $3(t+1)(t-3)=0$에서 $t=3$\n$x_{\\mathrm{P}}=27-18=9$, $x_{\\mathrm{Q}}=9+27+1=37$\n거리는 $|37-9|=28$", "key": "Tm06-10"}, "tm06-10-2": {"id": "tm06-10-2", "unit": "m06", "theme": "10", "벌": 2, "k": "num", "q": "수직선 위를 움직이는 두 점 $\\mathrm{P}$, $\\mathrm{Q}$의 시각 $t\\,(t\\ge 0)$에서의 위치가 각각 $x_{\\mathrm{P}}=t^{3}+t^{2}-5t$, $x_{\\mathrm{Q}}=2t^{2}+3t$이다. 두 점의 속도가 같아지는 순간 점 $\\mathrm{P}$의 가속도를 구하시오.", "a": "14", "lvl": 2, "w": "[핵심] 속도가 같아지는 시각을 먼저 구하고 그 시각의 가속도를 계산한다.\n$v_{\\mathrm{P}}=3t^{2}+2t-5$, $v_{\\mathrm{Q}}=4t+3$\n$3t^{2}-2t-8=0$, $(3t+4)(t-2)=0$에서 $t=2$\n$a_{\\mathrm{P}}=6t+2$이므로 $t=2$에서 $14$", "key": "Tm06-10"}, "tm06-10-3": {"id": "tm06-10-3", "unit": "m06", "theme": "10", "벌": 3, "k": "num", "q": "수직선 위를 움직이는 두 점 $\\mathrm{P}$, $\\mathrm{Q}$의 시각 $t\\,(t\\ge 0)$에서의 위치가 각각 $x_{\\mathrm{P}}=t^{3}-3t^{2}+5t$, $x_{\\mathrm{Q}}=kt$이다. $t>0$에서 두 점의 속도가 같아지는 순간이 두 번 있도록 하는 모든 정수 $k$의 값의 합을 구하시오.", "a": "7", "lvl": 3, "w": "[핵심] $v_{\\mathrm{P}}=k$가 $t>0$에서 서로 다른 두 실근을 가질 조건을 그래프로 본다.\n$v_{\\mathrm{P}}=3t^{2}-6t+5=3(t-1)^{2}+2$, $v_{\\mathrm{Q}}=k$\n$t>0$에서 $y=3(t-1)^{2}+2$는 $t=1$에서 최솟값 $2$, $t=0$일 때 값 $5$\n직선 $y=k$와 $t>0$에서 두 번 만나려면 $2<k<5$\n정수 $k=3$, $4$이므로 합은 $7$", "key": "Tm06-10"}, "tm06-11-1": {"id": "tm06-11-1", "unit": "m06", "theme": "11", "벌": 1, "k": "num", "q": "수직선 위를 움직이는 점 $\\mathrm{P}$의 시각 $t$에서의 위치 $x$가 $x=t^{3}-15t^{2}+48t$이다. 점 $\\mathrm{P}$가 운동 방향을 바꾸는 두 시각에서의 점 $\\mathrm{P}$의 위치의 차를 구하시오.", "a": "108", "lvl": 2, "w": "[핵심] 운동 방향이 바뀌는 시각은 속도의 부호가 바뀌는 시각이다.\n$v=3t^{2}-30t+48=3(t-2)(t-8)$, $t=2$와 $t=8$의 좌우에서 부호가 바뀐다.\n$x(2)=8-60+96=44$, $x(8)=512-960+384=-64$\n차는 $44-(-64)=108$", "key": "Tm06-11"}, "tm06-11-2": {"id": "tm06-11-2", "unit": "m06", "theme": "11", "벌": 2, "k": "num", "q": "수직선 위를 움직이는 점 $\\mathrm{P}$의 시각 $t$에서의 위치 $x$가 $x=t^{3}-3t^{2}+kt$이다. 점 $\\mathrm{P}$가 $t>0$에서 운동 방향을 한 번도 바꾸지 않도록 하는 실수 $k$의 최솟값을 구하시오.", "a": "3", "lvl": 2, "w": "[핵심] 방향을 바꾸지 않으려면 $t>0$에서 속도의 부호가 바뀌지 않아야 한다.\n$v=3t^{2}-6t+k=3(t-1)^{2}+k-3$\n$k\\ge 3$이면 $v\\ge 0$이고 $v=0$이어도 부호가 바뀌지 않는다.\n$k<3$이면 $v(1)<0$이고 $t$가 커지면 $v>0$이므로 부호가 바뀐다.\n최솟값 $3$", "key": "Tm06-11"}, "tm06-11-3": {"id": "tm06-11-3", "unit": "m06", "theme": "11", "벌": 3, "k": "num", "q": "수직선 위를 움직이는 점 $\\mathrm{P}$의 시각 $t$에서의 위치 $x$가 $x=2t^{3}-3(a+1)t^{2}+6at$이다. 점 $\\mathrm{P}$가 $t>0$에서 운동 방향을 단 한 번 바꾸도록 하는 정수 $a$ 중에서 $-5\\le a\\le 5$인 것의 개수를 구하시오.", "a": "6", "lvl": 3, "w": "[핵심] $v=6(t-1)(t-a)$에서 $t>0$인 부호 변화의 개수를 센다.\n$a\\le 0$이면 $t>0$에서 부호가 바뀌는 곳은 $t=1$뿐이다.\n$a=1$이면 $v=6(t-1)^{2}\\ge 0$이라 한 번도 바뀌지 않는다.\n$a>0$, $a\\ne 1$이면 $t=1$, $t=a$에서 두 번 바뀐다.\n$a=-5$, $-4$, $\\cdots$, $0$의 $6$개", "key": "Tm06-11"}, "tm06-12-1": {"id": "tm06-12-1", "unit": "m06", "theme": "12", "벌": 1, "k": "num", "q": "지면에서 똑바로 위로 쏘아 올린 물체의 $t$초 후의 지면으로부터의 높이를 $h\\,\\mathrm{m}$라 하면 $h=50t-5t^{2}$이다. 이 물체가 도달하는 최고 높이는 몇 $\\mathrm{m}$인지 구하시오.", "a": "125", "lvl": 2, "w": "[핵심] 최고 높이에 도달하는 순간 속도가 $0$이다.\n$v=\\dfrac{dh}{dt}=50-10t=0$에서 $t=5$\n$h=250-125=125$\n최고 높이는 $125\\,\\mathrm{m}$", "key": "Tm06-12"}, "tm06-12-2": {"id": "tm06-12-2", "unit": "m06", "theme": "12", "벌": 2, "k": "num", "q": "높이가 $40\\,\\mathrm{m}$인 건물 옥상에서 똑바로 위로 던진 공의 $t$초 후의 지면으로부터의 높이를 $h\\,\\mathrm{m}$라 하면 $h=40+35t-5t^{2}$이다. 공이 지면에 닿는 순간 공의 속도를 구하시오. (단, 위쪽을 양의 방향으로 한다.)", "a": "-45", "lvl": 2, "w": "[핵심] 지면에 닿는 순간은 $h=0$인 순간이고, 그 시각의 $\\dfrac{dh}{dt}$가 속도이다.\n$40+35t-5t^{2}=0$, $t^{2}-7t-8=0$, $(t-8)(t+1)=0$에서 $t=8$\n$v=35-10t$이므로 $t=8$에서 $-45$\n아래로 떨어지고 있으므로 속도가 음수이다.", "key": "Tm06-12"}, "tm06-12-3": {"id": "tm06-12-3", "unit": "m06", "theme": "12", "벌": 3, "k": "num", "q": "직선 도로를 달리던 자동차가 제동을 건 후 $t$초 동안 움직인 거리를 $x\\,\\mathrm{m}$라 하면 $x=at-2t^{2}$ ($a$는 양수)이다. 제동을 건 후 정지할 때까지 움직인 거리가 $50\\,\\mathrm{m}$ 이하가 되도록 하는 $a$의 최댓값을 구하시오.", "a": "20", "lvl": 3, "w": "[핵심] 정지하는 순간은 속도가 $0$인 순간이다.\n$v=a-4t=0$에서 $t=\\dfrac{a}{4}$\n그때까지 움직인 거리는 $a\\times\\dfrac{a}{4}-2\\times\\dfrac{a^{2}}{16}=\\dfrac{a^{2}}{8}$\n$\\dfrac{a^{2}}{8}\\le 50$에서 $a^{2}\\le 400$, $0<a\\le 20$\n최댓값 $20$", "key": "Tm06-12"}, "tm06-13-1": {"id": "tm06-13-1", "unit": "m06", "theme": "13", "벌": 1, "k": "c5", "q": "수직선 위를 움직이는 점 $\\mathrm{P}$의 시각 $t\\,(0\\le t\\le 5)$에서의 속도가 $v(t)=t^{2}-4t+3$일 때, 옳은 것만을 있는 대로 고른 것은?<br>ㄱ. $0<t<5$에서 점 $\\mathrm{P}$는 운동 방향을 두 번 바꾼다.<br>ㄴ. $t=2$일 때 점 $\\mathrm{P}$의 가속도는 $0$이다.<br>ㄷ. $1<t<2$에서 점 $\\mathrm{P}$의 가속도는 양수이다.", "a": "ㄱ, ㄴ", "c": ["ㄱ", "ㄴ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "lvl": 2, "w": "[핵심] 속도 그래프는 부호가 운동 방향, 접선의 기울기가 가속도이다.\nㄱ. $v=(t-1)(t-3)$은 $t=1$, $t=3$에서 부호가 바뀐다. 참\nㄴ. $a=v'(t)=2t-4$이므로 $t=2$에서 $0$이다. 참\nㄷ. $1<t<2$에서 $2t-4<0$이므로 가속도는 음수이다. 거짓", "key": "Tm06-13"}, "tm06-13-2": {"id": "tm06-13-2", "unit": "m06", "theme": "13", "벌": 2, "k": "num", "q": "수직선 위를 움직이는 점 $\\mathrm{P}$의 시각 $t\\,(0\\le t\\le 5)$에서의 속도가 $v(t)=-t^{2}+6t-5$일 때, $0\\le t\\le 5$에서 점 $\\mathrm{P}$의 속력의 최댓값을 구하시오.", "a": "5", "lvl": 2, "w": "[핵심] 속력은 $|v(t)|$이므로 속도의 최댓값과 최솟값을 모두 본다.\n$v(t)=-(t-3)^{2}+4$\n$0\\le t\\le 5$에서 $v(0)=-5$, $v(3)=4$, $v(5)=0$이므로 $-5\\le v(t)\\le 4$\n속력의 최댓값은 $|-5|=5$ (속도의 최댓값 $4$가 아니다)", "key": "Tm06-13"}, "tm06-13-3": {"id": "tm06-13-3", "unit": "m06", "theme": "13", "벌": 3, "k": "c5", "q": "수직선 위를 움직이는 점 $\\mathrm{P}$의 시각 $t\\,(0\\le t\\le 8)$에서의 속도 $v(t)$가<br>$0\\le t\\le 2$일 때 $v(t)=2t$<br>$2\\le t\\le 4$일 때 $v(t)=4$<br>$4\\le t\\le 8$일 때 $v(t)=12-2t$<br>이다. 옳은 것만을 있는 대로 고른 것은?<br>ㄱ. $t=5$일 때 점 $\\mathrm{P}$의 가속도는 $-2$이다.<br>ㄴ. $0<t<8$에서 점 $\\mathrm{P}$는 운동 방향을 두 번 바꾼다.<br>ㄷ. $t=3$일 때 점 $\\mathrm{P}$의 가속도는 $0$이다.", "a": "ㄱ, ㄷ", "c": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄱ, ㄷ", "ㄱ, ㄴ, ㄷ"], "lvl": 3, "w": "[핵심] 각 구간에서 속도 그래프의 기울기가 가속도, $t$축을 지나는 점이 방향이 바뀌는 시각이다.\nㄱ. $4<t<8$에서 $v'(t)=-2$이다. 참\nㄴ. $v(t)=0$이고 부호가 바뀌는 것은 $t=6$뿐이므로 한 번 바꾼다. 거짓\nㄷ. $2<t<4$에서 속도가 $4$로 일정하므로 가속도는 $0$이다. 참", "key": "Tm06-13"}, "tm06-14-1": {"id": "tm06-14-1", "unit": "m06", "theme": "14", "벌": 1, "k": "c5", "q": "수직선 위를 움직이는 점 $\\mathrm{P}$의 시각 $t$에서의 위치 $x$가 $x(t)=2t^{3}-15t^{2}+36t\\,(0\\le t\\le 4)$일 때, 옳은 것만을 있는 대로 고른 것은?<br>ㄱ. $t=2$일 때 점 $\\mathrm{P}$의 속도는 $0$이다.<br>ㄴ. $2<t<3$에서 점 $\\mathrm{P}$는 음의 방향으로 움직인다.<br>ㄷ. $t=2$일 때 점 $\\mathrm{P}$의 가속도는 양수이다.", "a": "ㄱ, ㄴ", "c": ["ㄱ", "ㄴ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "lvl": 2, "w": "[핵심] 위치 그래프에서 증가·감소가 운동 방향, 접선의 기울기가 속도이다.\nㄱ. $v=6t^{2}-30t+36=6(t-2)(t-3)$이므로 $v(2)=0$. 참\nㄴ. $2<t<3$에서 $v<0$, 곧 $x(t)$가 감소한다. 참\nㄷ. $a=12t-30$이므로 $t=2$에서 $-6$이다. 거짓", "key": "Tm06-14"}, "tm06-14-2": {"id": "tm06-14-2", "unit": "m06", "theme": "14", "벌": 2, "k": "c5", "q": "원점을 출발하여 수직선 위를 움직이는 점 $\\mathrm{P}$의 시각 $t$에서의 위치 $x(t)$는 다항함수이고 다음을 만족시킨다.<br>(가) $0<t<2$에서 증가하고, $2<t<5$에서 감소하고, $t>5$에서 증가한다.<br>(나) $x(5)<0$<br>옳은 것만을 있는 대로 고른 것은?<br>ㄱ. 점 $\\mathrm{P}$는 $t=2$에서 운동 방향을 바꾼다.<br>ㄴ. $0<t<5$에서 점 $\\mathrm{P}$의 속도는 $t=2$일 때 최대이다.<br>ㄷ. $0<t<5$에서 점 $\\mathrm{P}$가 원점을 지나는 것은 한 번이다.", "a": "ㄱ, ㄷ", "c": ["ㄱ", "ㄴ", "ㄱ, ㄴ", "ㄱ, ㄷ", "ㄱ, ㄴ, ㄷ"], "lvl": 2, "w": "[핵심] $x(t)$의 증가·감소는 속도의 부호, 극대·극소는 방향이 바뀌는 순간이다.\nㄱ. $t=2$의 좌우에서 증가에서 감소로 바뀌므로 속도의 부호가 바뀐다. 참\nㄴ. $t=2$에서 극대이므로 속도는 $0$이다. $0<t<2$에서 속도가 양수이므로 최대가 아니다. 거짓\nㄷ. $0<t\\le 2$에서 $x(t)>x(0)=0$이고, $2<t<5$에서 감소하여 $x(5)<0$이 되므로 원점을 한 번 지난다. 참", "key": "Tm06-14"}, "tm06-14-3": {"id": "tm06-14-3", "unit": "m06", "theme": "14", "벌": 3, "k": "num", "q": "수직선 위를 움직이는 점 $\\mathrm{P}$의 시각 $t$에서의 위치 $x$가 $x=t^{3}-12t^{2}+21t\\,(0\\le t\\le 8)$이다. $0\\le t\\le 8$에서 점 $\\mathrm{P}$가 원점에서 가장 멀리 떨어져 있을 때 원점과 점 $\\mathrm{P}$ 사이의 거리를 구하시오.", "a": "98", "lvl": 3, "w": "[핵심] 원점과의 거리는 $|x(t)|$이므로 위치의 최댓값과 최솟값을 모두 구한다.\n$v=3t^{2}-24t+21=3(t-1)(t-7)$\n$x(0)=0$, $x(1)=10$, $x(7)=-98$, $x(8)=-88$\n$-98\\le x\\le 10$이므로 가장 먼 거리는 $98$", "key": "Tm06-14"}, "tm06-15-1": {"id": "tm06-15-1", "unit": "m06", "theme": "15", "벌": 1, "k": "num", "q": "한 변의 길이가 $2\\,\\mathrm{cm}$인 정사각형의 각 변의 길이가 매초 $1\\,\\mathrm{cm}$씩 늘어난다. $3$초 후의 이 정사각형의 넓이의 변화율을 구하시오.", "a": "10", "lvl": 2, "w": "[핵심] 넓이를 시각 $t$에 대한 식으로 나타낸 뒤 $t$에 대하여 미분한다.\n$t$초 후 한 변의 길이는 $2+t$, 넓이 $S=(2+t)^{2}=t^{2}+4t+4$\n$S'=2t+4$\n$t=3$에서 $10$", "key": "Tm06-15"}, "tm06-15-2": {"id": "tm06-15-2", "unit": "m06", "theme": "15", "벌": 2, "k": "c5", "q": "반지름의 길이가 $1\\,\\mathrm{cm}$인 원의 반지름의 길이가 매초 $2\\,\\mathrm{cm}$씩 늘어난다. 원의 넓이가 $25\\pi\\,\\mathrm{cm}^{2}$가 되는 순간 넓이의 변화율은?", "a": "$20\\pi$", "c": ["$20\\pi$", "$10\\pi$", "$25\\pi$", "$40\\pi$", "$16\\pi$"], "lvl": 2, "w": "[핵심] 넓이가 주어진 값이 되는 시각을 먼저 구한다.\n$t$초 후 반지름 $1+2t$, 넓이 $S=\\pi(1+2t)^{2}=\\pi(4t^{2}+4t+1)$\n$S=25\\pi$에서 $1+2t=5$, $t=2$\n$S'=\\pi(8t+4)$이므로 $t=2$에서 $20\\pi$", "key": "Tm06-15"}, "tm06-15-3": {"id": "tm06-15-3", "unit": "m06", "theme": "15", "벌": 3, "k": "num", "q": "가로의 길이가 $2\\,\\mathrm{cm}$, 세로의 길이가 $9\\,\\mathrm{cm}$인 직사각형에서 가로의 길이는 매초 $2\\,\\mathrm{cm}$씩 늘어나고 세로의 길이는 매초 $1\\,\\mathrm{cm}$씩 줄어든다. 이 직사각형의 넓이가 늘어나다가 줄어들기 시작하는 순간의 넓이는 몇 $\\mathrm{cm}^{2}$인지 구하시오.", "a": "50", "lvl": 3, "w": "[핵심] 넓이의 변화율의 부호가 양에서 음으로 바뀌는 시각을 찾는다.\n$t$초 후 넓이 $S=(2+2t)(9-t)=-2t^{2}+16t+18$ ($0\\le t<9$)\n$S'=-4t+16$은 $t=4$의 좌우에서 양에서 음으로 바뀐다.\n$t=4$에서 넓이는 $10\\times 5=50$", "key": "Tm06-15"}, "tm06-16-1": {"id": "tm06-16-1", "unit": "m06", "theme": "16", "벌": 1, "k": "num", "q": "한 모서리의 길이가 $1\\,\\mathrm{cm}$인 정육면체의 각 모서리의 길이가 매초 $1\\,\\mathrm{cm}$씩 늘어난다. $2$초 후의 이 정육면체의 부피의 변화율을 구하시오.", "a": "27", "lvl": 2, "w": "[핵심] 부피를 시각 $t$에 대한 식으로 나타낸 뒤 미분한다.\n$V=(1+t)^{3}=t^{3}+3t^{2}+3t+1$\n$V'=3t^{2}+6t+3=3(1+t)^{2}$\n$t=2$에서 $27$", "key": "Tm06-16"}, "tm06-16-2": {"id": "tm06-16-2", "unit": "m06", "theme": "16", "벌": 2, "k": "c5", "q": "반지름의 길이가 $2\\,\\mathrm{cm}$인 구의 반지름의 길이가 매초 $1\\,\\mathrm{cm}$씩 늘어난다. 반지름의 길이가 $5\\,\\mathrm{cm}$가 되는 순간 구의 부피의 변화율은?", "a": "$100\\pi$", "c": ["$100\\pi$", "$\\dfrac{500}{3}\\pi$", "$25\\pi$", "$75\\pi$", "$50\\pi$"], "lvl": 2, "w": "[핵심] 반지름이 $5\\,\\mathrm{cm}$가 되는 시각을 먼저 구한다.\n$t$초 후 반지름 $2+t$, $V=\\dfrac{4}{3}\\pi(2+t)^{3}$\n전개하여 미분하면 $V'=4\\pi(2+t)^{2}$\n$2+t=5$에서 $t=3$, $V'=100\\pi$", "key": "Tm06-16"}, "tm06-16-3": {"id": "tm06-16-3", "unit": "m06", "theme": "16", "벌": 3, "k": "num", "q": "밑면의 반지름의 길이가 $2\\,\\mathrm{cm}$, 높이가 $10\\,\\mathrm{cm}$인 원기둥에서 밑면의 반지름의 길이는 매초 $1\\,\\mathrm{cm}$씩 늘어나고 높이는 매초 $1\\,\\mathrm{cm}$씩 줄어든다. 이 원기둥의 부피가 최대일 때의 부피를 $k\\pi\\,\\mathrm{cm}^{3}$라 할 때, $k$의 값을 구하시오.", "a": "256", "lvl": 3, "w": "[핵심] 부피의 변화율이 양에서 음으로 바뀌는 순간 부피가 최대이다.\n$V=\\pi(2+t)^{2}(10-t)=\\pi(-t^{3}+6t^{2}+36t+40)$ ($0\\le t<10$)\n$V'=\\pi(-3t^{2}+12t+36)=-3\\pi(t-6)(t+2)$\n$t=6$의 좌우에서 양에서 음으로 바뀌므로 $t=6$에서 최대\n$V=\\pi\\times 64\\times 4=256\\pi$, $k=256$", "key": "Tm06-16"}}, "need": {"C": 2, "T": 1}, "gap": 3};

/* 문항 글자: 이스케이프 후 줄바꿈만 살린다. ㄱ.·(가) 앞은 자동 줄바꿈 */
function T(s){
  let h=E(s).replace(/&lt;br\s*\/?&gt;/gi,'\n').replace(/&lt;(\/?)b&gt;/gi,'<$1b>');
  // 보기 나열은 줄을 나눈다(감리 R7: 수식 안·문장 속 빈칸 (가)는 건드리지 않는다)
  const M=[]; h=h.replace(/\$[^$]*\$/g,m=>{ M.push(m); return '\u0000'+(M.length-1)+'\u0001'; });
  h=h.replace(/\s+(?=[ㄱ-ㅎ]\.\s)/g,'\n');                                   // ㄱ. ㄴ. ㄷ.
  if(/(^|[.?:。\n]\s*)\(가\)\s/.test(h))                                        // (가)가 문장 머리에서 시작하는 '조건 나열'일 때만
    h=h.replace(/\s+(?=\((?:가|나|다|라|마)\)\s)/g,'\n');
  h=h.replace(/\u0000(\d+)\u0001/g,(_,i)=>M[+i]);
  return h.replace(/\n+/g,'<br>');
}

/* ── 상태 계산 ──
 * 인정 성공 = 정답+확실 이면서 '그날 그 문항의 첫 시도'(해설 보고 같은 문항을 다시 맞힌 건 안 센다).
 * 성공일 = 그날 서로 다른 인정 성공 문항 수 ≥ NEED.  (schema_v36 뷰와 같은 규칙) */
function succDays(rows,from){
  const need=BANK.need[rows.length?rows[0][0][0]:'T']||1;
  const first=new Set(), per={};
  rows.forEach((r,i)=>{ const d=r[5].slice(0,10), id=d+'|'+r[1]; const isFirst=!first.has(id); first.add(id);
    if(i>=from && isFirst && r[2] && r[3]==='확실') (per[d]=per[d]||new Set()).add(r[1]); });
  return Object.keys(per).filter(d=>per[d].size>=need).sort();
}
function keyState(k){
  const rows=LOG.filter(r=>r[0]===k);
  if(!rows.length) return {st:'new',n:0};
  let lastFail=-1; rows.forEach((r,i)=>{ if(!(r[2]&&r[3]==='확실')) lastFail=i; });
  const days=succDays(rows,lastFail+1);
  const last=rows[rows.length-1][5];
  if(days.length>=2 && dnum(days[days.length-1])-dnum(days[0])>=BANK.gap) return {st:'grad',n:rows.length,days,last};
  if(days.length>=1) return {st:'one',n:rows.length,days,last};
  return {st:lastFail>=0?'fail':'try',n:rows.length,last,failAt:lastFail>=0?rows[lastFail][5]:null};
}
function openDate(ck){ return UNL[ck] || ((SET.schedule[BAN]||{})[ck]) || null; }
function cOpen(ck){ const d=openDate(ck); return !!d && (d<TODAY || (d===TODAY && afterClass())); }   // (1018) 오늘 수업하는 개념은 수업이 끝난 뒤에 연다
function cPassed(ck){ const s=keyState(ck).st; return s==='one'||s==='grad'; }
function everPassed(ck){   // 한 번이라도 '1회'였던 개념(그때의 마지막 실패 뒤로만 센다)
  const rows=LOG.filter(r=>r[0]===ck);
  for(let j=1;j<=rows.length;j++){ const sub=rows.slice(0,j); let lf=-1; sub.forEach((r,i)=>{ if(!(r[2]&&r[3]==='확실')) lf=i; });
    if(succDays(sub,lf+1).length) return true; }
  return false;
}
function tOpen(tk){ return cOpen(TKEY2C[tk]) && everPassed(TKEY2C[tk]); }   // 열린 유형은 개념을 다시 틀려도 닫지 않는다
function isDue(k){
  const s=keyState(k);
  if(s.st==='grad') return false;
  if(s.st==='one') return dnum(TODAY)-dnum(s.days[s.days.length-1])>=BANK.gap;
  if(s.st==='try'||s.st==='fail'){ // 오늘 이미 성공일을 채웠으면 오늘은 끝
    return true; }
  return true; // new
}
const PRI={fail:0,try:1,one:2,new:3};

/* (1021) 오늘 그 모드로 푼 기록을 빼고 계산 — 리뷰·루프 세트를 '오늘 처음 열었을 때'와 똑같이 다시 만든다 */
function withoutToday(mode, fn){ const sv=LOG; LOG=LOG.filter(r=>!(r[5].slice(0,10)===TODAY && r[4]===mode)); try{ return fn(); } finally{ LOG=sv; } }
const todayIds=mode=>new Set(LOG.filter(r=>r[5].slice(0,10)===TODAY && r[4]===mode).map(r=>r[1]));
// (1021) 루프 칸 나누기 — 늘 틀리는 칸에 밀려 새로 열린 칸이 몇 주씩 안 나오던 것(하위권 시뮬: 열린 유형 5~7개가 기말까지 0회)
//   상위 n 칸에 '처음 보는 칸'이 하나도 없으면 마지막 자리를 가장 앞 번호의 새 칸에 준다
function reserveNew(list,n){ const top=list.slice(0,n); if(top.length<n || top.some(k=>keyState(k).st==='new')) return top;
  const nw=list.find(k=>keyState(k).st==='new'); if(nw) top[n-1]=nw; return top; }

/* 문항 고르기 — 안 본 것 먼저, 오래전에 본 것, 같은 벌 연속 피하기. seed 가 있으면 반 공통 순서 */
function hash(s){ let h=2166136261; for(const c of s){ h^=c.charCodeAt(0); h=Math.imul(h,16777619);} return h>>>0; }
function tier(x){ return x.fix?(x.lvl||2):0; }   // CORE 자체 = 0, 외부 = 난이도 1~3
function pickItems(k,n,exclude,seed){
  const today=new Set(LOG.filter(r=>r[0]===k && r[5].slice(0,10)===TODAY).map(r=>r[1]));
  let its=(BYKEY[k]||[]).filter(x=>!exclude.has(x.id));
  if(its.some(x=>!today.has(x.id))) its=its.filter(x=>!today.has(x.id));   // 오늘 푼 문항은 다시 안 낸다(남는 게 없을 때만 허용)
  if(seed) return its.sort((a,b)=>hash(seed+a.id)-hash(seed+b.id)).slice(0,n);
  const seen={}; LOG.forEach(r=>{ if(r[0]===k) seen[r[1]]=r[5]; });
  const lastB=(()=>{ for(let i=LOG.length-1;i>=0;i--) if(LOG[i][0]===k){ const it=ITEMS[LOG[i][1]]; return it?it.벌:null; } return null; })();
  return its.map(x=>({x,s:seen[x.id]||'', r:hash(TODAY+x.id)}))
    // (1020 반복 피로 규칙) ① 안 본 문항 먼저 ② 본 것 중엔 가장 오래전 것 ③ 안 본 것 안에서는 CORE 자체 3벌 → 외부 문제집 하→중→중상
    //   ④ 직전과 같은 벌·같은 책은 피한다 ⑤ 오늘 푼 문항은 다시 안 낸다(위)
    .sort((a,b)=> (a.s===''?0:1)-(b.s===''?0:1) || a.s.localeCompare(b.s) || (a.s===''?(tier(a.x)-tier(b.x)):0) || ((a.x.벌===lastB)-(b.x.벌===lastB)) || a.r-b.r)
    .slice(0,n).map(o=>o.x);
}

/* ── 세션 구성 ── */
function lastClassConcepts(){
  const ds={}; CONCEPTS.forEach(c=>{ const d=openDate(c.key); if(d && d<TODAY) (ds[d]=ds[d]||[]).push(c.key); });
  const ks=Object.keys(ds).sort(); return ks.length?ds[ks[ks.length-1]]:[];
}
function dueTypes(exclude){
  const out=[];
  CONCEPTS.forEach(c=>c.themes.forEach(t=>{ if(tOpen(t.key) && isDue(t.key) && !exclude.has(t.key)) out.push(t.key); }));
  return out.sort((a,b)=>PRI[keyState(a).st]-PRI[keyState(b).st] || a.localeCompare(b));
}
function dueConcepts(){
  return CONCEPTS.filter(c=>cOpen(c.key) && isDue(c.key)).map(c=>c.key)
    .sort((a,b)=>PRI[keyState(a).st]-PRI[keyState(b).st] || a.localeCompare(b));
}
function buildReviewConcept(){ return withoutToday('리뷰', buildReviewConcept0); }   // (1021) 그만하기 뒤 다시 열어도 같은 세트
function buildReviewConcept0(){
  const lc=lastClassConcepts(); const used=new Set(LOG.filter(r=>r[5].slice(0,10)===TODAY).map(r=>r[1])), out=[];
  if(!lc.length) return out;
  // 반 공통: 날짜 seed. 개념이 둘이면 하나씩
  const N=reviewCN();
  for(let i=0;out.length<N && i<N*2;i++){
    const k=lc[i%lc.length]; const p=pickItems(k,1,used,'R'+TODAY+BAN.slice(0,2)); if(p[0]){ used.add(p[0].id); out.push(p[0]); }
  }
  return out;
}
// (1019 A안) 유형 3칸 = 지난 수업 개념의 열린 유형을 개념마다 번갈아. 모자라면 다른 열린 유형(다시 볼 때 된 것).
// 개념 문항으로 채우지 않는다 — 개념을 놓친 학생은 리뷰가 개념 4로 끝나고 그 개념은 저녁 루프로 간다.
function reviewTypeKeys(N=REVIEW_T){
  const rank=k=>{ const st=keyState(k).st; return (isDue(k)?0:10)+(PRI[st]!=null?PRI[st]:5); };
  const groups=lastClassConcepts().map(ck=>(CBYKEY[ck]?CBYKEY[ck].themes:[]).map(t=>t.key).filter(tOpen).sort((a,b)=>rank(a)-rank(b)||a.localeCompare(b)));
  const out=[];
  for(let i=0;out.length<N && groups.some(g=>g.length);i++){ const g=groups[i%groups.length]; if(g.length) out.push(g.shift()); }
  if(out.length<N) for(const k of dueTypes(new Set(out))){ if(out.length>=N) break; out.push(k); }
  return out;
}
function buildReviewType(usedIds){
  // (1021) 오늘 리뷰에서 이미 푼 유형은 빼고 남은 칸만 — 그만하기 뒤 다시 열어도 유형은 합쳐 3문항
  const doneK=new Set(LOG.filter(r=>r[5].slice(0,10)===TODAY && r[4]==='리뷰' && r[0][0]==='T').map(r=>r[0]));
  const left=REVIEW_T-doneK.size, out=[];
  for(const k of reviewTypeKeys(REVIEW_T+doneK.size).filter(k=>!doneK.has(k))){ if(out.length>=left) break; const p=pickItems(k,1,usedIds); if(p[0]){ usedIds.add(p[0].id); out.push(p[0]); } }
  return out;
}
function buildLoop(){
  const out=[], used=new Set();
  reserveNew(dueConcepts(),LOOP_C_KEYS).forEach(k=>pickItems(k,LOOP_C_ITEMS,used).forEach(x=>{ used.add(x.id); out.push(x); }));
  reserveNew(dueTypes(new Set()),LOOP_T).forEach(k=>pickItems(k,1,used).forEach(x=>{ used.add(x.id); out.push(x); }));
  return out;
}
// (1022 유강 "루프는 수업하고 나서 다음 수업 전까지 한 번") 루프 과제는 **수업당 1회** — 회차(직전 수업 끝 ~ 다음 수업 시작)에
//   처음 연 세트를 고정하고, 다 풀면 다음 수업이 끝날 때까지 닫는다. 틀린 것은 다음 회차 루프로 돌아온다.
//   (1020 '하루 1회'를 대신한다. 서버 회차를 못 받으면 옛 규칙(하루)으로 돈다.)
//   세트는 이 기기 localStorage(lset_회차)에 둔다. 다른 기기·저장소가 비었는데 이번 회차 루프 기록이 있으면 남은 것만.
const inRound=r=>r[4]==='루프' && (ROUND ? r[5]>ROUND : r[5].slice(0,10)===TODAY);
const roundKey=()=>'lset2_'+(ROUND||TODAY);   // (1022) lset2 — '전부 모으기' 전에 고정된 잘린 세트(lset_)는 버린다
function withoutRound(fn){ const sv=LOG; LOG=LOG.filter(r=>!inRound(r)); try{ return fn(); } finally{ LOG=sv; } }
function loopToday(){
  const k=roundKey(), ids=lget(k,null);
  const done=new Set(LOG.filter(inRound).map(r=>r[1]));
  if(ids){
    const rest=ids.filter(id=>!done.has(id)).map(id=>ITEMS[id]).filter(Boolean);
    return {items:rest, started:done.size>0, finished:!rest.length};
  }
  if(done.size){   // (1021) 다른 기기·브라우저(카톡 인앱↔크롬): 오늘 처음 세트를 다시 만들어 남은 것만 낸다(전엔 '오늘 완료'로 잘렸다)
    const again=withoutRound(buildLoop); lset(k, again.map(x=>x.id));
    const rest=again.filter(x=>!done.has(x.id)); return {items:rest, started:true, finished:!rest.length};
  }
  const fresh=buildLoop();
  if(fresh.length) lset(k, fresh.map(x=>x.id));
  return {items:fresh, started:false, finished:false};
}
function loopAdd(id){ const k=roundKey(), ids=lget(k,[]); if(!ids.includes(id)){ ids.push(id); lset(k,ids); } }
function todayRows(mode){ return LOG.filter(r=>r[5].slice(0,10)===TODAY && r[4]===mode).length; }

/* ── 홈: 버튼 + 단원 지도 ── */
const ST_LABEL={lock:'잠김',new:'열림',try:'하는 중',fail:'다시',one:'1회',grad:'졸업'};
function cellState(k){
  if(k[0]==='C'){ if(!cOpen(k)) return 'lock'; }
  else if(!tOpen(k)) return 'lock';
  const s=keyState(k).st; return s==='try'?'new':s;
}
function drawHome(){
  document.body.classList.remove('sess');
  let tot=0, grad=0, open=0;
  CONCEPTS.forEach(c=>[c.key,...c.themes.map(t=>t.key)].forEach(k=>{ tot++; const s=cellState(k); if(s==='grad') grad++; if(s!=='lock') open++; }));
  const lc=lastClassConcepts(); const LT=(CLASS!==null && inClass())?{items:buildLoop(),started:false,finished:false}:loopToday(); const loop=LT.items;
  const rDone=reviewDone(), lDone=LT.finished, rOpen=inClass(), lLock=CLASS!==null && inClass();
  const H=[];

    +`<div class="sum"><div><b>${grad}<small style="font-size:12px;color:var(--dim)">/${tot}</small></b><span>졸업</span></div>`
    +`<div><b>${open}</b><span>열림</span></div>`
    +`<div><b>${loop.length}</b><span>이번에 돌아온 문항</span></div></div>`);
  H.push(`<button class="go${rDone?' done':lc.length&&rOpen?'':' s'}" id="goR"><b>리뷰테스트 ${rDone?'· 오늘 완료':''}</b>`
    +`<span>${!lc.length?'아직 지난 수업이 없어요 — 첫 수업 다음부터 열려요':!rOpen?classText():`지난 수업 개념 ${reviewCN()} → 유형 ${REVIEW_T} · 연습지에 풀고 답만 넣어요`}</span></button>`);
  const once=ROUND?'수업마다 한 번':'하루 한 번', nextT=ROUND?'다음 수업 뒤':'내일', nx=nextClassText();
  H.push(`<button class="go s${lDone?' done':''}" id="goL"><b>루프 과제 ${lLock?'· 수업 끝나고 열려요':lDone?(ROUND?'· 이번 루프 완료':'· 오늘 완료'):loop.length?`· ${LT.started?'이어서 ':''}${loop.length}문항`:''}</b>`
    +`<span>${lLock?'수업 중에는 [리뷰테스트]만 풀어요':lDone?`루프는 ${once}이에요. 틀리거나 애매했던 건 ${nextT} 루프에 다시 와요${nx}`:loop.length?`약 ${Math.max(3,Math.round(loop.filter(x=>x.key[0]==='C').length*0.7+loop.filter(x=>x.key[0]==='T').length*3.5))}분 · 다시 볼 개념·유형을 전부 모았어요 · ${once}${ROUND?' · 다음 수업 전까지':''}`:`다시 볼 개념·유형이 없어요. ${nextT}에 다시 와요`}</span></button>`);
  H.push(`<div class="guide">개념을 <b>확실하게</b> 맞히면 그 개념의 유형이 열려요. 같은 개념·유형을 <b>3일 이상 떨어진 두 날</b> 확실하게 맞히면 졸업이에요.<br>`
    +`틀리거나 <b>애매</b>했던 개념·유형은 다시 돌아와요. 애매할 땐 애매하다고 눌러야 정확해져요.</div>`);
  H.push(`<div class="legend">${['lock','new','fail','one','grad'].map(s=>`<span class="chip ${s}">${ST_LABEL[s]}</span>`).join('')}</div>`);

    U.concepts.forEach(c=>{
      const cs=cellState(c.key); const od=openDate(c.key);
      H.push(`<div class="cp"><div class="ch1"><span class="chip ${cs}">개념 ${E(c.no)}</span>`
        +`<span class="nm">${E(c.title)}${cs==='lock'&&od?`<small>${+od.slice(5,7)}/${+od.slice(8)} 수업 뒤 열림</small>`:''}</span></div>`
        +`<div class="chips">${c.themes.map(t=>`<span class="chip ${cellState(t.key)}">${E(t.no)} ${E(t.name)}</span>`).join('')}</div></div>`);

  $('app').innerHTML=H.join('');

/* ── 풀이 세션 ── */
let S=null;   // {mode, q:[item], i, res:[], phase, used:Set}
function startSession(mode, preset){
  if(mode==='리뷰'){
    const all=buildReviewConcept(), done=todayIds('리뷰'), c=all.filter(x=>!done.has(x.id));   // (1021) 이어서 — 같은 세트의 남은 문항만
    S={mode,q:c,i:0,res:[],used:new Set([...all.map(x=>x.id),...done]),typeBuilt:false,back:0};
    if(!c.length){ S.typeBuilt=true; S.q=buildReviewType(S.used); }
  } else S={mode,q:preset,i:0,res:[],used:new Set(preset.map(x=>x.id)),typeBuilt:true,back:0};
  if(!S.q.length){ drawHome(); return; }
  drawItem();
}
function cOf(item){ return item.key[0]==='C'?CBYKEY[item.key]:CBYKEY[TKEY2C[item.key]]; }
function kindLabel(x){
  const c=cOf(x);
  if(x.key[0]==='C') return ['개념 '+c.no, c.title];
  const th=c.themes.find(t=>t.key===x.key); return ['유형 '+(th?th.no:''), th?th.name:''];
}
function cardHTML(c){

}
function themeOf(x){ const c=cOf(x); return x.key[0]==='T'?(c.themes.find(t=>t.key===x.key)||null):null; }
// (1020 유강 '개념카드는 교재를 잘 활용') 유형 = 수업교재 CORE TRAINING 의 시선 + 예제(풀이 단계)

function drawItem(){

    +`<div class="qwrap"><div class="qmain">`

    +(x.key[0]==='T'?`<div class="sheet">✎ 연습지 ${S.q.slice(0,S.i+1).filter(z=>z.key[0]==='T').length}번에 풀고 답만 넣어요</div>`:'')+`</div>`
    +A
    +`<div class="conf" id="conf"><p>이 답, 얼마나 확실해요?</p><div class="row2"><button class="sure" data-c="확실">확실해요</button><button class="unsure" data-c="애매">애매해요</button></div></div>`
    +`<button class="next" id="nx">${S.i+1<n||(!S.typeBuilt)?'다음':'끝'}</button>`
    +`</div><div class="qside"><div class="res" id="res"></div><div id="cbx"></div><div id="bbx"></div></div></div>`;
  S.note=null; S.pick=null; S.t0=Date.now();
  tex($('app'));
  $('bk').onclick=()=>finish(true);
  const showConf=()=>{ $('conf').classList.add('show'); $('conf').scrollIntoView({block:'nearest',behavior:'smooth'}); };
  if(x.k==='num'){
    const inp=$('numIn');
    $('ans').querySelectorAll('.k').forEach(b=>b.onclick=()=>{ inp.value+=b.dataset.k==='-'?'-':'/'; inp.focus(); });
    const go=()=>{ const v=inp.value.trim(); if(!v) return; S.pick=v; inp.disabled=true; $('ans').querySelectorAll('button').forEach(b=>b.disabled=true); showConf(); };
    $('numOk').onclick=go; inp.onkeydown=e=>{ if(e.key==='Enter') go(); };
  } else {
    $('ans').querySelectorAll('button').forEach(b=>b.onclick=()=>{
      if($('conf').dataset.lock) return;
      $('ans').querySelectorAll('button').forEach(z=>z.classList.remove('on')); b.classList.add('on'); S.pick=b.dataset.a; showConf(); });
  }
  $('conf').querySelectorAll('button').forEach(b=>b.onclick=()=>grade(b.dataset.c));
  $('nx').onclick=next;
  window.scrollTo(0,0);
}
function frac(s){
  s=String(s).replace(/\s/g,'').replace(/[−–]/g,'-');
  const m=s.match(/^(-?)(\d+)(?:\/(\d+))?$/); if(!m) return null;
  return [ (m[1]?-1:1)*+m[2], m[3]?+m[3]:1 ];
}
function same(a,b){ const p=frac(a), q=frac(b); return !!p&&!!q&&q[1]!==0&&p[1]!==0&&p[0]*q[1]===q[0]*p[1]; }
function grade(conf){
  const x=S.q[S.i]; if($('conf').dataset.lock) return; $('conf').dataset.lock='1';
  const ok = x.k==='num' ? same(S.pick,x.a) : S.pick===x.a;
  const ms=Date.now()-S.t0;
  if(x.k==='num'){ $('ans').classList.add(ok?'right':'wrong'); }
  else $('ans').querySelectorAll('button').forEach(b=>{ b.disabled=true; if(b.dataset.a===x.a) b.classList.add('right'); else if(b.dataset.a===S.pick) b.classList.add('wrong'); });
  $('conf').querySelectorAll('button').forEach(b=>b.disabled=true);
  $('conf').style.display='none';
  const succ=ok&&conf==='확실';
  const r=$('res'); r.className='res show '+(succ?'o':ok?'u':'x');
  r.innerHTML=`<div class="h">${succ?'맞았어요':ok?'맞았지만 애매 — 다시 돌아와요':'틀렸어요'}</div>`
    +(ok?'':`<div class="w" style="margin-bottom:6px">정답: <b>${x.k==='ox'?x.a:T(x.a)}</b>${x.k==='num'?` · 내 답 ${E(S.pick)}`:''}</div>`)
    +`<div class="w">${T(x.w)}</div>`
    +`<div class="btn2"><button class="cardbtn" id="cb">개념 정리 보기</button>${themeOf(x)&&themeOf(x).book?'<button class="cardbtn bk" id="bb">교재 예제 보기</button>':''}</div>`;
  const c=cOf(x), th=themeOf(x);
  $('cb').onclick=()=>{ $('cbx').innerHTML=$('cbx').innerHTML?'':cardHTML(c); tex($('cbx')); };
  if($('bb')) $('bb').onclick=()=>{ $('bbx').innerHTML=$('bbx').innerHTML?'':bookHTML(th); tex($('bbx')); };
  // 틀리거나 애매하면 교재를 바로 펼쳐 둔다 — 개념은 개념 정리, 유형은 교재 예제(시선·풀이)
  if(!succ){ if(x.key[0]==='C'){ $('cbx').innerHTML=cardHTML(c); tex($('cbx')); } else if(th&&th.book){ $('bbx').innerHTML=bookHTML(th); tex($('bbx')); } }
  tex(r);
  // (1021) 자정을 넘겨 풀어도 연 날의 기록으로(23:55 시작 → 00:05 끝이 다음 날 루프를 '오늘 완료'로 지우던 것)
  const tNow=nowKST(), tRow=tNow.slice(0,10)>TODAY?TODAY+'T23:59:59':tNow;
  const row={k:x.key,i:x.id,m:S.mode,a:String(S.pick).slice(0,40),o:ok,c:conf,ms:Math.min(ms,9999999),t:tRow};
  S.res.push({x,ok:succ,raw:ok,conf});
  LOG.push([x.key,x.id,ok,conf,S.mode,tRow]);
  queue([row]);
  // 유형을 놓치면 그 개념으로 되돌림 — 개념 문항 하나 덧붙임(루프만, 최대 BACK_C)
  if(!succ && x.key[0]==='T' && S.mode==='루프' && S.back<BACK_C){
    const ck=TKEY2C[x.key]; const p=pickItems(ck,1,S.used);
    if(p[0]){ S.used.add(p[0].id); S.q.push(p[0]); S.back++; loopAdd(p[0].id); }
  }
  // 리뷰: 개념 파트를 끝내면 그 자리에서 유형을 고른다(방금 열린 유형 포함)
  if(S.mode==='리뷰' && !S.typeBuilt && S.i===S.q.length-1){
    S.typeBuilt=true; const before=new Set(CONCEPTS.flatMap(c=>c.themes.map(t=>t.key)).filter(tOpen));
    const ty=buildReviewType(S.used); ty.forEach(t=>S.used.add(t.id)); S.q.push(...ty);
    const now=CONCEPTS.flatMap(c=>c.themes.map(t=>t.key)).filter(tOpen).filter(k=>!before.has(k));
    if(now.length) S.nextNote=`유형 ${now.length}개가 열렸어요 — 바로 이어서 풀어요`;
  }
  $('nx').textContent=S.i+1<S.q.length?'다음':'끝'; $('nx').classList.add('show');
  $('nx').scrollIntoView({block:'nearest',behavior:'smooth'});
}
function next(){ S.i++; if(S.nextNote){ S.note=S.nextNote; S.nextNote=null; } if(S.i<S.q.length) drawItem(); else finish(false); }

async function finish(early){
  document.body.classList.remove('sess');
  const res=S.res; if(!res.length){ drawHome(); return; }
  const okN=res.filter(r=>r.ok).length;
  const L=res.map(r=>{ const [kl,kn]=kindLabel(r.x); const cls=r.ok?'lo':r.raw?'lu':'lx';
    return `<div class="${cls}"><em>${r.ok?'확실':r.raw?'애매':'다시'}</em>${E(kl)} · ${E(kn)}</div>`; }).join('');
  $('app').innerHTML=`<div class="done"><b>${early?'여기까지':'끝'} — 확실히 맞힌 것 ${okN}/${res.length}</b>`
    +`<p>${okN===res.length?'전부 확실해요. 이 개념·유형들은 며칠 뒤 한 번 더 보면 졸업이에요.':'틀리거나 애매했던 건 다음 루프에 다시 와요.'}</p>`
    +`<div class="save" id="sv">기록 보내는 중…</div></div><div class="list">${L}</div>`
    +`<div class="btns"><button class="p" id="home">단원 지도 보기</button></div>`;
  if(S.mode==='리뷰' && !early) lset('rdone_'+TODAY,true);
  $('home').onclick=drawHome; S=null;
  const ok=await flush();
  const drop=lget('dropped',0); if(drop) lset('dropped',0);
  const sv=$('sv'); if(sv){ sv.textContent=ok?(drop?`기록 저장됨 · ${drop}문항은 수업 시간 밖이라 저장되지 않았어요`:'기록 저장됨'):'인터넷이 불안정해서 이 기기에 보관했어요. 다음에 열면 자동으로 보내요'; if(!ok) sv.classList.add('bad'); }
}

/* ── 보내기(대기열) ── */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,10);
function queue(rows){ const q=lget('queue',[]).concat(rows.map(r=>({...r,u:r.u||uid(),t:r.t||nowKST()}))); lset('queue',q); flush(); }
let flushing=false;
async function flush(){
  if(DEMO){ lset('demo_log',LOG); lset('queue',[]); return true; }
  if(!sb) return !lget('queue',[]).length;
  if(flushing){ for(let w=0;w<60&&flushing;w++) await new Promise(r=>setTimeout(r,250)); if(!lget('queue',[]).length) return true; if(flushing) return false; }
  flushing=true;
  try{
    // 보낸 행은 uid 로 지운다 — 보내는 동안 새로 쌓인 행을 덮어쓰지 않게(감리 M1). 재전송은 서버 uid 유일키가 막는다(M2)
    for(let guard=0; guard<50; guard++){
      const q=lget('queue',[]); if(!q.length) return true;
      const chunk=q.slice(0,30);
      const {data,error}=await sb.rpc('mastery_submit',{tok:TOK,skey:SKEY,recs:chunk});
      if(error||!data) return false;
      if(data.버림) lset('dropped', lget('dropped',0)+data.버림);   // (1021 v42) 수업 시간 밖 리뷰 등 서버가 안 받은 행
      const sent=new Set(chunk.map(r=>r.u));
      lset('queue',lget('queue',[]).filter(r=>!sent.has(r.u)));
    }
    return !lget('queue',[]).length;
  }catch(e){ return false; } finally{ flushing=false; }
}

/* ── 시작 ── */
function setup(){
  SET=BANK.sets[SKEY];
  CONCEPTS=SET.units.flatMap(u=>u.concepts); CBYKEY={}; TKEY2C={};
  CONCEPTS.forEach(c=>{ CBYKEY[c.key]=c; c.themes.forEach(t=>TKEY2C[t.key]=c.key); });
}
function pickSet(ban){
  const g=(ban||'').slice(0,2);
  return Object.keys(BANK.sets).find(k=>BANK.sets[k].학년===g)||null;
}
async function boot(){
  const P=new URLSearchParams(location.search);
  TOK=(P.get('t')||'').trim(); DEMO=P.get('demo')==='1';
  if(DEMO){
    NAME='미리보기'; BAN=P.get('ban')||'고1A'; SKEY=pickSet(BAN); if(!SKEY) SKEY='core_m2';
    TODAY=(P.get('today')||nowKST()).slice(0,10); setup();
    ROUND=P.get('round')||''; NEXTC=P.get('next')||'';   // 미리보기: &round=2026-10-21T22:00:00&next=2026-10-23T20:00:00
    if(P.get('class')) CLASS=P.get('class').split(',').map(x=>x.split('-'));   // 미리보기: &class=15:00-17:00
    LOG=lget('demo_log',[]);
  } else {
    if(TOK.length<16){ $('msg').innerHTML='<b>링크가 올바르지 않아요</b>포털에서 다시 들어와 주세요.'; return; }
    if(!sb){ $('msg').innerHTML='<b>연결이 안 돼요</b>잠시 뒤 다시 열어 주세요.'; return; }
    // 학년을 모르니 두 세트를 차례로 연다 — 반이 정해지면 맞는 세트로
    let d=null;
    try{ const r=await sb.rpc('mastery_open',{tok:TOK,skey:'core_m2'}); d=r.data; }catch(e){}
    if(!d){ $('msg').innerHTML='<b>열 수 없는 링크예요</b>쌤에게 새 링크를 받아 주세요.'; return; }
    NAME=d.이름; BAN=d.반; TODAY=d.오늘; SKEY=pickSet(BAN);
    CLASS=Array.isArray(d.수업)?d.수업:[];    // 서버가 시간표를 안 주면(v40 전) 리뷰는 닫힌다
    if(d.지금){ const t=Date.parse(d.지금+'+09:00'); if(!isNaN(t)) SKEW=t-Date.now(); }
    if(!SKEY){ $('msg').innerHTML='<b>아직 이 반은 CORE 루프가 없어요</b>'; return; }
    try{ const r=await sb.rpc('mastery_round',{tok:TOK}); if(r&&r.data&&r.data.회차){ ROUND=r.data.회차; NEXTC=r.data.다음||''; } }catch(e){}   // (1022) 루프 회차 — 못 받으면 옛 규칙(하루)
    if(SKEY!=='core_m2'){ try{ const r=await sb.rpc('mastery_open',{tok:TOK,skey:SKEY}); d=r.data||d; }catch(e){} }
    setup();
    LOG=(d.기록||[]).map(r=>[r[0],r[1],r[2],r[3],r[4],r[5]]); UNL=d.열림||{};
    // 아직 못 보낸 기록도 상태에 반영
    lget('queue',[]).forEach(r=>LOG.push([r.k,r.i,r.o,r.c,r.m,r.t||nowKST()]));
    LOG.sort((a,b)=>a[5].localeCompare(b[5]));
    flush();
  }
  $('msg').style.display='none'; $('app').style.display='block';
  waitKatex(drawHome);
}
boot();
// (1018) 홈을 열어 둔 채 수업 시간이 되면/끝나면 [수업 리뷰]를 다시 그린다
setInterval(()=>{ if(!S && SET && $('app').style.display==='block' && HOME_OPEN!==null && inClass()!==HOME_OPEN) drawHome(); }, 20000);
// 자정을 넘겨 열어 둔 페이지는 다시 연다(감리 R8) — 풀이 중이면 건드리지 않는다
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && !DEMO && !S && TODAY && nowKST().slice(0,10)!==TODAY) location.reload(); });
