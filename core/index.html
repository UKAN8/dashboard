const BANK={"sets": {"core_m2": {"제목": "CORE 루프 · 공통수학2", "범위": "07 명제 ~ 10 무리함수 (기말)", "학년": "고1", "set": "core_m2", "units": [{"code": "07", "name": "07 명제", "concepts": [{"key": "C07-01", "no": "01", "title": "명제와 조건", "themes": [{"key": "T07-01", "no": "01", "name": "명제와 조건의 부정", "book": {"sight": "부정은 진리집합의 <b>여집합<\/b>이다. ‘또는’과 ‘그리고’를 서로 바꾸고, 부등호는 <b>등호까지 반대쪽으로<\/b> 옮긴다. ‘$=$’의 부정은 ‘$\\ne $’이다.", "ex": {"body": "실수 $x$에 대한 조건 ‘$x&lt;-2$ 또는 $x\\ge 4$’의 부정을 말하고, 전체집합이 $U=\\{x\\mid |x|\\le 5,\\ x\\text{는 정수}\\}$일 때 그 진리집합의 원소의 개수를 구하시오.", "sol": ["‘또는’을 ‘그리고’로 바꾸고 각 부등식을 부정하면 ‘$x\\ge -2$ 그리고 $x&lt;4$’", "곧 부정은 $-2\\le x&lt;4$이다.", "$U=\\{-5,\\,-4,\\,\\cdots,\\,5\\}$에서 진리집합은 $\\{-2,\\,-1,\\,0,\\,1,\\,2,\\,3\\}$"], "ans": "$-2\\le x&lt;4$, 원소 $6$개"}}}, {"key": "T07-02", "no": "02", "name": "진리집합과 명제의 참·거짓", "book": {"sight": "$p\\to q$의 참·거짓은 <b>$P\\subset Q$인지<\/b>로 판정한다. 조건을 진리집합(수직선·벤 다이어그램)으로 옮기고, 거짓이면 $P-Q$의 원소 하나를 반례로 든다. 집합의 연산식이 주어지면 먼저 정리해 포함 관계 하나로 만든다.", "ex": {"body": "실수 $x$에 대한 두 조건 $p:|x-1|&lt;2$, $q:x^{2}-2x-8&lt;0$에 대하여 두 명제 $p\\to q$, $q\\to p$의 참, 거짓을 판별하시오.", "sol": ["$|x-1|&lt;2$에서 $-1&lt;x&lt;3$이므로 $P=\\{x\\mid -1&lt;x&lt;3\\}$", "$(x+2)(x-4)&lt;0$에서 $Q=\\{x\\mid -2&lt;x&lt;4\\}$", "$P\\subset Q$이므로 $p\\to q$는 참이다.", "$Q\\not\\subset P$이므로 $q\\to p$는 거짓이다. 반례는 $x=3.5$와 같이 $Q-P$의 원소이다."], "ans": "$p\\to q$는 참, $q\\to p$는 거짓"}}}, {"key": "T07-03", "no": "03", "name": "거짓인 명제의 반례", "book": {"sight": "반례는 <b>가정은 만족시키고 결론은 만족시키지 않는<\/b> 원소, 곧 $P\\cap Q^{C}$의 원소이다. 명제의 가정과 결론에 $\\sim$가 붙어 있으면 그대로 여집합을 취해 같은 꼴로 옮긴다.", "ex": {"body": "전체집합 $U=\\{x\\mid x\\text{는 }12\\text{ 이하의 자연수}\\}$에서 명제 ‘$x$가 $6$의 약수이면 $x$는 짝수이다.’가 거짓임을 보이는 반례를 모두 구하시오.", "sol": ["가정의 진리집합 $P=\\{1,\\,2,\\,3,\\,6\\}$, 결론의 진리집합 $Q=\\{2,\\,4,\\,6,\\,8,\\,10,\\,12\\}$", "반례는 $P$에는 속하고 $Q$에는 속하지 않는 원소이므로 $P-Q=\\{1,\\,3\\}$"], "ans": "$1$, $3$"}}}], "card": [["핵심", "참·거짓이 정해지면 명제, 변수의 값에 따라 달라지면 조건이다. 조건은 진리집합으로 옮겨 집합의 언어로 다룬다."], ["뜻", "참인지 거짓인지를 분명하게 판별할 수 있는 문장이나 식을 <b>명제<\/b>, 변수의 값에 따라 참, 거짓이 달라지는 문장이나 식을 <b>조건<\/b>이라 한다. 전체집합 $U$의 원소 중에서 조건 $p$를 참이 되게 하는 모든 원소의 집합을 조건 $p$의 <b>진리집합<\/b>  $P=\\{x\\mid x\\in U,\\ p(x)\\text{는 참}\\}$ 이라 한다. 또 ‘$p$가 아니다’를 $p$의 <b>부정<\/b>이라 하고 $\\sim p$로 나타낸다. 명제 ‘$p$이면 $q$이다’는 $p\\to q$로 나타내고, $p$를 <b>가정<\/b>, $q$를 <b>결론<\/b>이라 한다."], ["정리", "전체집합 $U$에서 두 조건 $p$, $q$의 진리집합을 각각 $P$, $Q$라 할 때<br>(1) $\\sim p$의 진리집합은 $P^{C}$이고, $\\sim(\\sim p)=p$이다.<br>(2) ‘$p$ 또는 $q$’의 진리집합은 $P\\cup Q$, ‘$p$ 그리고 $q$’의 진리집합은 $P\\cap Q$이다. 부정하면 ‘또는’과 ‘그리고’가 서로 바뀐다.<br>(3) 명제 $p\\to q$는 $P\\subset Q$이면 참, $P\\not\\subset Q$이면 거짓이다."], ["주의", "부등식을 부정하면 등호가 반대쪽으로 옮겨 간다. $x&lt;a$의 부정은 $x\\ge a$이다. $x&gt;a$가 아니다."], ["주의", "진리집합은 전체집합에 따라 달라진다. 조건 $x^{2}&lt;4$의 진리집합은 전체집합이 자연수 전체이면 $\\{1\\}$, 실수 전체이면 $\\{x\\mid -2&lt;x&lt;2\\}$이다."], ["주의", "반례는 가정 $p$를 만족시키면서 결론 $q$를 만족시키지 않는 원소이다. $q$만 만족시키지 않는 원소는 반례가 아니다."]]}, {"key": "C07-02", "no": "02", "title": "명제의 참·거짓과 역·대우", "themes": [{"key": "T07-04", "no": "04", "name": "참이 되도록 하는 미지수", "book": {"sight": "명제가 참 ⇔ $P\\subset Q$. 두 진리집합을 <b>한 수직선<\/b>에 그리고 끝점끼리 비교해 부등식을 세운다. <b>끝점이 같을 때<\/b>는 등호를 넣어도 되는지 따로 확인한다.", "ex": {"body": "명제 ‘$1\\le x\\le 3$이면 $a-2&lt;x&lt;2a+1$이다.’가 참이 되도록 하는 실수 $a$의 값의 범위를 구하시오.", "sol": ["$P=\\{x\\mid 1\\le x\\le 3\\}$, $Q=\\{x\\mid a-2&lt;x&lt;2a+1\\}$이고 $P\\subset Q$이어야 한다.", "$1\\in Q$이어야 하므로 $a-2&lt;1$, 곧 $a&lt;3$", "$3\\in Q$이어야 하므로 $2a+1&gt;3$, 곧 $a&gt;1$", "$a=3$이면 $Q$가 $1$을 포함하지 않고, $a=1$이면 $3$을 포함하지 않으므로 등호는 들어가지 않는다."], "ans": "$1&lt;a&lt;3$"}}}, {"key": "T07-05", "no": "05", "name": "'모든'과 '어떤'이 있는 명제", "book": {"sight": "‘모든 $x$’는 $P=U$, ‘어떤 $x$’는 $P\\ne \\varnothing$일 때 참이다. ‘모든’은 반례 하나로 거짓, ‘어떤’은 예 하나로 참. 이차부등식이 모든 실수에서 성립할 조건은 <b>판별식<\/b>으로 본다. 부정은 ‘모든’↔‘어떤’을 바꾸고 조건도 부정한다.", "ex": {"body": "명제 ‘어떤 실수 $x$에 대하여 $x^{2}+2ax+3a\\le 0$이다.’가 거짓이 되도록 하는 실수 $a$의 값의 범위를 구하시오.", "sol": ["주어진 명제가 거짓이면 그 부정 ‘모든 실수 $x$에 대하여 $x^{2}+2ax+3a&gt;0$이다.’가 참이다.", "이차항의 계수가 양수이므로 판별식 $\\dfrac{D}{4}=a^{2}-3a&lt;0$", "$a(a-3)&lt;0$  $\\therefore\\ 0&lt;a&lt;3$"], "ans": "$0&lt;a&lt;3$"}}}, {"key": "T07-06", "no": "06", "name": "명제의 역과 대우", "book": {"sight": "명제와 대우는 참·거짓이 같다. <b>역은 따로<\/b> 판정한다. 직접 판정하기 어려운 명제(‘또는’·‘$\\ne $’가 결론에 있는 것)는 대우로 바꿔 본다.", "ex": {"body": "실수 $x$, $y$에 대하여 명제 ‘$x+y&gt;2$이면 $x&gt;1$ 또는 $y&gt;1$이다.’의 역과 대우를 말하고, 명제와 역의 참, 거짓을 판별하시오.", "sol": ["역  ‘$x&gt;1$ 또는 $y&gt;1$이면 $x+y&gt;2$이다.’", "대우  ‘$x\\le 1$ 그리고 $y\\le 1$이면 $x+y\\le 2$이다.’", "대우는 두 부등식을 더하면 바로 나오므로 참이다. 따라서 명제도 참이다.", "역은 $x=2$, $y=-5$이면 $x+y=-3$이므로 거짓이다."], "ans": "명제 참, 역 거짓"}}}, {"key": "T07-07", "no": "07", "name": "대우가 참이 되게 하는 미지수", "book": {"sight": "대우가 참 ⇔ 원래 명제가 참. 대우를 붙들지 말고 <b>원래 명제 $p\\to q$<\/b>로 돌아가 $P\\subset Q$를 세운다. 반대로 ‘$\\ne $’가 들어간 명제는 대우로 바꾸면 ‘$=$’가 되어 쉬워진다.", "ex": {"body": "명제 ‘$x^{2}-ax+6\\ne 0$이면 $x\\ne 2$이다.’가 참이 되도록 하는 실수 $a$의 값을 구하시오.", "sol": ["주어진 명제가 참이면 대우 ‘$x=2$이면 $x^{2}-ax+6=0$이다.’도 참이다.", "$x=2$를 대입하면 $4-2a+6=0$  $\\therefore\\ a=5$"], "ans": "$5$"}}}, {"key": "T07-08", "no": "08", "name": "삼단논법과 명제의 추론", "book": {"sight": "참인 명제마다 <b>대우도 같이 적어<\/b> 두고 화살표를 잇는다. $p\\to q$, $q\\to r$이면 $p\\to r$. 말로 된 명제는 조건 기호로 바꿔 놓고 잇는다.", "ex": {"body": "세 조건 $p$, $q$, $r$에 대하여 두 명제 $p\\to\\sim q$, $r\\to q$가 모두 참일 때, 명제 $p\\to\\sim r$가 참임을 보이시오.", "sol": ["$r\\to q$가 참이므로 그 대우 $\\sim q\\to\\sim r$도 참이다.", "$p\\to\\sim q$와 $\\sim q\\to\\sim r$가 모두 참이므로 삼단논법에 의하여 $p\\to\\sim r$는 참이다."], "ans": "풀이 참조"}}}], "card": [["핵심", "미지수가 있는 명제, ‘모든’·‘어떤’이 붙은 명제, 역과 대우의 참·거짓은 모두 진리집합 사이의 관계로 판정한다."], ["뜻", "명제 $p\\to q$에 대하여 $q\\to p$를 <b>역<\/b>,  $\\sim q\\to\\sim p$를 <b>대우<\/b> 라 한다. 또 전체집합 $U$의 원소 $x$에 대하여 ‘모든 $x$에 대하여 $p$이다’, ‘어떤 $x$에 대하여 $p$이다’와 같이 ‘모든’, ‘어떤’이 붙은 문장은 명제이다."], ["정리", "전체집합 $U$에서 세 조건 $p$, $q$, $r$의 진리집합을 각각 $P$, $Q$, $R$라 할 때<br>(1) ‘모든 $x$에 대하여 $p$’는 $P=U$일 때, ‘어떤 $x$에 대하여 $p$’는 $P\\ne \\varnothing$일 때 참이다.<br>(2) ‘모든 $x$에 대하여 $p$’의 부정은 ‘어떤 $x$에 대하여 $\\sim p$’, ‘어떤 $x$에 대하여 $p$’의 부정은 ‘모든 $x$에 대하여 $\\sim p$’이다.<br>(3) 명제 $p\\to q$와 그 대우 $\\sim q\\to\\sim p$는 참·거짓이 항상 같다.<br>(4) $p\\to q$와 $q\\to r$가 모두 참이면 $p\\to r$도 참이다. (삼단논법)"], ["주의", "명제가 참이어도 그 역이 참이라고 할 수 없다. 참·거짓이 항상 같은 것은 명제와 그 대우뿐이다."], ["주의", "‘모든’·‘어떤’이 붙은 명제를 부정할 때는 ‘모든’과 ‘어떤’을 바꾸고, 조건 $p$도 함께 부정한다."], ["주의", "미지수가 있는 명제가 참이 될 조건은 $P\\subset Q$를 수직선에 나타내어 세운다. 끝점의 등호 포함 여부는 따로 확인한다."]]}, {"key": "C07-03", "no": "03", "title": "충분조건과 필요조건", "themes": [{"key": "T07-09", "no": "09", "name": "충분·필요·필요충분조건", "book": {"sight": "두 진리집합을 비교한다. <b>작은 집합의 조건이 충분조건, 큰 집합의 조건이 필요조건<\/b>, 같으면 필요충분조건. 이름은 ‘~이기 위한’ 앞에 놓인 조건에 붙는다. 조건이 식이면 먼저 풀어서 진리집합을 구한다.", "ex": {"body": "실수 $x$에 대한 두 조건 $p:x^{2}=2x$, $q:x=2$에 대하여 $p$는 $q$이기 위한 어떤 조건인지 말하시오.", "sol": ["$x^{2}-2x=0$에서 $x=0$ 또는 $x=2$이므로 $P=\\{0,\\,2\\}$, $Q=\\{2\\}$", "$Q\\subset P$이고 $P\\not\\subset Q$이므로 $q\\Longrightarrow p$이지만 $p\\Longrightarrow q$는 아니다.", "따라서 $p$는 $q$이기 위한 필요조건이지만 충분조건은 아니다."], "ans": "필요조건"}}}, {"key": "T07-10", "no": "10", "name": "조건이 되게 하는 미지수와 연산", "book": {"sight": "‘충분조건’은 $P\\subset Q$, ‘필요조건’은 $Q\\subset P$로 바꿔 수직선에서 끝점을 비교한다. 조건이 세 개이면 <b>포함 사슬 하나<\/b>(예 $Q\\subset R\\subset P$)로 이어 그린다.", "ex": {"body": "실수 $x$에 대한 두 조건 $p:|x-1|\\le 2$, $q:a\\le x\\le a+5$에 대하여 $p$가 $q$이기 위한 충분조건이 되도록 하는 실수 $a$의 값의 범위를 구하시오.", "sol": ["$P=\\{x\\mid -1\\le x\\le 3\\}$이고, 충분조건이려면 $P\\subset Q$", "$a\\le -1$이고 $a+5\\ge 3$  $\\therefore\\ -2\\le a\\le -1$", "양 끝이 모두 닫힌 구간이므로 끝점이 같아도 포함된다."], "ans": "$-2\\le a\\le -1$"}}}], "card": [["핵심", "명제 $p\\to q$가 참일 때 두 조건 사이의 관계에 붙이는 이름이다. 판정은 언제나 진리집합의 포함 관계로 한다."], ["뜻", "명제 $p\\to q$가 참일 때, 이것을 기호로 $p\\Longrightarrow q$와 같이 나타내고 $p$는 $q$이기 위한 <b>충분조건<\/b>,  $q$는 $p$이기 위한 <b>필요조건<\/b> 이라 한다. 또 $p\\Longrightarrow q$이고 $q\\Longrightarrow p$일 때 $p\\Longleftrightarrow q$로 나타내고, $p$는 $q$이기 위한 <b>필요충분조건<\/b>이라 한다."], ["정리", "두 조건 $p$, $q$의 진리집합을 각각 $P$, $Q$라 할 때<br>(1) $P\\subset Q$이면 $p$는 $q$이기 위한 충분조건이다.<br>(2) $Q\\subset P$이면 $p$는 $q$이기 위한 필요조건이다.<br>(3) $P=Q$이면 $p$는 $q$이기 위한 필요충분조건이다.<br>(4) $P\\not\\subset Q$이고 $Q\\not\\subset P$이면 $p$는 $q$이기 위한 충분조건도 필요조건도 아니다."], ["주의", "‘$p$는 $q$이기 위한 필요조건’은 $Q\\subset P$를 뜻한다. $P\\subset Q$가 아니다. 이름은 ‘~이기 위한’ 앞에 놓인 조건에 붙는다."], ["주의", "‘충분조건이다’에는 필요충분조건인 경우도 들어간다. 필요충분인지, ‘충분조건이지만 필요조건은 아니다’인지는 $Q\\subset P$인지까지 확인해야 정해진다."], ["주의", "진리집합이 공집합일 수 있으면 그 경우를 따로 본다. 공집합은 모든 집합의 부분집합이다."]]}, {"key": "C07-04", "no": "04", "title": "명제의 증명과 절대부등식", "themes": [{"key": "T07-11", "no": "11", "name": "대우법과 귀류법", "book": {"sight": "결론이 ‘~가 아니다’, ‘적어도 하나’, ‘무리수이다’처럼 직접 보이기 어려우면 <b>결론을 부정해서<\/b> 시작한다. 대우법은 $\\sim q\\to\\sim p$를 보이고, 귀류법은 $p$와 $\\sim q$를 함께 가정해 모순을 이끈다. 홀수·짝수, $3$의 배수가 아닌 수는 $2k+1$, $3k\\pm 1$처럼 꼴로 놓는다.", "ex": {"body": "자연수 $n$에 대하여 명제 ‘$n^{2}$이 짝수이면 $n$도 짝수이다.’가 참임을 대우를 이용하여 증명하시오.", "sol": ["대우는 ‘$n$이 홀수이면 $n^{2}$도 홀수이다.’", "$n=2k-1$ ($k$는 자연수)이라 하면", "$n^{2}=4k^{2}-4k+1=2(2k^{2}-2k)+1$", "$2k^{2}-2k$는 $0$ 또는 자연수이므로 $n^{2}$은 홀수이다.", "대우가 참이므로 주어진 명제도 참이다."], "ans": "풀이 참조"}}}, {"key": "T07-12", "no": "12", "name": "절대부등식의 증명", "book": {"sight": "(좌변)$-$(우변)을 <b>완전제곱식의 합<\/b>으로 만들어 $\\ge 0$을 보인다. 근호·절댓값이 있으면 양변이 $0$ 이상임을 확인하고 <b>제곱해서<\/b> 비교한다. 등호가 성립하는 조건까지 적는다.", "ex": {"body": "실수 $a$, $b$에 대하여 부등식 $a^{2}+b^{2}\\ge 2(a+b)-2$가 성립함을 증명하고, 등호가 성립하는 조건을 구하시오.", "sol": ["$a^{2}+b^{2}-2(a+b)+2=(a^{2}-2a+1)+(b^{2}-2b+1)$", "$=(a-1)^{2}+(b-1)^{2}\\ge 0$", "등호는 $a-1=0$, $b-1=0$, 곧 $a=b=1$일 때 성립한다."], "ans": "등호는 $a=b=1$일 때"}}}, {"key": "T07-13", "no": "13", "name": "산술·기하평균 : 전개와 변형", "book": {"sight": "<b>곱해서 상수가 되는 두 양수 덩어리<\/b>를 만든다. 곱의 꼴이면 먼저 전개하고, 분모가 $x-a$ 꼴이면 나머지 항도 $x-a$ 덩어리로 맞춘다. 마지막에 <b>등호가 범위 안에서 실제로 성립하는지<\/b> 확인한다.", "ex": {"body": "$x&gt;1$일 때, $x+\\dfrac{4}{x-1}$의 최솟값과 그때의 $x$의 값을 구하시오.", "sol": ["$x-1&gt;0$이므로 $x+\\dfrac{4}{x-1}=(x-1)+\\dfrac{4}{x-1}+1$", "$\\ge 2\\sqrt{(x-1)\\cdot\\dfrac{4}{x-1}}+1=5$", "등호는 $x-1=\\dfrac{4}{x-1}$, 곧 $(x-1)^{2}=4$에서 $x=3$ ($x&gt;1$)일 때 성립한다."], "ans": "최솟값 $5$, $x=3$"}}}, {"key": "T07-14", "no": "14", "name": "산술·기하평균 : 합·곱이 일정", "book": {"sight": "<b>합이 일정하면 곱의 최댓값, 곱이 일정하면 합의 최솟값<\/b>. 계수가 붙어 있으면 $2a$, $3b$처럼 계수까지 한 덩어리로 묶는다. 등호 조건으로 그때의 값을 구한다.", "ex": {"body": "두 양수 $x$, $y$에 대하여 $2x+y=8$일 때, $xy$의 최댓값과 그때의 $x$, $y$의 값을 구하시오.", "sol": ["$2x&gt;0$, $y&gt;0$이므로 $2x+y\\ge 2\\sqrt{2xy}$", "$8\\ge 2\\sqrt{2xy}$에서 $\\sqrt{2xy}\\le 4$, 곧 $xy\\le 8$", "등호는 $2x=y$일 때이므로 $2x=y=4$, 곧 $x=2$, $y=4$"], "ans": "최댓값 $8$, $x=2$, $y=4$"}}}, {"key": "T07-15", "no": "15", "name": "코시-슈바르츠 부등식", "book": {"sight": "<b>제곱의 합과 일차식<\/b>이 함께 나오면 $(a^{2}+b^{2})(x^{2}+y^{2})\\ge(ax+by)^{2}$에 맞춰 계수를 짝 짓는다. 등호 조건 $\\dfrac{x}{a}=\\dfrac{y}{b}$로 최대·최소가 되는 값을 확인한다.", "ex": {"body": "실수 $x$, $y$에 대하여 $x^{2}+y^{2}=5$일 때, $x+2y$의 최댓값과 최솟값을 구하시오.", "sol": ["$(1^{2}+2^{2})(x^{2}+y^{2})\\ge(x+2y)^{2}$에서 $(x+2y)^{2}\\le 25$", "$\\therefore\\ -5\\le x+2y\\le 5$", "등호는 $\\dfrac{x}{1}=\\dfrac{y}{2}$, 곧 $y=2x$일 때이고 $5x^{2}=5$에서 $x=1$이면 최댓값, $x=-1$이면 최솟값"], "ans": "최댓값 $5$, 최솟값 $-5$"}}}], "card": [["핵심", "직접 보이기 어려운 명제는 대우나 귀류법으로 증명한다. 부등식의 증명은 두 식의 차의 부호를 정하는 일이고, 그 결과가 최대·최소를 구하는 도구가 된다."], ["뜻", "문자가 가질 수 있는 모든 값에 대하여 항상 성립하는 부등식을 <b>절대부등식<\/b> 이라 한다. 또 명제의 결론을 부정하여 가정이나 이미 알려진 사실에 모순이 생김을 보임으로써 명제가 참임을 증명하는 방법을 <b>귀류법<\/b>이라 한다."], ["정리", "$a$, $b$, $x$, $y$가 실수일 때<br>(1) $a&gt;0$, $b&gt;0$이면 $\\dfrac{a+b}{2}\\ge\\sqrt{ab}$  (등호는 $a=b$일 때 성립)<br>(2) $(a^{2}+b^{2})(x^{2}+y^{2})\\ge(ax+by)^{2}$  (등호는 $ay=bx$일 때 성립)<br>(3) $|a|+|b|\\ge|a+b|$  (등호는 $ab\\ge 0$일 때 성립)"], ["주의", "산술평균과 기하평균의 관계는 <b>두 수가 음수가 아닐 때만<\/b> 쓴다. $x&lt;0$이면 $x+\\frac{1}{x}\\ge 2$는 성립하지 않는다."], ["주의", "최솟값이나 최댓값을 구했으면 <b>등호가 성립하는 값이 주어진 범위 안에 실제로 있는지<\/b> 확인한다. 등호가 성립하지 않으면 그 값은 최솟값(최댓값)이 아니다."], ["주의", "대우를 이용한 증명은 $\\sim q\\to\\sim p$를 직접 보이고, 귀류법은 $p$와 $\\sim q$를 함께 가정하여 모순을 이끈다. 둘 다 결론을 부정하는 데서 시작한다."]]}]}], "schedule": {"고1A": {"C07-01": "2026-10-19", "C07-02": "2026-10-19", "C07-03": "2026-10-21", "C07-04": "2026-10-23"}, "고1S": {"C07-01": "2026-10-19", "C07-02": "2026-10-19", "C07-03": "2026-10-21", "C07-04": "2026-10-23"}, "고1T": {"C07-01": "2026-10-18", "C07-02": "2026-10-18", "C07-03": "2026-10-18", "C07-04": "2026-10-18"}}}, "core_c1": {"제목": "CORE 루프 · 미적분Ⅰ", "범위": "05 도함수의 활용 (2) ~ 09 정적분의 활용 (기말)", "학년": "고2", "set": "core_c1", "units": [{"code": "m05", "name": "05 도함수의 활용 (2)", "concepts": [{"key": "Cm05-01", "no": "01", "title": "함수의 증가와 감소", "themes": [{"key": "Tm05-01", "no": "01", "name": "함수의 증가와 감소", "book": {"sight": "$f'(x)$를 <b>인수분해해 부호<\/b>를 정한다. 상수함수가 아닌 다항함수 $f(x)$는 $f'(x)\\ge 0$인 구간에서 증가, $f'(x)\\le 0$인 구간에서 감소한다. 구간 문제는 증가(감소) 구간 전체를 먼저 구하고 주어진 구간을 그 안에 넣는다.", "ex": {"body": "함수 $f(x)=x^{3}-6x^{2}+9x+1$이 증가하는 구간과 감소하는 구간을 구하시오.", "sol": ["$f'(x)=3x^{2}-12x+9=3(x-1)(x-3)$", "$x\\le 1$ 또는 $x\\ge 3$에서 $f'(x)\\ge 0$, $1\\le x\\le 3$에서 $f'(x)\\le 0$", "따라서 구간 $(-\\infty,\\,1]$, $[3,\\,\\infty)$에서 증가하고, 구간 $[1,\\,3]$에서 감소한다."], "ans": "증가 $(-\\infty,\\,1]$, $[3,\\,\\infty)$ / 감소 $[1,\\,3]$"}}}, {"key": "Tm05-02", "no": "02", "name": "실수 전체에서 증가 또는 감소할 조건", "book": {"sight": "최고차항의 계수가 양수인 삼차함수가 실수 전체에서 증가 ⇔ $f'(x)\\ge 0$이 항상 성립 ⇔ <b>이차식 $f'(x)$의 판별식 $D\\le 0$<\/b>. 이런 삼차함수에서는 ‘$x_{1}&lt;x_{2}$이면 $f(x_{1})&lt;f(x_{2})$’, ‘역함수가 존재’, ‘일대일’이 모두 같은 조건이다. (최고차항의 계수가 음수이면 실수 전체에서 감소하는 조건이 된다.)", "ex": {"body": "함수 $f(x)=x^{3}+ax^{2}+3x+1$이 실수 전체의 집합에서 증가하도록 하는 실수 $a$의 값의 범위를 구하시오.", "sol": ["$f'(x)=3x^{2}+2ax+3\\ge 0$이 모든 실수 $x$에 대하여 성립해야 한다.", "$\\dfrac{D}{4}=a^{2}-9\\le 0$  $\\therefore\\ -3\\le a\\le 3$", "$D=0$이면 $f'(x)=0$인 점이 하나뿐이라 증가는 유지되므로 등호가 들어간다."], "ans": "$-3\\le a\\le 3$"}}}, {"key": "Tm05-03", "no": "03", "name": "주어진 구간에서 증가 또는 감소할 조건", "book": {"sight": "상수함수가 아닌 다항함수 $f(x)$가 구간에서 증가 ⇔ 그 구간에서 $f'(x)\\ge 0$. 이차식 $f'(x)$의 그래프(축의 위치)를 보고 <b>구간에서의 최솟값(최댓값)<\/b>만 조건으로 바꾼다. 대부분 <b>양 끝값의 부호<\/b> 조건이 된다.", "ex": {"body": "함수 $f(x)=-x^{3}+3x^{2}+ax$가 닫힌구간 $[1,\\,2]$에서 증가하도록 하는 실수 $a$의 최솟값을 구하시오.", "sol": ["$f'(x)=-3x^{2}+6x+a=-3(x-1)^{2}+a+3$", "$[1,\\,2]$에서 $f'(x)$는 감소하므로 최솟값은 $f'(2)=a$", "$f'(2)=a\\ge 0$이어야 하므로 $a$의 최솟값은 $0$"], "ans": "$0$"}}}], "card": [["핵심", "도함수의 부호가 함수의 증가와 감소를 결정한다. 이 CONCEPT의 문제는 모두 $f'(x)$의 부호를 조사하는 일로 바뀐다."], ["뜻", "함수 $f(x)$가 어떤 구간에 속하는 임의의 두 실수 $x_{1}$, $x_{2}$에 대하여 $x_{1}&lt;x_{2}$일 때 $f(x_{1})&lt;f(x_{2})$이면 <b>증가<\/b>,  $f(x_{1})&gt;f(x_{2})$이면 <b>감소<\/b> 한다고 한다. 증가와 감소는 언제나 구간을 정해 놓고 말한다."], ["정리", "함수 $f(x)$가 어떤 열린구간에서 미분가능하고, 그 구간에 속하는 모든 $x$에 대하여<br>(1) $f'(x)&gt;0$이면 $f(x)$는 그 구간에서 증가한다.<br>(2) $f'(x)&lt;0$이면 $f(x)$는 그 구간에서 감소한다.<br>(3) $f(x)$가 상수함수가 아닌 다항함수이면, $f(x)$가 어떤 구간에서 증가하기 위한 필요충분조건은 그 구간에서 $f'(x)\\ge 0$인 것이다. (감소이면 $f'(x)\\le 0$)"], ["주의", "(1)의 역은 성립하지 않는다. $f(x)=x^{3}$은 실수 전체의 집합에서 증가하지만 $f'(0)=0$이다. 그래서 <b>상수함수가 아닌 다항함수<\/b>가 증가하기 위한 조건은 $f'(x)&gt;0$이 아니라 $f'(x)\\ge 0$으로 세운다."], ["주의", "<b>최고차항의 계수가 양수인<\/b> 삼차함수가 실수 전체의 집합에서 증가하기 위한 조건은 이차방정식 $f'(x)=0$의 판별식 $D\\le 0$이다. $D&lt;0$이 아니다. (최고차항의 계수가 음수이면 $D\\le 0$일 때 감소한다. 예: $f(x)=-x^{3}$)"]]}, {"key": "Cm05-02", "no": "02", "title": "함수의 극대와 극소", "themes": [{"key": "Tm05-04", "no": "04", "name": "함수의 극대와 극소", "book": {"sight": "$f'(x)=0$인 $x$를 구하고 <b>그 좌우에서 부호가 바뀌는지<\/b> 증감표로 확인한다. 최고차항의 계수가 양수인 삼차함수는 작은 근에서 극대, 큰 근에서 극소이다.", "ex": {"body": "함수 $f(x)=x^{3}-3x^{2}-9x+5$의 극댓값과 극솟값을 구하시오.", "sol": ["$f'(x)=3x^{2}-6x-9=3(x+1)(x-3)$", "$x=-1$의 좌우에서 $f'(x)$의 부호가 양에서 음으로, $x=3$의 좌우에서 음에서 양으로 바뀐다.", "극댓값 $f(-1)=-1-3+9+5=10$, 극솟값 $f(3)=27-27-27+5=-22$"], "ans": "극댓값 $10$, 극솟값 $-22$"}}}, {"key": "Tm05-05", "no": "05", "name": "극대와 극소를 이용한 미정계수의 결정", "book": {"sight": "‘$x=a$에서 극값 $b$’는 <b>$f'(a)=0$, $f(a)=b$ 두 식<\/b>이다. 극값을 갖는 두 $x$가 주어지면 $f'(x)$의 두 근 → 근과 계수의 관계. 구한 뒤 실제로 극대(극소)인지 확인한다.", "ex": {"body": "함수 $f(x)=x^{3}+ax^{2}+bx+2$가 $x=1$에서 극솟값 $-2$를 가질 때, 상수 $a$, $b$의 값을 구하시오.", "sol": ["$f'(1)=3+2a+b=0$, $f(1)=3+a+b=-2$", "두 식을 연립하면 $a=2$, $b=-7$", "이때 $f'(x)=3x^{2}+4x-7=(3x+7)(x-1)$이므로 $x=1$의 좌우에서 음에서 양으로 바뀌어 극소가 맞다."], "ans": "$a=2$, $b=-7$"}}}, {"key": "Tm05-06", "no": "06", "name": "극대와 극소의 활용", "book": {"sight": "대칭($f(-x)=f(x)$, $f(-x)=-f(x)$)·접함($x$축에 접하면 중근)·$f'$의 대칭축 같은 <b>구조 조건으로 식의 꼴부터 줄인다<\/b>. 미지수가 줄어든 뒤 극값 조건을 쓴다.", "ex": {"body": "함수 $f(x)=x^{3}-3x^{2}+k$의 극댓값과 극솟값의 합이 $6$일 때, 상수 $k$의 값을 구하시오.", "sol": ["$f'(x)=3x(x-2)$이므로 극댓값 $f(0)=k$, 극솟값 $f(2)=k-4$", "$k+(k-4)=6$  $\\therefore\\ k=5$"], "ans": "$5$"}}}, {"key": "Tm05-07", "no": "07", "name": "극대와 극소를 이용한 계수의 부호 결정", "book": {"sight": "그래프에서 읽는 것 세 가지 — <b>끝의 방향<\/b>(최고차항의 부호), <b>$y$절편<\/b>(상수항), <b>극값을 갖는 $x$의 합·곱<\/b>($f'(x)=0$의 근과 계수의 관계로 나머지 계수).", "ex": {"body": "삼차함수 $f(x)=ax^{3}+bx^{2}+cx+d\\ (a&gt;0)$가 $x=-1$에서 극대, $x=3$에서 극소이고 $f(0)&lt;0$일 때, $b$, $c$, $d$의 부호를 구하시오.", "sol": ["$f'(x)=3ax^{2}+2bx+c$의 두 근이 $-1$, $3$이므로", "$-\\dfrac{2b}{3a}=2$에서 $b=-3a&lt;0$,  $\\dfrac{c}{3a}=-3$에서 $c=-9a&lt;0$", "$d=f(0)&lt;0$"], "ans": "$b&lt;0$, $c&lt;0$, $d&lt;0$"}}}], "card": [["핵심", "증가에서 감소로 바뀌는 점이 극대, 감소에서 증가로 바뀌는 점이 극소이다. 상수함수가 아닌 다항함수에서는 $f'(x)$의 부호가 바뀌는 점을 찾는 일이다."], ["뜻", "함수 $f(x)$가 $x=a$를 포함하는 어떤 열린구간에 속하는 모든 $x$에 대하여 $f(x)\\le f(a)$이면 $x=a$에서 <b>극대<\/b>,  $f(x)\\ge f(a)$이면 <b>극소<\/b> 라 하고, 이때 $f(a)$를 각각 극댓값, 극솟값이라 한다. 극댓값과 극솟값을 통틀어 <b>극값<\/b>이라 한다."], ["정리", "미분가능한 함수 $f(x)$에 대하여<br>(1) $f(x)$가 $x=a$에서 극값을 가지면 $f'(a)=0$이다.<br>(2) $f'(a)=0$이고 $x=a$의 좌우에서 $f'(x)$의 부호가 양에서 음으로 바뀌면 $x=a$에서 극대, 음에서 양으로 바뀌면 극소이다."], ["주의", "(1)의 역은 성립하지 않는다. $f(x)=x^{3}$은 $f'(0)=0$이지만 $x=0$의 좌우에서 $f'(x)&gt;0$이므로 극값을 갖지 않는다."], ["주의", "극값 조건($f'(a)=0$, $f(a)=$극값)으로 미정계수를 구한 뒤에는, 그 점의 좌우에서 $f'(x)$의 부호가 실제로 바뀌는지 확인한다."], ["주의", "<b>최고차항의 계수가 양수인<\/b> 삼차함수가 극값을 가지면 $x$가 작은 쪽에서 극대, 큰 쪽에서 극소이다. 음수이면 반대이다."]]}, {"key": "Cm05-03", "no": "03", "title": "도함수의 그래프와 함수의 그래프", "themes": [{"key": "Tm05-08", "no": "08", "name": "도함수의 그래프를 이용한 극대와 극소", "book": {"sight": "$y=f'(x)$의 그래프로 증가·감소를 판단할 때는 <b>도함수 값의 부호<\/b>에 주목한다. 그 점의 좌우에서 $f'(x)$의 부호가 <b>양에서 음으로 바뀌면 극대, 음에서 양으로 바뀌면 극소<\/b>이고, $x$축에 닿기만 하고 부호가 바뀌지 않으면 극값이 아니다.", "ex": {"body": "다항함수 $f(x)$에 대하여 $f'(x)=(x+2)(x-1)^{2}(x-3)$일 때, 함수 $f(x)$가 극대, 극소가 되는 $x$의 값을 구하시오.", "sol": ["$(x-1)^{2}\\ge 0$이므로 $x\\ne 1$에서 $f'(x)$의 부호는 $(x+2)(x-3)$의 부호와 같다.", "$x=-2$에서 양→음 → 극대, $x=3$에서 음→양 → 극소", "$x=1$에서는 좌우 모두 음이라 부호가 바뀌지 않으므로 극값이 아니다."], "ans": "극대 $x=-2$, 극소 $x=3$"}}}, {"key": "Tm05-09", "no": "09", "name": "도함수의 그래프와 함수의 그래프 해석", "book": {"sight": "구간에서의 증가·감소는 그 구간에서 $f'$의 <b>부호가 한 가지인지<\/b>로 판정한다. 곱의 꼴 $g'(x)=(x-k)f'(x)$는 <b>두 인수의 부호표<\/b>를 따로 그려 곱한다.", "ex": {"body": "다항함수 $f(x)$에 대하여 $f'(x)=-(x+1)(x-2)^{2}$일 때, $f(x)$가 증가하는 구간과 감소하는 구간을 구하고 $f(0)$과 $f(2)$의 대소를 비교하시오.", "sol": ["$(x-2)^{2}\\ge 0$이므로 $x&lt;-1$에서 $f'(x)&gt;0$, $x&gt;-1$에서 $f'(x)\\le 0$", "구간 $(-\\infty,\\,-1]$에서 증가, $[-1,\\,\\infty)$에서 감소한다.", "$0&lt;2$이고 $[-1,\\,\\infty)$에서 감소하므로 $f(0)&gt;f(2)$"], "ans": "증가 $(-\\infty,\\,-1]$, 감소 $[-1,\\,\\infty)$, $f(0)&gt;f(2)$"}}}, {"key": "Tm05-10", "no": "10", "name": "도함수의 그래프로 함수의 그래프 그리기", "book": {"sight": "$f'$의 그래프 → <b>증감표<\/b>(부호) → <b>개형<\/b>. $f'$가 극값을 갖는 곳(봉우리·골짜기)은 $f$의 굽은 방향이 바뀌는 곳일 뿐 극값이 아니다. 함숫값 조건으로 $x$축과의 위치를 정한다.", "ex": {"body": "함수 $f(x)=x^{4}-4x^{3}$의 증감표를 만들고 극값을 구하시오.", "sol": ["$f'(x)=4x^{3}-12x^{2}=4x^{2}(x-3)$", "$x&lt;3$에서 $f'(x)\\le 0$($x=0$에서만 $0$), $x&gt;3$에서 $f'(x)&gt;0$이므로 증감표는 다음과 같다.", "$x$⋯$0$⋯$3$⋯$f'(x)$$-$$0$$-$$0$$+$$f(x)$↘$0$↘$-27$↗", "$x=0$에서는 부호가 바뀌지 않으므로 극값이 아니고, $x=3$에서 극솟값 $f(3)=81-108=-27$"], "ans": "극솟값 $-27$ ($x=3$), 극댓값 없음"}}}], "card": [["핵심", "$y=f'(x)$의 그래프로 함수의 증가·감소를 판단할 때는 도함수 값의 부호에 주목한다. 부호가 $f(x)$의 증가·감소와 극값을 정하고, 증감표가 그래프의 개형을 정한다."], ["뜻", "함수 $f(x)$의 증가·감소와 극대·극소를 표로 정리한 것을 <b>증감표<\/b>라 하고, 증감표에 따라 그린 그래프의 대략적인 모양을 그래프의 <b>개형<\/b> 이라 한다. 도함수 $y=f'(x)$의 그래프가 주어지면 그 부호만으로 증감표를 만들 수 있다."], ["정리", "미분가능한 함수 $f(x)$와 도함수 $y=f'(x)$의 그래프에 대하여<br>(1) $y=f'(x)$의 그래프가 $x$축보다 위쪽에 있는 구간에서 $f(x)$는 증가하고, 아래쪽에 있는 구간에서 감소한다.<br>(2) $y=f'(x)$의 그래프가 $x=a$에서 $x$축을 위에서 아래로 지나면 $x=a$에서 극대, 아래에서 위로 지나면 극소이다.<br>(3) $y=f'(x)$의 그래프가 $x=a$에서 $x$축에 접하기만 하고 지나가지 않으면 $x=a$에서 극값을 갖지 않는다."], ["주의", "주어진 그래프가 $y=f(x)$인지 $y=f'(x)$인지부터 확인한다."], ["주의", "$y=f'(x)$의 그래프의 꼭짓점($f'(x)$가 최대·최소인 점)은 $f(x)$의 극값과 관계없다. 상수함수가 아닌 다항함수의 극값은 $f'(x)$의 부호가 바뀌는 점에서만 생긴다."], ["주의", "$x$축에 접하더라도 <b>지나가면<\/b> 극값을 갖는다. $f'(x)=x^{3}$의 그래프는 원점에서 $x$축에 접하면서 지나가므로 $f(x)=\\frac{1}{4}x^{4}$은 $x=0$에서 극소이다."]]}, {"key": "Cm05-04", "no": "04", "title": "극값을 가질 조건", "themes": [{"key": "Tm05-11", "no": "11", "name": "삼차함수가 극값을 가질 조건", "book": {"sight": "삼차함수가 극값을 가짐 ⇔ 이차방정식 $f'(x)=0$이 <b>서로 다른 두 실근<\/b> ⇔ $D&gt;0$. 삼차함수는 극대와 극소를 항상 함께 갖는다(하나만 갖는 일은 없다).", "ex": {"body": "함수 $f(x)=x^{3}+ax^{2}+3ax+1$이 극값을 갖도록 하는 실수 $a$의 값의 범위를 구하시오.", "sol": ["$f'(x)=3x^{2}+2ax+3a=0$이 서로 다른 두 실근을 가져야 한다.", "$\\dfrac{D}{4}=a^{2}-9a&gt;0$  $\\therefore\\ a&lt;0$ 또는 $a&gt;9$"], "ans": "$a&lt;0$ 또는 $a&gt;9$"}}}, {"key": "Tm05-12", "no": "12", "name": "삼차함수가 극값을 갖지 않을 조건", "book": {"sight": "극값을 갖지 않음 ⇔ 이차방정식 $f'(x)=0$이 중근 또는 서로 다른 두 허근을 갖는다 ⇔ <b>$D\\le 0$<\/b> (등호 포함). 두 함수 조건이 섞이면 각각의 범위를 구해 공통부분.", "ex": {"body": "함수 $f(x)=-x^{3}+ax^{2}-3x$가 극값을 갖지 않도록 하는 실수 $a$의 값의 범위를 구하시오.", "sol": ["$f'(x)=-3x^{2}+2ax-3$", "$\\dfrac{D}{4}=a^{2}-9\\le 0$  $\\therefore\\ -3\\le a\\le 3$"], "ans": "$-3\\le a\\le 3$"}}}, {"key": "Tm05-13", "no": "13", "name": "삼차함수가 주어진 구간에서 극값을 가질 조건", "book": {"sight": "‘구간 안에서 극값’은 <b>이차방정식 $f'(x)=0$의 근의 위치<\/b> 문제다. 이차함수 $y=f'(x)$를 그려 <b>판별식·축·구간 끝의 함숫값 부호<\/b>로 조건을 세운다.", "ex": {"body": "함수 $f(x)=x^{3}-3ax^{2}+3x$가 $x&gt;0$에서 극댓값과 극솟값을 모두 갖도록 하는 실수 $a$의 값의 범위를 구하시오.", "sol": ["$f'(x)=3(x^{2}-2ax+1)=0$이 서로 다른 두 양의 실근을 가져야 한다.", "$\\dfrac{D}{4}=a^{2}-1&gt;0$, 두 근의 합 $2a&gt;0$, 두 근의 곱 $1&gt;0$", "$\\therefore\\ a&gt;1$"], "ans": "$a&gt;1$"}}}, {"key": "Tm05-14", "no": "14", "name": "사차함수의 극값의 조건", "book": {"sight": "사차함수 $f(x)$의 도함수 $f'(x)$는 삼차함수 — <b>한 근을 찾아 인수분해<\/b>해 (일차식)(이차식)으로 만든다. 극대·극소가 모두 있으려면 $f'$의 부호가 세 번 바뀌어야 하고, <b>이차식이 다른 두 실근을 가지되 그 근이 일차식의 근과 달라야<\/b> 한다.", "ex": {"body": "함수 $f(x)=x^{4}-4x^{3}+2ax^{2}$이 극댓값을 갖도록 하는 실수 $a$의 값의 범위를 구하시오.", "sol": ["$f'(x)=4x^{3}-12x^{2}+4ax=4x(x^{2}-3x+a)$", "극댓값을 가지려면 $f'(x)$의 부호가 세 번 바뀌어야 하므로 $x^{2}-3x+a=0$이 $0$이 아닌 서로 다른 두 실근을 가져야 한다.", "$D=9-4a&gt;0$이고 $a\\ne 0$  $\\therefore\\ a&lt;0$ 또는 $0&lt;a&lt;\\dfrac{9}{4}$"], "ans": "$a&lt;0$ 또는 $0&lt;a&lt;\\dfrac{9}{4}$"}}}], "card": [["핵심", "삼차함수의 극값은 이차방정식 $f'(x)=0$의 실근에서 생긴다. 극값이 있느냐는 판별식의 부호, 어디에 있느냐는 근의 위치 문제가 된다."], ["뜻", "삼차함수 $f(x)$의 도함수는 이차함수이므로, 이차방정식 $f'(x)=0$의 판별식을 $D$라 하면 $D&gt;0\\iff$ 극값을 갖는다,  $D\\le 0\\iff$ 극값을 갖지 않는다 이다. 극값을 가지면 극댓값과 극솟값을 하나씩 갖는다."], ["정리", "함수 $f(x)$에 대하여<br>(1) 삼차함수 $f(x)$가 열린구간 $(\\alpha,\\,\\beta)$에서 극댓값과 극솟값을 모두 가질 조건은 $f'(x)=0$이 이 구간에서 서로 다른 두 실근을 갖는 것이다.<br>(2) 최고차항의 계수가 양수인 사차함수 $f(x)$가 극댓값을 가질 조건은 삼차방정식 $f'(x)=0$이 서로 다른 세 실근을 갖는 것이다."], ["주의", "극값을 갖지 않을 조건은 $D&lt;0$이 아니라 $D\\le 0$이다. $D=0$이면 $f'(x)=0$이 중근을 가져 부호가 바뀌지 않는다."], ["주의", "구간 안에서 극값을 가질 조건은 판별식만으로 정할 수 없다. 축의 위치와 구간 양 끝에서 $f'(x)$의 값을 함께 본다."]]}, {"key": "Cm05-05", "no": "05", "title": "함수의 최대와 최소", "themes": [{"key": "Tm05-15", "no": "15", "name": "함수의 최대와 최소", "book": {"sight": "닫힌구간의 최대·최소 = <b>극값과 양 끝값을 모두 모아 비교<\/b>. 합성함수·치환은 <b>안쪽 식의 범위<\/b>부터 구하고 바깥 함수를 그 범위에서 본다.", "ex": {"body": "닫힌구간 $[-1,\\,3]$에서 함수 $f(x)=x^{3}-3x^{2}+2$의 최댓값과 최솟값을 구하시오.", "sol": ["$f'(x)=3x(x-2)$이므로 극값 후보 $f(0)=2$, $f(2)=-2$", "양 끝값 $f(-1)=-2$, $f(3)=2$", "네 값을 비교하면 최댓값 $2$, 최솟값 $-2$"], "ans": "최댓값 $2$, 최솟값 $-2$"}}}, {"key": "Tm05-16", "no": "16", "name": "최대와 최소를 이용한 미정계수의 결정", "book": {"sight": "<b>매개변수에 따라 극값을 갖는 $x$의 위치를 확인하고<\/b>, 구간의 양 끝값과 비교해 어느 값이 최대·최소인지 먼저 정한 뒤 식을 세운다. 상수항만 미지수이면 최댓값과 최솟값이 같은 만큼 움직인다.", "ex": {"body": "닫힌구간 $[0,\\,3]$에서 함수 $f(x)=x^{3}-6x^{2}+9x+a$의 최댓값이 $5$일 때, 상수 $a$의 값과 최솟값을 구하시오.", "sol": ["$f'(x)=3(x-1)(x-3)$", "$f(0)=a$, $f(1)=a+4$, $f(3)=a$", "최댓값 $a+4=5$에서 $a=1$, 최솟값은 $f(0)=f(3)=1$"], "ans": "$a=1$, 최솟값 $1$"}}}, {"key": "Tm05-17", "no": "17", "name": "최대와 최소의 활용", "book": {"sight": "구하는 양을 <b>변수 하나의 함수<\/b>로 세우고 <b>변수의 범위(정의역)<\/b>를 먼저 적는다. 그 범위에서 극값·끝값을 비교한다.", "ex": {"body": "곡선 $y=-x^{2}+4$ 위의 점 $\\mathrm{P}(t,\\,4-t^{2})\\ (0&lt;t&lt;2)$에서 $x$축, $y$축에 내린 수선과 두 좌표축으로 둘러싸인 직사각형의 넓이의 최댓값을 구하시오.", "sol": ["넓이 $S(t)=t(4-t^{2})=4t-t^{3}\\ (0&lt;t&lt;2)$", "$S'(t)=4-3t^{2}=0$에서 $t=\\dfrac{2\\sqrt{3}}{3}$", "$0&lt;t&lt;\\dfrac{2\\sqrt{3}}{3}$에서 $S'(t)&gt;0$, $\\dfrac{2\\sqrt{3}}{3}&lt;t&lt;2$에서 $S'(t)&lt;0$이므로 $S(t)$는 이 값까지 증가하다가 감소한다. 따라서 이때 최댓값을 갖는다.", "$S\\left(\\dfrac{2\\sqrt{3}}{3}\\right)=\\dfrac{2\\sqrt{3}}{3}\\cdot\\dfrac{8}{3}=\\dfrac{16\\sqrt{3}}{9}$"], "ans": "$\\dfrac{16\\sqrt{3}}{9}$"}}}], "card": [["핵심", "닫힌구간에서 연속인 함수는 반드시 최댓값과 최솟값을 갖는다. 후보는 구간 안의 극값과 양 끝의 함숫값뿐이다."], ["뜻", "함수 $f(x)$의 정의역에 속하는 모든 $x$에 대하여 $f(x)\\le f(c)$인 $f(c)$를 <b>최댓값<\/b>,  $f(x)\\ge f(d)$인 $f(d)$를 <b>최솟값<\/b> 이라 한다. 극값은 근처에서만 비교한 값이고, 최댓값·최솟값은 정의역 전체에서 비교한 값이다."], ["정리", "닫힌구간 $[a,\\,b]$에서 연속인 함수 $f(x)$에 대하여<br>(1) $f(x)$는 이 구간에서 반드시 최댓값과 최솟값을 갖는다. (최대·최소 정리)<br>(2) 최댓값과 최솟값은 구간 안의 극값과 $f(a)$, $f(b)$ 중에서 정해진다.<br>(3) $f(x)$가 미분가능하고 구간 안의 극값이 하나뿐일 때, 그것이 극댓값이면 최댓값, 극솟값이면 최솟값이다."], ["주의", "극댓값이 곧 최댓값은 아니다. 양 끝의 함숫값과 반드시 비교한다."], ["주의", "활용 문제는 변수를 정한 뒤 <b>그 변수의 범위부터<\/b> 적는다. 범위 밖의 극값은 후보가 아니다."]]}]}], "schedule": {"고2A": {"Cm05-01": "2026-10-20", "Cm05-02": "2026-10-20", "Cm05-03": "2026-10-20", "Cm05-04": "2026-10-22", "Cm05-05": "2026-10-22"}}}}, "items": {"c07-01-1-01": {"id": "c07-01-1-01", "unit": "07", "concept": "01", "벌": 1, "k": "ox", "q": "‘$x+2=5$’는 명제이다.", "a": "X", "w": "$x$의 값에 따라 참·거짓이 달라지므로 명제가 아니라 조건이다.", "key": "C07-01"}, "c07-01-1-02": {"id": "c07-01-1-02", "unit": "07", "concept": "01", "벌": 1, "k": "ox", "q": "실수 전체에서 조건 ‘$x<3$’의 부정은 ‘$x\\ge 3$’이다.", "a": "O", "w": "$x<3$이 아닌 것은 $x\\ge 3$이다. 부정하면 등호가 반대쪽으로 옮겨 간다.", "key": "C07-01"}, "c07-01-1-03": {"id": "c07-01-1-03", "unit": "07", "concept": "01", "벌": 1, "k": "ox", "q": "조건 ‘$x=1$ 또는 $x=2$’의 부정은 ‘$x\\ne 1$ 또는 $x\\ne 2$’이다.", "a": "X", "w": "부정하면 ‘또는’이 ‘그리고’로 바뀐다. 맞는 부정은 ‘$x\\ne 1$ 그리고 $x\\ne 2$’이다.", "key": "C07-01"}, "c07-01-1-04": {"id": "c07-01-1-04", "unit": "07", "concept": "01", "벌": 1, "k": "ox", "q": "두 조건 $p$, $q$의 진리집합이 각각 $P$, $Q$일 때, 조건 ‘$p$ 그리고 $\\sim q$’의 진리집합은 $P-Q$이다.", "a": "O", "w": "‘그리고’는 교집합, $\\sim q$는 $Q^{C}$이므로 $P\\cap Q^{C}=P-Q$이다.", "key": "C07-01"}, "c07-01-1-05": {"id": "c07-01-1-05", "unit": "07", "concept": "01", "벌": 1, "k": "ox", "q": "두 조건 $p$, $q$의 진리집합이 각각 $P$, $Q$일 때, 명제 $p\\to q$가 참이면 $P\\cap Q=P$이다.", "a": "O", "w": "$p\\to q$가 참이면 $P\\subset Q$이고, 이때 $P\\cap Q=P$이다.", "key": "C07-01"}, "c07-01-1-06": {"id": "c07-01-1-06", "unit": "07", "concept": "01", "벌": 1, "k": "c4", "q": "전체집합 $U=\\{1,2,3,4,5,6\\}$에서 조건 ‘$x$는 짝수이다.’의 진리집합은 ____이다.", "a": "$\\{2,4,6\\}$", "c": ["$\\{2,4,6\\}$", "$\\{1,3,5\\}$", "$\\{2,4\\}$", "$\\{0,2,4,6\\}$"], "w": "진리집합은 전체집합 $U$의 원소 중 조건을 참이 되게 하는 것만 모은 집합이므로 $\\{2,4,6\\}$이다. $0$은 $U$의 원소가 아니다.", "key": "C07-01"}, "c07-01-1-07": {"id": "c07-01-1-07", "unit": "07", "concept": "01", "벌": 1, "k": "c4", "q": "실수 $x$에 대한 조건 ‘$1<x\\le 4$’의 부정은 ‘____’이다.", "a": "$x\\le 1$ 또는 $x>4$", "c": ["$x\\le 1$ 또는 $x>4$", "$x\\le 1$ 그리고 $x>4$", "$x<1$ 또는 $x\\ge 4$", "$x<1$ 또는 $x>4$"], "w": "‘$1<x$ 그리고 $x\\le 4$’를 부정하면 ‘$x\\le 1$ 또는 $x>4$’이다. ‘그리고’는 ‘또는’으로, 각 부등식은 등호를 반대쪽으로 옮겨 부정한다.", "key": "C07-01"}, "c07-01-1-08": {"id": "c07-01-1-08", "unit": "07", "concept": "01", "벌": 1, "k": "c4", "q": "명제 ‘$p$이면 $q$이다.’를 $p\\to q$로 나타낼 때, $p$를 ____이라 한다.", "a": "가정", "c": ["가정", "결론", "역", "부정"], "w": "$p\\to q$에서 $p$를 가정, $q$를 결론이라 한다.", "key": "C07-01"}, "c07-01-2-01": {"id": "c07-01-2-01", "unit": "07", "concept": "01", "벌": 2, "k": "ox", "q": "‘$2$는 홀수이다.’는 거짓인 문장이므로 명제가 아니다.", "a": "X", "w": "참인지 거짓인지 분명히 판별할 수 있으면 명제이다. 거짓으로 판별되는 문장도 명제(거짓인 명제)이다.", "key": "C07-01"}, "c07-01-2-02": {"id": "c07-01-2-02", "unit": "07", "concept": "01", "벌": 2, "k": "ox", "q": "전체집합이 자연수 전체일 때, 조건 ‘$x^{2}<5$’의 진리집합은 $\\{1,2\\}$이다.", "a": "O", "w": "$1^{2}=1$, $2^{2}=4$는 $5$보다 작고 $3^{2}=9$부터는 아니므로 $\\{1,2\\}$이다. 전체집합이 실수 전체라면 진리집합이 달라진다.", "key": "C07-01"}, "c07-01-2-03": {"id": "c07-01-2-03", "unit": "07", "concept": "01", "벌": 2, "k": "ox", "q": "조건 $p$의 진리집합이 $P$일 때, $\\sim(\\sim p)$의 진리집합은 $P$이다.", "a": "O", "w": "$\\sim(\\sim p)=p$이고, 집합으로는 $(P^{C})^{C}=P$이다.", "key": "C07-01"}, "c07-01-2-04": {"id": "c07-01-2-04", "unit": "07", "concept": "01", "벌": 2, "k": "ox", "q": "두 조건 $p$, $q$의 진리집합이 각각 $P$, $Q$일 때, 조건 ‘$p$ 또는 $q$’의 부정의 진리집합은 $P^{C}\\cup Q^{C}$이다.", "a": "X", "w": "‘$p$ 또는 $q$’의 부정은 ‘$\\sim p$ 그리고 $\\sim q$’이므로 진리집합은 $(P\\cup Q)^{C}=P^{C}\\cap Q^{C}$이다.", "key": "C07-01"}, "c07-01-2-05": {"id": "c07-01-2-05", "unit": "07", "concept": "01", "벌": 2, "k": "ox", "q": "실수 $x$에 대하여 명제 ‘$x>2$이면 $x>3$이다.’의 반례로 $x=1$을 들 수 있다.", "a": "X", "w": "반례는 가정 $x>2$를 만족시키면서 결론 $x>3$을 만족시키지 않아야 한다. $x=1$은 가정을 만족시키지 않으므로 반례가 아니고, 예컨대 $x=3$이 반례이다.", "key": "C07-01"}, "c07-01-2-06": {"id": "c07-01-2-06", "unit": "07", "concept": "01", "벌": 2, "k": "ox", "q": "전체집합 $U=\\{1,2,3,\\cdots,10\\}$에서 조건 $p$ : ‘$x$는 $6$의 약수이다.’에 대하여 $\\sim p$의 진리집합의 원소는 $6$개이다.", "a": "O", "w": "$P=\\{1,2,3,6\\}$이고 $\\sim p$의 진리집합은 $P^{C}$이므로 원소는 $10-4=6$개이다.", "key": "C07-01"}, "c07-01-2-07": {"id": "c07-01-2-07", "unit": "07", "concept": "01", "벌": 2, "k": "c4", "q": "실수 $x$에 대하여 명제 ‘$x^{2}-4x+3=0$이면 $x=1$이다.’의 반례는 $x=$ ____이다.", "a": "$3$", "c": ["$3$", "$1$", "$-3$", "$-1$"], "w": "$x^{2}-4x+3=(x-1)(x-3)=0$에서 $x=1$ 또는 $x=3$이다. 가정은 만족시키고 결론 $x=1$은 만족시키지 않는 $x=3$이 반례이다.", "key": "C07-01"}, "c07-01-2-08": {"id": "c07-01-2-08", "unit": "07", "concept": "01", "벌": 2, "k": "c4", "q": "두 조건 $p$, $q$의 진리집합을 각각 $P$, $Q$라 할 때, 명제 $p\\to q$가 거짓임을 보이는 반례는 집합 ____의 원소이다.", "a": "$P\\cap Q^{C}$", "c": ["$P\\cap Q^{C}$", "$P^{C}\\cap Q$", "$P\\cap Q$", "$P^{C}\\cap Q^{C}$"], "w": "반례는 $p$는 만족시키고 $q$는 만족시키지 않는 원소, 곧 $P-Q=P\\cap Q^{C}$의 원소이다.", "key": "C07-01"}, "c07-02-1-01": {"id": "c07-02-1-01", "unit": "07", "concept": "02", "벌": 1, "k": "ox", "q": "명제 $p\\to q$의 대우는 $\\sim p\\to\\sim q$이다.", "a": "X", "w": "대우는 가정과 결론을 바꾸고 각각 부정한 $\\sim q\\to\\sim p$이다. $\\sim p\\to\\sim q$는 대우가 아니다.", "key": "C07-02"}, "c07-02-1-02": {"id": "c07-02-1-02", "unit": "07", "concept": "02", "벌": 1, "k": "ox", "q": "명제 ‘$x=2$이면 $x^{2}=4$이다.’가 참이므로 그 역도 참이다.", "a": "X", "w": "역 ‘$x^{2}=4$이면 $x=2$이다.’는 $x=-2$가 반례이므로 거짓이다. 명제가 참이어도 역이 참이라고 할 수 없다.", "key": "C07-02"}, "c07-02-1-03": {"id": "c07-02-1-03", "unit": "07", "concept": "02", "벌": 1, "k": "ox", "q": "‘어떤 실수 $x$에 대하여 $x^{2}\\le 0$이다.’는 참인 명제이다.", "a": "O", "w": "$x=0$이면 $x^{2}=0\\le 0$이므로 진리집합이 공집합이 아니다. 따라서 참이다.", "key": "C07-02"}, "c07-02-1-04": {"id": "c07-02-1-04", "unit": "07", "concept": "02", "벌": 1, "k": "ox", "q": "명제 $p\\to q$가 거짓이면 그 대우 $\\sim q\\to\\sim p$도 거짓이다.", "a": "O", "w": "명제와 그 대우는 참·거짓이 항상 같으므로, 명제가 거짓이면 대우도 거짓이다.", "key": "C07-02"}, "c07-02-1-05": {"id": "c07-02-1-05", "unit": "07", "concept": "02", "벌": 1, "k": "ox", "q": "‘어떤 $x$에 대하여 $p$이다.’의 부정은 ‘모든 $x$에 대하여 $\\sim p$이다.’이다.", "a": "O", "w": "‘어떤’은 ‘모든’으로 바꾸고 조건 $p$도 함께 부정한다.", "key": "C07-02"}, "c07-02-1-06": {"id": "c07-02-1-06", "unit": "07", "concept": "02", "벌": 1, "k": "c4", "q": "실수 $x$에 대하여 명제 ‘$x>1$이면 $x^{2}>1$이다.’의 대우는 ‘____이면 $x\\le 1$이다.’이다.", "a": "$x^{2}\\le 1$", "c": ["$x^{2}\\le 1$", "$x^{2}<1$", "$x\\le 1$", "$x^{2}\\ge 1$"], "w": "대우는 결론의 부정을 가정으로 놓는다. $x^{2}>1$의 부정은 $x^{2}\\le 1$이다.", "key": "C07-02"}, "c07-02-1-07": {"id": "c07-02-1-07", "unit": "07", "concept": "02", "벌": 1, "k": "c4", "q": "전체집합 $U$에서 조건 $p$의 진리집합을 $P$라 할 때, ‘모든 $x$에 대하여 $p$이다.’는 ____일 때 참이다.", "a": "$P=U$", "c": ["$P=U$", "$P\\ne\\varnothing$", "$P\\subset U$", "$P=\\varnothing$"], "w": "모든 원소가 $p$를 만족시켜야 하므로 $P=U$일 때 참이다. $P\\subset U$는 항상 성립하므로 판정 기준이 될 수 없고, $P\\ne\\varnothing$은 ‘어떤’의 기준이다.", "key": "C07-02"}, "c07-02-1-08": {"id": "c07-02-1-08", "unit": "07", "concept": "02", "벌": 1, "k": "c4", "q": "세 조건 $p$, $q$, $r$에 대하여 두 명제 $p\\to q$, $q\\to r$가 모두 참일 때, 항상 참인 명제는 ____이다.", "a": "$\\sim r\\to\\sim p$", "c": ["$\\sim r\\to\\sim p$", "$r\\to p$", "$\\sim p\\to\\sim r$", "$q\\to p$"], "w": "삼단논법으로 $p\\to r$가 참이고, 그 대우 $\\sim r\\to\\sim p$도 참이다. 나머지는 역 또는 역의 대우 꼴이라 참이 보장되지 않는다.", "key": "C07-02"}, "c07-02-2-01": {"id": "c07-02-2-01", "unit": "07", "concept": "02", "벌": 2, "k": "ox", "q": "‘모든 실수 $x$에 대하여 $x^{2}>0$이다.’의 부정은 ‘모든 실수 $x$에 대하여 $x^{2}\\le 0$이다.’이다.", "a": "X", "w": "‘모든’은 ‘어떤’으로 바뀌어야 한다. 맞는 부정은 ‘어떤 실수 $x$에 대하여 $x^{2}\\le 0$이다.’이다.", "key": "C07-02"}, "c07-02-2-02": {"id": "c07-02-2-02", "unit": "07", "concept": "02", "벌": 2, "k": "ox", "q": "실수 $x$에 대하여 명제 ‘$x^{2}\\ne 4$이면 $x\\ne 2$이다.’는 참이다.", "a": "O", "w": "대우 ‘$x=2$이면 $x^{2}=4$이다.’가 참이므로 원래 명제도 참이다.", "key": "C07-02"}, "c07-02-2-03": {"id": "c07-02-2-03", "unit": "07", "concept": "02", "벌": 2, "k": "ox", "q": "전체집합 $U=\\{1,2,3\\}$에서 ‘모든 $x$에 대하여 $x^{2}\\le 4$이다.’는 참이다.", "a": "X", "w": "$x=3$이면 $x^{2}=9>4$이므로 진리집합이 $\\{1,2\\}\\ne U$이다. 따라서 거짓이다.", "key": "C07-02"}, "c07-02-2-04": {"id": "c07-02-2-04", "unit": "07", "concept": "02", "벌": 2, "k": "ox", "q": "실수 $x$에 대하여 명제 ‘$x\\ge a$이면 $x\\ge 3$이다.’가 참이 되도록 하는 실수 $a$의 값의 범위는 $a\\ge 3$이다.", "a": "O", "w": "$\\{x\\mid x\\ge a\\}\\subset\\{x\\mid x\\ge 3\\}$이어야 하므로 $a\\ge 3$이다. $a=3$이면 두 집합이 같아 포함되므로 등호도 들어간다.", "key": "C07-02"}, "c07-02-2-05": {"id": "c07-02-2-05", "unit": "07", "concept": "02", "벌": 2, "k": "ox", "q": "세 조건 $p$, $q$, $r$에 대하여 두 명제 $p\\to\\sim q$, $r\\to q$가 모두 참이면 명제 $p\\to\\sim r$도 참이다.", "a": "O", "w": "$r\\to q$의 대우 $\\sim q\\to\\sim r$가 참이므로 $p\\to\\sim q$, $\\sim q\\to\\sim r$에서 삼단논법으로 $p\\to\\sim r$가 참이다.", "key": "C07-02"}, "c07-02-2-06": {"id": "c07-02-2-06", "unit": "07", "concept": "02", "벌": 2, "k": "ox", "q": "명제 $p\\to q$의 역과 대우는 참·거짓이 항상 같다.", "a": "X", "w": "참·거짓이 항상 같은 것은 명제와 그 대우이다. 예컨대 ‘$x=1$이면 $x^{2}=1$’의 대우는 참이지만 역은 거짓이다.", "key": "C07-02"}, "c07-02-2-07": {"id": "c07-02-2-07", "unit": "07", "concept": "02", "벌": 2, "k": "c4", "q": "실수 $x$에 대하여 명제 ‘$-1<x<2$이면 $x<a$이다.’가 참이 되도록 하는 실수 $a$의 최솟값은 ____이다.", "a": "$2$", "c": ["$2$", "$1$", "$3$", "$-1$"], "w": "$\\{x\\mid -1<x<2\\}\\subset\\{x\\mid x<a\\}$이어야 하므로 $a\\ge 2$이다. $a=2$일 때도 포함되므로 최솟값은 $2$이다.", "key": "C07-02"}, "c07-02-2-08": {"id": "c07-02-2-08", "unit": "07", "concept": "02", "벌": 2, "k": "c4", "q": "명제 $p\\to q$가 참일 때, 반드시 참인 명제는 ____이다.", "a": "$\\sim q\\to\\sim p$", "c": ["$\\sim q\\to\\sim p$", "$q\\to p$", "$\\sim p\\to\\sim q$", "$\\sim q\\to p$"], "w": "명제가 참이면 그 대우 $\\sim q\\to\\sim p$도 참이다. 역 $q\\to p$와 $\\sim p\\to\\sim q$는 참이 보장되지 않는다.", "key": "C07-02"}, "c07-03-1-01": {"id": "c07-03-1-01", "unit": "07", "concept": "03", "벌": 1, "k": "ox", "q": "두 조건 $p$, $q$의 진리집합을 $P$, $Q$라 할 때, $p$가 $q$이기 위한 필요조건이면 $P\\subset Q$이다.", "a": "X", "w": "$p$가 $q$이기 위한 필요조건이면 $q\\Longrightarrow p$, 곧 $Q\\subset P$이다. $P\\subset Q$는 $p$가 충분조건일 때이다.", "key": "C07-03"}, "c07-03-1-02": {"id": "c07-03-1-02", "unit": "07", "concept": "03", "벌": 1, "k": "ox", "q": "실수 $x$에 대하여 $p:x=2$, $q:x^{2}=4$이면 $p$는 $q$이기 위한 충분조건이다.", "a": "O", "w": "$P=\\{2\\}$, $Q=\\{-2,\\,2\\}$이므로 $P\\subset Q$이다. 따라서 $p$는 $q$이기 위한 충분조건이다(필요조건은 아니다).", "key": "C07-03"}, "c07-03-1-03": {"id": "c07-03-1-03", "unit": "07", "concept": "03", "벌": 1, "k": "ox", "q": "실수 $x$에 대하여 $p:x>3$, $q:x>1$이면 $q$는 $p$이기 위한 필요조건이다.", "a": "O", "w": "$P\\subset Q$이므로 $p\\Longrightarrow q$이고, 이때 $q$는 $p$이기 위한 필요조건이다. 이름은 ‘~이기 위한’ 앞의 조건 $q$에 붙는다.", "key": "C07-03"}, "c07-03-1-04": {"id": "c07-03-1-04", "unit": "07", "concept": "03", "벌": 1, "k": "ox", "q": "실수 $x$에 대하여 $p:|x|<1$, $q:-1<x<1$이면 $p$는 $q$이기 위한 필요충분조건이다.", "a": "O", "w": "$|x|<1$의 진리집합은 $\\{x\\mid -1<x<1\\}$이므로 $P=Q$이다. 따라서 필요충분조건이다.", "key": "C07-03"}, "c07-03-1-05": {"id": "c07-03-1-05", "unit": "07", "concept": "03", "벌": 1, "k": "ox", "q": "실수 $x$, $y$에 대하여 $p:x+y>0$, $q:x>0$이고 $y>0$이면 $p$는 $q$이기 위한 충분조건이다.", "a": "X", "w": "$x=2$, $y=-1$이면 $p$는 참이지만 $q$는 거짓이므로 $p\\Longrightarrow q$가 아니다. $q\\Longrightarrow p$이므로 $p$는 $q$이기 위한 필요조건이다.", "key": "C07-03"}, "c07-03-1-06": {"id": "c07-03-1-06", "unit": "07", "concept": "03", "벌": 1, "k": "c4", "q": "두 조건 $p$, $q$의 진리집합 $P$, $Q$에 대하여 $Q\\subset P$이면 $p$는 $q$이기 위한 ____이다.", "a": "필요조건", "c": ["필요조건", "충분조건", "필요충분조건", "충분조건도 필요조건도 아닌 조건"], "w": "$Q\\subset P$는 $q\\Longrightarrow p$를 뜻하므로 $p$는 필요조건이다. $P=Q$인지는 알 수 없으므로 필요충분조건이라고 할 수 없다.", "key": "C07-03"}, "c07-03-1-07": {"id": "c07-03-1-07", "unit": "07", "concept": "03", "벌": 1, "k": "c4", "q": "실수 $x$에 대하여 $p:x(x-1)=0$, $q:x=0$일 때, $p$는 $q$이기 위한 ____이다.", "a": "필요조건이지만 충분조건은 아닌 조건", "c": ["필요조건이지만 충분조건은 아닌 조건", "충분조건이지만 필요조건은 아닌 조건", "필요충분조건", "충분조건도 필요조건도 아닌 조건"], "w": "$P=\\{0,\\,1\\}$, $Q=\\{0\\}$이므로 $Q\\subset P$이고 $P\\not\\subset Q$($x=1$)이다. 따라서 필요조건이지만 충분조건은 아니다.", "key": "C07-03"}, "c07-03-1-08": {"id": "c07-03-1-08", "unit": "07", "concept": "03", "벌": 1, "k": "c4", "q": "실수 $x$에 대하여 $p:x^{2}<0$, $q:x=5$일 때, $p$는 $q$이기 위한 ____이다.", "a": "충분조건이지만 필요조건은 아닌 조건", "c": ["충분조건이지만 필요조건은 아닌 조건", "필요조건이지만 충분조건은 아닌 조건", "필요충분조건", "충분조건도 필요조건도 아닌 조건"], "w": "$P=\\varnothing$이고 공집합은 모든 집합의 부분집합이므로 $P\\subset Q$이다. $Q\\not\\subset P$이므로 충분조건이지만 필요조건은 아니다.", "key": "C07-03"}, "c07-03-2-01": {"id": "c07-03-2-01", "unit": "07", "concept": "03", "벌": 2, "k": "ox", "q": "$p$가 $q$이기 위한 충분조건이면 $\\sim q$는 $\\sim p$이기 위한 충분조건이다.", "a": "O", "w": "$P\\subset Q$이면 $Q^{C}\\subset P^{C}$이므로 $\\sim q\\Longrightarrow\\sim p$이다. 명제와 그 대우는 참·거짓이 같다.", "key": "C07-03"}, "c07-03-2-02": {"id": "c07-03-2-02", "unit": "07", "concept": "03", "벌": 2, "k": "ox", "q": "$p$가 $q$이기 위한 필요충분조건이면 $p$는 $q$이기 위한 충분조건이기도 하다.", "a": "O", "w": "필요충분조건이면 $p\\Longrightarrow q$가 성립하므로 충분조건이다. ‘충분조건이다’에는 필요충분인 경우도 들어간다.", "key": "C07-03"}, "c07-03-2-03": {"id": "c07-03-2-03", "unit": "07", "concept": "03", "벌": 2, "k": "ox", "q": "실수 $x$에 대하여 $p:x<2$, $q:x\\le 2$이면 $p$는 $q$이기 위한 필요조건이다.", "a": "X", "w": "$P\\subset Q$이고, $x=2$는 $q$를 만족시키지만 $p$를 만족시키지 않으므로 $Q\\not\\subset P$이다. $p$는 충분조건이지만 필요조건은 아니다.", "key": "C07-03"}, "c07-03-2-04": {"id": "c07-03-2-04", "unit": "07", "concept": "03", "벌": 2, "k": "ox", "q": "$p$는 $q$이기 위한 충분조건이고 $q$는 $r$이기 위한 충분조건이면, $r$은 $p$이기 위한 필요조건이다.", "a": "O", "w": "$p\\Longrightarrow q$, $q\\Longrightarrow r$이면 삼단논법으로 $p\\Longrightarrow r$이다. 따라서 $r$은 $p$이기 위한 필요조건이다.", "key": "C07-03"}, "c07-03-2-05": {"id": "c07-03-2-05", "unit": "07", "concept": "03", "벌": 2, "k": "ox", "q": "자연수 $x$에 대하여 $p:x$는 $4$의 배수, $q:x$는 $2$의 배수이면 $p$는 $q$이기 위한 필요조건이다.", "a": "X", "w": "4의 배수는 모두 2의 배수이므로 $P\\subset Q$, 곧 $p$는 충분조건이다. $x=2$는 $q$만 만족시키므로 필요조건은 아니다.", "key": "C07-03"}, "c07-03-2-06": {"id": "c07-03-2-06", "unit": "07", "concept": "03", "벌": 2, "k": "c4", "q": "실수 $x$에 대하여 $p:x>a$, $q:x>3$이다. $p$가 $q$이기 위한 충분조건이 되도록 하는 실수 $a$의 값의 범위는 ____이다.", "a": "$a\\ge 3$", "c": ["$a\\ge 3$", "$a>3$", "$a\\le 3$", "$a<3$"], "w": "$P\\subset Q$이어야 하므로 $a\\ge 3$이다. $a=3$이면 $P=Q$로 포함 관계가 성립하므로 등호를 포함한다.", "key": "C07-03"}, "c07-03-2-07": {"id": "c07-03-2-07", "unit": "07", "concept": "03", "벌": 2, "k": "c4", "q": "실수 $x$에 대하여 $p:0<x<2$, $q:1<x<3$일 때, $p$는 $q$이기 위한 ____이다.", "a": "충분조건도 필요조건도 아닌 조건", "c": ["충분조건도 필요조건도 아닌 조건", "충분조건이지만 필요조건은 아닌 조건", "필요조건이지만 충분조건은 아닌 조건", "필요충분조건"], "w": "$x=\\frac{1}{2}$은 $p$만, $x=\\frac{5}{2}$는 $q$만 만족시키므로 $P\\not\\subset Q$이고 $Q\\not\\subset P$이다.", "key": "C07-03"}, "c07-03-2-08": {"id": "c07-03-2-08", "unit": "07", "concept": "03", "벌": 2, "k": "c4", "q": "$\\sim p$가 $\\sim q$이기 위한 충분조건이면 $p$는 $q$이기 위한 ____이다.", "a": "필요조건", "c": ["필요조건", "충분조건", "필요충분조건", "충분조건도 필요조건도 아닌 조건"], "w": "$\\sim p\\Longrightarrow\\sim q$는 그 대우 $q\\Longrightarrow p$와 같으므로 $p$는 $q$이기 위한 필요조건이다.", "key": "C07-03"}, "c07-04-1-01": {"id": "c07-04-1-01", "unit": "07", "concept": "04", "벌": 1, "k": "ox", "q": "$x<0$일 때 $x+\\dfrac{1}{x}\\ge 2$이다.", "a": "X", "w": "산술평균과 기하평균의 관계는 두 수가 양수일 때만 쓴다. $x<0$이면 $x+\\frac{1}{x}\\le -2$이다(예: $x=-1$일 때 $-2$).", "key": "C07-04"}, "c07-04-1-02": {"id": "c07-04-1-02", "unit": "07", "concept": "04", "벌": 1, "k": "ox", "q": "모든 실수 $a$, $b$에 대하여 $|a|+|b|\\ge|a+b|$이고, 등호는 $ab\\ge 0$일 때 성립한다.", "a": "O", "w": "$(|a|+|b|)^{2}-|a+b|^{2}=2(|ab|-ab)\\ge 0$이고, $|ab|=ab$, 곧 $ab\\ge 0$일 때 등호가 성립한다.", "key": "C07-04"}, "c07-04-1-03": {"id": "c07-04-1-03", "unit": "07", "concept": "04", "벌": 1, "k": "ox", "q": "$x>0$일 때 $x+\\dfrac{4}{x}$의 최솟값은 $4$이다.", "a": "O", "w": "$x+\\frac{4}{x}\\ge 2\\sqrt{x\\cdot\\frac{4}{x}}=4$이고, 등호는 $x=\\frac{4}{x}$, 곧 $x=2$일 때 성립한다.", "key": "C07-04"}, "c07-04-1-04": {"id": "c07-04-1-04", "unit": "07", "concept": "04", "벌": 1, "k": "ox", "q": "귀류법은 명제의 가정을 부정하여 모순이 생김을 보이는 증명 방법이다.", "a": "X", "w": "귀류법은 <b>결론<\/b>을 부정하여 가정이나 이미 알려진 사실에 모순이 생김을 보이는 방법이다.", "key": "C07-04"}, "c07-04-1-05": {"id": "c07-04-1-05", "unit": "07", "concept": "04", "벌": 1, "k": "ox", "q": "실수 $a$, $b$, $x$, $y$에 대하여 $(a^{2}+b^{2})(x^{2}+y^{2})\\ge(ax+by)^{2}$의 등호는 $ax=by$일 때 성립한다.", "a": "X", "w": "(좌변)$-$(우변)$=(ay-bx)^{2}$이므로 등호는 $ay=bx$일 때 성립한다.", "key": "C07-04"}, "c07-04-1-06": {"id": "c07-04-1-06", "unit": "07", "concept": "04", "벌": 1, "k": "c4", "q": "$a>0$, $b>0$이고 $ab=16$일 때 $a+b$의 최솟값은 ____이다.", "a": "$8$", "c": ["$8$", "$4$", "$16$", "$32$"], "w": "$a+b\\ge 2\\sqrt{ab}=2\\cdot 4=8$이고, 등호는 $a=b=4$일 때 성립한다.", "key": "C07-04"}, "c07-04-1-07": {"id": "c07-04-1-07", "unit": "07", "concept": "04", "벌": 1, "k": "c4", "q": "$a>0$, $b>0$일 때 $a+b-2\\sqrt{ab}=$ ____ $\\ge 0$이므로 $\\dfrac{a+b}{2}\\ge\\sqrt{ab}$이다.", "a": "$(\\sqrt{a}-\\sqrt{b})^{2}$", "c": ["$(\\sqrt{a}-\\sqrt{b})^{2}$", "$(a-b)^{2}$", "$(\\sqrt{a}+\\sqrt{b})^{2}$", "$\\sqrt{(a-b)^{2}}$"], "w": "$(\\sqrt{a})^{2}-2\\sqrt{a}\\sqrt{b}+(\\sqrt{b})^{2}=(\\sqrt{a}-\\sqrt{b})^{2}$이고, 제곱이므로 $0$ 이상이다.", "key": "C07-04"}, "c07-04-1-08": {"id": "c07-04-1-08", "unit": "07", "concept": "04", "벌": 1, "k": "c4", "q": "자연수 $n$에 대하여 명제 ‘$n^{2}$이 짝수이면 $n$도 짝수이다.’를 대우를 이용하여 증명하려면 ‘____’가 참임을 보이면 된다.", "a": "$n$이 홀수이면 $n^{2}$도 홀수이다", "c": ["$n$이 홀수이면 $n^{2}$도 홀수이다", "$n$이 짝수이면 $n^{2}$도 짝수이다", "$n^{2}$이 홀수이면 $n$도 홀수이다", "$n$이 홀수이면 $n^{2}$은 짝수이다"], "w": "$p\\to q$의 대우는 $\\sim q\\to\\sim p$이다. 결론 ‘$n$은 짝수’를 부정한 ‘$n$은 홀수’가 가정이 된다. ‘$n$이 짝수이면 $n^{2}$도 짝수’는 역이다.", "key": "C07-04"}, "c07-04-2-01": {"id": "c07-04-2-01", "unit": "07", "concept": "04", "벌": 2, "k": "ox", "q": "$a>0$, $b>0$이고 $a+b=10$일 때 $ab$의 최댓값은 $25$이다.", "a": "O", "w": "$10=a+b\\ge 2\\sqrt{ab}$에서 $\\sqrt{ab}\\le 5$, 곧 $ab\\le 25$이고 등호는 $a=b=5$일 때 성립한다.", "key": "C07-04"}, "c07-04-2-02": {"id": "c07-04-2-02", "unit": "07", "concept": "04", "벌": 2, "k": "ox", "q": "$x\\ge 3$일 때 $x+\\dfrac{1}{x}\\ge 2$이므로 $x+\\dfrac{1}{x}$의 최솟값은 $2$이다.", "a": "X", "w": "등호는 $x=1$일 때 성립하는데 $x=1$은 범위 $x\\ge 3$ 밖이다. 이 범위에서는 $x=3$일 때 최솟값 $\\frac{10}{3}$을 갖는다.", "key": "C07-04"}, "c07-04-2-03": {"id": "c07-04-2-03", "unit": "07", "concept": "04", "벌": 2, "k": "ox", "q": "‘$\\sqrt{2}$는 유리수가 아니다.’를 귀류법으로 증명할 때는 $\\sqrt{2}$가 유리수라고 가정하여 모순을 이끈다.", "a": "O", "w": "귀류법은 결론을 부정하여 시작한다. ‘유리수가 아니다’의 부정 ‘유리수이다’를 가정하고 모순을 보인다.", "key": "C07-04"}, "c07-04-2-04": {"id": "c07-04-2-04", "unit": "07", "concept": "04", "벌": 2, "k": "ox", "q": "실수 $a$, $b$에 대하여 $a^{2}+b^{2}\\ge 2ab$의 등호는 $a=b=0$일 때만 성립한다.", "a": "X", "w": "$a^{2}+b^{2}-2ab=(a-b)^{2}\\ge 0$이므로 등호는 $a=b$일 때 성립한다. $a=b=1$일 때도 등호가 성립한다.", "key": "C07-04"}, "c07-04-2-05": {"id": "c07-04-2-05", "unit": "07", "concept": "04", "벌": 2, "k": "ox", "q": "실수 $x$, $y$에 대하여 $x^{2}+y^{2}=5$이면 $(2x+y)^{2}\\le 25$이다.", "a": "O", "w": "코시-슈바르츠 부등식에서 $(2^{2}+1^{2})(x^{2}+y^{2})\\ge(2x+y)^{2}$이고 좌변은 $5\\cdot 5=25$이다.", "key": "C07-04"}, "c07-04-2-06": {"id": "c07-04-2-06", "unit": "07", "concept": "04", "벌": 2, "k": "c4", "q": "문자가 가질 수 있는 모든 실수 값에 대하여 항상 성립하는 부등식을 ____이라 한다.", "a": "절대부등식", "c": ["절대부등식", "항등식", "이차부등식", "연립부등식"], "w": "예를 들어 $x^{2}+1>0$은 모든 실수 $x$에 대하여 성립하므로 절대부등식이다. 항등식은 항상 성립하는 <b>등식<\/b>이다.", "key": "C07-04"}, "c07-04-2-07": {"id": "c07-04-2-07", "unit": "07", "concept": "04", "벌": 2, "k": "c4", "q": "실수 $x$, $y$에 대하여 $x^{2}+y^{2}=2$일 때 $x+y$의 최댓값은 ____이다.", "a": "$2$", "c": ["$2$", "$4$", "$\\sqrt{2}$", "$1$"], "w": "$(1^{2}+1^{2})(x^{2}+y^{2})\\ge(x+y)^{2}$에서 $(x+y)^{2}\\le 4$이므로 $x+y\\le 2$이고, 등호는 $x=y=1$일 때 성립한다.", "key": "C07-04"}, "c07-04-2-08": {"id": "c07-04-2-08", "unit": "07", "concept": "04", "벌": 2, "k": "c4", "q": "실수 $x$, $y$에 대하여 명제 ‘$x+y>2$이면 $x>1$ 또는 $y>1$이다.’를 귀류법으로 증명하려면 $x+y>2$와 함께 ‘____’를 가정하여 모순을 이끈다.", "a": "$x\\le 1$ 그리고 $y\\le 1$", "c": ["$x\\le 1$ 그리고 $y\\le 1$", "$x\\le 1$ 또는 $y\\le 1$", "$x<1$ 그리고 $y<1$", "$x+y\\le 2$"], "w": "결론 ‘$x>1$ 또는 $y>1$’의 부정은 ‘$x\\le 1$ 그리고 $y\\le 1$’이다. 이를 가정하면 $x+y\\le 2$가 되어 $x+y>2$에 모순이다.", "key": "C07-04"}, "cm05-01-1-01": {"id": "cm05-01-1-01", "unit": "m05", "concept": "01", "벌": 1, "k": "ox", "q": "함수 $f(x)$가 어떤 구간에 속하는 임의의 두 실수 $x_{1}$, $x_{2}$에 대하여 $x_{1}<x_{2}$일 때 $f(x_{1})<f(x_{2})$이면 $f(x)$는 그 구간에서 증가한다.", "a": "O", "w": "증가의 정의 그대로이다. 구간 안의 '임의의' 두 수에 대해 성립해야 한다.", "key": "Cm05-01"}, "cm05-01-1-02": {"id": "cm05-01-1-02", "unit": "m05", "concept": "01", "벌": 1, "k": "ox", "q": "함수 $f(x)$가 어떤 열린구간에서 미분가능하고 그 구간의 모든 $x$에 대하여 $f'(x)>0$이면 $f(x)$는 그 구간에서 증가한다.", "a": "O", "w": "평균값 정리로 $f(x_{2})-f(x_{1})=f'(c)(x_{2}-x_{1})>0$이 되므로 증가한다.", "key": "Cm05-01"}, "cm05-01-1-03": {"id": "cm05-01-1-03", "unit": "m05", "concept": "01", "벌": 1, "k": "ox", "q": "미분가능한 함수 $f(x)$가 어떤 열린구간에서 증가하면 그 구간의 모든 $x$에 대하여 $f'(x)>0$이다.", "a": "X", "w": "역은 성립하지 않는다. $f(x)=x^{3}$은 실수 전체에서 증가하지만 $f'(0)=0$이다.", "key": "Cm05-01"}, "cm05-01-1-04": {"id": "cm05-01-1-04", "unit": "m05", "concept": "01", "벌": 1, "k": "ox", "q": "함수 $f(x)=x^{3}-3x$는 구간 $[1,\\,\\infty)$에서 증가한다.", "a": "O", "w": "$f'(x)=3(x+1)(x-1)$이고 $x>1$에서 $f'(x)>0$이므로 $[1,\\,\\infty)$에서 증가한다.", "key": "Cm05-01"}, "cm05-01-1-05": {"id": "cm05-01-1-05", "unit": "m05", "concept": "01", "벌": 1, "k": "ox", "q": "최고차항의 계수가 양수인 삼차함수 $f(x)$가 실수 전체의 집합에서 증가하기 위한 조건은 $f'(x)=0$의 판별식 $D$가 $D<0$인 것이다.", "a": "X", "w": "$D=0$이어도 $f'(x)\\ge 0$이라 증가한다. 조건은 $D\\le 0$이다.", "key": "Cm05-01"}, "cm05-01-1-06": {"id": "cm05-01-1-06", "unit": "m05", "concept": "01", "벌": 1, "k": "ox", "q": "함수 $f(x)=x^{3}-3x$는 구간 $[-2,\\,0]$에서 감소한다.", "a": "X", "w": "$f'(x)=3(x+1)(x-1)$이므로 $[-2,\\,-1]$에서는 증가한다. 감소하는 구간은 $[-1,\\,1]$이다.", "key": "Cm05-01"}, "cm05-01-1-07": {"id": "cm05-01-1-07", "unit": "m05", "concept": "01", "벌": 1, "k": "c4", "q": "상수함수가 아닌 다항함수 $f(x)$가 어떤 구간에서 증가하기 위한 필요충분조건은 그 구간에서 ____ 인 것이다.", "a": "$f'(x)\\ge 0$", "c": ["$f'(x)\\ge 0$", "$f'(x)>0$", "$f(x)\\ge 0$", "$f'(x)\\ne 0$"], "w": "$f'(x)=0$인 점이 유한 개뿐이라 증가가 끊기지 않으므로 $f'(x)\\ge 0$이다. $f'(x)>0$은 충분조건일 뿐이다($x^{3}$).", "key": "Cm05-01"}, "cm05-01-1-08": {"id": "cm05-01-1-08", "unit": "m05", "concept": "01", "벌": 1, "k": "c4", "q": "함수 $f(x)=x^{3}+3x^{2}-9x$가 감소하는 구간은 ____ 이다.", "a": "$[-3,\\,1]$", "c": ["$[-3,\\,1]$", "$[-1,\\,3]$", "$(-\\infty,\\,-3]$", "$[1,\\,\\infty)$"], "w": "$f'(x)=3(x+3)(x-1)\\le 0$인 구간이 $[-3,\\,1]$이다.", "key": "Cm05-01"}, "cm05-01-2-01": {"id": "cm05-01-2-01", "unit": "m05", "concept": "01", "벌": 2, "k": "ox", "q": "함수 $f(x)=x^{2}$은 구간 $(-\\infty,\\,0]$에서 감소하고 구간 $[0,\\,\\infty)$에서 증가한다.", "a": "O", "w": "$f'(x)=2x$가 $x<0$에서 음, $x>0$에서 양이다. 증가·감소는 구간을 정해 놓고 말한다.", "key": "Cm05-01"}, "cm05-01-2-02": {"id": "cm05-01-2-02", "unit": "m05", "concept": "01", "벌": 2, "k": "ox", "q": "상수함수가 아닌 다항함수 $f(x)$가 어떤 구간에서 $f'(x)\\ge 0$이면 $f(x)$는 그 구간에서 증가한다.", "a": "O", "w": "다항함수는 $f'(x)=0$인 점이 유한 개뿐이므로 $f'(x)\\ge 0$이면 증가한다.", "key": "Cm05-01"}, "cm05-01-2-03": {"id": "cm05-01-2-03", "unit": "m05", "concept": "01", "벌": 2, "k": "ox", "q": "다항함수 $f(x)$가 실수 전체의 집합에서 감소하면 모든 실수 $x$에 대하여 $f'(x)<0$이다.", "a": "X", "w": "$f(x)=-x^{3}$은 실수 전체에서 감소하지만 $f'(0)=0$이다. 맞는 문장은 $f'(x)\\le 0$이다.", "key": "Cm05-01"}, "cm05-01-2-04": {"id": "cm05-01-2-04", "unit": "m05", "concept": "01", "벌": 2, "k": "ox", "q": "최고차항의 계수가 음수인 삼차함수 $f(x)$에서 이차방정식 $f'(x)=0$의 판별식이 $D\\le 0$이면 $f(x)$는 실수 전체의 집합에서 감소한다.", "a": "O", "w": "이차함수 $f'(x)$의 이차항 계수가 음수이고 $D\\le 0$이면 $f'(x)\\le 0$이므로 감소한다.", "key": "Cm05-01"}, "cm05-01-2-05": {"id": "cm05-01-2-05", "unit": "m05", "concept": "01", "벌": 2, "k": "ox", "q": "함수 $f(x)=x^{3}-3x^{2}+3x$는 $f'(1)=0$이므로 실수 전체의 집합에서 증가하지 않는다.", "a": "X", "w": "$f'(x)=3(x-1)^{2}\\ge 0$이므로 실수 전체에서 증가한다. $f'(x)=0$인 점이 있어도 증가할 수 있다.", "key": "Cm05-01"}, "cm05-01-2-06": {"id": "cm05-01-2-06", "unit": "m05", "concept": "01", "벌": 2, "k": "ox", "q": "함수 $f(x)$에 대하여 $f(0)<f(1)<f(2)$이면 $f(x)$는 구간 $[0,\\,2]$에서 증가한다.", "a": "X", "w": "증가는 구간 안의 임의의 두 수에 대해 성립해야 한다. 세 점의 값만으로는 그 사이에서 감소하는 부분이 있을 수 있다.", "key": "Cm05-01"}, "cm05-01-2-07": {"id": "cm05-01-2-07", "unit": "m05", "concept": "01", "벌": 2, "k": "c4", "q": "함수 $f(x)=x^{3}+ax^{2}+3x$가 실수 전체의 집합에서 증가하도록 하는 실수 $a$의 값의 범위는 ____ 이다.", "a": "$-3\\le a\\le 3$", "c": ["$-3\\le a\\le 3$", "$-3<a<3$", "$a\\le -3$ 또는 $a\\ge 3$", "$0\\le a\\le 3$"], "w": "$f'(x)=3x^{2}+2ax+3\\ge 0$이어야 하므로 $\\frac{D}{4}=a^{2}-9\\le 0$, 등호를 포함한다.", "key": "Cm05-01"}, "cm05-01-2-08": {"id": "cm05-01-2-08", "unit": "m05", "concept": "01", "벌": 2, "k": "c4", "q": "함수 $f(x)=-x^{3}+3x$가 증가하는 구간은 ____ 이다.", "a": "$[-1,\\,1]$", "c": ["$[-1,\\,1]$", "$(-\\infty,\\,-1]$", "$[1,\\,\\infty)$", "$[0,\\,\\infty)$"], "w": "$f'(x)=-3(x+1)(x-1)\\ge 0$인 구간은 $[-1,\\,1]$이다.", "key": "Cm05-01"}, "cm05-02-1-01": {"id": "cm05-02-1-01", "unit": "m05", "concept": "02", "벌": 1, "k": "ox", "q": "함수 $f(x)$가 $x=a$를 포함하는 어떤 열린구간에 속하는 모든 $x$에 대하여 $f(x)\\le f(a)$이면 $f(x)$는 $x=a$에서 극대이다.", "a": "O", "w": "극대의 정의 그대로이다. 극대는 $a$ 근처에서만 비교한다.", "key": "Cm05-02"}, "cm05-02-1-02": {"id": "cm05-02-1-02", "unit": "m05", "concept": "02", "벌": 1, "k": "ox", "q": "미분가능한 함수 $f(x)$가 $x=a$에서 극값을 가지면 $f'(a)=0$이다.", "a": "O", "w": "극대이면 $h>0$일 때 평균변화율 $\\le 0$, $h<0$일 때 $\\ge 0$이고 둘 다 $f'(a)$로 수렴하므로 $f'(a)=0$이다.", "key": "Cm05-02"}, "cm05-02-1-03": {"id": "cm05-02-1-03", "unit": "m05", "concept": "02", "벌": 1, "k": "ox", "q": "미분가능한 함수 $f(x)$에서 $f'(a)=0$이면 $f(x)$는 $x=a$에서 극값을 갖는다.", "a": "X", "w": "역은 성립하지 않는다. $f(x)=x^{3}$은 $f'(0)=0$이지만 좌우에서 $f'(x)>0$이라 극값이 없다.", "key": "Cm05-02"}, "cm05-02-1-04": {"id": "cm05-02-1-04", "unit": "m05", "concept": "02", "벌": 1, "k": "ox", "q": "미분가능한 함수 $f(x)$에서 $f'(a)=0$이고 $x=a$의 좌우에서 $f'(x)$의 부호가 음에서 양으로 바뀌면 $x=a$에서 극대이다.", "a": "X", "w": "왼쪽에서 감소, 오른쪽에서 증가하므로 극소이다. 양에서 음으로 바뀌어야 극대이다.", "key": "Cm05-02"}, "cm05-02-1-05": {"id": "cm05-02-1-05", "unit": "m05", "concept": "02", "벌": 1, "k": "ox", "q": "함수의 극댓값은 항상 극솟값보다 크다.", "a": "X", "w": "극값은 그 점 근처에서만 비교한 값이므로, 멀리 떨어진 극댓값이 극솟값보다 작을 수도 있다.", "key": "Cm05-02"}, "cm05-02-1-06": {"id": "cm05-02-1-06", "unit": "m05", "concept": "02", "벌": 1, "k": "ox", "q": "최고차항의 계수가 양수인 삼차함수가 극값을 가지면, $x$가 작은 쪽에서 극대, 큰 쪽에서 극소이다.", "a": "O", "w": "$f'(x)$의 부호가 $+,\\,-,\\,+$로 바뀌므로 작은 근에서 극대, 큰 근에서 극소이다.", "key": "Cm05-02"}, "cm05-02-1-07": {"id": "cm05-02-1-07", "unit": "m05", "concept": "02", "벌": 1, "k": "c4", "q": "함수 $f(x)=x^{3}-3x^{2}$의 극솟값은 ____ 이다.", "a": "$-4$", "c": ["$-4$", "$0$", "$2$", "$-2$"], "w": "$f'(x)=3x(x-2)$이고 $x=2$의 좌우에서 음에서 양으로 바뀌므로 극솟값은 $f(2)=-4$이다. $2$는 극소인 $x$의 값이다.", "key": "Cm05-02"}, "cm05-02-1-08": {"id": "cm05-02-1-08", "unit": "m05", "concept": "02", "벌": 1, "k": "c4", "q": "미분가능한 함수 $f(x)$에 대하여 $f'(a)=0$은 $f(x)$가 $x=a$에서 극값을 갖기 위한 ____.", "a": "필요조건이지만 충분조건이 아니다", "c": ["필요조건이지만 충분조건이 아니다", "충분조건이지만 필요조건이 아니다", "필요충분조건이다", "필요조건도 충분조건도 아니다"], "w": "극값이면 $f'(a)=0$(필요)이지만, $x^{3}$처럼 $f'(a)=0$이어도 극값이 없을 수 있다(충분 아님).", "key": "Cm05-02"}, "cm05-02-2-01": {"id": "cm05-02-2-01", "unit": "m05", "concept": "02", "벌": 2, "k": "ox", "q": "함수 $f(x)=x^{3}+1$은 $f'(0)=0$이지만 $x=0$에서 극값을 갖지 않는다.", "a": "O", "w": "$f'(x)=3x^{2}$은 $x=0$의 좌우에서 모두 양이라 부호가 바뀌지 않는다.", "key": "Cm05-02"}, "cm05-02-2-02": {"id": "cm05-02-2-02", "unit": "m05", "concept": "02", "벌": 2, "k": "ox", "q": "정의역에 속하는 모든 $x$에 대하여 $f(x)\\ge f(a)$일 때에만 $f(x)$는 $x=a$에서 극소라고 한다.", "a": "X", "w": "극소는 $x=a$를 포함하는 어떤 열린구간(근처)의 모든 $x$에 대하여 $f(x)\\ge f(a)$이면 된다. 정의역 전체 비교는 최솟값이다.", "key": "Cm05-02"}, "cm05-02-2-03": {"id": "cm05-02-2-03", "unit": "m05", "concept": "02", "벌": 2, "k": "ox", "q": "함수가 $x=a$에서 극값 $k$를 갖는다는 조건을 $f'(a)=0$, $f(a)=k$로 세워 미정계수를 구하면, 구한 함수는 반드시 $x=a$에서 극값을 갖는다.", "a": "X", "w": "$f'(a)=0$은 필요조건일 뿐이다. 예: $f(x)=x^{3}+bx$에서 $f'(0)=0$이면 $b=0$인데 $x^{3}$은 극값이 없다. 좌우 부호 변화를 확인해야 한다.", "key": "Cm05-02"}, "cm05-02-2-04": {"id": "cm05-02-2-04", "unit": "m05", "concept": "02", "벌": 2, "k": "ox", "q": "상수함수가 아닌 다항함수 $f(x)$가 $x=a$에서 극대이면 $x=a$의 좌우에서 $f'(x)$의 부호가 양에서 음으로 바뀐다.", "a": "O", "w": "다항함수의 극값은 $f'(x)$의 부호가 바뀌는 점에서만 생기고, 극대이면 왼쪽 증가·오른쪽 감소이다.", "key": "Cm05-02"}, "cm05-02-2-05": {"id": "cm05-02-2-05", "unit": "m05", "concept": "02", "벌": 2, "k": "ox", "q": "최고차항의 계수가 음수인 삼차함수 $f(x)$가 $x=\\alpha$, $x=\\beta\\,(\\alpha<\\beta)$에서 극값을 가지면 $x=\\alpha$에서 극대이다.", "a": "X", "w": "계수가 음수이면 $f'(x)$의 부호가 $-,\\,+,\\,-$이므로 $x=\\alpha$에서 극소, $x=\\beta$에서 극대이다.", "key": "Cm05-02"}, "cm05-02-2-06": {"id": "cm05-02-2-06", "unit": "m05", "concept": "02", "벌": 2, "k": "ox", "q": "함수 $f(x)=x^{3}-3x$의 극댓값은 $2$, 극솟값은 $-2$이다.", "a": "O", "w": "$f'(x)=3(x+1)(x-1)$이므로 극댓값 $f(-1)=2$, 극솟값 $f(1)=-2$이다.", "key": "Cm05-02"}, "cm05-02-2-07": {"id": "cm05-02-2-07", "unit": "m05", "concept": "02", "벌": 2, "k": "c4", "q": "함수 $f(x)=-x^{3}+3x^{2}+1$은 $x=$ ____ 에서 극대이다.", "a": "$2$", "c": ["$2$", "$0$", "$5$", "$1$"], "w": "$f'(x)=-3x(x-2)$의 부호가 $x=2$에서 양에서 음으로 바뀌므로 $x=2$에서 극대(극댓값 $5$)이다.", "key": "Cm05-02"}, "cm05-02-2-08": {"id": "cm05-02-2-08", "unit": "m05", "concept": "02", "벌": 2, "k": "c4", "q": "상수함수가 아닌 다항함수 $f(x)$에서 $f'(a)=0$이지만 $x=a$의 좌우에서 $f'(x)$의 부호가 바뀌지 않으면, $f(x)$는 $x=a$에서 ____.", "a": "극값을 갖지 않는다", "c": ["극값을 갖지 않는다", "극대이다", "극소이다", "극대 또는 극소이다"], "w": "부호가 바뀌지 않으면 $a$의 양쪽에서 함께 증가(또는 감소)하므로 극값이 아니다.", "key": "Cm05-02"}, "cm05-03-1-01": {"id": "cm05-03-1-01", "unit": "m05", "concept": "03", "벌": 1, "k": "ox", "q": "$y=f'(x)$의 그래프가 $x=2$에서 $x$축을 위에서 아래로 지나면 $f(x)$는 $x=2$에서 극소이다.", "a": "X", "w": "위에서 아래로 지나면 $f'(x)$의 부호가 양에서 음으로 바뀌므로 극대이다. 아래에서 위로 지날 때가 극소이다.", "key": "Cm05-03"}, "cm05-03-1-02": {"id": "cm05-03-1-02", "unit": "m05", "concept": "03", "벌": 1, "k": "ox", "q": "다항함수 $f(x)$에 대하여 $y=f'(x)$의 그래프가 열린구간 $(-1,\\,3)$에서 $x$축보다 위쪽에 있으면 $f(-1)<f(3)$이다.", "a": "O", "w": "이 구간에서 $f'(x)>0$이므로 $f(x)$는 증가하고, 따라서 $f(-1)<f(3)$이다.", "key": "Cm05-03"}, "cm05-03-1-03": {"id": "cm05-03-1-03", "unit": "m05", "concept": "03", "벌": 1, "k": "ox", "q": "$f'(x)$가 $x=1$에서 최솟값을 가지면 $f(x)$는 $x=1$에서 극소이다.", "a": "X", "w": "$y=f'(x)$의 꼭짓점은 $f(x)$의 극값과 관계없다. 극값은 $f'(x)$의 부호가 바뀌는 점에서 생긴다.", "key": "Cm05-03"}, "cm05-03-1-04": {"id": "cm05-03-1-04", "unit": "m05", "concept": "03", "벌": 1, "k": "ox", "q": "$f'(x)=(x-2)^{2}$이면 $f(x)$는 $x=2$에서 극값을 갖지 않는다.", "a": "O", "w": "$y=f'(x)$의 그래프가 $x=2$에서 $x$축에 접하기만 하고 지나가지 않아 부호가 바뀌지 않으므로 극값이 없다.", "key": "Cm05-03"}, "cm05-03-1-05": {"id": "cm05-03-1-05", "unit": "m05", "concept": "03", "벌": 1, "k": "ox", "q": "$y=f'(x)$의 그래프가 $x$축보다 위쪽에 있는 구간에서는 $y=f(x)$의 그래프도 $x$축보다 위쪽에 있다.", "a": "X", "w": "$f'(x)>0$은 그 구간에서 $f(x)$가 증가한다는 뜻일 뿐, $f(x)$의 값(높이)이 양수라는 뜻이 아니다.", "key": "Cm05-03"}, "cm05-03-1-06": {"id": "cm05-03-1-06", "unit": "m05", "concept": "03", "벌": 1, "k": "c4", "q": "$x=a$의 좌우에서 $f'(x)$의 부호가 음에서 양으로 바뀌면 $f(x)$는 $x=a$에서 ____이다.", "a": "극소", "c": ["극소", "극대", "극값을 갖지 않는 점", "감소하는 점"], "w": "감소하다가 증가하므로 $f(a)$가 근처에서 가장 작다. 즉 극소이다.", "key": "Cm05-03"}, "cm05-03-1-07": {"id": "cm05-03-1-07", "unit": "m05", "concept": "03", "벌": 1, "k": "c4", "q": "다항함수 $f(x)$에서 $f'(x)=x(x-3)^{2}$일 때, $f(x)$가 극값을 갖는 $x$의 값은 ____.", "a": "$x=0$ 뿐이다", "c": ["$x=0$ 뿐이다", "$x=0$, $x=3$이다", "$x=3$ 뿐이다", "없다"], "w": "$f'(x)$의 부호는 $x=0$에서 음에서 양으로 바뀌지만, $x=3$에서는 $(x-3)^{2}\\ge 0$이라 양에서 양으로 그대로이다. 극값은 $x=0$에서만 생긴다.", "key": "Cm05-03"}, "cm05-03-1-08": {"id": "cm05-03-1-08", "unit": "m05", "concept": "03", "벌": 1, "k": "c4", "q": "$y=f'(x)$의 그래프만으로 알 수 있는 것은 $f(x)$의 ____이고, 극댓값 자체는 $f(x)$에 대입해야 구해진다.", "a": "극값의 위치", "c": ["극값의 위치", "극댓값의 크기", "$y$절편", "함숫값의 부호"], "w": "도함수의 부호는 증가·감소와 극값의 위치를 정할 뿐이다. 극댓값은 $f(x)$의 식에 넣어야 나온다.", "key": "Cm05-03"}, "cm05-03-2-01": {"id": "cm05-03-2-01", "unit": "m05", "concept": "03", "벌": 2, "k": "ox", "q": "$f'(x)=x^{3}$이면 $y=f'(x)$의 그래프가 원점에서 $x$축에 접하므로 $f(x)$는 $x=0$에서 극값을 갖지 않는다.", "a": "X", "w": "$y=x^{3}$은 원점에서 $x$축에 접하면서 지나가므로 부호가 음에서 양으로 바뀐다. 따라서 $f(x)$는 $x=0$에서 극소이다.", "key": "Cm05-03"}, "cm05-03-2-02": {"id": "cm05-03-2-02", "unit": "m05", "concept": "03", "벌": 2, "k": "ox", "q": "다항함수 $f(x)$에서 $x<1$일 때 $f'(x)<0$, $f'(1)=0$, $x>1$일 때 $f'(x)<0$이면 $f(x)$는 실수 전체의 집합에서 감소한다.", "a": "O", "w": "$f'(x)\\le 0$이고 $f'(x)=0$인 점이 $x=1$ 하나뿐이므로 감소가 끊기지 않는다.", "key": "Cm05-03"}, "cm05-03-2-03": {"id": "cm05-03-2-03", "unit": "m05", "concept": "03", "벌": 2, "k": "ox", "q": "$y=f'(x)$의 그래프가 열린구간 $(0,\\,4)$에서 $x$축보다 아래쪽에 있고 $x=2$에서 가장 낮으면, 닫힌구간 $[0,\\,4]$에서 $f(x)$는 $x=2$일 때 최소이다.", "a": "X", "w": "이 구간에서 $f'(x)<0$이므로 $f(x)$는 계속 감소한다. 최솟값은 $x=4$에서 나온다. 가장 낮은 점은 감소가 가장 가파른 곳일 뿐이다.", "key": "Cm05-03"}, "cm05-03-2-04": {"id": "cm05-03-2-04", "unit": "m05", "concept": "03", "벌": 2, "k": "ox", "q": "$f'(x)=-(x+1)(x-3)$이면 $f(x)$는 $x=3$에서 극대이다.", "a": "O", "w": "$-1<x<3$에서 $f'(x)>0$, $x>3$에서 $f'(x)<0$이므로 $x=3$의 좌우에서 부호가 양에서 음으로 바뀐다. 극대이다.", "key": "Cm05-03"}, "cm05-03-2-05": {"id": "cm05-03-2-05", "unit": "m05", "concept": "03", "벌": 2, "k": "ox", "q": "다항함수 $f(x)$에서 $f'(x)$의 부호가 양에서 음으로 바뀌는 점에서 $y=f(x)$의 그래프의 접선의 기울기는 $0$이다.", "a": "O", "w": "그 점은 극대이고, 미분가능한 함수가 극값을 가지면 $f'(a)=0$이다. 접선의 기울기가 곧 $f'(a)$이다.", "key": "Cm05-03"}, "cm05-03-2-06": {"id": "cm05-03-2-06", "unit": "m05", "concept": "03", "벌": 2, "k": "c4", "q": "다항함수 $f(x)$에서 $f'(x)$의 부호가 $x<-2$일 때 양, $-2<x<1$일 때 음, $x>1$일 때 음이면 $f(x)$는 ____.", "a": "$x=-2$에서만 극값을 갖는다", "c": ["$x=-2$에서만 극값을 갖는다", "$x=-2$에서 극대, $x=1$에서 극소이다", "$x=1$에서만 극값을 갖는다", "극값을 갖지 않는다"], "w": "부호가 바뀌는 점은 $x=-2$(양→음, 극대)뿐이다. $x=1$에서는 음→음이라 극값이 아니다.", "key": "Cm05-03"}, "cm05-03-2-07": {"id": "cm05-03-2-07", "unit": "m05", "concept": "03", "벌": 2, "k": "c4", "q": "$y=f'(x)$의 그래프가 $x=-1$, $2$, $5$에서만 $x$축과 만나고 세 점에서 모두 부호가 바뀌며, $x>5$에서 $f'(x)>0$이면 $f(x)$가 극대가 되는 $x$의 값은 ____이다.", "a": "$x=2$", "c": ["$x=2$", "$x=5$", "$x=-1$", "$x=-1$, $x=5$"], "w": "부호는 오른쪽부터 $+,\\,-,\\,+,\\,-$이므로 $x=2$에서 양→음(극대), $x=-1$, $x=5$에서 음→양(극소)이다.", "key": "Cm05-03"}, "cm05-03-2-08": {"id": "cm05-03-2-08", "unit": "m05", "concept": "03", "벌": 2, "k": "c4", "q": "$f'(x)=x^{2}-4$인 함수 $f(x)$는 구간 ____에서 감소한다.", "a": "$[-2,\\,2]$", "c": ["$[-2,\\,2]$", "$(-\\infty,\\,-2]$, $[2,\\,\\infty)$", "$(-\\infty,\\,0]$", "$[-4,\\,4]$"], "w": "$f'(x)=(x+2)(x-2)\\le 0$인 구간은 $[-2,\\,2]$이다. $y=f'(x)$의 꼭짓점 $x=0$은 증감과 관계없다.", "key": "Cm05-03"}, "cm05-04-1-01": {"id": "cm05-04-1-01", "unit": "m05", "concept": "04", "벌": 1, "k": "ox", "q": "삼차함수 $f(x)$에서 이차방정식 $f'(x)=0$의 판별식 $D$가 $D\\ge 0$이면 $f(x)$는 극값을 갖는다.", "a": "X", "w": "$D=0$이면 중근이라 부호가 바뀌지 않는다. 극값을 가질 조건은 $D>0$이다.", "key": "Cm05-04"}, "cm05-04-1-02": {"id": "cm05-04-1-02", "unit": "m05", "concept": "04", "벌": 1, "k": "ox", "q": "삼차함수가 극값을 가지면 극댓값과 극솟값을 하나씩 갖는다.", "a": "O", "w": "$D>0$이면 $f'(x)=0$의 서로 다른 두 실근에서 부호가 각각 바뀌어 극대 하나, 극소 하나가 생긴다.", "key": "Cm05-04"}, "cm05-04-1-03": {"id": "cm05-04-1-03", "unit": "m05", "concept": "04", "벌": 1, "k": "ox", "q": "함수 $f(x)=x^{3}+3x^{2}+3x$는 극값을 갖지 않는다.", "a": "O", "w": "$f'(x)=3(x+1)^{2}\\ge 0$이라 $x=-1$의 좌우에서 부호가 바뀌지 않는다.", "key": "Cm05-04"}, "cm05-04-1-04": {"id": "cm05-04-1-04", "unit": "m05", "concept": "04", "벌": 1, "k": "ox", "q": "함수 $f(x)=x^{3}-3ax$가 극값을 갖지 않도록 하는 실수 $a$의 값의 범위는 $a<0$이다.", "a": "X", "w": "$f'(x)=3x^{2}-3a$이므로 극값이 없을 조건은 $D\\le 0$, 곧 $a\\le 0$이다. $a=0$을 빠뜨리면 안 된다.", "key": "Cm05-04"}, "cm05-04-1-05": {"id": "cm05-04-1-05", "unit": "m05", "concept": "04", "벌": 1, "k": "ox", "q": "최고차항의 계수가 양수인 사차함수는 항상 극솟값을 갖는다.", "a": "O", "w": "$f'(x)$는 최고차항의 계수가 양수인 삼차식이라 음에서 양으로 바뀌는 점이 반드시 있다. 그 점에서 극소이다.", "key": "Cm05-04"}, "cm05-04-1-06": {"id": "cm05-04-1-06", "unit": "m05", "concept": "04", "벌": 1, "k": "c4", "q": "삼차함수 $f(x)$가 극값을 갖지 않을 조건은 이차방정식 $f'(x)=0$의 판별식 $D$에 대하여 ____이다.", "a": "$D\\le 0$", "c": ["$D\\le 0$", "$D<0$", "$D=0$", "$D\\ge 0$"], "w": "$D<0$이면 부호가 일정하고, $D=0$이면 중근이라 부호가 바뀌지 않는다. 둘을 합쳐 $D\\le 0$이다.", "key": "Cm05-04"}, "cm05-04-1-07": {"id": "cm05-04-1-07", "unit": "m05", "concept": "04", "벌": 1, "k": "c4", "q": "함수 $f(x)=x^{3}-6x^{2}+kx$가 극값을 갖도록 하는 실수 $k$의 값의 범위는 ____이다.", "a": "$k<12$", "c": ["$k<12$", "$k\\le 12$", "$k>12$", "$k<36$"], "w": "$f'(x)=3x^{2}-12x+k$에서 $\\dfrac{D}{4}=36-3k>0$이므로 $k<12$이다. 등호는 중근이라 제외한다.", "key": "Cm05-04"}, "cm05-04-1-08": {"id": "cm05-04-1-08", "unit": "m05", "concept": "04", "벌": 1, "k": "c4", "q": "최고차항의 계수가 양수인 사차함수 $f(x)$가 극댓값을 가질 조건은 삼차방정식 $f'(x)=0$이 ____ 것이다.", "a": "서로 다른 세 실근을 갖는", "c": ["서로 다른 세 실근을 갖는", "실근을 하나 이상 갖는", "중근을 갖는", "서로 다른 두 실근을 갖는"], "w": "부호가 $-,\\,+,\\,-,\\,+$로 세 번 바뀌어야 극소·극대·극소가 생긴다. 그러려면 서로 다른 세 실근이 필요하다.", "key": "Cm05-04"}, "cm05-04-2-01": {"id": "cm05-04-2-01", "unit": "m05", "concept": "04", "벌": 2, "k": "ox", "q": "삼차함수 $f(x)$가 실수 전체의 집합에서 증가하면 $f(x)$는 극값을 갖지 않는다.", "a": "O", "w": "실수 전체에서 증가하면 감소로 바뀌는 점이 없으므로 극대도 극소도 생기지 않는다.", "key": "Cm05-04"}, "cm05-04-2-02": {"id": "cm05-04-2-02", "unit": "m05", "concept": "04", "벌": 2, "k": "ox", "q": "함수 $f(x)=-x^{3}+3x^{2}+kx$가 극값을 갖도록 하는 실수 $k$의 값의 범위는 $k>-3$이다.", "a": "O", "w": "$f'(x)=-3x^{2}+6x+k=0$에서 $\\dfrac{D}{4}=9+3k>0$이므로 $k>-3$이다. 최고차항의 계수가 음수여도 조건은 $D>0$이다.", "key": "Cm05-04"}, "cm05-04-2-03": {"id": "cm05-04-2-03", "unit": "m05", "concept": "04", "벌": 2, "k": "ox", "q": "삼차함수 $f(x)$에서 이차방정식 $f'(x)=0$의 판별식이 양수이면 $f(x)$는 열린구간 $(0,\\,2)$에서 극댓값과 극솟값을 모두 갖는다.", "a": "X", "w": "판별식이 양수여도 두 실근이 $(0,\\,2)$ 밖에 있을 수 있다. 두 실근이 모두 이 구간 안에 있어야 한다.", "key": "Cm05-04"}, "cm05-04-2-04": {"id": "cm05-04-2-04", "unit": "m05", "concept": "04", "벌": 2, "k": "ox", "q": "함수 $f(x)=x^{3}+kx$는 $k=0$일 때 극값을 갖는다.", "a": "X", "w": "$k=0$이면 $f'(x)=3x^{2}\\ge 0$이라 부호가 바뀌지 않는다. 극값을 가질 조건은 $k<0$이다.", "key": "Cm05-04"}, "cm05-04-2-05": {"id": "cm05-04-2-05", "unit": "m05", "concept": "04", "벌": 2, "k": "ox", "q": "최고차항의 계수가 양수인 사차함수 $f(x)$에서 삼차방정식 $f'(x)=0$이 한 중근과 그와 다른 한 실근만 가지면 $f(x)$는 극댓값을 갖지 않는다.", "a": "O", "w": "중근에서는 $f'(x)$의 부호가 바뀌지 않으므로 부호는 한 번만(음→양) 바뀐다. 극솟값 하나만 생긴다.", "key": "Cm05-04"}, "cm05-04-2-06": {"id": "cm05-04-2-06", "unit": "m05", "concept": "04", "벌": 2, "k": "c4", "q": "삼차함수 $f(x)$가 열린구간 $(\\alpha,\\,\\beta)$에서 극댓값과 극솟값을 모두 가질 조건은 $f'(x)=0$이 ____ 것이다.", "a": "이 구간에서 서로 다른 두 실근을 갖는", "c": ["이 구간에서 서로 다른 두 실근을 갖는", "서로 다른 두 실근을 갖는", "이 구간에서 실근을 하나 이상 갖는", "이 구간에서 중근을 갖는"], "w": "두 극값이 모두 구간 안에 있으려면 부호가 바뀌는 두 점, 곧 서로 다른 두 실근이 모두 그 구간 안에 있어야 한다.", "key": "Cm05-04"}, "cm05-04-2-07": {"id": "cm05-04-2-07", "unit": "m05", "concept": "04", "벌": 2, "k": "c4", "q": "삼차함수가 주어진 구간에서 극값을 가질 조건은 판별식만으로 정할 수 없고, ____을 함께 본다.", "a": "축의 위치와 구간 양 끝에서 $f'(x)$의 값", "c": ["축의 위치와 구간 양 끝에서 $f'(x)$의 값", "구간 양 끝에서 $f(x)$의 값", "$f(x)$의 상수항", "최고차항의 계수의 부호"], "w": "이차함수 $f'(x)$의 근이 구간 안에 있는지는 판별식, 축의 위치, 양 끝에서 $f'(x)$의 부호로 정한다.", "key": "Cm05-04"}, "cm05-04-2-08": {"id": "cm05-04-2-08", "unit": "m05", "concept": "04", "벌": 2, "k": "c4", "q": "최고차항의 계수가 음수인 삼차함수가 극값을 가지면, 극값을 갖는 두 $x$의 값 중 작은 쪽에서 ____을 갖는다.", "a": "극솟값", "c": ["극솟값", "극댓값", "최솟값", "최댓값"], "w": "최고차항의 계수가 음수이면 $f'(x)$의 부호가 $-,\\,+,\\,-$ 순이라 작은 쪽에서 극소, 큰 쪽에서 극대이다.", "key": "Cm05-04"}, "cm05-05-1-01": {"id": "cm05-05-1-01", "unit": "m05", "concept": "05", "벌": 1, "k": "ox", "q": "열린구간 $(a,\\,b)$에서 연속인 함수는 반드시 최댓값과 최솟값을 갖는다.", "a": "X", "w": "최대·최소 정리는 닫힌구간에서만 성립한다. 예를 들어 $f(x)=x$는 열린구간 $(0,\\,1)$에서 최댓값이 없다.", "key": "Cm05-05"}, "cm05-05-1-02": {"id": "cm05-05-1-02", "unit": "m05", "concept": "05", "벌": 1, "k": "ox", "q": "닫힌구간에서 미분가능한 함수 $f(x)$가 구간의 안쪽에 있는 점에서 최댓값을 가지면 $f(x)$는 그 점에서 극대이다.", "a": "O", "w": "구간의 안쪽이면 그 점 근처의 모든 $x$에 대하여 $f(x)\\le$ 최댓값이므로 극대의 정의를 만족한다.", "key": "Cm05-05"}, "cm05-05-1-03": {"id": "cm05-05-1-03", "unit": "m05", "concept": "05", "벌": 1, "k": "ox", "q": "함수 $f(x)=x^{2}-2x$의 닫힌구간 $[0,\\,3]$에서의 최솟값은 $f(0)=0$이다.", "a": "X", "w": "구간 안의 $x=1$에서 극솟값 $f(1)=-1$이 있으므로 최솟값은 $-1$이다. 끝값만 보면 안 된다.", "key": "Cm05-05"}, "cm05-05-1-04": {"id": "cm05-05-1-04", "unit": "m05", "concept": "05", "벌": 1, "k": "ox", "q": "함수 $f(x)=x^{3}-3x$의 닫힌구간 $[0,\\,3]$에서의 최댓값은 $f(3)=18$이다.", "a": "O", "w": "구간 안의 극값은 극솟값 $f(1)=-2$뿐이고, $f(0)=0$, $f(3)=18$과 비교하면 최댓값은 $18$이다.", "key": "Cm05-05"}, "cm05-05-1-05": {"id": "cm05-05-1-05", "unit": "m05", "concept": "05", "벌": 1, "k": "ox", "q": "미분가능한 함수 $f(x)$가 닫힌구간 안에서 극값을 극솟값 하나만 가지면, 그 극솟값이 이 구간에서의 최솟값이다.", "a": "O", "w": "극값이 하나뿐이면 그 왼쪽에서 감소, 오른쪽에서 증가하므로 그 극솟값이 구간 전체에서 가장 작다.", "key": "Cm05-05"}, "cm05-05-1-06": {"id": "cm05-05-1-06", "unit": "m05", "concept": "05", "벌": 1, "k": "c4", "q": "함수 $f(x)=-x^{2}+4x$의 닫힌구간 $[0,\\,1]$에서의 최댓값은 ____이다.", "a": "$3$", "c": ["$3$", "$4$", "$0$", "$2$"], "w": "꼭짓점 $x=2$는 구간 밖이라 후보가 아니다. 구간에서 $f(x)$는 증가하므로 최댓값은 $f(1)=3$이다.", "key": "Cm05-05"}, "cm05-05-1-07": {"id": "cm05-05-1-07", "unit": "m05", "concept": "05", "벌": 1, "k": "c4", "q": "극값은 ____에서 비교한 값이고, 최댓값·최솟값은 정의역 전체에서 비교한 값이다.", "a": "그 점의 근처", "c": ["그 점의 근처", "구간의 양 끝", "정의역 전체", "$f'(x)=0$인 점끼리"], "w": "극대·극소는 $x=a$를 포함하는 어떤 열린구간 안에서만 비교한 것이다. 그래서 극댓값이 최댓값이 아닐 수 있다.", "key": "Cm05-05"}, "cm05-05-1-08": {"id": "cm05-05-1-08", "unit": "m05", "concept": "05", "벌": 1, "k": "c4", "q": "둘레의 길이가 $20$인 직사각형의 가로의 길이를 $x$라 하면 넓이는 $x(10-x)$이다. 이때 $x$의 범위는 ____이다.", "a": "$0<x<10$", "c": ["$0<x<10$", "$0<x<20$", "$x>0$", "$0\\le x\\le 20$"], "w": "세로의 길이 $10-x$도 양수여야 하므로 $0<x<10$이다. 활용 문제는 변수의 범위부터 적는다.", "key": "Cm05-05"}, "cm05-05-2-01": {"id": "cm05-05-2-01", "unit": "m05", "concept": "05", "벌": 2, "k": "ox", "q": "함수 $f(x)=x^{3}-3x$는 닫힌구간 $[-2,\\,3]$에서 극댓값 $2$를 가지므로, 이 구간에서 $f(x)$의 최댓값은 $2$이다.", "a": "X", "w": "최댓값은 극값과 구간 양 끝의 함숫값 중 가장 큰 값이다. $f(-2)=-2$, $f(3)=18$이므로 최댓값은 $18$이다.", "key": "Cm05-05"}, "cm05-05-2-02": {"id": "cm05-05-2-02", "unit": "m05", "concept": "05", "벌": 2, "k": "ox", "q": "함수 $f(x)=x^{3}-3x^{2}$의 닫힌구간 $[-1,\\,3]$에서의 최솟값은 $-4$이다.", "a": "O", "w": "극솟값 $f(2)=-4$, 극댓값 $f(0)=0$, 끝값 $f(-1)=-4$, $f(3)=0$을 비교하면 최솟값은 $-4$이다.", "key": "Cm05-05"}, "cm05-05-2-03": {"id": "cm05-05-2-03", "unit": "m05", "concept": "05", "벌": 2, "k": "ox", "q": "다항함수 $f(x)$가 열린구간 $(a,\\,b)$에서 $f'(x)>0$이면, 닫힌구간 $[a,\\,b]$에서 $f(x)$의 최댓값은 $f(b)$이다.", "a": "O", "w": "$f(x)$가 $[a,\\,b]$에서 증가하므로 오른쪽 끝에서 가장 크다. 극값이 없을 때는 끝값이 곧 최대·최소이다.", "key": "Cm05-05"}, "cm05-05-2-04": {"id": "cm05-05-2-04", "unit": "m05", "concept": "05", "벌": 2, "k": "ox", "q": "실수 전체의 집합에서 정의된 다항함수는 항상 최댓값을 갖는다.", "a": "X", "w": "최대·최소 정리는 닫힌구간에서의 이야기이다. $f(x)=x^{3}$이나 $f(x)=x^{2}$은 실수 전체에서 최댓값이 없다.", "key": "Cm05-05"}, "cm05-05-2-05": {"id": "cm05-05-2-05", "unit": "m05", "concept": "05", "벌": 2, "k": "ox", "q": "닫힌구간에서 최댓값을 구할 때, $f'(x)=0$인 $x$가 그 구간 밖에 있으면 그 점의 함숫값은 후보에서 뺀다.", "a": "O", "w": "후보는 구간 안의 극값과 양 끝의 함숫값뿐이다. 구간 밖의 점은 정의역에 없다.", "key": "Cm05-05"}, "cm05-05-2-06": {"id": "cm05-05-2-06", "unit": "m05", "concept": "05", "벌": 2, "k": "c4", "q": "함수 $f(x)=x^{3}-12x$의 닫힌구간 $[0,\\,3]$에서의 최솟값은 ____이다.", "a": "$-16$", "c": ["$-16$", "$-9$", "$0$", "$16$"], "w": "$f'(x)=3(x+2)(x-2)$이므로 구간 안의 극솟값 $f(2)=-16$을 $f(0)=0$, $f(3)=-9$와 비교하면 최솟값은 $-16$이다.", "key": "Cm05-05"}, "cm05-05-2-07": {"id": "cm05-05-2-07", "unit": "m05", "concept": "05", "벌": 2, "k": "c4", "q": "함수 $f(x)=x^{3}-3x+k$의 닫힌구간 $[0,\\,2]$에서의 최솟값이 $1$이면 $k=$ ____이다.", "a": "$3$", "c": ["$3$", "$1$", "$-1$", "$5$"], "w": "구간 안의 극솟값 $f(1)=k-2$가 $f(0)=k$, $f(2)=k+2$보다 작으므로 $k-2=1$, $k=3$이다.", "key": "Cm05-05"}, "cm05-05-2-08": {"id": "cm05-05-2-08", "unit": "m05", "concept": "05", "벌": 2, "k": "c4", "q": "닫힌구간 $[a,\\,b]$에서 연속인 함수의 최댓값을 구할 때 비교할 후보는 ____이다.", "a": "구간 안의 극값과 $f(a)$, $f(b)$", "c": ["구간 안의 극값과 $f(a)$, $f(b)$", "구간 안의 극값뿐", "$f(a)$와 $f(b)$뿐", "$f'(x)=0$인 모든 $x$에서의 함숫값"], "w": "최댓값을 주는 점은 구간 안쪽이면 극대이고, 아니면 끝점이다. 그래서 극값과 양 끝 값을 비교한다.", "key": "Cm05-05"}, "x07x39-001": {"id": "x07x39-001", "unit": "07", "theme": "01", "벌": "X07x39", "lvl": 1, "fix": true, "src": "문제집 고쟁이", "w": "명제는 참, 거짓을 명확히 판별할 수 있는 문장이나 식이고 조건은 변수의 값에 따라 참, 거짓을 결정할 수 있는 문장이나 식이다.<br>ㄱ. ‘$1+2<5$’는 참이므로 명제이다.<br>ㄴ. ‘$3x-2=1$’은 $x$의 값에 따라 참, 거짓을 결정할 수 있으므로 조건이다.<br>따라서 명제가 아니다.<br>ㄷ. ‘$x=1$이면 $2x+1=4$이다.’는 거짓이므로 명제이다.<br>ㄹ. ‘한국에서 가장 아름다운 것은 제주도이다.’에서 아름답다는 그 기준이 명확하지 않으므로 참, 거짓을 결정할 수 없다. 따라서 명제가 아니다.<br>ㅁ. ‘삼각형의 세 내각의 크기의 합은 $360°$이다.’는 거짓이므로 명제이다.<br>따라서 명제인 것은 ㄱ, ㄷ, ㅁ으로 $3$개이다.", "k": "c5", "c": ["$1$", "$2$", "$3$", "$4$", "$5$"], "a": "$3$", "q": "다음 <보기> 중 명제인 것의 개수는?<br><b><보기><\/b><br>ㄱ. $1+2<5$<br>ㄴ. $3x-2=1$<br>ㄷ. $x=1$이면 $2x+1=4$이다.<br>ㄹ. 한국에서 가장 아름다운 곳은 제주도이다.<br>ㅁ. 삼각형의 세 내각의 크기의 합은 $360°$이다.", "key": "T07-01"}, "x07x39-003": {"id": "x07x39-003", "unit": "07", "theme": "01", "벌": "X07x39", "lvl": 1, "fix": true, "src": "문제집 고쟁이", "w": "① [반례] $3$은 $3$의 배수이지만 $6$의 배수가 아니다. (거짓)<br>② [반례] $x=-1$일 때 $x^{2}=1$이지만 $x\\ne 1$이다. (거짓)<br>③ 조건 $x-2>0$에서 $x>2$, 조건 $2x+1>3$에서 $x>1$이므로 $x-2>0$이면 $2x+1>3$이다. (참)<br>④ [반례] $x=1,\\;y=1$일 때 $xy=1$로 홀수이지만 $x+y=2$로 짝수이다. (거짓)<br>⑤ [반례] 한 쌍의 대변만 평행한 사다리꼴은 평행사변형이 아니다.  (거짓)<br>따라서 참인 명제는 ③이다.", "k": "c5", "c": ["$3$의 배수는 $6$의 배수이다.", "$x^{2}=1$이면 $x=1$이다.", "$x-2>0$이면 $2x+1>3$이다.", "두 자연수 $x,\\;y$에 대하여 $xy$가 홀수이면 $x+y$도 홀수이다.", "사각형 $ABCD$가 사다리꼴이면 사각형 $ABCD$는 평행사변형이다."], "a": "$x-2>0$이면 $2x+1>3$이다.", "q": "다음 중 참인 명제는?", "key": "T07-01"}, "x07x20-030": {"id": "x07x20-030", "unit": "07", "theme": "01", "벌": "X07x20", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "① $6+3=9>8$이므로 거짓인 명제이다.<br>② $\\sqrt{4}=2$는 유리수이므로 거짓인 명제이다.<br>③ $x>4$이면 $x+1>5$이므로 참인 명제이다..<br>④ $x$의 값에 따라 참, 거짓이 달라지므로 명제가 아니다.<br>⑤ $16$의 양의 약수는 $1,\\;2,\\;4,\\;8,\\;16$의 $5$개이므로 참인 명제이다.", "k": "c5", "c": ["$6+3<8$", "$\\sqrt{4}$는 무리수이다.", "$x>4$이면 $x+1>5$이다.", "$x$는 $10$ 이하의 소수이다.", "$16$의 양의 약수의 개수는 $5$이다."], "a": "$x$는 $10$ 이하의 소수이다.", "q": "다음 중 명제가 아닌 것은?", "key": "T07-01"}, "x07x20-035": {"id": "x07x20-035", "unit": "07", "theme": "01", "벌": "X07x20", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "$(a-b)^{2}+(b-c)^{2}+(c-a)^{2}=0$의 부정은<br>$(a-b)^{2}+(b-c)^{2}+(c-a)^{2}\\ne 0$<br>$\\therefore \\;a\\ne b$ 또는 $b\\ne c$ 또는 $c\\ne a$<br>즉 $a,\\;b,\\;c$ 중에 서로 다른 것이 적어도 하나 있다.", "k": "c5", "c": ["$(a-b)(b-c)(c-a)\\ne 0$", "$a,\\;b,\\;c$는 서로 다르다.", "$a\\ne b$이고 $b\\ne c$이고 $c\\ne a$", "$(a-b)(b-c)(c-a)>0$", "$a,\\;b,\\;c$ 중에 서로 다른 것이 적어도 하나 있다."], "a": "$a,\\;b,\\;c$ 중에 서로 다른 것이 적어도 하나 있다.", "q": "다음 중 임의의 세 실수 $a,\\;b,\\;c$에 대하여<br> $(a-b)^{2}+(b-c)^{2}+(c-a)^{2}=0$<br>의 부정과 서로 같은 것은?", "key": "T07-01"}, "x07x30-044": {"id": "x07x30-044", "unit": "07", "theme": "01", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "① $x$의 값에 따라 참, 거짓이 달라지므로 명제가 아니다.<br>②, ④, ⑤ 참인 명제이다.<br>③ 거짓인 명제이다.", "k": "c5", "c": ["$2x+8>-x-1$", "$6$의 약수는 $12$의 약수이다.", "$x=1$이면 $x-4=3$이다.", "두 자연수 $a,\\;b$가 홀수이면 $a+b$는 짝수이다.", "두 직선이 만날 때 생기는 맞꼭지각의 크기는 서로 같다."], "a": "$2x+8>-x-1$", "q": "다음 중 명제가 아닌 것은?", "key": "T07-01"}, "x07x30-046": {"id": "x07x30-046", "unit": "07", "theme": "01", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "① 참인 명제이다.<br>② 참, 거짓을 판별할 수 없으므로 명제가 아니다.<br>③ 거짓인 명제이다.<br>④ $x$의 값에 따라 참, 거짓이 달라지므로 명제가 아니다.<br>⑤ $-x+3\\ge 1-x$에서 $3\\ge 1$이므로 참인 명제이다.", "k": "c5", "c": ["$\\pi $는 무리수이다.", "$0.9999$는 $1$에 가까운 수이다.", "소수는 모두 홀수이다.", "$x^{2}\\le 2x-1$", "$-x+3\\ge 1-x$"], "a": "소수는 모두 홀수이다.", "q": "다음 중 거짓인 명제인 것은?", "key": "T07-01"}, "x07x30-047": {"id": "x07x30-047", "unit": "07", "theme": "01", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "‘$p$ 또는 $\\sim q$’의 부정은 ‘$\\sim p$ 그리고 $q$’<br>$\\sim p\\,:\\,x\\le -2$ 또는 $x>3,\\;q\\,:\\,-3\\le x<5$이므로<br>‘$\\sim p$ 그리고 $q$’ 는<br>$-3\\le x\\le -2$ 또는 $3<x<5$", "k": "c5", "c": ["$-3\\le x<5$", "$x<-3$ 또는 $x\\ge 5$", "$x\\le -2$ 또는 $x>3$", "$-3\\le x\\le -2$ 또는 $3<x<5$", "$-3\\le x<-2$ 또는 $3\\le \\,x<5$"], "a": "$-3\\le x\\le -2$ 또는 $3<x<5$", "q": "두 조건 $p\\,:\\,-2<x\\le 3,\\;q\\,:\\,-3\\le x<5$에 대하여 조건 ‘$p$ 또는 $\\sim q$’의 부정은?", "key": "T07-01"}, "x07x30-049": {"id": "x07x30-049", "unit": "07", "theme": "01", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "‘$(a-b)^{2}+(b-c)^{2}+(c-a)^{2}=0$’의 부정은<br>‘$(a-b)^{2}+(b-c)^{2}+(c-a)^{2}\\ne 0$’<br>이므로<br>$(a-b)^{2}\\ne 0$ 또는 $(b-c)^{2}\\ne 0$ 또는 $(c-a)^{2}\\ne 0$<br>$\\therefore \\;a\\ne b$ 또는 $b\\ne c$ 또는 $c\\ne a$<br>즉 $a,\\;b,\\;c$ 중 서로 다른 것이 적어도 하나 있다.", "k": "c5", "c": ["$(a-b)(b-c)(c-a)=0$", "$a\\ne b$이고 $b\\ne c$이고 $c\\ne a$", "$(a-b)(b-c)(c-a)\\ne 0$", "$a,\\;b,\\;c$ 중 서로 같은 것이 적어도 하나 있다.", "$a,\\;b,\\;c$ 중 서로 다른 것이 적어도 하나 있다."], "a": "$a,\\;b,\\;c$ 중 서로 다른 것이 적어도 하나 있다.", "q": "다음 중 임의의 세 실수 $a,\\;b,\\;c$에 대하여 조건<br> ‘$(a-b)^{2}+(b-c)^{2}+(c-a)^{2}=0$’<br>의 부정과 서로 같은 것은?", "key": "T07-01"}, "x07x39-035": {"id": "x07x39-035", "unit": "07", "theme": "01", "벌": "X07x39", "lvl": 2, "fix": true, "src": "문제집 고쟁이", "w": "조건 ‘집합 $X$의 원소 중 $10$보다 작은 수는 많아야 $4$개이다.’의 의미는 집합 $X$의 원소 중 $10$보다 작은 수가 $0$개~$4$개일 수 있다는 것이므로 그 부정은 집합 $X$의 원소 중 $10$보다 작은 수가 $5$개 이상임을 의미한다.<br>즉, 주어진 조건의 부정은<br>‘③ 집합 $X$의 원소 중 적어도 $5$개는 $10$보다 작다.’이다.", "k": "c5", "c": ["집합 $X$의 원소 중 많아야 $4$개는 $10$ 이상이다.", "집합 $X$의 원소 중 적어도 $4$개는 $10$보다 작다.", "집합 $X$의 원소 중 적어도 $5$개는 $10$보다 작다.", "집합 $X$의 원소 중 $10$ 이상인 수가 $4$개 이상이다.", "집합 $X$의 원소 중 $10$ 이상인 수가 적어도 $5$개이다."], "a": "집합 $X$의 원소 중 적어도 $5$개는 $10$보다 작다.", "q": "조건<br> ‘집합 $X$의 원소 중 $10$보다 작은 수는 많아야 $4$개이다.’<br>의 부정으로 옳은 것은?", "key": "T07-01"}, "x07x39-039": {"id": "x07x39-039", "unit": "07", "theme": "01", "벌": "X07x39", "lvl": 2, "fix": true, "src": "문제집 고쟁이", "w": "두 조건 $p$, $q$의 진리집합을 각각 $P,\\;Q$라 하면<br>$P=\\{x\\,\\mid \\,x\\le $ 또는 $x\\ge 5\\}$, $Q=\\{x\\,\\left|\\,-3\\le x\\le k\\right\\}$이다.<br>명제 $\\sim q\\;\\to \\;p$의 반례가 될 수 있는 값은 $Q^{C}$의 원소이면서 집합 $P$의 원소가 아니어야 하므로 $Q^{C}-P=Q^{C}\\cap P^{C}$의 원소이다.<br>집합 $Q^{C}=\\{x\\,\\mid \\,x<-$ 또는 $x>k\\}$이고 $P^{C}=\\{x\\,\\left|\\,2<x<5\\right\\}$이므로<br>따라서 집합 $Q^{C}\\cap P^{C}$에 정수인 원소는 $x=4$뿐이려면 $3\\le k<4$이어야 한다.", "k": "c5", "c": ["$k<4$", "$k\\ge 5$", "$2\\le k<3$", "$3\\le k<4$", "$4\\le k<5$"], "a": "$3\\le k<4$", "q": "두 조건<br> $p\\,:\\,x\\le 2$ 또는 $x\\ge 5$, $q\\,:\\,-3\\le x\\le k$<br>에 대하여 명제 $\\sim q\\;\\to \\;p$가 거짓임을 보이는 양의 정수인 반례가 $x=4$뿐일 때, 실수 $k$의 범위는?", "key": "T07-01"}, "x07x39-040": {"id": "x07x39-040", "unit": "07", "theme": "01", "벌": "X07x39", "lvl": 2, "fix": true, "src": "문제집 고쟁이", "w": "명제 $p\\;\\to \\;q$가 참이 되려면 $-3\\le x\\le 1$에서 함수 $y=ax^{2}+4ax-9$의 최댓값이 $0$보다 작거나 같아야 한다.<br>$y=ax^{2}+4ax-9=a(x+2)^{2}-4a-9$<br>실수 $a$의 범위에 따라 나누어 생각하면 다음과 같다.<br>(ⅰ) $a=0$일 때<br>함수 $y=-9\\le 0$이므로 조건을 만족한다.<br>(ⅱ) $a>0$일 때<br>$-3\\le x\\le 1$에서 함수 $y=a(x+2)^{2}-4a-9$는 $x=1$일 때 최대이므로<br>$9a-4a-9\\le 0,\\;5a\\le 9,\\;a\\le \\dfrac{9}{5}$<br>따라서 $0<a\\le \\dfrac{9}{5}$<br>이므로 정수 $a$는 $1$의 $1$개이다.<br>(ⅲ) $a<0$일 때<br>$-3\\le x\\le 1$에서 함수 $y=a(x+2)^{2}-4a-9$는 $x=-2$일 때 최대이므로<br>$-4a-9\\le 0,\\;4a\\ge -9,\\;a\\ge -\\dfrac{9}{4}$<br>따라서 $-\\dfrac{9}{4}\\le a<0$이므로 정수 $a$는 $-1,\\;-2$의 $2$개이다.<br>(ⅰ)~(ⅲ)에서 구하는 정수 $a$의 개수는<br>$1+1+2=4$", "k": "c5", "c": ["$1$", "$2$", "$3$", "$4$", "$5$"], "a": "$4$", "q": "두 조건<br> $p\\,:\\,-3\\le x\\le 1$<br> $q\\,:\\,ax^{2}+4ax-9\\le 0$<br>에 대하여 명제 $p\\;\\to \\;q$가 참이 되도록 하는 정수 $a$의 개수는?", "key": "T07-01"}, "x07x39-045": {"id": "x07x39-045", "unit": "07", "theme": "01", "벌": "X07x39", "lvl": 2, "fix": true, "src": "문제집 고쟁이", "w": "세 학생이 간 곳을 $○$, 가지 않은 곳을 $×$로 표기하여 문제의 상황을 나타내면 다음과 같다.<br> 독서실농구장극장영훈$○$인수$×$민지$×$<br>주어진 상황에 모순이 없으려면 각 행(가로)와 열(세로)마다 ○가 $1$개, $×$가 $2$개씩 표시되어야 한다.<br>(ⅰ) 영훈이의 말이 참이 경우<br> 독서실농구장극장영훈$○$인수민지$×$<br>인수와 민지의 말은 거짓이므로 영훈이와 인수는 농구장에 갔고, 민지는 극장에 갔다.<br>이때 농구장에 간 사람이 두 명이므로 모순이다.<br>따라서 영훈이의 말은 거짓이다.<br>(ⅱ) 인수의 말의 참인 경우<br> 독서실농구장극장영훈$×$인수$×$민지$×○$<br>영훈이와 민지의 말은 거짓이므로 영훈이와 인수는 농구장에 가지 않았고, 민지는 극장에 갔다.<br>이때 농구장에 간 사람이 아무도 없어 모순이다.<br>따라서 인수의 말은 거짓이다.<br>(ⅲ) 민지의 말이 참인 경우<br> 독서실농구장극장영훈$××○$인수$×○×$민지$○××$<br>영훈이와 인수의 말은 거짓이므로 영훈이는 농구장에 가지 않았고, 인수는 농구장에 갔고, 민지는 극장에 가지 않았다.<br>이때 민지는 독서실, 영훈이는 극장에 간 것이 되며, 모순이 없으므로 민지의 말이 참이다.<br>(ⅰ)~(ⅲ)에 의하여 모순이 없는 민지의 말이 참이어야 하므로 독서실, 농구장, 극장에 간 사람을 차례대로 나타내면 민지, 인수, 영훈이다.", "k": "c5", "c": ["영훈, 인수, 민지", "영훈, 민지, 인수", "인수, 영훈, 민지", "민지, 인수, 영훈", "민지, 영훈, 인수"], "a": "민지, 인수, 영훈", "q": "학교 수업이 끝난 후 영훈, 인수, 민지는 독서실, 농구장, 극장 중 각각 서로 다른 곳에 갔다. 나중에 세 사람은 다음과 같이 말하였다.<br>영훈$:$나는 농구장에 갔다.인수$:$나는 농구장에 가지 않았다.민지$:$나는 극장에 가지 않았다.<br>위의 세 명의 말 중 하나만 참일 때, 독서실, 농구장, 극장에 간 사람을 차례대로 바르게 나타낸 것은?", "key": "T07-01"}, "x07x47-001": {"id": "x07x47-001", "unit": "07", "theme": "01", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "① $x$의 값에 따라 참, 거짓이 달라지므로 명제가 아니다.", "k": "c5", "c": ["$x+4=5$", "$0$은 자연수이다.", "$4$의 배수는 $2$의 배수이다.", "$1\\,\\mathrm{kg}$은 $100\\,\\mathrm{g}$이다.", "삼각형의 외각의 크기의 합은 $360°$이다."], "a": "$x+4=5$", "q": "다음 중 명제가 아닌 것은?", "key": "T07-01"}, "x07x47-002": {"id": "x07x47-002", "unit": "07", "theme": "01", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "ㄱ, ㄹ. 거짓인 명제<br>ㄷ, ㅂ. 참인 명제<br>ㄴ, ㅁ. $x$의 값에 따라 참, 거짓이 달라지므로 명제가 아니다.<br>따라서 <보기>에서 명제인 것은 ㄱ, ㄷ, ㄹ, ㅂ의 $4$개이다.", "k": "c5", "c": ["$2$", "$3$", "$4$", "$5$", "$6$"], "a": "$4$", "q": "<보기>에서 명제인 것의 개수는?<br><b><보기><\/b><br>ㄱ. $3+2=6$       <br>ㄴ. $x=4+5$<br>ㄷ. $x+4=x+3+1$     <br>ㄹ. $x-5=2x+3-x$<br>ㅁ. $x+5<3x$       <br>ㅂ. $x>x-1$", "key": "T07-01"}, "x07x47-004": {"id": "x07x47-004", "unit": "07", "theme": "01", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "① 부정 : $-3$의 제곱은 $9$가 아니다. (거짓)<br>② 부정 : $\\sqrt{3}-1$은 무리수가 아니다. (거짓)<br>③ 부정 : $5$는 소수가 아니다. (거짓)<br>④ 부정 : $3$은 집합 $\\left\\{1,\\;2\\right\\}$의 원소가 아니다. (참)<br>⑤ 부정 : $6$의 양의 약수의 합은 $12$가 아니다. (거짓)<br>따라서 부정이 참인 명제인 것은 ④이다.", "k": "c5", "c": ["$-3$의 제곱은 $9$이다.", "$\\sqrt{3}-1$은 무리수이다.", "$5$는 소수이다.", "$3$은 집합 $\\left\\{1,\\;2\\right\\}$의 원소이다.", "$6$의 양의 약수의 합은 $12$이다."], "a": "$3$은 집합 $\\left\\{1,\\;2\\right\\}$의 원소이다.", "q": "다음 명제 중 그 부정이 참인 명제인 것은?", "key": "T07-01"}, "x07x68-007": {"id": "x07x68-007", "unit": "07", "theme": "01", "벌": "X07x68", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "$(a-b)^{2}+(b-c)^{2}+(c-a)^{2}=0$에서<br>$a-b=0$이고 $b-c=0$이고 $c-a=0$<br>$\\therefore \\;a=b=c$<br>따라서 $a=b=c$의 부정은<br>$a\\ne b$ 또는 $b\\ne c$ 또는 $c\\ne a$<br>이와 같은 표현은<br>⑤ $a$, $b$, $c$ 중에서 서로 다른 것이 적어도 하나 있다.", "k": "c5", "c": ["$(a-b)(b-c)(c-a)=0$", "$a\\ne b$,$b\\ne c$, $c\\ne a$", "$(a-b)(b-c)(c-a)\\ne 0$", "$a$, $b$, $c$는 서로 다르다.", "$a$, $b$, $c$ 중에서 서로 다른 것이 적어도 하나 있다."], "a": "$a$, $b$, $c$ 중에서 서로 다른 것이 적어도 하나 있다.", "q": "$a$, $b$, $c$가 실수일 때, 다음 중 $(a-b)^{2}+(b-c)^{2}+(c-a)^{2}=0$의 부정과 서로 같은 것은?", "key": "T07-01"}, "x07x20-038": {"id": "x07x20-038", "unit": "07", "theme": "02", "벌": "X07x20", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "$-4\\le x<2$에서  $x\\ge -4$ 그리고 $x<2$<br>$p\\,:\\,x<-4$에서  $\\sim p\\,:\\,x\\ge -4$<br>$q\\,:\\,x\\ge 2$에서  $\\sim q\\,:\\,x<2$<br>따라서 조건 ‘$-4\\le x<2$’는 ‘$\\sim p$ 그리고 $\\sim q$’이므로 구하는 진리집합은 $P^{C}\\cap Q^{C}=(P\\cup Q)^{C}$", "k": "c5", "c": ["$P\\cup Q$", "$P\\cap Q$", "$P^{C}\\cap Q$", "$(P\\cup Q)^{C}$", "$(P\\cap Q)^{C}$"], "a": "$(P\\cup Q)^{C}$", "q": "실수 전체의 집합에서 두 조건 $p\\,:\\,x<-4,\\;q\\,:\\,x\\ge 2$의 진리집합을 각각 $P,\\;Q$라 할 때, 다음 중 조건 ‘$-4\\le x<2$’의 진리 집합을 나타내는 것은?", "key": "T07-02"}, "x07x20-039": {"id": "x07x20-039", "unit": "07", "theme": "02", "벌": "X07x20", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "① [반례] $x=-1$이면 $x^{2}=1$이지만 $x\\ne 1$이다.<br>② [반례] $x=3,\\;y=-1$이면 $x+y=2>0$이지만 $xy=-3<0$이다.<br>③ $|\\,x\\,|>1$이면 $x<-1$ 또는 $x>1$이므로 $x^{2}>1$이다.<br>④ [반례] $x=0$이면 $-1<x<1$이지만 $x^{2}=0$이다.<br>⑤ [반례] 이웃하는 두 변의 길이가 서로 다른 직사각형은 네 각이 모두 직각인 사각형이지만 정사각형은 아니다.<br>따라서 참인 명제는 ③이다.", "k": "c5", "c": ["$x^{2}=1$이면 $x=1$이다.", "$x+y>0$이면 $xy>0$이다.", "$|\\,x\\,|>1$이면 $x^{2}>1$이다.", "$-1<x<1$이면 $x^{2}>0$이다.", "네 각이 모두 직각인 사각형은 정사각형이다."], "a": "$|\\,x\\,|>1$이면 $x^{2}>1$이다.", "q": "다음 중 참인 명제는? (단, $x,\\;y$는 실수이다.)", "key": "T07-02"}, "x07x30-051": {"id": "x07x30-051", "unit": "07", "theme": "02", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "두 진리집합 $P,\\;Q$를 수직선 위에 나타내면 오른쪽 그림과 같다.<br>또 조건 ‘$-1<x\\le 3$’의 진리집합을 수직선 위에 나타내면 오른쪽 그림과 같으므로 구하는 집합은<br>$P^{C}\\cap Q^{C}=(P\\cup Q)^{C}$", "k": "c5", "c": ["$P\\cap Q$", "$P\\cup Q^{C}$", "$P^{C}\\cup Q$", "$(P\\cap Q)^{C}$", "$(P\\cup Q)^{C}$"], "a": "$(P\\cup Q)^{C}$", "q": "실수 전체의 집합에서 두 조건 $p\\,:\\,x>3$, $q\\,:\\,x\\le -1$의 진리집합을 각각 $P,\\;Q$라 할 때, 다음 중 조건 ‘$-1<x\\le 3$’의 진리집합을 나타내는 것은?", "key": "T07-02"}, "x07x30-054": {"id": "x07x30-054", "unit": "07", "theme": "02", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "① [반례] $x=-1$이면 $x^{2}+x=0$이지만 $x<0$이다.<br>② [반례] $x=-2$, $y=-1$, $z=1$이면 $x<y<z$이지만 $xy>yz$이다.<br>④ [반례] $x=1$, $y=0$이면 $x^{2}+y^{2}>0$이지만 $y=0$이다.<br>⑤ [반례] $x=0$, $y=1$이면 $xy=0$이지만 $x^{2}+y^{2}\\ne 0$이다.", "k": "c5", "c": ["$x^{2}+x=0$이면 $x\\ge 0$이다.", "$x<y<z$이면 $xy<yz$이다.", "$x\\le 1$, $y\\le 1$이면 $x+y\\le 2$이다.", "$x^{2}+y^{2}>0$이면 $x\\ne 0$, $y\\ne 0$이다.", "$xy=0$이면 $x^{2}+y^{2}=0$이다."], "a": "$x\\le 1$, $y\\le 1$이면 $x+y\\le 2$이다.", "q": "$x,\\;y,\\;z$가 실수일 때, 다음 명제 중 참인 것은?", "key": "T07-02"}, "x07x30-061": {"id": "x07x30-061", "unit": "07", "theme": "02", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "명제 $\\sim p\\to q$가 참이므로<br>$P^{C}\\subset Q$<br>따라서 오른쪽 그림에서<br>$P\\cup Q=U$", "k": "c5", "c": ["$Q\\subset P$", "$P\\subset Q^{C}$", "$P\\cap Q=\\varnothing $", "$P\\cup Q=U$", "$P-Q=\\varnothing $"], "a": "$P\\cup Q=U$", "q": "전체집합 $U$에 대하여 두 조건 $p,\\;q$의 진리집합을 각각 $P,\\;Q$라 하자. 명제 $\\sim p\\to q$가 참일 때,
