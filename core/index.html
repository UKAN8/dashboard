건인 것의 개수를 구하시오.\nㄱ. $p: |x|+|y|=0$, $q: x^{2}+y^{2}=0$\nㄴ. $p: |x+y|=|x|+|y|$, $q: xy\\ge 0$\nㄷ. $p: x\\ne 0$ 또는 $y\\ne 0$, $q: x+y\\ne 0$\nㄹ. $p: x>y$, $q: x^{3}>y^{3}$\nㅁ. $p: x>y$, $q: x^{2}>y^{2}$", "a": "3", "lvl": 3, "w": "[핵심] 두 진리집합이 같은지(서로 포함하는지) 본다.\nㄱ. 둘 다 $x=y=0$ → ○. ㄴ. $|x|+|y|\\ge|x+y|$의 등호 조건이 $xy\\ge 0$ → ○\nㄷ. $x=1$, $y=-1$은 $p$는 만족, $q$는 아님 → ×\nㄹ. $x^{3}-y^{3}=(x-y)(x^{2}+xy+y^{2})$이고 $x\\ne y$이면 $x^{2}+xy+y^{2}>0$ → ○\nㅁ. $x=1$, $y=-2$ → $p$는 참, $q$는 거짓 → ×. 따라서 3개", "key": "T07-09"}, "t07-10-1": {"id": "t07-10-1", "unit": "07", "theme": "10", "벌": 1, "k": "num", "q": "실수 $x$에 대하여 두 조건\n$p: x^{2}-2x-8\\le 0$, $q: |x-a|\\le 2$\n가 있다. $p$가 $q$이기 위한 필요조건이 되도록 하는 모든 정수 $a$의 값의 합을 구하시오.", "a": "3", "lvl": 2, "w": "[핵심] '$p$가 $q$이기 위한 필요조건' ⇔ $Q\\subset P$.\n$P=\\{x\\,|\\,-2\\le x\\le 4\\}$, $Q=\\{x\\,|\\,a-2\\le x\\le a+2\\}$\n$-2\\le a-2$이고 $a+2\\le 4$ → $0\\le a\\le 2$ (끝점은 등호 포함 가능)\n정수 $a=0,\\,1,\\,2$ → 합 $3$", "key": "T07-10"}, "t07-10-2": {"id": "t07-10-2", "unit": "07", "theme": "10", "벌": 2, "k": "num", "q": "실수 $x$에 대하여 두 조건\n$p: x^{2}+ax+b\\le 0$, $q: x<-1$ 또는 $x>5$\n가 있다. $\\sim p$가 $q$이기 위한 필요충분조건일 때, 두 상수 $a$, $b$에 대하여 $ab$의 값을 구하시오.", "a": "20", "lvl": 2, "w": "[핵심] $\\sim p$의 진리집합 $P^{C}$가 $Q$와 같다 ⇔ $P=Q^{C}$.\n$Q^{C}=\\{x\\,|\\,-1\\le x\\le 5\\}$이므로 $x^{2}+ax+b\\le 0$의 해가 $-1\\le x\\le 5$\n$x^{2}+ax+b=(x+1)(x-5)=x^{2}-4x-5$ → $a=-4$, $b=-5$\n$ab=20$", "key": "T07-10"}, "t07-10-3": {"id": "t07-10-3", "unit": "07", "theme": "10", "벌": 3, "k": "num", "q": "실수 $x$에 대하여 세 조건\n$p: |x-2|\\le a$, $q: x^{2}-2x-3\\le 0$, $r: |x+1|\\le b$\n가 있다. $p$는 $q$이기 위한 충분조건이고, $r$은 $q$이기 위한 필요조건이다. 양수 $a$의 최댓값을 $M$, 양수 $b$의 최솟값을 $m$이라 할 때, $M+m$의 값을 구하시오.", "a": "5", "lvl": 3, "w": "[핵심] 충분조건 → $P\\subset Q$, 필요조건 → $Q\\subset R$.\n$Q=\\{x\\,|\\,-1\\le x\\le 3\\}$, $P=\\{x\\,|\\,2-a\\le x\\le 2+a\\}$, $R=\\{x\\,|\\,-1-b\\le x\\le -1+b\\}$\n$P\\subset Q$: $2-a\\ge -1$, $2+a\\le 3$ → $a\\le 1$ → $M=1$\n$Q\\subset R$: $-1-b\\le -1$, $-1+b\\ge 3$ → $b\\ge 4$ → $m=4$\n$M+m=5$", "key": "T07-10"}, "t07-11-1": {"id": "t07-11-1", "unit": "07", "theme": "11", "벌": 1, "k": "num", "q": "다음은 자연수 $n$에 대하여 명제 '$n^{2}$이 3의 배수이면 $n$도 3의 배수이다.'가 참임을 대우를 이용하여 증명한 것이다.\n[증명] 대우 '$n$이 3의 배수가 아니면 $n^{2}$도 3의 배수가 아니다.'를 보이자.\n$n$이 3의 배수가 아니면 $n=3k+1$ 또는 $n=3k+2$ ($k$는 음이 아닌 정수)이다.\n(i) $n=3k+1$이면 $n^{2}=3\\times$ (가) $+1$\n(ii) $n=3k+2$이면 $n^{2}=3\\times$ (나) $+1$\n따라서 $n^{2}$은 3의 배수가 아니므로 대우가 참이고, 주어진 명제도 참이다.\n(가), (나)에 알맞은 식을 각각 $f(k)$, $g(k)$라 할 때, $f(1)+g(1)$의 값을 구하시오.", "a": "13", "lvl": 2, "w": "[핵심] 대우 $\\sim q\\to\\sim p$: '3의 배수가 아닌 $n$'을 나머지로 나누어 직접 제곱한다.\n$(3k+1)^{2}=9k^{2}+6k+1=3(3k^{2}+2k)+1$ → $f(k)=3k^{2}+2k$\n$(3k+2)^{2}=9k^{2}+12k+4=3(3k^{2}+4k+1)+1$ → $g(k)=3k^{2}+4k+1$\n$f(1)+g(1)=5+8=13$", "key": "T07-11"}, "t07-11-2": {"id": "t07-11-2", "unit": "07", "theme": "11", "벌": 2, "k": "c5", "q": "다음은 $\\sqrt{3}$이 무리수임을 귀류법으로 증명한 것이다.\n[증명] $\\sqrt{3}$이 유리수라고 가정하면 $\\sqrt{3}=\\dfrac{m}{n}$ ($m$, $n$은 (가)인 자연수)으로 나타낼 수 있다.\n양변을 제곱하면 $m^{2}=3n^{2}$이므로 $m^{2}$은 3의 배수이고, 따라서 $m$도 3의 배수이다.\n$m=3k$ ($k$는 자연수)라 하면 $9k^{2}=3n^{2}$, 곧 $n^{2}=$ (나) 이므로 $n$도 3의 배수이다.\n이것은 $m$, $n$이 (가)라는 가정에 모순이므로 $\\sqrt{3}$은 (다)이다.\n(가), (나), (다)에 알맞은 것을 차례대로 나열한 것은?", "a": "서로소, $3k^{2}$, 무리수", "c": ["서로소, $3k^{2}$, 무리수", "서로소, $3k$, 무리수", "서로소, $9k^{2}$, 무리수", "홀수, $3k^{2}$, 무리수", "서로소, $3k^{2}$, 유리수"], "lvl": 2, "w": "[핵심] 귀류법: 결론('무리수')을 부정해 '유리수 = 기약분수 $\\frac{m}{n}$'으로 두고 모순을 이끈다.\n(가) 기약분수로 놓으므로 $m$, $n$은 서로소\n(나) $9k^{2}=3n^{2}$의 양변을 3으로 나누면 $n^{2}=3k^{2}$\n$m$, $n$이 모두 3의 배수 → 서로소에 모순 → (다) 무리수", "key": "T07-11"}, "t07-11-3": {"id": "t07-11-3", "unit": "07", "theme": "11", "벌": 3, "k": "num", "q": "실수 $a$, $b$, $c$에 대하여 명제\n'$a+2b+3c\\ge k$이면 $a\\ge 1$ 또는 $b\\ge 2$ 또는 $c\\ge 3$이다.'\n가 참이 되도록 하는 실수 $k$의 최솟값을 구하시오.", "a": "14", "lvl": 3, "w": "[핵심] 결론에 '또는'이 있으면 대우로 바꾼다. 대우: '$a<1$이고 $b<2$이고 $c<3$이면 $a+2b+3c<k$'.\n$a<1$, $b<2$, $c<3$이면 $a+2b+3c<1+4+9=14$이고, 이 값은 14에 얼마든지 가까워질 수 있다.\n따라서 대우가 참 ⇔ $k\\ge 14$ ($k<14$이면 $a=b=c$를 각 상한에 충분히 가깝게 잡은 반례가 있다)\n최솟값 $14$", "key": "T07-11"}, "t07-12-1": {"id": "t07-12-1", "unit": "07", "theme": "12", "벌": 1, "k": "c5", "q": "다음은 $a>0$, $b>0$일 때 부등식 $\\dfrac{a+b}{2}\\ge\\dfrac{2ab}{a+b}$가 성립함을 증명한 것이다.\n[증명] $\\dfrac{a+b}{2}-\\dfrac{2ab}{a+b}=$ (가) $\\ge 0$\n따라서 주어진 부등식이 성립하고, 등호는 (나)일 때 성립한다.\n(가), (나)에 알맞은 것을 차례대로 나열한 것은?", "a": "$\\dfrac{(a-b)^{2}}{2(a+b)}$, $a=b$", "c": ["$\\dfrac{(a-b)^{2}}{2(a+b)}$, $a=b$", "$\\dfrac{(a-b)^{2}}{2(a+b)}$, $a=-b$", "$\\dfrac{(a-b)^{2}}{a+b}$, $a=b$", "$\\dfrac{(a-b)^{2}}{2ab}$, $a=b$", "$\\dfrac{(a+b)^{2}}{2(a+b)}$, $a=b$"], "lvl": 2, "w": "[핵심] 부등식의 증명 = (좌변)$-$(우변)을 통분해 부호가 정해지는 꼴로 만든다.\n$\\dfrac{(a+b)^{2}-4ab}{2(a+b)}=\\dfrac{a^{2}-2ab+b^{2}}{2(a+b)}=\\dfrac{(a-b)^{2}}{2(a+b)}$\n분모 $2(a+b)>0$, 분자 $\\ge 0$ → $\\ge 0$\n등호는 $(a-b)^{2}=0$, 곧 $a=b$일 때", "key": "T07-12"}, "t07-12-2": {"id": "t07-12-2", "unit": "07", "theme": "12", "벌": 2, "k": "num", "q": "모든 실수 $a$, $b$, $c$에 대하여 부등식\n$a^{2}+4b^{2}+9c^{2}\\ge 2ab+6bc+3ca$\n가 성립한다. 이 부등식에서 등호가 성립하고 $a+b+c=11$일 때, $a$의 값을 구하시오.", "a": "6", "lvl": 2, "w": "[핵심] 2배 하여 완전제곱식의 합으로 묶는다.\n$2\\{(\\text{좌변})-(\\text{우변})\\}=(a-2b)^{2}+(2b-3c)^{2}+(3c-a)^{2}\\ge 0$\n등호 ⇔ $a=2b=3c$. $a=6t$, $b=3t$, $c=2t$로 놓으면 $11t=11$ → $t=1$\n$a=6$", "key": "T07-12"}, "t07-12-3": {"id": "t07-12-3", "unit": "07", "theme": "12", "벌": 3, "k": "num", "q": "실수 $x$에 대하여 $|x-3|+|x+5|$의 최솟값을 $m$, 이 최솟값을 갖게 하는 정수 $x$의 개수를 $n$이라 할 때, $m+n$의 값을 구하시오.", "a": "17", "lvl": 3, "w": "[핵심] 절대부등식 $|a|+|b|\\ge|a+b|$ (등호 ⇔ $ab\\ge 0$)을 합이 상수가 되게 쓴다.\n$|x-3|+|x+5|=|3-x|+|x+5|\\ge|(3-x)+(x+5)|=8$ → $m=8$\n등호 ⇔ $(3-x)(x+5)\\ge 0$ ⇔ $-5\\le x\\le 3$ → 정수 9개, $n=9$\n$m+n=17$", "key": "T07-12"}, "t07-13-1": {"id": "t07-13-1", "unit": "07", "theme": "13", "벌": 1, "k": "num", "q": "두 양수 $a$, $b$에 대하여 $(a+2b)\\left(\\dfrac{2}{a}+\\dfrac{1}{b}\\right)$의 최솟값을 구하시오.", "a": "8", "lvl": 2, "w": "[핵심] 전개한 뒤 곱이 일정한 두 항에 산술·기하평균을 쓴다.\n$(a+2b)\\left(\\dfrac{2}{a}+\\dfrac{1}{b}\\right)=4+\\dfrac{a}{b}+\\dfrac{4b}{a}$\n$\\dfrac{a}{b}+\\dfrac{4b}{a}\\ge 2\\sqrt{4}=4$ → 전체 $\\ge 8$\n등호: $\\dfrac{a}{b}=\\dfrac{4b}{a}$, 곧 $a=2b$ (예: $a=2$, $b=1$)일 때 성립 → 최솟값 $8$", "key": "T07-13"}, "t07-13-2": {"id": "t07-13-2", "unit": "07", "theme": "13", "벌": 2, "k": "num", "q": "$x>1$일 때 $4x+\\dfrac{9}{x-1}$은 $x=\\alpha$에서 최솟값 $m$을 갖는다. $m+2\\alpha$의 값을 구하시오.", "a": "21", "lvl": 2, "w": "[핵심] 분모와 같은 꼴 $x-1(>0)$을 만들어 변형한다.\n$4x+\\dfrac{9}{x-1}=4(x-1)+\\dfrac{9}{x-1}+4\\ge 2\\sqrt{36}+4=16$\n등호: $4(x-1)=\\dfrac{9}{x-1}$ → $(x-1)^{2}=\\dfrac{9}{4}$, $x-1>0$이므로 $x=\\dfrac{5}{2}$ ($>1$ 확인)\n$m=16$, $\\alpha=\\dfrac{5}{2}$ → $m+2\\alpha=21$", "key": "T07-13"}, "t07-13-3": {"id": "t07-13-3", "unit": "07", "theme": "13", "벌": 3, "k": "num", "q": "$x>0$일 때 $\\dfrac{x}{x^{2}+x+4}$의 최댓값을 구하시오.", "a": "1/5", "lvl": 3, "w": "[핵심] 분자·분모를 $x$로 나누어 분모에 산술·기하평균을 쓴다.\n$\\dfrac{x}{x^{2}+x+4}=\\dfrac{1}{x+\\frac{4}{x}+1}$\n$x+\\dfrac{4}{x}\\ge 2\\sqrt{4}=4$ → 분모 $\\ge 5$ → 식 $\\le\\dfrac{1}{5}$\n등호: $x=\\dfrac{4}{x}$, 곧 $x=2$ ($>0$)일 때 → 최댓값 $\\dfrac{1}{5}$", "key": "T07-13"}, "t07-14-1": {"id": "t07-14-1", "unit": "07", "theme": "14", "벌": 1, "k": "num", "q": "두 양수 $x$, $y$에 대하여 $2x+3y=12$일 때, $xy$의 최댓값을 구하시오.", "a": "6", "lvl": 2, "w": "[핵심] 합 $2x+3y$가 일정 → 곱 $2x\\cdot 3y$의 최댓값.\n$12=2x+3y\\ge 2\\sqrt{6xy}$ → $\\sqrt{6xy}\\le 6$ → $xy\\le 6$\n등호: $2x=3y=6$, 곧 $x=3$, $y=2$일 때 성립\n최댓값 $6$", "key": "T07-14"}, "t07-14-2": {"id": "t07-14-2", "unit": "07", "theme": "14", "벌": 2, "k": "num", "q": "두 양수 $x$, $y$에 대하여 $x+y=3$일 때, $\\dfrac{1}{x}+\\dfrac{4}{y}$의 최솟값을 구하시오.", "a": "3", "lvl": 2, "w": "[핵심] 일정한 합을 곱해 전개한다: $(x+y)\\left(\\dfrac{1}{x}+\\dfrac{4}{y}\\right)$.\n$(x+y)\\left(\\dfrac{1}{x}+\\dfrac{4}{y}\\right)=5+\\dfrac{y}{x}+\\dfrac{4x}{y}\\ge 5+4=9$\n$3\\left(\\dfrac{1}{x}+\\dfrac{4}{y}\\right)\\ge 9$ → $\\dfrac{1}{x}+\\dfrac{4}{y}\\ge 3$\n등호: $y=2x$, $x+y=3$ → $x=1$, $y=2$ → 최솟값 $3$", "key": "T07-14"}, "t07-14-3": {"id": "t07-14-3", "unit": "07", "theme": "14", "벌": 3, "k": "num", "q": "두 양수 $x$, $y$에 대하여 $xy=x+4y+5$일 때, $xy$의 최솟값을 구하시오.", "a": "25", "lvl": 3, "w": "[핵심] $x+4y\\ge 2\\sqrt{4xy}$로 $xy$에 대한 부등식을 만든다.\n$xy=t$라 하면 $t=x+4y+5\\ge 4\\sqrt{t}+5$\n$(\\sqrt{t}-5)(\\sqrt{t}+1)\\ge 0$, $\\sqrt{t}+1>0$ → $\\sqrt{t}\\ge 5$ → $t\\ge 25$\n등호: $x=4y$, $xy=25$ → $y=\\dfrac{5}{2}$, $x=10$ (조건식 $25=10+10+5$ ✓) → 최솟값 $25$", "key": "T07-14"}, "t07-15-1": {"id": "t07-15-1", "unit": "07", "theme": "15", "벌": 1, "k": "num", "q": "실수 $x$, $y$에 대하여 $x^{2}+y^{2}=10$일 때, $3x+y$의 최댓값을 구하시오.", "a": "10", "lvl": 2, "w": "[핵심] $(3^{2}+1^{2})(x^{2}+y^{2})\\ge(3x+y)^{2}$\n$10\\times 10\\ge(3x+y)^{2}$ → $-10\\le 3x+y\\le 10$\n등호: $\\dfrac{x}{3}=\\dfrac{y}{1}$, $x^{2}+y^{2}=10$ → $x=3$, $y=1$\n최댓값 $10$", "key": "T07-15"}, "t07-15-2": {"id": "t07-15-2", "unit": "07", "theme": "15", "벌": 2, "k": "num", "q": "실수 $x$, $y$에 대하여 $x+y=5$일 때, $2x^{2}+3y^{2}$의 최솟값을 구하시오.", "a": "30", "lvl": 2, "w": "[핵심] $2x^{2}+3y^{2}=(\\sqrt2x)^{2}+(\\sqrt3y)^{2}$에 짝 $\\left(\\frac{1}{\\sqrt2},\\frac{1}{\\sqrt3}\\right)$을 곱해 $x+y$를 만든다.\n$\\left(\\dfrac12+\\dfrac13\\right)(2x^{2}+3y^{2})\\ge(x+y)^{2}=25$\n$\\dfrac56(2x^{2}+3y^{2})\\ge 25$ → $2x^{2}+3y^{2}\\ge 30$\n등호: $2x=3y$, $x+y=5$ → $x=3$, $y=2$ ($18+12=30$ ✓) → 최솟값 $30$", "key": "T07-15"}, "t07-15-3": {"id": "t07-15-3", "unit": "07", "theme": "15", "벌": 3, "k": "num", "q": "실수 $x$, $y$에 대하여 $x^{2}+4y^{2}=5$일 때, $x+y$의 최댓값을 $M$, 최솟값을 $m$이라 하자. $M-m$의 값을 구하시오.", "a": "5", "lvl": 3, "w": "[핵심] $x^{2}+(2y)^{2}$과 짝 $\\left(1,\\frac12\\right)$로 $x+y$를 만든다.\n$\\left(1+\\dfrac14\\right)\\{x^{2}+(2y)^{2}\\}\\ge\\left(x+\\dfrac12\\cdot 2y\\right)^{2}=(x+y)^{2}$\n$(x+y)^{2}\\le\\dfrac54\\times 5=\\dfrac{25}{4}$ → $-\\dfrac52\\le x+y\\le\\dfrac52$\n등호: $x=4y$ → $(x,y)=\\left(2,\\frac12\\right)$, $\\left(-2,-\\frac12\\right)$ → $M=\\dfrac52$, $m=-\\dfrac52$, $M-m=5$", "key": "T07-15"}, "tm05-01-1": {"id": "tm05-01-1", "unit": "m05", "theme": "01", "벌": 1, "k": "num", "q": "함수 $f(x)=x^{3}-6x^{2}+9x+1$이 감소하는 구간이 닫힌구간 $[a,\\,b]$일 때, $a+b$의 값을 구하시오.", "a": "4", "lvl": 2, "w": "[핵심] $f'(x)\\le 0$인 $x$의 범위가 감소하는 구간이다.\n$f'(x)=3x^{2}-12x+9=3(x-1)(x-3)$\n$f'(x)\\le 0$에서 $1\\le x\\le 3$이므로 $a=1$, $b=3$, $a+b=4$", "key": "Tm05-01"}, "tm05-01-2": {"id": "tm05-01-2", "unit": "m05", "theme": "01", "벌": 2, "k": "num", "q": "함수 $f(x)=-x^{3}+ax^{2}+bx$가 구간 $(-\\infty,\\,-1]$, $[3,\\,\\infty)$에서 감소하고 구간 $[-1,\\,3]$에서 증가할 때, 두 상수 $a$, $b$에 대하여 $a+b$의 값을 구하시오.", "a": "12", "lvl": 2, "w": "[핵심] 증가·감소가 바뀌는 $x=-1$, $x=3$은 $f'(x)=0$의 두 근이다.\n$f'(x)=-3x^{2}+2ax+b=-3(x+1)(x-3)=-3x^{2}+6x+9$\n계수를 비교하면 $2a=6$, $b=9$\n따라서 $a=3$, $b=9$, $a+b=12$", "key": "Tm05-01"}, "tm05-01-3": {"id": "tm05-01-3", "unit": "m05", "theme": "01", "벌": 3, "k": "num", "q": "함수 $f(x)=3x^{4}-4x^{3}-12x^{2}+1$이 감소하는 $x$의 값의 범위가 $x\\le\\alpha$ 또는 $\\beta\\le x\\le\\gamma$일 때, $\\alpha+\\beta+\\gamma$의 값을 구하시오.", "a": "1", "lvl": 3, "w": "[핵심] 사차함수도 $f'(x)$의 부호로 증가·감소를 판정한다.\n$f'(x)=12x^{3}-12x^{2}-24x=12x(x+1)(x-2)$\n부호는 $x<-1$에서 $-$, $-1<x<0$에서 $+$, $0<x<2$에서 $-$, $x>2$에서 $+$\n감소하는 범위는 $x\\le -1$ 또는 $0\\le x\\le 2$이므로 $\\alpha+\\beta+\\gamma=-1+0+2=1$", "key": "Tm05-01"}, "tm05-02-1": {"id": "tm05-02-1", "unit": "m05", "theme": "02", "벌": 1, "k": "num", "q": "함수 $f(x)=x^{3}+ax^{2}+3x+1$이 실수 전체의 집합에서 증가하도록 하는 정수 $a$의 개수를 구하시오.", "a": "7", "lvl": 2, "w": "[핵심] 최고차항의 계수가 양수인 삼차함수가 실수 전체에서 증가 $\\iff$ $f'(x)\\ge 0$ $\\iff$ $D\\le 0$\n$f'(x)=3x^{2}+2ax+3$에서 $\\frac{D}{4}=a^{2}-9\\le 0$\n$-3\\le a\\le 3$이므로 정수 $a$는 $7$개 (등호를 빼고 $D<0$으로 세우면 $5$개가 되니 주의)", "key": "Tm05-02"}, "tm05-02-2": {"id": "tm05-02-2", "unit": "m05", "theme": "02", "벌": 2, "k": "num", "q": "함수 $f(x)=-\\frac{1}{3}x^{3}+ax^{2}-(a+6)x$가 실수 전체의 집합에서 감소하도록 하는 실수 $a$의 최댓값을 $M$, 최솟값을 $m$이라 할 때, $M-m$의 값을 구하시오.", "a": "5", "lvl": 2, "w": "[핵심] 실수 전체에서 감소 $\\iff$ 모든 $x$에 대하여 $f'(x)\\le 0$\n$f'(x)=-x^{2}+2ax-(a+6)\\le 0$ 이려면 $x^{2}-2ax+(a+6)=0$의 $\\frac{D}{4}=a^{2}-a-6\\le 0$\n$(a+2)(a-3)\\le 0$에서 $-2\\le a\\le 3$\n$M-m=3-(-2)=5$", "key": "Tm05-02"}, "tm05-02-3": {"id": "tm05-02-3", "unit": "m05", "theme": "02", "벌": 3, "k": "num", "q": "함수 $f(x)=ax^{3}+3ax^{2}+12x$가 임의의 두 실수 $x_{1}$, $x_{2}$에 대하여 $x_{1}<x_{2}$이면 $f(x_{1})<f(x_{2})$를 만족시키도록 하는 정수 $a$의 개수를 구하시오.", "a": "5", "lvl": 3, "w": "[핵심] 조건은 실수 전체에서 증가한다는 뜻이고, 최고차항의 계수 $a$가 $0$인 경우를 따로 본다.\n$a=0$이면 $f(x)=12x$로 증가한다.\n$a<0$이면 $f'(x)$의 최고차항의 계수가 음수라 $f'(x)\\ge 0$이 항상 성립할 수 없다.\n$a>0$이면 $f'(x)=3ax^{2}+6ax+12$에서 $\\frac{D}{4}=9a^{2}-36a\\le 0$, $0<a\\le 4$\n따라서 $0\\le a\\le 4$, 정수 $a$는 $5$개", "key": "Tm05-02"}, "tm05-03-1": {"id": "tm05-03-1", "unit": "m05", "theme": "03", "벌": 1, "k": "num", "q": "함수 $f(x)=-x^{3}+3x^{2}+ax$가 닫힌구간 $[1,\\,3]$에서 증가하도록 하는 실수 $a$의 최솟값을 구하시오.", "a": "9", "lvl": 2, "w": "[핵심] 구간 안의 모든 $x$에서 $f'(x)\\ge 0$ $\\iff$ 그 구간에서 $f'(x)$의 최솟값 $\\ge 0$\n$f'(x)=-3x^{2}+6x+a=-3(x-1)^{2}+a+3$은 $[1,\\,3]$에서 감소하므로 최솟값은 $f'(3)=a-9$\n$a-9\\ge 0$에서 $a\\ge 9$, 최솟값 $9$", "key": "Tm05-03"}, "tm05-03-2": {"id": "tm05-03-2", "unit": "m05", "theme": "03", "벌": 2, "k": "num", "q": "함수 $f(x)=x^{3}-3x^{2}+ax+1$이 닫힌구간 $[-1,\\,1]$에서 감소하고 구간 $[3,\\,\\infty)$에서 증가할 때, 실수 $a$의 값을 구하시오.", "a": "-9", "lvl": 2, "w": "[핵심] $f'(x)=3(x-1)^{2}+a-3$의 축 $x=1$을 기준으로 각 구간의 최대·최소를 본다.\n$[-1,\\,1]$에서 $f'(x)$의 최댓값 $f'(-1)=a+9\\le 0$이므로 $a\\le -9$\n$[3,\\,\\infty)$에서 $f'(x)$의 최솟값 $f'(3)=a+9\\ge 0$이므로 $a\\ge -9$\n따라서 $a=-9$", "key": "Tm05-03"}, "tm05-03-3": {"id": "tm05-03-3", "unit": "m05", "theme": "03", "벌": 3, "k": "num", "q": "함수 $f(x)=x^{3}+ax^{2}-a^{2}x$가 열린구간 $(-1,\\,2)$에서 감소하도록 하는 실수 $a$의 값의 범위가 $a\\le p$ 또는 $a\\ge q$일 때, $q-p$의 값을 구하시오.", "a": "9", "lvl": 3, "w": "[핵심] $f'(x)=0$의 두 근 사이가 감소 구간이므로, 그 사이에 $(-1,\\,2)$가 들어가야 한다.\n$f'(x)=3x^{2}+2ax-a^{2}=(3x-a)(x+a)$\n$a>0$이면 감소 구간 $[-a,\\,\\frac{a}{3}]$: $-a\\le -1$, $\\frac{a}{3}\\ge 2$에서 $a\\ge 6$\n$a<0$이면 감소 구간 $[\\frac{a}{3},\\,-a]$: $\\frac{a}{3}\\le -1$, $-a\\ge 2$에서 $a\\le -3$ ($a=0$이면 $f'(x)=3x^{2}\\ge 0$이라 불가)\n따라서 $p=-3$, $q=6$, $q-p=9$", "key": "Tm05-03"}, "tm05-04-1": {"id": "tm05-04-1", "unit": "m05", "theme": "04", "벌": 1, "k": "num", "q": "함수 $f(x)=x^{3}-3x^{2}-9x+5$의 극댓값을 $M$, 극솟값을 $m$이라 할 때, $M-m$의 값을 구하시오.", "a": "32", "lvl": 2, "w": "[핵심] $f'(x)=0$인 $x$의 좌우에서 부호 변화를 보고 극대·극소를 정한다.\n$f'(x)=3x^{2}-6x-9=3(x+1)(x-3)$\n$x=-1$에서 $+\\to -$이므로 극대, $M=f(-1)=10$\n$x=3$에서 $-\\to +$이므로 극소, $m=f(3)=-22$\n$M-m=32$", "key": "Tm05-04"}, "tm05-04-2": {"id": "tm05-04-2", "unit": "m05", "theme": "04", "벌": 2, "k": "num", "q": "함수 $f(x)=x^{4}-4x^{3}+10$의 극값을 모두 더한 값을 구하시오.", "a": "-17", "lvl": 2, "w": "[핵심] $f'(a)=0$이어도 좌우에서 부호가 바뀌지 않으면 극값이 아니다.\n$f'(x)=4x^{3}-12x^{2}=4x^{2}(x-3)$\n$x=0$의 좌우에서 $f'(x)<0$으로 부호가 바뀌지 않으므로 극값이 아니다.\n$x=3$에서 $-\\to +$이므로 극솟값 $f(3)=81-108+10=-17$\n극값은 이것 하나뿐이므로 답은 $-17$", "key": "Tm05-04"}, "tm05-04-3": {"id": "tm05-04-3", "unit": "m05", "theme": "04", "벌": 3, "k": "num", "q": "함수 $f(x)=x^{4}-8x^{2}+a$의 극댓값과 모든 극솟값을 더한 값이 $10$일 때, 상수 $a$의 값을 구하시오.", "a": "14", "lvl": 3, "w": "[핵심] 사차함수는 극소가 두 번 생길 수 있다 — 극솟값을 빠짐없이 센다.\n$f'(x)=4x^{3}-16x=4x(x+2)(x-2)$\n극대: $x=0$, $f(0)=a$\n극소: $x=-2$, $x=2$, $f(\\pm 2)=a-16$\n$a+2(a-16)=10$에서 $3a=42$, $a=14$", "key": "Tm05-04"}, "tm05-05-1": {"id": "tm05-05-1", "unit": "m05", "theme": "05", "벌": 1, "k": "num", "q": "함수 $f(x)=x^{3}+ax^{2}+bx+1$이 $x=1$에서 극솟값 $-3$을 가질 때, 두 상수 $a$, $b$에 대하여 $a-b$의 값을 구하시오.", "a": "9", "lvl": 2, "w": "[핵심] $x=1$에서 극솟값 $-3$ $\\Rightarrow$ $f'(1)=0$, $f(1)=-3$\n$f'(1)=3+2a+b=0$, $f(1)=2+a+b=-3$\n두 식에서 $a=2$, $b=-7$\n확인: $f'(x)=3x^{2}+4x-7=(3x+7)(x-1)$, $x=1$에서 $-\\to +$이므로 극소 맞음\n$a-b=9$", "key": "Tm05-05"}, "tm05-05-2": {"id": "tm05-05-2", "unit": "m05", "theme": "05", "벌": 2, "k": "num", "q": "함수 $f(x)=2x^{3}+ax^{2}+bx+c$가 $x=-1$에서 극댓값 $10$을 갖고 $x=2$에서 극소일 때, $f(x)$의 극솟값을 구하시오. (단, $a$, $b$, $c$는 상수이다.)", "a": "-17", "lvl": 2, "w": "[핵심] 극값을 갖는 두 점이 주어지면 $f'(x)$를 인수분해 꼴로 바로 쓴다.\n$f'(x)=6(x+1)(x-2)=6x^{2}-6x-12$이므로 $a=-3$, $b=-12$\n$f(-1)=-2-3+12+c=10$에서 $c=3$\n극솟값 $f(2)=16-12-24+3=-17$", "key": "Tm05-05"}, "tm05-05-3": {"id": "tm05-05-3", "unit": "m05", "theme": "05", "벌": 3, "k": "num", "q": "함수 $f(x)=x^{3}+ax^{2}+(a^{2}-6)x$가 $x=1$에서 극값을 갖도록 하는 모든 실수 $a$의 값의 합을 구하시오.", "a": "1", "lvl": 3, "w": "[핵심] $f'(1)=0$은 필요조건일 뿐 — 구한 값마다 부호 변화를 확인한다.\n$f'(x)=3x^{2}+2ax+a^{2}-6$, $f'(1)=a^{2}+2a-3=0$에서 $a=1$ 또는 $a=-3$\n$a=1$: $f'(x)=3x^{2}+2x-5=(3x+5)(x-1)$, 부호가 바뀌므로 극값 ○\n$a=-3$: $f'(x)=3x^{2}-6x+3=3(x-1)^{2}\\ge 0$, 부호가 안 바뀌므로 극값 ×\n따라서 답은 $1$", "key": "Tm05-05"}, "tm05-06-1": {"id": "tm05-06-1", "unit": "m05", "theme": "06", "벌": 1, "k": "num", "q": "함수 $f(x)=x^{3}-3x^{2}+2$의 그래프에서 극대인 점을 $\\mathrm{A}$, 극소인 점을 $\\mathrm{B}$라 할 때, 원점 $\\mathrm{O}$에 대하여 삼각형 $\\mathrm{OAB}$의 넓이를 구하시오.", "a": "2", "lvl": 2, "w": "[핵심] 극대·극소인 점의 좌표를 먼저 구한다.\n$f'(x)=3x(x-2)$이므로 $\\mathrm{A}(0,\\,2)$, $\\mathrm{B}(2,\\,-2)$\n$\\mathrm{OA}$가 $y$축 위에 있으므로 밑변 $\\mathrm{OA}=2$, 높이는 $\\mathrm{B}$의 $x$좌표 $2$\n넓이 $=\\frac{1}{2}\\times 2\\times 2=2$", "key": "Tm05-06"}, "tm05-06-2": {"id": "tm05-06-2", "unit": "m05", "theme": "06", "벌": 2, "k": "num", "q": "함수 $f(x)=x^{3}-6x^{2}+9x+k$의 극댓값이 극솟값의 $3$배일 때, 상수 $k$의 값을 구하시오.", "a": "2", "lvl": 2, "w": "[핵심] 극댓값·극솟값을 $k$로 나타내 조건식을 세운다.\n$f'(x)=3(x-1)(x-3)$\n극댓값 $f(1)=4+k$, 극솟값 $f(3)=k$\n$4+k=3k$에서 $k=2$", "key": "Tm05-06"}, "tm05-06-3": {"id": "tm05-06-3", "unit": "m05", "theme": "06", "벌": 3, "k": "num", "q": "양수 $a$에 대하여 함수 $f(x)=x^{3}-3a^{2}x$의 그래프에서 극대인 점을 $\\mathrm{A}$, 극소인 점을 $\\mathrm{B}$라 하자. 점 $\\mathrm{A}$를 지나고 $x$축에 평행한 직선과 점 $\\mathrm{B}$를 지나고 $y$축에 평행한 직선이 만나는 점을 $\\mathrm{C}$라 할 때, 삼각형 $\\mathrm{ABC}$의 넓이가 $64$이다. $f(x)$의 극댓값을 구하시오.", "a": "16", "lvl": 3, "w": "[핵심] 극대·극소인 점을 $a$로 나타내면 넓이가 $a$의 식이 된다.\n$f'(x)=3(x+a)(x-a)$이므로 $\\mathrm{A}(-a,\\,2a^{3})$, $\\mathrm{B}(a,\\,-2a^{3})$, $\\mathrm{C}(a,\\,2a^{3})$\n직각삼각형: $\\mathrm{AC}=2a$, $\\mathrm{BC}=4a^{3}$\n넓이 $=\\frac{1}{2}\\cdot 2a\\cdot 4a^{3}=4a^{4}=64$, $a=2$\n극댓값 $2a^{3}=16$", "key": "Tm05-06"}, "tm05-07-1": {"id": "tm05-07-1", "unit": "m05", "theme": "07", "벌": 1, "k": "num", "q": "삼차함수 $f(x)=ax^{3}+bx^{2}+cx+d$가 $x=-1$에서 극대, $x=3$에서 극소이고 $f(0)<0$일 때, 네 상수 $a$, $b$, $c$, $d$ 중 양수인 것의 개수를 구하시오.", "a": "1", "lvl": 2, "w": "[핵심] 극대가 극소보다 왼쪽 $\\Rightarrow$ $a>0$, 그다음 $f'(x)=3a(x+1)(x-3)$을 전개해 비교한다.\n$f'(x)=3ax^{2}+2bx+c=3a(x^{2}-2x-3)$\n$2b=-6a<0$, $c=-9a<0$, $d=f(0)<0$\n양수는 $a$ 하나", "key": "Tm05-07"}, "tm05-07-2": {"id": "tm05-07-2", "unit": "m05", "theme": "07", "벌": 2, "k": "num", "q": "삼차함수 $f(x)=ax^{3}+bx^{2}+cx+d$는 $x=\\alpha$에서 극소, $x=\\beta$에서 극대이고 $0<\\alpha<\\beta$, $f(0)>0$이다. 다음 중 옳은 것의 개수를 구하시오. ㄱ. $ab>0$ ㄴ. $bc<0$ ㄷ. $ad<0$ ㄹ. $bd>0$", "a": "3", "lvl": 2, "w": "[핵심] 극소가 극대보다 왼쪽 $\\Rightarrow$ $a<0$, 근과 계수의 관계로 $b$, $c$의 부호를 정한다.\n$f'(x)=3ax^{2}+2bx+c=0$의 두 근이 $\\alpha$, $\\beta$\n$\\alpha+\\beta=-\\frac{2b}{3a}>0$에서 $b>0$, $\\alpha\\beta=\\frac{c}{3a}>0$에서 $c<0$, $d=f(0)>0$\nㄱ ×, ㄴ ○, ㄷ ○, ㄹ ○ → $3$개", "key": "Tm05-07"}, "tm05-07-3": {"id": "tm05-07-3", "unit": "m05", "theme": "07", "벌": 3, "k": "num", "q": "삼차함수 $f(x)=ax^{3}+bx^{2}+cx+d$가 다음 조건을 만족시킨다. (가) $f(x)$는 $x=\\alpha$에서 극대, $x=\\beta$에서 극소이고 $\\alpha<0<\\beta$이다. (나) $\\alpha+\\beta>0$ (다) $f(x)$의 극솟값은 양수이다. 다음 중 항상 양수인 것의 개수를 구하시오. $ab$, $ac$, $bc$, $bd$, $cd$, $b^{2}-3ac$", "a": "2", "lvl": 3, "w": "[핵심] $a$는 극대·극소의 순서, $b$·$c$는 두 근의 합·곱, $d=f(0)$은 증감으로 정한다.\n극대가 왼쪽이므로 $a>0$, $\\alpha+\\beta=-\\frac{2b}{3a}>0$에서 $b<0$, $\\alpha\\beta=\\frac{c}{3a}<0$에서 $c<0$\n$[\\alpha,\\,\\beta]$에서 감소하고 $\\alpha<0<\\beta$이므로 $d=f(0)>f(\\beta)>0$\n$f'(x)=0$이 서로 다른 두 실근 $\\Rightarrow$ $\\frac{D}{4}=b^{2}-3ac>0$\n양수: $bc$, $b^{2}-3ac$ → $2$개", "key": "Tm05-07"}, "tm05-08-1": {"id": "tm05-08-1", "unit": "m05", "theme": "08", "벌": 1, "k": "num", "q": "다항함수 $f(x)$의 도함수가 $f'(x)=(x+1)(x-2)^{2}(x-4)$일 때, $f(x)$가 극값을 갖는 모든 $x$의 값의 합을 구하시오.", "a": "3", "lvl": 2, "w": "[핵심] $f'(x)$의 부호가 바뀌는 점에서만 극값 — 짝수 번 곱해진 인수는 부호를 바꾸지 않는다.\n부호: $x<-1$에서 $+$, $-1<x<2$에서 $-$, $2<x<4$에서 $-$, $x>4$에서 $+$\n$x=-1$에서 극대, $x=4$에서 극소, $x=2$는 극값 아님\n합 $=-1+4=3$", "key": "Tm05-08"}, "tm05-08-2": {"id": "tm05-08-2", "unit": "m05", "theme": "08", "벌": 2, "k": "num", "q": "삼차함수 $f(x)=x^{3}+ax^{2}+bx+c$에 대하여 $y=f'(x)$의 그래프가 $x$축과 두 점 $(-1,\\,0)$, $(3,\\,0)$에서 만나고, $f(0)=2$이다. $f(x)$의 극댓값을 구하시오.", "a": "7", "lvl": 2, "w": "[핵심] $y=f'(x)$가 $x$축과 만나는 점 = $f'(x)=0$의 근, 위에서 아래로 지나는 점이 극대.\n$f'(x)=3x^{2}+2ax+b=3(x+1)(x-3)$에서 $a=-3$, $b=-9$, $c=f(0)=2$\n$f'(x)$는 최고차항의 계수가 양수인 이차함수라 $x=-1$에서 $+\\to -$, 극대\n극댓값 $f(-1)=-1-3+9+2=7$", "key": "Tm05-08"}, "tm05-08-3": {"id": "tm05-08-3", "unit": "m05", "theme": "08", "벌": 3, "k": "num", "q": "최고차항의 계수가 $1$인 사차함수 $f(x)=x^{4}+ax^{3}+bx^{2}+c$에 대하여 $y=f'(x)$의 그래프가 점 $(3,\\,0)$에서 $x$축에 접하고, $f(1)=4$이다. $f(x)$의 극솟값을 $m$, $f(x)$가 극값을 갖는 $x$의 개수를 $n$이라 할 때, $m+n$의 값을 구하시오.", "a": "-6", "lvl": 3, "w": "[핵심] $x$축에 접하기만 하는 점은 부호가 안 바뀌어 극값이 아니다.\n$f'(x)=4x^{3}+3ax^{2}+2bx=x(4x^{2}+3ax+2b)$이고 $x=3$에서 접하므로 $4x^{2}+3ax+2b=4(x-3)^{2}$\n$a=-8$, $b=18$, $f'(x)=4x(x-3)^{2}$\n$f(1)=1-8+18+c=4$에서 $c=-7$\n극값은 $x=0$에서 극소 하나: $m=f(0)=-7$, $n=1$\n$m+n=-6$", "key": "Tm05-08"}, "tm05-09-1": {"id": "tm05-09-1", "unit": "m05", "theme": "09", "벌": 1, "k": "num", "q": "다항함수 $f(x)$의 도함수가 $f'(x)=(x+1)(x-2)^{2}$일 때, 〈보기〉에서 옳은 것의 개수를 구하시오.\nㄱ. $f(x)$는 구간 $[-1,\\,\\infty)$에서 증가한다.\nㄴ. $f(x)$는 $x=2$에서 극값을 갖는다.\nㄷ. $f(x)$는 $x=-1$에서 극대이다.\nㄹ. $f(0)\\lt f(3)$", "a": "2", "lvl": 2, "w": "[핵심] $f'(x)$의 부호가 바뀌는 점에서만 극값이 생긴다.\n$(x-2)^{2}\\ge0$이므로 $f'(x)$의 부호는 $x+1$의 부호와 같다. $x\\lt -1$에서 $f'(x)\\lt 0$, $x\\gt -1$에서 $f'(x)\\ge0$($x=2$에서만 $0$).\nㄱ. 참. 다항함수이고 $f'(x)\\ge0$이므로 증가한다.\nㄴ. 거짓. $x=2$의 좌우에서 부호가 바뀌지 않는다.\nㄷ. 거짓. 음에서 양으로 바뀌므로 극소이다.\nㄹ. 참. ㄱ에서 $0\\lt 3$이므로 $f(0)\\lt f(3)$. 옳은 것은 ㄱ, ㄹ의 $2$개.", "key": "Tm05-09"}, "tm05-09-2": {"id": "tm05-09-2", "unit": "m05", "theme": "09", "벌": 2, "k": "num", "q": "다항함수 $f(x)$의 도함수가 $f'(x)=-x^{2}(x-2)(x+3)$일 때, 〈보기〉에서 옳은 것의 개수를 구하시오.\nㄱ. $f(x)$는 $x=0$에서 극값을 갖지 않는다.\nㄴ. $f(x)$의 극댓값은 $f(2)$이다.\nㄷ. $f(-4)\\lt f(-3)$\nㄹ. 방정식 $f(x)=f(0)$의 서로 다른 실근은 $3$개이다.", "a": "3", "lvl": 2, "w": "[핵심] $x^{2}\\ge0$은 부호에 영향을 주지 않으므로 $-(x-2)(x+3)$의 부호만 본다.\n$x\\lt -3$: $-$, $-3\\lt x\\lt 2$: $+$($x=0$에서만 $0$), $x\\gt 2$: $-$. 즉 감소→증가→감소, $x=-3$에서 극소, $x=2$에서 극대.\nㄱ 참, ㄴ 참. ㄷ 거짓: $x\\lt -3$에서 감소하므로 $f(-4)\\gt f(-3)$.\nㄹ 참: $f(-3)\\lt f(0)\\lt f(2)$이고 $x\\to-\\infty$일 때 $f(x)\\to\\infty$, $x\\to\\infty$일 때 $f(x)\\to-\\infty$($f'(x)$가 최고차항 계수가 음수인 사차식이므로 $f(x)$는 최고차항 계수가 음수인 5차함수)이므로 $x\\lt -3$, $-3\\lt x\\lt 2$, $x\\gt 2$에서 하나씩 $3$개. 옳은 것은 $3$개.", "key": "Tm05-09"}, "tm05-09-3": {"id": "tm05-09-3", "unit": "m05", "theme": "09", "벌": 3, "k": "num", "q": "함수 $f(x)=x^{4}-8x^{3}+16x^{2}$에 대하여 〈보기〉에서 옳은 것의 개수를 구하시오.\nㄱ. $f(0)=f(4)$\nㄴ. $f(1)\\lt f(3)$\nㄷ. 방정식 $f(x)=f(2)$의 서로 다른 실근은 $3$개이다.\nㄹ. $f(x)$는 구간 $(1,\\,3)$에서 증가한다.", "a": "2", "lvl": 3, "w": "[핵심] $f'(x)$의 부호로 증감을 정하고, 값의 비교는 $f(x)$에 직접 넣어 한다.\n$f'(x)=4x^{3}-24x^{2}+32x=4x(x-2)(x-4)$ → $x=0$ 극소, $x=2$ 극대, $x=4$ 극소.\nㄱ 참: $f(0)=0$, $f(4)=256-512+256=0$. ㄴ 거짓: $f(1)=9=f(3)$.\nㄷ 참: $f(2)=16$이고 $f(x)-16=(x-2)^{2}(x^{2}-4x-4)$이므로 실근은 $2,\\ 2\\pm2\\sqrt{2}$의 $3$개.\nㄹ 거짓: $(2,\\,4)$에서 $f'(x)\\lt 0$이므로 $(2,\\,3)$에서 감소한다. 옳은 것은 ㄱ, ㄷ의 $2$개.", "key": "Tm05-09"}, "tm05-10-1": {"id": "tm05-10-1", "unit": "m05", "theme": "10", "벌": 1, "k": "num", "q": "함수 $f(x)=x^{3}-3x^{2}-9x+5$에 대하여 곡선 $y=f(x)$와 직선 $y=k$가 서로 다른 세 점에서 만나도록 하는 정수 $k$의 개수를 구하시오.", "a": "31", "lvl": 2, "w": "[핵심] 도함수로 증감표를 만들고 극값을 구하면 그래프의 개형이 정해진다.\n$f'(x)=3x^{2}-6x-9=3(x+1)(x-3)$. $x=-1$에서 극대 $f(-1)=10$, $x=3$에서 극소 $f(3)=-22$.\n개형은 증가→감소→증가이므로 직선 $y=k$와 세 점에서 만나려면 $-22\\lt k\\lt 10$.\n정수 $k$는 $-21,\\,\\cdots,\\,9$의 $31$개.", "key": "Tm05-10"}, "tm05-10-2": {"id": "tm05-10-2", "unit": "m05", "theme": "10", "벌": 2, "k": "num", "q": "함수 $f(x)=x^{4}-4x^{3}+k$에 대하여 곡선 $y=f(x)$가 $x$축과 서로 다른 두 점에서 만나도록 하는 자연수 $k$의 개수를 구하시오.", "a": "26", "lvl": 2, "w": "[핵심] $f'(x)$가 $x=0$에서 $0$이어도 부호가 바뀌지 않으면 극값이 아니다.\n$f'(x)=4x^{3}-12x^{2}=4x^{2}(x-3)$. $x\\lt 3$에서 $f'(x)\\le0$($x=0$에서만 $0$), $x\\gt 3$에서 $f'(x)\\gt 0$이므로 $f(x)$는 $x\\le3$에서 감소, $x\\ge3$에서 증가. 극값은 극솟값 $f(3)=k-27$ 하나뿐이다.\n$x$축과 두 점에서 만나려면 $k-27\\lt 0$, 즉 $k\\lt 27$. 자연수 $k$는 $26$개.", "key": "Tm05-10"}, "tm05-10-3": {"id": "tm05-10-3", "unit": "m05", "theme": "10", "벌": 3, "k": "num", "q": "함수 $f(x)=3x^{4}-16x^{3}+18x^{2}$에 대하여 방정식 $f(x)=k$의 서로 다른 실근의 개수를 $g(k)$라 할 때, $g(-1)+g(0)+g(3)+g(5)$의 값을 구하시오.", "a": "12", "lvl": 3, "w": "[핵심] 증감표로 개형(W자)을 그린 뒤 직선 $y=k$를 위아래로 움직여 센다.\n$f'(x)=12x^{3}-48x^{2}+36x=12x(x-1)(x-3)$. 극소 $f(0)=0$, 극대 $f(1)=5$, 극소 $f(3)=-27$.\n$k=-1$: $-27\\lt k\\lt 0$이므로 $x=3$ 근처 골짜기에서만 $2$개.\n$k=0$: $x=0$에서 접하고 양옆에서 $2$개 더 $\\Rightarrow 3$개. $k=3$: $0\\lt k\\lt 5$이므로 $4$개. $k=5$: $x=1$에서 접하고 $2$개 더 $\\Rightarrow 3$개.\n$2+3+4+3=12$.", "key": "Tm05-10"}, "tm05-11-1": {"id": "tm05-11-1", "unit": "m05", "theme": "11", "벌": 1, "k": "num", "q": "함수 $f(x)=x^{3}+ax^{2}+(a+6)x+1$이 극값을 갖도록 하는 정수 $a$ 중에서 $|a|\\le10$인 것의 개수를 구하시오.", "a": "11", "lvl": 2, "w": "[핵심] 삼차함수가 극값을 가질 조건은 $f'(x)=0$의 판별식 $D\\gt 0$.\n$f'(x)=3x^{2}+2ax+a+6$, $\\frac{D}{4}=a^{2}-3(a+6)=(a-6)(a+3)\\gt 0$.\n$a\\lt -3$ 또는 $a\\gt 6$. $|a|\\le10$인 정수는 $-10,\\,\\cdots,\\,-4$의 $7$개와 $7,\\,\\cdots,\\,10$의 $4$개, 합하여 $11$개.", "key": "Tm05-11"}, "tm05-11-2": {"id": "tm05-11-2", "unit": "m05", "theme": "11", "벌": 2, "k": "num", "q": "함수 $f(x)=x^{3}-3ax^{2}+3(a+2)x$가 극값을 갖도록 하는 실수 $a$의 값의 범위가 $a\\lt \\alpha$ 또는 $a\\gt \\beta$일 때, $\\alpha^{2}+\\beta^{2}$의 값을 구하시오.", "a": "5", "lvl": 2, "w": "[핵심] $f'(x)=0$이 서로 다른 두 실근을 가져야 한다.\n$f'(x)=3x^{2}-6ax+3(a+2)$, $\\frac{D}{4}=9a^{2}-9(a+2)=9(a-2)(a+1)\\gt 0$.\n$a\\lt -1$ 또는 $a\\gt 2$이므로 $\\alpha=-1$, $\\beta=2$.\n$\\alpha^{2}+\\beta^{2}=1+4=5$.", "key": "Tm05-11"}, "tm05-11-3": {"id": "tm05-11-3", "unit": "m05", "theme": "11", "벌": 3, "k": "num", "q": "$6$ 이하의 두 자연수 $a$, $b$에 대하여 함수 $f(x)=x^{3}+ax^{2}+bx+1$이 극값을 갖도록 하는 순서쌍 $(a,\\,b)$의 개수를 구하시오.", "a": "20", "lvl": 3, "w": "[핵심] 극값을 가질 조건 $\\frac{D}{4}\\gt 0$을 $b$에 대한 부등식으로 바꿔 $a$별로 센다.\n$f'(x)=3x^{2}+2ax+b$, $\\frac{D}{4}=a^{2}-3b\\gt 0$, 즉 $b\\lt \\frac{a^{2}}{3}$.\n$a=1$: $b\\lt \\frac13$ → $0$개, $a=2$: $b\\lt \\frac43$ → $1$개, $a=3$: $b\\lt 3$ → $2$개,\n$a=4$: $b\\lt \\frac{16}{3}$ → $5$개, $a=5$: $b\\lt \\frac{25}{3}$ → $6$개, $a=6$: $b\\lt 12$ → $6$개.\n합 $0+1+2+5+6+6=20$.", "key": "Tm05-11"}, "tm05-12-1": {"id": "tm05-12-1", "unit": "m05", "theme": "12", "벌": 1, "k": "num", "q": "삼차함수 $f(x)=\\frac{1}{3}(a-1)x^{3}+(a-1)x^{2}+2x+3$이 극값을 갖지 않도록 하는 모든 정수 $a$의 값의 합을 구하시오.", "a": "5", "lvl": 2, "w": "[핵심] 극값을 갖지 않을 조건은 $D\\le0$ ($D\\lt 0$이 아니다). 삼차함수이므로 $a\\ne1$.\n$f'(x)=(a-1)x^{2}+2(a-1)x+2$, $\\frac{D}{4}=(a-1)^{2}-2(a-1)=(a-1)(a-3)\\le0$.\n$1\\le a\\le3$이고 $a\\ne1$이므로 $1\\lt a\\le3$. 정수 $a=2,\\,3$, 합은 $5$.\n($a=3$이면 $f'(x)=2(x+1)^{2}\\ge0$으로 부호가 바뀌지 않는다.)", "key": "Tm05-12"}, "tm05-12-2": {"id": "tm05-12-2", "unit": "m05", "theme": "12", "벌": 2, "k": "num", "q": "함수 $f(x)=x^{3}-3(a+1)x^{2}+12ax$가 극값을 갖지 않도록 하는 실수 $a$에 대하여 $f(2)$의 값을 구하시오.", "a": "8", "lvl": 2, "w": "[핵심] $\\frac{D}{4}\\le0$이 완전제곱식이면 등호가 되는 값 하나만 남는다.\n$f'(x)=3x^{2}-6(a+1)x+12a$, $\\frac{D}{4}=9(a+1)^{2}-36a=9(a-1)^{2}\\le0$.\n따라서 $a=1$이고 $f(x)=x^{3}-6x^{2}+12x$.\n$f(2)=8-24+24=8$.", "key": "Tm05-12"}, "tm05-12-3": {"id": "tm05-12-3", "unit": "m05", "theme": "12", "벌": 3, "k": "num", "q": "함수 $f(x)=x^{3}+3ax^{2}+3bx$가 극값을 갖지 않도록 하는 두 실수 $a$, $b$에 대하여 $f(1)$의 최솟값을 구하시오.", "a": "1/4", "lvl": 3, "w": "[핵심] 극값을 갖지 않을 조건 $D\\le0$을 두 미지수의 관계식으로 쓴다.\n$f'(x)=3x^{2}+6ax+3b$, $\\frac{D}{4}=9a^{2}-9b\\le0$이므로 $b\\ge a^{2}$.\n$f(1)=1+3a+3b\\ge1+3a+3a^{2}=3\\left(a+\\frac12\\right)^{2}+\\frac14$.\n$a=-\\frac12$, $b=\\frac14$일 때 최솟값 $\\frac14$.", "key": "Tm05-12"}, "tm05-13-1": {"id": "tm05-13-1", "unit": "m05", "theme": "13", "벌": 1, "k": "num", "q": "함수 $f(x)=x^{3}-6x^{2}+ax$가 열린구간 $(0,\\,5)$에서 극댓값과 극솟값을 모두 갖도록 하는 정수 $a$의 개수를 구하시오.", "a": "11", "lvl": 2, "w": "[핵심] $f'(x)=0$이 구간 안에서 서로 다른 두 실근: 판별식·축·양 끝 값.\n$f'(x)=3x^{2}-12x+a$, 축 $x=2$는 $(0,5)$ 안에 있다.\n$\\frac{D}{4}=36-3a\\gt 0$ → $a\\lt 12$, $f'(0)=a\\gt 0$, $f'(5)=15+a\\gt 0$.\n$0\\lt a\\lt 12$이므로 정수 $a$는 $11$개.", "key": "Tm05-13"}, "tm05-13-2": {"id": "tm05-13-2", "unit": "m05", "theme": "13", "벌": 2, "k": "num", "q": "함수 $f(x)=2x^{3}-3(a+2)x^{2}+12ax$가 열린구간 $(0,\\,4)$에서 극댓값과 극솟값을 모두 갖도록 하는 모든 정수 $a$의 값의 합을 구하시오.", "a": "4", "lvl": 2, "w": "[핵심] $f'(x)$가 인수분해되면 두 근의 위치를 직접 본다.\n$f'(x)=6x^{2}-6(a+2)x+12a=6(x-2)(x-a)$.\n두 근 $2$, $a$가 $(0,4)$ 안에 있고 서로 달라야 하므로 $0\\lt a\\lt 4$, $a\\ne2$.\n($a=2$이면 $f'(x)=6(x-2)^{2}$으로 극값이 없다.) 정수 $a=1,\\,3$, 합은 $4$.", "key": "Tm05-13"}, "tm05-13-3": {"id": "tm05-13-3", "unit": "m05", "theme": "13", "벌": 3, "k": "num", "q": "함수 $f(x)=x^{3}-3x^{2}-9x$가 열린구간 $(a,\\,a+6)$에서 극댓값은 갖지만 극솟값은 갖지 않도록 하는 모든 정수 $a$의 값의 합을 구하시오.", "a": "-18", "lvl": 3, "w": "[핵심] 극대·극소의 위치를 먼저 구하고, 열린구간이므로 끝점 포함 여부를 따진다.\n$f'(x)=3(x+1)(x-3)$: $x=-1$에서 극대, $x=3$에서 극소.\n극대점 포함: $a\\lt -1\\lt a+6$ → $-7\\lt a\\lt -1$.\n극소점 미포함: $a+6\\le3$ 또는 $a\\ge3$ → $a\\le-3$ (열린구간이라 $a+6=3$이면 $3$은 안 들어간다).\n$-7\\lt a\\le-3$: $a=-6,-5,-4,-3$, 합 $-18$.", "key": "Tm05-13"}, "tm05-14-1": {"id": "tm05-14-1", "unit": "m05", "theme": "14", "벌": 1, "k": "num", "q": "함수 $f(x)=x^{4}+4x^{3}+2ax^{2}$이 극댓값을 갖도록 하는 정수 $a$ 중에서 $|a|\\le5$인 것의 개수를 구하시오.", "a": "7", "lvl": 2, "w": "[핵심] 최고차항의 계수가 양수인 사차함수가 극댓값을 가질 조건: $f'(x)=0$이 서로 다른 세 실근.\n$f'(x)=4x(x^{2}+3x+a)$. $x^{2}+3x+a=0$이 $0$이 아닌 서로 다른 두 실근을 가져야 한다.\n$9-4a\\gt 0$ → $a\\lt \\frac94$, 그리고 $x=0$이 근이 아니어야 하므로 $a\\ne0$.\n$|a|\\le5$: $-5,\\cdots,-1,\\,1,\\,2$의 $7$개.", "key": "Tm05-14"}, "tm05-14-2": {"id": "tm05-14-2", "unit": "m05", "theme": "14", "벌": 2, "k": "num", "q": "함수 $f(x)=x^{4}-4ax^{3}+6x^{2}$이 극댓값을 갖지 않도록 하는 정수 $a$의 개수를 구하시오.", "a": "3", "lvl": 2, "w": "[핵심] 극댓값이 없으려면 $f'(x)=0$이 서로 다른 세 실근을 갖지 않아야 한다.\n$f'(x)=4x(x^{2}-3ax+3)$. $x=0$은 $x^{2}-3ax+3=0$의 근이 될 수 없으므로 조건은 $x^{2}-3ax+3=0$의 $D\\le0$.\n$9a^{2}-12\\le0$ → $a^{2}\\le\\frac43$.\n정수 $a=-1,\\,0,\\,1$의 $3$개.", "key": "Tm05-14"}, "tm05-14-3": {"id": "tm05-14-3", "unit": "m05", "theme": "14", "벌": 3, "k": "num", "q": "사차함수 $f(x)$의 도함수가 $f'(x)=4(x-1)(x^{2}-2ax+4)$일 때, $f(x)$가 극댓값을 갖지 않도록 하는 실수 $a$의 최댓값을 구하시오.", "a": "5/2", "lvl": 3, "w": "[핵심] 세 실근이 '서로 다른지'는 판별식과 '이미 있는 근과 겹치는지' 두 가지로 따진다.\n극댓값을 가질 조건: $x^{2}-2ax+4=0$이 $1$이 아닌 서로 다른 두 실근 → $a^{2}\\gt 4$이고 $1-2a+4\\ne0$.\n따라서 극댓값이 없으려면 $-2\\le a\\le2$ 또는 $a=\\frac52$.\n$a=\\frac52$이면 $f'(x)=4(x-1)^{2}(x-4)$로 부호가 한 번만 바뀐다. 최댓값은 $\\frac52$.", "key": "Tm05-14"}, "tm05-15-1": {"id": "tm05-15-1", "unit": "m05", "theme": "15", "벌": 1, "k": "num", "q": "닫힌구간 $[-1,\\,4]$에서 함수 $f(x)=x^{3}-6x^{2}+9x+1$의 최댓값을 $M$, 최솟값을 $m$이라 할 때, $M+m$의 값을 구하시오.", "a": "-10", "lvl": 2, "w": "[핵심] 후보는 구간 안의 극값과 양 끝 값.\n$f'(x)=3(x-1)(x-3)$. $f(-1)=-15$, $f(1)=5$, $f(3)=1$, $f(4)=5$.\n$M=5$, $m=-15$이므로 $M+m=-10$.", "key": "Tm05-15"}, "tm05-15-2": {"id": "tm05-15-2", "unit": "m05", "theme": "15", "벌": 2, "k": "num", "q": "닫힌구간 $[-1,\\,3]$에서 함수 $f(x)=x^{4}-8x^{2}+3$의 최댓값과 최솟값의 차를 구하시오.", "a": "25", "lvl": 2, "w": "[핵심] 구간 밖의 극값($x=-2$)은 후보가 아니다.\n$f'(x)=4x(x+2)(x-2)$. 구간 안의 후보 $x=0,\\,2$와 양 끝.\n$f(-1)=-4$, $f(0)=3$, $f(2)=-13$, $f(3)=12$.\n최댓값 $12$, 최솟값 $-13$, 차는 $25$.", "key": "Tm05-15"}, "tm05-15-3": {"id": "tm05-15-3", "unit": "m05", "theme": "15", "벌": 3, "k": "num", "q": "닫힌구간 $[0,\\,3]$에서 함수 $f(x)=(x^{2}-2x)^{3}-3(x^{2}-2x)$의 최댓값을 $M$, 최솟값을 $m$이라 할 때, $M+m$의 값을 구하시오.", "a": "16", "lvl": 3, "w": "[핵심] $t=x^{2}-2x$로 치환하고 $t$의 범위부터 구한다.\n$0\\le x\\le3$에서 $t=(x-1)^{2}-1$의 범위는 $-1\\le t\\le3$.\n$g(t)=t^{3}-3t$, $g'(t)=3(t+1)(t-1)$. $g(-1)=2$, $g(1)=-2$, $g(3)=18$.\n$M=18$, $m=-2$, $M+m=16$.", "key": "Tm05-15"}, "tm05-16-1": {"id": "tm05-16-1", "unit": "m05", "theme": "16", "벌": 1, "k": "num", "q": "닫힌구간 $[-1,\\,4]$에서 함수 $f(x)=x^{3}-3x^{2}+a$의 최솟값이 $-2$일 때, 최댓값을 구하시오. (단, $a$는 상수이다.)", "a": "18", "lvl": 2, "w": "[핵심] 최솟값 후보를 모두 $a$로 나타내 비교한다.\n$f'(x)=3x(x-2)$. $f(-1)=a-4$, $f(0)=a$, $f(2)=a-4$, $f(4)=a+16$.\n최솟값 $a-4=-2$ → $a=2$. 최댓값은 $f(4)=18$.", "key": "Tm05-16"}, "tm05-16-2": {"id": "tm05-16-2", "unit": "m05", "theme": "16", "벌": 2, "k": "num", "q": "닫힌구간 $[-1,\\,2]$에서 함수 $f(x)=ax^{4}-2ax^{2}+b$의 최댓값이 $13$, 최솟값이 $4$일 때, $a+b$의 값을 구하시오. (단, $a$, $b$는 상수이고 $a\\gt 0$이다.)", "a": "6", "lvl": 2, "w": "[핵심] $a\\gt 0$이므로 증감표가 정해지고, 후보값을 비교할 수 있다.\n$f'(x)=4ax(x+1)(x-1)$. $f(-1)=f(1)=b-a$, $f(0)=b$, $f(2)=8a+b$.\n$a\\gt 0$이므로 최댓값 $8a+b=13$, 최솟값 $b-a=4$.\n$a=1$, $b=5$, $a+b=6$.", "key": "Tm05-16"}, "tm05-16-3": {"id": "tm05-16-3", "unit": "m05", "theme": "16", "벌": 3, "k": "num", "q": "양수 $a$에 대하여 닫힌구간 $[0,\\,2]$에서 함수 $f(x)=x^{3}-3ax$의 최솟값이 $-28$일 때, $a$의 값을 구하시오.", "a": "6", "lvl": 3, "w": "[핵심] 극소점 $x=\\sqrt{a}$가 구간 안에 있는지로 경우를 나눈다.\n$f'(x)=3(x^{2}-a)$, 극소점 $x=\\sqrt a$.\n(i) $\\sqrt a\\le2$($0\\lt a\\le4$): 최솟값 $f(\\sqrt a)=-2a\\sqrt a=-28$ → $a\\sqrt a=14$ → $a=14^{\\frac23}\\gt 4$이므로 모순.\n(ii) $a\\gt 4$: 구간에서 감소하므로 최솟값 $f(2)=8-6a=-28$ → $a=6$ (조건 만족).\n$a=6$.", "key": "Tm05-16"}, "tm05-17-1": {"id": "tm05-17-1", "unit": "m05", "theme": "17", "벌": 1, "k": "num", "q": "곡선 $y=12-x^{2}$ $(0\\lt x\\lt 2\\sqrt3)$ 위의 점 $\\mathrm{P}$에서 $x$축, $y$축에 내린 수선의 발을 각각 $\\mathrm{H}$, $\\mathrm{K}$라 하자. 직사각형 $\\mathrm{OHPK}$의 넓이의 최댓값을 구하시오. (단, $\\mathrm{O}$는 원점이다.)", "a": "16", "lvl": 2, "w": "[핵심] 변수 $t$와 그 범위를 먼저 정하고 넓이를 $t$의 함수로 쓴다.\n$\\mathrm{P}(t,\\,12-t^{2})$ $(0\\lt t\\lt 2\\sqrt3)$, $S(t)=t(12-t^{2})=12t-t^{3}$.\n$S'(t)=12-3t^{2}=0$ → $t=2$. $t=2$의 좌우에서 $+$에서 $-$로 바뀌므로 극대이자 최대.\n$S(2)=2\\cdot8=16$.", "key": "Tm05-17"}, "tm05-17-2": {"id": "tm05-17-2", "unit": "m05", "theme": "17", "벌": 2, "k": "num", "q": "밑면이 정사각형인 직육면체의 모든 모서리의 길이의 합이 $48$일 때, 이 직육면체의 부피의 최댓값을 구하시오.", "a": "64", "lvl": 2, "w": "[핵심] 조건식으로 변수를 하나로 줄이고 범위를 적는다.\n밑면의 한 변을 $x$, 높이를 $h$라 하면 $8x+4h=48$, $h=12-2x$ $(0\\lt x\\lt 6)$.\n$V(x)=x^{2}(12-2x)=12x^{2}-2x^{3}$, $V'(x)=6x(4-x)=0$ → $x=4$.\n$x=4$에서 극대이자 최대, $V(4)=16\\cdot4=64$.", "key": "Tm05-17"}, "tm05-17-3": {"id": "tm05-17-3", "unit": "m05", "theme": "17", "벌": 3, "k": "c5", "q": "반지름의 길이가 $3$인 구에 내접하는 원뿔 중에서 부피가 최대인 원뿔의 부피는?", "a": "$\\dfrac{32}{3}\\pi$", "lvl": 3, "w": "[핵심] 높이 $h$를 변수로, 밑면의 반지름을 $h$로 나타낸다.\n구의 중심에서 밑면까지의 거리는 $|h-3|$이므로 $r^{2}=9-(h-3)^{2}=6h-h^{2}$ $(0\\lt h\\lt 6)$.\n$V(h)=\\frac{\\pi}{3}r^{2}h=\\frac{\\pi}{3}(6h^{2}-h^{3})$, $V'(h)=\\frac{\\pi}{3}(12h-3h^{2})=0$ → $h=4$.\n$h=4$에서 최대, $V(4)=\\frac{\\pi}{3}(96-64)=\\frac{32}{3}\\pi$.", "c": ["$9\\pi$", "$\\dfrac{32}{3}\\pi$", "$12\\pi$", "$\\dfrac{16}{3}\\pi$", "$32\\pi$"], "key": "Tm05-17"}}, "need": {"C": 2, "T": 1}, "gap": 3};

const hm=s=>{ const [h,m]=String(s).split(':').map(Number); return h*60+(m||0); };

/* 문항 글자: 이스케이프 후 줄바꿈만 살린다. ㄱ.·(가) 앞은 자동 줄바꿈 */
function T(s){
  let h=E(s).replace(/&lt;br\s*\/?&gt;/gi,'\n').replace(/&lt;(\/?)b&gt;/gi,'<$1b>');
  // 보기 나열은 줄을 나눈다(감리 R7: 수식 안·문장 속 빈칸 (가)는 건드리지 않는다)
  const M=[]; h=h.replace(/\$[^$]*\$/g,m=>{ M.push(m); return '\u0000'+(M.length-1)+'\u0001'; });
  h=h.replace(/\s+(?=[ㄱ-ㅎ]\.\s)/g,'\n');                                   // ㄱ. ㄴ. ㄷ.
  if(/(^|[.?:。\n]\s*)\(가\)\s/.test(h))                                        // (가)가 문장 머리에서 시작하는 '조건 나열'일 때만
    h=h.replace(/\s+(?=\((?:가|나|다|라|마)\)\s)/g,'\n');
  h=h.replace(/\u0000(\d+)\u0001/g,(_,i)=>M[+i]);
  return h.replace(/\n+/g,'<br>');
}

/* ── 상태 계산 ──
 * 인정 성공 = 정답+확실 이면서 '그날 그 문항의 첫 시도'(해설 보고 같은 문항을 다시 맞힌 건 안 센다).
 * 성공일 = 그날 서로 다른 인정 성공 문항 수 ≥ NEED.  (schema_v36 뷰와 같은 규칙) */
function succDays(rows,from){
  const need=BANK.need[rows.length?rows[0][0][0]:'T']||1;
  const first=new Set(), per={};
  rows.forEach((r,i)=>{ const d=r[5].slice(0,10), id=d+'|'+r[1]; const isFirst=!first.has(id); first.add(id);
    if(i>=from && isFirst && r[2] && r[3]==='확실') (per[d]=per[d]||new Set()).add(r[1]); });
  return Object.keys(per).filter(d=>per[d].size>=need).sort();
}
function keyState(k){
  const rows=LOG.filter(r=>r[0]===k);
  if(!rows.length) return {st:'new',n:0};
  let lastFail=-1; rows.forEach((r,i)=>{ if(!(r[2]&&r[3]==='확실')) lastFail=i; });
  const days=succDays(rows,lastFail+1);
  const last=rows[rows.length-1][5];
  if(days.length>=2 && dnum(days[days.length-1])-dnum(days[0])>=BANK.gap) return {st:'grad',n:rows.length,days,last};
  if(days.length>=1) return {st:'one',n:rows.length,days,last};
  return {st:lastFail>=0?'fail':'try',n:rows.length,last,failAt:lastFail>=0?rows[lastFail][5]:null};
}
function openDate(ck){ return UNL[ck] || ((SET.schedule[BAN]||{})[ck]) || null; }
function cOpen(ck){ const d=openDate(ck); return !!d && (d<TODAY || (d===TODAY && afterClass())); }   // (1018) 오늘 수업하는 개념은 수업이 끝난 뒤에 연다
function cPassed(ck){ const s=keyState(ck).st; return s==='one'||s==='grad'; }
function everPassed(ck){   // 한 번이라도 '1회'였던 개념(그때의 마지막 실패 뒤로만 센다)
  const rows=LOG.filter(r=>r[0]===ck);
  for(let j=1;j<=rows.length;j++){ const sub=rows.slice(0,j); let lf=-1; sub.forEach((r,i)=>{ if(!(r[2]&&r[3]==='확실')) lf=i; });
    if(succDays(sub,lf+1).length) return true; }
  return false;
}
function tOpen(tk){ return cOpen(TKEY2C[tk]) && everPassed(TKEY2C[tk]); }   // 열린 유형은 개념을 다시 틀려도 닫지 않는다
function isDue(k){

}

function hash(s){ let h=2166136261; for(const c of s){ h^=c.charCodeAt(0); h=Math.imul(h,16777619);} return h>>>0; }
function pickItems(k,n,exclude,seed){
  const today=new Set(LOG.filter(r=>r[0]===k && r[5].slice(0,10)===TODAY).map(r=>r[1]));
  let its=(BYKEY[k]||[]).filter(x=>!exclude.has(x.id));
  if(its.some(x=>!today.has(x.id))) its=its.filter(x=>!today.has(x.id));   // 오늘 푼 문항은 다시 안 낸다(남는 게 없을 때만 허용)
  if(seed) return its.sort((a,b)=>hash(seed+a.id)-hash(seed+b.id)).slice(0,n);
  const seen={}; LOG.forEach(r=>{ if(r[0]===k) seen[r[1]]=r[5]; });
  const lastB=(()=>{ for(let i=LOG.length-1;i>=0;i--) if(LOG[i][0]===k){ const it=ITEMS[LOG[i][1]]; return it?it.벌:null; } return null; })();
  return its.map(x=>({x,s:seen[x.id]||'', r:hash(TODAY+x.id)}))
    .sort((a,b)=> (a.s===''?0:1)-(b.s===''?0:1) || a.s.localeCompare(b.s) || ((a.x.벌===lastB)-(b.x.벌===lastB)) || a.r-b.r)
    .slice(0,n).map(o=>o.x);
}

/* ── 세션 구성 ── */
function lastClassConcepts(){
  const ds={}; CONCEPTS.forEach(c=>{ const d=openDate(c.key); if(d && d<TODAY) (ds[d]=ds[d]||[]).push(c.key); });
  const ks=Object.keys(ds).sort(); return ks.length?ds[ks[ks.length-1]]:[];
}
function dueTypes(exclude){
  const out=[];
  CONCEPTS.forEach(c=>c.themes.forEach(t=>{ if(tOpen(t.key) && isDue(t.key) && !exclude.has(t.key)) out.push(t.key); }));
  return out.sort((a,b)=>PRI[keyState(a).st]-PRI[keyState(b).st] || a.localeCompare(b));
}
function dueConcepts(){
  return CONCEPTS.filter(c=>cOpen(c.key) && isDue(c.key)).map(c=>c.key)
    .sort((a,b)=>PRI[keyState(a).st]-PRI[keyState(b).st] || a.localeCompare(b));
}
function buildReviewConcept(){
  const lc=lastClassConcepts(); const used=new Set(LOG.filter(r=>r[5].slice(0,10)===TODAY).map(r=>r[1])), out=[];
  if(!lc.length) return out;
  // 반 공통: 날짜 seed. 개념이 둘이면 하나씩
  const N=reviewCN();
  for(let i=0;out.length<N && i<N*2;i++){
    const k=lc[i%lc.length]; const p=pickItems(k,1,used,'R'+TODAY+BAN.slice(0,2)); if(p[0]){ used.add(p[0].id); out.push(p[0]); }
  }
  return out;
}
// (1019 A안) 유형 3칸 = 지난 수업 개념의 열린 유형을 개념마다 번갈아. 모자라면 다른 열린 유형(다시 볼 때 된 것).
// 개념 문항으로 채우지 않는다 — 개념을 놓친 학생은 리뷰가 개념 4로 끝나고 그 개념은 저녁 루프로 간다.
function reviewTypeKeys(){
  const rank=k=>{ const st=keyState(k).st; return (isDue(k)?0:10)+(PRI[st]!=null?PRI[st]:5); };
  const groups=lastClassConcepts().map(ck=>(CBYKEY[ck]?CBYKEY[ck].themes:[]).map(t=>t.key).filter(tOpen).sort((a,b)=>rank(a)-rank(b)||a.localeCompare(b)));
  const out=[];
  for(let i=0;out.length<REVIEW_T && groups.some(g=>g.length);i++){ const g=groups[i%groups.length]; if(g.length) out.push(g.shift()); }
  if(out.length<REVIEW_T) for(const k of dueTypes(new Set(out))){ if(out.length>=REVIEW_T) break; out.push(k); }
  return out;
}
function buildReviewType(usedIds){
  const out=[];
  for(const k of reviewTypeKeys()){ const p=pickItems(k,1,usedIds); if(p[0]){ usedIds.add(p[0].id); out.push(p[0]); } }
  return out;
}
function buildLoop(){
  const out=[], used=new Set();
  dueConcepts().slice(0,LOOP_C_KEYS).forEach(k=>pickItems(k,LOOP_C_ITEMS,used).forEach(x=>{ used.add(x.id); out.push(x); }));
  dueTypes(new Set()).slice(0,LOOP_T).forEach(k=>pickItems(k,1,used).forEach(x=>{ used.add(x.id); out.push(x); }));
  return out;
}
// (1020 유강 (가)) 루프 과제는 하루 1회 — 그날 처음 연 세트를 고정하고, 다 풀면 내일까지 닫는다.
//   틀린 것은 다음 날 루프로 돌아온다(같은 날 같은 유형을 끝없이 다시 내지 않는다 — 1019 T06 11회 사고).
//   세트는 이 기기 localStorage(lset_날짜)에 둔다. 다른 기기·저장소가 비었는데 오늘 루프 기록이 있으면 '오늘 완료'.
function loopToday(){
  const k='lset_'+TODAY, ids=lget(k,null);
  const done=new Set(LOG.filter(r=>r[5].slice(0,10)===TODAY && r[4]==='루프').map(r=>r[1]));
  if(ids){
    const rest=ids.filter(id=>!done.has(id)).map(id=>ITEMS[id]).filter(Boolean);
    return {items:rest, started:done.size>0, finished:!rest.length};
  }
  if(done.size) return {items:[], started:true, finished:true};
  const fresh=buildLoop();
  if(fresh.length) lset(k, fresh.map(x=>x.id));
  return {items:fresh, started:false, finished:false};
}
function loopAdd(id){ const k='lset_'+TODAY, ids=lget(k,[]); if(!ids.includes(id)){ ids.push(id); lset(k,ids); } }
function todayRows(mode){ return LOG.filter(r=>r[5].slice(0,10)===TODAY && r[4]===mode).length; }

/* ── 홈: 버튼 + 단원 지도 ── */
const ST_LABEL={lock:'잠김',new:'열림',try:'하는 중',fail:'다시',one:'1회',grad:'졸업'};
function cellState(k){
  if(k[0]==='C'){ if(!cOpen(k)) return 'lock'; }
  else if(!tOpen(k)) return 'lock';
  const s=keyState(k).st; return s==='try'?'new':s;
}

  H.push(`<div class="guide">개념을 <b>확실하게</b> 맞히면 그 개념의 유형이 열려요. 같은 개념·유형을 <b>3일 이상 떨어진 두 날</b> 확실하게 맞히면 졸업이에요.<br>`
    +`틀리거나 <b>애매</b>했던 개념·유형은 다시 돌아와요. 애매할 땐 애매하다고 눌러야 정확해져요.</div>`);

/* ── 풀이 세션 ── */
let S=null;   // {mode, q:[item], i, res:[], phase, used:Set}
function startSession(mode, preset){
  if(mode==='리뷰'){
    const c=buildReviewConcept(); S={mode,q:c,i:0,res:[],used:new Set(c.map(x=>x.id)),typeBuilt:false,back:0};
    if(!c.length){ S.typeBuilt=true; S.q=buildReviewType(S.used); }
  } else S={mode,q:preset,i:0,res:[],used:new Set(preset.map(x=>x.id)),typeBuilt:true,back:0};
  if(!S.q.length){ drawHome(); return; }
  drawItem();
}
function cOf(item){ return item.key[0]==='C'?CBYKEY[item.key]:CBYKEY[TKEY2C[item.key]]; }
function kindLabel(x){
  const c=cOf(x);
  if(x.key[0]==='C') return ['개념 '+c.no, c.title];
  const th=c.themes.find(t=>t.key===x.key); return ['유형 '+(th?th.no:''), th?th.name:''];
}
function cardHTML(c){
  return `<div class="cbox"><div class="ct">개념 정리 · ${E(c.title)}</div>`
    +c.card.map(([t,x])=>`<div class="cl"><em class="${t==='주의'?'ju':''}">${E(t)}</em><span>${x}</span></div>`).join('')+`</div>`;
}
function themeOf(x){ const c=cOf(x); return x.key[0]==='T'?(c.themes.find(t=>t.key===x.key)||null):null; }
// (1020 유강 '개념카드는 교재를 잘 활용') 유형 = 수업교재 CORE TRAINING 의 시선 + 예제(풀이 단계)
function bookHTML(th){
  const b=th&&th.book; if(!b) return '';
  return `<div class="bbox"><div class="ct">교재 · 유형 ${E(th.no)} ${E(th.name)}</div>`
    +(b.sight?`<div class="sg">${b.sight}</div>`:'')
    +(b.ex&&b.ex.body?`<div class="eh">교재 예제</div><div class="eb">${b.ex.body}</div>`
      +(b.ex.sol&&b.ex.sol.length?`<ol>${b.ex.sol.map(t=>`<li>${t}</li>`).join('')}</ol>`:'')
      +(b.ex.ans?`<div class="ea">답 ${b.ex.ans}</div>`:''):'')
    +`</div>`;
}
function drawItem(){
  document.body.classList.add('sess');
  const x=S.q[S.i]; const [kl,kn]=kindLabel(x); const n=S.q.length;
  let A='';
  if(x.k==='ox') A=`<div class="ox" id="ans"><button data-a="O">O</button><button data-a="X">X</button></div>`;
  else if(x.k==='c4'||x.k==='c5'){
    const order=x.c.map((c,j)=>({c,r:hash(x.id+j)})).sort((a,b)=>a.r-b.r).map(o=>o.c);
    A=`<div class="chs" id="ans">${order.map((c,j)=>`<button data-a="${E(c)}"><em>${'①②③④⑤'[j]}</em>${T(c)}</button>`).join('')}</div>`;
  } else A=`<div class="num" id="ans"><input id="numIn" inputmode="numeric" autocomplete="off" placeholder="답"><button class="k" data-k="-">−</button><button class="k" data-k="/">/</button><button class="ok" id="numOk">답 넣기</button></div>`;
  const dots=S.q.map((_,j)=>`<i class="${j<S.res.length?(S.res[j].ok?'o':'x'):''}${j===S.i?' cur':''}"></i>`).join('');
  $('app').innerHTML=`<div class="top"><button class="back" id="bk">그만하기</button><div class="fname"><b>${S.mode==='리뷰'?'리뷰테스트':'루프 과제'}</b> · ${S.i+1}/${n}${S.mode==='리뷰'&&!S.typeBuilt?' + 유형':''}</div></div>`
    +`<div class="dots">${dots}</div>`
    +(S.note?`<div class="note">${S.note}</div>`:'')
    +`<div class="qwrap"><div class="qmain">`
    +`<div class="qcard"><div class="kind"><span>${E(kl)}</span><span>${E(kn)}</span></div><div class="q">${T(x.q)}</div>`
    +(x.key[0]==='T'?`<div class="sheet">✎ 연습지 ${S.q.slice(0,S.i+1).filter(z=>z.key[0]==='T').length}번에 풀고 답만 넣어요</div>`:'')+`</div>`
    +A
    +`<div class="conf" id="conf"><p>이 답, 얼마나 확실해요?</p><div class="row2"><button class="sure" data-c="확실">확실해요</button><button class="unsure" data-c="애매">애매해요</button></div></div>`
    +`<button class="next" id="nx">${S.i+1<n||(!S.typeBuilt)?'다음':'끝'}</button>`
    +`</div><div class="qside"><div class="res" id="res"></div><div id="cbx"></div><div id="bbx"></div></div></div>`;
  S.note=null; S.pick=null; S.t0=Date.now();
  tex($('app'));
  $('bk').onclick=()=>finish(true);
  const showConf=()=>{ $('conf').classList.add('show'); $('conf').scrollIntoView({block:'nearest',behavior:'smooth'}); };
  if(x.k==='num'){
    const inp=$('numIn');
    $('ans').querySelectorAll('.k').forEach(b=>b.onclick=()=>{ inp.value+=b.dataset.k==='-'?'-':'/'; inp.focus(); });
    const go=()=>{ const v=inp.value.trim(); if(!v) return; S.pick=v; inp.disabled=true; $('ans').querySelectorAll('button').forEach(b=>b.disabled=true); showConf(); };
    $('numOk').onclick=go; inp.onkeydown=e=>{ if(e.key==='Enter') go(); };
  } else {
    $('ans').querySelectorAll('button').forEach(b=>b.onclick=()=>{
      if($('conf').dataset.lock) return;
      $('ans').querySelectorAll('button').forEach(z=>z.classList.remove('on')); b.classList.add('on'); S.pick=b.dataset.a; showConf(); });
  }
  $('conf').querySelectorAll('button').forEach(b=>b.onclick=()=>grade(b.dataset.c));
  $('nx').onclick=next;
  window.scrollTo(0,0);
}
function frac(s){
  s=String(s).replace(/\s/g,'').replace(/[−–]/g,'-');
  const m=s.match(/^(-?)(\d+)(?:\/(\d+))?$/); if(!m) return null;
  return [ (m[1]?-1:1)*+m[2], m[3]?+m[3]:1 ];
}
function same(a,b){ const p=frac(a), q=frac(b); return !!p&&!!q&&q[1]!==0&&p[1]!==0&&p[0]*q[1]===q[0]*p[1]; }
function grade(conf){
  const x=S.q[S.i]; if($('conf').dataset.lock) return; $('conf').dataset.lock='1';
  const ok = x.k==='num' ? same(S.pick,x.a) : S.pick===x.a;
  const ms=Date.now()-S.t0;
  if(x.k==='num'){ $('ans').classList.add(ok?'right':'wrong'); }
  else $('ans').querySelectorAll('button').forEach(b=>{ b.disabled=true; if(b.dataset.a===x.a) b.classList.add('right'); else if(b.dataset.a===S.pick) b.classList.add('wrong'); });
  $('conf').querySelectorAll('button').forEach(b=>b.disabled=true);
  $('conf').style.display='none';
  const succ=ok&&conf==='확실';
  const r=$('res'); r.className='res show '+(succ?'o':ok?'u':'x');
  r.innerHTML=`<div class="h">${succ?'맞았어요':ok?'맞았지만 애매 — 다시 돌아와요':'틀렸어요'}</div>`
    +(ok?'':`<div class="w" style="margin-bottom:6px">정답: <b>${x.k==='ox'?x.a:T(x.a)}</b>${x.k==='num'?` · 내 답 ${E(S.pick)}`:''}</div>`)
    +`<div class="w">${T(x.w)}</div>`
    +`<div class="btn2"><button class="cardbtn" id="cb">개념 정리 보기</button>${themeOf(x)&&themeOf(x).book?'<button class="cardbtn bk" id="bb">교재 예제 보기</button>':''}</div>`;
  const c=cOf(x), th=themeOf(x);
  $('cb').onclick=()=>{ $('cbx').innerHTML=$('cbx').innerHTML?'':cardHTML(c); tex($('cbx')); };
  if($('bb')) $('bb').onclick=()=>{ $('bbx').innerHTML=$('bbx').innerHTML?'':bookHTML(th); tex($('bbx')); };
  // 틀리거나 애매하면 교재를 바로 펼쳐 둔다 — 개념은 개념 정리, 유형은 교재 예제(시선·풀이)
  if(!succ){ if(x.key[0]==='C'){ $('cbx').innerHTML=cardHTML(c); tex($('cbx')); } else if(th&&th.book){ $('bbx').innerHTML=bookHTML(th); tex($('bbx')); } }
  tex(r);
  const row={k:x.key,i:x.id,m:S.mode,a:String(S.pick).slice(0,40),o:ok,c:conf,ms:Math.min(ms,9999999)};
  S.res.push({x,ok:succ,raw:ok,conf});
  LOG.push([x.key,x.id,ok,conf,S.mode,nowKST()]);
  queue([row]);
  // 유형을 놓치면 그 개념으로 되돌림 — 개념 문항 하나 덧붙임(루프만, 최대 BACK_C)
  if(!succ && x.key[0]==='T' && S.mode==='루프' && S.back<BACK_C){
    const ck=TKEY2C[x.key]; const p=pickItems(ck,1,S.used);
    if(p[0]){ S.used.add(p[0].id); S.q.push(p[0]); S.back++; loopAdd(p[0].id); }
  }
  // 리뷰: 개념 파트를 끝내면 그 자리에서 유형을 고른다(방금 열린 유형 포함)
  if(S.mode==='리뷰' && !S.typeBuilt && S.i===S.q.length-1){
    S.typeBuilt=true; const before=new Set(CONCEPTS.flatMap(c=>c.themes.map(t=>t.key)).filter(tOpen));
    const ty=buildReviewType(S.used); ty.forEach(t=>S.used.add(t.id)); S.q.push(...ty);
    const now=CONCEPTS.flatMap(c=>c.themes.map(t=>t.key)).filter(tOpen).filter(k=>!before.has(k));
    if(now.length) S.nextNote=`유형 ${now.length}개가 열렸어요 — 바로 이어서 풀어요`;
  }
  $('nx').textContent=S.i+1<S.q.length?'다음':'끝'; $('nx').classList.add('show');
  $('nx').scrollIntoView({block:'nearest',behavior:'smooth'});
}
function next(){ S.i++; if(S.nextNote){ S.note=S.nextNote; S.nextNote=null; } if(S.i<S.q.length) drawItem(); else finish(false); }

async function finish(early){
  document.body.classList.remove('sess');
  const res=S.res; if(!res.length){ drawHome(); return; }
  const okN=res.filter(r=>r.ok).length;
  const L=res.map(r=>{ const [kl,kn]=kindLabel(r.x); const cls=r.ok?'lo':r.raw?'lu':'lx';
    return `<div class="${cls}"><em>${r.ok?'확실':r.raw?'애매':'다시'}</em>${E(kl)} · ${E(kn)}</div>`; }).join('');
  $('app').innerHTML=`<div class="done"><b>${early?'여기까지':'끝'} — 확실히 맞힌 것 ${okN}/${res.length}</b>`
    +`<p>${okN===res.length?'전부 확실해요. 이 개념·유형들은 며칠 뒤 한 번 더 보면 졸업이에요.':'틀리거나 애매했던 건 다음 루프에 다시 와요.'}</p>`
    +`<div class="save" id="sv">기록 보내는 중…</div></div><div class="list">${L}</div>`
    +`<div class="btns"><button class="p" id="home">단원 지도 보기</button></div>`;
  if(S.mode==='리뷰' && !early) lset('rdone_'+TODAY,true);
  $('home').onclick=drawHome; S=null;
  const ok=await flush();
  const sv=$('sv'); if(sv){ sv.textContent=ok?'기록 저장됨':'인터넷이 불안정해서 이 기기에 보관했어요. 다음에 열면 자동으로 보내요'; if(!ok) sv.classList.add('bad'); }
}

/* ── 보내기(대기열) ── */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,10);
function queue(rows){ const q=lget('queue',[]).concat(rows.map(r=>({...r,u:r.u||uid(),t:r.t||nowKST()}))); lset('queue',q); flush(); }
let flushing=false;
async function flush(){
  if(DEMO){ lset('demo_log',LOG); lset('queue',[]); return true; }
  if(!sb) return !lget('queue',[]).length;
  if(flushing){ for(let w=0;w<60&&flushing;w++) await new Promise(r=>setTimeout(r,250)); if(!lget('queue',[]).length) return true; if(flushing) return false; }
  flushing=true;
  try{
    // 보낸 행은 uid 로 지운다 — 보내는 동안 새로 쌓인 행을 덮어쓰지 않게(감리 M1). 재전송은 서버 uid 유일키가 막는다(M2)
    for(let guard=0; guard<50; guard++){
      const q=lget('queue',[]); if(!q.length) return true;
      const chunk=q.slice(0,30);
      const {data,error}=await sb.rpc('mastery_submit',{tok:TOK,skey:SKEY,recs:chunk});
      if(error||!data) return false;
      const sent=new Set(chunk.map(r=>r.u));
      lset('queue',lget('queue',[]).filter(r=>!sent.has(r.u)));
    }
    return !lget('queue',[]).length;
  }catch(e){ return false; } finally{ flushing=false; }
}

/* ── 시작 ── */
function setup(){
  SET=BANK.sets[SKEY];
  CONCEPTS=SET.units.flatMap(u=>u.concepts); CBYKEY={}; TKEY2C={};
  CONCEPTS.forEach(c=>{ CBYKEY[c.key]=c; c.themes.forEach(t=>TKEY2C[t.key]=c.key); });
}
function pickSet(ban){
  const g=(ban||'').slice(0,2);
  return Object.keys(BANK.sets).find(k=>BANK.sets[k].학년===g)||null;
}
async function boot(){
  const P=new URLSearchParams(location.search);
  TOK=(P.get('t')||'').trim(); DEMO=P.get('demo')==='1';
  if(DEMO){
    NAME='미리보기'; BAN=P.get('ban')||'고1A'; SKEY=pickSet(BAN); if(!SKEY) SKEY='core_m2';
    TODAY=(P.get('today')||nowKST()).slice(0,10); setup();
    if(P.get('class')) CLASS=P.get('class').split(',').map(x=>x.split('-'));   // 미리보기: &class=15:00-17:00
    LOG=lget('demo_log',[]);
  } else {
    if(TOK.length<16){ $('msg').innerHTML='<b>링크가 올바르지 않아요</b>포털에서 다시 들어와 주세요.'; return; }
    if(!sb){ $('msg').innerHTML='<b>연결이 안 돼요</b>잠시 뒤 다시 열어 주세요.'; return; }
    // 학년을 모르니 두 세트를 차례로 연다 — 반이 정해지면 맞는 세트로
    let d=null;
    try{ const r=await sb.rpc('mastery_open',{tok:TOK,skey:'core_m2'}); d=r.data; }catch(e){}
    if(!d){ $('msg').innerHTML='<b>열 수 없는 링크예요</b>쌤에게 새 링크를 받아 주세요.'; return; }
    NAME=d.이름; BAN=d.반; TODAY=d.오늘; SKEY=pickSet(BAN);
    CLASS=Array.isArray(d.수업)?d.수업:[];    // 서버가 시간표를 안 주면(v40 전) 리뷰는 닫힌다
    if(d.지금){ const t=Date.parse(d.지금+'+09:00'); if(!isNaN(t)) SKEW=t-Date.now(); }
    if(!SKEY){ $('msg').innerHTML='<b>아직 이 반은 CORE 루프가 없어요</b>'; return; }
    if(SKEY!=='core_m2'){ try{ const r=await sb.rpc('mastery_open',{tok:TOK,skey:SKEY}); d=r.data||d; }catch(e){} }
    setup();
    LOG=(d.기록||[]).map(r=>[r[0],r[1],r[2],r[3],r[4],r[5]]); UNL=d.열림||{};
    // 아직 못 보낸 기록도 상태에 반영
    lget('queue',[]).forEach(r=>LOG.push([r.k,r.i,r.o,r.c,r.m,r.t||nowKST()]));
    LOG.sort((a,b)=>a[5].localeCompare(b[5]));
    flush();
  }
  $('msg').style.display='none'; $('app').style.display='block';
  waitKatex(drawHome);
}
boot();
// (1018) 홈을 열어 둔 채 수업 시간이 되면/끝나면 [수업 리뷰]를 다시 그린다
setInterval(()=>{ if(!S && SET && $('app').style.display==='block' && HOME_OPEN!==null && inClass()!==HOME_OPEN) drawHome(); }, 20000);
// 자정을 넘겨 열어 둔 페이지는 다시 연다(감리 R8) — 풀이 중이면 건드리지 않는다
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && !DEMO && !S && TODAY && nowKST().slice(0,10)!==TODAY) location.reload(); });
