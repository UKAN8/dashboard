=4x^{3}-4=4(x-1)(x^{2}+x+1)$<br>$f'(x)=0$에서 $x=1(\\because \\;x^{2}+x+1>0)$<br>함수 $f(x)$는 $x=1$에서 최솟값 $-a^{2}+a+12$를 갖는다.<br>따라서 모든 실수 $x$에 대하여 $f(x)\\ge 0$이 성립하려면<br>$f(1)=-a^{2}+a+12\\ge 0$<br>$a^{2}-a-12\\le 0,\\;(a+3)(a-4)\\le 0$<br>$\\therefore \\;-3\\le a\\le 4$<br>따라서 구하는 정수 $a$는 $-3,\\;-2,\\;\\cdots ,\\;4$의 $8$개이다.", "k": "num", "a": "8", "q": "모든 실수 $x$에 대하여 부등식 $x^{4}-4x\\ge a^{2}-a-15$가 항상 성립하도록 하는 정수 $a$의 개수를 구하시오.", "key": "Tm06-06"}, "x06x53-154": {"id": "x06x53-154", "unit": "m06", "theme": "07", "벌": "X06x53", "lvl": 2, "fix": true, "src": "문제집 개념원리", "w": "$f(x)\\ge g(x)$에서 $f(x)-g(x)\\ge 0$<br>$h(x)=f(x)-g(x)$라 하면<br>$h(x)=5x^{3}-15x^{2}+k-2$<br>$\\therefore h'(x)=15x^{2}-30x=15x(x-2)$<br>$h'(x)=0$에서<br>$x=0$ 또는 $x=2$<br>따라서 $0<x<3$일 때, 함수 $h(x)$는 $x=2$에서 최솟값 $k-22$를 가지므로 부등식 $h(x)\\ge 0$이 성립하려면<br>$k-22\\ge 0\\therefore k\\ge 22$<br>즉, 실수 $k$의 최솟값은 $22$이다.", "k": "num", "a": "22", "q": "두 함수 $f(x)=5x^{3}-10x^{2}+k,\\;g(x)=5x^{2}+2$에 대하여 $0<x<3$일 때, 부등식 $f(x)\\ge g(x)$가 성립하도록 하는 실수 $k$의 최솟값을 구하시오.", "key": "Tm06-07"}, "x06x53-155": {"id": "x06x53-155", "unit": "m06", "theme": "07", "벌": "X06x53", "lvl": 2, "fix": true, "src": "문제집 개념원리", "w": "$f(x)=x^{3}-12x+a$라 하면<br>$f'(x)=3x^{2}-12=3(x+2)(x-2)$<br>$-2<x<2$일 때 $f'(x)<0$이므로 함수 $f(x)$는 구간 $(\\,-2,\\;2\\,)$에서 감소한다.<br>따라서 $-2<x<2$에서 부등식 $f(x)>0$이 성립하려면 $f(2)\\ge 0$이어야 하므로<br>$-16+a\\ge 0\\therefore a\\ge 16$<br>즉 실수 $a$의 최솟값은 $16$이다.", "k": "num", "a": "16", "q": "$-2<x<2$일 때, 부등식 $x^{3}-12x+a>0$이 성립하도록 하는 실수 $a$의 최솟값을 구하시오.", "key": "Tm06-07"}, "x06x59-131": {"id": "x06x59-131", "unit": "m06", "theme": "07", "벌": "X06x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(x)=x^{3}-6x^{2}+k$라 하면<br>$f' (x)=3x^{2}-12x=3x(x-4)$<br>$1<x<3$일 때 $f' (x)<0$이므로 함수 $f(x)$는 구간 $(1,\\,3)$에서 감소한다.<br>따라서 $1<x<3$에서 $f(x)>0$이 항상 성립하려면 $f(3)\\ge 0$이어야 하므로<br>$27-54+k\\ge 0\\;\\therefore \\;k\\ge 27$", "k": "c5", "c": ["$k\\le 27$", "$-27\\le k<0$", "$0\\le k<15$", "$15\\le k<27$", "$k\\ge 27$"], "a": "$k\\ge 27$", "q": "$1<x<3$일 때, 부등식 $x^{3}-6x^{2}+k>0$이 항상 성립하도록 하는 실수 $k$의 값의 범위는?", "key": "Tm06-07"}, "x06x59-133": {"id": "x06x59-133", "unit": "m06", "theme": "07", "벌": "X06x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$x^{3}+3x^{2}+k<x^{2}+4x$에서<br>$x^{3}+2x^{2}-4x+k<0$<br>$f(x)=x^{3}+2x^{2}-4x+k$라 하면<br>$f' (x)=3x^{2}+4x-4=(x+2)(3x-2)$<br>$2<x<4$일 때 $f' (x)>0$이므로 함수 $f(x)$는 구간 $(2,\\,4)$에서 증가한다.<br>따라서 $2<x<4$에서 $f(x)<0$이 항상 성립하려면 $f(4)\\le 0$이어야 하므로<br>$64+32-16+k\\le 0\\;\\therefore \\;k\\le \\,-80$<br>즉 실수 $k$의 최댓값은 $\\mathrm{-80}$이다.", "k": "c5", "c": ["$\\mathrm{-81}$", "$\\mathrm{-80}$", "$\\mathrm{-79}$", "$\\mathrm{-78}$", "$\\mathrm{-77}$"], "a": "$\\mathrm{-80}$", "q": "$2<x<4$일 때, 부등식 $x^{3}+3x^{2}+k<x^{2}+4x$가 항상 성립하도록 하는 실수 $k$의 최댓값은?", "key": "Tm06-07"}, "x06x59-134": {"id": "x06x59-134", "unit": "m06", "theme": "07", "벌": "X06x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$x>3$에서 곡선 $y=\\dfrac{1}{3}x^{3}-x^{2}$이 직선 $y=\\,-\\dfrac{5}{4}x+k$보다 항상 위쪽에 있으려면 $x>3$에서 부등식 $\\dfrac{1}{3}x^{3}-x^{2}>\\,-\\dfrac{5}{4}x+k$, 즉 $\\dfrac{1}{3}x^{3}-x^{2}+\\dfrac{5}{4}x-k>0$이 항상 성립해야 한다.<br>$f(x)=\\dfrac{1}{3}x^{3}-x^{2}+\\dfrac{5}{4}x-k$라 하면<br>$f'(x)=x^{2}-2x+\\dfrac{5}{4}=(x-1)^{2}+\\dfrac{1}{4}\\ge \\dfrac{1}{4}$<br>$x>3$일 때 $f'(x)>0$이므로 함수 $f(x)$는 구간 $(3,\\,\\infty )$에서 증가한다.<br>따라서 $x>3$에서 $f(x)>0$이 항상 성립하려면 $f(3)\\ge 0$이어야 하므로<br>$-k+\\dfrac{15}{4}\\ge 0\\;\\therefore \\;k\\le \\dfrac{15}{4}$<br>즉 정수 $k$의 최댓값은 $3$이다.", "k": "num", "a": "3", "q": "$x>3$에서 곡선 $y=\\dfrac{1}{3}x^{3}-x^{2}$이 직선 $y=\\,-\\dfrac{5}{4}x+k$보다 항상 위쪽에 있도록 하는 정수 $k$의 최댓값을 구하시오.", "key": "Tm06-07"}, "x06x59-135": {"id": "x06x59-135", "unit": "m06", "theme": "07", "벌": "X06x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(x)=4x^{3}-3x^{2}-6x$라 하면<br>$f' (x)=12x^{2}-6x-6=6(2x+1)(x-1)$<br>$f' (x)=0$에서 $x=\\,-\\dfrac{1}{2}$ 또는 $x=1$<br>따라서 함수 $f(x)$의 최솟값은 $\\mathrm{-5}$이므로 $x\\ge \\,-1$에서 $f(x)\\ge k$가 항상 성립하려면 $k\\le \\,-5$<br>즉 실수 $k$의 최댓값은 $\\mathrm{-5}$이다.", "k": "c5", "c": ["$\\mathrm{3}$", "$\\mathrm{1}$", "$\\mathrm{-1}$", "$\\mathrm{-3}$", "$\\mathrm{-5}$"], "a": "$\\mathrm{-5}$", "q": "$x\\ge -1$일 때, 부등식 $4x^{3}-3x^{2}-6x\\ge k$가 항상 성립하도록 하는 실수 $k$의 최댓값은?", "key": "Tm06-07"}, "x06x59-136": {"id": "x06x59-136", "unit": "m06", "theme": "07", "벌": "X06x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$2x^{3}+2x^{2}-35x+k\\le \\,-x^{2}+x$에서<br>$2x^{3}+3x^{2}-36x+k\\le 0$<br>$f(x)=2x^{3}+3x^{2}-36x+k$라 하면<br>$f' (x)=6x^{2}+6x-36=6(x+3)(x-2)$<br>$f' (x)=0$에서 $x=\\,-3\\;(\\because \\;x<0)$<br>따라서 함수 $f(x)$의 최댓값은 $k+81$이므로 $x<0$에서 $f(x)\\le 0$이 항상 성립하려면<br>$k+81\\le 0\\;\\therefore \\;k\\le \\,-81$", "k": "c5", "c": ["$k\\le -81$", "$k\\le -72$", "$k\\le -63$", "$k\\ge -54$", "$k\\ge -45$"], "a": "$k\\le -81$", "q": "$x<0$일 때, 부등식 $2x^{3}+2x^{2}-35x+k\\le -x^{2}+x$가 항상 성립하도록 하는 실수 $k$의 값의 범위는?", "key": "Tm06-07"}, "x06x59-137": {"id": "x06x59-137", "unit": "m06", "theme": "07", "벌": "X06x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(x)=2x^{3}-9x^{2}+12x+k$라 하면<br>$f' (x)=6x^{2}-18x+12=6(x-1)(x-2)$<br>$f' (x)=0$에서 $x=1$ 또는 $x=2$<br>따라서 함수 $f(x)$의 최댓값은 $k+9$, 최솟값은 $k+4$이므로 $1\\le x\\le 3$에서 $0\\le f(x)\\le 10$이 항상 성립하려면<br>$k+4\\ge 0$, $k+9\\le 10$<br>이어야 한다.<br>$\\therefore \\;-4\\le k\\le 1$<br>즉 정수 $k$는 $-4$, $-3$, $-2$, $-1$, $0$, $1$의 $6$개이다.", "k": "num", "a": "6", "q": "$1\\le x\\le 3$에서 부등식 $0\\le 2x^{3}-9x^{2}+12x+k\\le 10$이 항상 성립하도록 하는 정수 $k$의 개수를 구하시오.", "key": "Tm06-07"}, "x06x59-141": {"id": "x06x59-141", "unit": "m06", "theme": "07", "벌": "X06x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$h(x)=f(x)-g(x)$라 하면<br>$h(x)=4x^{3}-7x+a-(-3x^{2}-x)=4x^{3}+3x^{2}-6x+a$<br>$\\therefore \\;h'(x)=12x^{2}+6x-6=6(x+1)(2x-1)$<br>$h'(x)=0$에서 $x=\\,-1$ 또는 $x=\\dfrac{1}{2}$<br>따라서 함수 $h(x)$의 최댓값은 $a+32$이므로 $-1\\le x\\le 2$에서 $h(x)\\le 0$이 항상 성립하려면<br>$a+32\\le 0\\;\\therefore \\;a\\le \\,-32$<br>즉 실수 $a$의 최댓값은 $-32$이다.", "k": "c5", "c": ["$-32$", "$-16$", "$8$", "$16$", "$32$"], "a": "$-32$", "q": "두 함수<br> $f(x)=4x^{3}-7x+a$, $g(x)=\\,-3x^{2}-x$<br>에 대하여 $-1\\le x\\le 2$일 때, 부등식 $f(x)\\le g(x)$가 항상 성립하도록 하는 실수 $a$의 최댓값은?", "key": "Tm06-07"}, "x06x76-026": {"id": "x06x76-026", "unit": "m06", "theme": "07", "벌": "X06x76", "lvl": 2, "fix": true, "src": "문제집 바이블개념ON", "w": "$f(x)=4x^{3}-6x^{2}-a$라 하면<br>$f'(x)=12x^{2}-12x=12x(x-1)$<br>$0<x<1$일 때 $f'(x)<0$이므로 $0\\le x\\le 1$에서 함수 $f(x)$는 감소한다.<br>따라서 $0<x<1$에서 $f(x)>0$이 항상 성립하려면<br>$f(1)=-a-2\\ge 0$<br>$\\therefore \\;a\\le -2$<br>따라서 구하는 정수 $a$의 최댓값은 $-2$이다.", "k": "num", "a": "-2", "q": "$0<x<1$에서 부등식 $4x^{3}-6x^{2}-a>0$이 항상 성립하도록 하는 정수 $a$의 최댓값을 구하시오.", "key": "Tm06-07"}, "x06x76-028": {"id": "x06x76-028", "unit": "m06", "theme": "07", "벌": "X06x76", "lvl": 2, "fix": true, "src": "문제집 바이블개념ON", "w": "$-2\\le x\\le 2$에서 곡선 $y=2x^{3}+3x^{2}-9x$가 직선 $y=3x-k$보다 항상 위쪽에 있으려면<br>$-2\\le x\\le 2$에서 부등식 $2x^{3}+3x^{2}-9x>3x-k,$즉<br>$2x^{3}+3x^{2}-12x+k>0$이 항상 성립해야 한다.<br>$f(x)=2x^{3}+3x^{2}-12x+k$라 하면<br>$f'(x)=6x^{2}+6x-12$<br>$=6(x+2)(x-1)$<br>$f'(x)=0$에서 $x=-2$ 또는 $x=1$<br>$-2\\le x\\le 2$일 때 함수 $f(x)$는 $x=1$에서 최솟값 $k-7$을 갖는다.<br>따라서 $-2\\le x\\le 2$에서 $f(x)>0$이 성립하려면<br>$f(1)=k-7>0$<br>$\\therefore \\;k>7$<br>즉, 정수 $k$의 최솟값은 $8$이다.", "k": "num", "a": "8", "q": "$-2\\le x\\le 2$에서 곡선 $y=2x^{3}+3x^{2}-9x$가 직선 $y=3x-k$보다 항상 위쪽에 있도록 하는 정수 $k$의 최솟값을 구하시오.", "key": "Tm06-07"}, "x06x59-139": {"id": "x06x59-139", "unit": "m06", "theme": "08", "벌": "X06x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$y=f(x)$의 그래프가 $y=g(x)$의 그래프보다 항상 위쪽에 있으려면 모든 실수 $x$에 대하여 $f(x)>g(x)$가 성립해야 한다.<br>$h(x)=f(x)-g(x)$라 하면<br>$h(x)=x^{4}+2x^{3}-x^{2}-9x-(2x^{3}+5x^{2}-x-a)$<br>$=x^{4}-6x^{2}-8x+a$<br>$\\therefore \\;h' (x)=4x^{3}-12x-8=4(x+1)^{2}(x-2)$<br>$h' (x)=0$에서 $x=\\,-1$ 또는 $x=2$<br>따라서 함수 $h(x)$의 최솟값은 $a-24$이므로 모든 실수 $x$에 대하여 $h(x)>0$이 성립하려면<br>$a-24>0\\;\\therefore \\;a>24$", "k": "c5", "c": ["$a<-12$", "$a<-2$", "$a>4$", "$a>12$", "$a>24$"], "a": "$a>24$", "q": "두 함수<br> $f(x)=x^{4}+2x^{3}-x^{2}-9x$, $g(x)=2x^{3}+5x^{2}-x-a$<br>에 대하여 $y=f(x)$의 그래프가 $y=g(x)$의 그래프보다 항상 위쪽에 있을 때, 실수 $a$의 값의 범위는?", "key": "Tm06-08"}, "x06x59-140": {"id": "x06x59-140", "unit": "m06", "theme": "08", "벌": "X06x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$h(x)=3f(x)-g(x)$라 하면<br>$h(x)=3(x^{4}-5x^{2})-(-8x^{3}+3x^{2}-a)$<br>$=3x^{4}+8x^{3}-18x^{2}+a$<br>$\\therefore \\;h'(x)=12x^{3}+24x^{2}-36x=12x(x+3)(x-1)$<br>$h'(x)=0$에서 $x=\\,-3$ 또는 $x=0$ 또는 $x=1$<br>따라서 함수 $h(x)$의 최솟값은 $a-135$이므로 모든 실수 $x$에 대하여 $h(x)\\ge 0$이 성립하려면<br>$a-135\\ge 0\\;\\therefore \\;a\\ge 135$<br>즉 실수 $a$의 최솟값은 $135$이다.", "k": "num", "a": "135", "q": "두 함수 $f(x)=x^{4}-5x^{2}$, $g(x)=\\,-8x^{3}+3x^{2}-a$가 있다. 모든 실수 $x$에 대하여 부등식 $3f(x)\\ge g(x)$가 성립하도록 하는 실수 $a$의 최솟값을 구하시오.", "key": "Tm06-08"}, "x06x59-188": {"id": "x06x59-188", "unit": "m06", "theme": "08", "벌": "X06x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "임의의 두 실수 $x_{1}$, $x_{2}$에 대하여 $f(x_{1})\\ge g(x_{2})$가 성립하려면 ($f(x)$의 최솟값)$\\ge$($g(x)$의 최댓값)이어야 한다.<br>$f(x)=x^{4}+x^{2}-6x$에서<br>$f'(x)=4x^{3}+2x-6=2(x-1)(2x^{2}+2x+3)$<br>$f'(x)=0$에서 $x=1\\;(\\because \\;2x^{2}+2x+3>0)$<br>따라서 함수 $f(x)$의 최솟값은 $-4$이다.<br>한편<br>$g(x)=\\,-2x^{2}-8x+a$<br>$=\\,-2(x+2)^{2}+8+a$<br>이므로 함수 $g(x)$의 최댓값은 $8+a$이다.<br>$-4\\ge 8+a$이므로 $a\\le \\,-12$<br>즉 실수 $a$의 최댓값은 $-12$이다.", "k": "num", "a": "-12", "q": "두 함수<br> $f(x)=x^{4}+x^{2}-6x$, $g(x)=\\,-2x^{2}-8x+a$<br>가 있다. 이때 임의의 두 실수 $x_{1}$, $x_{2}$에 대하여 부등식 $f(x_{1})\\ge g(x_{2})$가 성립하도록 하는 실수 $a$의 최댓값을 구하시오.", "key": "Tm06-08"}, "x06x53-164": {"id": "x06x53-164", "unit": "m06", "theme": "08", "벌": "X06x53", "lvl": 3, "fix": true, "src": "문제집 개념원리", "w": "$f(x)\\le 12x+k$에서 $-x^{4}-2x^{3}-x^{2}\\le 12x+k$<br>$\\therefore x^{4}+2x^{3}+x^{2}+12x+k\\ge 0$<br>$h(x)=x^{4}+2x^{3}+x^{2}+12x+k$라 하면<br>$h'(x)=4x^{3}+6x^{2}+2x+12$<br>$=2(x+2)(2x^{2}-x+3)$<br>$h'(x)=0$에서<br>$x=-2\\;(\\because \\;2x^{2}-x+3>0)$<br>따라서 함수 $h(x)$는 $x=-2$에서 최솟값 $k-20$을 가지므로 모든 실수 $x$에 대하여 $h(x)\\ge 0$이 성립하려면<br>$k-20\\ge 0$<br>$\\therefore k\\ge 20\\cdots \\cdots $㉠<br>또 $12x+k\\le g(x)$에서<br>$12x+k\\le 3x^{2}+a$<br>$\\therefore 3x^{2}-12x+a-k\\ge 0$<br>이차방정식 $3x^{2}-12x+a-k=0$의 판별식을 $D$라 하면<br>$\\dfrac{D}{4}=(-6)^{2}-3(a-k)\\le 0$<br>$12-a+k\\le 0$<br>$\\therefore k\\le a-12\\cdots \\cdots $㉡<br>㉠, ㉡에서<br>$20\\le k\\le a-12$<br>이를 만족시키는 자연수 $k$의 개수가 $3$이고 $a$는 자연수이므로<br>$a-12=22\\therefore a=34$", "k": "num", "a": "34", "q": "자연수 $a$에 대하여 두 함수<br> $f(x)=-x^{4}-2x^{3}-x^{2},\\;g(x)=3x^{2}+a$<br>가 있다. 다음을 만족시키는 $a$의 값을 구하시오.<br>모든 실수 $x$에 대하여 부등식 $f(x)\\le 12x+k\\le g(x)$를 만족시키는 자연수 $k$의 개수는 $3$이다.", "key": "Tm06-08"}, "x06x59-144": {"id": "x06x59-144", "unit": "m06", "theme": "09", "벌": "X06x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "점 $\\mathrm{P}$가 원점을 지날 때 $x=0$이므로<br>$t^{3}-4t^{2}+4t=0$, $t(t-2)^{2}=0$<br>$\\therefore \\;t=0$ 또는 $t=2$<br>따라서 점 $\\mathrm{P}$가 출발 후 다시 원점을 지날 때는 $t=2$일 때이고, 점 $\\mathrm{P}$의 속도를 $v$라 하면<br>$v=\\dfrac{dx}{dt}=3t^{2}-8t+4$<br>이므로 $t=2$일 때 점 $\\mathrm{P}$의 속도는<br>$12-16+4=0$", "k": "num", "a": "0", "q": "원점을 출발하여 수직선 위를 움직이는 점 ${\\mathrm{P}}$의 시각 $t$에서의 위치가 $x=t^{3}-4t^{2}+4t$일 때, 점 ${\\mathrm{P}}$가 출발 후 다시 원점을 지나는 순간의 속도를 구하시오.", "key": "Tm06-09"}, "x06x59-145": {"id": "x06x59-145", "unit": "m06", "theme": "09", "벌": "X06x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "점 $\\mathrm{P}$의 속도를 $v$라 하면<br>$v=\\dfrac{dx}{dt}=3t^{2}+2at-2$<br>$t=3$일 때 $v=13$이므로<br>$27+6a-2=13$, $6a=\\,-12$<br>$\\therefore \\;a=\\,-2$", "k": "c5", "c": ["$\\mathrm{-2}$", "$\\mathrm{-1}$", "$\\mathrm{0}$", "$\\mathrm{1}$", "$\\mathrm{2}$"], "a": "$\\mathrm{-2}$", "q": "원점을 출발하여 수직선 위를 움직이는 점 ${\\mathrm{P}}$의 시각 $t$에서의 위치가 $x=t^{3}+at^{2}-2t$이고 $t=3$일 때 점 ${\\mathrm{P}}$의 속도가 $\\mathrm{13}$이다. 이때 상수 $a$의 값은?", "key": "Tm06-09"}, "x06x59-147": {"id": "x06x59-147", "unit": "m06", "theme": "09", "벌": "X06x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "점 $\\mathrm{P}$의 속도를 $v$라 하면<br>$v=f' (t)=\\,-t^{2}+2t+4=\\,-(t-1)^{2}+5$<br>즉 $0\\le t\\le 4$에서 $-4\\le f' (t)\\le 5$이므로<br>$0\\le |\\,f' (t)\\,|\\le 5$<br>따라서 점 $\\mathrm{P}$의 속력의 최댓값은 $\\m ": "Tm06-09"}, "x06x76-035": {"id": "x06x76-035", "unit": "m06", "theme": "09", "벌": "X06x76", "lvl": 2, "fix": true, "src": "문제집 바이블개념ON", "w": "시각 $t$에서의 점 $\\mathrm{P}$의 속도를 $v$라 하면<br>$v=\\dfrac{dx}{dt}=6t^{2}-2kt$<br>시각 $t=2$에서의 점 $\\mathrm{P}$의 속도가 $8$이므로<br>$6\\times 2^{2}-2k\\times 2=8,\\;-4k=-16$<br>$\\therefore \\;k=4$<br>따라서 $v=6t^{2}-8t$이므로 시각 $t$에서의 점 $\\mathrm{P}$의 가속도를 $a$라 하면<br>$a=\\dfrac{dv}{dt}=12t-8$<br>따라서 시각 $t=2$에서의 점 $\\mathrm{P}$의 가속도는<br>$12\\times 2-8=16$", "k": "num", "a": "16", "q": "수직선 위를 움직이는 점 $\\mathrm{P}$의 시각 $t$에서의 위치 $x$가 $x=2t^{3}-kt^{2}$이다. 시각 $t=2$에서의 점 $\\mathrm{P}$의 속도가 $8$일 때, 시각 $t=2$에서의 점 $\\mathrm{P}$의 가속도를 구하시오. (단, $k$는 상수이다.)", "key": "Tm06-09"}, "x06x59-191": {"id": "x06x59-191", "unit": "m06", "theme": "09", "벌": "X06x59", "lvl": 3, "fix": true, "src": "문제집 SSEN", "w": "$f(t)=at^{3}+bt^{2}+ct$에서<br>$g(t)=f'(t)=3at^{2}+2bt+c$<br>모든 실수 $t$에 대하여 $3f(t)=tg(t)+2ct$가 성립하므로<br>$3(at^{3}+bt^{2}+ct)=t(3at^{2}+2bt+c)+2ct$<br>$\\therefore \\;3at^{3}+3bt^{2}+3ct=3at^{3}+2bt^{2}+3ct$<br>항등식의 성질에 의하여 $3b=2b$이므로 $b=0$<br>$\\therefore \\;g(t)=3at^{2}+c$<br>한편 점 ${\\mathrm{P}}$가 시각 $t=1$에서 운동 방향을 바꾸므로 $g(1)=0$에서<br>$3a+c=0\\;\\therefore \\;c=\\,-3a\\cdots \\cdots $ ㉠<br>또 점 ${\\mathrm{P}}$의 시각 $t$에서의 가속도는 $g'(t)=6at$이므로 $g'(1)=12$에서<br>$6a=12\\;\\therefore \\;a=2$<br>$a=2$를 ㉠에 대입하면 $c=\\,-6$<br>$g(t)=6t^{2}-6$이므로 점 ${\\mathrm{P}}$의 시각 $t=2$에서의 속도는<br>$g(2)=24-6=18$", "k": "c5", "c": ["$\\mathrm{12}$", "$\\mathrm{14}$", "$\\mathrm{16}$", "$\\mathrm{18}$", "$\\mathrm{20}$"], "a": "$\\mathrm{18}$", "q": "수직선 위를 움직이는 점 ${\\mathrm{P}}$의 시각 $t$에서의 위치를 $f(t)$, 속도를 $g(t)$라 할 때,<br> $f(t)=at^{3}+bt^{2}+ct\\;\\left(a,\\,b,\\,c\\right.$는 상수$)$<br>이고, 모든 실수 $t$에 대하여 $f(t)$, $g(t)$는<br> $3f(t)=tg(t)+2ct$<br>를 만족시킨다. 점 ${\\mathrm{P}}$는 시각 $t=1$에서 운동 방향을 바꾸고, 이때의 점 ${\\mathrm{P}}$의 가속도는 $\\mathrm{12}$이다. 점 ${\\mathrm{P}}$의 시각 $t=2$에서의 속도는?", "key": "Tm06-09"}, "x06x59-148": {"id": "x06x59-148", "unit": "m06", "theme": "10", "벌": "X06x59", "lvl": 2 }{dt}=6t-18$<br>따라서 $t=5$일 때 점 $\\mathrm{P}$의 가속도는<br>$30-18=12$", "k": "c5", "c": ["$\\mathrm{2}$", "$\\mathrm{4}$", "$\\mathrm{6}$", "$\\mathrm{10}$", "$\\mathrm{12}$"], "a": "$\\mathrm{12}$", "q": "원점을 출발하여 수직선 위를 움직이는 점 ${\\mathrm{P}}$의 시각 $t$에서의 위치가 $x=t^{3}-9t^{2}+15t$일 때, 점 ${\\mathrm{P}}$가 출발 후 두 번째로 운동 방향을 바꾸는 순간의 가속도는?", "key": "Tm06-11"}, "x06x59-154": {"id": "x06x59-154", "unit": "m06", "theme": "11", "벌": "X06x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "점 ${\\mathrm{P}}$의 속도를 $v$라 하면<br>$v=\\dfrac{dx}{dt}=3t^{2}-20t+a+1$<br>점 ${\\mathrm{P}}$의 운동 방향이 바뀌지 않으려면 실수 $t\\;(t\\ge 0)$에 대하여 항상 $v\\ge 0$이거나 $v\\le 0$이어야 한다.<br>이때<br>$v=3t^{2}-20t+a+1=3\\left(t-\\dfrac{10}{3}\\right)^{2}+a-\\dfrac{97}{3}$<br>이므로<br>$a-\\dfrac{97}{3}\\ge 0\\;\\therefore \\;a\\ge \\dfrac{97}{3}$<br>따라서 자연수 $a$의 최솟값은 $33$이다.", "k": "c5", "c": ["$30$", "$31$", "$32$", "$33$", "$34$"], "a": "$33$", "q": "수직선 위를 움직이는 점 ${\\mathrm{P}}$의 시각 $t$에서의 위치가<br> $x=t^{3}-10t^{2}+(a+1)t+2$<br>일 때, 점 ${\\mathrm{P}}$의 운동 방향이 바뀌지 않도록 하는 자연수 $a$의 최솟값은?", "key": "Tm06-11"}, "x06x59-155": {"id": "x06x59-155", "unit": "m06", "theme": "11", "벌": "X06x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "점 $\\mathrm{M}$의 시각 $t$에서의 위치를 $m(t)$라 하면<br>$m(t)=\\dfrac{1}{2}\\left\\{f(t)+g(t)\\right\\}=t^{2}-4t+3$<br>점 $\\mathrm{M}$의 속도를 $v$라 하면<br>$v=m' (t)=2t-4$<br>운동 방향을 바꾸는 순간의 속도는 $\\mathrm{0}$이므로 $v=0$에서<br>$t=2$<br>따라서 점 $\\mathrm{M}$은 $t=2$에서 운동 방향을 $\\mathrm{1}$번 바꾼다.", "k": "num", "a": "1", "q": "수직선 위를 움직이는 두 점 ${\\mathrm{A}}$, ${\\mathrm{B}}$의 시각 $t$에서의 위치가 각각<br> $f(t)=t^{3}-2t+2$, $g(t)=\\,-t^{3}+2t^{2}-6t+4$<br>일 때, 선분 $\\mathrm{AB}$의 중점 ${\\mathrm{M}}$이 운동 방향을 몇 번 바꾸는지 구하시오.", "key": "Tm06-11"}, "x06x59-157": {"id": "x06x59-157", "unit": "m06", "theme": "11", "벌": "X06x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "점 $\\mathrm{P}$의 속도를 $v$라 하면<br>$v=\\dfrac{dx}{dt}=6t^{2}+2mt+n$<br>$t=1$일 때 점 $\\mathrm{P}$는 운동 방향을 바꾸므로<br>$6+2m+n=0\\cdots \\cdots $ ㉠<br>$t=1$일 때 점 $\\mathrm{P}$의 위치는 $\\mathrm{3}$이므로<br>$2+m+n+3=3\\;\\therefore \\;m+n=\\,-2\\cdots \\cdots $ ㉡<br>㉠, ㉡을 연립하여 풀면 $m=\\,-4$, $n=2$<br>$\\therefore \\;v=6t^{2}-8t+2=2(3t-1)(t-1)$<br>즉 점 $\\mathrm{P}$가 $t=1$ 이외에 운동 방향을 바꾸는 시각은 $t=\\dfrac{1}{3}$이다.<br>이때 점 $\\mathrm{P}$의 가속도를 $a$라 하면<br>$a=\\dfrac{dv}{dt}=12t-8$<br>따라서 $t=\\dfrac{1}{3}$일 때 점 $\\mathrm{P}$의 가속도는<br>$4-8=\\,-4$", "k": "num", "a": "-4", "q": "수직선 위를 움직이는 점 ${\\mathrm{P}}$의 시각 $t$에서의 위치가 $x=2t^{3}+mt^{2}+nt+3$이다. 점 ${\\mathrm{P}}$는 $t=1$에서 운동 방향을 바꾸고 그때의 위치가 $\\mathrm{3}$일 때, 점 ${\\mathrm{P}}$가 $t=1$ 이외에 운동 방향을 바꾸는 순간의 가속도를 구하시오.<br>(단, $m$, $n$은 상수이다.)", "key": "Tm06-11"}, "x06x76-034": {"id": "x06x76-034", "unit": "m06", "theme": "11", "벌": "X06x76", "lvl": 2, "fix": true, "src": "문제집 바이블개념ON", "w": "시각 $t$에서의 점 $\\mathrm{P}$의 속도를 $v$라 하면<br>$v=\\dfrac{dx}{dt}=3t^{2}-18t+24=3(t-2)(t-4)$<br>점 $\\mathrm{P}$가 운동 방향을 바꿀 때의 속도는 $0$이므로<br>$v=0$에서 $t=2$ 또는 $t=4$<br>$0<t<2$에서 $v>0,\\;2<t<4$에서 $v<0,\\;t>4$에서 $v>0$이므로 점 $\\mathrm{P}$는 $t=2$와 $t=4$에서 운동 방향을 바꾼다.<br>$t=2$에서의 점 $\\mathrm{P}$의 위치는<br>$2^{3}-9\\times 2^{2}+24\\times 2=20$<br>$t=4$에서의 점 $\\mathrm{P}$의 위치는<br>$4^{3}-9\\times 4^{2}+24\\times 4=16$<br>따라서 두 점 $\\mathrm{A},\\;\\mathrm{B}$ 사이의 거리는<br>$20-16=4$", "k": "num", "a": "4", "q": "원점을 출발하여 수직선 위를 움직이는 점 $\\mathrm{P}$의 시각 $t$에서의 위치 $x$가 $x=t^{3}-9t^{2}+24t$이다. 점 $\\mathrm{P}$는 출발 후 운동 방향을 두 번 바꾸고 운동 방향을 바꿀 때의 위치를 각각 $\\mathrm{A},\\;\\mathrm{B}$라 할 때, 두 점 $\\mathrm{A},\\;\\mathrm{B}$ 사이의 거리를 구하시오.", "key": "Tm06-11"}, "x06x59-159": {"id": "x06x59-159", "unit": "m06", "theme": "12", "벌": "X06x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "자동차가 브레이크를 밟은 지 $t$초 후의 속도를 $v\\,{\\mathrm{m}}/{\\mathrm{s}}$라 하면<br>$v=\\dfrac{dx}{dt}=36-9t$<br>자동차가 정지할 때의 속도는 $0$이므로 $v=0$에서<br>$36-9t=0\\;\\therefore \\;t=4$<br>따라서 브레이크를 밟은 후 자동차가 정지할 때까지 걸린 시간은 $4$초이다.", "k": "c5", "c": ["$2$초", "$3$초", "$4$초", "$5$초", "$6$초"], "a": "$4$초", "q": "어떤 자동차가 브레이크를 밟은 후 $t$초 동안 달린 거리를 $x\\,{\\mathrm{m}}$라 하면 $x=36t-4.5t^{2}$이다. 이 자동차가 브레이크를 밟은 후 정지할 때까지 걸린 시간은?", "key": "Tm06-12"}, "x06x59-160": {"id": "x06x59-160", "unit": "m06", "theme": "12", "벌": "X06x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "기차가 제동을 건 지 $t$초 후의 속도를 $v\\,{\\mathrm{m}}/{\\mathrm{s}}$라 하면<br>$v=\\dfrac{dx}{dt}=27-0.9t$<br>기차가 정지할 때의 속도는 $\\mathrm{0}$이므로 $v=0$에서<br>$27-0.9t=0\\;\\therefore \\;t=30$<br>이때 $\\mathrm{30}$초 동안 기차가 움직인 거리는<br>$27\\times 30-0.45\\times 30^{2}=405\\,(\\mathrm{m})$<br>따라서 목적지로부터 전방 $405\\,\\mathrm{m}$의 지점에서 제동을 걸어야 하므로 $a=405$", "k": "num", "a": "405", "q": "직선 레일을 달리는 기차가 제동을 건 후 $t$초 동안 움직인 거리를 $x\\mathrm{m}$라 하면 $x=27t-0.45t^{2}$이다. 이 기차가 목적지에 정확히 정지하려면 목적지로부터 전방 $a\\mathrm{m}$의 지점에서 제동을 걸어야 한다고 할 때, 상수 $a$의 값을 구하시오.", "key": "Tm06-12"}, "x06x59-162": {"id": "x06x59-162", "unit": "m06", "theme": "12", "벌": "X06x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "물체가 지면에 떨어질 때의 높이는 $\\mathrm{0}$이므로 $h=0$에서<br>$30+25t-5t^{2}=0$, $t^{2}-5t-6=0$<br>$(t+1)(t-6)=0\\;\\therefore \\;t=6\\;(\\because \\;t\\ge 0)$<br>물체의 $t$초 후의 속도를 $v\\,{\\mathrm{m}}/{\\mathrm{s}}$라 하면<br>$v=\\dfrac{dh}{dt}=25-10t$<br>$t=6$일 때 물체의 속도는 $25-60=\\,-35\\,(\\mathrm{m}/\\mathrm{s})$<br>따라서 물체가 지면에 떨어지는 순간의 속력은 $35\\,{\\mathrm{m}}/{\\mathrm{s}}$이다.", "k": "num", "a": "35", "q": "지면으로부터 $30\\mathrm{m}$의 위치에서 처음 속도 $25\\mathrm{m}/\\mathrm{s}$로 지면과 수직하게 위로 던진 물체의 $t$초 후의 높이를 $h\\mathrm{m}$라 하면 $h=30+25t-5t^{2}$인 관계가 성립한다. 이 물체가 지면에 떨어지는 순간의 속력은 몇 $\\mathrm{m}/\\mathrm{s}$인지 구하시오.", "key": "Tm06-12"}, "x06x59-163": {"id": "x06x59-163", "unit": "m06", "theme": "12", "벌": "X06x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "물체의 $t$초 후의 속도를 $v\\,{\\mathrm{m}}/{\\mathrm{s}}$라 하면<br>$v=\\dfrac{dh}{dt}=a-10t$<br>최고 지점에 도달했을 때의 속도는 $0$이므로 $v=0$에서<br>$a-10t=0\\;\\therefore \\;t=\\dfrac{a}{10}$<br>즉 $t=\\dfrac{a}{10}$일 때 물체의 지면으로부터의 높이가 최대가 되므로<br>$a\\cdot \\dfrac{a}{10}-5\\cdot \\left(\\dfrac{a}{10}\\right)^{2}\\ge 80$, $\\dfrac{a^{2}}{20}\\ge 80$<br>$a^{2}\\ge 1600\\;\\therefore \\;a\\ge 40\\;(\\because \\;a>0)$<br>따라서 양수 $a$의 최솟값은 $40$이다.", "k": "c5", "c": ["$20$", "$30$", "$40$", "$50$", "$60$"], "a": "$40$", "q": "지면에서 처음 속도 $a\\,{\\mathrm{m}}/{\\mathrm{s}}$로 지면과 수직하게 위로 던진 물체의 $t$초 후의 높이를 $h\\,{\\mathrm{m}}$라 하면 $h=at-5t^{2}$이다. 물체가 지면으로부터의 높이가 최소 $80\\,{\\mathrm{m}}$인 지점까지 도달하기 위한 양수 $a$의 최솟값은?", "key": "Tm06-12"}, "x06x59-172": {"id": "x06x59-172", "unit": "m06", "theme": "15", "벌": "X06x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$t$초 후의 가장 바깥쪽 원의 반지름의 길이는 $10t\\,{\\mathrm{cm}}$이므로 원의 넓이를 $S\\,{\\mathrm{cm}}^{2}$이라 하면<br>$S\\,=\\pi \\cdot (10t)^{2}=100\\pi t^{2}$<br>$\\therefore \\;\\dfrac{dS\\,}{dt}=200\\pi t$<br>따라서 $t=2$일 때 원의 넓이의 변화율은<br>$200\\pi \\cdot 2=400\\pi \\,(\\mathrm{cm}^{2}/\\mathrm{s})$<br>$\\therefore \\;a=400$", "k": "num", "a": "400", "q": "잔잔한 호수에 돌을 던지면 동심원 모양의 원이 생긴다. 가장 바깥쪽 원의 반지름의 길이가 매초 $10\\mathrm{cm}$씩 길어질 때, 돌을 던진 지 $\\mathrm{2}$초 후의 가장 바깥쪽 원의 넓이의 변화율을 $a\\pi \\mathrm{cm}^{2}/\\mathrm{s}$라 하자. 이때 상수 $a$의 값을 구하시오.", "key": "Tm06-15"}, "x06x59-173": {"id": "x06x59-173", "unit": "m06", "theme": "15", "벌": "X06x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$t$초 후의 정사각형의 한 변의 길이는 $(10+2t)\\,\\mathrm{cm}$이므로 정사각형의 넓이를 $S\\,{\\mathrm{cm}}^{2}$라 하면<br>$S\\,=(10+2t)^{2}=4t^{2}+40t+100$<br>$\\therefore \\;\\dfrac{dS\\,}{dt}=8t+40$<br>정사각형의 넓이가 $400\\,{\\mathrm{cm}}^{2}$이 될 때, 한 변의 길이는 $20\\,\\mathrm{cm}$이므로<br>$10+2t=20\\;\\therefore \\;t=5$<br>따라서 $t=5$일 때 정사각형의 넓이의 변화율은<br>$8\\cdot 5+40=80\\,(\\mathrm{cm}^{2}/\\mathrm{s})$", "k": "c5", "c": ["$65\\mathrm{cm}^{2}/\\mathrm{s}$", "$70\\mathrm{cm}^{2}/\\mathrm{s}$", "$75\\mathrm{cm}^{2}/\\mathrm{s}$", "$80\\mathrm{cm}^{2}/\\mathrm{s}$", "$85\\mathrm{cm}^{2}/\\mathrm{s}$"], "a": "$80\\mathrm{cm}^{2}/\\mathrm{s}$", "q": "한 변의 길이가 $10\\mathrm{cm}$인 정사각형의 각 변의 길이가 매초 $2{\\mathrm{cm}}$씩 길어질 때, 정사각형의 넓이가 $400\\mathrm{cm}^{2}$가 되는 순간의 넓이의 변화율은?", "key": "Tm06-15"}, "x06x59-176": {"id": "x06x59-176", "unit": "m06", "theme": "16", "벌": "X06x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$t$초 후의 고무풍선의 반지름의 길이는 $\\left(2+\\dfrac{1}{2}t\\right)\\,\\mathrm{cm}$이므로 고무풍선의 부피를 $V\\,{\\mathrm{cm}}^{3}$이라 하면<br>$V\\,=\\dfrac{4}{3}\\pi \\cdot \\left(2+\\dfrac{1}{2}t\\right)^{3}=\\dfrac{4}{3}\\pi \\left(\\dfrac{1}{8}t^{3}+\\dfrac{3}{2}t^{2}+6t+8\\right)$<br>$\\therefore \\;\\dfrac{dV\\,}{dt}=\\dfrac{4}{3}\\pi \\left(\\dfrac{3}{8}t^{2}+3t+6\\right)$<br>따라서 $t=4$일 때 고무풍선의 부피의 변화율은<br>$\\dfrac{4}{3}\\pi \\cdot \\left(\\dfrac{3}{8}\\cdot 4^{2}+3\\cdot 4+6\\right)=32\\pi \\,(\\mathrm{cm}^{3}/\\mathrm{s})$", "k": "c5", "c": ["$8\\pi \\mathrm{cm}^{3}/\\mathrm{s}$", "$16\\pi \\mathrm{cm}^{3}/\\mathrm{s}$", "$24\\pi \\mathrm{cm}^{3}/\\mathrm{s}$", "$32\\pi \\mathrm{cm}^{3}/\\mathrm{s}$", "$40\\pi \\mathrm{cm}^{3}/\\mathrm{s}$"], "a": "$32\\pi \\mathrm{cm}^{3}/\\mathrm{s}$", "q": "반지름의 길이가 $2{\\mathrm{cm}}$인 구 모양의 고무풍선에 공기를 넣어서 반지름의 길이가 매초 $5\\mathrm{mm}$씩 늘어나고 있다. $\\mathrm{4}$초 후의 고무풍선의 부피의 변화율은?", "key": "Tm06-16"}, "t07-01-1": {"id": "t07-01-1", "unit": "07", "theme": "01", "벌": 1, "k": "num", "q": "실수 $x$에 대하여 조건 ‘$x<-2$ 또는 $x\\ge 3$’의 부정을 만족시키는 정수 $x$의 개수는?", "a": "5", "lvl": 2, "w": "[핵심] ‘또는’은 ‘그리고’로 바뀌고, 부등호는 등호가 반대쪽으로 옮겨 간다.\n$x<-2$의 부정은 $x\\ge -2$, $x\\ge 3$의 부정은 $x<3$이다.\n따라서 부정은 ‘$x\\ge -2$ 그리고 $x<3$’, 곧 $-2\\le x<3$이다.\n정수 $x$는 $-2,\\,-1,\\,0,\\,1,\\,2$의 $5$개이다.", "key": "T07-01"}, "t07-01-2": {"id": "t07-01-2", "unit": "07", "theme": "01", "벌": 2, "k": "c5", "q": "두 실수 $a$, $b$에 대하여 조건 ‘$ab=0$ 그리고 $a+b=0$’의 부정과 서로 같은 것은?", "a": "$a\\ne 0$ 또는 $b\\ne 0$", "c": ["$a\\ne 0$ 그리고 $b\\ne 0$", "$a\\ne 0$ 또는 $b\\ne 0$", "$ab\\ne 0$", "$a+b\\ne 0$", "$ab\\ne 0$ 그리고 $a+b\\ne 0$"], "lvl": 2, "w": "[핵심] 먼저 조건을 간단히 한 뒤 부정한다. ‘그리고’의 부정은 ‘또는’이다.\n$ab=0$이고 $a+b=0$이면 $a=0$ 또는 $b=0$인데, 어느 쪽이든 $a+b=0$에서 나머지도 $0$이다.\n곧 주어진 조건은 ‘$a=0$ 그리고 $b=0$’과 같다.\n그 부정은 ‘$a\\ne 0$ 또는 $b\\ne 0$’이다.\n‘$ab\\ne 0$ 그리고 $a+b\\ne 0$’은 ‘그리고’를 ‘또는’으로 바꾸지 않은 흔한 실수이다.", "key": "T07-01"}, "t07-01-3": {"id": "t07-01-3", "unit": "07", "theme": "01", "벌": 3, "k": "num", "q": "실수 $x$에 대하여 두 조건 $p$, $q$가 $p:|x-1|<4$, $q:x^{2}\\ge 4$일 때, 조건 ‘$\\sim p$ 또는 $q$’의 부정을 만족시키는 정수 $x$의 개수는?", "a": "3", "lvl": 3, "w": "[핵심] ‘$\\sim p$ 또는 $q$’의 부정은 ‘$p$ 그리고 $\\sim q$’이다. ($\\sim(\\sim p)=p$)\n$p:-3<x<5$, $\\sim q:x^{2}<4$, 곧 $-2<x<2$이다.\n‘$p$ 그리고 $\\sim q$’의 진리집합은 $\\{x\\mid -2<x<2\\}$이다.\n정수 $x$는 $-1,\\,0,\\,1$의 $3$개이다.", "key": "T07-01"}, "t07-02-1": {"id": "t07-02-1", "unit": "07", "theme": "02", "벌": 1, "k": "num", "q": "전체집합 $U=\\{x\\mid x\\text{는 }12\\text{ 이하의 자연수}\\}$에서 두 조건 $p$, $q$가 $p:x$는 $12$의 약수이다, $q:x$는 짝수이다 일 때, 조건 ‘$p$ 그리고 $\\sim q$’의 진리집합의 모든 원소의 합은?", "a": "4", "lvl": 2, "w": "[핵심] ‘$p$ 그리고 $\\sim q$’의 진리집합은 $P\\cap Q^{C}=P-Q$이다.\n$P=\\{1,\\,2,\\,3,\\,4,\\,6,\\,12\\}$, $Q$는 짝수의 집합이다.\n$P-Q=\\{1,\\,3\\}$이므로 원소의 합은 $1+3=4$이다.", "key": "T07-02"}, "t07-02-2": {"id": "t07-02-2", "unit": "07", "theme": "02", "벌": 2, "k": "num", "q": "두 실수 $x$, $y$에 대하여 다음 명제 중 참인 것의 개수는?<br>ㄱ. $x^{2}=x$이면 $x=1$이다.<br>ㄴ. $x>2$이면 $x^{2}>4$이다.<br>ㄷ. $|x|<1$이면 $x^{2}<1$이다.<br>ㄹ. $x+y>0$이면 $x>0$ 또는 $y>0$이다.<br>ㅁ. $xy>0$이면 $x>0$이다.", "a": "3", "lvl": 2, "w": "[핵심] 명제 $p\\to q$는 $P\\subset Q$일 때 참, 아니면 반례가 있다.\nㄱ. $x^{2}=x$의 진리집합은 $\\{0,\\,1\\}\\not\\subset\\{1\\}$. 반례 $x=0$, 거짓.\nㄴ. $\\{x\\mid x>2\\}\\subset\\{x\\mid x<-2$ 또는 $x>2\\}$, 참. ㄷ. $|x|<1$과 $x^{2}<1$은 같은 조건, 참.\nㄹ. $x\\le 0$이고 $y\\le 0$이면 $x+y\\le 0$이므로(대우) 참. ㅁ. $x=y=-1$이 반례, 거짓.\n참인 것은 ㄴ, ㄷ, ㄹ의 $3$개이다.", "key": "T07-02"}, "t07-02-3": {"id": "t07-02-3", "unit": "07", "theme": "02", "벌": 3, "k": "num", "q": "전체집합 $U=\\{x\\mid x\\text{는 }30\\text{ 이하의 자연수}\\}$에서 두 조건 $p$, $q$가 $p:x$는 $3$의 배수이다, $q:x$는 $5$의 배수이다 일 때, 조건 ‘$p$ 또는 $\\sim q$’의 진리집합의 원소의 개수는?", "a": "26", "lvl": 3, "w": "[핵심] 진리집합 $P\\cup Q^{C}$의 여집합은 $(P\\cup Q^{C})^{C}=P^{C}\\cap Q=Q-P$이다.\n$Q-P$는 $5$의 배수 중 $3$의 배수가 아닌 것: $5,\\,10,\\,20,\\,25$의 $4$개이다.\n따라서 $n(P\\cup Q^{C})=30-4=26$이다.", "key": "T07-02"}, "t07-03-1": {"id": "t07-03-1", "unit": "07", "theme": "03", "벌": 1, "k": "num", "q": "실수 $x$에 대하여 명제 ‘$x^{2}\\le 9$이면 $x\\ge -1$이다.’가 거짓임을 보이는 반례 중 정수인 것의 개수는?", "a": "2", "lvl": 2, "w": "[핵심] 반례는 가정은 만족시키고 결론은 만족시키지 않는 원소, 곧 $P-Q=P\\cap Q^{C}$의 원소이다.\n$P=\\{x\\mid -3\\le x\\le 3\\}$, $Q^{C}=\\{x\\mid x<-1\\}$이다.\n$P\\cap Q^{C}=\\{x\\mid -3\\le x<-1\\}$이므로 정수는 $-3,\\,-2$의 $2$개이다.", "key": "T07-03"}, "t07-03-2": {"id": "t07-03-2", "unit": "07", "theme": "03", "벌": 2, "k": "num", "q": "전체집합 $U=\\{x\\mid x\\text{는 }15\\text{ 이하의 자연수}\\}$에 대하여 명제 ‘$x$가 홀수이면 $x$는 소수이다.’의 반례의 개수는?", "a": "3", "lvl": 2, "w": "[핵심] 반례 = 가정(홀수)을 만족시키면서 결론(소수)을 만족시키지 않는 원소.\n$15$ 이하의 홀수: $1,3,5,7,9,11,13,15$.\n이 중 소수가 아닌 것은 $1,\\,9,\\,15$이다. ($1$은 소수가 아니다.)\n따라서 반례는 $3$개이다.", "key": "T07-03"}, "t07-03-3": {"id": "t07-03-3", "unit": "07", "theme": "03", "벌": 3, "k": "num", "q": "실수 $x$에 대하여 두 조건 $p$, $q$가 $p:x^{2}-2x-15>0$, $q:|x-3|>1$일 때, 명제 ‘$\\sim p\\to q$’가 거짓임을 보이는 반례 중 정수인 것의 합은?", "a": "9", "lvl": 3, "w": "[핵심] 명제 $\\sim p\\to q$의 반례는 $P^{C}\\cap Q^{C}$의 원소이다.\n$x^{2}-2x-15>0\\iff x<-3$ 또는 $x>5$이므로 $P^{C}=\\{x\\mid -3\\le x\\le 5\\}$.\n$Q^{C}=\\{x\\mid |x-3|\\le 1\\}=\\{x\\mid 2\\le x\\le 4\\}$.\n$P^{C}\\cap Q^{C}=\\{x\\mid 2\\le x\\le 4\\}$, 정수 $2,3,4$의 합은 $9$이다.", "key": "T07-03"}, "t07-04-1": {"id": "t07-04-1", "unit": "07", "theme": "04", "벌": 1, "k": "num", "q": "실수 $x$에 대하여 명제 ‘$|x-1|\\le 2$이면 $2x-a\\le 0$이다.’가 참이 되도록 하는 실수 $a$의 최솟값은?", "a": "6", "lvl": 2, "w": "[핵심] $p\\to q$가 참 $\\iff P\\subset Q$. 수직선에서 끝점을 비교한다.\n$P=\\{x\\mid -1\\le x\\le 3\\}$, $Q=\\{x\\mid x\\le \\frac{a}{2}\\}$.\n$P\\subset Q$이려면 $3\\le\\frac{a}{2}$, 곧 $a\\ge 6$.\n$a=6$이면 $x=3$에서 $2x-a=0\\le 0$으로 성립하므로 최솟값은 $6$이다.", "key": "T07-04"}, "t07-04-2": {"id": "t07-04-2", "unit": "07", "theme": "04", "벌": 2, "k": "num", "q": "실수 $x$에 대하여 명제 ‘$a-1\\le x\\le a+2$이면 $x^{2}-3x-10\\le 0$이다.’가 참이 되도록 하는 정수 $a$의 개수는?", "a": "5", "lvl": 2, "w": "[핵심] $P\\subset Q$가 되도록 양 끝점을 비교한다.\n$x^{2}-3x-10=(x+2)(x-5)\\le 0$이므로 $Q=\\{x\\mid -2\\le x\\le 5\\}$.\n$P=\\{x\\mid a-1\\le x\\le a+2\\}\\subset Q$이려면 $a-1\\ge -2$, $a+2\\le 5$.\n$-1\\le a\\le 3$이므로 정수 $a$는 $5$개이다.", "key": "T07-04"}, "t07-04-3": {"id": "t07-04-3", "unit": "07", "theme": "04", "벌": 3, "k": "num", "q": "실수 $x$에 대하여 두 조건 $p$, $q$가 $p:x^{2}-4x-12>0$, $q:|x-a|>3$일 때, 명제 $p\\to q$가 참이 되도록 하는 모든 정수 $a$의 값의 합은?", "a": "6", "lvl": 3, "w": "[핵심] $P\\subset Q$를 수직선에 그려 양쪽 끝점을 각각 비교하고, 등호를 따로 확인한다.\n$P=\\{x\\mid x<-2$ 또는 $x>6\\}$, $Q=\\{x\\mid x<a-3$ 또는 $x>a+3\\}$.\n$P\\subset Q$이려면 $-2\\le a-3$이고 $a+3\\le 6$ (등호일 때도 열린 구간끼리라 성립).\n$1\\le a\\le 3$이므로 정수 $a$의 합은 $1+2+3=6$이다.", "key": "T07-04"}, "t07-05-1": {"id": "t07-05-1", "unit": "07", "theme": "05", "벌": 1, "k": "num", "q": "전체집합 $U=\\{-2,\\,-1,\\,0,\\,1,\\,2\\}$에 대하여 다음 명제 중 참인 것의 개수는?<br>ㄱ. 모든 $x$에 대하여 $x^{2}\\le 4$이다.<br>ㄴ. 어떤 $x$에 대하여 $x^{2}-x-2=0$이다.<br>ㄷ. 모든 $x$에 대하여 $x+2>0$이다.<br>ㄹ. 어떤 $x$에 대하여 $x^{3}=x+1$이다.<br>ㅁ. 모든 $x$에 대하여 $|x|\\ge x$이다.", "a": "3", "lvl": 2, "w": "[핵심] ‘모든’은 $P=U$, ‘어떤’은 $P\\ne\\varnothing$일 때 참. 원소를 하나씩 대입해 본다.\nㄱ. $x^{2}\\le 4$는 $U$의 모든 원소에서 성립, 참. ㄴ. $x=-1,\\,2$에서 성립, 참.\nㄷ. $x=-2$이면 $x+2=0$, 거짓.\nㄹ. $x^{3}-x$의 값은 $-6,0,0,0,6$으로 $1$이 없다, 거짓. ㅁ. 항상 $|x|\\ge x$, 참.\n참인 것은 ㄱ, ㄴ, ㅁ의 $3$개이다.", "key": "T07-05"}, "t07-05-2": {"id": "t07-05-2", "unit": "07", "theme": "05", "벌": 2, "k": "c5", "q": "명제 ‘어떤 실수 $x$에 대하여 $x^{2}-2x+3\\le 0$이다.’의 부정과 그 부정의 참, 거짓을 바르게 나타낸 것은?", "a": "모든 실수 $x$에 대하여 $x^{2}-2x+3>0$이다. (참)", "c": ["모든 실수 $x$에 대하여 $x^{2}-2x+3>0$이다. (참)", "모든 실수 $x$에 대하여 $x^{2}-2x+3>0$이다. (거짓)", "어떤 실수 $x$에 대하여 $x^{2}-2x+3>0$이다. (참)", "모든 실수 $x$에 대하여 $x^{2}-2x+3\\ge 0$이다. (참)", "어떤 실수 $x$에 대하여 $x^{2}-2x+3>0$이다. (거짓)"], "lvl": 2, "w": "[핵심] ‘어떤 $x$에 대하여 $p$’의 부정은 ‘모든 $x$에 대하여 $\\sim p$’이다.\n$x^{2}-2x+3\\le 0$의 부정은 $x^{2}-2x+3>0$ (등호가 넘어간다).\n$x^{2}-2x+3=(x-1)^{2}+2>0$이 모든 실수에서 성립하므로 부정은 참이다.\n‘$\\ge 0$’으로 쓰면 부정이 아니다. 문장이 참이어도 부정을 바르게 쓴 것이 아니다.", "key": "T07-05"}, "t07-05-3": {"id": "t07-05-3", "unit": "07", "theme": "05", "벌": 3, "k": "num", "q": "명제 ‘어떤 실수 $x$에 대하여 $x^{2}-2ax+2a+3<0$이다.’가 거짓이 되도록 하는 정수 $a$의 개수는?", "a": "5", "lvl": 3, "w": "[핵심] 명제가 거짓 $\\iff$ 그 부정 ‘모든 실수 $x$에 대하여 $x^{2}-2ax+2a+3\\ge 0$’이 참.\n이차부등식이 모든 실수에서 성립하려면 판별식 $\\frac{D}{4}=a^{2}-(2a+3)\\le 0$.\n$(a+1)(a-3)\\le 0$에서 $-1\\le a\\le 3$.\n정수 $a$는 $-1,0,1,2,3$의 $5$개이다.", "key": "T07-05"}, "t07-06-1": {"id": "t07-06-1", "unit": "07", "theme": "06", "벌": 1, "k": "num", "q": "두 실수 $x$, $y$에 대하여 다음 명제 중 그 역이 참인 것의 개수는?<br>ㄱ. $x=2$이면 $x^{2}=4$이다.<br>ㄴ. $x>1$이고 $y>1$이면 $x+y>2$이다.<br>ㄷ. $x=0$이면 $xy=0$이다.<br>ㄹ. $x^{2}+y^{2}=0$이면 $x=0$이고 $y=0$이다.<br>ㅁ. $x>0$이면 $x^{3}>0$이다.", "a": "2", "lvl": 2, "w": "[핵심] $p\\to q$의 역은 $q\\to p$. 역은 원래 명제와 참·거짓이 따로 논다.\nㄱ의 역: $x^{2}=4\\to x=2$, 반례 $x=-2$. ㄴ의 역: 반례 $x=3,\\,y=0$.\nㄷ의 역: $xy=0\\to x=0$, 반례 $x=1,\\,y=0$.\nㄹ의 역: $x=y=0$이면 $x^{2}+y^{2}=0$, 참. ㅁ의 역: $x^{3}>0$이면 $x>0$, 참.\n역이 참인 것은 ㄹ, ㅁ의 $2$개이다.", "key": "T07-06"}, "t07-06-2": {"id": "t07-06-2", "unit": "07", "theme": "06", "벌": 2, "k": "c5", "q": "두 실수 $x$, $y$에 대하여 다음 명제 중 그 대우가 참인 것은?", "a": "$|x|+|y|=0$이면 $x=y$이다.", "c": ["$x^{2}=1$이면 $x=1$이다.", "$xy=0$이면 $x=0$이다.", "$x+y>0$이면 $x>0$이고 $y>0$이다.", "$|x|+|y|=0$이면 $x=y$이다.", "$x^{2}>y^{2}$이면 $x>y$이다."], "lvl": 2, "w": "[핵심] 명제와 그 대우는 참·거짓이 같다. 원래 명제의 참·거짓만 판정하면 된다.\n① $x=-1$, ② $x=1,\\,y=0$, ③ $x=2,\\,y=-1$, ⑤ $x=-2,\\,y=1$이 각각 반례이다.\n④ $|x|+|y|=0$이면 $x=y=0$이므로 $x=y$, 참.\n따라서 대우가 참인 것은 ④이다.", "key": "T07-06"}, "t07-06-3": {"id": "t07-06-3", "unit": "07", "theme": "06", "벌": 3, "k": "num", "q": "다음 세 명제 각각의 역과 대우, 모두 $6$개의 명제 중 참인 것의 개수는? (단, $n$은 자연수, $x$, $y$는 실수)<br>ㄱ. $n^{2}$이 $3$의 배수이면 $n$은 $3$의 배수이다.<br>ㄴ. $x>1$이면 $x^{2}>1$이다.<br>ㄷ. $x+y$가 정수이면 $x$, $y$는 모두 정수이다.", "a": "4", "lvl": 3, "w": "[핵심] 대우는 원래 명제와 참·거짓이 같고, 역은 따로 판정한다.\nㄱ: 참($n$이 $3$의 배수가 아니면 $n^{2}$도 아님). 대우 참. 역 ‘$n$이 $3$의 배수이면 $n^{2}$이 $3$의 배수’도 참.\nㄴ: 참이므로 대우 참. 역 ‘$x^{2}>1\\to x>1$’은 $x=-2$가 반례, 거짓.\nㄷ: $x=y=\\frac{1}{2}$이 반례, 거짓이므로 대우 거짓. 역 ‘둘 다 정수면 합도 정수’는 참.\n참인 것은 ㄱ의 역·대우, ㄴ의 대우, ㄷ의 역으로 $4$개이다.", "key": "T07-06"}, "t07-07-1": {"id": "t07-07-1", "unit": "07", "theme": "07", "벌": 1, "k": "num", "q": "실수 $x$에 대하여 명제 ‘$x^{2}-ax+8\\ne 0$이면 $x\\ne 2$이다.’가 참이 되도록 하는 상수 $a$의 값은?", "a": "6", "lvl": 2, "w": "[핵심] ‘$\\ne$’이 들어간 명제는 대우로 바꾸면 ‘$=$’의 명제가 된다.\n대우: ‘$x=2$이면 $x^{2}-ax+8=0$이다.’ 원래 명제가 참이면 대우도 참이다.\n$x=2$를 대입하면 $4-2a+8=0$, 곧 $a=6$이다.", "key": "T07-07"}, "t07-07-2": {"id": "t07-07-2", "unit": "07", "theme": "07", "벌": 2, "k": "num", "q": "두 실수 $x$, $y$에 대하여 명제 ‘$x+y>a$이면 $x>2$ 또는 $y>3$이다.’가 참이 되도록 하는 실수 $a$의 최솟값은?", "a": "5", "lvl": 2, "w": "[핵심] 결론이 ‘또는’이면 대우로 바꿔 ‘그리고’ 조건을 가정으로 쓴다.\n대우: ‘$x\\le 2$이고 $y\\le 3$이면 $x+y\\le a$이다.’\n$x\\le 2$, $y\\le 3$일 때 $x+y$는 최대 $5$ ($x=2,\\,y=3$).\n이 대우가 참이려면 $5\\le a$이므로 $a$의 최솟값은 $5$이다.", "key": "T07-07"}, "t07-07-3": {"id": "t07-07-3", "unit": "07", "theme": "07", "벌": 3, "k": "num", "q": "실수 $x$에 대하여 명제 ‘$x^{2}-x-20>0$이면 $|x-2|>a$이다.’가 참이 되도록 하는 모든 자연수 $a$의 값의 합은?", "a": "6", "lvl": 3, "w": "[핵심] 대우 ‘$|x-2|\\le a$이면 $x^{2}-x-20\\le 0$’으로 바꾸면 닫힌 구간의 포함 관계가 된다.\n$|x-2|\\le a\\iff 2-a\\le x\\le 2+a$, $x^{2}-x-20\\le 0\\iff -4\\le x\\le 5$.\n$[2-a,\\,2+a]\\subset[-4,\\,5]$이려면 $2-a\\ge -4$, $2+a\\le 5$, 곧 $a\\le 3$.\n자연수 $a=1,2,3$의 합은 $6$이다.", "key": "T07-07"}, "t07-08-1": {"id": "t07-08-1", "unit": "07", "theme": "08", "벌": 1, "k": "c5", "q": "세 조건 $p$, $q$, $r$에 대하여 두 명제 $p\\to\\sim q$, $r\\to q$가 모두 참일 때, 다음 중 항상 참인 명제는?", "a": "$p\\to\\sim r$", "c": ["$p\\to r$", "$q\\to p$", "$\\sim r\\to p$", "$p\\to\\sim r$", "$\\sim q\\to r$"], "lvl": 2, "w": "[핵심] 대우를 써서 화살표가 이어지도록 맞춘 뒤 삼단논법을 쓴다.\n$p\\to\\sim q$와 $\\sim q\\to\\sim r$ ($r\\to q$의 대우)가 참이다.\n삼단논법으로 $p\\to\\sim r$이 참이다. (대우 $r\\to\\sim p$도 참)\n나머지는 역이나 이 관계에서 끌어낼 수 없는 명제이다.", "key": "T07-08"}, "t07-08-2": {"id": "t07-08-2", "unit": "07", "theme": "08", "벌": 2, "k": "c5", "q": "어느 반 학생들에 대하여 다음 두 명제가 모두 참이다.<br>(가) 수학을 좋아하는 학생은 과학을 좋아한다.<br>(나) 체육을 좋아하는 학생은 과학을 좋아하지 않는다.<br>다음 중 항상 참인 명제는?", "a": "수학을 좋아하는 학생은 체육을 좋아하지 않는다.", "c": ["과학을 좋아하는 학생은 수학을 좋아한다.", "체육을 좋아하지 않는 학생은 과학을 좋아한다.", "수학을 좋아하는 학생은 체육을 좋아하지 않는다.", "과학을 좋아하지 않는 학생은 체육을 좋아한다.", "수학을 좋아하지 않는 학생은 체육을 좋아한다."], "lvl": 2, "w": "[핵심] 조건에 기호를 붙여 화살표로 옮긴다. $p$: 수학, $q$: 과학, $r$: 체육.\n(가) $p\\to q$, (나) $r\\to\\sim q$의 대우는 $q\\to\\sim r$.\n삼단논법으로 $p\\to\\sim r$: 수학을 좋아하는 학생은 체육을 좋아하지 않는다.\n나머지 보기는 주어진 명제에서 삼단논법으로 이어지지 않아 항상 참이라 할 수 없다.", "key": "T07-08"}, "t07-08-3": {"id": "t07-08-3", "unit": "07", "theme": "08", "벌": 3, "k": "num", "q": "네 조건 $p$, $q$, $r$, $s$에 대하여 세 명제 $p\\to q$, $\\sim r\\to\\sim q$, $s\\to\\sim r$가 모두 참일 때, 다음 명제 중 항상 참인 것의 개수는?<br>ㄱ. $p\\to r$<br>ㄴ. $s\\to\\sim p$<br>ㄷ. $r\\to p$<br>ㄹ. $q\\to\\sim s$<br>ㅁ. $\\sim s\\to q$<br>ㅂ. $\\sim r\\to\\sim p$", "a": "4", "lvl": 3, "w": "[핵심] 대우로 방향을 맞춰 한 줄로 잇는다.\n$\\sim r\\to\\sim q$의 대우 $q\\to r$, $s\\to\\sim r$의 대우 $r\\to\\sim s$.\n따라서 $p\\to q\\to r\\to\\sim s$로 이어진다.\nㄱ 참, ㄴ($p\\to\\sim s$의 대우) 참, ㄹ 참, ㅂ($p\\to r$의 대우) 참. ㄷ, ㅁ은 역 방향이라 항상 참이라 할 수 없다.\n참인 것은 $4$개이다.", "key": "T07-08"}, "t07-09-1": {"id": "t07-09-1", "unit": "07", "theme": "09", "벌": 1, "k": "num", "q": "실수 $x$, $y$에 대하여 두 조건 $p$, $q$가 다음과 같다. $p$가 $q$이기 위한 충분조건이지만 필요조건은 아닌 것의 개수를 구하시오.\nㄱ. $p: x=2$, $q: x^{2}=2x$\nㄴ. $p: x^{2}>4$, $q: x>2$\nㄷ. $p: |x|<1$, $q: x<1$\nㄹ. $p: xy=0$, $q: x=0$\nㅁ. $p: x>0$이고 $y>0$, $q: x+y>0$이고 $xy>0$", "a": "2", "lvl": 2, "w": "[핵심] 진리집합 $P\\subset Q$이고 $P\\ne Q$인 것을 찾는다.\nㄱ. $P=\\{2\\}$, $Q=\\{0,\\,2\\}$ → 충분조건만 (○)\nㄴ. $x=-3$은 $p$를 만족하지만 $q$는 아니다. $Q\\subset P$ → 필요조건\nㄷ. $-1<x<1$은 $x<1$에 포함 → 충분조건만 (○)\nㄹ. $x=0$이면 $xy=0$ → 필요조건. ㅁ. $xy>0$, $x+y>0$이면 $x$, $y$ 모두 양수 → 필요충분조건\n따라서 ㄱ, ㄷ의 2개", "key": "T07-09"}, "t07-09-2": {"id": "t07-09-2", "unit": "07", "theme": "09", "벌": 2, "k": "c5", "q": "전체집합 $U$에서 정의된 세 조건 $p$, $q$, $r$의 진리집합을 각각 $P$, $Q$, $R$이라 하자. $P\\cap Q=P$, $Q\\cup R=R$일 때, 다음 중 항상 옳은 것은?", "a": "$\\sim q$는 $\\sim r$이기 위한 필요조건이다.", "c": ["$p$는 $r$이기 위한 필요조건이다.", "$q$는 $p$이기 위한 충분조건이다.", "$\\sim p$는 $\\sim q$이기 위한 충분조건이다.", "$\\sim q$는 $\\sim r$이기 위한 필요조건이다.", "$\\sim r$은 $\\sim p$이기 위한 필요조건이다."], "lvl": 2, "w": "[핵심] $P\\cap Q=P$에서 $P\\subset Q$, $Q\\cup R=R$에서 $Q\\subset R$. 곧 $P\\subset Q\\subset R$, $R^{C}\\subset Q^{C}\\subset P^{C}$.\n'$\\sim q$는 $\\sim r$이기 위한 필요조건' ⇔ $R^{C}\\subset Q^{C}$ ⇔ $Q\\subset R$ → 항상 참.\n나머지는 각각 $R\\subset P$, $Q\\subset P$, $Q\\subset P$, $R\\subset P$가 필요해서 항상 옳지는 않다.\n이름은 '~이기 위한' 앞의 조건에 붙고, 그 조건의 진리집합이 큰 쪽이면 필요조건이다.", "key": "T07-09"}, "t07-09-3": {"id": "t07-09-3", "unit": "07", "theme": "09", "벌": 3, "k": "num", "q": "실수 $x$, $y$에 대하여 두 조건 $p$, $q$가 다음과 같다. $p$가 $q$이기 위한 필요충분조건인 것의 개수를 구하시오.\nㄱ. $p: |x|+|y|=0$, $q: x^{2}+y^{2}=0$\nㄴ. $p: |x+y|=|x|+|y|$, $q: xy\\ge 0$\nㄷ. $p: x\\ne 0$ 또는 $y\\ne 0$, $q: x+y\\ne 0$\nㄹ. $p: x>y$, $q: x^{3}>y^{3}$\nㅁ. $p: x>y$, $q: x^{2}>y^{2}$", "a": "3", "lvl": 3, "w": "[핵심] 두 진리집합이 같은지(서로 포함하는지) 본다.\nㄱ. 둘 다 $x=y=0$ → ○. ㄴ. $|x|+|y|\\ge|x+y|$의 등호 조건이 $xy\\ge 0$ → ○\nㄷ. $x=1$, $y=-1$은 $p$는 만족, $q$는 아님 → ×\nㄹ. $x^{3}-y^{3}=(x-y)(x^{2}+xy+y^{2})$이고 $x\\ne y$이면 $x^{2}+xy+y^{2}>0$ → ○\nㅁ. $x=1$, $y=-2$ → $p$는 참, $q$는 거짓 → ×. 따라서 3개", "key": "T07-09"}, "t07-10-1": {"id": "t07-10-1", "unit": "07", "theme": "10", "벌": 1, "k": "num", "q": "실수 $x$에 대하여 두 조건\n$p: x^{2}-2x-8\\le 0$, $q: |x-a|\\le 2$\n가 있다. $p$가 $q$이기 위한 필요조건이 되도록 하는 모든 정수 $a$의 값의 합을 구하시오.", "a": "3", "lvl": 2, "w": "[핵심] '$p$가 $q$이기 위한 필요조건' ⇔ $Q\\subset P$.\n$P=\\{x\\,|\\,-2\\le x\\le 4\\}$, $Q=\\{x\\,|\\,a-2\\le x\\le a+2\\}$\n$-2\\le a-2$이고 $a+2\\le 4$ → $0\\le a\\le 2$ (끝점은 등호 포함 가능)\n정수 $a=0,\\,1,\\,2$ → 합 $3$", "key": "T07-10"}, "t07-10-2": {"id": "t07-10-2", "unit": "07", "theme": "10", "벌": 2, "k": "num", "q": "실수 $x$에 대하여 두 조건\n$p: x^{2}+ax+b\\le 0$, $q: x<-1$ 또는 $x>5$\n가 있다. $\\sim p$가 $q$이기 위한 필요충분조건일 때, 두 상수 $a$, $b$에 대하여 $ab$의 값을 구하시오.", "a": "20", "lvl": 2, "w": "[핵심] $\\sim p$의 진리집합 $P^{C}$가 $Q$와 같다 ⇔ $P=Q^{C}$.\n$Q^{C}=\\{x\\,|\\,-1\\le x\\le 5\\}$이므로 $x^{2}+ax+b\\le 0$의 해가 $-1\\le x\\le 5$\n$x^{2}+ax+b=(x+1)(x-5)=x^{2}-4x-5$ → $a=-4$, $b=-5$\n$ab=20$", "key": "T07-10"}, "t07-10-3": {"id": "t07-10-3", "unit": "07", "theme": "10", "벌": 3, "k": "num", "q": "실수 $x$에 대하여 세 조건\n$p: |x-2|\\le a$, $q: x^{2}-2x-3\\le 0$, $r: |x+1|\\le b$\n가 있다. $p$는 $q$이기 위한 충분조건이고, $r$은 $q$이기 위한 필요조건이다. 양수 $a$의 최댓값을 $M$, 양수 $b$의 최솟값을 $m$이라 할 때, $M+m$의 값을 구하시오.", "a": "5", "lvl": 3, "w": "[핵심] 충분조건 → $P\\subset Q$, 필요조건 → $Q\\subset R$.\n$Q=\\{x\\,|\\,-1\\le x\\le 3\\}$, $P=\\{x\\,|\\,2-a\\le x\\le 2+a\\}$, $R=\\{x\\,|\\,-1-b\\le x\\le -1+b\\}$\n$P\\subset Q$: $2-a\\ge -1$, $2+a\\le 3$ → $a\\le 1$ → $M=1$\n$Q\\subset R$: $-1-b\\le -1$, $-1+b\\ge 3$ → $b\\ge 4$ → $m=4$\n$M+m=5$", "key": "T07-10"}, "t07-11-1": {"id": "t07-11-1", "unit": "07", "theme": "11", "벌": 1, "k": "num", "q": "다음은 자연수 $n$에 대하여 명제 '$n^{2}$이 3의 배수이면 $n$도 3의 배수이다.'가 참임을 대우를 이용하여 증명한 것이다.\n[증명] 대우 '$n$이 3의 배수가 아니면 $n^{2}$도 3의 배수가 아니다.'를 보이자.\n$n$이 3의 배수가 아니면 $n=3k+1$ 또는 $n=3k+2$ ($k$는 음이 아닌 정수)이다.\n(i) $n=3k+1$이면 $n^{2}=3\\times$ (가) $+1$\n(ii) $n=3k+2$이면 $n^{2}=3\\times$ (나) $+1$\n따라서 $n^{2}$은 3의 배수가 아니므로 대우가 참이고, 주어진 명제도 참이다.\n(가), (나)에 알맞은 식을 각각 $f(k)$, $g(k)$라 할 때, $f(1)+g(1)$의 값을 구하시오.", "a": "13", "lvl": 2, "w": "[핵심] 대우 $\\sim q\\to\\sim p$: '3의 배수가 아닌 $n$'을 나머지로 나누어 직접 제곱한다.\n$(3k+1)^{2}=9k^{2}+6k+1=3(3k^{2}+2k)+1$ → $f(k)=3k^{2}+2k$\n$(3k+2)^{2}=9k^{2}+12k+4=3(3k^{2}+4k+1)+1$ → $g(k)=3k^{2}+4k+1$\n$f(1)+g(1)=5+8=13$", "key": "T07-11"}, "t07-11-2": {"id": "t07-11-2", "unit": "07", "theme": "11", "벌": 2, "k": "c5", "q": "다음은 $\\sqrt{3}$이 무리수임을 귀류법으로 증명한 것이다.\n[증명] $\\sqrt{3}$이 유리수라고 가정하면 $\\sqrt{3}=\\dfrac{m}{n}$ ($m$, $n$은 (가)인 자연수)으로 나타낼 수 있다.\n양변을 제곱하면 $m^{2}=3n^{2}$이므로 $m^{2}$은 3의 배수이고, 따라서 $m$도 3의 배수이다.\n$m=3k$ ($k$는 자연수)라 하면 $9k^{2}=3n^{2}$, 곧 $n^{2}=$ (나) 이므로 $n$도 3의 배수이다.\n이것은 $m$, $n$이 (가)라는 가정에 모순이므로 $\\sqrt{3}$은 (다)이다.\n(가), (나), (다)에 알맞은 것을 차례대로 나열한 것은?", "a": "서로소, $3k^{2}$, 무리수", "c": ["서로소, $3k^{2}$, 무리수", "서로소, $3k$, 무리수", "서로소, $9k^{2}$, 무리수", "홀수, $3k^{2}$, 무리수", "서로소, $3k^{2}$, 유리수"], "lvl": 2, "w": "[핵심] 귀류법: 결론('무리수')을 부정해 '유리수 = 기약분수 $\\frac{m}{n}$'으로 두고 모순을 이끈다.\n(가) 기약분수로 놓으므로 $m$, $n$은 서로소\n(나) $9k^{2}=3n^{2}$의 양변을 3으로 나누면 $n^{2}=3k^{2}$\n$m$, $n$이 모두 3의 배수 → 서로소에 모순 → (다) 무리수", "key": "T07-11"}, "t07-11-3": {"id": "t07-11-3", "unit": "07", "theme": "11", "벌": 3, "k": "num", "q": "실수 $a$, $b$, $c$에 대하여 명제\n'$a+2b+3c\\ge k$이면 $a\\ge 1$ 또는 $b\\ge 2$ 또는 $c\\ge 3$이다.'\n가 참이 되도록 하는 실수 $k$의 최솟값을 구하시오.", "a": "14", "lvl": 3, "w": "[핵심] 결론에 '또는'이 있으면 대우로 바꾼다. 대우: '$a<1$이고 $b<2$이고 $c<3$이면 $a+2b+3c<k$'.\n$a<1$, $b<2$, $c<3$이면 $a+2b+3c<1+4+9=14$이고, 이 값은 14에 얼마든지 가까워질 수 있다.\n따라서 대우가 참 ⇔ $k\\ge 14$ ($k<14$이면 $a=b=c$를 각 상한에 충분히 가깝게 잡은 반례가 있다)\n최솟값 $14$", "key": "T07-11"}, "t07-12-1": {"id": "t07-12-1", "unit": "07", "theme": "12", "벌": 1, "k": "c5", "q": "다음은 $a>0$, $b>0$일 때 부등식 $\\dfrac{a+b}{2}\\ge\\dfrac{2ab}{a+b}$가 성립함을 증명한 것이다.\n[증명] $\\dfrac{a+b}{2}-\\dfrac{2ab}{a+b}=$ (가) $\\ge 0$\n따라서 주어진 부등식이 성립하고, 등호는 (나)일 때 성립한다.\n(가), (나)에 알맞은 것을 차례대로 나열한 것은?", "a": "$\\dfrac{(a-b)^{2}}{2(a+b)}$, $a=b$", "c": ["$\\dfrac{(a-b)^{2}}{2(a+b)}$, $a=b$", "$\\dfrac{(a-b)^{2}}{2(a+b)}$, $a=-b$", "$\\dfrac{(a-b)^{2}}{a+b}$, $a=b$", "$\\dfrac{(a-b)^{2}}{2ab}$, $a=b$", "$\\dfrac{(a+b)^{2}}{2(a+b)}$, $a=b$"], "lvl": 2, "w": "[핵심] 부등식의 증명 = (좌변)$-$(우변)을 통분해 부호가 정해지는 꼴로 만든다.\n$\\dfrac{(a+b)^{2}-4ab}{2(a+b)}=\\dfrac{a^{2}-2ab+b^{2}}{2(a+b)}=\\dfrac{(a-b)^{2}}{2(a+b)}$\n분모 $2(a+b)>0$, 분자 $\\ge 0$ → $\\ge 0$\n등호는 $(a-b)^{2}=0$, 곧 $a=b$일 때", "key": "T07-12"}, "t07-12-2": {"id": "t07-12-2", "unit": "07", "theme": "12", "벌": 2, "k": "num", "q": "모든 실수 $a$, $b$, $c$에 대하여 부등식\n$a^{2}+4b^{2}+9c^{2}\\ge 2ab+6bc+3ca$\n가 성립한다. 이 부등식에서 등호가 성립하고 $a+b+c=11$일 때, $a$의 값을 구하시오.", "a": "6", "lvl": 2, "w": "[핵심] 2배 하여 완전제곱식의 합으로 묶는다.\n$2\\{(\\text{좌변})-(\\text{우변})\\}=(a-2b)^{2}+(2b-3c)^{2}+(3c-a)^{2}\\ge 0$\n등호 ⇔ $a=2b=3c$. $a=6t$, $b=3t$, $c=2t$로 놓으면 $11t=11$ → $t=1$\n$a=6$", "key": "T07-12"}, "t07-12-3": {"id": "t07-12-3", "unit": "07", "theme": "12", "벌": 3, "k": "num", "q": "실수 $x$에 대하여 $|x-3|+|x+5|$의 최솟값을 $m$, 이 최솟값을 갖게 하는 정수 $x$의 개수를 $n$이라 할 때, $m+n$의 값을 구하시오.", "a": "17", "lvl": 3, "w": "[핵심] 절대부등식 $|a|+|b|\\ge|a+b|$ (등호 ⇔ $ab\\ge 0$)을 합이 상수가 되게 쓴다.\n$|x-3|+|x+5|=|3-x|+|x+5|\\ge|(3-x)+(x+5)|=8$ → $m=8$\n등호 ⇔ $(3-x)(x+5)\\ge 0$ ⇔ $-5\\le x\\le 3$ → 정수 9개, $n=9$\n$m+n=17$", "key": "T07-12"}, "t07-13-1": {"id": "t07-13-1", "unit": "07", "theme": "13", "벌": 1, "k": "num", "q": "두 양수 $a$, $b$에 대하여 $(a+2b)\\left(\\dfrac{2}{a}+\\dfrac{1}{b}\\right)$의 최솟값을 구하시오.", "a": "8", "lvl": 2, "w": "[핵심] 전개한 뒤 곱이 일정한 두 항에 산술·기하평균을 쓴다.\n$(a+2b)\\left(\\dfrac{2}{a}+\\dfrac{1}{b}\\right)=4+\\dfrac{a}{b}+\\dfrac{4b}{a}$\n$\\dfrac{a}{b}+\\dfrac{4b}{a}\\ge 2\\sqrt{4}=4$ → 전체 $\\ge 8$\n등호: $\\dfrac{a}{b}=\\dfrac{4b}{a}$, 곧 $a=2b$ (예: $a=2$, $b=1$)일 때 성립 → 최솟값 $8$", "key": "T07-13"}, "t07-13-2": {"id": "t07-13-2", "unit": "07", "theme": "13", "벌": 2, "k": "num", "q": "$x>1$일 때 $4x+\\dfrac{9}{x-1}$은 $x=\\alpha$에서 최솟값 $m$을 갖는다. $m+2\\alpha$의 값을 구하시오.", "a": "21", "lvl": 2, "w": "[핵심] 분모와 같은 꼴 $x-1(>0)$을 만들어 변형한다.\n$4x+\\dfrac{9}{x-1}=4(x-1)+\\dfrac{9}{x-1}+4\\ge 2\\sqrt{36}+4=16$\n등호: $4(x-1)=\\dfrac{9}{x-1}$ → $(x-1)^{2}=\\dfrac{9}{4}$, $x-1>0$이므로 $x=\\dfrac{5}{2}$ ($>1$ 확인)\n$m=16$, $\\alpha=\\dfrac{5}{2}$ → $m+2\\alpha=21$", "key": "T07-13"}, "t07-13-3": {"id": "t07-13-3", "unit": "07", "theme": "13", "벌": 3, "k": "num", "q": "$x>0$일 때 $\\dfrac{x}{x^{2}+x+4}$의 최댓값을 구하시오.", "a": "1/5", "lvl": 3, "w": "[핵심] 분자·분모를 $x$로 나누어 분모에 산술·기하평균을 쓴다.\n$\\dfrac{x}{x^{2}+x+4}=\\dfrac{1}{x+\\frac{4}{x}+1}$\n$x+\\dfrac{4}{x}\\ge 2\\sqrt{4}=4$ → 분모 $\\ge 5$ → 식 $\\le\\dfrac{1}{5}$\n등호: $x=\\dfrac{4}{x}$, 곧 $x=2$ ($>0$)일 때 → 최댓값 $\\dfrac{1}{5}$", "key": "T07-13"}, "t07-14-1": {"id": "t07-14-1", "unit": "07", "theme": "14", "벌": 1, "k": "num", "q": "두 양수 $x$, $y$에 대하여 $2x+3y=12$일 때, $xy$의 최댓값을 구하시오.", "a": "6", "lvl": 2, "w": "[핵심] 합 $2x+3y$가 일정 → 곱 $2x\\cdot 3y$의 최댓값.\n$12=2x+3y\\ge 2\\sqrt{6xy}$ → $\\sqrt{6xy}\\le 6$ → $xy\\le 6$\n등호: $2x=3y=6$, 곧 $x=3$, $y=2$일 때 성립\n최댓값 $6$", "key": "T07-14"}, "t07-14-2": {"id": "t07-14-2", "unit": "07", "theme": "14", "벌": 2, "k": "num", "q": "두 양수 $x$, $y$에 대하여 $x+y=3$일 때, $\\dfrac{1}{x}+\\dfrac{4}{y}$의 최솟값을 구하시오.", "a": "3", "lvl": 2, "w": "[핵심] 일정한 합을 곱해 전개한다: $(x+y)\\left(\\dfrac{1}{x}+\\dfrac{4}{y}\\right)$.\n$(x+y)\\left(\\dfrac{1}{x}+\\dfrac{4}{y}\\right)=5+\\dfrac{y}{x}+\\dfrac{4x}{y}\\ge 5+4=9$\n$3\\left(\\dfrac{1}{x}+\\dfrac{4}{y}\\right)\\ge 9$ → $\\dfrac{1}{x}+\\dfrac{4}{y}\\ge 3$\n등호: $y=2x$, $x+y=3$ → $x=1$, $y=2$ → 최솟값 $3$", "key": "T07-14"}, "t07-14-3": {"id": "t07-14-3", "unit": "07", "theme": "14", "벌": 3, "k": "num", "q": "두 양수 $x$, $y$에 대하여 $xy=x+4y+5$일 때, $xy$의 최솟값을 구하시오.", "a": "25", "lvl": 3, "w": "[핵심] $x+4y\\ge 2\\sqrt{4xy}$로 $xy$에 대한 부등식을 만든다.\n$xy=t$라 하면 $t=x+4y+5\\ge 4\\sqrt{t}+5$\n$(\\sqrt{t}-5)(\\sqrt{t}+1)\\ge 0$, $\\sqrt{t}+1>0$ → $\\sqrt{t}\\ge 5$ → $t\\ge 25$\n등호: $x=4y$, $xy=25$ → $y=\\dfrac{5}{2}$, $x=10$ (조건식 $25=10+10+5$ ✓) → 최솟값 $25$", "key": "T07-14"}, "t07-15-1": {"id": "t07-15-1", "unit": "07", "theme": "15", "벌": 1, "k": "num", "q": "실수 $x$, $y$에 대하여 $x^{2}+y^{2}=10$일 때, $3x+y$의 최댓값을 구하시오.", "a": "10", "lvl": 2, "w": "[핵심] $(3^{2}+1^{2})(x^{2}+y^{2})\\ge(3x+y)^{2}$\n$10\\times 10\\ge(3x+y)^{2}$ → $-10\\le 3x+y\\le 10$\n등호: $\\dfrac{x}{3}=\\dfrac{y}{1}$, $x^{2}+y^{2}=10$ → $x=3$, $y=1$\n최댓값 $10$", "key": "T07-15"}, "t07-15-2": {"id": "t07-15-2", "unit": "07", "theme": "15", "벌": 2, "k": "num", "q": "실수 $x$, $y$에 대하여 $x+y=5$일 때, $2x^{2}+3y^{2}$의 최솟값을 구하시오.", "a": "30", "lvl": 2, "w": "[핵심] $2x^{2}+3y^{2}=(\\sqrt2x)^{2}+(\\sqrt3y)^{2}$에 짝 $\\left(\\frac{1}{\\sqrt2},\\frac{1}{\\sqrt3}\\right)$을 곱해 $x+y$를 만든다.\n$\\left(\\dfrac12+\\dfrac13\\right)(2x^{2}+3y^{2})\\ge(x+y)^{2}=25$\n$\\dfrac56(2x^{2}+3y^{2})\\ge 25$ → $2x^{2}+3y^{2}\\ge 30$\n등호: $2x=3y$, $x+y=5$ → $x=3$, $y=2$ ($18+12=30$ ✓) → 최솟값 $30$", "key": "T07-15"}, "t07-15-3": {"id": "t07-15-3", "unit": "07", "theme": "15", "벌": 3, "k": "num", "q": "실수 $x$, $y$에 대하여 $x^{2}+4y^{2}=5$일 때, $x+y$의 최댓값을 $M$, 최솟값을 $m$이라 하자. $M-m$의 값을 구하시오.", "a": "5", "lvl": 3, "w": "[핵심] $x^{2}+(2y)^{2}$과 짝 $\\left(1,\\frac12\\right)$로 $x+y$를 만든다.\n$\\left(1+\\dfrac14\\right)\\{x^{2}+(2y)^{2}\\}\\ge\\left(x+\\dfrac12\\cdot 2y\\right)^{2}=(x+y)^{2}$\n$(x+y)^{2}\\le\\dfrac54\\times 5=\\dfrac{25}{4}$ → $-\\dfrac52\\le x+y\\le\\dfrac52$\n등호: $x=4y$ → $(x,y)=\\left(2,\\frac12\\right)$, $\\left(-2,-\\frac12\\right)$ → $M=\\dfrac52$, $m=-\\dfrac52$, $M-m=5$", "key": "T07-15"}, "t08-01-1": {"id": "t08-01-1", "unit": "08", "theme": "01", "벌": 1, "k": "num", "q": "정의역이 $X=\\{-2,\\,-1,\\,0,\\,1,\\,2\\}$인 함수 $f(x)=x^{2}-1$의 치역의 모든 원소의 합은?", "a": "2", "w": "[핵심] 치역은 함숫값을 모은 집합이다. 같은 값은 한 번만 센다.\n$f(\\pm 2)=3$, $f(\\pm 1)=0$, $f(0)=-1$\n치역은 $\\{-1,\\,0,\\,3\\}$이므로 원소의 합은 $2$이다.", "lvl": 2, "key": "T08-01"}, "t08-02-1": {"id": "t08-02-1", "unit": "08", "theme": "02", "벌": 1, "k": "num", "q": "함수 $f(x)=\\begin{cases}x+3 & (x\\ge 1)\\\\ -2x & (x<1)\\end{cases}$에 대하여 $f(2)+f(-3)$의 값은?", "a": "11", "w": "[핵심] $x$의 값이 어느 범위에 있는지 먼저 보고 그 식에 넣는다.\n$2\\ge 1$이므로 $f(2)=2+3=5$\n$-3<1$이므로 $f(-3)=-2\\times(-3)=6$\n따라서 $f(2)+f(-3)=11$이다.", "lvl": 2, "key": "T08-02"}, "t08-03-1": {"id": "t08-03-1", "unit": "08", "theme": "03", "벌": 1, "k": "num", "q": "정의역이 $\\{-1,\\,2\\}$인 두 함수 $f(x)=x^{3}+2$, $g(x)=ax+b$가 서로 같을 때, 상수 $a$, $b$에 대하여 $a+b$의 값은?", "a": "7", "w": "[핵심] 서로 같은 함수는 정의역의 모든 원소에서 함숫값이 같다.\n$f(-1)=g(-1)$에서 $1=-a+b$\n$f(2)=g(2)$에서 $10=2a+b$\n두 식을 연립하면 $a=3$, $b=4$이므로 $a+b=7$이다.", "lvl": 2, "key": "T08-03"}, "t08-04-1": {"id": "t08-04-1", "unit": "08", "theme": "04", "벌": 1, "k": "num", "q": "정의역이 $\\{x\\mid -1\\le x\\le 2\\}$, 공역이 $\\{y\\mid a\\le y\\le b\\}$인 함수 $f(x)=3x+1$이 일대일대응일 때, $a+b$의 값은?", "a": "5", "w": "[핵심] 일대일대응이면 치역과 공역이 같다.\n기울기가 양수이므로 치역은 $\\{y\\mid f(-1)\\le y\\le f(2)\\}$이다.\n$a=f(-1)=-2$, $b=f(2)=7$이므로 $a+b=5$이다.", "lvl": 2, "key": "T08-04"}, "t08-05-1": {"id": "t08-05-1", "unit": "08", "theme": "05", "벌": 1, "k": "num", "q": "실수 전체의 집합에서 정의된 항등함수 $f$와 상수함수 $g$가 $f(3)+g(3)=10$을 만족시킬 때, $f(8)+g(8)$의 값은?", "a": "15", "w": "[핵심] 항등함수는 $f(x)=x$, 상수함수는 모든 $x$에서 같은 값이다.\n$f(3)=3$이므로 $g(3)=7$이고, $g(x)=7$\n$f(8)+g(8)=8+7=15$", "lvl": 2, "key": "T08-05"}, "t08-06-1": {"id": "t08-06-1", "unit": "08", "theme": "06", "벌": 1, "k": "num", "q": "$X=\\{1,\\,2,\\,3\\}$에서 $Y=\\{4,\\,5,\\,6,\\,7\\}$로의 일대일함수의 개수는?", "a": "24", "w": "[핵심] 일대일함수는 서로 다른 원소에 서로 다른 값을 준다.\n$f(1)$은 $4$가지, $f(2)$는 $3$가지, $f(3)$은 $2$가지\n$4\\times 3\\times 2=24$", "lvl": 2, "key": "T08-06"}, "t08-07-1": {"id": "t08-07-1", "unit": "08", "theme": "07", "벌": 1, "k": "num", "q": "두 함수 $f(x)=2x-1$, $g(x)=x^{2}+1$에 대하여 $(g\\circ f)(2)+(f\\circ g)(1)$의 값은?", "a": "13", "w": "[핵심] $(g\\circ f)(x)=g(f(x))$, 안쪽부터 계산한다.\n$(g\\circ f)(2)=g(3)=10$\n$(f\\circ g)(1)=f(2)=3$\n합은 $13$이다.", "lvl": 2, "key": "T08-07"}, "t08-08-1": {"id": "t08-08-1", "unit": "08", "theme": "08", "벌": 1, "k": "num", "q": "두 함수 $f(x)=3x+a$, $g(x)=-x+4$에 대하여 $f\\circ g=g\\circ f$일 때, 상수 $a$의 값은?", "a": "-4", "w": "[핵심] 두 합성함수를 각각 구해 계수를 비교한다.\n$(f\\circ g)(x)=3(-x+4)+a=-3x+12+a$\n$(g\\circ f)(x)=-(3x+a)+4=-3x-a+4$\n$12+a=4-a$에서 $a=-4$", "lvl": 2, "key": "T08-08"}, "t08-09-1": {"id": "t08-09-1", "unit": "08", "theme": "09", "벌": 1, "k": "num", "q": "정의역과 공역이 모두 $\\{x\\mid 0\\le x\\le 3\\}$인 함수 $f(x)=\\begin{cases}x+1 & (0\\le x<2)\\\\ -3x+9 & (2\\le x\\le 3)\\end{cases}$에 대하여 $(f\\circ f)(1)+(f\\circ f)(3)$의 값은?", "a": "4", "w": "[핵심] 그래프(식)에서 안쪽 함숫값을 먼저 읽고, 그 값을 다시 넣는다.\n$f(1)=2$이므로 $(f\\circ f)(1)=f(2)=3$\n$f(3)=0$이므로 $(f\\circ f)(3)=f(0)=1$\n합은 $4$이다.", "lvl": 2, "key": "T08-09"}, "t08-10-1": {"id": "t08-10-1", "unit": "08", "theme": "10", "벌": 1, "k": "num", "q": "함수 $f(x)=3x-5$에 대하여 $f^{-1}(4)+f^{-1}(-2)$의 값은?", "a": "4", "w": "[핵심] $f^{-1}(b)=a\\iff f(a)=b$\n$3a-5=4$에서 $f^{-1}(4)=3$\n$3c-5=-2$에서 $f^{-1}(-2)=1$\n합은 $4$이다.", "lvl": 2, "key": "T08-10"}, "t08-11-1": {"id": "t08-11-1", "unit": "08", "theme": "11", "벌": 1, "k": "num", "q": "함수 $f(x)=2x-6$의 역함수가 $f^{-1}(x)=ax+b$일 때, $a+b$의 값은?", "a": "7/2", "w": "[핵심] $y=f(x)$를 $x$에 대하여 풀고 $x$와 $y$를 바꾼다.\n$y=2x-6$에서 $x=\\frac{1}{2}y+3$\n$f^{-1}(x)=\\frac{1}{2}x+3$이므로 $a+b=\\frac{1}{2}+3=\\frac{7}{2}$", "lvl": 2, "key": "T08-11"}, "t08-12-1": {"id": "t08-12-1", "unit": "08", "theme": "12", "벌": 1, "k": "num", "q": "두 함수 $f(x)=2x+1$, $g(x)=x+4$에 대하여 $(f^{-1}\\circ g)(7)$의 값은?", "a": "5", "w": "[핵심] $(f^{-1}\\circ g)(7)=f^{-1}(g(7))$, 안쪽부터 구한다.\n$g(7)=11$\n$f^{-1}(11)=a$이면 $2a+1=11$, $a=5$", "lvl": 2, "key": "T08-12"}, "t08-13-1": {"id": "t08-13-1", "unit": "08", "theme": "13", "벌": 1, "k": "num", "q": "두 함수 $f(x)=3x-1$, $g(x)=x+2$에 대하여 $(f\\circ(g\\circ f)^{-1}\\circ g)(3)$의 값은?", "a": "3", "w": "[핵심] $(g\\circ f)^{-1}=f^{-1}\\circ g^{-1}$, 그리고 $f\\circ f^{-1}$, $g^{-1}\\circ g$는 항등함수이다.\n$f\\circ(g\\circ f)^{-1}\\circ g=f\\circ f^{-1}\\circ g^{-1}\\circ g$는 항등함수이다.\n따라서 값은 $3$이다.", "lvl": 2, "key": "T08-13"}, "t08-14-1": {"id": "t08-14-1", "unit": "08", "theme": "14", "벌": 1, "k": "num", "q": "함수 $f(x)=ax+b$에 대하여 $y=f(x)$의 그래프와 그 역함수 $y=f^{-1}(x)$의 그래프가 모두 점 $(1,\\,3)$을 지날 때, $f(5)$의 값은? (단, $a$, $b$는 상수이다.)", "a": "-1", "w": "[핵심] $y=f^{-1}(x)$의 그래프가 점 $(1,\\,3)$을 지나면 $y=f(x)$의 그래프는 점 $(3,\\,1)$을 지난다.\n$f(1)=3$에서 $a+b=3$, $f(3)=1$에서 $3a+b=1$\n$a=-1$, $b=4$이므로 $f(5)=-1$", "lvl": 2, "key": "T08-14"}, "t08-15-1": {"id": "t08-15-1", "unit": "08", "theme": "15", "벌": 1, "k": "num", "q": "함수 $y=|x^{2}-4|$의 그래프와 직선 $y=3$의 교점의 개수는?", "a": "4", "w": "[핵심] $y=|f(x)|$의 그래프는 $y=f(x)$의 $x$축 아래 부분을 위로 접은 것이다.\n$|x^{2}-4|=3$에서 $x^{2}-4=3$ 또는 $x^{2}-4=-3$\n$x^{2}=7$ 또는 $x^{2}=1$이므로 $x=\\pm\\sqrt{7}$, $\\pm 1$\n교점은 $4$개이다.", "lvl": 2, "key": "T08-15"}, "t08-01-2": {"id": "t08-01-2", "unit": "08", "theme": "01", "벌": 2, "k": "num", "q": "정의역이 $\\{x\\mid -1\\le x\\le 3\\}$인 함수 $f(x)=-2x+5$의 치역이 $\\{y\\mid a\\le y\\le b\\}$일 때, $a+b$의 값은?", "a": "6", "w": "[핵심] 일차함수는 정의역의 양 끝에서 최댓값과 최솟값을 가진다.\n기울기가 음수이므로 $f(-1)=7$이 최댓값, $f(3)=-1$이 최솟값이다.\n$a=-1$, $b=7$이므로 $a+b=6$이다.", "lvl": 2, "key": "T08-01"}, "t08-02-2": {"id": "t08-02-2", "unit": "08", "theme": "02", "벌": 2, "k": "num", "q": "함수 $f$가 모든 실수 $x$에 대하여 $f(2x-1)=4x+3$을 만족시킬 때, $f(5)$의 값은?", "a": "15", "w": "[핵심] 괄호 안이 $5$가 되는 $x$를 찾아 넣는다.\n$2x-1=5$에서 $x=3$\n$f(5)=4\\times 3+3=15$", "lvl": 2, "key": "T08-02"}, "t08-03-2": {"id": "t08-03-2", "unit": "08", "theme": "03", "벌": 2, "k": "num", "q": "공집합이 아닌 집합 $X$를 정의역으로 하는 두 함수 $f(x)=x^{2}$, $g(x)=x+2$가 서로 같도록 하는 집합 $X$의 개수는?", "a": "3", "w": "[핵심] $X$의 원소는 모두 $f(x)=g(x)$를 만족시켜야 한다.\n$x^{2}=x+2$에서 $(x+1)(x-2)=0$, $x=-1$ 또는 $x=2$\n$X$는 $\\{-1,\\,2\\}$의 공집합이 아닌 부분집합이므로 $2^{2}-1=3$개이다.", "lvl": 2, "key": "T08-03"}, "t08-04-2": {"id": "t08-04-2", "unit": "08", "theme": "04", "벌": 2, "k": "num", "q": "정의역이 $\\{x\\mid x\\ge 1\\}$, 공역이 $\\{y\\mid y\\ge b\\}$인 함수 $f(x)=x^{2}-2x+a$가 일대일대응이고 $f(3)=7$일 때, $a+b$의 값은?", "a": "7", "w": "[핵심] 이차함수는 축의 한쪽에서만 일대일함수이고, 치역의 시작점이 공역의 시작점과 같아야 한다.\n$f(3)=9-6+a=7$에서 $a=4$\n$f(x)=(x-1)^{2}+3$은 $x\\ge 1$에서 $x$의 값이 커지면 $f(x)$의 값도 커지므로 치역은 $\\{y\\mid y\\ge f(1)\\}$, $f(1)=3$\n$b=3$이므로 $a+b=7$이다.", "lvl": 2, "key": "T08-04"}, "t08-05-2": {"id": "t08-05-2", "unit": "08", "theme": "05", "벌": 2, "k": "num", "q": "$X=\\{1,\\,2,\\,3\\}$에서 $X$로의 세 함수 $f$, $g$, $h$는 각각 항등함수, 상수함수, 일대일대응이다. $h(1)=f(3)$, $h(2)=g(2)+1$일 때, $f(2)+g(3)+h(3)$의 값은?", "a": "4", "w": "[핵심] 항등·상수·일대일대응의 뜻을 차례로 써서 값을 정한다.\n$h(1)=f(3)=3$이므로 $h(2)$, $h(3)$은 $1$, $2$ 중 하나씩이다.\n$g(x)=c$라 하면 $h(2)=c+1$이고 $c\\in X$이므로 $h(2)=2$, $c=1$, $h(3)=1$\n$f(2)+g(3)+h(3)=2+1+1=4$", "lvl": 2, "key": "T08-05"}, "t08-06-2": {"id": "t08-06-2", "unit": "08", "theme": "06", "벌": 2, "k": "num", "q": "$X=\\{1,\\,2,\\,3,\\,4\\}$에서 $X$로의 일대일대응 $f$ 중에서 $f(1)\\ne 1$인 것의 개수는?", "a": "18", "w": "[핵심] 전체에서 조건을 어기는 것을 뺀다.\n일대일대응은 $4\\times 3\\times 2\\times 1=24$개\n$f(1)=1$인 것은 나머지 $3$개를 짝짓는 $3\\times 2\\times 1=6$개\n$24-6=18$", "lvl": 2, "key": "T08-06"}, "t08-07-2": {"id": "t08-07-2", "unit": "08", "theme": "07", "벌": 2, "k": "num", "q": "$X=\\{1,\\,2,\\,3,\\,4\\}$에서 $X$로의 함수 $f$가 $f(1)=2$, $f(2)=4$, $f(3)=1$, $f(4)=3$일 때, $(f\\circ f)(1)+(f\\circ f\\circ f)(2)$의 값은?", "a": "5", "w": "[핵심] 함숫값을 하나씩 따라간다.\n$(f\\circ f)(1)=f(2)=4$\n$(f\\circ f\\circ f)(2)=f(f(4))=f(3)=1$\n합은 $5$이다.", "lvl": 2, "key": "T08-07"}, "t08-08-2": {"id": "t08-08-2", "unit": "08", "theme": "08", "벌": 2, "k": "num", "q": "$X=\\{1,\\,2,\\,3,\\,4\\}$에서 $X$로의 함수 $f$가 $f(1)=2$, $f(2)=3$, $f(3)=4$, $f(4)=1$이다. $f^{1}=f$, $f^{n+1}=f\\circ f^{n}$ ($n$은 자연수)이라 할 때, $f^{2026}(1)$의 값은?", "a": "3", "w": "[핵심] 함숫값이 몇 번마다 되풀이되는지 찾는다.\n$f^{1}(1)=2$, $f^{2}(1)=3$, $f^{3}(1)=4$, $f^{4}(1)=1$이므로 $4$번마다 되풀이된다.\n$2026=4\\times 506+2$이므로 $f^{2026}(1)=f^{2}(1)=3$", "lvl": 2, "key": "T08-08"}, "t08-09-2": {"id": "t08-09-2", "unit": "08", "theme": "09", "벌": 2, "k": "num", "q": "정의역과 공역이 모두 $\\{x\\mid 0\\le x\\le 2\\}$인 함수 $f(x)=\\begin{cases}2x & (0\\le x\\le 1)\\\\ -2x+4 & (1<x\\le 2)\\end{cases}$에 대하여 방정식 $(f\\circ f)(x)=2$의 서로 다른 실근의 개수는?", "a": "2", "w": "[핵심] $f(t)=2$인 $t$를 먼저 찾고, $f(x)=t$를 푼다.\n$y=f(x)$의 그래프는 $(0,\\,0)$, $(1,\\,2)$, $(2,\\,0)$을 잇는 꺾은선이므로 $f(t)=2$인 $t$는 $1$뿐이다.\n$f(x)=1$에서 $x=\\frac{1}{2}$ 또는 $x=\\frac{3}{2}$\n실근은 $2$개이다.", "lvl": 2, "key": "T08-09"}, "t08-10-2": {"id": "t08-10-2", "unit": "08", "theme": "10", "벌": 2, "k": "num", "q": "함수 $f(x)=ax+b$에 대하여 $f^{-1}(3)=1$, $f^{-1}(-5)=-3$일 때, $f(2)$의 값은? (단, $a$, $b$는 상수이다.)", "a": "5", "w": "[핵심] 역함수 조건을 $f$의 조건으로 바꾼다.\n$f(1)=3$에서 $a+b=3$, $f(-3)=-5$에서 $-3a+b=-5$\n$a=2$, $b=1$이므로 $f(2)=5$", "lvl": 2, "key": "T08-10"}, "t08-11-2": {"id": "t08-11-2", "unit": "08", "theme": "11", "벌": 2, "k": "c5", "q": "함수 $f(x)=-3x+2$의 역함수는?", "a": "$f^{-1}(x)=-\\frac{1}{3}x+\\frac{2}{3}$", "c": ["$f^{-1}(x)=-\\frac{1}{3}x+2$", "$f^{-1}(x)=-\\frac{1}{3}x+\\frac{2}{3}$", "$f^{-1}(x)=\\frac{1}{3}x-\\frac{2}{3}$", "$f^{-1}(x)=-\\frac{1}{3}x-\\frac{2}{3}$", "$f^{-1}(x)=-3x+2$"], "w": "[핵심] $y=f(x)$를 $x$에 대하여 풀고 $x$와 $y$를 바꾼다.\n$y=-3x+2$에서 $3x=-y+2$, $x=-\\frac{1}{3}y+\\frac{2}{3}$\n$x$와 $y$를 바꾸면 $f^{-1}(x)=-\\frac{1}{3}x+\\frac{2}{3}$\n상수항도 $3$으로 나누어야 한다.", "lvl": 2, "key": "T08-11"}, "t08-12-2": {"id": "t08-12-2", "unit": "08", "theme": "12", "벌": 2, "k": "num", "q": "두 함수 $f(x)=3x-2$, $g(x)=x+1$에 대하여 $(f\\circ g)^{-1}(4)$의 값은?", "a": "1", "w": "[핵심] $(f\\circ g)^{-1}(4)=a\\iff(f\\circ g)(a)=4$\n$(f\\circ g)(x)=3(x+1)-2=3x+1$\n$3a+1=4$에서 $a=1$", "lvl": 2, "key": "T08-12"}, "t08-13-2": {"id": "t08-13-2", "unit": "08", "theme": "13", "벌": 2, "k": "num", "q": "두 함수 $f(x)=2x-1$, $g(x)=x+3$에 대하여 $(f^{-1}\\circ g)^{-1}(5)$의 값은?", "a": "6", "w": "[핵심] $(f^{-1}\\circ g)^{-1}=g^{-1}\\circ(f^{-1})^{-1}=g^{-1}\\circ f$\n$f(5)=9$\n$g^{-1}(9)=a$이면 $a+3=9$, $a=6$", "lvl": 2, "key": "T08-13"}, "t08-14-2": {"id": "t08-14-2", "unit": "08", "theme": "14", "벌": 2, "k": "num", "q": "함수 $f(x)=2x-3$의 그래프와 그 역함수 $y=f^{-1}(x)$의 그래프의 교점을 $(a,\\,b)$라 할 때, $a+b$의 값은?", "a": "6", "w": "[핵심] $x$의 값이 커질 때 $f(x)$의 값도 커지는 함수이면 $y=f(x)$와 $y=f^{-1}(x)$의 교점은 직선 $y=x$ 위에 있다.\n$2x-3=x$에서 $x=3$\n교점은 $(3,\\,3)$이므로 $a+b=6$", "lvl": 2, "key": "T08-14"}, "t08-15-2": {"id": "t08-15-2", "unit": "08", "theme": "15", "벌": 2, "k": "num", "q": "함수 $y=|x-1|+|x+3|$의 그래프와 직선 $y=k$가 무수히 많은 점에서 만날 때, 상수 $k$의 값은?", "a": "4", "w": "[핵심] 절댓값 안이 $0$이 되는 $x=-3$, $x=1$을 경계로 나눈다.\n$x<-3$일 때 $-2x-2$, $-3\\le x<1$일 때 $4$, $x\\ge 1$일 때 $2x+2$\n가운데 구간에서 그래프가 $x$축에 평행한 선분이므로 $k=4$", "lvl": 2, "key": "T08-15"}, "t08-01-3": {"id": "t08-01-3", "unit": "08", "theme": "01", "벌": 3, "k": "num", "q": "$X=\\{-1,\\,0,\\,2\\}$, $Y=\\{1,\\,2,\\,3,\\,\\cdots,\\,10\\}$일 때, $X$의 각 원소 $x$에 $x^{2}-2x+a$를 대응시키는 것이 $X$에서 $Y$로의 함수가 되도록 하는 정수 $a$의 개수는?", "a": "7", "w": "[핵심] 함수가 되려면 모든 함숫값이 공역 $Y$ 안에 있어야 한다.\n$x=-1$일 때 $a+3$, $x=0$일 때 $a$, $x=2$일 때 $a$이다.\n$1\\le a$이고 $a+3\\le 10$이어야 하므로 $1\\le a\\le 7$\n정수 $a$는 $7$개이다.", "lvl": 3, "key": "T08-01"}, "t08-02-3": {"id": "t08-02-3", "unit": "08", "theme": "02", "벌": 3, "k": "num", "q": "양의 실수 전체의 집합에서 정의된 함수 $f$가 모든 양의 실수 $x$, $y$에 대하여 $f(xy)=f(x)+f(y)$를 만족시킨다. $f(2)=1$, $f(3)=2$일 때, $f(12)+f(1)$의 값은?", "a": "4", "w": "[핵심] 주어진 식에 알맞은 수를 넣어 필요한 함숫값을 만든다.\n$x=y=1$을 넣으면 $f(1)=2f(1)$이므로 $f(1)=0$\n$f(4)=f(2)+f(2)=2$, $f(12)=f(4)+f(3)=2+2=4$\n따라서 $f(12)+f(1)=4$이다.", "lvl": 3, "key": "T08-02"}, "t08-03-3": {"id": "t08-03-3", "unit": "08", "theme": "03", "벌": 3, "k": "num", "q": "실수 전체의 집합에서 정의된 두 함수 $f(x)=x^{3}-2x$, $g(x)=ax^{2}+bx+c$가 $x=-1$, $0$, $2$에서 $f(x)=g(x)$를 만족시킬 때, $g(3)$의 값은? (단, $a$, $b$, $c$는 상수이다.)", "a": "9", "w": "[핵심] 주어진 세 입력에서 함숫값이 같다는 조건으로 $a$, $b$, $c$를 정한다.\n$f(-1)=1$, $f(0)=0$, $f(2)=4$이므로 $c=0$, $a-b=1$, $4a+2b=4$이다.\n연립하면 $a=1$, $b=0$, $c=0$이므로 $g(x)=x^{2}$, $g(3)=9$이다. 두 함수의 정의역은 실수 전체이며, 세 입력에서의 일치가 모든 실수에서의 일치를 뜻하지는 않는다.", "lvl": 3, "key": "T08-03"}, "t08-04-3": {"id": "t08-04-3", "unit": "08", "theme": "04", "벌": 3, "k": "num", "q": "$X=\\{1,\\,2,\\,3,\\,4\\}$에서 $X$로의 일대일대응 $f$가 $f(1)+f(2)=7$, $f(1)>f(2)$, $f(3)<f(4)$를 만족시킬 때, $f(1)+2f(3)$의 값은?", "a": "6", "w": "[핵심] 일대일대응이면 함숫값 $1$, $2$, $3$, $4$가 한 번씩 나온다.\n$f(1)+f(2)=7$이 되는 서로 다른 두 값은 $3$, $4$뿐이고 $f(1)>f(2)$이므로 $f(1)=4$, $f(2)=3$\n남은 $1$, $2$ 중 $f(3)<f(4)$이므로 $f(3)=1$, $f(4)=2$\n$f(1)+2f(3)=4+2=6$", "lvl": 3, "key": "T08-04"}, "t08-05-3": {"id": "t08-05-3", "unit": "08", "theme": "05", "벌": 3, "k": "num", "q": "공집합이 아닌 집합 $X$에 대하여 $X$에서 $X$로의 함수 $f(x)=x^{3}-2x^{2}$이 항등함수가 되도록 하는 집합 $X$의 개수는?", "a": "7", "w": "[핵심] 항등함수이면 $X$의 모든 원소가 $f(x)=x$를 만족시킨다.\n$x^{3}-2x^{2}=x$에서 $x(x^{2}-2x-1)=0$\n$x=0$ 또는 $x=1\\pm\\sqrt{2}$의 세 실수이다.\n$X$는 이 세 수로 이루어진 집합의 공집합이 아닌 부분집합이므로 $2^{3}-1=7$개이다.", "lvl": 3, "key": "T08-05"}, "t08-06-3": {"id": "t08-06-3", "unit": "08", "theme": "06", "벌": 3, "k": "num", "q": "$X=\\{1,\\,2,\\,3\\}$에서 $Y=\\{1,\\,2,\\,3,\\,4,\\,5\\}$로의 함수 $f$ 중에서 $f(1)<f(2)<f(3)$을 만족시키는 것의 개수는?", "a": "10", "w": "[핵심] 크기 순서가 정해져 있으면 값 $3$개를 고르기만 하면 된다.\n$Y$에서 서로 다른 $3$개를 고르면 작은 것부터 $f(1)$, $f(2)$, $f(3)$에 하나씩 정해진다.\n${}_{5}\\mathrm{C}_{3}=10$", "lvl": 3, "key": "T08-06"}, "t08-07-3": {"id": "t08-07-3", "unit": "08", "theme": "07", "벌": 3, "k": "num", "q": "두 함수 $f(x)=\\begin{cases}x+2 & (x<0)\\\\ x^{2} & (x\\ge 0)\\end{cases}$, $g(x)=x-3$에 대하여 $(f\\circ g)(1)+(g\\circ f)(-1)+(f\\circ f)(-3)$의 값은?", "a": "-1", "w": "[핵심] 안쪽 함숫값이 어느 범위인지 보고 $f$의 식을 고른다.\n$(f\\circ g)(1)=f(-2)=0$\n$(g\\circ f)(-1)=g(1)=-2$\n$(f\\circ f)(-3)=f(-1)=1$\n합은 $0-2+1=-1$이다.", "lvl": 3, "key": "T08-07"}, "t08-08-3": {"id": "t08-08-3", "unit": "08", "theme": "08", "벌": 3, "k": "num", "q": "실수 $a$, $b$에 대하여 함수 $f(x)=ax+b$가 $(f\\circ f\\circ f)(x)=8x+21$을 만족시킬 때, $f(1)$의 값은?", "a": "5", "w": "[핵심] 세 번 합성한 식을 전개해 계수를 비교한다.\n$(f\\circ f\\circ f)(x)=a^{3}x+(a^{2}+a+1)b$\n$a^{3}=8$에서 실수 $a=2$\n$(4+2+1)b=21$에서 $b=3$\n$f(1)=2+3=5$", "lvl": 3, "key": "T08-08"}, "t08-09-3": {"id": "t08-09-3", "unit": "08", "theme": "09", "벌": 3, "k": "num", "q": "정의역과 공역이 모두 $\\{x\\mid 0\\le x\\le 4\\}$인 함수 $f(x)=\\begin{cases}2x & (0\\le x\\le 2)\\\\ -2x+8 & (2<x\\le 4)\\end{cases}$에 대하여 방정식 $(f\\circ f)(x)=x$의 서로 다른 실근의 개수는?", "a": "4", "w": "[핵심] $f(x)$가 $2$보다 작은지 큰지로 구간을 나눠 $(f\\circ f)(x)$의 식을 구한다.\n$0\\le x\\le 1$일 때 $4x$, $1<x\\le 2$일 때 $-4x+8$, $2<x\\le 3$일 때 $4x-8$, $3<x\\le 4$일 때 $-4x+16$\n각 구간에서 $=x$를 풀면 $x=0$, $\\frac{8}{5}$, $\\frac{8}{3}$, $\\frac{16}{5}$이 모두 구간 안에 있다.\n실근은 $4$개이다.", "lvl": 3, "key": "T08-09"}, "t08-10-3": {"id": "t08-10-3", "unit": "08", "theme": "10", "벌": 3, "k": "num", "q": "정의역이 $\\{x\\mid x\\ge k\\}$, 공역이 $\\{y\\mid y\\ge 3\\}$인 함수 $f(x)=x^{2}-4x+7$의 역함수가 존재할 때, $k+f^{-1}(7)$의 값은?", "a": "6", "w": "[핵심] 역함수가 존재하려면 일대일대응이어야 한다. 이차함수는 축의 한쪽에서만 일대일이다.\n$f(x)=(x-2)^{2}+3$이므로 $k\\ge 2$이고 치역 $\\{y\\mid y\\ge f(k)\\}$가 공역과 같아야 하므로 $f(k)=3$, $k=2$\n$f(a)=7$, $a\\ge 2$에서 $(a-2)^{2}=4$, $a=4$\n$k+f^{-1}(7)=2+4=6$", "lvl": 3, "key": "T08-10"}, "t08-11-3": {"id": "t08-11-3", "unit": "08", "theme": "11", "벌": 3, "k": "num", "q": "함수 $f(x)=2x-4$에 대하여 함수 $y=f(x+1)$의 역함수를 $y=g(x)$라 하자. $g(x)=ax+b$일 때, $a+b$의 값은?", "a": "3/2", "w": "[핵심] $f(x+1)$을 먼저 식으로 정리한 뒤 역함수를 구한다.\n$f(x+1)=2(x+1)-4=2x-2$\n$y=2x-2$에서 $x=\\frac{1}{2}y+1$이므로 $g(x)=\\frac{1}{2}x+1$\n$a+b=\\frac{3}{2}$\n$f^{-1}(x+1)$과 헷갈리지 않는다.", "lvl": 3, "key": "T08-11"}, "t08-12-3": {"id": "t08-12-3", "unit": "08", "theme": "12", "벌": 3, "k": "num", "q": "두 함수 $f(x)=2x+a$, $g(x)=bx+c$가 모든 실수 $x$에 대하여 $(f\\circ g)(x)=x$를 만족시키고 $g(3)=1$일 때, $a+b+c$의 값은? (단, $a$, $b$, $c$는 상수이다.)", "a": "1", "w": "[핵심] $f\\circ g$가 항등함수이면 $g=f^{-1}$이다.\n$(f\\circ g)(x)=2bx+2c+a=x$에서 $b=\\frac{1}{2}$, $a=-2c$\n$g(3)=\\frac{3}{2}+c=1$에서 $c=-\\frac{1}{2}$, $a=1$\n$a+b+c=1+\\frac{1}{2}-\\frac{1}{2}=1$", "lvl": 3, "key": "T08-12"}, "t08-13-3": {"id": "t08-13-3", "unit": "08", "theme": "13", "벌": 3, "k": "num", "q": "두 함수 $f(x)=3x+2$, $g(x)=x+3$에 대하여 함수 $h$, $k$가 $h\\circ f=g$, $f\\circ k=g$를 만족시킬 때, $h(5)+k(5)$의 값은?", "a": "6", "w": "[핵심] 양쪽에 $f^{-1}$를 알맞은 쪽에서 합성한다.\n$h\\circ f=g$에서 $h=g\\circ f^{-1}$, $f\\circ k=g$에서 $k=f^{-1}\\circ g$\n$h(5)=g(f^{-1}(5))=g(1)=4$\n$k(5)=f^{-1}(g(5))=f^{-1}(8)=2$\n합은 $6$이다.", "lvl": 3, "key": "T08-13"}, "t08-14-3": {"id": "t08-14-3", "unit": "08", "theme": "14", "벌": 3, "k": "num", "q": "정의역이 $\\{x\\mid x\\ge 1\\}$, 공역이 $\\{y\\mid y\\ge 1\\}$인 함수 $f(x)=x^{2}-2x+2$의 그래프와 그 역함수 $y=f^{-1}(x)$의 그래프가 만나는 두 점 사이의 거리를 $d$라 할 때, $d^{2}$의 값은?", "a": "2", "w": "[핵심] $x\\ge 1$에서 $x$의 값이 커지면 $f(x)$의 값도 커지므로 두 그래프의 교점은 $y=f(x)$와 직선 $y=x$의 교점과 같다.\n$x^{2}-2x+2=x$에서 $(x-1)(x-2)=0$\n교점은 $(1,\\,1)$, $(2,\\,2)$이므로 $d^{2}=1^{2}+1^{2}=2$", "lvl": 3, "key": "T08-14"}, "t08-15-3": {"id": "t08-15-3", "unit": "08", "theme": "15", "벌": 3, "k": "num", "q": "함수 $y=x^{2}-4|x|+3$의 그래프와 직선 $y=k$가 서로 다른 네 점에서 만나도록 하는 정수 $k$의 개수는?", "a": "3", "w": "[핵심] $y=f(|x|)$ 꼴은 $x\\ge 0$ 부분을 그리고 $y$축에 대하여 대칭이동한다.\n$x\\ge 0$일 때 $y=(x-2)^{2}-1$이므로 그래프는 $(0,\\,3)$에서 내려가 $(2,\\,-1)$에서 최소이다.\n$y$축 대칭까지 그리면 $-1<k<3$일 때 네 점에서 만난다.\n정수 $k$는 $0$, $1$, $2$의 $3$개이다.", "lvl": 3, "key": "T08-15"}, "tm05-01-1": {"id": "tm05-01-1", "unit": "m05", "theme": "01", "벌": 1, "k": "num", "q": "함수 $f(x)=x^{3}-6x^{2}+9x+1$이 감소하는 구간이 닫힌구간 $[a,\\,b]$일 때, $a+b$의 값을 구하시오.", "a": "4", "lvl": 2, "w": "[핵심] $f'(x)\\le 0$인 $x$의 범위가 감소하는 구간이다.\n$f'(x)=3x^{2}-12x+9=3(x-1)(x-3)$\n$f'(x)\\le 0$에서 $1\\le x\\le 3$이므로 $a=1$, $b=3$, $a+b=4$", "key": "Tm05-01"}, "tm05-01-2": {"id": "tm05-01-2", "unit": "m05", "theme": "01", "벌": 2, "k": "num", "q": "함수 $f(x)=-x^{3}+ax^{2}+bx$가 구간 $(-\\infty,\\,-1]$, $[3,\\,\\infty)$에서 감소하고 구간 $[-1,\\,3]$에서 증가할 때, 두 상수 $a$, $b$에 대하여 $a+b$의 값을 구하시오.", "a": "12", "lvl": 2, "w": "[핵심] 증가·감소가 바뀌는 $x=-1$, $x=3$은 $f'(x)=0$의 두 근이다.\n$f'(x)=-3x^{2}+2ax+b=-3(x+1)(x-3)=-3x^{2}+6x+9$\n계수를 비교하면 $2a=6$, $b=9$\n따라서 $a=3$, $b=9$, $a+b=12$", "key": "Tm05-01"}, "tm05-01-3": {"id": "tm05-01-3", "unit": "m05", "theme": "01", "벌": 3, "k": "num", "q": "함수 $f(x)=3x^{4}-4x^{3}-12x^{2}+1$이 감소하는 $x$의 값의 범위가 $x\\le\\alpha$ 또는 $\\beta\\le x\\le\\gamma$일 때, $\\alpha+\\beta+\\gamma$의 값을 구하시오.", "a": "1", "lvl": 3, "w": "[핵심] 사차함수도 $f'(x)$의 부호로 증가·감소를 판정한다.\n$f'(x)=12x^{3}-12x^{2}-24x=12x(x+1)(x-2)$\n부호는 $x<-1$에서 $-$, $-1<x<0$에서 $+$, $0<x<2$에서 $-$, $x>2$에서 $+$\n감소하는 범위는 $x\\le -1$ 또는 $0\\le x\\le 2$이므로 $\\alpha+\\beta+\\gamma=-1+0+2=1$", "key": "Tm05-01"}, "tm05-02-1": {"id": "tm05-02-1", "unit": "m05", "theme": "02", "벌": 1, "k": "num", "q": "함수 $f(x)=x^{3}+ax^{2}+3x+1$이 실수 전체의 집합에서 증가하도록 하는 정수 $a$의 개수를 구하시오.", "a": "7", "lvl": 2, "w": "[핵심] 최고차항의 계수가 양수인 삼차함수가 실수 전체에서 증가 $\\iff$ $f'(x)\\ge 0$ $\\iff$ $D\\le 0$\n$f'(x)=3x^{2}+2ax+3$에서 $\\frac{D}{4}=a^{2}-9\\le 0$\n$-3\\le a\\le 3$이므로 정수 $a$는 $7$개 (등호를 빼고 $D<0$으로 세우면 $5$개가 되니 주의)", "key": "Tm05-02"}, "tm05-02-2": {"id": "tm05-02-2", "unit": "m05", "theme": "02", "벌": 2, "k": "num", "q": "함수 $f(x)=-\\frac{1}{3}x^{3}+ax^{2}-(a+6)x$가 실수 전체의 집합에서 감소하도록 하는 실수 $a$의 최댓값을 $M$, 최솟값을 $m$이라 할 때, $M-m$의 값을 구하시오.", "a": "5", "lvl": 2, "w": "[핵심] 실수 전체에서 감소 $\\iff$ 모든 $x$에 대하여 $f'(x)\\le 0$\n$f'(x)=-x^{2}+2ax-(a+6)\\le 0$ 이려면 $x^{2}-2ax+(a+6)=0$의 $\\frac{D}{4}=a^{2}-a-6\\le 0$\n$(a+2)(a-3)\\le 0$에서 $-2\\le a\\le 3$\n$M-m=3-(-2)=5$", "key": "Tm05-02"}, "tm05-02-3": {"id": "tm05-02-3", "unit": "m05", "theme": "02", "벌": 3, "k": "num", "q": "함수 $f(x)=ax^{3}+3ax^{2}+12x$가 임의의 두 실수 $x_{1}$, $x_{2}$에 대하여 $x_{1}<x_{2}$이면 $f(x_{1})<f(x_{2})$를 만족시키도록 하는 정수 $a$의 개수를 구하시오.", "a": "5", "lvl": 3, "w": "[핵심] 조건은 실수 전체에서 증가한다는 뜻이고, 최고차항의 계수 $a$가 $0$인 경우를 따로 본다.\n$a=0$이면 $f(x)=12x$로 증가한다.\n$a<0$이면 $f'(x)$의 최고차항의 계수가 음수라 $f'(x)\\ge 0$이 항상 성립할 수 없다.\n$a>0$이면 $f'(x)=3ax^{2}+6ax+12$에서 $\\frac{D}{4}=9a^{2}-36a\\le 0$, $0<a\\le 4$\n따라서 $0\\le a\\le 4$, 정수 $a$는 $5$개", "key": "Tm05-02"}, "tm05-03-1": {"id": "tm05-03-1", "unit": "m05", "theme": "03", "벌": 1, "k": "num", "q": "함수 $f(x)=-x^{3}+3x^{2}+ax$가 닫힌구간 $[1,\\,3]$에서 증가하도록 하는 실수 $a$의 최솟값을 구하시오.", "a": "9", "lvl": 2, "w": "[핵심] 구간 안의 모든 $x$에서 $f'(x)\\ge 0$ $\\iff$ 그 구간에서 $f'(x)$의 최솟값 $\\ge 0$\n$f'(x)=-3x^{2}+6x+a=-3(x-1)^{2}+a+3$은 $[1,\\,3]$에서 감소하므로 최솟값은 $f'(3)=a-9$\n$a-9\\ge 0$에서 $a\\ge 9$, 최솟값 $9$", "key": "Tm05-03"}, "tm05-03-2": {"id": "tm05-03-2", "unit": "m05", "theme": "03", "벌": 2, "k": "num", "q": "함수 $f(x)=x^{3}-3x^{2}+ax+1$이 닫힌구간 $[-1,\\,1]$에서 감소하고 구간 $[3,\\,\\infty)$에서 증가할 때, 실수 $a$의 값을 구하시오.", "a": "-9", "lvl": 2, "w": "[핵심] $f'(x)=3(x-1)^{2}+a-3$의 축 $x=1$을 기준으로 각 구간의 최대·최소를 본다.\n$[-1,\\,1]$에서 $f'(x)$의 최댓값 $f'(-1)=a+9\\le 0$이므로 $a\\le -9$\n$[3,\\,\\infty)$에서 $f'(x)$의 최솟값 $f'(3)=a+9\\ge 0$이므로 $a\\ge -9$\n따라서 $a=-9$", "key": "Tm05-03"}, "tm05-03-3": {"id": "tm05-03-3", "unit": "m05", "theme": "03", "벌": 3, "k": "num", "q": "함수 $f(x)=x^{3}+ax^{2}-a^{2}x$가 열린구간 $(-1,\\,2)$에서 감소하도록 하는 실수 $a$의 값의 범위가 $a\\le p$ 또는 $a\\ge q$일 때, $q-p$의 값을 구하시오.", "a": "9", "lvl": 3, "w": "[핵심] $f'(x)=0$의 두 근 사이가 감소 구간이므로, 그 사이에 $(-1,\\,2)$가 들어가야 한다.\n$f'(x)=3x^{2}+2ax-a^{2}=(3x-a)(x+a)$\n$a>0$이면 감소 구간 $[-a,\\,\\frac{a}{3}]$: $-a\\le -1$, $\\frac{a}{3}\\ge 2$에서 $a\\ge 6$\n$a<0$이면 감소 구간 $[\\frac{a}{3},\\,-a]$: $\\frac{a}{3}\\le -1$, $-a\\ge 2$에서 $a\\le -3$ ($a=0$이면 $f'(x)=3x^{2}\\ge 0$이라 불가)\n따라서 $p=-3$, $q=6$, $q-p=9$", "key": "Tm05-03"}, "tm05-04-1": {"id": "tm05-04-1", "unit": "m05", "theme": "04", "벌": 1, "k": "num", "q": "함수 $f(x)=x^{3}-3x^{2}-9x+5$의 극댓값을 $M$, 극솟값을 $m$이라 할 때, $M-m$의 값을 구하시오.", "a": "32", "lvl": 2, "w": "[핵심] $f'(x)=0$인 $x$의 좌우에서 부호 변화를 보고 극대·극소를 정한다.\n$f'(x)=3x^{2}-6x-9=3(x+1)(x-3)$\n$x=-1$에서 $+\\to -$이므로 극대, $M=f(-1)=10$\n$x=3$에서 $-\\to +$이므로 극소, $m=f(3)=-22$\n$M-m=32$", "key": "Tm05-04"}, "tm05-04-2": {"id": "tm05-04-2", "unit": "m05", "theme": "04", "벌": 2, "k": "num", "q": "함수 $f(x)=x^{4}-4x^{3}+10$의 극값을 모두 더한 값을 구하시오.", "a": "-17", "lvl": 2, "w": "[핵심] $f'(a)=0$이어도 좌우에서 부호가 바뀌지 않으면 극값이 아니다.\n$f'(x)=4x^{3}-12x^{2}=4x^{2}(x-3)$\n$x=0$의 좌우에서 $f'(x)<0$으로 부호가 바뀌지 않으므로 극값이 아니다.\n$x=3$에서 $-\\to +$이므로 극솟값 $f(3)=81-108+10=-17$\n극값은 이것 하나뿐이므로 답은 $-17$", "key": "Tm05-04"}, "tm05-04-3": {"id": "tm05-04-3", "unit": "m05", "theme": "04", "벌": 3, "k": "num", "q": "함수 $f(x)=x^{4}-8x^{2}+a$의 극댓값과 모든 극솟값을 더한 값이 $10$일 때, 상수 $a$의 값을 구하시오.", "a": "14", "lvl": 3, "w": "[핵심] 사차함수는 극소가 두 번 생길 수 있다 — 극솟값을 빠짐없이 센다.\n$f'(x)=4x^{3}-16x=4x(x+2)(x-2)$\n극대: $x=0$, $f(0)=a$\n극소: $x=-2$, $x=2$, $f(\\pm 2)=a-16$\n$a+2(a-16)=10$에서 $3a=42$, $a=14$", "key": "Tm05-04"}, "tm05-05-1": {"id": "tm05-05-1", "unit": "m05", "theme": "05", "벌": 1, "k": "num", "q": "함수 $f(x)=x^{3}+ax^{2}+bx+1$이 $x=1$에서 극솟값 $-3$을 가질 때, 두 상수 $a$, $b$에 대하여 $a-b$의 값을 구하시오.", "a": "9", "lvl": 2, "w": "[핵심] $x=1$에서 극솟값 $-3$ $\\Rightarrow$ $f'(1)=0$, $f(1)=-3$\n$f'(1)=3+2a+b=0$, $f(1)=2+a+b=-3$\n두 식에서 $a=2$, $b=-7$\n확인: $f'(x)=3x^{2}+4x-7=(3x+7)(x-1)$, $x=1$에서 $-\\to +$이므로 극소 맞음\n$a-b=9$", "key": "Tm05-05"}, "tm05-05-2": {"id": "tm05-05-2", "unit": "m05", "theme": "05", "벌": 2, "k": "num", "q": "함수 $f(x)=2x^{3}+ax^{2}+bx+c$가 $x=-1$에서 극댓값 $10$을 갖고 $x=2$에서 극소일 때, $f(x)$의 극솟값을 구하시오. (단, $a$, $b$, $c$는 상수이다.)", "a": "-17", "lvl": 2, "w": "[핵심] 극값을 갖는 두 점이 주어지면 $f'(x)$를 인수분해 꼴로 바로 쓴다.\n$f'(x)=6(x+1)(x-2)=6x^{2}-6x-12$이므로 $a=-3$, $b=-12$\n$f(-1)=-2-3+12+c=10$에서 $c=3$\n극솟값 $f(2)=16-12-24+3=-17$", "key": "Tm05-05"}, "tm05-05-3": {"id": "tm05-05-3", "unit": "m05", "theme": "05", "벌": 3, "k": "num", "q": "함수 $f(x)=x^{3}+ax^{2}+(a^{2}-6)x$가 $x=1$에서 극값을 갖도록 하는 모든 실수 $a$의 값의 합을 구하시오.", "a": "1", "lvl": 3, "w": "[핵심] $f'(1)=0$은 필요조건일 뿐 — 구한 값마다 부호 변화를 확인한다.\n$f'(x)=3x^{2}+2ax+a^{2}-6$, $f'(1)=a^{2}+2a-3=0$에서 $a=1$ 또는 $a=-3$\n$a=1$: $f'(x)=3x^{2}+2x-5=(3x+5)(x-1)$, 부호가 바뀌므로 극값 ○\n$a=-3$: $f'(x)=3x^{2}-6x+3=3(x-1)^{2}\\ge 0$, 부호가 안 바뀌므로 극값 ×\n따라서 답은 $1$", "key": "Tm05-05"}, "tm05-06-1": {"id": "tm05-06-1", "unit": "m05", "theme": "06", "벌": 1, "k": "num", "q": "함수 $f(x)=x^{3}-3x^{2}+2$의 그래프에서 극대인 점을 $\\mathrm{A}$, 극소인 점을 $\\mathrm{B}$라 할 때, 원점 $\\mathrm{O}$에 대하여 삼각형 $\\mathrm{OAB}$의 넓이를 구하시오.", "a": "2", "lvl": 2, "w": "[핵심] 극대·극소인 점의 좌표를 먼저 구한다.\n$f'(x)=3x(x-2)$이므로 $\\mathrm{A}(0,\\,2)$, $\\mathrm{B}(2,\\,-2)$\n$\\mathrm{OA}$가 $y$축 위에 있으므로 밑변 $\\mathrm{OA}=2$, 높이는 $\\mathrm{B}$의 $x$좌표 $2$\n넓이 $=\\frac{1}{2}\\times 2\\times 2=2$", "key": "Tm05-06"}, "tm05-06-2": {"id": "tm05-06-2", "unit": "m05", "theme": "06", "벌": 2, "k": "num", "q": "함수 $f(x)=x^{3}-6x^{2}+9x+k$의 극댓값이 극솟값의 $3$배일 때, 상수 $k$의 값을 구하시오.", "a": "2", "lvl": 2, "w": "[핵심] 극댓값·극솟값을 $k$로 나타내 조건식을 세운다.\n$f'(x)=3(x-1)(x-3)$\n극댓값 $f(1)=4+k$, 극솟값 $f(3)=k$\n$4+k=3k$에서 $k=2$", "key": "Tm05-06"}, "tm05-06-3": {"id": "tm05-06-3", "unit": "m05", "theme": "06", "벌": 3, "k": "num", "q": "양수 $a$에 대하여 함수 $f(x)=x^{3}-3a^{2}x$의 그래프에서 극대인 점을 $\\mathrm{A}$, 극소인 점을 $\\mathrm{B}$라 하자. 점 $\\mathrm{A}$를 지나고 $x$축에 평행한 직선과 점 $\\mathrm{B}$를 지나고 $y$축에 평행한 직선이 만나는 점을 $\\mathrm{C}$라 할 때, 삼각형 $\\mathrm{ABC}$의 넓이가 $64$이다. $f(x)$의 극댓값을 구하시오.", "a": "16", "lvl": 3, "w": "[핵심] 극대·극소인 점을 $a$로 나타내면 넓이가 $a$의 식이 된다.\n$f'(x)=3(x+a)(x-a)$이므로 $\\mathrm{A}(-a,\\,2a^{3})$, $\\mathrm{B}(a,\\,-2a^{3})$, $\\mathrm{C}(a,\\,2a^{3})$\n직각삼각형: $\\mathrm{AC}=2a$, $\\mathrm{BC}=4a^{3}$\n넓이 $=\\frac{1}{2}\\cdot 2a\\cdot 4a^{3}=4a^{4}=64$, $a=2$\n극댓값 $2a^{3}=16$", "key": "Tm05-06"}, "tm05-07-1": {"id": "tm05-07-1", "unit": "m05", "theme": "07", "벌": 1, "k": "num", "q": "삼차함수 $f(x)=ax^{3}+bx^{2}+cx+d$가 $x=-1$에서 극대, $x=3$에서 극소이고 $f(0)<0$일 때, 네 상수 $a$, $b$, $c$, $d$ 중 양수인 것의 개수를 구하시오.", "a": "1", "lvl": 2, "w": "[핵심] 극대가 극소보다 왼쪽 $\\Rightarrow$ $a>0$, 그다음 $f'(x)=3a(x+1)(x-3)$을 전개해 비교한다.\n$f'(x)=3ax^{2}+2bx+c=3a(x^{2}-2x-3)$\n$2b=-6a<0$, $c=-9a<0$, $d=f(0)<0$\n양수는 $a$ 하나", "key": "Tm05-07"}, "tm05-07-2": {"id": "tm05-07-2", "unit": "m05", "theme": "07", "벌": 2, "k": "num", "q": "삼차함수 $f(x)=ax^{3}+bx^{2}+cx+d$는 $x=\\alpha$에서 극소, $x=\\beta$에서 극대이고 $0<\\alpha<\\beta$, $f(0)>0$이다. 다음 중 옳은 것의 개수를 구하시오. ㄱ. $ab>0$ ㄴ. $bc<0$ ㄷ. $ad<0$ ㄹ. $bd>0$", "a": "3", "lvl": 2, "w": "[핵심] 극소가 극대보다 왼쪽 $\\Rightarrow$ $a<0$, 근과 계수의 관계로 $b$, $c$의 부호를 정한다.\n$f'(x)=3ax^{2}+2bx+c=0$의 두 근이 $\\alpha$, $\\beta$\n$\\alpha+\\beta=-\\frac{2b}{3a}>0$에서 $b>0$, $\\alpha\\beta=\\frac{c}{3a}>0$에서 $c<0$, $d=f(0)>0$\nㄱ ×, ㄴ ○, ㄷ ○, ㄹ ○ → $3$개", "key": "Tm05-07"}, "tm05-07-3": {"id": "tm05-07-3", "unit": "m05", "theme": "07", "벌": 3, "k": "num", "q": "삼차함수 $f(x)=ax^{3}+bx^{2}+cx+d$가 다음 조건을 만족시킨다. (가) $f(x)$는 $x=\\alpha$에서 극대, $x=\\beta$에서 극소이고 $\\alpha<0<\\beta$이다. (나) $\\alpha+\\beta>0$ (다) $f(x)$의 극솟값은 양수이다. 다음 중 항상 양수인 것의 개수를 구하시오. $ab$, $ac$, $bc$, $bd$, $cd$, $b^{2}-3ac$", "a": "2", "lvl": 3, "w": "[핵심] $a$는 극대·극소의 순서, $b$·$c$는 두 근의 합·곱, $d=f(0)$은 증감으로 정한다.\n극대가 왼쪽이므로 $a>0$, $\\alpha+\\beta=-\\frac{2b}{3a}>0$에서 $b<0$, $\\alpha\\beta=\\frac{c}{3a}<0$에서 $c<0$\n$[\\alpha,\\,\\beta]$에서 감소하고 $\\alpha<0<\\beta$이므로 $d=f(0)>f(\\beta)>0$\n$f'(x)=0$이 서로 다른 두 실근 $\\Rightarrow$ $\\frac{D}{4}=b^{2}-3ac>0$\n양수: $bc$, $b^{2}-3ac$ → $2$개", "key": "Tm05-07"}, "tm05-08-1": {"id": "tm05-08-1", "unit": "m05", "theme": "08", "벌": 1, "k": "num", "q": "다항함수 $f(x)$의 도함수가 $f'(x)=(x+1)(x-2)^{2}(x-4)$일 때, $f(x)$가 극값을 갖는 모든 $x$의 값의 합을 구하시오.", "a": "3", "lvl": 2, "w": "[핵심] $f'(x)$의 부호가 바뀌는 점에서만 극값 — 짝수 번 곱해진 인수는 부호를 바꾸지 않는다.\n부호: $x<-1$에서 $+$, $-1<x<2$에서 $-$, $2<x<4$에서 $-$, $x>4$에서 $+$\n$x=-1$에서 극대, $x=4$에서 극소, $x=2$는 극값 아님\n합 $=-1+4=3$", "key": "Tm05-08"}, "tm05-08-2": {"id": "tm05-08-2", "unit": "m05", "theme": "08", "벌": 2, "k": "num", "q": "삼차함수 $f(x)=x^{3}+ax^{2}+bx+c$에 대하여 $y=f'(x)$의 그래프가 $x$축과 두 점 $(-1,\\,0)$, $(3,\\,0)$에서 만나고, $f(0)=2$이다. $f(x)$의 극댓값을 구하시오.", "a": "7", "lvl": 2, "w": "[핵심] $y=f'(x)$가 $x$축과 만나는 점 = $f'(x)=0$의 근, 위에서 아래로 지나는 점이 극대.\n$f'(x)=3x^{2}+2ax+b=3(x+1)(x-3)$에서 $a=-3$, $b=-9$, $c=f(0)=2$\n$f'(x)$는 최고차항의 계수가 양수인 이차함수라 $x=-1$에서 $+\\to -$, 극대\n극댓값 $f(-1)=-1-3+9+2=7$", "key": "Tm05-08"}, "tm05-08-3": {"id": "tm05-08-3", "unit": "m05", "theme": "08", "벌": 3, "k": "num", "q": "최고차항의 계수가 $1$인 사차함수 $f(x)=x^{4}+ax^{3}+bx^{2}+c$에 대하여 $y=f'(x)$의 그래프가 점 $(3,\\,0)$에서 $x$축에 접하고, $f(1)=4$이다. $f(x)$의 극솟값을 $m$, $f(x)$가 극값을 갖는 $x$의 개수를 $n$이라 할 때, $m+n$의 값을 구하시오.", "a": "-6", "lvl": 3, "w": "[핵심] $x$축에 접하기만 하는 점은 부호가 안 바뀌어 극값이 아니다.\n$f'(x)=4x^{3}+3ax^{2}+2bx=x(4x^{2}+3ax+2b)$이고 $x=3$에서 접하므로 $4x^{2}+3ax+2b=4(x-3)^{2}$\n$a=-8$, $b=18$, $f'(x)=4x(x-3)^{2}$\n$f(1)=1-8+18+c=4$에서 $c=-7$\n극값은 $x=0$에서 극소 하나: $m=f(0)=-7$, $n=1$\n$m+n=-6$", "key": "Tm05-08"}, "tm05-09-1": {"id": "tm05-09-1", "unit": "m05", "theme": "09", "벌": 1, "k": "num", "q": "다항함수 $f(x)$의 도함수가 $f'(x)=(x+1)(x-2)^{2}$일 때, 〈보기〉에서 옳은 것의 개수를 구하시오.\nㄱ. $f(x)$는 구간 $[-1,\\,\\infty)$에서 증가한다.\nㄴ. $f(x)$는 $x=2$에서 극값을 갖는다.\nㄷ. $f(x)$는 $x=-1$에서 극대이다.\nㄹ. $f(0)\\lt f(3)$", "a": "2", "lvl": 2, "w": "[핵심] $f'(x)$의 부호가 바뀌는 점에서만 극값이 생긴다.\n$(x-2)^{2}\\ge0$이므로 $f'(x)$의 부호는 $x+1$의 부호와 같다. $x\\lt -1$에서 $f'(x)\\lt 0$, $x\\gt -1$에서 $f'(x)\\ge0$($x=2$에서만 $0$).\nㄱ. 참. 다항함수이고 $f'(x)\\ge0$이므로 증가한다.\nㄴ. 거짓. $x=2$의 좌우에서 부호가 바뀌지 않는다.\nㄷ. 거짓. 음에서 양으로 바뀌므로 극소이다.\nㄹ. 참. ㄱ에서 $0\\lt 3$이므로 $f(0)\\lt f(3)$. 옳은 것은 ㄱ, ㄹ의 $2$개.", "key": "Tm05-09"}, "tm05-09-2": {"id": "tm05-09-2", "unit": "m05", "theme": "09", "벌": 2, "k": "num", "q": "다항함수 $f(x)$의 도함수가 $f'(x)=-x^{2}(x-2)(x+3)$일 때, 〈보기〉에서 옳은 것의 개수를 구하시오.\nㄱ. $f(x)$는 $x=0$에서 극값을 갖지 않는다.\nㄴ. $f(x)$의 극댓값은 $f(2)$이다.\nㄷ. $f(-4)\\lt f(-3)$\nㄹ. 방정식 $f(x)=f(0)$의 서로 다른 실근은 $3$개이다.", "a": "3", "lvl": 2, "w": "[핵심] $x^{2}\\ge0$은 부호에 영향을 주지 않으므로 $-(x-2)(x+3)$의 부호만 본다.\n$x\\lt -3$: $-$, $-3\\lt x\\lt 2$: $+$($x=0$에서만 $0$), $x\\gt 2$: $-$. 즉 감소→증가→감소, $x=-3$에서 극소, $x=2$에서 극대.\nㄱ 참, ㄴ 참. ㄷ 거짓: $x\\lt -3$에서 감소하므로 $f(-4)\\gt f(-3)$.\nㄹ 참: $f(-3)\\lt f(0)\\lt f(2)$이고 $x\\to-\\infty$일 때 $f(x)\\to\\infty$, $x\\to\\infty$일 때 $f(x)\\to-\\infty$($f'(x)$가 최고차항 계수가 음수인 사차식이므로 $f(x)$는 최고차항 계수가 음수인 5차함수)이므로 $x\\lt -3$, $-3\\lt x\\lt 2$, $x\\gt 2$에서 하나씩 $3$개. 옳은 것은 $3$개.", "key": "Tm05-09"}, "tm05-09-3": {"id": "tm05-09-3", "unit": "m05", "theme": "09", "벌": 3, "k": "num", "q": "함수 $f(x)=x^{4}-8x^{3}+16x^{2}$에 대하여 〈보기〉에서 옳은 것의 개수를 구하시오.\nㄱ. $f(0)=f(4)$\nㄴ. $f(1)\\lt f(3)$\nㄷ. 방정식 $f(x)=f(2)$의 서로 다른 실근은 $3$개이다.\nㄹ. $f(x)$는 구간 $(1,\\,3)$에서 증가한다.", "a": "2", "lvl": 3, "w": "[핵심] $f'(x)$의 부호로 증감을 정하고, 값의 비교는 $f(x)$에 직접 넣어 한다.\n$f'(x)=4x^{3}-24x^{2}+32x=4x(x-2)(x-4)$ → $x=0$ 극소, $x=2$ 극대, $x=4$ 극소.\nㄱ 참: $f(0)=0$, $f(4)=256-512+256=0$. ㄴ 거짓: $f(1)=9=f(3)$.\nㄷ 참: $f(2)=16$이고 $f(x)-16=(x-2)^{2}(x^{2}-4x-4)$이므로 실근은 $2,\\ 2\\pm2\\sqrt{2}$의 $3$개.\nㄹ 거짓: $(2,\\,4)$에서 $f'(x)\\lt 0$이므로 $(2,\\,3)$에서 감소한다. 옳은 것은 ㄱ, ㄷ의 $2$개.", "key": "Tm05-09"}, "tm05-10-1": {"id": "tm05-10-1", "unit": "m05", "theme": "10", "벌": 1, "k": "num", "q": "함수 $f(x)=x^{3}-3x^{2}-9x+5$에 대하여 곡선 $y=f(x)$와 직선 $y=k$가 서로 다른 세 점에서 만나도록 하는 정수 $k$의 개수를 구하시오.", "a": "31", "lvl": 2, "w": "[핵심] 도함수로 증감표를 만들고 극값을 구하면 그래프의 개형이 정해진다.\n$f'(x)=3x^{2}-6x-9=3(x+1)(x-3)$. $x=-1$에서 극대 $f(-1)=10$, $x=3$에서 극소 $f(3)=-22$.\n개형은 증가→감소→증가이므로 직선 $y=k$와 세 점에서 만나려면 $-22\\lt k\\lt 10$.\n정수 $k$는 $-21,\\,\\cdots,\\,9$의 $31$개.", "key": "Tm05-10"}, "tm05-10-2": {"id": "tm05-10-2", "unit": "m05", "theme": "10", "벌": 2, "k": "num", "q": "함수 $f(x)=x^{4}-4x^{3}+k$에 대하여 곡선 $y=f(x)$가 $x$축과 서로 다른 두 점에서 만나도록 하는 자연수 $k$의 개수를 구하시오.", "a": "26", "lvl": 2, "w": "[핵심] $f'(x)$가 $x=0$에서 $0$이어도 부호가 바뀌지 않으면 극값이 아니다.\n$f'(x)=4x^{3}-12x^{2}=4x^{2}(x-3)$. $x\\lt 3$에서 $f'(x)\\le0$($x=0$에서만 $0$), $x\\gt 3$에서 $f'(x)\\gt 0$이므로 $f(x)$는 $x\\le3$에서 감소, $x\\ge3$에서 증가. 극값은 극솟값 $f(3)=k-27$ 하나뿐이다.\n$x$축과 두 점에서 만나려면 $k-27\\lt 0$, 즉 $k\\lt 27$. 자연수 $k$는 $26$개.", "key": "Tm05-10"}, "tm05-10-3": {"id": "tm05-10-3", "unit": "m05", "theme": "10", "벌": 3, "k": "num", "q": "함수 $f(x)=3x^{4}-16x^{3}+18x^{2}$에 대하여 방정식 $f(x)=k$의 서로 다른 실근의 개수를 $g(k)$라 할 때, $g(-1)+g(0)+g(3)+g(5)$의 값을 구하시오.", "a": "12", "lvl": 3, "w": "[핵심] 증감표로 개형(W자)을 그린 뒤 직선 $y=k$를 위아래로 움직여 센다.\n$f'(x)=12x^{3}-48x^{2}+36x=12x(x-1)(x-3)$. 극소 $f(0)=0$, 극대 $f(1)=5$, 극소 $f(3)=-27$.\n$k=-1$: $-27\\lt k\\lt 0$이므로 $x=3$ 근처 골짜기에서만 $2$개.\n$k=0$: $x=0$에서 접하고 양옆에서 $2$개 더 $\\Rightarrow 3$개. $k=3$: $0\\lt k\\lt 5$이므로 $4$개. $k=5$: $x=1$에서 접하고 $2$개 더 $\\Rightarrow 3$개.\n$2+3+4+3=12$.", "key": "Tm05-10"}, "tm05-11-1": {"id": "tm05-11-1", "unit": "m05", "theme": "11", "벌": 1, "k": "num", "q": "함수 $f(x)=x^{3}+ax^{2}+(a+6)x+1$이 극값을 갖도록 하는 정수 $a$ 중에서 $|a|\\le10$인 것의 개수를 구하시오.", "a": "11", "lvl": 2, "w": "[핵심] 삼차함수가 극값을 가질 조건은 $f'(x)=0$의 판별식 $D\\gt 0$.\n$f'(x)=3x^{2}+2ax+a+6$, $\\frac{D}{4}=a^{2}-3(a+6)=(a-6)(a+3)\\gt 0$.\n$a\\lt -3$ 또는 $a\\gt 6$. $|a|\\le10$인 정수는 $-10,\\,\\cdots,\\,-4$의 $7$개와 $7,\\,\\cdots,\\,10$의 $4$개, 합하여 $11$개.", "key": "Tm05-11"}, "tm05-11-2": {"id": "tm05-11-2", "unit": "m05", "theme": "11", "벌": 2, "k": "num", "q": "함수 $f(x)=x^{3}-3ax^{2}+3(a+2)x$가 극값을 갖도록 하는 실수 $a$의 값의 범위가 $a\\lt \\alpha$ 또는 $a\\gt \\beta$일 때, $\\alpha^{2}+\\beta^{2}$의 값을 구하시오.", "a": "5", "lvl": 2, "w": "[핵심] $f'(x)=0$이 서로 다른 두 실근을 가져야 한다.\n$f'(x)=3x^{2}-6ax+3(a+2)$, $\\frac{D}{4}=9a^{2}-9(a+2)=9(a-2)(a+1)\\gt 0$.\n$a\\lt -1$ 또는 $a\\gt 2$이므로 $\\alpha=-1$, $\\beta=2$.\n$\\alpha^{2}+\\beta^{2}=1+4=5$.", "key": "Tm05-11"}, "tm05-11-3": {"id": "tm05-11-3", "unit": "m05", "theme": "11", "벌": 3, "k": "num", "q": "$6$ 이하의 두 자연수 $a$, $b$에 대하여 함수 $f(x)=x^{3}+ax^{2}+bx+1$이 극값을 갖도록 하는 순서쌍 $(a,\\,b)$의 개수를 구하시오.", "a": "20", "lvl": 3, "w": "[핵심] 극값을 가질 조건 $\\frac{D}{4}\\gt 0$을 $b$에 대한 부등식으로 바꿔 $a$별로 센다.\n$f'(x)=3x^{2}+2ax+b$, $\\frac{D}{4}=a^{2}-3b\\gt 0$, 즉 $b\\lt \\frac{a^{2}}{3}$.\n$a=1$: $b\\lt \\frac13$ → $0$개, $a=2$: $b\\lt \\frac43$ → $1$개, $a=3$: $b\\lt 3$ → $2$개,\n$a=4$: $b\\lt \\frac{16}{3}$ → $5$개, $a=5$: $b\\lt \\frac{25}{3}$ → $6$개, $a=6$: $b\\lt 12$ → $6$개.\n합 $0+1+2+5+6+6=20$.", "key": "Tm05-11"}, "tm05-12-1": {"id": "tm05-12-1", "unit": "m05", "theme": "12", "벌": 1, "k": "num", "q": "삼차함수 $f(x)=\\frac{1}{3}(a-1)x^{3}+(a-1)x^{2}+2x+3$이 극값을 갖지 않도록 하는 모든 정수 $a$의 값의 합을 구하시오.", "a": "5", "lvl": 2, "w": "[핵심] 극값을 갖지 않을 조건은 $D\\le0$ ($D\\lt 0$이 아니다). 삼차함수이므로 $a\\ne1$.\n$f'(x)=(a-1)x^{2}+2(a-1)x+2$, $\\frac{D}{4}=(a-1)^{2}-2(a-1)=(a-1)(a-3)\\le0$.\n$1\\le a\\le3$이고 $a\\ne1$이므로 $1\\lt a\\le3$. 정수 $a=2,\\,3$, 합은 $5$.\n($a=3$이면 $f'(x)=2(x+1)^{2}\\ge0$으로 부호가 바뀌지 않는다.)", "key": "Tm05-12"}, "tm05-12-2": {"id": "tm05-12-2", "unit": "m05", "theme": "12", "벌": 2, "k": "num", "q": "함수 $f(x)=x^{3}-3(a+1)x^{2}+12ax$가 극값을 갖지 않도록 하는 실수 $a$에 대하여 $f(2)$의 값을 구하시오.", "a": "8", "lvl":
