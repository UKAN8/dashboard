ge 0$을 이용한다.", "a": "$2(|ab|-ab)$", "c": ["$2(|ab|-ab)$", "$2(|ab|+ab)$", "$2|ab|$", "$|ab|-ab$"], "w": "$(|a|+|b|)^{2}=a^{2}+2|ab|+b^{2}$, $|a+b|^{2}=a^{2}+2ab+b^{2}$이므로 차는 $2(|ab|-ab)$이고 $|ab|\\ge ab$이다.", "key": "C07-04"}, "c08-01-1-01": {"id": "c08-01-1-01", "unit": "08", "concept": "01", "벌": 1, "k": "ox", "q": "두 집합 $X$, $Y$에 대하여 $X$의 각 원소에 $Y$의 원소가 오직 하나씩 대응할 때, 이 대응을 $X$에서 $Y$로의 함수라 한다.", "a": "O", "w": "함수의 뜻이다. $X$의 원소마다 대응하는 $Y$의 원소가 있어야 하고, 그것이 꼭 하나뿐이어야 한다.", "key": "C08-01"}, "c08-01-1-02": {"id": "c08-01-1-02", "unit": "08", "concept": "01", "벌": 1, "k": "ox", "q": "$X$에서 $Y$로의 대응에서 $Y$의 원소 중 $X$의 어떤 원소에도 대응하지 않는 것이 있으면 이 대응은 함수가 아니다.", "a": "X", "w": "함수의 조건은 $X$의 원소 쪽에만 있다. $X$의 각 원소에 $Y$의 원소가 하나씩 대응하면, 공역 $Y$에 대응받지 않는 원소가 남아 있어도 함수이다.", "key": "C08-01"}, "c08-01-1-03": {"id": "c08-01-1-03", "unit": "08", "concept": "01", "벌": 1, "k": "ox", "q": "함수 $f\\colon X\\to Y$의 치역은 항상 공역의 부분집합이다.", "a": "O", "w": "치역은 함숫값 전체의 집합이고 함숫값은 모두 $Y$의 원소이므로 치역 $\\subset Y$이다.", "key": "C08-01"}, "c08-01-1-04": {"id": "c08-01-1-04", "unit": "08", "concept": "01", "벌": 1, "k": "ox", "q": "$X=\\{1,\\,2\\}$, $Y=\\{a,\\,b\\}$일 때, $1$에 $a$와 $b$가 모두 대응하고 $2$에 $a$가 대응하는 대응은 $X$에서 $Y$로의 함수이다.", "a": "X", "w": "$1$에 대응하는 원소가 $a$, $b$의 두 개이므로 ‘오직 하나씩’에 어긋나 함수가 아니다.", "key": "C08-01"}, "c08-01-1-05": {"id": "c08-01-1-05", "unit": "08", "concept": "01", "벌": 1, "k": "ox", "q": "정의역이 $\\{-1,\\,0,\\,1\\}$인 함수 $f(x)=x^{2}$의 치역은 $\\{0,\\,1\\}$이다.", "a": "O", "w": "$f(-1)=1$, $f(0)=0$, $f(1)=1$이므로 함숫값 전체의 집합은 $\\{0,\\,1\\}$이다. 같은 값은 한 번만 쓴다.", "key": "C08-01"}, "c08-01-1-06": {"id": "c08-01-1-06", "unit": "08", "concept": "01", "벌": 1, "k": "c4", "q": "함수 $f\\colon X\\to Y$에서 집합 $X$를 함수 $f$의 ____(이)라 한다.", "a": "정의역", "c": ["정의역", "공역", "치역", "함숫값"], "w": "$X$는 정의역, $Y$는 공역, 함숫값 전체의 집합은 치역이다.", "key": "C08-01"}, "c08-01-1-07": {"id": "c08-01-1-07", "unit": "08", "concept": "01", "벌": 1, "k": "c4", "q": "정의역이 $\\{1,\\,2,\\,3\\}$이고 공역이 실수 전체의 집합인 함수 $f(x)=2x-1$의 치역은 ____이다.", "a": "$\\{1,\\,3,\\,5\\}$", "c": ["$\\{1,\\,3,\\,5\\}$", "실수 전체의 집합", "$\\{1,\\,2,\\,3\\}$", "$\\{x\\mid 1\\le x\\le 5\\}$"], "w": "$f(1)=1$, $f(2)=3$, $f(3)=5$이므로 치역은 $\\{1,\\,3,\\,5\\}$이다. 공역(실수 전체)과 치역은 다를 수 있다.", "key": "C08-01"}, "c08-01-1-08": {"id": "c08-01-1-08", "unit": "08", "concept": "01", "벌": 1, "k": "c4", "q": "정의역과 공역이 각각 같은 두 함수 $f$, $g$가 ____일 때, 두 함수는 서로 같다고 하고 $f=g$로 나타낸다.", "a": "정의역의 모든 원소 $x$에 대하여 $f(x)=g(x)$", "c": ["정의역의 모든 원소 $x$에 대하여 $f(x)=g(x)$", "정의역의 어떤 원소 $x$에 대하여 $f(x)=g(x)$", "두 함수의 치역이 같을 때", "두 함수의 식의 꼴이 같을 때"], "w": "서로 같은 함수는 정의역·공역이 같고, 정의역의 <b>모든<\/b> 원소에서 함숫값이 같아야 한다. 치역만 같거나 한 점에서만 같으면 안 된다.", "key": "C08-01"}, "c08-02-1-01": {"id": "c08-02-1-01", "unit": "08", "concept": "02", "벌": 1, "k": "ox", "q": "함수 $f\\colon X\\to Y$에서 정의역 $X$의 임의의 두 원소 $x_{1}$, $x_{2}$에 대하여 $x_{1}\\ne x_{2}$이면 $f(x_{1})\\ne f(x_{2})$일 때, $f$를 일대일함수라 한다.", "a": "O", "w": "일대일함수의 뜻이다. 서로 다른 원소는 서로 다른 값에 대응한다.", "key": "C08-02"}, "c08-02-1-02": {"id": "c08-02-1-02", "unit": "08", "concept": "02", "벌": 1, "k": "ox", "q": "일대일함수는 모두 일대일대응이다.", "a": "X", "w": "일대일대응은 일대일함수이면서 치역과 공역이 같아야 한다. 정의역 $\\{1,\\,2\\}$, 공역 $\\{1,\\,2,\\,3\\}$인 $f(x)=x$는 일대일함수이지만 일대일대응이 아니다.", "key": "C08-02"}, "c08-02-1-03": {"id": "c08-02-1-03", "unit": "08", "concept": "02", "벌": 1, "k": "ox", "q": "일대일대응은 일대일함수이면서 치역과 공역이 같은 함수이다.", "a": "O", "w": "일대일대응의 뜻이다. 공역의 원소가 하나도 남지 않고 하나씩 짝지어진다.", "key": "C08-02"}, "c08-02-1-04": {"id": "c08-02-1-04", "unit": "08", "concept": "02", "벌": 1, "k": "ox", "q": "함수 $f\\colon X\\to X$에서 $X$의 모든 원소 $x$에 대하여 $f(x)=x$일 때, $f$를 $X$에서의 항등함수라 한다.", "a": "O", "w": "항등함수의 뜻이다. 정의역과 공역이 같고 각 원소가 자기 자신에 대응한다.", "key": "C08-02"}, "c08-02-1-05": {"id": "c08-02-1-05", "unit": "08", "concept": "02", "벌": 1, "k": "ox", "q": "상수함수 $f\\colon X\\to Y$의 치역은 원소가 $2$개 이상일 수 있다.", "a": "X", "w": "상수함수는 $X$의 모든 원소가 $Y$의 한 원소에만 대응하는 함수이므로 치역의 원소는 $1$개뿐이다.", "key": "C08-02"}, "c08-02-1-06": {"id": "c08-02-1-06", "unit": "08", "concept": "02", "벌": 1, "k": "c4", "q": "실수 전체의 집합에서 정의된 다음 함수 중 일대일대응인 것은 ____이다.", "a": "$f(x)=2x-3$", "c": ["$f(x)=2x-3$", "$f(x)=x^{2}$", "$f(x)=|x|$", "$f(x)=5$"], "w": "$2x-3$은 서로 다른 $x$에 서로 다른 값이 대응하고 치역이 실수 전체이다. $x^{2}$, $|x|$는 $f(-1)=f(1)$이고, $5$는 상수함수이다.", "key": "C08-02"}, "c08-02-1-07": {"id": "c08-02-1-07", "unit": "08", "concept": "02", "벌": 1, "k": "c4", "q": "$X=\\{1,\\,2,\\,3\\}$에서 $Y=\\{a,\\,b\\}$로의 함수의 개수는 ____이다.", "a": "$8$", "c": ["$8$", "$6$", "$9$", "$5$"], "w": "$1$, $2$, $3$이 각각 $a$, $b$ 중 하나를 고르므로 $2\\times 2\\times 2=8$이다. $3^{2}=9$로 거꾸로 세지 않는다.", "key": "C08-02"}, "c08-02-1-08": {"id": "c08-02-1-08", "unit": "08", "concept": "02", "벌": 1, "k": "c4", "q": "$x$축에 평행한 모든 직선이 함수 $y=f(x)$의 그래프와 ____ 만나면 $f$는 일대일함수이다.", "a": "많아야 한 점에서", "c": ["많아야 한 점에서", "적어도 두 점에서", "항상 두 점에서", "$y$축 위에서"], "w": "직선 $y=k$와 두 점에서 만나면 서로 다른 두 $x$의 함숫값이 같다는 뜻이다. 많아야 한 점에서 만나야 일대일함수이다.", "key": "C08-02"}, "c08-03-1-01": {"id": "c08-03-1-01", "unit": "08", "concept": "03", "벌": 1, "k": "ox", "q": "두 함수 $f\\colon X\\to Y$, $g\\colon Y\\to Z$에 대하여 $X$의 각 원소 $x$에 $Z$의 원소 $g(f(x))$를 대응시키는 함수를 $f$와 $g$의 합성함수라 하고 $g\\circ f$로 나타낸다.", "a": "O", "w": "합성함수의 뜻이다. 먼저 $f$, 그다음 $g$를 적용한다.", "key": "C08-03"}, "c08-03-1-02": {"id": "c08-03-1-02", "unit": "08", "concept": "03", "벌": 1, "k": "ox", "q": "두 함수 $f$, $g$에 대하여 항상 $g\\circ f=f\\circ g$이다.", "a": "X", "w": "합성함수는 교환법칙이 성립하지 않는다. $f(x)=x+1$, $g(x)=2x$이면 $(g\\circ f)(0)=2$, $(f\\circ g)(0)=1$이다.", "key": "C08-03"}, "c08-03-1-03": {"id": "c08-03-1-03", "unit": "08", "concept": "03", "벌": 1, "k": "ox", "q": "세 함수 $f$, $g$, $h$에 대하여 $h\\circ(g\\circ f)=(h\\circ g)\\circ f$이다.", "a": "O", "w": "합성함수는 결합법칙이 성립한다. 어느 쪽이든 $x$에 $f$, $g$, $h$를 차례로 적용한 $h(g(f(x)))$이다.", "key": "C08-03"}, "c08-03-1-04": {"id": "c08-03-1-04", "unit": "08", "concept": "03", "벌": 1, "k": "ox", "q": "$f(x)=x+1$, $g(x)=2x$일 때 $(g\\circ f)(1)=3$이다.", "a": "X", "w": "$(g\\circ f)(1)=g(f(1))=g(2)=4$이다. $3$은 $(f\\circ g)(1)=f(2)$로 순서를 거꾸로 한 값이다.", "key": "C08-03"}, "c08-03-1-05": {"id": "c08-03-1-05", "unit": "08", "concept": "03", "벌": 1, "k": "ox", "q": "함수 $f\\colon X\\to X$와 $X$에서의 항등함수 $I$에 대하여 $f\\circ I=I\\circ f=f$이다.", "a": "O", "w": "항등함수는 값을 바꾸지 않으므로 앞에 합성하든 뒤에 합성하든 $f$ 그대로이다.", "key": "C08-03"}, "c08-03-1-06": {"id": "c08-03-1-06", "unit": "08", "concept": "03", "벌": 1, "k": "c4", "q": "$(g\\circ f)(x)$는 ____와 같다.", "a": "$g(f(x))$", "c": ["$g(f(x))$", "$f(g(x))$", "$g(x)f(x)$", "$f(x)+g(x)$"], "w": "$g\\circ f$는 $f$를 먼저 적용하므로 $(g\\circ f)(x)=g(f(x))$이다. 곱이나 합이 아니다.", "key": "C08-03"}, "c08-03-1-07": {"id": "c08-03-1-07", "unit": "08", "concept": "03", "벌": 1, "k": "c4", "q": "두 함수 $f\\colon X\\to Y$, $g\\colon Y\\to Z$의 합성함수 $g\\circ f$의 정의역은 ____이다.", "a": "$X$", "c": ["$X$", "$Y$", "$Z$", "$f$의 치역"], "w": "$g\\circ f$는 $X$의 원소에서 출발해 $Z$의 원소에 대응하므로 정의역은 $X$, 공역은 $Z$이다.", "key": "C08-03"}, "c08-03-1-08": {"id": "c08-03-1-08", "unit": "08", "concept": "03", "벌": 1, "k": "c4", "q": "$f(x)=x^{2}$, $g(x)=x-3$일 때 $(f\\circ g)(x)=$ ____이다.", "a": "$(x-3)^{2}$", "c": ["$(x-3)^{2}$", "$x^{2}-3$", "$x^{2}(x-3)$", "$x^{2}+x-3$"], "w": "$(f\\circ g)(x)=f(g(x))=f(x-3)=(x-3)^{2}$이다. $x^{2}-3$은 $(g\\circ f)(x)$이다.", "key": "C08-03"}, "c08-04-1-01": {"id": "c08-04-1-01", "unit": "08", "concept": "04", "벌": 1, "k": "ox", "q": "함수 $f\\colon X\\to Y$가 일대일대응일 때, $Y$의 각 원소 $y$에 $f(x)=y$인 $X$의 원소 $x$를 대응시키는 함수를 $f$의 역함수라 하고 $f^{-1}$로 나타낸다.", "a": "O", "w": "역함수의 뜻이다. $f^{-1}$는 $Y$에서 $X$로의 함수이고 $y=f(x)\\iff x=f^{-1}(y)$이다.", "key": "C08-04"}, "c08-04-1-02": {"id": "c08-04-1-02", "unit": "08", "concept": "04", "벌": 1, "k": "ox", "q": "함수 $f\\colon X\\to Y$가 일대일함수이기만 하면 항상 역함수가 존재한다.", "a": "X", "w": "치역과 공역이 같아야 한다. 공역에 대응받지 않는 원소가 있으면 그 원소에 대응시킬 $x$가 없어 역함수가 정의되지 않는다. 역함수가 존재할 조건은 일대일대응이다.", "key": "C08-04"}, "c08-04-1-03": {"id": "c08-04-1-03", "unit": "08", "concept": "04", "벌": 1, "k": "ox", "q": "역함수가 존재하는 함수 $f$에 대하여 $f^{-1}(b)=a$이면 $f(a)=b$이다.", "a": "O", "w": "$f^{-1}(b)=a$는 ‘$f$가 $a$를 $b$에 대응시킨다’는 뜻이므로 $f(a)=b$이다.", "key": "C08-04"}, "c08-04-1-04": {"id": "c08-04-1-04", "unit": "08", "concept": "04", "벌": 1, "k": "ox", "q": "함수 $f\\colon X\\to Y$의 역함수 $f^{-1}$의 정의역은 $X$이다.", "a": "X", "w": "$f^{-1}$는 $Y$에서 $X$로의 함수이므로 정의역은 $Y$, 공역은 $X$이다.", "key": "C08-04"}, "c08-04-1-05": {"id": "c08-04-1-05", "unit": "08", "concept": "04", "벌": 1, "k": "ox", "q": "$f(x)=x+3$의 역함수는 $f^{-1}(x)=x-3$이다.", "a": "O", "w": "$y=x+3$을 $x$에 대하여 풀면 $x=y-3$이고, $x$와 $y$를 바꾸면 $y=x-3$이다.", "key": "C08-04"}, "c08-04-1-06": {"id": "c08-04-1-06", "unit": "08", "concept": "04", "벌": 1, "k": "c4", "q": "함수 $f$의 역함수가 존재하기 위한 필요충분조건은 $f$가 ____인 것이다.", "a": "일대일대응", "c": ["일대일대응", "일대일함수", "항등함수", "상수함수"], "w": "역함수가 존재 $\\iff$ 일대일대응이다. 일대일함수만으로는 부족하다.", "key": "C08-04"}, "c08-04-1-07": {"id": "c08-04-1-07", "unit": "08", "concept": "04", "벌": 1, "k": "c4", "q": "$f(x)=2x+1$일 때 $f^{-1}(5)=$ ____이다.", "a": "$2$", "c": ["$2$", "$11$", "$\\frac{1}{11}$", "$3$"], "w": "$f^{-1}(5)=a$이면 $f(a)=5$이므로 $2a+1=5$, $a=2$이다. $11$은 $f(5)$이고, $\\frac{1}{11}$은 $\\frac{1}{f(5)}$이다.", "key": "C08-04"}, "c08-04-1-08": {"id": "c08-04-1-08", "unit": "08", "concept": "04", "벌": 1, "k": "c4", "q": "함수 $y=f(x)$의 역함수를 구할 때는 $y=f(x)$를 $x$에 대하여 푼 뒤 ____.", "a": "$x$와 $y$를 서로 바꾼다", "c": ["$x$와 $y$를 서로 바꾼다", "양변에 $-1$을 곱한다", "$y$를 $\\frac{1}{y}$로 바꾼다", "$x$에 $-x$를 대입한다"], "w": "$x=f^{-1}(y)$를 얻은 뒤 $x$와 $y$를 바꾸어 $y=f^{-1}(x)$로 나타낸다.", "key": "C08-04"}, "c08-05-1-01": {"id": "c08-05-1-01", "unit": "08", "concept": "05", "벌": 1, "k": "ox", "q": "역함수가 존재하는 함수 $f$에 대하여 $(f^{-1})^{-1}=f$이다.", "a": "O", "w": "$f^{-1}$의 대응을 다시 거꾸로 읽으면 처음 $f$가 된다.", "key": "C08-05"}, "c08-05-1-02": {"id": "c08-05-1-02", "unit": "08", "concept": "05", "벌": 1, "k": "ox", "q": "함수 $f\\colon X\\to Y$의 역함수 $f^{-1}$에 대하여 $X$의 모든 원소 $x$에서 $(f^{-1}\\circ f)(x)=x$이다.", "a": "O", "w": "$x$가 $f$로 $f(x)$에 갔다가 $f^{-1}$로 다시 $x$로 돌아온다. 곧 $f^{-1}\\circ f$는 $X$에서의 항등함수이다.", "key": "C08-05"}, "c08-05-1-03": {"id": "c08-05-1-03", "unit": "08", "concept": "05", "벌": 1, "k": "ox", "q": "역함수가 존재하는 두 함수 $f$, $g$에 대하여 $(g\\circ f)^{-1}=g^{-1}\\circ f^{-1}$이다.", "a": "X", "w": "$(g\\circ f)^{-1}=f^{-1}\\circ g^{-1}$이다. 나중에 적용한 $g$를 먼저 되돌려야 하므로 순서가 바뀐다.", "key": "C08-05"}, "c08-05-1-04": {"id": "c08-05-1-04", "unit": "08", "concept": "05", "벌": 1, "k": "ox", "q": "함수 $y=f(x)$의 그래프와 그 역함수 $y=f^{-1}(x)$의 그래프는 $x$축에 대하여 대칭이다.", "a": "X", "w": "두 그래프는 직선 $y=x$에 대하여 대칭이다. 점 $(a,\\,b)$가 $(b,\\,a)$로 옮겨지기 때문이다.", "key": "C08-05"}, "c08-05-1-05": {"id": "c08-05-1-05", "unit": "08", "concept": "05", "벌": 1, "k": "ox", "q": "점 $(2,\\,5)$가 함수 $y=f(x)$의 그래프 위에 있고 $f$의 역함수가 존재하면, 점 $(5,\\,2)$는 $y=f^{-1}(x)$의 그래프 위에 있다.", "a": "O", "w": "$f(2)=5$이면 $f^{-1}(5)=2$이므로 점 $(5,\\,2)$가 $y=f^{-1}(x)$의 그래프 위에 있다.", "key": "C08-05"}, "c08-05-1-06": {"id": "c08-05-1-06", "unit": "08", "concept": "05", "벌": 1, "k": "c4", "q": "역함수가 존재하는 두 함수 $f$, $g$에 대하여 $(g\\circ f)^{-1}=$ ____이다.", "a": "$f^{-1}\\circ g^{-1}$", "c": ["$f^{-1}\\circ g^{-1}$", "$g^{-1}\\circ f^{-1}$", "$g\\circ f^{-1}$", "$f\\circ g$"], "w": "$g\\circ f$는 $f$ 다음 $g$를 적용하므로, 되돌릴 때는 $g^{-1}$ 다음 $f^{-1}$이다. 곧 $f^{-1}\\circ g^{-1}$이다.", "key": "C08-05"}, "c08-05-1-07": {"id": "c08-05-1-07", "unit": "08", "concept": "05", "벌": 1, "k": "c4", "q": "함수 $y=f(x)$의 그래프와 그 역함수 $y=f^{-1}(x)$의 그래프는 직선 ____에 대하여 대칭이다.", "a": "$y=x$", "c": ["$y=x$", "$y=-x$", "$x=0$", "$y=0$"], "w": "$y=f(x)$ 위의 점 $(a,\\,b)$에 대하여 $(b,\\,a)$가 $y=f^{-1}(x)$ 위에 있으므로 두 그래프는 직선 $y=x$에 대하여 대칭이다.", "key": "C08-05"}, "c08-05-1-08": {"id": "c08-05-1-08", "unit": "08", "concept": "05", "벌": 1, "k": "c4", "q": "함수 $y=|f(x)|$의 그래프는 $y=f(x)$의 그래프에서 ____ 부분을 $x$축에 대하여 대칭이동하여 그린다.", "a": "$y<0$인", "c": ["$y<0$인", "$x<0$인", "$y>0$인", "$x>0$인"], "w": "$f(x)<0$이면 $|f(x)|=-f(x)$이므로 $x$축 아래($y<0$) 부분만 $x$축 위로 접어 올린다.", "key": "C08-05"}, "c08-01-2-01": {"id": "c08-01-2-01", "unit": "08", "concept": "01", "벌": 2, "k": "ox", "q": "어떤 대응의 그래프가 정의역의 원소 $a$에 대하여 직선 $x=a$와 두 점에서 만나면, 그 대응은 함수가 아니다.", "a": "O", "w": "직선 $x=a$와 두 점에서 만나면 $a$에 대응하는 값이 두 개라는 뜻이다. 함수의 그래프는 $y$축에 평행한 직선과 한 점에서만 만난다.", "key": "C08-01"}, "c08-01-2-02": {"id": "c08-01-2-02", "unit": "08", "concept": "01", "벌": 2, "k": "ox", "q": "함수 $y=f(x)$의 정의역이나 공역이 주어지지 않으면 정의역은 $f(x)$가 정의되는 실수 전체의 집합, 공역은 실수 전체의 집합으로 생각한다.", "a": "O", "w": "교과서의 약속이다. 예를 들어 $y=2x+1$은 정의역과 공역을 모두 실수 전체의 집합으로 본다.", "key": "C08-01"}, "c08-01-2-03": {"id": "c08-01-2-03", "unit": "08", "concept": "01", "벌": 2, "k": "ox", "q": "함수 $y=x^{2}+1$의 정의역과 공역이 주어지지 않았으면 치역도 실수 전체의 집합으로 생각한다.", "a": "X", "w": "정의역·공역이 주어지지 않을 때의 약속은 정의역과 공역에 대한 것이다. 치역은 함숫값 전체의 집합이므로 $x^{2}+1\\ge 1$에서 $\\{y\\mid y\\ge 1\\}$이다.", "key": "C08-01"}, "c08-01-2-04": {"id": "c08-01-2-04", "unit": "08", "concept": "01", "벌": 2, "k": "ox", "q": "정의역이 $\\{-1,\\,0,\\,1\\}$인 두 함수 $f(x)=x$, $g(x)=x^{3}$은 서로 같은 함수이다.", "a": "O", "w": "$f(-1)=g(-1)=-1$, $f(0)=g(0)=0$, $f(1)=g(1)=1$이므로 정의역의 모든 원소에서 함숫값이 같다. 식이 달라도 서로 같은 함수일 수 있다.", "key": "C08-01"}, "c08-01-2-05": {"id": "c08-01-2-05", "unit": "08", "concept": "01", "벌": 2, "k": "ox", "q": "정의역과 공역이 각각 같은 두 함수 $f$, $g$의 치역이 같으면 $f$와 $g$는 서로 같은 함수이다.", "a": "X", "w": "정의역 $\\{0,\\,1\\}$에서 $f(x)=x$, $g(x)=1-x$는 치역이 $\\{0,\\,1\\}$로 같지만 $f(0)\\ne g(0)$이므로 서로 같지 않다.", "key": "C08-01"}, "c08-01-2-06": {"id": "c08-01-2-06", "unit": "08", "concept": "01", "벌": 2, "k": "c4", "q": "함수 $f(x)=x^{2}-2x$에서 $f(3)$의 값은 ____이다.", "a": "$3$", "c": ["$3$", "$15$", "$9$", "$-3$"], "w": "$f(3)=3^{2}-2\\times 3=9-6=3$이다. 함숫값은 $x$ 자리에 그 수를 넣은 값이다.", "key": "C08-01"}, "c08-01-2-07": {"id": "c08-01-2-07", "unit": "08", "concept": "01", "벌": 2, "k": "c4", "q": "함수 $f\\colon X\\to Y$의 그래프는 집합 ____이다.", "a": "$\\{(x,\\,f(x))\\mid x\\in X\\}$", "c": ["$\\{(x,\\,f(x))\\mid x\\in X\\}$", "$\\{(f(x),\\,x)\\mid x\\in X\\}$", "$\\{(x,\\,y)\\mid x\\in X,\\ y\\in Y\\}$", "$\\{(x,\\,f(x))\\mid x\\in Y\\}$"], "w": "함수의 그래프는 정의역의 원소 $x$와 그 함숫값 $f(x)$의 순서쌍 $(x,\\,f(x))$ 전체의 집합이다.", "key": "C08-01"}, "c08-01-2-08": {"id": "c08-01-2-08", "unit": "08", "concept": "01", "벌": 2, "k": "c4", "q": "정의역이 $\\{x\\mid 0\\le x\\le 2\\}$인 함수 $f(x)=-x+3$의 치역은 ____이다.", "a": "$\\{y\\mid 1\\le y\\le 3\\}$", "c": ["$\\{y\\mid 1\\le y\\le 3\\}$", "$\\{y\\mid 0\\le y\\le 2\\}$", "실수 전체의 집합", "$\\{y\\mid 1<y<3\\}$"], "w": "$x$가 $0$에서 $2$까지 변할 때 $f(x)$는 $f(0)=3$에서 $f(2)=1$까지 변하므로 치역은 $\\{y\\mid 1\\le y\\le 3\\}$이다. 양 끝값도 들어간다.", "key": "C08-01"}, "c08-02-2-01": {"id": "c08-02-2-01", "unit": "08", "concept": "02", "벌": 2, "k": "ox", "q": "실수 전체의 집합에서 정의된 함수 $f(x)=x^{2}$은 일대일함수이다.", "a": "X", "w": "$f(-2)=f(2)=4$처럼 서로 다른 두 원소가 같은 값에 대응하므로 일대일함수가 아니다.", "key": "C08-02"}, "c08-02-2-02": {"id": "c08-02-2-02", "unit": "08", "concept": "02", "벌": 2, "k": "ox", "q": "정의역이 $\\{x\\mid x\\ge 0\\}$, 공역이 $\\{y\\mid y\\ge 0\\}$인 함수 $f(x)=x^{2}$은 일대일대응이다.", "a": "O", "w": "$x\\ge 0$에서 $x$가 커지면 $x^{2}$도 커지므로 일대일함수이고, 치역이 $\\{y\\mid y\\ge 0\\}$으로 공역과 같다. 정의역·공역에 따라 판정이 달라진다.", "key": "C08-02"}, "c08-02-2-03": {"id": "c08-02-2-03", "unit": "08", "concept": "02", "벌": 2, "k": "ox", "q": "항등함수는 일대일대응이다.", "a": "O", "w": "항등함수는 서로 다른 원소를 서로 다른 원소(자기 자신)에 대응시키고 치역이 공역 전체이므로 일대일대응이다.", "key": "C08-02"}, "c08-02-2-04": {"id": "c08-02-2-04", "unit": "08", "concept": "02", "벌": 2, "k": "ox", "q": "정의역의 원소가 $2$개 이상인 상수함수는 일대일함수가 아니다.", "a": "O", "w": "상수함수는 서로 다른 원소들이 모두 같은 값에 대응하므로 일대일함수가 될 수 없다.", "key": "C08-02"}, "c08-02-2-05": {"id": "c08-02-2-05", "unit": "08", "concept": "02", "벌": 2, "k": "ox", "q": "$X=\\{1,\\,2,\\,3\\}$에서 $Y=\\{a,\\,b,\\,c,\\,d\\}$로의 일대일대응이 존재한다.", "a": "X", "w": "일대일대응이면 $n(X)=n(Y)$이어야 하는데 $3\\ne 4$이다. $Y$의 원소 하나는 반드시 남아 치역과 공역이 같을 수 없다.", "key": "C08-02"}, "c08-02-2-06": {"id": "c08-02-2-06", "unit": "08", "concept": "02", "벌": 2, "k": "c4", "q": "$X=\\{1,\\,2,\\,3\\}$에서 $X$로의 일대일대응의 개수는 ____이다.", "a": "$6$", "c": ["$6$", "$27$", "$3$", "$9$"], "w": "$f(1)$은 $3$가지, $f(2)$는 남은 $2$가지, $f(3)$은 $1$가지이므로 $3\\times 2\\times 1=6$이다. $27$은 모든 함수의 개수, $3$은 상수함수의 개수이다.", "key": "C08-02"}, "c08-02-2-07": {"id": "c08-02-2-07", "unit": "08", "concept": "02", "벌": 2, "k": "c4", "q": "실수 전체의 집합에서 정의된 함수 $f(x)=ax+b$가 상수함수가 될 조건은 ____이다.", "a": "$a=0$", "c": ["$a=0$", "$b=0$", "$a=1$, $b=0$", "$a\\ne 0$"], "w": "$a=0$이면 $f(x)=b$로 모든 $x$에 같은 값이 대응한다. $a=1$, $b=0$은 항등함수, $a\\ne 0$은 일대일대응이다.", "key": "C08-02"}, "c08-02-2-08": {"id": "c08-02-2-08", "unit": "08", "concept": "02", "벌": 2, "k": "c4", "q": "$X=\\{1,\\,2,\\,3\\}$에서 $Y=\\{4,\\,5,\\,6\\}$으로의 함수 $f$가 일대일대응이고 $f(1)=5$, $f(2)=6$이면 $f(3)=$ ____이다.", "a": "$4$", "c": ["$4$", "$5$", "$6$", "정할 수 없다"], "w": "일대일대응이면 $Y$의 원소가 하나씩 짝지어지므로 남은 $4$가 $f(3)$이다.", "key": "C08-02"}, "c08-03-2-01": {"id": "c08-03-2-01", "unit": "08", "concept": "03", "벌": 2, "k": "ox", "q": "$(g\\circ f)(x)$를 구할 때는 $x$에 $f$를 먼저 적용하고, 그 결과에 $g$를 적용한다.", "a": "O", "w": "$(g\\circ f)(x)=g(f(x))$이므로 안쪽의 $f$가 먼저이다. 기호에서는 오른쪽에 있는 함수가 먼저 적용된다.", "key": "C08-03"}, "c08-03-2-02": {"id": "c08-03-2-02", "unit": "08", "concept": "03", "벌": 2, "k": "ox", "q": "$f(x)=2x$, $g(x)=x+3$이면 $(f\\circ g)(x)=2x+3$이다.", "a": "X", "w": "$(f\\circ g)(x)=f(x+3)=2(x+3)=2x+6$이다. $2x+3$은 $(g\\circ f)(x)$이다.", "key": "C08-03"}, "c08-03-2-03": {"id": "c08-03-2-03", "unit": "08", "concept": "03", "벌": 2, "k": "ox", "q": "합성함수 $g\\circ f$가 정의되려면 $f$의 치역이 $g$의 정의역의 부분집합이어야 한다.", "a": "O", "w": "$f(x)$가 $g$의 정의역 안에 있어야 $g(f(x))$를 구할 수 있다.", "key": "C08-03"}, "c08-03-2-04": {"id": "c08-03-2-04", "unit": "08", "concept": "03", "벌": 2, "k": "ox", "q": "$f(x)=x+1$이면 $(f\\circ f)(x)=x+2$이다.", "a": "O", "w": "$(f\\circ f)(x)=f(x+1)=(x+1)+1=x+2$이다.", "key": "C08-03"}, "c08-03-2-05": {"id": "c08-03-2-05", "unit": "08", "concept": "03", "벌": 2, "k": "ox", "q": "$f\\circ g=g\\circ f$를 만족시키는 두 함수 $f$, $g$는 존재하지 않는다.", "a": "X", "w": "교환법칙이 ‘항상’ 성립하지 않을 뿐, 성립하는 경우는 있다. 예를 들어 $f(x)=x+1$, $g(x)=x+2$이면 둘 다 $x+3$이다.", "key": "C08-03"}, "c08-03-2-06": {"id": "c08-03-2-06", "unit": "08", "concept": "03", "벌": 2, "k": "c4", "q": "$X=\\{1,\\,2,\\,3\\}$에서 $X$로의 함수 $f$가 $f(1)=2$, $f(2)=3$, $f(3)=1$일 때 $(f\\circ f)(1)=$ ____이다.", "a": "$3$", "c": ["$3$", "$2$", "$1$", "정의되지 않는다"], "w": "$(f\\circ f)(1)=f(f(1))=f(2)=3$이다.", "key": "C08-03"}, "c08-03-2-07": {"id": "c08-03-2-07", "unit": "08", "concept": "03", "벌": 2, "k": "c4", "q": "$f(x)=3x-1$, $g(x)=x^{2}$일 때 $(g\\circ f)(2)=$ ____이다.", "a": "$25$", "c": ["$25$", "$11$", "$20$", "$5$"], "w": "$f(2)=5$이므로 $(g\\circ f)(2)=g(5)=25$이다. $11$은 $(f\\circ g)(2)=f(4)$이다.", "key": "C08-03"}, "c08-03-2-08": {"id": "c08-03-2-08", "unit": "08", "concept": "03", "벌": 2, "k": "c4", "q": "세 함수 $f$, $g$, $h$에 대하여 $(h\\circ g)\\circ f$와 항상 같은 것은 ____이다.", "a": "$h\\circ(g\\circ f)$", "c": ["$h\\circ(g\\circ f)$", "$f\\circ(g\\circ h)$", "$(g\\circ h)\\circ f$", "$h\\circ(f\\circ g)$"], "w": "결합법칙에 따라 괄호 위치만 바꿀 수 있고, 함수의 순서는 바꿀 수 없다.", "key": "C08-03"}, "c08-04-2-01": {"id": "c08-04-2-01", "unit": "08", "concept": "04", "벌": 2, "k": "ox", "q": "역함수 $f^{-1}(x)$는 $\\frac{1}{f(x)}$와 같다.", "a": "X", "w": "$f^{-1}$의 $-1$은 역수가 아니라 역함수 기호이다. $f(x)=x+1$이면 $f^{-1}(x)=x-1$이지만 $\\frac{1}{f(x)}=\\frac{1}{x+1}$이다.", "key": "C08-04"}, "c08-04-2-02": {"id": "c08-04-2-02", "unit": "08", "concept": "04", "벌": 2, "k": "ox", "q": "함수 $f\\colon X\\to Y$가 일대일대응이면 역함수 $f^{-1}\\colon Y\\to X$도 일대일대응이다.", "a": "O", "w": "$f$가 $X$와 $Y$의 원소를 하나씩 짝지으므로 그 짝을 거꾸로 읽은 $f^{-1}$도 일대일대응이다.", "key": "C08-04"}, "c08-04-2-03": {"id": "c08-04-2-03", "unit": "08", "concept": "04", "벌": 2, "k": "ox", "q": "정의역과 공역이 모두 실수 전체의 집합인 함수 $f(x)=x^{2}$은 역함수가 존재한다.", "a": "X", "w": "$f(-1)=f(1)$이므로 일대일대응이 아니어서 역함수가 존재하지 않는다.", "key": "C08-04"}, "c08-04-2-04": {"id": "c08-04-2-04", "unit": "08", "concept": "04", "벌": 2, "k": "ox", "q": "함수 $f$의 역함수가 존재할 때 $f$의 치역은 $f^{-1}$의 정의역과 같다.", "a": "O", "w": "역함수가 존재하면 $f$의 치역 $=$ 공역 $Y$이고, $Y$가 $f^{-1}$의 정의역이다.", "key": "C08-04"}, "c08-04-2-05": {"id": "c08-04-2-05", "unit": "08", "concept": "04", "벌": 2, "k": "ox", "q": "역함수가 존재하는 함수 $f$에 대하여 $f(2)=7$이면 $f^{-1}(7)=2$이다.", "a": "O", "w": "$f(a)=b\\iff f^{-1}(b)=a$이므로 $f^{-1}(7)=2$이다.", "key": "C08-04"}, "c08-04-2-06": {"id": "c08-04-2-06", "unit": "08", "concept": "04", "벌": 2, "k": "c4", "q": "$f(x)=3x-6$의 역함수는 $f^{-1}(x)=$ ____이다.", "a": "$\\frac{1}{3}x+2$", "c": ["$\\frac{1}{3}x+2$", "$\\frac{1}{3}x-2$", "$3x+6$", "$\\frac{1}{3x-6}$"], "w": "$y=3x-6$에서 $x=\\frac{1}{3}y+2$이고, $x$와 $y$를 바꾸면 $y=\\frac{1}{3}x+2$이다.", "key": "C08-04"}, "c08-04-2-07": {"id": "c08-04-2-07", "unit": "08", "concept": "04", "벌": 2, "k": "c4", "q": "$X=\\{1,\\,2,\\,3\\}$에서 $Y=\\{a,\\,b,\\,c\\}$로의 함수 $f$가 $f(1)=b$, $f(2)=c$, $f(3)=a$일 때 $f^{-1}(c)=$ ____이다.", "a": "$2$", "c": ["$2$", "$3$", "$1$", "$b$"], "w": "$f(2)=c$이므로 $f^{-1}(c)=2$이다. 역함수는 화살표를 거꾸로 읽는다.", "key": "C08-04"}, "c08-04-2-08": {"id": "c08-04-2-08", "unit": "08", "concept": "04", "벌": 2, "k": "c4", "q": "정의역이 $\\{x\\mid x\\ge 0\\}$, 공역이 ____인 함수 $f(x)=x^{2}+1$은 역함수가 존재한다.", "a": "$\\{y\\mid y\\ge 1\\}$", "c": ["$\\{y\\mid y\\ge 1\\}$", "$\\{y\\mid y\\ge 0\\}$", "실수 전체의 집합", "$\\{y\\mid y>1\\}$"], "w": "$x\\ge 0$에서 $f$는 일대일함수이고 치역이 $\\{y\\mid y\\ge 1\\}$이다. 공역이 치역과 같아야 일대일대응이 되어 역함수가 존재한다.", "key": "C08-04"}, "c08-05-2-01": {"id": "c08-05-2-01", "unit": "08", "concept": "05", "벌": 2, "k": "ox", "q": "함수 $f\\colon X\\to Y$가 일대일대응이면 $Y$의 모든 원소 $y$에서 $(f\\circ f^{-1})(y)=y$이다.", "a": "O", "w": "$f^{-1}$로 $Y$에서 $X$로 갔다가 $f$로 다시 $y$로 돌아온다. $f\\circ f^{-1}$는 $Y$에서의 항등함수이다.", "key": "C08-05"}, "c08-05-2-02": {"id": "c08-05-2-02", "unit": "08", "concept": "05", "벌": 2, "k": "ox", "q": "함수 $f\\colon X\\to Y$의 역함수가 존재할 때, $f^{-1}\\circ f$와 $f\\circ f^{-1}$는 정의역이 다를 수 있다.", "a": "O", "w": "$f^{-1}\\circ f$는 $X$에서의 항등함수, $f\\circ f^{-1}$는 $Y$에서의 항등함수이다. $X\\ne Y$이면 정의역이 다르다.", "key": "C08-05"}, "c08-05-2-03": {"id": "c08-05-2-03", "unit": "08", "concept": "05", "벌": 2, "k": "ox", "q": "역함수가 존재하는 두 함수 $f$, $g$에 대하여 $(f^{-1}\\circ g^{-1})^{-1}=g\\circ f$이다.", "a": "O", "w": "$(f^{-1}\\circ g^{-1})^{-1}=(g^{-1})^{-1}\\circ(f^{-1})^{-1}=g\\circ f$이다.", "key": "C08-05"}, "c08-05-2-04": {"id": "c08-05-2-04", "unit": "08", "concept": "05", "벌": 2, "k": "ox", "q": "$f(3)=1$이고 $f$의 역함수가 존재하면 $y=f^{-1}(x)$의 그래프는 점 $(3,\\,1)$을 지난다.", "a": "X", "w": "$f(3)=1$이면 $f^{-1}(1)=3$이므로 $y=f^{-1}(x)$의 그래프는 점 $(1,\\,3)$을 지난다. 좌표가 서로 바뀐다.", "key": "C08-05"}, "c08-05-2-05": {"id": "c08-05-2-05", "unit": "08", "concept": "05", "벌": 2, "k": "ox", "q": "$f=f^{-1}$를 만족시키는 일대일대응 $f$는 존재하지 않는다.", "a": "X", "w": "$f(x)=-x+4$나 항등함수처럼 $f^{-1}=f$인 함수가 있다. 이런 함수는 $f\\circ f$가 항등함수이다.", "key": "C08-05"}, "c08-05-2-06": {"id": "c08-05-2-06", "unit": "08", "concept": "05", "벌": 2, "k": "c4", "q": "$f(x)=x-1$, $g(x)=3x$일 때 $(g\\circ f)^{-1}(6)=$ ____이다.", "a": "$3$", "c": ["$3$", "$\\frac{7}{3}$", "$15$", "$2$"], "w": "$(g\\circ f)(x)=3(x-1)$이 $6$이 되는 $x$를 찾으면 $x=3$이다. $\\frac{7}{3}$은 순서를 거꾸로 한 $(g^{-1}\\circ f^{-1})(6)$이다.", "key": "C08-05"}, "c08-05-2-07": {"id": "c08-05-2-07", "unit": "08", "concept": "05", "벌": 2, "k": "c4", "q": "역함수가 존재하는 함수 $f$와 항등함수 $I$에 대하여 $f^{-1}\\circ f=$ ____이다.", "a": "$I$", "c": ["$I$", "$f$", "$f^{-1}$", "$f\\circ f$"], "w": "$f$로 갔다가 $f^{-1}$로 돌아오면 제자리이므로 $f^{-1}\\circ f=I$이다.", "key": "C08-05"}, "c08-05-2-08": {"id": "c08-05-2-08", "unit": "08", "concept": "05", "벌": 2, "k": "c4", "q": "함수 $y=f(|x|)$의 그래프는 $y=f(x)$의 그래프에서 $x\\ge 0$인 부분을 남기고, 그 부분을 ____에 대하여 대칭이동한 것을 함께 그린다.", "a": "$y$축", "c": ["$y$축", "$x$축", "원점", "직선 $y=x$"], "w": "$f(|-x|)=f(|x|)$이므로 그래프는 $y$축에 대하여 대칭이다. $x\\ge 0$에서는 $f(|x|)=f(x)$이다.", "key": "C08-05"}, "c08-01-3-01": {"id": "c08-01-3-01", "unit": "08", "concept": "01", "벌": 3, "k": "ox", "q": "$X=\\{1,\\,2,\\,3\\}$의 원소 $1$, $2$에만 $Y=\\{4,\\,5\\}$의 원소를 하나씩 대응시키고 $3$에는 아무것도 대응시키지 않은 대응은 $X$에서 $Y$로의 함수가 아니다.", "a": "O", "w": "$X$의 원소 $3$에 대응하는 $Y$의 원소가 없으므로 함수가 아니다. $X$의 모든 원소가 대응해야 한다.", "key": "C08-01"}, "c08-01-3-02": {"id": "c08-01-3-02", "unit": "08", "concept": "01", "벌": 3, "k": "ox", "q": "$X$에서 $Y$로의 대응에서 $X$의 서로 다른 두 원소가 $Y$의 같은 원소에 대응하면 이 대응은 함수가 아니다.", "a": "X", "w": "서로 다른 원소가 같은 값에 대응해도 함수이다(예 $f(x)=x^{2}$에서 $f(-1)=f(1)$). 함수가 아닌 것은 한 원소가 두 값에 대응할 때이다.", "key": "C08-01"}, "c08-01-3-03": {"id": "c08-01-3-03", "unit": "08", "concept": "01", "벌": 3, "k": "ox", "q": "함수 $f\\colon X\\to Y$의 치역과 공역은 항상 같다.", "a": "X", "w": "치역은 공역의 부분집합일 뿐 같을 필요는 없다. 예를 들어 실수 전체에서 정의된 $f(x)=x^{2}$의 치역은 $\\{y\\mid y\\ge 0\\}$이다.", "key": "C08-01"}, "c08-01-3-04": {"id": "c08-01-3-04", "unit": "08", "concept": "01", "벌": 3, "k": "ox", "q": "정의역이 $\\{x\\mid x\\ge 0\\}$인 함수 $f(x)=x^{2}$과 정의역이 실수 전체의 집합인 함수 $g(x)=x^{2}$은 식이 같지만 서로 같은 함수가 아니다.", "a": "O", "w": "서로 같은 함수가 되려면 먼저 정의역과 공역이 각각 같아야 한다. 두 함수는 정의역이 다르므로 식이 같아도 서로 같은 함수가 아니다.", "key": "C08-01"}, "c08-01-3-05": {"id": "c08-01-3-05", "unit": "08", "concept": "01", "벌": 3, "k": "ox", "q": "정의역이 실수 전체의 집합인 두 함수 $f(x)=\\sqrt{x^{2}}$, $g(x)=x$는 서로 같은 함수이다.", "a": "X", "w": "$\\sqrt{x^{2}}=|x|$이므로 $f(-1)=1$, $g(-1)=-1$로 다르다. 서로 같은 함수가 아니다.", "key": "C08-01"}, "c08-01-3-06": {"id": "c08-01-3-06", "unit": "08", "concept": "01", "벌": 3, "k": "ox", "q": "실수 전체의 집합에서 정의된 함수 $f(x)=2x+1$의 치역은 실수 전체의 집합이다.", "a": "O", "w": "어떤 실수 $k$에 대해서도 $2x+1=k$인 $x=\\frac{k-1}{2}$가 있으므로 치역은 실수 전체의 집합이다.", "key": "C08-01"}, "c08-01-3-07": {"id": "c08-01-3-07", "unit": "08", "concept": "01", "벌": 3, "k": "c4", "q": "함수 $f\\colon X\\to Y$에서 함숫값 전체의 집합 $\\{f(x)\\mid x\\in X\\}$를 함수 $f$의 ____(이)라 한다.", "a": "치역", "c": ["치역", "공역", "정의역", "그래프"], "w": "함숫값 전체의 집합이 치역이다. 공역 $Y$는 함숫값이 들어갈 수 있는 집합 전체이다.", "key": "C08-01"}, "c08-01-3-08": {"id": "c08-01-3-08", "unit": "08", "concept": "01", "벌": 3, "k": "c4", "q": "$X=\\{1,\\,2,\\,3\\}$, $Y=\\{1,\\,2,\\,3,\\,4\\}$일 때, $X$에서 $Y$로의 함수가 되는 것은 ____이다.", "a": "$f(x)=x+1$", "c": ["$f(x)=x+1$", "$f(x)=2x$", "$f(x)=x^{2}$", "$f(x)=x-1$"], "w": "$x+1$의 값은 $2$, $3$, $4$로 모두 $Y$에 있다. $2x$는 $6$, $x^{2}$은 $9$, $x-1$은 $0$이 $Y$에 없어 함수가 되지 않는다.", "key": "C08-01"}, "c08-02-3-01": {"id": "c08-02-3-01", "unit": "08", "concept": "02", "벌": 3, "k": "ox", "q": "일대일함수 $f$에서 $f(a)=f(b)$이면 $a=b$이다.", "a": "O", "w": "‘$a\\ne b$이면 $f(a)\\ne f(b)$’의 대우가 ‘$f(a)=f(b)$이면 $a=b$’이므로 같은 뜻이다.", "key": "C08-02"}, "c08-02-3-02": {"id": "c08-02-3-02", "unit": "08", "concept": "02", "벌": 3, "k": "ox", "q": "치역과 공역이 같은 함수는 모두 일대일대응이다.", "a": "X", "w": "일대일함수라는 조건도 필요하다. 정의역 $\\{-1,\\,0,\\,1\\}$, 공역 $\\{0,\\,1\\}$인 $f(x)=x^{2}$은 치역과 공역이 같지만 $f(-1)=f(1)$이다.", "key": "C08-02"}, "c08-02-3-03": {"id": "c08-02-3-03", "unit": "08", "concept": "02", "벌": 3, "k": "ox", "q": "항등함수의 정의역과 공역은 같은 집합이다.", "a": "O", "w": "항등함수는 $X$에서 $X$로의 함수이므로 정의역과 공역이 모두 $X$이다.", "key": "C08-02"}, "c08-02-3-04": {"id": "c08-02-3-04", "unit": "08", "concept": "02", "벌": 3, "k": "ox", "q": "실수 전체의 집합에서 정의된 일차함수 $f(x)=ax+b$ $(a\\ne 0)$는 일대일대응이다.", "a": "O", "w": "$a\\ne 0$이면 서로 다른 $x$에 서로 다른 값이 대응하고 치역이 실수 전체이므로 일대일대응이다.", "key": "C08-02"}, "c08-02-3-05": {"id": "c08-02-3-05", "unit": "08", "concept": "02", "벌": 3, "k": "ox", "q": "정의역이 $\\{-1,\\,0,\\,1\\}$인 함수 $f(x)=|x|$는 일대일함수이다.", "a": "X", "w": "$f(-1)=f(1)=1$이므로 일대일함수가 아니다.", "key": "C08-02"}, "c08-02-3-06": {"id": "c08-02-3-06", "unit": "08", "concept": "02", "벌": 3, "k": "ox", "q": "$X$에서 $X$로의 함수 $f$가 일대일대응이면 $f$는 항등함수이다.", "a": "X", "w": "$X=\\{1,\\,2\\}$에서 $f(1)=2$, $f(2)=1$은 일대일대응이지만 $f(1)\\ne 1$이므로 항등함수가 아니다.", "key": "C08-02"}, "c08-02-3-07": {"id": "c08-02-3-07", "unit": "08", "concept": "02", "벌": 3, "k": "c4", "q": "$X=\\{-1,\\,0,\\,1\\}$일 때, 함수 $f\\colon X\\to X$, $f(x)=x^{3}$은 ____이다.", "a": "항등함수", "c": ["항등함수", "상수함수", "일대일함수가 아닌 함수", "치역이 $\\{0,\\,1\\}$인 함수"], "w": "$f(-1)=-1$, $f(0)=0$, $f(1)=1$로 모든 원소가 자기 자신에 대응하므로 $X$에서의 항등함수이다.", "key": "C08-02"}, "c08-02-3-08": {"id": "c08-02-3-08", "unit": "08", "concept": "02", "벌": 3, "k": "c4", "q": "$X=\\{1,\\,2\\}$에서 $Y=\\{1,\\,2,\\,3,\\,4\\}$로의 일대일함수의 개수는 ____이다.", "a": "$12$", "c": ["$12$", "$16$", "$8$", "$6$"], "w": "$f(1)$은 $4$가지, $f(2)$는 $f(1)$이 아닌 $3$가지이므로 $4\\times 3=12$이다. $16$은 모든 함수의 개수이다.", "key": "C08-02"}, "c08-03-3-01": {"id": "c08-03-3-01", "unit": "08", "concept": "03", "벌": 3, "k": "ox", "q": "두 함수 $f$, $g$에 대하여 $(g\\circ f)(x)$와 $(f\\circ g)(x)$는 같을 수도 있고 다를 수도 있다.", "a": "O", "w": "교환법칙은 일반적으로 성립하지 않지만, $f=g$인 경우처럼 같아지는 경우도 있다.", "key": "C08-03"}, "c08-03-3-02": {"id": "c08-03-3-02", "unit": "08", "concept": "03", "벌": 3, "k": "ox", "q": "두 함수 $f\\colon X\\to Y$, $g\\colon Y\\to Z$의 합성함수 $g\\circ f$는 $X$에서 $Z$로의 함수이다.", "a": "O", "w": "$X$의 원소 $x$에 $Z$의 원소 $g(f(x))$가 하나씩 대응하므로 $X$에서 $Z$로의 함수이다.", "key": "C08-03"}, "c08-03-3-03": {"id": "c08-03-3-03", "unit": "08", "concept": "03", "벌": 3, "k": "ox", "q": "$f(x)=x-2$, $g(x)=x^{2}$이면 $(g\\circ f)(x)=x^{2}-2$이다.", "a": "X", "w": "$(g\\circ f)(x)=g(x-2)=(x-2)^{2}$이다. $x^{2}-2$는 $(f\\circ g)(x)$이다.", "key": "C08-03"}, "c08-03-3-04": {"id": "c08-03-3-04", "unit": "08", "concept": "03", "벌": 3, "k": "ox", "q": "함수 $f$에 대하여 $(f\\circ f)\\circ f=f\\circ(f\\circ f)$이다.", "a": "O", "w": "결합법칙에 의해 성립한다. 어느 쪽이든 $f(f(f(x)))$이다.", "key": "C08-03"}, "c08-03-3-05": {"id": "c08-03-3-05", "unit": "08", "concept": "03", "벌": 3, "k": "ox", "q": "세 함수 $f$, $g$, $h$에 대하여 $f\\circ g=f\\circ h$이면 항상 $g=h$이다.", "a": "X", "w": "$f(x)=1$(상수함수)이면 어떤 $g$, $h$든 $f\\circ g=f\\circ h$이다. 합성함수에서 $f$를 지우듯 약분할 수 없다.", "key": "C08-03"}, "c08-03-3-06": {"id": "c08-03-3-06", "unit": "08", "concept": "03", "벌": 3, "k": "ox", "q": "$I$가 항등함수일 때 $(I\\circ f)(x)=x$이다.", "a": "X", "w": "$(I\\circ f)(x)=I(f(x))=f(x)$이다. 항등함수를 합성해도 $f$ 그대로이다.", "key": "C08-03"}, "c08-03-3-07": {"id": "c08-03-3-07", "unit": "08", "concept": "03", "벌": 3, "k": "c4", "q": "$f(x)=2x$, $g(x)=x+1$일 때 $(f\\circ g)(x)-(g\\circ f)(x)=$ ____이다.", "a": "$1$", "c": ["$1$", "$0$", "$-1$", "$x$"], "w": "$(f\\circ g)(x)=2(x+1)=2x+2$, $(g\\circ f)(x)=2x+1$이므로 차는 $1$이다. 순서를 바꾸면 결과가 달라진다.", "key": "C08-03"}, "c08-03-3-08": {"id": "c08-03-3-08", "unit": "08", "concept": "03", "벌": 3, "k": "c4", "q": "$X=\\{1,\\,2,\\,3\\}$에서 $X$로의 두 함수 $f$, $g$가 $f(1)=3$, $f(2)=1$, $f(3)=2$, $g(1)=1$, $g(2)=3$, $g(3)=2$일 때 $(g\\circ f)(1)=$ ____이다.", "a": "$2$", "c": ["$2$", "$3$", "$1$", "정할 수 없다"], "w": "$f(1)=3$이므로 $(g\\circ f)(1)=g(3)=2$이다. $3$은 $(f\\circ g)(1)=f(1)$이다.", "key": "C08-03"}, "c08-04-3-01": {"id": "c08-04-3-01", "unit": "08", "concept": "04", "벌": 3, "k": "ox", "q": "역함수가 존재하는 함수 $f$에 대하여 $f^{-1}$의 치역은 $f$의 정의역과 같다.", "a": "O", "w": "$f$가 $X$에서 $Y$로의 일대일대응이면 $f^{-1}$는 $Y$에서 $X$로의 일대일대응이므로 치역은 $X$이다.", "key": "C08-04"}, "c08-04-3-02": {"id": "c08-04-3-02", "unit": "08", "concept": "04", "벌": 3, "k": "ox", "q": "$f(x)=-x+4$의 역함수는 $f$ 자신과 같다.", "a": "O", "w": "$y=-x+4$를 $x$에 대하여 풀면 $x=-y+4$이고, $x$와 $y$를 바꾸면 $y=-x+4$로 처음 함수와 같다.", "key": "C08-04"}, "c08-04-3-03": {"id": "c08-04-3-03", "unit": "08", "concept": "04", "벌": 3, "k": "ox", "q": "일차함수 $f(x)=ax+b$ $(a\\ne 0)$의 역함수의 기울기는 $a$이다.", "a": "X", "w": "$y=ax+b$에서 $x=\\frac{1}{a}y-\\frac{b}{a}$이므로 역함수의 기울기는 $\\frac{1}{a}$이다.", "key": "C08-04"}, "c08-04-3-04": {"id": "c08-04-3-04", "unit": "08", "concept": "04", "벌": 3, "k": "ox", "q": "정의역의 원소가 $2$개 이상인 상수함수는 역함수가 존재하지 않는다.", "a": "O", "w": "상수함수는 일대일함수가 아니므로 일대일대응이 아니고, 역함수가 존재하지 않는다.", "key": "C08-04"}, "c08-04-3-05": {"id": "c08-04-3-05", "unit": "08", "concept": "04", "벌": 3, "k": "ox", "q": "$f(1)=3$, $f(2)=3$인 함수 $f$는 역함수가 존재한다.", "a": "X", "w": "서로 다른 $1$, $2$가 같은 값 $3$에 대응하므로 일대일대응이 아니다. $f^{-1}(3)$을 하나로 정할 수 없다.", "key": "C08-04"}, "c08-04-3-06": {"id": "c08-04-3-06", "unit": "08", "concept": "04", "벌": 3, "k": "c4", "q": "$f(x)=ax+3$에 대하여 $f^{-1}(5)=1$이면 $a=$ ____이다.", "a": "$2$", "c": ["$2$", "$-\\frac{2}{5}$", "$8$", "$-2$"], "w": "$f^{-1}(5)=1$이면 $f(1)=5$이므로 $a+3=5$, $a=2$이다. $f(5)=1$로 거꾸로 쓰면 $-\\frac{2}{5}$가 나온다.", "key": "C08-04"}, "c08-04-3-07": {"id": "c08-04-3-07", "unit": "08", "concept": "04", "벌": 3, "k": "c4", "q": "$f^{-1}(x)=2x-4$일 때 $f(x)=$ ____이다.", "a": "$\\frac{1}{2}x+2$", "c": ["$\\frac{1}{2}x+2$", "$\\frac{1}{2}x-4$", "$-2x+4$", "$\\frac{1}{2x-4}$"], "w": "$f$는 $f^{-1}$의 역함수이다. $y=2x-4$에서 $x=\\frac{1}{2}y+2$이고, $x$와 $y$를 바꾸면 $f(x)=\\frac{1}{2}x+2$이다.", "key": "C08-04"}, "c08-04-3-08": {"id": "c08-04-3-08", "unit": "08", "concept": "04", "벌": 3, "k": "c4", "q": "유한집합 $X$, $Y$에 대하여 함수 $f\\colon X\\to Y$의 역함수가 존재하고 $n(X)=4$이면 $n(Y)=$ ____이다.", "a": "$4$", "c": ["$4$", "$4$ 이상의 어떤 수", "$4$ 이하의 어떤 수", "$8$"], "w": "역함수가 존재하면 $f$는 일대일대응이므로 $n(X)=n(Y)=4$이다.", "key": "C08-04"}, "c08-05-3-01": {"id": "c08-05-3-01", "unit": "08", "concept": "05", "벌": 3, "k": "ox", "q": "역함수가 존재하는 함수 $f$에 대하여 점 $(a,\\,b)$가 $y=f(x)$의 그래프 위에 있으면 점 $(b,\\,a)$는 $y=f^{-1}(x)$의 그래프 위에 있다.", "a": "O", "w": "$f(a)=b\\iff f^{-1}(b)=a$이므로 성립한다. 이 때문에 두 그래프가 직선 $y=x$에 대하여 대칭이다.", "key": "C08-05"}, "c08-05-3-02": {"id": "c08-05-3-02", "unit": "08", "concept": "05", "벌": 3, "k": "ox", "q": "$f(x)=2x$의 역함수의 그래프는 $y=2x$의 그래프를 $y$축에 대하여 대칭이동한 것이다.", "a": "X", "w": "역함수의 그래프는 직선 $y=x$에 대하여 대칭이동한 것으로 $y=\\frac{1}{2}x$이다. $y$축 대칭이면 $y=-2x$가 된다.", "key": "C08-05"}, "c08-05-3-03": {"id": "c08-05-3-03", "unit": "08", "concept": "05", "벌": 3, "k": "ox", "q": "역함수가 존재하는 함수 $f$에 대하여 $(f^{-1}\\circ f^{-1})^{-1}=f\\circ f$이다.", "a": "O", "w": "$(f^{-1}\\circ f^{-1})^{-1}=(f^{-1})^{-1}\\circ(f^{-1})^{-1}=f\\circ f$이다.", "key": "C08-05"}, "c08-05-3-04": {"id": "c08-05-3-04", "unit": "08", "concept": "05", "벌": 3, "k": "ox", "q": "역함수가 존재하는 함수 $f$에 대하여 $y=f(x)$의 그래프와 $y=f^{-1}(x)$의 그래프의 교점은 모두 직선 $y=x$ 위에 있다.", "a": "X", "w": "항상 그렇지는 않다. $f(x)=-x+2$이면 $f^{-1}(x)=-x+2$로 두 그래프가 겹치므로 점 $(0,\\,2)$처럼 직선 $y=x$ 밖의 교점도 있다.", "key": "C08-05"}, "c08-05-3-05": {"id": "c08-05-3-05", "unit": "08", "concept": "05", "벌": 3, "k": "ox", "q": "함수 $y=|x-2|$의 그래프는 직선 $x=2$에 대하여 대칭이다.", "a": "O", "w": "$y=|x-2|$는 $y=|x|$의 그래프를 $x$축의 방향으로 $2$만큼 평행이동한 것이므로 직선 $x=2$에 대하여 대칭이다.", "key": "C08-05"}, "c08-05-3-06": {"id": "c08-05-3-06", "unit": "08", "concept": "05", "벌": 3, "k": "c4", "q": "$f(x)=x+2$, $g(x)=2x$일 때 $(f^{-1}\\circ g)(3)=$ ____이다.", "a": "$4$", "c": ["$4$", "$8$", "$10$", "$\\frac{5}{2}$"], "w": "$g(3)=6$이고 $f^{-1}(6)$은 $f(a)=6$인 $a=4$이다. $8$은 $(f\\circ g)(3)$, $10$은 $(g\\circ f)(3)$이다.", "key": "C08-05"}, "c08-05-3-07": {"id": "c08-05-3-07", "unit": "08", "concept": "05", "벌": 3, "k": "c4", "q": "역함수가 존재하는 두 함수 $f$, $g$에 대하여 $(f^{-1}\\circ g)^{-1}=$ ____이다.", "a": "$g^{-1}\\circ f$", "c": ["$g^{-1}\\circ f$", "$f\\circ g^{-1}$", "$f^{-1}\\circ g$", "$g\\circ f^{-1}$"], "w": "$(f^{-1}\\circ g)^{-1}=g^{-1}\\circ(f^{-1})^{-1}=g^{-1}\\circ f$이다.", "key": "C08-05"}, "c08-05-3-08": {"id": "c08-05-3-08", "unit": "08", "concept": "05", "벌": 3, "k": "c4", "q": "역함수가 존재하는 함수 $f$에 대하여 $f(2)=5$, $f(5)=7$일 때 $f^{-1}(f^{-1}(7))=$ ____이다.", "a": "$2$", "c": ["$2$", "$5$", "$7$", "$1$"], "w": "$f(5)=7$이므로 $f^{-1}(7)=5$, $f(2)=5$이므로 $f^{-1}(5)=2$이다.", "key": "C08-05"}, "cm05-01-1-01": {"id": "cm05-01-1-01", "unit": "m05", "concept": "01", "벌": 1, "k": "ox", "q": "함수 $f(x)$가 어떤 구간에 속하는 임의의 두 실수 $x_{1}$, $x_{2}$에 대하여 $x_{1}<x_{2}$일 때 $f(x_{1})<f(x_{2})$이면 $f(x)$는 그 구간에서 증가한다.", "a": "O", "w": "증가의 정의 그대로이다. 구간 안의 '임의의' 두 수에 대해 성립해야 한다.", "key": "Cm05-01"}, "cm05-01-1-02": {"id": "cm05-01-1-02", "unit": "m05", "concept": "01", "벌": 1, "k": "ox", "q": "함수 $f(x)$가 어떤 열린구간에서 미분가능하고 그 구간의 모든 $x$에 대하여 $f'(x)>0$이면 $f(x)$는 그 구간에서 증가한다.", "a": "O", "w": "평균값 정리로 $f(x_{2})-f(x_{1})=f'(c)(x_{2}-x_{1})>0$이 되므로 증가한다.", "key": "Cm05-01"}, "cm05-01-1-03": {"id": "cm05-01-1-03", "unit": "m05", "concept": "01", "벌": 1, "k": "ox", "q": "미분가능한 함수 $f(x)$가 어떤 열린구간에서 증가하면 그 구간의 모든 $x$에 대하여 $f'(x)>0$이다.", "a": "X", "w": "역은 성립하지 않는다. $f(x)=x^{3}$은 실수 전체에서 증가하지만 $f'(0)=0$이다.", "key": "Cm05-01"}, "cm05-01-1-04": {"id": "cm05-01-1-04", "unit": "m05", "concept": "01", "벌": 1, "k": "ox", "q": "함수 $f(x)=x^{3}-3x$는 구간 $[1,\\,\\infty)$에서 증가한다.", "a": "O", "w": "$f'(x)=3(x+1)(x-1)$이고 $x>1$에서 $f'(x)>0$이므로 $[1,\\,\\infty)$에서 증가한다.", "key": "Cm05-01"}, "cm05-01-1-05": {"id": "cm05-01-1-05", "unit": "m05", "concept": "01", "벌": 1, "k": "ox", "q": "최고차항의 계수가 양수인 삼차함수 $f(x)$가 실수 전체의 집합에서 증가하기 위한 조건은 $f'(x)=0$의 판별식 $D$가 $D<0$인 것이다.", "a": "X", "w": "$D=0$이어도 $f'(x)\\ge 0$이라 증가한다. 조건은 $D\\le 0$이다.", "key": "Cm05-01"}, "cm05-01-1-06": {"id": "cm05-01-1-06", "unit": "m05", "concept": "01", "벌": 1, "k": "ox", "q": "함수 $f(x)=x^{3}-3x$는 구간 $[-2,\\,0]$에서 감소한다.", "a": "X", "w": "$f'(x)=3(x+1)(x-1)$이므로 $[-2,\\,-1]$에서는 증가한다. 감소하는 구간은 $[-1,\\,1]$이다.", "key": "Cm05-01"}, "cm05-01-1-07": {"id": "cm05-01-1-07", "unit": "m05", "concept": "01", "벌": 1, "k": "c4", "q": "상수함수가 아닌 다항함수 $f(x)$가 어떤 구간에서 증가하기 위한 필요충분조건은 그 구간에서 ____ 인 것이다.", "a": "$f'(x)\\ge 0$", "c": ["$f'(x)\\ge 0$", "$f'(x)>0$", "$f(x)\\ge 0$", "$f'(x)\\ne 0$"], "w": "$f'(x)=0$인 점이 유한 개뿐이라 증가가 끊기지 않으므로 $f'(x)\\ge 0$이다. $f'(x)>0$은 충분조건일 뿐이다($x^{3}$).", "key": "Cm05-01"}, "cm05-01-1-08": {"id": "cm05-01-1-08", "unit": "m05", "concept": "01", "벌": 1, "k": "c4", "q": "함수 $f(x)=x^{3}+3x^{2}-9x$가 감소하는 구간은 ____ 이다.", "a": "$[-3,\\,1]$", "c": ["$[-3,\\,1]$", "$[-1,\\,3]$", "$(-\\infty,\\,-3]$", "$[1,\\,\\infty)$"], "w": "$f'(x)=3(x+3)(x-1)\\le 0$인 구간이 $[-3,\\,1]$이다.", "key": "Cm05-01"}, "cm05-01-2-01": {"id": "cm05-01-2-01", "unit": "m05", "concept": "01", "벌": 2, "k": "ox", "q": "함수 $f(x)=x^{2}$은 구간 $(-\\infty,\\,0]$에서 감소하고 구간 $[0,\\,\\infty)$에서 증가한다.", "a": "O", "w": "$f'(x)=2x$가 $x<0$에서 음, $x>0$에서 양이다. 증가·감소는 구간을 정해 놓고 말한다.", "key": "Cm05-01"}, "cm05-01-2-02": {"id": "cm05-01-2-02", "unit": "m05", "concept": "01", "벌": 2, "k": "ox", "q": "상수함수가 아닌 다항함수 $f(x)$가 어떤 구간에서 $f'(x)\\ge 0$이면 $f(x)$는 그 구간에서 증가한다.", "a": "O", "w": "다항함수는 $f'(x)=0$인 점이 유한 개뿐이므로 $f'(x)\\ge 0$이면 증가한다.", "key": "Cm05-01"}, "cm05-01-2-03": {"id": "cm05-01-2-03", "unit": "m05", "concept": "01", "벌": 2, "k": "ox", "q": "다항함수 $f(x)$가 실수 전체의 집합에서 감소하면 모든 실수 $x$에 대하여 $f'(x)<0$이다.", "a": "X", "w": "$f(x)=-x^{3}$은 실수 전체에서 감소하지만 $f'(0)=0$이다. 맞는 문장은 $f'(x)\\le 0$이다.", "key": "Cm05-01"}, "cm05-01-2-04": {"id": "cm05-01-2-04", "unit": "m05", "concept": "01", "벌": 2, "k": "ox", "q": "최고차항의 계수가 음수인 삼차함수 $f(x)$에서 이차방정식 $f'(x)=0$의 판별식이 $D\\le 0$이면 $f(x)$는 실수 전체의 집합에서 감소한다.", "a": "O", "w": "이차함수 $f'(x)$의 이차항 계수가 음수이고 $D\\le 0$이면 $f'(x)\\le 0$이므로 감소한다.", "key": "Cm05-01"}, "cm05-01-2-05": {"id": "cm05-01-2-05", "unit": "m05", "concept": "01", "벌": 2, "k": "ox", "q": "함수 $f(x)=x^{3}-3x^{2}+3x$는 $f'(1)=0$이므로 실수 전체의 집합에서 증가하지 않는다.", "a": "X", "w": "$f'(x)=3(x-1)^{2}\\ge 0$이므로 실수 전체에서 증가한다. $f'(x)=0$인 점이 있어도 증가할 수 있다.", "key": "Cm05-01"}, "cm05-01-2-06": {"id": "cm05-01-2-06", "unit": "m05", "concept": "01", "벌": 2, "k": "ox", "q": "함수 $f(x)$에 대하여 $f(0)<f(1)<f(2)$이면 $f(x)$는 구간 $[0,\\,2]$에서 증가한다.", "a": "X", "w": "증가는 구간 안의 임의의 두 수에 대해 성립해야 한다. 세 점의 값만으로는 그 사이에서 감소하는 부분이 있을 수 있다.", "key": "Cm05-01"}, "cm05-01-2-07": {"id": "cm05-01-2-07", "unit": "m05", "concept": "01", "벌": 2, "k": "c4", "q": "함수 $f(x)=x^{3}+ax^{2}+3x$가 실수 전체의 집합에서 증가하도록 하는 실수 $a$의 값의 범위는 ____ 이다.", "a": "$-3\\le a\\le 3$", "c": ["$-3\\le a\\le 3$", "$-3<a<3$", "$a\\le -3$ 또는 $a\\ge 3$", "$0\\le a\\le 3$"], "w": "$f'(x)=3x^{2}+2ax+3\\ge 0$이어야 하므로 $\\frac{D}{4}=a^{2}-9\\le 0$, 등호를 포함한다.", "key": "Cm05-01"}, "cm05-01-2-08": {"id": "cm05-01-2-08", "unit": "m05", "concept": "01", "벌": 2, "k": "c4", "q": "함수 $f(x)=-x^{3}+3x$가 증가하는 구간은 ____ 이다.", "a": "$[-1,\\,1]$", "c": ["$[-1,\\,1]$", "$(-\\infty,\\,-1]$", "$[1,\\,\\infty)$", "$[0,\\,\\infty)$"], "w": "$f'(x)=-3(x+1)(x-1)\\ge 0$인 구간은 $[-1,\\,1]$이다.", "key": "Cm05-01"}, "cm05-02-1-01": {"id": "cm05-02-1-01", "unit": "m05", "concept": "02", "벌": 1, "k": "ox", "q": "함수 $f(x)$가 $x=a$를 포함하는 어떤 열린구간에 속하는 모든 $x$에 대하여 $f(x)\\le f(a)$이면 $f(x)$는 $x=a$에서 극대이다.", "a": "O", "w": "극대의 정의 그대로이다. 극대는 $a$ 근처에서만 비교한다.", "key": "Cm05-02"}, "cm05-02-1-02": {"id": "cm05-02-1-02", "unit": "m05", "concept": "02", "벌": 1, "k": "ox", "q": "미분가능한 함수 $f(x)$가 $x=a$에서 극값을 가지면 $f'(a)=0$이다.", "a": "O", "w": "극대이면 $h>0$일 때 평균변화율 $\\le 0$, $h<0$일 때 $\\ge 0$이고 둘 다 $f'(a)$로 수렴하므로 $f'(a)=0$이다.", "key": "Cm05-02"}, "cm05-02-1-03": {"id": "cm05-02-1-03", "unit": "m05", "concept": "02", "벌": 1, "k": "ox", "q": "미분가능한 함수 $f(x)$에서 $f'(a)=0$이면 $f(x)$는 $x=a$에서 극값을 갖는다.", "a": "X", "w": "역은 성립하지 않는다. $f(x)=x^{3}$은 $f'(0)=0$이지만 좌우에서 $f'(x)>0$이라 극값이 없다.", "key": "Cm05-02"}, "cm05-02-1-04": {"id": "cm05-02-1-04", "unit": "m05", "concept": "02", "벌": 1, "k": "ox", "q": "미분가능한 함수 $f(x)$에서 $f'(a)=0$이고 $x=a$의 좌우에서 $f'(x)$의 부호가 음에서 양으로 바뀌면 $x=a$에서 극대이다.", "a": "X", "w": "왼쪽에서 감소, 오른쪽에서 증가하므로 극소이다. 양에서 음으로 바뀌어야 극대이다.", "key": "Cm05-02"}, "cm05-02-1-05": {"id": "cm05-02-1-05", "unit": "m05", "concept": "02", "벌": 1, "k": "ox", "q": "함수의 극댓값은 항상 극솟값보다 크다.", "a": "X", "w": "극값은 그 점 근처에서만 비교한 값이므로, 멀리 떨어진 극댓값이 극솟값보다 작을 수도 있다.", "key": "Cm05-02"}, "cm05-02-1-06": {"id": "cm05-02-1-06", "unit": "m05", "concept": "02", "벌": 1, "k": "ox", "q": "최고차항의 계수가 양수인 삼차함수가 극값을 가지면, $x$가 작은 쪽에서 극대, 큰 쪽에서 극소이다.", "a": "O", "w": "$f'(x)$의 부호가 $+,\\,-,\\,+$로 바뀌므로 작은 근에서 극대, 큰 근에서 극소이다.", "key": "Cm05-02"}, "cm05-02-1-07": {"id": "cm05-02-1-07", "unit": "m05", "concept": "02", "벌": 1, "k": "c4", "q": "함수 $f(x)=x^{3}-3x^{2}$의 극솟값은 ____ 이다.", "a": "$-4$", "c": ["$-4$", "$0$", "$2$", "$-2$"], "w": "$f'(x)=3x(x-2)$이고 $x=2$의 좌우에서 음에서 양으로 바뀌므로 극솟값은 $f(2)=-4$이다. $2$는 극소인 $x$의 값이다.", "key": "Cm05-02"}, "cm05-02-1-08": {"id": "cm05-02-1-08", "unit": "m05", "concept": "02", "벌": 1, "k": "c4", "q": "미분가능한 함수 $f(x)$에 대하여 $f'(a)=0$은 $f(x)$가 $x=a$에서 극값을 갖기 위한 ____.", "a": "필요조건이지만 충분조건이 아니다", "c": ["필요조건이지만 충분조건이 아니다", "충분조건이지만 필요조건이 아니다", "필요충분조건이다", "필요조건도 충분조건도 아니다"], "w": "극값이면 $f'(a)=0$(필요)이지만, $x^{3}$처럼 $f'(a)=0$이어도 극값이 없을 수 있다(충분 아님).", "key": "Cm05-02"}, "cm05-02-2-01": {"id": "cm05-02-2-01", "unit": "m05", "concept": "02", "벌": 2, "k": "ox", "q": "함수 $f(x)=x^{3}+1$은 $f'(0)=0$이지만 $x=0$에서 극값을 갖지 않는다.", "a": "O", "w": "$f'(x)=3x^{2}$은 $x=0$의 좌우에서 모두 양이라 부호가 바뀌지 않는다.", "key": "Cm05-02"}, "cm05-02-2-02": {"id": "cm05-02-2-02", "unit": "m05", "concept": "02", "벌": 2, "k": "ox", "q": "정의역에 속하는 모든 $x$에 대하여 $f(x)\\ge f(a)$일 때에만 $f(x)$는 $x=a$에서 극소라고 한다.", "a": "X", "w": "극소는 $x=a$를 포함하는 어떤 열린구간(근처)의 모든 $x$에 대하여 $f(x)\\ge f(a)$이면 된다. 정의역 전체 비교는 최솟값이다.", "key": "Cm05-02"}, "cm05-02-2-03": {"id": "cm05-02-2-03", "unit": "m05", "concept": "02", "벌": 2, "k": "ox", "q": "함수가 $x=a$에서 극값 $k$를 갖는다는 조건을 $f'(a)=0$, $f(a)=k$로 세워 미정계수를 구하면, 구한 함수는 반드시 $x=a$에서 극값을 갖는다.", "a": "X", "w": "$f'(a)=0$은 필요조건일 뿐이다. 예: $f(x)=x^{3}+bx$에서 $f'(0)=0$이면 $b=0$인데 $x^{3}$은 극값이 없다. 좌우 부호 변화를 확인해야 한다.", "key": "Cm05-02"}, "cm05-02-2-04": {"id": "cm05-02-2-04", "unit": "m05", "concept": "02", "벌": 2, "k": "ox", "q": "상수함수가 아닌 다항함수 $f(x)$가 $x=a$에서 극대이면 $x=a$의 좌우에서 $f'(x)$의 부호가 양에서 음으로 바뀐다.", "a": "O", "w": "다항함수의 극값은 $f'(x)$의 부호가 바뀌는 점에서만 생기고, 극대이면 왼쪽 증가·오른쪽 감소이다.", "key": "Cm05-02"}, "cm05-02-2-05": {"id": "cm05-02-2-05", "unit": "m05", "concept": "02", "벌": 2, "k": "ox", "q": "최고차항의 계수가 음수인 삼차함수 $f(x)$가 $x=\\alpha$, $x=\\beta\\,(\\alpha<\\beta)$에서 극값을 가지면 $x=\\alpha$에서 극대이다.", "a": "X", "w": "계수가 음수이면 $f'(x)$의 부호가 $-,\\,+,\\,-$이므로 $x=\\alpha$에서 극소, $x=\\beta$에서 극대이다.", "key": "Cm05-02"}, "cm05-02-2-06": {"id": "cm05-02-2-06", "unit": "m05", "concept": "02", "벌": 2, "k": "ox", "q": "함수 $f(x)=x^{3}-3x$의 극댓값은 $2$, 극솟값은 $-2$이다.", "a": "O", "w": "$f'(x)=3(x+1)(x-1)$이므로 극댓값 $f(-1)=2$, 극솟값 $f(1)=-2$이다.", "key": "Cm05-02"}, "cm05-02-2-07": {"id": "cm05-02-2-07", "unit": "m05", "concept": "02", "벌": 2, "k": "c4", "q": "함수 $f(x)=-x^{3}+3x^{2}+1$은 $x=$ ____ 에서 극대이다.", "a": "$2$", "c": ["$2$", "$0$", "$5$", "$1$"], "w": "$f'(x)=-3x(x-2)$의 부호가 $x=2$에서 양에서 음으로 바뀌므로 $x=2$에서 극대(극댓값 $5$)이다.", "key": "Cm05-02"}, "cm05-02-2-08": {"id": "cm05-02-2-08", "unit": "m05", "concept": "02", "벌": 2, "k": "c4", "q": "상수함수가 아닌 다항함수 $f(x)$에서 $f'(a)=0$이지만 $x=a$의 좌우에서 $f'(x)$의 부호가 바뀌지 않으면, $f(x)$는 $x=a$에서 ____.", "a": "극값을 갖지 않는다", "c": ["극값을 갖지 않는다", "극대이다", "극소이다", "극대 또는 극소이다"], "w": "부호가 바뀌지 않으면 $a$의 양쪽에서 함께 증가(또는 감소)하므로 극값이 아니다.", "key": "Cm05-02"}, "cm05-03-1-01": {"id": "cm05-03-1-01", "unit": "m05", "concept": "03", "벌": 1, "k": "ox", "q": "$y=f'(x)$의 그래프가 $x=2$에서 $x$축을 위에서 아래로 지나면 $f(x)$는 $x=2$에서 극소이다.", "a": "X", "w": "위에서 아래로 지나면 $f'(x)$의 부호가 양에서 음으로 바뀌므로 극대이다. 아래에서 위로 지날 때가 극소이다.", "key": "Cm05-03"}, "cm05-03-1-02": {"id": "cm05-03-1-02", "unit": "m05", "concept": "03", "벌": 1, "k": "ox", "q": "다항함수 $f(x)$에 대하여 $y=f'(x)$의 그래프가 열린구간 $(-1,\\,3)$에서 $x$축보다 위쪽에 있으면 $f(-1)<f(3)$이다.", "a": "O", "w": "이 구간에서 $f'(x)>0$이므로 $f(x)$는 증가하고, 따라서 $f(-1)<f(3)$이다.", "key": "Cm05-03"}, "cm05-03-1-03": {"id": "cm05-03-1-03", "unit": "m05", "concept": "03", "벌": 1, "k": "ox", "q": "$f'(x)$가 $x=1$에서 최솟값을 가지면 $f(x)$는 $x=1$에서 극소이다.", "a": "X", "w": "$y=f'(x)$의 꼭짓점은 $f(x)$의 극값과 관계없다. 극값은 $f'(x)$의 부호가 바뀌는 점에서 생긴다.", "key": "Cm05-03"}, "cm05-03-1-04": {"id": "cm05-03-1-04", "unit": "m05", "concept": "03", "벌": 1, "k": "ox", "q": "$f'(x)=(x-2)^{2}$이면 $f(x)$는 $x=2$에서 극값을 갖지 않는다.", "a": "O", "w": "$y=f'(x)$의 그래프가 $x=2$에서 $x$축에 접하기만 하고 지나가지 않아 부호가 바뀌지 않으므로 극값이 없다.", "key": "Cm05-03"}, "cm05-03-1-05": {"id": "cm05-03-1-05", "unit": "m05", "concept": "03", "벌": 1, "k": "ox", "q": "$y=f'(x)$의 그래프가 $x$축보다 위쪽에 있는 구간에서는 $y=f(x)$의 그래프도 $x$축보다 위쪽에 있다.", "a": "X", "w": "$f'(x)>0$은 그 구간에서 $f(x)$가 증가한다는 뜻일 뿐, $f(x)$의 값(높이)이 양수라는 뜻이 아니다.", "key": "Cm05-03"}, "cm05-03-1-06": {"id": "cm05-03-1-06", "unit": "m05", "concept": "03", "벌": 1, "k": "c4", "q": "$x=a$의 좌우에서 $f'(x)$의 부호가 음에서 양으로 바뀌면 $f(x)$는 $x=a$에서 ____이다.", "a": "극소", "c": ["극소", "극대", "극값을 갖지 않는 점", "감소하는 점"], "w": "감소하다가 증가하므로 $f(a)$가 근처에서 가장 작다. 즉 극소이다.", "key": "Cm05-03"}, "cm05-03-1-07": {"id": "cm05-03-1-07", "unit": "m05", "concept": "03", "벌": 1, "k": "c4", "q": "다항함수 $f(x)$에서 $f'(x)=x(x-3)^{2}$일 때, $f(x)$가 극값을 갖는 $x$의 값은 ____.", "a": "$x=0$ 뿐이다", "c": ["$x=0$ 뿐이다", "$x=0$, $x=3$이다", "$x=3$ 뿐이다", "없다"], "w": "$f'(x)$의 부호는 $x=0$에서 음에서 양으로 바뀌지만, $x=3$에서는 $(x-3)^{2}\\ge 0$이라 양에서 양으로 그대로이다. 극값은 $x=0$에서만 생긴다.", "key": "Cm05-03"}, "cm05-03-1-08": {"id": "cm05-03-1-08", "unit": "m05", "concept": "03", "벌": 1, "k": "c4", "q": "$y=f'(x)$의 그래프만으로 알 수 있는 것은 $f(x)$의 ____이고, 극댓값 자체는 $f(x)$에 대입해야 구해진다.", "a": "극값의 위치", "c": ["극값의 위치", "극댓값의 크기", "$y$절편", "함숫값의 부호"], "w": "도함수의 부호는 증가·감소와 극값의 위치를 정할 뿐이다. 극댓값은 $f(x)$의 식에 넣어야 나온다.", "key": "Cm05-03"}, "cm05-03-2-01": {"id": "cm05-03-2-01", "unit": "m05", "concept": "03", "벌": 2, "k": "ox", "q": "$f'(x)=x^{3}$이면 $y=f'(x)$의 그래프가 원점에서 $x$축에 접하므로 $f(x)$는 $x=0$에서 극값을 갖지 않는다.", "a": "X", "w": "$y=x^{3}$은 원점에서 $x$축에 접하면서 지나가므로 부호가 음에서 양으로 바뀐다. 따라서 $f(x)$는 $x=0$에서 극소이다.", "key": "Cm05-03"}, "cm05-03-2-02": {"id": "cm05-03-2-02", "unit": "m05", "concept": "03", "벌": 2, "k": "ox", "q": "다항함수 $f(x)$에서 $x<1$일 때 $f'(x)<0$, $f'(1)=0$, $x>1$일 때 $f'(x)<0$이면 $f(x)$는 실수 전체의 집합에서 감소한다.", "a": "O", "w": "$f'(x)\\le 0$이고 $f'(x)=0$인 점이 $x=1$ 하나뿐이므로 감소가 끊기지 않는다.", "key": "Cm05-03"}, "cm05-03-2-03": {"id": "cm05-03-2-03", "unit": "m05", "concept": "03", "벌": 2, "k": "ox", "q": "$y=f'(x)$의 그래프가 열린구간 $(0,\\,4)$에서 $x$축보다 아래쪽에 있고 $x=2$에서 가장 낮으면, 닫힌구간 $[0,\\,4]$에서 $f(x)$는 $x=2$일 때 최소이다.", "a": "X", "w": "이 구간에서 $f'(x)<0$이므로 $f(x)$는 계속 감소한다. 최솟값은 $x=4$에서 나온다. 가장 낮은 점은 감소가 가장 가파른 곳일 뿐이다.", "key": "Cm05-03"}, "cm05-03-2-04": {"id": "cm05-03-2-04", "unit": "m05", "concept": "03", "벌": 2, "k": "ox", "q": "$f'(x)=-(x+1)(x-3)$이면 $f(x)$는 $x=3$에서 극대이다.", "a": "O", "w": "$-1<x<3$에서 $f'(x)>0$, $x>3$에서 $f'(x)<0$이므로 $x=3$의 좌우에서 부호가 양에서 음으로 바뀐다. 극대이다.", "key": "Cm05-03"}, "cm05-03-2-05": {"id": "cm05-03-2-05", "unit": "m05", "concept": "03", "벌": 2, "k": "ox", "q": "다항함수 $f(x)$에서 $f'(x)$의 부호가 양에서 음으로 바뀌는 점에서 $y=f(x)$의 그래프의 접선의 기울기는 $0$이다.", "a": "O", "w": "그 점은 극대이고, 미분가능한 함수가 극값을 가지면 $f'(a)=0$이다. 접선의 기울기가 곧 $f'(a)$이다.", "key": "Cm05-03"}, "cm05-03-2-06": {"id": "cm05-03-2-06", "unit": "m05", "concept": "03", "벌": 2, "k": "c4", "q": "다항함수 $f(x)$에서 $f'(x)$의 부호가 $x<-2$일 때 양, $-2<x<1$일 때 음, $x>1$일 때 음이면 $f(x)$는 ____.", "a": "$x=-2$에서만 극값을 갖는다", "c": ["$x=-2$에서만 극값을 갖는다", "$x=-2$에서 극대, $x=1$에서 극소이다", "$x=1$에서만 극값을 갖는다", "극값을 갖지 않는다"], "w": "부호가 바뀌는 점은 $x=-2$(양→음, 극대)뿐이다. $x=1$에서는 음→음이라 극값이 아니다.", "key": "Cm05-03"}, "cm05-03-2-07": {"id": "cm05-03-2-07", "unit": "m05", "concept": "03", "벌": 2, "k": "c4", "q": "$y=f'(x)$의 그래프가 $x=-1$, $2$, $5$에서만 $x$축과 만나고 세 점에서 모두 부호가 바뀌며, $x>5$에서 $f'(x)>0$이면 $f(x)$가 극대가 되는 $x$의 값은 ____이다.", "a": "$x=2$", "c": ["$x=2$", "$x=5$", "$x=-1$", "$x=-1$, $x=5$"], "w": "부호는 오른쪽부터 $+,\\,-,\\,+,\\,-$이므로 $x=2$에서 양→음(극대), $x=-1$, $x=5$에서 음→양(극소)이다.", "key": "Cm05-03"}, "cm05-03-2-08": {"id": "cm05-03-2-08", "unit": "m05", "concept": "03", "벌": 2, "k": "c4", "q": "$f'(x)=x^{2}-4$인 함수 $f(x)$는 구간 ____에서 감소한다.", "a": "$[-2,\\,2]$", "c": ["$[-2,\\,2]$", "$(-\\infty,\\,-2]$, $[2,\\,\\infty)$", "$(-\\infty,\\,0]$", "$[-4,\\,4]$"], "w": "$f'(x)=(x+2)(x-2)\\le 0$인 구간은 $[-2,\\,2]$이다. $y=f'(x)$의 꼭짓점 $x=0$은 증감과 관계없다.", "key": "Cm05-03"}, "cm05-04-1-01": {"id": "cm05-04-1-01", "unit": "m05", "concept": "04", "벌": 1, "k": "ox", "q": "삼차함수 $f(x)$에서 이차방정식 $f'(x)=0$의 판별식 $D$가 $D\\ge 0$이면 $f(x)$는 극값을 갖는다.", "a": "X", "w": "$D=0$이면 중근이라 부호가 바뀌지 않는다. 극값을 가질 조건은 $D>0$이다.", "key": "Cm05-04"}, "cm05-04-1-02": {"id": "cm05-04-1-02", "unit": "m05", "concept": "04", "벌": 1, "k": "ox", "q": "삼차함수가 극값을 가지면 극댓값과 극솟값을 하나씩 갖는다.", "a": "O", "w": "$D>0$이면 $f'(x)=0$의 서로 다른 두 실근에서 부호가 각각 바뀌어 극대 하나, 극소 하나가 생긴다.", "key": "Cm05-04"}, "cm05-04-1-03": {"id": "cm05-04-1-03", "unit": "m05", "concept": "04", "벌": 1, "k": "ox", "q": "함수 $f(x)=x^{3}+3x^{2}+3x$는 극값을 갖지 않는다.", "a": "O", "w": "$f'(x)=3(x+1)^{2}\\ge 0$이라 $x=-1$의 좌우에서 부호가 바뀌지 않는다.", "key": "Cm05-04"}, "cm05-04-1-04": {"id": "cm05-04-1-04", "unit": "m05", "concept": "04", "벌": 1, "k": "ox", "q": "함수 $f(x)=x^{3}-3ax$가 극값을 갖지 않도록 하는 실수 $a$의 값의 범위는 $a<0$이다.", "a": "X", "w": "$f'(x)=3x^{2}-3a$이므로 극값이 없을 조건은 $D\\le 0$, 곧 $a\\le 0$이다. $a=0$을 빠뜨리면 안 된다.", "key": "Cm05-04"}, "cm05-04-1-05": {"id": "cm05-04-1-05", "unit": "m05", "concept": "04", "벌": 1, "k": "ox", "q": "최고차항의 계수가 양수인 사차함수는 항상 극솟값을 갖는다.", "a": "O", "w": "$f'(x)$는 최고차항의 계수가 양수인 삼차식이라 음에서 양으로 바뀌는 점이 반드시 있다. 그 점에서 극소이다.", "key": "Cm05-04"}, "cm05-04-1-06": {"id": "cm05-04-1-06", "unit": "m05", "concept": "04", "벌": 1, "k": "c4", "q": "삼차함수 $f(x)$가 극값을 갖지 않을 조건은 이차방정식 $f'(x)=0$의 판별식 $D$에 대하여 ____이다.", "a": "$D\\le 0$", "c": ["$D\\le 0$", "$D<0$", "$D=0$", "$D\\ge 0$"], "w": "$D<0$이면 부호가 일정하고, $D=0$이면 중근이라 부호가 바뀌지 않는다. 둘을 합쳐 $D\\le 0$이다.", "key": "Cm05-04"}, "cm05-04-1-07": {"id": "cm05-04-1-07", "unit": "m05", "concept": "04", "벌": 1, "k": "c4", "q": "함수 $f(x)=x^{3}-6x^{2}+kx$가 극값을 갖도록 하는 실수 $k$의 값의 범위는 ____이다.", "a": "$k<12$", "c": ["$k<12$", "$k\\le 12$", "$k>12$", "$k<36$"], "w": "$f'(x)=3x^{2}-12x+k$에서 $\\dfrac{D}{4}=36-3k>0$이므로 $k<12$이다. 등호는 중근이라 제외한다.", "key": "Cm05-04"}, "cm05-04-1-08": {"id": "cm05-04-1-08", "unit": "m05", "concept": "04", "벌": 1, "k": "c4", "q": "최고차항의 계수가 양수인 사차함수 $f(x)$가 극댓값을 가질 조건은 삼차방정식 $f'(x)=0$이 ____ 것이다.", "a": "서로 다른 세 실근을 갖는", "c": ["서로 다른 세 실근을 갖는", "실근을 하나 이상 갖는", "중근을 갖는", "서로 다른 두 실근을 갖는"], "w": "부호가 $-,\\,+,\\,-,\\,+$로 세 번 바뀌어야 극소·극대·극소가 생긴다. 그러려면 서로 다른 세 실근이 필요하다.", "key": "Cm05-04"}, "cm05-04-2-01": {"id": "cm05-04-2-01", "unit": "m05", "concept": "04", "벌": 2, "k": "ox", "q": "삼차함수 $f(x)$가 실수 전체의 집합에서 증가하면 $f(x)$는 극값을 갖지 않는다.", "a": "O", "w": "실수 전체에서 증가하면 감소로 바뀌는 점이 없으므로 극대도 극소도 생기지 않는다.", "key": "Cm05-04"}, "cm05-04-2-02": {"id": "cm05-04-2-02", "unit": "m05", "concept": "04", "벌": 2, "k": "ox", "q": "함수 $f(x)=-x^{3}+3x^{2}+kx$가 극값을 갖도록 하는 실수 $k$의 값의 범위는 $k>-3$이다.", "a": "O", "w": "$f'(x)=-3x^{2}+6x+k=0$에서 $\\dfrac{D}{4}=9+3k>0$이므로 $k>-3$이다. 최고차항의 계수가 음수여도 조건은 $D>0$이다.", "key": "Cm05-04"}, "cm05-04-2-03": {"id": "cm05-04-2-03", "unit": "m05", "concept": "04", "벌": 2, "k": "ox", "q": "삼차함수 $f(x)$에서 이차방정식 $f'(x)=0$의 판별식이 양수이면 $f(x)$는 열린구간 $(0,\\,2)$에서 극댓값과 극솟값을 모두 갖는다.", "a": "X", "w": "판별식이 양수여도 두 실근이 $(0,\\,2)$ 밖에 있을 수 있다. 두 실근이 모두 이 구간 안에 있어야 한다.", "key": "Cm05-04"}, "cm05-04-2-04": {"id": "cm05-04-2-04", "unit": "m05", "concept": "04", "벌": 2, "k": "ox", "q": "함수 $f(x)=x^{3}+kx$는 $k=0$일 때 극값을 갖는다.", "a": "X", "w": "$k=0$이면 $f'(x)=3x^{2}\\ge 0$이라 부호가 바뀌지 않는다. 극값을 가질 조건은 $k<0$이다.", "key": "Cm05-04"}, "cm05-04-2-05": {"id": "cm05-04-2-05", "unit": "m05", "concept": "04", "벌": 2, "k": "ox", "q": "최고차항의 계수가 양수인 사차함수 $f(x)$에서 삼차방정식 $f'(x)=0$이 한 중근과 그와 다른 한 실근만 가지면 $f(x)$는 극댓값을 갖지 않는다.", "a": "O", "w": "중근에서는 $f'(x)$의 부호가 바뀌지 않으므로 부호는 한 번만(음→양) 바뀐다. 극솟값 하나만 생긴다.", "key": "Cm05-04"}, "cm05-04-2-06": {"id": "cm05-04-2-06", "unit": "m05", "concept": "04", "벌": 2, "k": "c4", "q": "삼차함수 $f(x)$가 열린구간 $(\\alpha,\\,\\beta)$에서 극댓값과 극솟값을 모두 가질 조건은 $f'(x)=0$이 ____ 것이다.", "a": "이 구간에서 서로 다른 두 실근을 갖는", "c": ["이 구간에서 서로 다른 두 실근을 갖는", "서로 다른 두 실근을 갖는", "이 구간에서 실근을 하나 이상 갖는", "이 구간에서 중근을 갖는"], "w": "두 극값이 모두 구간 안에 있으려면 부호가 바뀌는 두 점, 곧 서로 다른 두 실근이 모두 그 구간 안에 있어야 한다.", "key": "Cm05-04"}, "cm05-04-2-07": {"id": "cm05-04-2-07", "unit": "m05", "concept": "04", "벌": 2, "k": "c4", "q": "삼차함수가 주어진 구간에서 극값을 가질 조건은 판별식만으로 정할 수 없고, ____을 함께 본다.", "a": "축의 위치와 구간 양 끝에서 $f'(x)$의 값", "c": ["축의 위치와 구간 양 끝에서 $f'(x)$의 값", "구간 양 끝에서 $f(x)$의 값", "$f(x)$의 상수항", "최고차항의 계수의 부호"], "w": "이차함수 $f'(x)$의 근이 구간 안에 있는지는 판별식, 축의 위치, 양 끝에서 $f'(x)$의 부호로 정한다.", "key": "Cm05-04"}, "cm05-04-2-08": {"id": "cm05-04-2-08", "unit": "m05", "concept": "04", "벌": 2, "k": "c4", "q": "최고차항의 계수가 음수인 삼차함수가 극값을 가지면, 극값을 갖는 두 $x$의 값 중 작은 쪽에서 ____을 갖는다.", "a": "극솟값", "c": ["극솟값", "극댓값", "최솟값", "최댓값"], "w": "최고차항의 계수가 음수이면 $f'(x)$의 부호가 $-,\\,+,\\,-$ 순이라 작은 쪽에서 극소, 큰 쪽에서 극대이다.", "key": "Cm05-04"}, "cm05-05-1-01": {"id": "cm05-05-1-01", "unit": "m05", "concept": "05", "벌": 1, "k": "ox", "q": "열린구간 $(a,\\,b)$에서 연속인 함수는 반드시 최댓값과 최솟값을 갖는다.", "a": "X", "w": "최대·최소 정리는 닫힌구간에서만 성립한다. 예를 들어 $f(x)=x$는 열린구간 $(0,\\,1)$에서 최댓값이 없다.", "key": "Cm05-05"}, "cm05-05-1-02": {"id": "cm05-05-1-02", "unit": "m05", "concept": "05", "벌": 1, "k": "ox", "q": "닫힌구간에서 미분가능한 함수 $f(x)$가 구간의 안쪽에 있는 점에서 최댓값을 가지면 $f(x)$는 그 점에서 극대이다.", "a": "O", "w": "구간의 안쪽이면 그 점 근처의 모든 $x$에 대하여 $f(x)\\le$ 최댓값이므로 극대의 정의를 만족한다.", "key": "Cm05-05"}, "cm05-05-1-03": {"id": "cm05-05-1-03", "unit": "m05", "concept": "05", "벌": 1, "k": "ox", "q": "함수 $f(x)=x^{2}-2x$의 닫힌구간 $[0,\\,3]$에서의 최솟값은 $f(0)=0$이다.", "a": "X", "w": "구간 안의 $x=1$에서 극솟값 $f(1)=-1$이 있으므로 최솟값은 $-1$이다. 끝값만 보면 안 된다.", "key": "Cm05-05"}, "cm05-05-1-04": {"id": "cm05-05-1-04", "unit": "m05", "concept": "05", "벌": 1, "k": "ox", "q": "함수 $f(x)=x^{3}-3x$의 닫힌구간 $[0,\\,3]$에서의 최댓값은 $f(3)=18$이다.", "a": "O", "w": "구간 안의 극값은 극솟값 $f(1)=-2$뿐이고, $f(0)=0$, $f(3)=18$과 비교하면 최댓값은 $18$이다.", "key": "Cm05-05"}, "cm05-05-1-05": {"id": "cm05-05-1-05", "unit": "m05", "concept": "05", "벌": 1, "k": "ox", "q": "미분가능한 함수 $f(x)$가 닫힌구간 안에서 극값을 극솟값 하나만 가지면, 그 극솟값이 이 구간에서의 최솟값이다.", "a": "O", "w": "극값이 하나뿐이면 그 왼쪽에서 감소, 오른쪽에서 증가하므로 그 극솟값이 구간 전체에서 가장 작다.", "key": "Cm05-05"}, "cm05-05-1-06": {"id": "cm05-05-1-06", "unit": "m05", "concept": "05", "벌": 1, "k": "c4", "q": "함수 $f(x)=-x^{2}+4x$의 닫힌구간 $[0,\\,1]$에서의 최댓값은 ____이다.", "a": "$3$", "c": ["$3$", "$4$", "$0$", "$2$"], "w": "꼭짓점 $x=2$는 구간 밖이라 후보가 아니다. 구간에서 $f(x)$는 증가하므로 최댓값은 $f(1)=3$이다.", "key": "Cm05-05"}, "cm05-05-1-07": {"id": "cm05-05-1-07", "unit": "m05", "concept": "05", "벌": 1, "k": "c4", "q": "극값은 ____에서 비교한 값이고, 최댓값·최솟값은 정의역 전체에서 비교한 값이다.", "a": "그 점의 근처", "c": ["그 점의 근처", "구간의 양 끝", "정의역 전체", "$f'(x)=0$인 점끼리"], "w": "극대·극소는 $x=a$를 포함하는 어떤 열린구간 안에서만 비교한 것이다. 그래서 극댓값이 최댓값이 아닐 수 있다.", "key": "Cm05-05"}, "cm05-05-1-08": {"id": "cm05-05-1-08", "unit": "m05", "concept": "05", "벌": 1, "k": "c4", "q": "둘레의 길이가 $20$인 직사각형의 가로의 길이를 $x$라 하면 넓이는 $x(10-x)$이다. 이때 $x$의 범위는 ____이다.", "a": "$0<x<10$", "c": ["$0<x<10$", "$0<x<20$", "$x>0$", "$0\\le x\\le 20$"], "w": "세로의 길이 $10-x$도 양수여야 하므로 $0<x<10$이다. 활용 문제는 변수의 범위부터 적는다.", "key": "Cm05-05"}, "cm05-05-2-01": {"id": "cm05-05-2-01", "unit": "m05", "concept": "05", "벌": 2, "k": "ox", "q": "함수 $f(x)=x^{3}-3x$는 닫힌구간 $[-2,\\,3]$에서 극댓값 $2$를 가지므로, 이 구간에서 $f(x)$의 최댓값은 $2$이다.", "a": "X", "w": "최댓값은 극값과 구간 양 끝의 함숫값 중 가장 큰 값이다. $f(-2)=-2$, $f(3)=18$이므로 최댓값은 $18$이다.", "key": "Cm05-05"}, "cm05-05-2-02": {"id": "cm05-05-2-02", "unit": "m05", "concept": "05", "벌": 2, "k": "ox", "q": "함수 $f(x)=x^{3}-3x^{2}$의 닫힌구간 $[-1,\\,3]$에서의 최솟값은 $-4$이다.", "a": "O", "w": "극솟값 $f(2)=-4$, 극댓값 $f(0)=0$, 끝값 $f(-1)=-4$, $f(3)=0$을 비교하면 최솟값은 $-4$이다.", "key": "Cm05-05"}, "cm05-05-2-03": {"id": "cm05-05-2-03", "unit": "m05", "concept": "05", "벌": 2, "k": "ox", "q": "다항함수 $f(x)$가 열린구간 $(a,\\,b)$에서 $f'(x)>0$이면, 닫힌구간 $[a,\\,b]$에서 $f(x)$의 최댓값은 $f(b)$이다.", "a": "O", "w": "$f(x)$가 $[a,\\,b]$에서 증가하므로 오른쪽 끝에서 가장 크다. 극값이 없을 때는 끝값이 곧 최대·최소이다.", "key": "Cm05-05"}, "cm05-05-2-04": {"id": "cm05-05-2-04", "unit": "m05", "concept": "05", "벌": 2, "k": "ox", "q": "실수 전체의 집합에서 정의된 다항함수는 항상 최댓값을 갖는다.", "a": "X", "w": "최대·최소 정리는 닫힌구간에서의 이야기이다. $f(x)=x^{3}$이나 $f(x)=x^{2}$은 실수 전체에서 최댓값이 없다.", "key": "Cm05-05"}, "cm05-05-2-05": {"id": "cm05-05-2-05", "unit": "m05", "concept": "05", "벌": 2, "k": "ox", "q": "닫힌구간에서 최댓값을 구할 때, $f'(x)=0$인 $x$가 그 구간 밖에 있으면 그 점의 함숫값은 후보에서 뺀다.", "a": "O", "w": "후보는 구간 안의 극값과 양 끝의 함숫값뿐이다. 구간 밖의 점은 정의역에 없다.", "key": "Cm05-05"}, "cm05-05-2-06": {"id": "cm05-05-2-06", "unit": "m05", "concept": "05", "벌": 2, "k": "c4", "q": "함수 $f(x)=x^{3}-12x$의 닫힌구간 $[0,\\,3]$에서의 최솟값은 ____이다.", "a": "$-16$", "c": ["$-16$", "$-9$", "$0$", "$16$"], "w": "$f'(x)=3(x+2)(x-2)$이므로 구간 안의 극솟값 $f(2)=-16$을 $f(0)=0$, $f(3)=-9$와 비교하면 최솟값은 $-16$이다.", "key": "Cm05-05"}, "cm05-05-2-07": {"id": "cm05-05-2-07", "unit": "m05", "concept": "05", "벌": 2, "k": "c4", "q": "함수 $f(x)=x^{3}-3x+k$의 닫힌구간 $[0,\\,2]$에서의 최솟값이 $1$이면 $k=$ ____이다.", "a": "$3$", "c": ["$3$", "$1$", "$-1$", "$5$"], "w": "구간 안의 극솟값 $f(1)=k-2$가 $f(0)=k$, $f(2)=k+2$보다 작으므로 $k-2=1$, $k=3$이다.", "key": "Cm05-05"}, "cm05-05-2-08": {"id": "cm05-05-2-08", "unit": "m05", "concept": "05", "벌": 2, "k": "c4", "q": "닫힌구간 $[a,\\,b]$에서 연속인 함수의 최댓값을 구할 때 비교할 후보는 ____이다.", "a": "구간 안의 극값과 $f(a)$, $f(b)$", "c": ["구간 안의 극값과 $f(a)$, $f(b)$", "구간 안의 극값뿐", "$f(a)$와 $f(b)$뿐", "$f'(x)=0$인 모든 $x$에서의 함숫값"], "w": "최댓값을 주는 점은 구간 안쪽이면 극대이고, 아니면 끝점이다. 그래서 극값과 양 끝 값을 비교한다.", "key": "Cm05-05"}, "cm05-01-3-01": {"id": "cm05-01-3-01", "unit": "m05", "concept": "01", "벌": 3, "k": "ox", "q": "함수 $f(x)=x^{4}$은 구간 $[0,\\,\\infty)$에서 증가한다.", "a": "O", "w": "$f'(x)=4x^{3}\\ge 0$이고 $f'(x)=0$인 점은 $x=0$ 하나뿐이므로 증가한다. 끝점에서 $f'(0)=0$이어도 증가에는 상관없다.", "key": "Cm05-01"}, "cm05-01-3-02": {"id": "cm05-01-3-02", "unit": "m05", "concept": "01", "벌": 3, "k": "ox", "q": "함수 $f(x)=\\frac{1}{3}x^{3}-x^{2}$은 구간 $[0,\\,2]$에서 증가한다.", "a": "X", "w": "$f'(x)=x(x-2)$는 $0<x<2$에서 음수이므로 이 구간에서 감소한다.", "key": "Cm05-01"}, "cm05-01-3-03": {"id": "cm05-01-3-03", "unit": "m05", "concept": "01", "벌": 3, "k": "ox", "q": "함수 $f(x)=-x^{3}+ax$가 실수 전체의 집합에서 감소하도록 하는 실수 $a$의 값의 범위는 $a<0$이다.", "a": "X", "w": "$f'(x)=-3x^{2}+a\\le 0$이 모든 $x$에서 성립해야 하므로 $a\\le 0$이다. $a=0$이면 $f(x)=-x^{3}$으로 감소한다.", "key": "Cm05-01"}, "cm05-01-3-04": {"id": "cm05-01-3-04", "unit": "m05", "concept": "01", "벌": 3, "k": "ox", "q": "최고차항의 계수가 양수인 삼차함수는 실수 전체의 집합에서 감소할 수 없다.", "a": "O", "w": "$f'(x)$는 최고차항의 계수가 양수인 이차함수이므로 $x$가 충분히 크면 $f'(x)>0$이 되어 감소할 수 없다.", "key": "Cm05-01"}, "cm05-01-3-05": {"id": "cm05-01-3-05", "unit": "m05", "concept": "01", "벌": 3, "k": "ox", "q": "함수 $f(x)=x^{3}-3x$는 구간 $(-\\infty,\\,-1]$과 구간 $[1,\\,\\infty)$에서 증가하므로 $f(-1)<f(1)$이다.", "a": "X", "w": "증가는 한 구간 안에서만 말한다. 두 점은 서로 다른 구간에 있고 실제로 $f(-1)=2$, $f(1)=-2$이다.", "key": "Cm05-01"}, "cm05-01-3-06": {"id": "cm05-01-3-06", "unit": "m05", "concept": "01", "벌": 3, "k": "ox", "q": "다항함수 $f(x)$에서 $f'(x)=(x-1)^{2}(x+2)$이면 $f(x)$는 구간 $[-2,\\,\\infty)$에서 증가한다.", "a": "O", "w": "$x\\ge -2$에서 $f'(x)\\ge 0$이고 $f'(x)=0$인 점은 $x=-2$, $x=1$ 뿐이므로 증가한다.", "key": "Cm05-01"}, "cm05-01-3-07": {"id": "cm05-01-3-07", "unit": "m05", "concept": "01", "벌": 3, "k": "c4", "q": "함수 $f(x)=x^{3}-3ax$가 구간 $[1,\\,\\infty)$에서 증가하도록 하는 실수 $a$의 최댓값은 ____이다.", "a": "$1$", "c": ["$1$", "$3$", "$0$", "$\\frac{1}{3}$"], "w": "$x\\ge 1$에서 $f'(x)=3x^{2}-3a\\ge 0$, 곧 $a\\le x^{2}$이어야 하므로 $a\\le 1$이다. $0$은 실수 전체에서 증가할 조건이다.", "key": "Cm05-01"}, "cm05-01-3-08": {"id": "cm05-01-3-08", "unit": "m05", "concept": "01", "벌": 3, "k": "c4", "q": "다항함수 $f(x)$에서 $f'(x)=x^{2}(x-3)$일 때, $f(x)$가 감소하는 구간은 ____이다.", "a": "$(-\\infty,\\,3]$", "c": ["$(-\\infty,\\,3]$", "$[0,\\,3]$", "$(-\\infty,\\,0]$", "$[3,\\,\\infty)$"], "w": "$x^{2}\\ge 0$이므로 $x\\le 3$에서 $f'(x)\\le 0$이다. $x=0$에서 $f'(x)=0$이어도 부호가 바뀌지 않아 감소가 이어진다.", "key": "Cm05-01"}, "cm05-02-3-01": {"id": "cm05-02-3-01", "unit": "m05", "concept": "02", "벌": 3, "k": "ox", "q": "함수 $f(x)=x^{3}-3x^{2}-9x$는 $x=-1$에서 극대이다.", "a": "O", "w": "$f'(x)=3(x+1)(x-3)$의 부호가 $x=-1$의 좌우에서 양에서 음으로 바뀌므로 극대이다.", "key": "Cm05-02"}, "cm05-02-3-02": {"id": "cm05-02-3-02", "unit": "m05", "concept": "02", "벌": 3, "k": "ox", "q": "극댓값을 갖는 다항함수는 반드시 극솟값도 갖는다.", "a": "X", "w": "$f(x)=-x^{2}$은 $x=0$에서 극대이지만 극솟값은 없다. 극대·극소가 짝으로 나오는 것은 극값을 갖는 삼차함수의 성질이다.", "key": "Cm05-02"}, "cm05-02-3-03": {"id": "cm05-02-3-03", "unit": "m05", "concept": "02", "벌": 3, "k": "ox", "q": "함수 $f(x)$가 $x=a$에서 극대이면 극댓값 $f(a)$는 양수이다.", "a": "X", "w": "극대는 근처의 함숫값과 비교한 것일 뿐 부호와는 관계없다. $f(x)=-x^{2}-1$의 극댓값은 $-1$이다.", "key": "Cm05-02"}, "cm05-02-3-04": {"id": "cm05-02-3-04", "unit": "m05", "concept": "02", "벌": 3, "k": "ox", "q": "한 함수가 극댓값을 두 개 이상 가질 수도 있다.", "a": "O", "w": "$f(x)=-x^{4}+8x^{2}$은 $x=-2$, $x=2$에서 모두 극대이다. 극값은 근처에서만 비교하므로 여러 개일 수 있다.", "key": "Cm05-02"}, "cm05-02-3-05": {"id": "cm05-02-3-05", "unit": "m05", "concept": "02", "벌": 3, "k": "ox", "q": "함수 $f(x)=x^{3}+3x^{2}+1$의 극댓값은 $f(0)=1$이다.", "a": "X", "w": "$f'(x)=3x(x+2)$의 부호가 $x=0$에서 음에서 양으로 바뀌므로 $f(0)=1$은 극솟값이다. 극댓값은 $f(-2)=5$이다.", "key": "Cm05-02"}, "cm05-02-3-06": {"id": "cm05-02-3-06", "unit": "m05", "concept": "02", "벌": 3, "k": "c4", "q": "함수 $f(x)=x^{3}+ax^{2}$이 $x=2$에서 극값을 갖도록 하는 상수 $a$의 값은 ____이다.", "a": "$-3$", "c": ["$-3$", "$-6$", "$-2$", "$3$"], "w": "$f'(x)=3x^{2}+2ax$에서 $f'(2)=12+4a=0$이므로 $a=-3$이고, 이때 $f'(x)=3x(x-2)$의 부호가 $x=2$에서 바뀐다.", "key": "Cm05-02"}, "cm05-02-3-07": {"id": "cm05-02-3-07", "unit": "m05", "concept": "02", "벌": 3, "k": "c4", "q": "함수 $f(x)=-x^{4}+2x^{2}$의 극솟값은 ____이다.", "a": "$0$", "c": ["$0$", "$1$", "$-1$", "없다"], "w": "$f'(x)=-4x(x+1)(x-1)$의 부호가 $x=0$에서 음에서 양으로 바뀌므로 극솟값은 $f(0)=0$이다. $1$은 $x=\\pm 1$에서의 극댓값이다.", "key": "Cm05-02"}, "cm05-02-3-08": {"id": "cm05-02-3-08", "unit": "m05", "concept": "02", "벌": 3, "k": "c4", "q": "함수 $f(x)=2x^{3}-6x$의 극댓값과 극솟값의 차는 ____이다.", "a": "$8$", "c": ["$8$", "$4$", "$0$", "$2$"], "w": "$f'(x)=6(x+1)(x-1)$이므로 극댓값 $f(-1)=4$, 극솟값 $f(1)=-4$이고 차는 $8$이다.", "key": "Cm05-02"}, "cm05-03-3-01": {"id": "cm05-03-3-01", "unit": "m05", "concept": "03", "벌": 3, "k": "ox", "q": "다항함수 $f(x)$에서 $f'(x)$의 값이 구간 $(0,\\,2)$에서 증가하면 $f(x)$도 이 구간에서 증가한다.", "a": "X", "w": "$f(x)$의 증가는 $f'(x)$의 부호로 정한다. $f'(x)=x-3$은 증가하지만 $(0,\\,2)$에서 음수이므로 $f(x)$는 감소한다.", "key": "Cm05-03"}, "cm05-03-3-02": {"id": "cm05-03-3-02", "unit": "m05", "concept": "03", "벌": 3, "k": "ox", "q": "다항함수 $f(x)$에서 $f'(x)$의 부호가 바뀌는 점이 두 개뿐이면 $f(x)$는 극댓값과 극솟값을 하나씩 갖는다.", "a": "O", "w": "부호는 바뀔 때마다 번갈아 바뀌므로 두 점 중 하나는 양에서 음(극대), 다른 하나는 음에서 양(극소)이다.", "key": "Cm05-03"}, "cm05-03-3-03": {"id": "cm05-03-3-03", "unit": "m05", "concept": "03", "벌": 3, "k": "ox", "q": "다항함수 $f(x)$에서 $f'(x)$의 부호가 $x<1$일 때 양, $1<x<3$일 때 음, $x>3$일 때 양이면 $f(0)<f(1)$이고 $f(2)>f(3)$이다.", "a": "O", "w": "$x\\le 1$에서 증가하므로 $f(0)<f(1)$이고, $1\\le x\\le 3$에서 감소하므로 $f(2)>f(3)$이다.", "key": "Cm05-03"}, "cm05-03-3-04": {"id": "cm05-03-3-04", "unit": "m05", "concept": "03", "벌": 3, "k": "ox", "q": "다항함수 $f(x)$에서 $f'(x)$의 부호가 $x<2$일 때 양, $x>2$일 때 음이면 $f(x)$의 최댓값은 $f(2)$이다.", "a": "O", "w": "$x\\le 2$에서 증가하고 $x\\ge 2$에서 감소하므로 모든 $x$에 대하여 $f(x)\\le f(2)$이다.", "key": "Cm05-03"}, "cm05-03-3-05": {"id": "cm05-03-3-05", "unit": "m05", "concept": "03", "벌": 3, "k": "ox", "q": "다항함수 $f(x)$에서 $f'(x)$의 부호가 $x<1$일 때 양, $x>1$일 때 음이면 $f(1)=0$이다.", "a": "X", "w": "$0$이 되는 것은 $f'(1)$이다. $f(1)$은 극댓값이고 그 값은 $f'(x)$의 부호만으로는 알 수 없다.", "key": "Cm05-03"}, "cm05-03-3-06": {"id": "cm05-03-3-06", "unit": "m05", "concept": "03", "벌": 3, "k": "c4", "q": "다항함수 $f(x)$에서 $f'(x)=x^{2}-2x-3$일 때, $f(x)$가 극소가 되는 $x$의 값은 ____이다.", "a": "$3$", "c": ["$3$", "$1$", "$-1$", "$-4$"], "w": "$f'(x)=(x+1)(x-3)$의 부호가 $x=3$에서 음에서 양으로 바뀌므로 극소이다. $x=1$은 $y=f'(x)$의 꼭짓점일 뿐 극값과 관계없다.", "key": "Cm05-03"}, "cm05-03-3-07": {"id": "cm05-03-3-07", "unit": "m05", "concept": "03", "벌": 3, "k": "c4", "q": "다항함수 $f(x)$에서 $f'(x)=x(x-2)$일 때, $f(0)$, $f(1)$, $f(2)$ 중 가장 큰 것은 ____이다.", "a": "$f(0)$", "c": ["$f(0)$", "$f(1)$", "$f(2)$", "알 수 없다"], "w": "$0<x<2$에서 $f'(x)<0$이므로 $f(x)$는 구간 $[0,\\,2]$에서 감소하고 $f(0)$이 가장 크다.", "key": "Cm05-03"}, "cm05-03-3-08": {"id": "cm05-03-3-08", "unit": "m05", "concept": "03", "벌": 3, "k": "c4", "q": "다항함수 $f(x)$에서 방정식 $f'(x)=0$의 실근이 중근 $x=1$뿐이고 $f'(0)>0$이면 $f(x)$는 ____.", "a": "실수 전체의 집합에서 증가한다", "c": ["실수 전체의 집합에서 증가한다", "$x=1$에서 극대이다", "$x=1$에서 극소이다", "실수 전체의 집합에서 감소한다"], "w": "$x=1$의 좌우에서 $f'(x)$의 부호가 바뀌지 않고 $f'(0)>0$이므로 $x\\ne 1$에서 $f'(x)>0$이다. 따라서 극값 없이 증가한다.", "key": "Cm05-03"}, "cm05-04-3-01": {"id": "cm05-04-3-01", "unit": "m05", "concept": "04", "벌": 3, "k": "ox", "q": "사차함수의 극값의 개수는 $1$ 또는 $3$이다.", "a": "O", "w": "$f'(x)=0$은 삼차방정식이므로 부호가 바뀌는 실근은 $1$개 또는 $3$개이다. 예를 들어 $x^{4}$은 $1$개, $x^{4}-2x^{2}$은 $3$개이다.", "key": "Cm05-04"}, "cm05-04-3-02": {"id": "cm05-04-3-02", "unit": "m05", "concept": "04", "벌": 3, "k": "ox", "q": "함수 $f(x)=x^{4}-4x^{3}$은 극댓값을 갖는다.", "a": "X", "w": "$f'(x)=4x^{2}(x-3)$은 $x=0$에서 부호가 바뀌지 않으므로 극값은 $x=3$에서의 극솟값 하나뿐이다.", "key": "Cm05-04"}, "cm05-04-3-03": {"id": "cm05-04-3-03", "unit": "m05", "concept": "04", "벌": 3, "k": "ox", "q": "함수 $f(x)=x^{3}-3x$는 열린구간 $(0,\\,2)$에서 극댓값과 극솟값을 모두 갖는다.", "a": "X", "w": "$f'(x)=3(x+1)(x-1)=0$의 두 근 중 $x=1$만 구간 안에 있으므로 극솟값만 갖는다. 극대가 되는 $x=-1$은 구간 밖이다.", "key": "Cm05-04"}, "cm05-04-3-04": {"id": "cm05-04-3-04", "unit": "m05", "concept": "04", "벌": 3, "k": "ox", "q": "삼차함수 $f(x)$가 극값을 가지면 이차방정식 $f'(x)=0$은 서로 다른 두 실근을 갖는다.", "a": "O", "w": "삼차함수가 극값을 갖는 것은 $D>0$일 때뿐이다. 중근($D=0$)이면 부호가 바뀌지 않아 극값이 없다.", "key": "Cm05-04"}, "cm05-04-3-05": {"id": "cm05-04-3-05", "unit": "m05", "concept": "04", "벌": 3, "k": "ox", "q": "최고차항의 계수가 양수인 사차함수 $f(x)$에서 삼차방정식 $f'(x)=0$이 서로 다른 세 실근을 가지면 $f(x)$는 극댓값을 두 개 갖는다.", "a": "X", "w": "$f'(x)$의 부호가 $-,\\,+,\\,-,\\,+$로 바뀌므로 극소, 극대, 극소 순이다. 극솟값이 두 개, 극댓값이 한 개이다.", "key": "Cm05-04"}, "cm05-04-3-06": {"id": "cm05-04-3-06", "unit": "m05", "concept": "04", "벌": 3, "k": "ox", "q": "최고차항의 계수가 양수인 삼차함수 $f(x)$가 극값을 가지면 $f'(x)<0$인 $x$가 존재한다.", "a": "O", "w": "이때 $f'(x)=0$이 서로 다른 두 실근을 가지므로 두 근 사이에서 $f'(x)<0$이고, 그 구간에서 $f(x)$는 감소한다.", "key": "Cm05-04"}, "cm05-04-3-07": {"id": "cm05-04-3-07", "unit": "m05", "concept": "04", "벌": 3, "k": "c4", "q": "함수 $f(x)=x^{3}-3x^{2}+kx$가 열린구간 $(0,\\,2)$에서 극댓값과 극솟값을 모두 갖도록 하는 실수 $k$의 값의 범위는 ____이다.", "a": "$0<k<3$", "c": ["$0<k<3$", "$k<3$", "$k>0$", "$0\\le k<3$"], "w": "$f'(x)=3x^{2}-6x+k$의 축 $x=1$은 구간 안에 있고, $\\frac{D}{4}=9-3k>0$, $f'(0)=k>0$, $f'(2)=k>0$이므로 $0<k<3$이다.", "key": "Cm05-04"}, "cm05-04-3-08": {"id": "cm05-04-3-08", "unit": "m05", "concept": "04", "벌": 3, "k": "c4", "q": "함수 $f(x)=x^{4}-2ax^{2}$이 극댓값을 갖도록 하는 실수 $a$의 값의 범위는 ____이다.", "a": "$a>0$", "c": ["$a>0$", "$a\\ge 0$", "$a<0$", "모든 실수 $a$"], "w": "$f'(x)=4x(x^{2}-a)=0$이 서로 다른 세 실근을 가져야 하므로 $a>0$이다. $a=0$이면 $f(x)=x^{4}$으로 극댓값이 없다.", "key": "Cm05-04"}, "cm05-05-3-01": {"id": "cm05-05-3-01", "unit": "m05", "concept": "05", "벌": 3, "k": "ox", "q": "함수 $f(x)=x^{3}-3x^{2}+3$의 극댓값 $f(0)=3$은 실수 전체의 집합에서 $f(x)$의 최댓값이다.", "a": "X", "w": "극댓값은 근처에서만 가장 크다. $f(4)=19>3$이고 $x$가 커지면 $f(x)$도 한없이 커지므로 최댓값은 없다.", "key": "Cm05-05"}, "cm05-05-3-02": {"id": "cm05-05-3-02", "unit": "m05", "concept": "05", "벌": 3, "k": "ox", "q": "최고차항의 계수가 양수인 사차함수는 실수 전체의 집합에서 최솟값을 갖는다.", "a": "O", "w": "$x$의 절댓값이 커지면 $f(x)$가 한없이 커지므로 극솟값 중 가장 작은 값이 최솟값이 된다.", "key": "Cm05-05"}, "cm05-05-3-03": {"id": "cm05-05-3-03", "unit": "m05", "concept": "05", "벌": 3, "k": "ox", "q": "닫힌구간에서 미분가능한 함수의 최댓값과 최솟값이 모두 구간의 양 끝에서 나오면, 그 구간 안에 $f'(x)=0$인 $x$는 없다.", "a": "X", "w": "$f(x)=x^{3}$은 $[-1,\\,1]$에서 최댓값 $f(1)$, 최솟값 $f(-1)$을 갖지만 $f'(0)=0$이다.", "key": "Cm05-05"}, "cm05-05-3-04": {"id": "cm05-05-3-04", "unit": "m05", "concept": "05", "벌": 3, "k": "ox", "q": "함수 $f(x)=x^{3}-3x$가 닫힌구간 $[-2,\\,2]$에서 최댓값을 갖는 $x$의 값은 $x=-1$ 하나뿐이다.", "a": "X", "w": "극댓값 $f(-1)=2$와 끝값 $f(2)=2$가 같으므로 최댓값 $2$는 $x=-1$, $x=2$ 두 곳에서 갖는다.", "key": "Cm05-05"}, "cm05-05-3-05": {"id": "cm05-05-3-05", "unit": "m05", "concept": "05", "벌": 3, "k": "ox", "q": "함수 $f(x)=x^{2}$의 닫힌구간 $[-1,\\,2]$에서의 최솟값은 $0$, 최댓값은 $4$이다.", "a": "O", "w": "구간 안의 극솟값 $f(0)=0$과 끝값 $f(-1)=1$, $f(2)=4$를 비교한다. 끝값만 보면 최솟값을 $1$로 잘못 구한다.", "key": "Cm05-05"}, "cm05-05-3-06": {"id": "cm05-05-3-06", "unit": "m05", "concept": "05", "벌": 3, "k": "c4", "q": "함수 $f(x)=2x^{3}-3x^{2}$의 닫힌구간 $[-1,\\,2]$에서의 최댓값은 ____이다.", "a": "$4$", "c": ["$4$", "$0$", "$-1$", "$-5$"], "w": "$f'(x)=6x(x-1)$이므로 극댓값 $f(0)=0$, 극솟값 $f(1)=-1$을 $f(-1)=-5$, $f(2)=4$와 비교하면 최댓값은 $4$이다.", "key": "Cm05-05"}, "cm05-05-3-07": {"id": "cm05-05-3-07", "unit": "m05", "concept": "05", "벌": 3, "k": "c4", "q": "함수 $f(x)=x^{3}-3x^{2}-9x$의 닫힌구간 $[0,\\,4]$에서의 최댓값은 ____이다.", "a": "$0$", "c": ["$0$", "$5$", "$-20$", "$-27$"], "w": "구간 안의 극값은 극솟값 $f(3)=-27$뿐이고 극댓값 $f(-1)=5$는 구간 밖이다. $f(0)=0$, $f(4)=-20$과 비교하면 최댓값은 $0$이다.", "key": "Cm05-05"}, "cm05-05-3-08": {"id": "cm05-05-3-08", "unit": "m05", "concept": "05", "벌": 3, "k": "c4", "q": "다항함수 $f(x)$가 열린구간 $(a,\\,b)$에서 극값을 갖지 않으면, 닫힌구간 $[a,\\,b]$에서의 최댓값은 ____이다.", "a": "$f(a)$와 $f(b)$ 중 큰 값", "c": ["$f(a)$와 $f(b)$ 중 큰 값", "$f(b)$", "$f(a)+f(b)$", "존재하지 않는다"], "w": "후보는 구간 안의 극값과 양 끝 값뿐인데 극값이 없으므로 양 끝 값을 비교한다. 감소하면 $f(a)$가 최댓값이다.", "key": "Cm05-05"}, "cm06-01-1-01": {"id": "cm06-01-1-01", "unit": "m06", "concept": "01", "벌": 1, "k": "ox", "q": "방정식 $f(x)=0$의 서로 다른 실근의 개수는 함수 $y=f(x)$의 그래프와 $x$축의 교점의 개수와 같다.", "a": "O", "w": "방정식 $f(x)=0$의 실근은 $y=f(x)$의 그래프와 $x$축의 교점의 $x$좌표이므로 개수가 같다.", "key": "Cm06-01"}, "cm06-01-1-02": {"id": "cm06-01-1-02", "unit": "m06", "concept": "01", "벌": 1, "k": "ox", "q": "방정식 $f(x)=g(x)$의 실근은 두 함수 $y=f(x)$, $y=g(x)$의 그래프의 교점의 $y$좌표이다.", "a": "X", "w": "실근은 교점의 $x$좌표이다. $f(x)=g(x)$를 만족시키는 것은 $x$의 값이기 때문이다.", "key": "Cm06-01"}, "cm06-01-1-03": {"id": "cm06-01-1-03", "unit": "m06", "concept": "01", "벌": 1, "k": "ox", "q": "삼차함수 $f(x)$가 극값을 갖고 (극댓값)$\\times$(극솟값)$<0$이면 방정식 $f(x)=0$은 서로 다른 세 실근을 갖는다.", "a": "O", "w": "극댓값과 극솟값의 부호가 다르면 그래프가 $x$축을 세 번 지나므로 서로 다른 세 실근을 갖는다.", "key": "Cm06-01"}, "cm06-01-1-04": {"id": "cm06-01-1-04", "unit": "m06", "concept": "01", "벌": 1, "k": "ox", "q": "삼차함수 $f(x)$가 극값을 갖고 (극댓값)$\\times$(극솟값)$>0$이면 방정식 $f(x)=0$은 실근을 갖지 않는다.", "a": "X", "w": "극댓값과 극솟값의 부호가 같으면 그래프가 $x$축과 한 번 만나므로 실근은 한 개이다. 삼차방정식은 실근을 적어도 하나 갖는다.", "key": "Cm06-01"}, "cm06-01-1-05": {"id": "cm06-01-1-05", "unit": "m06", "concept": "01", "벌": 1, "k": "ox", "q": "방정식 $x^{3}-3x-k=0$의 서로 다른 실근의 개수는 곡선 $y=x^{3}-3x$와 직선 $y=k$의 교점의 개수와 같다.", "a": "O", "w": "$x^{3}-3x-k=0$을 $x^{3}-3x=k$로 바꾸면 곡선 $y=x^{3}-3x$와 직선 $y=k$의 교점을 세는 문제가 된다.", "key": "Cm06-01"}, "cm06-01-1-06": {"id": "cm06-01-1-06", "unit": "m06", "concept": "01", "벌": 1, "k": "ox", "q": "함수 $f(x)=x^{3}-3x$의 극댓값은 $2$이므로 방정식 $x^{3}-3x=2$는 서로 다른 세 실근을 갖는다.", "a": "X", "w": "직선 $y=2$는 극대인 점에서 곡선에 접하므로 교점은 두 개이다. 서로 다른 실근은 $x=-1$(중근), $x=2$의 두 개이다.", "key": "Cm06-01"}, "cm06-01-1-07": {"id": "cm06-01-1-07", "unit": "m06", "concept": "01", "벌": 1, "k": "c4", "q": "극값을 갖는 삼차함수 $f(x)$에 대하여 방정식 $f(x)=0$이 중근과 다른 한 실근을 갖기 위한 조건은 (극댓값)$\\times$(극솟값)____ 인 것이다.", "a": "$=0$", "c": ["$=0$", "$<0$", "$>0$", "$\\le 0$"], "w": "극댓값이나 극솟값 중 하나가 $0$이면 그 점에서 그래프가 $x$축에 접하므로 중근과 다른 한 실근을 갖는다.", "key": "Cm06-01"}, "cm06-01-1-08": {"id": "cm06-01-1-08", "unit": "m06", "concept": "01", "벌": 1, "k": "c4", "q": "방정식 $x^{3}-3x^{2}+k=0$을 $x^{3}-3x^{2}=-k$로 바꾸면, 서로 다른 실근의 개수는 곡선 $y=x^{3}-3x^{2}$과 ____ 의 교점의 개수와 같다.", "a": "직선 $y=-k$", "c": ["직선 $y=-k$", "직선 $y=k$", "$x$축", "직선 $x=-k$"], "w": "우변이 $-k$이므로 곡선 $y=x^{3}-3x^{2}$과 직선 $y=-k$의 교점을 센다. 부호를 옮길 때 실수가 잦다.", "key": "Cm06-01"}, "cm06-02-1-01": {"id": "cm06-02-1-01", "unit": "m06", "concept": "02", "벌": 1, "k": "ox", "q": "함수 $f(x)$가 최솟값을 가질 때, 모든 실수 $x$에 대하여 부등식 $f(x)\\ge 0$이 성립하기 위한 필요충분조건은 $f(x)$의 최솟값이 $0$ 이상인 것이다.", "a": "O", "w": "가장 작은 값이 $0$ 이상이면 나머지 값도 모두 $0$ 이상이고, 그 역도 성립한다.", "key": "Cm06-02"}, "cm06-02-1-02": {"id": "cm06-02-1-02", "unit": "m06", "concept": "02", "벌": 1, "k": "ox", "q": "함수 $f(x)$가 최솟값을 가질 때, 모든 실수 $x$에 대하여 $f(x)>0$이 성립하려면 $f(x)$의 최솟값이 $0$ 이상이면 된다.", "a": "X", "w": "최솟값이 $0$이면 $f(x)=0$인 $x$가 있어 $f(x)>0$이 깨진다. 최솟값이 $0$보다 커야 한다.", "key": "Cm06-02"}, "cm06-02-1-03": {"id": "cm06-02-1-03", "unit": "m06", "concept": "02", "벌": 1, "k": "ox", "q": "모든 실수 $x$에 대하여 $f(x)\\ge g(x)$가 성립하는 것은 $h(x)=f(x)-g(x)$의 최솟값이 $0$ 이상인 것과 같다. (단, $h(x)$는 최솟값을 갖는다.)", "a": "O", "w": "$f(x)\\ge g(x)$는 $f(x)-g(x)\\ge 0$과 같으므로 $h(x)$ 하나의 최솟값만 조사하면 된다.", "key": "Cm06-02"}, "cm06-02-1-04": {"id": "cm06-02-1-04", "unit": "m06", "concept": "02", "벌": 1, "k": "ox", "q": "닫힌구간 $[a,\\,b]$에서 부등식 $f(x)\\ge 0$이 성립하는지 알려면 구간 안의 극솟값만 확인하면 된다.", "a": "X", "w": "구간에서의 최솟값은 극솟값과 양 끝의 함숫값 $f(a)$, $f(b)$ 중에서 정해진다. 끝값도 함께 확인해야 한다.", "key": "Cm06-02"}, "cm06-02-1-05": {"id": "cm06-02-1-05", "unit": "m06", "concept": "02", "벌": 1, "k": "ox", "q": "다항함수 $f(x)$가 $x\\ge a$에서 증가하고 $f(a)\\ge 0$이면 $x\\ge a$인 모든 $x$에 대하여 $f(x)\\ge 0$이다.", "a": "O", "w": "$x\\ge a$에서 증가하므로 이 구간의 최솟값은 $f(a)$이고, $f(a)\\ge 0$이면 부등식이 성립한다.", "key": "Cm06-02"}, "cm06-02-1-06": {"id": "cm06-02-1-06", "unit": "m06", "concept": "02", "벌": 1, "k": "ox", "q": "최고차항의 계수가 양수인 삼차함수 $f(x)$는 상수항을 충분히 크게 하면 모든 실수 $x$에 대하여 $f(x)\\ge 0$이 되게 할 수 있다.", "a": "X", "w": "삼차함수는 $x$의 값이 한없이 작아지면 함숫값도 한없이 작아지므로 최솟값이 없다. 상수항으로는 막을 수 없다.", "key": "Cm06-02"}, "cm06-02-1-07": {"id": "cm06-02-1-07", "unit": "m06", "concept": "02", "벌": 1, "k": "c4", "q": "모든 실수 $x$에 대하여 부등식 $x^{4}-4x+k\\ge 0$이 성립하기 위한 조건은 ____ 이다.", "a": "$k\\ge 3$", "c": ["$k\\ge 3$", "$k>3$", "$k\\ge 4$", "$k\\ge -3$"], "w": "$f(x)=x^{4}-4x+k$에서 $f'(x)=4(x-1)(x^{2}+x+1)$이므로 최솟값은 $f(1)=k-3$이다. $k-3\\ge 0$에서 $k\\ge 3$이다.", "key": "Cm06-02"}, "cm06-02-1-08": {"id": "cm06-02-1-08", "unit": "m06", "concept": "02", "벌": 1, "k": "c4", "q": "$x>0$인 모든 $x$에 대하여 $f(x)=x^{3}-3x+k>0$이 성립하기 위한 조건은 $x>0$에서 $f(x)$의 ____ 이 양수인 것이다.", "a": "최솟값", "c": ["최솟값", "최댓값", "극댓값", "$x=0$에서의 함숫값"], "w": "$x>0$에서 $f(x)$는 $x=1$에서 최솟값 $k-2$를 가지므로, 이 값이 양수이면 된다.", "key": "Cm06-02"}, "cm06-03-1-01": {"id": "cm06-03-1-01", "unit": "m06", "concept": "03", "벌": 1, "k": "ox", "q": "수직선 위를 움직이는 점 $\\mathrm{P}$의 시각 $t$에서의 위치가 $x=f(t)$이면 시각 $t$에서의 점 $\\mathrm{P}$의 속도는 $v=f'(t)$이다.", "a": "O", "w": "속도는 위치의 순간변화율, 곧 $\\dfrac{dx}{dt}=f'(t)$이다.", "key": "Cm06-03"}, "cm06-03-1-02": {"id": "cm06-03-1-02", "unit": "m06", "concept": "03", "벌": 1, "k": "ox", "q": "수직선 위를 움직이는 점의 시각 $t$에서의 가속도는 위치 $x$를 $t$에 대하여 미분한 것이다.", "a": "X", "w": "위치를 미분하면 속도이다. 가속도는 속도 $v$를 $t$에 대하여 미분한 $\\dfrac{dv}{dt}$이다.", "key": "Cm06-03"}, "cm06-03-1-03": {"id": "cm06-03-1-03", "unit": "m06", "concept": "03", "벌": 1, "k": "ox", "q": "수직선 위를 움직이는 점 $\\mathrm{P}$의 속도가 음수이면 점 $\\mathrm{P}$는 음의 방향으로 움직인다.", "a": "O", "w": "속도의 부호가 운동 방향을 나타낸다. $v>0$이면 양의 방향, $v<0$이면 음의 방향이다.", "key": "Cm06-03"}, "cm06-03-1-04": {"id": "cm06-03-1-04", "unit": "m06", "concept": "03", "벌": 1, "k": "ox", "q": "속도가 $-3$인 점의 속력은 $-3$이다.", "a": "X", "w": "속력은 속도의 절댓값이므로 $|-3|=3$이다.", "key": "Cm06-03"}, "cm06-03-1-05": {"id": "cm06-03-1-05", "unit": "m06", "concept": "03", "벌": 1, "k": "ox", "q": "수직선 위를 움직이는 점의 속도가 $0$인 순간에는 항상 운동 방향이 바뀐다.", "a": "X", "w": "속도의 부호가 바뀌어야 운동 방향이 바뀐다. 예를 들어 $v=(t-1)^{2}$은 $t=1$에서 $0$이지만 방향이 바뀌지 않는다.", "key": "Cm06-03"}, "cm06-03-1-06": {"id": "cm06-03-1-06", "unit": "m06", "concept": "03", "벌": 1, "k": "ox", "q": "수직선 위를 움직이는 점 $\\mathrm{P}$의 시각 $t$에서의 위치가 $x=t^{2}-4t$이면 점 $\\mathrm{P}$는 $t=2$에서 운동 방향을 바꾼다.", "a": "O", "w": "$v=2t-4$는 $t=2$의 좌우에서 음에서 양으로 부호가 바뀐다.", "key": "Cm06-03"}, "cm06-03-1-07": {"id": "cm06-03-1-07", "unit": "m06", "concept": "03", "벌": 1, "k": "c4", "q": "수직선 위를 움직이는 점 $\\mathrm{P}$의 시각 $t$에서의 위치가 $x=t^{3}-3t^{2}$일 때, $t=1$에서의 점 $\\mathrm{P}$의 가속도는 ____ 이다.", "a": "$0$", "c": ["$0$", "$-3$", "$-2$", "$3$"], "w": "$v=3t^{2}-6t$, $a=6t-6$이므로 $t=1$에서 가속도는 $0$이다. $-3$은 속도, $-2$는 위치이다.", "key": "Cm06-03"}, "cm06-03-1-08": {"id": "cm06-03-1-08", "unit": "m06", "concept": "03", "벌": 1, "k": "c4", "q": "지면에서 똑바로 위로 던진 물체가 최고 높이에 도달하는 순간 물체의 ____ 이다.", "a": "속도는 $0$", "c": ["속도는 $0$", "가속도는 $0$", "높이는 $0$", "속력은 최대"], "w": "올라가던 물체가 내려오기 시작하는 순간이므로 속도의 부호가 양에서 음으로 바뀌고, 그때 속도는 $0$이다.", "key": "Cm06-03"}, "cm06-04-1-01": {"id": "cm06-04-1-01", "unit": "m06", "concept": "04", "벌": 1, "k": "ox", "q": "시각 $t$에서의 길이가 $l(t)$일 때, 시각 $t$에서의 길이의 변화율은 $l'(t)$이다.", "a": "O", "w": "시각에 대한 변화율은 시각 $t$에 대하여 미분한 값이다.", "key": "Cm06-04"}, "cm06-04-1-02": {"id": "cm06-04-1-02", "unit": "m06", "concept": "04", "벌": 1, "k": "ox", "q": "시각 $t=a$에서의 넓이의 변화율은 $t=a$에서의 넓이 $S(a)$와 같다.", "a": "X", "w": "변화율은 $S'(a)$이다. 넓이 자체와 넓이가 변하는 빠르기는 다르다.", "key": "Cm06-04"}, "cm06-04-1-03": {"id": "cm06-04-1-03", "unit": "m06", "concept": "04", "벌": 1, "k": "ox", "q": "$t$초 후 한 변의 길이가 $(2+t)\\,\\mathrm{cm}$인 정사각형의 $t$초 후의 넓이의 변화율은 $2(2+t)$이다.", "a": "O", "w": "$S=(2+t)^{2}=t^{2}+4t+4$이므로 $S'=2t+4=2(2+t)$이다.", "key": "Cm06-04"}, "cm06-04-1-04": {"id": "cm06-04-1-04", "unit": "m06", "concept": "04", "벌": 1, "k": "ox", "q": "반지름의 길이가 매초 $1\\,\\mathrm{cm}$씩 늘어나는 원의 넓이는 매초 같은 양만큼 늘어난다.", "a": "X", "w": "처음 반지름을 $r$라 하면 $S=\\pi(r+t)^{2}=\\pi(t^{2}+2rt+r^{2})$이고 $S'=\\pi(2t+2r)$는 시간에 따라 커진다. 넓이가 늘어나는 빠르기가 점점 커진다.", "key": "Cm06-04"}, "cm06-04-1-05": {"id": "cm06-04-1-05", "unit": "m06", "concept": "04", "벌": 1, "k": "ox", "q": "$t$초 후 한 모서리의 길이가 $(1+t)\\,\\mathrm{cm}$인 정육면체의 $t=1$에서의 부피의 변화율은 $8$이다.", "a": "X", "w": "$V=(1+t)^{3}=t^{3}+3t^{2}+3t+1$, $V'=3t^{2}+6t+3$이므로 $t=1$에서 $12$이다. $8$은 그때의 부피이다.", "key": "Cm06-04"}, "cm06-04-1-06": {"id": "cm06-04-1-06", "unit": "m06", "concept": "04", "벌": 1, "k": "ox", "q": "시각 $t$에서의 부피가 $V(t)$일 때, $t=a$에서 $t=b$까지의 부피의 평균변화율은 $\\dfrac{V(b)-V(a)}{b-a}$이다.", "a": "O", "w": "평균변화율의 정의 그대로이다. $b\\to a$일 때의 극한이 $t=a$에서의 부피의 변화율 $V'(a)$이다.", "key": "Cm06-04"}, "cm06-04-1-07": {"id": "cm06-04-1-07", "unit": "m06", "concept": "04", "벌": 1, "k": "c4", "q": "$t$초 후 반지름의 길이가 $(3+t)\\,\\mathrm{cm}$인 원의 $t$초 후의 넓이의 변화율은 ____ 이다.", "a": "$2\\pi(3+t)$", "c": ["$2\\pi(3+t)$", "$\\pi(3+t)^{2}$", "$2\\pi(3+t)^{2}$", "$\\pi(3+t)$"], "w": "$S=\\pi(3+t)^{2}=\\pi(t^{2}+6t+9)$이므로 $S'=\\pi(2t+6)=2\\pi(3+t)$이다.", "key": "Cm06-04"}, "cm06-04-1-08": {"id": "cm06-04-1-08", "unit": "m06", "concept": "04", "벌": 1, "k": "c4", "q": "시각에 대한 변화율을 구할 때는 먼저 길이·넓이·부피를 ____ 에 대한 식으로 나타낸다.", "a": "시각 $t$", "c": ["시각 $t$", "반지름의 길이 $r$", "넓이 $S$", "변화율"], "w": "시각 $t$에 대한 식으로 나타낸 뒤 $t$에 대하여 미분한다.", "key": "Cm06-04"}, "cm06-01-2-01": {"id": "cm06-01-2-01", "unit": "m06", "concept": "01", "벌": 2, "k": "ox", "q": "방정식 $f(x)=0$의 양의 실근은 곡선 $y=f(x)$가 $x$축의 양의 부분과 만나는 점의 $x$좌표이다.", "a": "O", "w": "실근은 $x$축과의 교점의 $x$좌표이므로, 양의 실근은 $y$축의 오른쪽에서 만나는 점으로 읽는다.", "key": "Cm06-01"}, "cm06-01-2-02": {"id": "cm06-01-2-02", "unit": "m06", "concept": "01", "벌": 2, "k": "ox", "q": "두 곡선 $y=f(x)$, $y=g(x)$의 교점의 개수는 방정식 $f(x)-g(x)=0$의 서로 다른 실근의 개수와 같다.", "a": "O", "w": "$f(x)=g(x)$와 $f(x)-g(x)=0$은 같은 방정식이므로 $h(x)=f(x)-g(x)$의 그래프와 $x$축의 교점을 세면 된다.", "key": "Cm06-01"}, "cm06-01-2-03": {"id": "cm06-01-2-03", "unit": "m06", "concept": "01", "벌": 2, "k": "ox", "q": "삼차방정식 $f(x)=0$이 서로 다른 세 실근을 가지면 $f(x)$의 극댓값과 극솟값은 모두 양수이다.", "a": "X", "w": "서로 다른 세 실근을 가지려면 극댓값과 극솟값의 부호가 달라야 한다. 곧 (극댓값)$\\times$(극솟값)$<0$이다.", "key": "Cm06-01"}, "cm06-01-2-04": {"id": "cm06-01-2-04", "unit": "m06", "concept": "01", "벌": 2, "k": "ox", "q": "곡선 $y=x^{3}-3x^{2}$과 직선 $y=k$가 서로 다른 세 점에서 만나도록 하는 $k$의 값의 범위는 $-4\\le k\\le 0$이다.", "a": "X", "w": "극댓값 $f(0)=0$, 극솟값 $f(2)=-4$이다. $k=0$이나 $k=-4$이면 접하여 교점이 두 개이므로 범위는 $-4<k<0$이다.", "key": "Cm06-01"}, "cm06-01-2-05": {"id": "cm06-01-2-05", "unit": "m06", "concept": "01", "벌": 2, "k": "ox", "q": "방정식 $x^{3}-3x+1=0$은 음의 실근을 갖지 않는다.", "a": "X", "w": "$f(x)=x^{3}-3x+1$에서 $f(-2)=-1<0$, $f(-1)=3>0$이므로 $-2$와 $-1$ 사이에 음의 실근이 있다.", "key": "Cm06-01"}, "cm06-01-2-06": {"id": "cm06-01-2-06", "unit": "m06", "concept": "01", "벌": 2, "k": "ox", "q": "곡선 밖의 한 점에서 삼차함수의 그래프에 그은 접선의 개수는 접점의 $x$좌표 $t$에 대한 방정식의 서로 다른 실근의 개수와 같다.", "a": "O", "w": "삼차함수의 그래프에서는 접점이 다르면 접선도 다르므로, 접점의 $x$좌표 $t$의 개수가 곧 접선의 개수이다.", "key": "Cm06-01"}, "cm06-01-2-07": {"id": "cm06-01-2-07", "unit": "m06", "concept": "01", "벌": 2, "k": "c4", "q": "곡선 $y=x^{3}$ 위의 점 $(t,\\,t^{3})$에서의 접선이 점 $(1,\\,0)$을 지나기 위한 조건은 ____ 이다.", "a": "$3t^{2}-2t^{3}=0$", "c": ["$3t^{2}-2t^{3}=0$", "$3t^{2}(1-t)=0$", "$3t^{2}+2t^{3}=0$", "$t^{3}-3t^{2}+1=0$"], "w": "접선은 $y=3t^{2}(x-t)+t^{3}$이다. $x=1$, $y=0$을 넣으면 $0=3t^{2}-3t^{3}+t^{3}=3t^{2}-2t^{3}$이다.", "key": "Cm06-01"}, "cm06-01-2-08": {"id": "cm06-01-2-08", "unit": "m06", "concept": "01", "벌": 2, "k": "c4", "q": "방정식 $f(x)=0$이 서로 다른 두 양의 실근과 한 음의 실근을 갖는다는 것은 곡선 $y=f(x)$가 $x$축과 ____ 만난다는 뜻이다.", "a"
