(x)\\searrow -17\\nearrow 15\\searrow $<br>따라서 함수 $f(x)$는 $x=1$에서 극댓값 $15$을 갖는다.", "k": "num", "a": "15", "q": "함수 $f(x)=-x^{3}+ax^{2}+bx+10$이 $x=-3$에서 극솟값 $-17$을 가질 때, 함수 $f(x)$의 극댓값을 구하시오. (단, $a,\\;b$는 상수이다.)", "key": "Tm05-05"}, "x05x75-022": {"id": "x05x75-022", "unit": "m05", "theme": "05", "벌": "X05x75", "lvl": 2, "fix": true, "src": "문제집 바이블개념ON", "w": "$f(x)=-2x^{3}+ax^{2}+bx+3$에서<br>$f' (x)=-6x^{2}+2ax+b$<br>함수 $f(x)$가 $x=-1,\\;x=2$에서 극값을 가지므로<br>$f' (-1)=0$, $f' (2)=0$<br>즉, 이차방정식 $f' (x)=0$의 두 실근이 $x=-1,\\;x=2$이므로<br>$f' (x)=-6(x+1)(x-2)=-6x^{2}+6x+12$<br>따라서 $2a=6,\\;b=12$이므로<br>$a=3,\\;b=12$<br>$f(x)=-2x^{3}+3x^{2}+12x+3$이므로<br>$f(-1)=2+3-12+3=-4$<br>$f(2)=(-16)+12+24+3=23$<br>따라서 함수 $f(x)$의 극댓값과 극솟값의 합은<br>$23+(-4)=19$", "k": "num", "a": "19", "q": "함수 $f(x)=-2x^{3}+ax^{2}+bx+3$이 $x=-1$에서 극솟값을 갖고, $x=2$에서 극댓값을 가질 때, 함수 $f(x)$의 극댓값과 극솟값의 합을 구하시오. (단, $a,\\;b$는 상수이다.)", "key": "Tm05-05"}, "x05x75-023": {"id": "x05x75-023", "unit": "m05", "theme": "05", "벌": "X05x75", "lvl": 2, "fix": true, "src": "문제집 바이블개념ON", "w": "$f(x)=\\dfrac{1}{2}x^{3}-3ax^{2}+2a$에서<br>$f' (x)=\\dfrac{3}{2}x^{2}-6ax=\\dfrac{3}{2}x(x-4a)$<br>$f' (x)=0$에서 $x=0$ 또는 $x=4a$<br>함수 $f(x)$의 증가와 감소를 표로 나타내면 다음과 같다.<br>$x\\cdots 0\\cdots 4a\\cdots f' (x)+0-0+f(x)\\nearrow 2a\\searrow -16a^{3}+2a\\nearrow $<br>함수 $f(x)$는 $x=0$에서 극댓값 $2a$, $x=4a$에서 극솟값<br>$-16a^{3}+2a$를 갖고, 극댓값과 극솟값의 절댓값이 같으므로<br>$2a+(-16a^{3}+2a)=0$, $-4a(2a+1)(2a-1)=0$<br>$\\therefore \\;a=\\dfrac{1}{2}$ ($\\because \\;a>0$)", "k": "num", "a": "1/2", "q": "함수 $f(x)=\\dfrac{1}{2}x^{3}-3ax^{2}+2a$의 극댓값과 극솟값의 절댓값이 같을 때, 양수 $a$의 값을 구하시오.", "key": "Tm05-05"}, "x05x75-024": {"id": "x05x75-024", "unit": "m05", "theme": "05", "벌": "X05x75", "lvl": 2, "fix": true, "src": "문제집 바이블개념ON", "w": "$f(x)=x^{3}+ax^{2}+bx+2$에서<br>$f' (x)=3x^{2}+2ax+b$<br>미분가능한 함수 $f(x)$가 $x=-2$에서 극값을 가지므로<br>$f' (-2)=12-4a+b=0$<br>$\\therefore \\;4a-b=12\\cdots \\cdots $㉠<br>곡선 $y=f(x)$ 위의 $x=2$인 점에서의 접선의 기울기가 $12$이므로<br>$f' (2)=12+4a+b=12$<br>$\\therefore \\;4a+b=0\\cdots \\cdots $㉡<br>㉠, ㉡에서 $a=\\dfrac{3}{2}$, $b=-6$<br>따라서 $f(x)=x^{3}+\\dfrac{3}{2}x^{2}-6x+2$이므로<br>$f' (x)=3x^{2}+3x-6=3(x+2)(x-1)$<br>$f' (x)=0$에서 $x=-2$ 또는 $x=1$<br>함수 $f(x)$의 증가와 감소를 표로 나타내면 다음과 같다.<br>$x\\cdots -2\\cdots 1\\cdots f' (x)+0-0+f(x)\\nearrow 12\\searrow -\\dfrac{3}{2}\\nearrow $<br>따라서 함수 $f(x)$는 $x=1$에서 극솟값 $-\\dfrac{3}{2}$을 갖는다.", "k": "num", "a": "-3/2", "q": "함수 $f(x)=x^{3}+ax^{2}+bx+2$가 $x=-2$에서 극값을 갖고, 곡선 $y=f(x)$ 위의 $x=2$인 점에서의 접선의 기울기가 $12$이다. 함수 $f(x)$의 극솟값을 구하시오.", "key": "Tm05-05"}, "x05x9-010": {"id": "x05x9-010", "unit": "m05", "theme": "05", "벌": "X05x9", "lvl": 2, "fix": true, "src": "주간고사 5회", "w": "$f(x)=-2x^{3}+ax^{2}+bx+c,$<br>$f'(x)=-6x^{2}+2ax+b$에서,<br>$f'(0)=0,\\;f'(-1)=0,\\;f(-1)=-2$ 이므로,<br>$f'(0)=b=0,$<br>$f'(-1)=-6-2a=0,\\;a=-3$<br>$f(x)=-2x^{3}-3x^{2}+c$<br>$f(-1)=2-3+c=-2,\\;c=-1$<br>$\\therefore $ 극댓값은, $f(0)=c=-1$", "k": "c5", "c": ["$-2$", "$0$", "$-1$", "$2$", "$3$"], "a": "$-1$", "q": "함수 $f(x)=-2x^{3}+ax^{2}+bx+c$는 $x=0$에서 극댓값, $x=-1$에서 극솟값을 가지며 극솟값은 $-2$이다. 이 때, 극댓값은?<br>", "key": "Tm05-05"}, "x05x107-116": {"id": "x05x107-116", "unit": "m05", "theme": "06", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=-x^{3}+3x^{2}+4x+2$의 닫힌구간 $[\\,a,\\;a+1\\,]$에서의 평균변화율 $F(a)$는<br>$F(a)=\\dfrac{f(a+1)-f(a)}{a+1-a}$<br>$=-(a+1)^{3}+3(a+1)^{2}+4(a+1)+2-(-a^{3}+3a^{2}+4a+2)$<br>$=-3a^{2}+3a+6$<br>이므로 $F' (a)=-6a+3$<br>$F' (a)=0$인 $a$의 값은 $a=\\dfrac{1}{2}$<br>$a=\\dfrac{1}{2}$의 좌우에서 $F' (a)$의 부호가 양에서 음으로 바뀌므로<br>$F(a)$는 $a=\\dfrac{1}{2}$에서 극대이다.", "k": "num", "a": "1/2", "q": "함수 $f(x)=-x^{3}+3x^{2}+4x+2$의 닫힌구간 $[\\,a,\\;a+1\\,]$에서의 평균변화율을 $F(a)$라 할 때, 함수 $F(a)$가 극대가 되는 $a$의 값을 구하시오.", "key": "Tm05-06"}, "x05x107-117": {"id": "x05x107-117", "unit": "m05", "theme": "06", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=x^{3}-3ax^{2}+a^{3}$에서<br>$f' (x)=3x^{2}-6ax=3x(x-2a)$<br>$f' (x)=0$인 $x$의 값은 $x=0$ 또는 $x=2a$<br>$a>0$이므로 함수 $f(x)$의 증가, 감소를 표로 나타내면 다음과 같다.<br>$x{\\cdots }0{\\cdots }2a{\\cdots }f' (x)+0-0+f(x)\\nearrow a^{3}$<br>극대$\\searrow -3a^{3}$<br>극소$\\nearrow $<br>함수 $f(x)$가 극대인 점과 극소인 점의 좌표는 각각 $(0,\\;a^{3})$, $(2a,\\;-3a^{3})$이므로 두 점을 잇는 선분의 중점은 $\\mathrm{M}(a,\\;-a^{3})$<br>따라서 점 $\\mathrm{M}$이 나타내는 도형의 방정식은<br>$y=-x^{3}\\;(x>0)$", "k": "c5", "c": ["$y=-2x^{3}\\;(x>0)$", "$y=-x^{3}\\;(x>0)$", "$y=-x\\;(x>0)$", "$y=x^{2}\\;(x>0)$", "$y=2x^{3}\\;(x>0)$"], "a": "$y=-x^{3}\\;(x>0)$", "q": "함수 $f(x)=x^{3}-3ax^{2}+a^{3}$의 그래프에서 극대인 점과 극소인 점을 잇는 선분의 중점 $\\mathrm{M}$이 나타내는 도형의 방정식은? (단, $a>0$)", "key": "Tm05-06"}, "x05x107-121": {"id": "x05x107-121", "unit": "m05", "theme": "06", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "삼차함수 $f(x)$에 대하여 이차방정식 $f' (x)=0$의 두 실근이 $\\alpha $, $\\beta $이므로 $f' (\\alpha )=f' (\\beta )=0$이다.<br>즉, $f(\\alpha ),\\;f(\\beta )$는 함수 $f(x)$의 극값이다.<br>(나)에서 $\\sqrt{(\\beta -\\alpha )^{2}+\\left\\{f(\\beta )-f(\\alpha )\\right\\}^{2}}=26$이므로<br>$\\left.(\\beta -\\alpha \\right)^{2}+\\left\\{f(\\beta )-f(\\alpha )\\right\\}^{2}=26^{2}$<br>$10^{2}+\\left\\{f(\\beta )-f(\\alpha )\\right\\}^{2}=26^{2}$ ($\\because $<br>(가))<br>$\\left\\{f(\\beta )-f(\\alpha )\\right\\}^{2}=576$<br>$\\therefore \\;|\\,f(\\beta )-f(\\alpha )\\,|=24$<br>따라서 함수 $f(x)$의 극댓값과 극솟값의 차는 $24$이다.", "k": "c5", "c": ["$12\\sqrt{2}$", "$18$", "$24$", "$30$", "$24\\sqrt{2}$"], "a": "$24$", "q": "삼차함수 $f(x)$에 대하여 방정식 $f' (x)=0$의 두 실근 $\\alpha ,\\;\\beta $는 다음 조건을 만족시킨다.<br>(가) $|\\,\\alpha -\\beta \\,|=10$<br>(나) 두 점 $(\\,\\alpha ,\\;f(\\alpha )\\,)$, $(\\,\\beta ,\\;f(\\beta )\\,)$ 사이의 거리는 $26$이다.<br>함수 $f(x)$의 극댓값과 극솟값의 차는?", "key": "Tm05-06"}, "x05x107-124": {"id": "x05x107-124", "unit": "m05", "theme": "06", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=x^{3}+(a-1)x^{2}+(2a-5)x$에서<br>$f' (x)=3x^{2}+2(a-1)x+2a-5$<br>삼차함수 $f(x)$가 극값을 가지지 않으려면 이차방정식 $f' (x)=0$이 중근 또는 허근을 가져야 한다.<br>이차방정식 $3x^{2}+2(a-1)x+2a-5=0$의 판별식을 $D$라 하면<br>$\\dfrac{D}{4}\\le 0$에서 $(a-1)^{2}-3(2a-5)\\le 0,\\;(a-4)^{2}\\le 0$<br>$\\therefore \\;a=4$<br>따라서 함수 $f(x)$가 극값을 가지지 않도록 하는 실수 $a$의 값은 $4$이다.", "k": "num", "a": "4", "q": "함수 $f(x)=x^{3}+(a-1)x^{2}+(2a-5)x$가 극값을 가지지 않도록 하는 실수 $a$의 값을 구하는 과정을 서술하시오.", "key": "Tm05-06"}, "x05x107-127": {"id": "x05x107-127", "unit": "m05", "theme": "06", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "(가)에서 삼차함수 $y=f(x)$의 그래프는 원점에 대하여 대칭이다.<br>$f(x)$는 최고차항의 계수가 $1$인 삼차함수이므로<br>$f(x)=x^{3}+ax$ ($a$는 상수)라 하자.<br>$f' (x)=3x^{2}+a$이고 (나)에서 $f' (2)=0$이므로<br>$12+a=0\\therefore \\;a=-12$<br>$\\therefore \\;f(x)=x^{3}-12x$<br>$f' (x)=3x^{2}-12=3(x+2)(x-2)$<br>$f' (x)=0$인 $x$의 값은 $x=-2$ 또는 $x=2$<br>함수 $f(x)$의 증가, 감소를 표로 나타내면 다음과 같다.<br>$x{\\cdots }-2{\\cdots }2{\\cdots }f' (x)+0-0+f(x)\\nearrow 16$<br>극대$\\searrow -16$<br>극소$\\nearrow $<br>따라서 함수 $f(x)$의 극댓값은<br>$f(-2)=16$", "k": "num", "a": "16", "q": "최고차항의 계수가 $1$인 삼차함수 $f(x)$가 다음 조건을 만족시킬 때, 함수 $f(x)$의 극댓값을 구하는 과정을 서술하시오. [$8$점]<br>(가) $f(-x)=-f(x)$<br>(나) $f' (2)=0$", "key": "Tm05-06"}, "x05x107-128": {"id": "x05x107-128", "unit": "m05", "theme": "06", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "최고차항의 계수가 $1$인 삼차함수 $f(x)$를<br>$f(x)=x^{3}+ax^{2}+bx+c$ ($a$, $b$, $c$는 상수)라 하면<br>$f' (x)=3x^{2}+2ax+b$<br>(가)에서 함수 $y=f' (x)$의 그래프는 $y$축에 대하여 대칭이므로<br>$a=0$<br>$\\therefore \\;f' (x)=3x^{2}+b$, $f(x)=x^{3}+bx+c$<br>(나)에서 함수 $f(x)$는 $x=2$에서 극솟값 $0$을 가지므로<br>$f' (2)=0,\\;f(2)=0$<br>$f' (2)=0$에서 $12+b=0$<br>$\\therefore \\;b=-12$<br>$f(2)=0$에서 $8+2b+c=0$<br>$\\therefore \\;c=16$<br>$\\therefore f(x)=x^{3}-12x+16$<br>$f' (x)=3x^{2}-12=3(x+2)(x-2)$<br>$f' (x)=0$인 $x$의 값은 $x=-2$ 또는 $x=2$<br>함수 $f(x)$의 증가, 감소를 표로 나타내면 다음과 같다.<br>$x{\\cdots }-2{\\cdots }2{\\cdots }f' (x)+0-0+f(x)\\nearrow 32$<br>극대$\\searrow 0$<br>극소$\\nearrow $<br>따라서 함수 $f(x)$의 극댓값은 $f(-2)=32$이다.", "k": "num", "a": "32", "q": "최고차항의 계수가 $1$인 삼차함수 $f(x)$가 다음 조건을 만족시킬 때, 함수 $f(x)$의 극댓값을 구하는 과정을 서술하시오.<br>(가) 모든 실수 $x$에 대하여 $f' (x)=f' (-x)$이다.<br>(나) 함수 $f(x)$는 $x=2$에서 극솟값 $0$을 가진다.", "key": "Tm05-06"}, "x05x107-131": {"id": "x05x107-131", "unit": "m05", "theme": "06", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=-x^{3}+ax^{2}+(a^{2}-3)x-2$에서<br>$f' (x)=-3x^{2}+2ax+a^{2}-3$<br>함수 $f(x)$가 실수 전체의 집합에서 감소하려면 모든 실수 $x$에서<br>$f' (x)\\le 0$이어야 한다. 이차방정식 $-3x^{2}+2ax+a^{2}-3=0$의<br>판별식을 $D$라 하면<br>$\\dfrac{D}{4}\\le 0$에서 $a^{2}+3(a^{2}-3)\\le 0,\\;4a^{2}-9\\le 0$<br>$(2a+3)(2a-3)\\le 0\\therefore \\;-\\dfrac{3}{2}\\le a\\le \\dfrac{3}{2}$<br>따라서 실수 $a$의 최댓값은 $\\dfrac{3}{2}$이다.", "k": "c5", "c": ["$\\dfrac{1}{2}$", "$1$", "$\\dfrac{3}{2}$", "$2$", "$\\dfrac{5}{2}$"], "a": "$\\dfrac{3}{2}$", "q": "함수 $f(x)=-x^{3}+ax^{2}+(a^{2}-3)x-2$가 실수 전체의 집합에서 감소하도록 하는 실수 $a$의 최댓값은?", "key": "Tm05-06"}, "x05x107-132": {"id": "x05x107-132", "unit": "m05", "theme": "06", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=\\dfrac{1}{3}x^{3}+x^{2}+ax+3$에서<br>$f' (x)=x^{2}+2x+a$<br>함수 $f(x)$가 $x>1$에서 증가하려면 $x>1$에서 $f' (x)\\ge 0$이어야 하므로 $f' (1)\\ge 0$에서<br>$3+a\\ge 0\\therefore \\;a\\ge -3$<br>따라서 실수 $a$의 최솟값은 $-3$이다.", "k": "c5", "c": ["$-3$", "$-1$", "$0$", "$1$", "$3$"], "a": "$-3$", "q": "함수 $f(x)=\\dfrac{1}{3}x^{3}+x^{2}+ax+3$이 $x>1$에서 증가하도록 하는 실수 $a$의 최솟값은?", "key": "Tm05-06"}, "x05x107-133": {"id": "x05x107-133", "unit": "m05", "theme": "06", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=x^{3}-ax^{2}+(a+6)x+5$에서<br>$f' (x)=3x^{2}-2ax+a+6$<br>함수 $f(x)$의 역함수가 존재하려면 $f(x)$가 일대일대응이어야 하고,<br>$f(x)$의 최고차항의 계수가 양수이므로 함수 $f(x)$는 실수 전체의 집합에서 증가해야 한다.<br>즉, 모든 실수 $x$에 대하여 $f' (x)\\ge 0$이어야 한다.<br>이차방정식 $3x^{2}-2ax+a+6=0$의 판별식을 $D$라 하면 $\\dfrac{D}{4}\\le 0$에서<br>$a^{2}-3(a+6)\\le 0$<br>$a^{2}-3a-18\\le 0,\\;(a+3)(a-6)\\le 0$<br>$\\therefore \\;-3\\le a\\le 6$<br>따라서 $M=6,\\;m=-3$이므로<br>$M-m=9$", "k": "c5", "c": ["$5$", "$6$", "$7$", "$8$", "$9$"], "a": "$9$", "q": "함수 $f(x)=x^{3}-ax^{2}+(a+6)x+5$가 역함수를 가지도록 하는 실수 $a$의 최댓값을 $M$, 최솟값을 $m$이라 할 때, $M-m$의 값은?", "key": "Tm05-06"}, "x05x107-134": {"id": "x05x107-134", "unit": "m05", "theme": "06", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=-x^{3}+ax^{2}+bx-5$에서<br>$f' (x)=-3x^{2}+2ax+b$<br>함수 $f(x)$가 $x=-3$에서 극솟값 $-32$를 가지므로<br>$f' (-3)=0,\\;f(-3)=-32$<br>$f' (-3)=0$에서 $-27-6a+b=0$<br>$\\therefore \\;6a-b=-27\\cdots \\cdots $㉠<br>$f(-3)=-32$에서 $27+9a-3b-5=-32$<br>$\\therefore \\;3a-b=-18\\cdots \\cdots $㉡<br>㉠, ㉡을 연립하여 풀면 $a=-3,\\;b=9$<br>즉, $f(x)=-x^{3}-3x^{2}+9x-5$이므로<br>$f(2)=-8-12+18-5=-7$", "k": "c5", "c": ["$-10$", "$-9$", "$-8$", "$-7$", "$-6$"], "a": "$-7$", "q": "함수 $f(x)=-x^{3}+ax^{2}+bx-5$가 $x=-3$에서 극솟값 $-32$를 가질 때, $f(2)$의 값은? (단, $a,\\;b$는 상수이다.)", "key": "Tm05-06"}, "x05x107-136": {"id": "x05x107-136", "unit": "m05", "theme": "06", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=x^{3}+ax^{2}+3ax+1$에서<br>$f' (x)=3x^{2}+2ax+3a$<br>$x_{1}<x_{2}$인 임의의 두 실수 $x_{1},\\;x_{2}$에 대하여 $f(x_{1})<f(x_{2})$가 성립하려면 함수 $f(x)$가 실수 전체의 집합에서 증가해야 한다.<br>즉, 모든 실수 $x$에 대하여 $f' (x)\\ge 0$이어야 한다.<br>이차방정식 $3x^{2}+2ax+3a=0$의 판별식을 $D$라 하면 $\\dfrac{D}{4}\\le 0$에서<br>$a^{2}-9a\\le 0,\\;a(a-9)\\le 0$<br>$\\therefore \\;0\\le a\\le 9$<br>따라서 정수 $a$의 최댓값은 $9$, 최솟값은 $0$이므로<br>$M=9,\\;m=0$<br>$\\therefore \\;M-m=9$", "k": "c5", "c": ["$6$", "$7$", "$8$", "$9$", "$10$"], "a": "$9$", "q": "함수 $f(x)=x^{3}+ax^{2}+3ax+1$이 $x_{1}<x_{2}$인 임의의 두 실수 $x_{1},\\;x_{2}$에 대하여 $f(x_{1})<f(x_{2})$가 성립하도록 하는 정수 $a$의 최댓값을 $M$, 최솟값을 $m$이라 하자. $M-m$의 값은?", "key": "Tm05-06"}, "x05x107-137": {"id": "x05x107-137", "unit": "m05", "theme": "06", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=x^{3}+ax^{2}+bx$에서<br>$f' (x)=3x^{2}+2ax+b$<br>함수 $f(x)$가 $x=-1$에서 극값을 가지므로 $f' (-1)=0$에서<br>$3-2a+b=0$<br>$\\therefore \\;2a-b=3\\cdots \\cdots $㉠<br>곡선 $y=f(x)$ 위의 $x=1$인 점에서의 접선의 기울기가 $8$이므로 $f' (1)=8$에서<br>$3+2a+b=8$<br>$\\therefore \\;2a+b=5\\cdots \\cdots $㉡<br>㉠, ㉡을 연립하여 풀면 $a=2,\\;b=1$<br>따라서 $f(x)=x^{3}+2x^{2}+x$이므로<br>$f(-2)=-8+8-2=-2$", "k": "c5", "c": ["$-4$", "$-3$", "$-2$", "$-1$", "$0$"], "a": "$-2$", "q": "함수 $f(x)=x^{3}+ax^{2}+bx$가 $x=-1$에서 극값을 가지고, 곡선 $y=f(x)$ 위의 $x=1$인 점에서의 접선의 기울기가 $8$일 때, $f(-2)$의 값은? (단, $a,\\;b$는 상수이다.)", "key": "Tm05-06"}, "x05x107-138": {"id": "x05x107-138", "unit": "m05", "theme": "06", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=x^{3}+ax^{2}+bx$에서<br>$f' (x)=3x^{2}+2ax+b$<br>삼차함수 $f(x)$가 $x=\\alpha ,\\;x=\\beta $에서 극값을 가지므로 이차방정식<br>$3x^{2}+2ax+b=0$의 서로 다른 두 실근이 $\\alpha ,\\;\\beta $이다.<br>이차방정식의 근과 계수의 관계에 의하여<br>$\\alpha +\\beta =-\\dfrac{2}{3}a,\\;\\alpha \\beta =\\dfrac{b}{3}$<br>$\\therefore \\;\\beta -\\alpha =\\sqrt{(\\alpha +\\beta )^{2}-4\\alpha \\beta }$<br>$=\\sqrt{\\left(-\\dfrac{2}{3}a\\right)^{2}-\\dfrac{4b}{3}}$<br>$=\\dfrac{2}{3}\\sqrt{a^{2}-3b}$<br>이때 $\\beta -\\alpha =4$이므로 $\\dfrac{2}{3}\\sqrt{a^{2}-3b}=4$에서<br>$\\sqrt{a^{2}-3b}=6\\therefore \\;a^{2}-3b=36$", "k": "c5", "c": ["$20$", "$24$", "$28$", "$32$", "$36$"], "a": "$36$", "q": "함수 $f(x)=x^{3}+ax^{2}+bx$가 $x=\\alpha ,\\;x=\\beta $에서 극값을 가지고 $\\beta -\\alpha =4$일 때, $a^{2}-3b$의 값은? (단, $a,\\;b$는 상수이다.)", "key": "Tm05-06"}, "x05x107-139": {"id": "x05x107-139", "unit": "m05", "theme": "06", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)$를 $(x-3)^{2}$으로 나누었을 때의 몫을 $Q(x)$, 나머지를 $R(x)=ax+b$ ($a,\\;b$는 상수)라 하면<br>$f(x)=(x-3)^{2}Q(x)+ax+b$<br>$f' (x)=2(x-3)Q(x)+(x-3)^{2}Q' (x)+a$<br>함수 $f(x)$가 $x=3$에서 극댓값 $-1$을 가지므로<br>$f' (3)=0,\\;f(3)=-1$<br>$f' (3)=0$에서 $a=0$<br>$f(3)=-1$에서 $3a+b=-1\\therefore \\;b=-1$<br>따라서 $R(x)=-1$이므로 $R(1)=-1$", "k": "c5", "c": ["$-2$", "$-1$", "$0$", "$1$", "$2$"], "a": "$-1$", "q": "다항함수 $f(x)$가 $x=3$에서 극댓값 $-1$을 가진다. 다항식 $f(x)$를 $(x-3)^{2}$으로 나누었을 때의 나머지가 $R(x)$일 때, $R(1)$의 값은?<br>", "key": "Tm05-06"}, "x05x107-140": {"id": "x05x107-140", "unit": "m05", "theme": "06", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)={\\begin{cases}x^{3}+ax & \\;(x{\\ge }0) \\\\ a(x^{3}-3x) & \\;(x<0)\\end{cases}}$에서<br>$f' (x)={\\begin{cases}3x^{2}+a & \\;(x>0) \\\\ 3a(x^{2}-1) & \\;(x<0)\\end{cases}}$<br>(ⅰ) $x>0$일 때<br>$a>0$이므로 $3x^{2}+a>0$<br>즉, $f' (x)=0$인 $x$의 값은 존재하지 않는다.<br>(ⅱ) $x<0$일 때<br>$f' (x)=3a(x^{2}-1)=3a(x+1)(x-1)$<br>$f' (x)=0$인 $x$의 값은 $x=-1\\;(\\because \\;x<0)$<br>함수 $f(x)$의 증가, 감소를 표로 나타내면 다음과 같다.<br>$x{\\cdots }-1{\\cdots }0{\\cdots }f' (x)+0-+f(x)\\nearrow 2a$<br>극대$\\searrow 0$<br>극소$\\nearrow $<br>함수 $f(x)$의 극댓값이 $4$이므로<br>$2a=4\\therefore \\;a=2$", "k": "c5", "c": ["$\\dfrac{1}{2}$", "$1$", "$\\dfrac{3}{2}$", "$2$", "$\\dfrac{5}{2}$"], "a": "$2$", "q": "함수 $f(x)={\\begin{cases}x^{3}+ax & \\;(x\\ge 0) \\\\ a(x^{3}-3x) & \\;(x<0)\\end{cases}}$의 극댓값이 $4$일 때, 양수 $a$의 값은?", "key": "Tm05-06"}, "x05x107-142": {"id": "x05x107-142", "unit": "m05", "theme": "06", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=x^{3}+ax^{2}+(a^{2}-6a)x+5$에서<br>$f' (x)=3x^{2}+2ax+a^{2}-6a$<br>삼차함수 $f(x)$가 극값을 가지려면 이차방정식 $f' (x)=0$이 서로 다른 두 실근을 가져야 한다.<br>이차방정식 $3x^{2}+2ax+a^{2}-6a=0$의 판별식을 $D$라 하면<br>$\\dfrac{D}{4}>0$에서 $a^{2}-3a^{2}+18a>0$<br>$-2a^{2}+18a>0,\\;2a(a-9)<0$<br>$\\therefore \\;0<a<9$<br>따라서 정수 $a$는 $1,\\;2,\\;3,\\;\\cdots ,\\;8$의 $8$개이다.", "k": "c5", "c": ["$4$", "$5$", "$6$", "$7$", "$8$"], "a": "$8$", "q": "함수 $f(x)=x^{3}+ax^{2}+(a^{2}-6a)x+5$가 극값을 가지도록 하는 정수 $a$의 개수는?", "key": "Tm05-06"}, "x05x107-143": {"id": "x05x107-143", "unit": "m05", "theme": "06", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=x^{4}+\\dfrac{2}{3}ax^{3}+2x^{2}+1$에서<br>$f' (x)=4x^{3}+2ax^{2}+4x=2x(2x^{2}+ax+2)$<br>사차함수 $f(x)$가 극값을 하나만 가지려면 삼차방정식 $f' (x)=0$이 한 실근과 두 허근 또는 한 실근과 중근 또는 삼중근을 가져야 하므로 이차방정식 $2x^{2}+ax+2=0$의 한 근이 $0$이거나 $0$이 아닌 중근 또는 허근을 가져야 한다.<br>(ⅰ) 이차방정식 $2x^{2}+ax+2=0$의 한 근이 $0$인 경우<br>$x=0$을 대입하면 $2=0$이 되어 성립하지 않는다.<br>(ⅱ) 이차방정식 $2x^{2}+ax+2=0$이 $0$이 아닌 중근을 가지는 경우<br>이차방정식 $2x^{2}+ax+2=0$의 판별식을 $D$라 하면 $D=0$에서<br>$a^{2}-4\\times 2\\times 2=0,\\;a^{2}-16=0$<br>$\\therefore \\;a=-4$ 또는 $a=4$<br>(ⅲ) 이차방정식 $2x^{2}+ax+2=0$이 허근을 가지는 경우<br>$D<0$에서 $a^{2}-16<0,\\;(a+4)(a-4)<0$<br>$\\therefore \\;-4<a<4$<br>(ⅰ), (ⅱ), (ⅲ)에서 구하는 실수 $a$의 값의 범위는<br>$-4{\\le }a{\\le }4$", "k": "c5", "c": ["$a\\le -8$", "$-8\\le a\\le -4$", "$-4\\le a\\le 4$", "$0\\le a\\le 8$", "$a\\ge 8$"], "a": "$-4\\le a\\le 4$", "q": "함수 $f(x)=x^{4}+\\dfrac{2}{3}ax^{3}+2x^{2}+1$이 극값을 하나만 가지도록 하는 실수 $a$의 값의 범위는?", "key": "Tm05-06"}, "x05x107-145": {"id": "x05x107-145", "unit": "m05", "theme": "06", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "ㄱ. 모든 실수 $x$에 대하여 $f' (x)>0$이면 함수 $f(x)$는 실수 전체의 집합에서 증가한다. (참)<br>ㄴ. $f' (\\alpha )=0$이어도 $x=\\alpha $의 좌우에서 $f' (x)$의 부호가 바뀌지 않으면 극값을 가지지 않는다. (거짓)<br>ㄷ. 삼차함수 $f(x)$의 역함수가 존재할 때, 최고차항의 계수가 양수인 경우 모든 실수 $x$에 대하여 $f' (x){\\ge }0$이고, 최고차항의 계수가 음수인 경우 모든 실수 $x$에 대하여 $f' (x){\\le }0$이다. (거짓)<br>따라서 옳은 것은 ㄱ뿐이다.", "k": "c5", "c": ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "a": "ㄱ", "q": "삼차함수 $f(x)$에 대하여 <보기>에서 옳은 것만을 있는 대로 고른 것은?<br><b><보기><\/b><br>ㄱ. 모든 실수 $x$에 대하여 $f' (x)>0$이면 함수 $f(x)$는 실수 전체의 집합에서 증가한다.<br>ㄴ. 실수 $\\alpha $에 대하여 $f' (\\alpha )=0$이면 $x=\\alpha $에서 함수 $f(x)$는 극값을 가진다.<br>ㄷ. 함수 $f(x)$의 역함수가 존재하면 모든 실수 $x$에 대하여 $f' (x)\\ge 0$이다.", "key": "Tm05-06"}, "x05x107-148": {"id": "x05x107-148", "unit": "m05", "theme": "06", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "곡선 $y=f(x)$가 $x=3$에서 $x$축과 접하므로 최고차항의 계수가 $1$인 삼차함수 $f(x)$를 $f(x)=(x-3)^{2}(x+a)$ ($a$는 상수)라 하자.<br>$\\therefore \\;f' (x)=2(x-3)(x+a)+(x-3)^{2}$<br>$f' (4)=f' (0)$이므로<br>$2(4+a)+1=-6a+9\\therefore \\;a=0$<br>$\\therefore \\;f(x)=x(x-3)^{2}=x^{3}-6x^{2}+9x$<br>$\\therefore \\;f' (x)=3x^{2}-12x+9=3(x-1)(x-3)$<br>$f' (x)=0$인 $x$의 값은 $x=1$ 또는 $x=3$<br>함수 $f(x)$의 증가, 감소를 표로 나타내면 다음과 같다.<br>$x{\\cdots }1{\\cdots }3{\\cdots }f' (x)+0-0+f(x)\\nearrow 4$<br>극대$\\searrow 0$<br>극소$\\nearrow $<br>따라서 함수 $f(x)$의 극댓값은 $f(1)=4$이다.", "k": "c5", "c": ["$2$", "$4$", "$6$", "$8$", "$10$"], "a": "$4$", "q": "최고차항의 계수가 $1$인 삼차함수 $f(x)$에 대하여 곡선 $y=f(x)$가 $x=3$에서 $x$축과 접한다. $f' (4)=f' (0)$일 때, 함수 $f(x)$의 극댓값은?<br>", "key": "Tm05-06"}, "x05x53-082": {"id": "x05x53-082", "unit": "m05", "theme": "08", "벌": "X05x53", "lvl": 2, "fix": true, "src": "문제집 개념원리", "w": "$f(x)=-2x^{3}-6x^{2}+9$에서<br>$f'(x)=-6x^{2}-12x=-6x(x+2)$<br>$f'(x)=0$에서 $x=-2$ 또는 $x=0$<br>함수 $f(x)$의 증가와 감소를 표로 나타내면 다음과 같다.<br>${x}{\\cdots }-2{\\cdots }$0${\\cdots }{f' (x)}-0+0-{f(x)}\\searrow 1\\nearrow 9\\searrow $<br>따라서 함수 $f(x)$는 $x=-2$에서 극솟값 $1$을 가지므로<br>$a=-2$, $b=1$<br>$\\therefore \\;a+b=-1$", "k": "num", "a": "-1", "q": "함수 $f(x)=-2x^{3}-6x^{2}+9$가 $x=a$에서 극솟값 $b$를 가질 때, $a+b$의 값을 구하시오.", "key": "Tm05-08"}, "x05x53-083": {"id": "x05x53-083", "unit": "m05", "theme": "08", "벌": "X05x53", "lvl": 2, "fix": true, "src": "문제집 개념원리", "w": "$f(x)=-x^{4}+4x^{3}+2x^{2}-12x+3$에서<br>$f'(x)=-4x^{3}+12x^{2}+4x-12$<br>$=-4(x+1)(x-1)(x-3)$<br>$f'(x)=0$에서 $x=-1$ 또는 $x=1$ 또는 $x=3$<br>함수 $f(x)$의 증가와 감소를 표로 나타내면 다음과 같다.<br>$x{\\cdots }-1{\\cdots }1{\\cdots }3{\\cdots }{f' (x)}+0-0+0-{f(x)}\\nearrow 12\\searrow -4\\nearrow 12\\searrow $<br>따라서 함수 $f(x)$는<br>$x=-1$, $x=3$에서 극댓값 $12$,<br>$x=1$에서 극솟값 $-4$<br>를 가지므로 $M=12$, $m=-4$<br>$\\therefore \\;M-m=16$", "k": "num", "a": "16", "q": "함수 $f(x)=-x^{4}+4x^{3}+2x^{2}-12x+3$의 극댓값을 $M$, 극솟값을 $m$이라 할 때, $M-m$의 값을 구하시오.", "key": "Tm05-08"}, "x05x53-084": {"id": "x05x53-084", "unit": "m05", "theme": "08", "벌": "X05x53", "lvl": 2, "fix": true, "src": "문제집 개념원리", "w": "$f(x)=x^{4}+ax^{2}+b$에서 $f'(x)=4x^{3}+2ax$<br>함수 $f(x)$가 $x=1$에서 극소이므로 $f'(1)=0$<br>$4+2a=0\\therefore \\;a=-2$<br>$\\therefore f(x)=x^{4}-2x^{2}+b$,<br>$f'(x)=4x^{3}-4x=4x(x+1)(x-1)$<br>$f'(x)=0$에서 $x=-1$ 또는 $x=0$ 또는 $x=1$<br>함수 $f(x)$의 증가와 감소를 표로 나타내면 다음과 같다.<br>$x{\\cdots }-1{\\cdots }0{\\cdots }1{\\cdots }{f' (x)}-0+0-0+{f(x)}\\searrow b-1\\nearrow b\\searrow b-1\\nearrow $<br>따라서 함수 $f(x)$는 $x=0$에서 극댓값 $b$를 가지므로<br>$b=4\\therefore \\;a+b=2$", "k": "num", "a": "2", "q": "함수 $f(x)=x^{4}+ax^{2}+b$는 $x=1$에서 극소이다. 함수 $f(x)$의 극댓값이 $4$일 때, $a+b$의 값을 구하시오. (단, $a$와 $b$는 상수이다.)", "key": "Tm05-08"}, "x05x53-085": {"id": "x05x53-085", "unit": "m05", "theme": "08", "벌": "X05x53", "lvl": 2, "fix": true, "src": "문제집 개념원리", "w": "$f(x)=x^{3}+ax^{2}+bx+100$에서<br>$f'(x)=3x^{2}+2ax+b$<br>함수 $f(x)$가 $x=-6$에서 극값을 가지므로<br>$f'(-6)=0$, $108-12a+b=0$<br>$\\therefore \\;12a-b=108\\cdots \\cdots $㉠<br>곡선 $y=f(x)$ 위의 점 $(-3,\\;f(-3))$에서의 접선의 기울기가 $9$이므로<br>$f'(-3)=9$, $27-6a+b=9$<br>$\\therefore \\;6a-b=18\\cdots \\cdots $㉡<br>㉠, ㉡을 연립하여 풀면 $a=15$, $b=72$<br>$\\therefore \\;a+b=87$", "k": "num", "a": "87", "q": "함수 $f(x)=x^{3}+ax^{2}+bx+100$이 $x=-6$에서 극값을 갖고, 곡선 $y=f(x)$ 위의 점 $(-3,\\;f(-3))$에서의 접선의 기울기가 $9$일 때, 상수 $a$, $b$에 대하여 $a+b$의 값을 구하시오.", "key": "Tm05-08"}, "x05x53-086": {"id": "x05x53-086", "unit": "m05", "theme": "08", "벌": "X05x53", "lvl": 2, "fix": true, "src": "문제집 개념원리", "w": "$f(x)=x^{3}+3x^{2}-9x+a$에서<br>$f'(x)=3x^{2}+6x-9=3(x+3)(x-1)$<br>$f'(x)=0$에서 $x=-3$ 또는 $x=1$<br>함수 $f(x)$의 증가와 감소를 표로 나타내면 다음과 같다.<br>${x}{\\cdots }-3{\\cdots }1{\\cdots }{f' (x)}+0-0+{f(x)}\\nearrow 27+a\\searrow -5+a\\nearrow $<br>따라서 함수 $f(x)$는 $x=-3$에서 극댓값 $27+a$,<br>$x=1$에서 극솟값 $-5+a$를 갖는다.<br>이때 극댓값과 극솟값의 절댓값이 같으므로<br>$(27+a)+(-5+a)=0$<br>$22+2a=0$<br>$\\therefore \\;a=-11$", "k": "num", "a": "-11", "q": "함수 $f(x)=x^{3}+3x^{2}-9x+a$의 극댓값과 극솟값의 절댓값이 같을 때, 상수 $a$의 값을 구하시오.", "key": "Tm05-08"}, "x05x53-087": {"id": "x05x53-087", "unit": "m05", "theme": "08", "벌": "X05x53", "lvl": 2, "fix": true, "src": "문제집 개념원리", "w": "$f(x)=x^{3}-\\dfrac{3}{2}ax^{2}-6a^{2}x$에서<br>$f'(x)=3x^{2}-3ax-6a^{2}$<br>$=3(x+a)(x-2a)$<br>$f'(x)=0$에서<br>$x=-a$ 또는 $x=2a$<br>$a>0$이므로 함수 $f(x)$의 증가와 감소를 표로 나타내면 다음과 같다.<br>${x}{\\cdots }-a{\\cdots }2a{\\cdots }{f' (x)}+0-0+{f(x)}\\nearrow \\dfrac{7}{2}a^{3}\\searrow -10a^{3}\\nearrow $<br>따라서 함수 $f(x)$는<br>$x=-a$에서 극댓값 $\\dfrac{7}{2}a^{3}$,<br>$x=2a$에서 극솟값 $-10a^{3}$<br>을 갖는다.<br>이때 극댓값과 극솟값의 차가 $\\dfrac{1}{2}$이므로<br>$\\dfrac{7}{2}a^{3}-(-10a^{3})=\\dfrac{1}{2}$<br>$\\dfrac{27}{2}a^{3}=\\dfrac{1}{2}$, $a^{3}=\\dfrac{1}{27}$<br>$\\therefore \\;a=\\dfrac{1}{3}$", "k": "num", "a": "1/3", "q": "함수 $f(x)=x^{3}-\\dfrac{3}{2}ax^{2}-6a^{2}x$의 극댓값과 극솟값의 차가 $\\dfrac{1}{2}$일 때, 양수 $a$의 값을 구하시오.", "key": "Tm05-08"}, "x05x53-091": {"id": "x05x53-091", "unit": "m05", "theme": "08", "벌": "X05x53", "lvl": 2, "fix": true, "src": "문제집 개념원리", "w": "$f(x)=x^{3}-3ax^{2}+3(a^{2}-1)x$에서<br>$f'(x)=3x^{2}-6ax+3(a^{2}-1)$<br>$=3(x-a+1)(x-a-1)$<br>$f'(x)=0$에서 $x=a-1$ 또는 $x=a+1$<br>함수 $f(x)$의 증가와 감소를 표로 나타내면 다음과 같다.<br>${x}{\\cdots }a-1{\\cdots }a+1{\\cdots }{f' (x)}+0-0+{f(x)}\\nearrow $극대$\\searrow $극소$\\nearrow $<br>따라서 함수 $f(x)$는 $x=a-1$에서 극댓값을 가지므로<br>$f(a-1)=4$<br>$(a-1)^{3}-3a(a-1)^{2}+3(a^{2}-1)(a-1)=4$<br>$a^{3}-3a-2=0$, $(a+1)^{2}(a-2)=0$<br>$\\therefore \\;a=-1$ 또는 $a=2$<br>(ⅰ) $a=-1$일 때<br>$f(x)=x^{3}+3x^{2}$이므로 $f(-2)=4>0$<br>(ⅱ) $a=2$일 때<br>$f(x)=x^{3}-6x^{2}+9x$이므로 $f(-2)=-50<0$<br>따라서 주어진 조건을 만족시키지 않는다.<br>(ⅰ), (ⅱ)에서 $f(x)=x^{3}+3x^{2}$이므로<br>$f(-1)=2$", "k": "c5", "c": ["$1$", "$2$", "$3$", "$4$", "$5$"], "a": "$2$", "q": "함수 $f(x)=x^{3}-3ax^{2}+3(a^{2}-1)x$의 극댓값이 $4$이고 $f(-2)>0$일 때, $f(-1)$의 값은? (단, $a$는 상수이다.)", "key": "Tm05-08"}, "x05x53-092": {"id": "x05x53-092", "unit": "m05", "theme": "08", "벌": "X05x53", "lvl": 2, "fix": true, "src": "문제집 개념원리", "w": "$f(x)=x^{3}+ax^{2}+bx+c$에서<br>$f'(x)=3x^{2}+2ax+b$<br>곡선 $y=f(x)$ 위의 점 $(1,\\;f(1))$에서의 접선의 기울기가 $6$이므로<br>$f'(1)=6$, $3+2a+b=6$<br>$\\therefore \\;2a+b=3\\cdots \\cdots $㉠<br>또 접선 $y=6x-1$이 점 $(1,\\;5)$를 지나므로<br>$f(1)=5$, $1+a+b+c=5$<br>$\\therefore \\;a+b+c=4\\cdots \\cdots $㉡<br>한편 함수 $f(x)$가 $x=-1$에서 극댓값을 가지므로<br>$f'(-1)=0$, $3-2a+b=0$<br>$\\therefore \\;2a-b=3\\cdots \\cdots $㉢<br>㉠, ㉢을 연립하여 풀면 $a=\\dfrac{3}{2}$, $b=0$<br>이것을 ㉡에 대입하면 $\\dfrac{3}{2}+c=4$<br>$\\therefore \\;c=\\dfrac{5}{2}$<br>따라서 $f(x)=x^{3}+\\dfrac{3}{2}x^{2}+\\dfrac{5}{2}$이므로<br>$f(3)=43$", "k": "num", "a": "43", "q": "함수 $f(x)=x^{3}+ax^{2}+bx+c$의 그래프 위의 점 $(1,\\;f(1))$에서의 접선의 방정식이 $y=6x-1$이고, $f(x)$는 $x=-1$에서 극댓값을 가질 때, $f(3)$의 값을 구하시오. (단, $a$, $b$, $c$는 상수이다.)", "key": "Tm05-08"}, "x05x53-093": {"id": "x05x53-093", "unit": "m05", "theme": "08", "벌": "X05x53", "lvl": 2, "fix": true, "src": "문제집 개념원리", "w": "$\\lim\\limits _{x\\,\\to \\,0}{\\,\\dfrac{f(x)}{x}}=-2$에서 $x\\,\\to \\,0$일 때 (분모)$\\to 0$이고<br>극한값이 존재하므로 (분자)$\\to 0$이다.<br>즉 $\\lim\\limits _{x\\,\\to \\,0}{\\,f(x)}=0$이므로 $f(0)=0$<br>$\\therefore \\;\\lim\\limits _{x\\,\\to \\,0}{\\,\\dfrac{f(x)}{x}}=\\lim\\limits _{x\\,\\to \\,0}{\\,\\dfrac{f(x)-f(0)}{x-0}}$<br>$=f'(0)=-2$<br>따라서 함수 $f(x)$를<br>$f(x)=ax^{3}+bx^{2}+cx$ ($a$, $b$, $c$는 상수, $a\\ne 0$)<br>라 하면<br>$f'(x)=3ax^{2}+2bx+c$<br>이고 $f'(0)=-2$에서<br>$c=-2$<br>$\\therefore f(x)=ax^{3}+bx^{2}-2x$,<br>$f'(x)=3ax^{2}+2bx-2$<br>한편 함수 $f(x)$가 $x=1$에서 극솟값 $-3$을 가지므로<br>$f'(1)=0$, $f(1)=-3$<br>$3a+2b-2=0$, $a+b-2=-3$<br>$\\therefore \\;3a+2b=2$, $a+b=-1$<br>두 식을 연립하여 풀면<br>$a=4$, $b=-5$<br>따라서 $f(x)=4x^{3}-5x^{2}-2x$이므로<br>$f(-1)=-7$", "k": "num", "a": "-7", "q": "삼차함수 $f(x)$가 $x=1$에서 극솟값 $-3$을 갖고 $\\lim\\limits _{x\\,\\rightarrow \\,0}{\\,\\dfrac{f(x)}{x}}=-2$를 만족시킬 때, $f(-1)$의 값을 구하시오.", "key": "Tm05-08"}, "x05x53-095": {"id": "x05x53-095", "unit": "m05", "theme": "08", "벌": "X05x53", "lvl": 2, "fix": true, "src": "문제집 개념원리", "w": "삼차함수 $f(x)$의 최고차항의 계수가 $1$이고, 조건 (나)에서 $f(0)=0$이므로<br>$f(x)=x^{3}+ax^{2}+bx$ ($a$, $b$는 상수)<br>라 하면 $f'(x)=3x^{2}+2ax+b$<br>이때 조건 (가)에서 $f'(1)=0$이므로<br>$3+2a+b=0$<br>$\\therefore \\;2a+b=-3\\cdots \\cdots $㉠<br>조건 (다)에서 $f'(-1-x)=f'(-1+x)$의 양변에<br>$x=-2$를 대입하면<br>$f'(1)=f'(-3)$<br>즉 $f'(-3)=0$이므로<br>$27-6a+b=0$<br>$\\therefore \\;6a-b=27\\cdots \\cdots $㉡<br>㉠, ㉡을 연립하여 풀면<br>$a=3$, $b=-9$<br>$\\therefore f(x)=x^{3}+3x^{2}-9x$,<br>$f' (x)=3x^{2}+x-9=3(x+3)(x-1)$<br>$f'(x)=0$에서 $x=-3$ 또는 $x=1$<br>함수 $f(x)$의 증가와 감소를 표로 나타내면 다음과 같다.<br>${x}{\\cdots }-3{\\cdots }1{\\cdots }{f' (x)}+0-0+{f(x)}\\nearrow 27\\searrow -5\\nearrow $<br>따라서 함수 $f(x)$는 $x=-3$에서 극댓값 $27$을 갖는다.", "k": "num", "a": "27", "q": "최고차항의 계수가 $1$인 삼차함수 $f(x)$가 다음 조건을 만족시킬 때, $f(x)$의 극댓값을 구하시오.<br>(가) 함수 $f(x)$는 $x=1$에서 극소이다.<br>(나) 곡선 $y=f(x)$는 원점을 지난다.<br>(다) 모든 실수 $x$에 대하여 $f' (-1-x)=f'(-1+x)$가 성립한다.", "key": "Tm05-08"}, "x05x53-096": {"id": "x05x53-096", "unit": "m05", "theme": "08", "벌": "X05x53", "lvl": 2, "fix": true, "src": "문제집 개념원리", "w": "함수 $g(x)$가 실수 전체의 집합에서 미분가능하므로<br>함수 $g(x)$는 $x=3$에서 연속이고 미분가능하다.<br>즉 $\\lim\\limits _{x\\,\\to \\,3+}{\\,g(x)}=\\lim\\limits _{x\\,\\to \\,3-}{\\,g(x)}=g(3)$이고<br>$\\lim\\limits _{x\\,\\to \\,3+}{\\,g(x)}=\\lim\\limits _{x\\,\\to \\,3+}{\\,f(x)}=f(3)$,<br>$\\lim\\limits _{x\\,\\to \\,3-}{\\,g(x)}=\\lim\\limits _{x\\,\\to \\,3-}{\\,\\left\\{b-f(x)\\right\\}}=b-f(3)$,<br>$g(3)=f(3)$<br>이므로 $f(3)=b-f(3)\\cdots \\cdots $㉠<br>$3a-17=b-3a+17$<br>$\\therefore \\;b=6a-34\\cdots \\cdots $㉡<br>또 $\\lim\\limits _{x\\,\\to \\,3+}{\\,\\dfrac{g(x)-g(3)}{x-3}}=\\lim\\limits _{x\\,\\to \\,3-}{\\,\\dfrac{g(x)-g(3)}{x-3}}$이고<br>$\\lim\\limits _{x\\,\\to \\,3+}{\\,\\dfrac{g(x)-g(3)}{x-3}}=\\lim\\limits _{x\\,\\to \\,3+}{\\,\\dfrac{f(x)-f(3)}{x-3}}$<br>$=f'(3)$,<br>$\\lim\\limits _{x\\,\\to \\,3-}{\\,\\dfrac{g(x)-g(3)}{x-3}}=\\lim\\limits _{x\\,\\to \\,3-}{\\,\\dfrac{\\left\\{b-f(x)\\right\\}-f(3)}{x-3}}$<br>$=\\lim\\limits _{x\\,\\to \\,3-}{\\,\\dfrac{-f(x)+\\left\\{b-f(3)\\right\\}}{x-3}}$<br>$=\\lim\\limits _{x\\,\\to \\,0-}{\\,\\dfrac{-f(x)+f(3)}{x-3}}$ ($\\because $ ㉠)<br>$=-\\lim\\limits _{x\\,\\to \\,3-}{\\,\\dfrac{f(x)-f(3)}{x-3}}=-f'(3)$<br>이므로 $f'(3)=-f'(3)$<br>$\\therefore \\;f'(3)=0$<br>이때 $f'(x)=3x^{2}-12x+a$이므로<br>$-9+a=0\\therefore \\;a=9$<br>$a=9$를 ㉡에 대입하면 $b=20$<br>$\\therefore \\;g(x)={\\begin{cases}-x^{3}+6x^{2}-9x+10 & \\;(x<3) \\\\ x^{3}-6x^{2}+9x+10 & \\;(x{\\ge }3)\\end{cases}}$<br>(ⅰ) $x<3$일 때<br>$g'(x)=-3x^{2}+12x-9=-3(x-1)(x-3)$<br>이므로 $g'(x)=0$에서<br>$x=1(\\because \\;x<3)$<br>(ⅱ) $x{\\ge }3$일 때<br>$g'(x)=3x^{2}-12x+9=3(x-1)(x-3)$<br>이므로 $g'(x)=0$에서<br>$x=3(\\because \\;x\\ge 3)$<br>(ⅰ), (ⅱ)에서 함수 $g(x)$의 증가와 감소를 표로 나타내면 다음과 같다.<br>${x}{\\cdots }1{\\cdots }3{\\cdots }g' (x)-0+0+g(x)\\searrow 6\\nearrow 10\\nearrow $<br>따라서 함수 $g(x)$는 $x=1$에서 극솟값 $6$을 갖는다.", "k": "num", "a": "6", "q": "함수 $f(x)=x^{3}-6x^{2}+ax+10$에 대하여 함수<br> $g(x)={\\begin{cases}b-f(x) & \\;(x<3) \\\\ f(x) & \\;(x{\\ge }3)\\end{cases}}$<br>이 실수 전체의 집합에서 미분가능할 때, 함수 $g(x)$의 극솟값을 구하시오. (단, $a$, $b$는 상수이다.)", "key": "Tm05-08"}, "x05x59-024": {"id": "x05x59-024", "unit": "m05", "theme": "08", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(x)=\\,-x^{4}+6x^{2}+8x-10$에서<br>$f'(x)=\\,-4x^{3}+12x+8=\\,-4(x+1)^{2}(x-2)$<br>$f'(x)=0$에서 $x=\\,-1$ 또는 $x=2$<br>$x\\cdots -1\\cdots 2\\cdots f'(x)+0+0-f(x)\\nearrow \\nearrow $극대$\\searrow $따라서 함수 $f(x)$는<br>$x=2$에서 극대이고,<br>$x=\\,-1$의 좌우에서<br>$f'(x)$의 부호가 바뀌지 않으므로 $x=\\,-1$에서는 극값을 갖지 않는다.<br>즉 $a=1$, $b=0$이므로 $a+2b=1$", "k": "c5", "c": ["$\\mathrm{1}$", "$\\mathrm{2}$", "$\\mathrm{3}$", "$\\mathrm{4}$", "$\\mathrm{5}$"], "a": "$\\mathrm{1}$", "q": "함수 $f(x)=\\,-x^{4}+6x^{2}+8x-10$의 극댓값의 개수를 $a$, 극솟값의 개수를 $b$라 할 때, $a+2b$의 값은?", "key": "Tm05-08"}, "x05x59-025": {"id": "x05x59-025", "unit": "m05", "theme": "08", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(x)=2x^{3}-6x+5$에서<br>$f'(x)=6x^{2}-6=6(x+1)(x-1)$<br>$x\\cdots -1\\cdots 1\\cdots f'(x)+0-0+f(x)\\nearrow $극대$\\searrow $극소$\\nearrow f'(x)=0$에서 $x=\\,-1$ 또는 $x=1$<br>따라서 함수 $f(x)$는<br>$x=\\,-1$에서 극대이고,<br>$x=1$에서 극소이므로<br>$a=1$,<br>$f(a)=f(1)=1$<br>$\\therefore \\;a+f(a)=2$", "k": "num", "a": "2", "q": "함수 $f(x)=2x^{3}-6x+5$가 $x=a$에서 극소일 때, $a+f(a)$의 값을 구하시오.", "key": "Tm05-08"}, "x05x59-028": {"id": "x05x59-028", "unit": "m05", "theme": "08", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(x+y)=f(x)+f(y)-xy(x+y)$의 양변에 $x=0$, $y=0$을 대입하면<br>$f(0)=f(0)+f(0)\\;\\therefore \\;f(0)=0$<br>이때 $f' (0)=4$이므로<br>$f' (0)=\\lim\\limits _{h\\,\\to \\,0}{}\\dfrac{f(h)-f(0)}{h}=\\lim\\limits _{h\\,\\to \\,0}{}\\dfrac{f(h)}{h}=4$<br>$\\therefore \\;f' (x)=\\lim\\limits _{h\\,\\to \\,0}{}\\dfrac{f(x+h)-f(x)}{h}$<br>$=\\lim\\limits _{h\\,\\to \\,0}{}\\dfrac{f(x)+f(h)-xh(x+h)-f(x)}{h}$<br>$=\\lim\\limits _{h\\,\\to \\,0}{}\\left\\{\\dfrac{f(h)}{h}-x^{2}-xh\\right\\}$<br>$=4-x^{2}$<br>$f' (x)=0$에서 $(2+x)(2-x)=0$<br>$\\therefore \\;x=\\,-2$ 또는 $x=2$<br>$x\\cdots \\mathrm{-2}\\cdots \\mathrm{2}\\cdots f' (x)-\\mathrm{0}+\\mathrm{0}-f(x)\\searrow $극소$\\nearrow $극대$\\searrow $<br>따라서 함수 $f(x)$는<br>$x=\\,-2$에서 극소, $x=2$에서 극대이므로<br>$\\alpha =\\,-2$, $\\beta =2$<br>$\\therefore \\;\\alpha ^{2}+\\beta ^{2}=(-2)^{2}+2^{2}=8$", "k": "num", "a": "8", "q": "실수 전체의 집합에서 정의된 다항함수 $f(x)$가 모든 실수 $x$, $y$에 대하여<br> $f(x+y)=f(x)+f(y)-xy(x+y)$<br>를 만족시키고 $f' (0)=4$이다. 함수 $f(x)$가 $x=\\alpha $에서 극소이고, $x=\\beta $에서 극대일 때, $\\alpha ^{2}+\\beta ^{2}$의 값을 구하시오.", "key": "Tm05-08"}, "x05x59-030": {"id": "x05x59-030", "unit": "m05", "theme": "08", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(x)=x^{3}+ax^{2}+bx+2$에서<br>$f'(x)=3x^{2}+2ax+b$<br>함수 $f(x)$가 $x=\\,-1$에서 극대이고, $x=3$에서 극소이므로<br>$f'(-1)=0$, $f'(3)=0$<br>$3-2a+b=0$, $27+6a+b=0$<br>$\\therefore \\;a=\\,-3$, $b=\\,-9$<br>즉 $f(x)=x^{3}-3x^{2}-9x+2$이므로 함수 $f(x)$의 극댓값은<br>$f(-1)=\\,-1-3+9+2=7$<br>[다른 풀이]<br>함수 $f(x)$가 $x=\\,-1$에서 극대이고, $x=3$에서 극소이므로<br>$f'(x)=3x^{2}+2ax+b=3(x+1)(x-3)$<br>$=3x^{2}-6x-9$<br>$\\therefore \\;a=\\,-3$, $b=\\,-9$", "k": "num", "a": "7", "q": "함수 $f(x)=x^{3}+ax^{2}+bx+2$가 $x=\\,-1$에서 극대이고, $x=3$에서 극소일 때, 함수 $f(x)$의 극댓값을 구하시오.<br>(단, $a$, $b$는 상수이다.)", "key": "Tm05-08"}, "x05x59-031": {"id": "x05x59-031", "unit": "m05", "theme": "08", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(x)=x^{4}+ax^{2}+b$에서<br>$f'(x)=4x^{3}+2ax$<br>함수 $f(x)$가 $x=\\,-2$에서 극값을 가지므로<br>$f'(-2)=0$, $-32-4a=0\\;\\therefore \\;a=\\,-8$<br>즉 $f(x)=x^{4}-8x^{2}+b$이므로<br>$f'(x)=4x^{3}-16x=4x(x+2)(x-2)$<br>$f'(x)=0$에서 $x=\\,-2$ 또는 $x=0$ 또는 $x=2$<br>$x\\cdots -2\\cdots 0\\cdots 2\\cdots f'(x)-0+0-0+f(x)\\searrow $극소$\\nearrow $극대$\\searrow $극소$\\nearrow $<br>따라서 함수 $f(x)$는 $x=0$에서 극댓값 $9$를 가지므로<br>$f(0)=b=9$<br>$\\therefore \\;a+b=1$", "k": "c5", "c": ["$-8$", "$-4$", "$-1$", "$1$", "$8$"], "a": "$1$", "q": "함수 $f(x)=x^{4}+ax^{2}+b$가 $x=\\,-2$에서 극값을 갖고, 함수 $f(x)$의 극댓값이 $9$일 때, $a+b$의 값은? (단, $a$, $b$는 상수이다.)", "key": "Tm05-08"}, "x05x59-034": {"id": "x05x59-034", "unit": "m05", "theme": "08", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(x)=x^{3}-3x+1$에서<br>$f' (x)=3x^{2}-3=3(x+1)(x-1)$<br>$f' (x)=0$에서 $x=\\,-1$ 또는 $x=1$<br>$x\\cdots \\mathrm{-1}\\cdots \\mathrm{1}\\cdots f' (x)+\\mathrm{0}-\\mathrm{0}+f(x)\\nearrow \\mathrm{3}\\searrow \\mathrm{-1}\\nearrow $<br>따라서 함수 $f(x)$는 $x=\\,-1$일 때 극댓값 $3$, $x=1$일 때 극솟값 $\\mathrm{-1}$을 가지므로<br>$\\mathrm{A}(-1,\\,3)$, $\\mathrm{B}(1,\\,-1)$<br>따라서 선분 $\\mathrm{AB}$를 $1\\,:\\,2$로 내분하는 점의 좌표는<br>$\\left(\\dfrac{1\\cdot 1+2\\cdot (-1)}{1+2},\\,\\dfrac{1\\cdot (-1)+2\\cdot 3}{1+2}\\right)$, 즉 $\\left(-\\dfrac{1}{3},\\,\\dfrac{5}{3}\\right)$", "k": "c5", "c": ["$\\left(-1,\\,\\dfrac{1}{3}\\right)$", "$\\left(-\\dfrac{2}{3},\\,-1\\right)$", "$\\left(-\\dfrac{2}{3},\\,1\\right)$", "$\\left(-\\dfrac{1}{3},\\,\\dfrac{2}{3}\\right)$", "$\\left(-\\dfrac{1}{3},\\,\\dfrac{5}{3}\\right)$"], "a": "$\\left(-\\dfrac{1}{3},\\,\\dfrac{5}{3}\\right)$", "q": "함수 $f(x)=x^{3}-3x+1$에 대하여 $y=f(x)$의 그래프에서 극대가 되는 점을 ${\\mathrm{A}}$, 극소가 되는 점을 ${\\mathrm{B}}$라 할 때, 선분 ${\\mathrm{AB}}$를 $1\\,:\\,2$로 내분하는 점의 좌표는?", "key": "Tm05-08"}, "x05x59-073": {"id": "x05x59-073", "unit": "m05", "theme": "08", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$g(x)=x^{2}-4x+3=(x-2)^{2}-1$이므로 $g(x)=t$로 놓으면<br>$t\\ge \\,-1$<br>$(f\\circ g)(x)=f(g(x))=f(t)=t^{3}-3t+4$<br>$\\therefore \\;f' (t)=3t^{2}-3=3(t+1)(t-1)$<br>$f' (t)=0$에서 $t=\\,-1$ 또는 $t=1$<br>$t\\mathrm{-1}\\cdots \\mathrm{1}\\cdots f' (t)\\mathrm{0}-\\mathrm{0}+f(t)\\mathrm{6}\\searrow \\mathrm{2}\\nearrow $따라서 함수 $f(t)$는 $t=1$일 때 최솟값 $\\mathrm{2}$를 갖는다.", "k": "num", "a": "2", "q": "두 함수 $f(x)$, $g(x)$가<br> $f(x)=x^{3}-3x+4$, $g(x)=x^{2}-4x+3$<br>일 때, 합성함수 $(f\\circ g)(x)$의 최솟값을 구하시오.", "key": "Tm05-08"}, "x05x59-100": {"id": "x05x59-100", "unit": "m05", "theme": "08", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(x)=x^{3}+ax^{2}+bx+c\\;\\left(a,\\,b,\\,c\\right.$는 상수$\\left.\\,\\right)$라 하면<br>$f'(x)=3x^{2}+2ax+b$<br>$g(x)=\\begin{cases}\\,1 &  & (x<0) \\\\ \\,f(x) &  & (x\\ge 0)\\end{cases}$에서 $g'(x)=\\begin{cases}\\,0 &  & (x<0) \\\\ \\,f'(x) &  & (x>0)\\end{cases}$<br>이때 함수 $g(x)$가 실수 전체의 집합에서 미분가능하므로 $x=0$에서 미분가능하다.<br>즉 $g(x)$가 $x=0$에서 연속이므로<br>$\\lim\\limits _{x\\,\\rightarrow \\,0+}g(x)=\\lim\\limits _{x\\,\\rightarrow \\,0-}g(x)=g(0)\\;\\therefore \\;f(0)=1$<br>$\\therefore \\;c=1$<br>또 $g(x)$가 $x=0$에서 미분가능하므로<br>$\\lim\\limits _{x\\,\\rightarrow \\,0+}g'(x)=\\lim\\limits _{x\\,\\rightarrow \\,0-}g'(x)=g'(0)\\;\\therefore \\;f'(0)=0$<br>$\\therefore \\;b=0$<br>$\\therefore \\;f(x)=x^{3}+ax^{2}+1$<br>ㄱ. $g(0)+g'(0)=f(0)+f'(0)=1+0=1$<br>ㄴ. $f'(x)=3x^{2}+2ax=x(3x+2a)$이므로 $f'(x)=0$에서<br>$x=0$ 또는 $x=\\,-\\dfrac{2a}{3}$<br>(ⅰ) $-\\dfrac{2a}{3}\\le 0$, 즉 $a\\ge 0$일 때, <br>$f(0)=1$이고, $x>0$일 때 $f'(x)>0$이므로<br>$g(x)\\ge 1$<br>따라서 $g(x)$의 최솟값이 $1$보다 작다는 조건에 모순이다.<br>(ⅱ) $-\\dfrac{2a}{3}>0$, 즉 $a<0$일 때, <br>$g(1)=f(1)=a+2$이고 $a+2<2\\;(\\because \\;a<0)$이므로 $g(1)<2$<br>(ⅰ), (ⅱ)에서 $g(1)<2$<br>ㄷ. 다음 그림과 같이 함수 $g(x)$는 $x=\\,-\\dfrac{2a}{3}$에서 극소이면서 최소이므로 최솟값은<br>$g\\left(-\\dfrac{2a}{3}\\right)=f\\left(-\\dfrac{2a}{3}\\right)$<br>$=\\,-\\dfrac{8}{27}a^{3}+\\dfrac{4}{9}a^{3}+1$<br>$=\\dfrac{4}{27}a^{3}+1$<br>즉 $\\dfrac{4}{27}a^{3}+1=\\dfrac{1}{2}$이므로<br>$\\dfrac{4}{27}a^{3}=\\,-\\dfrac{1}{2}$, $a^{3}=\\,-\\dfrac{27}{8}\\;\\therefore \\;a=\\,-\\dfrac{3}{2}$<br>따라서 $f(x)=x^{3}-\\dfrac{3}{2}x^{2}+1$이므로<br>$g(4)=f(4)=64-24+1=41$<br>이상에서 옳은 것은 ㄱ, ㄴ이다.", "k": "c5", "c": ["ㄱ", "ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "a": "ㄱ, ㄴ", "q": "삼차함수 $f(x)$의 최고차항의 계수가 $1$이고 함수 $g(x)$는<br> $g(x)=\\begin{cases}\\;1 &  & (x<0) \\\\ \\,f(x) &  & (x\\ge 0)\\end{cases}$<br>이다. $g(x)$가 실수 전체의 집합에서 미분가능하고 $g(x)$의 최솟값이 $1$보다 작을 때, 옳은 것만을 <보기>에서 있는 대로 고른 것은?<br><b><보기><\/b><br>ㄱ. $g(0)+g'(0)=1$<br>ㄴ. $g(1)<2$<br>ㄷ. 함수 $g(x)$의 최솟값이 $\\dfrac{1}{2}$일 때, $g(4)=40$이다.", "key": "Tm05-08"}, "x05x107-076": {"id": "x05x107-076", "unit": "m05", "theme": "11", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=(a+2)x^{3}+ax^{2}+(a-2)x+2$에서<br>$f'(x)=3(a+2)x^{2}+2ax+a-2$<br>삼차함수 $f(x)$가 극댓값과 극솟값을 모두 가지려면 이차방정식 $f'(x)=0$이 서로 다른 두 실근을 가져야 한다.<br>이차방정식 $3(a+2)x^{2}+2ax+a-2=0$의 판별식을 $D$라 하면<br>$\\dfrac{D}{4}>0$에서 $a^{2}-3a^{2}+12>0$<br>$-2a^{2}+12>0$, $2\\left(a+\\sqrt{6}\\right)\\left(a-\\sqrt{6}\\right)<0$<br>$\\therefore -\\sqrt{6}<a<\\sqrt{6}$<br>따라서 자연수 $a$는 $1$, $2$의 $2$개이다.", "k": "c5", "c": ["$1$", "$2$", "$3$", "$4$", "$5$"], "a": "$2$", "q": "삼차함수 $f(x)=(a+2)x^{3}+ax^{2}+(a-2)x+2$가 극댓값과 극솟값을 모두 가질 때, 자연수 $a$의 개수는?", "key": "Tm05-11"}, "x05x107-077": {"id": "x05x107-077", "unit": "m05", "theme": "11", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=\\dfrac{2}{3}x^{3}+(k+3)x^{2}+8kx-5$에서<br>$f' (x)=2x^{2}+2(k+3)x+8k$<br>삼차함수 $f(x)$가 극값을 가지려면 이차방정식 $f'(x)=0$이 서로 다른 두 실근을 가져야 한다.<br>이차방정식 $2x^{2}+2(k+3)x+8k=0$의 판별식을 $D$라 하면<br>$\\dfrac{D}{4}>0$에서 $(k+3)^{2}-16k>0$<br>$k^{2}+6k+9-16k>0$, $k^{2}-10k+9>0$<br>$(k-1)(k-9)>0$<br>$\\therefore \\;k<1$ 또는 $k>9$<br>따라서 $\\alpha =1$, $\\beta =9$이므로 $\\beta -\\alpha =8$", "k": "c5", "c": ["$6$", "$7$", "$8$", "$9$", "$10$"], "a": "$8$", "q": "함수 $f(x)=\\dfrac{2}{3}x^{3}+(k+3)x^{2}+8kx-5$가 극값을 가지도록 하는 실수 $k$의 값의 범위가 $k<\\alpha $ 또는 $k>\\beta $일 때, $\\beta -\\alpha $의 값은?", "key": "Tm05-11"}, "x05x107-078": {"id": "x05x107-078", "unit": "m05", "theme": "11", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=(a+1)x^{3}+ax^{2}+(a-1)x$에서<br>$f'(x)=3(a+1)x^{2}+2ax+a-1$<br>삼차함수 $f(x)$가 극값을 가지려면 이차방정식 $f'(x)=0$이 서로 다른 두 실근을 가져야 한다.<br>이차방정식 $3(a+1)x^{2}+2ax+a-1=0$의 판별식을 $D$라 하면<br>$\\dfrac{D}{4}>0$에서 $a^{2}-3(a+1)(a-1)>0$, $a^{2}-3a^{2}+3>0$, $a^{2}<\\dfrac{3}{2}$<br>$\\therefore -\\dfrac{\\sqrt{6}}{2}<a<\\dfrac{\\sqrt{6}}{2}$<br>이때 $f(x)$가 삼차함수이므로 $a\\ne -1$이다.<br>따라서 구하는 정수 $a$는 $0$, $1$의 $2$개이다.", "k": "num", "a": "2", "q": "삼차함수 $f(x)=(a+1)x^{3}+ax^{2}+(a-1)x$가 극값을 가지도록 하는 정수 $a$의 개수를 구하시오.", "key": "Tm05-11"}, "x05x53-101": {"id": "x05x53-101", "unit": "m05", "theme": "11", "벌": "X05x53", "lvl": 2, "fix": true, "src": "문제집 개념원리", "w": "$f(x)=x^{3}-\\dfrac{3}{2}(a-1)x^{2}-3ax+2$에서<br>$f'(x)=3x^{2}-3(a-1)x-3a$<br>함수 $f(x)$가 극값을 갖지 않으려면 이차방정식 $f'(x)=0$이 중근을 갖거나 허근을 가져야 하므로 판별식을 $D$라 하면<br>$D=\\left\\{-3(a-1)\\right\\}^{2}-4\\times 3\\times (-3a){\\le }0$<br>$a^{2}+2a+1{\\le }0$, $(a+1)^{2}{\\le }0$<br>$\\therefore \\;a=-1$", "k": "num", "a": "-1", "q": "함수 $f(x)=x^{3}-\\dfrac{3}{2}(a-1)x^{2}-3ax+2$가 극값을 갖지 않도록 하는 상수 $a$의 값을 구하시오.", "key": "Tm05-11"}, "x05x59-053": {"id": "x05x59-053", "unit": "m05", "theme": "11", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(x)=x^{3}-ax^{2}-ax+2$에서<br>$f' (x)=3x^{2}-2ax-a$<br>삼차함수 $f(x)$가 극값을 가지려면 이차방정식 $f' (x)=0$이 서로 다른 두 실근을 가져야 한다.<br>이차방정식 $f' (x)=0$의 판별식을 $D$라 하면<br>$\\dfrac{D}{4}=a^{2}+3a>0$, $a(a+3)>0$<br>$\\therefore \\;a<\\,-3$ 또는 $a>0$<br>따라서 $\\alpha =\\,-3$, $\\beta =0$이므로<br>$\\alpha -\\beta =\\,-3$", "k": "num", "a": "-3", "q": "함수 $f(x)=x^{3}-ax^{2}-ax+2$가 극값을 갖도록 하는 실수 $a$의 값의 범위가 $a<\\alpha $ 또는 $a>\\beta $일 때, $\\alpha -\\beta $의 값을 구하시오.", "key": "Tm05-11"}, "x05x59-054": {"id": "x05x59-054", "unit": "m05", "theme": "11", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(x)=ax^{3}+3x^{2}+ax+5$에서<br>$f' (x)=3ax^{2}+6x+a$<br>삼차함수 $f(x)$가 극값을 가지려면 이차방정식 $f' (x)=0$이 서로 다른 두 실근을 가져야 한다.<br>이차방정식 $f' (x)=0$의 판별식을 $D$라 하면<br>$\\dfrac{D}{4}=9-3a^{2}>0$, $a^{2}<3$<br>$\\therefore \\;-\\sqrt{3}<a<0$ 또는 $0<a<\\sqrt{3}\\;(\\because \\;a\\ne 0)$<br>따라서 정수 $a$는 $-1$, $1$의 $\\mathrm{2}$개이다.", "k": "c5", "c": ["$\\mathrm{1}$", "$\\mathrm{2}$", "$\\mathrm{3}$", "$\\mathrm{4}$", "$\\mathrm{5}$"], "a": "$\\mathrm{2}$", "q": "삼차함수 $f(x)=ax^{3}+3x^{2}+ax+5$가 극값을 갖도록 하는 정수 $a$의 개수는?", "key": "Tm05-11"}, "x05x59-056": {"id": "x05x59-056", "unit": "m05", "theme": "11", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(x)=x^{3}+x^{2}+2kx+1$에서<br>$f' (x)=3x^{2}+2x+2k$<br>함수 $f(x)$가 극값을 갖지 않으려면 이차방정식 $f' (x)=0$이 중근 또는 허근을 가져야 한다.<br>이차방정식 $f' (x)=0$의 판별식을 $D$라 하면<br>$\\dfrac{D}{4}=1-6k\\le 0\\;\\therefore \\;k\\ge \\dfrac{1}{6}$<br>따라서 실수 $k$의 최솟값은 $\\dfrac{1}{6}$이다.", "k": "num", "a": "1/6", "q": "함수 $f(x)=x^{3}+x^{2}+2kx+1$이 극값을 갖지 않도록 하는 실수 $k$의 최솟값을 구하시오.", "key": "Tm05-11"}, "x05x59-057": {"id": "x05x59-057", "unit": "m05", "theme": "11", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(x)=\\dfrac{4}{3}x^{3}+(a+3)x^{2}-ax+1$에서<br>$f' (x)=4x^{2}+2(a+3)x-a$<br>함수 $f(x)$가 극값을 갖지 않으려면 이차방정식 $f' (x)=0$이 중근 또는 허근을 가져야 한다.<br>이차방정식 $f' (x)=0$의 판별식을 $D$라 하면<br>$\\dfrac{D}{4}=(a+3)^{2}+4a\\le 0$<br>$a^{2}+10a+9\\le 0$, $(a+9)(a+1)\\le 0$<br>$\\therefore \\;-9\\le a\\le \\,-1$<br>따라서 $\\alpha =\\,-9$, $\\beta =\\,-1$이므로<br>$\\alpha ^{2}+\\beta ^{2}=(-9)^{2}+(-1)^{2}=82$", "k": "c5", "c": ["$\\mathrm{40}$", "$\\mathrm{58}$", "$\\mathrm{68}$", "$\\mathrm{74}$", "$\\mathrm{82}$"], "a": "$\\mathrm{82}$", "q": "함수 $f(x)=\\dfrac{4}{3}x^{3}+(a+3)x^{2}-ax+1$이 극값을 갖지 않도록 하는 실수 $a$의 값의 범위는 $\\alpha \\le a\\le \\beta $이다. 이때 $\\alpha ^{2}+\\beta ^{2}$의 값은?", "key": "Tm05-11"}, "x05x59-058": {"id": "x05x59-058", "unit": "m05", "theme": "11", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(x)=x^{3}+ax^{2}+3x-7$에서<br>$f' (x)=3x^{2}+2ax+3$<br>함수 $f(x)$가 극값을 갖지 않으려면 이차방정식 $f' (x)=0$은 중근 또는 허근을 가져야 한다.<br>이차방정식 $f' (x)=0$의 판별식을 $D_{1}$이라 하면<br>$\\dfrac{D_{1}}{4}=a^{2}-9\\le 0$, $(a+3)(a-3)\\le 0$<br>$\\therefore \\;-3\\le a\\le 3\\cdots \\cdots $ ㉠<br>$g(x)=\\,-x^{3}+2ax^{2}-ax+1$에서<br>$g' (x)=\\,-3x^{2}+4ax-a$<br>함수 $g(x)$가 극값을 가지려면 이차방정식 $g' (x)=0$이 서로 다른 두 실근을 가져야 한다.<br>이차방정식 $g' (x)=0$의 판별식을 $D_{2}$라 하면<br>$\\dfrac{D_{2}}{4}=4a^{2}-3a>0$, $a(4a-3)>0$<br>$\\therefore \\;a<0$ 또는 $a>\\dfrac{3}{4}\\cdots \\cdots $ ㉡<br>㉠, ㉡에서<br>$-3\\le a<0$ 또는 $\\dfrac{3}{4}<a\\le 3$<br>따라서 정수 $a$는<br>$-3$, $-2$, $-1$, $1$, $2$, $3$<br>의 $\\mathrm{6}$개이다.", "k": "num", "a": "6", "q": "함수 $f(x)=x^{3}+ax^{2}+3x-7$은 극값을 갖지 않고, 함수 $g(x)=\\,-x^{3}+2ax^{2}-ax+1$은 극값을 가질 때, 정수 $a$의 개수를 구하시오.", "key": "Tm05-11"}, "x05x75-041": {"id": "x05x75-041", "unit": "m05", "theme": "11", "벌": "X05x75", "lvl": 2, "fix": true, "src": "문제집 바이블개념ON", "w": "$f(x)=2x^{3}+3ax^{2}+(2a^{2}+3a)x$에서<br>$f' (x)=6x^{2}+6ax+2a^{2}+3a$<br>삼차함수 $f(x)$가 극댓값과 극솟값을 모두 가질 필요충분조건은 이차방정식 $f' (x)=0$이 서로 다른 두 실근을 갖는 것이므로 이차방정식 $f' (x)=0$의 판별식을 $D$라 하면<br>$\\dfrac{D}{4}=9a^{2}-6(2a^{2}+3a)>0$<br>$-3a^{2}-18a>0$, $3a(a+6)<0$<br>$\\therefore \\;-6<a<0$<br>따라서 구하는 정수 $a$는 $-5,\\;-4,\\;-3,\\;-2,\\;-1$의 $5$개다.", "k": "num", "a": "5", "q": "함수 $f(x)=2x^{3}+3ax^{2}+(2a^{2}+3a)x$가 극댓값과 극솟값을 모두 갖기 위한 정수 $a$의 개수를 구하시오.", "key": "Tm05-11"}, "x05x75-042": {"id": "x05x75-042", "unit": "m05", "theme": "11", "벌": "X05x75", "lvl": 2, "fix": true, "src": "문제집 바이블개념ON", "w": "$f(x)=kx^{3}+3x^{2}+(k+2)x$에서<br>$f'(x)=3kx^{2}+6x+(k+2)$<br>(ⅰ) $k=0$일 때<br>$f(x)=3x^{2}+2x$이므로 $f(x)$는 이차항의 계수가 양수인 이차함수이다. <br>따라서 $f(x)$는 극솟값은 갖지만 극댓값은 갖지 않는다.<br>(ⅱ) $k\\ne 0$일 때<br>삼차함수 $f(x)$가 극댓값과 극솟값을 모두 가질 필요충분조건은 이차방정식 $f'(x)=0$이 서로 다른 두 실근을 갖는 것이므로 이차방정식 $f'(x)=0$의 판별식을 $D$라 하면<br>$\\dfrac{D}{4}=9-3k(k+2)>0$<br>$-3k^{2}-6k+9>0$, $k^{2}+2k-3<0$<br>$(k+3)(k-1)<0$<br>$\\therefore \\;-3<k<1$<br>그런데 $k\\ne 0$이므로 $-3<k<0$, $0<k<1$<br>(ⅰ), (ⅱ)에서 구하는 정수 $k$는 $-2,\\;-1$의 $2$개다.", "k": "num", "a": "2", "q": "함수 $f(x)=kx^{3}+3x^{2}+(k+2)x$가 극솟값과 극댓값을 모두 가질 때, 정수 $k$의 개수를 구하시오.", "key": "Tm05-11"}, "x05x107-079": {"id": "x05x107-079", "unit": "m05", "theme": "12", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=x^{3}+(a-1)x^{2}+(a-1)x+1$에서<br>$f'(x)=3x^{2}+2(a-1)x+a-1$<br>삼차함수 $f(x)$가 극값을 가지지 않으려면 이차방정식 $f'(x)=0$이 중근 또는 허근을 가져야 한다.<br>이차방정식 $3x^{2}+2(a-1)x+a-1=0$의 판별식을 $D$라 하면<br>$\\dfrac{D}{4}\\le 0$에서 $(a-1)^{2}-3(a-1)\\le 0$<br>$(a-1)(a-4)\\le 0\\therefore 1\\le a\\le 4$", "k": "c5", "c": ["$-1\\le a\\le 2$", "$0\\le a\\le 3$", "$1\\le a\\le 4$", "$2\\le a\\le 5$", "$3\\le a\\le 6$"], "a": "$1\\le a\\le 4$", "q": "함수 $f(x)=x^{3}+(a-1)x^{2}+(a-1)x+1$이 극값을 가지지 않도록 하는 실수 $a$의 값의 범위는?", "key": "Tm05-12"}, "x05x107-080": {"id": "x05x107-080", "unit": "m05", "theme": "12", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(  갖고 $x=c\\left(c\\ne -\\dfrac{1}{2}\\right)$을 중근으로 가져야 한다.<br>그런데 삼차방정식 $f'(x)=0$의 한 근이 $x=0$이므로 이차방정식 $4x^{2}+3ax+2b=0$의 한 근이 $x=-\\dfrac{1}{2}$이어야 하고, 다른 한 근은 $x=0$이어야 한다.<br>따라서 $4x^{2}+3ax+2b=4x\\left(x+\\dfrac{1}{2}\\right)$이므로<br>$3a=2$, $2b=0\\therefore \\;a=\\dfrac{2}{3},\\;b=0$<br>한편, $c=0$이므로<br>$3a+b+c=3\\times \\dfrac{2}{3}+0+0=2$", "k": "num", "a": "2", "q": "함수 $f(x)=x^{4}+ax^{3}+bx^{2}-1$이 $x=-\\dfrac{1}{2}$에서 극값을 갖고, $f'(c)=0$이지만 $x=c$에서 극값을 갖지 않을 때, $3a+b+c$의 값을 구하시오. (단, $a,\\;b$는 상수이다.)", "key": "Tm05-14"}, "x05x108-007": {"id": "x05x108-007", "unit": "m05", "theme": "15", "벌": "X05x108", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=x^{3}-3x^{2}-9x+8$에서<br>$f' (x)=3x^{2}-6x-9=3(x+1)(x-3)$<br>$f' (x)=0$인 $x$의 값은 $x=-1$ 또는 $x=3$<br>닫힌구간 $[\\,-2,\\;0\\,]$에서 함수 $f(x)$의 증가, 감소를 표로 나타내면 다음과 같다.<br>${x}-2{\\cdots }-1{\\cdots }0{f' (x)}+0-{f(x)}6\\nearrow 13$<br>극대$\\searrow 8$<br>함수 $f(x)$의 최댓값은 $f(-1)=13$이다.", "k": "c5", "c": ["$10$", "$11$", "$12$", "$13$", "$14$"], "a": "$13$", "q": "닫힌구간 $[\\,-2,\\;0\\,]$에서 함수 $f(x)=x^{3}-3x^{2}-9x+8$의 최댓값은?", "key": "Tm05-15"}, "x05x108-008": {"id": "x05x108-008", "unit": "m05", "theme": "15", "벌": "X05x108", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=3x^{4}-4x^{3}+1$에서<br>$f' (x)=12x^{3}-12x^{2}=12x^{2}(x-1)$<br>$f' (x)=0$인 $x$의 값은 $x=0$ 또는 $x=1$<br>${x}{\\cdots }0{\\cdots }1{\\cdots }{f' (x)}-0-0+{f(x)}\\searrow 1\\searrow 0$<br>극소$\\nearrow $<br>따라서 함수 $f(x)$의 최솟값은 $f(1)=0$이다.", "k": "c5", "c": ["$-2$", "$-1$", "$0$", "$1$", "$2$"], "a": "$0$", "q": "함수 $f(x)=3x^{4}-4x^{3}+1$의 최솟값은?", "key": "Tm05-15"}, "x05x108-009": {"id": "x05x108-009", "unit": "m05", "theme": "15", "벌": "X05x108", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=\\dfrac{x^{4}}{4}-x^{3}+x^{2}-2$에서<br>$f' (x)=x^{3}-3x^{2}+2x=x(x-1)(x-2)$<br>$f' (x)=0$인 $x$의 값은 $x=0$ 또는 $x=1$ 또는 $x=2$<br>닫힌구간 $[\\,-2,\\;2\\,]$에서 함수 $f(x)$의 증가, 감소를 표로 나타내면 다음과 같다.<br>${x}-2{\\cdots }0{\\cdots }1{\\cdots }2{f' (x)}-0+0-0{f(x)}14\\searrow -2$<br>극소$\\nearrow -\\dfrac{7}{4}$<br>극대$\\searrow -2$<br>따라서 함수 $f(x)$의 최댓값은 $f(-2)=14$, 최솟값은 $f(0)=f(2)=-2$이므로 구하는 최댓값과 최솟값의 곱은<br>$14\\times (-2)=-28$", "k": "num", "a": "-28", "q": "닫힌구간 $[\\,-2,\\;2\\,]$에서 함수 $f(x)=\\dfrac{x^{4}}{4}-x^{3}+x^{2}-2$의 최댓값과 최솟값의 곱을 구하시오.", "key": "Tm05-15"}, "x05x108-012": {"id": "x05x108-012", "unit": "m05", "theme": "15", "벌": "X05x108", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$x^{2}-4x-y=0$에서 $y=x^{2}-4x$이므로<br>$x^{2}y=x^{2}(x^{2}-4x)=x^{4}-4x^{3}$<br>$f(x)=x^{4}-4x^{3}$이라 하면<br>$f' (x)=4x^{3}-12x^{2}=4x^{2}(x-3)$<br>$f' (x)=0$인 $x$의 값은 $x=0$ 또는 $x=3$<br>함수 $f(x)$의 증가, 감소를 표로 나타내면 다음과 같다.<br>${x}{\\cdots }0{\\cdots }3{\\cdots }{f' (x)}-0-0+{f(x)}\\searrow 0\\searrow -27$<br>극소$\\nearrow $<br>따라서 함수 $f(x)$의 최솟값은 $f(3)=-27$이므로 $x^{2}y$의 최솟값은 $-27$이다.", "k": "c5", "c": ["$-18$", "$-27$", "$-36$", "$-45$", "$-54$"], "a": "$-27$", "q": "$x^{2}-4x-y=0$을 만족시키는 실수 $x,\\;y$에 대하여 $x^{2}y$의 최솟값은?", "key": "Tm05-15"}, "x05x108-013": {"id": "x05x108-013", "unit": "m05", "theme": "15", "벌": "X05x108", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=x^{3}-3|\\,x\\,|+3$에서<br>(ⅰ) $x>0$일 때<br>$f(x)=x^{3}-3x+3$이므로<br>$f' (x)=3x^{2}-3=3(x+1)(x-1)$<br>$f' (x)=0$인 $x$의 값은 $x=1\\;(\\because \\;x>0)$<br>(ⅱ) $x<0$일 때<br>$f(x)=x^{3}+3x+3$이므로<br>$f' (x)=3x^{2}+3>0$<br>(ⅲ) $x=0$일 때<br>$f(0)=3$<br>닫힌구간 $[\\,-1,\\;2\\,]$에서 함수 $f(x)$의 증가, 감소를 표로 나타내면 다음과 같다.<br>${x}-1{\\cdots }0{\\cdots }1{\\cdots }2{f' (x)}+-0+{f(x)}-1\\nearrow 3$<br>극대$\\searrow 1$<br>극소$\\nearrow 5$<br>따라서 함수 $f(x)$의 최댓값은 $f(2)=5$, 최솟값은 $f(-1)=-1$이므로 구하는 최댓값과 최솟값의 차는<br>$|\\,5-(-1)\\,|=6$", "k": "num", "a": "6", "q": "닫힌구간 $[\\,-1,\\;2\\,]$에서 함수 $f(x)=x^{3}-3|\\,x\\,|+3$의 최댓값과 최솟값의 차를 구하시오.", "key": "Tm05-15"}, "x05x108-014": {"id": "x05x108-014", "unit": "m05", "theme": "15", "벌": "X05x108", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=x^{3}-3x+5$에서<br>$f' (x)=3x^{2}-3=3(x+1)(x-1)$<br>$f' (x)=0$인 $x$의 값은 $x=-1$ 또는 $x=1$<br>닫힌구간 $[\\,-1,\\;3\\,]$에서 함수 $f(x)$의 증가, 감소를 표로 나타내면 다음과 같다.<br>${x}-1{\\cdots }1{\\cdots }3{f' (x)}0-0+{f(x)}7\\searrow 3$<br>극대$\\nearrow 23$<br>따라서 함수 $f(x)$의 최솟값은 $f(1)=3$이다.", "k": "c5", "c": ["$1$", "$2$", "$3$", "$4$", "$5$"], "a": "$3$", "q": "닫힌구간 $[\\,-1,\\;3\\,]$에서 함수 $f(x)=x^{3}-3x+5$의 최솟값은?", "key": "Tm05-15"}, "x05x59-072": {"id": "x05x59-072", "unit": "m05", "theme": "15", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$x^{2}-6x+8=t$로 놓으면<br>$t=x^{2}-6x+8=(x-3)^{2}-1$<br>$2\\le x\\le 5$에서 $t$의 값의 범위는 $-1\\le t\\le 3$<br>$g(t)=t^{3}-12t+1$이라 하면<br>$g'(t)=3t^{2}-12=3(t+2)(t-2)$<br>$g'(t)=0$에서 $t=2\\;(\\because \\;-1\\le t\\le 3)$<br>따라서 함수 $g(t)$는 $t=\\,-1$에서 최댓값 $t-1\\cdots 2\\cdots 3g'(t)-0+g(t)12\\searrow -15\\nearrow -812$, $t=2$에서 최솟값 $-15$를 가지므로 최댓값과 최솟값의 합은<br>$12+(-15)=\\,-3$", "k": "c5", "c": ["$\\mathrm{-5}$", "$\\mathrm{-3}$", "$\\mathrm{0}$", "$\\mathrm{3}$", "$\\mathrm{5}$"], "a": "$\\mathrm{-3}$", "q": "구간 $[2,\\,5]$에서 함수<br> $f(x)=(x^{2}-6x+8)^{3}-12(x^{2}-6x+8)+1$<br>의 최댓값과 최솟값의 합은?", "key": "Tm05-15"}, "x05x59-078": {"id": "x05x59-078", "unit": "m05", "theme": "15", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(x)=x^{3}+ax^{2}+bx+c$에서<br>$f'(x)=3x^{2}+2ax+b$<br>조건 (가)에서 함수 $f(x)$가 $x=\\,-2$, $x=0$에서 극값을 가지므로<br>$f'(-2)=0$, $f'(0)=0$<br>$12-4a+b=0$, $b=0\\;\\therefore \\;a=3$, $b=0$<br>$\\therefore \\;f(x)=x^{3}+3x^{2}+c$<br>$x-3\\cdots -2\\cdots 0\\cdots 2f'(x)+0-0+f(x)c\\nearrow c+4\\searrow c\\nearrow c+20$<br>따라서<br>함수 $f(x)$는 $x=2$에서 최댓값 $c+20$,<br>$x=\\,-3$ 또는 $x=0$에서 최솟값 $c$를 갖는다.<br>이때 조건 (나)에서<br>함수 $f(x)$의 최댓값이 $19$이므로<br>$c+20=19$<br>$\\therefore \\;c=\\,-1$<br>따라서<br>함수 $f(x)$의 최솟값은 $-1$이다.", "k": "c5", "c": ["$-5$", "$-2$", "$-1$", "$1$", "$3$"], "a": "$-1$", "q": "구간 $[-3,\\,2]$에서 함수 $f(x)=x^{3}+ax^{2}+bx+c$가 다음 조건을 모두 만족시킬 때, 이 구간에서 $f(x)$의 최솟값은? (단, $a$, $b$, $c$는 상수이다.)<br>(가) $x=\\,-2$, $x=0$에서 극값을 갖는다.<br>(나) 최댓값이 $19$이다.", "key": "Tm05-15"}, "x05x108-019": {"id": "x05x108-019", "unit": "m05", "theme": "16", "벌": "X05x108", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=ax^{3}-\\dfrac{3}{2}ax^{2}+b$에서<br>$f' (x)=3ax^{2}-3ax=3ax(x-1)$<br>$f' (x)=0$인 $x$의 값은 $x=0$ 또는 $x=1$<br>$a<0$이므로 닫힌구간 $[\\,-1,\\;2\\,]$에서 함수 $f(x)$의 증가, 감소를 표로 나타내면 다음과 같다.<br>${x}-1{\\cdots }0{\\cdots }1{\\cdots }2{f' (x)}-0+0-{f(x)}-\\dfrac{5}{2}a+b\\searrow b$<br>극소$\\nearrow -\\dfrac{1}{2}a+b$<br>극대$\\searrow 2a+b$<br>$a<0$이므로 $2a<0<-\\dfrac{1}{2}a<-\\dfrac{5}{2}a$<br>$\\therefore \\;2a+b<b<-\\dfrac{1}{2}a+b<-\\dfrac{5}{2}a+b$<br>즉, 함수 $f(x)$의 최댓값은 $f(-1)=-\\dfrac{5}{2}a+b$, 최솟값은 $f(2)=2a+b$이다.<br>함수 $f(x)$의 최댓값이 $6$, 최솟값이 $-3$이므로<br>$-\\dfrac{5}{2}a+b=6,\\;2a+b=-3$<br>두 식을 연립하여 풀면 $a=-2,\\;b=1$<br>$\\therefore \\;a+b=-1$", "k": "c5", "c": ["$-2$", "$-1$", "$0$", "$1$", "$2$"], "a": "$-1$", "q": "닫힌구간 $[\\,-1,\\;2\\,]$에서 함수 $f(x)=ax^{3}-\\dfrac{3}{2}ax^{2}+b$의 최댓값이 $6$이고 최솟값이 $-3$일 때, 상수 $a,\\;b$에 대하여 $a+b$의 값은? (단, $a<0$)", "key": "Tm05-16"}, "x05x108-020": {"id": "x05x108-020", "unit": "m05", "theme": "16", "벌": "X05x108", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=3x^{4}-12x^{3}+12x^{2}+a$에서<br>$f'(x)=12x^{3}-36x^{2}+24x=12x(x-1)(x-2)$<br>$f'(x)=0$인 $x$의 값은 $x=0$ 또는 $x=1$ 또는 $x=2$<br>함수 $f(x)$의 증가, 감소를 표로 나타내면 다음과 같다.<br>${x}{\\cdots }0{\\cdots }1{\\cdots }2{\\cdots }{f' (x)}-0+0-0+{f(x)}\\searrow a$<br>극소$\\nearrow a+3$<br>극대$\\searrow a$<br>극소$\\nearrow $<br>함수 $f(x)$의 최솟값은 $f(0)=f(2)=a$이다.<br>이때 함수 $f(x)$의 최솟값이 $-2$이므로<br>$a=-2$", "k": "num", "a": "-2", "q": "함수 $f(x)=3x^{4}-12x^{3}+12x^{2}+a$의 최솟값이 $-2$일 때, 상수 $a$의 값을 구하시오.", "key": "Tm05-16"}, "x05x108-022": {"id": "x05x108-022", "unit": "m05", "theme": "16", "벌": "X05x108", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=-ax^{3}+3x^{2}+2$에서<br>$f'(x)=-3ax^{2}+6x=-3x(ax-2)$<br>$f'(x)=0$인 $x$의 값은 $x=0$ 또는 $x=\\dfrac{2}{a}$<br>$a>1$이므로 $0<\\dfrac{2}{a}<2$<br>닫힌구간 $[\\,0,\\;2\\,]$에서 함수 $f(x)$의 증가, 감소를 표로 나타내면 다음과 같다.<br>${x}0{\\cdots }\\dfrac{2}{a}{\\cdots }2{f' (x)}0+0-{f(x)}2\\nearrow \\dfrac{4}{a^{2}}+2$<br>극대$\\searrow -8a+14$<br>함수 $f(x)$의 최댓값은 $f\\left(\\dfrac{2}{a}\\right)=\\dfrac{4}{a^{2}}+2$이고, $f(x)$의 최댓값이 $3$이므로<br>$\\dfrac{4}{a^{2}}+2=3$, $\\dfrac{4}{a^{2}}=1$<br>$a^{2}=4$<br>$\\therefore a=2(\\because \\;a>1)$<br>따라서 함수 $f(x)$의 최솟값은<br>$f(2)=-8a+14=-2$", "k": "c5", "c": ["$-1$", "$-2$", "$-3$", "$-4$", "$-5$"], "a": "$-2$", "q": "닫힌구간 $[\\,0,\\;2\\,]$에서 함수 $f(x)=-ax^{3}+3x^{2}+2$의 최댓값이 $3$일 때, 함수 $f(x)$의 최솟값은? (단, $a>1$)", "key": "Tm05-16"}, "x05x108-023": {"id": "x05x108-023", "unit": "m05", "theme": "16", "벌": "X05x108", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=x^{3}+ax^{2}+bx+1$에서<br>$f'(x)=3x^{2}+2ax+b$<br>함수 $f(x)$가 $x=1$에서 극값 $5$를 가지므로<br>$f' (1)=0$에서 $3+2a+b=0\\cdots \\cdots $㉠<br>$f(1)=5$에서 $1+a+b+1=5\\cdots \\cdots $㉡<br>㉠, ㉡을 연립하여 풀면 $a=-6$, $b=9$<br>즉, $f(x)=x^{3}-6x^{2}+9x+1$이므로<br>$f'(x)=3x^{2}-12x+9=3(x-1)(x-3)$<br>$f'(x)=0$인 $x$의 값은 $x=1$ 또는 $x=3$<br>닫힌구간 $[\\,1,\\;5\\,]$에서 함수 $f(x)$의 증가, 감소를 표로 나타내면 다음과 같다.<br>${x}1{\\cdots }3{\\cdots }5{f' (x)}0-0+{f(x)}5\\searrow 1$<br>극소$\\nearrow 21$<br>따라서 함수 $f(x)$의 최댓값은 $f(5)=21$이다.", "k": "c5", "c": ["$21$", "$22$", "$23$", "$24$", "$25$"], "a": "$21$", "q": "함수 $f(x)=x^{3}+ax^{2}+bx+1$이 $x=1$에서 극값 $5$를 가질 때, 닫힌구간 $[\\,1,\\;5\\,]$에서 함수 $f(x)$의 최댓값은? (단, $a$, $b$는 상수이다.)", "key": "Tm05-16"}, "x05x108-025": {"id": "x05x108-025", "unit": "m05", "theme": "16", "벌": "X05x108", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=x^{3}+ax^{2}+bx+c$에서<br>$f'(x)=3x^{2}+2ax+b$<br>(가)에서 함수 $f(x)$가 $x=0$, $x=2$에서 극값을 가지므로<br>$f'(0)=0$에서 $b=0$<br>$f'(2)=0$에서 $12+4a+b=0$<br>$12+4a+0=0\\therefore a=-3$<br>즉, $f(x)=x^{3}-3x^{2}+c$이므로<br>$f' (x)=3x^{2}-6x=3x(x-2)$<br>$f'(x)=0$인 $x$의 값은 $x=0$ 또는 $x=2$<br>닫힌구간 $[\\,-2,\\;4\\,]$에서 함수 $f(x)$의 증가, 감소를 표로 나타내면 다음과 같다.<br>${x}-2{\\cdots }0{\\cdots }2{\\cdots }4{f' (x)}+0-0+{f(x)}c-20\\nearrow c$<br>극대$\\searrow c-4$<br>극소$\\nearrow c+16$<br>따라서 함수 $f(x)$의 최댓값은 $f(4)=c+16$, 최솟값은 $f(-2)=c-20$이다.<br>이때 (나)에서 함수 $f(x)$의 최솟값이 $-21$이므로<br>$c-20=-21$<br>$\\therefore c=-1$<br>따라서 함수 $f(x)$의 최댓값은<br>$c+16=-1+16=15$", "k": "num", "a": "15", "q": "닫힌구간 $[\\,-2,\\;4\\,]$에서 함수 $f(x)=x^{3}+ax^{2}+bx+c$가 다음 조건을 만족시킬 때, $f(x)$의 최댓값을 구하시오.<br>(단, $a$, $b$, $c$는 상수이다.)<br>(가) $x=0$, $x=2$에서 극값을 가진다.<br>(나) 최솟값이 $-21$이다.", "key": "Tm05-16"}, "x05x108-026": {"id": "x05x108-026", "unit": "m05", "theme": "16", "벌": "X05x108", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=x^{3}-6x^{2}+9x+a$에서<br>$f'(x)=3x^{2}-12x+9=3(x-1)(x-3)$<br>$f'(x)=0$인 $x$의 값은 $x=1$ 또는 $x=3$<br>닫힌구간 $[\\,0,\\;3\\,]$에서 함수 $f(x)$의 증가, 감소를 표로 나타내면 다음과 같다.<br>${x}0{\\cdots }1{\\cdots }3{f' (x)}+0-0{f(x)}a\\nearrow a+4$<br>극대$\\searrow a$<br>따라서 함수 $f(x)$의 최댓값은 $f(1)=a+4$이므로<br>$a+4=12\\therefore a=8$", "k": "c5", "c": ["$2$", "$4$", "$6$", "$8$", "$10$"], "a": "$8$", "q": "닫힌구간 $[\\,0,\\;3\\,]$에서 함수 $f(x)=x^{3}-6x^{2}+9x+a$의 최댓값이 $12$일 때, 상수 $a$의 값은?", "key": "Tm05-16"}, "x05x108-027": {"id": "x05x108-027", "unit": "m05", "theme": "16", "벌": "X05x108", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=x^{3}+ax^{2}-a^{2}x+2$에서<br>$f'(x)=3x^{2}+2ax-a^{2}=(x+a)(3x-a)$<br>$f'(x)=0$인 $x$의 값은 $x=-a$ 또는 $x=\\dfrac{a}{3}$<br>$a>0$이므로 닫힌구간 $[\\,-a,\\;a\\,]$에서 함수 $f(x)$의 증가, 감소를 표로 나타내면 다음과 같다.<br>${x}-a{\\cdots }\\dfrac{a}{3}{\\cdots }a{f' (x)}0-0+{f(x)}a^{3}+2\\searrow -\\dfrac{5}{27}a^{3}+2$<br>극소$\\nearrow a^{3}+2$<br>함수 $f(x)$의 최솟값은 $f\\left(\\dfrac{a}{3}\\right)=-\\dfrac{5}{27}a^{3}+2$이다.<br>이때 함수 $f(x)$의 최솟값이 $\\dfrac{14}{27}$이므로<br>$-\\dfrac{5}{27}a^{3}+2=\\dfrac{14}{27}$, $a^{3}=8$<br>$\\therefore a=2$ ($\\because a$는 실수)<br>따라서 함수 $f(x)$의 최댓값은<br>$f(-2)=f(2)=a^{3}+2=10$<br>이므로 $M=10$<br>$\\therefore a+M=2+10=12$", "k": "num", "a": "12", "q": "양수 $a$에 대하여 함수 $f(x)=x^{3}+ax^{2}-a^{2}x+2$는 닫힌구간 $[\\,-a,\\;a\\,]$에서 최댓값 $M$, 최솟값 $\\dfrac{14}{27}$를 가진다. $a+M$의 값을 구하시오.", "key": "Tm05-16"}, "x05x53-110": {"id": "x05x53-110", "unit": "m05", "theme": "16", "벌": "X05x53", "lvl": 2, "fix": true, "src": "문제집 개념원리", "w": "$f(x)=ax^{3}-6ax^{2}+b$에서<br>$f' (x)=3ax^{2}-12ax=3ax(x-4)$<br>$f'(x)=0$에서 $x=0$ 또는 $x=4$<br>이때  (x)}+0-{f(x)}-3a+b\\nearrow -27a+b\\searrow b$<br>따라서 $f(x)$는 $x=3$에서 최댓값 $-27a+b$, $x=4$에서 최솟값 $b$를 가지므로<br>$-27a+b=3$, $b=-6$<br>$\\therefore \\;a=-\\dfrac{1}{3}$, $b=-6$<br>$\\therefore \\;ab=2$", "k": "num", "a": "2", "q": "구간 $[\\,1,\\;4\\,]$에서 함수 $f(x)=ax^{4}-4ax^{3}+b$의 최댓값이 $3$, 최솟값이 $-6$일 때, 상수 $a$, $b$에 대하여 $ab$의 값을 구하시오.<br>(단, $a<0$)", "key": "Tm05-16"}, "x05x59-068": {"id": "x05x59-068", "unit": "m05", "theme": "16", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(x)=3x^{4}-16x^{3}+18x^{2}-2$에서<br>$f' (x)=12x^{3}-48x^{2}+36x=12x(x-1)(x-3)$<br>$f' (x)=0$에서 $x=0$ 또는 $x=1$ 또는 $x=3$<br>$x\\mathrm{-1}\\cdots \\mathrm{0}\\cdots \\mathrm{1}\\cdots \\mathrm{3}\\cdots \\mathrm{4}f' (x)-\\mathrm{0}+\\mathrm{0}-\\mathrm{0}+f(x)\\mathrm{35}\\searrow \\mathrm{-2}\\nearrow \\mathrm{3}\\searrow \\mathrm{-29}\\nearrow \\mathrm{30}$<br>따라서 함수 $f(x)$는 $x=\\,-1$일 때 최댓값 $35$, $x=3$일 때 최솟값 $-29$를 가지므로<br>$M\\,=35$, $m=\\,-29$<br>$\\therefore \\;M\\,+m=6$", "k": "c5", "c": ["$\\mathrm{3}$", "$\\mathrm{4}$", "$\\mathrm{5}$", "$\\mathrm{6}$", "$\\mathrm{7}$"], "a": "$\\mathrm{6}$", "q": "구간 $[-1,\\,4]$에서 함수<br> $f(x)=3x^{4}-16x^{3}+18x^{2}-2$<br>의 최댓값을 $M$, 최솟값을 $m$이라 할 때, $M+m$의 값은?", "key": "Tm05-16"}, "x05x59-070": {"id": "x05x59-070", "unit": "m05", "theme": "16", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(x)=x^{3}-3x^{2}-9x+5$에서<br>$f' (x)=3x^{2}-6x-9=3(x+1)(x-3)$<br>$f' (x)=0$에서 $x=\\,-1$ 또는 $x=3$<br>$x\\mathrm{-2}\\cdots \\mathrm{-1}\\cdots \\mathrm{3}\\cdots \\mathrm{4}f' (x)+\\mathrm{0}-\\mathrm{0}+f(x)\\mathrm{3}\\nearrow \\mathrm{10}\\searrow \\mathrm{-22}\\nearrow \\mathrm{-15}$<br>따라서 함수 $f(x)$는 $x=\\,-1$일 때 최댓값 $10$, $x=3$일 때 최솟값 $\\mathrm{-22}$를 가지므로<br>$M\\,=10$, $m=\\,-22$<br>$\\therefore \\;M\\,m=\\,-220$", "k": "c5", "c": ["$\\mathrm{-220}$", "$\\mathrm{-210}$", "$\\mathrm{-200}$", "$\\mathrm{-190}$", "$\\mathrm{-180}$"], "a": "$\\mathrm{-220}$", "q": "구간 $[-2,\\,4]$에서 함수<br> $f(x)=x^{3}-3x^{2}-9x+5$<br>의 최댓값을 $M$, 최 {32}$이다.", "k": "num", "a": "32", "q": "구간 $[-2,\\,3]$에서 함수 $f(x)=2x^{3}-6x^{2}+k$의 최솟값이 $\\mathrm{-8}$일 때, $f(x)$의 최댓값을 구하시오. (단, $k$는 상수이다.)", "key": "Tm05-16"}, "x05x59-077": {"id": "x05x59-077", "unit": "m05", "theme": "16", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(x)=ax^{3}-3ax^{2}+b$에서<br>$f' (x)=3ax^{2}-6ax=3ax(x-2)$<br>$f' (x)=0$에서 $x=2\\;(\\because \\;1\\le x\\le 3)$<br>$x\\mathrm{1}\\cdots \\mathrm{2}\\cdots \\mathrm{3}f' (x)-\\mathrm{0}+f(x)-2a+b\\searrow -4a+b\\nearrow b$<br>이때 $a$, $b$가 양수이므로 함수 $f(x)$는 $x=3$일 때 최댓값 $b$, $x=2$일 때 최솟값 $-4a+b$를 갖는다.<br>따라서 $b=10$, $-4a+b=2$이므로<br>$a=2$, $b=10$<br>$\\therefore \\;a+b=12$", "k": "c5", "c": ["$\\mathrm{6}$", "$\\mathrm{8}$", "$\\mathrm{10}$", "$\\mathrm{12}$", "$\\mathrm{14}$"], "a": "$\\mathrm{12}$", "q": "삼차함수 $f(x)=ax^{3}-3ax^{2}+b$가 구간 $[1,\\,3]$에서 최댓값 $\\mathrm{10}$, 최솟값 $\\mathrm{2}$를 가질 때, 양수 $a$, $b$에 대하여 $a+b$의 값은?", "key": "Tm05-16"}, "x05x75-060": {"id": "x05x75-060", "unit": "m05", "theme": "16", "벌": "X05x75", "lvl": 2, "fix": true, "src": "문제집 바이블개념ON", "w": "$f(x)=ax^{3}-3ax+b$에서<br>$f' (x)=3ax^{2}-3a=3a(x+1)(x-1)$<br>$f'(x)=0$에서 $x=1(\\because \\;0\\le x\\le 3)$<br>$a<0$이므로 닫힌구간 $[\\,0,\\;3\\,]$에서 함수 $f(x)$의 증가와 감소를 표로 나타내면 다음과 같다. <br>${x}0{\\cdots }1{\\cdots }3{f' (x)}+0-{f(x)}b\\nearrow -2a+b\\searrow 18a+b$<br>이때 $a<0$이므로 $18a+b<b<-2a+b$<br>따라서 함수 $f(x)$는 $x=1$에서 최댓값 $-2a+b$, $x=3$에서 최솟값 $18a+b$를 갖는다.<br>그런데 $f(x)$의 최댓값이 $6$, 최솟값이 $-14$이므로<br>$-2a+b=6$, $18a+b=-14$<br>위 두 식을 연립하여 풀면<br>$a=-1,\\;b=4$<br>$\\therefore \\;ab=(-1)\\times 4=-4$", "k": "num", "a": "-4", "q": "닫힌구간 $[\\,0,\\;3\\,]$에서 함수 $f(x)=ax^{3}-3ax+b$의 최댓값이 $6$, 최솟값이 $-14$일 때, 상수 $a,\\;b$에 대하여 $ab$의 값을 구하시오.<br>(단, $a<0$)", "key": "Tm05-16"}, "x05x75-061": {"id": "x05x75-061", "unit": "m05", "theme": "16", "벌": "X05x75", "lvl": 2, "fix": true, "src": "문제집 바이블개념ON", "w": "$f(x)=x^{3}+x^{2}-x+k$에서<br>$f' (x)=3x^{2}+2x-1=(x+1)(3x-1)$<br>$f'(x)=0$에서 $x=-1(\\because \\;-2\\le x\\le 0)$<br>닫힌구간 $[\\,-2,\\;0\\,]$에서 함수 $f(x)$의 증가와 감소를 표로 나타내면 다음과 같다. <br>${x}-2{\\cdots }-1{\\cdots }0{f' (x)}+0-{f(x)}k-2\\nearrow k+1\\searrow k$<br>따라서 함수 $f(x)$는 $x=-1$에서 최댓값 $k+1$, $x=-2$에서 최솟값 $k-2$를 갖는다.<br>이때 $f(x)$의 최댓값과 최솟값의 합이 $5$이므로<br>$(k+1)+(k-2)=5$, $2k=6$<br>$\\therefore \\;k=3$<br>따라서 $f(x)=x^{3}+x^{2}-x+3$이므로<br>$f(1)=4$", "k": "num", "a": "4", "q": "닫힌구간 $[\\,-2,\\;0\\,]$에서 함수 $f(x)=x^{3}+x^{2}-x+k$의 최댓값과 최솟값의 합이 $5$일 때, $f(1)$의 값을 구하시오. (단, $k$는 상수이다.)", "key": "Tm05-16"}, "x05x75-062": {"id": "x05x75-062", "unit": "m05", "theme": "16", "벌": "X05x75", "lvl": 2, "fix": true, "src": "문제집 바이블개념ON", "w": "$f(x)=\\dfrac{1}{2}ax^{4}-2ax-2a$에서<br>$f' (x)=2ax^{3}-2a=2a(x-1)(x^{2}+x+1)$<br>$f'(x)=0$에서 $x=1(\\because \\;x^{2}+x+1>0)$<br>$a>0$이므로 닫힌구간 $[\\,-2,\\;2\\,]$에서 함수 $f(x)$의 증가와 감소를 표로 나타내면 다음과 같다. <br>${x}-2{\\cdots }1{\\cdots }2{f' (x)}+0-{f(x)}10a\\nearrow -\\dfrac{7}{2}a\\searrow 2a$<br>$a>0$이므로 $-\\dfrac{7}{2}a<2a<10a$<br>즉, 함수 $f(x)$는 $x=-2$에서 최댓값 $10a$, $x=1$에서 최솟값 $-\\dfrac{7}{2}a$를 갖는다.<br>이때 $f(x)$의 최댓값이 $20$이므로<br>$10a=20$<br>$\\therefore \\;a=2$<br>따라서 $f(x)$의 최솟값은<br>$-\\dfrac{7}{2}a=-7$", "k": "num", "a": "-7", "q": "양수 $a$에 대하여 닫힌구간 $[\\,-2,\\;2\\,]$에서 함수 $f(x)=\\dfrac{1}{2}ax^{4}-2ax-2a$의 최댓값이 $20$일 때, 최솟값을 구하시오.", "key": "Tm05-16"}, "x05x75-063": {"id": "x05x75-063", "unit": "m05", "theme": "16", "벌": "X05x75", "lvl": 2, "fix": true, "src": "문제집 바이블개념ON", "w": "$f(x)=3ax^{4}-8ax^{3}+b$에서<br>$f' (x)=12ax^{3}-24ax^{2}=12ax^{2}(x-2)$<br>$f'(x)=0$에서 $x=2(\\because \\;1\\le x\\le 4)$<br>$a<0$이므로 닫힌구간 $[\\,1,\\;4\\,]$에서 함수 $f(x)$의 증가와 감소를 표로 나타내면 다음과 같다. <br>${x}1{\\cdots }2{\\cdots }4{f' (x)}+0-{f(x)}-5a+b\\nearrow -16a+b\\searrow 256a+b$<br>이때 $a<0$이므로 $256a+b<-5a+b<-16a+b$<br>따라서 함수 $f(x)$는 $x=2$에서 최댓값 $-16a+b$, $x=4$에서 최솟값 $256a+b$를 갖는다.<br>그런데 $f(x)$의 최댓값이 $24$,. 최솟값이 $-44$이므로<br>$-16a+b=24$, $256a+b=-44$<br>위 두 식을 연립하여 풀면<br>$a=-\\dfrac{1}{4}$, $b=20$<br>$\\therefore \\;ab=\\left(-\\dfrac{1}{4}\\right)\\times 20=-5$", "k": "num", "a": "-5", "q": "닫힌구간 $[\\,1,\\;4\\,]$에서 함수 $f(x)=3ax^{4}-8ax^{3}+b$의 최댓값이 $24$, 최솟값이 $-44$일 때, 상수 $a,\\;b$에 대하여 $ab$의 값을 구하시오.<br>(단, $a<0$)", "key": "Tm05-16"}, "x05x53-114": {"id": "x05x53-114", "unit": "m05", "theme": "17", "벌": "X05x53", "lvl": 2, "fix": true, "src": "문제집 개념원리", "w": "원피스 $x$벌을 판매할 때 생기는 이익을 $f(x)$원이라 하면<br>$f(x)=-x^{3}+144x^{2}+1200x-200$<br>$\\therefore \\;f'(x)=-3x^{2}+288x+1200$<br>$=-3(x+4)(x-100)$<br>$f'(x)=0$에서 $x=100$ ($\\because \\;0<x<15$)<br>$0<x<150$에서 함수 $f(x)$의 증가와 감소를 표로 나타내면 다음과 같다.<br>${x}0{\\cdots }100{\\cdots }150{f' (x)}+0-{f(x)}\\nearrow $극대$\\searrow $<br>따라서 $f(x)$는 $x=100$에서 극대이면서 최대이므로 원피스를 판매한 이익이 최대가 되려면 원피스를 ③$100$벌 판매해야 한다.", "k": "c5", "c": ["$84$벌", "$96$벌", "$100$벌", "$120$벌", "$136$벌"], "a": "$100$벌", "q": "인터넷 쇼핑몰에서 어떤 원피스 $x$벌을 판매할 때 생기는 이익이 $(-x^{3}+144x^{2}+1200x-200)$원이라 한다. 이 원피스를 판매한 이익이 최대가 되려면 이 원피스를 몇 벌 판매해야 하는가? (단, $0<x<150$)", "key": "Tm05-17"}, "x05x53-122": {"id": "x05x53-122", "unit": "m05", "theme": "17", "벌": "X05x53", "lvl": 2, "fix": true, "src": "문제집 개념원리", "w": "$f(x)=x^{3}+ax^{2}+3x+1$에서<br>$f' (x)=3x^{2}+2ax+3$<br>함수 $f(x)$가 극값을 가지려면 이차방정식 $f'(x)=0$이 서로 다른 두 실근을 가져야 하므로 판별식을 $D_{1}$이라 하면<br>$\\dfrac{D_{1}}{4}=a^{2}-3\\times 3>0$<br>$(a+3)(a-3)>0$<br>$\\therefore \\;a<-3$ 또는 $a>3\\cdots \\cdots $㉠<br>$g(x)=x^{3}+ax^{2}-3ax+2$에서<br>$g' (x)=3x^{2}+2ax-3a$<br>함수 $g(x)$가 극값을 갖지 않으려면 이차방정식 $g'(x)=0$이 중근을 갖거나 허근을 가져야 하므로 판별식을 $D_{2}$라 하면<br>$\\dfrac{D_{2}}{4}=a^{2}-3\\times (-3a)\\le 0$<br>$a^{2}+9a\\le 0$, $a(a+9)\\le 0$<br>$\\therefore \\;-9\\le a\\le 0\\cdots \\cdots $㉡<br>㉠, ㉡에서 $-9\\le a<-3$<br>따라서 정수 $a$는 $-9$, $-8$, $-7$, $\\cdots $, $-4$의 $6$개이다.", "k": "num", "a": "6", "q": "두 함수 $f(x)=x^{3}+ax^{2}+3x+1$, $g(x)=x^{3}+ax^{2}-3ax+2$에 대하여 $f(x)$는 극값을 갖고, $g(x)$는 극값을 갖지 않도록 하는 정수 $a$의 개수를 구하시오.", "key": "Tm05-17"}, "x05x53-124": {"id": "x05x53-124", "unit": "m05", "theme": "17", "벌": "X05x53", "lvl": 2, "fix": true, "src": "문제집 개념원리", "w": "$f(x)=x^{3}-3x^{2}-3$에서<br>$f' (x)=3x^{2}-6x=3x(x-2)$<br>$f'(x)=0$에서 $x=0$ 또는 $x=2$<br>구간 $[\\,0,\\;4\\,]$에서 함수 $f(x)$의 증가와 감소를 표로 나타내면 다음과 같다.<br>${x}0{\\cdots }2{\\cdots }4{f' (x)}-0+{f(x)}-3\\searrow -7\\nearrow 13$<br>따라서 $f(x)$는 $x=4$에서 최댓값 $13$, $x=2$에서 최솟값 $-7$을 가지므로<br>$M=13$, $m=-7$<br>$\\therefore \\;M-m=20$", "k": "num", "a": "20", "q": "구간 $[\\,0,\\;4\\,]$에서 함수 $f(x)=x^{3}-3x^{2}-3$의 최댓값을 $M$, 최솟값을 $m$이라 할 때, $M-m$의 값을 구하시오.", "key": "Tm05-17"}, "x05x53-125": {"id": "x05x53-125", "unit": "m05", "theme": "17", "벌": "X05x53", "lvl": 2, "fix": true, "src": "문제집 개념원리", "w": "$f(x)=ax^{3}-3ax+2b$에서<br>$f' (x)=3ax^{2}-3a=3a(x+1)(x-1)$<br>$f'(x)=0$에서<br>$x=-1$ 또는 $x=1$<br>이때 $a>0$이므로 구간 $[\\,-1,\\;3\\,]$에서 함수 $f(x)$의 증가와 감소를 표로 나타내면 다음과 같다.<br>${x}-1{\\cdots }1{\\cdots }3{f' (x)}-0+{f(x)}2a+2b\\searrow -2a+2b\\nearrow 18a+2b$<br>따라서 $f(x)$는 $x=3$에서 최댓값 $18a+2b$, $x=1$에서 최솟값 $-2a+2b$를 가지므로<br>$18a+2b=22$, $-2a+2b=2$<br>두 식을 연립하여 풀면<br>$a=1$, $b=2$<br>$\\therefore \\;ab=2$", "k": "num", "a": "2", "q": "구간 $[\\,-1,\\;3\\,]$에서 함수 $f(x)=ax^{3}-3ax+2b$의 최댓값이 $22$, 최솟값이 $2$일 때, 상수 $a$, $b$에 대하여 $ab$의 값을 구하시오.<br>(단, $a>0$)", "key": "Tm05-17"}, "x05x53-126": {"id": "x05x53-126", "unit": "m05", "theme": "17", "벌": "X05x53", "lvl": 2, "fix": true, "src": "문제집 개념원리", "w": "$f(x)=x^{4}-4a^{3}x+1$에서<br>$f'(x)=4x^{3}-4a^{3}=4(x-a)(x^{2}+ax+a^{2})$<br>이때 $x^{2}+ax+a^{2}=\\left(x+\\dfrac{a}{2}\\right)^{2}+\\dfrac{3}{4}a^{2}>0$이므로<br>$f'\\,(x)=0$에서 $x=a$<br>함수 $f(x)$의 증가와 감소를 표로 나타내면 다음과 같다.<br>$x{\\cdots }a{\\cdots }f'(x)-0+f(x)\\searrow -3a^{4}+1\\nearrow $<br>따라서 $f(x)$는 $x=a$에서 최솟값 $-3a^{4}+1$을 가지므로<br>$-3a^{4}+1=-47$, $a^{4}-16=0$<br>$(a^{2}+4)(a+2)(a-2)=0$<br>$\\therefore \\;a=2$($\\because \\;a>0$)", "k": "num", "a": "2", "q": "함수 $f(x)=x^{4}-4a^{3}x+1$의 최솟값이 $-47$일 때, 상수 $a$의 값을 구하시오. (단, $a>0$)", "key": "Tm05-17"}, "x05x53-127": {"id": "x05x53-127", "unit": "m05", "theme": "17", "벌": "X05x53", "lvl": 2, "fix": true, "src": "문제집 개념원리", "w": "점 $\\mathrm{P}$의 $x$좌표를 $t$라 하면 세 점 $\\mathrm{A}(5,\\;-1)$, $\\mathrm{B}(9,\\;1)$, $\\mathrm{P}(t,\\;t^{2}+2)$에 대하여<br>$\\mathrm{\\overline{AP}}^{2}+\\mathrm{\\overline{BP}}^{2}$<br>$=(t-5)^{2}+(t^{2}+3)^{2}+(t-9)^{2}+(t^{2}+1)^{2}$<br>$=2t^{4}+10t^{2}-28t+116$<br>$f(t)=2t^{4}+10t^{2}-28t+116$이라 하면<br>$f'(t)=8t^{3}+20t-28$<br>$=4(t-1)(2t^{2}+2t+7)$<br>$f'(t)=0$에서<br>$t=1$($\\because \\;2t^{2}+2t+7>0$)<br>함수 $f(t)$의 증가와 감소를 표로 나타내면 다음과 같다.<br>$t{\\cdots }1{\\cdots }f'(t)-0+f(t)\\searrow 100\\nearrow $<br>따라서 $f(t)$는 $t=1$일 때 극소이면서 최소이므로 구하는 최솟값은 $100$이다.", "k": "num", "a": "100", "q": "두 점 $\\mathrm{A}(5,\\;-1)$, $\\mathrm{B}(9,\\;1)$과 곡선 $y=x^{2}+2$ 위의 점 $\\mathrm{P}$에 대하여 $\\mathrm{\\overline{AP}}^{2}+\\mathrm{\\overline{BP}}^{2}$의 최솟값을 구하시오.", "key": "Tm05-17"}, "x05x53-129": {"id": "x05x53-129", "unit": "m05", "theme": "17", "벌": "X05x53", "lvl": 2, "fix": true, "src": "문제집 개념원리", "w": "$f(x)=-3x^{4}+4ax^{3}-6(a+3)x^{2}-1$에서<br>$f'(x)=-12x^{3}+12ax^{2}-12(a+3)x$<br>$=-12x(x^{2}-ax+a+3)$<br>함수 $f(x)$가 극솟값을 갖지 않으려면 삼차방정식 $f'(x)=0$이 한 실근과 두 허근을 갖거나 중근과 다른 한 실근을 갖거나 삼중근을 가져야 한다.<br>(ⅰ) $f'(x)=0$이 한 실근과 두 허근을 갖는 경우<br>이차방정식 $x^{2}-ax+a+3=0$이 허근을 가져야 하므로 판별식을 $D$라 하면<br>$D=(-a)^{2}-4(a+3)<0$<br>$a^{2}-4a-12<0$, $(a+2)(a-6)<0$<br>$\\therefore \\;-2<a<6$<br>(ⅱ) $f'(x)=0$이 중근과 다른 한 실근을 갖는 경우<br>이차방정식 $x^{2}-ax+a+3=0$이 $x=0$을 근으로 갖거나 $0$이 아닌 실수를 중근으로 가져야 한다.<br>ⓐ 이차방정식 $x^{2}-ax+a+3=0$이 $x=0$을 근으로 가질 때<br>$a+3=0\\therefore \\;a=-3$<br>ⓑ 이차방정식 $x^{2}-ax+a+3=0$이 $0$이 아닌 실수를 중근으로 가질 때, 판별식 $D$라 하면<br>$D=(-a)^{2}-4(a+3)=0$<br>$a^{2}-4a-12=0$<br>$(a+2)(a-6)=0$<br>$\\therefore \\;a=-2$ 또는 $a=6$<br>(ⅰ), (ⅱ)에서<br>$a=-3$ 또는 $-2lea\\le 6$<br>따라서 정수 $a$는 $-3$, $-2$, $-1$, $\\cdots $, $6$이므로 구하는 합은<br>$-3+(-2)+(-1)+\\,\\cdots \\,+6=15$", "k": "num", "a": "15", "q": "함수 $f(x)=-3x^{4}+4ax^{3}-6(a+3)x^{2}-1$이 극솟값을 갖지 않도록 하는 모든 정수 $a$의 값의 합을 구하시오.", "key": "Tm05-17"}, "x05x53-131": {"id": "x05x53-131", "unit": "m05", "theme": "17", "벌": "X05x53", "lvl": 2, "fix": true, "src": "문제집 개념원리", "w": "하루에 $\\mathrm{A}$ 제품 $x$($x>0$)개를 판매하여 얻은 이익을 $P(x)$원이라 하면<br>$P(x)=1200x-f(x)$<br>$=1200x-(x^{3}-60x^{2}+1200x+5000)$<br>$=-x^{3}+60x^{2}-5000$<br>$\\therefore \\;P' (x)=-3x^{2}+120x=-3x(x-40)$<br>$P'(x)=0$에서 $x=40$($\\because \\;x>0$)<br>$x>0$에서 함수 $P(x)$의 증가와 감소를 표로 나타내면 다음과 같다.<br>$x0{\\cdots }40{\\cdots }P'(x)+0-P(x)\\nearrow $극대$\\searrow $<br>따라서 $P(x)$는 $x=40$에서 극대이면서 최대이므로 이익을 최대로 하기 위해 하루에 생산해야 할 $\\mathrm{A}$ 제품의 개수는 $40$이다.", "k": "num", "a": "40", "q": "하루에 $\\mathrm{A}$ 제품 $x$개를 생산하는 데 드는 비용이 $f(x)=x^{3}-60x^{2}+1200x+5000$(원)이고, 생산된 제품은 개당 $1200$원에 그날 모두 판매된다고 할 때, 이익을 최대로 하기 위해 하루에 생산해야 할 $\\mathrm{A}$ 제품의 개수를 구하시오.", "key": "Tm05-17"}, "x05x53-133": {"id": "x05x53-133", "unit": "m05", "theme": "17", "벌": "X05x53", "lvl": 2, "fix": true, "src": "문제집 개념원리", "w": "$x^{2}+3y^{2}=9$에서<br>$y^{2}=\\dfrac{1}{3}(9-x^{2})$ ($-3\\le x\\le 3$)<br>$\\therefore \\;x^{2}+xy^{2}=x^{2}+x\\times \\dfrac{1}{3}(9-x^{2})$<br>$=-\\dfrac{1}{3}x^{3}+x^{2}+3x$<br>$f(x)=-\\dfrac{1}{3}x^{3}+x^{2}+3x$라 하면<br>$f'(x)=-x^{2}+2x+3$<br>$=-(x+1)(x-3)$<br>$f'(x)=0$에서 $x=-1$ 또는 $x=3$<br>$-3\\le x\\le 3$에서 함수 $f(x)$의 증가와 감소를 표로 나타내면 다음과 같다.<br>${x}-3{\\cdots }-1{\\cdots }3f' (x)-0+f(x)9\\searrow -\\dfrac{5}{3}\\nearrow 9$<br>따라서 $f(x)$는 $x=-1$에서 극소이면서 최소이므로 $x^{2}+xy^{2}$의 최솟값은 $-\\dfrac{5}{3}$이다.", "k": "num", "a": "-5/3", "q": "$x^{2}+3y^{2}=9$를 만족시키는 실수 $x$, $y$에 대하여 $x^{2}+xy^{2}$의 최솟값을 구하시오.", "key": "Tm05-17"}, "x05x53-135": {"id": "x05x53-135", "unit": "m05", "theme": "17", "벌": "X05x53", "lvl": 2, "fix": true, "src": "문제집 개념원리", "w": "$f(x)=x(x-a)(x-6)$이라 하면<br>$f'(x)=(x-a)(x-6)+x(x-6)+x(x-a)$<br>이때 $f(0)=0$이므로 원점은 곡선 $y=f(x)$ 위의 점이고<br>원점에서의 접선의 기울기는 $f'(0)=6a$<br>또 원점이 아닌 접점의 좌표를 $(t,\\;f(t))$라 하면 점 $(t,\\;f(t))$에서의 접선의 기울기는 $f'(t)$이므로 접선의 방정식은<br>$y-f(t)=f'(t)(x-t)$<br>이 직선이 원점을 지나므로<br>$0-f(t)=f' (t)(0-t)$<br>$-t(t-a)(t-6)=-t\\left\\{(t-a)(t-6)+t(t-6)+t(t-a)\\right\\}$<br>$t^{2}(2t-6-a)=0\\therefore \\;t=\\dfrac{6+a}{2}$($\\because \\;t\\ne 0$)<br>$\\therefore \\;f'(t)=f'\\left(\\dfrac{6+a}{2}\\right)$<br>$=-\\dfrac{1}{4}(a^{2}-12a+36)$<br>따라서 원점에서 곡선 $y=f(x)$에 그은 두 접선의 기울기의 곱을 $g(a)$라 하면<br>$g(a)=6a\\times \\left\\{-\\dfrac{1}{4}(a^{2}-12a+36)\\right\\}$<br>$=-\\dfrac{3}{2}(a^{3}-12a^{2}+36a)$<br>$\\therefore \\;g'(a)=-\\dfrac{3}{2}(3a^{2}-24a+36)$<br>$=-\\dfrac{9}{2}(a-2)(a-6)$<br>$g'(a)=0$에서 $a=2$($\\because \\;0<a<6$)<br>$0<a<6$에서 함수 $g(a)$의 증가와 감소를 표로 나타내면 다음과 같다.<br>${x}0{\\cdots }2{\\cdots }6g'(a)-0+g(a)\\searrow -48\\nearrow $<br>따라서 $g(a)$는 $a=2$일 때 극소이면서 최소이므로 구하는 최솟값은 $-48$이다.", "k": "c5", "c": ["$-54$", "$-51$", "$-48$", "$-45$", "$-42$"], "a": "$-48$", "q": "$0<a<6$인 실수 $a$에 대하여 원점에서 곡선 $y=x(x-a)(x-6)$에 그은 두 접선의 기울기의 곱의 최솟값은?", "key": "Tm05-17"}, "x05x59-001": {"id": "x05x59-001", "unit": "m05", "theme": "17", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(x)=x^{3}-6x^{2}+x+1$이라 하면<br>$f' (x)=3x^{2}-12x+1=3(x-2)^{2}-11$<br>이므로 $f' (x)$는 $x=2$에서 최솟값 $\\mathrm{-11}$을 갖는다.<br>따라서 구하는 기울기 $m$의 최솟값은 $\\mathrm{-11}$이다.", "k": "c5", "c": ["$\\mathrm{-11}$", "$\\mathrm{-9}$", "$\\mathrm{-7}$", "$\\mathrm{-5}$", "$\\mathrm{-3}$"], "a": "$\\mathrm{-11}$", "q": "곡선 $y=x^{3}-6x^{2}+x+1$에 접하는 직선의 기울기를 $m$이라 할 때, $m$의 최솟값은?", "key": "Tm05-17"}, "x05x59-035": {"id": "x05x59-035", "unit": "m05", "theme": "17", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(x)=x^{3}+(a+1)x^{2}-2x$에서<br>$f' (x)=3x^{2}+2(a+1)x-2$<br>함수 $f(x)$가 $x=\\alpha $에서 극대이고 $x=\\beta $에서 극소라 하면 $\\alpha $, $\\beta $는 이차방정식 $3x^{2}+2(a+1)x-2=0$의 두 근이다.<br>이때 극대가 되는 점과 극소가 되는 점이 원점에 대하여 대칭이므로<br>$\\alpha =\\,-\\beta $, 즉 $\\alpha +\\beta =0$<br>따라서 이차방정식의 근과 계수의 관계에 의하여<br>$\\alpha +\\beta =\\,-\\dfrac{2(a+1)}{3}=0\\;\\therefore \\;a=\\,-1$", "k": "c5", "c": ["$\\mathrm{-2}$", "$\\mathrm{-1}$", "$\\mathrm{0}$", "$\\mathrm{1}$", "$\\mathrm{2}$"], "a": "$\\mathrm{-1}$", "q": "함수 $f(x)=x^{3}+(a+1)x^{2}-2x$에 대하여 $y=f(x)$의 그래프에서 극대가 되는 점과 극소가 되는 점이 원점에 대하여 대칭일 때, 상수 $a$의 값은?", "key": "Tm05-17"}, "x05x59-079": {"id": "x05x59-079", "unit": "m05", "theme": "17", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "점 $\\mathrm{P}
