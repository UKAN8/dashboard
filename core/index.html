\\dfrac{3}{2}x=2y$, 즉 $y=\\dfrac{3}{4}x$일 때 성립하고 이때 펜스의 설치 비용이 최소가 되므로 ㉠에 $y=\\dfrac{3}{4}x$를 대입하면<br>$x\\cdot \\dfrac{3}{4}x=2700$, $x^{2}=3600$<br>$\\therefore x=60$ ($\\because x>0$)<br>따라서 $\\mathrm{A}$ 지점에서 $\\mathrm{B}$ 지점까지의 펜스의 길이는 $60$이다.", "k": "num", "a": "60", "q": "수한이는 넓이가 $2700$인 텃밭을 만들기 위하여 오른쪽 그림과 같이 직사각형 $\\mathrm{ABCD}$ 모양의 펜스를 설치하려고 한다. 옆 텃밭과 이웃한 $\\mathrm{A}$ 지점에서 $\\mathrm{B}$ 지점까지의 펜스의 설치 비용은 절반씩 나누어 지불하기로 하였다. 펜스의 설치 비용이 최소가 되도록 할 때, $\\mathrm{A}$ 지점에서 $\\mathrm{B}$ 지점까지의 펜스의 길이를 구하시오. (단, 펜스의 설치 비용은 길이에 비례한다.)", "key": "T07-15"}, "x07x30-133": {"id": "x07x30-133", "unit": "07", "theme": "15", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "직선 $\\mathrm{OP}$의 기울기는 $\\dfrac{b}{a}$이므로 점 $\\mathrm{P}$를 지나고 직선 $\\mathrm{OP}$에 수직인 직선의 방정식은<br>$y-b=-\\dfrac{a}{b}(x-a)\\therefore y=-\\dfrac{a}{b}x+\\dfrac{a^{2}}{b}+b$<br>위의 식에 $y=0$을 대입하면<br>$0=-\\dfrac{a}{b}x+\\dfrac{a^{2}}{b}+b\\therefore x=a+\\dfrac{b^{2}}{a}$<br>즉 $\\mathrm{Q}\\left(a+\\dfrac{b^{2}}{a},\\;0\\right)$이므로 $\\triangle OQR$의 넓이는<br>$\\dfrac{1}{2}\\cdot \\left(a+\\dfrac{b^{2}}{a}\\right)\\cdot \\dfrac{1}{b}=\\dfrac{1}{2}\\left(\\dfrac{a}{b}+\\dfrac{b}{a}\\right)$<br>$a>0$, $b>0$이므로 산술평균과 기하평균의 관계에 의하여<br>$\\dfrac{1}{2}\\left(\\dfrac{a}{b}+\\dfrac{b}{a}\\right)\\ge \\dfrac{1}{2}\\cdot 2\\sqrt{\\dfrac{a}{b}\\cdot \\dfrac{b}{a}}$<br>$=1$ (단, 등호는 $a=b$일 때 성립)<br>따라서 $\\triangle OQR$의 넓이의 최솟값은 $1$이다.", "k": "num", "a": "1", "q": "두 양수 $a,\\;b$에 대하여 좌표평면 위의 점 $\\mathrm{P}(a,\\;b)$를 지나고 직선 $\\mathrm{OP}$에 수직인 직선이 $x$축과 만나는 점을 $\\mathrm{Q}$라 하자. 점 $\\mathrm{R}\\left(0,\\;-\\dfrac{1}{b}\\right)$에 대하여 삼각형 $\\mathrm{OQR}$의 넓이의 최솟값을 구하시오.<br>(단, $\\mathrm{O}$는 원점이다.)", "key": "T07-15"}, "x07x30-134": {"id": "x07x30-134", "unit": "07", "theme": "15", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$x,\\;y$가 실수이므로 코시-슈바르츠 부등식에 의하여<br>$(2^{2}+3^{2})(x^{2}+y^{2})\\ge (2x+3y)^{2}$<br>그런데 $x^{2}+y^{2}=52$이므로<br>$13\\cdot 52\\ge (2x+3y)^{2}$, $13^{2}\\cdot 2^{2}\\ge (2x+3y)^{2}$<br>$\\therefore -26\\le 2x+3y\\le 26$<br>등호는 $\\dfrac{x}{2}=\\dfrac{y}{3}$, 즉 $y=\\dfrac{3}{2}x$일 때 성립하므로 $x^{2}+y^{2}=52$에 $y=\\dfrac{3}{2}x$를 대입하면<br>$x^{2}+\\left(\\dfrac{3}{2}x\\right)^{2}=52$, $x^{2}=16$<br>$\\therefore x=\\pm 4$, $y=\\pm 6$ (복호동순)<br>따라서 $2x+3y$는 $x=4$, $y=6$일 때 최댓값 $26$을 가지므로<br>$\\alpha =26$, $\\beta =4$, $\\gamma =6$<br>$\\therefore \\alpha +\\beta +\\gamma =36$", "k": "num", "a": "36", "q": "실수 $x,\\;y$가 $x^{2}+y^{2}=52$를 만족시킬 때, $2x+3y$의 최댓값을 $\\alpha $, 그때의 $x,\\;y$의 값을 각각 $\\beta ,\\;\\gamma $라 하자. 이때 $\\alpha +\\beta +\\gamma $의 값을 구하시오.", "key": "T07-15"}, "x07x30-135": {"id": "x07x30-135", "unit": "07", "theme": "15", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$x,\\;y$가 실수이므로 코시-슈바르츠 부등식에 의하여<br>$(1^{2}+2^{2})(x^{2}+y^{2})\\ge (x+2y)^{2}$<br>그런데 $x^{2}+y^{2}=5$이므로<br>$25\\ge (x+2y)^{2}$<br>$\\therefore -5\\le x+2y\\le 5\\left(\\begin{matrix}\\end{matrix}\\right.$단, 등호는 $x=\\dfrac{y}{2}$일 때 성립$\\left.\\begin{matrix}\\end{matrix}\\right)$<br>따라서 $x+2y$의 최댓값은 $5$, 최솟값은 $-5$이므로 구하는 곱은<br>$5\\cdot (-5)=-25$", "k": "c5", "c": ["$-25$", "$-15$", "$-5$", "$15$", "$25$"], "a": "$-25$", "q": "실수 $x,\\;y$가 $x^{2}+y^{2}=5$를 만족시킬 때, $x+2y$의 최댓값과 최솟값의 곱은?", "key": "T07-15"}, "x07x30-138": {"id": "x07x30-138", "unit": "07", "theme": "15", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$x$, $y$가 실수이므로 코시-슈바르츠 부등식에 의하여<br>$\\left\\{\\left(\\dfrac{1}{\\sqrt{2}}\\right)^{2}+1^{2}\\right\\}\\left\\{\\left(2\\sqrt{2}x\\right)^{2}+y^{2}\\right\\}\\ge (2x+y)^{2}$<br>그런데 $8x^{2}+y^{2}=24$이므로<br>$36\\ge (2x+y)^{2}$<br>이때 $x>0$, $y>0$이므로<br>$0<2x+y\\le 6$ (단, 등호는 $4x=y$일 때 성립) $\\cdots \\cdots $㉠<br>또 코시-슈바르츠 부등식에 의하여<br>$\\left\\{\\left(\\dfrac{1}{\\sqrt{2}}\\right)^{2}+1^{2}\\right\\}\\left\\{\\left(\\sqrt{2x}\\right)^{2}+\\left(\\sqrt{y}\\right)^{2}\\right\\}\\ge \\left(\\sqrt{x}+\\sqrt{y}\\right)^{2}$<br>$\\therefore \\;\\dfrac{3}{2}(2x+y)\\ge \\left(\\sqrt{x}+\\sqrt{y}\\right)^{2}$<br>㉠에서 $0<\\dfrac{3}{2}(2x+y)\\le 9$이므로<br>$\\left(\\sqrt{x}+\\sqrt{y}\\right)^{2}\\le 9$<br>이때 $x>0$, $y>0$이므로<br>$0<\\sqrt{x}+\\sqrt{y}\\le 3$ (단, 등호는 $4x=y$일 때 성립)<br>따라서 $\\sqrt{x}+\\sqrt{y}$의 최댓값은 $3$이다.", "k": "num", "a": "3", "q": "두 양수 $x$, $y$에 대하여 $8x^{2}+y^{2}=24$일 때, $\\sqrt{x}+\\sqrt{y}$의 최댓값을 구하시오.", "key": "T07-15"}, "x07x47-068": {"id": "x07x47-068", "unit": "07", "theme": "15", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "$x,\\;y$가 실수이므로<br>$(4^{2}+3^{2})(x^{2}+y^{2})\\ge (4x+3y)^{2},\\;25^{2}\\ge (4x+3y)^{2}$<br>$\\therefore \\;-25\\le 4x+3y\\le 25$(단, 등호는 $4y=3x$일 때 성립)<br>따라서 구하는 최댓값은 $25$이다.", "k": "c5", "c": ["$20$", "$25$", "$30$", "$35$", "$40$"], "a": "$25$", "q": "실수 $x,\\;y$에 대하여 $x^{2}+y^{2}=25$일 때, $4x+3y$의 최댓값은?", "key": "T07-15"}, "x07x47-069": {"id": "x07x47-069", "unit": "07", "theme": "15", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "$x,\\;y$가 실수이므로<br>$\\left(1^{2}+\\dfrac{1}{4^{2}}\\right)(x^{2}+y^{2})\\ge \\left(x+\\dfrac{y}{4}\\right)^{2},\\;\\dfrac{17}{16}(x^{2}+y^{2})\\ge 17$<br>$\\therefore \\;x^{2}+y^{2}\\ge 16$(단, 등호는 $4y=x$일 때 성립)<br>따라서 구하는 최솟값은 $16$이다.", "k": "num", "a": "16", "q": "실수 $x,\\;y$에 대하여 $x+\\dfrac{y}{4}=\\sqrt{17}$일 때, $x^{2}+y^{2}$의 최솟값을 구하시오.", "key": "T07-15"}, "x07x47-070": {"id": "x07x47-070", "unit": "07", "theme": "15", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "$x,\\;y$가 실수이므로<br>$(2^{2}+3^{2})(x^{2}+y^{2})\\ge (2x+3y)^{2},\\;13a\\ge (2x+3y)^{2}$<br>$\\therefore \\;-\\sqrt{13a}\\le 2x+3y\\le \\sqrt{13a}$<br>(단, 등호는 $2y=3x$일 때 성립)<br>따라서 $2x+3y$의 최댓값은 $\\sqrt{13a}$이므로<br>$\\sqrt{13a}=13\\therefore \\;a=13$", "k": "c5", "c": ["$9$", "$13$", "$15$", "$17$", "$20$"], "a": "$13$", "q": "실수 $x,\\;y$에 대하여 $x^{2}+y^{2}=a$이고 $2x+3y$의 최댓값이 $13$일 때, 양수 $a$의 값은?", "key": "T07-15"}, "x07x47-071": {"id": "x07x47-071", "unit": "07", "theme": "15", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "$x+y+z=2$에서 $y+z=2-x\\cdots \\cdots $ ㉠<br>$x^{2}+y^{2}+z^{2}=4$에서 $y^{2}+z^{2}=4-x^{2}\\cdots \\cdots $ ㉡<br>$y,\\;z$가 실수이므로<br>$(1^{2}+1^{2})(y^{2}+z^{2})\\ge (y+z)^{2}$<br>㉠, ㉡을 대입하면<br>$2(4-x^{2})\\ge (2-x)^{2}$<br>$8-2x^{2}\\ge 4-4x+x^{2},\\;3x^{2}-4x-4\\le 0$<br>$(3x+2)(x-2)\\le 0$<br>$\\therefore \\;-\\dfrac{2}{3}\\le x\\le 2$(단, 등호는 $y=z$일 때 성립)<br>따라서 구하는 최댓값은 $2$이다.", "k": "num", "a": "2", "q": "실수 $x,\\;y,\\;z$에 대하여 $x+y+z=2,\\;x^{2}+y^{2}+z^{2}=4$일 때, $x$의 최댓값을 구하시오.", "key": "T07-15"}, "x07x68-104": {"id": "x07x68-104", "unit": "07", "theme": "15", "벌": "X07x68", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "$x$, $y$가 실수이므로 코시-슈바르츠의 부등식에 의하여<br>$(2^{2}+3^{2})(x^{2}+y^{2}){\\ge }(2x+3y)^{2}$<br>이때 $2x+3y=13$이므로<br>$13(x^{2}+y^{2}){\\ge }13^{2}$<br>$\\therefore \\;x^{2}+y^{2}{\\ge }13$ (단, 등호는 $2y=3x$일 때 성립)<br>따라서 구하는 최솟값은 $13$이다.", "k": "num", "a": "13", "q": "실수 $x$, $y$에 대하여 $2x+3y=13$일 때, $x^{2}+y^{2}$의 최솟값을 구하시오.", "key": "T07-15"}, "x07x68-105": {"id": "x07x68-105", "unit": "07", "theme": "15", "벌": "X07x68", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "$a$, $b$가 실수이므로 코시-슈바르츠의 부등식에 의하여<br>$(1^{2}+3^{2})(a^{2}+b^{2}){\\ge }(a+3b)^{2}$<br>이때 $a^{2}+b^{2}=100$이므로<br>$10\\times 100{\\ge }(a+3b)^{2}$<br>$\\therefore \\;(a+3b)^{2}{\\le }1000$<br>따라서 $(a+3b)^{2}$은 등호가 성립할 때, 즉 $b=3a$일 때 최댓값 $1000$을 갖는다.<br>$a^{2}+b^{2}=100$에 $b=3a$를 대입하면<br>$a^{2}+9a^{2}=100$, $a^{2}=10$<br>$\\therefore \\;a=\\pm \\sqrt{10}$<br>따라서 모든 $a$의 값의 곱은<br>$-\\sqrt{10}\\times \\sqrt{10}=-10$", "k": "num", "a": "-10", "q": "$a^{2}+b^{2}=100$을 만족시키는 실수 $a$, $b$에 대하여 $(a+3b)^{2}$의 값이 최대가 될 때, 모든 $a$의 값의 곱을 구하시오.", "key": "T07-15"}, "x05x53-057": {"id": "x05x53-057", "unit": "m05", "theme": "01", "벌": "X05x53", "lvl": 2, "fix": true, "src": "문제집 개념원리", "w": "$f(x)=4x^{3}+ax^{2}-bx+1$에서<br>$f'(x)=12x^{2}+2ax-b$<br>함수 $f(x)$는 $x=-1,\\;x=2$의 좌우에서 증가와 감소가 바뀌므로 $x=-1,\\;x=2$의 좌우에서 $f'(x)$의 부호가 바뀐다.<br>따라서 이차방정식 $f'(x)=0$, 즉 $12x^{2}+2ax-b=0$의 두 근이 $-1,\\;2$이므로 이차방정식의 근과 계수의 관계에 의하여<br>$-1+2=-2\\dfrac{a}{12}$, $-1\\times 2=-\\dfrac{b}{12}$<br>$\\therefore \\;a=-6,\\;b=24$<br>$\\therefore \\;a+b=18$", "k": "num", "a": "18", "q": "함수 $f(x)=4x^{3}+ax^{2}-bx+1$이 $x\\le -1$ 또는 $x\\ge 2$에서 증가하고, $-1\\le x\\le 2$에서 감소할 때, 상수 $a,\\;b$에 대하여 $a+b$의 값을 구하시오.", "key": "Tm05-01"}, "x05x59-007": {"id": "x05x59-007", "unit": "m05", "theme": "01", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(x)=\\dfrac{1}{3}x^{3}+ax^{2}+bx+2$에서<br>$f' (x)=x^{2}+2ax+b$<br>주어진 조건에 의하여 이차방정식 $f' (x)=0$의 두 근은 $\\mathrm{1}$, $\\mathrm{3}$이므로 이차방정식의 근과 계수의 관계에 의하여<br>$1+3=\\,-2a$, $1\\cdot 3=b\\;\\therefore \\;a=\\,-2$, $b=3$<br>$\\therefore \\;a-b=\\,-5$", "k": "num", "a": "-5", "q": "함수 $f(x)=\\dfrac{1}{3}x^{3}+ax^{2}+bx+2$가 $x\\le 1$, $x\\ge 3$에서 증가하고, $1\\le x\\le 3$에서 감소할 때, 상수 $a$, $b$에 대하여 $a-b$의 값을 구하시오.", "key": "Tm05-01"}, "x05x75-005": {"id": "x05x75-005", "unit": "m05", "theme": "01", "벌": "X05x75", "lvl": 2, "fix": true, "src": "문제집 바이블개념ON", "w": "$f(x)=-x^{3}+3x^{2}+24x+3$에서<br>$f' (x)=-3x^{2}+6x+24=-3(x+2)(x-4)$<br>$f' (x)=0$에서 $x=-2$ 또는 $x=4$<br>함수 $f(x)$의 증가와 감소를 표로 나타내면 다음과 같다.<br>$x\\cdots -2\\cdots 4\\cdots f' (x)-0+0-f(x)$↘$-25$↗$83$↘<br>이때 함수 $f(x)$는 닫힌구간 $[\\,-2,\\;4\\,]$에서 증가한다.<br>따라서 닫힌구간 $[\\,a,\\;b\\,]$가 닫힌구간 $[\\,-2,\\;4\\,]$에 포함되어야 하므로<br>$-2\\le a<b\\le 4$<br>즉, $m=-2$, $M=4$이므로<br>$M-m=4-(-2)=6$", "k": "num", "a": "6", "q": "함수 $f(x)=-x^{3}+3x^{2}+24x+3$이 닫힌구간 $[\\,a,\\;b\\,]$에서 증가할 때, $a$의 최솟값을 $m$, $b$의 최댓값을 $M$이라 하자. $M-m$의 값을 구하시오.", "key": "Tm05-01"}, "x05x11-015": {"id": "x05x11-015", "unit": "m05", "theme": "02", "벌": "X05x11", "lvl": 2, "fix": true, "src": "주간고사 6회", "w": "$x_{1}\\ne x_{2}$이면 $f(x_{1})\\ne f(x_{2})$를 만족시키는 함수는<br>일대일 대응이고 $f(x)$의 최고차항의 계수가<br>양수이므로 함수 $f(x)$는 증가함수이다.<br>즉, 모든 실수 $x$에 대하여 $f'(x)\\ge 0$이어야 하므로<br>$f'(x)=3x^{2}-6(a+1)x-4a\\ge 0$<br>방정식 $f'(x)=0$의 판별식을 $D$라 할 때,<br>$\\dfrac{D}{4}=9(a+1)^{2}+12a\\le 0$<br>$3a^{2}+10a+3\\le 0,\\;(a+3)(3a+1)\\le 0$<br>$\\therefore \\;-3\\le a\\le -\\dfrac{1}{3}$<br>따라서 정수 $a$는 $-3,\\;-2,\\;-1$이므로 구하는<br>합은　$-3+(-2)+(-1)=-6$", "k": "c5", "c": ["$-7$", "$-6$", "$-5$", "$-4$", "$-3$"], "a": "$-6$", "q": "실수 전체의 집합에서 정의된 함수 $f(x)=x^{3}-3(a+1)x^{2}-4ax+2$가 임의의 두 실수 $x_{1}$, $x_{2}$에 대하여 $x_{1}\\ne x_{2}$이면 $f(x_{1})\\ne f(x_{2})$가 성립하도록 하는 모든 정수 $a$의 값의 합은?<br>", "key": "Tm05-02"}, "x05x59-009": {"id": "x05x59-009", "unit": "m05", "theme": "02", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(x)=\\dfrac{1}{3}x^{3}+ax^{2}+(3a+4)x-1$에서<br>$f' (x)=x^{2}+2ax+3a+4$<br>함수 $f(x)$가 실수 전체의 집합에서 증가하려면 모든 실수 $x$에 대하여 $f' (x)\\ge 0$이어야 하므로 이차방정식 $f' (x)=0$의 판별식을 $D$라 하면<br>$\\dfrac{D}{4}=a^{2}-3a-4\\le 0$, $(a+1)(a-4)\\le 0$<br>$\\therefore \\;-1\\le a\\le 4$<br>따라서 정수 $a$는 $-1$, $0$, $1$, $2$, $3$, $4$의 $\\mathrm{6}$개이다.", "k": "c5", "c": ["$\\mathrm{3}$", "$\\mathrm{4}$", "$\\mathrm{5}$", "$\\mathrm{6}$", "$\\mathrm{7}$"], "a": "$\\mathrm{6}$", "q": "함수 $f(x)=\\dfrac{1}{3}x^{3}+ax^{2}+(3a+4)x-1$이 실수 전체의 집합에서 증가하도록 하는 정수 $a$의 개수는?", "key": "Tm05-02"}, "x05x59-011": {"id": "x05x59-011", "unit": "m05", "theme": "02", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$x_{1}<x_{2}$인 임의의 두 실수 $x_{1}$, $x_{2}$에 대하여 $f(x_{1})>f(x_{2})$가 성립하려면 함수 $f(x)$가 실수 전체의 집합에서 감소해야 한다.<br>$f(x)=\\,-x^{3}+2ax^{2}-ax$에서<br>$f'(x)=\\,-3x^{2}+4ax-a$<br>함수 $f(x)$가 실수 전체의 집합에서 감소하려면 모든 실수 $x$에 대하여 $f'(x)\\le 0$이어야 하므로 이차방정식 $f'(x)=0$의 판별식을 $D$라 하면<br>$\\dfrac{D\\,}{4}=4a^{2}-3a\\le 0$, $a(4a-3)\\le 0\\;\\therefore \\;0\\le a\\le \\dfrac{3}{4}$<br>따라서 정수 $a$는 $0$의 $1$개이다.", "k": "num", "a": "1", "q": "함수 $f(x)=\\,-x^{3}+2ax^{2}-ax$가 $x_{1}<x_{2}$인 임의의 두 실수 $x_{1}$, $x_{2}$에 대하여 $f(x_{1})>f(x_{2})$가 성립하도록 하는 정수 $a$의 개수를 구하시오.", "key": "Tm05-02"}, "x05x59-012": {"id": "x05x59-012", "unit": "m05", "theme": "02", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "함수 $f(x)$의 역함수가 존재하려면 $f(x)$가 일대일대응이어야 하므로 실수 전체의 집합에서 $f(x)$는 증가하거나 감소해야 한다.<br>그런데 $f(x)$의 최고차항의 계수가 양수이므로 $f(x)$는 증가해야 한다.<br>$f(x)=x^{3}+x^{2}+kx-4$에서 $f' (x)=3x^{2}+2x+k$<br>함수 $f(x)$가 실수 전체의 집합에서 증가하려면 모든 실수 $x$에 대하여 $f' (x)\\ge 0$이어야 하므로 이차방정식 $f' (x)=0$의 판별식을 $D$라 하면<br>$\\dfrac{D}{4}=1-3k\\le 0\\;\\therefore \\;k\\ge \\dfrac{1}{3}$<br>따라서 정수 $k$의 최솟값은 $\\mathrm{1}$이다.", "k": "num", "a": "1", "q": "실수 전체의 집합에서 정의된 함수<br> $f(x)=x^{3}+x^{2}+kx-4$<br>의 역함수가 존재하기 위한 정수 $k$의 최솟값을 구하시오.", "key": "Tm05-02"}, "x05x59-013": {"id": "x05x59-013", "unit": "m05", "theme": "02", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$x_{1}\\ne x_{2}$이면 $f(x_{1})\\ne f(x_{2})$를 만족시키는 함수는 일대일함수이고 $f(x)$의 최고차항의 계수가 양수이므로 함수 $f(x)$는 실수 전체의 집합에서 증가해야 한다.<br>$f(x)=x^{3}-3(a+1)x^{2}-4ax+2$에서<br>$f'(x)=3x^{2}-6(a+1)x-4a$<br>함수 $f(x)$가 실수 전체의 집합에서 증가하려면 모든 실수 $x$에 대하여 $f'(x)\\ge 0$이어야 하므로 이차방정식 $f'(x)=0$의 판별식을 $D$라 하면<br>$\\dfrac{D\\,}{4}=9(a+1)^{2}+12a\\le 0$, $3a^{2}+10a+3\\le 0$<br>$(a+3)(3a+1)\\le 0\\;\\therefore \\;-3\\le a\\le \\,-\\dfrac{1}{3}$<br>따라서 정수 $a$는 $-3$, $-2$, $-1$이므로 구하는 합은<br>$-3+(-2)+(-1)=\\,-6$", "k": "c5", "c": ["$\\mathrm{-7}$", "$\\mathrm{-6}$", "$\\mathrm{-5}$", "$\\mathrm{-4}$", "$\\mathrm{-3}$"], "a": "$\\mathrm{-6}$", "q": "실수 전체의 집합에서 정의된 함수<br> $f(x)=x^{3}-3(a+1)x^{2}-4ax+2$<br>가 임의의 두 실수 $x_{1}$, $x_{2}$에 대하여 $x_{1}\\ne x_{2}$이면 $f(x_{1})\\ne f(x_{2})$가 성립하도록 하는 모든 정수 $a$의 값의 합은?", "key": "Tm05-02"}, "x05x59-087": {"id": "x05x59-087", "unit": "m05", "theme": "02", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "곡선 $y=x^{3}+3ax^{2}+3(10-3a)x$는 삼차함수의 그래프이고 직선 $y=t$는 $x$축 또는 $x$축에 평행한 직선이므로 임의의 실수 $t$에 대하여 곡선과 직선이 오직 한 점에서 만나려면 삼차함수 $y=x^{3}+3ax^{2}+3(10-3a)x$가 실수 전체의 집합에서 증가해야 한다.<br>$f(x)=x^{3}+3ax^{2}+3(10-3a)x$라 하면<br>$f' (x)=3x^{2}+6ax+3(10-3a)$<br>함수 $f(x)$가 실수 전체의 집합에서 증가하려면 모든 실수 $x$에 대하여 $f' (x)\\ge 0$이어야 한다.<br>즉 이차방정식 $f' (x)=0$이 중근 또는 허근을 가져야 하므로 판별식을 $D$라 하면<br>$\\dfrac{D}{4}=9a^{2}-9(10-3a)\\le 0$, $a^{2}+3a-10\\le 0$<br>$(a+5)(a-2)\\le 0\\;\\therefore \\;-5\\le a\\le 2$<br>따라서 정수 $a$는 $-5$, $-4$, $-3$, $\\cdots $, $2$이므로 구하는 합은<br>$-5+(-4)+(-3)+\\,\\cdots \\,+2=\\,-12$", "k": "num", "a": "-12", "q": "곡선 $y=x^{3}+3ax^{2}+3(10-3a)x$가 임의의 실수 $t$에 대하여 직선 $y=t$와 오직 한 점에서 만나도록 하는 모든 정수 $a$의 값의 합을 구하시오.", "key": "Tm05-02"}, "x05x75-010": {"id": "x05x75-010", "unit": "m05", "theme": "02", "벌": "X05x75", "lvl": 2, "fix": true, "src": "문제집 바이블개념ON", "w": "$f(x)=x^{3}-ax+3$에서<br>$f' (x)=3x^{2}-a$<br>함수 $f(x)$가 감소하는 구간이 닫힌구간 $[\\,-3,\\;b\\,]$이므로<br>$f' (x)\\le 0$인 $x$의 값의 범위가 $-3\\le x\\le b$이다.<br>즉, 이차부등식 $f' (x)\\le 0$의 해가 $-3\\le x\\le b$이므로<br>$f' (x)=3(x+3)(x-b)$<br>$=3x^{2}-3(b-3)x-9b$<br>따라서 $b-3=0$, $a=9b$에서<br>$a=27$, $b=3$<br>$\\therefore \\;a+b=27+3=30$", "k": "num", "a": "30", "q": "함수 $f(x)=x^{3}-ax+3$이 감소하는 구간이 닫힌구간 $[\\,-3,\\;b\\,]$일 때, 상수 $a,\\;b$에 대하여 $a+b$의 값을 구하시오. (단, $b>-3$)", "key": "Tm05-02"}, "x05x75-011": {"id": "x05x75-011", "unit": "m05", "theme": "02", "벌": "X05x75", "lvl": 2, "fix": true, "src": "문제집 바이블개념ON", "w": "$f(x)=-\\dfrac{1}{3}x^{3}+ax^{2}-3ax+1$에서<br>$f' (x)=-x^{2}+2ax-3a$<br>$x_{1}<x_{2}$인 임의의 두 실수 $x_{1},\\;x_{2}$에 대하여 항상 $f(x_{1})>f(x_{2})$이므로 함수 $f(x)$는 실수 전체의 집합에서 감소한다.<br>즉, 모든 실수 $x$에 대하여 $f' (x)\\le 0$이어야 하므로 이차방정식 $f' (x)=0$의 판별식을 $D$라 하면<br>$\\dfrac{D}{4}=a^{2}-3a\\le 0$, $a(a-3)\\le 0$<br>$\\therefore \\;0\\le a\\le 3$<br>따라서 실수 $a$의 최댓값은 $3$이다.", "k": "num", "a": "3", "q": "함수 $f(x)=-\\dfrac{1}{3}x^{3}+ax^{2}-3ax+1$이 $x_{1}<x_{2}$인 임의의 두 실수 $x_{1},\\;x_{2}$에 대하여 항상 $f(x_{1})>f(x_{2})$일 때, 실수 $a$의 최댓값을 구하시오.", "key": "Tm05-02"}, "x05x75-012": {"id": "x05x75-012", "unit": "m05", "theme": "02", "벌": "X05x75", "lvl": 2, "fix": true, "src": "문제집 바이블개념ON", "w": "$f(x)=ax^{3}-3x^{2}+3x+2$에서<br>$f' (x)=3ax^{2}-6x+3$<br>함수 $f(x)$의 역함수가 존재하려면 $f(x)$는 일대일대응이어야 한다. 이때 함수 $f(x)$의 최고차항의 계수가 양수이므로 $f(x)$는 실수 전체의 집합에서 증가해야 한다.<br>즉, 모든 실수 $x$에서 $f' (x)\\ge 0$이어야 하므로 이차방정식 $f' (x)=0$의 판별식을 $D$라 하면<br>$\\dfrac{D}{4}=9-9a\\le 0\\therefore \\;a\\ge 1$<br>따라서 양수 $a$의 최솟값은 $1$이다.", "k": "num", "a": "1", "q": "실수 전체의 집합에서 정의된 함수 $f(x)=ax^{3}-3x^{2}+3x+2$의 역함수가 존재하도록 하는 양수 $a$의 최솟값을 구하시오.", "key": "Tm05-02"}, "x05x75-014": {"id": "x05x75-014", "unit": "m05", "theme": "02", "벌": "X05x75", "lvl": 2, "fix": true, "src": "문제집 바이블개념ON", "w": "$f(x)=x^{3}+ax^{2}+15x+b$에서<br>$f' (x)=3x^{2}+2ax+15$<br>함수 $f(x)$가 $x=1$에서 극댓값 $8$을 가지므로<br>$f' (1)=0$, $f(x)=8$<br>$f' (1)=3+2a+15=0\\therefore \\;a=-9\\cdots \\cdots $㉠<br>$f(1)=1+a+15+b=8\\therefore \\;a+b=-8\\cdots \\cdots $㉡<br>㉠, ㉡에서 $a=-9,\\;b=1$이므로<br>$f(x)=x^{3}-9x^{2}+15x+1$<br>$f' (x)=3x^{2}-18x+15=3(x-1)(x-5)$<br>$f' (x)=0$에서 $x=1$ 또는 $x=5$<br>함수 $f(x)$의 증가와 감소를 표로 나타내면 다음과 같다.<br>$x\\cdots 1\\cdots 5\\cdots f' (x)+0-0+f(x)\\nearrow 8\\searrow -24\\nearrow $<br>따라서 함수 $f(x)$는 $x=5$에서 극솟값 $-24$를 갖는다.", "k": "num", "a": "-24", "q": "함수 $f(x)=x^{3}+ax^{2}+15x+b$가 $x=1$에서 극댓값 $8$을 가질 때, 함수 $f(x)$의 극솟값을 구하시오. (단, $a,\\;b$는 상수이다.)", "key": "Tm05-02"}, "x05x9-009": {"id": "x05x9-009", "unit": "m05", "theme": "02", "벌": "X05x9", "lvl": 2, "fix": true, "src": "주간고사 5회", "w": "$f(x)=2x^{3}-2x^{2}-ax+3$에서<br>$f'(x)=6x^{2}-4x-a$<br>함수 $f(x)$가 구간 $(-\\infty ,\\;\\infty )$에서<br>증가하려면 모든 실수 $x$에 대하여 $f'(x)\\ge 0$이어야<br>하므로 이차방정식 $f'(x)=0$의 판별식을 $D$라 하면<br>$\\dfrac{D}{4}=(-2)^{2}-6\\cdot (-a)\\le 0$<br>$4+6a\\le 0\\therefore \\;a\\le -\\dfrac{2}{3}$", "k": "c5", "c": ["$a\\le -\\dfrac{2}{3}$", "$-1\\le a\\le -\\dfrac{2}{3}$", "$0\\le a\\le \\dfrac{2}{3}$", "$0\\le a\\le 1$", "$a\\ge \\dfrac{2}{3}$"], "a": "$a\\le -\\dfrac{2}{3}$", "q": "함수 $f(x)=2x^{3}-2x^{2}-ax+3$이 구간 $(-\\infty ,\\;\\infty )$에서 증가하기 위한 실수 $a$의 값의 범위는?<br>", "key": "Tm05-02"}, "x05x9-016": {"id": "x05x9-016", "unit": "m05", "theme": "02", "벌": "X05x9", "lvl": 2, "fix": true, "src": "주간고사 5회", "w": "함수 $f(x)$의 역함수가 존재하려면 $f(x)$는<br>실수 전체의 집합에서 증가하거나 감소해야 한다.<br>이때 $f(x)$는 최고차항의 계수가 양수인 삼차함수이므로<br>$f(x)$는 모든 실수 $x$에 대하여 증가해야 한다.<br>즉, 모든 실수 $x$에 대하여 $f'(x)\\ge 0$이어야 하므로<br>$f'(x)=3x^{2}-2ax+2a\\ge 0$<br>이차방정식 $f'(x)=0$의 판별식을 $D$라 하면<br>$\\dfrac{D}{4}=a^{2}-6a\\le 0$<br>$\\therefore \\;0\\le a\\le 6$", "k": "c5", "c": ["$a<0\\;또는\\;a>0$", "$0<a<5$", "$0\\le a\\le 5$", "$0<a<6$", "$0\\le a\\le 6$"], "a": "$0\\le a\\le 6$", "q": "실수 전체에서 정의된 함수 $f(x)=x(x^{2}-ax+2a)$의 역함수가 존재하도록 실수 $a$의 값의 범위는?<br>", "key": "Tm05-02"}, "x05x107-027": {"id": "x05x107-027", "unit": "m05", "theme": "03", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=\\dfrac{1}{3}x^{3}-9x+3$에서<br>$f' (x)=x^{2}-9=(x+3)(x-3)$<br>$f'(x)=0$인 $x$의 값은 $x=-3$ 또는 $x=3$<br>함수 $f(x)$의 증가, 감소를 표로 나타내면 다음과 같다.<br>${x}{\\cdots }-3{\\cdots }3{\\cdots }{f' (x)}+0-0+{f(x)}\\nearrow 21\\searrow -15\\nearrow $<br>따라서 함수 $f(x)$는 열린구간 $(\\,-3,\\;3\\,)$에서 감소하므로 양수 $a$의 최댓값은 $3$이다.", "k": "num", "a": "3", "q": "함수 $f(x)=\\dfrac{1}{3}x^{3}-9x+3$이 열린구간 $(\\,-a,\\;a\\,)$에서 감소하도록 하는 양수 $a$의 최댓값을 구하시오.", "key": "Tm05-03"}, "x05x107-028": {"id": "x05x107-028", "unit": "m05", "theme": "03", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=-x^{3}+3x^{2}+9x$에서<br>$f' (x)=-3x^{2}+6x+9=-3(x+1)(x-3)$<br>$f'(x)=0$인 $x$의 값은 $x=-1$ 또는 $x=3$<br>함수 $f(x)$의 증가, 감소를 표로 나타내면 다음과 같다.<br>${x}{\\cdots }-1{\\cdots }3{\\cdots }{f' (x)}-0+0-{f(x)}\\searrow -5\\nearrow 27\\searrow $<br>함수 $f(x)$는 구간 $[\\,-1,\\;3\\,]$에서 증가하므로<br>$-1\\le a<3$<br>따라서 정수 $a$는 $-1,\\;0,\\;1,\\;2$의 $4$개이다.", "k": "c5", "c": ["$0$", "$1$", "$2$", "$3$", "$4$"], "a": "$4$", "q": "함수 $f(x)=-x^{3}+3x^{2}+9x$가 닫힌구간 $[\\,a,\\;3\\,]$에서 증가하도록 하는 정수 $a$의 개수는? (단, $a<3$)", "key": "Tm05-03"}, "x05x53-062": {"id": "x05x53-062", "unit": "m05", "theme": "03", "벌": "X05x53", "lvl": 2, "fix": true, "src": "문제집 개념원리", "w": "$f(x)=2x^{3}+ax^{2}+bx-1$에서<br>$f'(x)=6x^{2}+2ax+b$<br>이때 함수 $f(x)$가 감소하는 구간이 $[\\,1,\\;5\\,]$이므로 이차부등식 $f'(x)\\le 0$의 해가 $1\\le x\\le 5$이다.<br>따라서<br>$f'(x)=6(x-1)(x-5)$<br>$=6x^{2}-36x+30$<br>이므로 $2a=-36,\\;b=30$<br>$\\therefore \\;a=-18,\\;b=30$<br>$\\therefore \\;a+b=12$", "k": "num", "a": "12", "q": "함수 $f(x)=2x^{3}+ax^{2}+bx-1$이 감소하는 구간이 $[\\,1,\\;5\\,]$일 때，실수 $a,\\;b$에 대하여 $a+b$의 값을 구하시오.", "key": "Tm05-03"}, "x05x53-063": {"id": "x05x53-063", "unit": "m05", "theme": "03", "벌": "X05x53", "lvl": 2, "fix": true, "src": "문제집 개념원리", "w": "$f(x)=x^{3}+ax^{2}-(a^{2}-8a)x+3$에서<br>$f'(x)=3x^{2}+2ax-a^{2}+8a$<br>함수 $f(x)$가 실수 전체의 집합에서 증가하려면 모든 실수 $x$에 대하여 $f'(x)\\ge 0$이어야 한다.<br>따라서 이차방정식 $f'(x)=0$의 판별식을 $D$라 하면<br>$\\dfrac{D}{4}=a^{2}-3(-a^{2}+8a)\\le 0$<br>$a^{2}-6a\\le 0,\\;a(a-6)\\le 0$<br>$\\therefore \\;0\\le a\\le 6$<br>따라서 실수 $a$의 최댓값은 $6$이다.", "k": "num", "a": "6", "q": "함수 $f(x)=x^{3}+ax^{2}-(a^{2}-8a)x+3$이 실수 전체의 집합에서 증가하도록 하는 실수 $a$의 최댓값을 구하시오.", "key": "Tm05-03"}, "x05x59-005": {"id": "x05x59-005", "unit": "m05", "theme": "03", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(x)=\\,-x^{3}-3x^{2}+24x-2$에서<br>$f' (x)=\\,-3x^{2}-6x+24=\\,-3(x+4)(x-2)$<br>이때 $f' (x)\\ge 0$인 구간에서 함수 $f(x)$는 증가하므로<br>$-3(x+4)(x-2)\\ge 0$, $(x+4)(x-2)\\le 0$<br>$\\therefore \\;-4\\le x\\le 2$<br>따라서 $\\alpha =\\,-4$, $\\beta =2$이므로<br>$\\alpha +\\beta =\\,-2$", "k": "c5", "c": ["$\\mathrm{-2}$", "$\\mathrm{-1}$", "$\\mathrm{0}$", "$\\mathrm{1}$", "$\\mathrm{2}$"], "a": "$\\mathrm{-2}$", "q": "함수 $f(x)=\\,-x^{3}-3x^{2}+24x-2$가 증가하는 구간은 $[\\alpha ,\\,\\beta ]$이다. 이때 $\\alpha +\\beta $의 값은?", "key": "Tm05-03"}, "x05x59-006": {"id": "x05x59-006", "unit": "m05", "theme": "03", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(x)=x^{3}-3x+2$에서<br>$f' (x)=3x^{2}-3=3(x+1)(x-1)$<br>이때 $f' (x)\\le 0$인 구간에서 함수 $f(x)$는 감소하므로<br>$3(x+1)(x-1)\\le 0\\;\\therefore \\;-1\\le x\\le 1$<br>따라서 양수 $a$의 최댓값은 $\\mathrm{1}$이다.", "k": "num", "a": "1", "q": "함수 $f(x)=x^{3}-3x+2$가 구간 $[-a,\\,a]$에서 감소할 때, 양수 $a$의 최댓값을 구하시오.", "key": "Tm05-03"}, "x05x59-008": {"id": "x05x59-008", "unit": "m05", "theme": "03", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(x)=2x^{3}-6x^{2}+ax+7$에서<br>$f' (x)=6x^{2}-12x+a$<br>함수 $f(x)$가 감소하는 $x$의 값의 범위가 $-1\\le x\\le b$이므로 이차방정식 $f' (x)=0$의 두 근은 $-1$, $b$이다.<br>이차방정식의 근과 계수의 관계에 의하여<br>$-1+b=2$, $-1\\cdot b=\\dfrac{a}{6}\\;\\therefore \\;a=\\,-18$, $b=3$<br>$\\therefore \\;a+b=\\,-15$", "k": "num", "a": "-15", "q": "함수 $f(x)=2x^{3}-6x^{2}+ax+7$이 감소하는 $x$의 값의 범위가 $-1\\le x\\le b$일 때, 상수 $a$, $b$에 대하여 $a+b$의 값을 구하시오.", "key": "Tm05-03"}, "x05x59-010": {"id": "x05x59-010", "unit": "m05", "theme": "03", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(x)=ax^{3}+x^{2}-x$에서<br>$f' (x)=3ax^{2}+2x-1$<br>함수 $f(x)$가 구간 $(-\\infty ,\\,\\infty )$에서 감소하려면 모든 실수 $x$에 대하여 $f' (x)\\le 0$이어야 하므로<br>$a<0\\cdots \\cdots $ ㉠<br>이차방정식 $f' (x)=0$의 판별식을 $D$라 하면<br>$\\dfrac{D}{4}=1+3a\\le 0\\;\\therefore \\;a\\le \\,-\\dfrac{1}{3}\\cdots \\cdots $ ㉡<br>㉠, ㉡에서 $a\\le \\,-\\dfrac{1}{3}$", "k": "c5", "c": ["$a\\le -\\dfrac{1}{3}$", "$-\\dfrac{1}{3}\\le a<0$", "$-\\dfrac{1}{3}\\le a<\\dfrac{1}{3}$", "$0\\le a\\le \\dfrac{1}{3}$", "$a\\ge \\dfrac{1}{3}$"], "a": "$a\\le -\\dfrac{1}{3}$", "q": "함수 $f(x)=ax^{3}+x^{2}-x$가 구간 $(-\\infty ,\\,\\infty )$에서 감소하도록 하는 실수 $a$의 값의 범위는?", "key": "Tm05-03"}, "x05x59-014": {"id": "x05x59-014", "unit": "m05", "theme": "03", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "함수 $f(x)$가 모든 실수 $t$에 대하여 구간 $(-\\infty ,\\,t\\,]$에서의 최솟값이 $f(t)$가 되려면 $f(x)$는 실수 전체의 집합에서 감소 해야 한다.<br>$f(x)=\\,-2x^{3}+(a-3)x^{2}+(a-2)x+2a$에서<br>$f' (x)=\\,-6x^{2}+2(a-3)x+a-2$<br>함수 $f(x)$가 실수 전체의 집합에서 감소하려면 모든 실수 $x$에 대하여 $f' (x)\\le 0$이어야 하므로 이차방정식 $f' (x)=0$의 판별식을 $D$라 하면<br>$\\dfrac{D}{4}=(a-3)^{2}+6(a-2)\\le 0$, $a^{2}-3\\le 0$<br>$\\left(a+\\sqrt{3}\\right)\\left(a-\\sqrt{3}\\right)\\le 0\\;\\therefore \\;-\\sqrt{3}\\le a\\le \\sqrt{3}$<br>따라서 정수 $a$의 최댓값은 $\\mathrm{1}$이다.", "k": "c5", "c": ["$\\mathrm{1}$", "$\\mathrm{2}$", "$\\mathrm{3}$", "$\\mathrm{4}$", "$\\mathrm{5}$"], "a": "$\\mathrm{1}$", "q": "함수 $f(x)=\\,-2x^{3}+(a-3)x^{2}+(a-2)x+2a$가 모든 실수 $t$에 대하여 구간 $(-\\infty ,\\,t]$에서의 최솟값이 $f(t)$가 되도록 하는 정수 $a$의 최댓값은?", "key": "Tm05-03"}, "x05x59-017": {"id": "x05x59-017", "unit": "m05", "theme": "03", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(x)=x^{3}+ax^{2}-9x+1$에서 $f' (x)=3x^{2}+2ax-9$<br>함수 $f(x)$가 구간 $(-1,\\,2)$에서 감소하려면 $-1<x<2$에서 $f' (x)\\le 0$이어야 한다.<br>$f' (-1)=3-2a-9\\le 0$에서 $a\\ge \\,-3$<br>$f' (2)=12+4a-9\\le 0$에서 $a\\le \\,-\\dfrac{3}{4}$<br>따라서 $a$의 값의 범위는 $-3\\le a\\le \\,-\\dfrac{3}{4}$이므로<br>$M\\,=\\,-\\dfrac{3}{4}$, $m=\\,-3\\;\\therefore \\;M\\,m=\\dfrac{9}{4}$", "k": "c5", "c": ["$-\\dfrac{3}{4}$", "$\\dfrac{1}{2}$", "$\\dfrac{7}{4}$", "$\\dfrac{9}{4}$", "$\\dfrac{11}{2}$"], "a": "$\\dfrac{9}{4}$", "q": "함수 $f(x)=x^{3}+ax^{2}-9x+1$이 구간 $(-1,\\,2)$에서 감소하도록 하는 실수 $a$의 최댓값을 $M$, 최솟값을 $m$이라 할 때, $Mm$의 값은?", "key": "Tm05-03"}, "x05x107-038": {"id": "x05x107-038", "unit": "m05", "theme": "04", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=x^{4}-6x^{2}+2$에서<br>$f' (x)=4x^{3}-12x=4x(x^{2}-3)=4x\\left(x+\\sqrt{3}\\right)\\left(x-\\sqrt{3}\\right)$<br>$f'(x)=0$인 $x$의 값은 $x=-\\sqrt{3}$ 또는 $x=0$ 또는 $x=\\sqrt{3}$<br>함수 $f(x)$의 증가, 감소를 표로 나타내면 다음과 같다.<br>$x{\\cdots }-\\sqrt{3}{\\cdots }0{\\cdots }\\sqrt{3}{\\cdots }f'(x)-0+0-0+f(x)\\searrow -7$<br>극소$\\nearrow 2$<br>극대$\\searrow -7$<br>극소$\\nearrow $<br>함수 $f(x)$는 $x=0$에서 극댓값 $2$를 가지므로<br>$a=0,\\;b=2$<br>$\\therefore \\;a+b=2$", "k": "c5", "c": ["$1$", "$2$", "$3$", "$4$", "$5$"], "a": "$2$", "q": "함수 $f(x)=x^{4}-6x^{2}+2$가 $x=a$에서 극댓값 $b$를 가질 때, $a+b$의 값은?", "key": "Tm05-04"}, "x05x107-039": {"id": "x05x107-039", "unit": "m05", "theme": "04", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=-x^{4}+4x^{3}-4x^{2}+11$에서<br>$f'(x)=-4x^{3}+12x^{2}-8x$<br>$=-4x(x^{2}-3x+2)=-4x(x-1)(x-2)$<br>$f'(x)=0$인 $x$의 값은 $x=0$ 또는 $x=1$ 또는 $x=2$<br>함수 $f(x)$의 증가, 감소를 표로 나타내면 다음과 같다.<br>$x{\\cdots }0{\\cdots }1{\\cdots }2{\\cdots }f'(x)+0-0+0-f(x)\\nearrow 11$<br>극대$\\searrow 10$<br>극소$\\nearrow 11$<br>극대$\\searrow $<br>함수 $f(x)$는 $x=0$일 때 극댓값 $11$, $x=1$일 때 극솟값 $10$, $x=2$일 때 극댓값 $11$을 가진다.<br>따라서 구하는 극값의 합은 $11+10+11=32$", "k": "c5", "c": ["$10$", "$12$", "$21$", "$22$", "$32$"], "a": "$32$", "q": "함수 $f(x)=-x^{4}+4x^{3}-4x^{2}+11$의 모든 극값의 합은?", "key": "Tm05-04"}, "x05x107-040": {"id": "x05x107-040", "unit": "m05", "theme": "04", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=-x^{3}+3x+1$에서<br>$f'(x)=-3x^{2}+3=-3(x+1)(x-1)$<br>$f'(x)=0$인 $x$의 값은 $x=-1$ 또는 $x=1$<br>함수 $f(x)$의 증가, 감소를 표로 나타내면 다음과 같다.<br>${x}{\\cdots }-1{\\cdots }1{\\cdots }{f' (x)}-0+0-{f(x)}\\searrow -1$<br>극소$\\nearrow 3$<br>극대$\\searrow $<br>함수 $f(x)$는 $x=-1$에서 극솟값 $-1$, $x=1$에서 극댓값 $3$을 가지므로 두 점 $(-1,\\;-1),\\;(1,\\;3)$을 지나는 직선의 기울기는<br>$\\dfrac{3-(-1)}{1-(-1)}=2$", "k": "num", "a": "2", "q": "함수 $f(x)=-x^{3}+3x+1$이 $x=\\alpha ,\\;x=\\beta $에서 극값을 가질 때, 두 점 $(\\alpha ,\\;f(\\alpha )),\\;(\\beta ,\\;f(\\beta ))$를 지나는 직선의 기울기를 구하시오.", "key": "Tm05-04"}, "x05x107-042": {"id": "x05x107-042", "unit": "m05", "theme": "04", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=-x^{4}+4x^{3}$에서<br>$f' (x)=-4x^{3}+12x^{2}=-4x^{2}(x-3)$<br>$f'(x)=0$인 $x$의 값은 $x=0$ 또는 $x=3$<br>함수 $f(x)$의 증가, 감소를 표로 나타내면 다음과 같다.<br>${x}{\\cdots }0{\\cdots }3{\\cdots }{f' (x)}+0+0-{f(x)}\\nearrow 0\\nearrow 27$<br>극대$\\searrow $<br>$x=0$에서 $f'(0)=0$이지만 극값을 가지지 않으므로 $b=0$<br>$x=3$에서는 극댓값을 가지므로 $a=3$<br>$\\therefore \\;f(a)-f(b)=f(3)-f(0)=27-0=27$", "k": "c5", "c": ["$21$", "$23$", "$25$", "$27$", "$29$"], "a": "$27$", "q": "함수 $f(x)=-x^{4}+4x^{3}$에 대하여 실수 $a,\\;b$가 다음 조건을 만족시킬 때, $f(a)-f(b)$의 값을 구하시오.<br>(가) $f'(a)=f'(b)=0$<br>(나) 함수 $f(x)$는 $x=a$에서 극값을 가진다.<br>(다) 함수 $f(x)$는 $x=b$에서 극값을 가지지 않는다.", "key": "Tm05-04"}, "x05x107-043": {"id": "x05x107-043", "unit": "m05", "theme": "04", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=\\dfrac{1}{3}x^{3}-2x^{2}-12x+4$에서<br>$f' (x)=x^{2}-4x-12=(x+2)(x-6)$<br>$f'(x)=0$인 $x$의 값은 $x=-2$ 또는 $x=6$<br>함수 $f(x)$의 증가, 감소를 표로 나타내면 다음과 같다.<br>${x}{\\cdots }-2{\\cdots }6{\\cdots }{f' (x)}+0-0+{f(x)}\\nearrow $극대$\\searrow $극소$\\searrow $<br>함수 $f(x)$는 $x=-2$에서 극대이고, $x=6$에서 극소이므로<br>$\\alpha =-2$, $\\beta =6$<br>$\\therefore \\;\\beta -\\alpha =6-(-2)=8$", "k": "c5", "c": ["$-4$", "$-1$", "$2$", "$5$", "$8$"], "a": "$8$", "q": "함수 $f(x)=\\dfrac{1\\,}{3}x^{3}-2x^{2}-12x+4$가 $x=\\alpha $에서 극대이고 $x=\\beta $에서 극소일 때, $\\beta -\\alpha $의 값은? (단, $\\alpha $와 $\\beta $는 상수이다.)", "key": "Tm05-04"}, "x05x107-044": {"id": "x05x107-044", "unit": "m05", "theme": "04", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=x^{3}-3x+12$에서<br>$f' (x)=3x^{2}-3=3(x+1)(x-1)$<br>$f'(x)=0$인 $x$의 값은 $x=-1$ 또는 $x=1$<br>함수 $f(x)$의 증가, 감소를 표로 나타내면 다음과 같다.<br>${x}{\\cdots }-1{\\cdots }1{\\cdots }{f' (x)}+0-0+{f(x)}\\nearrow $극대$\\searrow $극소$\\nearrow $<br>함수 $f(x)$는 $x=1$에서 극소이므로 $a=1$<br>$f(a)=f(1)=1^{3}-3\\times 1+12=10$<br>$\\therefore \\;a+f(a)=1\\,+f(1)=1+10=11$", "k": "num", "a": "11", "q": "함수 $f(x)=x^{3}-3x+12$가 $x=a$에서 극소일 때, $a+f(a)$의 값을 구하시오. (단, $a$는 상수이다.)", "key": "Tm05-04"}, "x05x107-045": {"id": "x05x107-045", "unit": "m05", "theme": "04", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=2x^{3}+3x^{2}-12x+1$에서<br>$f' (x)=6x^{2}+6x-12=6(x+2)(x-1)$<br>$f'(x)=0$인 $x$의 값은 $x=-2$ 또는 $x=1$<br>함수 $f(x)$의 증가, 감소를 표로 나타내면 다음과 같다.<br>${x}{\\cdots }-2{\\cdots }1{\\cdots }{f' (x)}+0-0+{f(x)}\\nearrow 21$<br>극대$\\searrow -6$<br>극소$\\nearrow $<br>함수 $f(x)$는 $x=-2$에서 극대이므로 극댓값 $M$은<br>$M=f(-2)=21$<br>또한 $x=1$에서 극소이므로 극솟값 $m$은<br>$m=f(1)=-6$<br>$\\therefore \\;M+m=15$", "k": "c5", "c": ["$13$", "$14$", "$15$", "$16$", "$17$"], "a": "$15$", "q": "함수 $f(x)=2x^{3}+3x^{2}-12x+1$의 극댓값과 극솟값을 각각 $M$, $m$이라 할 때, $M+m$의 값은?", "key": "Tm05-04"}, "x05x13-007": {"id": "x05x13-007", "unit": "m05", "theme": "04", "벌": "X05x13", "lvl": 2, "fix": true, "src": "주간고사 7회", "w": "$f(x)=x^{3}+ax^{2}+bx+c$<br>$f'(x)=3x^{2}+2ax+b$<br>$f'(-2)=0\\therefore \\;-4a+b=-12$　…… ㉠<br>$f'(0)=0\\therefore \\;b=0$　…… ㉡<br>$f(-2)=3\\therefore \\;4a-2b+c=11$　…… ㉢<br>㉠, ㉡, ㉢ 연립에 의해<br>$a=3,\\;b=0,\\;c=-1$<br>$\\therefore $ 극솟값 $=f(0)=c=-1$", "k": "c5", "c": ["$-1$", "$0$", "$1$", "$2$", "$3$"], "a": "$-1$", "q": "$f(x)=x^{3}+ax^{2}+bx+c$는 $x=-2$에서 극댓값 3을 갖고 $x=0$에서 극솟값을 가질 때, 극솟값은?<br>", "key": "Tm05-04"}, "x05x53-072": {"id": "x05x53-072", "unit": "m05", "theme": "04", "벌": "X05x53", "lvl": 2, "fix": true, "src": "문제집 개념원리", "w": "$f(x)=-2x^{3}+15x^{2}-24x-2$에서<br>$f'(x)=-6x^{2}+30x-24$<br>$=-6(x-1)(x-4)$<br>$f'(x)=0$에서 $x=1$ 또는 $x=4$<br>함수 $f(x)$의 증가와 감소를 표로 나타내면 다음과 같다.<br>${x}{\\cdots }1{\\cdots }4{\\cdots }{f' (x)}-0+0-{f(x)}\\searrow -13\\nearrow 14\\searrow $<br>따라서 함수 $f(x)$는<br>$x=1$에서 극솟값 $-13$, $x=4$에서 극댓값 $14$<br>를 가지므로 극댓값과 극솟값의 차는<br>$14-(-13)=27$", "k": "num", "a": "27", "q": "함수 $f(x)=-2x^{3}+15x^{2}-24x-2$의 극댓값과 극솟값의 차를 구하시오.", "key": "Tm05-04"}, "x05x59-023": {"id": "x05x59-023", "unit": "m05", "theme": "04", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(x)=x^{3}-6x^{2}+9x+1$에서<br>$f' (x)=3x^{2}-12x+9=3(x-1)(x-3)$<br>$f' (x)=0$에서 $x=1$ 또는 $x=3$<br>$x\\cdots \\mathrm{1}\\cdots \\mathrm{3}\\cdots f' (x)+\\mathrm{0}-\\mathrm{0}+f(x)\\nearrow \\mathrm{5}\\searrow \\mathrm{1}\\nearrow $<br>따라서 함수 $f(x)$는<br>$x=1$일 때 극댓값 $\\mathrm{5}$, $x=3$일 때 극솟값 $\\mathrm{1}$을 가지므로 극댓값과 극솟값의 차는<br>$5-1=4$", "k": "num", "a": "4", "q": "함수 $f(x)=x^{3}-6x^{2}+9x+1$의 극댓값과 극솟값의 차를 구하시오.", "key": "Tm05-04"}, "x05x75-017": {"id": "x05x75-017", "unit": "m05", "theme": "04", "벌": "X05x75", "lvl": 2, "fix": true, "src": "문제집 바이블개념ON", "w": "$f(x)=x^{3}+6x^{2}-15x+3$에서<br>$f' (x)=3x^{2}+12x-15=3(x+5)(x-1)$이므로<br>$f' (x)=0$에서 $x=-5$ 또는 $x=1$<br>함수 $f(x)$의 증가와 감소를 표로 나타내면 다음과 같다.<br>$x\\cdots -5\\cdots 1\\cdots f' (x)+0-0+f(x)\\nearrow 103\\searrow -5\\nearrow $<br>따라서 함수 $f(x)$는 $x=1$에서 극솟값 $-5$를 가지므로 $a=1,\\;b=-5$<br>$\\therefore \\;a+b=1+(-5)=-4$", "k": "num", "a": "-4", "q": "함수 $f(x)=x^{3}+6x^{2}-15x+3$이 $x=a$에서 극솟값 $b$를 가질 때, 상수 $a,\\;b$에 대하여 $a+b$의 값을 구하시오.", "key": "Tm05-04"}, "x05x9-005": {"id": "x05x9-005", "unit": "m05", "theme": "05", "벌": "X05x9", "lvl": 1, "fix": true, "src": "주간고사 5회", "w": "다항함수의 극댓값을 구할 수 있는가?<br>$f(x)=x^{3}+ax^{2}+bx+1$에서<br>$f'(x)=3x^{2}+2ax+b$<br>함수 $f(x)$는 $x=-1$에서 극대, $x=3$에서<br>극소이므로<br>$3x^{2}+2ax+b=3(x+1)(x-3)$<br>$=3x^{2}-6x-9$<br>따라서 $a=-3,\\;b=-9$이고,<br>$f(x)=x^{3}-3x^{2}-9x+1$이므로<br>함수 $f(x)$의 극댓값은<br>$f(-1)=-1-3+9+1=6$", "k": "c5", "c": ["$0$", "$3$", "$6$", "$9$", "$12$"], "a": "$6$", "q": "함수 $f(x)=x^{3}+ax^{2}+bx+1$은 $x=-1$에서 극대이고, $x=3$에서 극소이다. 함수 $f(x)$의 극댓값은? (단, $a$, $b$는 상수이다.)<br>", "key": "Tm05-05"}, "x05x107-046": {"id": "x05x107-046", "unit": "m05", "theme": "05", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=x^{3}+3ax+b$에서 $f'(x)=3x^{2}+3a$<br>함수 $f(x)$가 $x=1$에서 극솟값 $0$을 가지므로<br>$f'(1)=0,\\;f(1)=0$<br>$f'(1)=0$에서 $3+3a=0\\cdots \\cdots $㉠<br>$f(1)=0$에서 $1+3a+b=0\\cdots \\cdots $㉡<br>㉠, ㉡을 연립하여 풀면 $a=-1,\\;b=2$<br>즉, $f(x)=x^{3}-3x+2$이므로<br>$f'(x)=3x^{2}-3=3(x+1)(x-1)$<br>$f'(x)=0$인 $x$의 값은 $x=-1$ 또는 $x=1$<br>함수 $f(x)$의 증가, 감소를 표로 나타내면 다음과 같다.<br>${x}{\\cdots }-1{\\cdots }1{\\cdots }{f' (x)}+0-0+{f(x)}\\nearrow 4$<br>극대$\\searrow 0$<br>극소$\\nearrow $<br>따라서 함수 $f(x)$의 극댓값은 $f(-1)=4$", "k": "c5", "c": ["$2$", "$4$", "$6$", "$8$", "$10$"], "a": "$4$", "q": "함수 $f(x)=x^{3}+3ax+b$가 $x=1$에서 극솟값 $0$을 가질 때, $f(x)$의 극댓값은? (단, $a,\\;b$는 상수이다.)", "key": "Tm05-05"}, "x05x107-047": {"id": "x05x107-047", "unit": "m05", "theme": "05", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=2x^{3}-12x^{2}+ax-4$에서 $f'(x)=6x^{2}-24x+a$<br>함수 $f(x)$가 $x=1$에서 극댓값을 가지므로 $f'(1)=0$에서<br>$6-24+a=0\\therefore \\;a=18$<br>즉, $f(x)=2x^{3}-12x^{2}+18x-4$이므로 극댓값은 $f(1)=4$<br>따라서 $M=4$이므로<br>$a+M=18+4=22$", "k": "c5", "c": ["$14$", "$16$", "$18$", "$20$", "$22$"], "a": "$22$", "q": "함수 $f(x)=2x^{3}-12x^{2}+ax-4$가 $x=1$에서 극댓값 $M$을 가질 때, $a+M$의 값은? (단, $a$는 상수이다.)", "key": "Tm05-05"}, "x05x107-048": {"id": "x05x107-048", "unit": "m05", "theme": "05", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=ax^{3}+bx$에서 $f'(x)=3ax^{2}+b\\cdots \\cdots $㉠<br>함수 $f(x)$가 $x=-1$, $x=1$에서 극값을 가지므로<br>$f'(-1)=f'(1)=0$에서<br>$f'(x)=3a(x+1)(x-1)=3ax^{2}-3a\\cdots \\cdots $㉡<br>㉠, ㉡에서 $b=-3a$<br>$a>0$이므로 함수 $f(x)=ax^{3}-3ax$의 증가, 감소를 표로 나타내면 다음과 같다.<br>${x}{\\cdots }-1{\\cdots }1{\\cdots }{f' (x)}+0-0+{f(x)}\\nearrow 2a$<br>극대$\\searrow -2a$<br>극소$\\nearrow $<br>함수 $f(x)$는 $x=1$에서 극솟값 $-2$를 가지므로<br>$f(1)=-2$에서<br>$-2a=-2\\therefore a=1$<br>따라서 $f(x)=x^{3}-3x$이므로 함수 $f(x)$의 극댓값은<br>$f(-1)=2$", "k": "c5", "c": ["$-2$", "$0$", "$2$", "$4$", "$6$"], "a": "$2$", "q": "함수 $f(x)=ax^{3}+bx(a>0)$가 $x=-1$, $x=1$에서 극값을 가지고 극솟값이 $-2$일 때, $f(x)$의 극댓값은? (단, $a$, $b$는 상수이다.)", "key": "Tm05-05"}, "x05x107-049": {"id": "x05x107-049", "unit": "m05", "theme": "05", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=kx^{3}-9kx^{2}+24kx$에서<br>$f'(x)=3kx^{2}-18kx+24k=3k(x-2)(x-4)$<br>$f'(x)=0$인 $x$의 값은 $x=2$ 또는 $x=4$<br>이때 $k>0$이므로 함수 $f(x)$의 증가, 감소를 표로 나타내면 다음과 같다.<br>${x}{\\cdots }2{\\cdots }4{\\cdots }{f' (x)}+0-0+{f(x)}\\nearrow 20k$<br>극대$\\searrow 16k$<br>극소$\\nearrow $<br>함수 $f(x)$의 극댓값은 $f(2)=20k$, 극솟값은 $f(4)=16k$이고, 그 차가 $24$이므로<br>$20k-16k=24$, $4k=24\\therefore k=6$", "k": "c5", "c": ["$2$", "$4$", "$6$", "$8$", "$10$"], "a": "$6$", "q": "함수 $f(x)=kx^{3}-9kx^{2}+24kx$가 극댓값과 극솟값을 가지고 그 차가 $24$일 때, 양수 $k$의 값은?", "key": "Tm05-05"}, "x05x107-051": {"id": "x05x107-051", "unit": "m05", "theme": "05", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=2x^{3}+ax^{2}+bx+c$ ($a$, $b$, $c$는 상수)라 하면<br>$f'(x)=6x^{2}+2ax+b$<br>함수 $f(x)$가 $x=0$에서 극솟값을 가지므로<br>$f'(0)=0$에서 $b=0\\cdots \\cdots $㉠<br>$x=-3$에서 극댓값 $2$를 가지므로<br>$f'(-3)=0$, $f(-3)=2$<br>$f'(-3)=0$에서 $54-6a+b=0\\cdots \\cdots $㉡<br>$f(-3)=2$에서 $-54+9a-3b+c=2\\cdots \\cdots $㉢<br>㉠, ㉡, ㉢에서 $a=9$, $b=0$, $c=-25$<br>따라서 $f(x)=2x^{3}+9x^{2}-25$이므로 극솟값은<br>$f(0)=-25$", "k": "num", "a": "-25", "q": "최고차항의 계수가 $2$인 삼차함수 $f(x)$가 $x=0$에서 극솟값을 가지고 $x=-3$에서 극댓값 $2$를 가질 때, $f(x)$의 극솟값을 구하시오.", "key": "Tm05-05"}, "x05x107-052": {"id": "x05x107-052", "unit": "m05", "theme": "05", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$g(x)=(x^{3}+2)f(x)$에서 $g'(x)=3x^{2}f(x)+(x^{3}+2)f'(x)$<br>함수 $g(x)$가 $x=1$에서 극솟값 $24$를 가지므로<br>$g(1)=24$, $g'(1)=0$<br>$g(1)=24$에서 $3f(1)=24$이므로 $f(1)=8$<br>$g'(1)=0$에서 $3\\,f(1)+3f'(1)=0$이므로<br>$3\\times 8+3f'(1)=0\\therefore f'(1)=-8$<br>$\\therefore f(1)-f' (1)=8-(-8)=16$", "k": "num", "a": "16", "q": "두 다항함수 $f(x)$와 $g(x)$가 모든 실수 $x$에 대하여 $g(x)=(x^{3}+2)f(x)$를 만족시킨다. 함수 $g(x)$가 $x=1$에서 극솟값 $24$를 가질 때, $f(1)-f'(1)$의 값을 구하시오.", "key": "Tm05-05"}, "x05x107-053": {"id": "x05x107-053", "unit": "m05", "theme": "05", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "(가)에서 $\\lim\\limits _{x\\,\\rightarrow \\,\\infty }{\\,}\\dfrac{f(x)}{x^{3}}=1$이므로 $f(x)$는 삼차항의 계수가 $1$인 삼차함수이다.<br>즉, $f'(x)$는 이차항의 계수가 $3$인 이차함수이고 (나)에서 함수 $f(x)$가 $x=-1$과 $x=2$에서 극값을 가지므로<br>$f' (-1)=0$, $f'(2)=0$<br>즉, $f'(x)=3(x+1)(x-2)$<br>$\\therefore \\lim\\limits _{h\\,\\rightarrow \\,0}{\\,}\\dfrac{f(3+h)-f(3-h)}{h}$<br>$=\\lim\\limits _{h\\,\\rightarrow \\,0}{\\,}\\dfrac{\\left\\{f(3+h)-f(3)\\right\\}-\\left\\{f(3-h)-f(3)\\right\\}}{h}$<br>$=\\lim\\limits _{h\\,\\rightarrow \\,0}{\\,}\\dfrac{f(3+h)-f(3)}{h}+\\lim\\limits _{h\\,\\rightarrow \\,0}{\\,}\\dfrac{f(3-h)-f(3)}{-h}$<br>$=2f'(3)=2\\times 12=24$", "k": "c5", "c": ["$8$", "$12$", "$16$", "$20$", "$24$"], "a": "$24$", "q": "다항함수 $f(x)$는 다음 조건을 만족시킨다.<br>(가) $\\lim\\limits _{x\\,\\rightarrow \\,\\infty }{\\,}\\dfrac{f(x)}{x^{3}}=1$<br>(나) $x=-1$과 $x=2$에서 극값을 가진다.<br>$\\lim\\limits _{h\\,\\rightarrow \\,0}{\\,}\\dfrac{f(3+h)-f(3-h)}{h}$의 값은?", "key": "Tm05-05"}, "x05x107-054": {"id": "x05x107-054", "unit": "m05", "theme": "05", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=2x^{3}-9x^{2}+ax+5$에서<br>$f' (x)=6x^{2}-18x+a$<br>함수 $f(x)$가 $x=1$에서 극대이므로 $f'(1)=0$<br>$6-18+a=0\\therefore \\;a=12$<br>즉, $f' (x)=6x^{2}-18x+12=6(x-1)(x-2)$<br>$f'(x)=0$인 $x$의 값은 $x=1$ 또는 $x=2$<br>함수 $f(x)$의 증가, 감소를 표로 나타내면 다음과 같다.<br>${x}{\\cdots }1{\\cdots }2{\\cdots }{f' (x)}+0-0+{f(x)}\\nearrow $극대$\\searrow $극소$\\nearrow $<br>함수 $f(x)$는 $x=2$에서 극소이므로 $b=2$<br>$\\therefore \\;a+b=12+2=14$", "k": "c5", "c": ["$12$", "$14$", "$16$", "$18$", "$20$"], "a": "$14$", "q": "함수 $f(x)=2x^{3}-9x^{2}+ax+5$는 $x=1$에서 극대이고, $x=b$에서 극소이다. $a+b$의 값은? (단, $a$, $b$는 상수이다.)", "key": "Tm05-05"}, "x05x107-055": {"id": "x05x107-055", "unit": "m05", "theme": "05", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=ax^{3}+bx+a$에서 $f' (x)=3ax^{2}+b$<br>함수 $f(x)$가 $x=1$에서 극솟값 $-2$를 가지므로<br>$f(1)=-2$, $f'(1)=0$<br>$f(1)=-2$에서<br>$a+b+a=-2\\therefore \\;2a+b=-2\\cdots \\cdots $ ㉠<br>$f'(1)=0$에서<br>$3a+b=0\\cdots \\cdots $ ㉡<br>㉠과 ㉡을 연립하여 풀면<br>$a=2$, $b=-6$<br>즉, $f(x)=2x^{3}-6x+2$이므로<br>$f' (x)=6x^{2}-6=6(x+1)(x-1)$<br>$f'(x)=0$인 $x$의 값은 $x=-1$ 또는 $x=1$<br>함수 $f(x)$의 증가, 감소를 표로 나타내면 다음과 같다.<br>${x}{\\cdots }-1{\\cdots }1{\\cdots }{f' (x)}+0-0+{f(x)}\\nearrow 6$<br>극대$\\searrow -2$<br>극소$\\nearrow $<br>따라서 함수 $f(x)$는 $x=-1$에서 극댓값 $6$을 가진다.", "k": "num", "a": "6", "q": "두 상수 $a$, $b$에 대하여 삼차함수 $f(x)=ax^{3}+bx+a$는 $x=1$에서 극소이다. 함수 $f(x)$의 극솟값이 $-2$일 때, 함수 $f(x)$의 극댓값을 구하시오.", "key": "Tm05-05"}, "x05x107-056": {"id": "x05x107-056", "unit": "m05", "theme": "05", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=-x^{4}+8a^{2}x^{2}-1$에서<br>$f' (x)=-4x^{3}+16a^{2}x=-4x(x+2a)(x-2a)$<br>$f'(x)=0$인 $x$의 값은 $x=-2a$ 또는 $x=0$ 또는 $x=2a$<br>$a>0$이므로 함수 $f(x)$의 증가, 감소를 표로 나타내면 다음과 같다.<br>${x}{\\cdots }-2a{\\cdots }0{\\cdots }2a{\\cdots }{f' (x)}+0-0+0-{f(x)}\\nearrow $극대$\\searrow $극소$\\nearrow $극대$\\searrow $<br>이때 함수 $f(x)$가 $x=b$, $x=2-2b$에서 극대이고, $b>1$이므로<br>$-2a=2-2b$, $2a=b$<br>두 식을 연립하여 풀면 $a=1$, $b=2$<br>$\\therefore a+b=3$", "k": "c5", "c": ["$3$", "$5$", "$7$", "$9$", "$11$"], "a": "$3$", "q": "함수 $f(x)=-x^{4}+8a^{2}x^{2}-1$이 $x=b$와 $x=2-2b$에서 극대일 때, $a+b$의 값은? (단, $a$, $b$는 $a>0$, $b>1$인 상수이다.)", "key": "Tm05-05"}, "x05x13-020": {"id": "x05x13-020", "unit": "m05", "theme": "05", "벌": "X05x13", "lvl": 2, "fix": true, "src": "주간고사 7회", "w": "$f(x)=-\\dfrac{1}{2}x^{3}+\\dfrac{3}{4}ax^{2}+16$에서<br>$f'(x)=-\\dfrac{3}{2}x^{2}+\\dfrac{3a}{2}x=-\\dfrac{3}{2}x(x-a)$<br>$f'(x)=0$에서<br>$x=a$ 또는 $x=0$<br>곡선 $y=f(x)$가 $x$축에 접하므로 함수 $f(x)$의 극값이<br>0이다.<br>즉, $f(0)=0$ 또는 $f(a)=0$<br>$f(0)=16$이므로 $f(a)=0$이어야 한다.<br>$f(a)=-\\dfrac{1}{2}a^{3}+\\dfrac{3}{4}a^{3}+16=\\dfrac{1}{4}a^{3}+16=0$<br>$\\dfrac{1}{4}(a^{3}+64)=0,\\;\\dfrac{1}{4}(a+4)(a^{2}-4a+16)=0$<br>모든 실수 $a$에 대하여<br>$a^{2}-4a+16=(a-2)^{2}+12>0$이므로<br>$a=-4$<br>따라서 $f(x)=-\\dfrac{1}{2}x^{3}-3x^{2}+16$ 이므로<br>$f(-a)=f(4)$<br>$=-32-48+16$<br>$=-64$", "k": "c5", "c": ["$-68$", "$-66$", "$-64$", "$-62$", "$-60$"], "a": "$-64$", "q": "함수 $f(x)=-\\dfrac{1}{2}x^{3}+\\dfrac{3}{4}ax^{2}+16$에 대하여 곡선 $y=f(x)$가 $x$축에 접할 때, $f(-a)$의 값은? (단, $a$는 실수이다.)<br>", "key": "Tm05-05"}, "x05x53-077": {"id": "x05x53-077", "unit": "m05", "theme": "05", "벌": "X05x53", "lvl": 2, "fix": true, "src": "문제집 개념원리", "w": "$f(x)=ax^{3}+bx^{2}+3bx+2$에서<br>$f' (x)=3ax^{2}+2bx+3b$<br>함수 $f(x)$가 $x=-1$에서 극댓값, $x=3$에서 극솟값을 가지므로<br>$f'(-1)=0$, $f'(3)=0$<br>$3a-2b+3b=0$, $27a+6b+3b=0$<br>$\\therefore \\;b=-3a\\cdots \\cdots $㉠<br>또 극댓값과 극솟값의 차가 $32$이므로<br>$f(-1)-f(3)=32$<br>$(-a+b-3b+2)-(27a+9b+9b+2)=32$<br>$\\therefore \\;7a+5b=-8\\cdots \\cdots $㉡<br>㉠을 ㉡에 대입하면<br>$7a-15a=-8$<br>$\\therefore \\;a=1$<br>$a=1$을 ㉠에 대입하면<br>$b=-3$<br>$\\therefore \\;ab=-3$", "k": "num", "a": "-3", "q": "함수 $f(x)=ax^{3}+bx^{2}+3bx+2(a>0)$가 $x=-1$에서 극댓값, $x=3$에서 극솟값을 갖고 극댓값과 극솟값의 차가 $32$일 때, 상수 $a$, $b$에 대하여 $ab$의 값을 구하시오.", "key": "Tm05-05"}, "x05x53-078": {"id": "x05x53-078", "unit": "m05", "theme": "05", "벌": "X05x53", "lvl": 2, "fix": true, "src": "문제집 개념원리", "w": "$f(x)=x^{3}+ax^{2}-24x+b$에서<br>$f'(x)=3x^{2}+2ax-24$<br>함수 $f(x)$가 $x=-4$에서 극댓값을 가지므로<br>$f'(-4)=0$<br>$48-8a-24=0\\therefore \\;a=3$<br>$\\therefore f(x)=x^{3}+3x^{2}-24x+b$,<br>$f'(x)=3x^{2}+6x-24=3(x+4)(x-2)$<br>$f'(x)=0$에서<br>$x=-4$ 또는 $x=2$<br>함수 $f(x)$의 증가와 감소를 표로 나타내면 다음과 같다.<br>${x}{\\cdots }-4{\\cdots }2{\\cdots }{f' (x)}+0-0+{f(x)}\\nearrow b+80\\searrow b-28\\nearrow $<br>따라서 함수 $f(x)$는<br>$x=-4$에서 극댓값 $b+80$,<br>$x=2$에서 극솟값 $b-28$<br>을 가지므로<br>$b+80=d$, $c=2$, $b-28=2$<br>$\\therefore \\;b=30$, $c=2$, $d=110$<br>$\\therefore \\;a+b+c+d=145$", "k": "num", "a": "145", "q": "함수 $f(x)=x^{3}+ax^{2}-24x+b$가 $x=c$에서 극솟값 $2$, $x=-4$에서 극댓값 $d$를 가질 때, $a+b+c+d$의 값을 구하시오.<br>(단, $a$, $b$는 상수이다.)", "key": "Tm05-05"}, "x05x59-026": {"id": "x05x59-026", "unit": "m05", "theme": "05", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(x)=3x^{4}-4x^{3}-12x^{2}+3$에서<br>$f' (x)=12x^{3}-12x^{2}-24x=12x(x+1)(x-2)$<br>$f' (x)=0$에서 $x=\\,-1$ 또는 $x=0$ 또는 $x=2$<br>$x\\cdots \\mathrm{-1}\\cdots \\mathrm{0}\\cdots \\mathrm{2}\\cdots f' (x)-\\mathrm{0}+\\mathrm{0}-\\mathrm{0}+f(x)\\searrow \\mathrm{-2}\\nearrow \\mathrm{3}\\searrow \\mathrm{-29}\\nearrow $<br>따라서 함수 $f(x)$는 $x=\\,-1$일 때 극솟값 $-2$, $x=0$일 때 극댓값 $3$, $x=2$일 때 극솟값 $\\mathrm{-29}$를 가지므로 구하는 극값의 합은<br>$-2+3+(-29)=\\,-28$", "k": "c5", "c": ["$\\mathrm{-31}$", "$\\mathrm{-28}$", "$\\mathrm{-23}$", "$\\mathrm{-18}$", "$\\mathrm{-12}$"], "a": "$\\mathrm{-28}$", "q": "함수 $f(x)=3x^{4}-4x^{3}-12x^{2}+3$의 모든 극값의 합은?", "key": "Tm05-05"}, "x05x59-029": {"id": "x05x59-029", "unit": "m05", "theme": "05", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(x)=\\,-x^{3}+ax+b$에서<br>$f'(x)=\\,-3x^{2}+a$<br>함수 $f(x)$가 $x=1$에서 극댓값 $6$을 가지므로<br>$f(1)=6$, $f'(1)=0$<br>$-1+a+b=6$, $-3+a=0$<br>$\\therefore \\;a=3$, $b=4$<br>즉 $f(x)=\\,-x^{3}+3x+4$이므로<br>$f'(x)=\\,-3x^{2}+3=\\,-3(x+1)(x-1)$<br>$x\\cdots -1\\cdots 1\\cdots f'(x)-0+0-f(x)\\searrow 2\\nearrow 6\\searrow f'(x)=0$에서 $x=\\,-1$ 또는 $x=1$<br>따라서 함수 $f(x)$는<br>$x=\\,-1$에서 극솟값 $2$를 갖는다.", "k": "num", "a": "2", "q": "함수 $f(x)=\\,-x^{3}+ax+b$가 $x=1$에서 극댓값 $6$을 가질 때, 함수 $f(x)$의 극솟값을 구하시오. (단, $a$, $b$는 상수이다.)", "key": "Tm05-05"}, "x05x59-032": {"id": "x05x59-032", "unit": "m05", "theme": "05", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(x)=\\,-x^{3}-\\dfrac{3}{2}ax^{2}+6a^{2}x$에서<br>$f' (x)=\\,-3x^{2}-3ax+6a^{2}=\\,-3(x+2a)(x-a)$<br>$f' (x)=0$에서 $x=\\,-2a$ 또는 $x=a$<br>$x\\cdots -2a\\cdots a\\cdots f' (x)-\\mathrm{0}+\\mathrm{0}-f(x)\\searrow -10a^{3}\\nearrow \\dfrac{7}{2}a^{3}\\searrow $<br>$a>0$이므로 함수 $f(x)$는 $x=\\,-2a$에서 극솟값 $-10a^{3}$을 갖고, $x=a$에서 극댓값 $\\dfrac{7}{2}a^{3}$을 갖는다.<br>이때 극댓값과 극솟값의 차가 $\\dfrac{1}{2}$이므로<br>$\\dfrac{7}{2}a^{3}-(-10a^{3})=\\dfrac{1}{2}$, $a^{3}=\\dfrac{1}{27}$<br>$\\therefore \\;a=\\dfrac{1}{3}$", "k": "num", "a": "1/3", "q": "함수 $f(x)=\\,-x^{3}-\\dfrac{3}{2}ax^{2}+6a^{2}x$의 극댓값과 극솟값의 차가 $\\dfrac{1}{2}$일 때, 양수 $a$의 값을 구하시오.", "key": "Tm05-05"}, "x05x75-020": {"id": "x05x75-020", "unit": "m05", "theme": "05", "벌": "X05x75", "lvl": 2, "fix": true, "src": "문제집 바이블개념ON", "w": "$f(x)=x^{3}+ax^{2}+bx+7$에서<br>$f' (x)=3x^{2}+2ax+b$<br>함수 $f(x)$가 $x=-3$에서 극댓값 $7$을 가지므로<br>$f' (-3)=0,\\;f(-3)=7$<br>$f' (-3)=27-6a+b=0$에서 $6a-b=27\\cdots \\cdots $㉠<br>$f(-3)=-27+9a-3b+7=7$에서 $3a-b=9\\cdots \\cdots $㉡<br>㉠, ㉡에서 $a=6,\\;b=9$이므로<br>$f(x)=x^{3}+6x^{2}+9x+7$<br>$f' (x)=3x^{2}+12x+9=3(x+1)(x+3)$<br>$f' (x)=0$에서 $x=-3$ 또는 $x=-1$<br>함수 $f(x)$의 증가와 감소를 표로 나타내면 다음과 같다.<br>$x\\cdots -3\\cdots -1\\cdots f' (x)+0-0+f(x)\\nearrow 7\\searrow 3\\nearrow $<br>따라서 함수 $f(x)$는 $x=-1$에서 극솟값 $3$을 갖는다.", "k": "num", "a": "3", "q": "함수 $f(x)=x^{3}+ax^{2}+bx+7$이 $x=-3$에서 극댓값 $7$을 가질 때, 함수 $f(x)$의 극솟값을 구하시오. (단, $a,\\;b$는 상수이다.)", "key": "Tm05-05"}, "x05x75-021": {"id": "x05x75-021", "unit": "m05", "theme": "05", "벌": "X05x75", "lvl": 2, "fix": true, "src": "문제집 바이블개념ON", "w": "$f(x)=-x^{3}+ax^{2}+bx+10$에서<br>$f' (x)=-3x^{2}+2ax+b$<br>함수 $f(x)$가 $x=-3$에서 극솟값 $-17$을 가지므로<br>$f' (-3)=0$, $f(-3)=-17$<br>$f' (-3)=-27-6a+b=0$에서<br>$6a-b=-27\\cdots \\cdots $㉠<br>$f(-3)=27+9a-3b+10=-17$에서<br>$3a-b=-18\\cdots \\cdots $㉡<br>㉠, ㉡에서 $a=-3$, $b=9$이므로<br>$f(x)=-x^{3}-3x^{2}+9x+10$<br>$f' (x)=-3x^{2}-6x+9=-3(x+3)(x-1)$<br>$f' (x)=0$에서 $x=-3$ 또는 $x=1$<br>함수 $f(x)$의 증가와 감소를 표로 나타내면 다음과 같다.<br>$x\\cdots -3\\cdots 1\\cdots f' (x)-0+0-f(x)\\searrow -17\\nearrow 15\\searrow $<br>따라서 함수 $f(x)$는 $x=1$에서 극댓값 $15$을 갖는다.", "k": "num", "a": "15", "q": "함수 $f(x)=-x^{3}+ax^{2}+bx+10$이 $x=-3$에서 극솟값 $-17$을 가질 때, 함수 $f(x)$의 극댓값을 구하시오. (단, $a,\\;b$는 상수이다.)", "key": "Tm05-05"}, "x05x75-022": {"id": "x05x75-022", "unit": "m05", "theme": "05", "벌": "X05x75", "lvl": 2, "fix": true, "src": "문제집 바이블개념ON", "w": "$f(x)=-2x^{3}+ax^{2}+bx+3$에서<br>$f' (x)=-6x^{2}+2ax+b$<br>함수 $f(x)$가 $x=-1,\\;x=2$에서 극값을 가지므로<br>$f' (-1)=0$, $f' (2)=0$<br>즉, 이차방정식 $f' (x)=0$의 두 실근이 $x=-1,\\;x=2$이므로<br>$f' (x)=-6(x+1)(x-2)=-6x^{2}+6x+12$<br>따라서 $2a=6,\\;b=12$이므로<br>$a=3,\\;b=12$<br>$f(x)=-2x^{3}+3x^{2}+12x+3$이므로<br>$f(-1)=2+3-12+3=-4$<br>$f(2)=(-16)+12+24+3=23$<br>따라서 함수 $f(x)$의 극댓값과 극솟값의 합은<br>$23+(-4)=19$", "k": "num", "a": "19", "q": "함수 $f(x)=-2x^{3}+ax^{2}+bx+3$이 $x=-1$에서 극솟값을 갖고, $x=2$에서 극댓값을 가질 때, 함수 $f(x)$의 극댓값과 극솟값의 합을 구하시오. (단, $a,\\;b$는 상수이다.)", "key": "Tm05-05"}, "x05x75-023": {"id": "x05x75-023", "unit": "m05", "theme": "05", "벌": "X05x75", "lvl": 2, "fix": true, "src": "문제집 바이블개념ON", "w": "$f(x)=\\dfrac{1}{2}x^{3}-3ax^{2}+2a$에서<br>$f' (x)=\\dfrac{3}{2}x^{2}-6ax=\\dfrac{3}{2}x(x-4a)$<br>$f' (x)=0$에서 $x=0$ 또는 $x=4a$<br>함수 $f(x)$의 증가와 감소를 표로 나타내면 다음과 같다.<br>$x\\cdots 0\\cdots 4a\\cdots f' (x)+0-0+f(x)\\nearrow 2a\\searrow -16a^{3}+2a\\nearrow $<br>함수 $f(x)$는 $x=0$에서 극댓값 $2a$, $x=4a$에서 극솟값<br>$-16a^{3}+2a$를 갖고, 극댓값과 극솟값의 절댓값이 같으므로<br>$2a+(-16a^{3}+2a)=0$, $-4a(2a+1)(2a-1)=0$<br>$\\therefore \\;a=\\dfrac{1}{2}$ ($\\because \\;a>0$)", "k": "num", "a": "1/2", "q": "함수 $f(x)=\\dfrac{1}{2}x^{3}-3ax^{2}+2a$의 극댓값과 극솟값의 절댓값이 같을 때, 양수 $a$의 값을 구하시오.", "key": "Tm05-05"}, "x05x75-024": {"id": "x05x75-024", "unit": "m05", "theme": "05", "벌": "X05x75", "lvl": 2, "fix": true, "src": "문제집 바이블개념ON", "w": "$f(x)=x^{3}+ax^{2}+bx+2$에서<br>$f' (x)=3x^{2}+2ax+b$<br>미분가능한 함수 $f(x)$가 $x=-2$에서 극값을 가지므로<br>$f' (-2)=12-4a+b=0$<br>$\\therefore \\;4a-b=12\\cdots \\cdots $㉠<br>곡선 $y=f(x)$ 위의 $x=2$인 점에서의 접선의 기울기가 $12$이므로<br>$f' (2)=12+4a+b=12$<br>$\\therefore \\;4a+b=0\\cdots \\cdots $㉡<br>㉠, ㉡에서 $a=\\dfrac{3}{2}$, $b=-6$<br>따라서 $f(x)=x^{3}+\\dfrac{3}{2}x^{2}-6x+2$이므로<br>$f' (x)=3x^{2}+3x-6=3(x+2)(x-1)$<br>$f' (x)=0$에서 $x=-2$ 또는 $x=1$<br>함수 $f(x)$의 증가와 감소를 표로 나타내면 다음과 같다.<br>$x\\cdots -2\\cdots 1\\cdots f' (x)+0-0+f(x)\\nearrow 12\\searrow -\\dfrac{3}{2}\\nearrow $<br>따라서 함수 $f(x)$는 $x=1$에서 극솟값 $-\\dfrac{3}{2}$을 갖는다.", "k": "num", "a": "-3/2", "q": "함수 $f(x)=x^{3}+ax^{2}+bx+2$가 $x=-2$에서 극값을 갖고, 곡선 $y=f(x)$ 위의 $x=2$인 점에서의 접선의 기울기가 $12$이다. 함수 $f(x)$의 극솟값을 구하시오.", "key": "Tm05-05"}, "x05x9-010": {"id": "x05x9-010", "unit": "m05", "theme": "05", "벌": "X05x9", "lvl": 2, "fix": true, "src": "주간고사 5회", "w": "$f(x)=-2x^{3}+ax^{2}+bx+c,$<br>$f'(x)=-6x^{2}+2ax+b$에서,<br>$f'(0)=0,\\;f'(-1)=0,\\;f(-1)=-2$ 이므로,<br>$f'(0)=b=0,$<br>$f'(-1)=-6-2a=0,\\;a=-3$<br>$f(x)=-2x^{3}-3x^{2}+c$<br>$f(-1)=2-3+c=-2,\\;c=-1$<br>$\\therefore $ 극댓값은, $f(0)=c=-1$", "k": "c5", "c": ["$-2$", "$0$", "$-1$", "$2$", "$3$"], "a": "$-1$", "q": "함수 $f(x)=-2x^{3}+ax^{2}+bx+c$는 $x=0$에서 극댓값, $x=-1$에서 극솟값을 가지며 극솟값은 $-2$이다. 이 때, 극댓값은?<br>", "key": "Tm05-05"}, "x05x107-116": {"id": "x05x107-116", "unit": "m05", "theme": "06", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=-x^{3}+3x^{2}+4x+2$의 닫힌구간 $[\\,a,\\;a+1\\,]$에서의 평균변화율 $F(a)$는<br>$F(a)=\\dfrac{f(a+1)-f(a)}{a+1-a}$<br>$=-(a+1)^{3}+3(a+1)^{2}+4(a+1)+2-(-a^{3}+3a^{2}+4a+2)$<br>$=-3a^{2}+3a+6$<br>이므로 $F' (a)=-6a+3$<br>$F' (a)=0$인 $a$의 값은 $a=\\dfrac{1}{2}$<br>$a=\\dfrac{1}{2}$의 좌우에서 $F' (a)$의 부호가 양에서 음으로 바뀌므로<br>$F(a)$는 $a=\\dfrac{1}{2}$에서 극대이다.", "k": "num", "a": "1/2", "q": "함수 $f(x)=-x^{3}+3x^{2}+4x+2$의 닫힌구간 $[\\,a,\\;a+1\\,]$에서의 평균변화율을 $F(a)$라 할 때, 함수 $F(a)$가 극대가 되는 $a$의 값을 구하시오.", "key": "Tm05-06"}, "x05x107-117": {"id": "x05x107-117", "unit": "m05", "theme": "06", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=x^{3}-3ax^{2}+a^{3}$에서<br>$f' (x)=3x^{2}-6ax=3x(x-2a)$<br>$f' (x)=0$인 $x$의 값은 $x=0$ 또는 $x=2a$<br>$a>0$이므로 함수 $f(x)$의 증가, 감소를 표로 나타내면 다음과 같다.<br>$x{\\cdots }0{\\cdots }2a{\\cdots }f' (x)+0-0+f(x)\\nearrow a^{3}$<br>극대$\\searrow -3a^{3}$<br>극소$\\nearrow $<br>함수 $f(x)$가 극대인 점과 극소인 점의 좌표는 각각 $(0,\\;a^{3})$, $(2a,\\;-3a^{3})$이므로 두 점을 잇는 선분의 중점은 $\\mathrm{M}(a,\\;-a^{3})$<br>따라서 점 $\\mathrm{M}$이 나타내는 도형의 방정식은<br>$y=-x^{3}\\;(x>0)$", "k": "c5", "c": ["$y=-2x^{3}\\;(x>0)$", "$y=-x^{3}\\;(x>0)$", "$y=-x\\;(x>0)$", "$y=x^{2}\\;(x>0)$", "$y=2x^{3}\\;(x>0)$"], "a": "$y=-x^{3}\\;(x>0)$", "q": "함수 $f(x)=x^{3}-3ax^{2}+a^{3}$의 그래프에서 극대인 점과 극소인 점을 잇는 선분의 중점 $\\mathrm{M}$이 나타내는 도형의 방정식은? (단, $a>0$)", "key": "Tm05-06"}, "x05x107-121": {"id": "x05x107-121", "unit": "m05", "theme": "06", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "삼차함수 $f(x)$에 대하여 이차방정식 $f' (x)=0$의 두 실근이 $\\alpha $, $\\beta $이므로 $f' (\\alpha )=f' (\\beta )=0$이다.<br>즉, $f(\\alpha ),\\;f(\\beta )$는 함수 $f(x)$의 극값이다.<br>(나)에서 $\\sqrt{(\\beta -\\alpha )^{2}+\\left\\{f(\\beta )-f(\\alpha )\\right\\}^{2}}=26$이므로<br>$\\left.(\\beta -\\alpha \\right)^{2}+\\left\\{f(\\beta )-f(\\alpha )\\right\\}^{2}=26^{2}$<br>$10^{2}+\\left\\{f(\\beta )-f(\\alpha )\\right\\}^{2}=26^{2}$ ($\\because $<br>(가))<br>$\\left\\{f(\\beta )-f(\\alpha )\\right\\}^{2}=576$<br>$\\therefore \\;|\\,f(\\beta )-f(\\alpha )\\,|=24$<br>따라서 함수 $f(x)$의 극댓값과 극솟값의 차는 $24$이다.", "k": "c5", "c": ["$12\\sqrt{2}$", "$18$", "$24$", "$30$", "$24\\sqrt{2}$"], "a": "$24$", "q": "삼차함수 $f(x)$에 대하여 방정식 $f' (x)=0$의 두 실근 $\\alpha ,\\;\\beta $는 다음 조건을 만족시킨다.<br>(가) $|\\,\\alpha -\\beta \\,|=10$<br>(나) 두 점 $(\\,\\alpha ,\\;f(\\alpha )\\,)$, $(\\,\\beta ,\\;f(\\beta )\\,)$ 사이의 거리는 $26$이다.<br>함수 $f(x)$의 극댓값과 극솟값의 차는?", "key": "Tm05-06"}, "x05x107-124": {"id": "x05x107-124", "unit": "m05", "theme": "06", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=x^{3}+(a-1)x^{2}+(2a-5)x$에서<br>$f' (x)=3x^{2}+2(a-1)x+2a-5$<br>삼차함수 $f(x)$가 극값을 가지지 않으려면 이차방정식 $f' (x)=0$이 중근 또는 허근을 가져야 한다.<br>이차방정식 $3x^{2}+2(a-1)x+2a-5=0$의 판별식을 $D$라 하면<br>$\\dfrac{D}{4}\\le 0$에서 $(a-1)^{2}-3(2a-5)\\le 0,\\;(a-4)^{2}\\le 0$<br>$\\therefore \\;a=4$<br>따라서 함수 $f(x)$가 극값을 가지지 않도록 하는 실수 $a$의 값은 $4$이다.", "k": "num", "a": "4", "q": "함수 $f(x)=x^{3}+(a-1)x^{2}+(2a-5)x$가 극값을 가지지 않도록 하는 실수 $a$의 값을 구하는 과정을 서술하시오.", "key": "Tm05-06"}, "x05x107-127": {"id": "x05x107-127", "unit": "m05", "theme": "06", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "(가)에서 삼차함수 $y=f(x)$의 그래프는 원점에 대하여 대칭이다.<br>$f(x)$는 최고차항의 계수가 $1$인 삼차함수이므로<br>$f(x)=x^{3}+ax$ ($a$는 상수)라 하자.<br>$f' (x)=3x^{2}+a$이고 (나)에서 $f' (2)=0$이므로<br>$12+a=0\\therefore \\;a=-12$<br>$\\therefore \\;f(x)=x^{3}-12x$<br>$f' (x)=3x^{2}-12=3(x+2)(x-2)$<br>$f' (x)=0$인 $x$의 값은 $x=-2$ 또는 $x=2$<br>함수 $f(x)$의 증가, 감소를 표로 나타내면 다음과 같다.<br>$x{\\cdots }-2{\\cdots }2{\\cdots }f' (x)+0-0+f(x)\\nearrow 16$<br>극대$\\searrow -16$<br>극소$\\nearrow $<br>따라서 함수 $f(x)$의 극댓값은<br>$f(-2)=16$", "k": "num", "a": "16", "q": "최고차항의 계수가 $1$인 삼차함수 $f(x)$가 다음 조건을 만족시킬 때, 함수 $f(x)$의 극댓값을 구하는 과정을 서술하시오. [$8$점]<br>(가) $f(-x)=-f(x)$<br>(나) $f' (2)=0$", "key": "Tm05-06"}, "x05x107-128": {"id": "x05x107-128", "unit": "m05", "theme": "06", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "최고차항의 계수가 $1$인 삼차함수 $f(x)$를<br>$f(x)=x^{3}+ax^{2}+bx+c$ ($a$, $b$, $c$는 상수)라 하면<br>$f' (x)=3x^{2}+2ax+b$<br>(가)에서 함수 $y=f' (x)$의 그래프는 $y$축에 대하여 대칭이므로<br>$a=0$<br>$\\therefore \\;f' (x)=3x^{2}+b$, $f(x)=x^{3}+bx+c$<br>(나)에서 함수 $f(x)$는 $x=2$에서 극솟값 $0$을 가지므로<br>$f' (2)=0,\\;f(2)=0$<br>$f' (2)=0$에서 $12+b=0$<br>$\\therefore \\;b=-12$<br>$f(2)=0$에서 $8+2b+c=0$<br>$\\therefore \\;c=16$<br>$\\therefore f(x)=x^{3}-12x+16$<br>$f' (x)=3x^{2}-12=3(x+2)(x-2)$<br>$f' (x)=0$인 $x$의 값은 $x=-2$ 또는 $x=2$<br>함수 $f(x)$의 증가, 감소를 표로 나타내면 다음과 같다.<br>$x{\\cdots }-2{\\cdots }2{\\cdots }f' (x)+0-0+f(x)\\nearrow 32$<br>극대$\\searrow 0$<br>극소$\\nearrow $<br>따라서 함수 $f(x)$의 극댓값은 $f(-2)=32$이다.", "k": "num", "a": "32", "q": "최고차항의 계수가 $1$인 삼차함수 $f(x)$가 다음 조건을 만족시킬 때, 함수 $f(x)$의 극댓값을 구하는 과정을 서술하시오.<br>(가) 모든 실수 $x$에 대하여 $f' (x)=f' (-x)$이다.<br>(나) 함수 $f(x)$는 $x=2$에서 극솟값 $0$을 가진다.", "key": "Tm05-06"}, "x05x107-131": {"id": "x05x107-131", "unit": "m05", "theme": "06", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=-x^{3}+ax^{2}+(a^{2}-3)x-2$에서<br>$f' (x)=-3x^{2}+2ax+a^{2}-3$<br>함수 $f(x)$가 실수 전체의 집합에서 감소하려면 모든 실수 $x$에서<br>$f' (x)\\le 0$이어야 한다. 이차방정식 $-3x^{2}+2ax+a^{2}-3=0$의<br>판별식을 $D$라 하면<br>$\\dfrac{D}{4}\\le 0$에서 $a^{2}+3(a^{2}-3)\\le 0,\\;4a^{2}-9\\le 0$<br>$(2a+3)(2a-3)\\le 0\\therefore \\;-\\dfrac{3}{2}\\le a\\le \\dfrac{3}{2}$<br>따라서 실수 $a$의 최댓값은 $\\dfrac{3}{2}$이다.", "k": "c5", "c": ["$\\dfrac{1}{2}$", "$1$", "$\\dfrac{3}{2}$", "$2$", "$\\dfrac{5}{2}$"], "a": "$\\dfrac{3}{2}$", "q": "함수 $f(x)=-x^{3}+ax^{2}+(a^{2}-3)x-2$가 실수 전체의 집합에서 감소하도록 하는 실수 $a$의 최댓값은?", "key": "Tm05-06"}, "x05x107-132": {"id": "x05x107-132", "unit": "m05", "theme": "06", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=\\dfrac{1}{3}x^{3}+x^{2}+ax+3$에서<br>$f' (x)=x^{2}+2x+a$<br>함수 $f(x)$가 $x>1$에서 증가하려면 $x>1$에서 $f' (x)\\ge 0$이어야 하므로 $f' (1)\\ge 0$에서<br>$3+a\\ge 0\\therefore \\;a\\ge -3$<br>따라서 실수 $a$의 최솟값은 $-3$이다.", "k": "c5", "c": ["$-3$", "$-1$", "$0$", "$1$", "$3$"], "a": "$-3$", "q": "함수 $f(x)=\\dfrac{1}{3}x^{3}+x^{2}+ax+3$이 $x>1$에서 증가하도록 하는 실수 $a$의 최솟값은?", "key": "Tm05-06"}, "x05x107-133": {"id": "x05x107-133", "unit": "m05", "theme": "06", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=x^{3}-ax^{2}+(a+6)x+5$에서<br>$f' (x)=3x^{2}-2ax+a+6$<br>함수 $f(x)$의 역함수가 존재하려면 $f(x)$가 일대일대응이어야 하고,<br>$f(x)$의 최고차항의 계수가 양수이므로 함수 $f(x)$는 실수 전체의 집합에서 증가해야 한다.<br>즉, 모든 실수 $x$에 대하여 $f' (x)\\ge 0$이어야 한다.<br>이차방정식 $3x^{2}-2ax+a+6=0$의 판별식을 $D$라 하면 $\\dfrac{D}{4}\\le 0$에서<br>$a^{2}-3(a+6)\\le 0$<br>$a^{2}-3a-18\\le 0,\\;(a+3)(a-6)\\le 0$<br>$\\therefore \\;-3\\le a\\le 6$<br>따라서 $M=6,\\;m=-3$이므로<br>$M-m=9$", "k": "c5", "c": ["$5$", "$6$", "$7$", "$8$", "$9$"], "a": "$9$", "q": "함수 $f(x)=x^{3}-ax^{2}+(a+6)x+5$가 역함수를 가지도록 하는 실수 $a$의 최댓값을 $M$, 최솟값을 $m$이라 할 때, $M-m$의 값은?", "key": "Tm05-06"}, "x05x107-134": {"id": "x05x107-134", "unit": "m05", "theme": "06", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=-x^{3}+ax^{2}+bx-5$에서<br>$f' (x)=-3x^{2}+2ax+b$<br>함수 $f(x)$가 $x=-3$에서 극솟값 $-32$를 가지므로<br>$f' (-3)=0,\\;f(-3)=-32$<br>$f' (-3)=0$에서 $-27-6a+b=0$<br>$\\therefore \\;6a-b=-27\\cdots \\cdots $㉠<br>$f(-3)=-32$에서 $27+9a-3b-5=-32$<br>$\\therefore \\;3a-b=-18\\cdots \\cdots $㉡<br>㉠, ㉡을 연립하  이차방정식<br>$3x^{2}+2ax+b=0$의 서로 다른 두 실근이 $\\alpha ,\\;\\beta $이다.<br>이차방정식의 근과 계수의 관계에 의하여<br>$\\alpha +\\beta =-\\dfrac{2}{3}a,\\;\\alpha \\beta =\\dfrac{b}{3}$<br>$\\therefore \\;\\beta -\\alpha =\\sqrt{(\\alpha +\\beta )^{2}-4\\alpha \\beta }$<br>$=\\sqrt{\\left(-\\dfrac{2}{3}a\\right)^{2}-\\dfrac{4b}{3}}$<br>$=\\dfrac{2}{3}\\sqrt{a^{2}-3b}$<br>이때 $\\beta -\\alpha =4$이므로 $\\dfrac{2}{3}\\sqrt{a^{2}-3b}=4$에서<br>$\\sqrt{a^{2}-3b}=6\\therefore \\;a^{2}-3b=36$", "k": "c5", "c": ["$20$", "$24$", "$28$", "$32$", "$36$"], "a": "$36$", "q": "함수 $f(x)=x^{3}+ax^{2}+bx$가 $x=\\alpha ,\\;x=\\beta $에서 극값을 가지고 $\\beta -\\alpha =4$일 때, $a^{2}-3b$의 값은? (단, $a,\\;b$는 상수이다.)", "key": "Tm05-06"}, "x05x107-139": {"id": "x05x107-139", "unit": "m05", "theme": "06", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)$를 $(x-3)^{2}$으로 나누었을 때의 몫을 $Q(x)$, 나머지를 $R(x)=ax+b$ ($a,\\;b$는 상수)라 하면<br>$f(x)=(x-3)^{2}Q(x)+ax+b$<br>$f' (x)=2(x-3)Q(x)+(x-3)^{2}Q' (x)+a$<br>함수 $f(x)$가 $x=3$에서 극댓값 $-1$을 가지므로<br>$f' (3)=0,\\;f(3)=-1$<br>$f' (3)=0$에서 $a=0$<br>$f(3)=-1$에서 $3a+b=-1\\therefore \\;b=-1$<br>따라서 $R(x)=-1$이므로 $R(1)=-1$", "k": "c5", "c": ["$-2$", "$-1$", "$0$", "$1$", "$2$"], "a": "$-1$", "q": "다항함수 $f(x)$가 $x=3$에서 극댓값 $-1$을 가진다. 다항식 $f(x)$를 $(x-3)^{2}$으로 나누었을 때의 나머지가 $R(x)$일 때, $R(1)$의 값은?<br>", "key": "Tm05-06"}, "x05x107-140": {"id": "x05x107-140", "unit": "m05", "theme": "06", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)={\\begin{cases}x^{3}+ax & \\;(x{\\ge }0) \\\\ a(x^{3}-3x) & \\;(x<0)\\end{cases}}$에서<br>$f' (x)={\\begin{cases}3x^{2}+a & \\;(x>0) \\\\ 3a(x^{2}-1) & \\;(x<0)\\end{cases}}$<br>(ⅰ) $x>0$일 때<br>$a>0$이므로 $3x^{2}+a>0$<br>즉, $f' (x)=0$인 $x$의 값은 존재하지 않는다.<br>(ⅱ) $x<0$일 때<br>$f' (x)=3a(x^{2}-1)=3a(x+1)(x-1)$<br>$f' (x)=0$인 $x$의 값은 $x=-1\\;(\\because \\;x<0)$<br>함수 $f(x)$의 증가, 감소를 표로 나타내면 다음과 같다.<br>$x{\\cdots }-1{\\cdots }0{\\cdots }f' (x)+0-+f(x)\\nearrow 2a$<br>극대$\\searrow 0$<br>극소$\\nearrow $<br>함수 $f(x)$의 극댓값이 $4$이므로<br>$2a=4\\therefore \\;a=2$", "k": "c5", "c": ["$\\dfrac{1}{2}$", "$1$", "$\\dfrac{3}{2}$", "$2$", "$\\dfrac{5}{2}$"], "a": "$2$", "q": "함수 $f(x)={\\begin{cases}x^{3}+ax & \\;(x\\ge 0) \\\\ a(x^{3}-3x) & \\;(x<0)\\end{cases}}$의 극댓값이 $4$일 때, 양수 $a$의 값은?", "key": "Tm05-06"}, "x05x107-142": {"id": "x05x107-142", "unit": "m05", "theme": "06", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=x^{3}+ax^{2}+(a^{2}-6a)x+5$에서<br>$f' (x)=3x^{2}+2ax+a^{2}-6a$<br>삼차함수 $f(x)$가 극값을 가지려면 이차방정식 $f' (x)=0$이 서로 다른 두 실근을 가져야 한다.<br>이차방정식 $3x^{2}+2ax+a^{2}-6a=0$의 판별식을 $D$라 하면<br>$\\dfrac{D}{4}>0$에서 $a^{2}-3a^{2}+18a>0$<br>$-2a^{2}+18a>0,\\;2a(a-9)<0$<br>$\\therefore \\;0<a<9$<br>따라서 정수 $a$는 $1,\\;2,\\;3,\\;\\cdots ,\\;8$의 $8$개이다.", "k": "c5", "c": ["$4$", "$5$", "$6$", "$7$", "$8$"], "a": "$8$", "q": "함수 $f(x)=x^{3}+ax^{2}+(a^{2}-6a)x+5$가 극값을 가지도록 하는 정수 $a$의 개수는?", "key": "Tm05-06"}, "x05x107-143": {"id": "x05x107-143", "unit": "m05", "theme": "06", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=x^{4}+\\dfrac{2}{3}ax^{3}+2x^{2}+1$에서<br>$f' (x)=4x^{3}+2ax^{2}+4x=2x(2x^{2}+ax+2)$<br>사차함수 $f(x)$가 극값을 하나만 가지려면 삼차방정식 $f' (x)=0$이 한 실근과 두 허근 또는 한 실근과 중근 또는 삼중근을 가져야 하므로 이차방정식 $2x^{2}+ax+2=0$의 한 근이 $0$이거나 $0$이 아닌 중근 또는 허근을 가져야 한다.<br>(ⅰ) 이차방정식 $2x^{2}+ax+2=0$의 한 근이 $0$인 경우<br>$x=0$을 대입하면 $2=0$이 되어 성립하지 않는다.<br>(ⅱ) 이차방정식 $2x^{2}+ax+2=0$이 $0$이 아닌 중근을 가지는 경우<br>이차방정식 $2x^{2}+ax+2=0$의 판별식을 $D$라 하면 $D=0$에서<br>$a^{2}-4\\times 2\\times 2=0,\\;a^{2}-16=0$<br>$\\therefore \\;a=-4$ 또는 $a=4$<br>(ⅲ) 이차방정식 $2x^{2}+ax+2=0$이 허근을 가지는 경우<br>$D<0$에서 $a^{2}-16<0,\\;(a+4)(a-4)<0$<br>$\\therefore \\;-4<a<4$<br>(ⅰ), (ⅱ), (ⅲ)에서 구하는 실수 $a$의 값의 범위는<br>$-4{\\le }a{\\le }4$", "k": "c5", "c": ["$a\\le -8$", "$-8\\le a\\le -4$", "$-4\\le a\\le 4$", "$0\\le a\\le 8$", "$a\\ge 8$"], "a": "$-4\\le a\\le 4$", "q": "함수 $f(x)=x^{4}+\\dfrac{2}{3}ax^{3}+2x^{2}+1$이 극값을 하나만 가지도록 하는 실수 $a$의 값의 범위는?", "key": "Tm05-06"}, "x05x107-145": {"id": "x05x107-145", "unit": "m05", "theme": "06", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "ㄱ. 모든 실수 $x$에 대하여 $f' (x)>0$이면 함수 $f(x)$는 실수 전체의 집합에서 증가한다. (참)<br>ㄴ. $f' (\\alpha )=0$이어도 $x=\\alpha $의 좌우에서 $f' (x)$의 부호가 바뀌지 않으면 극값을 가지지 않는다. (거짓)<br>ㄷ. 삼차함수 $f(x)$의 역함수가 존재할 때, 최고차항의 계수가 양수인 경우 모든 실수 $x$에 대하여 $f' (x){\\ge }0$이고, 최고차항의 계수가 음수인 경우 모든 실수 $x$에 대하여 $f' (x){\\le }0$이다. (거짓)<br>따라서 옳은 것은 ㄱ뿐이다.", "k": "c5", "c": ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "a": "ㄱ", "q": "삼차함수 $f(x)$에 대하여 <보기>에서 옳은 것만을 있는 대로 고른 것은?<br><b><보기><\/b><br>ㄱ. 모든 실수 $x$에 대하여 $f' (x)>0$이면 함수 $f(x)$는 실수 전체의 집합에서 증가한다.<br>ㄴ. 실수 $\\alpha $에 대하여 $f' (\\alpha )=0$이면 $x=\\alpha $에서 함수 $f(x)$는 극값을 가진다.<br>ㄷ. 함수 $f(x)$의 역함수가 존재하면 모든 실수 $x$에 대하여 $f' (x)\\ge 0$이다.", "key": "Tm05-06"}, "x05x107-148": {"id": "x05x107-148", "unit": "m05", "theme": "06", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "곡선 $y=f(x)$가 $x=3$에서 $x$축과 접하므로 최고차항의 계수가 $1$인 삼차함수 $f(x)$를 $f(x)=(x-3)^{2}(x+a)$ ($a$는 상수)라 하자.<br>$\\therefore \\;f' (x)=2(x-3)(x+a)+(x-3)^{2}$<br>$f' (4)=f' (0)$이므로<br>$2(4+a)+1=-6a+9\\therefore \\;a=0$<br>$\\therefore \\;f(x)=x(x-3)^{2}=x^{3}-6x^{2}+9x$<br>$\\therefore \\;f' (x)=3x^{2}-12x+9=3(x-1)(x-3)$<br>$f' (x)=0$인 $x$의 값은 $x=1$ 또는 $x=3$<br>함수 $f(x)$의 증가, 감소를 표로 나타내면 다음과 같다.<br>$x{\\cdots }1{\\cdots }3{\\cdots }f' (x)+0-0+f(x)\\nearrow 4$<br>극대$\\searrow 0$<br>극소$\\nearrow $<br>따라서 함수 $f(x)$의 극댓값은 $f(1)=4$이다.", "k": "c5", "c": ["$2$", "$4$", "$6$", "$8$", "$10$"], "a": "$4$", "q": "최고차항의 계수가 $1$인 삼차함수 $f(x)$에 대하여 곡선 $y=f(x)$가 $x=3$에서 $x$축과 접한다. $f' (4)=f' (0)$일 때, 함수 $f(x)$의 극댓값은?<br>", "key": "Tm05-06"}, "x05x53-082": {"id": "x05x53-082", "unit": "m05", "theme": "08", "벌": "X05x53", "lvl": 2, "fix": true, "src": "문제집 개념원리", "w": "$f(x)=-2x^{3}-6x^{2}+9$에서<br>$f'(x)=-6x^{2}-12x=-6x(x+2)$<br>$f'(x)=0$에서 $x=-2$ 또는 $x=0$<br>함수 $f(x)$의 증가와 감소를 표로 나타내면 다음과 같다.<br>${x}{\\cdots }-2{\\cdots }$0${\\cdots }{f' (x)}-0+0-{f(x)}\\searrow 1\\nearrow 9\\searrow $<br>따라서 함수 $f(x)$는 $x=-2$에서 극솟값 $1$을 가지므로<br>$a=-2$, $b=1$<br>$\\therefore \\;a+b=-1$", "k": "num", "a": "-1", "q": "함수 $f(x)=-2x^{3}-6x^{2}+9$가 $x=a$에서 극솟값 $b$를 가질 때, $a+b$의 값을 구하시오.", "key": "Tm05-08"}, "x05x53-083": {"id": "x05x53-083", "unit": "m05", "theme": "08", "벌": "X05x53", "lvl": 2, "fix": true, "src": "문제집 개념원리", "w": "$f(x)=-x^{4}+4x^{3}+2x^{2}-12x+3$에서<br>$f'(x)=-4x^{3}+12x^{2}+4x-12$<br>$=-4(x+1)(x-1)(x-3)$<br>$f'(x)=0$에서 $x=-1$ 또는 $x=1$ 또는 $x=3$<br>함수 $f(x)$의 증가와 감소를 표로 나타내면 다음과 같다.<br>$x{\\cdots }-1{\\cdots }1{\\cdots }3{\\cdots }{f' (x)}+0-0+0-{f(x)}\\nearrow 12\\searrow -4\\nearrow 12\\searrow $<br>따라서 함수 $f(x)$는<br>$x=-1$, $x=3$에서 극댓값 $12$,<br>$x=1$에서 극솟값 $-4$<br>를 가지므로 $M=12$, $m=-4$<br>$\\therefore \\;M-m=16$", "k": "num", "a": "16", "q": "함수 $f(x)=-x^{4}+4x^{3}+2x^{2}-12x+3$의 극댓값을 $M$, 극솟값을 $m$이라 할 때, $M-m$의 값을 구하시오.", "key": "Tm05-08"}, "x05x53-084": {"id": "x05x53-084", "unit": "m05", "theme": "08", "벌": "X05x53", "lvl": 2, "fix": true, "src": "문제집 개념원리", "w": "$f(x)=x^{4}+ax^{2}+b$에서 $f'(x)=4x^{3}+2ax$<br>함수 $f(x)$가 $x=1$에서 극소이므로 $f'(1)=0$<br>$4+2a=0\\therefore \\;a=-2$<br>$\\therefore f(x)=x^{4}-2x^{2}+b$,<br>$f'(x)=4x^{3}-4x=4x(x+1)(x-1)$<br>$f'(x)=0$에서 $x=-1$ 또는 $x=0$ 또는 $x=1$<br>함수 $f(x)$의 증가와 감소를 표로 나타내면 다음과 같다.<br>$x{\\cdots }-1{\\cdots }0{\\cdots }1{\\cdots }{f' (x)}-0+0-0+{f(x)}\\searrow b-1\\nearrow b\\searrow b-1\\nearrow $<br>따라서 함수 $f(x)$는 $x=0$에서 극댓값 $b$를 가지므로<br>$b=4\\therefore \\;a+b=2$", "k": "num", "a": "2", "q": "함수 $f(x)=x^{4}+ax^{2}+b$는 $x=1$에서 극소이다. 함수 $f(x)$의 극댓값이 $4$일 때, $a+b$의 값을 구하시오. (단, $a$와 $b$는 상수이다.)", "key": "Tm05-08"}, "x05x53-085": {"id": "x05x53-085", "unit": "m05", "theme": "08", "벌": "X05x53", "lvl": 2, "fix": true, "src": "문제집 개념원리", "w": "$f(x)=x^{3}+ax^{2}+bx+100$에서<br>$f'(x)=3x^{2}+2ax+b$<br>함수 $f(x)$가 $x=-6$에서 극값을 가지므로<br>$f'(-6)=0$, $108-12a+b=0$<br>$\\therefore \\;12a-b=108\\cdots \\cdots $㉠<br>곡선 $y=f(x)$ 위의 점 $(-3,\\;f(-3))$에서의 접선의 기울기가 $9$이므로<br>$f'(-3)=9$, $27-6a+b=9$<br>$\\therefore \\;6a-b=18\\cdots \\cdots $㉡<br>㉠, ㉡을 연립하여 풀면 $a=15$, $b=72$<br>$\\therefore \\;a+b=87$", "k": "num", "a": "87", "q": "함수 $f(x)=x^{3}+ax^{2}+bx+100$이 $x=-6$에서 극값을 갖고, 곡선 $y=f(x)$ 위의 점 $(-3,\\;f(-3))$에서의 접선의 기울기가 $9$일 때, 상수 $a$, $b$에 대하여 $a+b$의 값을 구하시오.", "key": "Tm05-08"}, "x05x53-086": {"id": "x05x53-086", "unit": "m05", "theme": "08", "벌": "X05x53", "lvl": 2, "fix": true, "src": "문제집 개념원리", "w": "$f(x)=x^{3}+3x^{2}-9x+a$에서<br>$f'(x)=3x^{2}+6x-9=3(x+3)(x-1)$<br>$f'(x)=0$에서 $x=-3$ 또는 $x=1$<br>함수 $f(x)$의 증가와 감소를 표로 나타내면 다음과 같다.<br>${x}{\\cdots }-3{\\cdots }1{\\cdots }{f' (x)}+0-0+{f(x)}\\nearrow 27+a\\searrow -5+a\\nearrow $<br>따라서 함수 $f(x)$는 $x=-3$에서 극댓값 $27+a$,<br>$x=1$에서 극솟값 $-5+a$를 갖는다.<br>이때 극댓값과 극솟값의 절댓값이 같으므로<br>$(27+a)+(-5+a)=0$<br>$22+2a=0$<br>$\\therefore \\;a=-11$", "k": "num", "a": "-11", "q": "함수 $f(x)=x^{3}+3x^{2}-9x+a$의 극댓값과 극솟값의 절댓값이 같을 때, 상수 $a$의 값을 구하시오.", "key": "Tm05-08"}, "x05x53-087": {"id": "x05x53-087", "unit": "m05", "theme": "08", "벌": "X05x53", "lvl": 2, "fix": true, "src": "문제집 개념원리", "w": "$f(x)=x^{3}-\\dfrac{3}{2}ax^{2}-6a^{2}x$에서<br>$f'(x)=3x^{2}-3ax-6a^{2}$<br>$=3(x+a)(x-2a)$<br>$f'(x)=0$에서<br>$x=-a$ 또는 $x=2a$<br>$a>0$이므로 함수 $f(x)$의 증가와 감소를 표로 나타내면 다음과 같다.<br>${x}{\\cdots }-a{\\cdots }2a{\\cdots }{f' (x)}+0-0+{f(x)}\\nearrow \\dfrac{7}{2}a^{3}\\searrow -10a^{3}\\nearrow $<br>따라서 함수 $f(x)$는<br>$x=-a$에서 극댓값 $\\dfrac{7}{2}a^{3}$,<br>$x=2a$에서 극솟값 $-10a^{3}$<br>을 갖는다.<br>이때 극댓값과 극솟값의 차가 $\\dfrac{1}{2}$이므로<br>$\\dfrac{7}{2}a^{3}-(-10a^{3})=\\dfrac{1}{2}$<br>$\\dfrac{27}{2}a^{3}=\\dfrac{1}{2}$, $a^{3}=\\dfrac{1}{27}$<br>$\\therefore \\;a=\\dfrac{1}{3}$", "k": "num", "a": "1/3", "q": "함수 $f(x)=x^{3}-\\dfrac{3}{2}ax^{2}-6a^{2}x$의 극댓값과 극솟값의 차가 $\\dfrac{1}{2}$일 때, 양수 $a$의 값을 구하시오.", "key": "Tm05-08"}, "x05x53-091": {"id": "x05x53-091", "unit": "m05", "theme": "08", "벌": "X05x53", "lvl": 2, "fix": true, "src": "문제집 개념원리", "w": "$f(x)=x^{3}-3ax^{2}+3(a^{2}-1)x$에서<br>$f'(x)=3x^{2}-6ax+3(a^{2}-1)$<br>$=3(x-a+1)(x-a-1)$<br>$f'(x)=0$에서 $x=a-1$ 또는 $x=a+1$<br>함수 $f(x)$의 증가와 감소를 표로 나타내면 다음과 같다.<br>${x}{\\cdots }a-1{\\cdots }a+1{\\cdots }{f' (x)}+0-0+{f(x)}\\nearrow $극대$\\searrow $극소$\\nearrow $<br>따라서 함수 $f(x)$는 $x=a-1$에서 극댓값을 가지므로<br>$f(a-1)=4$<br>$(a-1)^{3}-3a(a-1)^{2}+3(a^{2}-1)(a-1)=4$<br>$a^{3}-3a-2=0$, $(a+1)^{2}(a-2)=0$<br>$\\therefore \\;a=-1$ 또는 $a=2$<br>(ⅰ) $a=-1$일 때<br>$f(x)=x^{3}+3x^{2}$이므로 $f(-2)=4>0$<br>(ⅱ) $a=2$일 때<br>$f(x)=x^{3}-6x^{2}+9x$이므로 $f(-2)=-50<0$<br>따라서 주어진 조건을 만족시키지 않는다.<br>(ⅰ), (ⅱ)에서 $f(x)=x^{3}+3x^{2}$이므로<br>$f(-1)=2$", "k": "c5", "c": ["$1$", "$2$", "$3$", "$4$", "$5$"], "a": "$2$", "q": "함수 $f(x)=x^{3}-3ax^{2}+3(a^{2}-1)x$의 극댓값이 $4$이고 $f(-2)>0$일 때, $f(-1)$의 값은? (단, $a$는 상수이다.)", "key": "Tm05-08"}, "x05x53-092": {"id": "x05x53-092", "unit": "m05", "theme": "08", "벌": "X05x53", "lvl": 2, "fix": true, "src": "문제집 개념원리", "w": "$f(x)=x^{3}+ax^{2}+bx+c$에서<br>$f'(x)=3x^{2}+2ax+b$<br>곡선 $y=f(x)$ 위의 점 $(1,\\;f(1))$에서의 접선의 기울기가 $6$이므로<br>$f'(1)=6$, $3+2a+b=6$<br>$\\therefore \\;2a+b=3\\cdots \\cdots $㉠<br>또 접선 $y=6x-1$이 점 $(1,\\;5)$를 지나므로<br>$f(1)=5$, $1+a+b+c=5$<br>$\\therefore \\;a+b+c=4\\cdots \\cdots $㉡<br>한편 함수 $f(x)$가 $x=-1$에서 극댓값을 가지므로<br>$f'(-1)=0$, $3-2a+b=0$<br>$\\therefore \\;2a-b=3\\cdots \\cdots $㉢<br>㉠, ㉢을 연립하여 풀면 $a=\\dfrac{3}{2}$, $b=0$<br>이것을 ㉡에 대입하면 $\\dfrac{3}{2}+c=4$<br>$\\therefore \\;c=\\dfrac{5}{2}$<br>따라서 $f(x)=x^{3}+\\dfrac{3}{2}x^{2}+\\dfrac{5}{2}$이므로<br>$f(3)=43$", "k": "num", "a": "43", "q": "함수 $f(x)=x^{3}+ax^{2}+bx+c$의 그래프 위의 점 $(1,\\;f(1))$에서의 접선의 방정식이 $y=6x-1$이고, $f(x)$는 $x=-1$에서 극댓값을 가질 때, $f(3)$의 값을 구하시오. (단, $a$, $b$, $c$는 상수이다.)", "key": "Tm05-08"}, "x05x53-093": {"id": "x05x53-093", "unit": "m05", "theme": "08", "벌": "X05x53", "lvl": 2, "fix": true, "src": "문제집 개념원리", "w": "$\\lim\\limits _{x\\,\\to \\,0}{\\,\\dfrac{f(x)}{x}}=-2$에서 $x\\,\\to \\,0$일 때 (분모)$\\to 0$이고<br>극한값이 존재하므로 (분자)$\\to 0$이다.<br>즉 $\\lim\\limits _{x\\,\\to \\,0}{\\,f(x)}=0$이므로 $f(0)=0$<br>$\\therefore \\;\\lim\\limits _{x\\,\\to \\,0}{\\,\\dfrac{f(x)}{x}}=\\lim\\limits _{x\\,\\to \\,0}{\\,\\dfrac{f(x)-f(0)}{x-0}}$<br>$=f'(0)=-2$<br>따라서 함수 $f(x)$를<br>$f(x)=ax^{3}+bx^{2}+cx$ ($a$, $b$, $c$는 상수, $a\\ne 0$)<br>라 하면<br>$f'(x)=3ax^{2}+2bx+c$<br>이고 $f'(0)=-2$에서<br>$c=-2$<br>$\\therefore f(x)=ax^{3}+bx^{2}-2x$,<br>$f'(x)=3ax^{2}+2bx-2$<br>한편 함수 $f(x)$가 $x=1$에서 극솟값 $-3$을 가지므로<br>$f'(1)=0$, $f(1)=-3$<br>$3a+2b-2=0$, $a+b-2=-3$<br>$\\therefore \\;3a+2b=2$, $a+b=-1$<br>두 식을 연립하여 풀면<br>$a=4$, $b=-5$<br>따라서 $f(x)=4x^{3}-5x^{2}-2x$이므로<br>$f(-1)=-7$", "k": "num", "a": "-7", "q": "삼차함수 $f(x)$가 $x=1$에서 극솟값 $-3$을 갖고 $\\lim\\limits _{x\\,\\rightarrow \\,0}{\\,\\dfrac{f(x)}{x}}=-2$를 만족시킬 때, $f(-1)$의 값을 구하시오.", "key": "Tm05-08"}, "x05x53-095": {"id": "x05x53-095", "unit": "m05", "theme": "08", "벌": "X05x53", "lvl": 2, "fix": true, "src": "문제집 개념원리", "w": "삼차함수 $f(x)$의 최고차항의 계수가 $1$이고, 조건 (나)에서 $f(0)=0$이므로<br>$f(x)=x^{3}+ax^{2}+bx$ ($a$, $b$는 상수)<br>라 하면 $f'(x)=3x^{2}+2ax+b$<br>이때 조건 (가)에서 $f'(1)=0$이므로<br>$3+2a+b=0$<br>$\\therefore \\;2a+b=-3\\cdots \\cdots $㉠<br>조건 (다)에서 $f'(-1-x)=f'(-1+x)$의 양변에<br>$x=-2$를 대입하면<br>$f'(1)=f'(-3)$<br>즉 $f'(-3)=0$이므로<br>$27-6a+b=0$<br>$\\therefore \\;6a-b=27\\cdots \\cdots $㉡<br>㉠, ㉡을 연립하여 풀면<br>$a=3$, $b=-9$<br>$\\therefore f(x)=x^{3}+3x^{2}-9x$,<br>$f' (x)=3x^{2}+x-9=3(x+3)(x-1)$<br>$f'(x)=0$에서 $x=-3$ 또는 $x=1$<br>함수 $f(x)$의 증가와 감소를 표로 나타내면 다음과 같다.<br>${x}{\\cdots }-3{\\cdots }1{\\cdots }{f' (x)}+0-0+{f(x)}\\nearrow 27\\searrow -5\\nearrow $<br>따라서 함수 $f(x)$는 $x=-3$에서 극댓값 $27$을 갖는다.", "k": "num", "a": "27", "q": "최고차항의 계수가 $1$인 삼차함수 $f(x)$가 다음 조건을 만족시킬 때, $f(x)$의 극댓값을 구하시오.<br>(가) 함수 $f(x)$는 $x=1$에서 극소이다.<br>(나) 곡선 $y=f(x)$는 원점을 지난다.<br>(다) 모든 실수 $x$에 대하여 $f' (-1-x)=f'(-1+x)$가 성립한다.", "key": "Tm05-08"}, "x05x53-096": {"id": "x05x53-096", "unit": "m05", "theme": "08", "벌": "X05x53", "lvl": 2, "fix": true, "src": "문제집 개념원리", "w": "함수 $g(x)$가 실수 전체의 집합에서 미분가능하므로<br>함수 $g(x)$는 $x=3$에서 연속이고 미분가능하다.<br>즉 $\\lim\\limits _{x\\,\\to \\,3+}{\\,g(x)}=\\lim\\limits _{x\\,\\to \\,3-}{\\,g(x)}=g(3)$이고<br>$\\lim\\limits _{x\\,\\to \\,3+}{\\,g(x)}=\\lim\\limits _{x\\,\\to \\,3+}{\\,f(x)}=f(3)$,<br>$\\lim\\limits _{x\\,\\to \\,3-}{\\,g(x)}=\\lim\\limits _{x\\,\\to \\,3-}{\\,\\left\\{b-f(x)\\right\\}}=b-f(3)$,<br>$g(3)=f(3)$<br>이므로 $f(3)=b-f(3)\\cdots \\cdots $㉠<br>$3a-17=b-3a+17$<br>$\\therefore \\;b=6a-34\\cdots \\cdots $㉡<br>또 $\\lim\\limits _{x\\,\\to \\,3+}{\\,\\dfrac{g(x)-g(3)}{x-3}}=\\lim\\limits _{x\\,\\to \\,3-}{\\,\\dfrac{g(x)-g(3)}{x-3}}$이고<br>$\\lim\\limits _{x\\,\\to \\,3+}{\\,\\dfrac{g(x)-g(3)}{x-3}}=\\lim\\limits _{x\\,\\to \\,3+}{\\,\\dfrac{f(x)-f(3)}{x-3}}$<br>$=f'(3)$,<br>$\\lim\\limits _{x\\,\\to \\,3-}{\\,\\dfrac{g(x)-g(3)}{x-3}}=\\lim\\limits _{x\\,\\to \\,3-}{\\,\\dfrac{\\left\\{b-f(x)\\right\\}-f(3)}{x-3}}$<br>$=\\lim\\limits _{x\\,\\to \\,3-}{\\,\\dfrac{-f(x)+\\left\\{b-f(3)\\right\\}}{x-3}}$<br>$=\\lim\\limits _{x\\,\\to \\,0-}{\\,\\dfrac{-f(x)+f(3)}{x-3}}$ ($\\because $ ㉠)<br>$=-\\lim\\limits _{x\\,\\to \\,3-}{\\,\\dfrac{f(x)-f(3)}{x-3}}=-f'(3)$<br>이므로 $f'(3)=-f'(3)$<br>$\\therefore \\;f'(3)=0$<br>이때 $f'(x)=3x^{2}-12x+a$이므로<br>$-9+a=0\\therefore \\;a=9$<br>$a=9$를 ㉡에 대입하면 $b=20$<br>$\\therefore \\;g(x)={\\begin{cases}-x^{3}+6x^{2}-9x+10 & \\;(x<3) \\\\ x^{3}-6x^{2}+9x+10 & \\;(x{\\ge }3)\\end{cases}}$<br>(ⅰ) $x<3$일 때<br>$g'(x)=-3x^{2}+12x-9=-3(x-1)(x-3)$<br>이므로 $g'(x)=0$에서<br>$x=1(\\because \\;x<3)$<br>(ⅱ) $x{\\ge }3$일 때<br>$g'(x)=3x^{2}-12x+9=3(x-1)(x-3)$<br>이므로 $g'(x)=0$에서<br>$x=3(\\because \\;x\\ge 3)$<br>(ⅰ), (ⅱ)에서 함수 $g(x)$의 증가와 감소를 표로 나타내면 다음과 같다.<br>${x}{\\cdots }1{\\cdots }3{\\cdots }g' (x)-0+0+g(x)\\searrow 6\\nearrow 10\\nearrow $<br>따라서 함수 $g(x)$는 $x=1$에서 극솟값 $6$을 갖는다.", "k": "num", "a": "6", "q": "함수 $f(x)=x^{3}-6x^{2}+ax+10$에 대하여 함수<br> $g(x)={\\begin{cases}b-f(x) & \\;(x<3) \\\\ f(x) & \\;(x{\\ge }3)\\end{cases}}$<br>이 실수 전체의 집합에서 미분가능할 때, 함수 $g(x)$의 극솟값을 구하시오. (단, $a$, $b$는 상수이다.)", "key": "Tm05-08"}, "x05x59-024": {"id": "x05x59-024", "unit": "m05", "theme": "08", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(x)=\\,-x^{4}+6x^{2}+8x-10$에서<br>$f'(x)=\\,-4x^{3}+12x+8=\\,-4(x+1)^{2}(x-2)$<br>$f'(x)=0$에서 $x=\\,-1$ 또는 $x=2$<br>$x\\cdots -1\\cdots 2\\cdots f'(x)+0+0-f(x)\\nearrow \\nearrow $극대$\\searrow $따라서 함수 $f(x)$는<br>$x=2$에서 극대이고,<br>$x=\\,-1$의 좌우에서<br>$f'(x)$의 부호가 바뀌지 않으므로 $x=\\,-1$에서는 극값을 갖지 않는다.<br>즉 $a=1$, $b=0$이므로 $a+2b=1$", "k": "c5", "c": ["$\\mathrm{1}$", "$\\mathrm{2}$", "$\\mathrm{3}$", "$\\mathrm{4}$", "$\\mathrm{5}$"], "a": "$\\mathrm{1}$", "q": "함수 $f(x)=\\,-x^{4}+6x^{2}+8x-10$의 극댓값의 개수를 $a$, 극솟값의 개수를 $b$라 할 때, $a+2b$의 값은?", "key": "Tm05-08"}, "x05x59-025": {"id": "x05x59-025", "unit": "m05", "theme": "08", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(x)=2x^{3}-6x+5$에서<br>$f'(x)=6x^{2}-6=6(x+1)(x-1)$<br>$x\\cdots -1\\cdots 1\\cdots f'(x)+0-0+f(x)\\nearrow $극대$\\searrow $극소$\\nearrow f'(x)=0$에서 $x=\\,-1$ 또는 $x=1$<br>따라서 함수 $f(x)$는<br>$x=\\,-1$에서 극대이고,<br>$x=1$에서 극소이므로<br>$a=1$,<br>$f(a)=f(1)=1$<br>$\\therefore \\;a+f(a)=2$", "k": "num", "a": "2", "q": "함수 $f(x)=2x^{3}-6x+5$가 $x=a$에서 극소일 때, $a+f(a)$의 값을 구하시오.", "key": "Tm05-08"}, "x05x59-028": {"id": "x05x59-028", "unit": "m05", "theme": "08", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(x+y)=f(x)+f(y)-xy(x+y)$의 양변에 $x=0$, $y=0$을 대입하면<br>$f(0)=f(0)+f(0)\\;\\therefore \\;f(0)=0$<br>이때 $f' (0)=4$이므로<br>$f' (0)=\\lim\\limits _{h\\,\\to \\,0}{}\\dfrac{f(h)-f(0)}{h}=\\lim\\limits _{h\\,\\to \\,0}{}\\dfrac{f(h)}{h}=4$<br>$\\therefore \\;f' (x)=\\lim\\limits _{h\\,\\to \\,0}{}\\dfrac{f(x+h)-f(x)}{h}$<br>$=\\lim\\limits _{h\\,\\to \\,0}{}\\dfrac{f(x)+f(h)-xh(x+h)-f(x)}{h}$<br>$=\\lim\\limits _{h\\,\\to \\,0}{}\\left\\{\\dfrac{f(h)}{h}-x^{2}-xh\\right\\}$<br>$=4-x^{2}$<br>$f' (x)=0$에서 $(2+x)(2-x)=0$<br>$\\therefore \\;x=\\,-2$ 또는 $x=2$<br>$x\\cdots \\mathrm{-2}\\cdots \\mathrm{2}\\cdots f' (x)-\\mathrm{0}+\\mathrm{0}-f(x)\\searrow $극소$\\nearrow $극대$\\searrow $<br>따라서 함수 $f(x)$는<br>$x=\\,-2$에서 극소, $x=2$에서 극대이므로<br>$\\alpha =\\,-2$, $\\beta =2$<br>$\\therefore \\;\\alpha ^{2}+\\beta ^{2}=(-2)^{2}+2^{2}=8$", "k": "num", "a": "8", "q": "실수 전체의 집합에서 정의된 다항함수 $f(x)$가 모든 실수 $x$, $y$에 대하여<br> $f(x+y)=f(x)+f(y)-xy(x+y)$<br>를 만족시키고 $f' (0)=4$이다. br>$\\mathrm{A}(-1,\\,3)$, $\\mathrm{B}(1,\\,-1)$<br>따라서 선분 $\\mathrm{AB}$를 $1\\,:\\,2$로 내분하는 점의 좌표는<br>$\\left(\\dfrac{1\\cdot 1+2\\cdot (-1)}{1+2},\\,\\dfrac{1\\cdot (-1)+2\\cdot 3}{1+2}\\right)$, 즉 $\\left(-\\dfrac{1}{3},\\,\\dfrac{5}{3}\\right)$", "k": "c5", "c": ["$\\left(-1,\\,\\dfrac{1}{3}\\right)$", "$\\left(-\\dfrac{2}{3},\\,-1\\right)$", "$\\left(-\\dfrac{2}{3},\\,1\\right)$", "$\\left(-\\dfrac{1}{3},\\,\\dfrac{2}{3}\\right)$", "$\\left(-\\dfrac{1}{3},\\,\\dfrac{5}{3}\\right)$"], "a": "$\\left(-\\dfrac{1}{3},\\,\\dfrac{5}{3}\\right)$", "q": "함수 $f(x)=x^{3}-3x+1$에 대하여 $y=f(x)$의 그래프에서 극대가 되는 점을 ${\\mathrm{A}}$, 극소가 되는 점을 ${\\mathrm{B}}$라 할 때, 선분 ${\\mathrm{AB}}$를 $1\\,:\\,2$로 내분하는 점의 좌표는?", "key": "Tm05-08"}, "x05x59-073": {"id": "x05x59-073", "unit": "m05", "theme": "08", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$g(x)=x^{2}-4x+3=(x-2)^{2}-1$이므로 $g(x)=t$로 놓으면<br>$t\\ge \\,-1$<br>$(f\\circ g)(x)=f(g(x))=f(t)=t^{3}-3t+4$<br>$\\therefore \\;f' (t)=3t^{2}-3=3(t+1)(t-1)$<br>$f' (t)=0$에서 $t=\\,-1$ 또는 $t=1$<br>$t\\mathrm{-1}\\cdots \\mathrm{1}\\cdots f' (t)\\mathrm{0}-\\mathrm{0}+f(t)\\mathrm{6}\\searrow \\mathrm{2}\\nearrow $따라서 함수 $f(t)$는 $t=1$일 때 최솟값 $\\mathrm{2}$를 갖는다.", "k": "num", "a": "2", "q": "두 함수 $f(x)$, $g(x)$가<br> $f(x)=x^{3}-3x+4$, $g(x)=x^{2}-4x+3$<br>일 때, 합성함수 $(f\\circ g)(x)$의 최솟값을 구하시오.", "key": "Tm05-08"}, "x05x59-100": {"id": "x05x59-100", "unit": "m05", "theme": "08", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(x)=x^{3}+ax^{2}+bx+c\\;\\left(a,\\,b,\\,c\\right.$는 상수$\\left.\\,\\right)$라 하면<br>$f'(x)=3x^{2}+2ax+b$<br>$g(x)=\\begin{cases}\\,1 &  & (x<0) \\\\ \\,f(x) &  & (x\\ge 0)\\end{cases}$에서 $g'(x)=\\begin{cases}\\,0 &  & (x<0) \\\\ \\,f'(x) &  & (x>0)\\end{cases}$<br>이때 함수 $g(x)$가 실수 전체의 집합에서 미분가능하므로 $x=0$에서 미분가능하다.<br>즉 $g(x)$가 $x=0$에서 연속이므로<br>$\\lim\\limits _{x\\,\\rightarrow \\,0+}g(x)=\\lim\\limits _{x\\,\\rightarrow \\,0-}g(x)=g(0)\\;\\therefore \\;f(0)=1$<br>$\\therefore \\;c=1$<br>또 $g(x)$가 $x=0$에서 미분가능하므로<br>$\\lim\\limits _{x\\,\\rightarrow \\,0+}g'(x)=\\lim\\limits _{x\\,\\rightarrow \\,0-}g'(x)=g'(0)\\;\\therefore \\;f'(0)=0$<br>$\\therefore \\;b=0$<br>$\\therefore \\;f(x)=x^{3}+ax^{2}+1$<br>ㄱ. $g(0)+g'(0)=f(0)+f'(0)=1+0=1$<br>ㄴ. $f'(x)=3x^{2}+2ax=x(3x+2a)$이므로 $f'(x)=0$에서<br>$x=0$ 또는 $x=\\,-\\dfrac{2a}{3}$<br>(ⅰ) $-\\dfrac{2a}{3}\\le 0$, 즉 $a\\ge 0$일 때, <br>$f(0)=1$이고, $x>0$일 때 $f'(x)>0$이므로<br>$g(x)\\ge 1$<br>따라서 $g(x)$의 최솟값이 $1$보다 작다는 조건에 모순이다.<br>(ⅱ) $-\\dfrac{2a}{3}>0$, 즉 $a<0$일 때, <br>$g(1)=f(1)=a+2$이고 $a+2<2\\;(\\because \\;a<0)$이므로 $g(1)<2$<br>(ⅰ), (ⅱ)에서 $g(1)<2$<br>ㄷ. 다음 그림과 같이 함수 $g(x)$는 $x=\\,-\\dfrac{2a}{3}$에서 극소이면서 최소이므로 최솟값은<br>$g\\left(-\\dfrac{2a}{3}\\right)=f\\left(-\\dfrac{2a}{3}\\right)$<br>$=\\,-\\dfrac{8}{27}a^{3}+\\dfrac{4}{9}a^{3}+1$<br>$=\\dfrac{4}{27}a^{3}+1$<br>즉 $\\dfrac{4}{27}a^{3}+1=\\dfrac{1}{2}$이므로<br>$\\dfrac{4}{27}a^{3}=\\,-\\dfrac{1}{2}$, $a^{3}=\\,-\\dfrac{27}{8}\\;\\therefore \\;a=\\,-\\dfrac{3}{2}$<br>따라서 $f(x)=x^{3}-\\dfrac{3}{2}x^{2}+1$이므로<br>$g(4)=f(4)=64-24+1=41$<br>이상에서 옳은 것은 ㄱ, ㄴ이다.", "k": "c5", "c": ["ㄱ", "ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "a": "ㄱ, ㄴ", "q": "삼차함수 $f(x)$의 최고차항의 계수가 $1$이고 함수 $g(x)$는<br> $g(x)=\\begin{cases}\\;1 &  & (x<0) \\\\ \\,f(x) &  & (x\\ge 0)\\end{cases}$<br>이다. $g(x)$가 실수 전체의 집합에서 미분가능하고 $g(x)$의 최솟값이 $1$보다 작을 때, 옳은 것만을 <보기>에서 있는 대로 고른 것은?<br><b><보기><\/b><br>ㄱ. $g(0)+g'(0)=1$<br>ㄴ. $g(1)<2$<br>ㄷ. 함수 $g(x)$의 최솟값이 $\\dfrac{1}{2}$일 때, $g(4)=40$이다.", "key": "Tm05-08"}, "x05x107-076": {"id": "x05x107-076", "unit": "m05", "theme": "11", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=(a+2)x^{3}+ax^{2}+(a-2)x+2$에서<br>$f'(x)=3(a+2)x^{2}+2ax+a-2$<br>삼차함수 $f(x)$가 극댓값과 극솟값을 모두 가지려면 이차방정식 $f'(x)=0$이 서로 다른 두 실근을 가져야 한다.<br>이차방정식 $3(a+2)x^{2}+2ax+a-2=0$의 판별식을 $D$라 하면<br>$\\dfrac{D}{4}>0$에서 $a^{2}-3a^{2}+12>0$<br>$-2a^{2}+12>0$, $2\\left(a+\\sqrt{6}\\right)\\left(a-\\sqrt{6}\\right)<0$<br>$\\therefore -\\sqrt{6}<a<\\sqrt{6}$<br>따라서 자연수 $a$는 $1$, $2$의 $2$개이다.", "k": "c5", "c": [" (a+3)x-a$<br>함수 $f(x)$가 극값을 갖지 않으려면 이차방정식 $f' (x)=0$이 중근 또는 허근을 가져야 한다.<br>이차방정식 $f' (x)=0$의 판별식을 $D$라 하면<br>$\\dfrac{D}{4}=(a+3)^{2}+4a\\le 0$<br>$a^{2}+10a+9\\le 0$, $(a+9)(a+1)\\le 0$<br>$\\therefore \\;-9\\le a\\le \\,-1$<br>따라서 $\\alpha =\\,-9$, $\\beta =\\,-1$이므로<br>$\\alpha ^{2}+\\beta ^{2}=(-9)^{2}+(-1)^{2}=82$", "k": "c5", "c": ["$\\mathrm{40}$", "$\\mathrm{58}$", "$\\mathrm{68}$", "$\\mathrm{74}$", "$\\mathrm{82}$"], "a": "$\\mathrm{82}$", "q": "함수 $f(x)=\\dfrac{4}{3}x^{3}+(a+3)x^{2}-ax+1$이 극값을 갖지 않도록 하는 실수 $a$의 값의 범위는 $\\alpha \\le a\\le \\beta $이다. 이때 $\\alpha ^{2}+\\beta ^{2}$의 값은?", "key": "Tm05-11"}, "x05x59-058": {"id": "x05x59-058", "unit": "m05", "theme": "11", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(x)=x^{3}+ax^{2}+3x-7$에서<br>$f' (x)=3x^{2}+2ax+3$<br>함수 $f(x)$가 극값을 갖지 않으려면 이차방정식 $f' (x)=0$은 중근 또는 허근을 가져야 한다.<br>이차방정식 $f' (x)=0$의 판별식을 $D_{1}$이라 하면<br>$\\dfrac{D_{1}}{4}=a^{2}-9\\le 0$, $(a+3)(a-3)\\le 0$<br>$\\therefore \\;-3\\le a\\le 3\\cdots \\cdots $ ㉠<br>$g(x)=\\,-x^{3}+2ax^{2}-ax+1$에서<br>$g' (x)=\\,-3x^{2}+4ax-a$<br>함수 $g(x)$가 극값을 가지려면 이차방정식 $g' (x)=0$이 서로 다른 두 실근을 가져야 한다.<br>이차방정식 $g' (x)=0$의 판별식을 $D_{2}$라 하면<br>$\\dfrac{D_{2}}{4}=4a^{2}-3a>0$, $a(4a-3)>0$<br>$\\therefore \\;a<0$ 또는 $a>\\dfrac{3}{4}\\cdots \\cdots $ ㉡<br>㉠, ㉡에서<br>$-3\\le a<0$ 또는 $\\dfrac{3}{4}<a\\le 3$<br>따라서 정수 $a$는<br>$-3$, $-2$, $-1$, $1$, $2$, $3$<br>의 $\\mathrm{6}$개이다.", "k": "num", "a": "6", "q": "함수 $f(x)=x^{3}+ax^{2}+3x-7$은 극값을 갖지 않고, 함수 $g(x)=\\,-x^{3}+2ax^{2}-ax+1$은 극값을 가질 때, 정수 $a$의 개수를 구하시오.", "key": "Tm05-11"}, "x05x75-041": {"id": "x05x75-041", "unit": "m05", "theme": "11", "벌": "X05x75", "lvl": 2, "fix": true, "src": "문제집 바이블개념ON", "w": "$f(x)=2x^{3}+3ax^{2}+(2a^{2}+3a)x$에서<br>$f' (x)=6x^{2}+6ax+2a^{2}+3a$<br>삼차함수 $f(x)$가 극댓값과 극솟값을 모두 가질 필요충분조건은 이차방정식 $f' (x)=0$이 서로 다른 두 실근을 갖는 것이므로 이차방정식 $f' (x)=0$의 판별식을 $D$라 하면<br>$\\dfrac{D}{4}=9a^{2}-6(2a^{2}+3a)>0$<br>$-3a^{2}-18a>0$, $3a(a+6)<0$<br>$\\therefore \\;-6<a<0$<br>따라서 구하는 정수 $a$는 $-5,
