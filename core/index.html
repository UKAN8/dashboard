$의 판별식을 $D$라 하면<br>$D=9+4a>0\\;\\therefore \\;a>\\,-\\dfrac{9}{4}$<br>이때 $x=0$이 방정식 $x^{2}-3x-a=0$의 근이 아니므로<br>$a\\ne 0$<br>$\\therefore \\;-\\dfrac{9}{4}<a<0$ 또는 $a>0$<br>따라서 $a$의 값이 될 수 있는 것은 ⑤이다.", "k": "c5", "c": ["$\\mathrm{-20}$", "$\\mathrm{-16}$", "$\\mathrm{-10}$", "$\\mathrm{-6}$", "$\\mathrm{-2}$"], "a": "$\\mathrm{-2}$", "q": "다음 중 함수 $f(x)=\\,-x^{4}+4x^{3}+2ax^{2}$이 극솟값을 갖도록 하는 실수 $a$의 값이 될 수 있는 것은?", "key": "Tm05-14"}, "x05x59-064": {"id": "x05x59-064", "unit": "m05", "theme": "14", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(x)=x^{4}+2x^{3}+ax^{2}$에서<br>$f' (x)=4x^{3}+6x^{2}+2ax$<br>$=2x(2x^{2}+3x+a)$<br>사차함수 $f(x)$가 극댓값을 가지려면 삼차방정식 $f' (x)=0$이 서로 다른 세 실근을 가져야 한다.<br>그런데 방정식 $f' (x)=0$의 한 실근이 $x=0$이므로 이차방정식 $2x^{2}+3x+a=0$이 $\\mathrm{0}$이 아닌 서로 다른 두 실근을 가져야 한다.<br>이차방정식 $2x^{2}+3x+a=0$의 판별식을 $D$라 하면<br>$D\\,=9-8a>0\\;\\therefore \\;a<\\dfrac{9}{8}$<br>이때 $x=0$이 방정식 $2x^{2}+3x+a=0$의 근이 아니므로<br>$a\\ne 0$<br>$\\therefore \\;a<0$ 또는 $0<a<\\dfrac{9}{8}$<br>따라서 $\\alpha =0$, $\\beta =0$, $\\gamma =\\dfrac{9}{8}$이므로<br>$\\alpha +\\beta +\\gamma =\\dfrac{9}{8}$", "k": "num", "a": "9/8", "q": "함수 $f(x)=x^{4}+2x^{3}+ax^{2}$이 극댓값을 갖도록 하는 실수 $a$의 값의 범위가 $a<\\alpha $ 또는 $\\beta <a<\\gamma $일 때, $\\alpha +\\beta +\\gamma $의 값을 구하시오.", "key": "Tm05-14"}, "x05x59-065": {"id": "x05x59-065", "unit": "m05", "theme": "14", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(x)=\\dfrac{1}{2}x^{4}+(a-1)x^{2}-2ax$에서<br>$f' (x)=2x^{3}+2(a-1)x-2a$<br>$=2(x-1)(x^{2}+x+a)$<br>사차함수 $f(x)$가 극댓값을 갖지 않으려면 삼차방정식 $f' (x)=0$이 한 실근과 두 허근을 갖거나 한 실근과 중근 또는 삼중근을 가져야 한다.<br>(ⅰ) $f' (x)=0$이 한 실근과 두 허근을 갖는 경우 이차방정식 $x^{2}+x+a=0$이 허근을 가져야 하므로 판별식을 $D$라 하면<br>$D=1-4a<0\\;\\therefore \\;a>\\dfrac{1}{4}$<br>(ⅱ) 이차방정식 $x^{2}+x+a=0$이 $x=1$을 근으로 갖거나 $\\mathrm{1}$이 아닌 실수를 중근으로 가져야 한다.<br>(ⅱ-1) 이차방정식 $x^{2}+x+a=0$이 $x=1$을 근으로 가질 때, <br>$2+a=0\\;\\therefore \\;a=\\,-2$<br>(ⅱ-2) 이차방정식 $x^{2}+x+a=0$이 $\\mathrm{1}$이 아닌 실수를 중근으로 가질 때, 판별식을 $D$라 하면<br>$D\\,=1-4a=0\\;\\therefore \\;a=\\dfrac{1}{4}$<br>(ⅰ), (ⅱ)에서 실수 $a$의 값의 범위는<br>$a=\\,-2$ 또는 $a\\ge \\dfrac{1}{4}$<br>따라서 $a$의 최솟값은 $\\mathrm{-2}$이다.", "k": "c5", "c": ["$\\mathrm{-2}$", "$\\mathrm{-1}$", "$\\dfrac{1}{4}$", "$\\dfrac{1}{2}$", "$\\mathrm{1}$"], "a": "$\\mathrm{-2}$", "q": "함수 $f(x)=\\dfrac{1}{2}x^{4}+(a-1)x^{2}-2ax$가 극댓값을 갖지 않도록 하는 실수 $a$의 최솟값은?", "key": "Tm05-14"}, "x05x59-067": {"id": "x05x59-067", "unit": "m05", "theme": "14", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(x)=x^{4}+2ax^{3}+2x^{2}+1$에서<br>$f' (x)=4x^{3}+6ax^{2}+4x=2x(2x^{2}+3ax+2)$<br>사차함수 $f(x)$가 극값을 하나만 가지려면 삼차방정식 $f' (x)=0$이 한 실근과 두 허근을 갖거나 한 실근과 중근 또는 삼중근을 가져야 한다.<br>(ⅰ) $f' (x)=0$이 한 실근과 두 허근을 갖는 경우<br>이차방정식 $2x^{2}+3ax+2=0$이 허근을 가져야 하므로 판별식을 $D$라 하면<br>$D=9a^{3}-16<0$, $(3a+4)(3a-4)<0$<br>$\\therefore \\;-\\dfrac{4}{3}<a<\\dfrac{4}{3}$<br>(ⅱ) $f' (x)=0$이 한 실근과 중근을 갖는 경우<br>이차방정식 $2x^{2}+3ax+2=0$이 $x=0$을 근으로 가질 수 없으므로 $\\mathrm{0}$이 아닌 실수를 중근으로 가져야 한다.<br>즉 판별식을 $D$라 하면<br>$D=9a^{2}-16=0\\;\\therefore \\;a=\\,-\\dfrac{4}{3}$ 또는 $a=\\dfrac{4}{3}$<br>(ⅰ), (ⅱ)에서 실수 $a$의 값의 범위는 $-\\dfrac{4}{3}\\le a\\le \\dfrac{4}{3}$<br>따라서 $M\\,=\\dfrac{4}{3}$, $m=\\,-\\dfrac{4}{3}$이므로<br>$M\\,m=\\,-\\dfrac{16}{9}$", "k": "num", "a": "-16/9", "q": "함수 $f(x)=x^{4}+2ax^{3}+2x^{2}+1$이 극값을 하나만 갖도록 하는 실수 $a$의 최댓값을 $M$, 최솟값을 $m$이라 할 때, $Mm$의 값을 구하시오.", "key": "Tm05-14"}, "x05x75-053": {"id": "x05x75-053", "unit": "m05", "theme": "14", "벌": "X05x75", "lvl": 2, "fix": true, "src": "문제집 바이블개념ON", "w": "$f(x)=x^{4}+ax^{3}+bx^{2}-1$에서<br>$f'(x)=4x^{3}+3ax^{2}+2bx=x(4x^{2}+3ax+2b)$<br>함수 $f(x)$가 $x=-\\dfrac{1}{2}$에서 극값을 갖고, $x=c$에서 극값을 갖지 않으므로 삼차방정식 $f'(x)=0$은 $x=-\\dfrac{1}{2}$을 근으로 갖고 $x=c\\left(c\\ne -\\dfrac{1}{2}\\right)$을 중근으로 가져야 한다.<br>그런데 삼차방정식 $f'(x)=0$의 한 근이 $x=0$이므로 이차방정식 $4x^{2}+3ax+2b=0$의 한 근이 $x=-\\dfrac{1}{2}$이어야 하고, 다른 한 근은 $x=0$이어야 한다.<br>따라서 $4x^{2}+3ax+2b=4x\\left(x+\\dfrac{1}{2}\\right)$이므로<br>$3a=2$, $2b=0\\therefore \\;a=\\dfrac{2}{3},\\;b=0$<br>한편, $c=0$이므로<br>$3a+b+c=3\\times \\dfrac{2}{3}+0+0=2$", "k": "num", "a": "2", "q": "함수 $f(x)=x^{4}+ax^{3}+bx^{2}-1$이 $x=-\\dfrac{1}{2}$에서 극값을 갖고, $f'(c)=0$이지만 $x=c$에서 극값을 갖지 않을 때, $3a+b+c$의 값을 구하시오. (단, $a,\\;b$는 상수이다.)", "key": "Tm05-14"}, "x05x108-007": {"id": "x05x108-007", "unit": "m05", "theme": "15", "벌": "X05x108", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=x^{3}-3x^{2}-9x+8$에서<br>$f' (x)=3x^{2}-6x-9=3(x+1)(x-3)$<br>$f' (x)=0$인 $x$의 값은 $x=-1$ 또는 $x=3$<br>닫힌구간 $[\\,-2,\\;0\\,]$에서 함수 $f(x)$의 증가, 감소를 표로 나타내면 다음과 같다.<br>${x}-2{\\cdots }-1{\\cdots }0{f' (x)}+0-{f(x)}6\\nearrow 13$<br>극대$\\searrow 8$<br>함수 $f(x)$의 최댓값은 $f(-1)=13$이다.", "k": "c5", "c": ["$10$", "$11$", "$12$", "$13$", "$14$"], "a": "$13$", "q": "닫힌구간 $[\\,-2,\\;0\\,]$에서 함수 $f(x)=x^{3}-3x^{2}-9x+8$의 최댓값은?", "key": "Tm05-15"}, "x05x108-008": {"id": "x05x108-008", "unit": "m05", "theme": "15", "벌": "X05x108", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=3x^{4}-4x^{3}+1$에서<br>$f' (x)=12x^{3}-12x^{2}=12x^{2}(x-1)$<br>$f' (x)=0$인 $x$의 값은 $x=0$ 또는 $x=1$<br>${x}{\\cdots }0{\\cdots }1{\\cdots }{f' (x)}-0-0+{f(x)}\\searrow 1\\searrow 0$<br>극소$\\nearrow $<br>따라서 함수 $f(x)$의 최솟값은 $f(1)=0$이다.", "k": "c5", "c": ["$-2$", "$-1$", "$0$", "$1$", "$2$"], "a": "$0$", "q": "함수 $f(x)=3x^{4}-4x^{3}+1$의 최솟값은?", "key": "Tm05-15"}, "x05x108-009": {"id": "x05x108-009", "unit": "m05", "theme": "15", "벌": "X05x108", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=\\dfrac{x^{4}}{4}-x^{3}+x^{2}-2$에서<br>$f' (x)=x^{3}-3x^{2}+2x=x(x-1)(x-2)$<br>$f' (x)=0$인 $x$의 값은 $x=0$ 또는 $x=1$ 또는 $x=2$<br>닫힌구간 $[\\,-2,\\;2\\,]$에서 함수 $f(x)$의 증가, 감소를 표로 나타내면 다음과 같다.<br>${x}-2{\\cdots }0{\\cdots }1{\\cdots }2{f' (x)}-0+0-0{f(x)}14\\searrow -2$<br>극소$\\nearrow -\\dfrac{7}{4}$<br>극대$\\searrow -2$<br>따라서 함수 $f(x)$의 최댓값은 $f(-2)=14$, 최솟값은 $f(0)=f(2)=-2$이므로 구하는 최댓값과 최솟값의 곱은<br>$14\\times (-2)=-28$", "k": "num", "a": "-28", "q": "닫힌구간 $[\\,-2,\\;2\\,]$에서 함수 $f(x)=\\dfrac{x^{4}}{4}-x^{3}+x^{2}-2$의 최댓값과 최솟값의 곱을 구하시오.", "key": "Tm05-15"}, "x05x108-012": {"id": "x05x108-012", "unit": "m05", "theme": "15", "벌": "X05x108", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$x^{2}-4x-y=0$에서 $y=x^{2}-4x$이므로<br>$x^{2}y=x^{2}(x^{2}-4x)=x^{4}-4x^{3}$<br>$f(x)=x^{4}-4x^{3}$이라 하면<br>$f' (x)=4x^{3}-12x^{2}=4x^{2}(x-3)$<br>$f' (x)=0$인 $x$의 값은 $x=0$ 또는 $x=3$<br>함수 $f(x)$의 증가, 감소를 표로 나타내면 다음과 같다.<br>${x}{\\cdots }0{\\cdots }3{\\cdots }{f' (x)}-0-0+{f(x)}\\searrow 0\\searrow -27$<br>극소$\\nearrow $<br>따라서 함수 $f(x)$의 최솟값은 $f(3)=-27$이므로 $x^{2}y$의 최솟값은 $-27$이다.", "k": "c5", "c": ["$-18$", "$-27$", "$-36$", "$-45$", "$-54$"], "a": "$-27$", "q": "$x^{2}-4x-y=0$을 만족시키는 실수 $x,\\;y$에 대하여 $x^{2}y$의 최솟값은?", "key": "Tm05-15"}, "x05x108-013": {"id": "x05x108-013", "unit": "m05", "theme": "15", "벌": "X05x108", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=x^{3}-3|\\,x\\,|+3$에서<br>(ⅰ) $x>0$일 때<br>$f(x)=x^{3}-3x+3$이므로<br>$f' (x)=3x^{2}-3=3(x+1)(x-1)$<br>$f' (x)=0$인 $x$의 값은 $x=1\\;(\\because \\;x>0)$<br>(ⅱ) $x<0$일 때<br>$f(x)=x^{3}+3x+3$이므로<br>$f' (x)=3x^{2}+3>0$<br>(ⅲ) $x=0$일 때<br>$f(0)=3$<br>닫힌구간 $[\\,-1,\\;2\\,]$에서 함수 $f(x)$의 증가, 감소를 표로 나타내면 다음과 같다.<br>${x}-1{\\cdots }0{\\cdots }1{\\cdots }2{f' (x)}+-0+{f(x)}-1\\nearrow 3$<br>극대$\\searrow 1$<br>극소$\\nearrow 5$<br>따라서 함수 $f(x)$의 최댓값은 $f(2)=5$, 최솟값은 $f(-1)=-1$이므로 구하는 최댓값과 최솟값의 차는<br>$|\\,5-(-1)\\,|=6$", "k": "num", "a": "6", "q": "닫힌구간 $[\\,-1,\\;2\\,]$에서 함수 $f(x)=x^{3}-3|\\,x\\,|+3$의 최댓값과 최솟값의 차를 구하시오.", "key": "Tm05-15"}, "x05x108-014": {"id": "x05x108-014", "unit": "m05", "theme": "15", "벌": "X05x108", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=x^{3}-3x+5$에서<br>$f' (x)=3x^{2}-3=3(x+1)(x-1)$<br>$f' (x)=0$인 $x$의 값은 $x=-1$ 또는 $x=1$<br>닫힌구간 $[\\,-1,\\;3\\,]$에서 함수 $f(x)$의 증가, 감소를 표로 나타내면 다음과 같다.<br>${x}-1{\\cdots }1{\\cdots }3{f' (x)}0-0+{f(x)}7\\searrow 3$<br>극대$\\nearrow 23$<br>따라서 함수 $f(x)$의 최솟값은 $f(1)=3$이다.", "k": "c5", "c": ["$1$", "$2$", "$3$", "$4$", "$5$"], "a": "$3$", "q": "닫힌구간 $[\\,-1,\\;3\\,]$에서 함수 $f(x)=x^{3}-3x+5$의 최솟값은?", "key": "Tm05-15"}, "x05x59-072": {"id": "x05x59-072", "unit": "m05", "theme": "15", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$x^{2}-6x+8=t$로 놓으면<br>$t=x^{2}-6x+8=(x-3)^{2}-1$<br>$2\\le x\\le 5$에서 $t$의 값의 범위는 $-1\\le t\\le 3$<br>$g(t)=t^{3}-12t+1$이라 하면<br>$g'(t)=3t^{2}-12=3(t+2)(t-2)$<br>$g'(t)=0$에서 $t=2\\;(\\because \\;-1\\le t\\le 3)$<br>따라서 함수 $g(t)$는 $t=\\,-1$에서 최댓값 $t-1\\cdots 2\\cdots 3g'(t)-0+g(t)12\\searrow -15\\nearrow -812$, $t=2$에서 최솟값 $-15$를 가지므로 최댓값과 최솟값의 합은<br>$12+(-15)=\\,-3$", "k": "c5", "c": ["$\\mathrm{-5}$", "$\\mathrm{-3}$", "$\\mathrm{0}$", "$\\mathrm{3}$", "$\\mathrm{5}$"], "a": "$\\mathrm{-3}$", "q": "구간 $[2,\\,5]$에서 함수<br> $f(x)=(x^{2}-6x+8)^{3}-12(x^{2}-6x+8)+1$<br>의 최댓값과 최솟값의 합은?", "key": "Tm05-15"}, "x05x59-078": {"id": "x05x59-078", "unit": "m05", "theme": "15", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(x)=x^{3}+ax^{2}+bx+c$에서<br>$f'(x)=3x^{2}+2ax+b$<br>조건 (가)에서 함수 $f(x)$가 $x=\\,-2$, $x=0$에서 극값을 가지므로<br>$f'(-2)=0$, $f'(0)=0$<br>$12-4a+b=0$, $b=0\\;\\therefore \\;a=3$, $b=0$<br>$\\therefore \\;f(x)=x^{3}+3x^{2}+c$<br>$x-3\\cdots -2\\cdots 0\\cdots 2f'(x)+0-0+f(x)c\\nearrow c+4\\searrow c\\nearrow c+20$<br>따라서<br>함수 $f(x)$는 $x=2$에서 최댓값 $c+20$,<br>$x=\\,-3$ 또는 $x=0$에서 최솟값 $c$를 갖는다.<br>이때 조건 (나)에서<br>함수 $f(x)$의 최댓값이 $19$이므로<br>$c+20=19$<br>$\\therefore \\;c=\\,-1$<br>따라서<br>함수 $f(x)$의 최솟값은 $-1$이다.", "k": "c5", "c": ["$-5$", "$-2$", "$-1$", "$1$", "$3$"], "a": "$-1$", "q": "구간 $[-3,\\,2]$에서 함수 $f(x)=x^{3}+ax^{2}+bx+c$가 다음 조건을 모두 만족시킬 때, 이 구간에서 $f(x)$의 최솟값은? (단, $a$, $b$, $c$는 상수이다.)<br>(가) $x=\\,-2$, $x=0$에서 극값을 갖는다.<br>(나) 최댓값이 $19$이다.", "key": "Tm05-15"}, "x05x108-019": {"id": "x05x108-019", "unit": "m05", "theme": "16", "벌": "X05x108", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=ax^{3}-\\dfrac{3}{2}ax^{2}+b$에서<br>$f' (x)=3ax^{2}-3ax=3ax(x-1)$<br>$f' (x)=0$인 $x$의 값은 $x=0$ 또는 $x=1$<br>$a<0$이므로 닫힌구간 $[\\,-1,\\;2\\,]$에서 함수 $f(x)$의 증가, 감소를 표로 나타내면 다음과 같다.<br>${x}-1{\\cdots }0{\\cdots }1{\\cdots }2{f' (x)}-0+0-{f(x)}-\\dfrac{5}{2}a+b\\searrow b$<br>극소$\\nearrow -\\dfrac{1}{2}a+b$<br>극대$\\searrow 2a+b$<br>$a<0$이므로 $2a<0<-\\dfrac{1}{2}a<-\\dfrac{5}{2}a$<br>$\\therefore \\;2a+b<b<-\\dfrac{1}{2}a+b<-\\dfrac{5}{2}a+b$<br>즉, 함수 $f(x)$의 최댓값은 $f(-1)=-\\dfrac{5}{2}a+b$, 최솟값은 $f(2)=2a+b$이다.<br>함수 $f(x)$의 최댓값이 $6$, 최솟값이 $-3$이므로<br>$-\\dfrac{5}{2}a+b=6,\\;2a+b=-3$<br>두 식을 연립하여 풀면 $a=-2,\\;b=1$<br>$\\therefore \\;a+b=-1$", "k": "c5", "c": ["$-2$", "$-1$", "$0$", "$1$", "$2$"], "a": "$-1$", "q": "닫힌구간 $[\\,-1,\\;2\\,]$에서 함수 $f(x)=ax^{3}-\\dfrac{3}{2}ax^{2}+b$의 최댓값이 $6$이고 최솟값이 $-3$일 때, 상수 $a,\\;b$에 대하여 $a+b$의 값은? (단, $a<0$)", "key": "Tm05-16"}, "x05x108-020": {"id": "x05x108-020", "unit": "m05", "theme": "16", "벌": "X05x108", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=3x^{4}-12x^{3}+12x^{2}+a$에서<br>$f'(x)=12x^{3}-36x^{2}+24x=12x(x-1)(x-2)$<br>$f'(x)=0$인 $x$의 값은 $x=0$ 또는 $x=1$ 또는 $x=2$<br>함수 $f(x)$의 증가, 감소를 표로 나타내면 다음과 같다.<br>${x}{\\cdots }0{\\cdots }1{\\cdots }2{\\cdots }{f' (x)}-0+0-0+{f(x)}\\searrow a$<br>극소$\\nearrow a+3$<br>극대$\\searrow a$<br>극소$\\nearrow $<br>함수 $f(x)$의 최솟값은 $f(0)=f(2)=a$이다.<br>이때 함수 $f(x)$의 최솟값이 $-2$이므로<br>$a=-2$", "k": "num", "a": "-2", "q": "함수 $f(x)=3x^{4}-12x^{3}+12x^{2}+a$의 최솟값이 $-2$일 때, 상수 $a$의 값을 구하시오.", "key": "Tm05-16"}, "x05x108-022": {"id": "x05x108-022", "unit": "m05", "theme": "16", "벌": "X05x108", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=-ax^{3}+3x^{2}+2$에서<br>$f'(x)=-3ax^{2}+6x=-3x(ax-2)$<br>$f'(x)=0$인 $x$의 값은 $x=0$ 또는 $x=\\dfrac{2}{a}$<br>$a>1$이므로 $0<\\dfrac{2}{a}<2$<br>닫힌구간 $[\\,0,\\;2\\,]$에서 함수 $f(x)$의 증가, 감소를 표로 나타내면 다음과 같다.<br>${x}0{\\cdots }\\dfrac{2}{a}{\\cdots }2{f' (x)}0+0-{f(x)}2\\nearrow \\dfrac{4}{a^{2}}+2$<br>극대$\\searrow -8a+14$<br>함수 $f(x)$의 최댓값은 $f\\left(\\dfrac{2}{a}\\right)=\\dfrac{4}{a^{2}}+2$이고, $f(x)$의 최댓값이 $3$이므로<br>$\\dfrac{4}{a^{2}}+2=3$, $\\dfrac{4}{a^{2}}=1$<br>$a^{2}=4$<br>$\\therefore a=2(\\because \\;a>1)$<br>따라서 함수 $f(x)$의 최솟값은<br>$f(2)=-8a+14=-2$", "k": "c5", "c": ["$-1$", "$-2$", "$-3$", "$-4$", "$-5$"], "a": "$-2$", "q": "닫힌구간 $[\\,0,\\;2\\,]$에서 함수 $f(x)=-ax^{3}+3x^{2}+2$의 최댓값이 $3$일 때, 함수 $f(x)$의 최솟값은? (단, $a>1$)", "key": "Tm05-16"}, "x05x108-023": {"id": "x05x108-023", "unit": "m05", "theme": "16", "벌": "X05x108", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=x^{3}+ax^{2}+bx+1$에서<br>$f'(x)=3x^{2}+2ax+b$<br>함수 $f(x)$가 $x=1$에서 극값 $5$를 가지므로<br>$f' (1)=0$에서 $3+2a+b=0\\cdots \\cdots $㉠<br>$f(1)=5$에서 $1+a+b+1=5\\cdots \\cdots $㉡<br>㉠, ㉡을 연립하여 풀면 $a=-6$, $b=9$<br>즉, $f(x)=x^{3}-6x^{2}+9x+1$이므로<br>$f'(x)=3x^{2}-12x+9=3(x-1)(x-3)$<br>$f'(x)=0$인 $x$의 값은 $x=1$ 또는 $x=3$<br>닫힌구간 $[\\,1,\\;5\\,]$에서 함수 $f(x)$의 증가, 감소를 표로 나타내면 다음과 같다.<br>${x}1{\\cdots }3{\\cdots }5{f' (x)}0-0+{f(x)}5\\searrow 1$<br>극소$\\nearrow 21$<br>따라서 함수 $f(x)$의 최댓값은 $f(5)=21$이다.", "k": "c5", "c": ["$21$", "$22$", "$23$", "$24$", "$25$"], "a": "$21$", "q": "함수 $f(x)=x^{3}+ax^{2}+bx+1$이 $x=1$에서 극값 $5$를 가질 때, 닫힌구간 $[\\,1,\\;5\\,]$에서 함수 $f(x)$의 최댓값은? (단, $a$, $b$는 상수이다.)", "key": "Tm05-16"}, "x05x108-025": {"id": "x05x108-025", "unit": "m05", "theme": "16", "벌": "X05x108", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=x^{3}+ax^{2}+bx+c$에서<br>$f'(x)=3x^{2}+2ax+b$<br>(가)에서 함수 $f(x)$가 $x=0$, $x=2$에서 극값을 가지므로<br>$f'(0)=0$에서 $b=0$<br>$f'(2)=0$에서 $12+4a+b=0$<br>$12+4a+0=0\\therefore a=-3$<br>즉, $f(x)=x^{3}-3x^{2}+c$이므로<br>$f' (x)=3x^{2}-6x=3x(x-2)$<br>$f'(x)=0$인 $x$의 값은 $x=0$ 또는 $x=2$<br>닫힌구간 $[\\,-2,\\;4\\,]$에서 함수 $f(x)$의 증가, 감소를 표로 나타내면 다음과 같다.<br>${x}-2{\\cdots }0{\\cdots }2{\\cdots }4{f' (x)}+0-0+{f(x)}c-20\\nearrow c$<br>극대$\\searrow c-4$<br>극소$\\nearrow c+16$<br>따라서 함수 $f(x)$의 최댓값은 $f(4)=c+16$, 최솟값은 $f(-2)=c-20$이다.<br>이때 (나)에서 함수 $f(x)$의 최솟값이 $-21$이므로<br>$c-20=-21$<br>$\\therefore c=-1$<br>따라서 함수 $f(x)$의 최댓값은<br>$c+16=-1+16=15$", "k": "num", "a": "15", "q": "닫힌구간 $[\\,-2,\\;4\\,]$에서 함수 $f(x)=x^{3}+ax^{2}+bx+c$가 다음 조건을 만족시킬 때, $f(x)$의 최댓값을 구하시오.<br>(단, $a$, $b$, $c$는 상수이다.)<br>(가) $x=0$, $x=2$에서 극값을 가진다.<br>(나) 최솟값이 $-21$이다.", "key": "Tm05-16"}, "x05x108-026": {"id": "x05x108-026", "unit": "m05", "theme": "16", "벌": "X05x108", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=x^{3}-6x^{2}+9x+a$에서<br>$f'(x)=3x^{2}-12x+9=3(x-1)(x-3)$<br>$f'(x)=0$인 $x$의 값은 $x=1$ 또는 $x=3$<br>닫힌구간 $[\\,0,\\;3\\,]$에서 함수 $f(x)$의 증가, 감소를 표로 나타내면 다음과 같다.<br>${x}0{\\cdots }1{\\cdots }3{f' (x)}+0-0{f(x)}a\\nearrow a+4$<br>극대$\\searrow a$<br>따라서 함수 $f(x)$의 최댓값은 $f(1)=a+4$이므로<br>$a+4=12\\therefore a=8$", "k": "c5", "c": ["$2$", "$4$", "$6$", "$8$", "$10$"], "a": "$8$", "q": "닫힌구간 $[\\,0,\\;3\\,]$에서 함수 $f(x)=x^{3}-6x^{2}+9x+a$의 최댓값이 $12$일 때, 상수 $a$의 값은?", "key": "Tm05-16"}, "x05x108-027": {"id": "x05x108-027", "unit": "m05", "theme": "16", "벌": "X05x108", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=x^{3}+ax^{2}-a^{2}x+2$에서<br>$f'(x)=3x^{2}+2ax-a^{2}=(x+a)(3x-a)$<br>$f'(x)=0$인 $x$의 값은 $x=-a$ 또는 $x=\\dfrac{a}{3}$<br>$a>0$이므로 닫힌구간 $[\\,-a,\\;a\\,]$에서 함수 $f(x)$의 증가, 감소를 표로 나타내면 다음과 같다.<br>${x}-a{\\cdots }\\dfrac{a}{3}{\\cdots }a{f' (x)}0-0+{f(x)}a^{3}+2\\searrow -\\dfrac{5}{27}a^{3}+2$<br>극소$\\nearrow a^{3}+2$<br>함수 $f(x)$의 최솟값은 $f\\left(\\dfrac{a}{3}\\right)=-\\dfrac{5}{27}a^{3}+2$이다.<br>이때 함수 $f(x)$의 최솟값이 $\\dfrac{14}{27}$이므로<br>$-\\dfrac{5}{27}a^{3}+2=\\dfrac{14}{27}$, $a^{3}=8$<br>$\\therefore a=2$ ($\\because a$는 실수)<br>따라서 함수 $f(x)$의 최댓값은<br>$f(-2)=f(2)=a^{3}+2=10$<br>이므로 $M=10$<br>$\\therefore a+M=2+10=12$", "k": "num", "a": "12", "q": "양수 $a$에 대하여 함수 $f(x)=x^{3}+ax^{2}-a^{2}x+2$는 닫힌구간 $[\\,-a,\\;a\\,]$에서 최댓값 $M$, 최솟값 $\\dfrac{14}{27}$를 가진다. $a+M$의 값을 구하시오.", "key": "Tm05-16"}, "x05x53-110": {"id": "x05x53-110", "unit": "m05", "theme": "16", "벌": "X05x53", "lvl": 2, "fix": true, "src": "문제집 개념원리", "w": "$f(x)=ax^{3}-6ax^{2}+b$에서<br>$f' (x)=3ax^{2}-12ax=3ax(x-4)$<br>$f'(x)=0$에서 $x=0$ 또는 $x=4$<br>이때 $a>0$이므로 구간 $[\\,-1,\\;2\\,]$에서 함수 $f(x)$의 증가와 감소를 표로 나타내면 다음과 같다.<br>${x}-1{\\cdots }0{\\cdots }2{f' (x)}+0-{f(x)}-7a+b\\nearrow b\\searrow -16a+b$<br>따라서 $f(x)$는 $x=0$에서 최댓값 $b$, $x=2$에서 최솟값 $-16a+b$를 가지므로 $b=3$, $-16a+b=-29\\therefore \\;a=2$, $b=3$<br>$\\therefore \\;a+b=5$", "k": "num", "a": "5", "q": "구간 $[\\,-1,\\;2\\,]$에서 함수 $f(x)=ax^{3}-6ax^{2}+b$의 최댓값이 $3$, 최솟값이 $-29$일 때, 상수 $a$, $b$에 대하여 $a+b$의 값을 구하시오.<br>(단, $a>0$)", "key": "Tm05-16"}, "x05x53-111": {"id": "x05x53-111", "unit": "m05", "theme": "16", "벌": "X05x53", "lvl": 2, "fix": true, "src": "문제집 개념원리", "w": "$f(x)=-2x^{3}+3x^{2}+a$에서<br>$f' (x)=-6x^{2}+6x=-6x(x-1)$<br>$f'(x)=0$에서 $x=0$ 또는 $x=1$<br>구간 $[\\,0,\\;2\\,]$에서 함수 $f(x)$의 증가와 감소를 표로 나타내면 다음과 같다.<br>${x}0{\\cdots }1{\\cdots }2{f' (x)}+0-{f(x)}a\\nearrow 1+a\\searrow -4+a$<br>따라서 $f(x)$는 $x=2$에서 최솟값 $-4+a$를 가지므로<br>$-4+a=-5\\therefore \\;a=-1$<br>또 $x=1$에서 최댓값 $1+a$를 가지므로 구하는 최댓값은<br>$1+(-1)=0$", "k": "num", "a": "0", "q": "구간 $[\\,0,\\;2\\,]$에서 함수 $f(x)=-2x^{3}+3x^{2}+a$의 최솟값이 $-5$일 때, 최댓값을 구하시오. (단, $a$는 상수이다.)", "key": "Tm05-16"}, "x05x53-112": {"id": "x05x53-112", "unit": "m05", "theme": "16", "벌": "X05x53", "lvl": 2, "fix": true, "src": "문제집 개념원리", "w": "$f(x)=x^{3}-3x^{2}+a$에서<br>$f' (x)=3x^{2}-6x=3x(x-2)$<br>$f'(x)=0$에서 $x=0$ 또는 $x=2$<br>구간 $[\\,-2,\\;1\\,]$에서 함수 $f(x)$의 증가와 감소를 표로 나타내면 다음과 같다.<br>${x}-2{\\cdots }0{\\cdots }1{f' (x)}+0-{f(x)}a-20\\nearrow a\\searrow a-2$<br>따라서 $f(x)$는 $x=0$에서 최댓값 $a$, $x=-2$에서 최솟값 $a-20$을 가지므로<br>$a+(a-20)=-10$<br>$2a=10\\therefore \\;a=5$", "k": "num", "a": "5", "q": "구간 $[\\,-2,\\;1\\,]$에서 함수 $f(x)=x^{3}-3x^{2}+a$의 최댓값과 최솟값의 합이 $-10$일 때, 상수 $a$의 값을 구하시오.", "key": "Tm05-16"}, "x05x53-113": {"id": "x05x53-113", "unit": "m05", "theme": "16", "벌": "X05x53", "lvl": 2, "fix": true, "src": "문제집 개념원리", "w": "$f(x)=ax^{4}-4ax^{3}+b$에서<br>$f' (x)=4ax^{3}-12ax^{2}=4ax^{2}(x-3)$<br>$f'(x)=0$에서 $x=0$ 또는 $x=3$<br>이때 $a<0$이므로 구간 $[\\,1,\\;4\\,]$에서 함수 $f(x)$의 증가와 감소를 표로 나타내면 다음과 같다.<br>${x}1{\\cdots }3{\\cdots }4{f' (x)}+0-{f(x)}-3a+b\\nearrow -27a+b\\searrow b$<br>따라서 $f(x)$는 $x=3$에서 최댓값 $-27a+b$, $x=4$에서 최솟값 $b$를 가지므로<br>$-27a+b=3$, $b=-6$<br>$\\therefore \\;a=-\\dfrac{1}{3}$, $b=-6$<br>$\\therefore \\;ab=2$", "k": "num", "a": "2", "q": "구간 $[\\,1,\\;4\\,]$에서 함수 $f(x)=ax^{4}-4ax^{3}+b$의 최댓값이 $3$, 최솟값이 $-6$일 때, 상수 $a$, $b$에 대하여 $ab$의 값을 구하
