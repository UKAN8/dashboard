<br>$=a^{2}-4a+a=a^{2}-3a$<br>$f(6)=a+12$이므로<br>$(f\\circ f)(6)=f(f(6))=f(a+12)$<br>$=(a+12)^{2}-4(a+12)+a$<br>$=a^{2}+21a+96$<br>$(f\\circ f)(4)=(f\\circ f)(6)$에서<br>$a^{2}-3a=a^{2}+21a+96$<br>$24a=-96\\therefore \\;a=-4$<br>따라서 $f(x)=x^{2}-4x-4$이므로<br>$f(2)=-8$", "k": "num", "a": "-8", "q": "함수 $f(x)=x^{2}-4x+a$에 대하여<br> $(f\\circ f)(4)=(f\\circ f)(6)$<br>일 때, $f(2)$의 값을 구하시오. (단, $a$는 상수이다.)", "key": "T08-07"}, "x08x31-100": {"id": "x08x31-100", "unit": "08", "theme": "07", "벌": "X08x31", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$(h\\circ (g\\circ f))(a)=((h\\circ g)\\circ f)(a)$<br>$=(h\\circ g)(f(a))$<br>$=(h\\circ g)(a+2)$<br>$=7(a+2)-6$<br>$=7a+8$<br>즉 $7a+8=-6$이므로<br>$7a=-14\\therefore a=-2$", "k": "num", "a": "-2", "q": "세 함수 $f,\\;g,\\;h$에 대하여<br> $f(x)=x+2,\\;(h\\circ g)(x)=7x-6$<br>일 때, $(h\\circ (g\\circ f))(a)=-6$을 만족시키는 상수 $a$의 값을 구하시오.", "key": "T08-07"}, "x08x31-101": {"id": "x08x31-101", "unit": "08", "theme": "07", "벌": "X08x31", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(3)=g(2)=1$이므로<br>$(g\\circ f)(3)=g(f(3))=g(1)=2$<br>$(f\\circ g)(2)=f(g(2))=f(1)=2$<br>이때 두 함수 $f,\\;g$는 모두 일대일대응이므로<br>$f(2)=3,\\;g(3)=3$<br>$\\therefore \\;f(2)+g(3)=6$", "k": "c5", "c": ["$2$", "$3$", "$4$", "$5$", "$6$"], "a": "$6$", "q": "집합 $X=\\left\\{1,\\;2,\\;3\\right\\}$에 대하여 $X$에서 $X$로의 일대일대응인 두 함수 $f,\\;g$가 있다. $f(3)=g(2)=1$, $(g\\circ f)(3)=(f\\circ g)(2)=2$일 때, $f(2)+g(3)$의 값은?", "key": "T08-07"}, "x08x31-106": {"id": "x08x31-106", "unit": "08", "theme": "07", "벌": "X08x31", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$(f\\circ f)(x)=f(f(x))=(x^{2}-a)^{2}-a$<br>$=x^{4}-2ax^{2}+a^{2}-a$<br>$(f\\circ f)(x)$가 $x-2$로 나누어떨어지므로<br>$(f\\circ f)(2)=0,16-8a+a^{2}-a=0$<br>$\\therefore \\;a^{2}-9a+16=0$<br>따라서 이차방정식의 근과 계수의 관계에 의하여 모든 실수 $a$의 값의 합은 $9$이다.", "k": "c5", "c": ["$-9$", "$-4$", "$1$", "$4$", "$9$"], "a": "$9$", "q": "함수 $f(x)=x^{2}-a$에 대하여 $(f\\circ f)(x)$가 $x-2$로 나누어떨어질 때, 모든 실수 $a$의 값의 합은?", "key": "T08-07"}, "x08x31-110": {"id": "x08x31-110", "unit": "08", "theme": "07", "벌": "X08x31", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$(g\\circ h)(x)=g(h(x))=2h(x)-3$ <br>따라서 $2h(x)-3=2x^{2}+1$이므로<br>$2h(x)=2x^{2}+4\\therefore \\;h(x)=x^{2}+2$", "k": "c5", "c": ["$h(x)=x^{2}-2$", "$h(x)=x^{2}-1$", "$h(x)=x^{2}+2$", "$h(x)=2x^{2}-3$", "$h(x)=2x^{2}+4$"], "a": "$h(x)=x^{2}+2$", "q": "두 함수 $f(x)=2x^{2}+1,\\;g(x)=2x-3$에 대하여 $(g\\circ h)(x)=f(x)$를 만족시키는 함수 $h(x)$는?", "key": "T08-07"}, "x08x40-060": {"id": "x08x40-060", "unit": "08", "theme": "07", "벌": "X08x40", "lvl": 2, "fix": true, "src": "문제집 고쟁이", "w": "합성함수 $f\\circ g$가 정의되기 위해서는 함수 $g$의 치역이 함수 $f$의 정의역의 부분집합이어야 한다.<br>$g(0)=-2a+b$, $g(1)=-a$<br>이므로 함수 $g$의 치역이 함수 $f$의 정의역 $\\left\\{0,\\;1\\right\\}$의 부분집합이 되기 위해서는 가능한 경우는 다음과 같다.<br>(ⅰ) $g(0)=g(1)=0$일 때<br>$-2a+b=0$, $-a=0$에서 $a=0,\\;b=0$이므로<br>$a+b=0$<br>(ⅱ) $g(0)=g(1)=1$일 때<br>$-2a+b=1$, $-a=1$에서 $a=-1,\\;b=-1$이므로<br>$a+b=-2$<br>(ⅲ) $g(0)=0,\\;g(1)=1$일 때<br>$-2a+b=0$, $-a=1$에서 $a=-1,\\;b=-2$이므로<br>$a+b=-3$<br>(ⅳ) $g(0)=1,\\;g(1)=0$일 때<br>$-2a+b=1$, $-a=0$에서 $a=0,\\;b=1$이므로<br>$a+b=1$<br>(ⅰ)∼(ⅳ)에서 모든 $a+b$의 값의 합은<br>$0+(-2)+(-3)+1=-4$", "k": "c5", "c": ["$-4$", "$-2$", "$0$", "$2$", "$4$"], "a": "$-4$", "q": "집합 $X=\\left\\{0,\\;1\\right\\}$에서 정의된 두 함수<br> $f(x)=3x+8$, $g(x)=ax^{2}-bx-2a+b$<br>에 대하여 합성함수 $(f\\circ g)(x)$가 정의될 때, 모든 $a+b$의 값의 합은?<br>(단, $a,\\;b$는 실수이다.)", "key": "T08-07"}, "x08x48-038": {"id": "x08x48-038", "unit": "08", "theme": "07", "벌": "X08x48", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "$(f\\circ f)(5)=f(f(5))=f(9)=17$", "k": "c5", "c": ["$11$", "$13$", "$15$", "$17$", "$19$"], "a": "$17$", "q": "함수 $f(x)=2x-1$에 대하여 $(f\\circ f)(5)$의 값은?", "key": "T08-07"}, "x08x48-041": {"id": "x08x48-041", "unit": "08", "theme": "07", "벌": "X08x48", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "$(f\\circ g)(a)=f(g(a))=f(2a-10)$<br>$=(2a-10)^{2}+3=4a^{2}-40a+103$<br>$(f\\circ g)(a)=103$에서 $4a^{2}-40a+103=103$<br>$4a^{2}-40a=0,\\;4a(a-10)=0$<br>$\\therefore \\;a=10\\;(\\because \\;a>0)$", "k": "num", "a": "10", "q": "두 함수 $f(x)=x^{2}+3,\\;g(x)=2x-10$에 대하여<br> $(f\\circ g)(a)=103$일 때, 양수 $a$의 값을 구하시오.", "key": "T08-07"}, "x08x69-057": {"id": "x08x69-057", "unit": "08", "theme": "07", "벌": "X08x69", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "$(f\\circ g)(-4)$의 값을 구하면 $(f\\circ g)(-4)=f(g(-4))$<br>$=f(-10)=-5$<br>$(g\\circ f)(2)$의 값을 구하면 $(g\\circ f)(2)=g(f(2))$<br>$=g(4)=14$<br>따라서 구하는 값은 $(f\\circ g)(-4)+(g\\circ f)(2)=-5+14=9$", "k": "num", "a": "9", "q": "두 함수 $f(x)={\\begin{cases}x^{2} & \\;(x\\ge 0) \\\\ \\dfrac{1}{2}x & \\;(x<0)\\end{cases}}$, $g(x)=3x+2$에 대하여<br>$(f\\circ g)(-4)+(g\\circ f)(2)$의 값을 구하시오.", "key": "T08-07"}, "x08x69-059": {"id": "x08x69-059", "unit": "08", "theme": "07", "벌": "X08x69", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "$(f\\circ g)\\left(\\sqrt{3}\\right)=f\\left(g\\left(\\sqrt{3}\\right)\\right)=f(2)=1$<br>$(g\\circ f)(4)=g(f(4))=g(-1)=0$<br>$\\therefore \\;(f\\circ g)\\left(\\sqrt{3}\\right)+(g\\circ f)(4)=1+0=1$", "k": "num", "a": "1", "q": "두 함수 $f(x)={\\begin{cases}-2x+7 & \\;(x\\ge 3) \\\\ 1 & \\;(x<3)\\end{cases}},\\;g(x)=x^{2}-1$에 대하여 $(f\\circ g)\\left(\\sqrt{3}\\right)+(g\\circ f)(4)$의 값을 구하시오.", "key": "T08-07"}, "x08x69-060": {"id": "x08x69-060", "unit": "08", "theme": "07", "벌": "X08x69", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "$(g\\circ f)(1)=g(f(1))=1$이고 $f(1)=2$이므로<br>$g(2)=1$<br>$(f\\circ g)(3)=f(g(3))=1$이고 $g(3)=2$이므로<br>$f(2)=1$<br>이때 두 함수 $f,\\;g$는 $X$에서 $X$로의 일대일대응이므로<br>$f(3)=3,\\;g(1)=3\\therefore \\;f(3)+g(1)=6$", "k": "num", "a": "6", "q": "집합 $X=\\left\\{1,\\;2,\\;3\\right\\}$에 대하여 $X$에서 $X$로의 두 함수 $f,\\;g$가 모두 일대일대응이고 $f(1)=g(3)=2,\\;(g\\circ f)(1)=(f\\circ g)(3)=1$일 때, $f(3)+g(1)$의 값을 구하시오.", "key": "T08-07"}, "x08x40-077": {"id": "x08x40-077", "unit": "08", "theme": "07", "벌": "X08x40", "lvl": 3, "fix": true, "src": "문제집 고쟁이", "w": "$(g\\circ f)(x)\\le 0$을 만족시키는 실수 $x$가 존재하지 않으므로 모든 실수 $x$에 대하여 $(g\\circ f)>0$이다.<br>$g(x)=x^{2}-x-2=(x-2)(x+1)>0$에서 $x<-1$ 또는 $x>2$이므로 모든 실수 $x$에 대하여 $g(f(x))>0$이려면 모든 실수 $x$에 대하여 $f(x)<-1$ 또는 $f(x)>2$이어야 한다.<br>함수 $f(x)=x^{2}-2kx+4k-1$에서 이차항의 계수가 양수이므로 모든 실수 $x$에 대하여 $f(x)>2$이어야 한다.<br>$f(x)=x^{2}-2kx+4k-1=(x-k)^{2}-k^{2}+4k-1$에서<br>함수 $y=f(x)$의 그래프의 꼭짓점의 $y$좌표는 $-k^{2}+4k-1$이므로<br>$-k^{2}+4k-1>2,\\;k^{2}-4k+3<0,\\;(k-1)(k-3)<0$<br>즉, $1<k<3$이므로 구하는 정수 $k$의 값은 $2$이다.", "k": "c5", "c": ["$-4$", "$-2$", "$0$", "$2$", "$4$"], "a": "$2$", "q": "두 함수 $f,\\;g$가<br> $f(x)=x^{2}-2kx+4k-1,\\;g(x)=x^{2}-x-2$<br>일 때, $(g\\circ f)(x)\\le 0$을 만족시키는 실수 $x$가 존재하지 않도록 하는 정수 $k$의 값은?", "key": "T08-07"}, "x08x21-060": {"id": "x08x21-060", "unit": "08", "theme": "08", "벌": "X08x21", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "$f(x)=2x+6,\\;g(x)=ax-3$에서<br>$(f\\circ g)(x)=f(g(x))=f(ax-3)$<br>$=2(ax-3)+6$<br>$=2ax$<br>$(g\\circ f)(x)=g(f(x))=g(2x+6)$<br>$=a(2x+6)-3$<br>$=2ax+6a-3$<br>$f\\circ g=g\\circ f$이므로 $2ax=2ax+6a-3$<br>$0=6a-3\\therefore \\;a=\\dfrac{1}{2}$<br>따라서 $g(x)=\\dfrac{1}{2}x-3$이므로<br>$g(4)=\\dfrac{1}{2}\\times 4-3=-1$", "k": "num", "a": "-1", "q": "두 함수 $f(x)=2x+6,\\;g(x)=ax-3$에 대하여 $f\\circ g=g\\circ f$가 성립할 때, $g(4)$의 값을 구하시오. (단, $a$는 상수이다.)", "key": "T08-08"}, "x08x21-064": {"id": "x08x21-064", "unit": "08", "theme": "08", "벌": "X08x21", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "$(f\\circ f)(x)=f(f(x))=f(ax+b)$<br>$=a(ax+b)+b$<br>$=a^{2}x+ab+b$<br>$(f\\circ f)(x)=4x+3$이므로 $a^{2}x+ab+b=4x+3$<br>$\\therefore \\;a^{2}=4$, $ab+b=3$<br>$a^{2}=4$에서 $a=2(\\because \\;a>0)$<br>$ab+b=3$에 $a=2$를 대입하면<br>$2b+b=3\\therefore \\;b=1$<br>따라서 $f(x)=2x+1$이므로<br>$f(3)=2\\times 3+1=7$", "k": "c5", "c": ["$7$", "$9$", "$11$", "$13$", "$15$"], "a": "$7$", "q": "함수 $f(x)=ax+b(a>0)$에 대하여 $(f\\circ f)(x)=4x+3$일 때, $f(3)$의 값은? (단, $a$, $b$는 상수이다.)", "key": "T08-08"}, "x08x21-066": {"id": "x08x21-066", "unit": "08", "theme": "08", "벌": "X08x21", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "$g(x)=(f\\circ f)(x)=f(f(x))$<br>$=f(-3x+k)$<br>$=-3(-3x+k)+k$<br>$=9x-2k$<br>함수 $g(x)$는 $x$의 값이 증가하면 $g(x)$의 값도 증가하므로<br>$-1\\le x\\le 1$일 때 $x=-1$에서 최솟값, $x=1$에서 최댓값을 갖는다.<br>이때 최댓값이 $3$이므로 $g(1)=3$<br>$9-2k=3\\therefore \\;k=3$<br>따라서 $g(x)=9x-6$이므로 구하는 최솟값은<br>$g(-1)=-9-6=-15$", "k": "c5", "c": ["$-21$", "$-18$", "$-15$", "$-12$", "$-9$"], "a": "$-15$", "q": "함수 $f(x)=-3x+k$에 대하여 함수 $g(x)$를 $g(x)=(f\\circ f)(x)$라 하자. $-1\\le x\\le 1$에서 함수 $g(x)$의 최댓값이 $3$일 때, $g(x)$의 최솟값은? (단, $k$는 상수이다.)", "key": "T08-08"}, "x08x21-067": {"id": "x08x21-067", "unit": "08", "theme": "08", "벌": "X08x21", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "$(f\\circ h)(x)=g(x)$이므로 $f(h(x))=g(x)$<br>$-2h(x)+1=4x^{2}+3$, $-2h(x)=4x^{2}+2$<br>$\\therefore \\;h(x)=-2x^{2}-1$", "k": "c5", "c": ["$h(x)=-2x^{2}-3$", "$h(x)=-2x^{2}-1$", "$h(x)=-2x^{2}+1$", "$h(x)=2x^{2}-1$", "$h(x)=2x^{2}+1$"], "a": "$h(x)=-2x^{2}-1$", "q": "두 함수 $f(x)=-2x+1$, $g(x)=4x^{2}+3$에 대하여 $(f\\circ h)(x)=g(x)$를 만족시키는 함수 $h(x)$는?", "key": "T08-08"}, "x08x31-102": {"id": "x08x31-102", "unit": "08", "theme": "08", "벌": "X08x31", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$(f\\circ g)(x)=f(g(x))=a(-x-2)+1=-ax-2a+1$<br>$(g\\circ f)(x)=g(f(x))=-(ax+1)-2=-ax-3$<br>$f\\circ g=g\\circ f$에서 $-ax-2a+1=-ax-3$<br>$-2a=-4\\therefore \\;a=2$", "k": "c5", "c": ["$1$", "$2$", "$3$", "$4$", "$5$"], "a": "$2$", "q": "두 함수 $f(x)=ax+1,\\;g(x)=-x-2$에 대하여 $f\\circ g=g\\circ f$가 항상 성립할 때, 상수 $a$의 값은?", "key": "T08-08"}, "x08x31-105": {"id": "x08x31-105", "unit": "08", "theme": "08", "벌": "X08x31", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(2)=3$이므로 $2+a=3\\therefore \\;a=1$<br>또 $(f\\circ g)(x)=f(g(x))=bx+c+1$에서 $bx+c+1=4x-2$이므로<br>$b=4,\\;c+1=-2$<br>$\\therefore \\;b=4,\\;c=-3$<br>$\\therefore \\;abc=-12$", "k": "num", "a": "-12", "q": "두 함수 $f(x)=x+a,\\;g(x)=bx+c$에 대하여 $(f\\circ g)(x)=4x-2$이고 $f(2)=3$일 때, $abc$의 값을 구하시오.<br>(단, $a,\\;b,\\;c$는 상수이다.)", "key": "T08-08"}, "x08x31-107": {"id": "x08x31-107", "unit": "08", "theme": "08", "벌": "X08x31", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$(g\\circ f)(x)$가 항등함수이므로<br>$(g\\circ f)(1)=1,\\;(g\\circ f)(2)=2$<br>$f(1)=a-2a=-a$이므로<br>$(g\\circ f)(1)=g(f(1))=g(-a)=1$<br>$\\therefore \\;a^{2}-2a+b-1=0\\cdots \\cdots $ ㉠<br>$f(2)=2a-2a=0$이므로<br>$(g\\circ f)(2)=g(f(2))=g(0)=2$<br>$\\therefore \\;b=2$<br>㉠에 $b=2$를 대입하면 $a^{2}-2a+1=0$<br>$(a-1)^{2}=0\\therefore \\;a=1$<br>$\\therefore \\;a+b=3$", "k": "num", "a": "3", "q": "집합 $X=\\left\\{1,\\;2\\right\\}$를 정의역으로 하는 함수 $f(x)=ax-2a$와 함수 $f(x)$의 치역을 정의역으로 하고 집합 $X$를 공역으로 하는 함수 $g(x)=x^{2}+2x+b$가 있다. $X$에서 $X$로의 함수 $(g\\circ f)(x)$가 항등함수일 때, 상수 $a,\\;b$에 대하여 $a+b$의 값을 구하시오.", "key": "T08-08"}, "x08x48-045": {"id": "x08x48-045", "unit": "08", "theme": "08", "벌": "X08x48", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "$f^{1}(2)=f(2)=2-1=1$<br>$f^{2}(2)=f(f(2))=f(1)=3$<br>$f^{3}(2)=f(f^{2}(2))=f(3)=3-1=2$<br>$f^{4}(2)=f(f^{3}(2))=f(2)=2-1=1$<br> $\\vdots $<br>$f^{n}(2)$의 값은 $1,\\;3,\\;2$가 이 순서대로 반복되므로<br>$f^{1}(2)+f^{2}(2)+f^{3}(2)+\\,\\cdots \\,+f^{15}(2)$<br>$=5(1+3+2)=30$", "k": "num", "a": "30", "q": "집합 $X=\\left\\{1,\\;2,\\;3\\right\\}$에 대하여 $X$에서 $X$로의 함수 $f$가<br> $f(x)={\\begin{cases}3 & \\;(x=1) \\\\ x-1 & \\;(x\\ge 2)\\end{cases}}$<br>이고 $f^{1}=f,\\;f^{n+1}=f\\circ f^{n}$($n$은 자연수)이라 할 때, $f^{1}(2)+f^{2}(2)+f^{3}(2)+\\,\\cdots \\,+f^{15}(2)$의 값을 구하시오.", "key": "T08-08"}, "x08x48-046": {"id": "x08x48-046", "unit": "08", "theme": "08", "벌": "X08x48", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "$(f\\circ g)(x)=f(g(x))=f(2x-1)$<br>$a(2x-1)+3=2ax-a+3$<br>$(g\\circ f)(x)=g(f(x))=g(ax+3)$<br>$=2(ax+3)-1=2ax+5$<br>이때 $f\\circ g=g\\circ f$에서 $2ax-a+3=2ax+5$<br>즉, $-a+3=5$이므로 $a=-2$", "k": "num", "a": "-2", "q": "두 함수 $f(x)=ax+3,\\;g(x)=2x-1$에 대하여<br> $f\\circ g=g\\circ f$일 때, 상수 $a$의 값을 구하시오.", "key": "T08-08"}, "x08x48-047": {"id": "x08x48-047", "unit": "08", "theme": "08", "벌": "X08x48", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "$(f\\circ f)(x)=f(f(x))=f(ax+b)$<br>$=a(ax+b)+b=a^{2}x+ab+b$<br>즉,  $a^{2}x+ab+b=9x-8$이므로<br>$a^{2}=9$에서 $a=3\\;(\\because \\;a>0)$<br>이를 $ab+b=-8$에 대입하면<br>$4b=-8\\;\\therefore \\;b=-2$<br>$\\therefore \\;a+b=3+(-2)=1$", "k": "c5", "c": ["$-2$", "$-1$", "$0$", "$1$", "$2$"], "a": "$1$", "q": "함수 $f(x)=ax+b$에 대하여 $(f\\circ f)(x)=9x-8$일 때, 상수 $a,\\;b$에 대하여 $a+b$의 값은? (단, $a>0$)", "key": "T08-08"}, "x08x48-048": {"id": "x08x48-048", "unit": "08", "theme": "08", "벌": "X08x48", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "$(f\\circ g)(x)=f(g(x))=f(ax+2)$<br>$=ax+2-1=ax+1$<br>이때 $(f\\circ g)(2)=5$에서<br>$2a+1=5\\;\\therefore \\;a=2$<br>따라서 $g(x)=2x+2$이므로<br>$(g\\circ f)(2)=g(f(2))=g(1)=4$", "k": "c5", "c": ["$-4$", "$-2$", "$0$", "$2$", "$4$"], "a": "$4$", "q": "두 함수 $f(x)=x-1,\\;g(x)=ax+2$에 대하여<br> $(f\\circ g)(2)=5$일 때, $(g\\circ f)(2)$의 값은? (단, $a$는 상수)", "key": "T08-08"}, "x08x48-049": {"id": "x08x48-049", "unit": "08", "theme": "08", "벌": "X08x48", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "$g(x)=ax+b\\;(a\\ne 0)$라 하면<br>$(f\\circ g)(x)=f(g(x))=f(ax+b)$<br>$=3(ax+b)-2=3ax+3b-2$<br>$(g\\circ f)(x)=g(f(x))=g(3x-2)$<br>$=a(3x-2)+b=3ax-2a+b$<br>이때 $f\\circ g=g\\circ f$에서 $3ax+3b-2=3ax-2a+b$<br>즉, $3b-2=-2a+b$이므로 $a+b=1\\cdots \\cdots $㉠<br>한편 $g(2)=-1$에서 $2a+b=-1\\cdots \\cdots $㉡<br>㉠, ㉡을 연립하여 풀면 $a=-2,\\;b=3$<br>따라서 $g(x)=-2x+3$이므로<br>$g(-1)=2+3=5$", "k": "num", "a": "5", "q": "함수 $f(x)=3x-2$와 일차함수 $g(x)$에 대하여 $f\\circ g=g\\circ f$이고 $g(2)=-1$일 때, $g(-1)$의 값을 구하시오.", "key": "T08-08"}, "x08x48-050": {"id": "x08x48-050", "unit": "08", "theme": "08", "벌": "X08x48", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "$(f\\circ h)(x)=f(h(x))=h(x)-1$<br>이때 $f\\circ h=g$에서 $h(x)-1=-x+2$<br>$\\therefore \\;h(x)=-x+3$", "k": "c5", "c": ["$h(x)=-x-3$", "$h(x)=-x+3$", "$h(x)=x-3$", "$h(x)=x+3$", "$h(x)=3x$"], "a": "$h(x)=-x+3$", "q": "두 함수 $f(x)=x-1,\\;g(x)=-x+2$에 대하여 $f\\circ h=g$를 만족시키는 함수 $h(x)$는?", "key": "T08-08"}, "x08x48-052": {"id": "x08x48-052", "unit": "08", "theme": "08", "벌": "X08x48", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "$h(f(x))=g(x)$이므로<br>$h(2x+4)=3x-2$<br>$2x+4=-2$에서 $x=-3$<br>$\\therefore \\;h(-2)=-9-2=-11$", "k": "num", "a": "-11", "q": "두 함수 $f(x)=2x+4,\\;g(x)=3x-2$와 함수 $h$에 대하여 $h\\circ f=g$일 때, $h(-2)$의 값을 구하시오.", "key": "T08-08"}, "x08x69-061": {"id": "x08x69-061", "unit": "08", "theme": "08", "벌": "X08x69", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "$f^{2}(x)$를 구하면 $f^{2}(x)=(f\\circ f^{1})(x)=f(f(x))=f(x-2)$<br>$=(x-2)-2=x-2\\times 2$<br>$f^{3}(x)$를 구하면 $f^{3}(x)=(f\\circ f^{2})(x)=f(f^{2}(x))=f(x-2\\times 2)$<br>$(x-2\\times 2)-2=x-2\\times 3$<br>$f^{4}(x)$를 구하면 $f^{4}(x)=(f\\circ f^{3})(x)=f(f^{3}(x))=f(x-2\\times 3)$<br>$=(x-2\\times 3)-2=x-2\\times 4$<br>$\\vdots $<br>$f^{n}(x)$를 구하면 $f^{n}(x)=x-2n$<br>$f^{60}(x)$를 구하면 $f^{60}(x)=x-2\\times 60=x-120$<br>따라서 구하는 함숫값은 $f^{60}(100)=100-120=-20$", "k": "num", "a": "-20", "q": "함수 $f(x)=x-2$에 대하여 $f^{1}=f,\\;f^{n+1}=f\\circ f^{n}$ ($n$은 자연수) 이라 할 때, $f^{60}(100)$의 값을 구하시오.", "key": "T08-08"}, "x08x69-062": {"id": "x08x69-062", "unit": "08", "theme": "08", "벌": "X08x69", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "$f(x)=2x$에서<br>$f^{2}(x)=(f\\circ f^{1})(x)=f(f(x))$<br>$=f(2x)=2\\times 2x=2^{2}x$<br>$f^{3}(x)=(f\\circ f^{2})(x)=f(f^{2}(x))$<br>$=f(2^{2}\\,x)=2\\times 2^{2}x=2^{3}x$<br>$f^{4}(x)=(f\\circ f^{3})(x)=f(f^{3}(x))$<br>$=f(2^{3}x)=2\\times 2^{3}x=2^{4}x$<br>$\\vdots $<br>$\\therefore \\;f^{n}(x)=2^{n}x$<br>따라서 $f^{7}(x)=2^{7}x$이므로 $f^{7}\\left(\\dfrac{1}{2}\\right)=2^{7}\\times \\dfrac{1}{2}=64$", "k": "num", "a": "64", "q": "함수 $f(x)=2x$에 대하여 $f^{1}=f,\\;f^{n+1}=f\\circ f^{n}$ ($n$은 자연수)이라 할 때, $f^{7}\\left(\\dfrac{1}{2}\\right)$의 값을 구하시오.", "key": "T08-08"}, "x08x69-066": {"id": "x08x69-066", "unit": "08", "theme": "08", "벌": "X08x69", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "$(f\\circ g)(x)=f(g(x))=f(3x+a)$<br>$=2(3x+a)-1=6x+2a-1$<br>$(g\\circ f)(x)=g(f(x))=g(2x-1)$<br>$=3(2x-1)+a=6x+a-3$<br>$f\\circ g=g\\circ f$에서 $6x+2a-1=6x+a-3$<br>즉, $2a-1=a-3$이므로 $a=-2$", "k": "num", "a": "-2", "q": "두 함수 $f(x)=2x-1,\\;g(x)=3x+a$에 대하여 $f\\circ g=g\\circ f$일 때, 상수 $a$의 값을 구하시오.", "key": "T08-08"}, "x08x69-067": {"id": "x08x69-067", "unit": "08", "theme": "08", "벌": "X08x69", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "$(g\\circ f)(x)=g(f(x))=g(ax+b)$<br>$=ax+b\\,+c$<br>즉, $ax+b+c=3x-2$이므로<br>$a=3,\\;b+c=-2\\cdots \\cdots $ ㉠<br>따라서 $f(x)=3x+b$이므로 $f(1)=2$에서<br>$3+b=2\\;\\therefore \\;b=-1$<br>이를 ㉠에 대입하면 $c=-1$<br>$\\therefore \\;a-b+c=3-(-1)+(-1)=3$", "k": "num", "a": "3", "q": "두 함수 $f(x)=ax+b,\\;g(x)=x+c$에 대하여 $f(1)=2$이고 $(g\\circ f)(x)=3x-2$일 때, 상수 $a,\\;b,\\;c$에 대하여 $a-b+c$의 값을 구하시오.", "key": "T08-08"}, "x08x69-068": {"id": "x08x69-068", "unit": "08", "theme": "08", "벌": "X08x69", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "$(f\\circ f)(x)=f(f(x))=f(ax+b)$<br>$=a(ax+b)+b=a^{2}x+b(a+1)$<br>이때 $f\\circ f=f$이므로 $a^{2}x+b(a+1)=ax+b$<br>$\\therefore \\;a^{2}=a,\\;b(a+1)=b$<br>$a^{2}=a$에서 $a(a-1)=0\\therefore \\;a=0$ 또는 $a=1$<br>그런데 $f(x)=ax+b$가 일차함수이므로 $a=1$<br>이를 $b(a+1)=b$에 대입하면<br>$2b=b\\;\\therefore \\;b=0$<br>$\\therefore \\;a-b=1-0=1$", "k": "num", "a": "1", "q": "일차함수 $f(x)=ax+b$에 대하여 $f\\circ f=f$일 때, 상수 $a,\\;b$에 대하여 $a-b$의 값을 구하시오.", "key": "T08-08"}, "x08x21-075": {"id": "x08x21-075", "unit": "08", "theme": "10", "벌": "X08x21", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "$f(1)=7$이므로<br>$a+b=7\\cdots \\cdots $㉠<br>$f^{-1}(10)=4$에서 $f(4)=10$이므로<br>$4a+b=10\\cdots \\cdots $㉡<br>㉠, ㉡을 연립하여 풀면 $a=1$, $b=6$<br>$\\therefore \\;ab=6$", "k": "num", "a": "6", "q": "실수 전체의 집합에서 정의된 함수 $f(x)=ax+b$에 대하여 $f(1)=7$, $f^{-1}(10)=4$일 때, $ab$의 값을 구하시오.<br>(단, $a$, $b$는 상수이다.)", "key": "T08-10"}, "x08x21-076": {"id": "x08x21-076", "unit": "08", "theme": "10", "벌": "X08x21", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "$f(x)=ax^{2}+bx+c$ ($a$, $b$, $c$는 상수, $a\\ne 0$)라 하면<br>$f(0)=0$에서 $c=0$<br>$\\therefore \\;f(x)=ax^{2}+bx$<br>$f^{-1}(3)=1$에서 $f(1)=3$이므로<br>$a+b=3\\cdots \\cdots $㉠<br>$f^{-1}(8)=4$에서 $f(4)=8$이므로<br>$16a+4b=8\\therefore \\;4a+b=2\\cdots \\cdots $㉡<br>㉠, ㉡을 연립하여 풀면 $a=-\\dfrac{1}{3}$, $b=\\dfrac{10}{3}$<br>따라서 $f(x)=-\\dfrac{1}{3}x^{2}+\\dfrac{10}{3}x$이므로<br>$f(-6)=-\\dfrac{1}{3}\\times (-6)^{2}+\\dfrac{10}{3}\\times (-6)=-32$", "k": "c5", "c": ["$-20$", "$-24$", "$-28$", "$-32$", "$-36$"], "a": "$-32$", "q": "정의역이 $\\{x\\,\\left|\\,x\\le 5\\right\\}$인 이차함수 $f(x)$에 대하여 $f(0)=0$, $f^{-1}(3)=1$, $f^{-1}(8)=4$일 때, $f(-6)$의 값은?", "key": "T08-10"}, "x08x21-080": {"id": "x08x21-080", "unit": "08", "theme": "10", "벌": "X08x21", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "함수 $f$의 역함수가 존재하려면 $f$는 일대일대응이어야 한다.<br>따라서 역함수가 존재하는 함수는 ④이다.", "k": "c5", "c": ["$f(x)=-2$", "$f(x)=x^{2}$", "$f(x)=|\\,x\\,|$", "$f(x)=-\\dfrac{2}{3}x+6$", "$f(x)={\\begin{cases}0 & \\;(x<0) \\\\ 1 & \\;(x\\ge 0)\\end{cases}}$"], "a": "$f(x)=-\\dfrac{2}{3}x+6$", "q": "다음 중 역함수가 존재하는 함수는?<br>(단, 정의역과 공역은 모두 실수 전체의 집합이다.)", "key": "T08-10"}, "x08x21-081": {"id": "x08x21-081", "unit": "08", "theme": "10", "벌": "X08x21", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "$f(x)=-x^{2}+8x+a=-(x-4)^{2}+a+16$<br>함수 $f(x)$의 역함수가 존재하려면 $f(x)$는 일대일대응이어야 한다.<br>이때 $y=f(x)$의 그래프의 축의 방정식이 $x=4$이므로 $x\\le 3$에서 $x$의 값이 증가할 때 $y$의 값도 증가한다.<br>따라서 함수 $f(x)$는 일대일함수이고 치역과 공역이 같아야 하므로<br>$f(3)=3$, $a+15=3$<br>$\\therefore \\;a=-12$", "k": "num", "a": "-12", "q": "집합 $X=\\{x\\,\\left|\\,x\\le 3\\right\\}$에 대하여 $X$에서 $X$로의 함수 $f(x)=-x^{2}+8x+a$가 역함수를 갖도록 하는 상수 $a$의 값을 구하시오.", "key": "T08-10"}, "x08x21-082": {"id": "x08x21-082", "unit": "08", "theme": "10", "벌": "X08x21", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "$f(x)=2x-3+a|\\,x-2\\,|$에서<br>(ⅰ) $x\\ge 2$일 때, $x-2\\ge 0$이므로<br>$f(x)=2x-3+a(x-2)=(2+a)x-2a-3$<br>(ⅱ) $x<2$일 때, $x-2<0$이므로<br>$f(x)=2x-3-a(x-2)=(2-a)x+2a-3$<br>(ⅰ), (ⅱ)에서 함수 $f(x)$의 역함수가 존재하려면 $f(x)$가 일대일대응이어야 하므로 $x\\ge 2$일 때와 $x<2$일 때의 직선의 기울기의 부호가 서로 같아야 한다.<br>즉 $(2+a)(2-a)>0$이므로<br>$(a+2)(a-2)<0\\therefore \\;-2<a<2$<br>따라서 정수 $a$의 최댓값은 $1$이다.", "k": "num", "a": "1", "q": "실수 전체의 집합에서 정의된 함수<br> $f(x)=2x-3+a|\\,x-2\\,|$<br>이 역함수가 존재하도록 하는 정수 $a$의 최댓값을 구하시오.", "key": "T08-10"}, "x08x21-088": {"id": "x08x21-088", "unit": "08", "theme": "10", "벌": "X08x21", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "$(f\\circ f)(x)=x$에서 $f=f^{-1}$이므로<br>$f^{-1}(2)=f(2)=-1$<br>또 $(f\\circ f)(2)=f(f(2))=2$에서 $f(-1)=2$이므로<br>$f^{-1}(2)+f(-1)=-1+2=1$", "k": "num", "a": "1", "q": "함수 $f(x)$의 역함수 $f^{-1}(x)$가 존재하고 $(f\\circ f)(x)=x$, $f(2)=-1$일 때, $f^{-1}(2)+f(-1)$의 값을 구하시오.", "key": "T08-10"}, "x08x31-125": {"id": "x08x31-125", "unit": "08", "theme": "10", "벌": "X08x31", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f^{-1}(4)=2$이므로 $f(2)=4$<br>$2a+b=4\\cdots \\cdots $㉠<br>$f^{-1}(-5)=-1$이므로 $f(-1)=-5$<br>$-a+b=-5\\cdots \\cdots $㉡<br>㉠, ㉡을 연립하여 풀면 $a=3,\\;b=-2$<br>$\\therefore \\;a^{2}+b^{2}=13$", "k": "num", "a": "13", "q": "실수 전체의 집합에서 정의된 함수 $f(x)=ax+b$에 대하여 $f^{-1}(4)=2,\\;f^{-1}(-5)=-1$일 때, $a^{2}+b^{2}$의 값을 구하시오.<br>(단, $a,\\;b$는 상수이다.)", "key": "T08-10"}, "x08x31-126": {"id": "x08x31-126", "unit": "08", "theme": "10", "벌": "X08x31", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(x)=ax^{2}+bx+c$ ($a\\ne 0,\\;a,\\;b,\\;c$는 상수)라 하면<br>$f(0)=0$에서 $c=0$ <br>$\\therefore \\;f(x)=ax^{2}+bx$<br>$f^{-1}(-10)=-2$이므로 $f(-2)=-10$이므로<br>$4a-2b=-10\\therefore \\;2a-b=-5\\cdots \\cdots $㉠<br>$f^{-1}(32)=4$이므로 $f(4)=32$이므로<br>$16a+4b=32\\therefore \\;4a+b=8\\cdots \\cdots $㉡<br>㉠, ㉡을 연립하여 풀면 $a=\\dfrac{1}{2},\\;b=6$<br>따라서 $f(x)=\\dfrac{1}{2}x^{2}+6x$이므로<br>$f(2)=14$", "k": "c5", "c": ["$6$", "$10$", "$14$", "$18$", "$22$"], "a": "$14$", "q": "정의역이 $\\left\\{x\\,|\\,x\\ge -6\\right\\}$인 이차함수 $f(x)$에 대하여 $f(0)=0,\\;f^{-1}(-10)=-2,\\;f^{-1}(32)=4$일 때, $f(2)$의 값은?", "key": "T08-10"}, "x08x31-127": {"id": "x08x31-127", "unit": "08", "theme": "10", "벌": "X08x31", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(x)=ax+b$($a\\ne 0,\\;a,\\;b$는 상수)라 하면<br>$f^{-1}(3)=2$에서 $f(2)=3$이므로<br>$2a+b=3\\cdots \\cdots $ ㉠<br>$(f\\circ f)(2)=f(f(2))=f(3)$이므로 $f(3)=2$<br>$\\therefore \\;3a+b=2\\cdots \\cdots $ ㉡<br>㉠, ㉡을 연립하여 풀면 $a=-1,\\;b=5$<br>따라서 $f(x)=-x+5$이므로 $f(1)=4$<br>한편 $f^{-1}(6)=k$라 하면 $f(k)=6$이므로<br>$-k+5=6\\therefore \\;k=-1$<br>$\\therefore \\;f(1)+f^{-1}(6)=4+(-1)=3$", "k": "num", "a": "3", "q": "실수 전체의 집합에서 정의된 일차함수 $f(x)$에 대하여 $f^{-1}(3)=2,\\;(f\\circ f)(2)=2$일 때, $f(1)+f^{-1}(6)$의 값을 구하시오.", "key": "T08-10"}, "x08x31-128": {"id": "x08x31-128", "unit": "08", "theme": "10", "벌": "X08x31", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$\\dfrac{3-x}{2}=t$로 놓으면 $3-x=2t\\therefore \\;x=-2t+3$<br>따라서 $f(t)=4(-2t+3)+1=-8t+13$이므로<br>$f(x)=-8x+13$<br>$f^{-1}(-3)=k$라 하면 $f(k)=-3$이므로<br>$-8k+13=-3\\therefore \\;k=2$<br>$\\therefore \\;f^{-1}(-3)=2$", "k": "num", "a": "2", "q": "함수 $f\\left(\\dfrac{3-x}{2}\\right)=4x+1$에 대하여 $f^{-1}(-3)$의 값을 구하시오.", "key": "T08-10"}, "x08x31-129": {"id": "x08x31-129", "unit": "08", "theme": "10", "벌": "X08x31", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$x<5$일 때, $f(x)=x+3<8$<br>$x\\ge 5$일 때, $f(x)=2x-2\\ge 8$<br>$f^{-1}(6)=m$이라 하면 $f(m)=6$이므로<br>$m+3=6\\therefore \\;m=3$<br>$f^{-1}(12)=n$이라 하면 $f(n)=12$이므로<br>$2n-2=12\\therefore \\;n=7$<br>$\\therefore \\;f^{-1}(6)+f^{-1}(12)=3+7=10$", "k": "c5", "c": ["$9$", "$10$", "$11$", "$12$", "$13$"], "a": "$10$", "q": "함수 $f(x)={\\begin{cases}\\,x+3 &  &  & (x<5) \\\\ \\,2x-2 &  &  & (x\\ge 5)\\end{cases}}$에 대하여 $f^{-1}(6)+f^{-1}(12)$의 값은?", "key": "T08-10"}, "x08x31-130": {"id": "x08x31-130", "unit": "08", "theme": "10", "벌": "X08x31", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "함수 $f$의 역함수가 존재하면 $f$는 일대일대응이다.<br>$y=f(x)$의 그래프의 기울기가 양수이므로<br>$f(2)=a,\\;f(6)=b$<br>이때 $f(2)=4,\\;f(6)=16$이므로<br>$a=4,\\;b=16\\therefore \\;a+b=20$", "k": "c5", "c": ["$12$", "$16$", "$20$", "$24$", "$28$"], "a": "$20$", "q": "두 집합 $X=\\left\\{x\\,|\\,2\\le x\\le 6\\right\\},\\;Y=\\left\\{y\\,|\\,a\\le y\\le b\\right\\}$에 대하여 $X$에서 $Y$로의 함수 $f(x)=3x-2$의 역함수가 존재할 때, $a+b$의 값은? (단, $a,\\;b$는 상수이다.)", "key": "T08-10"}, "x08x31-131": {"id": "x08x31-131", "unit": "08", "theme": "10", "벌": "X08x31", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(x)=x^{2}-2x-40=(x-1)^{2}-41$이고, 함수 $f$의 역함수가 존재하면 $f$는 일대일대응이므로<br>$a\\ge 1,\\;f(a)=a$<br>$f(a)=a$에서 $a^{2}-2a-40=a$<br>$a^{2}-3a-40=0$,  $(a+5)(a-8)=0$<br>$\\therefore \\;a=8\\;(\\because \\;a\\ge 1)$", "k": "num", "a": "8", "q": "집합 $X=\\left\\{x\\,|\\,x\\ge a\\right\\}$에 대하여 $X$에서 $X$로의 함수 $f(x)=x^{2}-2x-40$의 역함수가 존재할 때, 상수 $a$의 값을 구하시오.", "key": "T08-10"}, "x08x31-134": {"id": "x08x31-134", "unit": "08", "theme": "10", "벌": "X08x31", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "함수 $f$의 역함수가 존재하면 $f$는 일대일대응이므로<br>$3+a=3\\cdot 3-1\\therefore a=5$<br>$x<3$일 때, $f(x)=x+5<8$<br>$x\\ge 3$일 때, $f(x)=3x-1\\ge 8$<br>$f^{-1}(11)=m$라 하면 $f(m)=11$이므로<br>$3m-1=11\\therefore \\;m=4$<br>$f^{-1}(4)=n$이라 하면 $f(n)=4$이므로<br>$n+5=4\\therefore \\;n=-1$<br>$\\therefore \\;(f^{-1}\\circ f^{-1})(11)=f^{-1}(f^{-1}(11))$<br>$=f^{-1}(4)=-1$", "k": "c5", "c": ["$-5$", "$-4$", "$-3$", "$-2$", "$-1$"], "a": "$-1$", "q": "실수 전체의 집합에서 정의된 함수<br> $f(x)={\\begin{cases}\\,x+a &  &  & (x<3) \\\\ \\,3x-1 &  &  & (x\\ge 3)\\end{cases}}$<br>의 역함수가 존재할 때, $(f^{-1}\\circ f^{-1})(11)$의 값은?<br>(단, $a$는 상수이다.)", "key": "T08-10"}, "x08x40-090": {"id": "x08x40-090", "unit": "08", "theme": "10", "벌": "X08x40", "lvl": 2, "fix": true, "src": "문제집 고쟁이", "w": "$f(4x-3-2g(x))=x$에서 $f^{-1}(x)=4x-3-2g(x)$이고,<br>$f^{-1}(x)=g(x)$이므로 $3g(x)=4x-3$<br>$\\therefore \\;g(x)=\\dfrac{4}{3}x-1$<br>방정식 $f(x)g(x)=0$에서 $f(x)=0$ 또는 $g(x)=0$<br>(ⅰ) 방정식 $f(x)=0$의 실근을 $\\alpha $라 하면<br>$f(\\alpha )=0$이므로 $g(0)=\\alpha $에서 $\\alpha =-1$<br>(ⅱ) 방정식 $g(x)=\\dfrac{4}{3}x-1=0$의 실근은 $x=\\dfrac{3}{4}$<br>따라서 구하는 모든 실근의 합은<br>$(-1)+\\dfrac{3}{4}=-\\dfrac{1}{4}$", "k": "c5", "c": ["$-\\dfrac{3}{4}$", "$-\\dfrac{1}{4}$", "$\\dfrac{1}{4}$", "$\\dfrac{3}{4}$", "$\\dfrac{5}{4}$"], "a": "$-\\dfrac{1}{4}$", "q": "함수 $f(x)$의 역함수 $g(x)$에 대하여 $f(4x-3-2g(x))=x$일 때, 방정식 $f(x)g(x)=0$의 모든 실근의 합은?", "key": "T08-10"}, "x08x40-095": {"id": "x08x40-095", "unit": "08", "theme": "10", "벌": "X08x40", "lvl": 2, "fix": true, "src": "문제집 고쟁이", "w": "조건 (가)에서 함수 $f$는 일대일대응이고<br>조건 (나)에서 $x=3$을 대입하면<br>$f(f(3))-f^{-1}(3)=-6$이고<br>$f^{-1}(3)=7,\\;f(f(3))=1$이다.  $\\cdots \\cdots $㉠<br>즉, $f(7)=3$이다.<br>조건 (나)에서 $x=2$를 대입하면<br>$f(f(2))-f^{-1}(2)=-4$이고 ㉠이므로<br>$f^{-1}(2)=6,\\;f(f(2))=2$이다.  $\\cdots \\cdots $㉡<br>즉, $f(6)=2$이다.<br>또한 $f(f(2))=2$에서 $f(2)=6$이다.<br>조건 (나)에서 $x=1$을 대입하면<br>$f(f(1))-f^{-1}(1)=-2$이고 ㉠, ㉡이므로<br>$f^{-1}(1)=5,\\;f(f(1))=3$이다.<br>즉, $f(5)=1$이다.<br>또한 $f(f(1))=3$에서 $f(1)=7\\,(∵\\,f(7)=3)$이고<br>$f(f(3))=1$에서 $f(3)=5\\,(∵\\,f(5)=1)$이다.<br>따라서 $f(1)=7,\\;f(2)=6,\\;f(3)=5,\\;f(5)=1,\\;f(6)=2,\\;f(7)=3$이고 함수 $f$가 일대일대응이므로 $f(4)=4$이다.<br>$∴\\;f(1)+2f^{-1}(4)+3f(4)=7+2\\times 4+3\\times 4=27$", "k": "c5", "c": ["$23$", "$24$", "$25$", "$26$", "$27$"], "a": "$27$", "q": "집합 $X=\\left\\{1,\\;2,\\;3,\\;4,\\;5,\\;6,\\;7\\right\\}$에 대하여 함수 $f\\,:\\,X\\;\\to \\;X$가 다음 조건을 만족시킬 때, $f(1)+2f^{-1}(4)+3f(4)$의 값은?<br>(가) 집합 $X$의 임의의 두 원소 $x_{1},\\;x_{2}$에 대하여 $x_{1}\\ne x_{2}$이면 $f(x_{1})\\ne f(x_{2})$이다.<br>(나) $1\\le x\\le 3$일 때, $(f\\circ f)(x)-f^{-1}(x)=-2x$이다.", "key": "T08-10"}, "x08x48-057": {"id": "x08x48-057", "unit": "08", "theme": "10", "벌": "X08x48", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "$f^{-1}(3)=-1$에서 $f(-1)=3$이므로<br>$-a+b=3\\cdots \\cdots $ ㉠<br>$f^{-1}(6)=2$에서 $f(2)=6$이므로<br>$2a+b=6\\cdots \\cdots $ ㉡<br>㉠, ㉡을 연립하여 풀면 $a=1,\\;b=4$<br>$\\therefore \\;ab=1\\times 4=4$", "k": "num", "a": "4", "q": "함수 $f(x)=ax+b$에 대하여 $f^{-1}(3)=-1,\\;f^{-1}(6)=2$일 때, 상수 $a,\\;b$에 대하여 $ab$의 값을 구하시오.", "key": "T08-10"}, "x08x48-061": {"id": "x08x48-061", "unit": "08", "theme": "10", "벌": "X08x48", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "$f^{-1}(4)=2$에서 $f(2)=4$<br>함수 $f$는 일대일대응이므로 $f(4)=3$<br>$(f\\circ f)(4)=f(f(4))=f(3)=1$<br>$(f\\circ f\\circ f)(1)=f(f(f(1)))=f(f(2))=f(4)=3$<br>$\\therefore \\;(f\\circ f)(4)+(f\\circ f\\circ f)(1)=1+3=4$", "k": "c5", "c": ["$2$", "$3$", "$4$", "$5$", "$6$"], "a": "$4$", "q": "집합 $X=\\left\\{1,\\;2,\\;3,\\;4\\right\\}$에 대하여 함수 $f\\,:\\,X\\;\\rightarrow \\;X$는 일대일대응이고 $f(1)=2,\\;f(3)=1,\\;f^{-1}(4)=2$일 때, $(f\\circ f)(4)+(f\\circ f\\circ f)(1)$의 값은?", "key": "T08-10"}, "x08x69-095": {"id": "x08x69-095", "unit": "08", "theme": "10", "벌": "X08x69", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "$f^{-1}(8)=k$ ($k$는 상수)라 하면 $f(k)=8$이므로<br>$-5k+3=8\\;\\therefore \\;k=-1$<br>$\\therefore \\;f^{-1}(8)=-1$", "k": "num", "a": "-1", "q": "함수 $f(x)=-5x+3$에 대하여 $f^{-1}(8)$의 값을 구하시오.", "key": "T08-10"}, "x08x69-099": {"id": "x08x69-099", "unit": "08", "theme": "10", "벌": "X08x69", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "함수 $f$의 역함수가 존재하려면 함수 $f$는 일대일대응이어야 한다.<br>직선 $y=f(x)$의 기울기가 양수이므로 직선 $y=f(x)$가 두 점 $(2,\\;b),\\;(a,\\;3)$을 지나야 한다.<br>$\\therefore \\;f(2)=b,\\;f(a)=3$<br>$f(2)=b$에서 $b=-3$<br>$f(a)=3$에서 $2a-7=3\\;\\therefore \\;a=5$<br>$\\therefore \\;a+b=5+(-3)=2$", "k": "num", "a": "2", "q": "두 집합 $X=\\left\\{x\\,\\left|2\\le x\\le a\\right\\},\\;Y=\\left\\{y\\,\\left|b\\le y\\le 3\\right\\}\\right.\\right.$에 대하여 $X$에서 $Y$로의 함수 $f(x)=2x-7$의 역함수가 존재할 때, 상수 $a,\\;b$에 대하여 $a+b$의 값을 구하시오.", "key": "T08-10"}, "x08x21-083": {"id": "x08x21-083", "unit": "08", "theme": "11", "벌": "X08x21", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "$y=\\dfrac{1}{3}x+a$라 하면<br>$\\dfrac{1}{3}x=y-a\\therefore \\;x=3y-3a$<br>$x$와 $y$를 서로 바꾸면 $y=3x-3a$<br>$\\therefore \\;f^{-1}(x)=3x-3a$<br>따라서 $3x-3a=bx-6$이므로<br>$3=b$, $-3a=-6\\therefore \\;a=2$, $b=3$<br>$\\therefore \\;a+b=5$", "k": "c5", "c": ["$3$", "$4$", "$5$", "$6$", "$7$"], "a": "$5$", "q": "함수 $f(x)=\\dfrac{1}{3}x+a$의 역함수가 $f^{-1}(x)=bx-6$일 때, $a+b$의 값은? (단, $a$, $b$는 상수이다.)", "key": "T08-11"}, "x08x31-135": {"id": "x08x31-135", "unit": "08", "theme": "11", "벌": "X08x31", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$y=ax-6$이라 하면  $ax=y+6$<br>$\\therefore \\;x=\\dfrac{1}{a}y+\\dfrac{6}{a}$<br>$x$와 $y$를 서로 바꾸면 $y=\\dfrac{1}{a}x+\\dfrac{6}{a}$<br>$\\therefore \\;f^{-1}(x)=\\dfrac{1}{a}x+\\dfrac{6}{a}$<br>따라서 $\\dfrac{1}{a}x+\\dfrac{6}{a}=\\dfrac{1}{2}x+b$이므로<br>$\\dfrac{1}{a}=\\dfrac{1}{2},\\;\\dfrac{6}{a}=b\\therefore \\;a=2,\\;b=3$<br>$\\therefore \\;a-b=-1$", "k": "c5", "c": ["$-3$", "$-1$", "$1$", "$3$", "$5$"], "a": "$-1$", "q": "일차함수 $f(x)=ax-6$의 역함수가 $f^{-1}(x)=\\dfrac{1}{2}x+b$일 때, 상수 $a,\\;b$에 대하여 $a-b$의 값은?", "key": "T08-11"}, "x08x48-065": {"id": "x08x48-065", "unit": "08", "theme": "11", "벌": "X08x48", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "$y=-\\dfrac{1}{2}x+3$에서 $x=-2y+6$이므로 역함수는 $y=-2x+6$<br>따라서 $a=-2,\\;b=6$이므로<br>$ab=-12$", "k": "c5", "c": ["$-12$", "$-6$", "$-2$", "$6$", "$12$"], "a": "$-12$", "q": "함수 $y=-\\dfrac{1}{2}x+3$의 역함수가 $y=ax+b$일 때, 상수 $a,\\;b$에 대하여 $ab$의 값은?", "key": "T08-11"}, "x08x48-066": {"id": "x08x48-066", "unit": "08", "theme": "11", "벌": "X08x48", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "$(g\\circ f)(x)=g(f(x))=g(ax+b)$<br>$=2(ax+b)-1$<br>$=2ax+2b-1$<br>$y=2ax+2b-1$이라 하면<br>$2ax=y-2b+1\\therefore \\;x=\\dfrac{1}{2a}y-\\dfrac{2b-1}{2a}$<br>따라서 역함수는 $y=\\dfrac{1}{2a}x-\\dfrac{2b-1}{2a}$<br>즉, $\\dfrac{1}{2a}=-\\dfrac{1}{4},\\;-\\dfrac{2b-1}{2a}=\\dfrac{1}{4}$이므로<br>$2a=-4,\\;2b-1=1\\therefore \\;a=-2,\\;b=1$<br>$\\therefore \\;a+b=-1$", "k": "c5", "c": ["$-2$", "$-1$", "$0$", "$1$", "$2$"], "a": "$-1$", "q": "두 함수 $f(x)=ax+b,\\;g(x)=2x-1$의 합성함수 $(g\\circ f)(x)$의 역함수가 $y=-\\dfrac{1}{4}x+\\dfrac{1}{4}$일 때, 상수 $a,\\;b$에 대하여 $a+b$의 값은? (단, $a\\ne 0$)", "key": "T08-11"}, "x08x48-067": {"id": "x08x48-067", "unit": "08", "theme": "11", "벌": "X08x48", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "$2x+1=t$로 놓으면 $x=\\dfrac{t-1}{2}$<br>$\\therefore \\;f(t)=6\\times \\dfrac{t-1}{2}+12=3t+9$<br>$\\therefore \\;f(x)=3x+9$<br>$y=3x+9$라 하면 $x=\\dfrac{1}{3}y-3$이므로 역함수는<br>$y=\\dfrac{1}{3}x-3$<br>따라서 $f^{\\,-1}(x)=\\dfrac{1}{3}x-3$이므로 $a=\\dfrac{1}{3},\\;b=-3$<br>$\\therefore \\;ab=-1$", "k": "num", "a": "-1", "q": "실수 전체의 집합에서 정의된 함수 $f$에 대하여 $f(2x+1)=6x+12$가 성립할 때, $f^{-1}(x)=ax+b$이다.<br>이때 상수 $a,\\;b$에 대하여 $ab$의 값을 구하시오.", "key": "T08-11"}, "x08x69-102": {"id": "x08x69-102", "unit": "08", "theme": "11", "벌": "X08x69", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "$y=2x+a$라 하고 $x$에 대하여 풀면 $2x=y-a\\;\\therefore \\;x=\\dfrac{1}{2}y-\\dfrac{1}{2}a$<br>$x$와 $y$를 서로 바꾸면 $y=\\dfrac{1}{2}x-\\dfrac{1}{2}a\\;\\therefore \\;f^{-1}(x)=\\dfrac{1}{2}x-\\dfrac{1}{2}a$<br>즉, $\\dfrac{1}{2}x-\\dfrac{1}{2}a=bx+\\dfrac{1}{2}$이므로 $\\dfrac{1}{2}=b,\\;-\\dfrac{1}{2}a=\\dfrac{1}{2}\\;\\therefore \\;a=-1$<br>따라서 구하는 값은 $ab=(-1)\\times \\dfrac{1}{2}=-\\dfrac{1}{2}$", "k": "num", "a": "-1/2", "q": "함수 $f(x)=2x+a$의 역함수가 $f^{-1}(x)=bx+\\dfrac{1}{2}$일 때, 상수 $a,\\;b$에 대하여 $ab$의 값을 구하시오.", "key": "T08-11"}, "x08x69-103": {"id": "x08x69-103", "unit": "08", "theme": "11", "벌": "X08x69", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "$y=-2x+4$를 $x$에 대하여 풀면<br>$2x=-y+4\\;\\therefore \\;x=-\\dfrac{1}{2}y+2$<br>$x$와 $y$를 서로 바꾸면 $y=-\\dfrac{1}{2}x+2$<br>따라서 $a=-\\dfrac{1}{2},\\;b=2$이므로 $ab=-1$", "k": "num", "a": "-1", "q": "함수 $y=-2x+4$의 역함수가 $y=ax+b$일 때, 상수 $a,\\;b$에 대하여 $ab$의 값을 구하시오.", "key": "T08-11"}, "x08x21-091": {"id": "x08x21-091", "unit": "08", "theme": "12", "벌": "X08x21", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "$(f^{-1}\\circ g)(a)=f^{-1}(g(a))=2$에서<br>$f(2)=g(a)$<br>$2\\times 2-3=3a-5\\therefore \\;a=2$", "k": "num", "a": "2", "q": "두 함수 $f(x)=2x-3$, $g(x)=3x-5$에 대하여 $(f^{-1}\\circ g)(a)=2$를 만족시키는 상수 $a$의 값을 구하시오.", "key": "T08-12"}, "x08x21-093": {"id": "x08x21-093", "unit": "08", "theme": "12", "벌": "X08x21", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "$(g\\circ f)(x)=g(f(x))=g(x-a)$<br>$=3(x-a)-2a=3x-5a$<br>즉 $3x-5a=3x+10$이므로<br>$-5a=10\\therefore \\;a=-2$<br>$\\therefore \\;f(x)=x+2$, $g(x)=3x+4$<br>$g^{-1}(-2)=k$라 하면 $g(k)=-2$이므로<br>$3k+4=-2\\therefore \\;k=-2$<br>$\\therefore \\;(f\\circ g^{-1})(-2)=f(g^{-1}(-2))=f(-2)$<br>$=-2+2=0$", "k": "c5", "c": ["$-1$", "$0$", "$1$", "$2$", "$3$"], "a": "$0$", "q": "두 함수 $f(x)=x-a$, $g(x)=3x-2a$에 대하여 $(g\\circ f)(x)=3x+10$일 때, $(f\\circ g^{-1})(-2)$의 값은?<br>(단, $a$는 상수이다.)", "key": "T08-12"}, "x08x31-141": {"id": "x08x31-141", "unit": "08", "theme": "12", "벌": "X08x31", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$(f\\circ g^{-1}\\circ f)(2)=f(g^{-1}(f(2)))=5$에서<br>$g^{-1}(f(2))=k$라 하면 $f(k)=5$이므로<br>$2k+3=5\\therefore \\;k=1$<br>따라서 $g^{-1}(f(2))=1$에서 $g(1)=f(2)$이므로<br>$a+4=7\\therefore \\;a=3$", "k": "num", "a": "3", "q": "두 함수 $f(x)=2x+3,\\;g(x)=ax+4$에 대하여 $(f\\circ g^{-1}\\circ f)(2)=5$일 때, 상수 $a$의 값을 구하시오.", "key": "T08-12"}, "x08x31-142": {"id": "x08x31-142", "unit": "08", "theme": "12", "벌": "X08x31", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$x\\ge 0$일 때, $f(x)=x^{2}-2\\ge -2$<br>$x<0$일 때, $f(x)=2x-2<-2$<br>$g(2)=7$이므로<br>$(f^{-1}\\circ g)(2)=f^{-1}(g(2))=f^{-1}(7)$<br>$f^{-1}(7)=k$라 하면 $f(k)=7$이므로<br>$k^{2}-2=7,\\;k^{2}=9$<br>$\\therefore \\;k=-3$ 또는 $k=3$<br>그런데 $k\\ge 0$이므로 $k=3$", "k": "num", "a": "3", "q": "두 함수 $f(x)={\\begin{cases}\\,x^{2}-2 &  &  & (x\\ge 0) \\\\ \\,2x-2 &  &  & (x<0)\\end{cases}},\\;g(x)=x+5$에 대하여 $(f^{-1}\\circ g)(2)$의 값을 구하시오.", "key": "T08-12"}, "x08x48-058": {"id": "x08x48-058", "unit": "08", "theme": "12", "벌": "X08x48", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "$(f^{-1}\\circ g)(a)=f^{-1}(g(a))=1$에서<br>$f(1)=g(a)$<br>$2-1=3a-2\\;\\therefore \\;a=1$", "k": "c5", "c": ["$-3$", "$-2$", "$-1$", "$0$", "$1$"], "a": "$1$", "q": "두 함수 $f(x)=2x-1,\\;g(x)=3x-2$에 대하여 $(f^{-1}\\circ g)(a)=1$을 만족시키는 상수 $a$의 값은?", "key": "T08-12"}, "x08x48-060": {"id": "x08x48-060", "unit": "08", "theme": "12", "벌": "X08x48", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "$(f\\circ g)(x)=f(g(x))=f(2x+a)$<br>$=2x+a+a=2x+2a$<br>즉, $2x+2a=2x+6$이므로<br>$2a=6\\;\\therefore \\;a=3$<br>$\\therefore \\;f(x)=x+3,\\;g(x)=2x+3$<br>$(g\\circ f^{-1})(-1)=g(f^{-1}(-1))$에서<br>$f^{-1}(-1)=k$ ($k$는 상수)라 하면 $f(k)=-1$이므로<br>$k+3=-1\\;\\therefore \\;k=-4$<br>$\\therefore \\;(g\\circ f^{-1})(-1)=g(f^{-1}(-1))=g(-4)=-5$", "k": "c5", "c": ["$-5$", "$-4$", "$-3$", "$-2$", "$-1$"], "a": "$-5$", "q": "두 함수 $f(x)=x+a,\\;g(x)=2x+a$에 대하여 $(f\\circ g)(x)=2x+6$일 때, $(g\\circ f^{-1})(-1)$의 값은? (단, $a$는 상수)", "key": "T08-12"}, "x08x21-095": {"id": "x08x21-095", "unit": "08", "theme": "13", "벌": "X08x21", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "$(f\\circ (f\\circ g)^{-1}\\circ f)(3)=(f\\circ g^{-1}\\circ f^{-1}\\circ f)(3)$<br>$=(f\\circ g^{-1})(3)$<br>$=f(g^{-1}(3))$<br>$g^{-1}(3)=k$라 하면 $g(k)=3$이므로<br>$3k-6=3\\therefore \\;k=3$<br>$\\therefore \\;(f\\circ (f\\circ g)^{-1}\\circ f)(3)=f(g^{-1}(3))$<br>$=f(3)$<br>$=3+1=4$", "k": "num", "a": "4", "q": "두 함수 $f(x)=x+1$, $g(x)=3x-6$에 대하여 $(f\\circ (f\\circ g)^{-1}\\circ f)(3)$의 값을 구하시오.", "key": "T08-13"}, "x08x21-096": {"id": "x08x21-096", "unit": "08", "theme": "13", "벌": "X08x21", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "$(f\\circ (f^{-1}\\circ g)^{-1})(-1)=(f\\circ g^{-1}\\circ f)(-1)$<br>$=f(g^{-1}(f(-1)))$<br>$=f(g^{-1}(-1))$<br>$g^{-1}(-1)=k$라 하면 $g(k)=-1$이므로<br>$-3k+2=-1\\therefore \\;k=1$<br>$\\therefore \\;(f\\circ (f^{-1}\\circ g)^{-1})(-1)=f(g^{-1}(-1))$<br>$=f(1)$<br>$=2\\times 1$<br>$=2$", "k": "c5", "c": ["$0$", "$1$", "$2$", "$3$", "$4$"], "a": "$2$", "q": "실수 전체의 집합에서 정의된 두 함수 $f$, $g$가<br> $f(x)={\\begin{cases}2x & \\;(x>0) \\\\ -x^{2} & \\;(x\\le 0)\\end{cases}}$, $g(x)=-3x+2$<br>일 때, $(f\\circ (f^{-1}\\circ g)^{-1})(-1)$의 값은?", "key": "T08-13"}, "x08x21-098": {"id": "x08x21-098", "unit": "08", "theme": "13", "벌": "X08x21", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "$(g^{-1}\\circ f^{-1})(-6)=-4$에서<br>$(f\\circ g)^{-1}(-6)=-4$이므로<br>$(f\\circ g)(-4)=-6\\therefore \\;f(g(-4))=-6$<br>$g(-4)=-4+6=2$이므로 $f(2)=-6$<br>$\\therefore \\;2a+b=-6\\cdots \\cdots $㉠<br>한편 $g^{-1}(7)=k$라 하면 $g(k)=7$이므로<br>$k+6=7\\therefore \\;k=1$<br>따라서 $(f\\circ g^{-1})(7)=f(g^{-1}(7))=f(1)=-2$이므로<br>$a+b=-2\\cdots \\cdots $㉡<br>㉠, ㉡을 연립하여 풀면 $a=-4$, $b=2$<br>$\\therefore \\;ab=-8$", "k": "num", "a": "-8", "q": "두 함수 $f(x)=ax+b$, $g(x)=x+6$에 대하여 $(g^{-1}\\circ f^{-1})(-6)=-4$, $(f\\circ g^{-1})(7)=-2$일 때, $ab$의 값을 구하시오. (단, $a$, $b$는 상수이다.)", "key": "T08-13"}, "x08x31-144": {"id": "x08x31-144", "unit": "08", "theme": "13", "벌": "X08x31", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$(f\\circ (g\\circ f)^{-1}\\circ f)(8)=(f\\circ f^{-1}\\circ g^{-1}\\circ f)(8)$<br>$=(g^{-1}\\circ f)(8)$<br>$=g^{-1}(f(8))$<br>$=g^{-1}(-23)$<br>$g^{-1}(-23)=k$라 하면 $g(k)=-23$이므로<br>$4k+1=-23\\therefore \\;k=-6$<br>$\\therefore \\;(f\\circ (g\\circ f)^{-1}\\circ f)(8)=-6$", "k": "num", "a": "-6", "q": "두 함수 $f(x)=-3x+1,\\;g(x)=4x+1$에 대하여 $(f\\circ (g\\circ f)^{-1}\\circ f)(8)$의 값을 구하시오.", "key": "T08-13"}, "x08x48-068": {"id": "x08x48-068", "unit": "08", "theme": "13", "벌": "X08x48", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "$(f\\circ (g\\circ f)^{-1}\\circ f)(2)=(f\\circ f^{-1}\\circ g^{-1}\\circ f)(2)$<br>$=(g^{-1}\\circ f)(2)$<br>$=g^{-1}(f(2))$<br>$=g^{-1}(7)$<br>$g^{-1}(7)=k$ ( $k$는 상수)라 하면 $g(k)=7$이므로<br>$k-1=7\\;\\therefore \\;k=8$<br>$\\therefore \\;(f\\circ (g\\circ f)^{-1}\\circ f)(2)=g^{-1}(7)=8$", "k": "num", "a": "8", "q": "두 함수$f(x)=2x+3,\\;g(x)=x-1$에 대하여 $(f\\circ (g\\circ f)^{-1}\\circ f)(2)$의 값을 구하시오.", "key": "T08-13"}, "x08x48-070": {"id": "x08x48-070", "unit": "08", "theme": "13", "벌": "X08x48", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "함수 $y=f(2x+3)$에서 $h(x)=2x+3$이라 하면 함수<br>$y=f(h(x))=(f\\circ h)(x)$의 역함수는<br>$(f\\circ h)^{-1}(x)=(h^{-1}\\circ f^{-1})(x)$<br>$=h^{-1}(f^{-1}(x))$<br>$=h^{-1}(g(x))\\cdots \\cdots $㉠<br>$h(x)=2x+3$에서 $y=2x+3$이라 하면<br>$2x=y-3\\;\\therefore \\;x=\\dfrac{1}{2}y-\\dfrac{3}{2}$<br>따라서 역함수는 $y=\\dfrac{1}{2}x-\\dfrac{3}{2}$<br>$\\therefore \\;h^{-1}(x)=\\dfrac{1}{2}x-\\dfrac{3}{2}$<br>㉠에서<br>$(f\\circ h)^{-1}(x)=h^{-1}(g(x))=\\dfrac{1}{2}g(x)-\\dfrac{3}{2}$<br>따라서 $a=\\dfrac{1}{2},\\;b=-\\dfrac{3}{2}$이므로<br>$a+b=-1$", "k": "c5", "c": ["$-\\dfrac{5}{2}$", "$-2$", "$-\\dfrac{3}{2}$", "$-1$", "$-\\dfrac{1}{2}$"], "a": "$-1$", "q": "일차함수 $f(x)$의 역함수를 $g(x)$라 할 때, 함수<br> $y=f(2x+3)$<br>의 역함수를 $g(x)$에 대한 식으로 나타내면<br>$y=ag(x)+b$이다. 두 상수 $a,\\;b$에 대하여 $a+b$의 값은?", "key": "T08-13"}, "x08x48-074": {"id": "x08x48-074", "unit": "08", "theme": "13", "벌": "X08x48", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "$f=f^{-1}$이면 $(f\\circ f)(x)=x$<br>$f(f(x))=f(ax+2)=a(ax+2)+2$<br>$=a^{2}x+2a+2$<br>즉, $a^{2}x+2a+2=x$이므로<br>$a^{2}=1,\\;2a+2=0\\;\\therefore \\;a=-1$<br>따라서 $f(x)=-x+2$이므로<br>$f(-1)=3$", "k": "c5", "c": ["$-2$", "$-1$", "$1$", "$2$", "$3$"], "a": "$3$", "q": "함수 $f(x)=ax+2$에 대하여 $f=f^{-1}$일 때, $f(-1)$의 값은?<br>(단, $a$는 상수)", "key": "T08-13"}, "x08x69-107": {"id": "x08x69-107", "unit": "08", "theme": "13", "벌": "X08x69", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "$(f^{-1}\\circ g)^{-1}(3)=(g^{-1}\\circ f)(3)$<br>$=g^{-1}(f(3))$<br>$=g^{-1}(5)$<br>$g^{-1}(5)=k$ ($k$는 상수)라 하면 $g(k)=5$이므로<br>$\\dfrac{1}{2}k-1=5\\;\\therefore \\;k=12$<br>$\\therefore \\;(f^{-1}\\circ g)^{-1}(3)=g^{-1}(5)=12$", "k": "num", "a": "12", "q": "두 함수 $f(x)=2x-1,\\;g(x)=\\dfrac{1}{2}x-1$에 대하여 $(f^{-1}\\circ g)^{-1}(3)$<br>의 값을 구하시오.", "key": "T08-13"}, "x08x69-109": {"id": "x08x69-109", "unit": "08", "theme": "13", "벌": "X08x69", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "$(f^{-1}\\circ g^{-1})(2)=(g\\circ f)^{-1}(2)$<br>$(g\\circ f)^{-1}(2)=k$ ($k$는 상수)라 하면 $(g\\circ f)(k)=2$이므로<br>$3k+2=2\\;\\therefore \\;k=0$<br>$\\therefore \\;(f^{-1}\\circ g^{-1})(2)=0$", "k": "num", "a": "0", "q": "두 함수 $f,\\;g$에 대하여 $(g\\circ f)(x)=3x+2$일 때, $(f^{-1}\\circ g^{-1})(2)$ 의 값을 구하시오.", "key": "T08-13"}, "x08x40-034": {"id": "x08x40-034", "unit": "08", "theme": "14", "벌": "X08x40", "lvl": 1, "fix": true, "src": "문제집 고쟁이", "w": "함수 $y=\\dfrac{3}{2}x+4$의 그래프와 그 역함수의 그래프는 직선 $y=x$에 대하여 대칭이고, 이때 두 함수의 교점은 직선 $y=x$위에 존재한다.<br>즉, 구하는 교점의 좌표는 직선 $y=\\dfrac{3}{2}x+4$와 직선 $y=x$의 교점의 좌표와 같고, 방정식 $\\dfrac{3}{2}x+4=x$에서 $x=-8$이므로 구하는 교점의 좌표는 $(-8,\\;-8)$이다.<br>따라서 $a=-8,b=-8$이므로<br>$a+b=(-8)+(-8)=-16$", "k": "c5", "c": ["$-2$", "$-4$", "$-8$", "$-16$", "$-32$"], "a": "$-16$", "q": "함수 $f(x)=\\dfrac{3}{2}x+4$의 역함수를 $g(x)$라 할 때, 두 함수 $y=f(x),y=g(x)$의 그래프의 교점의 좌표는 $(a,\\;b)$이다. $a+b$의 값은?", "key": "T08-14"}, "x05x53-057": {"id": "x05x53-057", "unit": "m05", "theme": "01", "벌": "X05x53", "lvl": 2, "fix": true, "src": "문제집 개념원리", "w": "$f(x)=4x^{3}+ax^{2}-bx+1$에서<br>$f'(x)=12x^{2}+2ax-b$<br>함수 $f(x)$는 $x=-1,\\;x=2$의 좌우에서 증가와 감소가 바뀌므로 $x=-1,\\;x=2$의 좌우에서 $f'(x)$의 부호가 바뀐다.<br>따라서 이차방정식 $f'(x)=0$, 즉 $12x^{2}+2ax-b=0$의 두 근이 $-1,\\;2$이므로 이차방정식의 근과 계수의 관계에 의하여<br>$-1+2=-2\\dfrac{a}{12}$, $-1\\times 2=-\\dfrac{b}{12}$<br>$\\therefore \\;a=-6,\\;b=24$<br>$\\therefore \\;a+b=18$", "k": "num", "a": "18", "q": "함수 $f(x)=4x^{3}+ax^{2}-bx+1$이 $x\\le -1$ 또는 $x\\ge 2$에서 증가하고, $-1\\le x\\le 2$에서 감소할 때, 상수 $a,\\;b$에 대하여 $a+b$의 값을 구하시오.", "key": "Tm05-01"}, "x05x59-007": {"id": "x05x59-007", "unit": "m05", "theme": "01", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(x)=\\dfrac{1}{3}x^{3}+ax^{2}+bx+2$에서<br>$f' (x)=x^{2}+2ax+b$<br>주어진 조건에 의하여 이차방정식 $f' (x)=0$의 두 근은 $\\mathrm{1}$, $\\mathrm{3}$이므로 이차방정식의 근과 계수의 관계에 의하여<br>$1+3=\\,-2a$, $1\\cdot 3=b\\;\\therefore \\;a=\\,-2$, $b=3$<br>$\\therefore \\;a-b=\\,-5$", "k": "num", "a": "-5", "q": "함수 $f(x)=\\dfrac{1}{3}x^{3}+ax^{2}+bx+2$가 $x\\le 1$, $x\\ge 3$에서 증가하고, $1\\le x\\le 3$에서 감소할 때, 상수 $a$, $b$에 대하여 $a-b$의 값을 구하시오.", "key": "Tm05-01"}, "x05x75-005": {"id": "x05x75-005", "unit": "m05", "theme": "01", "벌": "X05x75", "lvl": 2, "fix": true, "src": "문제집 바이블개념ON", "w": "$f(x)=-x^{3}+3x^{2}+24x+3$에서<br>$f' (x)=-3x^{2}+6x+24=-3(x+2)(x-4)$<br>$f' (x)=0$에서 $x=-2$ 또는 $x=4$<br>함수 $f(x)$의 증가와 감소를 표로 나타내면 다음과 같다.<br>$x\\cdots -2\\cdots 4\\cdots f' (x)-0+0-f(x)$↘$-25$↗$83$↘<br>이때 함수 $f(x)$는 닫힌구간 $[\\,-2,\\;4\\,]$에서 증가한다.<br>따라서 닫힌구간 $[\\,a,\\;b\\,]$가 닫힌구간 $[\\,-2,\\;4\\,]$에 포함되어야 하므로<br>$-2\\le a<b\\le 4$<br>즉, $m=-2$, $M=4$이므로<br>$M-m=4-(-2)=6$", "k": "num", "a": "6", "q": "함수 $f(x)=-x^{3}+3x^{2}+24x+3$이 닫힌구간 $[\\,a,\\;b\\,]$에서 증가할 때, $a$의 최솟값을 $m$, $b$의 최댓값을 $M$이라 하자. $M-m$의 값을 구하시오.", "key": "Tm05-01"}, "x05x11-015": {"id": "x05x11-015", "unit": "m05", "theme": "02", "벌": "X05x11", "lvl": 2, "fix": true, "src": "주간고사 6회", "w": "$x_{1}\\ne x_{2}$이면 $f(x_{1})\\ne f(x_{2})$를 만족시키는 함수는<br>일대일 대응이고 $f(x)$의 최고차항의 계수가<br>양수이므로 함수 $f(x)$는 증가함수이다.<br>즉, 모든 실수 $x$에 대하여 $f'(x)\\ge 0$이어야 하므로<br>$f'(x)=3x^{2}-6(a+1)x-4a\\ge 0$<br>방정식 $f'(x)=0$의 판별식을 $D$라 할 때,<br>$\\dfrac{D}{4}=9(a+1)^{2}+12a\\le 0$<br>$3a^{2}+10a+3\\le 0,\\;(a+3)(3a+1)\\le 0$<br>$\\therefore \\;-3\\le a\\le -\\dfrac{1}{3}$<br>따라서 정수 $a$는 $-3,\\;-2,\\;-1$이므로 구하는<br>합은　$-3+(-2)+(-1)=-6$", "k": "c5", "c": ["$-7$", "$-6$", "$-5$", "$-4$", "$-3$"], "a": "$-6$", "q": "실수 전체의 집합에서 정의된 함수 $f(x)=x^{3}-3(a+1)x^{2}-4ax+2$가 임의의 두 실수 $x_{1}$, $x_{2}$에 대하여 $x_{1}\\ne x_{2}$이면 $f(x_{1})\\ne f(x_{2})$가 성립하도록 하는 모든 정수 $a$의 값의 합은?<br>", "key": "Tm05-02"}, "x05x59-009": {"id": "x05x59-009", "unit": "m05", "theme": "02", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(x)=\\dfrac{1}{3}x^{3}+ax^{2}+(3a+4)x-1$에서<br>$f' (x)=x^{2}+2ax+3a+4$<br>함수 $f(x)$가 실수 전체의 집합에서 증가하려면 모든 실수 $x$에 대하여 $f' (x)\\ge 0$이어야 하므로 이차방정식 $f' (x)=0$의 판별식을 $D$라 하면<br>$\\dfrac{D}{4}=a^{2}-3a-4\\le 0$, $(a+1)(a-4)\\le 0$<br>$\\therefore \\;-1\\le a\\le 4$<br>따라서 정수 $a$는 $-1$, $0$, $1$, $2$, $3$, $4$의 $\\mathrm{6}$개이다.", "k": "c5", "c": ["$\\mathrm{3}$", "$\\mathrm{4}$", "$\\mathrm{5}$", "$\\mathrm{6}$", "$\\mathrm{7}$"], "a": "$\\mathrm{6}$", "q": "함수 $f(x)=\\dfrac{1}{3}x^{3}+ax^{2}+(3a+4)x-1$이 실수 전체의 집합에서 증가하도록 하는 정수 $a$의 개수는?", "key": "Tm05-02"}, "x05x59-011": {"id": "x05x59-011", "unit": "m05", "theme": "02", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$x_{1}<x_{2}$인 임의의 두 실수 $x_{1}$, $x_{2}$에 대하여 $f(x_{1})>f(x_{2})$가 성립하려면 함수 $f(x)$가 실수 전체의 집합에서 감소해야 한다.<br>$f(x)=\\,-x^{3}+2ax^{2}-ax$에서<br>$f'(x)=\\,-3x^{2}+4ax-a$<br>함수 $f(x)$가 실수 전체의 집합에서 감소하려면 모든 실수 $x$에 대하여 $f'(x)\\le 0$이어야 하므로 이차방정식 $f'(x)=0$의 판별식을 $D$라 하면<br>$\\dfrac{D\\,}{4}=4a^{2}-3a\\le 0$, $a(4a-3)\\le 0\\;\\therefore \\;0\\le a\\le \\dfrac{3}{4}$<br>따라서 정수 $a$는 $0$의 $1$개이다.", "k": "num", "a": "1", "q": "함수 $f(x)=\\,-x^{3}+2ax^{2}-ax$가 $x_{1}<x_{2}$인 임의의 두 실수 $x_{1}$, $x_{2}$에 대하여 $f(x_{1})>f(x_{2})$가 성립하도록 하는 정수 $a$의 개수를 구하시오.", "key": "Tm05-02"}, "x05x59-012": {"id": "x05x59-012", "unit": "m05", "theme": "02", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "함수 $f(x)$의 역함수가 존재하려면 $f(x)$가 일대일대응이어야 하므로 실수 전체의 집합에서 $f(x)$는 증가하거나 감소해야 한다.<br>그런데 $f(x)$의 최고차항의 계수가 양수이므로 $f(x)$는 증가해야 한다.<br>$f(x)=x^{3}+x^{2}+kx-4$에서 $f' (x)=3x^{2}+2x+k$<br>함수 $f(x)$가 실수 전체의 집합에서 증가하려면 모든 실수 $x$에 대하여 $f' (x)\\ge 0$이어야 하므로 이차방정식 $f' (x)=0$의 판별식을 $D$라 하면<br>$\\dfrac{D}{4}=1-3k\\le 0\\;\\therefore \\;k\\ge \\dfrac{1}{3}$<br>따라서 정수 $k$의 최솟값은 $\\mathrm{1}$이다.", "k": "num", "a": "1", "q": "실수 전체의 집합에서 정의된 함수<br> $f(x)=x^{3}+x^{2}+kx-4$<br>의 역함수가 존재하기 위한 정수 $k$의 최솟값을 구하시오.", "key": "Tm05-02"}, "x05x59-013": {"id": "x05x59-013", "unit": "m05", "theme": "02", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$x_{1}\\ne x_{2}$이면 $f(x_{1})\\ne f(x_{2})$를 만족시키는 함수는 일대일함수이고 $f(x)$의 최고차항의 계수가 양수이므로 함수 $f(x)$는 실수 전체의 집합에서 증가해야 한다.<br>$f(x)=x^{3}-3(a+1)x^{2}-4ax+2$에서<br>$f'(x)=3x^{2}-6(a+1)x-4a$<br>함수 $f(x)$가 실수 전체의 집합에서 증가하려면 모든 실수 $x$에 대하여 $f'(x)\\ge 0$이어야 하므로 이차방정식 $f'(x)=0$의 판별식을 $D$라 하면<br>$\\dfrac{D\\,}{4}=9(a+1)^{2}+12a\\le 0$, $3a^{2}+10a+3\\le 0$<br>$(a+3)(3a+1)\\le 0\\;\\therefore \\;-3\\le a\\le \\,-\\dfrac{1}{3}$<br>따라서 정수 $a$는 $-3$, $-2$, $-1$이므로 구하는 합은<br>$-3+(-2)+(-1)=\\,-6$", "k": "c5", "c": ["$\\mathrm{-7}$", "$\\mathrm{-6}$", "$\\mathrm{-5}$", "$\\mathrm{-4}$", "$\\mathrm{-3}$"], "a": "$\\mathrm{-6}$", "q": "실수 전체의 집합에서 정의된 함수<br> $f(x)=x^{3}-3(a+1)x^{2}-4ax+2$<br>가 임의의 두 실수 $x_{1}$, $x_{2}$에 대하여 $x_{1}\\ne x_{2}$이면 $f(x_{1})\\ne f(x_{2})$가 성립하도록 하는 모든 정수 $a$의 값의 합은?", "key": "Tm05-02"}, "x05x59-087": {"id": "x05x59-087", "unit": "m05", "theme": "02", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "곡선 $y=x^{3}+3ax^{2}+3(10-3a)x$는 삼차함수의 그래프이고 직선 $y=t$는 $x$축 또는 $x$축에 평행한 직선이므로 임의의 실수 $t$에 대하여 곡선과 직선이 오직 한 점에서 만나려면 삼차함수 $y=x^{3}+3ax^{2}+3(10-3a)x$가 실수 전체의 집합에서 증가해야 한다.<br>$f(x)=x^{3}+3ax^{2}+3(10-3a)x$라 하면<br>$f' (x)=3x^{2}+6ax+3(10-3a)$<br>함수 $f(x)$가 실수 전체의 집합에서 증가하려면 모든 실수 $x$에 대하여 $f' (x)\\ge 0$이어야 한다.<br>즉 이차방정식 $f' (x)=0$이 중근 또는 허근을 가져야 하므로 판별식을 $D$라 하면<br>$\\dfrac{D}{4}=9a^{2}-9(10-3a)\\le 0$, $a^{2}+3a-10\\le 0$<br>$(a+5)(a-2)\\le 0\\;\\therefore \\;-5\\le a\\le 2$<br>따라서 정수 $a$는 $-5$, $-4$, $-3$, $\\cdots $, $2$이므로 구하는 합은<br>$-5+(-4)+(-3)+\\,\\cdots \\,+2=\\,-12$", "k": "num", "a": "-12", "q": "곡선 $y=x^{3}+3ax^{2}+3(10-3a)x$가 임의의 실수 $t$에 대하여 직선 $y=t$와 오직 한 점에서 만나도록 하는 모든 정수 $a$의 값의 합을 구하시오.", "key": "Tm05-02"}, "x05x75-010": {"id": "x05x75-010", "unit": "m05", "theme": "02", "벌": "X05x75", "lvl": 2, "fix": true, "src": "문제집 바이블개념ON", "w": "$f(x)=x^{3}-ax+3$에서<br>$f' (x)=3x^{2}-a$<br>함수 $f(x)$가 감소하는 구간이 닫힌구간 $[\\,-3,\\;b\\,]$이므로<br>$f' (x)\\le 0$인 $x$의 값의 범위가 $-3\\le x\\le b$이다.<br>즉, 이차부등식 $f' (x)\\le 0$의 해가 $-3\\le x\\le b$이므로<br>$f' (x)=3(x+3)(x-b)$<br>$=3x^{2}-3(b-3)x-9b$<br>따라서 $b-3=0$, $a=9b$에서<br>$a=27$, $b=3$<br>$\\therefore \\;a+b=27+3=30$", "k": "num", "a": "30", "q": "함수 $f(x)=x^{3}-ax+3$이 감소하는 구간이 닫힌구간 $[\\,-3,\\;b\\,]$일 때, 상수 $a,\\;b$에 대하여 $a+b$의 값을 구하시오. (단, $b>-3$)", "key": "Tm05-02"}, "x05x75-011": {"id": "x05x75-011", "unit": "m05", "theme": "02", "벌": "X05x75", "lvl": 2, "fix": true, "src": "문제집 바이블개념ON", "w": "$f(x)=-\\dfrac{1}{3}x^{3}+ax^{2}-3ax+1$에서<br>$f' (x)=-x^{2}+2ax-3a$<br>$x_{1}<x_{2}$인 임의의 두 실수 $x_{1},\\;x_{2}$에 대하여 항상 $f(x_{1})>f(x_{2})$이므로 함수 $f(x)$는 실수 전체의 집합에서 감소한다.<br>즉, 모든 실수 $x$에 대하여 $f' (x)\\le 0$이어야 하므로 이차방정식 $f' (x)=0$의 판별식을 $D$라 하면<br>$\\dfrac{D}{4}=a^{2}-3a\\le 0$, $a(a-3)\\le 0$<br>$\\therefore \\;0\\le a\\le 3$<br>따라서 실수 $a$의 최댓값은 $3$이다.", "k": "num", "a": "3", "q": "함수 $f(x)=-\\dfrac{1}{3}x^{3}+ax^{2}-3ax+1$이 $x_{1}<x_{2}$인 임의의 두 실수 $x_{1},\\;x_{2}$에 대하여 항상 $f(x_{1})>f(x_{2})$일 때, 실수 $a$의 최댓값을 구하시오.", "key": "Tm05-02"}, "x05x75-012": {"id": "x05x75-012", "unit": "m05", "theme": "02", "벌": "X05x75", "lvl": 2, "fix": true, "src": "문제집 바이블개념ON", "w": "$f(x)=ax^{3}-3x^{2}+3x+2$에서<br>$f' (x)=3ax^{2}-6x+3$<br>함수 $f(x)$의 역함수가 존재하려면 $f(x)$는 일대일대응이어야 한다. 이때 함수 $f(x)$의 최고차항의 계수가 양수이므로 $f(x)$는 실수 전체의 집합에서 증가해야 한다.<br>즉, 모든 실수 $x$에서 $f' (x)\\ge 0$이어야 하므로 이차방정식 $f' (x)=0$의 판별식을 $D$라 하면<br>$\\dfrac{D}{4}=9-9a\\le 0\\therefore \\;a\\ge 1$<br>따라서 양수 $a$의 최솟값은 $1$이다.", "k": "num", "a": "1", "q": "실수 전체의 집합에서 정의된 함수 $f(x)=ax^{3}-3x^{2}+3x+2$의 역함수가 존재하도록 하는 양수 $a$의 최솟값을 구하시오.", "key": "Tm05-02"}, "x05x75-014": {"id": "x05x75-014", "unit": "m05", "theme": "02", "벌": "X05x75", "lvl": 2, "fix": true, "src": "문제집 바이블개념ON", "w": "$f(x)=x^{3}+ax^{2}+15x+b$에서<br>$f' (x)=3x^{2}+2ax+15$<br>함수 $f(x)$가 $x=1$에서 극댓값 $8$을 가지므로<br>$f' (1)=0$, $f(x)=8$<br>$f' (1)=3+2a+15=0\\therefore \\;a=-9\\cdots \\cdots $㉠<br>$f(1)=1+a+15+b=8\\therefore \\;a+b=-8\\cdots \\cdots $㉡<br>㉠, ㉡에서 $a=-9,\\;b=1$이므로<br>$f(x)=x^{3}-9x^{2}+15x+1$<br>$f' (x)=3x^{2}-18x+15=3(x-1)(x-5)$<br>$f' (x)=0$에서 $x=1$ 또는 $x=5$<br>함수 $f(x)$의 증가와 감소를 표로 나타내면 다음과 같다.<br>$x\\cdots 1\\cdots 5\\cdots f' (x)+0-0+f(x)\\nearrow 8\\searrow -24\\nearrow $<br>따라서 함수 $f(x)$는 $x=5$에서 극솟값 $-24$를 갖는다.", "k": "num", "a": "-24", "q": "함수 $f(x)=x^{3}+ax^{2}+15x+b$가 $x=1$에서 극댓값 $8$을 가질 때, 함수 $f(x)$의 극솟값을 구하시오. (단, $a,\\;b$는 상수이다.)", "key": "Tm05-02"}, "x05x9-009": {"id": "x05x9-009", "unit": "m05", "theme": "02", "벌": "X05x9", "lvl": 2, "fix": true, "src": "주간고사 5회", "w": "$f(x)=2x^{3}-2x^{2}-ax+3$에서<br>$f'(x)=6x^{2}-4x-a$<br>함수 $f(x)$가 구간 $(-\\infty ,\\;\\infty )$에서<br>증가하려면 모든 실수 $x$에 대하여 $f'(x)\\ge 0$이어야<br>하므로 이차방정식 $f'(x)=0$의 판별식을 $D$라 하면<br>$\\dfrac{D}{4}=(-2)^{2}-6\\cdot (-a)\\le 0$<br>$4+6a\\le 0\\therefore \\;a\\le -\\dfrac{2}{3}$", "k": "c5", "c": ["$a\\le -\\dfrac{2}{3}$", "$-1\\le a\\le -\\dfrac{2}{3}$", "$0\\le a\\le \\dfrac{2}{3}$", "$0\\le a\\le 1$", "$a\\ge \\dfrac{2}{3}$"], "a": "$a\\le -\\dfrac{2}{3}$", "q": "함수 $f(x)=2x^{3}-2x^{2}-ax+3$이 구간 $(-\\infty ,\\;\\infty )$에서 증가하기 위한 실수 $a$의 값의 범위는?<br>", "key": "Tm05-02"}, "x05x9-016": {"id": "x05x9-016", "unit": "m05", "theme": "02", "벌": "X05x9", "lvl": 2, "fix": true, "src": "주간고사 5회", "w": "함수 $f(x)$의 역함수가 존재하려면 $f(x)$는<br>실수 전체의 집합에서 증가하거나 감소해야 한다.<br>이때 $f(x)$는 최고차항의 계수가 양수인 삼차함수이므로<br>$f(x)$는 모든 실수 $x$에 대하여 증가해야 한다.<br>즉, 모든 실수 $x$에 대하여 $f'(x)\\ge 0$이어야 하므로<br>$f'(x)=3x^{2}-2ax+2a\\ge 0$<br>이차방정식 $f'(x)=0$의 판별식을 $D$라 하면<br>$\\dfrac{D}{4}=a^{2}-6a\\le 0$<br>$\\therefore \\;0\\le a\\le 6$", "k": "c5", "c": ["$a<0\\;또는\\;a>0$", "$0<a<5$", "$0\\le a\\le 5$", "$0<a<6$", "$0\\le a\\le 6$"], "a": "$0\\le a\\le 6$", "q": "실수 전체에서 정의된 함수 $f(x)=x(x^{2}-ax+2a)$의 역함수가 존재하도록 실수 $a$의 값의 범위는?<br>", "key": "Tm05-02"}, "x05x107-027": {"id": "x05x107-027", "unit": "m05", "theme": "03", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=\\dfrac{1}{3}x^{3}-9x+3$에서<br>$f' (x)=x^{2}-9=(x+3)(x-3)$<br>$f'(x)=0$인 $x$의 값은 $x=-3$ 또는 $x=3$<br>함수 $f(x)$의 증가, 감소를 표로 나타내면 다음과 같다.<br>${x}{\\cdots }-3{\\cdots }3{\\cdots }{f' (x)}+0-0+{f(x)}\\nearrow 21\\searrow -15\\nearrow $<br>따라서 함수 $f(x)$는 열린구간 $(\\,-3,\\;3\\,)$에서 감소하므로 양수 $a$의 최댓값은 $3$이다.", "k": "num", "a": "3", "q": "함수 $f(x)=\\dfrac{1}{3}x^{3}-9x+3$이 열린구간 $(\\,-a,\\;a\\,)$에서 감소하도록 하는 양수 $a$의 최댓값을 구하시오.", "key": "Tm05-03"}, "x05x107-028": {"id": "x05x107-028", "unit": "m05", "theme": "03", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=-x^{3}+3x^{2}+9x$에서<br>$f' (x)=-3x^{2}+6x+9=-3(x+1)(x-3)$<br>$f'(x)=0$인 $x$의 값은 $x=-1$ 또는 $x=3$<br>함수 $f(x)$의 증가, 감소를 표로 나타내면 다음과 같다.<br>${x}{\\cdots }-1{\\cdots }3{\\cdots }{f' (x)}-0+0-{f(x)}\\searrow -5\\nearrow 27\\searrow $<br>함수 $f(x)$는 구간 $[\\,-1,\\;3\\,]$에서 증가하므로<br>$-1\\le a<3$<br>따라서 정수 $a$는 $-1,\\;0,\\;1,\\;2$의 $4$개이다.", "k": "c5", "c": ["$0$", "$1$", "$2$", "$3$", "$4$"], "a": "$4$", "q": "함수 $f(x)=-x^{3}+3x^{2}+9x$가 닫힌구간 $[\\,a,\\;3\\,]$에서 증가하도록 하는 정수 $a$의 개수는? (단, $a<3$)", "key": "Tm05-03"}, "x05x53-062": {"id": "x05x53-062", "unit": "m05", "theme": "03", "벌": "X05x53", "lvl": 2, "fix": true, "src": "문제집 개념원리", "w": "$f(x)=2x^{3}+ax^{2}+bx-1$에서<br>$f'(x)=6x^{2}+2ax+b$<br>이때 함수 $f(x)$가 감소하는 구간이 $[\\,1,\\;5\\,]$이므로 이차부등식 $f'(x)\\le 0$의 해가 $1\\le x\\le 5$이다.<br>따라서<br>$f'(x)=6(x-1)(x-5)$<br>$=6x^{2}-36x+30$<br>이므로 $2a=-36,\\;b=30$<br>$\\therefore \\;a=-18,\\;b=30$<br>$\\therefore \\;a+b=12$", "k": "num", "a": "12", "q": "함수 $f(x)=2x^{3}+ax^{2}+bx-1$이 감소하는 구간이 $[\\,1,\\;5\\,]$일 때，실수 $a,\\;b$에 대하여 $a+b$의 값을 구하시오.", "key": "Tm05-03"}, "x05x53-063": {"id": "x05x53-063", "unit": "m05", "theme": "03", "벌": "X05x53", "lvl": 2, "fix": true, "src": "문제집 개념원리", "w": "$f(x)=x^{3}+ax^{2}-(a^{2}-8a)x+3$에서<br>$f'(x)=3x^{2}+2ax-a^{2}+8a$<br>함수 $f(x)$가 실수 전체의 집합에서 증가하려면 모든 실수 $x$에 대하여 $f'(x)\\ge 0$이어야 한다.<br>따라서 이차방정식 $f'(x)=0$의 판별식을 $D$라 하면<br>$\\dfrac{D}{4}=a^{2}-3(-a^{2}+8a)\\le 0$<br>$a^{2}-6a\\le 0,\\;a(a-6)\\le 0$<br>$\\therefore \\;0\\le a\\le 6$<br>따라서 실수 $a$의 최댓값은 $6$이다.", "k": "num", "a": "6", "q": "함수 $f(x)=x^{3}+ax^{2}-(a^{2}-8a)x+3$이 실수 전체의 집합에서 증가하도록 하는 실수 $a$의 최댓값을 구하시오.", "key": "Tm05-03"}, "x05x59-005": {"id": "x05x59-005", "unit": "m05", "theme": "03", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(x)=\\,-x^{3}-3x^{2}+24x-2$에서<br>$f' (x)=\\,-3x^{2}-6x+24=\\,-3(x+4)(x-2)$<br>이때 $f' (x)\\ge 0$인 구간에서 함수 $f(x)$는 증가하므로<br>$-3(x+4)(x-2)\\ge 0$, $(x+4)(x-2)\\le 0$<br>$\\therefore \\;-4\\le x\\le 2$<br>따라서 $\\alpha =\\,-4$, $\\beta =2$이므로<br>$\\alpha +\\beta =\\,-2$", "k": "c5", "c": ["$\\mathrm{-2}$", "$\\mathrm{-1}$", "$\\mathrm{0}$", "$\\mathrm{1}$", "$\\mathrm{2}$"], "a": "$\\mathrm{-2}$", "q": "함수 $f(x)=\\,-x^{3}-3x^{2}+24x-2$가 증가하는 구간은 $[\\alpha ,\\,\\beta ]$이다. 이때 $\\alpha +\\beta $의 값은?", "key": "Tm05-03"}, "x05x59-006": {"id": "x05x59-006", "unit": "m05", "theme": "03", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(x)=x^{3}-3x+2$에서<br>$f' (x)=3x^{2}-3=3(x+1)(x-1)$<br>이때 $f' (x)\\le 0$인 구간에서 함수 $f(x)$는 감소하므로<br>$3(x+1)(x-1)\\le 0\\;\\therefore \\;-1\\le x\\le 1$<br>따라서 양수 $a$의 최댓값은 $\\mathrm{1}$이다.", "k": "num", "a": "1", "q": "함수 $f(x)=x^{3}-3x+2$가 구간 $[-a,\\,a]$에서 감소할 때, 양수 $a$의 최댓값을 구하시오.", "key": "Tm05-03"}, "x05x59-008": {"id": "x05x59-008", "unit": "m05", "theme": "03", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(x)=2x^{3}-6x^{2}+ax+7$에서<br>$f' (x)=6x^{2}-12x+a$<br>함수 $f(x)$가 감소하는 $x$의 값의 범위가 $-1\\le x\\le b$이므로 이차방정식 $f' (x)=0$의 두 근은 $-1$, $b$이다.<br>이차방정식의 근과 계수의 관계에 의하여<br>$-1+b=2$, $-1\\cdot b=\\dfrac{a}{6}\\;\\therefore \\;a=\\,-18$, $b=3$<br>$\\therefore \\;a+b=\\,-15$", "k": "num", "a": "-15", "q": "함수 $f(x)=2x^{3}-6x^{2}+ax+7$이 감소하는 $x$의 값의 범위가 $-1\\le x\\le b$일 때, 상수 $a$, $b$에 대하여 $a+b$의 값을 구하시오.", "key": "Tm05-03"}, "x05x59-010": {"id": "x05x59-010", "unit": "m05", "theme": "03", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(x)=ax^{3}+x^{2}-x$에서<br>$f' (x)=3ax^{2}+2x-1$<br>함수 $f(x)$가 구간 $(-\\infty ,\\,\\infty )$에서 감소하려면 모든 실수 $x$에 대하여 $f' (x)\\le 0$이어야 하므로<br>$a<0\\cdots \\cdots $ ㉠<br>이차방정식 $f' (x)=0$의 판별식을 $D$라 하면<br>$\\dfrac{D}{4}=1+3a\\le 0\\;\\therefore \\;a\\le \\,-\\dfrac{1}{3}\\cdots \\cdots $ ㉡<br>㉠, ㉡에서 $a\\le \\,-\\dfrac{1}{3}$", "k": "c5", "c": ["$a\\le -\\dfrac{1}{3}$", "$-\\dfrac{1}{3}\\le a<0$", "$-\\dfrac{1}{3}\\le a<\\dfrac{1}{3}$", "$0\\le a\\le \\dfrac{1}{3}$", "$a\\ge \\dfrac{1}{3}$"], "a": "$a\\le -\\dfrac{1}{3}$", "q": "함수 $f(x)=ax^{3}+x^{2}-x$가 구간 $(-\\infty ,\\,\\infty )$에서 감소하도록 하는 실수 $a$의 값의 범위는?", "key": "Tm05-03"}, "x05x59-014": {"id": "x05x59-014", "unit": "m05", "theme": "03", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "함수 $f(x)$가 모든 실수 $t$에 대하여 구간 $(-\\infty ,\\,t\\,]$에서의 최솟값이 $f(t)$가 되려면 $f(x)$는 실수 전체의 집합에서 감소 해야 한다.<br>$f(x)=\\,-2x^{3}+(a-3)x^{2}+(a-2)x+2a$에서<br>$f' (x)=\\,-6x^{2}+2(a-3)x+a-2$<br>함수 $f(x)$가 실수 전체의 집합에서 감소하려면 모든 실수 $x$에 대하여 $f' (x)\\le 0$이어야 하므로 이차방정식 $f' (x)=0$의 판별식을 $D$라 하면<br>$\\dfrac{D}{4}=(a-3)^{2}+6(a-2)\\le 0$, $a^{2}-3\\le 0$<br>$\\left(a+\\sqrt{3}\\right)\\left(a-\\sqrt{3}\\right)\\le 0\\;\\therefore \\;-\\sqrt{3}\\le a\\le \\sqrt{3}$<br>따라서 정수 $a$의 최댓값은 $\\mathrm{1}$이다.", "k": "c5", "c": ["$\\mathrm{1}$", "$\\mathrm{2}$", "$\\mathrm{3}$", "$\\mathrm{4}$", "$\\mathrm{5}$"], "a": "$\\mathrm{1}$", "q": "함수 $f(x)=\\,-2x^{3}+(a-3)x^{2}+(a-2)x+2a$가 모든 실수 $t$에 대하여 구간 $(-\\infty ,\\,t]$에서의 최솟값이 $f(t)$가 되도록 하는 정수 $a$의 최댓값은?", "key": "Tm05-03"}, "x05x59-017": {"id": "x05x59-017", "unit": "m05", "theme": "03", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(x)=x^{3}+ax^{2}-9x+1$에서 $f' (x)=3x^{2}+2ax-9$<br>함수 $f(x)$가 구간 $(-1,\\,2)$에서 감소하려면 $-1<x<2$에서 $f' (x)\\le 0$이어야 한다.<br>$f' (-1)=3-2a-9\\le 0$에서 $a\\ge \\,-3$<br>$f' (2)=12+4a-9\\le 0$에서 $a\\le \\,-\\dfrac{3}{4}$<br>따라서 $a$의 값의 범위는 $-3\\le a\\le \\,-\\dfrac{3}{4}$이므로<br>$M\\,=\\,-\\dfrac{3}{4}$, $m=\\,-3\\;\\therefore \\;M\\,m=\\dfrac{9}{4}$", "k": "c5", "c": ["$-\\dfrac{3}{4}$", "$\\dfrac{1}{2}$", "$\\dfrac{7}{4}$", "$\\dfrac{9}{4}$", "$\\dfrac{11}{2}$"], "a": "$\\dfrac{9}{4}$", "q": "함수 $f(x)=x^{3}+ax^{2}-9x+1$이 구간 $(-1,\\,2)$에서 감소하도록 하는 실수 $a$의 최댓값을 $M$, 최솟값을 $m$이라 할 때, $Mm$의 값은?", "key": "Tm05-03"}, "x05x107-038": {"id": "x05x107-038", "unit": "m05", "theme": "04", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=x^{4}-6x^{2}+2$에서<br>$f' (x)=4x^{3}-12x=4x(x^{2}-3)=4x\\left(x+\\sqrt{3}\\right)\\left(x-\\sqrt{3}\\right)$<br>$f'(x)=0$인 $x$의 값은 $x=-\\sqrt{3}$ 또는 $x=0$ 또는 $x=\\sqrt{3}$<br>함수 $f(x)$의 증가, 감소를 표로 나타내면 다음과 같다.<br>$x{\\cdots }-\\sqrt{3}{\\cdots }0{\\cdots }\\sqrt{3}{\\cdots }f'(x)-0+0-0+f(x)\\searrow -7$<br>극소$\\nearrow 2$<br>극대$\\searrow -7$<br>극소$\\nearrow $<br>함수 $f(x)$는 $x=0$에서 극댓값 $2$를 가지므로<br>$a=0,\\;b=2$<br>$\\therefore \\;a+b=2$", "k": "c5", "c": ["$1$", "$2$", "$3$", "$4$", "$5$"], "a": "$2$", "q": "함수 $f(x)=x^{4}-6x^{2}+2$가 $x=a$에서 극댓값 $b$를 가질 때, $a+b$의 값은?", "key": "Tm05-04"}, "x05x107-039": {"id": "x05x107-039", "unit": "m05", "theme": "04", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=-x^{4}+4x^{3}-4x^{2}+11$에서<br>$f'(x)=-4x^{3}+12x^{2}-8x$<br>$=-4x(x^{2}-3x+2)=-4x(x-1)(x-2)$<br>$f'(x)=0$인 $x$의 값은 $x=0$ 또는 $x=1$ 또는 $x=2$<br>함수 $f(x)$의 증가, 감소를 표로 나타내면 다음과 같다.<br>$x{\\cdots }0{\\cdots }1{\\cdots }2{\\cdots }f'(x)+0-0+0-f(x)\\nearrow 11$<br>극대$\\searrow 10$<br>극소$\\nearrow 11$<br>극대$\\searrow $<br>함수 $f(x)$는 $x=0$일 때 극댓값 $11$, $x=1$일 때 극솟값 $10$, $x=2$일 때 극댓값 $11$을 가진다.<br>따라서 구하는 극값의 합은 $11+10+11=32$", "k": "c5", "c": ["$10$", "$12$", "$21$", "$22$", "$32$"], "a": "$32$", "q": "함수 $f(x)=-x^{4}+4x^{3}-4x^{2}+11$의 모든 극값의 합은?", "key": "Tm05-04"}, "x05x107-040": {"id": "x05x107-040", "unit": "m05", "theme": "04", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=-x^{3}+3x+1$에서<br>$f'(x)=-3x^{2}+3=-3(x+1)(x-1)$<br>$f'(x)=0$인 $x$의 값은 $x=-1$ 또는 $x=1$<br>함수 $f(x)$의 증가, 감소를 표로 나타내면 다음과 같다.<br>${x}{\\cdots }-1{\\cdots }1{\\cdots }{f' (x)}-0+0-{f(x)}\\searrow -1$<br>극소$\\nearrow 3$<br>극대$\\searrow $<br>함수 $f(x)$는 $x=-1$에서 극솟값 $-1$, $x=1$에서 극댓값 $3$을 가지므로 두 점 $(-1,\\;-1),\\;(1,\\;3)$을 지나는 직선의 기울기는<br>$\\dfrac{3-(-1)}{1-(-1)}=2$", "k": "num", "a": "2", "q": "함수 $f(x)=-x^{3}+3x+1$이 $x=\\alpha ,\\;x=\\beta $에서 극값을 가질 때, 두 점 $(\\alpha ,\\;f(\\alpha )),\\;(\\beta ,\\;f(\\beta ))$를 지나는 직선의 기울기를 구하시오.", "key": "Tm05-04"}, "x05x107-042": {"id": "x05x107-042", "unit": "m05", "theme": "04", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=-x^{4}+4x^{3}$에서<br>$f' (x)=-4x^{3}+12x^{2}=-4x^{2}(x-3)$<br>$f'(x)=0$인 $x$의 값은 $x=0$ 또는 $x=3$<br>함수 $f(x)$의 증가, 감소를 표로 나타내면 다음과 같다.<br>${x}{\\cdots }0{\\cdots }3{\\cdots }{f' (x)}+0+0-{f(x)}\\nearrow 0\\nearrow 27$<br>극대$\\searrow $<br>$x=0$에서 $f'(0)=0$이지만 극값을 가지지 않으므로 $b=0$<br>$x=3$에서는 극댓값을 가지므로 $a=3$<br>$\\therefore \\;f(a)-f(b)=f(3)-f(0)=27-0=27$", "k": "c5", "c": ["$21$", "$23$", "$25$", "$27$", "$29$"], "a": "$27$", "q": "함수 $f(x)=-x^{4}+4x^{3}$에 대하여 실수 $a,\\;b$가 다음 조건을 만족시킬 때, $f(a)-f(b)$의 값을 구하시오.<br>(가) $f'(a)=f'(b)=0$<br>(나) 함수 $f(x)$는 $x=a$에서 극값을 가진다.<br>(다) 함수 $f(x)$는 $x=b$에서 극값을 가지지 않는다.", "key": "Tm05-04"}, "x05x107-043": {"id": "x05x107-043", "unit": "m05", "theme": "04", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=\\dfrac{1}{3}x^{3}-2x^{2}-12x+4$에서<br>$f' (x)=x^{2}-4x-12=(x+2)(x-6)$<br>$f'(x)=0$인 $x$의 값은 $x=-2$ 또는 $x=6$<br>함수 $f(x)$의 증가, 감소를 표로 나타내면 다음과 같다.<br>${x}{\\cdots }-2{\\cdots }6{\\cdots }{f' (x)}+0-0+{f(x)}\\nearrow $극대$\\searrow $극소$\\searrow $<br>함수 $f(x)$는 $x=-2$에서 극대이고, $x=6$에서 극소이므로<br>$\\alpha =-2$, $\\beta =6$<br>$\\therefore \\;\\beta -\\alpha =6-(-2)=8$", "k": "c5", "c": ["$-4$", "$-1$", "$2$", "$5$", "$8$"], "a": "$8$", "q": "함수 $f(x)=\\dfrac{1\\,}{3}x^{3}-2x^{2}-12x+4$가 $x=\\alpha $에서 극대이고 $x=\\beta $에서 극소일 때, $\\beta -\\alpha $의 값은? (단, $\\alpha $와 $\\beta $는 상수이다.)", "key": "Tm05-04"}, "x05x107-044": {"id": "x05x107-044", "unit": "m05", "theme": "04", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=x^{3}-3x+12$에서<br>$f' (x)=3x^{2}-3=3(x+1)(x-1)$<br>$f'(x)=0$인 $x$의 값은 $x=-1$ 또는 $x=1$<br>함수 $f(x)$의 증가, 감소를 표로 나타내면 다음과 같다.<br>${x}{\\cdots }-1{\\cdots }1{\\cdots }{f' (x)}+0-0+{f(x)}\\nearrow $극대$\\searrow $극소$\\nearrow $<br>함수 $f(x)$는 $x=1$에서 극소이므로 $a=1$<br>$f(a)=f(1)=1^{3}-3\\times 1+12=10$<br>$\\therefore \\;a+f(a)=1\\,+f(1)=1+10=11$", "k": "num", "a": "11", "q": "함수 $f(x)=x^{3}-3x+12$가 $x=a$에서 극소일 때, $a+f(a)$의 값을 구하시오. (단, $a$는 상수이다.)", "key": "Tm05-04"}, "x05x107-045": {"id": "x05x107-045", "unit": "m05", "theme": "04", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=2x^{3}+3x^{2}-12x+1$에서<br>$f' (x)=6x^{2}+6x-12=6(x+2)(x-1)$<br>$f'(x)=0$인 $x$의 값은 $x=-2$ 또는 $x=1$<br>함수 $f(x)$의 증가, 감소를 표로 나타내면 다음과 같다.<br>${x}{\\cdots }-2{\\cdots }1{\\cdots }{f' (x)}+0-0+{f(x)}\\nearrow 21$<br>극대$\\searrow -6$<br>극소$\\nearrow $<br>함수 $f(x)$는 $x=-2$에서 극대이므로 극댓값 $M$은<br>$M=f(-2)=21$<br>또한 $x=1$에서 극소이므로 극솟값 $m$은<br>$m=f(1)=-6$<br>$\\therefore \\;M+m=15$", "k": "c5", "c": ["$13$", "$14$", "$15$", "$16$", "$17$"], "a": "$15$", "q": "함수 $f(x)=2x^{3}+3x^{2}-12x+1$의 극댓값과 극솟값을 각각 $M$, $m$이라 할 때, $M+m$의 값은?", "key": "Tm05-04"}, "x05x13-007": {"id": "x05x13-007", "unit": "m05", "theme": "04", "벌": "X05x13", "lvl": 2, "fix": true, "src": "주간고사 7회", "w": "$f(x)=x^{3}+ax^{2}+bx+c$<br>$f'(x)=3x^{2}+2ax+b$<br>$f'(-2)=0\\therefore \\;-4a+b=-12$　…… ㉠<br>$f'(0)=0\\therefore \\;b=0$　…… ㉡<br>$f(-2)=3\\therefore \\;4a-2b+c=11$　…… ㉢<br>㉠, ㉡, ㉢ 연립에 의해<br>$a=3,\\;b=0,\\;c=-1$<br>$\\therefore $ 극솟값 $=f(0)=c=-1$", "k": "c5", "c": ["$-1$", "$0$", "$1$", "$2$", "$3$"], "a": "$-1$", "q": "$f(x)=x^{3}+ax^{2}+bx+c$는 $x=-2$에서 극댓값 3을 갖고 $x=0$에서 극솟값을 가질 때, 극솟값은?<br>", "key": "Tm05-04"}, "x05x53-072": {"id": "x05x53-072", "unit": "m05", "theme": "04", "벌": "X05x53", "lvl": 2, "fix": true, "src": "문제집 개념원리", "w": "$f(x)=-2x^{3}+15x^{2}-24x-2$에서<br>$f'(x)=-6x^{2}+30x-24$<br>$=-6(x-1)(x-4)$<br>$f'(x)=0$에서 $x=1$ 또는 $x=4$<br>함수 $f(x)$의 증가와 감소를 표로 나타내면 다음과 같다.<br>${x}{\\cdots }1{\\cdots }4{\\cdots }{f' (x)}-0+0-{f(x)}\\searrow -13\\nearrow 14\\searrow $<br>따라서 함수 $f(x)$는<br>$x=1$에서 극솟값 $-13$, $x=4$에서 극댓값 $14$<br>를 가지므로 극댓값과 극솟값의 차는<br>$14-(-13)=27$", "k": "num", "a": "27", "q": "함수 $f(x)=-2x^{3}+15x^{2}-24x-2$의 극댓값과 극솟값의 차를 구하시오.", "key": "Tm05-04"}, "x05x59-023": {"id": "x05x59-023", "unit": "m05", "theme": "04", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(x)=x^{3}-6x^{2}+9x+1$에서<br>$f' (x)=3x^{2}-12x+9=3(x-1)(x-3)$<br>$f' (x)=0$에서 $x=1$ 또는 $x=3$<br>$x\\cdots \\mathrm{1}\\cdots \\mathrm{3}\\cdots f' (x)+\\mathrm{0}-\\mathrm{0}+f(x)\\nearrow \\mathrm{5}\\searrow \\mathrm{1}\\nearrow $<br>따라서 함수 $f(x)$는<br>$x=1$일 때 극댓값 $\\mathrm{5}$, $x=3$일 때 극솟값 $\\mathrm{1}$을 가지므로 극댓값과 극솟값의 차는<br>$5-1=4$", "k": "num", "a": "4", "q": "함수 $f(x)=x^{3}-6x^{2}+9x+1$의 극댓값과 극솟값의 차를 구하시오.", "key": "Tm05-04"}, "x05x75-017": {"id": "x05x75-017", "unit": "m05", "theme": "04", "벌": "X05x75", "lvl": 2, "fix": true, "src": "문제집 바이블개념ON", "w": "$f(x)=x^{3}+6x^{2}-15x+3$에서<br>$f' (x)=3x^{2}+12x-15=3(x+5)(x-1)$이므로<br>$f' (x)=0$에서 $x=-5$ 또는 $x=1$<br>함수 $f(x)$의 증가와 감소를 표로 나타내면 다음과 같다.<br>$x\\cdots -5\\cdots 1\\cdots f' (x)+0-0+f(x)\\nearrow 103\\searrow -5\\nearrow $<br>따라서 함수 $f(x)$는 $x=1$에서 극솟값 $-5$를 가지므로 $a=1,\\;b=-5$<br>$\\therefore \\;a+b=1+(-5)=-4$", "k": "num", "a": "-4", "q": "함수 $f(x)=x^{3}+6x^{2}-15x+3$이 $x=a$에서 극솟값 $b$를 가질 때, 상수 $a,\\;b$에 대하여 $a+b$의 값을 구하시오.", "key": "Tm05-04"}, "x05x9-005": {"id": "x05x9-005", "unit": "m05", "theme": "05", "벌": "X05x9", "lvl": 1, "fix": true, "src": "주간고사 5회", "w": "다항함수의 극댓값을 구할 수 있는가?<br>$f(x)=x^{3}+ax^{2}+bx+1$에서<br>$f'(x)=3x^{2}+2ax+b$<br>함수 $f(x)$는 $x=-1$에서 극대, $x=3$에서<br>극소이므로<br>$3x^{2}+2ax+b=3(x+1)(x-3)$<br>$=3x^{2}-6x-9$<br>따라서 $a=-3,\\;b=-9$이고,<br>$f(x)=x^{3}-3x^{2}-9x+1$이므로<br>함수 $f(x)$의 극댓값은<br>$f(-1)=-1-3+9+1=6$", "k": "c5", "c": ["$0$", "$3$", "$6$", "$9$", "$12$"], "a": "$6$", "q": "함수 $f(x)=x^{3}+ax^{2}+bx+1$은 $x=-1$에서 극대이고, $x=3$에서 극소이다. 함수 $f(x)$의 극댓값은? (단, $a$, $b$는 상수이다.)<br>", "key": "Tm05-05"}, "x05x107-046": {"id": "x05x107-046", "unit": "m05", "theme": "05", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=x^{3}+3ax+b$에서 $f'(x)=3x^{2}+3a$<br>함수 $f(x)$가 $x=1$에서 극솟값 $0$을 가지므로<br>$f'(1)=0,\\;f(1)=0$<br>$f'(1)=0$에서 $3+3a=0\\cdots \\cdots $㉠<br>$f(1)=0$에서 $1+3a+b=0\\cdots \\cdots $㉡<br>㉠, ㉡을 연립하여 풀면 $a=-1,\\;b=2$<br>즉, $f(x)=x^{3}-3x+2$이므로<br>$f'(x)=3x^{2}-3=3(x+1)(x-1)$<br>$f'(x)=0$인 $x$의 값은 $x=-1$ 또는 $x=1$<br>함수 $f(x)$의 증가, 감소를 표로 나타내면 다음과 같다.<br>${x}{\\cdots }-1{\\cdots }1{\\cdots }{f' (x)}+0-0+{f(x)}\\nearrow 4$<br>극대$\\searrow 0$<br>극소$\\nearrow $<br>따라서 함수 $f(x)$의 극댓값은 $f(-1)=4$", "k": "c5", "c": ["$2$", "$4$", "$6$", "$8$", "$10$"], "a": "$4$", "q": "함수 $f(x)=x^{3}+3ax+b$가 $x=1$에서 극솟값 $0$을 가질 때, $f(x)$의 극댓값은? (단, $a,\\;b$는 상수이다.)", "key": "Tm05-05"}, "x05x107-047": {"id": "x05x107-047", "unit": "m05", "theme": "05", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=2x^{3}-12x^{2}+ax-4$에서 $f'(x)=6x^{2}-24x+a$<br>함수 $f(x)$가 $x=1$에서 극댓값을 가지므로 $f'(1)=0$에서<br>$6-24+a=0\\therefore \\;a=18$<br>즉, $f(x)=2x^{3}-12x^{2}+18x-4$이므로 극댓값은 $f(1)=4$<br>따라서 $M=4$이므로<br>$a+M=18+4=22$", "k": "c5", "c": ["$14$", "$16$", "$18$", "$20$", "$22$"], "a": "$22$", "q": "함수 $f(x)=2x^{3}-12x^{2}+ax-4$가 $x=1$에서 극댓값 $M$을 가질 때, $a+M$의 값은? (단, $a$는 상수이다.)", "key": "Tm05-05"}, "x05x107-048": {"id": "x05x107-048", "unit": "m05", "theme": "05", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=ax^{3}+bx$에서 $f'(x)=3ax^{2}+b\\cdots \\cdots $㉠<br>함수 $f(x)$가 $x=-1$, $x=1$에서 극값을 가지므로<br>$f'(-1)=f'(1)=0$에서<br>$f'(x)=3a(x+1)(x-1)=3ax^{2}-3a\\cdots \\cdots $㉡<br>㉠, ㉡에서 $b=-3a$<br>$a>0$이므로 함수 $f(x)=ax^{3}-3ax$의 증가, 감소를 표로 나타내면 다음과 같다.<br>${x}{\\cdots }-1{\\cdots }1{\\cdots }{f' (x)}+0-0+{f(x)}\\nearrow 2a$<br>극대$\\searrow -2a$<br>극소$\\nearrow $<br>함수 $f(x)$는 $x=1$에서 극솟값 $-2$를 가지므로<br>$f(1)=-2$에서<br>$-2a=-2\\therefore a=1$<br>따라서 $f(x)=x^{3}-3x$이므로 함수 $f(x)$의 극댓값은<br>$f(-1)=2$", "k": "c5", "c": ["$-2$", "$0$", "$2$", "$4$", "$6$"], "a": "$2$", "q": "함수 $f(x)=ax^{3}+bx(a>0)$가 $x=-1$, $x=1$에서 극값을 가지고 극솟값이 $-2$일 때, $f(x)$의 극댓값은? (단, $a$, $b$는 상수이다.)", "key": "Tm05-05"}, "x05x107-049": {"id": "x05x107-049", "unit": "m05", "theme": "05", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=kx^{3}-9kx^{2}+24kx$에서<br>$f'(x)=3kx^{2}-18kx+24k=3k(x-2)(x-4)$<br>$f'(x)=0$인 $x$의 값은 $x=2$ 또는 $x=4$<br>이때 $k>0$이므로 함수 $f(x)$의 증가, 감소를 표로 나타내면 다음과 같다.<br>${x}{\\cdots }2{\\cdots }4{\\cdots }{f' (x)}+0-0+{f(x)}\\nearrow 20k$<br>극대$\\searrow 16k$<br>극소$\\nearrow $<br>함수 $f(x)$의 극댓값은 $f(2)=20k$, 극솟값은 $f(4)=16k$이고, 그 차가 $24$이므로<br>$20k-16k=24$, $4k=24\\therefore k=6$", "k": "c5", "c": ["$2$", "$4$", "$6$", "$8$", "$10$"], "a": "$6$", "q": "함수 $f(x)=kx^{3}-9kx^{2}+24kx$가 극댓값과 극솟값을 가지고 그 차가 $24$일 때, 양수 $k$의 값은?", "key": "Tm05-05"}, "x05x107-051": {"id": "x05x107-051", "unit": "m05", "theme": "05", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=2x^{3}+ax^{2}+bx+c$ ($a$, $b$, $c$는 상수)라 하면<br>$f'(x)=6x^{2}+2ax+b$<br>함수 $f(x)$가 $x=0$에서 극솟값을 가지므로<br>$f'(0)=0$에서 $b=0\\cdots \\cdots $㉠<br>$x=-3$에서 극댓값 $2$를 가지므로<br>$f'(-3)=0$, $f(-3)=2$<br>$f'(-3)=0$에서 $54-6a+b=0\\cdots \\cdots $㉡<br>$f(-3)=2$에서 $-54+9a-3b+c=2\\cdots \\cdots $㉢<br>㉠, ㉡, ㉢에서 $a=9$, $b=0$, $c=-25$<br>따라서 $f(x)=2x^{3}+9x^{2}-25$이므로 극솟값은<br>$f(0)=-25$", "k": "num", "a": "-25", "q": "최고차항의 계수가 $2$인 삼차함수 $f(x)$가 $x=0$에서 극솟값을 가지고 $x=-3$에서 극댓값 $2$를 가질 때, $f(x)$의 극솟값을 구하시오.", "key": "Tm05-05"}, "x05x107-052": {"id": "x05x107-052", "unit": "m05", "theme": "05", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$g(x)=(x^{3}+2)f(x)$에서 $g'(x)=3x^{2}f(x)+(x^{3}+2)f'(x)$<br>함수 $g(x)$가 $x=1$에서 극솟값 $24$를 가지므로<br>$g(1)=24$, $g'(1)=0$<br>$g(1)=24$에서 $3f(1)=24$이므로 $f(1)=8$<br>$g'(1)=0$에서 $3\\,f(1)+3f'(1)=0$이므로<br>$3\\times 8+3f'(1)=0\\therefore f'(1)=-8$<br>$\\therefore f(1)-f' (1)=8-(-8)=16$", "k": "num", "a": "16", "q": "두 다항함수 $f(x)$와 $g(x)$가 모든 실수 $x$에 대하여 $g(x)=(x^{3}+2)f(x)$를 만족시킨다. 함수 $g(x)$가 $x=1$에서 극솟값 $24$를 가질 때, $f(1)-f'(1)$의 값을 구하시오.", "key": "Tm05-05"}, "x05x107-053": {"id": "x05x107-053", "unit": "m05", "theme": "05", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "(가)에서 $\\lim\\limits _{x\\,\\rightarrow \\,\\infty }{\\,}\\dfrac{f(x)}{x^{3}}=1$이므로 $f(x)$는 삼차항의 계수가 $1$인 삼차함수이다.<br>즉, $f'(x)$는 이차항의 계수가 $3$인 이차함수이고 (나)에서 함수 $f(x)$가 $x=-1$과 $x=2$에서 극값을 가지므로<br>$f' (-1)=0$, $f'(2)=0$<br>즉, $f'(x)=3(x+1)(x-2)$<br>$\\therefore \\lim\\limits _{h\\,\\rightarrow \\,0}{\\,}\\dfrac{f(3+h)-f(3-h)}{h}$<br>$=\\lim\\limits _{h\\,\\rightarrow \\,0}{\\,}\\dfrac{\\left\\{f(3+h)-f(3)\\right\\}-\\left\\{f(3-h)-f(3)\\right\\}}{h}$<br>$=\\lim\\limits _{h\\,\\rightarrow \\,0}{\\,}\\dfrac{f(3+h)-f(3)}{h}+\\lim\\limits _{h\\,\\rightarrow \\,0}{\\,}\\dfrac{f(3-h)-f(3)}{-h}$<br>$=2f'(3)=2\\times 12=24$", "k": "c5", "c": ["$8$", "$12$", "$16$", "$20$", "$24$"], "a": "$24$", "q": "다항함수 $f(x)$는 다음 조건을 만족시킨다.<br>(가) $\\lim\\limits _{x\\,\\rightarrow \\,\\infty }{\\,}\\dfrac{f(x)}{x^{3}}=1$<br>(나) $x=-1$과 $x=2$에서 극값을 가진다.<br>$\\lim\\limits _{h\\,\\rightarrow \\,0}{\\,}\\dfrac{f(3+h)-f(3-h)}{h}$의 값은?", "key": "Tm05-05"}, "x05x107-054": {"id": "x05x107-054", "unit": "m05", "theme": "05", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=2x^{3}-9x^{2}+ax+5$에서<br>$f' (x)=6x^{2}-18x+a$<br>함수 $f(x)$가 $x=1$에서 극대이므로 $f'(1)=0$<br>$6-18+a=0\\therefore \\;a=12$<br>즉, $f' (x)=6x^{2}-18x+12=6(x-1)(x-2)$<br>$f'(x)=0$인 $x$의 값은 $x=1$ 또는 $x=2$<br>함수 $f(x)$의 증가, 감소를 표로 나타내면 다음과 같다.<br>${x}{\\cdots }1{\\cdots }2{\\cdots }{f' (x)}+0-0+{f(x)}\\nearrow $극대$\\searrow $극소$\\nearrow $<br>함수 $f(x)$는 $x=2$에서 극소이므로 $b=2$<br>$\\therefore \\;a+b=12+2=14$", "k": "c5", "c": ["$12$", "$14$", "$16$", "$18$", "$20$"], "a": "$14$", "q": "함수 $f(x)=2x^{3}-9x^{2}+ax+5$는 $x=1$에서 극대이고, $x=b$에서 극소이다. $a+b$의 값은? (단, $a$, $b$는 상수이다.)", "key": "Tm05-05"}, "x05x107-055": {"id": "x05x107-055", "unit": "m05", "theme": "05", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=ax^{3}+bx+a$에서 $f' (x)=3ax^{2}+b$<br>함수 $f(x)$가 $x=1$에서 극솟값 $-2$를 가지므로<br>$f(1)=-2$, $f'(1)=0$<br>$f(1)=-2$에서<br>$a+b+a=-2\\therefore \\;2a+b=-2\\cdots \\cdots $ ㉠<br>$f'(1)=0$에서<br>$3a+b=0\\cdots \\cdots $ ㉡<br>㉠과 ㉡을 연립하여 풀면<br>$a=2$, $b=-6$<br>즉, $f(x)=2x^{3}-6x+2$이므로<br>$f' (x)=6x^{2}-6=6(x+1)(x-1)$<br>$f'(x)=0$인 $x$의 값은 $x=-1$ 또는 $x=1$<br>함수 $f(x)$의 증가, 감소를 표로 나타내면 다음과 같다.<br>${x}{\\cdots }-1{\\cdots }1{\\cdots }{f' (x)}+0-0+{f(x)}\\nearrow 6$<br>극대$\\searrow -2$<br>극소$\\nearrow $<br>따라서 함수 $f(x)$는 $x=-1$에서 극댓값 $6$을 가진다.", "k": "num", "a": "6", "q": "두 상수 $a$, $b$에 대하여 삼차함수 $f(x)=ax^{3}+bx+a$는 $x=1$에서 극소이다. 함수 $f(x)$의 극솟값이 $-2$일 때, 함수 $f(x)$의 극댓값을 구하시오.", "key": "Tm05-05"}, "x05x107-056": {"id": "x05x107-056", "unit": "m05", "theme": "05", "벌": "X05x107", "lvl": 2, "fix": true, "src": "문제집 수매씽", "w": "$f(x)=-x^{4}+8a^{2}x^{2}-1$에서<br>$f' (x)=-4x^{3}+16a^{2}x=-4x(x+2a)(x-2a)$<br>$f'(x)=0$인 $x$의 값은 $x=-2a$ 또는 $x=0$ 또는 $x=2a$<br>$a>0$이므로 함수 $f(x)$의 증가, 감소를 표로 나타내면 다음과 같다.<br>${x}{\\cdots }-2a{\\cdots }0{\\cdots }2a{\\cdots }{f' (x)}+0-0+0-{f(x)}\\nearrow $극대$\\searrow $극소$\\nearrow $극대$\\searrow $<br>이때 함수 $f(x)$가 $x=b$, $x=2-2b$에서 극대이고, $b>1$이므로<br>$-2a=2-2b$, $2a=b$<br>두 식을 연립하여 풀면 $a=1$, $b=2$<br>$\\therefore a+b=3$", "k": "c5", "c": ["$3$", "$5$", "$7$", "$9$", "$11$"], "a": "$3$", "q": "함수 $f(x)=-x^{4}+8a^{2}x^{2}-1$이 $x=b$와 $x=2-2b$에서 극대일 때, $a+b$의 값은? (단, $a$, $b$는 $a>0$, $b>1$인 상수이다.)", "key": "Tm05-05"}, "x05x13-020": {"id": "x05x13-020", "unit": "m05", "theme": "05", "벌": "X05x13", "lvl": 2, "fix": true, "src": "주간고사 7회", "w": "$f(x)=-\\dfrac{1}{2}x^{3}+\\dfrac{3}{4}ax^{2}+16$에서<br>$f'(x)=-\\dfrac{3}{2}x^{2}+\\dfrac{3a}{2}x=-\\dfrac{3}{2}x(x-a)$<br>$f'(x)=0$에서<br>$x=a$ 또는 $x=0$<br>곡선 $y=f(x)$가 $x$축에 접하므로 함수 $f(x)$의 극값이<br>0이다.<br>즉, $f(0)=0$ 또는 $f(a)=0$<br>$f(0)=16$이므로 $f(a)=0$이어야 한다.<br>$f(a)=-\\dfrac{1}{2}a^{3}+\\dfrac{3}{4}a^{3}+16=\\dfrac{1}{4}a^{3}+16=0$<br>$\\dfrac{1}{4}(a^{3}+64)=0,\\;\\dfrac{1}{4}(a+4)(a^{2}-4a+16)=0$<br>모든 실수 $a$에 대하여<br>$a^{2}-4a+16=(a-2)^{2}+12>0$이므로<br>$a=-4$<br>따라서 $f(x)=-\\dfrac{1}{2}x^{3}-3x^{2}+16$ 이므로<br>$f(-a)=f(4)$<br>$=-32-48+16$<br>$=-64$", "k": "c5", "c": ["$-68$", "$-66$", "$-64$", "$-62$", "$-60$"], "a": "$-64$", "q": "함수 $f(x)=-\\dfrac{1}{2}x^{3}+\\dfrac{3}{4}ax^{2}+16$에 대하여 곡선 $y=f(x)$가 $x$축에 접할 때, $f(-a)$의 값은? (단, $a$는 실수이다.)<br>", "key": "Tm05-05"}, "x05x53-077": {"id": "x05x53-077", "unit": "m05", "theme": "05", "벌": "X05x53", "lvl": 2, "fix": true, "src": "문제집 개념원리", "w": "$f(x)=ax^{3}+bx^{2}+3bx+2$에서<br>$f' (x)=3ax^{2}+2bx+3b$<br>함수 $f(x)$가 $x=-1$에서 극댓값, $x=3$에서 극솟값을 가지므로<br>$f'(-1)=0$, $f'(3)=0$<br>$3a-2b+3b=0$, $27a+6b+3b=0$<br>$\\therefore \\;b=-3a\\cdots \\cdots $㉠<br>또 극댓값과 극솟값의 차가 $32$이므로<br>$f(-1)-f(3)=32$<br>$(-a+b-3b+2)-(27a+9b+9b+2)=32$<br>$\\therefore \\;7a+5b=-8\\cdots \\cdots $㉡<br>㉠을 ㉡에 대입하면<br>$7a-15a=-8$<br>$\\therefore \\;a=1$<br>$a=1$을 ㉠에 대입하면<br>$b=-3$<br>$\\therefore \\;ab=-3$", "k": "num", "a": "-3", "q": "함수 $f(x)=ax^{3}+bx^{2}+3bx+2(a>0)$가 $x=-1$에서 극댓값, $x=3$에서 극솟값을 갖고 극댓값과 극솟값의 차가 $32$일 때, 상수 $a$, $b$에 대하여 $ab$의 값을 구하시오.", "key": "Tm05-05"}, "x05x53-078": {"id": "x05x53-078", "unit": "m05", "theme": "05", "벌": "X05x53", "lvl": 2, "fix": true, "src": "문제집 개념원리", "w": "$f(x)=x^{3}+ax^{2}-24x+b$에서<br>$f'(x)=3x^{2}+2ax-24$<br>함수 $f(x)$가 $x=-4$에서 극댓값을 가지므로<br>$f'(-4)=0$<br>$48-8a-24=0\\therefore \\;a=3$<br>$\\therefore f(x)=x^{3}+3x^{2}-24x+b$,<br>$f'(x)=3x^{2}+6x-24=3(x+4)(x-2)$<br>$f'(x)=0$에서<br>$x=-4$ 또는 $x=2$<br>함수 $f(x)$의 증가와 감소를 표로 나타내면 다음과 같다.<br>${x}{\\cdots }-4{\\cdots }2{\\cdots }{f' (x)}+0-0+{f(x)}\\nearrow b+80\\searrow b-28\\nearrow $<br>따라서 함수 $f(x)$는<br>$x=-4$에서 극댓값 $b+80$,<br>$x=2$에서 극솟값 $b-28$<br>을 가지므로<br>$b+80=d$, $c=2$, $b-28=2$<br>$\\therefore \\;b=30$, $c=2$, $d=110$<br>$\\therefore \\;a+b+c+d=145$", "k": "num", "a": "145", "q": "함수 $f(x)=x^{3}+ax^{2}-24x+b$가 $x=c$에서 극솟값 $2$, $x=-4$에서 극댓값 $d$를 가질 때, $a+b+c+d$의 값을 구하시오.<br>(단, $a$, $b$는 상수이다.)", "key": "Tm05-05"}, "x05x59-026": {"id": "x05x59-026", "unit": "m05", "theme": "05", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(x)=3x^{4}-4x^{3}-12x^{2}+3$에서<br>$f' (x)=12x^{3}-12x^{2}-24x=12x(x+1)(x-2)$<br>$f' (x)=0$에서 $x=\\,-1$ 또는 $x=0$ 또는 $x=2$<br>$x\\cdots \\mathrm{-1}\\cdots \\mathrm{0}\\cdots \\mathrm{2}\\cdots f' (x)-\\mathrm{0}+\\mathrm{0}-\\mathrm{0}+f(x)\\searrow \\mathrm{-2}\\nearrow \\mathrm{3}\\searrow \\mathrm{-29}\\nearrow $<br>따라서 함수 $f(x)$는 $x=\\,-1$일 때 극솟값 $-2$, $x=0$일 때 극댓값 $3$, $x=2$일 때 극솟값 $\\mathrm{-29}$를 가지므로 구하는 극값의 합은<br>$-2+3+(-29)=\\,-28$", "k": "c5", "c": ["$\\mathrm{-31}$", "$\\mathrm{-28}$", "$\\mathrm{-23}$", "$\\mathrm{-18}$", "$\\mathrm{-12}$"], "a": "$\\mathrm{-28}$", "q": "함수 $f(x)=3x^{4}-4x^{3}-12x^{2}+3$의 모든 극값의 합은?", "key": "Tm05-05"}, "x05x59-029": {"id": "x05x59-029", "unit": "m05", "theme": "05", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(x)=\\,-x^{3}+ax+b$에서<br>$f'(x)=\\,-3x^{2}+a$<br>함수 $f(x)$가 $x=1$에서 극댓값 $6$을 가지므로<br>$f(1)=6$, $f'(1)=0$<br>$-1+a+b=6$, $-3+a=0$<br>$\\therefore \\;a=3$, $b=4$<br>즉 $f(x)=\\,-x^{3}+3x+4$이므로<br>$f'(x)=\\,-3x^{2}+3=\\,-3(x+1)(x-1)$<br>$x\\cdots -1\\cdots 1\\cdots f'(x)-0+0-f(x)\\searrow 2\\nearrow 6\\searrow f'(x)=0$에서 $x=\\,-1$ 또는 $x=1$<br>따라서 함수 $f(x)$는<br>$x=\\,-1$에서 극솟값 $2$를 갖는다.", "k": "num", "a": "2", "q": "함수 $f(x)=\\,-x^{3}+ax+b$가 $x=1$에서 극댓값 $6$을 가질 때, 함수 $f(x)$의 극솟값을 구하시오. (단, $a$, $b$는 상수이다.)", "key": "Tm05-05"}, "x05x59-032": {"id": "x05x59-032", "unit": "m05", "theme": "05", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(x)=\\,-x^{3}-\\dfrac{3}{2}ax^{2}+6a^{2}x$에서<br>$f' (x)=\\,-3x^{2}-3ax+6a^{2}=\\,-3(x+2a)(x-a)$<br>$f' (x)=0$에서 $x=\\,-2a$ 또는 $x=a$<br>$x\\cdots -2a\\cdots a\\cdots f' (x)-\\mathrm{0}+\\mathrm{0}-f(x)\\searrow -10a^{3}\\nearrow \\dfrac{7}{2}a^{3}\\searrow $<br>$a>0$이므로 함수 $f(x)$는 $x=\\,-2a$에서 극솟값 $-10a^{3}$을 갖고, $x=a$에서 극댓값 $\\dfrac{7}{2}a^{3}$을 갖는다.<br>이때 극댓값과 극솟값의 차가 $\\dfrac{1}{2}$이므로<br>$\\dfrac{7}{2}a^{3}-(-10a^{3})=\\dfrac{1}{2}$, $a^{3}=\\dfrac{1}{27}$<br>$\\therefore \\;a=\\dfrac{1}{3}$", "k": "num", "a": "1/3", "q": "함수 $f(x)=\\,-x^{3}-\\dfrac{3}{2}ax^{2}+6a^{2}x$의 극댓값과 극솟값의 차가 $\\dfrac{1}{2}$일 때, 양수 $a$의 값을 구하시오.", "key": "Tm05-05"}, "x05x75-020": {"id": "x05x75-020", "unit": "m05", "theme": "05", "벌": "X05x75", "lvl": 2, "fix": true, "src": "문제집 바이블개념ON", "w": "$f(x)=x^{3}+ax^{2}+bx+7$에서<br>$f' (x)=3x^{2}+2ax+b$<br>함수 $f(x)$가 $x=-3$에서 극댓값 $7$을 가지므로<br>$f' (-3)=0,\\;f(-3)=7$<br>$f' (-3)=27-6a+b=0$에서 $6a-b=27\\cdots \\cdots $㉠<br>$f(-3)=-27+9a-3b+7=7$에서 $3a-b=9\\cdots \\cdots $㉡<br>㉠, ㉡에서 $a=6,\\;b=9$이므로<br>$f(x)=x^{3}+6x^{2}+9x+7$<br>$f' (x)=3x^{2}+12x+9=3(x+1)(x+3)$<br>$f' (x)=0$에서 $x=-3$ 또는 $x=-1$<br>함수 $f(x)$의 증가와 감소를 표로 나타내면 다음과 같다.<br>$x\\cdots -3\\cdots -1\\cdots f' (x)+0-0+f(x)\\nearrow 7\\searrow 3\\nearrow $<br>따라서 함수 $f(x)$는 $x=-1$에서 극솟값 $3$을 갖는다.", "k": "num", "a": "3", "q": "함수 $f(x)=x^{3}+ax^{2}+bx+7$이 $x=-3$에서 극댓값 $7$을 가질 때, 함수 $f(x)$의 극솟값을 구하시오. (단, $a,\\;b$는 상수이다.)", "key": "Tm05-05"}, "x05x75-021": {"id": "x05x75-021", "unit": "m05", "theme": "05", "벌": "X05x75", "lvl": 2, "fix": true, "src": "문제집 바이블개념ON", "w": "$f(x)=-x^{3}+ax^{2}+bx+10$에서<br>$f' (x)=-3x^{2}+2ax+b$<br>함수 $f(x)$가 $x=-3$에서 극솟값 $-17$을 가지므로<br>$f' (-3)=0$, $f(-3)=-17$<br>$f' (-3)=-27-6a+b=0$에서<br>$6a-b=-27\\cdots \\cdots $㉠<br>$f(-3)=27+9a-3b+10=-17$에서<br>$3a-b=-18\\cdots \\cdots $㉡<br>㉠, ㉡에서 $a=-3$, $b=9$이므로<br>$f(x)=-x^{3}-3x^{2}+9x+10$<br>$f' (x)=-3x^{2}-6x+9=-3(x+3)(x-1)$<br>$f' (x)=0$에서 $x=-3$ 또는 $x=1$<br>함수 $f(x)$의 증가와 감소를 표로 나타내면 다음과 같다.<br>$x\\cdots -3\\cdots 1\\cdots f' (x)-0+0-f
