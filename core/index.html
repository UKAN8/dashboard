      LOOP_C_ITEMS=3, LOOP_C_KEYS=2, LOOP_T=3, BACK_C=2;

let TOK='', DEMO=false, NAME='', BAN='', TODAY='', SET=null, SKEY='';
let LOG=[];                      // [키, 문항ID, 정오, 확신, 모드, 'YYYY-MM-DDTHH:MM:SS'] 시간순
let UNL={};                      // 서버 mastery_unlock (키→날짜)
let CLASS=null, SKEW=0, HOME_OPEN=null;          // (1018) 오늘 우리 반 수업 [[시작,끝],…] · 서버-기기 시계 차(ms). CLASS=null 이면 미리보기(항상 열림)
const ITEMS=BANK.items;
const BYKEY={}; Object.values(ITEMS).forEach(x=>(BYKEY[x.key]=BYKEY[x.key]||[]).push(x));
let CONCEPTS=[], CBYKEY={}, TKEY2C={};

/* ── 기기 임시 저장 ── */
const LK=k=>'core:'+(SKEY||'x')+':'+(DEMO?'demo':TOK.slice(0,8))+':'+k;
const lget=(k,d)=>{ try{ const v=localStorage.getItem(LK(k)); return v?JSON.parse(v):d; }catch(e){ return d; } };
const lset=(k,v)=>{ try{ localStorage.setItem(LK(k),JSON.stringify(v)); }catch(e){} };

/* ── 날짜 ── */
const dnum=s=>{ const [y,m,d]=s.slice(0,10).split('-').map(Number); return Math.round(Date.UTC(y,m-1,d)/864e5); };
function nowKST(){ const d=new Date(Date.now()+9*36e5).toISOString().slice(0,19);
  return (DEMO&&TODAY)? TODAY+d.slice(10) : d; }   // 미리보기는 &today= 날짜로 찍는다

/* ── 수업 시간 (1018) — [수업 리뷰]는 수업 시작~끝에만 연다. 서버도 그 시간 밖의 리뷰 기록은 안 받는다(schema_v40) ── */
const hm=s=>{ const [h,m]=String(s).split(':').map(Number); return h*60+(m||0); };
function nowMin(){ const d=new Date(Date.now()+SKEW+9*36e5); return d.getUTCHours()*60+d.getUTCMinutes(); }
function inClass(){ if(CLASS===null) return true; const n=nowMin(); return CLASS.some(([a,b])=>n>=hm(a) && n<=hm(b)); }
function afterClass(){ if(CLASS===null||!CLASS.length) return true; const n=nowMin(); return n>Math.max(...CLASS.map(([a,b])=>hm(b))); }
function reviewCN(){ const k=lastClassConcepts().length; return k?2*k:REVIEW_C; }   // (1019) 개념마다 2문항 — 두 날을 합친 리뷰(고1T 10/24: 개념 4개 → 8문항)도 같은 규칙
function reviewDone(){ const n=todayRows('리뷰'), c=reviewCN(); return n>=c+REVIEW_T || lget('rdone_'+TODAY,false) || (n>=c && !reviewTypeKeys().length); }   // (1018) 리뷰는 하루 한 번
function classText(){
  if(!CLASS||!CLASS.length) return '오늘은 수업이 없는 날이에요. 수업 시간에 열려요';
  return '수업 시간에 열려요 · 오늘 '+CLASS.map(([a,b])=>a+'~'+b).join(', ');
}

/* ── 수식 ── */
function tex(el){
  if(!el || typeof renderMathInElement!=='function') return;
  try{ renderMathInElement(el,{delimiters:[{left:'$',right:'$',display:false}],throwOnError:false,strict:'ignore'}); }catch(e){}
}
function waitKatex(cb,n=0){ if(typeof renderMathInElement==='function'||n>40) cb(); else setTimeout(()=>waitKatex(cb,n+1),100); }
/* 문항 글자: 이스케이프 후 줄바꿈만 살린다. ㄱ.·(가) 앞은 자동 줄바꿈 */
function T(s){
  let h=E(s).replace(/&lt;br\s*\/?&gt;/gi,'\n').replace(/&lt;(\/?)b&gt;/gi,'<$1b>');
  // 보기 나열은 줄을 나눈다(감리 R7: 수식 안·문장 속 빈칸 (가)는 건드리지 않는다)
  const M=[]; h=h.replace(/\$[^$]*\$/g,m=>{ M.push(m); return '\u0000'+(M.length-1)+'\u0001'; });
  h=h.replace(/\s+(?=[ㄱ-ㅎ]\.\s)/g,'\n');                                   // ㄱ. ㄴ. ㄷ.
  if(/(^|[.?:。\n]\s*)\(가\)\s/.test(h))                                        // (가)가 문장 머리에서 시작하는 '조건 나열'일 때만
    h=h.replace(/\s+(?=\((?:가|나|다|라|마)\)\s)/g,'\n');
  h=h.replace(/\u0000(\d+)\u0001/g,(_,i)=>M[+i]);
  return h.replace(/\n+/g,'<br>');
}

/* ── 상태 계산 ──
 * 인정 성공 = 정답+확실 이면서 '그날 그 문항의 첫 시도'(해설 보고 같은 문항을 다시 맞힌 건 안 센다).
 * 성공일 = 그날 서로 다른 인정 성공 문항 수 ≥ NEED.  (schema_v36 뷰와 같은 규칙) */
function succDays(rows,from){
  const need=BANK.need[rows.length?rows[0][0][0]:'T']||1;
  const first=new Set(), per={};
  rows.forEach((r,i)=>{ const d=r[5].slice(0,10), id=d+'|'+r[1]; const isFirst=!first.has(id); first.add(id);
    if(i>=from && isFirst && r[2] && r[3]==='확실') (per[d]=per[d]||new Set()).add(r[1]); });
  return Object.keys(per).filter(d=>per[d].size>=need).sort();
}
function keyState(k){
  const rows=LOG.filter(r=>r[0]===k);
  if(!rows.length) return {st:'new',n:0};
  let lastFail=-1; rows.forEach((r,i)=>{ if(!(r[2]&&r[3]==='확실')) lastFail=i; });
  const days=succDays(rows,lastFail+1);
  const last=rows[rows.length-1][5];
  if(days.length>=2 && dnum(days[days.length-1])-dnum(days[0])>=BANK.gap) return {st:'grad',n:rows.length,days,last};
  if(days.length>=1) return {st:'one',n:rows.length,days,last};
  return {st:lastFail>=0?'fail':'try',n:rows.length,last,failAt:lastFail>=0?rows[lastFail][5]:null};
}
function openDate(ck){ return UNL[ck] || ((SET.schedule[BAN]||{})[ck]) || null; }
function cOpen(ck){ const d=openDate(ck); return !!d && (d<TODAY || (d===TODAY && afterClass())); }   // (1018) 오늘 수업하는 개념은 수업이 끝난 뒤에 연다
function cPassed(ck){ const s=keyState(ck).st; return s==='one'||s==='grad'; }
function everPassed(ck){   // 한 번이라도 '1회'였던 개념(그때의 마지막 실패 뒤로만 센다)
  const rows=LOG.filter(r=>r[0]===ck);
  for(let j=1;j<=rows.length;j++){ const sub=rows.slice(0,j); let lf=-1; sub.forEach((r,i)=>{ if(!(r[2]&&r[3]==='확실')) lf=i; });
    if(succDays(sub,lf+1).length) return true; }
  return false;
}
function tOpen(tk){ return cOpen(TKEY2C[tk]) && everPassed(TKEY2C[tk]); }   // 열린 유형은 개념을 다시 틀려도 닫지 않는다
function isDue(k){
  const s=keyState(k);
  if(s.st==='grad') return false;
  if(s.st==='one') return dnum(TODAY)-dnum(s.days[s.days.length-1])>=BANK.gap;
  if(s.st==='try'||s.st==='fail'){ // 오늘 이미 성공일을 채웠으면 오늘은 끝
    return true; }
  return true; // new
}
const PRI={fail:0,try:1,one:2,new:3};

/* 문항 고르기 — 안 본 것 먼저, 오래전에 본 것, 같은 벌 연속 피하기. seed 가 있으면 반 공통 순서 */
function hash(s){ let h=2166136261; for(const c of s){ h^=c.charCodeAt(0); h=Math.imul(h,16777619);} return h>>>0; }
function tier(x){ return x.fix?(x.lvl||2):0; }   // CORE 자체 = 0, 외부 = 난이도 1~3
function pickItems(k,n,exclude,seed){
  const today=new Set(LOG.filter(r=>r[0]===k && r[5].slice(0,10)===TODAY).map(r=>r[1]));
  let its=(BYKEY[k]||[]).filter(x=>!exclude.has(x.id));
  if(its.some(x=>!today.has(x.id))) its=its.filter(x=>!today.has(x.id));   // 오늘 푼 문항은 다시 안 낸다(남는 게 없을 때만 허용)
  if(seed) return its.sort((a,b)=>hash(seed+a.id)-hash(seed+b.id)).slice(0,n);
  const seen={}; LOG.forEach(r=>{ if(r[0]===k) seen[r[1]]=r[5]; });
  const lastB=(()=>{ for(let i=LOG.length-1;i>=0;i--) if(LOG[i][0]===k){ const it=ITEMS[LOG[i][1]]; return it?it.벌:null; } return null; })();
  return its.map(x=>({x,s:seen[x.id]||'', r:hash(TODAY+x.id)}))
    // (1020 반복 피로 규칙) ① 안 본 문항 먼저 ② 본 것 중엔 가장 오래전 것 ③ 안 본 것 안에서는 CORE 자체 3벌 → 외부 문제집 하→중→중상
    //   ④ 직전과 같은 벌·같은 책은 피한다 ⑤ 오늘 푼 문항은 다시 안 낸다(위)
    .sort((a,b)=> (a.s===''?0:1)-(b.s===''?0:1) || a.s.localeCompare(b.s) || (a.s===''?(tier(a.x)-tier(b.x)):0) || ((a.x.벌===lastB)-(b.x.벌===lastB)) || a.r-b.r)
    .slice(0,n).map(o=>o.x);
}

/* ── 세션 구성 ── */
function lastClassConcepts(){
  const ds={}; CONCEPTS.forEach(c=>{ const d=openDate(c.key); if(d && d<TODAY) (ds[d]=ds[d]||[]).push(c.key); });
  const ks=Object.keys(ds).sort(); return ks.length?ds[ks[ks.length-1]]:[];
}
function dueTypes(exclude){
  const out=[];
  CONCEPTS.forEach(c=>c.themes.forEach(t=>{ if(tOpen(t.key) && isDue(t.key) && !exclude.has(t.key)) out.push(t.key); }));
  return out.sort((a,b)=>PRI[keyState(a).st]-PRI[keyState(b).st] || a.localeCompare(b));
}
function dueConcepts(){
  return CONCEPTS.filter(c=>cOpen(c.key) && isDue(c.key)).map(c=>c.key)
    .sort((a,b)=>PRI[keyState(a).st]-PRI[keyState(b).st] || a.localeCompare(b));
}
function buildReviewConcept(){
  const lc=lastClassConcepts(); const used=new Set(LOG.filter(r=>r[5].slice(0,10)===TODAY).map(r=>r[1])), out=[];
  if(!lc.length) return out;
  // 반 공통: 날짜 seed. 개념이 둘이면 하나씩
  const N=reviewCN();
  for(let i=0;out.length<N && i<N*2;i++){
    const k=lc[i%lc.length]; const p=pickItems(k,1,used,'R'+TODAY+BAN.slice(0,2)); if(p[0]){ used.add(p[0].id); out.push(p[0]); }
  }
  return out;
}
// (1019 A안) 유형 3칸 = 지난 수업 개념의 열린 유형을 개념마다 번갈아. 모자라면 다른 열린 유형(다시 볼 때 된 것).
// 개념 문항으로 채우지 않는다 — 개념을 놓친 학생은 리뷰가 개념 4로 끝나고 그 개념은 저녁 루프로 간다.
function reviewTypeKeys(){
  const rank=k=>{ const st=keyState(k).st; return (isDue(k)?0:10)+(PRI[st]!=null?PRI[st]:5); };
  const groups=lastClassConcepts().map(ck=>(CBYKEY[ck]?CBYKEY[ck].themes:[]).map(t=>t.key).filter(tOpen).sort((a,b)=>rank(a)-rank(b)||a.localeCompare(b)));
  const out=[];
  for(let i=0;out.length<REVIEW_T && groups.some(g=>g.length);i++){ const g=groups[i%groups.length]; if(g.length) out.push(g.shift()); }
  if(out.length<REVIEW_T) for(const k of dueTypes(new Set(out))){ if(out.length>=REVIEW_T) break; out.push(k); }
  return out;
}
function buildReviewType(usedIds){
  const out=[];
  for(const k of reviewTypeKeys()){ const p=pickItems(k,1,usedIds); if(p[0]){ usedIds.add(p[0].id); out.push(p[0]); } }
  return out;
}
function buildLoop(){
  const out=[], used=new Set();
  dueConcepts().slice(0,LOOP_C_KEYS).forEach(k=>pickItems(k,LOOP_C_ITEMS,used).forEach(x=>{ used.add(x.id); out.push(x); }));
  dueTypes(new Set()).slice(0,LOOP_T).forEach(k=>pickItems(k,1,used).forEach(x=>{ used.add(x.id); out.push(x); }));
  return out;
}
// (1020 유강 (가)) 루프 과제는 하루 1회 — 그날 처음 연 세트를 고정하고, 다 풀면 내일까지 닫는다.
//   틀린 것은 다음 날 루프로 돌아온다(같은 날 같은 유형을 끝없이 다시 내지 않는다 — 1019 T06 11회 사고).
//   세트는 이 기기 localStorage(lset_날짜)에 둔다. 다른 기기·저장소가 비었는데 오늘 루프 기록이 있으면 '오늘 완료'.
function loopToday(){
  const k='lset_'+TODAY, ids=lget(k,null);
  const done=new Set(LOG.filter(r=>r[5].slice(0,10)===TODAY && r[4]==='루프').map(r=>r[1]));
  if(ids){
    const rest=ids.filter(id=>!done.has(id)).map(id=>ITEMS[id]).filter(Boolean);
    return {items:rest, started:done.size>0, finished:!rest.length};
  }
  if(done.size) return {items:[], started:true, finished:true};
  const fresh=buildLoop();
  if(fresh.length) lset(k, fresh.map(x=>x.id));
  return {items:fresh, started:false, finished:false};
}
function loopAdd(id){ const k='lset_'+TODAY, ids=lget(k,[]); if(!ids.includes(id)){ ids.push(id); lset(k,ids); } }
function todayRows(mode){ return LOG.filter(r=>r[5].slice(0,10)===TODAY && r[4]===mode).length; }

/* ── 홈: 버튼 + 단원 지도 ── */
const ST_LABEL={lock:'잠김',new:'열림',try:'하는 중',fail:'다시',one:'1회',grad:'졸업'};
function cellState(k){
  if(k[0]==='C'){ if(!cOpen(k)) return 'lock'; }
  else if(!tOpen(k)) return 'lock';
  const s=keyState(k).st; return s==='try'?'new':s;
}
function drawHome(){
  document.body.classList.remove('sess');
  let tot=0, grad=0, open=0;
  CONCEPTS.forEach(c=>[c.key,...c.themes.map(t=>t.key)].forEach(k=>{ tot++; const s=cellState(k); if(s==='grad') grad++; if(s!=='lock') open++; }));
  const lc=lastClassConcepts(); const LT=(CLASS!==null && inClass())?{items:buildLoop(),started:false,finished:false}:loopToday(); const loop=LT.items;
  const rDone=reviewDone(), lDone=LT.finished, rOpen=inClass(), lLock=CLASS!==null && inClass();
  const H=[];
  H.push(`<div class="brand">수학은유강</div>`
    +`<div class="who"><b>${E(NAME)}</b>${BAN?`<span class="ban">${E(BAN)}</span>`:''}</div>`
    +`<div class="title"><b>CORE 루프</b> · ${E(SET.범위)}</div>`
    +`<div class="sum"><div><b>${grad}<small style="font-size:12px;color:var(--dim)">/${tot}</small></b><span>졸업</span></div>`
    +`<div><b>${open}</b><span>열림</span></div>`
    +`<div><b>${loop.length}</b><span>오늘 돌아온 문항</span></div></div>`);
  H.push(`<button class="go${rDone?' done':lc.length&&rOpen?'':' s'}" id="goR"><b>리뷰테스트 ${rDone?'· 오늘 완료':''}</b>`
    +`<span>${!lc.length?'아직 지난 수업이 없어요 — 첫 수업 다음부터 열려요':!rOpen?classText():`지난 수업 개념 ${reviewCN()} → 유형 ${REVIEW_T} · 연습지에 풀고 답만 넣어요`}</span></button>`);
  H.push(`<button class="go s${lDone?' done':''}" id="goL"><b>루프 과제 ${lLock?'· 수업 끝나고 열려요':lDone?'· 오늘 완료':loop.length?`· ${LT.started?'이어서 ':''}${loop.length}문항`:''}</b>`
    +`<span>${lLock?'수업 중에는 [리뷰테스트]만 풀어요':lDone?'루프는 하루 한 번이에요. 틀리거나 애매했던 건 내일 루프에 다시 와요':loop.length?`약 ${Math.max(3,Math.round(loop.filter(x=>x.key[0]==='C').length*0.7+loop.filter(x=>x.key[0]==='T').length*3.5))}분 · 다시 볼 때가 된 것만 골랐어요 · 하루 한 번`:'다시 볼 개념·유형이 없어요. 내일 다시 와요'}</span></button>`);
  H.push(`<div class="guide">개념을 <b>확실하게</b> 맞히면 그 개념의 유형이 열려요. 같은 개념·유형을 <b>3일 이상 떨어진 두 날</b> 확실하게 맞히면 졸업이에요.<br>`
    +`틀리거나 <b>애매</b>했던 개념·유형은 다시 돌아와요. 애매할 땐 애매하다고 눌러야 정확해져요.</div>`);
  H.push(`<div class="legend">${['lock','new','fail','one','grad'].map(s=>`<span class="chip ${s}">${ST_LABEL[s]}</span>`).join('')}</div>`);
  SET.units.forEach(U=>{
    H.push(`<div class="unit">${E(U.name)}</div>`);
    U.concepts.forEach(c=>{
      const cs=cellState(c.key); const od=openDate(c.key);
      H.push(`<div class="cp"><div class="ch1"><span class="chip ${cs}">개념 ${E(c.no)}</span>`
        +`<span class="nm">${E(c.title)}${cs==='lock'&&od?`<small>${+od.slice(5,7)}/${+od.slice(8)} 수업 뒤 열림</small>`:''}</span></div>`
        +`<div class="chips">${c.themes.map(t=>`<span class="chip ${cellState(t.key)}">${E(t.no)} ${E(t.name)}</span>`).join('')}</div></div>`);
    });
  });
  H.push(`<div class="foot">${DEMO?'<b>미리보기</b>예요. 기록이 저장되지 않아요.<br>'
    :`이 주소는 ${E(NAME)} 개인 링크예요. 다른 사람에게 전달하지 마세요.<br>`}`
    +`점수는 성적이랑 상관없어요. 기말까지 <b>모르는 개념·유형을 0개</b>로 만드는 게 목표예요.</div>`);
  $('app').innerHTML=H.join('');
  $('goR').onclick=()=>{ if(lc.length && inClass() && !reviewDone()) startSession('리뷰'); else drawHome(); };
  HOME_OPEN=rOpen;
  $('goL').onclick=()=>{ if(CLASS!==null && inClass()){ drawHome(); return; } if(loop.length) startSession('루프', loop); };
  window.scrollTo(0,0);
}

/* ── 풀이 세션 ── */
let S=null;   // {mode, q:[item], i, res:[], phase, used:Set}
function startSession(mode, preset){
  if(mode==='리뷰'){
    const c=buildReviewConcept(); S={mode,q:c,i:0,res:[],used:new Set(c.map(x=>x.id)),typeBuilt:false,back:0};
    if(!c.length){ S.typeBuilt=true; S.q=buildReviewType(S.used); }
  } else S={mode,q:preset,i:0,res:[],used:new Set(preset.map(x=>x.id)),typeBuilt:true,back:0};
  if(!S.q.length){ drawHome(); return; }
  drawItem();
}
function cOf(item){ return item.key[0]==='C'?CBYKEY[item.key]:CBYKEY[TKEY2C[item.key]]; }
function kindLabel(x){
  const c=cOf(x);
  if(x.key[0]==='C') return ['개념 '+c.no, c.title];
  const th=c.themes.find(t=>t.key===x.key); return ['유형 '+(th?th.no:''), th?th.name:''];
}
function cardHTML(c){
  return `<div class="cbox"><div class="ct">개념 정리 · ${E(c.title)}</div>`
    +c.card.map(([t,x])=>`<div class="cl"><em class="${t==='주의'?'ju':''}">${E(t)}</em><span>${x}</span></div>`).join('')+`</div>`;
}
function themeOf(x){ const c=cOf(x); return x.key[0]==='T'?(c.themes.find(t=>t.key===x.key)||null):null; }
// (1020 유강 '개념카드는 교재를 잘 활용') 유형 = 수업교재 CORE TRAINING 의 시선 + 예제(풀이 단계)
function bookHTML(th){
  const b=th&&th.book; if(!b) return '';
  return `<div class="bbox"><div class="ct">교재 · 유형 ${E(th.no)} ${E(th.name)}</div>`
    +(b.sight?`<div class="sg">${b.sight}</div>`:'')
    +(b.ex&&b.ex.body?`<div class="eh">교재 예제</div><div class="eb">${b.ex.body}</div>`
      +(b.ex.sol&&b.ex.sol.length?`<ol>${b.ex.sol.map(t=>`<li>${t}</li>`).join('')}</ol>`:'')
      +(b.ex.ans?`<div class="ea">답 ${b.ex.ans}</div>`:''):'')
    +`</div>`;
}
function drawItem(){
  document.body.classList.add('sess');
  const x=S.q[S.i]; const [kl,kn]=kindLabel(x); const n=S.q.length;
  let A='';
  if(x.k==='ox') A=`<div class="ox" id="ans"><button data-a="O">O</button><button data-a="X">X</button></div>`;
  else if(x.k==='c4'||x.k==='c5'){
    const order=x.fix?x.c.slice():x.c.map((c,j)=>({c,r:hash(x.id+j)})).sort((a,b)=>a.r-b.r).map(o=>o.c);   // 외부 문항은 해설이 ①~⑤로 말해서 순서 고정
    A=`<div class="chs" id="ans">${order.map((c,j)=>`<button data-a="${E(c)}"><em>${'①②③④⑤'[j]}</em>${T(c)}</button>`).join('')}</div>`;
  } else A=`<div class="num" id="ans"><input id="numIn" inputmode="numeric" autocomplete="off" placeholder="답"><button class="k" data-k="-">−</button><button class="k" data-k="/">/</button><button class="ok" id="numOk">답 넣기</button></div>`;
  const dots=S.q.map((_,j)=>`<i class="${j<S.res.length?(S.res[j].ok?'o':'x'):''}${j===S.i?' cur':''}"></i>`).join('');
  $('app').innerHTML=`<div class="top"><button class="back" id="bk">그만하기</button><div class="fname"><b>${S.mode==='리뷰'?'리뷰테스트':'루프 과제'}</b> · ${S.i+1}/${n}${S.mode==='리뷰'&&!S.typeBuilt?' + 유형':''}</div></div>`
    +`<div class="dots">${dots}</div>`
    +(S.note?`<div class="note">${S.note}</div>`:'')
    +`<div class="qwrap"><div class="qmain">`
    +`<div class="qcard"><div class="kind"><span>${E(kl)}</span><span>${E(kn)}</span></div><div class="q">${T(x.q)}</div>`
    +(x.key[0]==='T'?`<div class="sheet">✎ 연습지 ${S.q.slice(0,S.i+1).filter(z=>z.key[0]==='T').length}번에 풀고 답만 넣어요</div>`:'')+`</div>`
    +A
    +`<div class="conf" id="conf"><p>이 답, 얼마나 확실해요?</p><div class="row2"><button class="sure" data-c="확실">확실해요</button><button class="unsure" data-c="애매">애매해요</button></div></div>`
    +`<button class="next" id="nx">${S.i+1<n||(!S.typeBuilt)?'다음':'끝'}</button>`
    +`</div><div class="qside"><div class="res" id="res"></div><div id="cbx"></div><div id="bbx"></div></div></div>`;
  S.note=null; S.pick=null; S.t0=Date.now();
  tex($('app'));
  $('bk').onclick=()=>finish(true);
  const showConf=()=>{ $('conf').classList.add('show'); $('conf').scrollIntoView({block:'nearest',behavior:'smooth'}); };
  if(x.k==='num'){
    const inp=$('numIn');
    $('ans').querySelectorAll('.k').forEach(b=>b.onclick=()=>{ inp.value+=b.dataset.k==='-'?'-':'/'; inp.focus(); });
    const go=()=>{ const v=inp.value.trim(); if(!v) return; S.pick=v; inp.disabled=true; $('ans').querySelectorAll('button').forEach(b=>b.disabled=true); showConf(); };
    $('numOk').onclick=go; inp.onkeydown=e=>{ if(e.key==='Enter') go(); };
  } else {
    $('ans').querySelectorAll('button').forEach(b=>b.onclick=()=>{
      if($('conf').dataset.lock) return;
      $('ans').querySelectorAll('button').forEach(z=>z.classList.remove('on')); b.classList.add('on'); S.pick=b.dataset.a; showConf(); });
  }
  $('conf').querySelectorAll('button').forEach(b=>b.onclick=()=>grade(b.dataset.c));
  $('nx').onclick=next;
  window.scrollTo(0,0);
}
function frac(s){
  s=String(s).replace(/\s/g,'').replace(/[−–]/g,'-');
  const m=s.match(/^(-?)(\d+)(?:\/(\d+))?$/); if(!m) return null;
  return [ (m[1]?-1:1)*+m[2], m[3]?+m[3]:1 ];
}
function same(a,b){ const p=frac(a), q=frac(b); return !!p&&!!q&&q[1]!==0&&p[1]!==0&&p[0]*q[1]===q[0]*p[1]; }
function grade(conf){
  const x=S.q[S.i]; if($('conf').dataset.lock) return; $('conf').dataset.lock='1';
  const ok = x.k==='num' ? same(S.pick,x.a) : S.pick===x.a;
  const ms=Date.now()-S.t0;
  if(x.k==='num'){ $('ans').classList.add(ok?'right':'wrong'); }
  else $('ans').querySelectorAll('button').forEach(b=>{ b.disabled=true; if(b.dataset.a===x.a) b.classList.add('right'); else if(b.dataset.a===S.pick) b.classList.add('wrong'); });
  $('conf').querySelectorAll('button').forEach(b=>b.disabled=true);
  $('conf').style.display='none';
  const succ=ok&&conf==='확실';
  const r=$('res'); r.className='res show '+(succ?'o':ok?'u':'x');
  r.innerHTML=`<div class="h">${succ?'맞았어요':ok?'맞았지만 애매 — 다시 돌아와요':'틀렸어요'}</div>`
    +(ok?'':`<div class="w" style="margin-bottom:6px">정답: <b>${x.k==='ox'?x.a:T(x.a)}</b>${x.k==='num'?` · 내 답 ${E(S.pick)}`:''}</div>`)
    +`<div class="w">${T(x.w)}</div>`
    +`<div class="btn2"><button class="cardbtn" id="cb">개념 정리 보기</button>${themeOf(x)&&themeOf(x).book?'<button class="cardbtn bk" id="bb">교재 예제 보기</button>':''}</div>`;
  const c=cOf(x), th=themeOf(x);
  $('cb').onclick=()=>{ $('cbx').innerHTML=$('cbx').innerHTML?'':cardHTML(c); tex($('cbx')); };
  if($('bb')) $('bb').onclick=()=>{ $('bbx').innerHTML=$('bbx').innerHTML?'':bookHTML(th); tex($('bbx')); };
  // 틀리거나 애매하면 교재를 바로 펼쳐 둔다 — 개념은 개념 정리, 유형은 교재 예제(시선·풀이)
  if(!succ){ if(x.key[0]==='C'){ $('cbx').innerHTML=cardHTML(c); tex($('cbx')); } else if(th&&th.book){ $('bbx').innerHTML=bookHTML(th); tex($('bbx')); } }
  tex(r);
  const row={k:x.key,i:x.id,m:S.mode,a:String(S.pick).slice(0,40),o:ok,c:conf,ms:Math.min(ms,9999999)};
  S.res.push({x,ok:succ,raw:ok,conf});
  LOG.push([x.key,x.id,ok,conf,S.mode,nowKST()]);
  queue([row]);
  // 유형을 놓치면 그 개념으로 되돌림 — 개념 문항 하나 덧붙임(루프만, 최대 BACK_C)
  if(!succ && x.key[0]==='T' && S.mode==='루프' && S.back<BACK_C){
    const ck=TKEY2C[x.key]; const p=pickItems(ck,1,S.used);
    if(p[0]){ S.used.add(p[0].id); S.q.push(p[0]); S.back++; loopAdd(p[0].id); }
  }
  // 리뷰: 개념 파트를 끝내면 그 자리에서 유형을 고른다(방금 열린 유형 포함)
  if(S.mode==='리뷰' && !S.typeBuilt && S.i===S.q.length-1){
    S.typeBuilt=true; const before=new Set(CONCEPTS.flatMap(c=>c.themes.map(t=>t.key)).filter(tOpen));
    const ty=buildReviewType(S.used); ty.forEach(t=>S.used.add(t.id)); S.q.push(...ty);
    const now=CONCEPTS.flatMap(c=>c.themes.map(t=>t.key)).filter(tOpen).filter(k=>!before.has(k));
    if(now.length) S.nextNote=`유형 ${now.length}개가 열렸어요 — 바로 이어서 풀어요`;
  }
  $('nx').textContent=S.i+1<S.q.length?'다음':'끝'; $('nx').classList.add('show');
  $('nx').scrollIntoView({block:'nearest',behavior:'smooth'});
}
function next(){ S.i++; if(S.nextNote){ S.note=S.nextNote; S.nextNote=null; } if(S.i<S.q.length) drawItem(); else finish(false); }

async function finish(early){
  document.body.classList.remove('sess');
  const res=S.res; if(!res.length){ drawHome(); return; }
  const okN=res.filter(r=>r.ok).length;
  const L=res.map(r=>{ const [kl,kn]=kindLabel(r.x); const cls=r.ok?'lo':r.raw?'lu':'lx';
    return `<div class="${cls}"><em>${r.ok?'확실':r.raw?'애매':'다시'}</em>${E(kl)} · ${E(kn)}</div>`; }).join('');
  $('app').innerHTML=`<div class="done"><b>${early?'여기까지':'끝'} — 확실히 맞힌 것 ${okN}/${res.length}</b>`
    +`<p>${okN===res.length?'전부 확실해요. 이 개념·유형들은 며칠 뒤 한 번 더 보면 졸업이에요.':'틀리거나 애매했던 건 다음 루프에 다시 와요.'}</p>`
    +`<div class="save" id="sv">기록 보내는 중…</div></div><div class="list">${L}</div>`
    +`<div class="btns"><button class="p" id="home">단원 지도 보기</button></div>`;
  if(S.mode==='리뷰' && !early) lset('rdone_'+TODAY,true);
  $('home').onclick=drawHome; S=null;
  const ok=await flush();
  const sv=$('sv'); if(sv){ sv.textContent=ok?'기록 저장됨':'인터넷이 불안정해서 이 기기에 보관했어요. 다음에 열면 자동으로 보내요'; if(!ok) sv.classList.add('bad'); }
}

/* ── 보내기(대기열) ── */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,10);
function queue(rows){ const q=lget('queue',[]).concat(rows.map(r=>({...r,u:r.u||uid(),t:r.t||nowKST()}))); lset('queue',q); flush(); }
let flushing=false;
async function flush(){
  if(DEMO){ lset('demo_log',LOG); lset('queue',[]); return true; }
  if(!sb) return !lget('queue',[]).length;
  if(flushing){ for(let w=0;w<60&&flushing;w++) await new Promise(r=>setTimeout(r,250)); if(!lget('queue',[]).length) return true; if(flushing) return false; }
  flushing=true;
  try{
    // 보낸 행은 uid 로 지운다 — 보내는 동안 새로 쌓인 행을 덮어쓰지 않게(감리 M1). 재전송은 서버 uid 유일키가 막는다(M2)
    for(let guard=0; guard<50; guard++){
      const q=lget('queue',[]); if(!q.length) return true;
      const chunk=q.slice(0,30);
      const {data,error}=await sb.rpc('mastery_submit',{tok:TOK,skey:SKEY,recs:chunk});
      if(error||!data) return false;
      const sent=new Set(chunk.map(r=>r.u));
      lset('queue',lget('queue',[]).filter(r=>!sent.has(r.u)));
    }
    return !lget('queue',[]).length;
  }catch(e){ return false; } finally{ flushing=false; }
}

/* ── 시작 ── */
function setup(){
  SET=BANK.sets[SKEY];
  CONCEPTS=SET.units.flatMap(u=>u.concepts); CBYKEY={}; TKEY2C={};
  CONCEPTS.forEach(c=>{ CBYKEY[c.key]=c; c.themes.forEach(t=>TKEY2C[t.key]=c.key); });
}
function pickSet(ban){
  const g=(ban||'').slice(0,2);
  return Object.keys(BANK.sets).find(k=>BANK.sets[k].학년===g)||null;
}
async function boot(){
  const P=new URLSearchParams(location.search);
  TOK=(P.get('t')||'').trim(); DEMO=P.get('demo')==='1';
  if(DEMO){
    NAME='미리보기'; BAN=P.get('ban')||'고1A'; SKEY=pickSet(BAN); if(!SKEY) SKEY='core_m2';
    TODAY=(P.get('today')||nowKST()).slice(0,10); setup();
    if(P.get('class')) CLASS=P.get('class').split(',').map(x=>x.split('-'));   // 미리보기: &class=15:00-17:00
    LOG=lget('demo_log',[]);
  } else {
    if(TOK.length<16){ $('msg').innerHTML='<b>링크가 올바르지 않아요</b>포털에서 다시 들어와 주세요.'; return; }
    if(!sb){ $('msg').innerHTML='<b>연결이 안 돼요</b>잠시 뒤 다시 열어 주세요.'; return; }
    // 학년을 모르니 두 세트를 차례로 연다 — 반이 정해지면 맞는 세트로
    let d=null;
    try{ const r=await sb.rpc('mastery_open',{tok:TOK,skey:'core_m2'}); d=r.data; }catch(e){}
    if(!d){ $('msg').innerHTML='<b>열 수 없는 링크예요</b>쌤에게 새 링크를 받아 주세요.'; return; }
    NAME=d.이름; BAN=d.반; TODAY=d.오늘; SKEY=pickSet(BAN);
    CLASS=Array.isArray(d.수업)?d.수업:[];    // 서버가 시간표를 안 주면(v40 전) 리뷰는 닫힌다
    if(d.지금){ const t=Date.parse(d.지금+'+09:00'); if(!isNaN(t)) SKEW=t-Date.now(); }
    if(!SKEY){ $('msg').innerHTML='<b>아직 이 반은 CORE 루프가 없어요</b>'; return; }
    if(SKEY!=='core_m2'){ try{ const r=await sb.rpc('mastery_open',{tok:TOK,skey:SKEY}); d=r.data||d; }catch(e){} }
    setup();
    LOG=(d.기록||[]).map(r=>[r[0],r[1],r[2],r[3],r[4],r[5]]); UNL=d.열림||{};
    // 아직 못 보낸 기록도 상태에 반영
    lget('queue',[]).forEach(r=>LOG.push([r.k,r.i,r.o,r.c,r.m,r.t||nowKST()]));
    LOG.sort((a,b)=>a[5].localeCompare(b[5]));
    flush();
  }
  $('msg').style.display='none'; $('app').style.display='block';
  waitKatex(drawHome);
}
boot();

setInterval(()=>{ if(!S && SET && $('app').style.display==='block' && HOME_OPEN!==null && inClass()!==HOME_OPEN) drawHome(); }, 20000);
// 자정을 넘겨 열어 둔 페이지는 다시 연다(감리 R8) — 풀이 중이면 건드리지 않는다
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && !DEMO && !S && TODAY && nowKST().slice(0,10)!==TODAY) location.reload(); });
