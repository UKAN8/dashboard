const BANK={"sets": {"core_m2": {"제목": "CORE 루프 · 공통수학2", "범위": "07 명제 ~ 10 무리함수 (기말)", "학년": "고1", "set": "core_m2", "units": [{"code": "07", "name": "07 명제", "concepts": [{"key": "C07-01", "no": "01", "title": "명제와 조건", "themes": [{"key": "T07-01", "no": "01", "name": "명제와 조건의 부정", "book": {"sight": "부정은 진리집합의 <b>여집합<\/b>이다. ‘또는’과 ‘그리고’를 서로 바꾸고, 부등호는 <b>등호까지 반대쪽으로<\/b> 옮긴다. ‘$=$’의 부정은 ‘$\\ne $’이다.", "ex": {"body": "실수 $x$에 대한 조건 ‘$x&lt;-2$ 또는 $x\\ge 4$’의 부정을 말하고, 전체집합이 $U=\\{x\\mid |x|\\le 5,\\ x\\text{는 정수}\\}$일 때 그 진리집합의 원소의 개수를 구하시오.", "sol": ["‘또는’을 ‘그리고’로 바꾸고 각 부등식을 부정하면 ‘$x\\ge -2$ 그리고 $x&lt;4$’", "곧 부정은 $-2\\le x&lt;4$이다.", "$U=\\{-5,\\,-4,\\,\\cdots,\\,5\\}$에서 진리집합은 $\\{-2,\\,-1,\\,0,\\,1,\\,2,\\,3\\}$"], "ans": "$-2\\le x&lt;4$, 원소 $6$개"}}}, {"key": "T07-02", "no": "02", "name": "진리집합과 명제의 참·거짓", "book": {"sight": "$p\\to q$의 참·거짓은 <b>$P\\subset Q$인지<\/b>로 판정한다. 조건을 진리집합(수직선·벤 다이어그램)으로 옮기고, 거짓이면 $P-Q$의 원소 하나를 반례로 든다. 집합의 연산식이 주어지면 먼저 정리해 포함 관계 하나로 만든다.", "ex": {"body": "실수 $x$에 대한 두 조건 $p:|x-1|&lt;2$, $q:x^{2}-2x-8&lt;0$에 대하여 두 명제 $p\\to q$, $q\\to p$의 참, 거짓을 판별하시오.", "sol": ["$|x-1|&lt;2$에서 $-1&lt;x&lt;3$이므로 $P=\\{x\\mid -1&lt;x&lt;3\\}$", "$(x+2)(x-4)&lt;0$에서 $Q=\\{x\\mid -2&lt;x&lt;4\\}$", "$P\\subset Q$이므로 $p\\to q$는 참이다.", "$Q\\not\\subset P$이므로 $q\\to p$는 거짓이다. 반례는 $x=3.5$와 같이 $Q-P$의 원소이다."], "ans": "$p\\to q$는 참, $q\\to p$는 거짓"}}}, {"key": "T07-03", "no": "03", "name": "거짓인 명제의 반례", "book": {"sight": "반례는 <b>가정은 만족시키고 결론은 만족시키지 않는<\/b> 원소, 곧 $P\\cap Q^{C}$의 원소이다. 명제의 가정과 결론에 $\\sim$가 붙어 있으면 그대로 여집합을 취해 같은 꼴로 옮긴다.", "ex": {"body": "전체집합 $U=\\{x\\mid x\\text{는 }12\\text{ 이하의 자연수}\\}$에서 명제 ‘$x$가 $6$의 약수이면 $x$는 짝수이다.’가 거짓임을 보이는 반례를 모두 구하시오.", "sol": ["가정의 진리집합 $P=\\{1,\\,2,\\,3,\\,6\\}$, 결론의 진리집합 $Q=\\{2,\\,4,\\,6,\\,8,\\,10,\\,12\\}$", "반례는 $P$에는 속하고 $Q$에는 속하지 않는 원소이므로 $P-Q=\\{1,\\,3\\}$"], "ans": "$1$, $3$"}}}], "card": [["핵심", "참·거짓이 정해지면 명제, 변수의 값에 따라 달라지면 조건이다. 조건은 진리집합으로 옮겨 집합의 언어로 다룬다."], ["뜻", "참인지 거짓인지를 분명하게 판별할 수 있는 문장이나 식을 <b>명제<\/b>, 변수의 값에 따라 참, 거짓이 달라지는 문장이나 식을 <b>조건<\/b>이라 한다. 전체집합 $U$의 원소 중에서 조건 $p$를 참이 되게 하는 모든 원소의 집합을 조건 $p$의 <b>진리집합<\/b>  $P=\\{x\\mid x\\in U,\\ p(x)\\text{는 참}\\}$ 이라 한다. 또 ‘$p$가 아니다’를 $p$의 <b>부정<\/b>이라 하고 $\\sim p$로 나타낸다. 명제 ‘$p$이면 $q$이다’는 $p\\to q$로 나타내고, $p$를 <b>가정<\/b>, $q$를 <b>결론<\/b>이라 한다."], ["정리", "전체집합 $U$에서 두 조건 $p$, $q$의 진리집합을 각각 $P$, $Q$라 할 때<br>(1) $\\sim p$의 진리집합은 $P^{C}$이고, $\\sim(\\sim p)=p$이다.<br>(2) ‘$p$ 또는 $q$’의 진리집합은 $P\\cup Q$, ‘$p$ 그리고 $q$’의 진리집합은 $P\\cap Q$이다. 부정하면 ‘또는’과 ‘그리고’가 서로 바뀐다.<br>(3) 명제 $p\\to q$는 $P\\subset Q$이면 참, $P\\not\\subset Q$이면 거짓이다."], ["주의", "부등식을 부정하면 등호가 반대쪽으로 옮겨 간다. $x&lt;a$의 부정은 $x\\ge a$이다. $x&gt;a$가 아니다."], ["주의", "진리집합은 전체집합에 따라 달라진다. 조건 $x^{2}&lt;4$의 진리집합은 전체집합이 자연수 전체이면 $\\{1\\}$, 실수 전체이면 $\\{x\\mid -2&lt;x&lt;2\\}$이다."], ["주의", "반례는 가정 $p$를 만족시키면서 결론 $q$를 만족시키지 않는 원소이다. $q$만 만족시키지 않는 원소는 반례가 아니다."]]}, {"key": "C07-02", "no": "02", "title": "명제의 참·거짓과 역·대우", "themes": [{"key": "T07-04", "no": "04", "name": "참이 되도록 하는 미지수", "book": {"sight": "명제가 참 ⇔ $P\\subset Q$. 두 진리집합을 <b>한 수직선<\/b>에 그리고 끝점끼리 비교해 부등식을 세운다. <b>끝점이 같을 때<\/b>는 등호를 넣어도 되는지 따로 확인한다.", "ex": {"body": "명제 ‘$1\\le x\\le 3$이면 $a-2&lt;x&lt;2a+1$이다.’가 참이 되도록 하는 실수 $a$의 값의 범위를 구하시오.", "sol": ["$P=\\{x\\mid 1\\le x\\le 3\\}$, $Q=\\{x\\mid a-2&lt;x&lt;2a+1\\}$이고 $P\\subset Q$이어야 한다.", "$1\\in Q$이어야 하므로 $a-2&lt;1$, 곧 $a&lt;3$", "$3\\in Q$이어야 하므로 $2a+1&gt;3$, 곧 $a&gt;1$", "$a=3$이면 $Q$가 $1$을 포함하지 않고, $a=1$이면 $3$을 포함하지 않으므로 등호는 들어가지 않는다."], "ans": "$1&lt;a&lt;3$"}}}, {"key": "T07-05", "no": "05", "name": "'모든'과 '어떤'이 있는 명제", "book": {"sight": "‘모든 $x$’는 $P=U$, ‘어떤 $x$’는 $P\\ne \\varnothing$일 때 참이다. ‘모든’은 반례 하나로 거짓, ‘어떤’은 예 하나로 참. 이차부등식이 모든 실수에서 성립할 조건은 <b>판별식<\/b>으로 본다. 부정은 ‘모든’↔‘어떤’을 바꾸고 조건도 부정한다.", "ex": {"body": "명제 ‘어떤 실수 $x$에 대하여 $x^{2}+2ax+3a\\le 0$이다.’가 거짓이 되도록 하는 실수 $a$의 값의 범위를 구하시오.", "sol": ["주어진 명제가 거짓이면 그 부정 ‘모든 실수 $x$에 대하여 $x^{2}+2ax+3a&gt;0$이다.’가 참이다.", "이차항의 계수가 양수이므로 판별식 $\\dfrac{D}{4}=a^{2}-3a&lt;0$", "$a(a-3)&lt;0$  $\\therefore\\ 0&lt;a&lt;3$"], "ans": "$0&lt;a&lt;3$"}}}, {"key": "T07-06", "no": "06", "name": "명제의 역과 대우", "book": {"sight": "명제와 대우는 참·거짓이 같다. <b>역은 따로<\/b> 판정한다. 직접 판정하기 어려운 명제(‘또는’·‘$\\ne $’가 결론에 있는 것)는 대우로 바꿔 본다.", "ex": {"body": "실수 $x$, $y$에 대하여 명제 ‘$x+y&gt;2$이면 $x&gt;1$ 또는 $y&gt;1$이다.’의 역과 대우를 말하고, 명제와 역의 참, 거짓을 판별하시오.", "sol": ["역  ‘$x&gt;1$ 또는 $y&gt;1$이면 $x+y&gt;2$이다.’", "대우  ‘$x\\le 1$ 그리고 $y\\le 1$이면 $x+y\\le 2$이다.’", "대우는 두 부등식을 더하면 바로 나오므로 참이다. 따라서 명제도 참이다.", "역은 $x=2$, $y=-5$이면 $x+y=-3$이므로 거짓이다."], "ans": "명제 참, 역 거짓"}}}, {"key": "T07-07", "no": "07", "name": "대우가 참이 되게 하는 미지수", "book": {"sight": "대우가 참 ⇔ 원래 명제가 참. 대우를 붙들지 말고 <b>원래 명제 $p\\to q$<\/b>로 돌아가 $P\\subset Q$를 세운다. 반대로 ‘$\\ne $’가 들어간 명제는 대우로 바꾸면 ‘$=$’가 되어 쉬워진다.", "ex": {"body": "명제 ‘$x^{2}-ax+6\\ne 0$이면 $x\\ne 2$이다.’가 참이 되도록 하는 실수 $a$의 값을 구하시오.", "sol": ["주어진 명제가 참이면 대우 ‘$x=2$이면 $x^{2}-ax+6=0$이다.’도 참이다.", "$x=2$를 대입하면 $4-2a+6=0$  $\\therefore\\ a=5$"], "ans": "$5$"}}}, {"key": "T07-08", "no": "08", "name": "삼단논법과 명제의 추론", "book": {"sight": "참인 명제마다 <b>대우도 같이 적어<\/b> 두고 화살표를 잇는다. $p\\to q$, $q\\to r$이면 $p\\to r$. 말로 된 명제는 조건 기호로 바꿔 놓고 잇는다.", "ex": {"body": "세 조건 $p$, $q$, $r$에 대하여 두 명제 $p\\to\\sim q$, $r\\to q$가 모두 참일 때, 명제 $p\\to\\sim r$가 참임을 보이시오.", "sol": ["$r\\to q$가 참이므로 그 대우 $\\sim q\\to\\sim r$도 참이다.", "$p\\to\\sim q$와 $\\sim q\\to\\sim r$가 모두 참이므로 삼단논법에 의하여 $p\\to\\sim r$는 참이다."], "ans": "풀이 참조"}}}], "card": [["핵심", "미지수가 있는 명제, ‘모든’·‘어떤’이 붙은 명제, 역과 대우의 참·거짓은 모두 진리집합 사이의 관계로 판정한다."], ["뜻", "명제 $p\\to q$에 대하여 $q\\to p$를 <b>역<\/b>,  $\\sim q\\to\\sim p$를 <b>대우<\/b> 라 한다. 또 전체집합 $U$의 원소 $x$에 대하여 ‘모든 $x$에 대하여 $p$이다’, ‘어떤 $x$에 대하여 $p$이다’와 같이 ‘모든’, ‘어떤’이 붙은 문장은 명제이다."], ["정리", "전체집합 $U$에서 세 조건 $p$, $q$, $r$의 진리집합을 각각 $P$, $Q$, $R$라 할 때<br>(1) ‘모든 $x$에 대하여 $p$’는 $P=U$일 때, ‘어떤 $x$에 대하여 $p$’는 $P\\ne \\varnothing$일 때 참이다.<br>(2) ‘모든 $x$에 대하여 $p$’의 부정은 ‘어떤 $x$에 대하여 $\\sim p$’, ‘어떤 $x$에 대하여 $p$’의 부정은 ‘모든 $x$에 대하여 $\\sim p$’이다.<br>(3) 명제 $p\\to q$와 그 대우 $\\sim q\\to\\sim p$는 참·거짓이 항상 같다.<br>(4) $p\\to q$와 $q\\to r$가 모두 참이면 $p\\to r$도 참이다. (삼단논법)"], ["주의", "명제가 참이어도 그 역이 참이라고 할 수 없다. 참·거짓이 항상 같은 것은 명제와 그 대우뿐이다."], ["주의", "‘모든’·‘어떤’이 붙은 명제를 부정할 때는 ‘모든’과 ‘어떤’을 바꾸고, 조건 $p$도 함께 부정한다."], ["주의", "미지수가 있는 명제가 참이 될 조건은 $P\\subset Q$를 수직선에 나타내어 세운다. 끝점의 등호 포함 여부는 따로 확인한다."]]}, {"key": "C07-03", "no": "03", "title": "충분조건과 필요조건", "themes": [{"key": "T07-09", "no": "09", "name": "충분·필요·필요충분조건", "book": {"sight": "두 진리집합을 비교한다. <b>작은 집합의 조건이 충분조건, 큰 집합의 조건이 필요조건<\/b>, 같으면 필요충분조건. 이름은 ‘~이기 위한’ 앞에 놓인 조건에 붙는다. 조건이 식이면 먼저 풀어서 진리집합을 구한다.", "ex": {"body": "실수 $x$에 대한 두 조건 $p:x^{2}=2x$, $q:x=2$에 대하여 $p$는 $q$이기 위한 어떤 조건인지 말하시오.", "sol": ["$x^{2}-2x=0$에서 $x=0$ 또는 $x=2$이므로 $P=\\{0,\\,2\\}$, $Q=\\{2\\}$", "$Q\\subset P$이고 $P\\not\\subset Q$이므로 $q\\Longrightarrow p$이지만 $p\\Longrightarrow q$는 아니다.", "따라서 $p$는 $q$이기 위한 필요조건이지만 충분조건은 아니다."], "ans": "필요조건"}}}, {"key": "T07-10", "no": "10", "name": "조건이 되게 하는 미지수와 연산", "book": {"sight": "‘충분조건’은 $P\\subset Q$, ‘필요조건’은 $Q\\subset P$로 바꿔 수직선에서 끝점을 비교한다. 조건이 세 개이면 <b>포함 사슬 하나<\/b>(예 $Q\\subset R\\subset P$)로 이어 그린다.", "ex": {"body": "실수 $x$에 대한 두 조건 $p:|x-1|\\le 2$, $q:a\\le x\\le a+5$에 대하여 $p$가 $q$이기 위한 충분조건이 되도록 하는 실수 $a$의 값의 범위를 구하시오.", "sol": ["$P=\\{x\\mid -1\\le x\\le 3\\}$이고, 충분조건이려면 $P\\subset Q$", "$a\\le -1$이고 $a+5\\ge 3$  $\\therefore\\ -2\\le a\\le -1$", "양 끝이 모두 닫힌 구간이므로 끝점이 같아도 포함된다."], "ans": "$-2\\le a\\le -1$"}}}], "card": [["핵심", "명제 $p\\to q$가 참일 때 두 조건 사이의 관계에 붙이는 이름이다. 판정은 언제나 진리집합의 포함 관계로 한다."], ["뜻", "명제 $p\\to q$가 참일 때, 이것을 기호로 $p\\Longrightarrow q$와 같이 나타내고 $p$는 $q$이기 위한 <b>충분조건<\/b>,  $q$는 $p$이기 위한 <b>필요조건<\/b> 이라 한다. 또 $p\\Longrightarrow q$이고 $q\\Longrightarrow p$일 때 $p\\Longleftrightarrow q$로 나타내고, $p$는 $q$이기 위한 <b>필요충분조건<\/b>이라 한다."], ["정리", "두 조건 $p$, $q$의 진리집합을 각각 $P$, $Q$라 할 때<br>(1) $P\\subset Q$이면 $p$는 $q$이기 위한 충분조건이다.<br>(2) $Q\\subset P$이면 $p$는 $q$이기 위한 필요조건이다.<br>(3) $P=Q$이면 $p$는 $q$이기 위한 필요충분조건이다.<br>(4) $P\\not\\subset Q$이고 $Q\\not\\subset P$이면 $p$는 $q$이기 위한 충분조건도 필요조건도 아니다."], ["주의", "‘$p$는 $q$이기 위한 필요조건’은 $Q\\subset P$를 뜻한다. $P\\subset Q$가 아니다. 이름은 ‘~이기 위한’ 앞에 놓인 조건에 붙는다."], ["주의", "‘충분조건이다’에는 필요충분조건인 경우도 들어간다. 필요충분인지, ‘충분조건이지만 필요조건은 아니다’인지는 $Q\\subset P$인지까지 확인해야 정해진다."], ["주의", "진리집합이 공집합일 수 있으면 그 경우를 따로 본다. 공집합은 모든 집합의 부분집합이다."]]}, {"key": "C07-04", "no": "04", "title": "명제의 증명과 절대부등식", "themes": [{"key": "T07-11", "no": "11", "name": "대우법과 귀류법", "book": {"sight": "결론이 ‘~가 아니다’, ‘적어도 하나’, ‘무리수이다’처럼 직접 보이기 어려우면 <b>결론을 부정해서<\/b> 시작한다. 대우법은 $\\sim q\\to\\sim p$를 보이고, 귀류법은 $p$와 $\\sim q$를 함께 가정해 모순을 이끈다. 홀수·짝수, $3$의 배수가 아닌 수는 $2k+1$, $3k\\pm 1$처럼 꼴로 놓는다.", "ex": {"body": "자연수 $n$에 대하여 명제 ‘$n^{2}$이 짝수이면 $n$도 짝수이다.’가 참임을 대우를 이용하여 증명하시오.", "sol": ["대우는 ‘$n$이 홀수이면 $n^{2}$도 홀수이다.’", "$n=2k-1$ ($k$는 자연수)이라 하면", "$n^{2}=4k^{2}-4k+1=2(2k^{2}-2k)+1$", "$2k^{2}-2k$는 $0$ 또는 자연수이므로 $n^{2}$은 홀수이다.", "대우가 참이므로 주어진 명제도 참이다."], "ans": "풀이 참조"}}}, {"key": "T07-12", "no": "12", "name": "절대부등식의 증명", "book": {"sight": "(좌변)$-$(우변)을 <b>완전제곱식의 합<\/b>으로 만들어 $\\ge 0$을 보인다. 근호·절댓값이 있으면 양변이 $0$ 이상임을 확인하고 <b>제곱해서<\/b> 비교한다. 등호가 성립하는 조건까지 적는다.", "ex": {"body": "실수 $a$, $b$에 대하여 부등식 $a^{2}+b^{2}\\ge 2(a+b)-2$가 성립함을 증명하고, 등호가 성립하는 조건을 구하시오.", "sol": ["$a^{2}+b^{2}-2(a+b)+2=(a^{2}-2a+1)+(b^{2}-2b+1)$", "$=(a-1)^{2}+(b-1)^{2}\\ge 0$", "등호는 $a-1=0$, $b-1=0$, 곧 $a=b=1$일 때 성립한다."], "ans": "등호는 $a=b=1$일 때"}}}, {"key": "T07-13", "no": "13", "name": "산술·기하평균 : 전개와 변형", "book": {"sight": "<b>곱해서 상수가 되는 두 양수 덩어리<\/b>를 만든다. 곱의 꼴이면 먼저 전개하고, 분모가 $x-a$ 꼴이면 나머지 항도 $x-a$ 덩어리로 맞춘다. 마지막에 <b>등호가 범위 안에서 실제로 성립하는지<\/b> 확인한다.", "ex": {"body": "$x&gt;1$일 때, $x+\\dfrac{4}{x-1}$의 최솟값과 그때의 $x$의 값을 구하시오.", "sol": ["$x-1&gt;0$이므로 $x+\\dfrac{4}{x-1}=(x-1)+\\dfrac{4}{x-1}+1$", "$\\ge 2\\sqrt{(x-1)\\cdot\\dfrac{4}{x-1}}+1=5$", "등호는 $x-1=\\dfrac{4}{x-1}$, 곧 $(x-1)^{2}=4$에서 $x=3$ ($x&gt;1$)일 때 성립한다."], "ans": "최솟값 $5$, $x=3$"}}}, {"key": "T07-14", "no": "14", "name": "산술·기하평균 : 합·곱이 일정", "book": {"sight": "<b>합이 일정하면 곱의 최댓값, 곱이 일정하면 합의 최솟값<\/b>. 계수가 붙어 있으면 $2a$, $3b$처럼 계수까지 한 덩어리로 묶는다. 등호 조건으로 그때의 값을 구한다.", "ex": {"body": "두 양수 $x$, $y$에 대하여 $2x+y=8$일 때, $xy$의 최댓값과 그때의 $x$, $y$의 값을 구하시오.", "sol": ["$2x&gt;0$, $y&gt;0$이므로 $2x+y\\ge 2\\sqrt{2xy}$", "$8\\ge 2\\sqrt{2xy}$에서 $\\sqrt{2xy}\\le 4$, 곧 $xy\\le 8$", "등호는 $2x=y$일 때이므로 $2x=y=4$, 곧 $x=2$, $y=4$"], "ans": "최댓값 $8$, $x=2$, $y=4$"}}}, {"key": "T07-15", "no": "15", "name": "코시-슈바르츠 부등식", "book": {"sight": "<b>제곱의 합과 일차식<\/b>이 함께 나오면 $(a^{2}+b^{2})(x^{2}+y^{2})\\ge(ax+by)^{2}$에 맞춰 계수를 짝 짓는다. 등호 조건 $\\dfrac{x}{a}=\\dfrac{y}{b}$로 최대·최소가 되는 값을 확인한다.", "ex": {"body": "실수 $x$, $y$에 대하여 $x^{2}+y^{2}=5$일 때, $x+2y$의 최댓값과 최솟값을 구하시오.", "sol": ["$(1^{2}+2^{2})(x^{2}+y^{2})\\ge(x+2y)^{2}$에서 $(x+2y)^{2}\\le 25$", "$\\therefore\\ -5\\le x+2y\\le 5$", "등호는 $\\dfrac{x}{1}=\\dfrac{y}{2}$, 곧 $y=2x$일 때이고 $5x^{2}=5$에서 $x=1$이면 최댓값, $x=-1$이면 최솟값"], "ans": "최댓값 $5$, 최솟값 $-5$"}}}], "card": [["핵심", "직접 보이기 어려운 명제는 대우나 귀류법으로 증명한다. 부등식의 증명은 두 식의 차의 부호를 정하는 일이고, 그 결과가 최대·최소를 구하는 도구가 된다."], ["뜻", "문자가 가질 수 있는 모든 값에 대하여 항상 성립하는 부등식을 <b>절대부등식<\/b> 이라 한다. 또 명제의 결론을 부정하여 가정이나 이미 알려진 사실에 모순이 생김을 보임으로써 명제가 참임을 증명하는 방법을 <b>귀류법<\/b>이라 한다."], ["정리", "$a$, $b$, $x$, $y$가 실수일 때<br>(1) $a&gt;0$, $b&gt;0$이면 $\\dfrac{a+b}{2}\\ge\\sqrt{ab}$  (등호는 $a=b$일 때 성립)<br>(2) $(a^{2}+b^{2})(x^{2}+y^{2})\\ge(ax+by)^{2}$  (등호는 $ay=bx$일 때 성립)<br>(3) $|a|+|b|\\ge|a+b|$  (등호는 $ab\\ge 0$일 때 성립)"], ["주의", "산술평균과 기하평균의 관계는 <b>두 수가 음수가 아닐 때만<\/b> 쓴다. $x&lt;0$이면 $x+\\frac{1}{x}\\ge 2$는 성립하지 않는다."], ["주의", "최솟값이나 최댓값을 구했으면 <b>등호가 성립하는 값이 주어진 범위 안에 실제로 있는지<\/b> 확인한다. 등호가 성립하지 않으면 그 값은 최솟값(최댓값)이 아니다."], ["주의", "대우를 이용한 증명은 $\\sim q\\to\\sim p$를 직접 보이고, 귀류법은 $p$와 $\\sim q$를 함께 가정하여 모순을 이끈다. 둘 다 결론을 부정하는 데서 시작한다."]]}]}, {"code": "08", "name": "08 함수", "concepts": [{"key": "C08-01", "no": "01", "title": "함수의 뜻", "themes": [{"key": "T08-01", "no": "01", "name": "함수의 뜻과 정의역·치역", "book": {"sight": "함수인지는 <b>정의역의 모든 원소의 함숫값이 공역 안에 있는지<\/b>로 판정한다. 정의역이 유한집합이면 원소를 하나씩 넣고, 구간이면 양 끝값을 넣어 치역을 구한 뒤 공역과 비교한다. 일차함수의 치역은 양 끝점의 함숫값으로 정해지고, 기울기의 부호에 따라 어느 쪽이 큰 끝값인지 바뀐다.", "ex": {"body": "두 집합 $X=\\{x\\mid -1\\le x\\le 2\\}$, $Y=\\{y\\mid -3\\le y\\le 3\\}$에 대하여 정의역이 $X$인 함수 $f(x)=-2x+1$의 치역을 구하고, $f$가 $X$에서 $Y$로의 함수인지 판별하시오.", "sol": ["기울기가 음수이므로 $x$의 값이 커지면 $f(x)$의 값은 작아진다.", "$f(-1)=3$, $f(2)=-3$이므로 치역은 $\\{y\\mid -3\\le y\\le 3\\}$", "치역이 $Y$의 부분집합이므로 $f$는 $X$에서 $Y$로의 함수이다."], "ans": "치역 $\\{y\\mid -3\\le y\\le 3\\}$, 함수이다"}}}, {"key": "T08-02", "no": "02", "name": "함숫값 구하기", "book": {"sight": "구간에 따라 식이 다르면 <b>$x$가 어느 범위에 속하는지<\/b> 먼저 정하고 그 식에 넣는다. $f(a)=k$를 풀 때는 범위마다 방정식을 풀고 그 범위에 맞는 해만 남긴다. 함수의 관계식이 주어지면 <b>구하려는 값이 나오도록<\/b> $x$, $y$에 수를 넣는다.", "ex": {"body": "실수 전체의 집합에서 정의된 함수 $f(x)=\\begin{cases}x^{2}+1 &amp; (x\\ge 0)\\\\ -2x+1 &amp; (x&lt;0)\\end{cases}$에 대하여 $f(a)=5$를 만족시키는 모든 실수 $a$의 값을 구하시오.", "sol": ["(ⅰ) $a\\ge 0$일 때 $a^{2}+1=5$에서 $a=2$ ($a=-2$는 $a\\ge 0$이 아니므로 제외)", "(ⅱ) $a&lt;0$일 때 $-2a+1=5$에서 $a=-2$", "따라서 $a=-2$ 또는 $a=2$"], "ans": "$-2$, $2$"}}}, {"key": "T08-03", "no": "03", "name": "서로 같은 함수", "book": {"sight": "두 함수가 서로 같으려면 <b>정의역이 같고, 정의역의 모든 원소에서 함숫값이 같아야<\/b> 한다. 정의역이 유한집합이면 원소를 하나씩 넣어 비교한다. $f=g$가 되는 정의역을 찾을 때는 방정식 $f(x)=g(x)$의 해를 구한다 — 정의역은 그 해의 집합의 공집합이 아닌 부분집합이다.", "ex": {"body": "정의역이 $\\{-1,\\,0,\\,1\\}$인 두 함수 $f(x)=x^{3}$, $g(x)=ax+b$가 서로 같을 때, 상수 $a$, $b$의 값을 구하시오.", "sol": ["$f(-1)=-1$, $f(0)=0$, $f(1)=1$", "$g(0)=f(0)$에서 $b=0$,  $g(1)=f(1)$에서 $a+b=1$이므로 $a=1$", "이때 $g(-1)=-1=f(-1)$이므로 정의역의 모든 원소에서 함숫값이 같다."], "ans": "$a=1$, $b=0$"}}}], "card": [["핵심", "집합 $X$의 원소 하나하나에 집합 $Y$의 원소가 <b>오직 하나씩<\/b> 대응할 때 함수라 한다. 함수는 정의역·공역·대응 규칙이 함께 정해져야 하나의 함수이다."], ["뜻", "두 집합 $X$, $Y$에 대하여 $X$의 각 원소에 $Y$의 원소가 오직 하나씩 대응할 때, 이 대응을 $X$에서 $Y$로의 <b>함수<\/b>라 하고, 기호로 $f\\,:\\,X\\to Y$ 와 같이 나타낸다. 이때 $X$를 함수 $f$의 <b>정의역<\/b>, $Y$를 함수 $f$의 <b>공역<\/b>이라 하고, 함숫값 전체의 집합 $\\{f(x)\\mid x\\in X\\}$를 함수 $f$의 <b>치역<\/b>이라 한다."], ["정리", "함수 $f\\,:\\,X\\to Y$에 대하여<br>(1) 치역은 공역의 부분집합이다. 곧 $\\{f(x)\\mid x\\in X\\}\\subset Y$이다.<br>(2) 두 함수 $f$, $g$의 정의역과 공역이 각각 같고, 정의역의 모든 원소 $x$에 대하여 $f(x)=g(x)$일 때 두 함수는 <b>서로 같다<\/b>고 하고, 기호로 $f=g$와 같이 나타낸다.<br>(3) 함수 $f$의 <b>그래프<\/b> $\\{(x,\\,f(x))\\mid x\\in X\\}$는 정의역의 각 원소 $a$에 대하여 직선 $x=a$와 오직 한 점에서 만난다."], ["주의", "정의역의 원소 중 대응하는 원소가 없는 것이 있거나, 한 원소에 두 개 이상의 원소가 대응하면 함수가 아니다. 공역의 원소는 대응되지 않고 남아도 된다."], ["주의", "함수 $y=f(x)$의 정의역이나 공역이 주어지지 않으면 정의역은 $f(x)$가 정의되는 실수 전체의 집합, 공역은 실수 전체의 집합으로 생각한다."], ["주의", "식이 달라도 서로 같은 함수일 수 있다. 정의역이 $\\{0,\\,1\\}$이면 $f(x)=x$와 $g(x)=x^{2}$은 서로 같은 함수이다. 반대로 식이 같아도 정의역이 다르면 서로 같은 함수가 아니다."]]}, {"key": "C08-02", "no": "02", "title": "여러 가지 함수", "themes": [{"key": "T08-04", "no": "04", "name": "일대일함수와 일대일대응", "book": {"sight": "일대일대응 = <b>일대일함수 + (치역)=(공역)<\/b>. 그래프로는 공역의 각 원소 $k$에 대하여 직선 $y=k$와 오직 한 점에서 만난다. 일차함수가 구간에서 일대일대응이면 양 끝점끼리 대응하고, 두 일차식으로 나뉜 함수이면 두 기울기의 부호가 같고 경계에서 이어져야 한다.", "ex": {"body": "두 집합 $X=\\{x\\mid -1\\le x\\le 2\\}$, $Y=\\{y\\mid 1\\le y\\le 7\\}$에 대하여 $X$에서 $Y$로의 함수 $f(x)=ax+b$가 일대일대응일 때, 상수 $a$, $b$의 값을 구하시오. (단, $a&lt;0$)", "sol": ["$a&lt;0$이므로 $x$의 값이 커지면 $f(x)$의 값은 작아진다.", "일대일대응이므로 $f(-1)=7$, $f(2)=1$", "$-a+b=7$, $2a+b=1$을 연립하면 $a=-2$, $b=5$"], "ans": "$a=-2$, $b=5$"}}}, {"key": "T08-05", "no": "05", "name": "항등함수와 상수함수", "book": {"sight": "항등함수는 <b>$f(x)=x$<\/b>, 상수함수는 <b>$f(x)=c$<\/b>로 놓는다. 정의역이 정해지지 않은 함수가 항등함수가 되려면 정의역의 모든 원소가 방정식 $f(x)=x$의 해여야 하고, 상수함수가 되려면 정의역의 모든 원소의 함숫값이 같아야 한다.", "ex": {"body": "집합 $X$를 정의역으로 하는 함수 $f(x)=x^{2}-2x$가 $X$에서 $X$로의 항등함수가 되도록 하는 집합 $X$를 모두 구하시오. (단, $X\\ne \\varnothing$)", "sol": ["항등함수이려면 $X$의 모든 원소 $x$에 대하여 $f(x)=x$이어야 한다.", "$x^{2}-2x=x$에서 $x(x-3)=0$, 곧 $x=0$ 또는 $x=3$", "$X$는 $\\{0,\\,3\\}$의 공집합이 아닌 부분집합이다."], "ans": "$\\{0\\}$, $\\{3\\}$, $\\{0,\\,3\\}$"}}}, {"key": "T08-06", "no": "06", "name": "함수의 개수", "book": {"sight": "정의역의 원소마다 <b>함숫값을 정하는 경우의 수를 곱한다<\/b>. 조건이 붙은 원소의 함숫값부터 정하고, 나머지는 자유롭게 고른다. ‘치역이 $A$’처럼 치역이 정해지면 $A$로의 함수 전체에서 치역이 $A$보다 작은 경우를 뺀다.", "ex": {"body": "두 집합 $X=\\{1,\\,2,\\,3\\}$, $Y=\\{a,\\,b,\\,c,\\,d\\}$에 대하여 $X$에서 $Y$로의 함수, 일대일함수, 상수함수의 개수를 각각 구하시오.", "sol": ["함수  $1$, $2$, $3$의 함숫값을 각각 $4$가지씩 고르므로 $4^{3}=64$", "일대일함수  서로 다른 값을 차례로 고르므로 $4\\times 3\\times 2=24$", "상수함수  함숫값 하나를 고르므로 $4$"], "ans": "$64$, $24$, $4$"}}}], "card": [["핵심", "서로 다른 원소에 서로 다른 함숫값이 대응하는 함수가 일대일함수이고, 그중 치역과 공역이 같은 것이 일대일대응이다. 항등함수와 상수함수는 대응 규칙이 가장 단순한 두 함수이다."], ["뜻", "함수 $f\\,:\\,X\\to Y$에서 정의역 $X$의 임의의 두 원소 $x_{1}$, $x_{2}$에 대하여 $x_{1}\\ne x_{2}$이면 $f(x_{1})\\ne f(x_{2})$ 일 때, 함수 $f$를 <b>일대일함수<\/b>라 한다. 일대일함수이면서 치역과 공역이 같은 함수를 <b>일대일대응<\/b>이라 한다."], ["정리", "함수 $f\\,:\\,X\\to Y$에 대하여<br>(1) $f$가 일대일함수이면, 치역의 각 원소 $k$에 대하여 함수 $y=f(x)$의 그래프와 직선 $y=k$는 오직 한 점에서 만난다.<br>(2) $f$가 일대일대응이면, 공역의 각 원소 $k$에 대하여 함수 $y=f(x)$의 그래프와 직선 $y=k$는 오직 한 점에서 만난다.<br>(3) 집합 $X$에서 $X$로의 함수 $f(x)=x$를 $X$에서의 <b>항등함수<\/b>라 하고, 함수 $f\\,:\\,X\\to Y$에서 정의역의 모든 원소에 공역의 단 하나의 원소 $c$가 대응하는 함수 $f(x)=c$를 <b>상수함수<\/b>라 한다.<br>(4) $n(X)=m$, $n(Y)=n$일 때 $X$에서 $Y$로의 함수는 $n^{m}$개, 일대일함수는 ${}_{n}\\mathrm{P}_{m}$개($m\\le n$), 상수함수는 $n$개이다. $m=n$이면 일대일대응은 $n!$개이다."], ["주의", "일대일대응이면 일대일함수이지만, 일대일함수라고 해서 일대일대응인 것은 아니다. <b>치역과 공역이 같은지<\/b>까지 확인한다."], ["주의", "정의역이 $\\{x\\mid a\\le x\\le b\\}$인 일차함수 $f(x)$가 일대일대응이면 $f(a)$, $f(b)$가 공역의 양 끝값이다. 기울기가 음수이면 $f(a)$가 큰 쪽 끝값이다."], ["주의", "함수의 개수는 정의역의 원소마다 함숫값을 정하는 경우의 수를 곱해 센다."], ["주의", "두 일차식으로 나뉜 함수가 실수 전체에서 일대일대응이려면 <b>두 기울기의 부호가 같고<\/b>, 경계에서 두 직선이 이어져야 한다."]]}, {"key": "C08-03", "no": "03", "title": "합성함수", "themes": [{"key": "T08-07", "no": "07", "name": "합성함수 구하기", "book": {"sight": "$(g\\circ f)(a)=g(f(a))$ — <b>안쪽 $f(a)$부터<\/b> 계산한다. 식끼리 합성할 때는 $f(x)$를 $g$의 $x$ 자리에 통째로 넣는다. $f\\circ g=g\\circ f$는 항등식이므로 양변의 계수를 비교한다. 합성함수가 정의되려면 앞 함수의 치역이 뒤 함수의 정의역에 포함되어야 한다.", "ex": {"body": "두 함수 $f(x)=2x-1$, $g(x)=x^{2}+1$에 대하여 $(g\\circ f)(x)$, $(f\\circ g)(x)$를 구하고, $(g\\circ f)(1)+(f\\circ g)(1)$의 값을 구하시오.", "sol": ["$(g\\circ f)(x)=g(2x-1)=(2x-1)^{2}+1=4x^{2}-4x+2$", "$(f\\circ g)(x)=f(x^{2}+1)=2(x^{2}+1)-1=2x^{2}+1$", "$(g\\circ f)(1)+(f\\circ g)(1)=2+3=5$"], "ans": "$4x^{2}-4x+2$, $2x^{2}+1$, $5$"}}}, {"key": "T08-08", "no": "08", "name": "합성함수의 규칙성과 미정계수", "book": {"sight": "$(f\\circ f)(x)$, $(f\\circ g)(x)$의 식이 주어지면 <b>합성한 식을 정리해 계수를 비교<\/b>한다. $f(g(x))$가 주어지고 $f$를 구할 때는 $g(x)=t$로 놓는다 (값 하나만 필요하면 $g(x)$가 그 값이 되는 $x$를 바로 넣는다). $f^{n}$은 $n=1,\\,2,\\,3,\\,\\cdots$을 차례로 구해 <b>되풀이되는 규칙<\/b>을 찾는다.", "ex": {"body": "두 함수 $f$, $g$에 대하여 $g(x)=2x+1$, $(f\\circ g)(x)=6x+5$일 때, $f(x)$를 구하고 $f(7)$의 값을 구하시오.", "sol": ["$f(2x+1)=6x+5$에서 $2x+1=t$로 놓으면 $x=\\dfrac{t-1}{2}$", "$f(t)=6\\times\\dfrac{t-1}{2}+5=3t+2$이므로 $f(x)=3x+2$", "$f(7)=23$"], "ans": "$f(x)=3x+2$, $f(7)=23$"}}}, {"key": "T08-09", "no": "09", "name": "그래프를 이용한 합성함수", "book": {"sight": "그래프에서 <b>$f(a)$를 읽고, 그 값을 다시 $x$좌표로 삼아<\/b> 다음 함숫값을 읽는다. 직선 $y=x$가 있으면 함숫값($y$좌표)을 $x$축 위의 값으로 옮겨 준다. $(f\\circ g)(x)$의 식은 $g(x)$의 값이 $f$의 어느 구간에 들어가는지에 따라 $x$의 범위를 나누어 구한다.", "ex": {"body": "$0\\le x\\le 2$에서 정의된 함수 $f(x)=\\begin{cases}2x &amp; (0\\le x\\le 1)\\\\ -2x+4 &amp; (1&lt;x\\le 2)\\end{cases}$에 대하여 $(f\\circ f)\\left(\\dfrac{1}{4}\\right)+(f\\circ f)\\left(\\dfrac{3}{2}\\right)$의 값을 구하고, $0\\le x\\le\\dfrac{1}{2}$일 때 $(f\\circ f)(x)$를 구하시오.", "sol": ["$f\\left(\\dfrac{1}{4}\\right)=\\dfrac{1}{2}$, $f\\left(\\dfrac{1}{2}\\right)=1$이므로 $(f\\circ f)\\left(\\dfrac{1}{4}\\right)=1$", "$f\\left(\\dfrac{3}{2}\\right)=1$, $f(1)=2$이므로 $(f\\circ f)\\left(\\dfrac{3}{2}\\right)=2$", "따라서 합은 $1+2=3$", "$0\\le x\\le\\dfrac{1}{2}$이면 $f(x)=2x$이고 $0\\le 2x\\le 1$이므로 $(f\\circ f)(x)=f(2x)=4x$"], "ans": "$3$, $(f\\circ f)(x)=4x$"}}}], "card": [["핵심", "두 함수를 이어 붙여 하나의 함수를 만든다. $(g\\circ f)(x)=g(f(x))$는 <b>안쪽 $f$를 먼저<\/b> 적용한다."], ["뜻", "두 함수 $f\\,:\\,X\\to Y$, $g\\,:\\,Y\\to Z$가 주어질 때, $X$의 각 원소 $x$에 $Z$의 원소 $g(f(x))$를 대응시키는 $X$에서 $Z$로의 함수를 $f$와 $g$의 <b>합성함수<\/b>라 하고, 기호로 $g\\circ f\\,:\\,X\\to Z$,   $(g\\circ f)(x)=g(f(x))$ 와 같이 나타낸다."], ["정리", "세 함수 $f$, $g$, $h$에 대하여<br>(1) $g\\circ f\\ne f\\circ g$인 경우가 있다. 곧 합성함수에서는 교환법칙이 성립하지 않는다.<br>(2) $h\\circ(g\\circ f)=(h\\circ g)\\circ f$  (결합법칙)<br>(3) 함수 $f\\,:\\,X\\to X$와 $X$에서의 항등함수 $I$에 대하여 $f\\circ I=I\\circ f=f$"], ["주의", "$g\\circ f$는 $f$를 먼저, $g$를 나중에 적용한다. 기호에서 오른쪽에 있는 함수가 먼저이다."], ["주의", "합성함수 $g\\circ f$가 정의되려면 $f$의 치역이 $g$의 정의역의 부분집합이어야 한다."], ["주의", "그래프로 주어진 함수의 합성은 $f(a)$를 그래프에서 읽고, 그 값을 다시 $x$좌표로 하여 다음 함숫값을 읽는다. 직선 $y=x$를 이용하면 $y$좌표를 $x$축으로 옮길 수 있다."], ["주의", "$f\\circ g=g\\circ f$는 항상 성립하는 것이 아니다. 문제에서 $f\\circ g=g\\circ f$가 주어지면 그것은 미지수를 정하는 조건이다."]]}, {"key": "C08-04", "no": "04", "title": "역함수", "themes": [{"key": "T08-10", "no": "10", "name": "역함수의 함숫값과 존재 조건", "book": {"sight": "<b>$f^{-1}(b)=a\\iff f(a)=b$<\/b>. 역함수의 식을 구하지 말고 $f(a)=b$인 $a$를 찾는다. 역함수가 존재할 조건은 일대일대응 — 두 일차식으로 나뉜 함수이면 두 기울기의 부호가 같고 경계에서 이어져야 하며, 정의역·공역이 구간이면 양 끝점끼리 대응한다.", "ex": {"body": "함수 $f(x)=3x-2$에 대하여 $f^{-1}(7)+f^{-1}(-5)$의 값을 구하시오.", "sol": ["$f^{-1}(7)=a$라 하면 $f(a)=7$이므로 $3a-2=7$, $a=3$", "$f^{-1}(-5)=b$라 하면 $f(b)=-5$이므로 $3b-2=-5$, $b=-1$", "$f^{-1}(7)+f^{-1}(-5)=3+(-1)=2$"], "ans": "$2$"}}}, {"key": "T08-11", "no": "11", "name": "역함수 구하기", "book": {"sight": "$y=f(x)$를 <b>$x$에 대하여 풀고 $x$와 $y$를 바꾼다<\/b>. $f$의 식을 모르면 먼저 치환으로 $f(x)$를 구한다. $g(ax+b)$처럼 안쪽이 바뀐 함수의 역함수는 $y=g(ax+b)$로 놓고 양쪽에 $g^{-1}$를 적용해 $x$를 구한다.", "ex": {"body": "함수 $f(x)=-\\dfrac{1}{2}x+3$의 역함수를 구하시오.", "sol": ["$y=-\\dfrac{1}{2}x+3$을 $x$에 대하여 풀면 $x=-2y+6$", "$x$와 $y$를 서로 바꾸면 $y=-2x+6$"], "ans": "$f^{-1}(x)=-2x+6$"}}}], "card": [["핵심", "대응의 방향을 거꾸로 한 함수가 역함수이다. 거꾸로 해도 함수가 되려면 처음 함수가 <b>일대일대응<\/b>이어야 한다."], ["뜻", "함수 $f\\,:\\,X\\to Y$가 일대일대응이면 $Y$의 각 원소 $y$에 대하여 $f(x)=y$인 $X$의 원소 $x$가 오직 하나 존재한다. 이때 $Y$의 각 원소 $y$에 $f(x)=y$인 $X$의 원소 $x$를 대응시키는 함수를 $f$의 <b>역함수<\/b>라 하고, 기호로 $f^{-1}\\,:\\,Y\\to X$,   $x=f^{-1}(y)$ 와 같이 나타낸다."], ["정리", "함수 $f\\,:\\,X\\to Y$에 대하여<br>(1) $f$의 역함수가 존재하기 위한 필요충분조건은 $f$가 일대일대응인 것이다.<br>(2) $f$의 역함수가 존재할 때, $y=f(x)\\iff x=f^{-1}(y)$이다. 곧 $f(a)=b\\iff f^{-1}(b)=a$<br>(3) 역함수는 ① $y=f(x)$를 $x$에 대하여 풀어 $x=f^{-1}(y)$ 꼴로 나타내고 ② $x$와 $y$를 서로 바꾸어 $y=f^{-1}(x)$로 구한다. 이때 $f$의 치역이 $f^{-1}$의 정의역이 된다."], ["주의", "$f^{-1}(x)$는 $\\dfrac{1}{f(x)}$가 아니다. $-1$은 지수가 아니라 역함수를 나타내는 기호이다."], ["주의", "$f^{-1}(b)$의 값만 필요하면 역함수의 식을 구하지 않고 $f(a)=b$를 만족시키는 $a$를 찾는다."], ["주의", "역함수가 존재하는지 물으면 일대일함수인지와 <b>치역과 공역이 같은지<\/b>를 함께 확인한다. 정의역·공역이 주어지지 않은 실수 전체의 함수는 치역이 실수 전체인지 본다."]]}, {"key": "C08-05", "no": "05", "title": "역함수의 성질과 그래프", "themes": [{"key": "T08-12", "no": "12", "name": "합성함수와 역함수", "book": {"sight": "<b>안쪽부터 한 단계씩<\/b> 값을 구한다. $f^{-1}$가 나오면 $f^{-1}(b)=a$를 $f(a)=b$로 바꾼다. 식 전체가 주어지면 $f^{-1}(g(x))=h(x)$를 $g(x)=f(h(x))$로 바꾸거나 $f^{-1}$의 식을 구해 계수를 비교한다.", "ex": {"body": "두 함수 $f(x)=2x+1$, $g(x)=x-3$에 대하여 $(g\\circ f^{-1})(7)$의 값을 구하시오.", "sol": ["$f^{-1}(7)=a$라 하면 $f(a)=7$이므로 $2a+1=7$, $a=3$", "$(g\\circ f^{-1})(7)=g(f^{-1}(7))=g(3)=0$"], "ans": "$0$"}}}, {"key": "T08-13", "no": "13", "name": "역함수의 성질", "book": {"sight": "$(f^{-1})^{-1}=f$, $(g\\circ f)^{-1}=f^{-1}\\circ g^{-1}$, $f^{-1}\\circ f=I$로 <b>식을 먼저 줄이고<\/b> 값을 넣는다. $(f\\circ h)(x)=g(x)$처럼 모르는 함수가 끼어 있으면 양쪽에 $f^{-1}$를 합성해 $h=f^{-1}\\circ g$로 꺼낸다.", "ex": {"body": "두 함수 $f(x)=x+2$, $g(x)=3x-1$에 대하여 $((f\\circ g)^{-1}\\circ f)(1)$의 값을 구하시오.", "sol": ["$(f\\circ g)^{-1}\\circ f=g^{-1}\\circ f^{-1}\\circ f=g^{-1}$이므로 구하는 값은 $g^{-1}(1)$", "$g^{-1}(1)=a$라 하면 $g(a)=1$이므로 $3a-1=1$, $a=\\dfrac{2}{3}$"], "ans": "$\\dfrac{2}{3}$"}}}, {"key": "T08-14", "no": "14", "name": "역함수 그래프의 성질", "book": {"sight": "$y=f(x)$와 $y=f^{-1}(x)$의 그래프는 <b>직선 $y=x$에 대하여 대칭<\/b> — 점 $(a,\\,b)$가 한쪽에 있으면 점 $(b,\\,a)$는 다른 쪽에 있다. $x$의 값이 커질 때 $f(x)$의 값도 커지는 함수이면 두 그래프의 교점은 직선 $y=x$ 위에 있으므로 $f(x)=x$를 푼다. 그래프 문제에서 $f^{-1}(c)$는 $y$좌표가 $c$인 점의 $x$좌표이다.", "ex": {"body": "함수 $f(x)=2x-3$의 그래프와 그 역함수 $y=f^{-1}(x)$의 그래프의 교점의 좌표를 구하시오.", "sol": ["$f(x)$는 $x$의 값이 커지면 함숫값도 커지므로 두 그래프의 교점은 직선 $y=x$ 위에 있다.", "$2x-3=x$에서 $x=3$"], "ans": "$(3,\\,3)$"}}}, {"key": "T08-15", "no": "15", "name": "절댓값 기호를 포함한 그래프", "book": {"sight": "절댓값 기호 안의 식이 $0$이 되는 $x$의 값을 경계로 <b>범위를 나누어 절댓값 기호를 없앤다<\/b>. 꺾은선 그래프의 최댓값·최솟값은 꺾이는 점과 양 끝점에서 나온다. $y=|f(x)|$는 $x$축 아래를 접어 올리고, $y=f(|x|)$는 $x\\ge 0$인 부분을 $y$축에 대하여 대칭이동한다.", "ex": {"body": "$-3\\le x\\le 2$에서 함수 $y=|x+1|+|x-1|$의 최댓값과 최솟값을 구하시오.", "sol": ["(ⅰ) $x&lt;-1$일 때 $y=-(x+1)-(x-1)=-2x$", "(ⅱ) $-1\\le x&lt;1$일 때 $y=(x+1)-(x-1)=2$", "(ⅲ) $x\\ge 1$일 때 $y=(x+1)+(x-1)=2x$", "양 끝값 $x=-3$일 때 $6$, $x=2$일 때 $4$이고, $-1\\le x\\le 1$에서 $2$이므로 최댓값 $6$, 최솟값 $2$"], "ans": "최댓값 $6$, 최솟값 $2$"}}}], "card": [["핵심", "역함수는 처음 함수가 한 일을 되돌린다. 그래서 둘을 합성하면 항등함수가 되고, 두 그래프는 직선 $y=x$에 대하여 대칭이다."], ["뜻", "함수 $f\\,:\\,X\\to Y$의 역함수 $f^{-1}\\,:\\,Y\\to X$가 존재할 때, $f$에 의하여 $x$가 $y$로 가면 $f^{-1}$에 의하여 $y$는 다시 $x$로 돌아온다. 곧 $(f^{-1}\\circ f)(x)=x\\ \\ (x\\in X)$,   $(f\\circ f^{-1})(y)=y\\ \\ (y\\in Y)$ 이다. $f^{-1}\\circ f$는 $X$에서의 항등함수, $f\\circ f^{-1}$는 $Y$에서의 항등함수이다."], ["정리", "두 함수 $f\\,:\\,X\\to Y$, $g\\,:\\,Y\\to Z$가 모두 일대일대응일 때<br>(1) $(f^{-1})^{-1}=f$<br>(2) $(g\\circ f)^{-1}=f^{-1}\\circ g^{-1}$<br>(3) 함수 $y=f(x)$의 그래프와 그 역함수 $y=f^{-1}(x)$의 그래프는 직선 $y=x$에 대하여 대칭이다."], ["주의", "$(g\\circ f)^{-1}$는 $f^{-1}\\circ g^{-1}$이다. 순서가 바뀐다. $g^{-1}\\circ f^{-1}$가 아니다."], ["주의", "함수 $y=f(x)$의 그래프와 그 역함수의 그래프의 교점이 항상 직선 $y=x$ 위에 있는 것은 아니다. 예를 들어 $f(x)=-x+1$은 $f^{-1}(x)=-x+1$이어서 두 그래프가 일치한다. $x$의 값이 커질 때 $f(x)$의 값도 커지는 함수이면 교점은 직선 $y=x$ 위에 있으므로 $f(x)=x$를 풀어 구한다."], ["주의", "$y=|f(x)|$는 $y=f(x)$의 그래프에서 $y&lt;0$인 부분을 $x$축에 대하여 접어 올린 것이고, $y=f(|x|)$는 $x\\ge 0$인 부분을 남기고 그것을 $y$축에 대하여 대칭이동한 것이다. 둘을 혼동하지 않는다."], ["주의", "합성함수와 역함수가 섞인 식은 $f^{-1}\\circ f=I$, $(g\\circ f)^{-1}=f^{-1}\\circ g^{-1}$로 <b>먼저 줄인 뒤<\/b> 값을 넣는다."]]}]}], "schedule": {"고1A": {"C07-01": "2026-10-19", "C07-02": "2026-10-21", "C07-03": "2026-10-21", "C07-04": "2026-10-23", "C08-01": "2026-10-26", "C08-02": "2026-10-28", "C08-03": "2026-10-28", "C08-04": "2026-10-30", "C08-05": "2026-11-02"}, "고1S": {"C07-01": "2026-10-19", "C07-02": "2026-10-21", "C07-03": "2026-10-21", "C07-04": "2026-10-23", "C08-01": "2026-10-26", "C08-02": "2026-10-28", "C08-03": "2026-10-28", "C08-04": "2026-10-30", "C08-05": "2026-11-02"}, "고1T": {"C07-01": "2026-10-18", "C07-02": "2026-10-18", "C07-03": "2026-10-18", "C07-04": "2026-10-18", "C08-01": "2026-10-24", "C08-02": "2026-10-24", "C08-03": "2026-10-25", "C08-04": "2026-10-25", "C08-05": "2026-10-31"}}}, "core_c1": {"제목": "CORE 루프 · 미적분Ⅰ", "범위": "05 도함수의 활용 (2) ~ 09 정적분의 활용 (기말)", "학년": "고2", "set": "core_c1", "units": [{"code": "m05", "name": "05 도함수의 활용 (2)", "concepts": [{"key": "Cm05-01", "no": "01", "title": "함수의 증가와 감소", "themes": [{"key": "Tm05-01", "no": "01", "name": "함수의 증가와 감소", "book": {"sight": "$f'(x)$를 <b>인수분해해 부호<\/b>를 정한다. 상수함수가 아닌 다항함수 $f(x)$는 $f'(x)\\ge 0$인 구간에서 증가, $f'(x)\\le 0$인 구간에서 감소한다. 구간 문제는 증가(감소) 구간 전체를 먼저 구하고 주어진 구간을 그 안에 넣는다.", "ex": {"body": "함수 $f(x)=x^{3}-6x^{2}+9x+1$이 증가하는 구간과 감소하는 구간을 구하시오.", "sol": ["$f'(x)=3x^{2}-12x+9=3(x-1)(x-3)$", "$x\\le 1$ 또는 $x\\ge 3$에서 $f'(x)\\ge 0$, $1\\le x\\le 3$에서 $f'(x)\\le 0$", "따라서 구간 $(-\\infty,\\,1]$, $[3,\\,\\infty)$에서 증가하고, 구간 $[1,\\,3]$에서 감소한다."], "ans": "증가 $(-\\infty,\\,1]$, $[3,\\,\\infty)$ / 감소 $[1,\\,3]$"}}}, {"key": "Tm05-02", "no": "02", "name": "실수 전체에서 증가 또는 감소할 조건", "book": {"sight": "최고차항의 계수가 양수인 삼차함수가 실수 전체에서 증가 ⇔ $f'(x)\\ge 0$이 항상 성립 ⇔ <b>이차식 $f'(x)$의 판별식 $D\\le 0$<\/b>. 이런 삼차함수에서는 ‘$x_{1}&lt;x_{2}$이면 $f(x_{1})&lt;f(x_{2})$’, ‘역함수가 존재’, ‘일대일’이 모두 같은 조건이다. (최고차항의 계수가 음수이면 실수 전체에서 감소하는 조건이 된다.)", "ex": {"body": "함수 $f(x)=x^{3}+ax^{2}+3x+1$이 실수 전체의 집합에서 증가하도록 하는 실수 $a$의 값의 범위를 구하시오.", "sol": ["$f'(x)=3x^{2}+2ax+3\\ge 0$이 모든 실수 $x$에 대하여 성립해야 한다.", "$\\dfrac{D}{4}=a^{2}-9\\le 0$  $\\therefore\\ -3\\le a\\le 3$", "$D=0$이면 $f'(x)=0$인 점이 하나뿐이라 증가는 유지되므로 등호가 들어간다."], "ans": "$-3\\le a\\le 3$"}}}, {"key": "Tm05-03", "no": "03", "name": "주어진 구간에서 증가 또는 감소할 조건", "book": {"sight": "상수함수가 아닌 다항함수 $f(x)$가 구간에서 증가 ⇔ 그 구간에서 $f'(x)\\ge 0$. 이차식 $f'(x)$의 그래프(축의 위치)를 보고 <b>구간에서의 최솟값(최댓값)<\/b>만 조건으로 바꾼다. 대부분 <b>양 끝값의 부호<\/b> 조건이 된다.", "ex": {"body": "함수 $f(x)=-x^{3}+3x^{2}+ax$가 닫힌구간 $[1,\\,2]$에서 증가하도록 하는 실수 $a$의 최솟값을 구하시오.", "sol": ["$f'(x)=-3x^{2}+6x+a=-3(x-1)^{2}+a+3$", "$[1,\\,2]$에서 $f'(x)$는 감소하므로 최솟값은 $f'(2)=a$", "$f'(2)=a\\ge 0$이어야 하므로 $a$의 최솟값은 $0$"], "ans": "$0$"}}}], "card": [["핵심", "도함수의 부호가 함수의 증가와 감소를 결정한다. 이 CONCEPT의 문제는 모두 $f'(x)$의 부호를 조사하는 일로 바뀐다."], ["뜻", "함수 $f(x)$가 어떤 구간에 속하는 임의의 두 실수 $x_{1}$, $x_{2}$에 대하여 $x_{1}&lt;x_{2}$일 때 $f(x_{1})&lt;f(x_{2})$이면 <b>증가<\/b>,  $f(x_{1})&gt;f(x_{2})$이면 <b>감소<\/b> 한다고 한다. 증가와 감소는 언제나 구간을 정해 놓고 말한다."], ["정리", "함수 $f(x)$가 어떤 열린구간에서 미분가능하고, 그 구간에 속하는 모든 $x$에 대하여<br>(1) $f'(x)&gt;0$이면 $f(x)$는 그 구간에서 증가한다.<br>(2) $f'(x)&lt;0$이면 $f(x)$는 그 구간에서 감소한다.<br>(3) $f(x)$가 상수함수가 아닌 다항함수이면, $f(x)$가 어떤 구간에서 증가하기 위한 필요충분조건은 그 구간에서 $f'(x)\\ge 0$인 것이다. (감소이면 $f'(x)\\le 0$)"], ["주의", "(1)의 역은 성립하지 않는다. $f(x)=x^{3}$은 실수 전체의 집합에서 증가하지만 $f'(0)=0$이다. 그래서 <b>상수함수가 아닌 다항함수<\/b>가 증가하기 위한 조건은 $f'(x)&gt;0$이 아니라 $f'(x)\\ge 0$으로 세운다."], ["주의", "<b>최고차항의 계수가 양수인<\/b> 삼차함수가 실수 전체의 집합에서 증가하기 위한 조건은 이차방정식 $f'(x)=0$의 판별식 $D\\le 0$이다. $D&lt;0$이 아니다. (최고차항의 계수가 음수이면 $D\\le 0$일 때 감소한다. 예: $f(x)=-x^{3}$)"]]}, {"key": "Cm05-02", "no": "02", "title": "함수의 극대와 극소", "themes": [{"key": "Tm05-04", "no": "04", "name": "함수의 극대와 극소", "book": {"sight": "$f'(x)=0$인 $x$를 구하고 <b>그 좌우에서 부호가 바뀌는지<\/b> 증감표로 확인한다. 최고차항의 계수가 양수인 삼차함수는 작은 근에서 극대, 큰 근에서 극소이다.", "ex": {"body": "함수 $f(x)=x^{3}-3x^{2}-9x+5$의 극댓값과 극솟값을 구하시오.", "sol": ["$f'(x)=3x^{2}-6x-9=3(x+1)(x-3)$", "$x=-1$의 좌우에서 $f'(x)$의 부호가 양에서 음으로, $x=3$의 좌우에서 음에서 양으로 바뀐다.", "극댓값 $f(-1)=-1-3+9+5=10$, 극솟값 $f(3)=27-27-27+5=-22$"], "ans": "극댓값 $10$, 극솟값 $-22$"}}}, {"key": "Tm05-05", "no": "05", "name": "극대와 극소를 이용한 미정계수의 결정", "book": {"sight": "‘$x=a$에서 극값 $b$’는 <b>$f'(a)=0$, $f(a)=b$ 두 식<\/b>이다. 극값을 갖는 두 $x$가 주어지면 $f'(x)$의 두 근 → 근과 계수의 관계. 구한 뒤 실제로 극대(극소)인지 확인한다.", "ex": {"body": "함수 $f(x)=x^{3}+ax^{2}+bx+2$가 $x=1$에서 극솟값 $-2$를 가질 때, 상수 $a$, $b$의 값을 구하시오.", "sol": ["$f'(1)=3+2a+b=0$, $f(1)=3+a+b=-2$", "두 식을 연립하면 $a=2$, $b=-7$", "이때 $f'(x)=3x^{2}+4x-7=(3x+7)(x-1)$이므로 $x=1$의 좌우에서 음에서 양으로 바뀌어 극소가 맞다."], "ans": "$a=2$, $b=-7$"}}}, {"key": "Tm05-06", "no": "06", "name": "극대와 극소의 활용", "book": {"sight": "대칭($f(-x)=f(x)$, $f(-x)=-f(x)$)·접함($x$축에 접하면 중근)·$f'$의 대칭축 같은 <b>구조 조건으로 식의 꼴부터 줄인다<\/b>. 미지수가 줄어든 뒤 극값 조건을 쓴다.", "ex": {"body": "함수 $f(x)=x^{3}-3x^{2}+k$의 극댓값과 극솟값의 합이 $6$일 때, 상수 $k$의 값을 구하시오.", "sol": ["$f'(x)=3x(x-2)$이므로 극댓값 $f(0)=k$, 극솟값 $f(2)=k-4$", "$k+(k-4)=6$  $\\therefore\\ k=5$"], "ans": "$5$"}}}, {"key": "Tm05-07", "no": "07", "name": "극대와 극소를 이용한 계수의 부호 결정", "book": {"sight": "그래프에서 읽는 것 세 가지 — <b>끝의 방향<\/b>(최고차항의 부호), <b>$y$절편<\/b>(상수항), <b>극값을 갖는 $x$의 합·곱<\/b>($f'(x)=0$의 근과 계수의 관계로 나머지 계수).", "ex": {"body": "삼차함수 $f(x)=ax^{3}+bx^{2}+cx+d\\ (a&gt;0)$가 $x=-1$에서 극대, $x=3$에서 극소이고 $f(0)&lt;0$일 때, $b$, $c$, $d$의 부호를 구하시오.", "sol": ["$f'(x)=3ax^{2}+2bx+c$의 두 근이 $-1$, $3$이므로", "$-\\dfrac{2b}{3a}=2$에서 $b=-3a&lt;0$,  $\\dfrac{c}{3a}=-3$에서 $c=-9a&lt;0$", "$d=f(0)&lt;0$"], "ans": "$b&lt;0$, $c&lt;0$, $d&lt;0$"}}}], "card": [["핵심", "증가에서 감소로 바뀌는 점이 극대, 감소에서 증가로 바뀌는 점이 극소이다. 상수함수가 아닌 다항함수에서는 $f'(x)$의 부호가 바뀌는 점을 찾는 일이다."], ["뜻", "함수 $f(x)$가 $x=a$를 포함하는 어떤 열린구간에 속하는 모든 $x$에 대하여 $f(x)\\le f(a)$이면 $x=a$에서 <b>극대<\/b>,  $f(x)\\ge f(a)$이면 <b>극소<\/b> 라 하고, 이때 $f(a)$를 각각 극댓값, 극솟값이라 한다. 극댓값과 극솟값을 통틀어 <b>극값<\/b>이라 한다."], ["정리", "미분가능한 함수 $f(x)$에 대하여<br>(1) $f(x)$가 $x=a$에서 극값을 가지면 $f'(a)=0$이다.<br>(2) $f'(a)=0$이고 $x=a$의 좌우에서 $f'(x)$의 부호가 양에서 음으로 바뀌면 $x=a$에서 극대, 음에서 양으로 바뀌면 극소이다."], ["주의", "(1)의 역은 성립하지 않는다. $f(x)=x^{3}$은 $f'(0)=0$이지만 $x=0$의 좌우에서 $f'(x)&gt;0$이므로 극값을 갖지 않는다."], ["주의", "극값 조건($f'(a)=0$, $f(a)=$극값)으로 미정계수를 구한 뒤에는, 그 점의 좌우에서 $f'(x)$의 부호가 실제로 바뀌는지 확인한다."], ["주의", "<b>최고차항의 계수가 양수인<\/b> 삼차함수가 극값을 가지면 $x$가 작은 쪽에서 극대, 큰 쪽에서 극소이다. 음수이면 반대이다."]]}, {"key": "Cm05-03", "no": "03", "title": "도함수의 그래프와 함수의 그래프", "themes": [{"key": "Tm05-08", "no": "08", "name": "도함수의 그래프를 이용한 극대와 극소", "book": {"sight": "$y=f'(x)$의 그래프로 증가·감소를 판단할 때는 <b>도함수 값의 부호<\/b>에 주목한다. 그 점의 좌우에서 $f'(x)$의 부호가 <b>양에서 음으로 바뀌면 극대, 음에서 양으로 바뀌면 극소<\/b>이고, $x$축에 닿기만 하고 부호가 바뀌지 않으면 극값이 아니다.", "ex": {"body": "다항함수 $f(x)$에 대하여 $f'(x)=(x+2)(x-1)^{2}(x-3)$일 때, 함수 $f(x)$가 극대, 극소가 되는 $x$의 값을 구하시오.", "sol": ["$(x-1)^{2}\\ge 0$이므로 $x\\ne 1$에서 $f'(x)$의 부호는 $(x+2)(x-3)$의 부호와 같다.", "$x=-2$에서 양→음 → 극대, $x=3$에서 음→양 → 극소", "$x=1$에서는 좌우 모두 음이라 부호가 바뀌지 않으므로 극값이 아니다."], "ans": "극대 $x=-2$, 극소 $x=3$"}}}, {"key": "Tm05-09", "no": "09", "name": "도함수의 그래프와 함수의 그래프 해석", "book": {"sight": "구간에서의 증가·감소는 그 구간에서 $f'$의 <b>부호가 한 가지인지<\/b>로 판정한다. 곱의 꼴 $g'(x)=(x-k)f'(x)$는 <b>두 인수의 부호표<\/b>를 따로 그려 곱한다.", "ex": {"body": "다항함수 $f(x)$에 대하여 $f'(x)=-(x+1)(x-2)^{2}$일 때, $f(x)$가 증가하는 구간과 감소하는 구간을 구하고 $f(0)$과 $f(2)$의 대소를 비교하시오.", "sol": ["$(x-2)^{2}\\ge 0$이므로 $x&lt;-1$에서 $f'(x)&gt;0$, $x&gt;-1$에서 $f'(x)\\le 0$", "구간 $(-\\infty,\\,-1]$에서 증가, $[-1,\\,\\infty)$에서 감소한다.", "$0&lt;2$이고 $[-1,\\,\\infty)$에서 감소하므로 $f(0)&gt;f(2)$"], "ans": "증가 $(-\\infty,\\,-1]$, 감소 $[-1,\\,\\infty)$, $f(0)&gt;f(2)$"}}}, {"key": "Tm05-10", "no": "10", "name": "도함수의 그래프로 함수의 그래프 그리기", "book": {"sight": "$f'$의 그래프 → <b>증감표<\/b>(부호) → <b>개형<\/b>. $f'$가 극값을 갖는 곳(봉우리·골짜기)은 $f$의 굽은 방향이 바뀌는 곳일 뿐 극값이 아니다. 함숫값 조건으로 $x$축과의 위치를 정한다.", "ex": {"body": "함수 $f(x)=x^{4}-4x^{3}$의 증감표를 만들고 극값을 구하시오.", "sol": ["$f'(x)=4x^{3}-12x^{2}=4x^{2}(x-3)$", "$x&lt;3$에서 $f'(x)\\le 0$($x=0$에서만 $0$), $x&gt;3$에서 $f'(x)&gt;0$이므로 증감표는 다음과 같다.", "$x$⋯$0$⋯$3$⋯$f'(x)$$-$$0$$-$$0$$+$$f(x)$↘$0$↘$-27$↗", "$x=0$에서는 부호가 바뀌지 않으므로 극값이 아니고, $x=3$에서 극솟값 $f(3)=81-108=-27$"], "ans": "극솟값 $-27$ ($x=3$), 극댓값 없음"}}}], "card": [["핵심", "$y=f'(x)$의 그래프로 함수의 증가·감소를 판단할 때는 도함수 값의 부호에 주목한다. 부호가 $f(x)$의 증가·감소와 극값을 정하고, 증감표가 그래프의 개형을 정한다."], ["뜻", "함수 $f(x)$의 증가·감소와 극대·극소를 표로 정리한 것을 <b>증감표<\/b>라 하고, 증감표에 따라 그린 그래프의 대략적인 모양을 그래프의 <b>개형<\/b> 이라 한다. 도함수 $y=f'(x)$의 그래프가 주어지면 그 부호만으로 증감표를 만들 수 있다."], ["정리", "미분가능한 함수 $f(x)$와 도함수 $y=f'(x)$의 그래프에 대하여<br>(1) $y=f'(x)$의 그래프가 $x$축보다 위쪽에 있는 구간에서 $f(x)$는 증가하고, 아래쪽에 있는 구간에서 감소한다.<br>(2) $y=f'(x)$의 그래프가 $x=a$에서 $x$축을 위에서 아래로 지나면 $x=a$에서 극대, 아래에서 위로 지나면 극소이다.<br>(3) $y=f'(x)$의 그래프가 $x=a$에서 $x$축에 접하기만 하고 지나가지 않으면 $x=a$에서 극값을 갖지 않는다."], ["주의", "주어진 그래프가 $y=f(x)$인지 $y=f'(x)$인지부터 확인한다."], ["주의", "$y=f'(x)$의 그래프의 꼭짓점($f'(x)$가 최대·최소인 점)은 $f(x)$의 극값과 관계없다. 상수함수가 아닌 다항함수의 극값은 $f'(x)$의 부호가 바뀌는 점에서만 생긴다."], ["주의", "$x$축에 접하더라도 <b>지나가면<\/b> 극값을 갖는다. $f'(x)=x^{3}$의 그래프는 원점에서 $x$축에 접하면서 지나가므로 $f(x)=\\frac{1}{4}x^{4}$은 $x=0$에서 극소이다."]]}, {"key": "Cm05-04", "no": "04", "title": "극값을 가질 조건", "themes": [{"key": "Tm05-11", "no": "11", "name": "삼차함수가 극값을 가질 조건", "book": {"sight": "삼차함수가 극값을 가짐 ⇔ 이차방정식 $f'(x)=0$이 <b>서로 다른 두 실근<\/b> ⇔ $D&gt;0$. 삼차함수는 극대와 극소를 항상 함께 갖는다(하나만 갖는 일은 없다).", "ex": {"body": "함수 $f(x)=x^{3}+ax^{2}+3ax+1$이 극값을 갖도록 하는 실수 $a$의 값의 범위를 구하시오.", "sol": ["$f'(x)=3x^{2}+2ax+3a=0$이 서로 다른 두 실근을 가져야 한다.", "$\\dfrac{D}{4}=a^{2}-9a&gt;0$  $\\therefore\\ a&lt;0$ 또는 $a&gt;9$"], "ans": "$a&lt;0$ 또는 $a&gt;9$"}}}, {"key": "Tm05-12", "no": "12", "name": "삼차함수가 극값을 갖지 않을 조건", "book": {"sight": "극값을 갖지 않음 ⇔ 이차방정식 $f'(x)=0$이 중근 또는 서로 다른 두 허근을 갖는다 ⇔ <b>$D\\le 0$<\/b> (등호 포함). 두 함수 조건이 섞이면 각각의 범위를 구해 공통부분.", "ex": {"body": "함수 $f(x)=-x^{3}+ax^{2}-3x$가 극값을 갖지 않도록 하는 실수 $a$의 값의 범위를 구하시오.", "sol": ["$f'(x)=-3x^{2}+2ax-3$", "$\\dfrac{D}{4}=a^{2}-9\\le 0$  $\\therefore\\ -3\\le a\\le 3$"], "ans": "$-3\\le a\\le 3$"}}}, {"key": "Tm05-13", "no": "13", "name": "삼차함수가 주어진 구간에서 극값을 가질 조건", "book": {"sight": "‘구간 안에서 극값’은 <b>이차방정식 $f'(x)=0$의 근의 위치<\/b> 문제다. 이차함수 $y=f'(x)$를 그려 <b>판별식·축·구간 끝의 함숫값 부호<\/b>로 조건을 세운다.", "ex": {"body": "함수 $f(x)=x^{3}-3ax^{2}+3x$가 $x&gt;0$에서 극댓값과 극솟값을 모두 갖도록 하는 실수 $a$의 값의 범위를 구하시오.", "sol": ["$f'(x)=3(x^{2}-2ax+1)=0$이 서로 다른 두 양의 실근을 가져야 한다.", "$\\dfrac{D}{4}=a^{2}-1&gt;0$, 두 근의 합 $2a&gt;0$, 두 근의 곱 $1&gt;0$", "$\\therefore\\ a&gt;1$"], "ans": "$a&gt;1$"}}}, {"key": "Tm05-14", "no": "14", "name": "사차함수의 극값의 조건", "book": {"sight": "사차함수 $f(x)$의 도함수 $f'(x)$는 삼차함수 — <b>한 근을 찾아 인수분해<\/b>해 (일차식)(이차식)으로 만든다. 극대·극소가 모두 있으려면 $f'$의 부호가 세 번 바뀌어야 하고, <b>이차식이 다른 두 실근을 가지되 그 근이 일차식의 근과 달라야<\/b> 한다.", "ex": {"body": "함수 $f(x)=x^{4}-4x^{3}+2ax^{2}$이 극댓값을 갖도록 하는 실수 $a$의 값의 범위를 구하시오.", "sol": ["$f'(x)=4x^{3}-12x^{2}+4ax=4x(x^{2}-3x+a)$", "극댓값을 가지려면 $f'(x)$의 부호가 세 번 바뀌어야 하므로 $x^{2}-3x+a=0$이 $0$이 아닌 서로 다른 두 실근을 가져야 한다.", "$D=9-4a&gt;0$이고 $a\\ne 0$  $\\therefore\\ a&lt;0$ 또는 $0&lt;a&lt;\\dfrac{9}{4}$"], "ans": "$a&lt;0$ 또는 $0&lt;a&lt;\\dfrac{9}{4}$"}}}], "card": [["핵심", "삼차함수의 극값은 이차방정식 $f'(x)=0$의 실근에서 생긴다. 극값이 있느냐는 판별식의 부호, 어디에 있느냐는 근의 위치 문제가 된다."], ["뜻", "삼차함수 $f(x)$의 도함수는 이차함수이므로, 이차방정식 $f'(x)=0$의 판별식을 $D$라 하면 $D&gt;0\\iff$ 극값을 갖는다,  $D\\le 0\\iff$ 극값을 갖지 않는다 이다. 극값을 가지면 극댓값과 극솟값을 하나씩 갖는다."], ["정리", "함수 $f(x)$에 대하여<br>(1) 삼차함수 $f(x)$가 열린구간 $(\\alpha,\\,\\beta)$에서 극댓값과 극솟값을 모두 가질 조건은 $f'(x)=0$이 이 구간에서 서로 다른 두 실근을 갖는 것이다.<br>(2) 최고차항의 계수가 양수인 사차함수 $f(x)$가 극댓값을 가질 조건은 삼차방정식 $f'(x)=0$이 서로 다른 세 실근을 갖는 것이다."], ["주의", "극값을 갖지 않을 조건은 $D&lt;0$이 아니라 $D\\le 0$이다. $D=0$이면 $f'(x)=0$이 중근을 가져 부호가 바뀌지 않는다."], ["주의", "구간 안에서 극값을 가질 조건은 판별식만으로 정할 수 없다. 축의 위치와 구간 양 끝에서 $f'(x)$의 값을 함께 본다."]]}, {"key": "Cm05-05", "no": "05", "title": "함수의 최대와 최소", "themes": [{"key": "Tm05-15", "no": "15", "name": "함수의 최대와 최소", "book": {"sight": "닫힌구간의 최대·최소 = <b>극값과 양 끝값을 모두 모아 비교<\/b>. 합성함수·치환은 <b>안쪽 식의 범위<\/b>부터 구하고 바깥 함수를 그 범위에서 본다.", "ex": {"body": "닫힌구간 $[-1,\\,3]$에서 함수 $f(x)=x^{3}-3x^{2}+2$의 최댓값과 최솟값을 구하시오.", "sol": ["$f'(x)=3x(x-2)$이므로 극값 후보 $f(0)=2$, $f(2)=-2$", "양 끝값 $f(-1)=-2$, $f(3)=2$", "네 값을 비교하면 최댓값 $2$, 최솟값 $-2$"], "ans": "최댓값 $2$, 최솟값 $-2$"}}}, {"key": "Tm05-16", "no": "16", "name": "최대와 최소를 이용한 미정계수의 결정", "book": {"sight": "<b>매개변수에 따라 극값을 갖는 $x$의 위치를 확인하고<\/b>, 구간의 양 끝값과 비교해 어느 값이 최대·최소인지 먼저 정한 뒤 식을 세운다. 상수항만 미지수이면 최댓값과 최솟값이 같은 만큼 움직인다.", "ex": {"body": "닫힌구간 $[0,\\,3]$에서 함수 $f(x)=x^{3}-6x^{2}+9x+a$의 최댓값이 $5$일 때, 상수 $a$의 값과 최솟값을 구하시오.", "sol": ["$f'(x)=3(x-1)(x-3)$", "$f(0)=a$, $f(1)=a+4$, $f(3)=a$", "최댓값 $a+4=5$에서 $a=1$, 최솟값은 $f(0)=f(3)=1$"], "ans": "$a=1$, 최솟값 $1$"}}}, {"key": "Tm05-17", "no": "17", "name": "최대와 최소의 활용", "book": {"sight": "구하는 양을 <b>변수 하나의 함수<\/b>로 세우고 <b>변수의 범위(정의역)<\/b>를 먼저 적는다. 그 범위에서 극값·끝값을 비교한다.", "ex": {"body": "곡선 $y=-x^{2}+4$ 위의 점 $\\mathrm{P}(t,\\,4-t^{2})\\ (0&lt;t&lt;2)$에서 $x$축, $y$축에 내린 수선과 두 좌표축으로 둘러싸인 직사각형의 넓이의 최댓값을 구하시오.", "sol": ["넓이 $S(t)=t(4-t^{2})=4t-t^{3}\\ (0&lt;t&lt;2)$", "$S'(t)=4-3t^{2}=0$에서 $t=\\dfrac{2\\sqrt{3}}{3}$", "$0&lt;t&lt;\\dfrac{2\\sqrt{3}}{3}$에서 $S'(t)&gt;0$, $\\dfrac{2\\sqrt{3}}{3}&lt;t&lt;2$에서 $S'(t)&lt;0$이므로 $S(t)$는 이 값까지 증가하다가 감소한다. 따라서 이때 최댓값을 갖는다.", "$S\\left(\\dfrac{2\\sqrt{3}}{3}\\right)=\\dfrac{2\\sqrt{3}}{3}\\cdot\\dfrac{8}{3}=\\dfrac{16\\sqrt{3}}{9}$"], "ans": "$\\dfrac{16\\sqrt{3}}{9}$"}}}], "card": [["핵심", "닫힌구간에서 연속인 함수는 반드시 최댓값과 최솟값을 갖는다. 후보는 구간 안의 극값과 양 끝의 함숫값뿐이다."], ["뜻", "함수 $f(x)$의 정의역에 속하는 모든 $x$에 대하여 $f(x)\\le f(c)$인 $f(c)$를 <b>최댓값<\/b>,  $f(x)\\ge f(d)$인 $f(d)$를 <b>최솟값<\/b> 이라 한다. 극값은 근처에서만 비교한 값이고, 최댓값·최솟값은 정의역 전체에서 비교한 값이다."], ["정리", "닫힌구간 $[a,\\,b]$에서 연속인 함수 $f(x)$에 대하여<br>(1) $f(x)$는 이 구간에서 반드시 최댓값과 최솟값을 갖는다. (최대·최소 정리)<br>(2) 최댓값과 최솟값은 구간 안의 극값과 $f(a)$, $f(b)$ 중에서 정해진다.<br>(3) $f(x)$가 미분가능하고 구간 안의 극값이 하나뿐일 때, 그것이 극댓값이면 최댓값, 극솟값이면 최솟값이다."], ["주의", "극댓값이 곧 최댓값은 아니다. 양 끝의 함숫값과 반드시 비교한다."], ["주의", "활용 문제는 변수를 정한 뒤 <b>그 변수의 범위부터<\/b> 적는다. 범위 밖의 극값은 후보가 아니다."]]}]}, {"code": "m06", "name": "06 도함수의 활용 (3)", "concepts": [{"key": "Cm06-01", "no": "01", "title": "방정식에의 활용", "themes": [{"key": "Tm06-01", "no": "01", "name": "방정식의 실근의 개수", "book": {"sight": "상수 $k$를 한쪽으로 분리해 $f(x)=k$ 꼴로 만들고, <b>곡선 $y=f(x)$와 직선 $y=k$의 교점<\/b>을 센다. 증감표의 극댓값·극솟값이 직선의 위치를 나누는 경계이다. $y=|f(x)|$는 $x$축 아래 부분을 위로 접어 올린 그래프로 센다.", "ex": {"body": "방정식 $x^{3}-3x^{2}-24x-k=0$이 서로 다른 세 실근을 갖도록 하는 정수 $k$의 개수를 구하시오.", "sol": ["$x^{3}-3x^{2}-24x=k$로 분리하고 $f(x)=x^{3}-3x^{2}-24x$라 하면", "$f'(x)=3x^{2}-6x-24=3(x+2)(x-4)$", "극댓값 $f(-2)=-8-12+48=28$, 극솟값 $f(4)=64-48-96=-80$", "곡선 $y=f(x)$와 직선 $y=k$가 서로 다른 세 점에서 만나려면 $-80&lt;k&lt;28$", "따라서 정수 $k$는 $-79$, $-78$, $\\cdots$, $27$의 $107$개이다."], "ans": "$107$"}}}, {"key": "Tm06-02", "no": "02", "name": "방정식의 실근의 부호", "book": {"sight": "$f(x)=k$로 분리한 뒤 교점의 개수와 함께 <b>교점의 $x$좌표가 $y$축의 어느 쪽에 있는지<\/b> 본다. 직선 $y=k$가 <b>$y$절편 $f(0)$<\/b>보다 위인지 아래인지가 양의 실근과 음의 실근을 가르는 경계이다.", "ex": {"body": "방정식 $x^{3}-3x+1-k=0$이 서로 다른 두 개의 양의 실근과 한 개의 음의 실근을 갖도록 하는 실수 $k$의 값의 범위를 구하시오.", "sol": ["$x^{3}-3x+1=k$로 분리하고 $f(x)=x^{3}-3x+1$이라 하면 $f'(x)=3(x+1)(x-1)$", "극댓값 $f(-1)=3$, 극솟값 $f(1)=-1$, $y$절편 $f(0)=1$", "직선 $y=k$가 곡선과 세 점에서 만나고 그중 두 점이 $y$축의 오른쪽에 있으려면, 직선이 점 $(0,\\,1)$보다 아래에 있고 극솟값보다 위에 있어야 한다.", "$\\therefore\\ -1&lt;k&lt;1$"], "ans": "$-1&lt;k&lt;1$"}}}, {"key": "Tm06-03", "no": "03", "name": "방정식 <eq>f(x)=k<\/eq>의 실근과 미정계수", "book": {"sight": "상수를 분리하기 어려우면 $f(x)=0$ 그대로 <b>(극댓값)$\\times$(극솟값)의 부호<\/b>로 판정한다. 세 실근 ⇔ $&lt;0$, 서로 다른 두 실근 ⇔ $=0$, 한 실근 ⇔ $&gt;0$ 또는 극값 없음. 극값을 갖는 $x$가 매개변수에 따라 움직이면 먼저 그 위치부터 정한다.", "ex": {"body": "삼차방정식 $x^{3}-3a^{2}x+2=0$이 서로 다른 세 실근을 갖도록 하는 양수 $a$의 값의 범위를 구하시오.", "sol": ["$f(x)=x^{3}-3a^{2}x+2$라 하면 $f'(x)=3(x+a)(x-a)$", "$a&gt;0$이므로 $x=-a$에서 극대, $x=a$에서 극소이다.", "극댓값 $f(-a)=2a^{3}+2$, 극솟값 $f(a)=-2a^{3}+2$", "서로 다른 세 실근을 가지려면 $f(-a)f(a)&lt;0$이고, $f(-a)&gt;0$이므로 $-2a^{3}+2&lt;0$", "$a^{3}&gt;1$  $\\therefore\\ a&gt;1$"], "ans": "$a&gt;1$"}}}, {"key": "Tm06-04", "no": "04", "name": "두 그래프의 교점의 개수", "book": {"sight": "두 그래프의 교점 ⇔ 방정식 $f(x)=g(x)$의 실근. <b>차 $f(x)-g(x)$를 정리해 한 함수로<\/b> 만들고 상수 $k$는 한쪽으로 분리한다. 그다음은 THEME 01·03과 같다.", "ex": {"body": "두 곡선 $y=x^{3}+2x$, $y=3x^{2}+2x+k$가 서로 다른 세 점에서 만나도록 하는 실수 $k$의 값의 범위를 구하시오.", "sol": ["$x^{3}+2x=3x^{2}+2x+k$에서 $x^{3}-3x^{2}=k$", "$h(x)=x^{3}-3x^{2}$이라 하면 $h'(x)=3x(x-2)$", "극댓값 $h(0)=0$, 극솟값 $h(2)=-4$", "곡선 $y=h(x)$와 직선 $y=k$가 서로 다른 세 점에서 만나야 하므로 $-4&lt;k&lt;0$"], "ans": "$-4&lt;k&lt;0$"}}}, {"key": "Tm06-05", "no": "05", "name": "곡선에 그은 접선의 개수", "book": {"sight": "접점을 $(t,\\,f(t))$로 놓고, 접선이 주어진 점을 지난다는 조건으로 <b>$t$에 대한 방정식<\/b>을 만든다. 삼차함수의 그래프에서는 접점이 다르면 접선도 다르므로 <b>접선의 개수 = 그 방정식의 서로 다른 실근의 개수<\/b>이다.", "ex": {"body": "점 $(1,\\,k)$에서 곡선 $y=x^{3}$에 서로 다른 세 개의 접선을 그을 수 있도록 하는 실수 $k$의 값의 범위를 구하시오.", "sol": ["접점을 $(t,\\,t^{3})$이라 하면 접선의 방정식은 $y=3t^{2}(x-t)+t^{3}$, 곧 $y=3t^{2}x-2t^{3}$", "이 직선이 점 $(1,\\,k)$를 지나므로 $k=-2t^{3}+3t^{2}$", "$g(t)=-2t^{3}+3t^{2}$이라 하면 $g'(t)=-6t(t-1)$이므로 극솟값 $g(0)=0$, 극댓값 $g(1)=1$", "접선이 세 개이려면 $t$에 대한 방정식 $g(t)=k$가 서로 다른 세 실근을 가져야 하므로 $0&lt;k&lt;1$"], "ans": "$0&lt;k&lt;1$"}}}], "card": [["핵심", "방정식의 실근은 그래프의 교점의 $x$좌표이다. 실근의 개수를 묻는 문제는 모두 두 그래프가 몇 번 만나는지 세는 일로 바뀐다."], ["뜻", "방정식 $f(x)=g(x)$의 실근은 두 함수 $y=f(x)$, $y=g(x)$의 그래프의 교점의 $x$좌표 이다. 따라서 방정식의 서로 다른 실근의 개수는 두 그래프의 교점의 개수와 같다."], ["정리", "다항함수 $f(x)$와 실수 $k$에 대하여<br>(1) 방정식 $f(x)=k$의 서로 다른 실근의 개수는 곡선 $y=f(x)$와 직선 $y=k$의 교점의 개수와 같다.<br>(2) 극값을 갖는 삼차함수 $f(x)$에 대하여 삼차방정식 $f(x)=0$은 (극댓값)$\\times$(극솟값)$&lt;0$이면 서로 다른 세 실근, $=0$이면 중근과 다른 한 실근, $&gt;0$이면 한 실근과 두 허근을 갖는다.<br>(3) 극값을 갖지 않는 삼차함수 $f(x)$에 대하여 방정식 $f(x)=0$의 실근은 오직 하나뿐이다."], ["주의", "서로 다른 두 실근을 갖는 삼차방정식은 중근을 갖는다. 이때 직선 $y=k$는 곡선의 극대점 또는 극소점을 지나며 그 점에서 곡선에 접한다."], ["주의", "실근의 부호를 묻는 문제는 교점의 개수와 함께 교점이 $y$축의 왼쪽(음근)에 있는지 오른쪽(양근)에 있는지를 본다. 직선 $y=k$가 $y$절편 $f(0)$보다 위인지 아래인지가 경계이다."], ["주의", "<b>삼차함수의 그래프<\/b>에 그은 접선의 개수는 접점의 $x$좌표 $t$에 대한 방정식의 서로 다른 실근의 개수와 같다. 접점이 다르면 접선도 다르기 때문이다."]]}, {"key": "Cm06-02", "no": "02", "title": "부등식에의 활용", "themes": [{"key": "Tm06-06", "no": "06", "name": "부등식이 성립할 조건", "book": {"sight": "모든 실수 $x$에 대하여 $f(x)\\ge 0$ ⇔ <b>$f(x)$의 최솟값 $\\ge 0$<\/b>. 사차함수는 증감표에서 가장 낮은 극솟값이 최솟값이다. $f'(x)=0$의 중근은 극값이 아니다. 구간이 $x&gt;a$처럼 열려 있으면 증가·감소만 보고 끝값으로 판정한다.", "ex": {"body": "모든 실수 $x$에 대하여 부등식 $3x^{4}-4x^{3}+k\\ge 0$이 성립하도록 하는 실수 $k$의 최솟값을 구하시오.", "sol": ["$f(x)=3x^{4}-4x^{3}+k$라 하면 $f'(x)=12x^{3}-12x^{2}=12x^{2}(x-1)$", "$x=0$의 좌우에서 $f'(x)$의 부호가 바뀌지 않으므로 극값은 $x=1$에서의 극솟값뿐이고, 이것이 최솟값이다.", "최솟값 $f(1)=k-1\\ge 0$  $\\therefore\\ k\\ge 1$", "따라서 $k$의 최솟값은 $1$이다."], "ans": "$1$"}}}, {"key": "Tm06-07", "no": "07", "name": "주어진 구간에서 부등식이 성립할 조건", "book": {"sight": "구간이 주어지면 <b>그 구간 안의 극값과 양 끝값만<\/b> 비교해 최솟값(최댓값)을 정한다. $f(x)\\ge k$는 (최솟값)$\\ge k$, $f(x)\\le k$는 (최댓값)$\\le k$. 치환하면 새 변수의 범위부터 구한다.", "ex": {"body": "닫힌구간 $[0,\\,3]$에서 부등식 $x^{3}-3x^{2}+k\\ge 0$이 항상 성립하도록 하는 실수 $k$의 최솟값을 구하시오.", "sol": ["$f(x)=x^{3}-3x^{2}+k$라 하면 $f'(x)=3x(x-2)$", "$[0,\\,3]$에서 $f(0)=k$, $f(2)=k-4$, $f(3)=k$이므로 최솟값은 $k-4$", "$k-4\\ge 0$  $\\therefore\\ k\\ge 4$", "따라서 $k$의 최솟값은 $4$이다."], "ans": "$4$"}}}, {"key": "Tm06-08", "no": "08", "name": "두 함수의 대소 관계와 부등식", "book": {"sight": "$f(x)\\ge g(x)$는 <b>$h(x)=f(x)-g(x)$의 최솟값 $\\ge 0$<\/b>. ‘그래프가 항상 아래쪽’은 $f(x)&lt;g(x)$. $f(x)$의 최솟값과 $g(x)$의 최댓값을 따로 비교하지 않는다. 사이에 상수가 끼면($f(x)&lt;k&lt;g(x)$) 두 부등식으로 나눈다.", "ex": {"body": "두 함수 $f(x)=x^{3}+3x^{2}$, $g(x)=9x+k$에 대하여 $x\\ge 0$에서 부등식 $f(x)\\ge g(x)$가 항상 성립하도록 하는 실수 $k$의 최댓값을 구하시오.", "sol": ["$h(x)=f(x)-g(x)=x^{3}+3x^{2}-9x-k$라 하면", "$h'(x)=3x^{2}+6x-9=3(x+3)(x-1)$", "$x\\ge 0$에서 $h(x)$는 $x=1$에서 최솟값 $h(1)=-5-k$를 갖는다.", "$-5-k\\ge 0$  $\\therefore\\ k\\le -5$", "따라서 $k$의 최댓값은 $-5$이다."], "ans": "$-5$"}}}], "card": [["핵심", "부등식 $f(x)\\ge 0$이 성립함을 보이려면 $f(x)$의 최솟값이 $0$ 이상임을 보이면 된다. 두 함수의 대소는 차를 하나의 함수로 놓고 그 최솟값을 조사한다."], ["뜻", "어떤 구간에서 함수 $f(x)$가 최솟값 $m$을 가질 때 그 구간의 모든 $x$에 대하여 $f(x)\\ge 0\\iff m\\ge 0$ 이다. 부등식이 성립할 조건은 함수의 최솟값(또는 최댓값)에 대한 조건으로 바뀐다."], ["정리", "어떤 구간에서 다항함수 $f(x)$, $g(x)$에 대하여<br>(1) 그 구간에서 $f(x)$가 최솟값을 가질 때, 모든 $x$에 대하여 $f(x)\\ge 0$이려면 (최솟값)$\\ge 0$, $f(x)&gt;0$이려면 (최솟값)$&gt;0$이어야 한다.<br>(2) 그 구간에서 $f(x)\\ge g(x)$가 성립하려면 $h(x)=f(x)-g(x)$로 놓고 그 구간에서 $h(x)\\ge 0$임을 보이면 된다.<br>(3) $f(x)$가 구간 $[a,\\,\\infty)$에서 증가하고 $f(a)\\ge 0$이면 $x&gt;a$에서 $f(x)&gt;0$이다."], ["주의", "모든 실수 $x$에서 성립할 조건과 주어진 구간에서 성립할 조건은 다르다. 구간이 주어지면 그 구간 안의 극값과 양 끝값만 비교한다."], ["주의", "등호에 주의한다. $f(x)&gt;0$이 성립하려면 최솟값이 $0$보다 커야 한다. 그러나 $x&gt;a$처럼 끝점이 빠진 구간에서는 $f(a)=0$이어도 성립할 수 있다."], ["주의", "모든 실수 $x$에서 $f(x)\\ge g(x)$일 조건을 ($f(x)$의 최솟값)$\\ge$($g(x)$의 최댓값)으로 세우지 않는다. 이것은 충분조건일 뿐이다. 예를 들어 $f(x)=x^{2}+1$, $g(x)=x^{2}$이면 항상 $f(x)&gt;g(x)$이지만 $g(x)$의 최댓값은 없다."]]}, {"key": "Cm06-03", "no": "03", "title": "속도와 가속도", "themes": [{"key": "Tm06-09", "no": "09", "name": "속도와 가속도", "book": {"sight": "위치 $x$를 <b>한 번 미분하면 속도, 두 번 미분하면 가속도<\/b>. ‘위치가 ~인 시각’, ‘가속도가 $0$인 시각’처럼 먼저 <b>시각 $t$를 구하고<\/b> 그 시각을 필요한 식에 넣는다. 속력은 속도의 절댓값이다.", "ex": {"body": "수직선 위를 움직이는 점 $\\mathrm{P}$의 시각 $t\\ (t\\ge 0)$에서의 위치 $x$가 $x=t^{3}-6t^{2}+5t$일 때, 점 $\\mathrm{P}$의 가속도가 $0$인 순간의 속도를 구하시오.", "sol": ["$v=\\dfrac{dx}{dt}=3t^{2}-12t+5$,  $a=\\dfrac{dv}{dt}=6t-12$", "$a=0$에서 $t=2$", "$t=2$일 때 속도는 $12-24+5=-7$"], "ans": "$-7$"}}}, {"key": "Tm06-10", "no": "10", "name": "두 점의 속도가 같아지는 시각", "book": {"sight": "두 점의 속도를 각각 구해 <b>$v_{\\mathrm{P}}=v_{\\mathrm{Q}}$<\/b>로 놓는다. 위치가 같아지는 시각은 $x_{\\mathrm{P}}=x_{\\mathrm{Q}}$. ‘두 번 있다’는 그 $t$에 대한 방정식이 <b>$t&gt;0$에서 서로 다른 두 실근<\/b>을 갖는다는 뜻이다.", "ex": {"body": "수직선 위를 움직이는 두 점 $\\mathrm{P}$, $\\mathrm{Q}$의 시각 $t\\ (t\\ge 0)$에서의 위치가 각각 $x_{\\mathrm{P}}=t^{3}-2t^{2}$, $x_{\\mathrm{Q}}=t^{2}+9t$일 때, 두 점의 속도가 같아지는 순간 두 점 사이의 거리를 구하시오.", "sol": ["$v_{\\mathrm{P}}=3t^{2}-4t$, $v_{\\mathrm{Q}}=2t+9$", "$3t^{2}-4t=2t+9$에서 $t^{2}-2t-3=0$, $(t+1)(t-3)=0$  $\\therefore\\ t=3\\ (\\because\\ t\\ge 0)$", "$x_{\\mathrm{P}}(3)=27-18=9$, $x_{\\mathrm{Q}}(3)=9+27=36$이므로 두 점 사이의 거리는 $36-9=27$"], "ans": "$27$"}}}, {"key": "Tm06-11", "no": "11", "name": "운동 방향을 바꿀 조건", "book": {"sight": "운동 방향이 바뀌는 시각 ⇔ <b>$v=0$이고 그 좌우에서 $v$의 부호가 바뀌는<\/b> 시각. ‘방향이 바뀌지 않는다’ ⇔ 주어진 범위에서 항상 $v\\ge 0$이거나 항상 $v\\le 0$. ‘서로 반대 방향’ ⇔ $v_{\\mathrm{P}}v_{\\mathrm{Q}}&lt;0$.", "ex": {"body": "수직선 위를 움직이는 점 $\\mathrm{P}$의 시각 $t\\ (t\\ge 0)$에서의 위치 $x$가 $x=2t^{3}-9t^{2}+12t$일 때, 점 $\\mathrm{P}$가 운동 방향을 바꾸는 시각과 그때의 위치를 모두 구하시오.", "sol": ["$v=6t^{2}-18t+12=6(t-1)(t-2)$", "$t=1$, $t=2$의 좌우에서 $v$의 부호가 바뀌므로 이 두 시각에 운동 방향을 바꾼다.", "$x(1)=2-9+12=5$, $x(2)=16-36+24=4$"], "ans": "$t=1$일 때 $5$, $t=2$일 때 $4$"}}}, {"key": "Tm06-12", "no": "12", "name": "제동 거리와 연직 운동", "book": {"sight": "<b>정지·최고 높이 ⇔ $v=0$<\/b>, <b>지면에 닿음 ⇔ 높이 $=0$<\/b>. 먼저 그 일이 일어나는 시각 $t$를 구하고, 그 시각의 위치(거리)나 속도를 계산한다.", "ex": {"body": "지면에서 똑바로 위로 쏘아 올린 공의 $t$초 후의 높이 $h\\,\\mathrm{m}$가 $h=30t-5t^{2}$일 때, 공이 최고 높이에 도달하는 시각과 최고 높이를 구하시오.", "sol": ["$v=\\dfrac{dh}{dt}=30-10t$", "최고 높이에서 $v=0$이므로 $t=3$", "최고 높이는 $h(3)=90-45=45\\,(\\mathrm{m})$"], "ans": "$3$초 후, $45\\,\\mathrm{m}$"}}}, {"key": "Tm06-13", "no": "13", "name": "속도 그래프의 해석", "book": {"sight": "$v(t)$의 그래프에서 <b>부호<\/b>($t$축의 위·아래)는 운동 방향, <b>접선의 기울기<\/b>는 가속도. $t$축을 <b>지나는<\/b> 점에서만 운동 방향이 바뀌고, $t$축에 닿기만 하면 바뀌지 않는다. 봉우리·골짜기에서 가속도는 $0$이다.", "ex": {"body": "수직선 위를 움직이는 점 $\\mathrm{P}$의 시각 $t\\ (t\\ge 0)$에서의 속도 $v(t)$의 그래프가 그림과 같다. 그래프는 $t=1$에서 $t$축을 지나고, $t=2$에서 봉우리, $t=3$에서 $t$축에 닿는다. 점 $\\mathrm{P}$가 운동 방향을 바꾸는 시각과 가속도가 $0$인 시각을 모두 구하시오.", "sol": ["$v(t)$의 부호는 $0&lt;t&lt;1$에서 음, $1&lt;t&lt;3$과 $t&gt;3$에서 양이다.", "$t$축을 지나는 것은 $t=1$뿐이므로 운동 방향은 $t=1$일 때 한 번 바뀐다. $t=3$에서는 $t$축에 닿기만 하므로 잠깐 멈췄다가 같은 방향으로 움직인다.", "가속도는 $v(t)$의 그래프의 접선의 기울기이므로 봉우리 $t=2$와 골짜기 $t=3$에서 $0$이다."], "ans": "운동 방향을 바꾸는 시각 $t=1$, 가속도가 $0$인 시각 $t=2$, $t=3$"}}}, {"key": "Tm06-14", "no": "14", "name": "위치 그래프의 해석", "book": {"sight": "$x(t)$의 그래프에서 <b>높이<\/b>는 위치, <b>접선의 기울기<\/b>는 속도. 극대·극소에서 $v=0$이고 운동 방향이 바뀐다. 움직인 거리는 방향이 바뀌는 시각마다 끊어 위치 변화의 절댓값을 더한다. 원점에서 떨어진 정도는 $|x(t)|$.", "ex": {"body": "원점을 출발하여 수직선 위를 움직이는 점 $\\mathrm{P}$의 시각 $t\\ (t\\ge 0)$에서의 위치가 $x(t)=t^{3}-6t^{2}+9t$일 때, $t=0$부터 $t=4$까지 점 $\\mathrm{P}$가 움직인 거리를 구하시오.", "sol": ["$v=3t^{2}-12t+9=3(t-1)(t-3)$이므로 $t=1$, $t=3$에서 운동 방향을 바꾼다.", "$x(0)=0$, $x(1)=4$, $x(3)=0$, $x(4)=4$", "움직인 거리는 $|4-0|+|0-4|+|4-0|=12$"], "ans": "$12$"}}}], "card": [["핵심", "수직선 위를 움직이는 점의 위치를 시각 $t$의 함수로 나타내면, 위치를 $t$에 대하여 미분한 것이 속도이고 속도를 미분한 것이 가속도이다."], ["뜻", "수직선 위를 움직이는 점 $\\mathrm{P}$의 시각 $t$에서의 위치를 $x=f(t)$라 할 때 속도 $v=\\dfrac{dx}{dt}=f'(t)$,  가속도 $a=\\dfrac{dv}{dt}$ 라 한다. 속도의 절댓값 $|v|$를 <b>속력<\/b>이라 한다."], ["정리", "수직선 위를 움직이는 점 $\\mathrm{P}$의 시각 $t$에서의 속도를 $v$라 할 때<br>(1) $v&gt;0$이면 점 $\\mathrm{P}$는 양의 방향으로, $v&lt;0$이면 음의 방향으로 움직인다.<br>(2) 점 $\\mathrm{P}$가 운동 방향을 바꾸는 시각에서 $v=0$이고, 그 시각의 좌우에서 $v$의 부호가 바뀐다.<br>(3) 위치 $x=f(t)$의 그래프에서 접선의 기울기는 속도이고, 속도 $v$의 그래프에서 접선의 기울기는 가속도이다."], ["주의", "속도와 속력은 다르다. 속도는 부호로 방향까지 나타내고, 속력은 그 절댓값이다. ‘속력이 최대’와 ‘속도가 최대’를 구별한다."], ["주의", "$v=0$인 시각이 모두 운동 방향을 바꾸는 시각은 아니다. 좌우에서 $v$의 부호가 바뀌는지 확인한다. 예를 들어 $x=(t-1)^{3}$이면 $t=1$에서 $v=0$이지만 방향은 바뀌지 않는다."], ["주의", "위로 던진 물체는 최고 높이에서 $v=0$이고, 지면에 닿는 시각은 높이가 $0$이 되는 시각이다. 제동을 건 자동차가 정지하는 시각은 $v=0$인 시각이다."]]}, {"key": "Cm06-04", "no": "04", "title": "시각에 대한 변화율", "themes": [{"key": "Tm06-15", "no": "15", "name": "길이와 넓이의 변화율", "book": {"sight": "변하는 길이·넓이를 <b>시각 $t$ 하나의 식<\/b>으로 쓰고 미분한다. ‘매초 $c$씩’이면 길이는 (처음 길이)$+ct$. ‘넓이가 ~가 되는 순간’이면 먼저 그 시각 $t$를 구한다.", "ex": {"body": "한 변의 길이가 $3\\,\\mathrm{cm}$인 정사각형의 각 변의 길이가 매초 $2\\,\\mathrm{cm}$씩 늘어날 때, 넓이가 $49\\,\\mathrm{cm}^{2}$가 되는 순간의 넓이의 변화율을 구하시오.", "sol": ["$t$초 후의 한 변의 길이는 $(3+2t)\\,\\mathrm{cm}$이므로 넓이를 $S\\,\\mathrm{cm}^{2}$라 하면", "$S=(3+2t)^{2}=4t^{2}+12t+9$,  $\\dfrac{dS}{dt}=8t+12$", "$(3+2t)^{2}=49$에서 $3+2t=7$  $\\therefore\\ t=2$", "$t=2$일 때 넓이의 변화율은 $16+12=28\\,(\\mathrm{cm}^{2}/\\mathrm{s})$"], "ans": "$28\\,\\mathrm{cm}^{2}/\\mathrm{s}$"}}}, {"key": "Tm06-16", "no": "16", "name": "부피의 변화율", "book": {"sight": "부피 공식에 들어가는 길이를 모두 $t$의 식으로 바꾼 뒤 미분한다. 원뿔 그릇의 물처럼 반지름과 높이가 함께 변하면 <b>닮음비<\/b>로 하나를 다른 하나로 나타낸다.", "ex": {"body": "반지름의 길이가 $1\\,\\mathrm{cm}$인 구의 반지름의 길이가 매초 $1\\,\\mathrm{cm}$씩 늘어날 때, 반지름의 길이가 $4\\,\\mathrm{cm}$가 되는 순간의 부피의 변화율을 구하시오.", "sol": ["$t$초 후의 반지름의 길이는 $(1+t)\\,\\mathrm{cm}$이므로 부피를 $V\\,\\mathrm{cm}^{3}$라 하면", "$V=\\dfrac{4}{3}\\pi(1+t)^{3}=\\dfrac{4}{3}\\pi(t^{3}+3t^{2}+3t+1)$", "$\\dfrac{dV}{dt}=\\dfrac{4}{3}\\pi(3t^{2}+6t+3)=4\\pi(t+1)^{2}$", "반지름의 길이가 $4\\,\\mathrm{cm}$이면 $t=3$이므로 부피의 변화율은 $4\\pi\\times 16=64\\pi\\,(\\mathrm{cm}^{3}/\\mathrm{s})$"], "ans": "$64\\pi\\,\\mathrm{cm}^{3}/\\mathrm{s}$"}}}], "card": [["핵심", "시각 $t$에 따라 변하는 길이·넓이·부피를 $t$의 함수로 나타내면, 그 함수를 $t$에 대하여 미분한 것이 그 양의 변화율이다. 속도가 위치의 변화율인 것과 같다."], ["뜻", "시각 $t$에서의 어떤 양이 $Q=f(t)$일 때, 시각 $t$에서의 $Q$의 변화율은 $\\dfrac{dQ}{dt}=\\lim\\limits_{\\Delta t\\to 0}\\dfrac{f(t+\\Delta t)-f(t)}{\\Delta t}=f'(t)$ 이다. 길이 $l$, 넓이 $S$, 부피 $V$의 변화율은 각각 $\\dfrac{dl}{dt}$, $\\dfrac{dS}{dt}$, $\\dfrac{dV}{dt}$이다."], ["정리", "시각에 대한 변화율을 구할 때<br>(1) 변하는 양(길이·넓이·부피)을 시각 $t$ 하나의 식으로 나타낸 뒤 $t$에 대하여 미분한다.<br>(2) 길이가 처음 $l_{0}$에서 매초 $c$씩 늘어나면 $t$초 후의 길이는 $l_{0}+ct$이다.<br>(3) 원뿔 모양 그릇의 물처럼 두 길이가 함께 변하면 닮음비로 하나를 다른 하나로 나타낸 뒤 $t$의 식으로 바꾼다."], ["주의", "시각을 대입하기 전에 먼저 미분한다. ‘넓이가 $96$이 되는 순간’처럼 주어지면 그 순간의 시각 $t$부터 구한다."], ["주의", "구하는 양을 반지름 같은 다른 길이의 식으로 두었으면, 그 길이를 다시 $t$의 식으로 바꾼 뒤 $t$에 대하여 미분한다."]]}]}], "schedule": {"고2A": {"Cm05-01": "2026-10-20", "Cm05-02": "2026-10-20", "Cm05-03": "2026-10-20", "Cm05-04": "2026-10-22", "Cm05-05": "2026-10-22", "Cm06-01": "2026-10-24", "Cm06-02": "2026-10-27", "Cm06-03": "2026-10-27", "Cm06-04": "2026-10-29"}}}}, "items": {"c07-01-1-01": {"id": "c07-01-1-01", "unit": "07", "concept": "01", "벌": 1, "k": "ox", "q": "‘$x+2=5$’는 명제이다.", "a": "X", "w": "$x$의 값에 따라 참·거짓이 달라지므로 명제가 아니라 조건이다.", "key": "C07-01"}, "c07-01-1-02": {"id": "c07-01-1-02", "unit": "07", "concept": "01", "벌": 1, "k": "ox", "q": "실수 전체에서 조건 ‘$x<3$’의 부정은 ‘$x\\ge 3$’이다.", "a": "O", "w": "$x<3$이 아닌 것은 $x\\ge 3$이다. 부정하면 등호가 반대쪽으로 옮겨 간다.", "key": "C07-01"}, "c07-01-1-03": {"id": "c07-01-1-03", "unit": "07", "concept": "01", "벌": 1, "k": "ox", "q": "조건 ‘$x=1$ 또는 $x=2$’의 부정은 ‘$x\\ne 1$ 또는 $x\\ne 2$’이다.", "a": "X", "w": "부정하면 ‘또는’이 ‘그리고’로 바뀐다. 맞는 부정은 ‘$x\\ne 1$ 그리고 $x\\ne 2$’이다.", "key": "C07-01"}, "c07-01-1-04": {"id": "c07-01-1-04", "unit": "07", "concept": "01", "벌": 1, "k": "ox", "q": "두 조건 $p$, $q$의 진리집합이 각각 $P$, $Q$일 때, 조건 ‘$p$ 그리고 $\\sim q$’의 진리집합은 $P-Q$이다.", "a": "O", "w": "‘그리고’는 교집합, $\\sim q$는 $Q^{C}$이므로 $P\\cap Q^{C}=P-Q$이다.", "key": "C07-01"}, "c07-01-1-05": {"id": "c07-01-1-05", "unit": "07", "concept": "01", "벌": 1, "k": "ox", "q": "두 조건 $p$, $q$의 진리집합이 각각 $P$, $Q$일 때, 명제 $p\\to q$가 참이면 $P\\cap Q=P$이다.", "a": "O", "w": "$p\\to q$가 참이면 $P\\subset Q$이고, 이때 $P\\cap Q=P$이다.", "key": "C07-01"}, "c07-01-1-06": {"id": "c07-01-1-06", "unit": "07", "concept": "01", "벌": 1, "k": "c4", "q": "전체집합 $U=\\{1,2,3,4,5,6\\}$에서 조건 ‘$x$는 짝수이다.’의 진리집합은 ____이다.", "a": "$\\{2,4,6\\}$", "c": ["$\\{2,4,6\\}$", "$\\{1,3,5\\}$", "$\\{2,4\\}$", "$\\{0,2,4,6\\}$"], "w": "진리집합은 전체집합 $U$의 원소 중 조건을 참이 되게 하는 것만 모은 집합이므로 $\\{2,4,6\\}$이다. $0$은 $U$의 원소가 아니다.", "key": "C07-01"}, "c07-01-1-07": {"id": "c07-01-1-07", "unit": "07", "concept": "01", "벌": 1, "k": "c4", "q": "실수 $x$에 대한 조건 ‘$1<x\\le 4$’의 부정은 ‘____’이다.", "a": "$x\\le 1$ 또는 $x>4$", "c": ["$x\\le 1$ 또는 $x>4$", "$x\\le 1$ 그리고 $x>4$", "$x<1$ 또는 $x\\ge 4$", "$x<1$ 또는 $x>4$"], "w": "‘$1<x$ 그리고 $x\\le 4$’를 부정하면 ‘$x\\le 1$ 또는 $x>4$’이다. ‘그리고’는 ‘또는’으로, 각 부등식은 등호를 반대쪽으로 옮겨 부정한다.", "key": "C07-01"}, "c07-01-1-08": {"id": "c07-01-1-08", "unit": "07", "concept": "01", "벌": 1, "k": "c4", "q": "명제 ‘$p$이면 $q$이다.’를 $p\\to q$로 나타낼 때, $p$를 ____이라 한다.", "a": "가정", "c": ["가정", "결론", "역", "부정"], "w": "$p\\to q$에서 $p$를 가정, $q$를 결론이라 한다.", "key": "C07-01"}, "c07-01-2-01": {"id": "c07-01-2-01", "unit": "07", "concept": "01", "벌": 2, "k": "ox", "q": "‘$2$는 홀수이다.’는 거짓인 문장이므로 명제가 아니다.", "a": "X", "w": "참인지 거짓인지 분명히 판별할 수 있으면 명제이다. 거짓으로 판별되는 문장도 명제(거짓인 명제)이다.", "key": "C07-01"}, "c07-01-2-02": {"id": "c07-01-2-02", "unit": "07", "concept": "01", "벌": 2, "k": "ox", "q": "전체집합이 자연수 전체일 때, 조건 ‘$x^{2}<5$’의 진리집합은 $\\{1,2\\}$이다.", "a": "O", "w": "$1^{2}=1$, $2^{2}=4$는 $5$보다 작고 $3^{2}=9$부터는 아니므로 $\\{1,2\\}$이다. 전체집합이 실수 전체라면 진리집합이 달라진다.", "key": "C07-01"}, "c07-01-2-03": {"id": "c07-01-2-03", "unit": "07", "concept": "01", "벌": 2, "k": "ox", "q": "조건 $p$의 진리집합이 $P$일 때, $\\sim(\\sim p)$의 진리집합은 $P$이다.", "a": "O", "w": "$\\sim(\\sim p)=p$이고, 집합으로는 $(P^{C})^{C}=P$이다.", "key": "C07-01"}, "c07-01-2-04": {"id": "c07-01-2-04", "unit": "07", "concept": "01", "벌": 2, "k": "ox", "q": "두 조건 $p$, $q$의 진리집합이 각각 $P$, $Q$일 때, 조건 ‘$p$ 또는 $q$’의 부정의 진리집합은 $P^{C}\\cup Q^{C}$이다.", "a": "X", "w": "‘$p$ 또는 $q$’의 부정은 ‘$\\sim p$ 그리고 $\\sim q$’이므로 진리집합은 $(P\\cup Q)^{C}=P^{C}\\cap Q^{C}$이다.", "key": "C07-01"}, "c07-01-2-05": {"id": "c07-01-2-05", "unit": "07", "concept": "01", "벌": 2, "k": "ox", "q": "실수 $x$에 대하여 명제 ‘$x>2$이면 $x>3$이다.’의 반례로 $x=1$을 들 수 있다.", "a": "X", "w": "반례는 가정 $x>2$를 만족시키면서 결론 $x>3$을 만족시키지 않아야 한다. $x=1$은 가정을 만족시키지 않으므로 반례가 아니고, 예컨대 $x=3$이 반례이다.", "key": "C07-01"}, "c07-01-2-06": {"id": "c07-01-2-06", "unit": "07", "concept": "01", "벌": 2, "k": "ox", "q": "전체집합 $U=\\{1,2,3,\\cdots,10\\}$에서 조건 $p$ : ‘$x$는 $6$의 약수이다.’에 대하여 $\\sim p$의 진리집합의 원소는 $6$개이다.", "a": "O", "w": "$P=\\{1,2,3,6\\}$이고 $\\sim p$의 진리집합은 $P^{C}$이므로 원소는 $10-4=6$개이다.", "key": "C07-01"}, "c07-01-2-07": {"id": "c07-01-2-07", "unit": "07", "concept": "01", "벌": 2, "k": "c4", "q": "실수 $x$에 대하여 명제 ‘$x^{2}-4x+3=0$이면 $x=1$이다.’의 반례는 $x=$ ____이다.", "a": "$3$", "c": ["$3$", "$1$", "$-3$", "$-1$"], "w": "$x^{2}-4x+3=(x-1)(x-3)=0$에서 $x=1$ 또는 $x=3$이다. 가정은 만족시키고 결론 $x=1$은 만족시키지 않는 $x=3$이 반례이다.", "key": "C07-01"}, "c07-01-2-08": {"id": "c07-01-2-08", "unit": "07", "concept": "01", "벌": 2, "k": "c4", "q": "두 조건 $p$, $q$의 진리집합을 각각 $P$, $Q$라 할 때, 명제 $p\\to q$가 거짓임을 보이는 반례는 집합 ____의 원소이다.", "a": "$P\\cap Q^{C}$", "c": ["$P\\cap Q^{C}$", "$P^{C}\\cap Q$", "$P\\cap Q$", "$P^{C}\\cap Q^{C}$"], "w": "반례는 $p$는 만족시키고 $q$는 만족시키지 않는 원소, 곧 $P-Q=P\\cap Q^{C}$의 원소이다.", "key": "C07-01"}, "c07-02-1-01": {"id": "c07-02-1-01", "unit": "07", "concept": "02", "벌": 1, "k": "ox", "q": "명제 $p\\to q$의 대우는 $\\sim p\\to\\sim q$이다.", "a": "X", "w": "대우는 가정과 결론을 바꾸고 각각 부정한 $\\sim q\\to\\sim p$이다. $\\sim p\\to\\sim q$는 대우가 아니다.", "key": "C07-02"}, "c07-02-1-02": {"id": "c07-02-1-02", "unit": "07", "concept": "02", "벌": 1, "k": "ox", "q": "명제 ‘$x=2$이면 $x^{2}=4$이다.’가 참이므로 그 역도 참이다.", "a": "X", "w": "역 ‘$x^{2}=4$이면 $x=2$이다.’는 $x=-2$가 반례이므로 거짓이다. 명제가 참이어도 역이 참이라고 할 수 없다.", "key": "C07-02"}, "c07-02-1-03": {"id": "c07-02-1-03", "unit": "07", "concept": "02", "벌": 1, "k": "ox", "q": "‘어떤 실수 $x$에 대하여 $x^{2}\\le 0$이다.’는 참인 명제이다.", "a": "O", "w": "$x=0$이면 $x^{2}=0\\le 0$이므로 진리집합이 공집합이 아니다. 따라서 참이다.", "key": "C07-02"}, "c07-02-1-04": {"id": "c07-02-1-04", "unit": "07", "concept": "02", "벌": 1, "k": "ox", "q": "명제 $p\\to q$가 거짓이면 그 대우 $\\sim q\\to\\sim p$도 거짓이다.", "a": "O", "w": "명제와 그 대우는 참·거짓이 항상 같으므로, 명제가 거짓이면 대우도 거짓이다.", "key": "C07-02"}, "c07-02-1-05": {"id": "c07-02-1-05", "unit": "07", "concept": "02", "벌": 1, "k": "ox", "q": "‘어떤 $x$에 대하여 $p$이다.’의 부정은 ‘모든 $x$에 대하여 $\\sim p$이다.’이다.", "a": "O", "w": "‘어떤’은 ‘모든’으로 바꾸고 조건 $p$도 함께 부정한다.", "key": "C07-02"}, "c07-02-1-06": {"id": "c07-02-1-06", "unit": "07", "concept": "02", "벌": 1, "k": "c4", "q": "실수 $x$에 대하여 명제 ‘$x>1$이면 $x^{2}>1$이다.’의 대우는 ‘____이면 $x\\le 1$이다.’이다.", "a": "$x^{2}\\le 1$", "c": ["$x^{2}\\le 1$", "$x^{2}<1$", "$x\\le 1$", "$x^{2}\\ge 1$"], "w": "대우는 결론의 부정을 가정으로 놓는다. $x^{2}>1$의 부정은 $x^{2}\\le 1$이다.", "key": "C07-02"}, "c07-02-1-07": {"id": "c07-02-1-07", "unit": "07", "concept": "02", "벌": 1, "k": "c4", "q": "전체집합 $U$에서 조건 $p$의 진리집합을 $P$라 할 때, ‘모든 $x$에 대하여 $p$이다.’는 ____일 때 참이다.", "a": "$P=U$", "c": ["$P=U$", "$P\\ne\\varnothing$", "$P\\subset U$", "$P=\\varnothing$"], "w": "모든 원소가 $p$를 만족시켜야 하므로 $P=U$일 때 참이다. $P\\subset U$는 항상 성립하므로 판정 기준이 될 수 없고, $P\\ne\\varnothing$은 ‘어떤’의 기준이다.", "key": "C07-02"}, "c07-02-1-08": {"id": "c07-02-1-08", "unit": "07", "concept": "02", "벌": 1, "k": "c4", "q": "세 조건 $p$, $q$, $r$에 대하여 두 명제 $p\\to q$, $q\\to r$가 모두 참일 때, 항상 참인 명제는 ____이다.", "a": "$\\sim r\\to\\sim p$", "c": ["$\\sim r\\to\\sim p$", "$r\\to p$", "$\\sim p\\to\\sim r$", "$q\\to p$"], "w": "삼단논법으로 $p\\to r$가 참이고, 그 대우 $\\sim r\\to\\sim p$도 참이다. 나머지는 역 또는 역의 대우 꼴이라 참이 보장되지 않는다.", "key": "C07-02"}, "c07-02-2-01": {"id": "c07-02-2-01", "unit": "07", "concept": "02", "벌": 2, "k": "ox", "q": "‘모든 실수 $x$에 대하여 $x^{2}>0$이다.’의 부정은 ‘모든 실수 $x$에 대하여 $x^{2}\\le 0$이다.’이다.", "a": "X", "w": "‘모든’은 ‘어떤’으로 바뀌어야 한다. 맞는 부정은 ‘어떤 실수 $x$에 대하여 $x^{2}\\le 0$이다.’이다.", "key": "C07-02"}, "c07-02-2-02": {"id": "c07-02-2-02", "unit": "07", "concept": "02", "벌": 2, "k": "ox", "q": "실수 $x$에 대하여 명제 ‘$x^{2}\\ne 4$이면 $x\\ne 2$이다.’는 참이다.", "a": "O", "w": "대우 ‘$x=2$이면 $x^{2}=4$이다.’가 참이므로 원래 명제도 참이다.", "key": "C07-02"}, "c07-02-2-03": {"id": "c07-02-2-03", "unit": "07", "concept": "02", "벌": 2, "k": "ox", "q": "전체집합 $U=\\{1,2,3\\}$에서 ‘모든 $x$에 대하여 $x^{2}\\le 4$이다.’는 참이다.", "a": "X", "w": "$x=3$이면 $x^{2}=9>4$이므로 진리집합이 $\\{1,2\\}\\ne U$이다. 따라서 거짓이다.", "key": "C07-02"}, "c07-02-2-04": {"id": "c07-02-2-04", "unit": "07", "concept": "02", "벌": 2, "k": "ox", "q": "실수 $x$에 대하여 명제 ‘$x\\ge a$이면 $x\\ge 3$이다.’가 참이 되도록 하는 실수 $a$의 값의 범위는 $a\\ge 3$이다.", "a": "O", "w": "$\\{x\\mid x\\ge a\\}\\subset\\{x\\mid x\\ge 3\\}$이어야 하므로 $a\\ge 3$이다. $a=3$이면 두 집합이 같아 포함되므로 등호도 들어간다.", "key": "C07-02"}, "c07-02-2-05": {"id": "c07-02-2-05", "unit": "07", "concept": "02", "벌": 2, "k": "ox", "q": "세 조건 $p$, $q$, $r$에 대하여 두 명제 $p\\to\\sim q$, $r\\to q$가 모두 참이면 명제 $p\\to\\sim r$도 참이다.", "a": "O", "w": "$r\\to q$의 대우 $\\sim q\\to\\sim r$가 참이므로 $p\\to\\sim q$, $\\sim q\\to\\sim r$에서 삼단논법으로 $p\\to\\sim r$가 참이다.", "key": "C07-02"}, "c07-02-2-06": {"id": "c07-02-2-06", "unit": "07", "concept": "02", "벌": 2, "k": "ox", "q": "명제 $p\\to q$의 역과 대우는 참·거짓이 항상 같다.", "a": "X", "w": "참·거짓이 항상 같은 것은 명제와 그 대우이다. 예컨대 ‘$x=1$이면 $x^{2}=1$’의 대우는 참이지만 역은 거짓이다.", "key": "C07-02"}, "c07-02-2-07": {"id": "c07-02-2-07", "unit": "07", "concept": "02", "벌": 2, "k": "c4", "q": "실수 $x$에 대하여 명제 ‘$-1<x<2$이면 $x<a$이다.’가 참이 되도록 하는 실수 $a$의 최솟값은 ____이다.", "a": "$2$", "c": ["$2$", "$1$", "$3$", "$-1$"], "w": "$\\{x\\mid -1<x<2\\}\\subset\\{x\\mid x<a\\}$이어야 하므로 $a\\ge 2$이다. $a=2$일 때도 포함되므로 최솟값은 $2$이다.", "key": "C07-02"}, "c07-02-2-08": {"id": "c07-02-2-08", "unit": "07", "concept": "02", "벌": 2, "k": "c4", "q": "명제 $p\\to q$가 참일 때, 반드시 참인 명제는 ____이다.", "a": "$\\sim q\\to\\sim p$", "c": ["$\\sim q\\to\\sim p$", "$q\\to p$", "$\\sim p\\to\\sim q$", "$\\sim q\\to p$"], "w": "명제가 참이면 그 대우 $\\sim q\\to\\sim p$도 참이다. 역 $q\\to p$와 $\\sim p\\to\\sim q$는 참이 보장되지 않는다.", "key": "C07-02"}, "c07-03-1-01": {"id": "c07-03-1-01", "unit": "07", "concept": "03", "벌": 1, "k": "ox", "q": "두 조건 $p$, $q$의 진리집합을 $P$, $Q$라 할 때, $p$가 $q$이기 위한 필요조건이면 $P\\subset Q$이다.", "a": "X", "w": "$p$가 $q$이기 위한 필요조건이면 $q\\Longrightarrow p$, 곧 $Q\\subset P$이다. $P\\subset Q$는 $p$가 충분조건일 때이다.", "key": "C07-03"}, "c07-03-1-02": {"id": "c07-03-1-02", "unit": "07", "concept": "03", "벌": 1, "k": "ox", "q": "실수 $x$에 대하여 $p:x=2$, $q:x^{2}=4$이면 $p$는 $q$이기 위한 충분조건이다.", "a": "O", "w": "$P=\\{2\\}$, $Q=\\{-2,\\,2\\}$이므로 $P\\subset Q$이다. 따라서 $p$는 $q$이기 위한 충분조건이다(필요조건은 아니다).", "key": "C07-03"}, "c07-03-1-03": {"id": "c07-03-1-03", "unit": "07", "concept": "03", "벌": 1, "k": "ox", "q": "실수 $x$에 대하여 $p:x>3$, $q:x>1$이면 $q$는 $p$이기 위한 필요조건이다.", "a": "O", "w": "$P\\subset Q$이므로 $p\\Longrightarrow q$이고, 이때 $q$는 $p$이기 위한 필요조건이다. 이름은 ‘~이기 위한’ 앞의 조건 $q$에 붙는다.", "key": "C07-03"}, "c07-03-1-04": {"id": "c07-03-1-04", "unit": "07", "concept": "03", "벌": 1, "k": "ox", "q": "실수 $x$에 대하여 $p:|x|<1$, $q:-1<x<1$이면 $p$는 $q$이기 위한 필요충분조건이다.", "a": "O", "w": "$|x|<1$의 진리집합은 $\\{x\\mid -1<x<1\\}$이므로 $P=Q$이다. 따라서 필요충분조건이다.", "key": "C07-03"}, "c07-03-1-05": {"id": "c07-03-1-05", "unit": "07", "concept": "03", "벌": 1, "k": "ox", "q": "실수 $x$, $y$에 대하여 $p:x+y>0$, $q:x>0$이고 $y>0$이면 $p$는 $q$이기 위한 충분조건이다.", "a": "X", "w": "$x=2$, $y=-1$이면 $p$는 참이지만 $q$는 거짓이므로 $p\\Longrightarrow q$가 아니다. $q\\Longrightarrow p$이므로 $p$는 $q$이기 위한 필요조건이다.", "key": "C07-03"}, "c07-03-1-06": {"id": "c07-03-1-06", "unit": "07", "concept": "03", "벌": 1, "k": "c4", "q": "두 조건 $p$, $q$의 진리집합 $P$, $Q$에 대하여 $Q\\subset P$이면 $p$는 $q$이기 위한 ____이다.", "a": "필요조건", "c": ["필요조건", "충분조건", "필요충분조건", "충분조건도 필요조건도 아닌 조건"], "w": "$Q\\subset P$는 $q\\Longrightarrow p$를 뜻하므로 $p$는 필요조건이다. $P=Q$인지는 알 수 없으므로 필요충분조건이라고 할 수 없다.", "key": "C07-03"}, "c07-03-1-07": {"id": "c07-03-1-07", "unit": "07", "concept": "03", "벌": 1, "k": "c4", "q": "실수 $x$에 대하여 $p:x(x-1)=0$, $q:x=0$일 때, $p$는 $q$이기 위한 ____이다.", "a": "필요조건이지만 충분조건은 아닌 조건", "c": ["필요조건이지만 충분조건은 아닌 조건", "충분조건이지만 필요조건은 아닌 조건", "필요충분조건", "충분조건도 필요조건도 아닌 조건"], "w": "$P=\\{0,\\,1\\}$, $Q=\\{0\\}$이므로 $Q\\subset P$이고 $P\\not\\subset Q$($x=1$)이다. 따라서 필요조건이지만 충분조건은 아니다.", "key": "C07-03"}, "c07-03-1-08": {"id": "c07-03-1-08", "unit": "07", "concept": "03", "벌": 1, "k": "c4", "q": "실수 $x$에 대하여 $p:x^{2}<0$, $q:x=5$일 때, $p$는 $q$이기 위한 ____이다.", "a": "충분조건이지만 필요조건은 아닌 조건", "c": ["충분조건이지만 필요조건은 아닌 조건", "필요조건이지만 충분조건은 아닌 조건", "필요충분조건", "충분조건도 필요조건도 아닌 조건"], "w": "$P=\\varnothing$이고 공집합은 모든 집합의 부분집합이므로 $P\\subset Q$이다. $Q\\not\\subset P$이므로 충분조건이지만 필요조건은 아니다.", "key": "C07-03"}, "c07-03-2-01": {"id": "c07-03-2-01", "unit": "07", "concept": "03", "벌": 2, "k": "ox", "q": "$p$가 $q$이기 위한 충분조건이면 $\\sim q$는 $\\sim p$이기 위한 충분조건이다.", "a": "O", "w": "$P\\subset Q$이면 $Q^{C}\\subset P^{C}$이므로 $\\sim q\\Longrightarrow\\sim p$이다. 명제와 그 대우는 참·거짓이 같다.", "key": "C07-03"}, "c07-03-2-02": {"id": "c07-03-2-02", "unit": "07", "concept": "03", "벌": 2, "k": "ox", "q": "$p$가 $q$이기 위한 필요충분조건이면 $p$는 $q$이기 위한 충분조건이기도 하다.", "a": "O", "w": "필요충분조건이면 $p\\Longrightarrow q$가 성립하므로 충분조건이다. ‘충분조건이다’에는 필요충분인 경우도 들어간다.", "key": "C07-03"}, "c07-03-2-03": {"id": "c07-03-2-03", "unit": "07", "concept": "03", "벌": 2, "k": "ox", "q": "실수 $x$에 대하여 $p:x<2$, $q:x\\le 2$이면 $p$는 $q$이기 위한 필요조건이다.", "a": "X", "w": "$P\\subset Q$이고, $x=2$는 $q$를 만족시키지만 $p$를 만족시키지 않으므로 $Q\\not\\subset P$이다. $p$는 충분조건이지만 필요조건은 아니다.", "key": "C07-03"}, "c07-03-2-04": {"id": "c07-03-2-04", "unit": "07", "concept": "03", "벌": 2, "k": "ox", "q": "$p$는 $q$이기 위한 충분조건이고 $q$는 $r$이기 위한 충분조건이면, $r$은 $p$이기 위한 필요조건이다.", "a": "O", "w": "$p\\Longrightarrow q$, $q\\Longrightarrow r$이면 삼단논법으로 $p\\Longrightarrow r$이다. 따라서 $r$은 $p$이기 위한 필요조건이다.", "key": "C07-03"}, "c07-03-2-05": {"id": "c07-03-2-05", "unit": "07", "concept": "03", "벌": 2, "k": "ox", "q": "자연수 $x$에 대하여 $p:x$는 $4$의 배수, $q:x$는 $2$의 배수이면 $p$는 $q$이기 위한 필요조건이다.", "a": "X", "w": "4의 배수는 모두 2의 배수이므로 $P\\subset Q$, 곧 $p$는 충분조건이다. $x=2$는 $q$만 만족시키므로 필요조건은 아니다.", "key": "C07-03"}, "c07-03-2-06": {"id": "c07-03-2-06", "unit": "07", "concept": "03", "벌": 2, "k": "c4", "q": "실수 $x$에 대하여 $p:x>a$, $q:x>3$이다. $p$가 $q$이기 위한 충분조건이 되도록 하는 실수 $a$의 값의 범위는 ____이다.", "a": "$a\\ge 3$", "c": ["$a\\ge 3$", "$a>3$", "$a\\le 3$", "$a<3$"], "w": "$P\\subset Q$이어야 하므로 $a\\ge 3$이다. $a=3$이면 $P=Q$로 포함 관계가 성립하므로 등호를 포함한다.", "key": "C07-03"}, "c07-03-2-07": {"id": "c07-03-2-07", "unit": "07", "concept": "03", "벌": 2, "k": "c4", "q": "실수 $x$에 대하여 $p:0<x<2$, $q:1<x<3$일 때, $p$는 $q$이기 위한 ____이다.", "a": "충분조건도 필요조건도 아닌 조건", "c": ["충분조건도 필요조건도 아닌 조건", "충분조건이지만 필요조건은 아닌 조건", "필요조건이지만 충분조건은 아닌 조건", "필요충분조건"], "w": "$x=\\frac{1}{2}$은 $p$만, $x=\\frac{5}{2}$는 $q$만 만족시키므로 $P\\not\\subset Q$이고 $Q\\not\\subset P$이다.", "key": "C07-03"}, "c07-03-2-08": {"id": "c07-03-2-08", "unit": "07", "concept": "03", "벌": 2, "k": "c4", "q": "$\\sim p$가 $\\sim q$이기 위한 충분조건이면 $p$는 $q$이기 위한 ____이다.", "a": "필요조건", "c": ["필요조건", "충분조건", "필요충분조건", "충분조건도 필요조건도 아닌 조건"], "w": "$\\sim p\\Longrightarrow\\sim q$는 그 대우 $q\\Longrightarrow p$와 같으므로 $p$는 $q$이기 위한 필요조건이다.", "key": "C07-03"}, "c07-04-1-01": {"id": "c07-04-1-01", "unit": "07", "concept": "04", "벌": 1, "k": "ox", "q": "$x<0$일 때 $x+\\dfrac{1}{x}\\ge 2$이다.", "a": "X", "w": "산술평균과 기하평균의 관계는 두 수가 양수일 때만 쓴다. $x<0$이면 $x+\\frac{1}{x}\\le -2$이다(예: $x=-1$일 때 $-2$).", "key": "C07-04"}, "c07-04-1-02": {"id": "c07-04-1-02", "unit": "07", "concept": "04", "벌": 1, "k": "ox", "q": "모든 실수 $a$, $b$에 대하여 $|a|+|b|\\ge|a+b|$이고, 등호는 $ab\\ge 0$일 때 성립한다.", "a": "O", "w": "$(|a|+|b|)^{2}-|a+b|^{2}=2(|ab|-ab)\\ge 0$이고, $|ab|=ab$, 곧 $ab\\ge 0$일 때 등호가 성립한다.", "key": "C07-04"}, "c07-04-1-03": {"id": "c07-04-1-03", "unit": "07", "concept": "04", "벌": 1, "k": "ox", "q": "$x>0$일 때 $x+\\dfrac{4}{x}$의 최솟값은 $4$이다.", "a": "O", "w": "$x+\\frac{4}{x}\\ge 2\\sqrt{x\\cdot\\frac{4}{x}}=4$이고, 등호는 $x=\\frac{4}{x}$, 곧 $x=2$일 때 성립한다.", "key": "C07-04"}, "c07-04-1-04": {"id": "c07-04-1-04", "unit": "07", "concept": "04", "벌": 1, "k": "ox", "q": "귀류법은 명제의 가정을 부정하여 모순이 생김을 보이는 증명 방법이다.", "a": "X", "w": "귀류법은 <b>결론<\/b>을 부정하여 가정이나 이미 알려진 사실에 모순이 생김을 보이는 방법이다.", "key": "C07-04"}, "c07-04-1-05": {"id": "c07-04-1-05", "unit": "07", "concept": "04", "벌": 1, "k": "ox", "q": "실수 $a$, $b$, $x$, $y$에 대하여 $(a^{2}+b^{2})(x^{2}+y^{2})\\ge(ax+by)^{2}$의 등호는 $ax=by$일 때 성립한다.", "a": "X", "w": "(좌변)$-$(우변)$=(ay-bx)^{2}$이므로 등호는 $ay=bx$일 때 성립한다.", "key": "C07-04"}, "c07-04-1-06": {"id": "c07-04-1-06", "unit": "07", "concept": "04", "벌": 1, "k": "c4", "q": "$a>0$, $b>0$이고 $ab=16$일 때 $a+b$의 최솟값은 ____이다.", "a": "$8$", "c": ["$8$", "$4$", "$16$", "$32$"], "w": "$a+b\\ge 2\\sqrt{ab}=2\\cdot 4=8$이고, 등호는 $a=b=4$일 때 성립한다.", "key": "C07-04"}, "c07-04-1-07": {"id": "c07-04-1-07", "unit": "07", "concept": "04", "벌": 1, "k": "c4", "q": "$a>0$, $b>0$일 때 $a+b-2\\sqrt{ab}=$ ____ $\\ge 0$이므로 $\\dfrac{a+b}{2}\\ge\\sqrt{ab}$이다.", "a": "$(\\sqrt{a}-\\sqrt{b})^{2}$", "c": ["$(\\sqrt{a}-\\sqrt{b})^{2}$", "$(a-b)^{2}$", "$(\\sqrt{a}+\\sqrt{b})^{2}$", "$\\sqrt{(a-b)^{2}}$"], "w": "$(\\sqrt{a})^{2}-2\\sqrt{a}\\sqrt{b}+(\\sqrt{b})^{2}=(\\sqrt{a}-\\sqrt{b})^{2}$이고, 제곱이므로 $0$ 이상이다.", "key": "C07-04"}, "c07-04-1-08": {"id": "c07-04-1-08", "unit": "07", "concept": "04", "벌": 1, "k": "c4", "q": "자연수 $n$에 대하여 명제 ‘$n^{2}$이 짝수이면 $n$도 짝수이다.’를 대우를 이용하여 증명하려면 ‘____’가 참임을 보이면 된다.", "a": "$n$이 홀수이면 $n^{2}$도 홀수이다", "c": ["$n$이 홀수이면 $n^{2}$도 홀수이다", "$n$이 짝수이면 $n^{2}$도 짝수이다", "$n^{2}$이 홀수이면 $n$도 홀수이다", "$n$이 홀수이면 $n^{2}$은 짝수이다"], "w": "$p\\to q$의 대우는 $\\sim q\\to\\sim p$이다. 결론 ‘$n$은 짝수’를 부정한 ‘$n$은 홀수’가 가정이 된다. ‘$n$이 짝수이면 $n^{2}$도 짝수’는 역이다.", "key": "C07-04"}, "c07-04-2-01": {"id": "c07-04-2-01", "unit": "07", "concept": "04", "벌": 2, "k": "ox", "q": "$a>0$, $b>0$이고 $a+b=10$일 때 $ab$의 최댓값은 $25$이다.", "a": "O", "w": "$10=a+b\\ge 2\\sqrt{ab}$에서 $\\sqrt{ab}\\le 5$, 곧 $ab\\le 25$이고 등호는 $a=b=5$일 때 성립한다.", "key": "C07-04"}, "c07-04-2-02": {"id": "c07-04-2-02", "unit": "07", "concept": "04", "벌": 2, "k": "ox", "q": "$x\\ge 3$일 때 $x+\\dfrac{1}{x}\\ge 2$이므로 $x+\\dfrac{1}{x}$의 최솟값은 $2$이다.", "a": "X", "w": "등호는 $x=1$일 때 성립하는데 $x=1$은 범위 $x\\ge 3$ 밖이다. 이 범위에서는 $x=3$일 때 최솟값 $\\frac{10}{3}$을 갖는다.", "key": "C07-04"}, "c07-04-2-03": {"id": "c07-04-2-03", "unit": "07", "concept": "04", "벌": 2, "k": "ox", "q": "‘$\\sqrt{2}$는 유리수가 아니다.’를 귀류법으로 증명할 때는 $\\sqrt{2}$가 유리수라고 가정하여 모순을 이끈다.", "a": "O", "w": "귀류법은 결론을 부정하여 시작한다. ‘유리수가 아니다’의 부정 ‘유리수이다’를 가정하고 모순을 보인다.", "key": "C07-04"}, "c07-04-2-04": {"id": "c07-04-2-04", "unit": "07", "concept": "04", "벌": 2, "k": "ox", "q": "실수 $a$, $b$에 대하여 $a^{2}+b^{2}\\ge 2ab$의 등호는 $a=b=0$일 때만 성립한다.", "a": "X", "w": "$a^{2}+b^{2}-2ab=(a-b)^{2}\\ge 0$이므로 등호는 $a=b$일 때 성립한다. $a=b=1$일 때도 등호가 성립한다.", "key": "C07-04"}, "c07-04-2-05": {"id": "c07-04-2-05", "unit": "07", "concept": "04", "벌": 2, "k": "ox", "q": "실수 $x$, $y$에 대하여 $x^{2}+y^{2}=5$이면 $(2x+y)^{2}\\le 25$이다.", "a": "O", "w": "코시-슈바르츠 부등식에서 $(2^{2}+1^{2})(x^{2}+y^{2})\\ge(2x+y)^{2}$이고 좌변은 $5\\cdot 5=25$이다.", "key": "C07-04"}, "c07-04-2-06": {"id": "c07-04-2-06", "unit": "07", "concept": "04", "벌": 2, "k": "c4", "q": "문자가 가질 수 있는 모든 실수 값에 대하여 항상 성립하는 부등식을 ____이라 한다.", "a": "절대부등식", "c": ["절대부등식", "항등식", "이차부등식", "연립부등식"], "w": "예를 들어 $x^{2}+1>0$은 모든 실수 $x$에 대하여 성립하므로 절대부등식이다. 항등식은 항상 성립하는 <b>등식<\/b>이다.", "key": "C07-04"}, "c07-04-2-07": {"id": "c07-04-2-07", "unit": "07", "concept": "04", "벌": 2, "k": "c4", "q": "실수 $x$, $y$에 대하여 $x^{2}+y^{2}=2$일 때 $x+y$의 최댓값은 ____이다.", "a": "$2$", "c": ["$2$", "$4$", "$\\sqrt{2}$", "$1$"], "w": "$(1^{2}+1^{2})(x^{2}+y^{2})\\ge(x+y)^{2}$에서 $(x+y)^{2}\\le 4$이므로 $x+y\\le 2$이고, 등호는 $x=y=1$일 때 성립한다.", "key": "C07-04"}, "c07-04-2-08": {"id": "c07-04-2-08", "unit": "07", "concept": "04", "벌": 2, "k": "c4", "q": "실수 $x$, $y$에 대하여 명제 ‘$x+y>2$이면 $x>1$ 또는 $y>1$이다.’를 귀류법으로 증명하려면 $x+y>2$와 함께 ‘____’를 가정하여 모순을 이끈다.", "a": "$x\\le 1$ 그리고 $y\\le 1$", "c": ["$x\\le 1$ 그리고 $y\\le 1$", "$x\\le 1$ 또는 $y\\le 1$", "$x<1$ 그리고 $y<1$", "$x+y\\le 2$"], "w": "결론 ‘$x>1$ 또는 $y>1$’의 부정은 ‘$x\\le 1$ 그리고 $y\\le 1$’이다. 이를 가정하면 $x+y\\le 2$가 되어 $x+y>2$에 모순이다.", "key": "C07-04"}, "c07-01-3-01": {"id": "c07-01-3-01", "unit": "07", "concept": "01", "벌": 3, "k": "ox", "q": "‘$100$은 큰 수이다.’는 명제이다.", "a": "X", "w": "‘큰 수’의 기준이 분명하지 않아 참인지 거짓인지 판별할 수 없으므로 명제가 아니다.", "key": "C07-01"}, "c07-01-3-02": {"id": "c07-01-3-02", "unit": "07", "concept": "01", "벌": 3, "k": "ox", "q": "전체집합이 실수 전체일 때, 조건 ‘$x^{2}=-1$’의 진리집합은 $\\varnothing$이다.", "a": "O", "w": "제곱해서 $-1$이 되는 실수는 없으므로 조건을 참이 되게 하는 원소가 없고, 진리집합은 공집합이다.", "key": "C07-01"}, "c07-01-3-03": {"id": "c07-01-3-03", "unit": "07", "concept": "01", "벌": 3, "k": "ox", "q": "전체집합 $U=\\{1,2,3,4\\}$에서 조건 ‘$x>2$’의 부정의 진리집합은 $\\{1\\}$이다.", "a": "X", "w": "‘$x>2$’의 부정은 ‘$x\\le 2$’이므로 진리집합은 $\\{1,2\\}$이다. 등호가 부정 쪽으로 옮겨 온다.", "key": "C07-01"}, "c07-01-3-04": {"id": "c07-01-3-04", "unit": "07", "concept": "01", "벌": 3, "k": "ox", "q": "실수 $x$, $y$에 대하여 조건 ‘$xy=0$’의 부정은 ‘$x\\ne 0$ 그리고 $y\\ne 0$’이다.", "a": "O", "w": "‘$xy=0$’은 ‘$x=0$ 또는 $y=0$’이므로, 부정하면 ‘또는’이 ‘그리고’로 바뀌어 ‘$x\\ne 0$ 그리고 $y\\ne 0$’이 된다.", "key": "C07-01"}, "c07-01-3-05": {"id": "c07-01-3-05", "unit": "07", "concept": "01", "벌": 3, "k": "ox", "q": "두 조건 $p$, $q$의 진리집합 $P$, $Q$에 대하여 $P\\cap Q\\ne\\varnothing$이면 명제 $p\\to q$는 참이다.", "a": "X", "w": "$p\\to q$가 참이려면 $P\\subset Q$이어야 한다. $P=\\{1,2\\}$, $Q=\\{2\\}$이면 $P\\cap Q\\ne\\varnothing$이지만 $1$이 반례가 된다.", "key": "C07-01"}, "c07-01-3-06": {"id": "c07-01-3-06", "unit": "07", "concept": "01", "벌": 3, "k": "ox", "q": "전체집합 $U=\\{1,2,3,4,5,6\\}$에서 조건 ‘$x$는 짝수이고 $x>3$이다.’의 진리집합은 $\\{4,6\\}$이다.", "a": "O", "w": "‘그리고’는 교집합이므로 짝수의 집합 $\\{2,4,6\\}$과 $\\{4,5,6\\}$의 교집합 $\\{4,6\\}$이다.", "key": "C07-01"}, "c07-01-3-07": {"id": "c07-01-3-07", "unit": "07", "concept": "01", "벌": 3, "k": "c4", "q": "두 조건 $p$, $q$의 진리집합을 각각 $P$, $Q$라 할 때, 조건 ‘$\\sim p$ 또는 $q$’의 진리집합은 ____이다.", "a": "$P^{C}\\cup Q$", "c": ["$P^{C}\\cup Q$", "$P^{C}\\cap Q$", "$P\\cup Q^{C}$", "$(P\\cup Q)^{C}$"], "w": "$\\sim p$의 진리집합은 $P^{C}$이고 ‘또는’은 합집합이므로 $P^{C}\\cup Q$이다.", "key": "C07-01"}, "c07-01-3-08": {"id": "c07-01-3-08", "unit": "07", "concept": "01", "벌": 3, "k": "c4", "q": "전체집합이 정수 전체일 때, 조건 ‘$|x|<2$’의 진리집합은 ____이다.", "a": "$\\{-1,0,1\\}$", "c": ["$\\{-1,0,1\\}$", "$\\{1\\}$", "$\\{-2,-1,0,1,2\\}$", "$\\{0,1\\}$"], "w": "$-2<x<2$인 정수는 $-1$, $0$, $1$이다. 진리집합은 전체집합 안에서 찾고 음수도 빠뜨리지 않는다.", "key": "C07-01"}, "c07-02-3-01": {"id": "c07-02-3-01", "unit": "07", "concept": "02", "벌": 3, "k": "ox", "q": "명제 $p\\to q$의 역의 대우는 $\\sim p\\to\\sim q$이다.", "a": "O", "w": "$p\\to q$의 역은 $q\\to p$이고, 그 대우는 가정과 결론을 바꾸고 각각 부정한 $\\sim p\\to\\sim q$이다.", "key": "C07-02"}, "c07-02-3-02": {"id": "c07-02-3-02", "unit": "07", "concept": "02", "벌": 3, "k": "ox", "q": "실수 $x$, $y$에 대하여 명제 ‘$xy>0$이면 $x>0$이다.’의 대우는 참이다.", "a": "X", "w": "$x=-1$, $y=-1$이 반례이므로 주어진 명제는 거짓이다. 명제와 대우는 참·거짓이 같으므로 대우도 거짓이다.", "key": "C07-02"}, "c07-02-3-03": {"id": "c07-02-3-03", "unit": "07", "concept": "02", "벌": 3, "k": "ox", "q": "두 조건 $p$, $q$에 대하여 명제 $p\\to q$가 거짓이면 그 역 $q\\to p$는 참이다.", "a": "X", "w": "$P\\not\\subset Q$라고 해서 $Q\\subset P$인 것은 아니다. $P=\\{1,2\\}$, $Q=\\{2,3\\}$이면 명제와 역이 모두 거짓이다.", "key": "C07-02"}, "c07-02-3-04": {"id": "c07-02-3-04", "unit": "07", "concept": "02", "벌": 3, "k": "ox", "q": "두 조건 $p$, $q$의 진리집합 $P$, $Q$에 대하여 $P\\cap Q=\\varnothing$이면 명제 $p\\to\\sim q$는 참이다.", "a": "O", "w": "$P\\cap Q=\\varnothing$이면 $P$의 원소는 모두 $Q$ 밖에 있으므로 $P\\subset Q^{C}$이고, 따라서 $p\\to\\sim q$는 참이다.", "key": "C07-02"}, "c07-02-3-05": {"id": "c07-02-3-05", "unit": "07", "concept": "02", "벌": 3, "k": "ox", "q": "세 조건 $p$, $q$, $r$에 대하여 두 명제 $p\\to q$, $r\\to q$가 모두 참이면 명제 $p\\to r$도 참이다.", "a": "X", "w": "$P\\subset Q$, $R\\subset Q$에서 $P$와 $R$의 포함 관계는 알 수 없다. 삼단논법은 $p\\to q$, $q\\to r$처럼 이어질 때만 쓸 수 있다.", "key": "C07-02"}, "c07-02-3-06": {"id": "c07-02-3-06", "unit": "07", "concept": "02", "벌": 3, "k": "ox", "q": "실수 $x$, $y$에 대하여 명제 ‘$x+y\\ne 2$이면 $x\\ne 1$ 또는 $y\\ne 1$이다.’는 참이다.", "a": "O", "w": "대우 ‘$x=1$ 그리고 $y=1$이면 $x+y=2$이다.’가 참이므로 주어진 명제도 참이다.", "key": "C07-02"}, "c07-02-3-07": {"id": "c07-02-3-07", "unit": "07", "concept": "02", "벌": 3, "k": "c4", "q": "‘모든 실수 $x$에 대하여 $x^{2}+a\\ge 0$이다.’가 참이 되도록 하는 실수 $a$의 값의 범위는 ____이다.", "a": "$a\\ge 0$", "c": ["$a\\ge 0$", "$a>0$", "$a\\le 0$", "$a<0$"], "w": "$x^{2}+a$의 가장 작은 값은 $x=0$일 때의 $a$이므로 $a\\ge 0$이면 된다. $a=0$일 때도 성립하므로 등호가 들어간다.", "key": "C07-02"}, "c07-02-3-08": {"id": "c07-02-3-08", "unit": "07", "concept": "02", "벌": 3, "k": "c4", "q": "명제 ‘$p$이면 $\\sim q$이다.’의 대우는 ____이다.", "a": "$q\\to\\sim p$", "c": ["$q\\to\\sim p$", "$\\sim q\\to p$", "$\\sim p\\to q$", "$q\\to p$"], "w": "가정과 결론을 바꾸고 각각 부정하면 $\\sim(\\sim q)\\to\\sim p$, 곧 $q\\to\\sim p$이다.", "key": "C07-02"}, "c07-03-3-01": {"id": "c07-03-3-01", "unit": "07", "concept": "03", "벌": 3, "k": "ox", "q": "실수 $x$, $y$에 대하여 $p:x=y$, $q:x^{2}=y^{2}$이면 $p$는 $q$이기 위한 필요조건이다.", "a": "X", "w": "$x=y$이면 $x^{2}=y^{2}$이지만 역은 $x=1$, $y=-1$이 반례이다. $p$는 $q$이기 위한 충분조건이지만 필요조건은 아니다.", "key": "C07-03"}, "c07-03-3-02": {"id": "c07-03-3-02", "unit": "07", "concept": "03", "벌": 3, "k": "ox", "q": "실수 $x$에 대하여 $p:x^{2}=x$, $q:x=0$ 또는 $x=1$이면 $p$는 $q$이기 위한 필요충분조건이다.", "a": "O", "w": "$x^{2}=x$에서 $x(x-1)=0$이므로 두 진리집합이 모두 $\\{0,1\\}$로 같다.", "key": "C07-03"}, "c07-03-3-03": {"id": "c07-03-3-03", "unit": "07", "concept": "03", "벌": 3, "k": "ox", "q": "실수 $a$, $b$에 대하여 ‘$ab=0$’은 ‘$a=0$’이기 위한 필요조건이다.", "a": "O", "w": "$a=0$이면 $ab=0$이므로 $a=0\\Longrightarrow ab=0$이다. 따라서 $ab=0$은 $a=0$이기 위한 필요조건이다.", "key": "C07-03"}, "c07-03-3-04": {"id": "c07-03-3-04", "unit": "07", "concept": "03", "벌": 3, "k": "ox", "q": "실수 $a$, $b$에 대하여 ‘$a^{2}+b^{2}=0$’은 ‘$a=0$이고 $b=0$’이기 위한 충분조건이지만 필요조건은 아니다.", "a": "X", "w": "$a^{2}+b^{2}=0$이면 $a=b=0$이고 그 역도 성립하므로 필요충분조건이다.", "key": "C07-03"}, "c07-03-3-05": {"id": "c07-03-3-05", "unit": "07", "concept": "03", "벌": 3, "k": "ox", "q": "$p$가 $q$이기 위한 필요조건이면 $q$는 $p$이기 위한 충분조건이다.", "a": "O", "w": "두 문장 모두 $q\\Longrightarrow p$, 곧 $Q\\subset P$를 뜻한다. 이름은 ‘~이기 위한’ 앞의 조건에 붙는다.", "key": "C07-03"}, "c07-03-3-06": {"id": "c07-03-3-06", "unit": "07", "concept": "03", "벌": 3, "k": "c4", "q": "두 조건 $p$, $q$의 진리집합을 $P$, $Q$라 하자. $p$가 $q$이기 위한 충분조건이지만 필요조건이 아니면 ____이다.", "a": "$P\\subset Q$이고 $P\\ne Q$", "c": ["$P\\subset Q$이고 $P\\ne Q$", "$Q\\subset P$이고 $P\\ne Q$", "$P=Q$", "$P\\cap Q=\\varnothing$"], "w": "충분조건이므로 $P\\subset Q$이고, 필요조건이 아니므로 $Q\\not\\subset P$, 곧 $P\\ne Q$이다.", "key": "C07-03"}, "c07-03-3-07": {"id": "c07-03-3-07", "unit": "07", "concept": "03", "벌": 3, "k": "c4", "q": "실수 $x$에 대하여 $p:x=a$, $q:x^{2}-5x+6=0$이다. $p$가 $q$이기 위한 충분조건이 되도록 하는 모든 실수 $a$의 값의 합은 ____이다.", "a": "$5$", "c": ["$5$", "$6$", "$-5$", "$2$"], "w": "$\\{a\\}\\subset\\{2,3\\}$이어야 하므로 $a=2$ 또는 $a=3$이고, 합은 $5$이다.", "key": "C07-03"}, "c07-03-3-08": {"id": "c07-03-3-08", "unit": "07", "concept": "03", "벌": 3, "k": "c4", "q": "$p$는 $q$이기 위한 필요조건이고 $r$은 $q$이기 위한 충분조건일 때, $r$은 $p$이기 위한 ____임이 항상 성립한다.", "a": "충분조건", "c": ["충분조건", "필요조건", "필요충분조건", "충분조건도 필요조건도 아닌 조건"], "w": "$q\\Longrightarrow p$, $r\\Longrightarrow q$이므로 $r\\Longrightarrow p$이다. $p\\Longrightarrow r$는 알 수 없으므로 항상 성립하는 것은 충분조건이다.", "key": "C07-03"}, "c07-04-3-01": {"id": "c07-04-3-01", "unit": "07", "concept": "04", "벌": 3, "k": "ox", "q": "실수 $x$에 대하여 부등식 $x^{2}>0$은 절대부등식이다.", "a": "X", "w": "$x=0$이면 성립하지 않으므로 절대부등식이 아니다. 절대부등식은 $x^{2}\\ge 0$이다.", "key": "C07-04"}, "c07-04-3-02": {"id": "c07-04-3-02", "unit": "07", "concept": "04", "벌": 3, "k": "ox", "q": "$a>0$, $b>0$일 때 $\\frac{a}{b}+\\frac{b}{a}\\ge 2$이고, 등호는 $a=b$일 때 성립한다.", "a": "O", "w": "$\\frac{a}{b}>0$, $\\frac{b}{a}>0$이므로 산술평균과 기하평균의 관계에서 $\\frac{a}{b}+\\frac{b}{a}\\ge 2\\sqrt{1}=2$이고, 등호는 $\\frac{a}{b}=\\frac{b}{a}$, 곧 $a=b$일 때 성립한다.", "key": "C07-04"}, "c07-04-3-03": {"id": "c07-04-3-03", "unit": "07", "concept": "04", "벌": 3, "k": "ox", "q": "명제 $p\\to q$를 대우를 이용하여 증명할 때는 $p$와 $\\sim q$를 함께 가정하여 모순을 이끈다.", "a": "X", "w": "$p$와 $\\sim q$를 함께 가정해 모순을 이끄는 것은 귀류법이다. 대우를 이용한 증명은 $\\sim q\\to\\sim p$가 참임을 직접 보인다.", "key": "C07-04"}, "c07-04-3-04": {"id": "c07-04-3-04", "unit": "07", "concept": "04", "벌": 3, "k": "ox", "q": "$a>0$, $b>0$일 때 $(a+b)\\left(\\frac{1}{a}+\\frac{1}{b}\\right)\\ge 4$이다.", "a": "O", "w": "전개하면 $2+\\frac{a}{b}+\\frac{b}{a}$이고 $\\frac{a}{b}+\\frac{b}{a}\\ge 2$이므로 $4$ 이상이다.", "key": "C07-04"}, "c07-04-3-05": {"id": "c07-04-3-05", "unit": "07", "concept": "04", "벌": 3, "k": "ox", "q": "$x>1$일 때 $x+\\frac{1}{x-1}$의 최솟값은 $2$이다.", "a": "X", "w": "$(x-1)+\\frac{1}{x-1}+1\\ge 2+1=3$이고 등호는 $x=2$일 때 성립하므로 최솟값은 $3$이다.", "key": "C07-04"}, "c07-04-3-06": {"id": "c07-04-3-06", "unit": "07", "concept": "04", "벌": 3, "k": "ox", "q": "$A\\ge 0$, $B\\ge 0$일 때 $A^{2}-B^{2}\\ge 0$이면 $A\\ge B$이다.", "a": "O", "w": "$A^{2}-B^{2}=(A+B)(A-B)\\ge 0$에서 $A+B>0$이면 $A-B\\ge 0$이고, $A+B=0$이면 $A=B=0$이다. 그래서 두 식이 $0$ 이상이면 제곱하여 비교해도 된다.", "key": "C07-04"}, "c07-04-3-07": {"id": "c07-04-3-07", "unit": "07", "concept": "04", "벌": 3, "k": "c4", "q": "$a>0$, $b>0$이고 $2a+b=8$일 때 $ab$의 최댓값은 ____이다.", "a": "$8$", "c": ["$8$", "$16$", "$4$", "$32$"], "w": "$8=2a+b\\ge 2\\sqrt{2ab}$에서 $2ab\\le 16$, 곧 $ab\\le 8$이고 등호는 $a=2$, $b=4$일 때 성립한다.", "key": "C07-04"}, "c07-04-3-08": {"id": "c07-04-3-08", "unit": "07", "concept": "04", "벌": 3, "k": "c4", "q": "실수 $a$, $b$에 대하여 $|a|+|b|\\ge|a+b|$를 증명할 때 $(|a|+|b|)^{2}-|a+b|^{2}=$ ____ $\\
