. (거짓)", "$x\\in U,\\;y\\in U$인 모든 $x,\\;y$에 대하여 $|\\,x-y\\,|>2$이다. (거짓)", "$x\\in U,\\;y\\in U$인 모든 $x,\\;y$에 대하여 $|\\,x-y\\,|\\le 2$이다. (참)", "$x\\in U,\\;y\\in U$인 모든 $x,\\;y$에 대하여 $|\\,x-y\\,|\\le 2$이다. (거짓)"], "a": "$x\\in U,\\;y\\in U$인 모든 $x,\\;y$에 대하여 $|\\,x-y\\,|\\le 2$이다. (참)", "q": "전체집합 $U=\\left\\{-1,\\;0,\\;1\\right\\}$에 대하여 다음 명제의 부정과 그 참, 거짓을 바르게 나열한 것은?<br>$x\\in U,\\;y\\in U$인 어떤 $x,\\;y$에 대하여 $|\\,x-y\\,|>2$이다.", "key": "T07-05"}, "x07x39-047": {"id": "x07x39-047", "unit": "07", "theme": "05", "벌": "X07x39", "lvl": 2, "fix": true, "src": "문제집 고쟁이", "w": "$p\\,:\\,n\\le x\\le n+3$, $q\\,:\\,-2<x\\le 3$이라 하고, 두 조건 $p,\\;q$의 진리집합을 각각 $P,\\;Q$라 하면 주어진 명제가 참이기 위해선 $P\\cap Q\\ne \\varnothing $이어야 한다.<br>따라서 $-2<n+3$이고 $n\\le 3$이어야 하므로 $-5<n\\le 3$이어야 한다.<br>이를 만족시키는 정수 $n$은 $-4,\\;-3,\\;-2,\\;-1,\\;0,\\;1,\\;2,\\;3$으로 $8$개이다.", "k": "c5", "c": ["$6$", "$7$", "$8$", "$9$", "$10$"], "a": "$8$", "q": "명제<br>‘$n\\le x\\le n+3$인 어떤 실수 $x$에 대하여 $-2<x\\le 3$이다.’<br>가 참이 되도록 하는 정수 $n$의 개수는?", "key": "T07-05"}, "x07x39-048": {"id": "x07x39-048", "unit": "07", "theme": "05", "벌": "X07x39", "lvl": 2, "fix": true, "src": "문제집 고쟁이", "w": "명제 ‘모든 실수 $x$에 대하여 $x^{2}+2ax+5>0$이다’가 거짓이기 위해서는 그 부정인 ‘어떤 실수 $x$에 대하여 $x^{2}+2ax+5\\le 0$이다.’가 참이어야 하므로 이차방정식 $x^{2}+2ax+5=0$의 판별식을 $D_{1}$이라 하면<br>$\\dfrac{D_{1}}{4}=a^{2}-5\\ge 0$, $(a+\\sqrt{5})(a-\\sqrt{5})\\ge 0$<br>에서 $a\\ge -\\sqrt{5}$ 또는 $a\\le \\sqrt{5}\\cdots \\cdots $㉠<br>또한 명제 ‘어떤 실수 $x$에 대하여 $x^{2}-ax+2a\\le 0$이다.’가 거짓이기 위해서는 그 부정인 ‘모든 실수 $x$에 대하여 $x^{2}-ax+2a>0$이다.’가 참이어야 하므로 이차방정식 $x^{2}-ax+2a=0$의 판별식을 $D_{2}$라 하면<br>$D_{2}=a^{2}-8a<0$, $a(a-8)<0$<br>$0<a<8\\cdots \\cdots $㉡<br>㉠, ㉡에서 $\\sqrt{5}leqa<8$을 만족시키는 정수 $a$는 $3,\\;4,\\;5,\\;6,\\;7$의 $5$개이다.", "k": "c5", "c": ["$4$", "$5$", "$6$", "$7$", "$8$"], "a": "$5$", "q": "두 명제<br> ‘모든 실수 $x$에 대하여 $x^{2}+2ax+5>0$이다.’<br> ‘어떤 실수 $x$에 대하여 $x^{2}-ax+2a\\le 0$이다.’<br>가 모두 거짓이 되는 정수 $a$의 개수는?", "key": "T07-05"}, "x07x47-024": {"id": "x07x47-024", "unit": "07", "theme": "05", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "⑤ $3x-1=4x+(1-x)$를 만족시키는 실수 $x$는 존재하지 않으므로 거짓인 명제이다.", "k": "c5", "c": ["어떤 실수 $x$에 대하여 $x^{2}=5$이다.", "어떤 실수 $x$에 대하여 $x^{3}+2<0$이다.", "모든 실수 $x$에 대하여 $x^{2}+x+4>0$이다.", "어떤 실수 $x$에 대하여 $x^{2}\\le 3x+4$이다.", "모든 실수 $x$에 대하여 $3x-1=4x+(1-x)$이다."], "a": "모든 실수 $x$에 대하여 $3x-1=4x+(1-x)$이다.", "q": "다음 중 거짓인 명제는?", "key": "T07-05"}, "x07x47-025": {"id": "x07x47-025", "unit": "07", "theme": "05", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "주어진 명제가 거짓이려면 이 명제의 부정<br>‘모든 실수 $x$에 대하여 $x^{2}+8x+2k-1>0$이다.’<br>가 참이어야 한다.<br>이차방정식 $x^{2}+8x+2k-1=0$의 판별식을 $D$라 하면<br>$\\dfrac{D}{4}=4^{2}-1\\times (2k-1)<0$<br>$\\therefore \\;k>\\dfrac{17}{2}$<br>따라서 정수 $k$의 최솟값은 $9$이다.", "k": "num", "a": "9", "q": "명제<br>  ‘어떤 실수 $x$에 대하여 $x^{2}+8x+2k-1\\le 0$이다.’<br>가 거짓이 되도록 하는 정수 $k$의 최솟값을 구하시오.", "key": "T07-05"}, "x07x68-029": {"id": "x07x68-029", "unit": "07", "theme": "05", "벌": "X07x68", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "① 주어진 식을 정리하면 $-2=1$이므로 거짓인 명제이다.<br>② $x$의 값에 따라 참, 거짓이 달라지므로 명제가 아니다.<br>③ $10$은 $15$의 약수가 아니므로 거짓인 명제이다.<br>④ $3$은 $3$의 배수이지만 $6$의 배수가 아니므로 거짓인 명제이다.<br>⑤ 넓이가 같아도 모양이 다를 수 있으므로 거짓인 명제이다.<br>따라서 명제가 아닌 것은 ②이다.", "k": "c5", "c": ["$3x-2=1+3x$", "$x^{2}-5x-6>0$", "$10$은 $15$의 약수이다.", "$3$의 배수는 $6$의 배수이다.", "넓이가 같은 두 사각형은 서로 닮음이다."], "a": "$x^{2}-5x-6>0$", "q": "다음 중 명제가 아닌 것은?", "key": "T07-05"}, "x07x68-032": {"id": "x07x68-032", "unit": "07", "theme": "05", "벌": "X07x68", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "명제 $p\\,\\rightarrow \\,\\sim q$가 거짓이려면 $P{\\not\\subset }Q^{C\\,}$이어야 하므로 집합 $P$의 원소이지만 집합 $Q^{C\\,}$의 원소가 아닌 원소를 찾으면 된다.<br>따라서 반례를 원소로 갖는 집합은<br>$P-Q^{C\\,}=P{\\cap }Q$", "k": "c5", "c": ["$P{\\cap }Q$", "$P{\\cap }Q^{C\\,}$", "$P^{C\\,}\\cap {Q}$", "$P^{C\\,}{\\cap }Q^{C\\,}$", "$P^{C\\,}\\cup {Q^{C\\,}}$"], "a": "$P{\\cap }Q$", "q": "전체집합 $U$에 대하여 두 조건 $p$, $q$의 진리집합을 각각 $P$, $Q$라 할 때, 다음 중 명제 $p\\,\\to \\,\\sim \\,q$가 거짓임을 보이는 반례를 원소로 갖는 집합은?", "key": "T07-05"}, "x07x68-034": {"id": "x07x68-034", "unit": "07", "theme": "05", "벌": "X07x68", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "$|\\,x-a\\,|{\\le }1$에서 $-1{\\le }x-a{\\le }1$<br>$\\therefore \\;a-1{\\le }x{\\le }a+1$<br>$x^{2}-2x-8>0$에서 $(x+2)(x-4)>0$<br>$\\therefore \\;x<-2$ 또는 $x>4$<br>두 조건 $p$, $q$의 진리집합을 각각 $P$, $Q$라 하면<br>$P=\\{x\\,\\left|\\,a-1{\\le }x{\\le }a+1\\right\\}$<br>$Q=\\{x\\,\\left|\\,x<-2\\right\\}$ 또는 $x>4\\}$<br>명제 $p\\,\\to \\,\\sim q$가 참이 되려면 $P{\\subset }Q^{C\\,}$이어야 한다.<br>이때 $Q^{C\\,}=\\{x\\,\\left|\\,-2{\\le }x{\\le }4\\right\\}$이므로<br>위의 그림에서 $a-1{\\ge }-2$, $a+1{\\le }4$이어야 하므로<br>$-1{\\le }a{\\le }3$<br>따라서 실수 $a$의 최댓값은 $3$이다.", "k": "c5", "c": ["$1$", "$2$", "$3$", "$4$", "$5$"], "a": "$3$", "q": "실수 $x$에 대한 두 조건<br> $p\\,:\\,|\\,x-a\\,|\\le 1$<br> $q\\,:\\,x^{2}-2x-8>0$<br>에 대하여 $p\\,\\to \\,\\sim q$가 참이 되도록 하는 실수 $a$의 최댓값은?", "key": "T07-05"}, "x07x68-037": {"id": "x07x68-037", "unit": "07", "theme": "05", "벌": "X07x68", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "① [반례] $x=-1$, $y=-2$이면 $xy>0$이지만 $x<0$이고<br>$y<0$이다. (거짓)<br>② [반례] $x=0$이면 $x^{2}=0$이다. (거짓)<br>③ [반례] $x=\\sqrt{2}$, $y=-\\sqrt{2}$이면 $x+y$는 유리수이다. (거짓)<br>④ 모든 실수 $x$에 대하여<br>$x^{2}-2x+2=(x-1)^{2}+1>0$ (거짓)<br>⑤ $3x-2=x+2(x-3)+4$에서 $3x-2=3x-2$<br>따라서 모든 실수 $x$에 대하여 성립한다. (참)<br>따라서 참인 명제는 ⑤이다.", "k": "c5", "c": ["$xy>0$이면 $x>0$이고 $y>0$이다.", "모든 실수 $x$에 대하여 $x^{2}>0$이다.", "모든 무리수 $x$, $y$에 대하여 $x+y$는 무리수이다.", "어떤 실수 $x$에 대하여 $x^{2}-2x+2{\\le }0$이다.", "모든 실수 $x$에 대하여 $3x-2=x+2(x-3)+4$이다."], "a": "모든 실수 $x$에 대하여 $3x-2=x+2(x-3)+4$이다.", "q": "다음 중 참인 명제는?", "key": "T07-05"}, "x07x68-039": {"id": "x07x68-039", "unit": "07", "theme": "05", "벌": "X07x68", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "①, ② 유리수의 제곱, 유리수의 세제곱도 유리수이므로 $x$가 유리수이면 $x^{2}$, $x^{3}$도 유리수이다. (참)<br>③ [반례] $x=\\sqrt{2}$이면 $x^{2}=2$는 유리수이지만 $x^{3}=2\\sqrt{2}$는 무리수이다. (거짓)<br>④ $x\\ne 0$일 때, 유리수의 나눗셈의 몫은 유리수이므로 $x^{2}$과 $x^{3}$이 유리수이면 $\\dfrac{x^{3}}{x^{2}}=x$는 유리수이다. (참)<br>⑤ 유리수와 유리수의 곱은 유리수이므로 유리수 $x$와 유리수 $x^{2}$의 곱인 $x^{3}$도 유리수이다. (참)<br>따라서 거짓인 명제는 ③이다.", "k": "c5", "c": ["$p$이면 $q$이다.", "$p$이면 $r$이다.", "$q$이면 $r$이다.", "$q$이고 $r$이면 $p$이다.", "$p$이고 $q$이면 $r$이다."], "a": "$q$이면 $r$이다.", "q": "세 조건 $p$, $q$, $r$가<br> $p\\,:\\,x$는 유리수이다.<br> $q\\,:\\,x^{2}$은 유리수이다.<br> $r\\,:\\,x^{3}$은 유리수이다.<br>일 때, 다음 중 거짓인 명제는?", "key": "T07-05"}, "x07x68-041": {"id": "x07x68-041", "unit": "07", "theme": "05", "벌": "X07x68", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "주어진 명제의 부정은<br>‘모든 실수 $x$에 대하여 $x^{2}-18x+k{\\ge }0$이다.’<br>즉, 모든 실수 $x$에 대하여 이차부등식 $x^{2}-18x+k{\\ge }0$이<br>성립해야 하므로 이차방정식 $x^{2}-18x+k=0$의 판별식을 $D$라 하면<br>$\\dfrac{D}{4}=(-9)^{2}-k{\\le }0$<br>$\\therefore \\;k{\\ge }81$<br>따라서 $k$의 최솟값은 $81$이다.", "k": "num", "a": "81", "q": "실수 전체의 집합에 대하여 명제<br> ‘어떤 실수 $x$에 대하여 $x^{2}-18x+k<0$이다.’<br>의 부정이 참이 되도록 하는 상수 $k$의 최솟값을 구하시오.", "key": "T07-05"}, "x07x39-014": {"id": "x07x39-014", "unit": "07", "theme": "06", "벌": "X07x39", "lvl": 1, "fix": true, "src": "문제집 고쟁이", "w": "주어진 명제의 역과 참, 거짓은 다음과 같다.<br>① 역 : $x^{2}=y^{2}$이면 $x=y$이다. (거짓)<br>[반례] $x=-1,\\;y=1$일 때, $x^{2}=y^{2}$이지만 $x\\ne y$이다.<br>② 역 : $x^{2}=9$이면 $x^{2}-6x+9=0$이다. (거짓)<br>[반례] $x=-3$일 때, $(-3)^{2}=9$이지만 $(-3)^{2}-6\\times (-3)+9\\ne 0$이다.<br>③ 역 : $x^{2}\\le 1$이면 $x\\le 1$이다. (참)<br>[증명] $x^{2}\\le 1$이면 $x^{2}-1=(x+1)(x-1)\\le 0$에서  $-1\\le x\\le 1$이므로 $x\\le 1$이다.<br>④ 역 : $x+y>0$이면 $x>0,y>0$이다. (거짓)<br>[반례] $x=2,y=-1$일 때,<br>$x+y=2+(-1)>0$이지만 $y<0$이다.<br>⑤ 역 : $-2\\le x\\le 4$이면 $-1\\le x<2$이다. (거짓)<br>[반례] $x=-2$<br>따라서 역이 참인 명제는 ③이다.", "k": "c5", "c": ["$x=y$이면 $x^{2}=y^{2}$이다.", "$x^{2}-6x+9=0$이면 $x^{2}=9$이다.", "$x\\le 1$이면 $x^{2}\\le 1$이다.", "$x>0,y>0$이면 $x+y>0$이다.", "$-1\\le x<2$이면 $-2\\le x\\le 4$이다."], "a": "$x\\le 1$이면 $x^{2}\\le 1$이다.", "q": "다음 중 역이 참인 명제는? (단, $x,\\;y$는 실수이다.)", "key": "T07-06"}, "x07x20-055": {"id": "x07x20-055", "unit": "07", "theme": "06", "벌": "X07x20", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "① 역 : $ab=0$이면 $a=0$이다. (거짓)<br>[반례] $a=1,\\;b=0$이면 $ab=0$이지만 $a\\ne 0$이다.<br>② 역 : $a^{2}\\ge 1$이면 $a\\ge 1$이다. (거짓)<br>[반례] $a=-2$이면 $a^{2}=4>1$이지만 $a<1$이다.<br>③ 역 : $a+b\\le 2$이면 $a\\le 1$이고 $b\\le 1$이다. (거짓)<br>[반례] $a=-1,\\;b=2$이면 $a+b=1<2$이지만 $b>1$이다.<br>④ 역 : $a\\ne 0$ 또는 $b\\ne 0$이면 $a^{2}+b^{2}>0$이다. (참)<br>⑤ 역 : $a+b$가 짝수이면 $ab$는 홀수이다. (거짓)<br>[반례] $a=2,\\;b=4$이면 $a+b=6$은 짝수이지만 $ab=8$도 짝수이다.<br>따라서 그 역이 참인 명제는 ④이다.", "k": "c5", "c": ["$a=0$이면 $ab=0$이다.", "$a\\ge 1$이면 $a^{2}\\ge 1$이다.", "$a\\le 1$이고 $b\\le 1$이면 $a+b\\le 2$이다.", "$a^{2}+b^{2}>0$이면 $a\\ne 0$ 또는 $b\\ne 0$이다.", "$ab$가 홀수이면 $a+b$는 짝수이다."], "a": "$a^{2}+b^{2}>0$이면 $a\\ne 0$ 또는 $b\\ne 0$이다.", "q": "다음 중 그 역이 참인 명제는? (단, $a,\\;b$는 실수이다.)", "key": "T07-06"}, "x07x20-056": {"id": "x07x20-056", "unit": "07", "theme": "06", "벌": "X07x20", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "명제 $\\sim q\\,\\to \\,p$의 역 $p\\,\\to \\,\\sim q$가 참이므로 그 대우인 $q\\,\\to \\,\\sim p$도 참이다.", "k": "c5", "c": ["$p\\,\\to \\,q$", "$\\sim p\\,\\to \\,q$", "$q\\,\\to \\,p$", "$q\\,\\to \\,\\sim p$", "$\\sim q\\,\\to \\,\\sim p$"], "a": "$q\\,\\to \\,\\sim p$", "q": "두 조건 $p,\\;q$에 대하여 명제 $\\sim q\\,\\to \\,p$의 역이 참일 때, 다음 중 항상 참인 명제는?", "key": "T07-06"}, "x07x30-074": {"id": "x07x30-074", "unit": "07", "theme": "06", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "① 역 : $xy=0$이면 $x=0$이다.<br>[반례] $x=3$, $y=0$이면 $xy=0$이지만 $x\\ne 0$이다.<br>② 역 : $x>2$이면 $3x-7>0$이다.<br>[반례] $x=\\dfrac{7}{3}$이면 $x>2$이지만 $3x-7=0$이다.<br>③ 역 : $xy$가 짝수이면 $x,\\;y$는 짝수이다.<br>[반례] $x=2$, $y=3$이면 $xy=6$은 짝수이지만 $y$는 홀수이다.<br>④ 역 : $x+y>0$이면 $x>0$이고 $y>0$이다.<br>[반례] $x=5$, $y=-4$이면 $x+y>0$이지만 $x>0$, $y<0$이다.<br>⑤ 역 : $x=0$이고 $y=0$이면 $|\\,x\\,|+|\\,y\\,|=0$이다. (참)", "k": "c5", "c": ["$x=0$이면 $xy=0$이다.", "$3x-7>0$이면 $x>2$이다.", "$x,\\;y$가 짝수이면 $xy$는 짝수이다.", "$x>0$이고 $y>0$이면 $x+y>0$이다.", "$|\\,x\\,|+|\\,y\\,|=0$이면 $x=0$이고 $y=0$이다."], "a": "$|\\,x\\,|+|\\,y\\,|=0$이면 $x=0$이고 $y=0$이다.", "q": "$x,\\;y$가 실수일 때, 다음 중 그 역이 참인 명제는?", "key": "T07-06"}, "x07x30-075": {"id": "x07x30-075", "unit": "07", "theme": "06", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "명제 $p\\to \\sim q$의 역 $\\sim q\\to p$가 참이므로 그 대우 $\\sim p\\to q$도 항상 참이다.", "k": "c5", "c": ["$p\\to q$", "$\\sim p\\to q$", "$\\sim p\\to \\sim q$", "$q\\to p$", "$q\\to \\sim p$"], "a": "$\\sim p\\to q$", "q": "두 조건 $p,\\;q$에 대하여 명제 $p\\to \\sim q$의 역이 참일 때, 다음 중 항상 참인 명제는?", "key": "T07-06"}, "x07x30-077": {"id": "x07x30-077", "unit": "07", "theme": "06", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "① 역 : $x>1$이면 $x>0$이다. (참)<br>명제 : [반례] $x=\\dfrac{1}{2}$이면 $x>0$이지만 $x<1$이다.<br>주어진 명제가 거짓이므로 그 대우도 거짓이다.<br>② 역 : $x+1=0$이면 $x^{2}=1$이다. (참)<br>명제 : [반례] $x=1$이면 $x^{2}=1$이지만 $x+1=2$이다.<br>주어진 명제가 거짓이므로 그 대우도 거짓이다.<br>③ 역 : $x(x-2)=0$이면 $x=2$이다.<br>[반례] $x=0$이면 $x(x-2)=0$이지만 $x\\ne 2$이다.<br>또 주어진 명제가 참이므로 그 대우도 참이다.<br>④ 역 : $ac=bc$이면 $a=b$이다.<br>[반례] $a=1$, $b=2$, $c=0$이면 $ac=bc=0$이지만 $a\\ne b$이다.<br>또 주어진 명제가 참이므로 그 대우도 참이다.<br>⑤ 역 : $A\\cap B=A$이면 $A\\subset B$이다. (참)<br>또 주어진 명제가 참이므로 그 대우도 참이다.<br>따라서 그 역과 대우가 모두 참인 명제는 ⑤이다.", "k": "c5", "c": ["$x>0$이면 $x>1$이다.", "$x^{2}=1$이면 $x+1=0$이다.", "$x=2$이면 $x(x-2)=0$이다.", "$a=b$이면 $ac=bc$이다.", "두 집합 $A,\\;B$에 대하여 $A\\subset B$이면 $A\\cap B=A$이다."], "a": "두 집합 $A,\\;B$에 대하여 $A\\subset B$이면 $A\\cap B=A$이다.", "q": "다음 중 그 역과 대우가 모두 참인 명제는?<br>(단, $a,\\;b,\\;c,\\;x$는 실수이다.)", "key": "T07-06"}, "x07x39-051": {"id": "x07x39-051", "unit": "07", "theme": "06", "벌": "X07x39", "lvl": 2, "fix": true, "src": "문제집 고쟁이", "w": "명제와 그 대우의 참, 거짓은 일치하므로 주어진 명제와 그 역이 모두 참인 것을 구하면 된다.<br>ㄱ. 명제: $a+1=0$이면 $a^{3}+1=0$이다. (참)<br>[증명] $a=-1$이면 $a^{3}+1=(-1)^{3}+1=0$<br>역: $a^{3}+1=0$이면 $a+1=0$이다. (참)<br>[증명] $a^{3}+1=(a+1)(a^{2}-a+1)=0$<br>$a$는 실수이므로 $a+1=0$<br>ㄴ. 명제: $a+b>0$, $ab>0$이면 $a>0,\\;b>0$이다. (참)<br>[증명] $ab>0$에서 $a>0,\\;b>0$ 또는 $a<0,\\;b<0$이고,<br>이때 $a+b>0$이므로 $a>0,\\;b>0$이다.<br>역: $a>0,\\;b>0$이면 $a+b>0,\\;ab>0$이다. (참)<br>ㄷ. 명제: $a^{2}+b^{2}>0$이면 $a\\ne 0$ 또는 $b\\ne 0$이다. (참)<br>[증명] 대우는 ‘$a=0,\\;b=0$이면 $a^{2}+b^{2}\\le 0$이다.’이고 대우가 참이므로 명제도 참이다.<br>역: $a\\ne 0$ 또는 $b\\ne 0$이면 $a^{2}+b^{2}>0$이다. (참)<br>[증명] 대우는 ‘$a^{2}+b^{2}\\le 0$이면 $a=0,\\;b=0$이다.’이고, 대우가 참이므로 명제도 참이다.<br>ㄹ. 명제: $ab=0$이면 $a^{2}+ab+2b^{2}=0$이다. (거짓)<br>[반례] $a=1,\\;b=0$일 때, $ab=1\\times 0=0$이지만<br>$a^{2}+ab+2b^{2}=1+0+0\\ne 0$이므로 거짓이다.<br>역: $a^{2}+ab+2b^{2}=0$이면 $ab=0$이다. (참)<br>[증명] $a^{2}+ab+2b^{2}=\\left(a+\\dfrac{b}{2}\\right)^{2}+\\dfrac{7}{4}b^{2}=0$에서<br>$a+\\dfrac{b}{2}=0$, $b=0$이므로 $a=b=0\\therefore \\;ab=0$<br>ㅁ. 명제: $ab+1>a+b>2$이면 $a>1,\\;b>1$이다. (참)<br>[증명] $ab+1>a+b$에서<br>$ab-a-b+1=(a-1)(b-1)>0$<br>$a>1,\\;b>1$ 또는 $a<1,\\;b<1$<br>이때 $a+b>2$이므로 $a>1,\\;b>1$<br>역: $a>1,\\;b>1$이면 $ab+1>a+b>2$이다. (참)<br>[증명] $a>1,\\;b>1$이면 $a+b>2$이고,<br>$ab+1-(a+b)=(a-1)(b-1)>0$<br>$\\therefore \\;ab+1>a+b>2$<br>따라서 역과 대우가 모두 참인 것은 ㄱ, ㄴ, ㄷ, ㅁ으로 $4$개이다.", "k": "c5", "c": ["$1$", "$2$", "$3$", "$4$", "$5$"], "a": "$4$", "q": "두 실수 $a,\\;b$에 대한 다음 <보기>의 명제 중 그 역과 대우가 모두 참인 것의 개수는?<br><b><보기><\/b><br>ㄱ. $a+1=0$이면 $a^{3}+1=0$이다.<br>ㄴ. $a+b>0,\\;ab>0$이면 $a>0,\\;b>0$이다.<br>ㄷ. $a^{2}+b^{2}>0$이면 $a\\ne 0$ 또는 $b\\ne 0$이다.<br>ㄹ. $ab=0$이면 $a^{2}+ab+2b^{2}=0$이다.<br>ㅁ. $ab+1>a+b>2$이면 $a>1,\\;b>1$이다.", "key": "T07-06"}, "x07x39-054": {"id": "x07x39-054", "unit": "07", "theme": "06", "벌": "X07x39", "lvl": 2, "fix": true, "src": "문제집 고쟁이", "w": "세 조건 $p,\\;q,\\;r,\\;s$를 각각 다음과 같이 정의하자.<br>$p\\,:$ 제품이 $10$대, $20$대에게 선호도가 높다.<br>$q\\,:$ 제품의 가격이 싸다.<br>$r\\,:$제품의 기능이 많다.<br>$s\\,:$ 제품의 판매량이 많다.<br>(가), (나), (다)에 의하여 알 수 있는 참인 명제는 다음과 같다.<br>(가) $p\\;\\to \\;s$, (나) $q\\;\\to \\;s$, (다) $r\\;\\to \\;p$<br>각 선지가 나타내는 명제는 다음과 같다.<br>① $r\\;\\to \\,SIMq$ ② $SIMq\\;\\to \\,\\sim s$ ③ $\\sim s\\;\\to \\,\\sim r$<br>④ $p\\;\\to \\;r$ ⑤ $p\\;\\to \\,\\sim q$<br>(가)와 (나)에 의하여 $r\\;\\to \\;s$가 참이므로 그 대우인 $\\sim s\\;\\to \\,\\sim 4$도  참이다.<br>따라서 옳은 것은 ③이다.", "k": "c5", "c": ["기능이 많은 제품은 가격이 싸지 않다.", "가격이 싸지 않은 제품은 판매량이 많지 않다.", "판매량이 많지 않은 제품은 기능이 많지 않다.", "$10$대, $20$대에게 선호도가 높은 제품은 기능이 많다.", "$10$대, $20$대에게 선호도가 높은 제품은 가격이 싸지 않다."], "a": "판매량이 많지 않은 제품은 기능이 많지 않다.", "q": "어느 휴대폰 제조 회사에서 휴대폰 판매량과 사용자 선호도에 대한 시장 조사를 하여 다음과 같은 결과를 얻었다.<br>(가) $10$대, $20$대에게 선호도가 높은 제품은 판매량이 많다.<br>(나) 가격이 싼 제품은 판매량이 많다.<br>(다) 기능이 많은 제품은 $10$대, $20$대에게 선호도가 높다.<br>위의 결과로부터 추론한 내용으로 항상 옳은 것은?", "key": "T07-06"}, "x07x47-026": {"id": "x07x47-026", "unit": "07", "theme": "06", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "① 역 : $a\\ne 0$ 또는 $b\\ne 0$이면 $a^{2}+b^{2}\\ne 0$이다. (참)<br>② 역 : $a^{2}=a$이면 $a=0$ 또는 $a=1$이다. (참)<br>③ 역 : $a-1>0$이면 $2a-1>0$이다. (참)<br>④ 역 : $ab>b$이면 $a<0$이고 $b<0$이다. (거짓)<br>    [반례] $a=2,\\;b=1$<br>⑤ 역 : $a=0$이고 $b=0$이면 $a+b=0$이고 $ab=0$이다. (참)<br>따라서 역이 거짓인 명제는 ④이다.", "k": "c5", "c": ["$a^{2}+b^{2}\\ne 0$이면 $a\\ne 0$ 또는 $b\\ne 0$이다.", "$a=0$ 또는 $a=1$이면 $a^{2}=a$이다.", "$2a-1>0$이면 $a-1>0$이다.", "$a<0$이고 $b<0$이면 $ab>b$이다.", "$a+b=0$이고 $ab=0$이면 $a=0$이고 $b=0$이다."], "a": "$a<0$이고 $b<0$이면 $ab>b$이다.", "q": "다음 중 그 역이 거짓인 명제는? (단, $a,\\;b$는 실수)", "key": "T07-06"}, "x07x47-027": {"id": "x07x47-027", "unit": "07", "theme": "06", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "① 대우 : $x\\ne 2$이면 $x^{2}\\ne 4$이다. (거짓)<br>      [반례] $x=-2$<br>② 대우 : $x\\le y$이면 $x^{2}\\le y^{2}$이다. (거짓)<br>     [반례] $x=-2,\\;y=1$<br>③ 대우 : $x\\ne 0$이면 $x^{2}\\ne 3x$이다. (거짓)<br>   [반례] $x=3$<br>⑤ 대우 : 삼각형 $\\mathrm{ABC}$가 정삼각형이 아니면 삼각형 $\\mathrm{ABC}$의 두 내각의 크기는 같지 않다. (거짓)<br>[반례] 삼각형 $\\mathrm{ABC}$가 이등변삼각형<br>따라서 대우가 참인 명제는 ④이다.", "k": "c5", "c": ["$x^{2}=4$이면 $x=2$이다.", "$x^{2}>y^{2}$이면 $x>y$이다.", "$x^{2}=3x$이면 $x=0$이다.", "$x=10$이면 $x^{2}=100$이다.", "삼각형 $\\mathrm{ABC}$의 두 내각의 크기가 같으면 삼각형 $\\mathrm{ABC}$는 정삼각형이다."], "a": "$x=10$이면 $x^{2}=100$이다.", "q": "다음 중 그 대우가 참인 명제는? (단, $x,\\;y$는 실수)", "key": "T07-06"}, "x07x47-064": {"id": "x07x47-064", "unit": "07", "theme": "06", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "$x>0,\\;y>0$이므로<br>$\\left(4x+\\dfrac{1}{y}\\right)\\left(\\dfrac{1}{x}+16y\\right)=20+64xy+\\dfrac{1}{xy}$<br>$\\ge 20+2\\sqrt{64xy\\times \\dfrac{1}{xy}}$<br>$=20+16=36$<br>$(\\begin{matrix}\\, \\\\ \\,\\end{matrix}$단, 등호는 $xy=\\dfrac{1}{8}$일 때 성립$\\begin{matrix}\\, \\\\ \\,\\end{matrix})$<br>따라서 구하는 최솟값은 $36$이다.", "k": "c5", "c": ["$34$", "$36$", "$38$", "$40$", "$42$"], "a": "$36$", "q": "$x>0,\\;y>0$일 때, $\\left(4x+\\dfrac{1}{y}\\right)\\left(\\dfrac{1}{x}+16y\\right)$의 최솟값은?", "key": "T07-06"}, "x07x47-065": {"id": "x07x47-065", "unit": "07", "theme": "06", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "$a>4$에서 $a-4>0$이므로<br>$2a+\\dfrac{2}{a-4}=2(a-4)+\\dfrac{2}{a-4}+8$<br>$\\ge 2\\sqrt{2(a-4)\\times \\dfrac{2}{a-4}}+8$<br>$=4+8=12$<br>이때 등호는 $2(a-4)=\\dfrac{2}{a-4}$일 때 성립하므로<br>$(a-4)^{2}=1\\therefore \\;a=5\\;(\\because \\;a>4)$<br>따라서 $m=12,\\;n=5$이므로 $m+n=17$", "k": "num", "a": "17", "q": "$a>4$일 때, $2a+\\dfrac{2}{a-4}$의 최솟값을 $m,$그때의 $a$의 값을 $n$이라 하자. 이때 $m+n$의 값을 구하시오.", "key": "T07-06"}, "x07x47-066": {"id": "x07x47-066", "unit": "07", "theme": "06", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "$a>0,\\;b>0,\\;c>0$이므로<br>$\\dfrac{a+b}{c}+\\dfrac{b+c}{a}+\\dfrac{c+a}{b}$<br>$=\\left(\\dfrac{a}{b}+\\dfrac{b}{a}\\right)+\\left(\\dfrac{b}{c}+\\dfrac{c}{b}\\right)+\\left(\\dfrac{c}{a}+\\dfrac{a}{c}\\right)$<br>$\\ge 2\\sqrt{\\dfrac{a}{b}\\times \\dfrac{b}{a}}+2\\sqrt{\\dfrac{b}{c}\\times \\dfrac{c}{b}}+2\\sqrt{\\dfrac{c}{a}\\times \\dfrac{a}{c}}$<br>$=2+2+2=6$(단, 등호는 $a=b=c$일 때 성립)<br>따라서 구하는 최솟값은 $6$이다.", "k": "num", "a": "6", "q": "$a>0,\\;b>0,\\;c>0$일 때, $\\dfrac{a+b}{c}+\\dfrac{b+c}{a}+\\dfrac{c+a}{b}$의 최솟값을 구하시오.", "key": "T07-06"}, "x07x47-067": {"id": "x07x47-067", "unit": "07", "theme": "06", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "$x\\ne 0$이므로 $\\dfrac{x}{x^{2}+4x+4}=\\dfrac{1}{x+4+\\dfrac{4}{x}}\\cdots \\cdots $ ㉠<br>이때 $x>0$이므로<br>$x+4+\\dfrac{4}{x}\\ge 2\\sqrt{x\\times \\dfrac{4}{x}}+4$<br>$=4+4=8$ (단, 등호는 $x=2$일 때 성립)<br>㉠에서 $\\dfrac{x}{x^{2}+4x+4}\\le \\dfrac{1}{8}$<br>따라서 구하는 최댓값은 $\\dfrac{1}{8}$이다.", "k": "c5", "c": ["$\\dfrac{1}{8}$", "$\\dfrac{1}{6}$", "$1$", "$4$", "$8$"], "a": "$\\dfrac{1}{8}$", "q": "$x>0$일 때, $\\dfrac{x}{x^{2}+4x+4}$의 최댓값은?", "key": "T07-06"}, "x07x30-079": {"id": "x07x30-079", "unit": "07", "theme": "07", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "주어진 명제가 참이므로 그 대우<br>‘$agek$이고 $b\\ge -1$이면 $a+b\\ge 4$이다.’도 참이다.<br>$agek$, $b\\ge -1$에서 $a+b\\ge k-1$이므로<br>$k-1\\ge 4\\therefore k\\ge 5$<br>따라서 $k$의 최솟값은 $5$이다.", "k": "num", "a": "5", "q": "두 실수 $a,\\;b$에 대하여 명제<br> ‘$a+b<4$이면 $a<k$ 또는 $b<-1$이다.’<br>가 참일 때, 실수 $k$의 최솟값을 구하시오.", "key": "T07-07"}, "x07x30-080": {"id": "x07x30-080", "unit": "07", "theme": "07", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "주어진 명제가 참이므로 그 대우<br>‘$x-a=0$이면 $x^{2}-8x+15=0$이다.’<br>도 참이다.<br>이때 $x^{2}-8x+15=0$에 $x-a=0$, 즉 $x=a$를 대입하면<br>$a^{2}-8a+15=0$, $(a-3)(a-5)=0$<br>$\\therefore a=3$ 또는 $a=5$<br>따라서 구하는 합은<br>$3+5=8$", "k": "num", "a": "8", "q": "명제 ‘$x^{2}-8x+15\\ne 0$이면 $x-a\\ne 0$이다.’가 참일 때, 모든 실수 $a$의 값의 합을 구하시오.", "key": "T07-07"}, "x07x30-099": {"id": "x07x30-099", "unit": "07", "theme": "07", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$p$가 $q$이기 위한 충분조건이 되려면 명제 ‘$4x^{2}-4x-3\\ne 0$이면 $2x+a\\ne 0$이다.’가 참이어야 하고, 이 명제의 대우 ‘$2x+a=0$이면 $4x^{2}-4x-3=0$이다.’도 참이어야 한다.<br>$4x^{2}-4x-3=0$에 $2x+a=0$, 즉 $x=-\\dfrac{a}{2}$를 대입하면<br>$4\\cdot \\left(-\\dfrac{a}{2}\\right)^{2}-4\\cdot \\left(-\\dfrac{a}{2}\\right)-3=0$<br>$a^{2}+2a-3=0$, $(a+3)(a-1)=0$<br>$\\therefore a=-3$ 또는 $a=1$<br>따라서 모든 실수 $a$의 값의 합은 $-3+1=-2$", "k": "num", "a": "-2", "q": "두 조건 $p\\,:\\,4x^{2}-4x-3\\ne 0$, $q\\,:\\,2x+a\\ne 0$에 대하여 $p$가 $q$이기 위한 충분조건이 되도록 하는 모든 실수 $a$의 값의 합을 구하시오.", "key": "T07-07"}, "x07x47-029": {"id": "x07x47-029", "unit": "07", "theme": "07", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "주어진 명제의 대우 ‘$a\\ge k$이고 $b\\ge 3$이면 $a+b\\ge 6$이다.’<br>가 참이다.<br>$a\\ge k$이고 $b\\ge 3$에서 $a+b\\ge k+3$이므로<br>$k+3\\ge 6\\therefore \\;k\\ge 3$<br>따라서 상수 $k$의 최솟값은 $3$이다.", "k": "c5", "c": ["$-1$", "$1$", "$2$", "$3$", "$4$"], "a": "$3$", "q": "실수 $a,\\;b$에 대하여<br> ‘$a+b<6$이면 $a<k$ 또는 $b<3$이다.’<br>가 참일 때, 상수 $k$의 최솟값은?", "key": "T07-07"}, "x07x47-030": {"id": "x07x47-030", "unit": "07", "theme": "07", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "주어진 명제가 참이므로 그 대우 ‘$x-a=0$이면 $x^{2}-6x+5=0$이다.’도 참이다.<br>$x=a$를 $x^{2}-6x+5=0$에 대입하면<br>$a^{2}-6a+5=0,\\;(a-1)(a-5)=0$<br>$\\therefore \\;a=1$ 또는 $a=5$<br>따라서 모든 상수 $a$의 값의 합은<br>$1+5=6$", "k": "c5", "c": ["$6$", "$7$", "$8$", "$9$", "$10$"], "a": "$6$", "q": "명제<br> ‘$x^{2}-6x+5\\ne 0$이면 $x-a\\ne 0$이다.’<br>가 참이 되도록 하는 모든 상수 $a$의 값의 합은?", "key": "T07-07"}, "x07x47-031": {"id": "x07x47-031", "unit": "07", "theme": "07", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "명제 $q\\,\\to \\,p$가 참이면 그 대우 $\\sim p\\,\\to \\,\\sim q$도 참이다.<br>$\\sim p\\,:\\,|\\,x-1\\,|<2$에서 $-2<x-1<2$<br>$\\therefore \\;-1<x<3$<br>$\\sim q\\,:\\,|\\,x-a\\,|<3$에서 $-3<x-a<3$<br>$\\therefore \\;a-3<x<a+3$<br>두 조건 $p,\\;q$의 진리집합을 각각 $P,\\;Q$라 하면<br>$P^{C}=\\left\\{x\\,|\\,-1<x<3\\right\\},\\;Q^{C}=\\left\\{x\\,|\\,a-3<x<a+3\\right\\}$<br>명제 $\\sim p\\,\\to \\,\\sim q$가 참이려면 $P^{C}\\subset Q^{C}$이어야 하므로<br>$a-3\\le -1,\\;a+3\\ge 3$<br>$\\therefore \\;0\\le a\\le 2$<br>따라서 정수 $a$는 $0,\\;1,\\;2$의 $3$개이다.", "k": "c5", "c": ["$2$", "$3$", "$4$", "$5$", "$6$"], "a": "$3$", "q": "두 조건 $p,\\;q$가<br> $p\\,:\\,|\\,x-1\\,|\\ge 2,\\;q\\,:\\,|\\,x-a\\,|\\ge 3$<br>일 때, 명제 $q\\,\\to \\,p$가 참이 되도록 하는 정수 $a$의 개수는?", "key": "T07-07"}, "x07x68-046": {"id": "x07x68-046", "unit": "07", "theme": "07", "벌": "X07x68", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "주어진 명제의 대우는<br>$x>-2$이고 $y>k$이면 $x+y>1$이다.<br>대우의 가정 ‘$x>-2$이고 $y>k$’에서<br>$x+y>k-2$<br>주어진 명제가 참이면 그 대우도 참이므로<br>$k-2\\ge 1$<br>$\\therefore \\;k{\\ge }3$<br>따라서 $k$의 최솟값은 $3$", "k": "num", "a": "3", "q": "실수 $x$, $y$에 대하여 명제 ‘$x+y{\\le }1$이면 $x{\\le }-2$ 또는 $y{\\le }k$이다.’가 참일 때, 상수 $k$의 최솟값을 구하시오.", "key": "T07-07"}, "x07x68-047": {"id": "x07x68-047", "unit": "07", "theme": "07", " 08"}, "x07x47-035": {"id": "x07x47-035", "unit": "07", "theme": "08", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "명제 (가), (나)에서<br>$p\\,:$과학을 좋아한다.<br>$q\\,:$실험을 좋아한다.<br>$r\\,:$호기심이 있다.<br>라 하자.<br>(가)에서 명제 $p\\,\\to \\,q$가 참이고 (나)에서 명제 $\\sim p\\,\\to \\,\\sim r$와 그 대우 $r\\,\\to \\,p$가 참이다.<br>두 명제 $r\\,\\to \\,p,\\;p\\,\\to \\,q$가 참이므로 명제 $r\\,\\to \\,q$가 참이다.<br>따라서 항상 참인 명제는 ④이다.", "k": "c5", "c": ["과학을 좋아하는 사람은 호기심이 있다.", "실험을 좋아하는 사람은 과학을 좋아한다.", "실험을 좋아하지 않는 사람은 호기심이 있다.", "호기심이 있는 사람은 실험을 좋아한다.", "호기심이 없는 사람은 과학을 좋아하지 않는다."], "a": "호기심이 있는 사람은 실험을 좋아한다.", "q": "아래 명제가 모두 참일 때, 다음 중 항상 참인 명제는?<br>(가) 과학을 좋아하는 사람은 실험을 좋아한다.<br>(나) 과학을 좋아하지 않는 사람은 호기심이 없다.", "key": "T07-08"}, "x07x47-036": {"id": "x07x47-036", "unit": "07", "theme": "08", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "(ⅰ) $a$가 양수일 때,<br>(나)에 의하여 $b$도 양수이다.<br>$b$가 양수이면 (다)에 의하여 $c$도 양수이다.<br>즉, $a,\\;b,\\;c$는 모두 양수이다.<br>(ⅱ) $a$가 음수일 때,<br>(나)에 의하여 $b$도 음수이다.<br>$a,\\;b$가 음수이면 (라)에 의하여 $c$도 음수이다.<br>그런데 세 정수 $a,\\;b,\\;c$가 모두 음수이면 (가)를 만족시키지 않는다.<br>(ⅰ), (ⅱ)에서 $a>0,\\;b>0,\\;c>0$", "k": "c5", "c": ["$a>0,\\;b>0,\\;c>0$", "$a>0,\\;b<0,\\;c>0$", "$a>0,\\;b<0,\\;c<0$", "$a<0,\\;b>0,\\;c<0$", "$a<0,\\;b<0,\\;c<0$"], "a": "$a>0,\\;b>0,\\;c>0$", "q": "$0$이 아닌 세 정수 $a,\\;b,\\;c$에 대하여 아래 명제가 모두 참일 때, 다음 중 옳은 것은?<br>(가) 세 정수 중에서 양수가 있다.<br>(나) $a$와 $b$의 부호는 같다.<br>(다) $b$가 양수이면 $c$도 양수이다.<br>(라) $a$가 음수이면 $b$가 양수이거나 $c$가 음수이다.", "key": "T07-08"}, "x07x68-051": {"id": "x07x68-051", "unit": "07", "theme": "08", "벌": "X07x68", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "① 명제 $p\\,\\to \\,r$가 참이면 그 대우도 참이므로<br>명제 $\\sim r\\,\\to \\,\\sim p$가 참이다.<br>③ 명제 $q\\,\\to \\,\\sim r$가 참이면 그 대우도 참이므로<br>명제 $r\\,\\to \\,\\sim q$가 참이다.<br>④ 두 명제 $p\\,\\to \\,r$, $r\\,\\to \\,\\sim q$가 참이므로<br>명제 $p\\,\\to \\,\\sim q$가 참이다.<br>⑤ 명제 $p\\,\\to \\,\\sim q$가 참이면 그 대우도 참이므로<br>명제 $q\\,\\to \\,\\sim p$가 참이다.<br>따라서 항상 참이라 할 수 없는 것은 ②이다.", "k": "c5", "c": ["$\\sim r\\,\\to \\,\\sim p$", "$\\sim p\\,\\to \\,q$", "$r\\,\\to \\,\\sim q$", "$p\\,\\to \\,\\sim q$", "$q\\,\\to \\,\\sim p$"], "a": "$\\sim p\\,\\to \\,q$", "q": "세 조건 $p$, $q$, $r$에 대하여 두 명제 $p\\,\\to \\,r$, $q\\,\\to \\,\\sim r$가 모두 참일 때, 다음 명제 중 항상 참이라 할 수 없는 것은?", "key": "T07-08"}, "x07x68-053": {"id": "x07x68-053", "unit": "07", "theme": "08", "벌": "X07x68", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "명제 (가), (나)에서<br>$p\\,:$기온이 높다.,<br>$q\\,:$제품 $\\mathrm{A}$가 잘 팔린다.,<br>$r\\,:$제품 $\\mathrm{B}$가 잘 팔린다.<br>라 하자.<br>(가)에서 명제 $p\\,\\to \\,q$가 참이고 (나)에서 명제 $r\\,\\to \\,\\sim q$와<br>그 대우 $q\\,\\to \\,\\sim r$가 참이다.<br>두 명제 $p\\,\\to \\,q$, $q\\,\\to \\,\\sim r$가 참이므로 명제 $p\\,\\to \\,\\sim r$와<br>그 대우 $r\\,\\to \\,\\sim p$가 참이다.<br>① $q\\,\\to \\,p$ ② $q\\,\\to \\,r$ ③ $p\\,\\to \\,\\sim r$ ④ $\\sim p\\,\\rightarrow \\,r$ ⑤ $r\\,\\to \\,p$<br>따라서 항상 참인 명제는 ③이다.", "k": "c5", "c": ["제품 $\\mathrm{A}$가 잘 팔리면 기온이 높다.", "제품 $\\mathrm{A}$가 잘 팔리면 제품 $\\mathrm{B}$가 잘 팔린다.", "기온이 높으면 제품 $\\mathrm{B}$가 잘 팔리지 않는다.", "기온이 높지 않으면 제품 $\\mathrm{B}$가 잘 팔린다.", "제품 $\\mathrm{B}$가 잘 팔리면 기온이 높다."], "a": "기온이 높으면 제품 $\\mathrm{B}$가 잘 팔리지 않는다.", "q": "아래 두 명제가 모두 참일 때, 다음 중 항상 참인 명제인 것은?<br>(가) 기온이 높으면 제품 $\\mathrm{A}$가 잘 팔린다.<br>(나) 제품 $\\mathrm{B}$가 잘 팔리면 제품 $\\mathrm{A}$는 잘 팔리지 않는다.", "key": "T07-08"}, "x07x39-018": {"id": "x07x39-018", "unit": "07", "theme": "09", "벌": "X07x39", "lvl": 1, "fix": true, "src": "문제집 고쟁이", "w": "두 조건 $p,\\;q$의 진리집합을 각각 $P,\\;Q$라 하자.<br>이때 $p$는 $q$이기 위한 충분조건이지만 필요조건이 아니기 위해선 $P\\subset Q$이지만 $P\\ne Q$이어야 한다.<br>① $p\\,:\\,xz=yz\\;\\leftrightarrow \\;x=y$ 또는 $z=0$이므로 $Q\\subset P$<br>즉, $p$는 $q$이기 위한 필요조건이다.<br>② $P=\\left\\{1,\\;2,\\;3,\\;4,\\;6,\\;12\\right\\},Q=\\left\\{1,\\;2,\\;3,\\;6\\right\\}$이므로 $Q\\subset P$<br>즉, $p$는 $q$이기 위한 필요조건이다.<br>③ $q\\,:\\,x^{2}=x\\;\\leftrightarrow \\;x=0$ 또는 $x=1$이므로 $P=Q$<br>즉, $p$는 $q$이기 위한 필요충분조건이다.<br>④ $x$와 $y$가 모두 유리수이면 $xy$는 유리수이다.<br>하지만 $xy$가 유리수일 때, $x$와 $y$가 모두 유리수가 아닐 수도 있다.<br>[반례] $x=\\sqrt{2},y=\\sqrt{2}$일 때, $xy=\\sqrt{2}\\times \\sqrt{2}=2$<br>즉, $P\\subset Q,P\\ne Q$이므로 $p$는 $q$이기 위한 충분조건이지만 필요조건이 아니다.<br>⑤ $p\\,:\\,|\\,x\\,|\\le 3\\;\\leftrightarrow \\;-3\\le x\\le 3$이므로 $Q\\subset P$<br>즉, $p$는 $q$이기 위한 필요조건이다.<br>따라서 구하는 것은 ④이다.", "k": "c5", "c": ["$p\\,:\\,xz=yz$,$q\\,:\\,x=y$", "$p\\,:\\,x$는 $12$의 양의 약수,$q\\,:\\,x$는 $6$의 양의 약수", "$p\\,:\\,x=0$ 또는 $x=1$,$q\\,:\\,x^{2}=x$", "$p\\,:\\,x$와 $y$는 모두 유리수,$q\\,:\\,xy$는 유리수", "$p\\,:\\,|\\,x\\,|\\le 3$,$q\\,:\\,0\\le x\\le 2$"], "a": "$p\\,:\\,x$와 $y$는 모두 유리수,$q\\,:\\,xy$는 유리수", "q": "두 조건 $p,\\;q$에 대하여 $p$는 $q$이기 위한 충분조건이지만 필요조건이 아닌 것은? (단, $x,\\;y,\\;z$는 실수이다.)", "key": "T07-09"}, "x07x39-019": {"id": "x07x39-019", "unit": "07", "theme": "09", "벌": "X07x39", "lvl": 1, "fix": true, "src": "문제집 고쟁이", "w": "$p$가 $q$이기 위한 필요충분조건이므로<br>부등식 $x^{2}+ax+b\\le 0$의 해가 $-2\\le x\\le 1$이다.<br>$x^{2}+ax+b=(x+2)(x-1)\\le 0$이므로<br>$x^{2}+x-2\\le 0$에서 $a=1,\\;b=-2$이다.<br>$∴\\;a^{2}+b^{2}=5$", "k": "c5", "c": ["$3$", "$5$", "$7$", "$9$", "$11$"], "a": "$5$", "q": "실수 $x$에 대하여 두 조건 $p$, $q$를 각각<br> $p\\,:\\,-2\\le x\\le 1$, $q\\,:\\,x^{2}+ax+b\\le 0$<br>이라 하자. $p$는 $q$이기 위한 필요충분조건일 때, $a^{2}+b^{2}$의 값은?<br>(단, $a$, $b$는 상수이다.)", "key": "T07-09"}, "x07x20-068": {"id": "x07x20-068", "unit": "07", "theme": "09", "벌": "X07x20", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "$p$가 $q$이기 위한 필요조건이므로<br>$q\\;\\rightarrow \\;p\\therefore \\;Q\\subset P$<br>① $P\\cap Q=Q$   ② $P\\cup Q=P$<br>③ $P\\ne Q$이면  $P\\cap Q^{C}=\\varnothing $ ⑤ $P^{C}-Q=P^{C}$<br>따라서 항상 옳은 것은 ④이다.", "k": "c5", "c": ["$P\\cap Q=P$", "$P\\cup Q=U$", "$P\\cap Q^{C}=\\varnothing $", "$P\\cup Q^{C}=U$", "$P^{C}-Q=\\varnothing $"], "a": "$P\\cup Q^{C}=U$", "q": "전체집합 $U$에 대하여 두 조건 $p,\\;q$의 진리집합을 각각 $P,\\;Q$라 하자. $p$가 $q$이기 위한 필요조건일 때, 다음 중 항상 옳은 것은?", "key": "T07-09"}, "x07x20-075": {"id": "x07x20-075", "unit": "07", "theme": "09", "벌": "X07x20", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "$p$는 $q$이기 위한 충분조건이므로  $p\\;\\rightarrow \\;q$<br>$\\therefore \\;\\sim q\\;\\rightarrow \\;\\sim p$<br>$\\sim q$는 $r$이기 위한 필요조건이므로  $r\\;\\rightarrow \\;\\sim q$<br>$\\therefore \\;q\\;\\rightarrow \\;\\sim r$<br>$p\\;\\rightarrow \\;q,\\;q\\;\\rightarrow \\;\\sim r$이므로 $p\\;\\rightarrow \\;\\sim r\\therefore \\;r\\;\\rightarrow \\;\\sim p$<br>따라서 반드시 참이라고 할 수 없는 명제는 ⑤이다.", "k": "c5", "c": ["$p\\,\\to \\,\\sim r$", "$q\\,\\to \\,\\sim r$", "$\\sim q\\,\\to \\,\\sim p$", "$r\\,\\to \\,\\sim p$", "$\\sim r\\,\\to \\,q$"], "a": "$\\sim r\\,\\to \\,q$", "q": "세 조건 $p,\\;q,\\;r$에 대하여 $p$는 $q$이기 위한 충분조건이고, $\\sim q$는 $r$이기 위한 필요조건일 때, 다음 명제 중 반드시 참이라고 할 수 없는 것은?", "key": "T07-09"}, "x07x20-076": {"id": "x07x20-076", "unit": "07", "theme": "09", "벌": "X07x20", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "ㄱ. 명제 $p\\,\\to \\,q$가 참이므로 $q$는 $p$이기 위한 필요조건이지만 충분조건인지는 알 수 없다. (거짓)<br>ㄴ. 명제 $\\sim r\\,\\to \\,\\sim q$가 참이므로 그 대우 $q\\,\\to \\,r$가 참이다. <br>즉 $r$는 $q$이기 위한 필요조건이다. (참)<br>ㄷ. 두 명제 $p\\,\\to \\,q,\\;q\\,\\to \\,r$가 참이므로 명제 $p\\,\\to \\,r$도 참이다. <br>즉 $p$는 $r$이기 위한 충분조건이다. (참)<br>이상에서 항상 옳은 것은 ㄴ, ㄷ이다.", "k": "c5", "c": ["ㄱ", "ㄴ", "ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "a": "ㄴ, ㄷ", "q": "세 조건 $p,\\;q,\\;r$에 대하여 두 명제 $p\\,\\to \\,q,\\;\\sim r\\,\\to \\,\\sim q$가 모두 참일 때, <보기>에서 항상 옳은 것만을 있는 대로 고른 것은?<br><b><보기><\/b><br>ㄱ. $q$는 $p$이기 위한 필요충분조건이다.<br>ㄴ. $r$는 $q$이기 위한 필요조건이다.<br>ㄷ. $p$는 $r$이기 위한 충분조건이다.", "key": "T07-09"}, "x07x30-091": {"id": "x07x30-091", "unit": "07", "theme": "09", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$p\\,:\\,|\\,a\\,|+|\\,b\\,|=0$에서 $a=0$, $b=0$<br>$q\\,:\\,a^{2}-2ab+b^{2}=0$에서 $(a-b)^{2}=0\\therefore a=b$<br>$r\\,:\\,|\\,a+b\\,|=|\\,a-b\\,|$에서 $a+b=\\pm (a-b)$<br>$\\therefore a=0$ 또는 $b=0$<br>ㄱ. $p\\rightarrow q$, $qnot\\rightarrow p$이므로 $p$는 $q$이기 위한 충분조건이다.<br>ㄴ. $\\sim p\\,:\\,a\\ne 0$ 또는 $b\\ne 0$, $\\sim r\\,:\\,a\\ne 0,\\;b\\ne 0$<br>따라서 $\\sim pnot\\rightarrow \\sim r$, $\\sim r\\rightarrow \\sim p$이므로 $\\sim p$는 $\\sim r$이기 위한 필요조건이다.<br>ㄷ. $q$이고 $r\\,:\\,a=0$, $b=0$<br>따라서 ($q$이고 $r$) $\\leftrightarrow p$이므로 $q$이고 $r$는 $p$이기 위한 필요충분조건이다.<br>이상에서 옳은 것은 ㄷ뿐이다.", "k": "c5", "c": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ"], "a": "ㄷ", "q": "두 실수 $a,\\;b$에 대하여 세 조건 $p,\\;q,\\;r$가<br> $p\\,:\\,|\\,a\\,|+|\\,b\\,|=0$, $q\\,:\\,a^{2}-2ab+b^{2}=0$,<br> $r\\,:\\,|\\,a+b\\,|=|\\,a-b\\,|$<br>일 때, 옳은 것만을 <보기>에서 있는 대로 고른 것은?<br><b><보기><\/b><br>ㄱ. $p$는 $q$이기 위한 필요조건이다.<br>ㄴ. $\\sim p$는 $\\sim r$이기 위한 충분조건이다.<br>ㄷ. $q$이고 $r$는 $p$이기 위한 필요충분조건이다.", "key": "T07-09"}, "x07x30-092": {"id": "x07x30-092", "unit": "07", "theme": "09", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$q\\rightarrow p$, $r\\rightarrow q$이므로 $r\\rightarrow p$<br>$q\\rightarrow p$이므로 $\\sim p\\rightarrow \\sim q$<br>이상에서 참인 명제인 것은 ㄷ, ㄹ이다.", "k": "c5", "c": ["ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄴ, ㄹ", "ㄷ, ㄹ"], "a": "ㄷ, ㄹ", "q": "세 조건 $p,\\;q,\\;r$에 대하여 $p$는 $q$이기 위한 필요조건이고 $r$는 $q$이기 위한 충분조건일 때, 참인 명제인 것만을 <보기>에서 있는 대로 고른 것은?<br><b><보기><\/b><br>ㄱ. $p\\to q$       <br>ㄴ. $q\\to r$<br>ㄷ. $r\\to p$       <br>ㄹ. $\\sim p\\to \\sim q$", "key": "T07-09"}, "x07x30-093": {"id": "x07x30-093", "unit": "07", "theme": "09", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "① $q\\rightarrow p$이므로 $p$는 $q$이기 위한 필요조건이다.<br>② $\\sim r\\rightarrow \\sim p$이므로 $p\\rightarrow r$<br>$q\\rightarrow p$, $p\\rightarrow r$이므로 $q\\rightarrow r$<br>따라서 $q$는 $r$이기 위한 충분조건이다.<br>③ $p\\rightarrow r$이므로 $r$는 $p$이기 위한 필요조건이다.<br>④ $q\\rightarrow p$이므로 $\\sim p\\rightarrow \\sim q$<br>따라서 $\\sim p$는 $\\sim q$이기 위한 충분조건이다.<br>⑤ $q\\rightarrow r$이므로 $\\sim r\\rightarrow \\sim q$<br>따라서 $\\sim r$는 $\\sim q$이기 위한 충분조건이다.", "k": "c5", "c": ["$p$는 $q$이기 위한 필요조건이다.", "$q$는 $r$이기 위한 충분조건이다.", "$r$는 $p$이기 위한 필요조건이다.", "$\\sim p$는 $\\sim q$이기 위한 충분조건이다.", "$\\sim r$는 $\\sim q$이기 위한 필요조건이다."], "a": "$\\sim r$는 $\\sim q$이기 위한 필요조건이다.", "q": "세 조건 $p,\\;q,\\;r$에 대하여 두 명제 $q\\to \\sim p$, $\\sim r\\to \\sim p$가 모두 참일 때, 다음 중 옳지 않은 것은?", "key": "T07-09"}, "x07x30-094": {"id": "x07x30-094", "unit": "07", "theme": "09", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$p$는 $q$이기 위한 충분조건이므로 $P\\subset Q$<br>$r$는 $q$이기 위한 필요조건이므로 $Q\\subset R$<br>따라서 $P\\subset Q\\subset R$이므로 항상 옳은 것은 ②이다.", "k": "c5", "c": ["$R\\subset (P\\cup Q)$", "$(P\\cap Q)\\subset R$", "$(Q\\cap R)\\subset P$", "$R-Q=P$", "$(P\\cup Q^{C})\\subset R^{C}$"], "a": "$(P\\cap Q)\\subset R$", "q": "세 조건 $p,\\;q,\\;r$에 대하여 $p$는 $q$이기 위한 충분조건이고, $r$는 $q$이기 위한 필요조건이다. 전체집합 $U$에 대하여 세 조건 $p,\\;q,\\;r$의 진리집합을 각각 $P,\\;Q,\\;R$라 할 때, 다음 중 항상 옳은 것은?", "key": "T07-09"}, "x07x30-100": {"id": "x07x30-100", "unit": "07", "theme": "09", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$x+1=2x-1$에서 $x=2$<br>이때 $x+1=2x-1$이 $x^{2}-ax+b=0$이기 위한 필요충분조건이므로 이차방정식 $x^{2}-ax+b=0$의 해는 $x=2$뿐이다.<br>중근 $x=2$를 갖고 $x^{2}$의 계수가 $1$인 이차방정식은<br>$(x-2)^{2}=0\\therefore x^{2}-4x+4=0$<br>따라서 $a=4$, $b=4$이므로 $a+b=8$", "k": "num", "a": "8", "q": "$x+1=2x-1$이 $x^{2}-ax+b=0$이기 위한 필요충분조건일 때, 실수 $a,\\;b$에 대하여 $a+b$의 값을 구하시오.", "key": "T07-09"}, "x07x30-103": {"id": "x07x30-103", "unit": "07", "theme": "09", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$(A\\cup B)\\cap (B-A)^{C}=(A\\cup B)\\cap (B\\cap A^{C})^{C}$<br>$=(A\\cup B)\\cap (B^{C}\\cup A)$<br>$=A\\cup (B\\cap B^{C})$<br>$=A\\cup \\varnothing =A$<br>따라서 $A\\cup B=A$가 성립하기 위한 필요충분조건은 $B\\subset A$이다.", "k": "c5", "c": ["$A\\subset B$", "$B\\subset A$", "$A\\cap B=\\varnothing $", "$A=U$", "$A\\cup B=U$"], "a": "$B\\subset A$", "q": "다음 중 전체집합 $U$의 두 부분집합 $A,\\;B$에 대하여<br> $(A\\cup B)\\cap (B-A)^{C}=A\\cup B$<br>가 성립하기 위한 필요충분조건인 것은?", "key": "T07-09"}, "x07x39-056": {"id": "x07x39-056", "unit": "07", "theme": "09", "벌": "X07x39", "lvl": 2, "fix": true, "src": "문제집 고쟁이", "w": "두 조건 $p,\\;q$의 진리집합을 각각 $P,\\;Q$라 할 때<br>$p$가 $q$이기 위한 필요충분조건이기 위해선 $P=Q$이어야 한다.<br>ㄱ. $p\\,:\\,|\\,x-y\\,|=|\\,x+y\\,|$에서 $|\\,x-y\\,|=|\\,x+y\\,|$의 양변을 제곱하면<br>$(x-y)^{2}=(x+y)^{2}$, $x^{2}-2xy+y^{2}=x^{2}+2xy+y^{2}$<br>$\\therefore \\;xy=0\\;\\leftrightarrow \\;x=0$ 또는 $y=0$<br>즉, $P=Q$이므로 $p$는 $q$이기 위한 필요충분조건이다.<br>ㄴ. $p\\,:\\,|\\,x\\,|+|\\,y\\,|=|\\,x+y\\,|$에서<br>$|\\,x\\,|+|\\,y\\,|=|\\,x+y\\,|$의 양변을 제곱하면<br>$|\\,x\\,|^{2}+2|\\,x\\,||\\,y\\,|+|\\,y\\,|^{2}=(x+y)^{2}$<br>$x^{2}+2|\\,xy\\,|+y^{2}=x^{2}+2xy+y^{2}$, $|\\,xy\\,|=xy$<br>$\\therefore \\;xy\\ge 0$<br>즉, $Q\\subset P$이므로 $p$는 $q$이기 위한 필요조건이다.<br>ㄷ. $p\\,:\\,|\\,x+y\\,|<|\\,x-y\\,|$에서 $|\\,x+y\\,|\\ge 0,\\;|\\,x-y\\,|\\ge 0$이므로<br>$|\\,x+y\\,|,\\;|\\,x-y\\,|$와 $|\\,x+y\\,|^{2},\\;|\\,x-y\\,|^{2}$의 대소 관계는 같다.<br>$|\\,x+y\\,|^{2}-|\\,x-y\\,|^{2}=(x+y)^{2}-(x-y)^{2}=4xy<0$이므로<br>$xy<0$<br>즉, $P=Q$이므로 $p$는 $q$이기 위한 필요충분조건이다.<br>따라서 $p$가 $q$이기 위한 필요충분조건인 것은 ㄱ, ㄷ이다.", "k": "c5", "c": ["ㄱ", "ㄴ", "ㄱ, ㄴ", "ㄱ, ㄷ", "ㄱ, ㄴ, ㄷ"], "a": "ㄱ, ㄷ", "q": "<보기>에서 두 조건 $p,\\;q$에 대하여 $p$가 $q$이기 위한 필요충분조건인 것만을 있는 대로 고른 것은? (단, $x,\\;y$는 실수이다.)<br><b><보기><\/b><br>ㄱ. $p\\,:\\,|\\,x-y\\,|=|\\,x+y\\,|,\\;q\\,:\\,x=0$ 또는 $y=0$<br>ㄴ. $p\\,:\\,|\\,x\\,|+|\\,y\\,|=|\\,x+y\\,|,\\;q\\,:\\,x\\ge 0$이고 $y\\ge 0$<br>ㄷ. $p\\,:\\,|\\,x+y\\,|<|\\,x-y\\,|,\\;q\\,:\\,xy<0$", "key": "T07-09"}, "x07x39-057": {"id": "x07x39-057", "unit": "07", "theme": "09", "벌": "X07x39", "lvl": 2, "fix": true, "src": "문제집 고쟁이", "w": "$\\sim q$가 $p$이기 위한 필요조건이 되려면 명제 $p\\;\\to \\,\\sim q$가 참이어야 하므로 그 대우인 $q\\;\\to \\,\\sim p$가 참이면 된다.<br>두 조건 $p$, $q$의 진리집합을 각각 $P,\\;Q$라 할 때, $Q\\subset P^{C}$이어야 한다.<br>$x^{2}-2x-15=(x-5)(x+3)\\le 0$에서<br>$P^{C}=\\{x\\,\\left|\\,-3\\le x\\le 5\\right\\}$<br>$x^{2}=a,\\;x^{2}–a=(x-\\sqrt{a})(x+\\sqrt{a})=0$에서<br>$Q=\\{x\\,\\mid \\,x=\\sqrt{}$ 또는 $x=-\\sqrt{a}\\}$<br>따라서 $\\sqrt{a}\\le 3$에서 $a\\le 9$이므로 자연수 $a$는 $1,\\;2,\\;3,\\;\\cdots ,\\;9$의 $9$개이다.", "k": "c5", "c": ["$9$", "$11$", "$13$", "$15$", "$17$"], "a": "$9$", "q": "실수 $x$에 대하여 두 조건 $p$, $q$가<br> $p\\,:\\,x^{2}-2x-15>0,\\;q\\,:\\,x^{2}=a$<br>이다. $\\sim q$가 $p$이기 위한 필요조건이 되도록 하는 자연수 $a$의 개수는?", "key": "T07-09"}, "x07x39-058": {"id": "x07x39-058", "unit": "07", "theme": "09", "벌": "X07x39", "lvl": 2, "fix": true, "src": "문제집 고쟁이", "w": "세 조건 $p,\\;q,\\;r$의 진리집합을 각각 $P,\\;Q,\\;R$라 하자.<br>$p$가 $q$이기 위한 충분조건이기 위해선 $P\\subset Q$이어야 하고,<br>$p$가 $r$이기 위한 필요조건이기 위해선 $R\\subset P$이어야 하므로<br>이를 수직선에 나타내면 다음과 같다.<br>조건을 만족시키기 위해선 $a<-1$이고 $b\\ge 5$이어야 하므로 정수 $a$의 최댓값은 $-2$이고 정수 $b$의 최솟값은 $5$이다.<br>따라서 구하는 값은 $-2+5=3$이다.", "k": "c5", "c": ["$2$", "$3$", "$4$", "$5$", "$6$"], "a": "$3$", "q": "세 조건 $p,\\;q,\\;r$가<br> $p\\,:\\,-1\\le x<2$ 또는 $x\\ge 5$,<br> $q\\,:\\,x>a$,<br> $r\\,:\\,x\\ge b$<br>일 때, $p$는 $q$이기 위한 충분조건이면서 $r$이기 위한 필요조건이다. 두 정수 $a,\\;b$에 대하여 $a$의 최댓값과 $b$의 최솟값의 합은?", "key": "T07-09"}, "x07x47-037": {"id": "x07x47-037", "unit": "07", "theme": "09", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "$p\\,\\rightarrow \\,q$이므로 $\\sim q\\,\\rightarrow \\,\\sim p$<br>$r\\,\\rightarrow \\,\\sim q$이므로 $q\\,\\rightarrow \\,\\sim r$<br>$p\\,\\rightarrow \\,q,q\\,\\rightarrow \\,\\sim r$이므로<br>$p\\,\\rightarrow \\,\\sim r,\\;r\\,\\rightarrow \\,\\sim p$<br>따라서 <보기>에서 항상 참인 명제는 ㄱ, ㅁ, ㅂ이다.", "k": "c5", "c": ["ㄱ, ㄹ, ㅁ", "ㄱ, ㅁ, ㅂ", "ㄴ, ㄷ, ㅂ", "ㄴ, ㄹ, ㅁ", "ㄷ, ㅁ, ㅂ"], "a": "ㄱ, ㅁ, ㅂ", "q": "세 조건 $p,\\;q,\\;r$에 대하여 $p$는 $q$이기 위한 충분조건, $\\sim q$는 $r$이기 위한 필요조건일 때, <보기>에서 항상 참인 명제인 것만을 있는 대로 고른 것은?<br><b><보기><\/b><br>ㄱ. $p\\,\\to \\,\\sim r$       <br>ㄴ. $\\sim p\\,\\to \\,q$<br>ㄷ. $\\sim p\\,\\to \\,r$       <br>ㄹ. $q\\,\\to \\,r$<br>ㅁ. $\\sim q\\,\\to \\,\\sim p$      <br>ㅂ. $r\\,\\to \\,\\sim p$", "key": "T07-09"}, "x07x47-038": {"id": "x07x47-038", "unit": "07", "theme": "09", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "① $q$에서 $x=-1$ 또는 $x=1$<br>$p\\,\\rightarrow \\,q$이므로 $p$는 $q$이기 위한 충분조건이다.<br>② $p$에서 $x=-1$ 또는 $x=1$<br>$q$에서 $x=-1$ 또는 $x=1$<br>$p\\,\\leftrightarrow \\,q$이므로 $p$는 $q$이기 위한 필요충분조건이다.<br>③ $p$에서 $x=-1$ 또는 $x=1$<br>$q\\,\\rightarrow \\,p$이므로 $p$는 $q$이기 위한 필요조건이다.<br>④ $q$에서 $x<-1$ 또는 $x>1$<br>$p\\,\\rightarrow \\,q$이므로 $p$는 $q$이기 위한 충분조건이다.<br>⑤ $p$에서 $x<0$ 또는 $x>0$<br>$q\\,\\rightarrow \\,p$이므로 $p$는 $q$이기 위한 필요조건이다.<br>따라서 $p$가 $q$이기 위한 필요충분조건인 것은 ②이다.", "k": "c5", "c": ["$p\\,:\\,x=1,\\;q\\,:\\,x^{2}=1$", "$p\\,:\\,x^{2}=1,\\;q\\,:\\,|\\,x\\,|=1$", "$p\\,:\\,|\\,x\\,|=1,\\;q\\,:\\,x=1$", "$p\\,:\\,x>1,\\;q\\,:\\,|\\,x\\,|>1$", "$p\\,:\\,x^{2}>0,\\;q\\,:\\,x>0$"], "a": "$p\\,:\\,x^{2}=1,\\;q\\,:\\,|\\,x\\,|=1$", "q": "두 조건 $p,\\;q$에 대하여 다음 중 $p$가 $q$이기 위한 필요충분조건인 것은? (단, $x$는 실수)", "key": "T07-09"}, "x07x47-039": {"id": "x07x47-039", "unit": "07", "theme": "09", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "ㄱ. $p$에서 $x-3=-1$ 또는 $x-3=1$<br>$\\therefore \\;x=2$ 또는 $x=4$<br>$q$에서 $x(x-2)(x-4)=0$<br>$\\therefore \\;x=0$ 또는 $x=2$ 또는 $x=4$<br>$p\\,\\rightarrow \\,q$이므로 $p$는 $q$이기 위한 충분조건이다.<br>ㄴ. $p$에서 $-4\\le 2x\\le 6\\therefore \\;-2\\le x\\le 3$<br>$q$에서 $(x+2)(x-1)\\le 0\\therefore \\;-2\\le x\\le 1$<br>$q\\,\\rightarrow \\,p$이므로 $p$는 $q$이기 위한 필요조건이다.<br>ㄷ. 명제 $p\\,\\to \\,q:$[반례] $x=-2,\\;y=1$ (거짓)<br>$q\\,\\rightarrow \\,p$이므로 $p$는 $q$이기 위한 필요조건이다.<br>따라서 <보기>에서 $p$가 $q$이기 위한 필요조건이지만 충분조건은 아닌 것은 ㄴ, ㄷ이다.", "k": "c5", "c": ["ㄱ", "ㄴ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ"], "a": "ㄴ, ㄷ", "q": "두 조건 $p,\\;q$에 대하여 <보기>에서 $p$가 $q$이기 위한 필요조건이지만 충분조건은 아닌 것만을 있는 대로 고른 것은? (단, $x,\\;y$는 실수)<br><b><보기><\/b><br>ㄱ. $p\\,:\\,|\\,x-3\\,|=1,\\;q\\,:\\,x^{3}-6x^{2}+8x=0$<br>ㄴ. $p\\,:\\,-1\\le 2x+3\\le 9,\\;q\\,:\\,x^{2}+x-2\\le 0$<br>ㄷ. $p\\,:\\,x^{2}>y^{2},\\;q\\,:\\,x>y>0$", "key": "T07-09"}, "x07x47-040": {"id": "x07x47-040", "unit": "07", "theme": "09", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "$|\\,a\\,|+|\\,b\\,|=0$에서 $a=b=0$<br>$a^{2}-b^{2}=0$에서 $(a+b)(a-b)=0$<br>$\\therefore \\;a=-b$ 또는 $a=b$<br>따라서 $|\\,a\\,|+|\\,b\\,|=0$은 $a^{2}-b^{2}=0$이기 위한 ${\\boxed{\\,(가)\\,충분\\,}}$조건이다.<br>$ab=0$에서 $a=0$ 또는 $b=0$<br>$a+bi=0$에서 $a=b=0$<br>따라서 $ab=0$은 $a+bi=0$이기 위한 ${\\boxed{\\,(나)\\,필요\\,}}$조건이다.", "k": "c5", "c": ["(가) 충분 (나) 필요", "(가) 충분 (나) 필요충분", "(가) 필요 (나) 충분", "(가) 필요 (나) 필요충분", "(가) 필요충분 (나) 충분"], "a": "(가) 충분 (나) 필요", "q": "실수 $a,\\;b$에 대하여 다음 (가), (나)에 들어갈 알맞은 것은?<br>(단, $i=\\sqrt{-1}$)<br>$\\bullet |\\,a\\,|+|\\,b\\,|=0$은 $a^{2}-b^{2}=0$이기 위한 ${\\boxed{\\,(가)\\,}}$조건이다.$\\bullet ab=0$은 $a+bi=0$이기 위한 ${\\boxed{\\,(나)\\,}}$조건이다.", "key": "T07-09"}, "x07x47-041": {"id": "x07x47-041", "unit": "07", "theme": "09", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "$p$에서 $x=y$ 또는 $y=z$<br>$q$에서 $x=y=z$<br>$r$에서 $x^{2}+y^{2}=2xz+2yz-2z^{2}$<br>$(x-z)^{2}+(y-z)^{2}=0\\therefore \\;x=y=z$<br>ㄱ. $q\\,\\rightarrow \\,p$이므로 $p$는 $q$이기 위한 필요조건이다.<br>ㄴ. $r\\,\\rightarrow \\,p$이므로 $p$는 $r$이기 위한 필요조건이다.<br>ㄷ. $q\\,\\leftrightarrow \\,r$이므로 $q$는 $r$이기 위한 필요충분조건이다.<br>따라서 <보기>에서 옳은 것은 ㄴ, ㄷ이다.", "k": "c5", "c": ["ㄱ", "ㄴ", "ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "a": "ㄴ, ㄷ", "q": "세 조건 $p,\\;q,\\;r$가<br> $p\\,:\\,(x-y)(y-z)=0,$<br> $q\\,:\\,x=y=z$,<br> $r\\,:\\,x^{2}+y^{2}=2z(x+y-z)$<br>일 때, <보기>에서 옳은 것만을 있는 대로 고른 것은?<br>(단, $x,\\;y,\\;z$는 실수)<br><b><보기><\/b><br>ㄱ. $p$는 $q$이기 위한 충분조건이다.<br>ㄴ. $p$는 $r$이기 위한 필요조건이다.<br>ㄷ. $q$는 $r$이기 위한 필요충분조건이다.", "key": "T07-09"}, "x07x47-045": {"id": "x07x47-045", "unit": "07", "theme": "09", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "$p$는 $q$이기 위한 필요조건이므로 $q\\,\\rightarrow \\,p$에서 $Q\\subset P$<br>$p$는 $r$이기 위한 충분조건이므로 $p\\,\\rightarrow \\,r$에서 $P\\subset R$<br>$\\therefore \\;Q\\subset P\\subset R$", "k": "c5", "c": ["$P\\subset Q\\subset R$", "$P\\subset R\\subset Q$", "$Q\\subset P\\subset R$", "$Q\\subset R\\subset P$", "$R\\subset Q\\subset P$"], "a": "$Q\\subset P\\subset R$", "q": "세 조건 $p,\\;q,\\;r$의 진리집합을 각각 $P,\\;Q,\\;R$라 하자. $p$는 $q$이기 위한 필요조건이고, $p$는 $r$이기 위한 충분조건일 때, 세 집합 $P,\\;Q,\\;R$ 사이의 포함관계는?", "key": "T07-09"}, "x07x68-065": {"id": "x07x68-065", "unit": "07", "theme": "09", "벌": "X07x68", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "① 역 : 두 대각선의 길이가 같은 사각형은 직사각형이다. (거짓)<br>[반례] 등변사다리꼴은 두 대각선의 길이가 같지만 직사각형이 아니다.<br>대우 : 두 대각선의 길이가 같지 않은 사각형은 직사각형이 아니다. (참)<br>② 역 : $a>1$이고 $b>1$이면 $a+b>2$이다. (참)<br>대우 : $a{\\le }1$ 또는 $b{\\le }1$이면 $a+b{\\le }2$이다. (거짓)<br>[반례] $a=-1$, $b=4$이면 $a{\\le }1$이지만 $a+b>2$이다.<br>③ 역 : $|\\,ab\\,|=ab$이면 $a>0$, $b>0$이다. (거짓)<br>[반례] $a=-2$, $b=-3$이면 $|\\,ab\\,|=ab$이지만 $a<0$, $b<0$이다.<br>대우 : $|\\,ab\\,|\\ne ab$이면 $a{\\le }0$ 또는 $b{\\le }0$이다. (참)<br>④ 역 : $ab$가 유리수이면 $a$, $b$도 유리수이다. (거짓)<br>[반례] $a=\\sqrt{2}$, $b=\\sqrt{2}$이면 $ab$는 유리수이지만 $a$, $b$는 유리수가 아니다.<br>대우 : $ab$가 무리수이면 $a$ 또는 $b$가 무리수이다. (참)<br>⑤ 역 : $0$이 아닌 $a$, $b$에  대하여 $\\dfrac{1}{a}<\\dfrac{1}{b}$이면 $a>b$이다. (거짓)<br>[반례] $a=-1$, $b=2$이면 $\\dfrac{1}{a}<\\dfrac{1}{b}$이지만 $a<b$이다.<br>대우 : $0$이 아닌 $a$, $b$에 대하여 $\\dfrac{1}{a}{\\ge }\\dfrac{1}{b}$이면 $a{\\le }b$이다. (거짓)<br>[반례] $a=1$, $b=-2$이면 $\\dfrac{1}{a}{\\ge }\\dfrac{1}{b}$이지만 $a>b$이다.<br>따라서 역은 참이고 대우는 거짓인 명제는 ②이다.", "k": "c5", "c": ["직사각형은 두 대각선의 길이가 같다.", "$a+b>2$이면 $a>1$이고 $b>1$이다.", "$a>0$, $b>0$이면 $|\\,ab\\,|=ab$이다.", "$a$, $b$가 유리수이면 $ab$도 유리수이다.", "$0$이 아닌 $a$, $b$에 대하여 $a>b$이면 $\\dfrac{1}{a}<\\dfrac{1}{b}$이다."], "a": "$a+b>2$이면 $a>1$이고 $b>1$이다.", "q": "다음 중 역은 참이고 대우는 거짓인 명제는?<br>(단, $a$, $b$는 실수)", "key": "T07-09"}, "x07x68-068": {"id": "x07x68-068", "unit": "07", "theme": "09", "벌": "X07x68", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "주어진 명제의 역 ‘$x^{2}+ax-1\\ne 0$이면 $x-2\\ne 0$이다.’가 참이면 그 대우 ‘$x-2=0$이면 $x^{2}+ax-1=0$이다.’가 참이므로<br>$4+2a-1=0$<br>$\\therefore \\;a=-\\dfrac{3}{2}$", "k": "c5", "c": ["$-\\dfrac{3}{2}$", "$-1$", "$-\\dfrac{1}{2}$", "$\\dfrac{1}{2}$", "$1$"], "a": "$-\\dfrac{3}{2}$", "q": "명제 ‘$x-2\\ne 0$이면 $x^{2}+ax-1\\ne 0$이다.’의 역이 참일 때, 상수 $a$의 값은?", "key": "T07-09"}, "x07x68-069": {"id": "x07x68-069", "unit": "07", "theme": "09", "벌": "X07x68", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "명제 $r\\,\\to \\,\\sim q$가 참이면 그 대우도 참이므로 명제 $q\\,\\to \\,\\sim r$가 참이다.<br>두 명제 $p\\,\\to \\,q$, $q\\,\\to \\,\\sim r$가 참이므로<br>명제 $p\\,\\to \\,\\sim r$와 그 대우 $r\\,\\to \\,\\sim p$가 참이다.<br>따라서 보기에서 항상 참인 명제인 것은 ㄷ이다.", "k": "c5", "c": ["ㄱ", "ㄴ", "ㄷ", "ㄱ, ㄷ", "ㄴ, ㄷ"], "a": "ㄷ", "q": "세 조건 $p$, $q$, $r$에 대하여 두 명제 $p\\,\\rightarrow \\,q$, $r\\,\\rightarrow \\,\\sim q$가 모두 참일 때, 보기에서 항상 참인 명제인 것만을 있는 대로 고른 것은?<br><b><보기><\/b><br>ㄱ. $q\\,\\to \\,p$     <br>ㄴ. $p\\,\\t  $n$의 최솟값은 $4$이다.", "k": "c5", "c": ["$1$", "$2$", "$3$", "$4$", "$5$"], "a": "$4$", "q": "실수 $x$에 대하여 두 조건<br> $p\\,:\\,|\\,x\\,|\\le n,$<br> $q\\,:\\,x^{2}+2x-8\\le 0$<br>에 대하여 $p$가 $q$이기 위한 필요조건이 되도록 하는 자연수 $n$의 최솟값은?", "key": "T07-10"}, "x07x47-044": {"id": "x07x47-044", "unit": "07", "theme": "10", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "두 조건 $p,\\;q$의 진리집합을 각각 $P,\\;Q$라 하자.<br>$p$가 $q$이기 위한 충분조건이려면 $p\\,\\rightarrow \\,q$에서 $P\\subset Q$<br>(ⅰ) 다음 그림에서<br>$a-2>-2,\\;a<1\\therefore \\;0<a<1$<br>(ⅱ) 다음 그림에서<br>$a-2\\ge 2,\\;a\\le 6\\therefore \\;4\\le a\\le 6$<br>(ⅰ), (ⅱ)에서 정수 $a$는 $4,\\;5,\\;6$이므로 그 합은<br>$4+5+6=15$", "k": "num", "a": "15", "q": "두 조건 $p,\\;q$가<br> $p\\,:\\,a-2\\le x\\le a,$<br> $q\\,:\\,-2<x<1$ 또는 $2\\le x\\le 6$<br>일 때, $p$가 $q$이기 위한 충분조건이 되도록 하는 모든 정수 $a$의 값의 합을 구하시오.", "key": "T07-10"}, "x07x68-058": {"id": "x07x68-058", "unit": "07", "theme": "10", "벌": "X07x68", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "세 조건 $p$, $q$, $r$의 진리집합을 각각 $P$, $Q$, $R$라 하면<br>$P=\\left\\{x\\,\\left|\\,a{\\le }x{\\le }6\\right\\}\\right.$, $Q=\\{x\\,\\left|\\,1{\\le }x{\\le }5\\right\\}$, $R=\\{x\\,\\left|\\,b{\\le }x{\\le }4\\right\\}$<br>$p$가 $q$이기 위한 필요조건이려면 $q\\,\\rightarrow \\,p$에서<br>$Q{\\subset }P\\cdots \\cdots $㉠<br>$r$가 $q$이기 위한 충분조건이려면 $r\\,\\rightarrow \\,q$에서<br>$R{\\subset }Q\\cdots \\cdots $㉡<br>$R{\\subset }Q{\\subset }P$가 되도록 세 집합 $P$, $Q$, $R$를 수직선 위에 나타내면<br>즉, $a$, $b$의 값의 범위는<br>$a{\\le }1$, $1{\\le }b{\\le }4$<br>따라서 $a$의 최댓값은 $1$, $b$의 최솟값은 $1$이므로 그 합은<br>$1+1=2$", "k": "num", "a": "2", "q": "세 조건 $p$, $q$, $r$가<br> $p\\,:\\,a{\\le }x{\\le }6$, $q\\,:\\,1{\\le }x{\\le }5$, $r\\,:\\,b{\\le }x{\\le }4$<br>일 때, $p$가 $q$이기 위한 필요조건, $r$가 $q$이기 위한 충분조건이 되도록 하는 상수 $a$의 최댓값과 상수 $b$의 최솟값의 합을 구하시오.", "key": "T07-10"}, "x07x68-059": {"id": "x07x68-059", "unit": "07", "theme": "10", "벌": "X07x68", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "$p\\,:\\,x^{2}+ax-3\\ne 0$, $q\\,:\\,x-1\\ne 0$이라 하자.<br>$p$가 $q$이기 위한 충분조건이려면 $p\\,\\rightarrow \\,q$<br>참인 명제의 대우는 참이므로 $\\sim q\\,\\rightarrow \\,\\sim p$<br>즉, $x-1=0$이면 $x^{2}+ax-3=0$이므로<br>$1+a-3=0$<br>$\\therefore \\;a=2$", "k": "num", "a": "2", "q": "$x^{2}+ax-3\\ne 0$이 $x-1\\ne 0$이기 위한 충분조건이 되도록 하는 상수 $a$의 값을 구하시오.", "key": "T07-10"}, "x07x68-060": {"id": "x07x68-060", "unit": "07", "theme": "10", "벌": "X07x68", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "세 조건 $p$, $q$, $r$의 진리집합을 각각 $P$, $Q$, $R$라 하면<br>$P=\\left\\{x\\,\\left|\\,-1\\le x\\le \\right.1\\right\\}$ 또는 $x>3\\}$,<br>$Q=\\{x\\,\\left|\\,x>a\\right\\}$,<br>$R=\\{x\\,\\left|\\,x{\\ge }b\\right\\}$<br>$q$가 $p$이기 위한 필요조건이려면 $p\\,\\rightarrow \\,q$에서<br>$P{\\subset }Q$<br>$r$가 $p$이기 위한 충분조건이려면 $r\\,\\rightarrow \\,p$에서<br>$R{\\subset }P$<br>$\\therefore \\;R{\\subset }P{\\subset }Q$<br>세 집합 $P$, $Q$, $R$를 수직선 위에 나타내면<br>위의 그림에서 $a<-1$, $b>3$<br>따라서 정수 $a$의 최댓값은 $-2$, 정수 $b$의 최솟값은 $4$이므로 그 합은<br>$-2+4=2$", "k": "num", "a": "2", "q": "세 조건 $p$, $q$, $r$가<br> $p\\,:\\,-1\\le {x}\\le 1$ 또는 $x>3$<br> $q\\,:\\,x>a$<br> $r\\,:\\,x{\\ge }b$<br>일 대, $q$가 $p$이기 위한 필요조건, $r$가 $p$이기 위한 충분조건이 되도록 하는 정수 $a$의 최댓값과 정수 $b$의 최솟값의 합을 구하시오.", "key": "T07-10"}, "x07x68-061": {"id": "x07x68-061", "unit": "07", "theme": "10", "벌": "X07x68", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "$p$가 $q$이기 위한 필요충분조건이려면 $p\\,\\leftrightarrow \\,q$<br>즉, 이차방정식 $(x-1)^{2}=a$의 두 근이 $x=3$ 또는 $x=b$<br>이어야 하므로 $(x-1)^{2}=a$에 $x=3$을 대입하면 $a=4$<br>$(x-1)^{2}=4$에서 $x-1=\\pm 2$<br>$\\therefore \\;x=3$ 또는 $x=-1$<br>$\\therefore \\;b=-1$<br>$\\therefore \\;ab=4\\times (-1)=-4$", "k": "num", "a": "-4", "q": "두 조건 $p$, $q$가<br> $p\\,:\\,(x-1)^{2}=a$, $q\\,:\\,x=3$ 또는 $x=b$<br>일 때, $p$가 $q$이기 위한 필요충분조건이 되도록 하는 상수 $a$, $b$에 대하여 $ab$의 값을 구하시오.", "key": "T07-10"}, "x07x39-022": {"id": "x07x39-022", "unit": "07", "theme": "11", "벌": "X07x39", "lvl": 1, "fix": true, "src": "문제집 고쟁이", "w": "명제와 그 대우는 참, 거짓이 일치한다.<br>따라서 주어진 명제 대신 그 대우인<br>④ ‘두 자연수 $m,\\;n$에 대하여 $m,\\;n$이 모두 짝수이면 $m+n$이 짝수이다.’<br>를 증명하면 된다.", "k": "c5", "c": ["두 자연수 $m,\\;n$에 대하여 $m+n$이 짝수이면 $m$ 또는 $n$이 짝수이다.", "두 자연수 $m,\\;n$에 대하여 $m+n$이 짝수이면 $m,\\;n$이 모두  짝수이다.", "두 자연수 $m,\\;n$에 대하여 $m$ 또는 $n$이 홀수이면 $m+n$이 홀수이다.", "두 자연수 $m,\\;n$에 대하여 $m,\\;n$이 모두 짝수이면 $m+n$이 짝수이다.", "두 자연수 $m,\\;n$에 대하여 $m,\\;n$이 모두 홀수이면 $m+n$이 홀수이다."], "a": "두 자연수 $m,\\;n$에 대하여 $m,\\;n$이 모두 짝수이면 $m+n$이 짝수이다.", "q": "명제 ‘두 자연수 $m,\\;n$에 대하여 $m+n$이 홀수이면 $m$ 또는 $n$이 홀수이다.’가 참임을 증명하기 위해 대신 참임을 증명할 수 있는 명제는?", "key": "T07-11"}, "x07x47-050": {"id": "x07x47-050", "unit": "07", "theme": "11", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "주어진 명제의 대우 ‘자연수 $a,\\;b$에 대하여 $a,\\;b$가 모두 홀수이거나 모두 짝수이면 $a^{2}+b^{2}$은 ${\\boxed{\\,(가)\\,짝수\\,}}$이다.’가 참임을 보이면 된다.<br>(ⅰ) $a,\\;b$가 모두 홀수일 때,<br>$a=2k-1,\\;b=2l-1$($k,\\;l$은 자연수)이라 하면<br>$a^{2}+b^{2}=(2k-1)^{2}+(2l-1)^{2}$<br>     $=2({\\boxed{\\,(나)\\,2k^{2}-2k+2l^{2}-2l+1\\,}})$<br>이때 ${\\boxed{\\,(나)\\,2k^{2}-2k+2l^{2}-2l+1\\,}}$은 자연수이므로 $a^{2}+b^{2}$은 ${\\boxed{\\,(가)\\,짝수\\,}}$이다.<br>(ⅱ) $a,\\;b$가 모두 짝수일 때,<br>$a=2k,\\;b=2l$($k,\\;l$은 자연수)이라 하면<br>$a^{2}+b^{2}=(2k)^{2}+(2l)^{2}=2({\\boxed{\\,(다)\\,2k^{2}+2l^{2}\\,}})$<br>이때 ${\\boxed{\\,(다)\\,2k^{2}+2l^{2}\\,}}$은 자연수이므로 $a^{2}+b^{2}$은 ${\\boxed{\\,(가)\\,짝수\\,}}$이다.<br>(ⅰ), (ⅱ)에서 주어진 명제의 대우가 참이므로 주어진 명제도 참이다.", "k": "c5", "c": ["(가) 홀수      (나) $k^{2}-k+l^{2}-l+1$ (다) $k^{2}+l^{2}$", "(가) 홀수      (나) $2k^{2}-2k+2l^{2}-2l+1$ (다) $2k^{2}+2l^{2}$", "(가) 짝수      (나) $k^{2}-k+l^{2}-l+1$ (다) $k^{2}+l^{2}$", "(가) 짝수      (나) $2k^{2}-2k+2l^{2}-2l+1$ (다) $k^{2}+l^{2}$", "(가) 짝수      (나) $2k^{2}-2k+2l^{2}-2l+1$ (다) $2k^{2}+2l^{2}$"], "a": "(가) 짝수      (나) $2k^{2}-2k+2l^{2}-2l+1$ (다) $2k^{2}+2l^{2}$", "q": "다음은 명제 ‘자연수 $a,\\;b$에 대하여 $a^{2}+b^{2}$이 홀수이면 $a,\\;b$ 중에서 하나는 홀수이고 다른 하나는 짝수이다.’가 참임을 대우를 이용하여 증명하는 과정이다. 이때 (가), (나), (다)에 들어갈 알맞은 것은?<br>주어진 명제의 대우 ‘자연수 $a,\\;b$에 대하여 $a,\\;b$가 모두 홀수이거나 모두 짝수이면 $a^{2}+b^{2}$은 ${\\boxed{\\,(가)\\,}}$이다.’가 참임을 보이면 된다.(ⅰ) $a,\\;b$가 모두 홀수일 때,<br>$a=2k-1,\\;b=2l-1$($k,\\;l$은 자연수)이라 하면<br>$a^{2}+b^{2}=(2k-1)^{2}+(2l-1)^{2}=2({\\boxed{\\,(나)\\,}})$<br>이때 ${\\boxed{\\,(나)\\,}}$은 자연수이므로 $a^{2}+b^{2}$은 ${\\boxed{\\,(가)\\,}}$이다.(ⅱ) $a,\\;b$가 모두 짝수일 때,<br>$a=2k,\\;b=2l$($k,\\;l$은 자연수)이라 하면<br>$a^{2}+b^{2}=(2k)^{2}+(2l)^{2}=2({\\boxed{\\,(다)\\,}})$<br>이때 ${\\boxed{\\,(다)\\,}}$은 자연수이므로 $a^{2}+b^{2}$은 ${\\boxed{\\,(가)\\,}}$이다.(ⅰ), (ⅱ)에서 주어진 명제의 대우가 참이므로 주어진 명제도 참이다.", "key": "T07-11"}, "x07x47-052": {"id": "x07x47-052", "unit": "07", "theme": "11", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "주어진 명제의 결론을 부정하여 $\\sqrt{3}$이 ${\\boxed{\\,(가)\\,유리수\\,}}$라 가정하면<br>$\\sqrt{3}=\\dfrac{n}{m}$ ($m,\\;n$은 서로소인 자연수)  $\\cdots \\cdots $ ㉠<br>으로 나타낼 수 있다.<br>㉠의 양변을 제곱하면<br>$3=\\dfrac{n^{2}}{m^{2}}\\therefore \\;n^{2}={\\boxed{\\,(나)\\,3m^{2}\\,}}\\cdots \\cdots $ ㉡<br>이때 $n^{2}$이 $3$의 배수이므로 $n$도 $3$의 배수이다.<br>$n$이 $3$의 배수이면 $n=3k$($k$는 자연수)로 나타낼 수 있으므로 ㉡에 대입하면<br>$9k^{2}=3m^{2}\\therefore \\;m^{2}={\\boxed{\\,(다)\\,3k^{2}\\,}}$<br>이때 $m^{2}$이 $3$의 배수이므로 $m$도 $3$의 배수이다.<br>그런데 $m,\\;n$이 모두 $3$의 배수이면 $m,\\;n$이 서로소라는 가정에 모순이다.<br>따라서 $\\sqrt{3}$은 무리수이다.", "k": "c5", "c": ["(가) 유리수 (나) $3m^{2}$ (다) $9k^{2}$", "(가) 유리수 (나) $3m^{2}$ (다) $3k^{2}$", "(가) 유리수 (나) $m^{2}$ (다) $k^{2}$", "(가) 무리수 (나) $3m^{2}$ (다) $3k^{2}$", "(가) 무리수 (나) $m^{2}$ (다) $k^{2}$"], "a": "(가) 유리수 (나) $3m^{2}$ (다) $3k^{2}$", "q": "다음은 명제 ‘$\\sqrt{3}$은 무리수이다.’가 참임을 귀류법을 이용하여 증명하는 과정이다. 이때 (가), (나), (다)에 들어갈 알맞은 것은?<br>주어진 명제의 결론을 부정하여 $\\sqrt{3}$이 ${\\boxed{\\,(가)\\,}}$라 가정하면$\\sqrt{3}=\\dfrac{n}{m}$($m,\\;n$은 서로소인 자연수) $\\cdots \\cdots $ ㉠으로 나타낼 수 있다.㉠의 양변을 제곱하면$3=\\dfrac{n^{2}}{m^{2}}\\therefore \\;n^{2}={\\boxed{\\,(나)\\,}}\\cdots \\cdots $ ㉡이때 $n^{2}$이 $3$의 배수이므로 $n$도 $3$의 배수이다.$n$이 $3$의 배수이면 $n=3k$ ($k$는 자연수)로 나타낼 수 있으므로 ㉡에 대입하면$m^{2}={\\boxed{\\,(다)\\,}}$이때 $m^{2}$이 $3$의 배수이므로 $m$도 $3$의 배수이다.그런데 $m,\\;n$이 모두 $3$의 배수이면 $m,\\;n$이 서로소라는 가정에 모순이다.따라서 $\\sqrt{3}$은 무리수이다.", "key": "T07-11"}, "x07x39-029": {"id": "x07x39-029", "unit": "07", "theme": "12", "벌": "X07x39", "lvl": 1, "fix": true, "src": "문제집 고쟁이", "w": "$x>0$, $y>0$이므로 $xy>0$이다.<br>산술평균과 기하평균의 관계에 의하여<br>$\\left(2x+\\dfrac{3}{y}\\right)\\left(2y+\\dfrac{3}{x}\\right)=4xy+6+6+\\dfrac{9}{xy}$<br>$=4xy+\\dfrac{9}{xy}+12$<br>$\\ge 2\\sqrt{4xy\\times \\dfrac{9}{xy}}+12=24$<br>(단, 등호는 $4xy=\\dfrac{9}{xy}$, 즉 $xy=\\dfrac{3}{2}$일 때 성립한다.<br>따라서 $\\left(2x+\\dfrac{3}{y}\\right)\\left(2y+\\dfrac{3}{x}\\right)$의 최솟값은 $24$이다.<br>[TIP]<br>$4xy=\\dfrac{9}{xy}$에서 $(2xy)^{2}=3^{2}$이므로 $xy=\\dfrac{3}{2}$이다. $(\\because \\,xy>0)$", "k": "c5", "c": ["$20$", "$22$", "$24$", "$26$", "$28$"], "a": "$24$", "q": "두 양수 $x$, $y$에 대하여 $\\left(2x+\\dfrac{3}{y}\\right)\\left(2y+\\dfrac{3}{x}\\right)$의 최솟값은?", "key": "T07-12"}, "x07x39-030": {"id": "x07x39-030", "unit": "07", "theme": "12", "벌": "X07x39", "lvl": 1, "fix": true, "src": "문제집 고쟁이", "w": "$a>0$, $b>0$이므로 산술평균과 기하평균의 관계에 의하여<br>$(a+b)\\left(\\dfrac{1}{a}+\\dfrac{1}{b}\\right)=1+\\dfrac{4a}{b}+\\dfrac{b}{a}+4$<br>$\\ge 5+2\\sqrt{\\dfrac{4a}{b}\\times \\dfrac{b}{a}}=9$<br>(단, 등호는 $\\dfrac{4a}{b}=\\dfrac{b}{a}$, 즉, $2a=b$일 때 성립한다.)<br>따라서 $(a+b)\\left(\\dfrac{1}{a}+\\dfrac{4}{b}\\right)$의 최솟값은 $9$이다.<br>[TIP]<br>$\\dfrac{4a}{b}=\\dfrac{b}{a}$에서 $4a^{2}=b^{2}$이므로 $b=2a$ 또는 $b=-2a$이다.<br>이때 $a>0$, $b>0$이므로 $2a=b$이다.", "k": "c5", "c": ["$5$", "$6$", "$7$", "$8$", "$9$"], "a": "$9$", "q": "$a>0$, $b>0$일 때, $(a+b)\\left(\\dfrac{1}{a}+\\dfrac{4}{b}\\right)$의 최솟값은?", "key": "T07-12"}, "x07x39-033": {"id": "x07x39-033", "unit": "07", "theme": "12", "벌": "X07x39", "lvl": 1, "fix": true, "src": "문제집 고쟁이", "w": "$a^{2}+b^{2}=5$이므로 코시-슈바르츠의 부등식에 의하여<br>$(1^{2}+2^{2})(a^{2}+b^{2})\\ge (a+2b)^{2}$<br>$5\\times 5\\ge (a+2b)^{2}$ (단, 등호는 $2a=b$일 때 성립한다.)<br>$-5\\le a+2b\\le 5$<br>따라서 $a+2b$의 최댓값은 $M=5$, 최솟값은 $m=-5$이므로<br>$M-m=5-(-5)=10$<br>[TIP]<br>양수 $k$에 대하여 $x$에 대한 부등식 $x^{2}\\le k^{2}$의 해는<br>$x^{2}-k^{2}=(x+k)(x-k)\\le 0$에서 $-k\\le x\\le k$이다.<br>따라서 $(a+2b)^{2}\\le 5^{2}$에서 $-5\\le a+2b\\le 5$이다.", "k": "c5", "c": ["$5$", "$5\\sqrt{2}$", "$10$", "$10\\sqrt{2}$", "$20$"], "a": "$10$", "q": " +c$일 때 성립$\\left.\\begin{matrix}\\end{matrix}\\right)$<br>따라서 구하는 최솟값은 $9$이다.", "k": "num", "a": "9", "q": "$a>0,\\;b>0,\\;c>0$일 때, $(a+3b+c)\\left(\\dfrac{1}{a}+\\dfrac{4}{3b+c}\\right)$의 최솟값을 구하시오.", "key": "T07-12"}, "x07x30-113": {"id": "x07x30-113", "unit": "07", "theme": "12", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$A-B=(ab-1)^{2}-(a^{2}-1)(b^{2}-1)$<br>$=a^{2}b^{2}-2ab+1-(a^{2}b^{2}-a^{2}-b^{2}+1)$<br>$=a^{2}-2ab+b^{2}$<br>$=(a-b)^{2}$<br>$a,\\;b$가 실수이므로 $(a-b)^{2}\\ge 0$<br>$\\therefore A\\ge B$ (단, 등호는 $a=b$일 때 성립)", "k": "c5", "c": ["$A>B$", "$A\\ge B$", "$A<B$", "$A\\le B$", "$A=B$"], "a": "$A\\ge B$", "q": "$a,\\;b$가 실수일 때, 두 수<br> $A=(ab-1)^{2}$, $B=(a^{2}-1)(b^{2}-1)$<br>의 대소 관계는?", "key": "T07-12"}, "x07x30-115": {"id": "x07x30-115", "unit": "07", "theme": "12", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$(|\\,a\\,|+|\\,b\\,|)^{2}-|\\,a+b\\,|^{2}$<br>$=(|\\,a\\,|^{2}+2|\\,a\\,||\\,b\\,|+|\\,b\\,|^{2})-(a+b)^{2}$<br>$=(a^{2}+2|\\,ab\\,|+b^{2})-(a^{2}+2ab+b^{2})$<br>$=2(\\,{\\boxed{\\,|\\,ab\\,|-ab\\,}}\\,)\\ge 0$ ($\\because |\\,ab\\,|geab$)<br>$\\therefore (|\\,a\\,|+|\\,b\\,|)^{2}\\ge |\\,a+b\\,|^{2}$<br>그런데 $|\\,a\\,|+|\\,b\\,|\\ge 0$, $|\\,a+b\\,|\\ge 0$이므로<br>$|\\,a\\,|+|\\,b\\,|\\ge |\\,a+b\\,|$<br>(단, 등호는 $|\\,ab\\,|=ab$, 즉 ${\\boxed{\\,ab\\ge 0\\,}}$일 때 성립)<br>$\\therefore $<br>(가) $|\\,ab\\,|-ab$<br>(나) $ab\\ge 0$", "k": "c5", "c": ["$|\\,ab\\,|+ab$, $ab\\le 0$", "$|\\,ab\\,|+ab$, $ab\\ge 0$", "$|\\,ab\\,|-ab$, $ab\\le 0$", "$|\\,ab\\,|-ab$, $ab\\ge 0$", "$|\\,ab\\,|-ab$, $ab=0$"], "a": "$|\\,ab\\,|-ab$, $ab\\ge 0$", "q": "다음은 두 실수 $a,\\;b$에 대하여 부등식 $|\\,a\\,|+|\\,b\\,|\\ge |\\,a+b\\,|$가 성립함을 증명하는 과정이다.<br>[증명] $(|\\,a\\,|+|\\,b\\,|)^{2}-|\\,a+b\\,|^{2}=2(\\boxed{\\;(가)\\;})\\ge 0\\therefore (|\\,a\\,|+|\\,b\\,|)^{2}\\ge |\\,a+b\\,|^{2}$그런데 $|\\,a\\,|+|\\,b\\,|\\ge 0$, $|\\,a+b\\,|\\ge 0$이므로 $|\\,a\\,|+|\\,b\\,|\\ge |\\,a+b\\,|$ (단, 등호는 $\\boxed{\\;(나)\\;}$일 때 성립)<br>위의 과정에서 (가), (나)에 알맞은 것을 차례대로 나열한 것은?", "key": "T07-12"}, "x07x30-117": {"id": "x07x30-117", "unit": "07", "theme": "12", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$x>0$, $y>0$에서 $xy>0$이므로 산술평균과 기하평균의 관계에 의하여<br>$\\left(x+\\dfrac{2}{y}\\right)\\left(y+\\dfrac{8}{x}\\right)=xy+8+2+\\dfrac{16}{x}y$<br>$\\ge 10+2\\sqrt{xy\\cdot \\dfrac{16}{x}y}$<br>$=10+2\\cdot 4=18$<br>등호는 $xy=\\dfrac{16}{x}y$일 때 성립하므로 $(xy)^{2}=16$에서<br>$xy=4$ ($\\because xy>0$)<br>따라서 $\\left(x+\\dfrac{2}{y}\\right)\\left(y+\\dfrac{8}{x}\\right)$은 $xy=4$일 때 최솟값 $18$을 가지므로<br>$a=4$, $b=18$<br>$\\therefore a+b=22$", "k": "c5", "c": ["$20$", "$21$", "$22$", "$23$", "$24$"], "a": "$22$", "q": "두 양수 $x,\\;y$에 대하여 $\\left(x+\\dfrac{2}{y}\\right)\\left(y+\\dfrac{8}{x}\\right)$은 $xy=a$일 때 최솟값 $b$를 갖는다. 이때 상수 $a,\\;b$에 대하여 $a+b$의 값은?", "key": "T07-12"}, "x07x30-119": {"id": "x07x30-119", "unit": "07", "theme": "12", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$a>0$, $b>0$, $c>0$이므로 산술평균과 기하평균의 관계에 의하여<br>$\\left(\\dfrac{a}{b}+\\dfrac{b}{c}\\right)\\left(\\dfrac{b}{c}+\\dfrac{c}{a}\\right)\\left(\\dfrac{c}{a}+\\dfrac{a}{b}\\right)$<br>$\\ge 2\\sqrt{\\dfrac{a}{b}\\cdot \\dfrac{b}{c}}\\cdot 2\\sqrt{\\dfrac{b}{c}\\cdot \\dfrac{c}{a}}\\cdot 2\\sqrt{\\dfrac{c}{a}\\cdot \\dfrac{a}{b}}$<br>$=8\\sqrt{\\dfrac{a}{c}}\\sqrt{\\dfrac{b}{a}}\\sqrt{\\dfrac{c}{b}}$<br>$=8$ (단, 등호는 $a=b=c$일 때 성립)<br>따라서 주어진 식의 최솟값은 $8$이다.", "k": "c5", "c": ["$2$", "$4$", "$6$", "$8$", "$10$"], "a": "$8$", "q": "$a>0$, $b>0$, $c>0$일 때, $\\left(\\dfrac{a}{b}+\\dfrac{b}{c}\\right)\\left(\\dfrac{b}{c}+\\dfrac{c}{a}\\right)\\left(\\dfrac{c}{a}+\\dfrac{a}{b}\\right)$의 최솟값은?", "key": "T07-12"}, "x07x30-123": {"id": "x07x30-123", "unit": "07", "theme": "12", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$|\\,x\\,|=x$, $x\\ne 0$에서 $x>0$, $x^{2}+1>0$이므로 산술평균과 기하평균의 관계에 의하여<br>$x+\\dfrac{1}{x}+\\dfrac{4x}{x^{2}+1}=\\dfrac{x^{2}+1}{x}+\\dfrac{4x}{x^{2}+1}$<br>$\\ge 2\\sqrt{\\dfrac{x^{2}+1}{x}\\cdot \\dfrac{4x}{x^{2}+1}}$<br>$=2\\cdot 2$<br>$=4$ (단, 등호는 $x=1$일 때 성립)<br>따라서 $x+\\dfrac{1}{x}+\\dfrac{4x}{x^{2}+1}$의 최솟값은 $4$이다.", "k": "c5", "c": ["$2$", "$2\\sqrt{2}$", "$2\\sqrt{3}$", "$4$", "$3\\sqrt{2}$"], "a": "$4$", "q": "실수 $x$에 대하여 $|\\,x\\,|=x$일 때, $x+\\dfrac{1}{x}+\\dfrac{4x}{x^{2}+1}$의 최솟값은?<br>(단, $x\\ne 0$)", "key": "T07-12"}, "x07x30-125": {"id": "x07x30-125", "unit": "07", "theme": "12", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$x>0$, $y>0$이므로 산술평균과 기하평균의 관계에 의하여<br>$2x+3y\\ge 2\\sqrt{2x\\cdot 3y}=2\\sqrt{6}xy$<br>그런데 $2x+3y=6$이므로<br>$6\\ge 2\\sqrt{6xy}$, $3\\ge \\sqrt{6xy}$<br>위의 식의 양변을 제곱하면 $9\\ge 6xy$<br>$\\therefore xy\\le \\dfrac{3}{2}$<br>이때 등호는 $2x=3y$일 때 성립하고 $2x+3y=6$이므로<br>$2x=3$, $3y=3\\therefore x=\\dfrac{3}{2}$, $y=1$<br>따라서 $xy$는 $x=\\dfrac{3}{2}$, $y=1$일 때 최댓값 $\\dfrac{3}{2}$을 가지므로<br>$\\alpha =\\dfrac{3}{2}$, $\\beta =\\dfrac{3}{2}$, $\\gamma =1$<br>$\\therefore \\alpha +\\beta +\\gamma =4$", "k": "c5", "c": ["$2$", "$4$", "$6$", "$8$", "$10$"], "a": "$4$", "q": "두 양수 $x,\\;y$에 대하여 $2x+3y=6$일 때, $xy$의 최댓값을 $\\alpha $, 그때의 $x,\\;y$의 값을 각각 $\\beta ,\\;\\gamma $라 하자. 이때 $\\alpha +\\beta +\\gamma $의 값은?", "key": "T07-12"}, "x07x30-128": {"id": "x07x30-128", "unit": "07", "theme": "12", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$x^{2}>0$, $y^{2}>0$이므로 산술평균과 기하평균의 관계에 의하여 $4x^{2}+9y^{2}\\ge 2\\sqrt{4x^{2}\\cdot 9y^{2}}=12|\\,xy\\,|$<br>그런데 $4x^{2}+9y^{2}=48$이므로<br>$48\\ge 12|\\,xy\\,|$, $|\\,xy\\,|\\le 4$<br>$\\therefore -4\\le xy<0$ 또는 $0<xy\\le 4$<br>(단, 등호는 $2|\\,x\\,|=3|\\,y\\,|$일 때 성립)<br>따라서 $xy$의 최댓값은 $4$ 최솟값은 $-4$이므로 구하는 곱은<br>$4\\cdot (-4)=-16$", "k": "num", "a": "-16", "q": "$0$이 아닌 두 실수 $x,\\;y$에 대하여 $4x^{2}+9y^{2}=48$일 때, $xy$의 최댓값과 최솟값의 곱을 구하시오.", "key": "T07-12"}, "x07x30-129": {"id": "x07x30-129", "unit": "07", "theme": "12", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "두 직선 $y=\\dfrac{a}{3}x+2$, $y=\\dfrac{1}{b}x-5$가 평행하므로<br>$\\dfrac{a}{3}=\\dfrac{1}{b}\\therefore ab=3$<br>$\\therefore (a+1)(b+3)=ab+3a+b+3=6+3a+b$<br>$a>0$, $b>0$이므로 산술평균과 기하평균의 관계에 의하여<br>$6+3a+b\\ge 6+2\\sqrt{3}ab$<br>그런데 $ab=3$이므로<br>$6+3a+b\\ge 6+2\\sqrt{3\\cdot 3}=12$ (단, 등호는 $3a=b$일 때 성립)<br>따라서 $(a+1)(b+3)$의 최솟값은 $12$이다.", "k": "c5", "c": ["$11$", "$12$", "$13$", "$14$", "$15$"], "a": "$12$", "q": "두 양수 $a,\\;b$에 대하여 두 직선 $y=\\dfrac{a}{3}x+2$, $y=\\dfrac{1}{b}x-5$가 평행할 때, $(a+1)(b+3)$의 최솟값은?", "key": "T07-12"}, "x07x30-136": {"id": "x07x30-136", "unit": "07", "theme": "12", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$x$, $y$, $z$가 실수이므로 코시-슈바르츠 부등식에 의하여<br>$\\left\\{1^{2}+(-2)^{2}+3^{2}\\right\\}(x^{2}+y^{2}+z^{2})\\ge (x-2y+3z)^{2}$<br>그런데 $x^{2}+y^{2}+z^{2}=2$이므로<br>$28\\ge (x-2y+3z)^{2}$<br>$\\therefore \\;-2\\sqrt{7}\\le x-2y+3z\\le 2\\sqrt{7}$<br>$(\\begin{matrix}\\end{matrix}$단, 등호는 $x=-\\dfrac{y}{2}=\\dfrac{z}{3}$일 때 성립$\\left.\\begin{matrix}\\end{matrix}\\right)$<br>따라서 $x-2y+3z$의 최솟값은 $-2\\sqrt{7}$이다.", "k": "c5", "c": ["$-2\\sqrt{7}$", "$-5$", "$-2\\sqrt{5}$", "$-4$", "$-2\\sqrt{3}$"], "a": "$-2\\sqrt{7}$", "q": "세 실수 $x$, $y$, $z$에 대하여 $x^{2}+y^{2}+z^{2}=2$일 때, $x-2y+3z$의 최솟값은?", "key": "T07-12"}, "x07x30-137": {"id": "x07x30-137", "unit": "07", "theme": "12", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$x$, $y$가 실수이므로 코시-슈바르츠 부등식에 의하여<br>$(3^{2}+1^{2})(x^{2}+y^{2})\\ge (3x+y)^{2}$<br>그런데 $x^{2}+y^{2}=a$이므로<br>$10a\\ge (3x+y)^{2}$<br>$\\therefore \\;-\\sqrt{10a}\\le 3x+y\\le \\sqrt{10a}(\\begin{matrix}\\end{matrix}$단, 등호는 $\\dfrac{x}{3}=y$일 때 성립$\\left.\\begin{matrix}\\end{matrix}\\right)$<br>따라서 $3x+y$의 최댓값은 $\\sqrt{10a}$, 최솟값은 $-\\sqrt{10a}$이고 그 차가 $20$이므로 $2\\sqrt{10a}=20$, $10a=100\\therefore \\;a=10$", "k": "num", "a": "10", "q": "$x^{2}+y^{2}=a$를 만족시키는 두 실수 $x$, $y$에 대하여 $3x+y$의 최댓값과 최솟값의 차가 $20$일 때, 양수 $a$의 값을 구하시오.", "key": "T07-12"}, "x07x30-139": {"id": "x07x30-139", "unit": "07", "theme": "12", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$x$, $y$가 실수이므로 코시-슈바르츠 부등식에 의하여<br>$(3^{2}+4^{2})(x^{2}+y^{2})\\ge (3x+4y)^{2}$<br>그런데 $3x+4y=5$이므로<br>$25(x^{2}+y^{2})\\ge 25$<br>$\\therefore \\;x^{2}+y^{2}\\ge 1(\\begin{matrix}\\end{matrix}$단, 등호는 $\\dfrac{x}{3}=\\dfrac{y}{4}$일 때 성립$\\left.\\begin{matrix}\\end{matrix}\\right)$<br>따라서 $x^{2}+y^{2}$의 최솟값은 $1$이다.", "k": "c5", "c": ["$1$", "$2$", "$3$", "$4$", "$5$"], "a": "$1$", "q": "두 실수 $x$, $y$에 대하여 $3x+4y=5$일 때, $x^{2}+y^{2}$의 최솟값은?", "key": "T07-12"}, "x07x30-140": {"id": "x07x30-140", "unit": "07", "theme": "12", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$a$, $b$가 실수이므로 코시-슈바르츠 부등식에 의하여<br>$\\left\\{\\left(\\dfrac{1}{2}\\right)^{2}+\\left(\\dfrac{1}{3}\\right)^{2}\\right\\}(a^{2}+b^{2})\\ge \\left(\\dfrac{a}{2}+\\dfrac{b}{3}\\right)^{2}$<br>그런데 $\\dfrac{a}{2}+\\dfrac{b}{3}=\\sqrt{13}$이므로<br>$\\dfrac{13}{36}(a^{2}+b^{2})\\ge 13$<br>$\\therefore \\;a^{2}+b^{2}\\ge 36$ (단, 등호는 $2a=3b$일 때 성립)<br>따라서 $a^{2}+b^{2}$의 최솟값은 $36$이다.", "k": "num", "a": "36", "q": "두 실수 $a$, $b$에 대하여 $\\dfrac{a}{2}+\\dfrac{b}{3}=\\sqrt{13}$일 때, $a^{2}+b^{2}$의 최솟값을 구하시오.", "key": "T07-12"}, "x07x30-141": {"id": "x07x30-141", "unit": "07", "theme": "12", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "ㄱ. $x>0$, $y>0$이므로 산술평균과 기하평균의 관계에 의하여<br>$x+y\\ge 2\\sqrt{xy}$<br>그런데 $x+y=9$이므로 $9\\ge 2\\sqrt{xy}$<br>$\\therefore \\;\\sqrt{xy}\\le \\dfrac{9}{2}$ (단, 등호는 $x=y$일 때 성립)<br>ㄴ. $x$, $y$가 실수이므로 코시-슈바르츠 부등식에 의하여<br>$(1^{2}+1^{2})(x^{2}+y^{2})\\ge (x+y)^{2}$<br>그런데 $x+y=9$이므로<br>$2(x^{2}+y^{2})\\ge 81$<br>$\\therefore \\;x^{2}+y^{2}\\ge \\dfrac{81}{2}$(단, 등호는 $x=y$일 때 성립)<br>ㄷ. $\\sqrt{x}$, $\\sqrt{y}$가 실수이므로 코시-슈바르츠 부등식에 의하여<br>$(1^{2}+1^{2})\\left\\{\\left(\\sqrt{x}\\right)^{2}+\\left(\\sqrt{y}\\right)^{2}\\right\\}\\ge \\left(\\sqrt{x}+\\sqrt{y}\\right)^{2}$<br>그런데 $x+y=9$이므로<br>$2\\cdot 9\\ge \\left(\\sqrt{x}+\\sqrt{y}\\right)^{2}$<br>이때 $x>0$, $y>0$이므로<br>$0<\\sqrt{x}+\\sqrt{y}\\le 3\\sqrt{2}$ (단, 등호는 $\\sqrt{x}=\\sqrt{y}$일 때 성립)<br>이상에서 옳은 것은 ㄴ, ㄷ이다.", "k": "c5", "c": ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "a": "ㄴ, ㄷ", "q": "두 양수 $x$, $y$에 대하여 $x+y=9$일 때, 옳은 것만을 <보기>에서 있는 대로 고른 것은?<br><b><보기><\/b><br>ㄱ. $\\sqrt{xy}\\le \\dfrac{9}{4}$       <br>ㄴ. $x^{2}+y^{2}\\ge \\dfrac{81}{2}$<br>ㄷ. $0<\\sqrt{x}+\\sqrt{y}\\le 3\\sqrt{2}$", "key": "T07-12"}, "x07x39-069": {"id": "x07x39-069", "unit": "07", "theme": "12", "벌": "X07x39", "lvl": 2, "fix": true, "src": "문제집 고쟁이", "w": "주어진 부등식 $5x^{2}+4y^{2}+9\\ge 4x(y-3)$에서<br>$5x^{2}+4y^{2}+9-4xy+12x\\ge 0$임을 보이면 된다.<br>$5x^{2}+4y^{2}+9-4xy+12x$<br>$=(x^{2}-4xy+4y^{2})+(4x^{2}+12x+9)$<br>$=(x-2y)^{2}+(2x+3)^{2}$<br>이고, $(x-2y)^{2}\\ge 0,\\;(2x+3)^{2}\\ge 0$이므로<br>$(x-2y)^{2}+(2x+3)^{2}\\ge 0$이다.<br>따라서 두 실수 $x$, $y$에 대하여 부등식<br>$5x^{2}+4y^{2}+9\\ge 4x(y-3)(\\begin{matrix}\\end{matrix}$단, 등호는 $x=2y,\\;x=-\\dfrac{3}{2}$일 때,<br>즉 $x=\\boxed{\\,-\\dfrac{3}{2}\\,}\\,,\\;y=\\boxed{\\,-\\dfrac{3}{4}\\,}$일 때 성립한다.$\\begin{matrix}\\end{matrix})$<br>이 성립한다.<br>따라서 $f(x)=(2x+3)^{2},\\;\\alpha =-\\dfrac{3}{2},\\;\\beta =-\\dfrac{3}{4}$이다.<br>$∴\\;f(2)+12(\\alpha +\\beta )=7^{2}+12\\times \\left(-\\dfrac{9}{4}\\right)=22$", "k": "c5", "c": ["$16$", "$18$", "$20$", "$22$", "$24$"], "a": "$22$", "q": "다음은 두 실수 $x$, $y$에 대하여 부등식<br> $5x^{2}+4y^{2}+9\\ge 4x(y-3)$<br>이 성립함을 증명하는 과정이다.<br>$5x^{2}+4y^{2}+9-4xy+12x=(x-2y)^{2}+\\boxed{\\;㈎\\;}$이고, $(x-2y)^{2}\\ge 0,\\;\\boxed{\\;㈎\\;}\\,\\ge 0$이므로$(x-2y)^{2}+\\boxed{\\;㈎\\;}\\,\\ge 0$이다.따라서 두 실수 $x$, $y$에 대하여 부등식$5x^{2}+4y^{2}+9\\ge 4x(y-3)$이 성립한다.(단, 등호는 $x=\\boxed{\\;㈏\\;}$, $y=\\boxed{\\;㈐\\;}$일 때 성립한다.)<br>위의 (가)에 알맞은 식을 $f(x)$라 하고, (나), (다)에 알맞은 수를 각각 $\\alpha $, $\\beta $라 할 때, $f(2)+12(\\alpha +\\beta )$의 값은?", "key": "T07-12"}, "x07x39-070": {"id": "x07x39-070", "unit": "07", "theme": "12", "벌": "X07x39", "lvl": 2, "fix": true, "src": "문제집 고쟁이", "w": "이차방정식 $x^{2}-2\\sqrt{5}x+k=0$의 판별식을 $D$라 하면<br>$\\dfrac{D}{4}=(-\\sqrt{5})^{2}-k<0$<br>이므로 $k>5$이다.<br>$k-5>0$이므로 산술평균과 기하평균의 관계에 의하여<br>$k+5+\\dfrac{9}{k}-5=k-5+\\dfrac{9}{k}-5+10$<br>$\\ge 2\\sqrt{(k-5)\\times \\dfrac{9}{k}-t}+10=16$<br>이때 등호는 $k-5=\\dfrac{9}{k}-5$일 때 성립하므로<br>$(k-5)^{2}=9$에서 $k=8\\,(\\because \\,k>5)$<br>따라서 이차방정식 $x^{2}-2\\sqrt{5}x+k=0$이 허근을 가질 때, $k+5+\\dfrac{9}{k}-5$는 $k=8$일 때 최솟값 $16$을 가지므로 $a=8,\\;b=16$이다.<br>$\\therefore \\;a+b=8+16=24$", "k": "c5", "c": ["$18$", "$20$", "$22$", "$24$", "$26$"], "a": "$24$", "q": "이차방정식 $x^{2}-2\\sqrt{5}x+k=0$이 허근을 가질 때,<br> $k+5+\\dfrac{9}{k}-5$<br>는 $k=a$일 때, 최솟값 $b$를 갖는다. 두 상수 $a,\\;b$에 대하여 $a+b$의 값은? (단, $k$는 실수이다.)", "key": "T07-12"}, "x07x47-056": {"id": "x07x47-056", "unit": "07", "theme": "12", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "$a^{2}+b^{2}-ab=\\left({\\boxed{\\,(가)\\,a-\\dfrac{b}{2}\\,}}\\right)^{2}+\\dfrac{3}{4}b^{2}\\ge 0$<br>$\\therefore \\;a^{2}+b^{2}\\ge ab$<br>이때 등호는 $a-\\dfrac{b}{2}=0,\\;\\dfrac{3}{4}b^{2}=0,$즉 ${\\boxed{\\,(나)\\,a=b=0\\,}}$일 때 성립한다.", "k": "c5", "c": ["(가) $a-b$ (나) $a=b$", "(가) $a-b$ (나) $a=b=0$", "(가) $a-\\dfrac{b}{2}$ (나) $b=2a$", "(가) $a-\\dfrac{b}{2}$ (나) $a=b=0$", "(가) $a+\\dfrac{b}{2}$ (나) $b=-2a$"], "a": "(가) $a-\\dfrac{b}{2}$ (나) $a=b=0$", "q": "다음은 $a,\\;b$가 실수일 때, 부등식 $a^{2}+b^{2}\\ge ab$가 성립함을 증명하는 과정이다. 이때 (가), (나)에 들어갈 알맞은 것은?<br>$a^{2}+b^{2}-ab=({\\boxed{\\,(가)\\,}})^{2}+\\dfrac{3}{4}b^{2}\\ge 0\\therefore \\;a^{2}+b^{2}\\ge ab$이때 등호는 ${\\boxed{\\,(나)\\,}}$일 때 성립한다.", "key": "T07-12"}, "x07x47-059": {"id": "x07x47-059", "unit": "07", "theme": "12", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "$(|\\,a\\,|+|\\,b\\,|)^{2}-(|\\,a+b\\,|)^{2}$<br>$=a^{2}+{\\boxed{\\,(가)\\,2|\\,ab\\,|\\,}}+b^{2}-(a^{2}+2ab+b^{2})$<br>$=2({\\boxed{\\,(나)\\,|\\,ab\\,|-ab\\,}})\\ge 0\\;(\\because \\;|\\,ab\\,|\\ge ab)$<br>$\\therefore \\;(|\\,a\\,|+|\\,b\\,|)^{2}\\ge (|\\,a+b\\,|)^{2}$<br>그런데 $|\\,a\\,|+|\\,b\\,|\\ge 0,\\;|\\,a+b\\,|\\ge 0$이므로<br>$|a\\,|+|\\,b\\,|\\ge |\\,a+b\\,|$<br>이때 등호는 $|\\,ab\\,|=ab,$즉 ${\\boxed{\\,(다)\\,ab\\ge 0\\,}}$일 때 성립한다.", "k": "c5", "c": ["(가) $|\\,ab\\,|$ (나) $|\\,ab\\,|-ab$ (다) $ab\\ge 0$", "(가) $|\\,ab\\,|$ (나) $|\\,ab\\,|-2ab$ (다) $ab=0$", "(가) $2|\\,ab\\,|$ (나) $|\\,ab\\,|-ab$ (다) $a=b$", "(가) $2|\\,ab\\,|$ (나) $|\\,ab\\,|-ab$ (다) $ab\\ge 0$", "(가) $2|\\,ab\\,|$ (나) $|\\,ab\\,|-ab$ (다) $ab=0$"], "a": "(가) $2|\\,ab\\,|$ (나) $|\\,ab\\,|-ab$ (다) $ab\\ge 0$", "q": "다음은 $a,\\;b$가 실수일 때, 부등식<br> $|\\,a\\,|+|\\,b\\,|\\ge |\\,a+b\\,|$<br>가 성립함을 증명하는 과정이다. 이때 (가), (나), (다)에 들어갈 알맞은 것은?<br>$(|\\,a\\,|+|\\,b\\,|)^{2}-(|\\,a+b\\,|)^{2}=a^{2}+{\\boxed{\\,(가)\\,}}+b^{2}-(a^{2}+2ab+b^{2})=2({\\boxed{\\,(나)\\,}})\\ge 0\\;(\\because \\;|\\,ab\\,|\\ge ab)\\therefore \\;(|\\,a\\,|+|\\,b\\,|)^{2}\\ge (|a+b\\,|)^{2}$그런데 $|\\,a\\,|+|\\,b\\,|\\ge 0,\\;|\\,a+b\\,|\\ge 0$이므로$|\\,a\\,|+|\\,b\\,|\\ge |\\,a+b\\,|$이때 등호는 ${\\boxed{\\,(다)\\,}}$일 때 성립한다.", "key": "T07-12"}, "x07x47-060": {"id": "x07x47-060", "unit": "07", "theme": "13", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "$a>0,\\;b>0$이므로<br>$2a+3b\\ge 2\\sqrt{2a\\times 3b}=2\\sqrt{6ab}=2\\sqrt{36}=12$<br>(단, 등호는 $2a=3b$일 때 성립)<br>따라서 구하는 최솟값은 $12$이다.", "k": "c5", "c": ["$10$", "$12$", "$14$", "$16$", "$18$"], "a": "$12$", "q": "양수 $a,\\;b$에 대하여 $ab=6$일 때, $2a+3b$의 최솟값은?", "key": "T07-13"}, "x07x47-061": {"id": "x07x47-061", "unit": "07", "theme": "13", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "$3a>0,\\;b>0$이므로 $3a+b\\ge 2\\sqrt{3ab}$<br>$6\\ge 2\\sqrt{3ab}\\therefore \\;\\sqrt{3ab}\\le 3$<br>양변을 제곱하면 $3ab\\le 9\\therefore \\;ab\\le 3$<br>이때 $ab$는 등호가 성립할 때, 즉 $3a=b$일 때 최댓값 $3$을 갖는다.<br>$\\therefore \\;M=3$<br>$b=3a$일 때 최댓값을 가지므로 이를 $3a+b=6$에 대입하면<br>$3a+3a=6\\therefore \\;a=1$<br>이를 $b=3a$에 대입하면 $b=3$<br>$\\therefore \\;\\alpha =1,\\;\\beta =3$<br>$\\therefore \\;M+\\alpha -\\beta =3+1-3=1$", "k": "c5", "c": ["$-2$", "$-1$", "$0$", "$1$", "$2$"], "a": "$1$", "q": "$3a+b=6$을 만족시키는 양수 $a,\\;b$에 대하여 $ab$의 최댓값을 $M,$그때의 $a,\\;b$의 값을 각각 $\\alpha ,\\;\\beta $라 할 때, $M+\\alpha -\\beta $의 값은?", "key": "T07-13"}, "x07x47-063": {"id": "x07x47-063", "unit": "07", "theme": "13", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "직선 $\\dfrac{x}{a}+\\dfrac{y}{b}=1$이 점 $(2,\\;5)$를 지나므로<br>$\\dfrac{2}{a}+\\dfrac{5}{b}=1\\cdots \\cdots $ ㉠<br>$\\dfrac{2}{a}>0,\\;\\dfrac{5}{b}>0$이므로 산술평균과 기하평균의 관계에 의하여<br>$\\dfrac{2}{a}+\\dfrac{5}{b}\\ge 2\\sqrt{\\dfrac{2}{a}\\times \\dfrac{5}{b}}=\\dfrac{2\\sqrt{10}}{\\sqrt{ab}}$<br>$1\\ge \\dfrac{2\\sqrt{10}}{\\sqrt{ab}}$($\\because $㉠)<br>$\\therefore \\;\\sqrt{ab}\\ge 2\\sqrt{10}$ (단, 등호는 $5a=2b$일 때 성립)<br>양변을 제곱하면 $ab\\ge 40$<br>따라서 구하는 최솟값은 $40$이다.", "k": "num", "a": "40", "q": "직선 $\\dfrac{x}{a}+\\dfrac{y}{b}=1$이 점 $(2,\\;5)$를 지날 때, 양수 $a,\\;b$에 대하여 $ab$의 최솟값을 구하시오.", "key": "T07-13"}, "x07x68-099": {"id": "x07x68-099", "unit": "07", "theme": "13", "벌": "X07x68", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "$x>0$, $y>0$에서 $3xy>0$, $\\dfrac{3}{xy}>0$이므로 산술평균과 기하평균의 관계에 의하여<br>$\\left(3x+\\dfrac{1}{y}\\right)\\left(y+\\dfrac{3}{x}\\right)=10+3xy+\\dfrac{3}{xy}$<br>${\\ge }10+2\\sqrt{3xy\\times \\dfrac{3}{xy}}$<br>$=10+6=16$<br>(단, 등호는 $xy=1$일 때, 성립)<br>따라서 구하는 최솟값은 $16$이다.", "k": "num", "a": "16", "q": "$x>0$, $y>0$일 때, $\\left(3x+\\dfrac{1}{y}\\right)\\left(y+\\dfrac{3}{x}\\right)$의 최솟값을 구하시오.", "key": "T07-13"}, "x07x68-100": {"id": "x07x68-100", "unit": "07", "theme": "13", "벌": "X07x68", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "$x>1$에서 $x-1>0$이므로 산술평균과 기하평균의 관계에 의하여<br>$x+\\dfrac{4}{x-1}=x-1+\\dfrac{4}{x-1}+1$<br>$\\ge 2\\sqrt{(x-1)\\times \\dfrac{4}{x-1}}+1$<br>$=4+1=5$<br>$(\\begin{matrix}\\end{matrix}$단, 등호는 $x-1=\\dfrac{4}{x-1}$일 때 성립$\\begin{matrix}\\end{matrix})$<br>따라서 구하는 최솟값은 $5$이다.", "k": "num", "a": "5", "q": "$x>1$일 때, $x+\\dfrac{4}{x-1}$의 최솟값을 구하시오.", "key": "T07-13"}, "x07x68-101": {"id": "x07x68-101", "unit": "07", "theme": "13", "벌": "X07x68", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "$x>0$, $y>0$에서 $\\dfrac{9x}{y}>0$, $\\dfrac{4y}{x}>0$이므로 산술평균과 기하평균의 관계에 의하여<br>$(9x+2y)\\left(\\dfrac{2}{x}+\\dfrac{1}{y}\\right)=20+\\dfrac{9x}{y}+\\dfrac{4y}{x}$<br>$\\ge 20+2\\sqrt{\\dfrac{9x}{y}\\times \\dfrac{4y}{x}}$<br>$=20+12=32$<br>이때 $9x+2y=16$이므로<br>$16\\left(\\dfrac{2}{x}+\\dfrac{1}{y}\\right){\\ge }32$<br>$\\therefore \\;\\dfrac{2}{x}+\\dfrac{1}{y}{\\ge }2$ (단, 등호 $3x=2y$일 때 성립)<br>따라서 구하는 최솟값은 $2$이다.", "k": "num", "a": "2", "q": "양수 $x$, $y$에 대하여 $9x+2y=16$일 때, $\\dfrac{2}{x}+\\dfrac{1}{y}$의 최솟값을 구하시오.", "key": "T07-13"}, "x07x47-073": {"id": "x07x47-073", "unit": "07", "theme": "14", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "직육면체의 세 모서리의 길이를 각각 $6,\\;a,\\;b$라 하고 직육면체의 대각선의 길이를 $l$이라 하면<br>$l^{2}=6^{2}+a^{2}+b^{2}$<br>직육면체의 부피가 $108$이므로<br>$6ab=108\\therefore \\;ab=18$<br>$a>0,\\;b>0$이므로<br>$a^{2}+b^{2}\\ge 2\\sqrt{a^{2}\\times b^{2}}$<br>$=2ab=36$(단, 등호는 $a=b$일 때 성립)<br>$\\therefore \\;l^{2}=6^{2}+a^{2}+b^{2}\\ge 36+36=72$<br>$\\therefore \\;l\\ge 6\\sqrt{2}$<br>따라서 구하는 대각선의 길이의 최솟값은 $6\\sqrt{2}$이다.", "k": "c5", "c": ["$6\\sqrt{2}$", "$9$", "$7\\sqrt{2}$", "$11$", "$8\\sqrt{2}$"], "a": "$6\\sqrt{2}$", "q": "한 모서리의 길이가 $6$이고 부피가 $108$인 직육면체를 만들려고 한다. 이때 만들 수 있는 직육면체의 대각선의 길이의 최솟값은?", "key": "T07-14"}, "x07x68-094": {"id": "x07x68-094", "unit": "07", "theme": "14", "벌": "X07x68", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "$10x>0$, $8y>0$이므로 산술평균과 기하평균의 관계에 의하여<br>$10x+8y{\\ge }2\\sqrt{10x\\times 8y}=8\\sqrt{5xy}$<br>이때 $xy=5$이므로<br>$10x+8y{\\ge }8\\sqrt{25}=40$ (단, 등호는 $5x=4y$일 때 성립)<br>따라서 구하는 최솟값은 $40$이다.", "k": "num", "a": "40", "q": "양수 $x$, $y$에 대하여 $xy=5$일 때, $10x+8y$의 최솟값을 구하시오.", "key": "T07-14"}, "x07x68-095": {"id": "x07x68-095", "unit": "07", "theme": "14", "벌": "X07x68", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "$3x>0$, $2y>0$이므로 산술평균과 기하평균의 관계에 의하여<br>$3x+2y{\\ge }2\\sqrt{3x\\times 2y}=2\\sqrt{6xy}$<br>이때 $3x+2y=12$이므로<br>$12{\\ge }2\\sqrt{6xy}$<br>$\\therefore \\;\\sqrt{6xy}{\\le }6$ (단, 등호는 $3x=2y$일 때 성립)<br>양변을 제곱하면<br>$6xy{\\le }36$<br>$\\therefore \\;xy{\\le }6$<br>따라서 구하는 최댓값은 $6$이다.", "k": "num", "a": "6", "q": "양수 $x$, $y$에 대하여 $3x+2y=12$일 때, $xy$의 최댓값을 구하시오.", "key": "T07-14"}, "x07x68-096": {"id": "x07x68-096", "unit": "07", "theme": "14", "벌": "X07x68", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "$a^{2}>0$, $16b^{2}>0$이므로 산술평균과 기하평균의 관계에 의하여<br>$a^{2}+16b^{2}{\\ge }2\\sqrt{a^{2}\\times 16b^{2}}=8ab$<br>이때 $a^{2}+16b^{2}=8$이므로<br>$8{\\ge }8ab$<br>$\\therefore \\;ab{\\le }1$ (단, 등호는 $a^{2}=16b^{2}$, 즉 $a=4b$일 때 성립)<br>따라서 구하는 최댓값은 $1$이다.", "k": "num", "a": "1", "q": "양수 $a$, $b$에 대하여 $a^{2}+16b^{2}=8$일 때, $ab$의 최댓값을 구하시오.", "key": "T07-14"}, "x07x20-088": {"id": "x07x20-088", "unit": "07", "theme": "15", "벌": "X07x20", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "$a>0,\\;b>0$에서 $2a>0,\\;3b>0$이므로 산술평균과 기하평균의 관계에 의하여<br>$2a+3b\\ge 2\\sqrt{2a\\times 3b}=2\\sqrt{6ab}$<br>이때 $2a+3b=12$이므로 $12\\ge 2\\sqrt{6ab}$<br>$\\therefore \\;\\sqrt{6ab}\\le 6$<br>양변을 제곱하면 $6ab\\le 36$<br>$\\therefore \\;ab\\le 6\\therefore \\;M=6$<br>한편 등호는 $2a=3b$일 때 성립하므로 $2a+3b=12$에서<br>$2a=3b=6\\therefore \\;a=3,\\;b=2$<br>즉 $\\alpha =3,\\;\\beta =2$이므로<br>$M+\\alpha +\\beta =11$", "k": "num", "a": "11", "q": "$a>0,\\;b>0$이고 $2a+3b=12$일 때, $ab$의 최댓값을 $M,$그때의 $a,\\;b$의 값을 각각 $\\alpha ,\\;\\beta $라 하자. $M+\\alpha +\\beta $의 값을 구하시오.", "key": "T07-15"}, "x07x20-089": {"id": "x07x20-089", "unit": "07", "theme": "15", "벌": "X07x20", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "$x>0,\\;y>0$에서 $2x>0,\\;4y>0$이므로 산술평균과 기하평균의 관계에 의하여<br>$2x+4y\\ge 2\\sqrt{2x\\times 4y}=2\\sqrt{8xy}$<br>이때 $xy=4$이므로<br>$2x+4y\\ge 2\\sqrt{32}=8\\sqrt{2}$ (단, 등호는 $x=2y$일 때 성립)<br>따라서 $2x+4y$의 최솟값은 $8\\sqrt{2}$이다.", "k": "c5", "c": ["$2\\sqrt{2}$", "$4$", "$4\\sqrt{2}$", "$6$", "$8\\sqrt{2}$"], "a": "$8\\sqrt{2}$", "q": "양수 $x,\\;y$에 대하여 $xy=4$일 때, $2x+4y$의 최솟값은?", "key": "T07-15"}, "x07x20-090": {"id": "x07x20-090", "unit": "07", "theme": "15", "벌": "X07x20", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "$a\\ne 0,\\;b\\ne 0$에서 $a^{2}>0,\\;4b^{2}>0$이므로 산술평균과 기하평균의 관계에 의하여<br>$a^{2}+4b^{2}\\ge 2\\sqrt{a^{2}\\times 4b^{2}}=4|\\,ab\\,|$<br>이때 $a^{2}+4b^{2}=32$이므로 $32\\ge 4|\\,ab\\,|,|\\,ab\\,|\\le 8$<br>$\\therefore \\;-8\\le ab\\le 8$<br>  (단, 등호는 $a^{2}=4b^{2},$즉 $|\\,a\\,|=|\\,2b\\,|$일 때 성립)<br>따라서 $ab$의 최댓값은 $8,$ 최솟값은 $-8$이므로 구하는 곱은<br>$8\\times (-8)=-64$", "k": "num", "a": "-64", "q": "$0$이 아닌 실수 $a,\\;b$에 대하여 $a^{2}+4b^{2}=32$일 때, $ab$의 최댓값과 최솟값의 곱을 구하시오.", "key": "T07-15"}, "x07x20-092": {"id": "x07x20-092", "unit": "07", "theme": "15", "벌": "X07x20", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "$x>0,\\;y>0$에서 $xy>0$이므로 산술평균과 기하평균의 관계에 의하여<br>$\\left(x+\\dfrac{4}{y}\\right)\\left(4y+\\dfrac{1}{x}\\right)=4xy+1+16+\\dfrac{4}{xy}$<br>$=17+4xy+\\dfrac{4}{xy}$<br>$\\ge 17+2\\sqrt{4xy\\times \\dfrac{4}{xy}}$<br>$=17+2\\times 4=25$<br>$\\left(\\begin{matrix}\\, \\\\ \\,\\end{matrix}\\right.$단, 등호는 $4xy=\\dfrac{4}{xy},$즉 $xy=1$일 때 성립$\\left.\\begin{matrix}\\, \\\\ \\,\\end{matrix}\\right)$<br>따라서 구하는 최솟값은 $25$이다.", "k": "c5", "c": ["$21$", "$22$", "$23$", "$24$", "$25$"], "a": "$25$", "q": "양수 $x,\\;y$에 대하여 $\\left(x+\\dfrac{4}{y}\\right)\\left(4y+\\dfrac{1}{x}\\right)$의 최솟값은?", "key": "T07-15"}, "x07x20-093": {"id": "x07x20-093", "unit": "07", "theme": "15", "벌": "X07x20", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "$a>0$에서 $a^{2}>0$이므로 산술평균과 기하평균의 관계에 의하여<br>$\\left(a-\\dfrac{3}{a}\\right)\\left(3a-\\dfrac{1}{a}\\right)=3a^{2}-1-9+\\dfrac{3}{a^{2}}$<br>$=-10+3a^{2}+\\dfrac{3}{a^{2}}$<br>$\\ge -10+2\\sqrt{3a^{2}\\times \\dfrac{3}{a^{2}}}$<br>$=-10+2\\times 3=-4$<br>$\\therefore \\;m=-4$<br>한편 등호는 $3a^{2}=\\dfrac{3}{a^{2}}$일 때 성립하므로<br>$a^{4}=1\\therefore \\;a=1\\;(\\because \\;a>0)$<br>즉 $\\alpha =1$이므로 $m+\\alpha =-3$", "k": "num", "a": "-3", "q": "양수 $a$에 대하여 $\\left(a-\\dfrac{3}{a}\\right)\\left(3a-\\dfrac{1}{a}\\right)$의 최솟값을 $m,$그때의 $a$의 값을 $\\alpha $라 할 때, $m+\\alpha $의 값을 구하시오.", "key": "T07-15"}, "x07x20-100": {"id": "x07x20-100", "unit": "07", "theme": "15", "벌": "X07x20", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "$x,\\;y$가 실수이므로 코시-슈바르츠의 부등식에 의하여<br>$(1^{2}+2^{2})(x^{2}+y^{2})\\ge (x+2y)^{2}$<br>이때 $x^{2}+y^{2}=4$이므로 $20\\ge (x+2y)^{2}$<br>$\\therefore \\,-2\\sqrt{5}\\le x+2y\\le 2\\sqrt{5}$ (단, 등호는 $2x=y$일 때 성립)<br>따라서 $x+2y$의 최댓값은 $2\\sqrt{5}$이다.", "k": "c5", "c": ["$\\sqrt{5}$", "$2\\sqrt{5}$", "$3\\sqrt{5}$", "$4\\sqrt{5}$", "$5\\sqrt{5}$"], "a": "$2\\sqrt{5}$", "q": "실수 $x,\\;y$에 대하여 $x^{2}+y^{2}=4$일 때, $x+2y$의 최댓값은?", "key": "T07-15"}, "x07x20-101": {"id": "x07x20-101", "unit": "07", "theme": "15", "벌": "X07x20", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "$x,\\;y$가 실수이므로 코시-슈바르츠의 부등식에 의하여<br>$\\left\\{\\left(\\dfrac{1}{4}\\right)^{2}+\\left(\\dfrac{1}{3}\\right)^{2}\\right\\}(x^{2}+y^{2})\\ge \\left(\\dfrac{x}{4}+\\dfrac{y}{3}\\right)^{2}$<br>이때 $\\dfrac{x}{4}+\\dfrac{y}{3}=5$이므로 $\\dfrac{25}{144}(x^{2}+y^{2})\\ge 25$<br>$\\therefore \\;x^{2}+y^{2}\\ge 144$ (단, 등호는 $4x=3y$일 때 성립)<br>따라서 $x^{2}+y^{2}$의 최솟값은 $144$이다.", "k": "num", "a": "144", "q": "두 실수 $x,\\;y$에 대하여 $\\dfrac{x}{4}+\\dfrac{y}{3}=5$일 때, $x^{2}+y^{2}$의 최솟값을 구하시오.", "key": "T07-15"}, "x07x20-102": {"id": "x07x20-102", "unit": "07", "theme": "15", "벌": "X07x20", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "$x,\\;y$가 실수이므로 코시-슈바르츠의 부등식에 의하여<br>$(3^{2}+2^{2})(x^{2}+y^{2})\\ge (3x+2y)^{2}$<br>이때 $x^{2}+y^{2}=a$이므로 $13a\\ge (3x+2y)^{2}$<br>$\\therefore \\;-\\sqrt{13a}\\le 3x+2y\\le \\sqrt{13a}$ (단, 등호는 $2x=3y$일 때 성립)<br>즉 $3x+2y$의 최댓값과 최솟값이 각각 $\\sqrt{13a},\\;-\\sqrt{13a}$이므로<br>$\\sqrt{13a}-\\left(-\\sqrt{13a}\\right)=13$, $2\\sqrt{13a}=13$<br>$4\\times 13a=13^{2}\\therefore \\;a=\\dfrac{13}{4}$", "k": "num", "a": "13/4", "q": "$x^{2}+y^{2}=a$를 만족하는 실수 $x,\\;y$에 대하여 $3x+2y$의 최댓값과 최솟값의 차가 $13$일 때, 양수 $a$의 값을 구하시오.", "key": "T07-15"}, "x07x30-132": {"id": "x07x30-132", "unit": "07", "theme": "15", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$\\overline{\\mathrm{AB}}=x$, $\\overline{\\mathrm{BC}}=y$라 하면 펜스의 설치 비용은 $\\dfrac{1}{2}x+(x+2y)=\\dfrac{3}{2}x+2y$에 비례한다.<br>또 텃밭의 넓이가 $2700$이므로<br>$xy=2700\\cdots \\cdots $㉠<br>이때 $x>0$, $y>0$이므로 산술평균과 기하평균의 관계에 의하여<br>$\\dfrac{3}{2}x+2y\\ge 2\\sqrt{\\dfrac{3}{2}x\\cdot 2y}$<br>$=2\\sqrt{3}xy\\cdots \\cdots $㉡<br>㉡에서 등호는 $
