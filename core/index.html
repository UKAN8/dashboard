-078": {"id": "x07x68-078", "unit": "07", "theme": "09", "벌": "X07x68", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "주어진 규칙의 명제<br>‘카드의 한쪽 면에 홀수가 적혀있으면 다른 쪽 면에는 식물이 그려져 있다.’<br>가 참이면 그 대우인 명제<br>‘카드의 한쪽 면에 동물이 그려져 있으면 다른 쪽 면에는 짝수도 적혀 있다.’<br>도 참이다.<br>따라서 주어진 규칙에 맞는지 알아보기 위하여 다른 쪽 면을 반드시 확인할 필요가 있는 카드는 홀수가 적힌 카드와 동물이 그려진 카드이므로 $3$, 토끼, 사자이다.", "k": "c5", "c": ["$3$", "$3$, 꽃", "$3$, $6$", "$6$, 꽃", "$3$, 토끼, 사자"], "a": "$3$, 토끼, 사자", "q": "한쪽 면에는 자연수인 숫자가 적혀 있고 다른 쪽 면에는 동물 또는 식물이 그려져 있는 카드가 있다. 한쪽 면에 $3$, $6$, 토끼, 꽃, 사자가 각각 있는 $5$장의 카드가 있을 때, 다음 중 ‘카드 한쪽 면에 홀수가 적혀 있으면 다른 쪽 면에는 식물이 그려져 있다.’는 규칙에 맞는 카드인지 알아보기 위하여 다른 쪽 면을 만드시 확인할 필요가 있는 카드를 모두 고른 것은?", "key": "T07-09"}, "x07x68-081": {"id": "x07x68-081", "unit": "07", "theme": "09", "벌": "X07x68", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "$p\\,:\\,|\\,a\\,|+|\\,b\\,|=0$에서 $a=0$이고 $b=0$<br>$q\\,:a^{2}-2ab+b^{2}=0$에서 $(a-b)^{2}=0$<br>$\\therefore \\;a=b$<br>$r\\,:|\\,a+b\\,|=|\\,a-b\\,|$에서<br>$a+b=a-b$ 또는 $a+b=-(a-b)$<br>$\\therefore \\;a=0$ 또는 $b=0$<br>세 조건 $p$, $q$, $r$의 진리집합을 각각 $P$, $Q$, $R$라 하면<br>$P=\\{(a,b)\\,\\left|\\,a=0\\right\\}$이고 $\\left.b=0\\right\\}$<br>$Q=\\{(a,\\;b)\\,\\left|\\,a=b\\right\\}$<br>$R=\\{(a,\\;b)\\,\\left|\\,a=0\\right\\}$ 또는 $b=0\\}$<br>ㄱ. $P{\\subset }Q$이므로 $p\\,\\rightarrow \\,q$<br>따라서 $p$는 $q$이기 위한 충분조건이다.<br>ㄴ. $P{\\subset }R$이므로 $R^{C\\,}{\\subset }P^{C\\,}$<br>$\\therefore \\;\\sim r\\,\\rightarrow \\,\\sim p$<br>따라서 $\\sim p$는 $\\sim r$이기 위한 필요조건이다.<br>ㄷ. $Q\\cap R=\\{(a,\\;b)\\,\\left|\\,a=0\\right\\}$이고 $b=0\\}$이므로<br>$Q{\\cap }R=P$<br>$\\therefore $($q$이고 $r$)$\\leftrightarrow \\,p$<br>따라서 $q$이고 $r$는 $p$이기 위한 필요충분조건이다.<br>따라서 보기에서 옳은 것은 ㄱ, ㄴ, ㄷ이다.", "k": "c5", "c": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "a": "ㄱ, ㄴ, ㄷ", "q": "두 실수 $a$, $b$에 대하여 세 조건 $p$, $q$, $r$는<br> $p\\,:\\,|\\,a\\,|+|\\,b\\,|=0$<br> $q\\,:\\,a^{2}-2ab+b^{2}=0$<br> $r\\,:\\,|\\,a+b\\,|=|\\,a-b\\,|$<br>이다. 보기에서 옳은 것만을 있는 대로 고른 것은?<br><b><보기><\/b><br>ㄱ. $p$는 $q$이기 위한 충분조건이다.<br>ㄴ. $\\sim p$는 $\\sim r$이기 위한 필요조건이다.<br>ㄷ. $q$이고 $r$는 $p$이기 위한 필요충분조건이다.", "key": "T07-09"}, "x07x20-072": {"id": "x07x20-072", "unit": "07", "theme": "10", "벌": "X07x20", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "$x-3\\ne 0$은 $x^{2}+ax-12\\ne 0$이기 위한 필요조건이므로 명제 ‘$x^{2}+ax-12\\ne 0$이면 $x-3\\ne 0$이다.’는 참이다.<br>따라서 그 대우 ‘$x-3=0$이면 $x^{2}+ax-12=0$이다.’도 참이다.<br>$x^{2}+ax-12=0$에 $x=3$을 대입하면<br>$9+3a-12=0\\therefore \\;a=1$", "k": "num", "a": "1", "q": "$x-3\\ne 0$은 $x^{2}+ax-12\\ne 0$이기 위한 필요조건일 때, 상수 $a$의 값을 구하시오.", "key": "T07-10"}, "x07x47-042": {"id": "x07x47-042", "unit": "07", "theme": "10", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "세 조건 $p,\\;q,\\;r$의 진리집합을 각각 $P,\\;Q,\\;R$라 하자.<br>$p$가 $q$이기 위한 충분조건이려면 $p\\,\\rightarrow \\,q$에서 $P\\subset Q$<br>$p$가 $r$이기 위한 필요조건이려면 $r\\,\\rightarrow \\,p$에서 $R\\subset P$<br>$\\therefore \\;R\\subset P\\subset Q$<br>세 집합 $P,\\;Q,\\;R$를 수직선 위에 나타내면<br>$a-1\\le -5,\\;-5\\le b-1\\le 2$<br>$\\therefore \\;a\\le -4,\\;-4\\le b\\le 3$<br>따라서 $a$의 최댓값은 $-4,\\;b$의 최솟값은 $-4$이므로 그 합은<br>$-4+(-4)=-8$", "k": "num", "a": "-8", "q": "세 조건 $p,\\;q,\\;r$가<br> $p\\,:\\,-5\\le x\\le 3,$<br> $q\\,:\\,a-1\\le x\\le 7,$<br> $r\\,:\\,b-1\\le x\\le 2$<br>일 때, $p$가 $q$이기 위한 충분조건, $p$가 $r$이기 위한 필요조건이 되도록 하는 상수 $a$의 최댓값과 상수 $b$의 최솟값의 합을 구하시오.", "key": "T07-10"}, "x07x47-043": {"id": "x07x47-043", "unit": "07", "theme": "10", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "$|\\,x\\,|\\le n$에서 $-n\\le x\\le n$<br>$x^{2}+2x-8\\le 0$에서 $(x+4)(x-2)\\le 0$<br>$\\therefore \\;-4\\le x\\le 2$<br>두 조건 $p,\\;q$의 진리집합을 각각 $P,\\;Q$라 하면<br>$P=\\left\\{x\\,|\\,-n\\le x\\le n\\right\\},\\;Q=\\left\\{x\\,|\\,-4\\le x\\le 2\\right\\}$<br>$p$가 $q$이기 위한 필요조건이려면 $q\\,\\rightarrow \\,p$에서 $Q\\subset P$이어야 하므로<br>$-n\\le -4,\\;n\\ge 2\\therefore \\;n\\ge 4$<br>따라서 자연수 $n$의 최솟값은 $4$이다.", "k": "c5", "c": ["$1$", "$2$", "$3$", "$4$", "$5$"], "a": "$4$", "q": "실수 $x$에 대하여 두 조건<br> $p\\,:\\,|\\,x\\,|\\le n,$<br> $q\\,:\\,x^{2}+2x-8\\le 0$<br>에 대하여 $p$가 $q$이기 위한 필요조건이 되도록 하는 자연수 $n$의 최솟값은?", "key": "T07-10"}, "x07x47-044": {"id": "x07x47-044", "unit": "07", "theme": "10", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "두 조건 $p,\\;q$의 진리집합을 각각 $P,\\;Q$라 하자.<br>$p$가 $q$이기 위한 충분조건이려면 $p\\,\\rightarrow \\,q$에서 $P\\subset Q$<br>(ⅰ) 다음 그림에서<br>$a-2>-2,\\;a<1\\therefore \\;0<a<1$<br>(ⅱ) 다음 그림에서<br>$a-2\\ge 2,\\;a\\le 6\\therefore \\;4\\le a\\le 6$<br>(ⅰ), (ⅱ)에서 정수 $a$는 $4,\\;5,\\;6$이므로 그 합은<br>$4+5+6=15$", "k": "num", "a": "15", "q": "두 조건 $p,\\;q$가<br> $p\\,:\\,a-2\\le x\\le a,$<br> $q\\,:\\,-2<x<1$ 또는 $2\\le x\\le 6$<br>일 때, $p$가 $q$이기 위한 충분조건이 되도록 하는 모든 정수 $a$의 값의 합을 구하시오.", "key": "T07-10"}, "x07x68-058": {"id": "x07x68-058", "unit": "07", "theme": "10", "벌": "X07x68", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "세 조건 $p$, $q$, $r$의 진리집합을 각각 $P$, $Q$, $R$라 하면<br>$P=\\left\\{x\\,\\left|\\,a{\\le }x{\\le }6\\right\\}\\right.$, $Q=\\{x\\,\\left|\\,1{\\le }x{\\le }5\\right\\}$, $R=\\{x\\,\\left|\\,b{\\le }x{\\le }4\\right\\}$<br>$p$가 $q$이기 위한 필요조건이려면 $q\\,\\rightarrow \\,p$에서<br>$Q{\\subset }P\\cdots \\cdots $㉠<br>$r$가 $q$이기 위한 충분조건이려면 $r\\,\\rightarrow \\,q$에서<br>$R{\\subset }Q\\cdots \\cdots $㉡<br>$R{\\subset }Q{\\subset }P$가 되도록 세 집합 $P$, $Q$, $R$를 수직선 위에 나타내면<br>즉, $a$, $b$의 값의 범위는<br>$a{\\le }1$, $1{\\le }b{\\le }4$<br>따라서 $a$의 최댓값은 $1$, $b$의 최솟값은 $1$이므로 그 합은<br>$1+1=2$", "k": "num", "a": "2", "q": "세 조건 $p$, $q$, $r$가<br> $p\\,:\\,a{\\le }x{\\le }6$, $q\\,:\\,1{\\le }x{\\le }5$, $r\\,:\\,b{\\le }x{\\le }4$<br>일 때, $p$가 $q$이기 위한 필요조건, $r$가 $q$이기 위한 충분조건이 되도록 하는 상수 $a$의 최댓값과 상수 $b$의 최솟값의 합을 구하시오.", "key": "T07-10"}, "x07x68-059": {"id": "x07x68-059", "unit": "07", "theme": "10", "벌": "X07x68", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "$p\\,:\\,x^{2}+ax-3\\ne 0$, $q\\,:\\,x-1\\ne 0$이라 하자.<br>$p$가 $q$이기 위한 충분조건이려면 $p\\,\\rightarrow \\,q$<br>참인 명제의 대우는 참이므로 $\\sim q\\,\\rightarrow \\,\\sim p$<br>즉, $x-1=0$이면 $x^{2}+ax-3=0$이므로<br>$1+a-3=0$<br>$\\therefore \\;a=2$", "k": "num", "a": "2", "q": "$x^{2}+ax-3\\ne 0$이 $x-1\\ne 0$이기 위한 충분조건이 되도록 하는 상수 $a$의 값을 구하시오.", "key": "T07-10"}, "x07x68-060": {"id": "x07x68-060", "unit": "07", "theme": "10", "벌": "X07x68", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "세 조건 $p$, $q$, $r$의 진리집합을 각각 $P$, $Q$, $R$라 하면<br>$P=\\left\\{x\\,\\left|\\,-1\\le x\\le \\right.1\\right\\}$ 또는 $x>3\\}$,<br>$Q=\\{x\\,\\left|\\,x>a\\right\\}$,<br>$R=\\{x\\,\\left|\\,x{\\ge }b\\right\\}$<br>$q$가 $p$이기 위한 필요조건이려면 $p\\,\\rightarrow \\,q$에서<br>$P{\\subset }Q$<br>$r$가 $p$이기 위한 충분조건이려면 $r\\,\\rightarrow \\,p$에서<br>$R{\\subset }P$<br>$\\therefore \\;R{\\subset }P{\\subset }Q$<br>세 집합 $P$, $Q$, $R$를 수직선 위에 나타내면<br>위의 그림에서 $a<-1$, $b>3$<br>따라서 정수 $a$의 최댓값은 $-2$, 정수 $b$의 최솟값은 $4$이므로 그 합은<br>$-2+4=2$", "k": "num", "a": "2", "q": "세 조건 $p$, $q$, $r$가<br> $p\\,:\\,-1\\le {x}\\le 1$ 또는 $x>3$<br> $q\\,:\\,x>a$<br> $r\\,:\\,x{\\ge }b$<br>일 대, $q$가 $p$이기 위한 필요조건, $r$가 $p$이기 위한 충분조건이 되도록 하는 정수 $a$의 최댓값과 정수 $b$의 최솟값의 합을 구하시오.", "key": "T07-10"}, "x07x68-061": {"id": "x07x68-061", "unit": "07", "theme": "10", "벌": "X07x68", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "$p$가 $q$이기 위한 필요충분조건이려면 $p\\,\\leftrightarrow \\,q$<br>즉, 이차방정식 $(x-1)^{2}=a$의 두 근이 $x=3$ 또는 $x=b$<br>이어야 하므로 $(x-1)^{2}=a$에 $x=3$을 대입하면 $a=4$<br>$(x-1)^{2}=4$에서 $x-1=\\pm 2$<br>$\\therefore \\;x=3$ 또는 $x=-1$<br>$\\therefore \\;b=-1$<br>$\\therefore \\;ab=4\\times (-1)=-4$", "k": "num", "a": "-4", "q": "두 조건 $p$, $q$가<br> $p\\,:\\,(x-1)^{2}=a$, $q\\,:\\,x=3$ 또는 $x=b$<br>일 때, $p$가 $q$이기 위한 필요충분조건이 되도록 하는 상수 $a$, $b$에 대하여 $ab$의 값을 구하시오.", "key": "T07-10"}, "x07x39-022": {"id": "x07x39-022", "unit": "07", "theme": "11", "벌": "X07x39", "lvl": 1, "fix": true, "src": "문제집 고쟁이", "w": "명제와 그 대우는 참, 거짓이 일치한다.<br>따라서 주어진 명제 대신 그 대우인<br>④ ‘두 자연수 $m,\\;n$에 대하여 $m,\\;n$이 모두 짝수이면 $m+n$이 짝수이다.’<br>를 증명하면 된다.", "k": "c5", "c": ["두 자연수 $m,\\;n$에 대하여 $m+n$이 짝수이면 $m$ 또는 $n$이 짝수이다.", "두 자연수 $m,\\;n$에 대하여 $m+n$이 짝수이면 $m,\\;n$이 모두  짝수이다.", "두 자연수 $m,\\;n$에 대하여 $m$ 또는 $n$이 홀수이면 $m+n$이 홀수이다.", "두 자연수 $m,\\;n$에 대하여 $m,\\;n$이 모두 짝수이면 $m+n$이 짝수이다.", "두 자연수 $m,\\;n$에 대하여 $m,\\;n$이 모두 홀수이면 $m+n$이 홀수이다."], "a": "두 자연수 $m,\\;n$에 대하여 $m,\\;n$이 모두 짝수이면 $m+n$이 짝수이다.", "q": "명제 ‘두 자연수 $m,\\;n$에 대하여 $m+n$이 홀수이면 $m$ 또는 $n$이 홀수이다.’가 참임을 증명하기 위해 대신 참임을 증명할 수 있는 명제는?", "key": "T07-11"}, "x07x47-050": {"id": "x07x47-050", "unit": "07", "theme": "11", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "주어진 명제의 대우 ‘자연수 $a,\\;b$에 대하여 $a,\\;b$가 모두 홀수이거나 모두 짝수이면 $a^{2}+b^{2}$은 ${\\boxed{\\,(가)\\,짝수\\,}}$이다.’가 참임을 보이면 된다.<br>(ⅰ) $a,\\;b$가 모두 홀수일 때,<br>$a=2k-1,\\;b=2l-1$($k,\\;l$은 자연수)이라 하면<br>$a^{2}+b^{2}=(2k-1)^{2}+(2l-1)^{2}$<br>     $=2({\\boxed{\\,(나)\\,2k^{2}-2k+2l^{2}-2l+1\\,}})$<br>이때 ${\\boxed{\\,(나)\\,2k^{2}-2k+2l^{2}-2l+1\\,}}$은 자연수이므로 $a^{2}+b^{2}$은 ${\\boxed{\\,(가)\\,짝수\\,}}$이다.<br>(ⅱ) $a,\\;b$가 모두 짝수일 때,<br>$a=2k,\\;b=2l$($k,\\;l$은 자연수)이라 하면<br>$a^{2}+b^{2}=(2k)^{2}+(2l)^{2}=2({\\boxed{\\,(다)\\,2k^{2}+2l^{2}\\,}})$<br>이때 ${\\boxed{\\,(다)\\,2k^{2}+2l^{2}\\,}}$은 자연수이므로 $a^{2}+b^{2}$은 ${\\boxed{\\,(가)\\,짝수\\,}}$이다.<br>(ⅰ), (ⅱ)에서 주어진 명제의 대우가 참이므로 주어진 명제도 참이다.", "k": "c5", "c": ["(가) 홀수      (나) $k^{2}-k+l^{2}-l+1$ (다) $k^{2}+l^{2}$", "(가) 홀수      (나) $2k^{2}-2k+2l^{2}-2l+1$ (다) $2k^{2}+2l^{2}$", "(가) 짝수      (나) $k^{2}-k+l^{2}-l+1$ (다) $k^{2}+l^{2}$", "(가) 짝수      (나) $2k^{2}-2k+2l^{2}-2l+1$ (다) $k^{2}+l^{2}$", "(가) 짝수      (나) $2k^{2}-2k+2l^{2}-2l+1$ (다) $2k^{2}+2l^{2}$"], "a": "(가) 짝수      (나) $2k^{2}-2k+2l^{2}-2l+1$ (다) $2k^{2}+2l^{2}$", "q": "다음은 명제 ‘자연수 $a,\\;b$에 대하여 $a^{2}+b^{2}$이 홀수이면 $a,\\;b$ 중에서 하나는 홀수이고 다른 하나는 짝수이다.’가 참임을 대우를 이용하여 증명하는 과정이다. 이때 (가), (나), (다)에 들어갈 알맞은 것은?<br>주어진 명제의 대우 ‘자연수 $a,\\;b$에 대하여 $a,\\;b$가 모두 홀수이거나 모두 짝수이면 $a^{2}+b^{2}$은 ${\\boxed{\\,(가)\\,}}$이다.’가 참임을 보이면 된다.(ⅰ) $a,\\;b$가 모두 홀수일 때,<br>$a=2k-1,\\;b=2l-1$($k,\\;l$은 자연수)이라 하면<br>$a^{2}+b^{2}=(2k-1)^{2}+(2l-1)^{2}=2({\\boxed{\\,(나)\\,}})$<br>이때 ${\\boxed{\\,(나)\\,}}$은 자연수이므로 $a^{2}+b^{2}$은 ${\\boxed{\\,(가)\\,}}$이다.(ⅱ) $a,\\;b$가 모두 짝수일 때,<br>$a=2k,\\;b=2l$($k,\\;l$은 자연수)이라 하면<br>$a^{2}+b^{2}=(2k)^{2}+(2l)^{2}=2({\\boxed{\\,(다)\\,}})$<br>이때 ${\\boxed{\\,(다)\\,}}$은 자연수이므로 $a^{2}+b^{2}$은 ${\\boxed{\\,(가)\\,}}$이다.(ⅰ), (ⅱ)에서 주어진 명제의 대우가 참이므로 주어진 명제도 참이다.", "key": "T07-11"}, "x07x47-052": {"id": "x07x47-052", "unit": "07", "theme": "11", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "주어진 명제의 결론을 부정하여 $\\sqrt{3}$이 ${\\boxed{\\,(가)\\,유리수\\,}}$라 가정하면<br>$\\sqrt{3}=\\dfrac{n}{m}$ ($m,\\;n$은 서로소인 자연수)  $\\cdots \\cdots $ ㉠<br>으로 나타낼 수 있다.<br>㉠의 양변을 제곱하면<br>$3=\\dfrac{n^{2}}{m^{2}}\\therefore \\;n^{2}={\\boxed{\\,(나)\\,3m^{2}\\,}}\\cdots \\cdots $ ㉡<br>이때 $n^{2}$이 $3$의 배수이므로 $n$도 $3$의 배수이다.<br>$n$이 $3$의 배수이면 $n=3k$($k$는 자연수)로 나타낼 수 있으므로 ㉡에 대입하면<br>$9k^{2}=3m^{2}\\therefore \\;m^{2}={\\boxed{\\,(다)\\,3k^{2}\\,}}$<br>이때 $m^{2}$이 $3$의 배수이므로 $m$도 $3$의 배수이다.<br>그런데 $m,\\;n$이 모두 $3$의 배수이면 $m,\\;n$이 서로소라는 가정에 모순이다.<br>따라서 $\\sqrt{3}$은 무리수이다.", "k": "c5", "c": ["(가) 유리수 (나) $3m^{2}$ (다) $9k^{2}$", "(가) 유리수 (나) $3m^{2}$ (다) $3k^{2}$", "(가) 유리수 (나) $m^{2}$ (다) $k^{2}$", "(가) 무리수 (나) $3m^{2}$ (다) $3k^{2}$", "(가) 무리수 (나) $m^{2}$ (다) $k^{2}$"], "a": "(가) 유리수 (나) $3m^{2}$ (다) $3k^{2}$", "q": "다음은 명제 ‘$\\sqrt{3}$은 무리수이다.’가 참임을 귀류법을 이용하여 증명하는 과정이다. 이때 (가), (나), (다)에 들어갈 알맞은 것은?<br>주어진 명제의 결론을 부정하여 $\\sqrt{3}$이 ${\\boxed{\\,(가)\\,}}$라 가정하면$\\sqrt{3}=\\dfrac{n}{m}$($m,\\;n$은 서로소인 자연수) $\\cdots \\cdots $ ㉠으로 나타낼 수 있다.㉠의 양변을 제곱하면$3=\\dfrac{n^{2}}{m^{2}}\\therefore \\;n^{2}={\\boxed{\\,(나)\\,}}\\cdots \\cdots $ ㉡이때 $n^{2}$이 $3$의 배수이므로 $n$도 $3$의 배수이다.$n$이 $3$의 배수이면 $n=3k$ ($k$는 자연수)로 나타낼 수 있으므로 ㉡에 대입하면$m^{2}={\\boxed{\\,(다)\\,}}$이때 $m^{2}$이 $3$의 배수이므로 $m$도 $3$의 배수이다.그런데 $m,\\;n$이 모두 $3$의 배수이면 $m,\\;n$이 서로소라는 가정에 모순이다.따라서 $\\sqrt{3}$은 무리수이다.", "key": "T07-11"}, "x07x39-029": {"id": "x07x39-029", "unit": "07", "theme": "12", "벌": "X07x39", "lvl": 1, "fix": true, "src": "문제집 고쟁이", "w": "$x>0$, $y>0$이므로 $xy>0$이다.<br>산술평균과 기하평균의 관계에 의하여<br>$\\left(2x+\\dfrac{3}{y}\\right)\\left(2y+\\dfrac{3}{x}\\right)=4xy+6+6+\\dfrac{9}{xy}$<br>$=4xy+\\dfrac{9}{xy}+12$<br>$\\ge 2\\sqrt{4xy\\times \\dfrac{9}{xy}}+12=24$<br>(단, 등호는 $4xy=\\dfrac{9}{xy}$, 즉 $xy=\\dfrac{3}{2}$일 때 성립한다.<br>따라서 $\\left(2x+\\dfrac{3}{y}\\right)\\left(2y+\\dfrac{3}{x}\\right)$의 최솟값은 $24$이다.<br>[TIP]<br>$4xy=\\dfrac{9}{xy}$에서 $(2xy)^{2}=3^{2}$이므로 $xy=\\dfrac{3}{2}$이다. $(\\because \\,xy>0)$", "k": "c5", "c": ["$20$", "$22$", "$24$", "$26$", "$28$"], "a": "$24$", "q": "두 양수 $x$, $y$에 대하여 $\\left(2x+\\dfrac{3}{y}\\right)\\left(2y+\\dfrac{3}{x}\\right)$의 최솟값은?", "key": "T07-12"}, "x07x39-030": {"id": "x07x39-030", "unit": "07", "theme": "12", "벌": "X07x39", "lvl": 1, "fix": true, "src": "문제집 고쟁이", "w": "$a>0$, $b>0$이므로 산술평균과 기하평균의 관계에 의하여<br>$(a+b)\\left(\\dfrac{1}{a}+\\dfrac{1}{b}\\right)=1+\\dfrac{4a}{b}+\\dfrac{b}{a}+4$<br>$\\ge 5+2\\sqrt{\\dfrac{4a}{b}\\times \\dfrac{b}{a}}=9$<br>(단, 등호는 $\\dfrac{4a}{b}=\\dfrac{b}{a}$, 즉, $2a=b$일 때 성립한다.)<br>따라서 $(a+b)\\left(\\dfrac{1}{a}+\\dfrac{4}{b}\\right)$의 최솟값은 $9$이다.<br>[TIP]<br>$\\dfrac{4a}{b}=\\dfrac{b}{a}$에서 $4a^{2}=b^{2}$이므로 $b=2a$ 또는 $b=-2a$이다.<br>이때 $a>0$, $b>0$이므로 $2a=b$이다.", "k": "c5", "c": ["$5$", "$6$", "$7$", "$8$", "$9$"], "a": "$9$", "q": "$a>0$, $b>0$일 때, $(a+b)\\left(\\dfrac{1}{a}+\\dfrac{4}{b}\\right)$의 최솟값은?", "key": "T07-12"}, "x07x39-033": {"id": "x07x39-033", "unit": "07", "theme": "12", "벌": "X07x39", "lvl": 1, "fix": true, "src": "문제집 고쟁이", "w": "$a^{2}+b^{2}=5$이므로 코시-슈바르츠의 부등식에 의하여<br>$(1^{2}+2^{2})(a^{2}+b^{2})\\ge (a+2b)^{2}$<br>$5\\times 5\\ge (a+2b)^{2}$ (단, 등호는 $2a=b$일 때 성립한다.)<br>$-5\\le a+2b\\le 5$<br>따라서 $a+2b$의 최댓값은 $M=5$, 최솟값은 $m=-5$이므로<br>$M-m=5-(-5)=10$<br>[TIP]<br>양수 $k$에 대하여 $x$에 대한 부등식 $x^{2}\\le k^{2}$의 해는<br>$x^{2}-k^{2}=(x+k)(x-k)\\le 0$에서 $-k\\le x\\le k$이다.<br>따라서 $(a+2b)^{2}\\le 5^{2}$에서 $-5\\le a+2b\\le 5$이다.", "k": "c5", "c": ["$5$", "$5\\sqrt{2}$", "$10$", "$10\\sqrt{2}$", "$20$"], "a": "$10$", "q": "두 실수 $a$, $b$에 대하여 $a^{2}+b^{2}=5$일 때, $a+2b$의 최댓값은 $M$이고 최솟값은 $m$이다. $M-m$의 값은?", "key": "T07-12"}, "x07x20-082": {"id": "x07x20-082", "unit": "07", "theme": "12", "벌": "X07x20", "lvl" )$의 최솟값을 구하시오.", "key": "T07-12"}, "x07x30-113": {"id": "x07x30-113", "unit": "07", "theme": "12", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$A-B=(ab-1)^{2}-(a^{2}-1)(b^{2}-1)$<br>$=a^{2}b^{2}-2ab+1-(a^{2}b^{2}-a^{2}-b^{2}+1)$<br>$=a^{2}-2ab+b^{2}$<br>$=(a-b)^{2}$<br>$a,\\;b$가 실수이므로 $(a-b)^{2}\\ge 0$<br>$\\therefore A\\ge B$ (단, 등호는 $a=b$일 때 성립)", "k": "c5", "c": ["$A>B$", "$A\\ge B$", "$A<B$", "$A\\le B$", "$A=B$"], "a": "$A\\ge B$", "q": "$a,\\;b$가 실수일 때, 두 수<br> $A=(ab-1)^{2}$, $B=(a^{2}-1)(b^{2}-1)$<br>의 대소 관계는?", "key": "T07-12"}, "x07x30-115": {"id": "x07x30-115", "unit": "07", "theme": "12", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$(|\\,a\\,|+|\\,b\\,|)^{2}-|\\,a+b\\,|^{2}$<br>$=(|\\,a\\,|^{2}+2|\\,a\\,||\\,b\\,|+|\\,b\\,|^{2})-(a+b)^{2}$<br>$=(a^{2}+2|\\,ab\\,|+b^{2})-(a^{2}+2ab+b^{2})$<br>$=2(\\,{\\boxed{\\,|\\,ab\\,|-ab\\,}}\\,)\\ge 0$ ($\\because |\\,ab\\,|geab$)<br>$\\therefore (|\\,a\\,|+|\\,b\\,|)^{2}\\ge |\\,a+b\\,|^{2}$<br>그런데 $|\\,a\\,|+|\\,b\\,|\\ge 0$, $|\\,a+b\\,|\\ge 0$이므로<br>$|\\,a\\,|+|\\,b\\,|\\ge |\\,a+b\\,|$<br>(단, 등호는 $|\\,ab\\,|=ab$, 즉 ${\\boxed{\\,ab\\ge 0\\,}}$일 때 성립)<br>$\\therefore $<br>(가) $|\\,ab\\,|-ab$<br>(나) $ab\\ge 0$", "k": "c5", "c": ["$|\\,ab\\,|+ab$, $ab\\le 0$", "$|\\,ab\\,|+ab$, $ab\\ge 0$", "$|\\,ab\\,|-ab$, $ab\\le 0$", "$|\\,ab\\,|-ab$, $ab\\ge 0$", "$|\\,ab\\,|-ab$, $ab=0$"], "a": "$|\\,ab\\,|-ab$, $ab\\ge 0$", "q": "다음은 두 실수 $a,\\;b$에 대하여 부등식 $|\\,a\\,|+|\\,b\\,|\\ge |\\,a+b\\,|$가 성립함을 증명하는 과정이다.<br>[증명] $(|\\,a\\,|+|\\,b\\,|)^{2}-|\\,a+b\\,|^{2}=2(\\boxed{\\;(가)\\;})\\ge 0\\therefore (|\\,a\\,|+|\\,b\\,|)^{2}\\ge |\\,a+b\\,|^{2}$그런데 $|\\,a\\,|+|\\,b\\,|\\ge 0$, $|\\,a+b\\,|\\ge 0$이므로 $|\\,a\\,|+|\\,b\\,|\\ge |\\,a+b\\,|$ (단, 등호는 $\\boxed{\\;(나)\\;}$일 때 성립)<br>위의 과정에서 (가), (나)에 알맞은 것을 차례대로 나열한 것은?", "key": "T07-12"}, "x07x30-117": {"id": "x07x30-117", "unit": "07", "theme": "12", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$x>0$, $y>0$에서 $xy>0$이므로 산술평균과 기하평균의 관계에 의하여<br>$\\left(x+\\dfrac{2}{y}\\right)\\left(y+\\dfrac{8}{x}\\right)=xy+8+2+\\dfrac{16}{x}y$<br>$\\ge 10+2\\sqrt{xy\\cdot \\dfrac{16}{x}y}$<br>$=10+2\\cdot 4=18$<br>등호는 $xy=\\dfrac{16}{x}y$일 때 성립하므로 $(xy)^{2}=16$에서<br>$xy=4$ ($\\because xy>0$)<br>따라서 $\\left(x+\\dfrac{2}{y}\\right)\\left(y+\\dfrac{8}{x}\\right)$은 $xy=4$일 때 최솟값 $18$을 가지므로<br>$a=4$, $b=18$<br>$\\therefore a+b=22$", "k": "c5", "c": ["$20$", "$21$", "$22$", "$23$", "$24$"], "a": "$22$", "q": "두 양수 $x,\\;y$에 대하여 $\\left(x+\\dfrac{2}{y}\\right)\\left(y+\\dfrac{8}{x}\\right)$은 $xy=a$일 때 최솟값 $b$를 갖는다. 이때 상수 $a,\\;b$에 대하여 $a+b$의 값은?", "key": "T07-12"}, "x07x30-119": {"id": "x07x30-119", "unit": "07", "theme": "12", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$a>0$, $b>0$, $c>0$이므로 산술평균과 기하평균의 관계에 의하여<br>$\\left(\\dfrac{a}{b}+\\dfrac{b}{c}\\right)\\left(\\dfrac{b}{c}+\\dfrac{c}{a}\\right)\\left(\\dfrac{c}{a}+\\dfrac{a}{b}\\right)$<br>$\\ge 2\\sqrt{\\dfrac{a}{b}\\cdot \\dfrac{b}{c}}\\cdot 2\\sqrt{\\dfrac{b}{c}\\cdot \\dfrac{c}{a}}\\cdot 2\\sqrt{\\dfrac{c}{a}\\cdot \\dfrac{a}{b}}$<br>$=8\\sqrt{\\dfrac{a}{c}}\\sqrt{\\dfrac{b}{a}}\\sqrt{\\dfrac{c}{b}}$<br>$=8$ (단, 등호는 $a=b=c$일 때 성립)<br>따라서 주어진 식의 최솟값은 $8$이다.", "k": "c5", "c": ["$2$", "$4$", "$6$", "$8$", "$10$"], "a": "$8$", "q": "$a>0$, $b>0$, $c>0$일 때, $\\left(\\dfrac{a}{b}+\\dfrac{b}{c}\\right)\\left(\\dfrac{b}{c}+\\dfrac{c}{a}\\right)\\left(\\dfrac{c}{a}+\\dfrac{a}{b}\\right)$의 최솟값은?", "key": "T07-12"}, "x07x30-123": {"id": "x07x30-123", "unit": "07", "theme": "12", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$|\\,x\\,|=x$, $x\\ne 0$에서 $x>0$, $x^{2}+1>0$이므로 산술평균과 기하평균의 관계에 의하여<br>$x+\\dfrac{1}{x}+\\dfrac{4x}{x^{2}+1}=\\dfrac{x^{2}+1}{x}+\\dfrac{4x}{x^{2}+1}$<br>$\\ge 2\\sqrt{\\dfrac{x^{2}+1}{x}\\cdot \\dfrac{4x}{x^{2}+1}}$<br>$=2\\cdot 2$<br>$=4$ (단, 등호는 $x=1$일 때 성립)<br>따라서 $x+\\dfrac{1}{x}+\\dfrac{4x}{x^{2}+1}$의 최솟값은 $4$이다.", "k": "c5", "c": ["$2$", "$2\\sqrt{2}$", "$2\\sqrt{3}$", "$4$", "$3\\sqrt{2}$"], "a": "$4$", "q": "실수 $x$에 대하여 $|\\,x\\,|=x$일 때, $x+\\dfrac{1}{x}+\\dfrac{4x}{x^{2}+1}$의 최솟값은?<br>(단, $x\\ne 0$)", "key": "T07-12"}, "x07x30-125": {"id": "x07x30-125", "unit": "07", "theme": "12", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$x>0$, $y>0$이므로 산술평균과 기하평균의 관계에 의하여<br>$2x+3y\\ge 2\\sqrt{2x\\cdot 3y}=2\\sqrt{6}xy$<br>그런데 $2x+3y=6$이므로<br>$6\\ge 2\\sqrt{6xy}$, $3\\ge \\sqrt{6xy}$<br>위의 식의 양변을 제곱하면 $9\\ge 6xy$<br>$\\therefore xy\\le \\dfrac{3}{2}$<br>이때 등호는 $2x=3y$일 때 성립하고 $2x+3y=6$이므로<br>$2x=3$, $3y=3\\therefore x=\\dfrac{3}{2}$, $y=1$<br>따라서 $xy$는 $x=\\dfrac{3}{2}$, $y=1$일 때 최댓값 $\\dfrac{3}{2}$을 가지므로<br>$\\alpha =\\dfrac{3}{2}$, $\\beta =\\dfrac{3}{2}$, $\\gamma =1$<br>$\\therefore \\alpha +\\beta +\\gamma =4$", "k": "c5", "c": ["$2$", "$4$", "$6$", "$8$", "$10$"], "a": "$4$", "q": "두 양수 $x,\\;y$에 대하여 $2x+3y=6$일 때, $xy$의 최댓값을 $\\alpha $, 그때의 $x,\\;y$의 값을 각각 $\\beta ,\\;\\gamma $라 하자. 이때 $\\alpha +\\beta +\\gamma $의 값은?", "key": "T07-12"}, "x07x30-128": {"id": "x07x30-128", "unit": "07", "theme": "12", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$x^{2}>0$, $y^{2}>0$이므로 산술평균과 기하평균의 관계에 의하여 $4x^{2}+9y^{2}\\ge 2\\sqrt{4x^{2}\\cdot 9y^{2}}=12|\\,xy\\,|$<br>그런데 $4x^{2}+9y^{2}=48$이므로<br>$48\\ge 12|\\,xy\\,|$, $|\\,xy\\,|\\le 4$<br>$\\therefore -4\\le xy<0$ 또는 $0<xy\\le 4$<br>(단, 등호는 $2|\\,x\\,|=3|\\,y\\,|$일 때 성립)<br>따라서 $xy$의 최댓값은 $4$ 최솟값은 $-4$이므로 구하는 곱은<br>$4\\cdot (-4)=-16$", "k": "num", "a": "-16", "q": "$0$이 아닌 두 실수 $x,\\;y$에 대하여 $4x^{2}+9y^{2}=48$일 때, $xy$의 최댓값과 최솟값의 곱을 구하시오.", "key": "T07-12"}, "x07x30-129": {"id": "x07x30-129", "unit": "07", "theme": "12", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "두 직선 $y=\\dfrac{a}{3}x+2$, $y=\\dfrac{1}{b}x-5$가 평행하므로<br>$\\dfrac{a}{3}=\\dfrac{1}{b}\\therefore ab=3$<br>$\\therefore (a+1)(b+3)=ab+3a+b+3=6+3a+b$<br>$a>0$, $b>0$이므로 산술평균과 기하평균의 관계에 의하여<br>$6+3a+b\\ge 6+2\\sqrt{3}ab$<br>그런데 $ab=3$이므로<br>$6+3a+b\\ge 6+2\\sqrt{3\\cdot 3}=12$ (단, 등호는 $3a=b$일 때 성립)<br>따라서 $(a+1)(b+3)$의 최솟값은 $12$이다.", "k": "c5", "c": ["$11$", "$12$", "$13$", "$14$", "$15$"], "a": "$12$", "q": "두 양수 $a,\\;b$에 대하여 두 직선 $y=\\dfrac{a}{3}x+2$, $y=\\dfrac{1}{b}x-5$가 평행할 때, $(a+1)(b+3)$의 최솟값은?", "key": "T07-12"}, "x07x30-136": {"id": "x07x30-136", "unit": "07", "theme": "12", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$x$, $y$, $z$가 실수이므로 코시-슈바르츠 부등식에 의하여<br>$\\left\\{1^{2}+(-2)^{2}+3^{2}\\right\\}(x^{2}+y^{2}+z^{2})\\ge (x-2y+3z)^{2}$<br>그런데 $x^{2}+y^{2}+z^{2}=2$이므로<br>$28\\ge (x-2y+3z)^{2}$<br>$\\therefore \\;-2\\sqrt{7}\\le x-2y+3z\\le 2\\sqrt{7}$<br>$(\\begin{matrix}\\end{matrix}$단, 등호는 $x=-\\dfrac{y}{2}=\\dfrac{z}{3}$일 때 성립$\\left.\\begin{matrix}\\end{matrix}\\right)$<br>따라서 $x-2y+3z$의 최솟값은 $-2\\sqrt{7}$이다.", "k": "c5", "c": ["$-2\\sqrt{7}$", "$-5$", "$-2\\sqrt{5}$", "$-4$", "$-2\\sqrt{3}$"], "a": "$-2\\sqrt{7}$", "q": "세 실수 $x$, $y$, $z$에 대하여 $x^{2}+y^{2}+z^{2}=2$일 때, $x-2y+3z$의 최솟값은?", "key": "T07-12"}, "x07x30-137": {"id": "x07x30-137", "unit": "07", "theme": "12", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$x$, $y$가 실수이므로 코시-슈바르츠 부등식에 의하여<br>$(3^{2}+1^{2})(x^{2}+y^{2})\\ge (3x+y)^{2}$<br>그런데 $x^{2}+y^{2}=a$이므로<br>$10a\\ge (3x+y)^{2}$<br>$\\therefore \\;-\\sqrt{10a}\\le 3x+y\\le \\sqrt{10a}(\\begin{matrix}\\end{matrix}$단, 등호는 $\\dfrac{x}{3}=y$일 때 성립$\\left.\\begin{matrix}\\end{matrix}\\right)$<br>따라서 $3x+y$의 최댓값은 $\\sqrt{10a}$, 최솟값은 $-\\sqrt{10a}$이고 그 차가 $20$이므로 $2\\sqrt{10a}=20$, $10a=100\\therefore \\;a=10$", "k": "num", "a": "10", "q": "$x^{2}+y^{2}=a$를 만족시키는 두 실수 $x$, $y$에 대하여 $3x+y$의 최댓값과 최솟값의 차가 $20$일 때, 양수 $a$의 값을 구하시오.", "key": "T07-12"}, "x07x30-139": {"id": "x07x30-139", "unit": "07", "theme": "12", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$x$, $y$가 실수이므로 코시-슈바르츠 부등식에 의하여<br>$(3^{2}+4^{2})(x^{2}+y^{2})\\ge (3x+4y)^{2}$<br>그런데 $3x+4y=5$이므로<br>$25(x^{2}+y^{2})\\ge 25$<br>$\\therefore \\;x^{2}+y^{2}\\ge 1(\\begin{matrix}\\end{matrix}$단, 등호는 $\\dfrac{x}{3}=\\dfrac{y}{4}$일 때 성립$\\left.\\begin{matrix}\\end{matrix}\\right)$<br>따라서 $x^{2}+y^{2}$의 최솟값은 $1$이다.", "k": "c5", "c": ["$1$", "$2$", "$3$", "$4$", "$5$"], "a": "$1$", "q": "두 실수 $x$, $y$에 대하여 $3x+4y=5$일 때, $x^{2}+y^{2}$의 최솟값은?", "key": "T07-12"}, "x07x30-140": {"id": "x07x30-140", "unit": "07", "theme": "12", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$a$, $b$가 실수이므로 코시-슈바르츠 부등식에 의하여<br>$\\left\\{\\left(\\dfrac{1}{2}\\right)^{2}+\\left(\\dfrac{1}{3}\\right)^{2}\\right\\}(a^{2}+b^{2})\\ge \\left(\\dfrac{a}{2}+\\dfrac{b}{3}\\right)^{2}$<br>그런데 $\\dfrac{a}{2}+\\dfrac{b}{3}=\\sqrt{13}$이므로<br>$\\dfrac{13}{36}(a^{2}+b^{2})\\ge 13$<br>$\\therefore \\;a^{2}+b^{2}\\ge 36$ (단, 등호는 $2a=3b$일 때 성립)<br>따라서 $a^{2}+b^{2}$의 최솟값은 $36$이다.", "k": "num", "a": "36", "q": "두 실수 $a$, $b$에 대하여 $\\dfrac{a}{2}+\\dfrac{b}{3}=\\sqrt{13}$일 때, $a^{2}+b^{2}$의 최솟값을 구하시오.", "key": "T07-12"}, "x07x30-141": {"id": "x07x30-141", "unit": "07", "theme": "12", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "ㄱ. $x>0$, $y>0$이므로 산술평균과 기하평균의 관계에 의하여<br>$x+y\\ge 2\\sqrt{xy}$<br>그런데 $x+y=9$이므로 $9\\ge 2\\sqrt{xy}$<br>$\\therefore \\;\\sqrt{xy}\\le \\dfrac{9}{2}$ (단, 등호는 $x=y$일 때 성립)<br>ㄴ. $x$, $y$가 실수이므로 코시-슈바르츠 부등식에 의하여<br>$(1^{2}+1^{2})(x^{2}+y^{2})\\ge (x+y)^{2}$<br>그런데 $x+y=9$이므로<br>$2(x^{2}+y^{2})\\ge 81$<br>$\\therefore \\;x^{2}+y^{2}\\ge \\dfrac{81}{2}$(단, 등호는 $x=y$일 때 성립)<br>ㄷ. $\\sqrt{x}$, $\\sqrt{y}$가 실수이므로 코시-슈바르츠 부등식에 의하여<br>$(1^{2}+1^{2})\\left\\{\\left(\\sqrt{x}\\right)^{2}+\\left(\\sqrt{y}\\right)^{2}\\right\\}\\ge \\left(\\sqrt{x}+\\sqrt{y}\\right)^{2}$<br>그런데 $x+y=9$이므로<br>$2\\cdot 9\\ge \\left(\\sqrt{x}+\\sqrt{y}\\right)^{2}$<br>이때 $x>0$, $y>0$이므로<br>$0<\\sqrt{x}+\\sqrt{y}\\le 3\\sqrt{2}$ (단, 등호는 $\\sqrt{x}=\\sqrt{y}$일 때 성립)<br>이상에서 옳은 것은 ㄴ, ㄷ이다.", "k": "c5", "c": ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "a": "ㄴ, ㄷ", "q": "두 양수 $x$, $y$에 대하여 $x+y=9$일 때, 옳은 것만을 <보기>에서 있는 대로 고른 것은?<br><b><보기><\/b><br>ㄱ. $\\sqrt{xy}\\le \\dfrac{9}{4}$       <br>ㄴ. $x^{2}+y^{2}\\ge \\dfrac{81}{2}$<br>ㄷ. $0<\\sqrt{x}+\\sqrt{y}\\le 3\\sqrt{2}$", "key": "T07-12"}, "x07x39-069": {"id": "x07x39-069", "unit": "07", "theme": "12", "벌": "X07x39", "lvl": 2, "fix": true, "src": "문제집 고쟁이", "w": "주어진 부등식 $5x^{2}+4y^{2}+9\\ge 4x(y-3)$에서<br>$5x^{2}+4y^{2}+9-4xy+12x\\ge 0$임을 보이면 된다.<br>$5x^{2}+4y^{2}+9-4xy+12x$<br>$=(x^{2}-4xy+4y^{2})+(4x^{2}+12x+9)$<br>$=(x-2y)^{2}+(2x+3)^{2}$<br>이고, $(x-2y)^{2}\\ge 0,\\;(2x+3)^{2}\\ge 0$이므로<br>$(x-2y)^{2}+(2x+3)^{2}\\ge 0$이다.<br>따라서 두 실수 $x$, $y$에 대하여 부등식<br>$5x^{2}+4y^{2}+9\\ge 4x(y-3)(\\begin{matrix}\\end{matrix}$단, 등호는 $x=2y,\\;x=-\\dfrac{3}{2}$일 때,<br>즉 $x=\\boxed{\\,-\\dfrac{3}{2}\\,}\\,,\\;y=\\boxed{\\,-\\dfrac{3}{4}\\,}$일 때 성립한다.$\\begin{matrix}\\end{matrix})$<br>이 성립한다.<br>따라서 $f(x)=(2x+3)^{2},\\;\\alpha =-\\dfrac{3}{2},\\;\\beta =-\\dfrac{3}{4}$이다.<br>$∴\\;f(2)+12(\\alpha +\\beta )=7^{2}+12\\times \\left(-\\dfrac{9}{4}\\right)=22$", "k": "c5", "c": ["$16$", "$18$", "$20$", "$22$", "$24$"], "a": "$22$", "q": "다음은 두 실수 $x$, $y$에 대하여 부등식<br> $5x^{2}+4y^{2}+9\\ge 4x(y-3)$<br>이 성립함을 증명하는 과정이다.<br>$5x^{2}+4y^{2}+9-4xy+12x=(x-2y)^{2}+\\boxed{\\;㈎\\;}$이고, $(x-2y)^{2}\\ge 0,\\;\\boxed{\\;㈎\\;}\\,\\ge 0$이므로$(x-2y)^{2}+\\boxed{\\;㈎\\;}\\,\\ge 0$이다.따라서 두 실수 $x$, $y$에 대하여 부등식$5x^{2}+4y^{2}+9\\ge 4x(y-3)$이 성립한다.(단, 등호는 $x=\\boxed{\\;㈏\\;}$, $y=\\boxed{\\;㈐\\;}$일 때 성립한다.)<br>위의 (가)에 알맞은 식을 $f(x)$라 하고, (나), (다)에 알맞은 수를 각각 $\\alpha $, $\\beta $라 할 때, $f(2)+12(\\alpha +\\beta )$의 값은?", "key": "T07-12"}, "x07x39-070": {"id": "x07x39-070", "unit": "07", "theme": "12", "벌": "X07x39", "lvl": 2, "fix": true, "src": "문제집 고쟁이", "w": "이차방정식 $x^{2}-2\\sqrt{5}x+k=0$의 판별식을 $D$라 하면<br>$\\dfrac{D}{4}=(-\\sqrt{5})^{2}-k<0$<br>이므로 $k>5$이다.<br>$k-5>0$이므로 산술평균과 기하평균의 관계에 의하여<br>$k+5+\\dfrac{9}{k}-5=k-5+\\dfrac{9}{k}-5+10$<br>$\\ge 2\\sqrt{(k-5)\\times \\dfrac{9}{k}-t}+10=16$<br>이때 등호는 $k-5=\\dfrac{9}{k}-5$일 때 성립하므로<br>$(k-5)^{2}=9$에서 $k=8\\,(\\because \\,k>5)$<br>따라서 이차방정식 $x^{2}-2\\sqrt{5}x+k=0$이 허근을 가질 때, $k+5+\\dfrac{9}{k}-5$는 $k=8$일 때 최솟값 $16$을 가지므로 $a=8,\\;b=16$이다.<br>$\\therefore \\;a+b=8+16=24$", "k": "c5", "c": ["$18$", "$20$", "$22$", "$24$", "$26$"], "a": "$24$", "q": "이차방정식 $x^{2}-2\\sqrt{5}x+k=0$이 허근을 가질 때,<br> $k+5+\\dfrac{9}{k}-5$<br>는 $k=a$일 때, 최솟값 $b$를 갖는다. 두 상수 $a,\\;b$에 대하여 $a+b$의 값은? (단, $k$는 실수이다.)", "key": "T07-12"}, "x07x47-056": {"id": "x07x47-056", "unit": "07", "theme": "12", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "$a^{2}+b^{2}-ab=\\left({\\boxed{\\,(가)\\,a-\\dfrac{b}{2}\\,}}\\right)^{2}+\\dfrac{3}{4}b^{2}\\ge 0$<br>$\\therefore \\;a^{2}+b^{2}\\ge ab$<br>이때 등호는 $a-\\dfrac{b}{2}=0,\\;\\dfrac{3}{4}b^{2}=0,$즉 ${\\boxed{\\,(나)\\,a=b=0\\,}}$일 때 성립한다.", "k": "c5", "c": ["(가) $a-b$ (나) $a=b$", "(가) $a-b$ (나) $a=b=0$", "(가) $a-\\dfrac{b}{2}$ (나) $b=2a$", "(가) $a-\\dfrac{b}{2}$ (나) $a=b=0$", "(가) $a+\\dfrac{b}{2}$ (나) $b=-2a$"], "a": "(가) $a-\\dfrac{b}{2}$ (나) $a=b=0$", "q": "다음은 $a,\\;b$가 실수일 때, 부등식 $a^{2}+b^{2}\\ge ab$가 성립함을 증명하는 과정이다. 이때 (가), (나)에 들어갈 알맞은 것은?<br>$a^{2}+b^{2}-ab=({\\boxed{\\,(가)\\,}})^{2}+\\dfrac{3}{4}b^{2}\\ge 0\\therefore \\;a^{2}+b^{2}\\ge ab$이때 등호는 ${\\boxed{\\,(나)\\,}}$일 때 성립한다.", "key": "T07-12"}, "x07x47-059": {"id": "x07x47-059", "unit": "07", "theme": "12", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "$(|\\,a\\,|+|\\,b\\,|)^{2}-(|\\,a+b\\,|)^{2}$<br>$=a^{2}+{\\boxed{\\,(가)\\,2|\\,ab\\,|\\,}}+b^{2}-(a^{2}+2ab+b^{2})$<br>$=2({\\boxed{\\,(나)\\,|\\,ab\\,|-ab\\,}})\\ge 0\\;(\\because \\;|\\,ab\\,|\\ge ab)$<br>$\\therefore \\;(|\\,a\\,|+|\\,b\\,|)^{2}\\ge (|\\,a+b\\,|)^{2}$<br>그런데 $|\\,a\\,|+|\\,b\\,|\\ge 0,\\;|\\,a+b\\,|\\ge 0$이므로<br>$|a\\,|+|\\,b\\,|\\ge |\\,a+b\\,|$<br>이때 등호는 $|\\,ab\\,|=ab,$즉 ${\\boxed{\\,(다)\\,ab\\ge 0\\,}}$일 때 성립한다.", "k": "c5", "c": ["(가) $|\\,ab\\,|$ (나) $|\\,ab\\,|-ab$ (다) $ab\\ge 0$", "(가) $|\\,ab\\,|$ (나) $|\\,ab\\,|-2ab$ (다) $ab=0$", "(가) $2|\\,ab\\,|$ (나) $|\\,ab\\,|-ab$ (다) $a=b$", "(가) $2|\\,ab\\,|$ (나) $|\\,ab\\,|-ab$ (다) $ab\\ge 0$", "(가) $2|\\,ab\\,|$ (나) $|\\,ab\\,|-ab$ (다) $ab=0$"], "a": "(가) $2|\\,ab\\,|$ (나) $|\\,ab\\,|-ab$ (다) $ab\\ge 0$", "q": "다음은 $a,\\;b$가 실수일 때, 부등식<br> $|\\,a\\,|+|\\,b\\,|\\ge |\\,a+b\\,|$<br>가 성립함을 증명하는 과정이다. 이때 (가), (나), (다)에 들어갈 알맞은 것은?<br>$(|\\,a\\,|+|\\,b\\,|)^{2}-(|\\,a+b\\,|)^{2}=a^{2}+{\\boxed{\\,(가)\\,}}+b^{2}-(a^{2}+2ab+b^{2})=2({\\boxed{\\,(나)\\,}})\\ge 0\\;(\\because \\;|\\,ab\\,|\\ge ab)\\therefore \\;(|\\,a\\,|+|\\,b\\,|)^{2}\\ge (|a+b\\,|)^{2}$그런데 $|\\,a\\,|+|\\,b\\,|\\ge 0,\\;|\\,a+b\\,|\\ge 0$이므로$|\\,a\\,|+|\\,b\\,|\\ge |\\,a+b\\,|$이때 등호는 ${\\boxed{\\,(다)\\,}}$일 때 성립한다.", "key": "T07-12"}, "x07x47-060": {"id": "x07x47-060", "unit": "07", "theme": "13", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "$a>0,\\;b>0$이므로<br>$2a+3b\\ge 2\\sqrt{2a\\times 3b}=2\\sqrt{6ab}=2\\sqrt{36}=12$<br>(단, 등호는 $2a=3b$일 때 성립)<br>따라서 구하는 최솟값은 $12$이다.", "k": "c5", "c": ["$10$", "$12$", "$14$", "$16$", "$18$"], "a": "$12$", "q": "양수 $a,\\;b$에 대하여 $ab=6$일 때, $2a+3b$의 최솟값은?", "key": "T07-13"}, "x07x47-061": {"id": "x07x47-061", "unit": "07", "theme": "13", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "$3a>0,\\;b>0$이므로 $3a+b\\ge 2\\sqrt{3ab}$<br>$6\\ge 2\\sqrt{3ab}\\therefore \\;\\sqrt{3ab}\\le 3$<br>양변을 제곱하면 $3ab\\le 9\\therefore \\;ab\\le 3$<br>이때 $ab$는 등호가 성립할 때, 즉 $3a=b$일 때 최댓값 $3$을 갖는다.<br>$\\therefore \\;M=3$<br>$b=3a$일 때 최댓값을 가지므로 이를 $3a+b=6$에 대입하면<br>$3a+3a=6\\therefore \\;a=1$<br>이를 $b=3a$에 대입하면 $b=3$<br>$\\therefore \\;\\alpha =1,\\;\\beta =3$<br>$\\therefore \\;M+\\alpha -\\beta =3+1-3=1$", "k": "c5", "c": ["$-2$", "$-1$", "$0$", "$1$", "$2$"], "a": "$1$", "q": "$3a+b=6$을 만족시키는 양수 $a,\\;b$에 대하여 $ab$의 최댓값을 $M,$그때의 $a,\\;b$의 값을 각각 $\\alpha ,\\;\\beta $라 할 때, $M+\\alpha -\\beta $의 값은?", "key": "T07-13"}, "x07x47-063": {"id": "x07x47-063", "unit": "07", "theme": "13", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "직선 $\\dfrac{x}{a}+\\dfrac{y}{b}=1$이 점 $(2,\\;5)$를 지나므로<br>$\\dfrac{2}{a}+\\dfrac{5}{b}=1\\cdots \\cdots $ ㉠<br>$\\dfrac{2}{a}>0,\\;\\dfrac{5}{b}>0$이므로 산술평균과 기하평균의 관계에 의하여<br>$\\dfrac{2}{a}+\\dfrac{5}{b}\\ge 2\\sqrt{\\dfrac{2}{a}\\times \\dfrac{5}{b}}=\\dfrac{2\\sqrt{10}}{\\sqrt{ab}}$<br>$1\\ge \\dfrac{2\\sqrt{10}}{\\sqrt{ab}}$($\\because $㉠)<br>$\\therefore \\;\\sqrt{ab}\\ge 2\\sqrt{10}$ (단, 등호는 $5a=2b$일 때 성립)<br>양변을 제곱하면 $ab\\ge 40$<br>따라서 구하는 최솟값은 $40$이다.", "k": "num", "a": "40", "q": "직선 $\\dfrac{x}{a}+\\dfrac{y}{b}=1$이 점 $(2,\\;5)$를 지날 때, 양수 $a,\\;b$에 대하여 $ab$의 최솟값을 구하시오.", "key": "T07-13"}, "x07x68-099": {"id": "x07x68-099", "unit": "07", "theme": "13", "벌": "X07x68", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "$x>0$, $y>0$에서 $3xy>0$, $\\dfrac{3}{xy}>0$이므로 산술평균과 기하평균의 관계에 의하여<br>$\\left(3x+\\dfrac{1}{y}\\right)\\left(y+\\dfrac{3}{x}\\right)=10+3xy+\\dfrac{3}{xy}$<br>${\\ge }10+2\\sqrt{3xy\\times \\dfrac{3}{xy}}$<br>$=10+6=16$<br>(단, 등호는 $xy=1$일 때, 성립)<br>따라서 구하는 최솟값은 $16$이다.", "k": "num", "a": "16", "q": "$x>0$, $y>0$일 때, $\\left(3x+\\dfrac{1}{y}\\right)\\left(y+\\dfrac{3}{x}\\right)$의 최솟값을 구하시오.", "key": "T07-13"}, "x07x68-100": {"id": "x07x68-100", "unit": "07", "theme": "13", "벌": "X07x68", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "$x>1$에서 $x-1>0$이므로 산술평균과 기하평균의 관계에 의하여<br>$x+\\dfrac{4}{x-1}=x-1+\\dfrac{4}{x-1}+1$<br>$\\ge 2\\sqrt{(x-1)\\times \\dfrac{4}{x-1}}+1$<br>$=4+1=5$<br>$(\\begin{matrix}\\end{matrix}$단, 등호는 $x-1=\\dfrac{4}{x-1}$일 때 성립$\\begin{matrix}\\end{matrix})$<br>따라서 구하는 최솟값은 $5$이다.", "k": "num", "a": "5", "q": "$x>1$일 때, $x+\\dfrac{4}{x-1}$의 최솟값을 구하시오.", "key": "T07-13"}, "x07x68-101": {"id": "x07x68-101", "unit": "07", "theme": "13", "벌": "X07x68", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "$x>0$, $y>0$에서 $\\dfrac{9x}{y}>0$, $\\dfrac{4y}{x}>0$이므로 산술평균과 기하평균의 관계에 의하여<br>$(9x+2y)\\left(\\dfrac{2}{x}+\\dfrac{1}{y}\\right)=20+\\dfrac{9x}{y}+\\dfrac{4y}{x}$<br>$\\ge 20+2\\sqrt{\\dfrac{9x}{y}\\times \\dfrac{4y}{x}}$<br>$=20+12=32$<br>이때 $9x+2y=16$이므로<br>$16\\left(\\dfrac{2}{x}+\\dfrac{1}{y}\\right){\\ge }32$<br>$\\therefore \\;\\dfrac{2}{x}+\\dfrac{1}{y}{\\ge }2$ (단, 등호 $3x=2y$일 때 성립)<br>따라서 구하는 최솟값은 $2$이다.", "k": "num", "a": "2", "q": "양수 $x$, $y$에 대하여 $9x+2y=16$일 때, $\\dfrac{2}{x}+\\dfrac{1}{y}$의 최솟값을 구하시오.", "key": "T07-13"}, "x07x47-073": {"id": "x07x47-073", "unit": "07", "theme": "14", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "직육면체의 세 모서리의 길이를 각각 $6,\\;a,\\;b$라 하고 직육면체의 대각선의 길이를 $l$이라 하면<br>$l^{2}=6^{2}+a^{2}+b^{2}$<br>직육면체의 부피가 $108$이므로<br>$6ab=108\\therefore \\;ab=18$<br>$a>0,\\;b>0$이므로<br>$a^{2}+b^{2}\\ge 2\\sqrt{a^{2}\\times b^{2}}$<br>$=2ab=36$(단, 등호는 $a=b$일 때 성립)<br>$\\therefore \\;l^{2}=6^{2}+a^{2}+b^{2}\\ge 36+36=72$<br>$\\therefore \\;l\\ge 6\\sqrt{2}$<br>따라서 구하는 대각선의 길이의 최솟값은 $6\\sqrt{2}$이다.", "k": "c5", "c": ["$6\\sqrt{2}$", "$9$", "$7\\sqrt{2}$", "$11$", "$8\\sqrt{2}$"], "a": "$6\\sqrt{2}$", "q": "한 모서리의 길이가 $6$이고 부피가 $108$인 직육면체를 만들려고 한다. 이때 만들 수 있는 직육면체의 대각선의 길이의 최솟값은?", "key": "T07-14"}, "x07x68-094": {"id": "x07x68-094", "unit": "07", "theme": "14", "벌": "X07x68", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "$10x>0$, $8y>0$이므로 산술평균과 기하평균의 관계에 의하여<br>$10x+8y{\\ge }2\\sqrt{10x\\times 8y}=8\\sqrt{5xy}$<br>이때 $xy=5$이므로<br>$10x+8y{\\ge }8\\sqrt{25}=40$ (단, 등호는 $5x=4y$일 때 성립)<br>따라서 구하는 최솟값은 $40$이다.", "k": "num", "a": "40", "q": "양수 $x$, $y$에 대하여 $xy=5$일 때, $10x+8y$의 최솟값을 구하시오.", "key": "T07-14"}, "x07x68-095": {"id": "x07x68-095", "unit": "07", "theme": "14", "벌": "X07x68", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "$3x>0$, $2y>0$이므로 산술평균과 기하평균의 관계에 의하여<br>$3x+2y{\\ge }2\\sqrt{3x\\times 2y}=2\\sqrt{6xy}$<br>이때 $3x+2y=12$이므로<br>$12{\\ge }2\\sqrt{6xy}$<br>$\\therefore \\;\\sqrt{6xy}{\\le }6$ (단, 등호는 $3x=2y$일 때 성립)<br>양변을 제곱하면<br>$6xy{\\le }36$<br>$\\therefore \\;xy{\\le }6$<br>따라서 구하는 최댓값은 $6$이다.", "k": "num", "a": "6", "q": "양수 $x$, $y$에 대하여 $3x+2y=12$일 때, $xy$의 최댓값을 구하시오.", "key": "T07-14"}, "x07x68-096": {"id": "x07x68-096", "unit": "07", "theme": "14", "벌": "X07x68", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "$a^{2}>0$, $16b^{2}>0$이므로 산술평균과 기하평균의 관계에 의하여<br>$a^{2}+16b^{2}{\\ge }2\\sqrt{a^{2}\\times 16b^{2}}=8ab$<br>이때 $a^{2}+16b^{2}=8$이므로<br>$8{\\ge }8ab$<br>$\\therefore \\;ab{\\le }1$ (단, 등호는 $a^{2}=16b^{2}$, 즉 $a=4b$일 때 성립)<br>따라서 구하는 최댓값은 $1$이다.", "k": "num", "a": "1", "q": "양수 $a$, $b$에 대하여 $a^{2}+16b^{2}=8$일 때, $ab$의 최댓값을 구하시오.", "key": "T07-14"}, "x07x20-088": {"id": "x07x20-088", "unit": "07", "theme": "15", "벌": "X07x20", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "$a>0,\\;b>0$에서 $2a>0,\\;3b>0$이므로 산술평균과 기하평균의 관계에 의하여<br>$2a+3b\\ge 2\\sqrt{2a\\times 3b}=2\\sqrt{6ab}$<br>이때 $2a+3b=12$이므로 $12\\ge 2\\sqrt{6ab}$<br>$\\therefore \\;\\sqrt{6ab}\\le 6$<br>양변을 제곱하면 $6ab\\le 36$<br>$\\therefore \\;ab\\le 6\\therefore \\;M=6$<br>한편 등호는 $2a=3b$일 때 성립하므로 $2a+3b=12$에서<br>$2a=3b=6\\therefore \\;a=3,\\;b=2$<br>즉 $\\alpha =3,\\;\\beta =2$이므로<br>$M+\\alpha +\\beta =11$", "k": "num", "a": "11", "q": "$a>0,\\;b>0$이고 $2a+3b=12$일 때, $ab$의 최댓값을 $M,$그때의 $a,\\;b$의 값을 각각 $\\alpha ,\\;\\beta $라 하자. $M+\\alpha +\\beta $의 값을 구하시오.", "key": "T07-15"}, "x07x20-089": {"id": "x07x20-089", "unit": "07", "theme": "15", "벌": "X07x20", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "$x>0,\\;y>0$에서 $2x>0,\\;4y>0$이므로 산술평균과 기하평균의 관계에 의하여<br>$2x+4y\\ge 2\\sqrt{2x\\times 4y}=2\\sqrt{8xy}$<br>이때 $xy=4$이므로<br>$2x+4y\\ge 2\\sqrt{32}=8\\sqrt{2}$ (단, 등호는 $x=2y$일 때 성립)<br>따라서 $2x+4y$의 최솟값은 $8\\sqrt{2}$이다.", "k": "c5", "c": ["$2\\sqrt{2}$", "$4$", "$4\\sqrt{2}$", "$6$", "$8\\sqrt{2}$"], "a": "$8\\sqrt{2}$", "q": "양수 $x,\\;y$에 대하여 $xy=4$일 때, $2x+4y$의 최솟값은?", "key": "T07-15"}, "x07x20-090": {"id": "x07x20-090", "unit": "07", "theme": "15", "벌": "X07x20", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "$a\\ne 0,\\;b\\ne 0$에서 $a^{2}>0,\\;4b^{2}>0$이므로 산술평균과 기하평균의 관계에 의하여<br>$a^{2}+4b^{2}\\ge 2\\sqrt{a^{2}\\times 4b^{2}}=4|\\,ab\\,|$<br>이때 $a^{2}+4b^{2}=32$이므로 $32\\ge 4|\\,ab\\,|,|\\,ab\\,|\\le 8$<br>$\\therefore \\;-8\\le ab\\le 8$<br>  (단, 등호는 $a^{2}=4b^{2},$즉 $|\\,a\\,|=|\\,2b\\,|$일 때 성립)<br>따라서 $ab$의 최댓값은 $8,$ 최솟값은 $-8$이므로 구하는 곱은<br>$8\\times (-8)=-64$", "k": "num", "a": "-64", "q": "$0$이 아닌 실수 $a,\\;b$에 대하여 $a^{2}+4b^{2}=32$일 때, $ab$의 최댓값과 최솟값의 곱을 구하시오.", "key": "T07-15"}, "x07x20-092": {"id": "x07x20-092", "unit": "07", "theme": "15", "벌": "X07x20", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "$x>0,\\;y>0$에서 $xy>0$이므로 산술평균과 기하평균의 관계에 의하여<br>$\\left(x+\\dfrac{4}{y}\\right)\\left(4y+\\dfrac{1}{x}\\right)=4xy+1+16+\\dfrac{4}{xy}$<br>$=17+4xy+\\dfrac{4}{xy}$<br>$\\ge 17+2\\sqrt{4xy\\times \\dfrac{4}{xy}}$<br>$=17+2\\times 4=25$<br>$\\left(\\begin{matrix}\\, \\\\ \\,\\end{matrix}\\right.$단, 등호는 $4xy=\\dfrac{4}{xy},$즉 $xy=1$일 때 성립$\\left.\\begin{matrix}\\, \\\\ \\,\\end{matrix}\\right)$<br>따라서 구하는 최솟값은 $25$이다.", "k": "c5", "c": ["$21$", "$22$", "$23$", "$24$", "$25$"], "a": "$25$", "q": "양수 $x,\\;y$에 대하여 $\\left(x+\\dfrac{4}{y}\\right)\\left(4y+\\dfrac{1}{x}\\right)$의 최솟값은?", "key": "T07-15"}, "x07x20-093": {"id": "x07x20-093", "unit": "07", "theme": "15", "벌": "X07x20", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "$a>0$에서 $a^{2}>0$이므로 산술평균과 기하평균의 관계에 의하여<br>$\\left(a-\\dfrac{3}{a}\\right)\\left(3a-\\dfrac{1}{a}\\right)=3a^{2}-1-9+\\dfrac{3}{a^{2}}$<br>$=-10+3a^{2}+\\dfrac{3}{a^{2}}$<br>$\\ge -10+2\\sqrt{3a^{2}\\times \\dfrac{3}{a^{2}}}$<br>$=-10+2\\times 3=-4$<br>$\\therefore \\;m=-4$<br>한편 등호는 $3a^{2}=\\dfrac{3}{a^{2}}$일 때 성립하므로<br>$a^{4}=1\\therefore \\;a=1\\;(\\because \\;a>0)$<br>즉 $\\alpha =1$이므로 $m+\\alpha =-3$", "k": "num", "a": "-3", "q": "양수 $a$에 대하여 $\\left(a-\\dfrac{3}{a}\\right)\\left(3a-\\dfrac{1}{a}\\right)$의 최솟값을 $m,$그때의 $a$의 값을 $\\alpha $라 할 때, $m+\\alpha $의 값을 구하시오.", "key": "T07-15"}, "x07x20-100": {"id": "x07x20-100", "unit": "07", "theme": "15", "벌": "X07x20", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "$x,\\;y$가 실수이므로 코시-슈바르츠의 부등식에 의하여<br>$(1^{2}+2^{2})(x^{2}+y^{2})\\ge (x+2y)^{2}$<br>이때 $x^{2}+y^{2}=4$이므로 $20\\ge (x+2y)^{2}$<br>$\\therefore \\,-2\\sqrt{5}\\le x+2y\\le 2\\sqrt{5}$ (단, 등호는 $2x=y$일 때 성립)<br>따라서 $x+2y$의 최댓값은 $2\\sqrt{5}$이다.", "k": "c5", "c": ["$\\sqrt{5}$", "$2\\sqrt{5}$", "$3\\sqrt{5}$", "$4\\sqrt{5}$", "$5\\sqrt{5}$"], "a": "$2\\sqrt{5}$", "q": "실수 $x,\\;y$에 대하여 $x^{2}+y^{2}=4$일 때, $x+2y$의 최댓값은?", "key": "T07-15"}, "x07x20-101": {"id": "x07x20-101", "unit": "07", "theme": "15", "벌": "X07x20", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "$x,\\;y$가 실수이므로 코시-슈바르츠의 부등식에 의하여<br>$\\left\\{\\left(\\dfrac{1}{4}\\right)^{2}+\\left(\\dfrac{1}{3}\\right)^{2}\\right\\}(x^{2}+y^{2})\\ge \\left(\\dfrac{x}{4}+\\dfrac{y}{3}\\right)^{2}$<br>이때 $\\dfrac{x}{4}+\\dfrac{y}{3}=5$이므로 $\\dfrac{25}{144}(x^{2}+y^{2})\\ge 25$<br>$\\therefore \\;x^{2}+y^{2}\\ge 144$ (단, 등호는 $4x=3y$일 때 성립)<br>따라서 $x^{2}+y^{2}$의 최솟값은 $144$이다.", "k": "num", "a": "144", "q": "두 실수 $x,\\;y$에 대하여 $\\dfrac{x}{4}+\\dfrac{y}{3}=5$일 때, $x^{2}+y^{2}$의 최솟값을 구하시오.", "key": "T07-15"}, "x07x20-102": {"id": "x07x20-102", "unit": "07", "theme": "15", "벌": "X07x20", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "$x,\\;y$가 실수이므로 코시-슈바르츠의 부등식에 의하여<br>$(3^{2}+2^{2})(x^{2}+y^{2})\\ge (3x+2y)^{2}$<br>이때 $x^{2}+y^{2}=a$이므로 $13a\\ge (3x+2y)^{2}$<br>$\\therefore \\;-\\sqrt{13a}\\le 3x+2y\\le \\sqrt{13a}$ (단, 등호는 $2x=3y$일 때 성립)<br>즉 $3x+2y$의 최댓값과 최솟값이 각각 $\\sqrt{13a},\\;-\\sqrt{13a}$이므로<br>$\\sqrt{13a}-\\left(-\\sqrt{13a}\\right)=13$, $2\\sqrt{13a}=13$<br>$4\\times 13a=13^{2}\\therefore \\;a=\\dfrac{13}{4}$", "k": "num", "a": "13/4", "q": "$x^{2}+y^{2}=a$를 만족하는 실수 $x,\\;y$에 대하여 $3x+2y$의 최댓값과 최솟값의 차가 $13$일 때, 양수 $a$의 값을 구하시오.", "key": "T07-15"}, "x07x30-132": {"id": "x07x30-132", "unit": "07", "theme": "15", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$\\overline{\\mathrm{AB}}=x$, $\\overline{\\mathrm{BC}}=y$라 하면 펜스의 설치 비용은 $\\dfrac{1}{2}x+(x+2y)=\\dfrac{3}{2}x+2y$에 비례한다.<br>또 텃밭의 넓이가 $2700$이므로<br>$xy=2700\\cdots \\cdots $㉠<br>이때 $x>0$, $y>0$이므로 산술평균과 기하평균의 관계에 의하여<br>$\\dfrac{3}{2}x+2y\\ge 2\\sqrt{\\dfrac{3}{2}x\\cdot 2y}$<br>$=2\\sqrt{3}xy\\cdots \\cdots $㉡<br>㉡에서 등호는 $\\dfrac{3}{2}x=2y$, 즉 $y=\\dfrac{3}{4}x$일 때 성립하고 이때 펜스의 설치 비용이 최소가 되므로 ㉠에 $y=\\dfrac{3}{4}x$를 대입하면<br>$x\\cdot \\dfrac{3}{4}x=2700$, $x^{2}=3600$<br>$\\therefore x=60$ ($\\because x>0$)<br>따라서 $\\mathrm{A}$ 지점에서 $\\mathrm{B}$ 지점까지의 펜스의 길이는 $60$이다.", "k": "num", "a": "60", "q": "수한이는 넓이가 $2700$인 텃밭을 만들기 위하여 오른쪽 그림과 같이 직사각형 $\\mathrm{ABCD}$ 모양의 펜스를 설치하려고 한다. 옆 텃밭과 이웃한 $\\mathrm{A}$ 지점에서 $\\mathrm{B}$ 지점까지의 펜스의 설치 비용은 절반씩 나누어 지불하기로 하였다. 펜스의 설치 비용이 최소가 되도록 할 때, $\\mathrm{A}$ 지점에서 $\\mathrm{B}$ 지점까지의 펜스의 길이를 구하시오. (단, 펜스의 설치 비용은 길이에 비례한다.)", "key": "T07-15"}, "x07x30-133": {"id": "x07x30-133", "unit": "07", "theme": "15", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "직선 $\\mathrm{OP}$의 기울기는 $\\dfrac{b}{a}$이므로 점 $\\mathrm{P}$를 지나고 직선 $\\mathrm{OP}$에 수직인 직선의 방정식은<br>$y-b=-\\dfrac{a}{b}(x-a)\\therefore y=-\\dfrac{a}{b}x+\\dfrac{a^{2}}{b}+b$<br>위의 식에 $y=0$을 대입하면<br>$0=-\\dfrac{a}{b}x+\\dfrac{a^{2}}{b}+b\\therefore x=a+\\dfrac{b^{2}}{a}$<br>즉 $\\mathrm{Q}\\left(a+\\dfrac{b^{2}}{a},\\;0\\right)$이므로 $\\triangle OQR$의 넓이는<br>$\\dfrac{1}{2}\\cdot \\left(a+\\dfrac{b^{2}}{a}\\right)\\cdot \\dfrac{1}{b}=\\dfrac{1}{2}\\left(\\dfrac{a}{b}+\\dfrac{b}{a}\\right)$<br>$a>0$, $b>0$이므로 산술평균과 기하평균의 관계에 의하여<br>$\\dfrac{1}{2}\\left(\\dfrac{a}{b}+\\dfrac{b}{a}\\right)\\ge \\dfrac{1}{2}\\cdot 2\\sqrt{\\dfrac{a}{b}\\cdot \\dfrac{b}{a}}$<br>$=1$ (단, 등호는 $a=b$일 때 성립)<br>따라서 $\\triangle OQR$의 넓이의 최솟값은 $1$이다.", "k": "num", "a": "1", "q": "두 양수 $a,\\;b$에 대하여 좌표평면 위의 점 $\\mathrm{P}(a,\\;b)$를 지나고 직선 $\\mathrm{OP}$에 수직인 직선이 $x$축과 만나는 점을 $\\mathrm{Q}$라 하자. 점 $\\mathrm{R}\\left(0,\\;-\\dfrac{1}{b}\\right)$에 대하여 삼각형 $\\mathrm{OQR}$의 넓이의 최솟값을 구하시오.<br>(단, $\\mathrm{O}$는 원점이다.)", "key": "T07-15"}, "x07x30-134": {"id": "x07x30-134", "unit": "07", "theme": "15", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$x,\\;y$가 실수이므로 코시-슈바르츠 부등식에 의하여<br>$(2^{2}+3^{2})(x^{2}+y^{2})\\ge (2x+3y)^{2}$<br>그런데 $x^{2}+y^{2}=52$이므로<br>$13\\cdot 52\\ge (2x+3y)^{2}$, $13^{2}\\cdot 2^{2}\\ge (2x+3y)^{2}$<br>$\\therefore -26\\le 2x+3y\\le 26$<br>등호는 $\\dfrac{x}{2}=\\dfrac{y}{3}$, 즉 $y=\\dfrac{3}{2}x$일 때 성립하므로 $x^{2}+y^{2}=52$에 $y=\\dfrac{3}{2}x$를 대입하면<br>$x^{2}+\\left(\\dfrac{3}{2}x\\right)^{2}=52$, $x^{2}=16$<br>$\\therefore x=\\pm 4$, $y=\\pm 6$ (복호동순)<br>따라서 $2x+3y$는 $x=4$, $y=6$일 때 최댓값 $26$을 가지므로<br>$\\alpha =26$, $\\beta =4$, $\\gamma =6$<br>$\\therefore \\alpha +\\beta +\\gamma =36$", "k": "num", "a": "36", "q": "실수 $x,\\;y$가 $x^{2}+y^{2}=52$를 만족시킬 때, $2x+3y$의 최댓값을 $\\alpha $, 그때의 $x,\\;y$의 값을 각각 $\\beta ,\\;\\gamma $라 하자. 이때 $\\alpha +\\beta +\\gamma $의 값을 구하시오.", "key": "T07-15"}, "x07x30-135": {"id": "x07x30-135", "unit": "07", "theme": "15", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$x,\\;y$가 실수이므로 코시-슈바르츠 부등식에 의하여<br>$(1^{2}+2^{2})(x^{2}+y^{2})\\ge (x+2y)^{2}$<br>그런데 $x^{2}+y^{2}=5$이므로<br>$25\\ge (x+2y)^{2}$<br>$\\therefore -5\\le x+2y\\le 5\\left(\\begin{matrix}\\end{matrix}\\right.$단, 등호는 $x=\\dfrac{y}{2}$일 때 성립$\\left.\\begin{matrix}\\end{matrix}\\right)$<br>따라서 $x+2y$의 최댓값은 $5$, 최솟값은 $-5$이므로 구하는 곱은<br>$5\\cdot (-5)=-25$", "k": "c5", "c": ["$-25$", "$-15$", "$-5$", "$15$", "$25$"], "a": "$-25$", "q": "실수 $x,\\;y$가 $x^{2}+y^{2}=5$를 만족시킬 때, $x+2y$의 최댓값과 최솟값의 곱은?", "key": "T07-15"}, "x07x30-138": {"id": "x07x30-138", "unit": "07", "theme": "15", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$x$, $y$가 실수이므로 코시-슈바르츠 부등식에 의하여<br>$\\left\\{\\left(\\dfrac{1}{\\sqrt{2}}\\right)^{2}+1^{2}\\right\\}\\left\\{\\left(2\\sqrt{2}x\\right)^{2}+y^{2}\\right\\}\\ge (2x+y)^{2}$<br>그런데 $8x^{2}+y^{2}=24$이므로<br>$36\\ge (2x+y)^{2}$<br>이때 $x>0$, $y>0$이므로<br>$0<2x+y\\le 6$ (단, 등호는 $4x=y$일 때 성립) $\\cdots \\cdots $㉠<br>또 코시-슈바르츠 부등식에 의하여<br>$\\left\\{\\left(\\dfrac{1}{\\sqrt{2}}\\right)^{2}+1^{2}\\right\\}\\left\\{\\left(\\sqrt{2x}\\right)^{2}+\\left(\\sqrt{y}\\right)^{2}\\right\\}\\ge \\left(\\sqrt{x}+\\sqrt{y}\\right)^{2}$<br>$\\therefore \\;\\dfrac{3}{2}(2x+y)\\ge \\left(\\sqrt{x}+\\sqrt{y}\\right)^{2}$<br>㉠에서 $0<\\dfrac{3}{2}(2x+y)\\le 9$이므로<br>$\\left(\\sqrt{x}+\\sqrt{y}\\right)^{2}\\le 9$<br>이때 $x>0$, $y>0$이므로<br>$0<\\sqrt{x}+\\sqrt{y}\\le 3$ (단, 등호는 $4x=y$일 때 성립)<br>따라서 $\\sqrt{x}+\\sqrt{y}$의 최댓값은 $3$이다.", "k": "num", "a": "3", "q": "두 양수 $x$, $y$에 대하여 $8x^{2}+y^{2}=24$일 때, $\\sqrt{x}+\\sqrt{y}$의 최댓값을 구하시오.", "key": "T07-15"}, "x07x47-068": {"id": "x07x47-068", "unit": "07", "theme": "15", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "$x,\\;y$가 실수이므로<br>$(4^{2}+3^{2})(x^{2}+y^{2})\\ge (4x+3y)^{2},\\;25^{2}\\ge (4x+3y)^{2}$<br>$\\therefore \\;-25\\le 4x+3y\\le 25$(단, 등호는 $4y=3x$일 때 성립)<br>따라서 구하는 최댓값은 $25$이다.", "k": "c5", "c": ["$20$", "$25$", "$30$", "$35$", "$40$"], "a": "$25$", "q": "실수 $x,\\;y$에 대하여 $x^{2}+y^{2}=25$일 때, $4x+3y$의 최댓값은?", "key": "T07-15"}, "x07x47-069": {"id": "x07x47-069", "unit": "07", "theme": "15", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "$x,\\;y$가 실수이므로<br>$\\left(1^{2}+\\dfrac{1}{4^{2}}\\right)(x^{2}+y^{2})\\ge \\left(x+\\dfrac{y}{4}\\right)^{2},\\;\\dfrac{17}{16}(x^{2}+y^{2})\\ge 17$<br>$\\therefore \\;x^{2}+y^{2}\\ge 16$(단, 등호는 $4y=x$일 때 성립)<br>따라서 구하는 최솟값은 $16$이다.", "k": "num", "a": "16", "q": "실수 $x,\\;y$에 대하여 $x+\\dfrac{y}{4}=\\sqrt{17}$일 때, $x^{2}+y^{2}$의 최솟값을 구하시오.", "key": "T07-15"}, "x07x47-070": {"id": "x07x47-070", "unit": "07", "theme": "15", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "$x,\\;y$가 실수이므로<br>$(2^{2}+3^{2})(x^{2}+y^{2})\\ge (2x+3y)^{2},\\;13a\\ge (2x+3y)^{2}$<br>$\\therefore \\;-\\sqrt{13a}\\le 2x+3y\\le \\sqrt{13a}$<br>(단, 등호는 $2y=3x$일 때 성립)<br>따라서 $2x+3y$의 최댓값은 $\\sqrt{13a}$이므로<br>$\\sqrt{13a}=13\\therefore \\;a=13$", "k": "c5", "c": ["$9$", "$13$", "$15$", "$17$", "$20$"], "a": "$13$", "q": "실수 $x,\\;y$에 대하여 $x^{2}+y^{2}=a$이고 $2x+3y$의 최댓값이 $13$일 때, 양수 $a$의 값은?", "key": "T07-15"}, "x07x47-071": {"id": "x07x47-071", "unit": "07", "theme": "15", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "$x+y+z=2$에서 $y+z=2-x\\cdots \\cdots $ ㉠<br>$x^{2}+y^{2}+z^{2}=4$에서 $y^{2}+z^{2}=4-x^{2}\\cdots \\cdots $ ㉡<br>$y,\\;z$가 실수이므로<br>$(1^{2}+1^{2})(y^{2}+z^{2})\\ge (y+z)^{2}$<br>㉠, ㉡을 대입하면<br>$2(4-x^{2})\\ge (2-x)^{2}$<br>$8-2x^{2}\\ge 4-4x+x^{2},\\;3x^{2}-4x-4\\le 0$<br>$(3x+2)(x-2)\\le 0$<br>$\\therefore \\;-\\dfrac{2}{3}\\le x\\le 2$(단, 등호는 $y=z$일 때 성립)<br>따라서 구하는 최댓값은 $2$이다.", "k": "num", "a": "2", "q": "실수 $x,\\;y,\\;z$에 대하여 $x+y+z=2,\\;x^{2}+y^{2}+z^{2}=4$일 때, $x$의 최댓값을 구하시오.", "key": "T07-15"}, "x07x68-104": {"id": "x07x68-104", "unit": "07", "theme": "15", "벌": "X07x68", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "$x$, $y$가 실수이므로 코시-슈바르츠의 부등식에 의하여<br>$(2^{2}+3^{2})(x^{2}+y^{2}){\\ge }(2x+3y)^{2}$<br>이때 $2x+3y=13$이므로<br>$13(x^{2}+y^{2}){\\ge }13^{2}$<br>$\\therefore \\;x^{2}+y^{2}{\\ge }13$ (단, 등호는 $2y=3x$일 때 성립)<br>따라서 구하는 최솟값은 $13$이다.", "k": "num", "a": "13", "q": "실수 $x$, $y$에 대하여 $2x+3y=13$일 때, $x^{2}+y^{2}$의 최솟값을 구하시오.", "key": "T07-15"}, "x07x68-105": {"id": "x07x68-105", "unit": "07", "theme": "15", "벌": "X07x68", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "$a$, $b$가 실수이므로 코시-슈바르츠의 부등식에 의하여<br>$(1^{2}+3^{2})(a^{2}+b^{2}){\\ge }(a+3b)^{2}$<br>이때 $a^{2}+b^{2}=100$이므로<br>$10\\times 100{\\ge }(a+3b)^{2}$<br>$\\therefore \\;(a+3b)^{2}{\\le }1000$<br>따라서 $(a+3b)^{2}$은 등호가 성립할 때, 즉 $b=3a$일 때 최댓값 $1000$을 갖는다.<br>$a^{2}+b^{2}=100$에 $b=3a$를 대입하면<br>$a^{2}+9a^{2}=100$, $a^{2}=10$<br>$\\therefore \\;a=\\pm \\sqrt{10}$<br>따라서 모든 $a$의 값의 곱은<br>$-\\sqrt{10}\\times \\sqrt{10}=-10$", "k": "num", "a": "-10", "q": "$a^{2}+b^{2}=100$을 만족시키는 실수 $a$, $b$에 대하여 $(a+3b)^{2}$의 값이 최대가 될 때, 모든 $a$의 값의 곱을 구하시오.", "key": "T07-15"}, "x08x40-005": {"id": "x08x40-005", "unit": "08", "theme": "01", "벌": "X08x40", "lvl": 1, "fix": true, "src": "문제집 고쟁이", "w": "$a$의 값의 범위에 따라 다음과 같이 나누어 생각할 수 있다.<br>(ⅰ) $a>0$일 때<br>함수 $f$의 공역과 치역이 모두 집합 $X$가 되려면<br>$f(-2)=-2a+b=-2,\\;f(3)=3a+b=3$<br>이어야 한다.<br>즉, $a=1,\\;b=0$이므로 $a+b=1$<br>(ⅱ) $a<0$일 때<br>함수 $f$의 공역과 치역이 모두 집합 $X$가 되려면<br>$f(-2)=-2a+b=3,\\;f(3)=3a+b=-2$<br>이어야 한다.<br>즉, $a=-1,\\;b=1$이므로 $a+b=0$<br>(ⅰ), (ⅱ)에서 $a+b$의 최솟값은 $0$이다.", "k": "c5", "c": ["$-2$", "$-1$", "$0$", "$1$", "$2$"], "a": "$0$", "q": "집합 $X=\\{x\\,\\left|\\,-2\\le x\\le 3\\right\\}$에 대하여 $X$에서 $X$로의 함수 $f(x)=ax+b$의 공역과 치역이 같을 때, $a+b$의 최솟값은?<br>(단, $a$, $b$는 상수이다.)", "key": "T08-01"}, "x08x40-008": {"id": "x08x40-008", "unit": "08", "theme": "01", "벌": "X08x40", "lvl": 1, "fix": true, "src": "문제집 고쟁이", "w": "$y=x^{2}+2ax+5=(x+a)^{2}+5-a^{2}$에서 이차함수 $y=x^{2}+2ax+5$의 그래프는 꼭짓점이 $(-a,\\;5-a^{2})$이고 아래로 볼록한 포물선이다.<br>이때 치역이 $\\{y\\,\\left|\\,1\\le y\\le b\\right\\}$이므로 $x=-a$에서 최솟값 $1$을 가진다.<br>$5-a^{2}=1,\\;a^{2}=4$에서 $a=2\\,(∵\\,a>0)$<br>즉, 정의역이 $\\{x\\,\\left|\\,-4\\le x\\le 3\\right\\}$이므로<br>이차함수의 축 $x=-2$에서 가장 먼 $x=3$에서 최댓값 $b$를 갖는다.<br>$b=(3+2)^{2}+1=26$<br>$∴\\;a+b=2+26=28$", "k": "c5", "c": ["$20$", "$22$", "$24$", "$26$", "$28$"], "a": "$28$", "q": "이차함수 $y=x^{2}+2ax+5$의 정의역이 $\\{x\\,\\left|\\,-2a\\le x\\le 3\\right\\}$이고 치역이 $\\{y\\,\\left|\\,1\\le y\\le b\\right\\}$일 때, 양수 $a$, $b$에 대하여 $a+b$의 값은?", "key": "T08-01"}, "x08x21-028": {"id": "x08x21-028", "unit": "08", "theme": "01", "벌": "X08x21", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "① $0\\le x\\le 2$에서 $-4\\le -2x\\le 0$<br>$-5\\le -2x-1\\le -1\\therefore \\;-5\\le f(x)\\le -1$<br>② $0\\le x\\le 2$에서 $-2\\le -x\\le 0$<br>$1\\le -x+3\\le 3\\therefore \\;1\\le f(x)\\le 3$<br>③ $0\\le x\\le 2$에서 $-1\\le x-1\\le 1$<br>$\\therefore \\;-1\\le f(x)\\le 1$<br>④ $0\\le x\\le 2$에서 $0\\le |\\,x\\,|\\le 2$<br>$1\\le |\\,x\\,|+1\\le 3\\therefore \\;1\\le f(x)\\le 3$<br>⑤ $0\\le x\\le 2$에서 $0\\le x^{2}\\le 4$<br>$-3\\le x^{2}-3\\le 1\\therefore \\;-3\\le f(x)\\le 1$<br>따라서 $X$에서 $Y$로의 함수인 것은 ③이다.", "k": "c5", "c": ["$f(x)=-2x-1$", "$f(x)=-x+3$", "$f(x)=x-1$", "$f(x)=|\\,x\\,|+1$", "$f(x)=x^{2}-3$"], "a": "$f(x)=x-1$", "q": "두 집합 $X=\\left\\{x\\,\\left|\\,\\right.0\\le x\\le 2\\right\\},\\;Y=\\left\\{y\\,\\left|\\,\\right.-1\\le y\\le 1\\right\\}$에 대하여 다음 중 $X$에서 $Y$로의 함수인 것은?", "key": "T08-01"}, "x08x21-033": {"id": "x08x21-033", "unit": "08", "theme": "01", "벌": "X08x21", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "(ⅰ) $a>0$일 때<br>$f(x)=ax+b$의 공역과 치역이 서로 같으므로<br>$f(-2)=-2,\\;f(3)=3$<br>$-2a+b=-2$, $3a+b=3$<br>$\\therefore \\;a=1,\\;b=0$<br>그런데 $ab=0$이므로 조건을 만족시키지 않는다.<br>(ⅱ) $a<0$일 때<br>$f(x)=ax+b$의 공역과 치역이 서로 같으므로<br>$f(-2)=3,\\;f(3)=-2$<br>$-2a+b=3,\\;3a+b=-2$<br>$\\therefore \\;a=-1,\\;b=1$<br>(ⅰ), (ⅱ)에서 $a=-1,\\;b=1$<br>$\\therefore a-b=-2$", "k": "num", "a": "-2", "q": "집합 $X\\,=\\{x\\,\\left|\\,-2\\le x\\le 3\\right\\}$에 대하여 $X$에서 $X$로의 함수 $f(x)=ax+b$의 공역과 치역이 서로 같을 때, 상수 $a,\\;b$에 대하여 $a-b$의 값을 구하시오. (단, $ab\\ne 0$)", "key": "T08-01"}, "x08x21-034": {"id": "x08x21-034", "unit": "08", "theme": "01", "벌": "X08x21", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "$x^{2}+5x+2=-4$에서 $x^{2}+5x+6=0$<br>$(x+3)(x+2)=0\\therefore \\;x=-3$ 또는 $x=-2$<br>$x^{2}+5x+2=8$에서 $x^{2}+5x-6=0$<br>$(x+6)(x-1)=0\\therefore \\;x=-6$ 또는 $x=1$<br>따라서 정의역의 원소가 될 수 없는 것은 ④이다.", "k": "c5", "c": ["$-6$", "$-3$", "$-2$", "$-1$", "$1$"], "a": "$-1$", "q": "함수 $y=x^{2}+5x+2$의 치역이 $\\left\\{-4,\\;8\\right\\}$일 때, 다음 중 정의역의 원소가 될 수 없는 것은?", "key": "T08-01"}, "x08x21-035": {"id": "x08x21-035", "unit": "08", "theme": "01", "벌": "X08x21", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "$f(-1)=a\\times (-1)^{2}+1=a+1$,<br>$f(0)=a\\times 0^{2}+1=1$,<br>$f(1)=a\\times 1^{2}+1=a+1$,<br>$f(2)=a\\times 2^{2}+1=4a+1$<br>이때 $a=0$이면 치역은 $\\left\\{1\\right\\}$이므로 조건을 만족시키지 않는다.<br>따라서 $a\\ne 0$이므로 함수 $f(x)$의 치역은<br>$\\left\\{a+1,\\;1,\\;4a+1\\right\\}$<br>치역의 모든 원소의 합이 $18$이므로<br>$(a+1)+1+(4a+1)=18$<br>$5a+3=18\\therefore \\;a=3$", "k": "num", "a": "3", "q": "정의역이 $\\left\\{-1,\\;0,\\;1,\\;2\\right\\}$인 함수 $f(x)=ax^{2}+1$의 치역의 모든 원소의 합이 $18$일 때, 상수 $a$의 값을 구하시오.", "key": "T08-01"}, "x08x31-061": {"id": "x08x31-061", "unit": "08", "theme": "01", "벌": "X08x31", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "① $-1\\le x\\le 1$에서 $0\\le x+1\\le 2$<br>$\\therefore \\;0\\le f(x)\\le 2$<br>② $-1\\le x\\le 1$에서 $-2\\le -2x\\le 2$<br>$-1\\le -2x+1\\le 3\\therefore \\;-1\\le f(x)\\le 3$<br>③ $-1\\le x\\le 1$에서 $-2\\le x-1\\le 0$<br>$0\\le |\\,x-1\\,|\\le 2$, $0\\le \\dfrac{1}{2}|\\,x-1\\,|\\le 1$<br>$\\therefore \\;0\\le f(x)\\le 1$<br>④ $-1\\le x\\le 1$에서 $0\\le x^{2}\\le 1$<br>$2\\le x^{2}+2\\le 3\\therefore \\;2\\le f(x)\\le 3$<br>⑤ $-1\\le x\\le 1$에서 $0\\le x+1\\le 2$<br>$0\\le (x+1)^{2}\\le 4$, $-2\\le (x+1)^{2}-2\\le 2$<br>$\\therefore \\;-2\\le f(x)\\le 2$<br>따라서 $X$에서 $Y$로의 함수가 아닌 것은 ⑤이다.", "k": "c5", "c": ["$f(x)=x+1$", "$f(x)=-2x+1$", "$f(x)=\\dfrac{1}{2}|\\,x-1\\,|$", "$f(x)=x^{2}+2$", "$f(x)=(x+1)^{2}-2$"], "a": "$f(x)=(x+1)^{2}-2$", "q": "두 집합 $X=\\left\\{x\\,|\\,-1\\le x\\le 1\\right\\}$, $Y=\\left\\{y\\,|\\,-1\\le y\\le 3\\right\\}$에 대하여 다음 중 $X$에서 $Y$로의 함수가 아닌 것은?", "key": "T08-01"}, "x08x31-070": {"id": "x08x31-070", "unit": "08", "theme": "01", "벌": "X08x31", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "(ⅰ) $a>0$일 때,<br>$f(x)=ax+b$의 공역과 치역이 같으므로<br>$f(-1)=-1$, $f(3)=3$<br>$-a+b=-1$, $3a+b=3$<br>위의 두 식을 연립하여 풀면 $a=1$, $b=0$<br>그런데 $ab=0$이므로 조건을 만족시키지 않는다.<br>(ⅱ) $a<0$일 때,<br>$f(x)=ax+b$의 공역과 치역이 같으므로<br>$f(-1)=3$, $f(3)=-1$<br>$-a+b=3$, $3a+b=-1$<br>위의 두 식을 연립하여 풀면 $a=-1$, $b=2$<br>$\\therefore \\;ab=-2$<br>(ⅰ), (ⅱ)에서 $ab=-2$", "k": "num", "a": "-2", "q": "집합 $X=\\left\\{x\\,|\\,-1\\le x\\le 3\\right\\}$에 대하여 $X$에서 $X$로의 함수 $f(x)=ax+b$의 공역과 치역이 서로 같다. 실수 $a$, $b$에 대하여 $ab$의 값을 구하시오. (단, $ab\\ne 0$)", "key": "T08-01"}, "x08x31-071": {"id": "x08x31-071", "unit": "08", "theme": "01", "벌": "X08x31", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(-1)=k-2$, $f(0)=-2$, $f(1)=k-2$, $f(2)=4k-2$<br>$k=0$이면 치역은 $\\left\\{-2\\right\\}$이므로 모든 원소의 합은 $-2$이다.<br>따라서 $k\\ne 0$이므로 치역은 $\\left\\{k-2,\\;-2,\\;4k-2\\right\\}$이다.<br>이때 치역의 모든 원소의 합이 $9$이므로<br>$k-2+(-2)+4k-2=9$<br>$5k=15\\therefore \\;k=3$", "k": "num", "a": "3", "q": "정의역이 $\\left\\{-1,\\;0,\\;1,\\;2\\right\\}$인 함수 $f(x)=kx^{2}-2$의 치역의 모든 원소의 합이 $9$일 때, 상수 $k$의 값을 구하시오.", "key": "T08-01"}, "x08x31-074": {"id": "x08x31-074", "unit": "08", "theme": "01", "벌": "X08x31", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(x)=x^{2}-2ax+7$이라 하면 $f(x)=(x-a)^{2}+7-a^{2}$이므로 정의역이 $\\left\\{x\\,|\\,a\\le x\\le 3\\right\\}$, 치역이 $\\left\\{y\\,|\\,6\\le y\\le b\\right\\}$이려면<br>$f(a)=6$, $f(3)=b$<br>$f(a)=6$에서 $7-a^{2}=6$, $a^{2}=1$<br>$\\therefore \\;a=1(\\because \\;a>0)$<br>$f(3)=b$에서 $b=3^{2}-2\\cdot 1\\cdot 3+7=10$<br>$\\therefore \\;a+b=11$", "k": "c5", "c": ["$11$", "$12$", "$13$", "$14$", "$15$"], "a": "$11$", "q": "함수 $y=x^{2}-2ax+7$의 정의역이 $\\left\\{x\\,|\\,a\\le x\\le 3\\right\\}$이고 치역이 $\\left\\{y\\,|\\,6\\le y\\le b\\right\\}$일 때, 양수 $a$, $b$에 대하여 $a+b$의 값은?", "key": "T08-01"}, "x08x69-009": {"id": "x08x69-009", "unit": "08", "theme": "01", "벌": "X08x69", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "$f(-1)=a-1,\\;f(0)=-1,\\;f(2)=4a-1$이므로<br>$a-1+(-1)+4a-1=12,\\;5a=15$<br>$\\therefore \\;a=3$", "k": "num", "a": "3", "q": "집합 $X=\\left\\{-1,\\;0,\\;2\\right\\}$를 정의역으로 하는 함수 $f(x)=ax^{2}-1$의 치역의 모든 원소의 합이 $12$일 때, 상수 $a$의 값을 구하시오.", "key": "T08-01"}, "x08x69-010": {"id": "x08x69-010", "unit": "08", "theme": "01", "벌": "X08x69", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "$1$의 양의 약수는 $1$의 $1$개이므로<br>$f(1)=1$<br>$2^{2}=4$의 양의 약수는 $1,\\;2,\\;4$의 $3$개이므로<br>$f(2)=3$<br>$3^{2}=9$의 양의 약수는 $1,\\;3,\\;9$의 $3$개이므로<br>$f(3)=3$<br>$4^{2}=16$의 양의 약수는 $1,\\;2,\\;4,\\;8,\\;16$의 $5$개이므로<br>$f(4)=5$<br>$5^{2}=25$의 양의 약수는 $1,\\;5,\\;25$의 $3$개이므로<br>$f(5)=3$<br>따라서 함수 $f$의 치역은 $\\left\\{1,\\;3,\\;5\\right\\}$이므로 치역의 모든 원소의 합은<br>$1+3+5=9$", "k": "num", "a": "9", "q": "집합 $X=\\left\\{1,\\;2,\\;3,\\;4,\\;5\\right\\}$에 대하여 함수 $f\\,:\\,X\\,\\rightarrow \\,X$를 $f(x)=(x^{2}$의 양의 약수의 개수$)$로 정의할 때, 함수 $f$의 치역의 모든 원소의 합을 구하시오.", "key": "T08-01"}, "x08x21-030": {"id": "x08x21-030", "unit": "08", "theme": "02", "벌": "X08x21", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "$f(-2)=3\\times (-2)-3=-9$<br>$f(3)=-3+5=2$<br>$\\therefore \\;f(-2)+f(3)=-9+2=-7$", "k": "num", "a": "-7", "q": "실수 전체의 집합에서 정의된 함수 $f$가<br> $f(x)={\\begin{cases}-x+5 & \\;(x\\ge 2) \\\\ 3x-3 & \\;(x<2)\\end{cases}}$<br>일 때, $f(-2)+f(3)$의 값을 구하시오.", "key": "T08-02"}, "x08x21-032": {"id": "x08x21-032", "unit": "08", "theme": "02", "벌": "X08x21", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "$f(2)=2-1=1$<br>$f(18)=f(15)=\\,\\cdots \\,=f(3)=3-1=2$<br>$\\therefore \\;f(2)+f(18)=1+2=3$", "k": "num", "a": "3", "q": "음이 아닌 정수 전체의 집합에서 정의된 함수 $f(x)$가<br> $f(x)={\\begin{cases}x-1 & \\;(0\\le x\\le 3) \\\\ f(x-3) & \\;(x>3)\\end{cases}}$<br>일 때, $f(2)+f(18)$의 값을 구하시오.", "key": "T08-02"}, "x08x31-062": {"id": "x08x31-062", "unit": "08", "theme": "02", "벌": "X08x31", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(3)=3+1=4$<br>$f(29)=f(29-4)=f(25-4)=\\,\\cdots \\,=f(5-4)=f(1)=1+1=2$<br>$\\therefore \\;f(3)+f(29)=6$", "k": "num", "a": "6", "q": "음이 아닌 정수 전체의 집합에서 정의된 함수 $f(x)$가<br> $f(x)={\\begin{cases}x+1 & \\;(0\\le x\\le 4) \\\\ f(x-4) & \\;(x>4)\\end{cases}}$<br>일 때, $f(3)+f(29)$의 값을 구하시오.", "key": "T08-02"}, "x08x31-063": {"id": "x08x31-063", "unit": "08", "theme": "02", "벌": "X08x31", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$\\dfrac{x+1}{3}=2$에서 $x+1=6\\therefore \\;x=5$<br>따라서 $f\\left(\\dfrac{x+1}{3}\\right)=x^{2}-5$에 $x=5$를 대입하면<br>$f(2)=5^{2}-5=20$", "k": "c5", "c": ["$17$", "$18$", "$19$", "$20$", "$21$"], "a": "$20$", "q": "함수 $f(x)$에 대하여 $f\\left(\\dfrac{x+1}{3}\\right)=x^{2}-5$일 때, $f(2)$의 값은?", "key": "T08-02"}, "x08x31-066": {"id": "x08x31-066", "unit": "08", "theme": "02", "벌": "X08x31", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$x^{2025}=(x^{2024}-x)x+x^{2}$이므로 $x^{2025}$을 $x^{2024}-x$로 나누었을 때의 나머지는 $x^{2}$이다.<br>즉 $f(x)=x^{2}$이므로<br>$f(2)+f(3)+f(4)+\\,\\cdots \\,+f(10)$<br>$=4+9+16+25+36+49+64+81+100$<br>$=384$", "k": "num", "a": "384", "q": "$1$보다 큰 자연수 전체의 집합에서 정의된 함수 $f(x)$가<br> $f(x)=(x^{2025}$을 $x^{2024}-x$로 나누었을 때의 나머지$)$<br>일 때, $f(2)+f(3)+f(4)+\\,\\cdots \\,+f(10)$의 값을 구하시오.", "key": "T08-02"}, "x08x31-067": {"id": "x08x31-067", "unit": "08", "theme": "02", "벌": "X08x31", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "주어진 식의 양변에 $x=1$, $y=1$을 대입하면<br>$f(1+1)=f(1)f(1)=2\\cdot 2=4\\therefore \\;f(2)=4$<br>주어진 식의 양변에 $x=1$, $y=2$를 대입하면<br>$f(1+2)=f(1)f(2)=2\\cdot 4=8\\therefore \\;f(3)=8$<br>주어진 식의 양변에 $x=1$, $y=3$을 대입하면<br>$f(1+3)=f(1)f(3)=2\\cdot 8=16\\therefore \\;f(4)=16$<br>주어진 식의 양변에 $x=3$, $y=4$을 대입하면<br>$f(3+4)=f(3)f(4)=8\\cdot 16=128$ <br>$\\therefore \\;f(7)=128$", "k": "c5", "c": ["$32$", "$64$", "$128$", "$256$", "$512$"], "a": "$128$", "q": "임의의 실수 $x$, $y$에 대하여 함수 $f$가<br> $f(x+y)=f(x)f(y)$<br>를 만족시키고 $f(1)=2$일 때, $f(7)$의 값은?", "key": "T08-02"}, "x08x31-068": {"id": "x08x31-068", "unit": "08", "theme": "02", "벌": "X08x31", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(252)=f(2^{2}\\cdot 3^{2}\\cdot 7)=f(2^{2}\\cdot 3^{2})+f(7)$<br>$=f(2^{2})+f(3^{2})+f(7)$<br>$=2f(2)+2f(3)+f(7)$<br>$=2\\cdot 2+2\\cdot 3+7=17$", "k": "num", "a": "17", "q": "$2$ 이상의 자연수 전체의 집합에서 정의된 함수 $f$가 다음 조건을 모두 만족시킬 때, $f(252)$의 값을 구하시오.<br>(가) $p$가 소수이면 $f(p)=p$이다.<br>(나) $2$ 이상의 두 자연수 $m$, $n$에 대하여 $f(mn)=f(m)+f(n)$이다.", "key": "T08-02"}, "x08x48-008": {"id": "x08x48-008", "unit": "08", "theme": "02", "벌": "X08x48", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "주어진 식의 양변에 $a=1,\\;b\\,=1$을 대입하면<br>$f(1)=f(1)+f(1)\\;\\therefore \\;f(1)=0$<br>주어진 식의 양변에 $a=6,\\;b=\\dfrac{1}{6}$을 대입하면<br>$f(1)=f(6)+f\\left(\\dfrac{1}{6}\\right),\\;0=2+f\\left(\\dfrac{1}{6}\\right)$<br>$\\therefore \\;f\\left(\\dfrac{1}{6}\\right)=-2$", "k": "c5", "c": ["$-2$", "$-1$", "$0$", "$1$", "$2$"], "a": "$-2$", "q": "임의의 양수 $a,\\;b$에 대하여 함수 $f$가<br> $f(ab)=f(a)+f(b)$<br>를 만족시키고 $f(6)=2$일 때, $f\\left(\\dfrac{1}{6}\\right)$의 값은?", "key": "T08-02"}, "x08x40-006": {"id": "x08x40-006", "unit": "08", "theme": "03", "벌": "X08x40", "lvl": 1, "fix": true, "src": "문제집 고쟁이", "w": "정의역이 $\\left\\{-1,\\;0,\\;1\\right\\}$인 두 함수 $f$, $g$가 서로 같은 함수이려면<br>$f(-1)=g(-1)$, $f(0)=g(0)$, $f(1)=g(1)$<br>을 모두 만족시켜야 한다.<br>ㄱ. $f(-1)=g(-1)=1$, $f(0)=g(0)=0$, $f(1)=g(1)=1$이므로 $f=g$이다.<br>ㄴ. $f(1)=1$, $g(1)=3$에서 $f(1)\\ne g(1)$이므로 $f\\ne g$이다.<br>ㄷ. $f(-1)=g(-1)=2$, $f(0)=g(0)=1$, $f(1)=g(1)=0$이므로 $f=g$이다.<br>따라서 두 함수 $f$, $g$가 서로 같은 함수인 것은 ㄱ, ㄷ이다.", "k": "c5", "c": ["ㄱ", "ㄴ", "ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ"], "a": "ㄱ, ㄷ", "q": "보기에서 정의역이 $\\left\\{-1,\\;0,\\;1\\right\\}$인 두 함수 $f$, $g$가 서로 같은 함수인 것만을 있는 대로 고른 것은?<br><b><보기><\/b><br>ㄱ. $f(x)=|\\,x\\,|$, $g(x)=x^{2}$<br>ㄴ. $f(x)=2-x$, $g(x)=x+2$<br>ㄷ. $f(x)=1-x^{3}$, $g(x)=1-x$", "key": "T08-03"}, "x08x40-007": {"id": "x08x40-007", "unit": "08", "theme": "03", "벌": "X08x40", "lvl": 1, "fix": true, "src": "문제집 고쟁이", "w": "정의역이 $\\left\\{1,\\;2\\right\\}$인 두 함수 $f(x)=ax-1$, $g(x)=x^{2}+b$가 서로 같으려면 $f(1)=g(1)$, $f(2)=g(2)$이어야 한다.<br>$f(1)=a-1$, $g(1)=1+b$이므로<br>$a-1=1+b$에서 $a-b=2\\cdots \\cdots $㉠<br>$f(2)=2a-1$, $g(2)=4+b$이므로<br>$2a-1=4+b$에서 $2a-b=5\\cdots \\cdots $㉡<br>㉠, ㉡을 연립하여 풀면 $a=3$, $b=1$<br>$\\therefore a+b=3+1=4$", "k": "c5", "c": ["$1$", "$2$", "$3$", "$4$", "$5$"], "a": "$4$", "q": "정의역이 $\\left\\{1,\\;2\\right\\}$인 두 함수<br> $f(x)=ax-1$, $g(x)=x^{2}+b$<br>에 대하여 $f=g$일 때, 두 상수 $a$, $b$의 합 $a+b$의 값은?", "key": "T08-03"}, "x08x21-037": {"id": "x08x21-037", "unit": "08", "theme": "03", "벌": "X08x21", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "$f(-1)=g(-1)$에서<br>$3+1-1=-a+b\\therefore \\;a-b=-3\\cdots \\cdots $㉠<br>$f(1)=g(1)$에서<br>$3-1-1=a+b\\therefore \\;a+b=1\\cdots \\cdots $㉡<br>㉠, ㉡을 연립하여 풀면 $a=-1,\\;b=2$<br>$\\therefore \\;ab=-2$", "k": "num", "a": "-2", "q": "집합 $X=\\left\\{-1,\\;1\\right\\}$을 정의역으로 하는 두 함수 $f(x)=3x^{2}-x-1,g(x)=ax+b$에 대하여 $f=g$일 때, $ab$의 값을 구하시오. (단, $a,\\,b$는 상수이다.)", "key": "T08-03"}, "x08x21-040": {"id": "x08x21-040", "unit": "08", "theme": "03", "벌": "X08x21", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "$f(x)=g(x)$에서 $x^{3}-3x+9=4x+3$<br>$x^{3}-7x+6=0,\\;(x+3)(x-1)(x-2)=0$<br>$\\therefore \\;x=-3$ 또는 $x=1$ 또는 $x=2$<br>이때 집합 $X$의 모든 원소가 양수이므로 $X$는 집합 $\\left\\{1,\\;2\\right\\}$의 공집합이 아닌 부분집합이다.<br>따라서 구하는 집합 $X$의 개수는<br>$2^{2}-1=3$", "k": "num", "a": "3", "q": "공집합이 아닌 집합 $X$의 모든 원소는 양수이다. 집합 $X$를 정의역으로 하는 두 함수 $f(x)=x^{3}-3x+9,\\;g(x)=4x+3$에 대하여 $f=g$가 되도록 하는 집합 $X$의 개수를 구하시오.", "key": "T08-03"}, "x08x31-075": {"id": "x08x31-075", "unit": "08", "theme": "03", "벌": "X08x31", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(-1)=g(-1)$에서 $-a+b=-5\\cdots \\cdots $㉠<br>$f(1)=g(1)$에서 $a+b=1\\cdots \\cdots $㉡<br>㉠, ㉡을 연립하여 풀면 $a=3$, $b=-2$<br>$\\therefore \\;ab=-6$", "k": "c5", "c": ["$-8$", "$-7$", "$-6$", "$-5$", "$-4$"], "a": "$-6$", "q": "집합 $X=\\left\\{-1,\\;1\\right\\}$을 정의역으로 하는 두 함수<br> $f(x)=ax+b$, $g(x)=-x^{2}+3x-1$<br>에 대하여 $f=g$일 때, $ab$의 값은? (단, $a$, $b$는 상수이다.)", "key": "T08-03"}, "x08x48-012": {"id": "x08x48-012", "unit": "08", "theme": "03", "벌": "X08x48", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "두 함수 $f$와 $g$가 서로 같으려면<br>$f(0)=g(0),\\;f(1)=g(1),\\;f(2)=g(2)$<br>$f(0)=g(0),\\;f(2)=g(2)$에서 $3=a+b\\cdots \\cdots $㉠<br>$f(1)=g(1)$에서 $2-4+3=b\\therefore \\;b=1$<br>이를 ㉠에 대입하여 풀면 $a=2$<br>$\\therefore \\;2a-b=4-1=3$", "k": "c5", "c": ["$-3$", "$-1$", "$1$", "$3$", "$5$"], "a": "$3$", "q": "두 집합 $X=\\left\\{0,\\;1,\\;2\\right\\},\\;Y=\\left\\{1,\\;2,\\;3,\\;4\\right\\}$에 대하여 두 함수 $f\\,:\\,X\\;\\rightarrow \\;Y,\\;g\\,:\\,X\\;\\rightarrow \\;Y$를<br> $f(x)=2x^{2}-4x+3,\\;g(x)=a|\\,x-1\\,|+b$<br>라 하자. 두 함수 $f$와 $g$가 서로 같도록 하는 상수 $a,\\;b$에 대하여 $2a-b$의 값은?", "key": "T08-03"}, "x08x69-012": {"id": "x08x69-012", "unit": "08", "theme": "03", "벌": "X08x69", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "$f=g$에서 $f(0)=g(0),\\;f(1)=g(1)$<br>$f(0)=g(0)$에서<br>$b=a\\cdots \\cdots $㉠<br>$f(1)=g(1)$에서<br>$a+b=1+a\\;\\therefore \\;b=1$<br>이를 ㉠에 대입하면<br>$a=1$<br>$\\therefore \\;ab=1\\times 1=1$", "k": "num", "a": "1", "q": "집합 $X=\\left\\{0,\\;1\\right\\}$을 정의역으로 하는 두 함수 $f(x)=ax+b$, $g(x)=x^{3}+a$에 대하여 $f=g$일 때, 상수 $a,\\;b$에 대하여 $ab$의 값을 구하시오.", "key": "T08-03"}, "x08x69-013": {"id": "x08x69-013", "unit": "08", "theme": "03", "벌": "X08x69", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "$f=g$에서 $f(-3)=g(-3),\\;f(0)=g(0),\\;f(3)=g(3)$<br>$f(-3)=g(-3),\\;f(3)=g(3)$에서<br>$17=3a+b\\cdots \\cdots $㉠<br>$f(0)=g(0)$에서 $b=-1$<br>이를 ㉠에 대입하면<br>$3a-1=17,\\;3a=18\\;\\therefore \\;a=6$<br>$\\therefore \\;a+b=6+(-1)=5$", "k": "num", "a": "5", "q": "집합 $X=\\left\\{-3,\\;0,\\;3\\right\\}$을 정의역으로 하는 두 함수 $f(x)=2x^{2}-1$, $g(x)=a|\\,x\\,|+b$에 대하여 $f=g$일 때, 상수 $a,\\;b$에 대하여 $a+b$의 값을 구하시오.", "key": "T08-03"}, "x08x69-014": {"id": "x08x69-014", "unit": "08", "theme": "03", "벌": "X08x69", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "$f(x)=g(x)$이어야 하므로<br>$2x^{2}-2=x^{3}-x,\\;x^{3}-2x^{2}-x+2=0$<br>$(x+1)(x-1)(x-2)=0$<br>$\\therefore \\;x=-1$ 또는 $x=1$ 또는 $x=2$<br>따라서 집합 $X$는 집합 $\\left\\{-1,\\;1,\\;2\\right\\}$의 공집합이 아닌 부분집합이므로 구하는 집합 $X$의 개수는<br>$2^{3}-1=7$", "k": "num", "a": "7", "q": "집합 $X$를 정의역으로 하는 두 함수 $f(x)=2x^{2}-2$, $g(x)=x^{3}-x$에 대하여 $f=g$가 되도록 하는 집합 $X$의 개수를 구하시오. (단, $X\\ne \\varnothing $)", "key": "T08-03"}, "x08x40-012": {"id": "x08x40-012", "unit": "08", "theme": "04", "벌": "X08x40", "lvl": 1, "fix": true, "src": "문제집 고쟁이", "w": "① 함수 $f$가 일대일함수일 때, 공역과 치역이 같으면 함수 $f$는 일대일대응이다.<br>(참)<br>② 함수 $f$가 상수함수이면 치역 $\\{f(x)\\,\\left|\\,x\\in X\\right\\}$의 원소의 개수는 $1$이다. (참)<br>③ 함수 $f$가 항등함수이면 $f(x)=x$이므로 함수 $f$의 치역은 정의역과 같다.<br>(참)<br>④ 함수 $f$의 정의역의 임의의 두 원소 $x_{1}$, $x_{2}$에 대하여 $f(x_{1})=f(x_{2})$일 때 $x_{1}=x_{2}$이면 함수 $f$는 일대일함수이다.<br>이때 함수 $f$의 치역과 공역이 같지 않을 수 있으므로 함수 $f$가 반드시 일대일대응인 것은 아니다. (거짓)<br>⑤ $n(X)=n(Y)$이고, (공역)$=$(치역)  $\\cdots \\cdots $㉠<br>이면 정의역과 치역의 원소의 개수가 같으므로 함수 $f$는 일대일함수이고, ㉠에 의하여 일대일대응이다. (참)<br>따라서 옳지 않은 것은 ④이다.", "k": "c5", "c": ["함수 $f$가 일대일함수일 때, 공역과 치역이 같으면 함수 $f$는 일대일대응이다.", "함수 $f$가 상수함수이면 집합 $\\left\\{f(x)|x\\in X\\right\\}$의 원소의 개수는 $1$이다.", "함수 $f$가 항등함수이면 함수 $f$의 치역은 정의역과 같다.", "함수 $f$의 정의역의 임의의 두 원소 $x_{1}$, $x_{2}$에 대하여 $f(x_{1})=f(x_{2})$일 때 $x_{1}=x_{2}$이면 함수 $f$는 일대일대응이다.", "$n(X)=n(Y)$이고, 공역과 치역이 같으면 함수 $f$는 일대일대응이다."], "a": "함수 $f$의 정의역의 임의의 두 원소 $x_{1}$, $x_{2}$에 대하여 $f(x_{1})=f(x_{2})$일 때 $x_{1}=x_{2}$이면 함수 $f$는 일대일대응이다.", "q": "함수 $f\\,:\\,X\\;\\to \\;Y$에 대한 다음 설명 중 옳지 않은 것은?<br>(단, $X$, $Y$는 유한집합이다.)", "key": "T08-04"}, "x08x21-045": {"id": "x08x21-045", "unit": "08", "theme": "04", "벌": "X08x21", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "$f(x)=x^{2}+4x+k=(x+2)^{2}+k-4$<br>이므로 $x\\ge -2$일 때 $x$의 값이 증가하면 $f(x)$의 값도 증가한다.<br>따라서 함수 $f$가 일대일대응이면 $f(-1)=5$이므로<br>$1-4+k=5\\therefore \\;k=8$", "k": "num", "a": "8", "q": "두 집합 $X=\\left\\{x\\,\\left|\\,x\\ge -1\\right\\},\\;Y=\\left\\{y\\,\\left|\\,y\\ge 5\\right\\}\\right.\\right.$에 대하여 $X$에서 $Y$로의 함수 $f(x)=x^{2}+4x+k$가 일대일대응일 때, 상수 $k$의 값을 구하시오.", "key": "T08-04"}, "x08x21-046": {"id": "x08x21-046", "unit": "08", "theme": "04", "벌": "X08x21", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "함수 $f(x)$가 일대일대응이 되려면 $x\\ge 1$일 때와 $x<1$일 때의 직선 $y=f(x)$의 기울기의 부호가 서로 같아야 한다.<br>즉 $(3-a)(2+a)>0$이므로<br>$(a+2)(a-3)<0\\therefore \\;-2<a<3$<br>따라서 정수 $a$는 $-1,\\;0,\\;1,\\;2$의 $4$개이다.", "k": "num", "a": "4", "q": "정의역과 공역이 모두 실수 전체의 집합인 함수<br> $f(x)={\\begin{cases}(3-a)x+a-1 & \\;(x\\ge 1) \\\\ (2+a)x-a & \\;(x<1)\\end{cases}}$<br>가 일대일대응이 되도록 하는 정수 $a$의 개수를 구하시오.", "key": "T08-04"}, "x08x21-047": {"id": "x08x21-047", "unit": "08", "theme": "04", "벌": "X08x21", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "$f(x)=x^{2}-6x=(x-3)^{2}-9$<br>함수 $f$가 일대일대응이 되려면 $x\\ge k$일 때 $x$의 값이 증가하면 $f(x)$의 값도 증가해야 하므로<br>$k\\ge 3\\cdots \\cdots $㉠<br>또 치역과 공역이 같아야 하므로 $f(k)=k$<br>$k^{2}-6k=k,\\;k^{2}-7k=0$<br>$k(k-7)=0\\therefore \\;k=0$ 또는 $k=7\\cdots \\cdots $㉡<br>㉠, ㉡에서 $k=7$", "k": "c5", "c": ["$4$", "$5$", "$6$", "$7$", "$8$"], "a": "$7$", "q": "집합 $X=\\left\\{x\\,\\left|\\,x\\ge k\\right\\}\\right.$에 대하여 $X$에서 $X$로의 함수 $f(x)=x^{2}-6x$가 일대일대응이 되도록 하는 실수 $k$의 값은?", "key": "T08-04"}, "x08x31-082": {"id": "x08x31-082", "unit": "08", "theme": "04", "벌": "X08x31", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$a>0$이므로 함수 $f$가 일대일대응이려면<br>$f(-3)=1$, $f(3)=13$<br>$-3a+b=1$, $3a+b=13$<br>위의 두 식을 연립하여 풀면 $a=2$, $b=7$<br>$\\therefore \\;a+b=9$", "k": "c5", "c": ["$6$", "$7$", "$8$", "$9$", "$10$"], "a": "$9$", "q": "두 집합 $X=\\left\\{x\\,|\\,-3\\le x\\le 3\\right\\}$, $Y=\\left\\{y\\,|\\,1\\le y\\le 13\\right\\}$에 대하여 $X$에서 $Y$로의 함수 $f(x)=ax+b(a>0)$가 일대일대응일 때, $a+b$의 값은? (단, $a$, $b$는 상수이다.)", "key": "T08-04"}, "x08x31-084": {"id": "x08x31-084", "unit": "08", "theme": "04", "벌": "X08x31", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(x)=x^{2}-4x-1=(x-2)^{2}-5$이므로 함수 $f$가 일대일대응이려면 $a\\ge 2$이어야 한다.<br>이때 함수 $f$의 치역이 $\\left\\{y\\,|\\,y\\ge f(a)\\right\\}$이므로 $b=f(a)$에서<br>$a-b=a-f(a)$<br>$=a-(a^{2}-4a-1)$<br>$=-a^{2}+5a+1$<br>$=-\\left(a-\\dfrac{5}{2}\\right)^{2}+\\dfrac{29}{4}(a\\ge 2)$<br>따라서 $a-b$는 $a=\\dfrac{5}{2}$일 때 최댓값 $\\dfrac{29}{4}$를 갖는다.", "k": "num", "a": "29/4", "q": "두 집합 $X=\\left\\{x\\,|\\,x\\ge a\\right\\}$, $Y=\\left\\{y\\,|\\,y\\ge b\\right\\}$에 대하여 $X$에서 $Y$로의 함수 $f(x)=x^{2}-4x-1$이 일대일대응일 때, $a-b$의 최댓값을 구하시오. (단, $a$, $b$는 실수이다.)", "key": "T08-04"}, "x08x40-054": {"id": "x08x40-054", "unit": "08", "theme": "04", "벌": "X08x40", "lvl": 2, "fix": true, "src": "문제집 고쟁이", "w": "함수 $f(x)$가 일대일대응이고 $f(0)=-2$이므로<br>$f(-2)=0,\\;f(2)=2$ 또는 $f(-2)=2,\\;f(2)=0$이다.<br>(ⅰ) $f(-2)=0,\\;f(2)=2$일 때<br>$f(-2)=4a-2b-2=0\\cdots \\cdots $㉠<br>$f(2)=4a+2b-2=2\\cdots \\cdots $㉡<br>㉠, ㉡에서 $a=\\dfrac{3}{4},\\;b=\\dfrac{1}{2}$<br>(ⅱ) $f(-2)=2,\\;f(2)=0$일 때<br>$f(-2)=4a-2b-2=2\\cdots \\cdots $㉢<br>$f(2)=4a+2b-2=0\\cdots \\cdots $㉣<br>㉢, ㉣에서 $a=\\dfrac{3}{4},\\;b=-\\dfrac{1}{2}$<br>(ⅰ), (ⅱ) 에 의하여<br>$4(|\\,a\\,|+|\\,b\\,|)=5$", "k": "c5", "c": ["$1$", "$2$", "$3$", "$4$", "$5$"], "a": "$5$", "q": "집합 $X=\\left\\{-2,\\;0,\\;2\\right\\}$에 대하여 $X$에서 $X$로의 함수 $f(x)=ax^{2}+bx-2$가 일대일대응일 때, $4(|\\,a\\,|+|\\,b\\,|)$의 값은?<br>(단, $a$, $b$는 상수이다.)", "key": "T08-04"}, "x08x48-022": {"id": "x08x48-022", "unit": "08", "theme": "04", "벌": "X08x48", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "일대일대응이려면 $x<0,\\;x\\ge 0$일 때의 직선의 기울기의 부호가 서로 같아야 한다.<br>따라서 두 직선의 기울기의 곱은 항상 양수이므로<br>$(a+3)(2-a)>0,\\;(a+3)(a-2)<0$<br>$\\therefore \\;-3<a<2$<br>따라서 정수 $a$는 $-2,\\;-1,\\;0,\\;1$의 $4$개이다.", "k": "c5", "c": ["$1$", "$2$", "$3$", "$4$", "$5$"], "a": "$4$", "q": "실수 전체의 집합에서 정의된 함수<br> $f(x)={\\begin{cases}(a+3)x+1 & \\;(x<0) \\\\ (2-a)x+1 & \\;(x\\ge 0)\\end{cases}}$<br>이 일대일대응이 되도록 하는 모든 정수 $a$의 개수는?", "key": "T08-04"}, "x08x48-024": {"id": "x08x48-024", "unit": "08", "theme": "04", "벌": "X08x48", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "$f(x)=x^{2}-6x+12=(x-3)^{2}+3$<br>함수 $f$가 일대일대응이려면<br>$a\\ge 3,\\;f(a)=a$<br>$f(a)=a$에서 $a^{2}-6a+12=a,\\;a^{2}-7a+12=0$<br>$(a-3)(a-4)=0\\therefore \\;a=3$ 또는 $a=4$<br>따라서 모든 $a$의 값의 합은 $3+4=7$", "k": "c5", "c": ["$3$", "$4$", "$5$", "$6$", "$7$"], "a": "$7$", "q": "집합 $X=\\left\\{x\\,\\left|\\,x\\ge a\\right\\}\\right.$에 대하여 $X$에서 $X$로의 함수 $f(x)=x^{2}-6x+12$가 일대일대응일 때, 모든 상수 $a$의 값의 합은?", "key": "T08-04"}, "x08x21-048": {"id": "x08x21-048", "unit": "08", "theme": "05", "벌": "X08x21", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "함수 $f$는 항등함수이므로 $f(2)=2,\\;f(10)=10$<br>$f(2)+g(2)=6$에서<br>$2+g(2)=6\\therefore \\;g(2)=4$<br>함수 $g$는 상수함수이므로 $g(10)=g(2)=4$<br>$\\therefore \\;f(10)+g(10)=10+4=14$", "k": "num", "a": "14", "q": "실수 전체의 집합에서 정의된 두 함수 $f,\\;g$에 대하여 함수 $f$는 항등함수이고, 함수 $g$는 상수함수이다. $f(2)+g(2)=6$일 때, $f(10)+g(10)$의 값을 구하시오.", "key": "T08-05"}, "x08x21-051": {"id": "x08x21-051", "unit": "08", "theme": "05", "벌": "X08x21", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "함수 $g$는 항등함수이므로<br>$g(4)=4,\\;g(8)=8$<br>$f(8)=g(4)=h(2)$에서 $f(8)=h(2)=4$<br>$f(8)f(2)=f(4)$에서 $4f(2)=f(4)$<br>이때 함수 $f$는 일대일대응이므로<br>$f(2)=2,\\;f(4)=8$<br>또 함수 $h$는 상수함수이므로<br>$h(4)=h(2)=4$<br>$\\therefore \\;f(2)+g(8)+h(4)=2+8+4=14$", "k": "num", "a": "14", "q": "집합 $X=\\left\\{2,\\;4,\\;8\\right\\}$에 대하여 $X$에서 $X$로의 세 함수 $f,\\;g,\\;h$는 각각 일대일대응, 항등함수, 상수함수이고<br> $f(8)=g(4)=h(2),\\;f(8)f(2)=f(4)$<br>일 때, $f(2)+g(8)+h(4)$의 값을 구하시오.", "key": "T08-05"}, "x08x31-086": {"id": "x08x31-086", "unit": "08", "theme": "05", "벌": "X08x31", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "함수 $f$는 항등함수이므로 $f(2)=2$, $f(5)=5$<br>$f(2)+g(-1)=5$이므로<br>$2+g(-1)=5\\therefore \\;g(-1)=3$<br>함수 $g$는 상수함수이므로 $g(4)=g(-1)=3$<br>$\\therefore \\;f(5)+g(4)=8$", "k": "num", "a": "8", "q": "실수 전체의 집합에서 정의된 두 함수 $f$, $g$에 대하여 함수 $f$는 항등함수이고, 함수 $g$는 상수함수이다.<br>$f(2)+g(-1)=5$일 때, $f(5)+g(4)$의 값을 구하시오.", "key": "T08-05"}, "x08x31-087": {"id": "x08x31-087", "unit": "08", "theme": "05", "벌": "X08x31", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "함수 $f$가 항등함수이려면 $f(x)=x$이어야 하므로<br>$x^{2}-12=x$, $x^{2}-x-12=0$<br>$(x+3)(x-4)=0\\therefore \\;x=-3$ 또는 $x=4$<br>따라서 집합 $X$는 집합 $\\left\\{-3,\\;4\\right\\}$의 공집합이 아닌 부분집합이므로 그 개수는<br>$2^{2}-1=3$", "k": "num", "a": "3", "q": "집합 $X$를 정의역으로 하는 함수 $f(x)=x^{2}-12$가 항등함수가 되도록 하는 집합 $X$의 개수를 구하시오. (단, $X\\ne \\varnothing $)", "key": "T08-05"}, "x08x31-088": {"id": "x08x31-088", "unit": "08", "theme": "05", "벌": "X08x31", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "함수 $f$는 상수함수이므로<br>$f(1)=f(2)=f(3)$<br>$f(1)=f(2)$에서 $1=4+2a+b$<br>$\\therefore \\,2a+b=-3\\cdots \\cdots $㉠<br>$f(1)=f(3)$에서 $1=9+3a+b$<br>$\\therefore \\;3a+b=-8\\cdots \\cdots $㉡<br>㉠, ㉡을 연립하여 풀면 $a=-5$, $b=7$<br>$\\therefore \\;a+b=2$", "k": "num", "a": "2", "q": "집합 $X=\\left\\{1,\\;2,\\;3\\right\\}$에 대하여 $X$에서 $X$로의 함수<br> $f(x)={\\begin{cases}-2x+3 & \\;(x<2) \\\\ x^{2}+ax+b & \\;(x\\ge 2)\\end{cases}}$<br>가 상수함수일 때, $a+b$의 값을 구하시오. (단, $a$, $b$는 상수이다.)", "key": "T08-05"}, "x08x31-090": {"id": "x08x31-090", "unit": "08", "theme": "05", "벌": "X08x31", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "함수 $f$가 항등함수이므로<br>(ⅰ) $x<2$일 때, $x=1$<br>(ⅱ) $2\\le x<6$일 때,<br>$3x-8=x$, $2x=8\\therefore \\;x=4$<br>(ⅲ) $x\\ge 6$일 때,<br>$x^{2}-8x+14=x$, $x^{2}-9x+14=0$<br>$(x-2)(x-7)=0\\therefore \\;x=7(\\because \\;x\\ge 6)$<br>이상에서 $X=\\left\\{1,\\;4,\\;7\\right\\}$이므로<br>$a+b+c=1+4+7=12$", "k": "num", "a": "12", "q": "집합 $X=\\left\\{a,\\;b,\\;c\\right\\}$를 정의역으로 하는 함수<br> $f(x)={\\begin{cases}1 & \\;(x<2) \\\\ 3x-8 & \\;(2\\le x<6) \\\\ x^{2}-8x+14 & \\;(x\\ge 6)\\end{cases}}$<br>가 항등함수일 때, $a+b+c$의 값을 구하시오.<br>(단, $a$, $b$, $c$는 서로 다른 상수이다.)", "key": "T08-05"}, "x08x40-052": {"id": "x08x40-052", "unit": "08", "theme": "05", "벌": "X08x40", "lvl": 2, "fix": true, "src": "문제집 고쟁이", "w": "함수 $f(x)=x^{3}-x^{2}-4x-3$이 항등함수이려면 집합 $X$의 각 원소 $x$에 대하여 $f(x)=x$이어야 한다.<br>$x^{3}-x^{2}-4x-3=x$, $x^{3}-x^{2}-5x-3=0$,<br>$(x+1)^{2}(x-3)=0\\therefore \\;x=-1$ 또는 $x=3$<br>즉, 정의역 $X$의 원소로 가능한 것은 $-1,\\;3$이다.<br>따라서 정의역 $X$는 집합 $\\left\\{-1,\\;3\\right\\}$의 부분집합 중 공집합이 아닌 것이므로 구하는 집합 $X$의 개수는 $2^{2}-1=3$이다.", "k": "c5", "c": ["$3$", "$4$", "$5$", "$6$", "$7$"], "a": "$3$", "q": "공집합이 아닌 집합 $X$를 정의역으로 하는 함수<br> $f(x)=x^{3}-x^{2}-4x-3$<br>이 항등함수가 되도록 하는 모든 집합 $X$의 개수는?", "key": "T08-05"}, "x08x48-017": {"id": "x08x48-017", "unit": "08", "theme": "05", "벌": "X08x48", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "① $f(-1)=1,\\;f(0)=0,\\;f(1)=1$<br>② $f(-1)=1,\\;f(0)=0,\\;f(1)=1$<br>③ $f(-1)=-1,\\;f(0)=0,\\;f(1)=1$<br>④ $f(-1)=1,\\;f(0)=0,\\;f(1)=1$<br>⑤ $f(-1)=1,\\;f(0)=1,\\;f(1)=1$<br>따라서 항등함수인 것은 ③이다.", "k": "c5", "c": ["$f(x)=|\\,x\\,|$", "$f(x)=x^{2}$", "$f(x)=x^{3}$", "$f(x)=x^{4}$", "$f(x)=1$"], "a": "$f(x)=x^{3}$", "q": "집합 $X=\\left\\{-1,\\;0,\\;1\\right\\}$에 대하여 다음 중 $X$에서 $X$로의 항등함수인 것은?", "key": "T08-05"}, "x08x48-020": {"id": "x08x48-020", "unit": "08", "theme": "05", "벌": "X08x48", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "$f(x)=x$에서 $x^{3}-2x+2=x,\\;x^{3}-3x+2=0$<br>$(x-1)^{2}(x+2)=0\\;\\therefore \\;x=-2$ 또는 $x=1$<br>따라서 공집합이 아닌 집합 $X$의 개수는<br>$2^{2}-1=3$", "k": "c5", "c": ["$2$", "$3$", "$4$", "$7$", "$8$"], "a": "$3$", "q": "공집합이 아닌 집합 $X$에 대하여 $X$에서 $X$로의 함수 $f(x)=x^{3}\\,-2x+2$가 항등함수가 되도록 하는 집합 $X$의 개수는?", "key": "T08-05"}, "x08x48-027": {"id": "x08x48-027", "unit": "08", "theme": "05", "벌": "X08x48", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "함수 $f$는 항등함수이므로 $f(x)=x\\;\\therefore \\;f(3)=3$<br>$g(2)=2$이고 함수 $g$는 상수함수이므로<br>$g(x)=2\\;\\therefore \\;g(4)=2$<br>$\\therefore \\;f(3)+g(4)=3+2=5$", "k": "c5", "c": ["$5$", "$6$", "$7$", "$8$", "$9$"], "a": "$5$", "q": "실수 전체의 집합에서 정의된 두 함수 $f,\\;g$에 대하여 $f$는 항등함수, $g$는 상수함수이고, $g(2)=2$일 때, $f(3)+g(4)$의 값은?", "key": "T08-05"}, "x08x69-025": {"id": "x08x69-025", "unit": "08", "theme": "05", "벌": "X08x69", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "함수 $f$는 항등함수이므로<br>$f(x)=x\\;\\therefore \\;f(5)=5$<br>함수 $g$는 상수함수이고 $f(2)=g(2)=2$이므로<br>$g(x)=2\\;\\therefore \\;g(5)=2$<br>$\\therefore \\;f(5)+g(5)=5+2=7$", "k": "num", "a": "7", "q": "실수 전체의 집합에서 정의된 두 함수 $f,\\;g$에 대하여 $f$는 항등함수, $g$는 상수함수이고 $f(2)=g(2)$일 때, $f(5)+g(5)$의 값을 구하시오.", "key": "T08-05"}, "x08x69-026": {"id": "x08x69-026", "unit": "08", "theme": "05", "벌": "X08x69", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "$f(50)=1$이고 함수 $f$는 상수함수이므로 $f(x)=1$<br>따라서 $f(1)=f(3)=f(5)=\\,\\cdots \\,=f(99)=1$이므로<br>$f(1)+f(3)+f(5)+\\,\\cdots \\,+f(99)=1\\times 50=50$", "k": "num", "a": "50", "q": "실수 전체의 집합에서 정의된 함수 $f$는 상수함수이고 $f(50)=1$일 때, $f(1)+f(3)+f(5)+\\,\\cdots \\,+f(99)$의 값을 구하시오.", "key": "T08-05"}, "x08x69-027": {"id": "x08x69-027", "unit": "08", "theme": "05", "벌": "X08x69", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "함수 $g$는 항등함수이므로<br>$g(x)=x\\;\\therefore \\;g(3)=3$<br>$f(1)=g(3)=3$이므로 $f(1)+f(3)=f(4)$에서<br>$3+f(3)=f(4)$<br>이때 함수 $f$는 일대일대응이므로 $f(3)=1,\\;f(4)=4$<br>함수 $h$는 상수함수이므로 $h(3)=h(4)=g(3)=3$<br>$\\therefore \\;f(4)+h(3)=4+3=7$", "k": "num", "a": "7", "q": "집합 $X=\\left\\{1,\\;3,\\;4\\right\\}$에 대하여 $X$에서 $X$로의 세 함수 $f,\\;g,\\;h$는 각각 일대일대응, 항등함수, 상수함수이고 $f(1)=g(3)=h(4),\\;f(1)+f(3)=f(4)$일 때, $f(4)+h(3)$의 값을 구하시오.", "key": "T08-05"}, "x08x21-056": {"id": "x08x21-056", "unit": "08", "theme": "07", "벌": "X08x21", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "$g(2)=2^{2}-2=2$이므로<br>$(f\\circ g)(2)=f(g(2))=f(2)=-2\\times 2+5=1$<br>$f(0)=3$이므로<br>$(g\\circ f)(0)=g(f(0))=g(3)=9-2=7$<br>$\\therefore \\;(f\\circ g)(2)+(g\\circ f)(0)=1+7=8$", "k": "c5", "c": ["$-4$", "$-1$", "$2$", "$5$", "$8$"], "a": "$8$", "q": "두 함수 $f(x)={\\begin{cases}-2x+5 & \\;(x\\ge 1) \\\\ 3 & \\;(x<1)\\end{cases}}$, $g(x)=x^{2}-2$에 대하여 $(f\\circ g)(2)+(g\\circ f)(0)$의 값은?", "key": "T08-07"}, "x08x21-057": {"id": "x08x21-057", "unit": "08", "theme": "07", "벌": "X08x21", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "$(h\\circ (g\\circ f))(1)=((h\\circ g)\\circ f)(1)$<br>$=(h\\circ g)(f(1))$<br>$=(h\\circ g)(-1)$<br>$=-4+3=-1$", "k": "c5", "c": ["$-2$", "$-1$", "$0$", "$1$", "$2$"], "a": "$-1$", "q": "세 함수 $f,\\;g,\\;h$에 대하여<br> $f(x)=x-2,\\;(h\\circ g)(x)=4x+3$<br>일 때, $(h\\circ (g\\circ f))(1)$의 값은?", "key": "T08-07"}, "x08x21-058": {"id": "x08x21-058", "unit": "08", "theme": "07", "벌": "X08x21", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "$(f\\circ g)(-1)=f(g(-1))=f(-a+4)$<br>$=3(-a+4)-2$<br>$=-3a+10$<br>즉, $-3a+10=7$이므로 $-3a=-3$<br>$\\therefore a=1$<br>따라서 $g(x)=x+4$이므로<br>$g(-2)=-2+4=2$", "k": "num", "a": "2", "q": "두 함수 $f(x)=3x-2,\\;g(x)=ax+4$에 대하여 $(f\\circ g)(-1)=7$일 때, $g(-2)$의 값을 구하시오. (단, $a$는 상수이다.)", "key": "T08-07"}, "x08x21-065": {"id": "x08x21-065", "unit": "08", "theme": "07", "벌": "X08x21", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "$(f\\circ f)(x)=f(f(x))=f(x^{2}+a)$<br>$=(x^{2}+a)^{2}+a$<br>$=x^{4}+2ax^{2}+a^{2}+a$<br>$(f\\circ f)(x)$를 $x-1$로 나누었을 때의 나머지가 $5$이므로<br>$(f\\circ f)(1)=5$, $1+2a+a^{2}+a=5$<br>$a^{2}+3a-4=0$, $(a+4)(a-1)=0$<br>$\\therefore \\;a=1(\\because \\;a>0)$", "k": "c5", "c": ["$1$", "$2$", "$3$", "$4$", "$5$"], "a": "$1$", "q": "함수 $f(x)=x^{2}+a$에 대하여 $(f\\circ f)(x)$를 $x-1$로 나누었을 때의 나머지가 $5$일 때, 양수 $a$의 값은?", "key": "T08-07"}, "x08x31-097": {"id": "x08x31-097", "unit": "08", "theme": "07", "벌": "X08x31", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$g(-1)=-3$이므로<br>$(f\\circ g)(-1)=f(g(-1))=f(-3)$<br>$=-3\\cdot (-3)+1=10$<br>또 $f(2)=4$이므로<br>$(g\\circ f)(2)=g(f(2))=g(4)=12$<br>$\\therefore \\;(f\\circ g)(-1)-(g\\circ f)(2)=-2$", "k": "c5", "c": ["$-2$", "$-1$", "$0$", "$1$", "$2$"], "a": "$-2$", "q": "두 함수<br> $f(x)={\\begin{cases}-3x+1 &  &  & (x<-1) \\\\ \\;4 &  &  & (x\\ge -1)\\end{cases}},\\;g(x)=x^{2}-4$<br>에 대하여 $(f\\circ g)(-1)-(g\\circ f)(2)$의 값은?", "key": "T08-07"}, "x08x31-099": {"id": "x08x31-099", "unit": "08", "theme": "07", "벌": "X08x31", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(4)=a$이므로<br>$(f\\circ f)(4)=f(f(4))=f(a)$
