: "$y$축의 오른쪽에서 두 번, 왼쪽에서 한 번", "c": ["$y$축의 오른쪽에서 두 번, 왼쪽에서 한 번", "$y$축의 왼쪽에서 두 번, 오른쪽에서 한 번", "$x$축의 위쪽에서 두 번, 아래쪽에서 한 번", "원점에서 한 번, 그 밖에서 두 번"], "w": "양의 실근은 $y$축의 오른쪽, 음의 실근은 $y$축의 왼쪽에 있는 교점의 $x$좌표이다.", "key": "Cm06-01"}, "cm06-02-2-01": {"id": "cm06-02-2-01", "unit": "m06", "concept": "02", "벌": 2, "k": "ox", "q": "부등식 $x^{4}+3\\ge 4x$가 모든 실수 $x$에 대하여 성립함을 보이려면 $h(x)=x^{4}-4x+3$의 최솟값이 $0$ 이상임을 보이면 된다.", "a": "O", "w": "한쪽으로 모아 $h(x)\\ge 0$을 보이면 된다. $h(x)$의 최솟값은 $h(1)=0$이다.", "key": "Cm06-02"}, "cm06-02-2-02": {"id": "cm06-02-2-02", "unit": "m06", "concept": "02", "벌": 2, "k": "ox", "q": "모든 실수 $x$에 대하여 성립하는 부등식 $x^{4}+3\\ge 4x$에서 등호가 성립하는 $x$는 없다.", "a": "X", "w": "$h(x)=x^{4}-4x+3$의 최솟값이 $h(1)=0$이므로 $x=1$일 때 등호가 성립한다.", "key": "Cm06-02"}, "cm06-02-2-03": {"id": "cm06-02-2-03", "unit": "m06", "concept": "02", "벌": 2, "k": "ox", "q": "닫힌구간 $[a,\\,b]$에서 연속인 함수 $f(x)$에 대하여, 이 구간에서 $f(x)\\le 0$이 성립하기 위한 조건은 이 구간에서 $f(x)$의 최댓값이 $0$ 이하인 것이다.", "a": "O", "w": "$f(x)\\le 0$이면 가장 큰 값만 $0$ 이하이면 된다. $\\ge$ 꼴은 최솟값, $\\le$ 꼴은 최댓값을 본다.", "key": "Cm06-02"}, "cm06-02-2-04": {"id": "cm06-02-2-04", "unit": "m06", "concept": "02", "벌": 2, "k": "ox", "q": "$x\\ge 0$에서 $f(x)\\ge g(x)$가 성립하면 모든 실수 $x$에 대하여 $f(x)\\ge g(x)$가 성립한다.", "a": "X", "w": "구간이 다르면 조건도 다르다. 예를 들어 $f(x)=x$, $g(x)=0$은 $x\\ge 0$에서만 성립한다.", "key": "Cm06-02"}, "cm06-02-2-05": {"id": "cm06-02-2-05", "unit": "m06", "concept": "02", "벌": 2, "k": "ox", "q": "$x\\ge 0$에서 부등식 $x^{3}-3x^{2}+k\\ge 0$이 성립하려면 $k\\ge 0$이면 충분하다.", "a": "X", "w": "$x\\ge 0$에서 최솟값은 $x=2$에서의 $k-4$이므로 $k\\ge 4$이어야 한다. $f(0)$만 보면 안 된다.", "key": "Cm06-02"}, "cm06-02-2-06": {"id": "cm06-02-2-06", "unit": "m06", "concept": "02", "벌": 2, "k": "ox", "q": "닫힌구간 $[0,\\,3]$에서 부등식 $x^{3}-3x^{2}+4\\ge 0$이 성립한다.", "a": "O", "w": "$f(x)=x^{3}-3x^{2}+4$의 이 구간에서의 최솟값은 $f(2)=0$이므로 성립한다.", "key": "Cm06-02"}, "cm06-02-2-07": {"id": "cm06-02-2-07", "unit": "m06", "concept": "02", "벌": 2, "k": "c4", "q": "모든 실수 $x$에 대하여 $f(x)>g(x)$가 성립한다는 것은 곡선 $y=f(x)$가 곡선 $y=g(x)$보다 항상 ____ 에 있다는 뜻이다.", "a": "위쪽", "c": ["위쪽", "아래쪽", "오른쪽", "왼쪽"], "w": "같은 $x$에서 $f(x)$의 값이 더 크므로 $y=f(x)$의 그래프가 위쪽에 있다.", "key": "Cm06-02"}, "cm06-02-2-08": {"id": "cm06-02-2-08", "unit": "m06", "concept": "02", "벌": 2, "k": "c4", "q": "닫힌구간 $[-1,\\,2]$에서 함수 $f(x)=x^{3}-3x$의 최솟값은 ____ 이므로, 이 구간에서 $x^{3}-3x+k\\ge 0$이 성립하려면 $k\\ge 2$이어야 한다.", "a": "$-2$", "c": ["$-2$", "$2$", "$-1$", "$0$"], "w": "$f(-1)=2$, $f(1)=-2$, $f(2)=2$이므로 최솟값은 $-2$이다. 따라서 $-2+k\\ge 0$, $k\\ge 2$이다.", "key": "Cm06-02"}, "cm06-03-2-01": {"id": "cm06-03-2-01", "unit": "m06", "concept": "03", "벌": 2, "k": "ox", "q": "수직선 위를 움직이는 점 $\\mathrm{P}$가 원점을 지나는 순간은 점 $\\mathrm{P}$의 위치가 $0$인 순간이다.", "a": "O", "w": "원점의 좌표가 $0$이므로 위치 $x=0$인 시각을 구한다. 속도가 $0$인 순간과 헷갈리지 않는다.", "key": "Cm06-03"}, "cm06-03-2-02": {"id": "cm06-03-2-02", "unit": "m06", "concept": "03", "벌": 2, "k": "ox", "q": "수직선 위를 움직이는 점이 정지하는 순간은 가속도가 $0$인 순간이다.", "a": "X", "w": "정지는 속도가 $0$인 순간이다. 가속도가 $0$이어도 일정한 속도로 움직일 수 있다.", "key": "Cm06-03"}, "cm06-03-2-03": {"id": "cm06-03-2-03", "unit": "m06", "concept": "03", "벌": 2, "k": "ox", "q": "시각 $t$에서의 위치가 $x=t^{3}-6t^{2}+9t$인 점 $\\mathrm{P}$는 $1<t<3$에서 음의 방향으로 움직인다.", "a": "O", "w": "$v=3t^{2}-12t+9=3(t-1)(t-3)$이고 $1<t<3$에서 $v<0$이다.", "key": "Cm06-03"}, "cm06-03-2-04": {"id": "cm06-03-2-04", "unit": "m06", "concept": "03", "벌": 2, "k": "ox", "q": "수직선 위를 움직이는 점의 가속도가 양수이면 그 점은 양의 방향으로 움직인다.", "a": "X", "w": "운동 방향은 속도의 부호로 정한다. 가속도가 양수여도 속도가 음수이면 음의 방향으로 움직인다.", "key": "Cm06-03"}, "cm06-03-2-05": {"id": "cm06-03-2-05", "unit": "m06", "concept": "03", "벌": 2, "k": "ox", "q": "시각 $t$에서의 위치가 다항함수로 주어진 점이 운동 방향을 바꾸는 순간, 그 점의 속도는 $0$이다.", "a": "O", "w": "속도가 양에서 음, 또는 음에서 양으로 바뀌므로 그 순간 속도는 $0$이다.", "key": "Cm06-03"}, "cm06-03-2-06": {"id": "cm06-03-2-06", "unit": "m06", "concept": "03", "벌": 2, "k": "ox", "q": "시각 $t$에서의 위치가 $x=-t^{2}+6t$인 점 $\\mathrm{P}$의 $t=2$에서의 속력은 $8$이다.", "a": "X", "w": "$v=-2t+6$이므로 $t=2$에서 속도 $2$, 속력 $2$이다. $8$은 $t=2$에서의 위치이다.", "key": "Cm06-03"}, "cm06-03-2-07": {"id": "cm06-03-2-07", "unit": "m06", "concept": "03", "벌": 2, "k": "c4", "q": "위치 $x=f(t)$의 그래프에서 $t=a$인 점에서의 접선의 기울기는 시각 $a$에서의 ____ 이다.", "a": "속도", "c": ["속도", "가속도", "위치", "움직인 거리"], "w": "$f'(a)$가 접선의 기울기이고, 위치를 미분한 것은 속도이다.", "key": "Cm06-03"}, "cm06-03-2-08": {"id": "cm06-03-2-08", "unit": "m06", "concept": "03", "벌": 2, "k": "c4", "q": "시각 $t$에서의 위치가 $x=t^{3}-12t$인 점 $\\mathrm{P}$가 $t>0$에서 운동 방향을 바꾸는 시각은 $t=$____ 이다.", "a": "$2$", "c": ["$2$", "$4$", "$2\\sqrt{3}$", "$1$"], "w": "$v=3t^{2}-12=3(t+2)(t-2)$는 $t=2$에서 부호가 바뀐다. $2\\sqrt{3}$은 위치가 $0$인 시각이다.", "key": "Cm06-03"}, "cm06-04-2-01": {"id": "cm06-04-2-01", "unit": "m06", "concept": "04", "벌": 2, "k": "ox", "q": "시각 $t$에서의 넓이 $S(t)$에 대하여 $S'(a)>0$이면 $t=a$인 순간 넓이는 늘어나고 있다.", "a": "O", "w": "변화율이 양수이면 그 순간 넓이가 증가하는 중이다.", "key": "Cm06-04"}, "cm06-04-2-02": {"id": "cm06-04-2-02", "unit": "m06", "concept": "04", "벌": 2, "k": "ox", "q": "가로의 길이는 매초 늘어나고 세로의 길이는 매초 줄어드는 직사각형의 넓이는 항상 줄어든다.", "a": "X", "w": "늘고 주는 빠르기와 처음 길이에 따라 다르다. 예를 들어 가로 $4+2t$, 세로 $10-t$이면 $S'=16-4t$로 처음에는 늘어난다.", "key": "Cm06-04"}, "cm06-04-2-03": {"id": "cm06-04-2-03", "unit": "m06", "concept": "04", "벌": 2, "k": "ox", "q": "처음 한 변의 길이가 $1\\,\\mathrm{cm}$이고 한 변의 길이가 매초 $1\\,\\mathrm{cm}$씩 늘어나는 정사각형의 $t$초 후의 넓이는 $(1+t)^{2}\\,\\mathrm{cm}^{2}$이다.", "a": "O", "w": "$t$초 후 한 변의 길이가 $(1+t)\\,\\mathrm{cm}$이므로 넓이는 $(1+t)^{2}\\,\\mathrm{cm}^{2}$이다.", "key": "Cm06-04"}, "cm06-04-2-04": {"id": "cm06-04-2-04", "unit": "m06", "concept": "04", "벌": 2, "k": "ox", "q": "시각 $t$에서의 부피가 $V(t)=t^{3}+2t$일 때 $t=1$에서의 부피의 변화율은 $3$이다.", "a": "X", "w": "$V'(t)=3t^{2}+2$이므로 $V'(1)=5$이다. $3$은 $t=1$에서의 부피이다.", "key": "Cm06-04"}, "cm06-04-2-05": {"id": "cm06-04-2-05", "unit": "m06", "concept": "04", "벌": 2, "k": "ox", "q": "높이가 $2\\,\\mathrm{cm}$로 일정하고 $t$초 후 밑면의 반지름의 길이가 $(1+t)\\,\\mathrm{cm}$인 원기둥의 $t=1$에서의 부피의 변화율은 $8\\pi$이다.", "a": "O", "w": "$V=2\\pi(1+t)^{2}=2\\pi(t^{2}+2t+1)$, $V'=2\\pi(2t+2)$이므로 $t=1$에서 $8\\pi$이다.", "key": "Cm06-04"}, "cm06-04-2-06": {"id": "cm06-04-2-06", "unit": "m06", "concept": "04", "벌": 2, "k": "ox", "q": "시각 $t$에서의 길이의 변화율이 음수이면 그 시각의 길이도 음수이다.", "a": "X", "w": "변화율이 음수라는 것은 길이가 줄어드는 중이라는 뜻이다. 길이 자체는 양수이다.", "key": "Cm06-04"}, "cm06-04-2-07": {"id": "cm06-04-2-07", "unit": "m06", "concept": "04", "벌": 2, "k": "c4", "q": "$t$초 후 한 모서리의 길이가 $(2+t)\\,\\mathrm{cm}$인 정육면체의 겉넓이의 $t=1$에서의 변화율은 ____ 이다.", "a": "$36$", "c": ["$36$", "$54$", "$18$", "$27$"], "w": "겉넓이 $S=6(2+t)^{2}=6(t^{2}+4t+4)$, $S'=12t+24$이므로 $t=1$에서 $36$이다. $54$는 그때의 겉넓이이다.", "key": "Cm06-04"}, "cm06-04-2-08": {"id": "cm06-04-2-08", "unit": "m06", "concept": "04", "벌": 2, "k": "c4", "q": "$t$초 후 가로의 길이가 $(4+2t)$, 세로의 길이가 $(6-t)$인 직사각형의 $t=1$에서의 넓이의 변화율은 ____ 이다.", "a": "$4$", "c": ["$4$", "$30$", "$-2$", "$8$"], "w": "$S=(4+2t)(6-t)=-2t^{2}+8t+24$, $S'=-4t+8$이므로 $t=1$에서 $4$이다. 가로·세로의 변화율을 곱한 $-2$가 아니다.", "key": "Cm06-04"}, "cm06-01-3-01": {"id": "cm06-01-3-01", "unit": "m06", "concept": "01", "벌": 3, "k": "ox", "q": "방정식 $x^{3}-3x^{2}-9x+k=0$의 서로 다른 실근의 개수는 곡선 $y=-x^{3}+3x^{2}+9x$와 직선 $y=k$의 교점의 개수와 같다.", "a": "O", "w": "$k$만 우변으로 옮기면 $k=-x^{3}+3x^{2}+9x$이므로 이 곡선과 직선 $y=k$의 교점을 세면 된다.", "key": "Cm06-01"}, "cm06-01-3-02": {"id": "cm06-01-3-02", "unit": "m06", "concept": "01", "벌": 3, "k": "ox", "q": "극값을 갖는 삼차함수 $f(x)$의 극댓값이 $0$이면 방정식 $f(x)=0$은 서로 다른 두 실근을 갖는다.", "a": "O", "w": "극솟값은 극댓값보다 작아 음수이므로 그래프는 극대인 점에서 $x$축에 접하고 한 번 더 만난다. 중근과 다른 한 실근, 곧 서로 다른 두 실근이다.", "key": "Cm06-01"}, "cm06-01-3-03": {"id": "cm06-01-3-03", "unit": "m06", "concept": "01", "벌": 3, "k": "ox", "q": "함수 $f(x)=x^{3}-12x$에 대하여 방정식 $f(x)=k$가 서로 다른 세 실근을 가지면 세 실근의 부호는 모두 같다.", "a": "X", "w": "극댓값 $16$, 극솟값 $-16$이고 $-16<k<16$이다. 예를 들어 $k=0$이면 실근은 $-2\\sqrt{3}$, $0$, $2\\sqrt{3}$으로 부호가 다르다.", "key": "Cm06-01"}, "cm06-01-3-04": {"id": "cm06-01-3-04", "unit": "m06", "concept": "01", "벌": 3, "k": "ox", "q": "곡선 $y=f(x)$와 직선 $y=g(x)$가 $x=a$인 점에서 접하면 다항식 $f(x)-g(x)$는 $(x-a)^{2}$을 인수로 갖는다. (단, $f(x)$는 다항함수)", "a": "O", "w": "접하면 $f(a)=g(a)$, $f'(a)=g'(a)$이므로 $h(x)=f(x)-g(x)$는 $h(a)=0$, $h'(a)=0$이다. 따라서 $(x-a)^{2}$을 인수로 갖는다.", "key": "Cm06-01"}, "cm06-01-3-05": {"id": "cm06-01-3-05", "unit": "m06", "concept": "01", "벌": 3, "k": "ox", "q": "삼차함수의 그래프 밖의 한 점에서 그 그래프에 그은 접선은 항상 세 개이다.", "a": "X", "w": "점의 위치에 따라 접선은 한 개, 두 개, 세 개일 수 있다. 접점의 $x$좌표에 대한 삼차방정식의 서로 다른 실근의 개수로 정해진다.", "key": "Cm06-01"}, "cm06-01-3-06": {"id": "cm06-01-3-06", "unit": "m06", "concept": "01", "벌": 3, "k": "ox", "q": "방정식 $f(x)=0$의 서로 다른 실근의 개수를 셀 때 중근은 두 개로 센다.", "a": "X", "w": "'서로 다른' 실근을 셀 때 중근은 한 개로 센다. 그래프에서는 $x$축에 접하는 점 하나이다.", "key": "Cm06-01"}, "cm06-01-3-07": {"id": "cm06-01-3-07", "unit": "m06", "concept": "01", "벌": 3, "k": "c4", "q": "방정식 $x^{3}-3x+2=0$의 서로 다른 실근의 개수는 ____ 이다.", "a": "$2$", "c": ["$2$", "$3$", "$1$", "$0$"], "w": "$f(x)=x^{3}-3x+2$의 극댓값 $f(-1)=4$, 극솟값 $f(1)=0$이다. 극솟값이 $0$이므로 $x=1$(중근)과 다른 한 실근, 곧 $2$개이다.", "key": "Cm06-01"}, "cm06-01-3-08": {"id": "cm06-01-3-08", "unit": "m06", "concept": "01", "벌": 3, "k": "c4", "q": "최고차항의 계수가 양수인 삼차함수 $f(x)$가 $x=\\alpha$에서 극대, $x=\\beta$에서 극소이고 극댓값과 극솟값이 모두 양수이면, 방정식 $f(x)=0$의 실근은 ____", "a": "$\\alpha$보다 작은 실근 한 개뿐이다", "c": ["$\\alpha$보다 작은 실근 한 개뿐이다", "$\\beta$보다 큰 실근 한 개뿐이다", "$\\alpha$와 $\\beta$ 사이의 실근 한 개뿐이다", "없다"], "w": "$\\alpha<\\beta$이고 $x\\ge\\alpha$에서 $f(x)\\ge f(\\beta)>0$이다. $x<\\alpha$에서는 $f(x)$가 증가하며 $-\\infty$에서 올라오므로 $x$축과 한 번 만난다.", "key": "Cm06-01"}, "cm06-02-3-01": {"id": "cm06-02-3-01", "unit": "m06", "concept": "02", "벌": 3, "k": "ox", "q": "모든 실수 $x$에 대하여 $f(x)\\ge 0$이 성립하면 방정식 $f(x)=0$은 실근을 갖지 않는다.", "a": "X", "w": "최솟값이 $0$이면 그 점에서 $f(x)=0$이 된다. 예를 들어 $f(x)=x^{2}$은 $f(x)\\ge 0$이고 $x=0$이 실근이다.", "key": "Cm06-02"}, "cm06-02-3-02": {"id": "cm06-02-3-02", "unit": "m06", "concept": "02", "벌": 3, "k": "ox", "q": "최고차항의 계수가 양수인 사차함수는 최솟값을 갖는다.", "a": "O", "w": "$x$의 값이 한없이 커지거나 작아지면 함숫값이 한없이 커지므로, 극솟값 중 가장 작은 것이 최솟값이다.", "key": "Cm06-02"}, "cm06-02-3-03": {"id": "cm06-02-3-03", "unit": "m06", "concept": "02", "벌": 3, "k": "ox", "q": "다항함수 $f(x)$에 대하여 $x>0$에서 $f'(x)>0$이고 $f(0)=0$이면 $x>0$인 모든 $x$에 대하여 $f(x)>0$이다.", "a": "O", "w": "$x\\ge 0$에서 $f(x)$는 증가하므로 $x>0$이면 $f(x)>f(0)=0$이다.", "key": "Cm06-02"}, "cm06-02-3-04": {"id": "cm06-02-3-04", "unit": "m06", "concept": "02", "벌": 3, "k": "ox", "q": "모든 실수 $x$에 대하여 $f(x)\\ge g(x)$가 성립하려면 ($f(x)$의 최솟값)$\\ge$($g(x)$의 최댓값)이어야 한다.", "a": "X", "w": "그것은 충분조건일 뿐 필요조건이 아니다. 같은 $x$에서 비교하므로 $h(x)=f(x)-g(x)$의 최솟값이 $0$ 이상이면 된다. 예를 들어 $f(x)=x^{2}+1$, $g(x)=-x^{2}+2x+\\dfrac{1}{2}$이면 $f(x)-g(x)=2\\left(x-\\dfrac{1}{2}\\right)^{2}\\ge 0$이지만 $f(x)$의 최솟값 $1$은 $g(x)$의 최댓값 $\\dfrac{3}{2}$보다 작다.", "key": "Cm06-02"}, "cm06-02-3-05": {"id": "cm06-02-3-05", "unit": "m06", "concept": "02", "벌": 3, "k": "ox", "q": "모든 실수 $x$에 대하여 $x^{4}-4x^{3}+k\\ge 0$이 성립하도록 하는 $k$의 값의 범위를 구할 때, $f(x)=x^{4}-4x^{3}+k$는 $x=0$에서 극소이다.", "a": "X", "w": "$f'(x)=4x^{2}(x-3)$은 $x=0$의 좌우에서 부호가 바뀌지 않으므로 $x=0$에서 극값이 없다. 최솟값은 $f(3)=k-27$이다.", "key": "Cm06-02"}, "cm06-02-3-06": {"id": "cm06-02-3-06", "unit": "m06", "concept": "02", "벌": 3, "k": "ox", "q": "함수 $f(x)=x^{3}-12x$에 대하여 $x\\ge 2$인 모든 $x$에서 $f(x)\\ge -16$이다.", "a": "O", "w": "$f'(x)=3(x+2)(x-2)$이므로 $x\\ge 2$에서 증가하고 최솟값은 $f(2)=-16$이다.", "key": "Cm06-02"}, "cm06-02-3-07": {"id": "cm06-02-3-07", "unit": "m06", "concept": "02", "벌": 3, "k": "c4", "q": "모든 실수 $x$에 대하여 부등식 $x^{4}-2x^{2}+k>0$이 성립하기 위한 $k$의 값의 범위는 ____ 이다.", "a": "$k>1$", "c": ["$k>1$", "$k\\ge 1$", "$k>0$", "$k>-1$"], "w": "$f(x)=x^{4}-2x^{2}+k$의 최솟값은 $f(\\pm 1)=k-1$이다. 등호가 없으므로 $k-1>0$, $k>1$이다.", "key": "Cm06-02"}, "cm06-02-3-08": {"id": "cm06-02-3-08", "unit": "m06", "concept": "02", "벌": 3, "k": "c4", "q": "$h(x)=f(x)-g(x)$라 할 때, $x\\ge a$에서 $f(x)\\ge g(x)$임을 보이는 방법으로 알맞은 것은 ____ 이다.", "a": "$x\\ge a$에서 $h(x)$의 최솟값이 $0$ 이상임을 보인다", "c": ["$x\\ge a$에서 $h(x)$의 최솟값이 $0$ 이상임을 보인다", "$h(a)\\ge 0$임을 보인다", "$h'(a)=0$임을 보인다", "$x\\ge a$에서 $h(x)$의 최댓값이 $0$ 이상임을 보인다"], "w": "구간 전체에서 $h(x)\\ge 0$이어야 하므로 그 구간에서의 최솟값을 본다. $h(a)$ 하나만으로는 부족하다.", "key": "Cm06-02"}, "cm06-03-3-01": {"id": "cm06-03-3-01", "unit": "m06", "concept": "03", "벌": 3, "k": "ox", "q": "속도 $v(t)$의 그래프에서 $t=a$인 점에서의 접선의 기울기는 시각 $a$에서의 가속도이다.", "a": "O", "w": "가속도는 $v'(t)$이므로 속도 그래프의 접선의 기울기이다.", "key": "Cm06-03"}, "cm06-03-3-02": {"id": "cm06-03-3-02", "unit": "m06", "concept": "03", "벌": 3, "k": "ox", "q": "속도 $v(t)$의 그래프가 $t$축과 만나는 시각에는 항상 운동 방향이 바뀐다.", "a": "X", "w": "$t$축에 접하기만 하면 속도의 부호가 바뀌지 않는다. $t$축을 지나가야 운동 방향이 바뀐다.", "key": "Cm06-03"}, "cm06-03-3-03": {"id": "cm06-03-3-03", "unit": "m06", "concept": "03", "벌": 3, "k": "ox", "q": "속도 $v(t)$의 그래프가 $t$축보다 위쪽에 있는 구간에서 점은 양의 방향으로 움직인다.", "a": "O", "w": "그 구간에서 $v(t)>0$이므로 양의 방향으로 움직인다.", "key": "Cm06-03"}, "cm06-03-3-04": {"id": "cm06-03-3-04", "unit": "m06", "concept": "03", "벌": 3, "k": "ox", "q": "위치 $x(t)$의 그래프가 $t$축보다 아래쪽에 있는 구간에서 점은 음의 방향으로 움직인다.", "a": "X", "w": "$x(t)<0$은 점이 원점의 왼쪽(음의 부분)에 있다는 뜻이다. 운동 방향은 $x(t)$의 증가·감소, 곧 속도의 부호로 판단한다.", "key": "Cm06-03"}, "cm06-03-3-05": {"id": "cm06-03-3-05", "unit": "m06", "concept": "03", "벌": 3, "k": "ox", "q": "지면에서 똑바로 위로 쏘아 올린 물체의 $t$초 후의 높이가 $h=30t-5t^{2}\\,(\\mathrm{m})$일 때, 이 물체가 도달하는 최고 높이는 $45\\,\\mathrm{m}$이다.", "a": "O", "w": "$v=30-10t=0$에서 $t=3$이고, 그때 높이는 $90-45=45\\,(\\mathrm{m})$이다.", "key": "Cm06-03"}, "cm06-03-3-06": {"id": "cm06-03-3-06", "unit": "m06", "concept": "03", "벌": 3, "k": "ox", "q": "제동을 건 후 $t$초 동안 움직인 거리가 $x=20t-2t^{2}\\,(\\mathrm{m})$인 자동차는 제동을 건 후 $10$초 만에 정지한다.", "a": "X", "w": "정지는 속도가 $0$인 순간이다. $v=20-4t=0$에서 $t=5$이다. $t=10$은 $x=0$이 되는 값일 뿐이다.", "key": "Cm06-03"}, "cm06-03-3-07": {"id": "cm06-03-3-07", "unit": "m06", "concept": "03", "벌": 3, "k": "c4", "q": "수직선 위를 움직이는 점의 시각 $t$에서의 속도가 $v(t)$일 때, 그 점의 속력은 ____ 이다.", "a": "$|v(t)|$", "c": ["$|v(t)|$", "$v(t)$", "$v'(t)$", "$-v(t)$"], "w": "속력은 방향을 뺀 빠르기이므로 속도의 절댓값 $|v(t)|$이다.", "key": "Cm06-03"}, "cm06-03-3-08": {"id": "cm06-03-3-08", "unit": "m06", "concept": "03", "벌": 3, "k": "c4", "q": "시각 $t$에서의 위치가 $x=t^{3}-6t^{2}$인 점 $\\mathrm{P}$의 속도가 $0$인 순간 ($t>0$)의 가속도는 ____ 이다.", "a": "$12$", "c": ["$12$", "$0$", "$-12$", "$24$"], "w": "$v=3t^{2}-12t=3t(t-4)$에서 $t=4$이고, $a=6t-12$이므로 $t=4$에서 $12$이다.", "key": "Cm06-03"}, "cm06-04-3-01": {"id": "cm06-04-3-01", "unit": "m06", "concept": "04", "벌": 3, "k": "ox", "q": "넓이의 변화율이 $0$인 순간에는 넓이가 $0$이다.", "a": "X", "w": "변화율이 $0$이면 그 순간 넓이가 늘지도 줄지도 않는다는 뜻이다. 넓이 자체와는 관계없다.", "key": "Cm06-04"}, "cm06-04-3-02": {"id": "cm06-04-3-02", "unit": "m06", "concept": "04", "벌": 3, "k": "ox", "q": "$t$초 후 반지름의 길이가 $(1+2t)\\,\\mathrm{cm}$인 원의 넓이의 변화율은 시간이 지날수록 커진다.", "a": "O", "w": "$S=\\pi(1+2t)^{2}=\\pi(4t^{2}+4t+1)$, $S'=\\pi(8t+4)$는 $t$가 커지면 커진다.", "key": "Cm06-04"}, "cm06-04-3-03": {"id": "cm06-04-3-03", "unit": "m06", "concept": "04", "벌": 3, "k": "ox", "q": "시각에 대한 길이의 변화율은 길이를 시각 $t$에 대하여 미분한 값, 곧 시각 $t$에서의 순간변화율이다.", "a": "O", "w": "변화율은 $\\displaystyle\\lim_{\\Delta t\\to 0}\\dfrac{\\Delta l}{\\Delta t}=\\dfrac{dl}{dt}$이다.", "key": "Cm06-04"}, "cm06-04-3-04": {"id": "cm06-04-3-04", "unit": "m06", "concept": "04", "벌": 3, "k": "ox", "q": "$t$초 후 한 모서리의 길이가 $(4-t)\\,\\mathrm{cm}$ ($0<t<4$)인 정육면체의 부피의 변화율은 양수이다.", "a": "X", "w": "$V=(4-t)^{3}=-t^{3}+12t^{2}-48t+64$이므로 $V'=-3t^{2}+24t-48=-3(t-4)^{2}<0$이다. 부피가 줄어들므로 변화율은 음수이다.", "key": "Cm06-04"}, "cm06-04-3-05": {"id": "cm06-04-3-05", "unit": "m06", "concept": "04", "벌": 3, "k": "ox", "q": "밑넓이가 $5\\,\\mathrm{cm}^{2}$로 일정하고 $t$초 후 높이가 $(10-t)\\,\\mathrm{cm}$인 기둥의 부피의 변화율은 $5$이다.", "a": "X", "w": "$V=5(10-t)=50-5t$이므로 $V'=-5$이다. 부피가 줄어들므로 변화율은 음수이다.", "key": "Cm06-04"}, "cm06-04-3-06": {"id": "cm06-04-3-06", "unit": "m06", "concept": "04", "벌": 3, "k": "ox", "q": "시각 $t$에서의 넓이가 $S(t)=-t^{2}+6t$ ($0<t<6$)이면 넓이는 $t=3$에서 증가하다가 감소하기 시작한다.", "a": "O", "w": "$S'(t)=-2t+6$은 $t=3$의 좌우에서 양에서 음으로 바뀐다.", "key": "Cm06-04"}, "cm06-04-3-07": {"id": "cm06-04-3-07", "unit": "m06", "concept": "04", "벌": 3, "k": "c4", "q": "$t$초 후 반지름의 길이가 $(1+t)\\,\\mathrm{cm}$인 구의 반지름의 길이가 $2\\,\\mathrm{cm}$가 되는 순간의 부피의 변화율은 ____ 이다.", "a": "$16\\pi$", "c": ["$16\\pi$", "$\\dfrac{32}{3}\\pi$", "$4\\pi$", "$12\\pi$"], "w": "$V=\\dfrac{4}{3}\\pi(1+t)^{3}=\\dfrac{4}{3}\\pi(t^{3}+3t^{2}+3t+1)$, $V'=4\\pi(t^{2}+2t+1)$이고 $t=1$에서 $16\\pi$이다. $\\dfrac{32}{3}\\pi$는 그때의 부피이다.", "key": "Cm06-04"}, "cm06-04-3-08": {"id": "cm06-04-3-08", "unit": "m06", "concept": "04", "벌": 3, "k": "c4", "q": "그릇에 물을 넣을 때 시각 $t$에서의 물의 부피를 $V(t)$라 하면 $V'(t)$는 시각 $t$에서의 ____ 이다.", "a": "물의 부피의 변화율", "c": ["물의 부피의 변화율", "물의 부피", "물의 높이", "물의 높이의 변화율"], "w": "$V(t)$를 $t$에 대하여 미분한 것이므로 부피의 (시각에 대한) 변화율이다.", "key": "Cm06-04"}, "x07x39-001": {"id": "x07x39-001", "unit": "07", "theme": "01", "벌": "X07x39", "lvl": 1, "fix": true, "src": "문제집 고쟁이", "w": "명제는 참, 거짓을 명확히 판별할 수 있는 문장이나 식이고 조건은 변수의 값에 따라 참, 거짓을 결정할 수 있는 문장이나 식이다.<br>ㄱ. ‘$1+2<5$’는 참이므로 명제이다.<br>ㄴ. ‘$3x-2=1$’은 $x$의 값에 따라 참, 거짓을 결정할 수 있으므로 조건이다.<br>따라서 명제가 아니다.<br>ㄷ. ‘$x=1$이면 $2x+1=4$이다.’는 거짓이므로 명제이다.<br>ㄹ. ‘한국에서 가장 아름다운 것은 제주도이다.’에서 아름답다는 그 기준이 명확하지 않으므로 참, 거짓을 결정할 수 없다. 따라서 명제가 아니다.<br>ㅁ. ‘삼각형의 세 내각의 크기의 합은 $360°$이다.’는 거짓이므로 명제이다.<br>따라서 명제인 것은 ㄱ, ㄷ, ㅁ으로 $3$개이다.", "k": "c5", "c": ["$1$", "$2$", "$3$", "$4$", "$5$"], "a": "$3$", "q": "다음 <보기> 중 명제인 것의 개수는?<br><b><보기><\/b><br>ㄱ. $1+2<5$<br>ㄴ. $3x-2=1$<br>ㄷ. $x=1$이면 $2x+1=4$이다.<br>ㄹ. 한국에서 가장 아름다운 곳은 제주도이다.<br>ㅁ. 삼각형의 세 내각의 크기의 합은 $360°$이다.", "key": "T07-01"}, "x07x39-003": {"id": "x07x39-003", "unit": "07", "theme": "01", "벌": "X07x39", "lvl": 1, "fix": true, "src": "문제집 고쟁이", "w": "① [반례] $3$은 $3$의 배수이지만 $6$의 배수가 아니다. (거짓)<br>② [반례] $x=-1$일 때 $x^{2}=1$이지만 $x\\ne 1$이다. (거짓)<br>③ 조건 $x-2>0$에서 $x>2$, 조건 $2x+1>3$에서 $x>1$이므로 $x-2>0$이면 $2x+1>3$이다. (참)<br>④ [반례] $x=1,\\;y=1$일 때 $xy=1$로 홀수이지만 $x+y=2$로 짝수이다. (거짓)<br>⑤ [반례] 한 쌍의 대변만 평행한 사다리꼴은 평행사변형이 아니다.  (거짓)<br>따라서 참인 명제는 ③이다.", "k": "c5", "c": ["$3$의 배수는 $6$의 배수이다.", "$x^{2}=1$이면 $x=1$이다.", "$x-2>0$이면 $2x+1>3$이다.", "두 자연수 $x,\\;y$에 대하여 $xy$가 홀수이면 $x+y$도 홀수이다.", "사각형 $ABCD$가 사다리꼴이면 사각형 $ABCD$는 평행사변형이다."], "a": "$x-2>0$이면 $2x+1>3$이다.", "q": "다음 중 참인 명제는?", "key": "T07-01"}, "x07x20-030": {"id": "x07x20-030", "unit": "07", "theme": "01", "벌": "X07x20", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "① $6+3=9>8$이므로 거짓인 명제이다.<br>② $\\sqrt{4}=2$는 유리수이므로 거짓인 명제이다.<br>③ $x>4$이면 $x+1>5$이므로 참인 명제이다..<br>④ $x$의 값에 따라 참, 거짓이 달라지므로 명제가 아니다.<br>⑤ $16$의 양의 약수는 $1,\\;2,\\;4,\\;8,\\;16$의 $5$개이므로 참인 명제이다.", "k": "c5", "c": ["$6+3<8$", "$\\sqrt{4}$는 무리수이다.", "$x>4$이면 $x+1>5$이다.", "$x$는 $10$ 이하의 소수이다.", "$16$의 양의 약수의 개수는 $5$이다."], "a": "$x$는 $10$ 이하의 소수이다.", "q": "다음 중 명제가 아닌 것은?", "key": "T07-01"}, "x07x20-035": {"id": "x07x20-035", "unit": "07", "theme": "01", "벌": "X07x20", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "$(a-b)^{2}+(b-c)^{2}+(c-a)^{2}=0$의 부정은<br>$(a-b)^{2}+(b-c)^{2}+(c-a)^{2}\\ne 0$<br>$\\therefore \\;a\\ne b$ 또는 $b\\ne c$ 또는 $c\\ne a$<br>즉 $a,\\;b,\\;c$ 중에 서로 다른 것이 적어도 하나 있다.", "k": "c5", "c": ["$(a-b)(b-c)(c-a)\\ne 0$", "$a,\\;b,\\;c$는 서로 다르다.", "$a\\ne b$이고 $b\\ne c$이고 $c\\ne a$", "$(a-b)(b-c)(c-a)>0$", "$a,\\;b,\\;c$ 중에 서로 다른 것이 적어도 하나 있다."], "a": "$a,\\;b,\\;c$ 중에 서로 다른 것이 적어도 하나 있다.", "q": "다음 중 임의의 세 실수 $a,\\;b,\\;c$에 대하여<br> $(a-b)^{2}+(b-c)^{2}+(c-a)^{2}=0$<br>의 부정과 서로 같은 것은?", "key": "T07-01"}, "x07x30-044": {"id": "x07x30-044", "unit": "07", "theme": "01", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "① $x$의 값에 따라 참, 거짓이 달라지므로 명제가 아니다.<br>②, ④, ⑤ 참인 명제이다.<br>③ 거짓인 명제이다.", "k": "c5", "c": ["$2x+8>-x-1$", "$6$의 약수는 $12$의 약수이다.", "$x=1$이면 $x-4=3$이다.", "두 자연수 $a,\\;b$가 홀수이면 $a+b$는 짝수이다.", "두 직선이 만날 때 생기는 맞꼭지각의 크기는 서로 같다."], "a": "$2x+8>-x-1$", "q": "다음 중 명제가 아닌 것은?", "key": "T07-01"}, "x07x30-046": {"id": "x07x30-046", "unit": "07", "theme": "01", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "① 참인 명제이다.<br>② 참, 거짓을 판별할 수 없으므로 명제가 아니다.<br>③ 거짓인 명제이다.<br>④ $x$의 값에 따라 참, 거짓이 달라지므로 명제가 아니다.<br>⑤ $-x+3\\ge 1-x$에서 $3\\ge 1$이므로 참인 명제이다.", "k": "c5", "c": ["$\\pi $는 무리수이다.", "$0.9999$는 $1$에 가까운 수이다.", "소수는 모두 홀수이다.", "$x^{2}\\le 2x-1$", "$-x+3\\ge 1-x$"], "a": "소수는 모두 홀수이다.", "q": "다음 중 거짓인 명제인 것은?", "key": "T07-01"}, "x07x30-047": {"id": "x07x30-047", "unit": "07", "theme": "01", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "‘$p$ 또는 $\\sim q$’의 부정은 ‘$\\sim p$ 그리고 $q$’<br>$\\sim p\\,:\\,x\\le -2$ 또는 $x>3,\\;q\\,:\\,-3\\le x<5$이므로<br>‘$\\sim p$ 그리고 $q$’ 는<br>$-3\\le x\\le -2$ 또는 $3<x<5$", "k": "c5", "c": ["$-3\\le x<5$", "$x<-3$ 또는 $x\\ge 5$", "$x\\le -2$ 또는 $x>3$", "$-3\\le x\\le -2$ 또는 $3<x<5$", "$-3\\le x<-2$ 또는 $3\\le \\,x<5$"], "a": "$-3\\le x\\le -2$ 또는 $3<x<5$", "q": "두 조건 $p\\,:\\,-2<x\\le 3,\\;q\\,:\\,-3\\le x<5$에 대하여 조건 ‘$p$ 또는 $\\sim q$’의 부정은?", "key": "T07-01"}, "x07x30-049": {"id": "x07x30-049", "unit": "07", "theme": "01", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "‘$(a-b)^{2}+(b-c)^{2}+(c-a)^{2}=0$’의 부정은<br>‘$(a-b)^{2}+(b-c)^{2}+(c-a)^{2}\\ne 0$’<br>이므로<br>$(a-b)^{2}\\ne 0$ 또는 $(b-c)^{2}\\ne 0$ 또는 $(c-a)^{2}\\ne 0$<br>$\\therefore \\;a\\ne b$ 또는 $b\\ne c$ 또는 $c\\ne a$<br>즉 $a,\\;b,\\;c$ 중 서로 다른 것이 적어도 하나 있다.", "k": "c5", "c": ["$(a-b)(b-c)(c-a)=0$", "$a\\ne b$이고 $b\\ne c$이고 $c\\ne a$", "$(a-b)(b-c)(c-a)\\ne 0$", "$a,\\;b,\\;c$ 중 서로 같은 것이 적어도 하나 있다.", "$a,\\;b,\\;c$ 중 서로 다른 것이 적어도 하나 있다."], "a": "$a,\\;b,\\;c$ 중 서로 다른 것이 적어도 하나 있다.", "q": "다음 중 임의의 세 실수 $a,\\;b,\\;c$에 대하여 조건<br> ‘$(a-b)^{2}+(b-c)^{2}+(c-a)^{2}=0$’<br>의 부정과 서로 같은 것은?", "key": "T07-01"}, "x07x39-035": {"id": "x07x39-035", "unit": "07", "theme": "01", "벌": "X07x39", "lvl": 2, "fix": true, "src": "문제집 고쟁이", "w": "조건 ‘집합 $X$의 원소 중 $10$보다 작은 수는 많아야 $4$개이다.’의 의미는 집합 $X$의 원소 중 $10$보다 작은 수가 $0$개~$4$개일 수 있다는 것이므로 그 부정은 집합 $X$의 원소 중 $10$보다 작은 수가 $5$개 이상임을 의미한다.<br>즉, 주어진 조건의 부정은<br>‘③ 집합 $X$의 원소 중 적어도 $5$개는 $10$보다 작다.’이다.", "k": "c5", "c": ["집합 $X$의 원소 중 많아야 $4$개는 $10$ 이상이다.", "집합 $X$의 원소 중 적어도 $4$개는 $10$보다 작다.", "집합 $X$의 원소 중 적어도 $5$개는 $10$보다 작다.", "집합 $X$의 원소 중 $10$ 이상인 수가 $4$개 이상이다.", "집합 $X$의 원소 중 $10$ 이상인 수가 적어도 $5$개이다."], "a": "집합 $X$의 원소 중 적어도 $5$개는 $10$보다 작다.", "q": "조건<br> ‘집합 $X$의 원소 중 $10$보다 작은 수는 많아야 $4$개이다.’<br>의 부정으로 옳은 것은?", "key": "T07-01"}, "x07x39-039": {"id": "x07x39-039", "unit": "07", "theme": "01", "벌": "X07x39", "lvl": 2, "fix": true, "src": "문제집 고쟁이", "w": "두 조건 $p$, $q$의 진리집합을 각각 $P,\\;Q$라 하면<br>$P=\\{x\\,\\mid \\,x\\le $ 또는 $x\\ge 5\\}$, $Q=\\{x\\,\\left|\\,-3\\le x\\le k\\right\\}$이다.<br>명제 $\\sim q\\;\\to \\;p$의 반례가 될 수 있는 값은 $Q^{C}$의 원소이면서 집합 $P$의 원소가 아니어야 하므로 $Q^{C}-P=Q^{C}\\cap P^{C}$의 원소이다.<br>집합 $Q^{C}=\\{x\\,\\mid \\,x<-$ 또는 $x>k\\}$이고 $P^{C}=\\{x\\,\\left|\\,2<x<5\\right\\}$이므로<br>따라서 집합 $Q^{C}\\cap P^{C}$에 정수인 원소는 $x=4$뿐이려면 $3\\le k<4$이어야 한다.", "k": "c5", "c": ["$k<4$", "$k\\ge 5$", "$2\\le k<3$", "$3\\le k<4$", "$4\\le k<5$"], "a": "$3\\le k<4$", "q": "두 조건<br> $p\\,:\\,x\\le 2$ 또는 $x\\ge 5$, $q\\,:\\,-3\\le x\\le k$<br>에 대하여 명제 $\\sim q\\;\\to \\;p$가 거짓임을 보이는 양의 정수인 반례가 $x=4$뿐일 때, 실수 $k$의 범위는?", "key": "T07-01"}, "x07x39-040": {"id": "x07x39-040", "unit": "07", "theme": "01", "벌": "X07x39", "lvl": 2, "fix": true, "src": "문제집 고쟁이", "w": "명제 $p\\;\\to \\;q$가 참이 되려면 $-3\\le x\\le 1$에서 함수 $y=ax^{2}+4ax-9$의 최댓값이 $0$보다 작거나 같아야 한다.<br>$y=ax^{2}+4ax-9=a(x+2)^{2}-4a-9$<br>실수 $a$의 범위에 따라 나누어 생각하면 다음과 같다.<br>(ⅰ) $a=0$일 때<br>함수 $y=-9\\le 0$이므로 조건을 만족한다.<br>(ⅱ) $a>0$일 때<br>$-3\\le x\\le 1$에서 함수 $y=a(x+2)^{2}-4a-9$는 $x=1$일 때 최대이므로<br>$9a-4a-9\\le 0,\\;5a\\le 9,\\;a\\le \\dfrac{9}{5}$<br>따라서 $0<a\\le \\dfrac{9}{5}$<br>이므로 정수 $a$는 $1$의 $1$개이다.<br>(ⅲ) $a<0$일 때<br>$-3\\le x\\le 1$에서 함수 $y=a(x+2)^{2}-4a-9$는 $x=-2$일 때 최대이므로<br>$-4a-9\\le 0,\\;4a\\ge -9,\\;a\\ge -\\dfrac{9}{4}$<br>따라서 $-\\dfrac{9}{4}\\le a<0$이므로 정수 $a$는 $-1,\\;-2$의 $2$개이다.<br>(ⅰ)~(ⅲ)에서 구하는 정수 $a$의 개수는<br>$1+1+2=4$", "k": "c5", "c": ["$1$", "$2$", "$3$", "$4$", "$5$"], "a": "$4$", "q": "두 조건<br> $p\\,:\\,-3\\le x\\le 1$<br> $q\\,:\\,ax^{2}+4ax-9\\le 0$<br>에 대하여 명제 $p\\;\\to \\;q$가 참이 되도록 하는 정수 $a$의 개수는?", "key": "T07-01"}, "x07x39-045": {"id": "x07x39-045", "unit": "07", "theme": "01", "벌": "X07x39", "lvl": 2, "fix": true, "src": "문제집 고쟁이", "w": "세 학생이 간 곳을 $○$, 가지 않은 곳을 $×$로 표기하여 문제의 상황을 나타내면 다음과 같다.<br> 독서실농구장극장영훈$○$인수$×$민지$×$<br>주어진 상황에 모순이 없으려면 각 행(가로)와 열(세로)마다 ○가 $1$개, $×$가 $2$개씩 표시되어야 한다.<br>(ⅰ) 영훈이의 말이 참이 경우<br> 독서실농구장극장영훈$○$인수민지$×$<br>인수와 민지의 말은 거짓이므로 영훈이와 인수는 농구장에 갔고, 민지는 극장에 갔다.<br>이때 농구장에 간 사람이 두 명이므로 모순이다.<br>따라서 영훈이의 말은 거짓이다.<br>(ⅱ) 인수의 말의 참인 경우<br> 독서실농구장극장영훈$×$인수$×$민지$×○$<br>영훈이와 민지의 말은 거짓이므로 영훈이와 인수는 농구장에 가지 않았고, 민지는 극장에 갔다.<br>이때 농구장에 간 사람이 아무도 없어 모순이다.<br>따라서 인수의 말은 거짓이다.<br>(ⅲ) 민지의 말이 참인 경우<br> 독서실농구장극장영훈$××○$인수$×○×$민지$○××$<br>영훈이와 인수의 말은 거짓이므로 영훈이는 농구장에 가지 않았고, 인수는 농구장에 갔고, 민지는 극장에 가지 않았다.<br>이때 민지는 독서실, 영훈이는 극장에 간 것이 되며, 모순이 없으므로 민지의 말이 참이다.<br>(ⅰ)~(ⅲ)에 의하여 모순이 없는 민지의 말이 참이어야 하므로 독서실, 농구장, 극장에 간 사람을 차례대로 나타내면 민지, 인수, 영훈이다.", "k": "c5", "c": ["영훈, 인수, 민지", "영훈, 민지, 인수", "인수, 영훈, 민지", "민지, 인수, 영훈", "민지, 영훈, 인수"], "a": "민지, 인수, 영훈", "q": "학교 수업이 끝난 후 영훈, 인수, 민지는 독서실, 농구장, 극장 중 각각 서로 다른 곳에 갔다. 나중에 세 사람은 다음과 같이 말하였다.<br>영훈$:$나는 농구장에 갔다.인수$:$나는 농구장에 가지 않았다.민지$:$나는 극장에 가지 않았다.<br>위의 세 명의 말 중 하나만 참일 때, 독서실, 농구장, 극장에 간 사람을 차례대로 바르게 나타낸 것은?", "key": "T07-01"}, "x07x47-001": {"id": "x07x47-001", "unit": "07", "theme": "01", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "① $x$의 값에 따라 참, 거짓이 달라지므로 명제가 아니다.", "k": "c5", "c": ["$x+4=5$", "$0$은 자연수이다.", "$4$의 배수는 $2$의 배수이다.", "$1\\,\\mathrm{kg}$은 $100\\,\\mathrm{g}$이다.", "삼각형의 외각의 크기의 합은 $360°$이다."], "a": "$x+4=5$", "q": "다음 중 명제가 아닌 것은?", "key": "T07-01"}, "x07x47-002": {"id": "x07x47-002", "unit": "07", "theme": "01", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "ㄱ, ㄹ. 거짓인 명제<br>ㄷ, ㅂ. 참인 명제<br>ㄴ, ㅁ. $x$의 값에 따라 참, 거짓이 달라지므로 명제가 아니다.<br>따라서 <보기>에서 명제인 것은 ㄱ, ㄷ, ㄹ, ㅂ의 $4$개이다.", "k": "c5", "c": ["$2$", "$3$", "$4$", "$5$", "$6$"], "a": "$4$", "q": "<보기>에서 명제인 것의 개수는?<br><b><보기><\/b><br>ㄱ. $3+2=6$       <br>ㄴ. $x=4+5$<br>ㄷ. $x+4=x+3+1$     <br>ㄹ. $x-5=2x+3-x$<br>ㅁ. $x+5<3x$       <br>ㅂ. $x>x-1$", "key": "T07-01"}, "x07x47-004": {"id": "x07x47-004", "unit": "07", "theme": "01", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "① 부정 : $-3$의 제곱은 $9$가 아니다. (거짓)<br>② 부정 : $\\sqrt{3}-1$은 무리수가 아니다. (거짓)<br>③ 부정 : $5$는 소수가 아니다. (거짓)<br>④ 부정 : $3$은 집합 $\\left\\{1,\\;2\\right\\}$의 원소가 아니다. (참)<br>⑤ 부정 : $6$의 양의 약수의 합은 $12$가 아니다. (거짓)<br>따라서 부정이 참인 명제인 것은 ④이다.", "k": "c5", "c": ["$-3$의 제곱은 $9$이다.", "$\\sqrt{3}-1$은 무리수이다.", "$5$는 소수이다.", "$3$은 집합 $\\left\\{1,\\;2\\right\\}$의 원소이다.", "$6$의 양의 약수의 합은 $12$이다."], "a": "$3$은 집합 $\\left\\{1,\\;2\\right\\}$의 원소이다.", "q": "다음 명제 중 그 부정이 참인 명제인 것은?", "key": "T07-01"}, "x07x68-007": {"id": "x07x68-007", "unit": "07", "theme": "01", "벌": "X07x68", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "$(a-b)^{2}+(b-c)^{2}+(c-a)^{2}=0$에서<br>$a-b=0$이고 $b-c=0$이고 $c-a=0$<br>$\\therefore \\;a=b=c$<br>따라서 $a=b=c$의 부정은<br>$a\\ne b$ 또는 $b\\ne c$ 또는 $c\\ne a$<br>이와 같은 표현은<br>⑤ $a$, $b$, $c$ 중에서 서로 다른 것이 적어도 하나 있다.", "k": "c5", "c": ["$(a-b)(b-c)(c-a)=0$", "$a\\ne b$,$b\\ne c$, $c\\ne a$", "$(a-b)(b-c)(c-a)\\ne 0$", "$a$, $b$, $c$는 서로 다르다.", "$a$, $b$, $c$ 중에서 서로 다른 것이 적어도 하나 있다."], "a": "$a$, $b$, $c$ 중에서 서로 다른 것이 적어도 하나 있다.", "q": "$a$, $b$, $c$가 실수일 때, 다음 중 $(a-b)^{2}+(b-c)^{2}+(c-a)^{2}=0$의 부정과 서로 같은 것은?", "key": "T07-01"}, "x07x20-038": {"id": "x07x20-038", "unit": "07", "theme": "02", "벌": "X07x20", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "$-4\\le x<2$에서  $x\\ge -4$ 그리고 $x<2$<br>$p\\,:\\,x<-4$에서  $\\sim p\\,:\\,x\\ge -4$<br>$q\\,:\\,x\\ge 2$에서  $\\sim q\\,:\\,x<2$<br>따라서 조건 ‘$-4\\le x<2$’는 ‘$\\sim p$ 그리고 $\\sim q$’이므로 구하는 진리집합은 $P^{C}\\cap Q^{C}=(P\\cup Q)^{C}$", "k": "c5", "c": ["$P\\cup Q$", "$P\\cap Q$", "$P^{C}\\cap Q$", "$(P\\cup Q)^{C}$", "$(P\\cap Q)^{C}$"], "a": "$(P\\cup Q)^{C}$", "q": "실수 전체의 집합에서 두 조건 $p\\,:\\,x<-4,\\;q\\,:\\,x\\ge 2$의 진리집합을 각각 $P,\\;Q$라 할 때, 다음 중 조건 ‘$-4\\le x<2$’의 진리 집합을 나타내는 것은?", "key": "T07-02"}, "x07x20-039": {"id": "x07x20-039", "unit": "07", "theme": "02", "벌": "X07x20", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "① [반례] $x=-1$이면 $x^{2}=1$이지만 $x\\ne 1$이다.<br>② [반례] $x=3,\\;y=-1$이면 $x+y=2>0$이지만 $xy=-3<0$이다.<br>③ $|\\,x\\,|>1$이면 $x<-1$ 또는 $x>1$이므로 $x^{2}>1$이다.<br>④ [반례] $x=0$이면 $-1<x<1$이지만 $x^{2}=0$이다.<br>⑤ [반례] 이웃하는 두 변의 길이가 서로 다른 직사각형은 네 각이 모두 직각인 사각형이지만 정사각형은 아니다.<br>따라서 참인 명제는 ③이다.", "k": "c5", "c": ["$x^{2}=1$이면 $x=1$이다.", "$x+y>0$이면 $xy>0$이다.", "$|\\,x\\,|>1$이면 $x^{2}>1$이다.", "$-1<x<1$이면 $x^{2}>0$이다.", "네 각이 모두 직각인 사각형은 정사각형이다."], "a": "$|\\,x\\,|>1$이면 $x^{2}>1$이다.", "q": "다음 중 참인 명제는? (단, $x,\\;y$는 실수이다.)", "key": "T07-02"}, "x07x30-051": {"id": "x07x30-051", "unit": "07", "theme": "02", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "두 진리집합 $P,\\;Q$를 수직선 위에 나타내면 오른쪽 그림과 같다.<br>또 조건 ‘$-1<x\\le 3$’의 진리집합을 수직선 위에 나타내면 오른쪽 그림과 같으므로 구하는 집합은<br>$P^{C}\\cap Q^{C}=(P\\cup Q)^{C}$", "k": "c5", "c": ["$P\\cap Q$", "$P\\cup Q^{C}$", "$P^{C}\\cup Q$", "$(P\\cap Q)^{C}$", "$(P\\cup Q)^{C}$"], "a": "$(P\\cup Q)^{C}$", "q": "실수 전체의 집합에서 두 조건 $p\\,:\\,x>3$, $q\\,:\\,x\\le -1$의 진리집합을 각각 $P,\\;Q$라 할 때, 다음 중 조건 ‘$-1<x\\le 3$’의 진리집합을 나타내는 것은?", "key": "T07-02"}, "x07x30-054": {"id": "x07x30-054", "unit": "07", "theme": "02", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "① [반례] $x=-1$이면 $x^{2}+x=0$이지만 $x<0$이다.<br>② [반례] $x=-2$, $y=-1$, $z=1$이면 $x<y<z$이지만 $xy>yz$이다.<br>④ [반례] $x=1$, $y=0$이면 $x^{2}+y^{2}>0$이지만 $y=0$이다.<br>⑤ [반례] $x=0$, $y=1$이면 $xy=0$이지만 $x^{2}+y^{2}\\ne 0$이다.", "k": "c5", "c": ["$x^{2}+x=0$이면 $x\\ge 0$이다.", "$x<y<z$이면 $xy<yz$이다.", "$x\\le 1$, $y\\le 1$이면 $x+y\\le 2$이다.", "$x^{2}+y^{2}>0$이면 $x\\ne 0$, $y\\ne 0$이다.", "$xy=0$이면 $x^{2}+y^{2}=0$이다."], "a": "$x\\le 1$, $y\\le 1$이면 $x+y\\le 2$이다.", "q": "$x,\\;y,\\;z$가 실수일 때, 다음 명제 중 참인 것은?", "key": "T07-02"}, "x07x30-061": {"id": "x07x30-061", "unit": "07", "theme": "02", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "명제 $\\sim p\\to q$가 참이므로<br>$P^{C}\\subset Q$<br>따라서 오른쪽 그림에서<br>$P\\cup Q=U$", "k": "c5", "c": ["$Q\\subset P$", "$P\\subset Q^{C}$", "$P\\cap Q=\\varnothing $", "$P\\cup Q=U$", "$P-Q=\\varnothing $"], "a": "$P\\cup Q=U$", "q": "전체집합 $U$에 대하여 두 조건 $p,\\;q$의 진리집합을 각각 $P,\\;Q$라 하자. 명제 $\\sim p\\to q$가 참일 때, 다음 중 항상 옳은 것은?", "key": "T07-02"}, "x07x30-096": {"id": "x07x30-096", "unit": "07", "theme": "02", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$\\sim q$가 $p$이기 위한 충분조 ht\\}$<br>따라서 조건 ‘$p$ 또는 $q$’의 진리집합은<br>$P\\cup Q=\\left\\{1,\\;2,\\;3,\\;4\\right\\}$<br>따라서 구하는 모든 원소의 개수는 $4$이다.", "k": "num", "a": "4", "q": "전체집합 $U=\\left\\{1,\\;2,\\;3,\\;4,\\;5,\\;6,\\;7\\right\\}$에 대하여 두 조건 $p,\\;q$가<br> $p\\,:\\,|\\,x-2\\,|=2,\\;q\\,:\\,x^{2}-4x+3\\le 0$<br>일 때, 조건 $‘p$ 또는 $q\\,’$의 진리집합의 모든 원소의 개수를 구하시오.", "key": "T07-02"}, "x07x47-011": {"id": "x07x47-011", "unit": "07", "theme": "02", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "⑤ $x(x+4)=8$에서 $x^{2}+4x-8=0$<br>$\\therefore \\;x=-2\\pm 2\\sqrt{3}$<br>따라서 $x$는 유리수가 아니므로 거짓인 명제이다.", "k": "c5", "c": ["$x=1$이면 $x^{2}=1$이다.", "$x=\\sqrt{2}$이면 $x^{2}=2$이다.", "$3x+1=7$이면 $x^{2}-2x=0$이다.", "$x(x+2)=3$이면 $x$는 정수이다.", "$x(x+4)=8$이면 $x$는 유리수이다."], "a": "$x(x+4)=8$이면 $x$는 유리수이다.", "q": "다음 중 참인 명제가 아닌 것은?", "key": "T07-02"}, "x07x47-013": {"id": "x07x47-013", "unit": "07", "theme": "02", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "두 조건 $p,\\;q$의 진리집합을 각각 $P,\\;Q$라 하자.<br>ㄱ. $P=\\left\\{x\\,|\\,x>2\\right\\},Q=\\left\\{x\\,\\left|x<-2\\,\\right.\\right\\}$ 또는 $x>2\\}$<br>따라서 $P\\subset Q$이므로 명제 $p\\,\\to \\,q$는 참이다.<br>ㄴ. $P=\\left\\{(x,\\;y)\\,|\\,x=0,\\;y=0\\right\\},$<br>$Q=\\left\\{(x,\\;y)\\,|\\,x=0,\\;y=0\\right\\}$<br>따라서 $P=Q$이므로 명제 $p\\,\\to \\,q$는 참이다.<br>ㄷ. $2x-4=2$에서 $2x=6\\therefore \\;x=3$<br>$\\therefore \\;P=\\left\\{3\\right\\}$<br>$x^{2}+2x-3=0$에서 $(x+3)(x-1)=0$<br>$\\therefore \\;x=-3$ 또는 $x=1$<br>$\\therefore \\;Q=\\left\\{-3,\\;1\\right\\}$<br>따라서 $P\\not\\subset Q$이므로 명제 $p\\,\\to \\,q$는 거짓이다.<br>따라서 <보기>에서 명제 $p\\,\\to \\,q$가 참인 것은 ㄱ, ㄴ이다.", "k": "c5", "c": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "a": "ㄱ, ㄴ", "q": "<보기>에서 두 조건 $p,\\;q$에 대하여 명제 $p\\,\\to \\,q$가 참인 것만을 있는 대로 고른 것은? (단, $x,\\;y$는 실수)<br><b><보기><\/b><br>ㄱ. $p\\,:\\,x>2,q\\,:\\,x^{2}>4$<br>ㄴ. $p\\,:\\,x^{2}+y^{2}=0,q\\,:\\,x=0$ 이고 $y=0$<br>ㄷ. $p\\,:\\,2x-4=2,q\\,:\\,x^{2}+2x-3=0$", "key": "T07-02"}, "x07x47-017": {"id": "x07x47-017", "unit": "07", "theme": "02", "벌": "X07x47 e a\\le \\dfrac{5}{2}$<br>따라서 $a$의 최댓값은 $\\dfrac{5}{2}$이고 최솟값은 $1$이므로 그 합은<br>$\\dfrac{5}{2}+1=\\dfrac{7}{2}$", "k": "c5", "c": ["$3$", "$\\dfrac{7}{2}$", "$4$", "$\\dfrac{9}{2}$", "$5$"], "a": "$\\dfrac{7}{2}$", "q": "세 조건 $p,\\;q,\\;r$가<br> $p\\,:\\,x>4$<br> $q\\,:\\,x>5-a$<br> $r\\,:\\,(x-a)(x+a)>0$<br>일 때, 명제 $p\\,\\to \\,q$와 명제 $q\\,\\to \\,r$가 모두 참이 되도록 하는 실수 $a$의 최댓값과 최솟값의 합은?", "key": "T07-04"}, "x07x68-018": {"id": "x07x68-018", "unit": "07", "theme": "04", "벌": "X07x68", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "주어진 명제의 가정을 $p$, 결론을 $q$라 하면<br>$p\\,:\\,x=a$, $q\\,:\\,x^{2}-2x-8=0$<br>조건 $q\\,:\\,x^{2}-2x-8=0$에서 $(x+2)(x-4)=0$<br>$\\therefore \\;x=-2$ 또는 $x=4$<br>두 조건 $p$, $q$의 진리집합을 각각 $P$, $Q$라 하면<br>$P=\\left\\{a\\right\\}$, $Q=\\left\\{-2,\\;4\\right\\}$<br>이때 명제 $p\\,\\rightarrow \\,q$가 참이 되려면 $P{\\subset }Q$이어야 하므로<br>$a=4(\\because \\;a>0)$", "k": "num", "a": "4", "q": "명제 ‘$x=a$이면 $x^{2}-2x-8=0$이다.’가 참이 되도록 하는 양수 $a$의 값을 구하시오.", "key": "T07-04"}, "x07x39-011": {"id": "x07x39-011", "unit": "07", "theme": "05", "벌": "X07x39", "lvl": 1, "fix": true, "src": "문제집 고쟁이", "w": "주어진 명제 ‘우리 반의 모든 학생의 수학 점수는 $80$점 미만이다.’의 부정은 ‘우리 반의 어떤 학생의 수학 점수는 $80$점 이상이다.’이므로 이와 같은 것은 ‘② 우리 반에 수학 점수가 $80$점 이상인 학생이 있다.’이다.", "k": "c5", "c": ["우리 반에 수학 점수가 $80$점 미만인 학생이 있다.", "우리 반에 수학 점수가 $80$점 이상인 학생이 있다.", "우리 반의 어떤 학생의 수학 점수는 $80$점 미만이다.", "우리 반의 모든 학생의 수학 점수는 $80$점 이상이다.", "우리 반에 수학 점수가 $80$점 이상인 학생은 없다."], "a": "우리 반에 수학 점수가 $80$점 이상인 학생이 있다.", "q": "명제<br> ‘우리 반의 모든 학생의 수학 점수는 $80$점 미만이다.’<br>의 부정은?", "key": "T07-05"}, "x07x20-053": {"id": "x07x20-053", "unit": "07", "theme": "05", "벌": "X07x20", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "① $x+2<9$에서 $x<7$ 즉 $x\\in U$인 모든 $x$에 대하여 $x+2<9$이므로 참이다.<br>② $x=3$이면 $x^{2}-1=8>7$이므로 참이다.<br>③ [반례] $x=5$이면 $x^{2}+3=28$이다.<br>④ $x=1$이면 $x^{2}-2=-1$이므로 참이다.<br>⑤ $x^{2}-6x<0$에서 $x(x-6)<0\\therefore \\;0<x<6$<br>즉 $x\\in U$인 모든 $x$에 대하여 $x^{2}-6x<0$이므로 참이다.<br>따라서 거짓인 명제는 ③이다.", "k": "c5", "c": ["모든 $x$에 대하여 $x+2<9$이다.", "어떤 $x$에 대하여 $x^{2}-1>7$이다.", "모든 $x$에 대하여 $x^{2}+3<28$이다.", "어떤 $x$에 대하여 $x^{2}-2\\le -1$이다.", "모든 $x$에 대하여 $x^{2}-6x<0$이다."], "a": "모든 $x$에 대하여 $x^{2}+3<28$이다.", "q": "전체집합 $U=\\left\\{1,\\;2,\\;3,\\;4,\\;5\\right\\}$의 원소 $x$에 대하여 다음 중 거짓인 명제는?", "key": "T07-05"}, "x07x30-069": {"id": "x07x30-069", "unit": "07", "theme": "05", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "① $2$는 소수이고, 짝수이다.<br>③ $x=\\dfrac{1}{2}$이면 $x^{2}=\\dfrac{1}{4}$이므로 $x^{2}<x$<br>④ $x=0$이면 $x^{2}+x=0$<br>⑤ [반례] $x=1+\\sqrt{2}$이면 $x^{2}=3+2\\sqrt{2}$는 무리수이다.", "k": "c5", "c": ["어떤 소수는 짝수이다.", "모든 실수 $x$에 대하여 $x^{2}\\ge 0$이다.", "어떤 양의 실수 $x$에 대하여 $x^{2}<x$이다.", "어떤 실수 $x$에 대하여 $x^{2}+x=0$이다.", "모든 무리수 $x$에 대하여 $x^{2}$은 유리수이다."], "a": "모든 무리수 $x$에 대하여 $x^{2}$은 유리수이다.", "q": "다음 중 거짓인 명제는?", "key": "T07-05"}, "x07x30-072": {"id": "x07x30-072", "unit": "07", "theme": "05", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(x)=x^{2}-6x+n$이라 하면 $2\\le x\\le 5$인 어떤 실수 $x$에 대하여 $f(x)\\ge 0$이어야 하므로 $2\\le x\\le 5$에서 함수 $f(x)$의 최댓값이 $0$ 이상이어야 한다.<br>$f(x)=x^{2}-6x+n=(x-3)^{2}+n-9$이고<br>$f(2)=n-8$, $f(3)=n-9$, $f(5)=n-5$<br>이므로 $2\\le x\\le 5$에서 함수 $f(x)$는 $x=5$일 때 최댓값 $n-5$를 갖는다.<br>따라서 $n-5\\ge 0$이어야 하므로 $n\\ge 5$<br>즉 자연수 $n$의 최솟값은 $5$이다.", "k": "num", "a": "5", "q": "명제 ‘$2\\le x\\le 5$인 어떤 실수 $x$에 대하여 $x^{2}-6x+n\\ge 0$이다.’가 참이 되도록 하는 자연수 $n$의 최솟값을 구하시오.", "key": "T07-05"}, "x07x39-046": {"id": "x07x39-046", "unit": "07", "theme": "05", "벌": "X07x39", "lvl": 2, "fix": true, "src": "문제집 고쟁이", "w": "주어진 명제의 부정은<br>‘$x\\in U,\\;y\\in U$인 모든 $x,\\;y$에 대하여 $|\\,x-y\\,|\\le 2$이다.’이고<br> $|\\,x-y\\,|-101-101201011210$<br>이므로 주어진 명제의 부정은 참이다.", "k": "c5", "c": ["$x\\in U,\\;y\\in U$인 어떤 $x,\\;y$에 대하여 $|\\,x-y\\,|\\le 2$이다. (참)", "$x\\in U,\\;y\\in U$인 어떤 $x,\\;y$에 대하여 $|\\,x-y\\,|\\le 2$이다. (거짓)", "$x\\in U,\\;y\\in U$인 모든 $x,\\;y$에 대하여 $|\\,x-y\\,|>2$이다. (거짓)", "$x\\in U,\\;y\\in U$인 모든 $x,\\;y$에 대하여 $|\\,x-y\\,|\\le 2$이다. (참)", "$x\\in U,\\;y\\in U$인 모든 $x,\\;y$에 대하여 $|\\,x-y\\,|\\le 2$이다. (거짓)"], "a": "$x\\in U,\\;y\\in U$인 모든 $x,\\;y$에 대하여 $|\\,x-y\\,|\\le 2$이다. (참)", "q": "전체집합 $U=\\left\\{-1,\\;0,\\;1\\right\\}$에 대하여 다음 명제의 부정과 그 참, 거짓을 바르게 나열한 것은?<br>$x\\in U,\\;y\\in U$인 어떤 $x,\\;y$에 대하여 $|\\,x-y\\,|>2$이다.", "key": "T07-05"}, "x07x39-047": {"id": "x07x39-047", "unit": "07", "theme": "05", "벌": "X07x39", "lvl": 2, "fix": true, "src": "문제집 고쟁이", "w": "$p\\,:\\,n\\le x\\le n+3$, $q\\,:\\,-2<x\\le 3$이라 하고, 두 조건 $p,\\;q$의 진리집합을 각각 $P,\\;Q$라 하면 주어진 명제가 참이기 위해선 $P\\cap Q\\ne \\varnothing $이어야 한다.<br>따라서 $-2<n+3$이고 $n\\le 3$이어야 하므로 $-5<n\\le 3$이어야 한다.<br>이를 만족시키는 정수 $n$은 $-4,\\;-3,\\;-2,\\;-1,\\;0,\\;1,\\;2,\\;3$으로 $8$개이다.", "k": "c5", "c": ["$6$", "$7$", "$8$", "$9$", "$10$"], "a": "$8$", "q": "명제<br>‘$n\\le x\\le n+3$인 어떤 실수 $x$에 대하여 $-2<x\\le 3$이다.’<br>가 참이 되도록 하는 정수 $n$의 개수는?", "key": "T07-05"}, "x07x39-048": {"id": "x07x39-048", "unit": "07", "theme": "05", "벌": "X07x39", "lvl": 2, "fix": true, "src": "문제집 고쟁이", "w": "명제 ‘모든 실수 $x$에 대하여 $x^{2}+2ax+5>0$이다’가 거짓이기 위해서는 그 부정인 ‘어떤 실수 $x$에 대하여 $x^{2}+2ax+5\\le 0$이다.’가 참이어야 하므로 이차방정식 $x^{2}+2ax+5=0$의 판별식을 $D_{1}$이라 하면<br>$\\dfrac{D_{1}}{4}=a^{2}-5\\ge 0$, $(a+\\sqrt{5})(a-\\sqrt{5})\\ge 0$<br>에서 $a\\ge -\\sqrt{5}$ 또는 $a\\le \\sqrt{5}\\cdots \\cdots $㉠<br>또한 명제 ‘어떤 실수 $x$에 대하여 $x^{2}-ax+2a\\le 0$이다.’가 거짓이기 위해서는 그 부정인 ‘모든 실수 $x$에 대하여 $x^{2}-ax+2a>0$이다.’가 참이어야 하므로 이차방정식 $x^{2}-ax+2a=0$의 판별식을 $D_{2}$라 하면<br>$D_{2}=a^{2}-8a<0$, $a(a-8)<0$<br>$0<a<8\\cdots \\cdots $㉡<br>㉠, ㉡에서 $\\sqrt{5}leqa<8$을 만족시키는 정수 $a$는 $3,\\;4,\\;5,\\;6,\\;7$의 $5$개이다.", "k": "c5", "c": ["$4$", "$5$", "$6$", "$7$", "$8$"], "a": "$5$", "q": "두 명제<br> ‘모든 실수 $x$에 대하여 $x^{2}+2ax+5>0$이다.’<br> ‘어떤 실수 $x$에 대하여 $x^{2}-ax+2a\\le 0$이다.’<br>가 모두 거짓이 되는 정수 $a$의 개수는?", "key": "T07-05"}, "x07x47-024": {"id": "x07x47-024", "unit": "07", "theme": "05", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "⑤ $3x-1=4x+(1-x)$를 만족시키는 실수 $x$는 존재하지 않으므로 거짓인 명제이다.", "k": "c5", "c": ["어떤 실수 $x$에 대하여 $x^{2}=5$이다.", "어떤 실수 $x$에 대하여 $x^{3}+2<0$이다.", "모든 실수 $x$에 대하여 $x^{2}+x+4>0$이다.", "어떤 실수 $x$에 대하여 $x^{2}\\le 3x+4$이다.", "모든 실수 $x$에 대하여 $3x-1=4x+(1-x)$이다."], "a": "모든 실수 $x$에 대하여 $3x-1=4x+(1-x)$이다.", "q": "다음 중 거짓인 명제는?", "key": "T07-05"}, "x07x47-025": {"id": "x07x47-025", "unit": "07", "theme": "05", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "주어진 명제가 거짓이려면 이 명제의 부정<br>‘모든 실수 $x$에 대하여 $x^{2}+8x+2k-1>0$이다.’<br>가 참이어야 한다.<br>이차방정식 $x^{2}+8x+2k-1=0$의 판별식을 $D$라 하면<br>$\\dfrac{D}{4}=4^{2}-1\\times (2k-1)<0$<br>$\\therefore \\;k>\\dfrac{17}{2}$<br>따라서 정수 $k$의 최솟값은 $9$이다.", "k": "num", "a": "9", "q": "명제<br>  ‘어떤 실수 $x$에 대하여 $x^{2}+8x+2k-1\\le 0$이다.’<br>가 거짓이 되도록 하는 정수 $k$의 최솟값을 구하시오.", "key": "T07-05"}, "x07x68-029": {"id": "x07x68-029", "unit": "07", "theme": "05", "벌": "X07x68", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "① 주어진 식을 정리하면 $-2=1$이므로 거짓인 명제이다.<br>② $x$의 값에 따라 참, 거짓이 달라지므로 명제가 아니다.<br>③ $10$은 $15$의 약수가 아니므로 거짓인 명제이다.<br>④ $3$은 $3$의 배수이지만 $6$의 배수가 아니므로 거짓인 명제이다.<br>⑤ 넓이가 같아도 모양이 다를 수 있으므로 거짓인 명제이다.<br>따라서 명제가 아닌 것은 ②이다.", "k": "c5", "c": ["$3x-2=1+3x$", "$x^{2}-5x-6>0$", "$10$은 $15$의 약수이다.", "$3$의 배수는 $6$의 배수이다.", "넓이가 같은 두 사각형은 서로 닮음이다."], "a": "$x^{2}-5x-6>0$", "q": "다음 중 명제가 아닌 것은?", "key": "T07-05"}, "x07x68-032": {"id": "x07x68-032", "unit": "07", "theme": "05", "벌": "X07x68", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "명제 $p\\,\\rightarrow \\,\\sim q$가 거짓이려면 $P{\\not\\subset }Q^{C\\,}$이어야 하므로 집합 $P$의 원소이지만 집합 $Q^{C\\,}$의 원소가 아닌 원소를 찾으면 된다.<br>따라서 반례를 원소로 갖는 집합은<br>$P-Q^{C\\,}=P{\\cap }Q$", "k": "c5", "c": ["$P{\\cap }Q$", "$P{\\cap }Q^{C\\,}$", "$P^{C\\,}\\cap {Q}$", "$P^{C\\,}{\\cap }Q^{C\\,}$", "$P^{C\\,}\\cup {Q^{C\\,}}$"], "a": "$P{\\cap }Q$", "q": "전체집합 $U$에 대하여 두 조건 $p$, $q$의 진리집합을 각각 $P$, $Q$라 할 때, 다음 중 명제 $p\\,\\to \\,\\sim \\,q$가 거짓임을 보이는 반례를 원소로 갖는 집합은?", "key": "T07-05"}, "x07x68-034": {"id": "x07x68-034", "unit": "07", "theme": "05", "벌": "X07x68", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "$|\\,x-a\\,|{\\le }1$에서 $-1{\\le }x-a{\\le }1$<br>$\\therefore \\;a-1{\\le }x{\\le }a+1$<br>$x^{2}-2x-8>0$에서 $(x+2)(x-4)>0$<br>$\\therefore \\;x<-2$ 또는 $x>4$<br>두 조건 $p$, $q$의 진리집합을 각각 $P$, $Q$라 하면<br>$P=\\{x\\,\\left|\\,a-1{\\le }x{\\le }a+1\\right\\}$<br>$Q=\\{x\\,\\left|\\,x<-2\\right\\}$ 또는 $x>4\\}$<br>명제 $p\\,\\to \\,\\sim q$가 참이 되려면 $P{\\subset }Q^{C\\,}$이어야 한다.<br>이때 $Q^{C\\,}=\\{x\\,\\left|\\,-2{\\le }x{\\le }4\\right\\}$이므로<br>위의 그림에서 $a-1{\\ge }-2$, $a+1{\\le }4$이어야 하므로<br>$-1{\\le }a{\\le }3$<br>따라서 실수 $a$의 최댓값은 $3$이다.", "k": "c5", "c": ["$1$", "$2$", "$3$", "$4$", "$5$"], "a": "$3$", "q": "실수 $x$에 대한 두 조건<br> $p\\,:\\,|\\,x-a\\,|\\le 1$<br> $q\\,:\\,x^{2}-2x-8>0$<br>에 대하여 $p\\,\\to \\,\\sim q$가 참이 되도록 하는 실수 $a$의 최댓값은?", "key": "T07-05"}, "x07x68-037": {"id": "x07x68-037", "unit": "07", "theme": "05", "벌": "X07x68", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "① [반례] $x=-1$, $y=-2$이면 $xy>0$이지만 $x<0$이고<br>$y<0$이다. (거짓)<br>② [반례] $x=0$이면 $x^{2}=0$이다. (거짓)<br>③ [반례] $x=\\sqrt{2}$, $y=-\\sqrt{2}$이면 $x+y$는 유리수이다. (거짓)<br>④ 모든 실수 $x$에 대하여<br>$x^{2}-2x+2=(x-1)^{2}+1>0$ (거짓)<br>⑤ $3x-2=x+2(x-3)+4$에서 $3x-2=3x-2$<br>따라서 모든 실수 $x$에 대하여 성립한다. (참)<br>따라서 참인 명제는 ⑤이다.", "k": "c5", "c": ["$xy>0$이면 $x>0$이고 $y>0$이다.", "모든 실수 $x$에 대하여 $x^{2}>0$이다.", "모든 무리수 $x$, $y$에 대하여 $x+y$는 무리수이다.", "어떤 실수 $x$에 대하여 $x^{2}-2x+2{\\le }0$이다.", "모든 실수 $x$에 대하여 $3x-2=x+2(x-3)+4$이다."], "a": "모든 실수 $x$에 대하여 $3x-2=x+2(x-3)+4$이다.", "q": "다음 중 참인 명제는?", "key": "T07-05"}, "x07x68-039": {"id": "x07x68-039", "unit": "07", "theme": "05", "벌": "X07x68", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "①, ② 유리수의 제곱, 유리수의 세제곱도 유리수이므로 $x$가 유리수이면 $x^{2}$, $x^{3}$도 유리수이다. (참)<br>③ [반례] $x=\\sqrt{2}$이면 $x^{2}=2$는 유리수이지만 $x^{3}=2\\sqrt{2}$는 무리수이다. (거짓)<br>④ $x\\ne 0$일 때, 유리수의 나눗셈의 몫은 유리수이므로 $x^{2}$과 $x^{3}$이 유리수이면 $\\dfrac{x^{3}}{x^{2}}=x$는 유리수이다. (참)<br>⑤ 유리수와 유리수의 곱은 유리수이므로 유리수 $x$와 유리수 $x^{2}$의 곱인 $x^{3}$도 유리수이다. (참)<br>따라서 거짓인 명제는 ③이다.", "k": "c5", "c": ["$p$이면 $q$이다.", "$p$이면 $r$이다.", "$q$이면 $r$이다.", "$q$이고 $r$이면 $p$이다.", "$p$이고 $q$이면 $r$이다."], "a": "$q$이면 $r$이다.", "q": "세 조건 $p$, $q$, $r$가<br> $p\\,:\\,x$는 유리수이다.<br> $q\\,:\\,x^{2}$은 유리수이다.<br> $r\\,:\\,x^{3}$은 유리수이다.<br>일 때, 다음 중 거짓인 명제는?", "key": "T07-05"}, "x07x68-041": {"id": "x07x68-041", "unit": "07", "theme": "05", "벌": "X07x68", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "주어진 명제의 부정은<br>‘모든 실수 $x$에 대하여 $x^{2}-18x+k{\\ge }0$이다.’<br>즉, 모든 실수 $x$에 대하여 이차부등식 $x^{2}-18x+k{\\ge }0$이<br>성립해야 하므로 이차방정식 $x^{2}-18x+k=0$의 판별식을 $D$라 하면<br>$\\dfrac{D}{4}=(-9)^{2}-k{\\le }0$<br>$\\therefore \\;k{\\ge }81$<br>따라서 $k$의 최솟값은 $81$이다.", "k": "num", "a": "81", "q": "실수 전체의 집합에 대하여 명제<br> ‘어떤 실수 $x$에 대하여 $x^{2}-18x+k<0$이다.’<br>의 부정이 참이 되도록 하는 상수 $k$의 최솟값을 구하시오.", "key": "T07-05"}, "x07x39-014": {"id": "x07x39-014", "unit": "07", "theme": "06", "벌": "X07x39", "lvl": 1, "fix": true, "src": "문제집 고쟁이", "w": "주어진 명제의 역과 참, 거짓은 다음과 같다.<br>① 역 : $x^{2}=y^{2}$이면 $x=y$이다. (거짓)<br>[반례] $x=-1,\\;y=1$일 때, $x^{2}=y^{2}$이지만 $x\\ne y$이다.<br>② 역 : $x^{2}=9$이면 $x^{2}-6x+9=0$이다. (거짓)<br>[반례] $x=-3$일 때, $(-3)^{2}=9$이지만 $(-3)^{2}-6\\times (-3)+9\\ne 0$이다.<br>③ 역 : $x^{2}\\le 1$이면 $x\\le 1$이다. (참)<br>[증명] $x^{2}\\le 1$이면 $x^{2}-1=(x+1)(x-1)\\le 0$에서  $-1\\le x\\le 1$이므로 $x\\le 1$이다.<br>④ 역 : $x+y>0$이면 $x>0,y>0$이다. (거짓)<br>[반례] $x=2,y=-1$일 때,<br>$x+y=2+(-1)>0$이지만 $y<0$이다.<br>⑤ 역 : $-2\\le x\\le 4$이면 $-1\\le x<2$이다. (거짓)<br>[반례] $x=-2$<br>따라서 역이 참인 명제는 ③이다.", "k": "c5", "c": ["$x=y$이면 $x^{2}=y^{2}$이다.", "$x^{2}-6x+9=0$이면 $x^{2}=9$이다.", "$x\\le 1$이면 $x^{2}\\le 1$이다.", "$x>0,y>0$이면 $x+y>0$이다.", "$-1\\le x<2$이면 $-2\\le x\\le 4$이다."], "a": "$x\\le 1$이면 $x^{2}\\le 1$이다.", "q": "다음 중 역이 참인 명제는? (단, $x,\\;y$는 실수이다.)", "key": "T07-06"}, "x07x20-055": {"id": "x07x20-055", "unit": "07", "theme": "06", "벌": "X07x20", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "① 역 : $ab=0$이면 $a=0$이다. (거짓)<br>[반례] $a=1,\\;b=0$이면 $ab=0$이지만 $a\\ne 0$이다.<br>② 역 : $a^{2}\\ge 1$이면 $a\\ge 1$이다. (거짓)<br>[반례] $a=-2$이면 $a^{2}=4>1$이지만 $a<1$이다.<br>③ 역 : $a+b\\le 2$이면 $a\\le 1$이고 $b\\le 1$이다. (거짓)<br>[반례] $a=-1,\\;b=2$이면 $a+b=1<2$이지만 $b>1$이다.<br>④ 역 : $a\\ne 0$ 또는 $b\\ne 0$이면 $a^{2}+b^{2}>0$이다. (참)<br>⑤ 역 : $a+b$가 짝수이면 $ab$는 홀수이다. (거짓)<br>[반례] $a=2,\\;b=4$이면 $a+b=6$은 짝수이지만 $ab=8$도 짝수이다.<br>따라서 그 역이 참인 명제는 ④이다.", "k": "c5", "c": ["$a=0$이면 $ab=0$이다.", "$a\\ge 1$이면 $a^{2}\\ge 1$이다.", "$a\\le 1$이고 $b\\le 1$이면 $a+b\\le 2$이다.", "$a^{2}+b^{2}>0$이면 $a\\ne 0$ 또는 $b\\ne 0$이다.", "$ab$가 홀수이면 $a+b$는 짝수이다."], "a": "$a^{2}+b^{2}>0$이면 $a\\ne 0$ 또는 $b\\ne 0$이다.", "q": "다음 중 그 역이 참인 명제는? (단, $a,\\;b$는 실수이다.)", "key": "T07-06"}, "x07x20-056": {"id": "x07x20-056", "unit": "07", "theme": "06", "벌": "X07x20", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "명제 $\\sim q\\,\\to \\,p$의 역 $p\\,\\to \\,\\sim q$가 참이므로 그 대우인 $q\\,\\to \\,\\sim p$도 참이다.", "k": "c5", "c": ["$p\\,\\to \\,q$", "$\\sim p\\,\\to \\,q$", "$q\\,\\to \\,p$", "$q\\,\\to \\,\\sim p$", "$\\sim q\\,\\to \\,\\sim p$"], "a": "$q\\,\\to \\,\\sim p$", "q": "두 조건 $p,\\;q$에 대하여 명제 $\\sim q\\,\\to \\,p$의 역이 참일 때, 다음 중 항상 참인 명제는?", "key": "T07-06"}, "x07x30-074": {"id": "x07x30-074", "unit": "07", "theme": "06", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "① 역 : $xy=0$이면 $x=0$이다.<br>[반례] $x=3$, $y=0$이면 $xy=0$이지만 $x\\ne 0$이다.<br>② 역 : $x>2$이면 $3x-7>0$이다.<br>[반례] $x=\\dfrac{7}{3}$이면 $x>2$이지만 $3x-7=0$이다.<br>③ 역 : $xy$가 짝수이면 $x,\\;y$는 짝수이다.<br>[반례] $x=2$, $y=3$이면 $xy=6$은 짝수이지만 $y$는 홀수이다.<br>④ 역 : $x+y>0$이면 $x>0$이고 $y>0$이다.<br>[반례] $x=5$, $y=-4$이면 $x+y>0$이지만 $x>0$, $y<0$이다.<br>⑤ 역 : $x=0$이고 $y=0$이면 $|\\,x\\,|+|\\,y\\,|=0$이다. (참)", "k": "c5", "c": ["$x=0$이면 $xy=0$이다.", "$3x-7>0$이면 $x>2$이다.", "$x,\\;y$가 짝수이면 $xy$는 짝수이다.", "$x>0$이고 $y>0$이면 $x+y>0$이다.", "$|\\,x\\,|+|\\,y\\,|=0$이면 $x=0$이고 $y=0$이다."], "a": "$|\\,x\\,|+|\\,y\\,|=0$이면 $x=0$이고 $y=0$이다.", "q": "$x,\\;y$가 실수일 때, 다음 중 그 역이 참인 명제는?", "key": "T07-06"}, "x07x30-075": {"id": "x07x30-075", "unit": "07", "theme": "06", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "명제 $p\\to \\sim q$의 역 $\\sim q\\to p$가 참이므로 그 대우 $\\sim p\\to q$도 항상 참이다.", "k": "c5", "c": ["$p\\to q$", "$\\sim p\\to q$", "$\\sim p\\to \\sim q$", "$q\\to p$", "$q\\to \\sim p$"], "a": "$\\sim p\\to q$", "q": "두 조건 $p,\\;q$에 대하여 명제 $p\\to \\sim q$의 역이 참일 때, 다음 중 항상 참인 명제는?", "key": "T07-06"}, "x07x30-077": {"id": "x07x30-077", "unit": "07", "theme": "06", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "① 역 : $x>1$이면 $x>0$이다. (참)<br>명제 : [반례] $x=\\dfrac{1}{2}$이면 $x>0$이지만 $x<1$이다.<br>주어진 명제가 거짓이므로 그 대우도 거짓이다.<br>② 역 : $x+1=0$이면 $x^{2}=1$이다. (참)<br>명제 : [반례] $x=1$이면 $x^{2}=1$이지만 $x+1=2$이다.<br>주어진 명제가 거짓이므로 그 대우도 거짓이다.<br>③ 역 : $x(x-2)=0$이면 $x=2$이다.<br>[반례] $x=0$이면 $x(x-2)=0$이지만 $x\\ne 2$이다.<br>또 주어진 명제가 참이므로 그 대우도 참이다.<br>④ 역 : $ac=bc$이면 $a=b$이다.<br>[반례] $a=1$, $b=2$, $c=0$이면 $ac=bc=0$이지만 $a\\ne b$이다.<br>또 주어진 명제가 참이므로 그 대우도 참이다.<br>⑤ 역 : $A\\cap B=A$이면 $A\\subset B$이다. (참)<br>또 주어진 명제가 참이므로 그 대우도 참이다.<br>따라서 그 역과 대우가 모두 참인 명제는 ⑤이다.", "k": "c5", "c": ["$x>0$이면 $x>1$이다.", "$x^{2}=1$이면 $x+1=0$이다.", "$x=2$이면 $x(x-2)=0$이다.", "$a=b$이면 $ac=bc$이다.", "두 집합 $A,\\;B$에 대하여 $A\\subset B$이면 $A\\cap B=A$이다."], "a": "두 집합 $A,\\;B$에 대하여 $A\\subset B$이면 $A\\cap B=A$이다.", "q": "다음 중 그 역과 대우가 모두 참인 명제는?<br>(단, $a,\\;b,\\;c,\\;x$는 실수이다.)", "key": "T07-06"}, "x07x39-051": {"id": "x07x39-051", "unit": "07", "theme": "06", "벌": "X07x39", "lvl": 2, "fix": true, "src": "문제집 고쟁이", "w": "명제와 그 대우의 참, 거짓은 일치하므로 주어진 명제와 그 역이 모두 참인 것을 구하면 된다.<br>ㄱ. 명제: $a+1=0$이면 $a^{3}+1=0$이다. (참)<br>[증명] $a=-1$이면 $a^{3}+1=(-1)^{3}+1=0$<br>역: $a^{3}+1=0$이면 $a+1=0$이다. (참)<br>[증명] $a^{3}+1=(a+1)(a^{2}-a+1)=0$<br>$a$는 실수이므로 $a+1=0$<br>ㄴ. 명제: $a+b>0$, $ab>0$이면 $a>0,\\;b>0$이다. (참)<br>[증명] $ab>0$에서 $a>0,\\;b>0$ 또는 $a<0,\\;b<0$이고,<br>이때 $a+b>0$이므로 $a>0,\\;b>0$이다.<br>역: $a>0,\\;b>0$이면 $a+b>0,\\;ab>0$이다. (참)<br>ㄷ. 명제: $a^{2}+b^{2}>0$이면 $a\\ne 0$ 또는 $b\\ne 0$이다. (참)<br>[증명] 대우는 ‘$a=0,\\;b=0$이면 $a^{2}+b^{2}\\le 0$이다.’이고 대우가 참이므로 명제도 참이다.<br>역: $a\\ne 0$ 또는 $b\\ne 0$이면 $a^{2}+b^{2}>0$이다. (참)<br>[증명] 대우는 ‘$a^{2}+b^{2}\\le 0$이면 $a=0,\\;b=0$이다.’이고, 대우가 참이므로 명제도 참이다.<br>ㄹ. 명제: $ab=0$이면 $a^{2}+ab+2b^{2}=0$이다. (거짓)<br>[반례] $a=1,\\;b=0$일 때, $ab=1\\times 0=0$이지만<br>$a^{2}+ab+2b^{2}=1+0+0\\ne 0$이므로 거짓이다.<br>역: $a^{2}+ab+2b^{2}=0$이면 $ab=0$이다. (참)<br>[증명] $a^{2}+ab+2b^{2}=\\left(a+\\dfrac{b}{2}\\right)^{2}+\\dfrac{7}{4}b^{2}=0$에서<br>$a+\\dfrac{b}{2}=0$, $b=0$이므로 $a=b=0\\therefore \\;ab=0$<br>ㅁ. 명제: $ab+1>a+b>2$이면 $a>1,\\;b>1$이다. (참)<br>[증명] $ab+1>a+b$에서<br>$ab-a-b+1=(a-1)(b-1)>0$<br>$a>1,\\;b>1$ 또는 $a<1,\\;b<1$<br>이때 $a+b>2$이므로 $a>1,\\;b>1$<br>역: $a>1,\\;b>1$이면 $ab+1>a+b>2$이다. (참)<br>[증명] $a>1,\\;b>1$이면 $a+b>2$이고,<br>$ab+1-(a+b)=(a-1)(b-1)>0$<br>$\\therefore \\;ab+1>a+b>2$<br>따라서 역과 대우가 모두 참인 것은 ㄱ, ㄴ, ㄷ, ㅁ으로 $4$개이다.", "k": "c5", "c": ["$1$", "$2$", "$3$", "$4$", "$5$"], "a": "$4$", "q": "두 실수 $a,\\;b$에 대한 다음 <보기>의 명제 중 그 역과 대우가 모두 참인 것의 개수는?<br><b><보기><\/b><br>ㄱ. $a+1=0$이면 $a^{3}+1=0$이다.<br>ㄴ. $a+b>0,\\;ab>0$이면 $a>0,\\;b>0$이다.<br>ㄷ. $a^{2}+b^{2}>0$이면 $a\\ne 0$ 또는 $b\\ne 0$이다.<br>ㄹ. $ab=0$이면 $a^{2}+ab+2b^{2}=0$이다.<br>ㅁ. $ab+1>a+b>2$이면 $a>1,\\;b>1$이다.", "key": "T07-06"}, "x07x39-054": {"id": "x07x39-054", "unit": "07", "theme": "06", "벌": "X07x39", "lvl": 2, "fix": true, "src": "문제집 고쟁이", "w": "세 조건 $p,\\;q,\\;r,\\;s$를 각각 다음과 같이 정의하자.<br>$p\\,:$ 제품이 $10$대, $20$대에게 선호도가 높다.<br>$q\\,:$ 제품의 가격이 싸다.<br>$r\\,:$제품의 기능이 많다.<br>$s\\,:$ 제품의 판매량이 많다.<br>(가), (나), (다)에 의하여 알 수 있는 참인 명제는 다음과 같다.<br>(가) $p\\;\\to \\;s$, (나) $q\\;\\to \\;s$, (다) $r\\;\\to \\;p$<br>각 선지가 나타내는 명제는 다음과 같다.<br>① $r\\;\\to \\,SIMq$ ② $SIMq\\;\\to \\,\\sim s$ ③ $\\sim s\\;\\to \\,\\sim r$<br>④ $p\\;\\to \\;r$ ⑤ $p\\;\\to \\,\\sim q$<br>(가)와 (나)에 의하여 $r\\;\\to \\;s$가 참이므로 그 대우인 $\\sim s\\;\\to \\,\\sim 4$도  참이다.<br>따라서 옳은 것은 ③이다.", "k": "c5", "c": ["기능이 많은 제품은 가격이 싸지 않다.", "가격이 싸지 않은 제품은 판매량이 많지 않다.", "판매량이 많지 않은 제품은 기능이 많지 않다.", "$10$대, $20$대에게 선호도가 높은 제품은 기능이 많다.", "$10$대, $20$대에게 선호도가 높은 제품은 가격이 싸지 않다."], "a": "판매량이 많지 않은 제품은 기능이 많지 않다.", "q": "어느 휴대폰 제조 회사에서 휴대폰 판매량과 사용자 선호도에 대한 시장 조사를 하여 다음과 같은 결과를 얻었다.<br>(가) $10$대, $20$대에게 선호도가 높은 제품은 판매량이 많다.<br>(나) 가격이 싼 제품은 판매량이 많다.<br>(다) 기능이 많은 제품은 $10$대, $20$대에게 선호도가 높다.<br>위의 결과로부터 추론한 내용으로 항상 옳은 것은?", "key": "T07-06"}, "x07x47-026": {"id": "x07x47-026", "unit": "07", "theme": "06", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "① 역 : $a\\ne 0$ 또는 $b\\ne 0$이면 $a^{2}+b^{2}\\ne 0$이다. (참)<br>② 역 : $a^{2}=a$이면 $a=0$ 또는 $a=1$이다. (참)<br>③ 역 : $a-1>0$이면 $2a-1>0$이다. (참)<br>④ 역 : $ab>b$이면 $a<0$이고 $b<0$이다. (거짓)<br>    [반례] $a=2,\\;b=1$<br>⑤ 역 : $a=0$이고 $b=0$이면 $a+b=0$이고 $ab=0$이다. (참)<br>따라서 역이 거짓인 명제는 ④이다.", "k": "c5", "c": ["$a^{2}+b^{2}\\ne 0$이면 $a\\ne 0$ 또는 $b\\ne 0$이다.", "$a=0$ 또는 $a=1$이면 $a^{2}=a$이다.", "$2a-1>0$이면 $a-1>0$이다.", "$a<0$이고 $b<0$이면 $ab>b$이다.", "$a+b=0$이고 $ab=0$이면 $a=0$이고 $b=0$이다."], "a": "$a<0$이고 $b<0$이면 $ab>b$이다.", "q": "다음 중 그 역이 거짓인 명제는? (단, $a,\\;b$는 실수)", "key": "T07-06"}, "x07x47-027": {"id": "x07x47-027", "unit": "07", "theme": "06", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "① 대우 : $x\\ne 2$이면 $x^{2}\\ne 4$이다. (거짓)<br>      [반례] $x=-2$<br>② 대우 : $x\\le y$이면 $x^{2}\\le y^{2}$이다. (거짓)<br>     [반례] $x=-2,\\;y=1$<br>③ 대우 : $x\\ne 0$이면 $x^{2}\\ne 3x$이다. (거짓)<br>   [반례] $x=3$<br>⑤ 대우 : 삼각형 $\\mathrm{ABC}$가 정삼각형이 아니면 삼각형 $\\mathrm{ABC}$의 두 내각의 크기는 같지 않다. (거짓)<br>[반례] 삼각형 $\\mathrm{ABC}$가 이등변삼각형<br>따라서 대우가 참인 명제는 ④이다.", "k": "c5", "c": ["$x^{2}=4$이면 $x=2$이다.", "$x^{2}>y^{2}$이면 $x>y$이다.", "$x^{2}=3x$이면 $x=0$이다.", "$x=10$이면 $x^{2}=100$이다.", "삼각형 $\\mathrm{ABC}$의 두 내각의 크기가 같으면 삼각형 $\\mathrm{ABC}$는 정삼각형이다."], "a": "$x=10$이면 $x^{2}=100$이다.", "q": "다음 중 그 대우가 참인 명제는? (단, $x,\\;y$는 실수)", "key": "T07-06"}, "x07x47-064": {"id": "x07x47-064", "unit": "07", "theme": "06", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "$x>0,\\;y>0$이므로<br>$\\left(4x+\\dfrac{1}{y}\\right)\\left(\\dfrac{1}{x}+16y\\right)=20+64xy+\\dfrac{1}{xy}$<br>$\\ge 20+2\\sqrt{64xy\\times \\dfrac{1}{xy}}$<br>$=20+16=36$<br>$(\\begin{matrix}\\, \\\\ \\,\\end{matrix}$단, 등호는 $xy=\\dfrac{1}{8}$일 때 성립$\\begin{matrix}\\, \\\\ \\,\\end{matrix})$<br>따라서 구하는 최솟값은 $36$이다.", "k": "c5", "c": ["$34$", "$36$", "$38$", "$40$", "$42$"], "a": "$36$", "q": "$x>0,\\;y>0$일 때, $\\left(4x+\\dfrac{1}{y}\\right)\\left(\\dfrac{1}{x}+16y\\right)$의 최솟값은?", "key": "T07-06"}, "x07x47-065": {"id": "x07x47-065", "unit": "07", "theme": "06", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "$a>4$에서 $a-4>0$이므로<br>$2a+\\dfrac{2}{a-4}=2(a-4)+\\dfrac{2}{a-4}+8$<br>$\\ge 2\\sqrt{2(a-4)\\times \\dfrac{2}{a-4}}+8$<br>$=4+8=12$<br>이때 등호는 $2(a-4)=\\dfrac{2}{a-4}$일 때 성립하므로<br>$(a-4)^{2}=1\\therefore \\;a=5\\;(\\because \\;a>4)$<br>따라서 $m=12,\\;n=5$이므로 $m+n=17$", "k": "num", "a": "17", "q": "$a>4$일 때, $2a+\\dfrac{2}{a-4}$의 최솟값을 $m,$그때의 $a$의 값을 $n$이라 하자. 이때 $m+n$의 값을 구하시오.", "key": "T07-06"}, "x07x47-066": {"id": "x07x47-066", "unit": "07", "theme": "06", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "$a>0,\\;b>0,\\;c>0$이므로<br>$\\dfrac{a+b}{c}+\\dfrac{b+c}{a}+\\dfrac{c+a}{b}$<br>$=\\left(\\dfrac{a}{b}+\\dfrac{b}{a}\\right)+\\left(\\dfrac{b}{c}+\\dfrac{c}{b}\\right)+\\left(\\dfrac{c}{a}+\\dfrac{a}{c}\\right)$<br>$\\ge 2\\sqrt{\\dfrac{a}{b}\\times \\dfrac{b}{a}}+2\\sqrt{\\dfrac{b}{c}\\times \\dfrac{c}{b}}+2\\sqrt{\\dfrac{c}{a}\\times \\dfrac{a}{c}}$<br>$=2+2+2=6$(단, 등호는 $a=b=c$일 때 성립)<br>따라서 구하는 최솟값은 $6$이다.", "k": "num", "a": "6", "q": "$a>0,\\;b>0,\\;c>0$일 때, $\\dfrac{a+b}{c}+\\dfrac{b+c}{a}+\\dfrac{c+a}{b}$의 최솟값을 구하시오.", "key": "T07-06"}, "x07x47-067": {"id": "x07x47-067", "unit": "07", "theme": "06", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "$x\\ne 0$이므로 $\\dfrac{x}{x^{2}+4x+4}=\\dfrac{1}{x+4+\\dfrac{4}{x}}\\cdots \\cdots $ ㉠<br>이때 $x>0$이므로<br>$x+4+\\dfrac{4}{x}\\ge 2\\sqrt{x\\times \\dfrac{4}{x}}+4$<br>$=4+4=8$ (단, 등호는 $x=2$일 때 성립)<br>㉠에서 $\\dfrac{x}{x^{2}+4x+4}\\le \\dfrac{1}{8}$<br>따라서 구하는 최댓값은 $\\dfrac{1}{8}$이다.", "k": "c5", "c": ["$\\dfrac{1}{8}$", "$\\dfrac{1}{6}$", "$1$", "$4$", "$8$"], "a": "$\\dfrac{1}{8}$", "q": "$x>0$일 때, $\\dfrac{x}{x^{2}+4x+4}$의 최댓값은?", "key": "T07-06"}, "x07x30-079": {"id": "x07x30-079", "unit": "07", "theme": "07", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "주어진 명제가 참이므로 그 대우<br>‘$agek$이고 $b\\ge -1$이면 $a+b\\ge 4$이다.’도 참이다.<br>$agek$, $b\\ge -1$에서 $a+b\\ge k-1$이므로<br>$k-1\\ge 4\\therefore k\\ge 5$<br>따라서 $k$의 최솟값은 $5$이다.", "k": "num", "a": "5", "q": "두 실수 $a,\\;b$에 대하여 명제<br> ‘$a+b<4$이면 $a<k$ 또는 $b<-1$이다.’<br>가 참일 때, 실수 $k$의 최솟값을 구하시오.", "key": "T07-07"}, "x07x30-080": {"id": "x07x30-080", "unit": "07", "theme": "07", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "주어진 명제가 참이므로 그 대우<br>‘$x-a=0$이면 $x^{2}-8x+15=0$이다.’<br>도 참이다.<br>이때 $x^{2}-8x+15=0$에 $x-a=0$, 즉 $x=a$를 대입하면<br>$a^{2}-8a+15=0$, $(a-3)(a-5)=0$<br>$\\therefore a=3$ 또는 $a=5$<br>따라서 구하는 합은<br>$3+5=8$", "k": "num", "a": "8", "q": "명제 ‘$x^{2}-8x+15\\ne 0$이면 $x-a\\ne 0$이다.’가 참일 때, 모든 실수 $a$의 값의 합을 구하시오.", "key": "T07-07"}, "x07x30-099": {"id": "x07x30-099", "unit": "07", "theme": "07", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$p$가 $q$이기 위한 충분조건이 되려면 명제 ‘$4x^{2}-4x-3\\ne 0$이면 $2x+a\\ne 0$이다.’가 참이어야 하고, 이 명제의 대우 ‘$2x+a=0$이면 $4x^{2}-4x-3=0$이다.’도 참이어야 한다.<br>$4x^{2}-4x-3=0$에 $2x+a=0$, 즉 $x=-\\dfrac{a}{2}$를 대입하면<br>$4\\cdot \\left(-\\dfrac{a}{2}\\right)^{2}-4\\cdot \\left(-\\dfrac{a}{2}\\right)-3=0$<br>$a^{2}+2a-3=0$, $(a+3)(a-1)=0$<br>$\\therefore a=-3$ 또는 $a=1$<br>따라서 모든 실수 $a$의 값의 합은 $-3+1=-2$", "k": "num", "a": "-2", "q": "두 조건 $p\\,:\\,4x^{2}-4x-3\\ne 0$, $q\\,:\\,2x+a\\ne 0$에 대하여 $p$가 $q$이기 위한 충분조건이 되도록 하는 모든 실수 $a$의 값의 합을 구하시오.", "key": "T07-07"}, "x07x47-029": {"id": "x07x47-029", "unit": "07", "theme": "07", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "주어진 명제의 대우 ‘$a\\ge k$이고 $b\\ge 3$이면 $a+b\\ge 6$이다.’<br>가 참이다.<br>$a\\ge k$이고 $b\\ge 3$에서 $a+b\\ge k+3$이므로<br>$k+3\\ge 6\\therefore \\;k\\ge 3$<br>따라서 상수 $k$의 최솟값은 $3$이다.", "k": "c5", "c": ["$-1$", "$1$", "$2$", "$3$", "$4$"], "a": "$3$", "q": "실수 $a,\\;b$에 대하여<br> ‘$a+b<6$이면 $a<k$ 또는 $b<3$이다.’<br>가 참일 때, 상수 $k$의 최솟값은?", "key": "T07-07"}, "x07x47-030": {"id": "x07x47-030", "unit": "07", "them  \\,r$, $q\\,\\to \\,\\sim r$가 모두 참일 때, 다음 명제 중 항상 참이라 할 수 없는 것은?", "key": "T07-08"}, "x07x68-053": {"id": "x07x68-053", "unit": "07", "theme": "08", "벌": "X07x68", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "명제 (가), (나)에서<br>$p\\,:$기온이 높다.,<br>$q\\,:$제품 $\\mathrm{A}$가 잘 팔린다.,<br>$r\\,:$제품 $\\mathrm{B}$가 잘 팔린다.<br>라 하자.<br>(가)에서 명제 $p\\,\\to \\,q$가 참이고 (나)에서 명제 $r\\,\\to \\,\\sim q$와<br>그 대우 $q\\,\\to \\,\\sim r$가 참이다.<br>두 명제 $p\\,\\to \\,q$, $q\\,\\to \\,\\sim r$가 참이므로 명제 $p\\,\\to \\,\\sim r$와<br>그 대우 $r\\,\\to \\,\\sim p$가 참이다.<br>① $q\\,\\to \\,p$ ② $q\\,\\to \\,r$ ③ $p\\,\\to \\,\\sim r$ ④ $\\sim p\\,\\rightarrow \\,r$ ⑤ $r\\,\\to \\,p$<br>따라서 항상 참인 명제는 ③이다.", "k": "c5", "c": ["제품 $\\mathrm{A}$가 잘 팔리면 기온이 높다.", "제품 $\\mathrm{A}$가 잘 팔리면 제품 $\\mathrm{B}$가 잘 팔린다.", "기온이 높으면 제품 $\\mathrm{B}$가 잘 팔리지 않는다.", "기온이 높지 않으면 제품 $\\mathrm{B}$가 잘 팔린다.", "제품 $\\mathrm{B}$가 잘 팔리면 기온이 높다."], "a": "기온이 높으면 제품 $\\mathrm{B}$가 잘 팔리지 않는다.", "q": "아래 두 명제가 모두 참일 때, 다음 중 항상 참인 명제인 것은?<br>(가) 기온이 높으면 제품 $\\mathrm{A}$가 잘 팔린다.<br>(나) 제품 $\\mathrm{B}$가 잘 팔리면 제품 $\\mathrm{A}$는 잘 팔리지 않는다.", "key": "T07-08"}, "x07x39-018": {"id": "x07x39-018", "unit": "07", "theme": "09", "벌": "X07x39", "lvl": 1, "fix": true, "src": "문제집 고쟁이", "w": "두 조건 $p,\\;q$의 진리집합을 각각 $P,\\;Q$라 하자.<br>이때 $p$는 $q$이기 위한 충분조건이지만 필요조건이 아니기 위해선 $P\\subset Q$이지만 $P\\ne Q$이어야 한다.<br>① $p\\,:\\,xz=yz\\;\\leftrightarrow \\;x=y$ 또는 $z=0$이므로 $Q\\subset P$<br>즉, $p$는 $q$이기 위한 필요조건이다.<br>② $P=\\left\\{1,\\;2,\\;3,\\;4,\\;6,\\;12\\right\\},Q=\\left\\{1,\\;2,\\;3,\\;6\\right\\}$이므로 $Q\\subset P$<br>즉, $p$는 $q$이기 위한 필요조건이다.<br>③ $q\\,:\\,x^{2}=x\\;\\leftrightarrow \\;x=0$ 또는 $x=1$이므로 $P=Q$<br>즉, $p$는 $q$이기 위한 필요충분조건이다.<br>④ $x$와 $y$가 모두 유리수이면 $xy$는 유리수이다.<br>하지만 $xy$가 유리수일 때, $x$와 $y$가 모두 유리수가 아닐 수도 있다.<br>[반례] $x=\\sqrt{2},y=\\sqrt{2}$일 때, $xy=\\sqrt{2}\\times \\sqrt{2}=2$<br>즉, $P\\subset Q,P\\ne Q$이므로 $p$는 $q$이기 위한 충분조건이지만 필요조건이 아니다.<br>⑤ $p\\,:\\,|\\,x\\,|\\le 3\\;\\leftrightarrow \\;-3\\le x\\le 3$이므로 $Q\\subset P$<br>즉, $p$는 $q$이기 위한 필요조건이다.<br>따라서 구하는 것은 ④이다.", "k": "c5", "c": ["$p\\,:\\,xz=yz$,$q\\,:\\,x=y$", "$p\\,:\\,x$는 $12$의 양의 약수,$q\\,:\\,x$는 $6$의 양의 약수", "$p\\,:\\,x=0$ 또는 $x=1$,$q\\,:\\,x^{2}=x$", "$p\\,:\\,x$와 $y$는 모두 유리수,$q\\,:\\,xy$는 유리수", "$p\\,:\\,|\\,x\\,|\\le 3$,$q\\,:\\,0\\le x\\le 2$"], "a": "$p\\,:\\,x$와 $y$는 모두 유리수,$q\\,:\\,xy$는 유리수", "q": "두 조건 $p,\\;q$에 대하여 $p$는 $q$이기 위한 충분조건이지만 필요조건이 아닌 것은? (단, $x,\\;y,\\;z$는 실수이다.)", "key": "T07-09"}, "x07x39-019": {"id": "x07x39-019", "unit": "07", "theme": "09", "벌": "X07x39", "lvl": 1, "fix": true, "src": "문제집 고쟁이", "w": "$p$가 $q$이기 위한 필요충분조건이므로<br>부등식 $x^{2}+ax+b\\le 0$의 해가 $-2\\le x\\le 1$이다.<br>$x^{2}+ax+b=(x+2)(x-1)\\le 0$이므로<br>$x^{2}+x-2\\le 0$에서 $a=1,\\;b=-2$이다.<br>$∴\\;a^{2}+b^{2}=5$", "k": "c5", "c": ["$3$", "$5$", "$7$", "$9$", "$11$"], "a": "$5$", "q": "실수 $x$에 대하여 두 조건 $p$, $q$를 각각<br> $p\\,:\\,-2\\le x\\le 1$, $q\\,:\\,x^{2}+ax+b\\le 0$<br>이라 하자. $p$는 $q$이기 위한 필요충분조건일 때, $a^{2}+b^{2}$의 값은?<br>(단, $a$, $b$는 상수이다.)", "key": "T07-09"}, "x07x20-068": {"id": "x07x20-068", "unit": "07", "theme": "09", "벌": "X07x20", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "$p$가 $q$이기 위한 필요조건이므로<br>$q\\;\\rightarrow \\;p\\therefore \\;Q\\subset P$<br>① $P\\cap Q=Q$   ② $P\\cup Q=P$<br>③ $P\\ne Q$이면  $P\\cap Q^{C}=\\varnothing $ ⑤ $P^{C}-Q=P^{C}$<br>따라서 항상 옳은 것은 ④이다.", "k": "c5", "c": ["$P\\cap Q=P$", "$P\\cup Q=U$", "$P\\cap Q^{C}=\\varnothing $", "$P\\cup Q^{C}=U$", "$P^{C}-Q=\\varnothing $"], "a": "$P\\cup Q^{C}=U$", "q": "전체집합 $U$에 대하여 두 조건 $p,\\;q$의 진리집합을 각각 $P,\\;Q$라 하자. $p$가 $q$이기 위한 필요조건일 때, 다음 중 항상 옳은 것은?", "key": "T07-09"}, "x07x20-075": {"id": "x07x20-075", "unit": "07", "theme": "09", "벌": "X07x20", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "$p$는 $q$이기 위한 충분조건이므로  $p\\;\\rightarrow \\;q$<br>$\\therefore \\;\\sim q\\;\\rightarrow \\;\\sim p$<br>$\\sim q$는 $r$이기 위한 필요조건이므로  $r\\;\\rightarrow \\;\\sim q$<br>$\\therefore \\;q\\;\\rightarrow \\;\\sim r$<br>$p\\;\\rightarrow \\;q,\\;q\\;\\rightarrow \\;\\sim r$이므로 $p\\;\\rightarrow \\;\\sim r\\therefore \\;r\\;\\rightarrow \\;\\sim p$<br>따라서 반드시 참이라고 할 수 없는 명제는 ⑤이다.", "k": "c5", "c": ["$p\\,\\to \\,\\sim r$", "$q\\,\\to \\,\\sim r$", "$\\sim q\\,\\to \\,\\sim p$", "$r\\,\\to \\,\\sim p$", "$\\sim r\\,\\to \\,q$"], "a": "$\\sim r\\,\\to \\,q$", "q": "세 조건 $p,\\;q,\\;r$에 대하여 $p$는 $q$이기 위한 충분조건이고, $\\sim q$는 $r$이기 위한 필요조건일 때, 다음 명제 중 반드시 참이라고 할 수 없는 것은?", "key": "T07-09"}, "x07x20-076": {"id": "x07x20-076", "unit": "07", "theme": "09", "벌": "X07x20", "lvl": 2, "fix": true, "src": "문제집 RPM", "w": "ㄱ. 명제 $p\\,\\to \\,q$가 참이므로 $q$는 $p$이기 위한 필요조건이지만 충분조건인지는 알 수 없다. (거짓)<br>ㄴ. 명제 $\\sim r\\,\\to \\,\\sim q$가 참이므로 그 대우 $q\\,\\to \\,r$가 참이다. <br>즉 $r$는 $q$이기 위한 필요조건이다. (참)<br>ㄷ. 두 명제 $p\\,\\to \\,q,\\;q\\,\\to \\,r$가 참이므로 명제 $p\\,\\to \\,r$도 참이다. <br>즉 $p$는 $r$이기 위한 충분조건이다. (참)<br>이상에서 항상 옳은 것은 ㄴ, ㄷ이다.", "k": "c5", "c": ["ㄱ", "ㄴ", "ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "a": "ㄴ, ㄷ", "q": "세 조건 $p,\\;q,\\;r$에 대하여 두 명제 $p\\,\\to \\,q,\\;\\sim r\\,\\to \\,\\sim q$가 모두 참일 때, <보기>에서 항상 옳은 것만을 있는 대로 고른 것은?<br><b><보기><\/b><br>ㄱ. $q$는 $p$이기 위한 필요충분조건이다.<br>ㄴ. $r$는 $q$이기 위한 필요조건이다.<br>ㄷ. $p$는 $r$이기 위한 충분조건이다.", "key": "T07-09"}, "x07x30-091": {"id": "x07x30-091", "unit": "07", "theme": "09", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$p\\,:\\,|\\,a\\,|+|\\,b\\,|=0$에서 $a=0$, $b=0$<br>$q\\,:\\,a^{2}-2ab+b^{2}=0$에서 $(a-b)^{2}=0\\therefore a=b$<br>$r\\,:\\,|\\,a+b\\,|=|\\,a-b\\,|$에서 $a+b=\\pm (a-b)$<br>$\\therefore a=0$ 또는 $b=0$<br>ㄱ. $p\\rightarrow q$, $qnot\\rightarrow p$이므로 $p$는 $q$이기 위한 충분조건이다.<br>ㄴ. $\\sim p\\,:\\,a\\ne 0$ 또는 $b\\ne 0$, $\\sim r\\,:\\,a\\ne 0,\\;b\\ne 0$<br>따라서 $\\sim pnot\\rightarrow \\sim r$, $\\sim r\\rightarrow \\sim p$이므로 $\\sim p$는 $\\sim r$이기 위한 필요조건이다.<br>ㄷ. $q$이고 $r\\,:\\,a=0$, $b=0$<br>따라서 ($q$이고 $r$) $\\leftrightarrow p$이므로 $q$이고 $r$는 $p$이기 위한 필요충분조건이다.<br>이상에서 옳은 것은 ㄷ뿐이다.", "k": "c5", "c": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ"], "a": "ㄷ", "q": "두 실수 $a,\\;b$에 대하여 세 조건 $p,\\;q,\\;r$가<br> $p\\,:\\,|\\,a\\,|+|\\,b\\,|=0$, $q\\,:\\,a^{2}-2ab+b^{2}=0$,<br> $r\\,:\\,|\\,a+b\\,|=|\\,a-b\\,|$<br>일 때, 옳은 것만을 <보기>에서 있는 대로 고른 것은?<br><b><보기><\/b><br>ㄱ. $p$는 $q$이기 위한 필요조건이다.<br>ㄴ. $\\sim p$는 $\\sim r$이기 위한 충분조건이다.<br>ㄷ. $q$이고 $r$는 $p$이기 위한 필요충분조건이다.", "key": "T07-09"}, "x07x30-092": {"id": "x07x30-092", "unit": "07", "theme": "09", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$q\\rightarrow p$, $r\\rightarrow q$이므로 $r\\rightarrow p$<br>$q\\rightarrow p$이므로 $\\sim p\\rightarrow \\sim q$<br>이상에서 참인 명제인 것은 ㄷ, ㄹ이다.", "k": "c5", "c": ["ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄴ, ㄹ", "ㄷ, ㄹ"], "a": "ㄷ, ㄹ", "q": "세 조건 $p,\\;q,\\;r$에 대하여 $p$는 $q$이기 위한 필요조건이고 $r$는 $q$이기 위한 충분조건일 때, 참인 명제인 것만을 <보기>에서 있는 대로 고른 것은?<br><b><보기><\/b><br>ㄱ. $p\\to q$       <br>ㄴ. $q\\to r$<br>ㄷ. $r\\to p$       <br>ㄹ. $\\sim p\\to \\sim q$", "key": "T07-09"}, "x07x30-093": {"id": "x07x30-093", "unit": "07", "theme": "09", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "① $q\\rightarrow p$이므로 $p$는 $q$이기 위한 필요조건이다.<br>② $\\sim r\\rightarrow \\sim p$이므로 $p\\rightarrow r$<br>$q\\rightarrow p$, $p\\rightarrow r$이므로 $q\\rightarrow r$<br>따라서 $q$는 $r$이기 위한 충분조건이다.<br>③ $p\\rightarrow r$이므로 $r$는 $p$이기 위한 필요조건이다.<br>④ $q\\rightarrow p$이므로 $\\sim p\\rightarrow \\sim q$<br>따라서 $\\sim p$는 $\\sim q$이기 위한 충분조건이다.<br>⑤ $q\\rightarrow r$이므로 $\\sim r\\rightarrow \\sim q$<br>따라서 $\\sim r$는 $\\sim q$이기 위한 충분조건이다.", "k": "c5", "c": ["$p$는 $q$이기 위한 필요조건이다.", "$q$는 $r$이기 위한 충분조건이다.", "$r$는 $p$이기 위한 필요조건이다.", "$\\sim p$는 $\\sim q$이기 위한 충분조건이다.", "$\\sim r$는 $\\sim q$이기 위한 필요조건이다."], "a": "$\\sim r$는 $\\sim q$이기 위한 필요조건이다.", "q": "세 조건 $p,\\;q,\\;r$에 대하여 두 명제 $q\\to \\sim p$, $\\sim r\\to \\sim p$가 모두 참일 때, 다음 중 옳지 않은 것은?", "key": "T07-09"}, "x07x30-094": {"id": "x07x30-094", "unit": "07", "theme": "09", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$p$는 $q$이기 위한 충분조건이므로 $P\\subset Q$<br>$r$는 $q$이기 위한 필요조건이므로 $Q\\subset R$<br>따라서 $P\\subset Q\\subset R$이므로 항상 옳은 것은 ②이다.", "k": "c5", "c": ["$R\\subset (P\\cup Q)$", "$(P\\cap Q)\\subset R$", "$(Q\\cap R)\\subset P$", "$R-Q=P$", "$(P\\cup Q^{C})\\subset R^{C}$"], "a": "$(P\\cap Q)\\subset R$", "q": "세 조건 $p,\\;q,\\;r$에 대하여 $p$는 $q$이기 위한 충분조건이고, $r$는 $q$이기 위한 필요조건이다. 전체집합 $U$에 대하여 세 조건 $p,\\;q,\\;r$의 진리집합을 각각 $P,\\;Q,\\;R$라 할 때, 다음 중 항상 옳은 것은?", "key": "T07-09"}, "x07x30-100": {"id": "x07x30-100", "unit": "07", "theme": "09", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$x+1=2x-1$에서 $x=2$<br>이때 $x+1=2x-1$이 $x^{2}-ax+b=0$이기 위한 필요충분조건이므로 이차방정식 $x^{2}-ax+b=0$의 해는 $x=2$뿐이다.<br>중근 $x=2$를 갖고 $x^{2}$의 계수가 $1$인 이차방정식은<br>$(x-2)^{2}=0\\therefore x^{2}-4x+4=0$<br>따라서 $a=4$, $b=4$이므로 $a+b=8$", "k": "num", "a": "8", "q": "$x+1=2x-1$이 $x^{2}-ax+b=0$이기 위한 필요충분조건일 때, 실수 $a,\\;b$에 대하여 $a+b$의 값을 구하시오.", "key": "T07-09"}, "x07x30-103": {"id": "x07x30-103", "unit": "07", "theme": "09", "벌": "X07x30", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$(A\\cup B)\\cap (B-A)^{C}=(A\\cup B)\\cap (B\\cap A^{C})^{C}$<br>$=(A\\cup B)\\cap (B^{C}\\cup A)$<br>$=A\\cup (B\\cap B^{C})$<br>$=A\\cup \\varnothing =A$<br>따라서 $A\\cup B=A$가 성립하기 위한 필요충분조건은 $B\\subset A$이다.", "k": "c5", "c": ["$A\\subset B$", "$B\\subset A$", "$A\\cap B=\\varnothing $", "$A=U$", "$A\\cup B=U$"], "a": "$B\\subset A$", "q": "다음 중 전체집합 $U$의 두 부분집합 $A,\\;B$에 대하여<br> $(A\\cup B)\\cap (B-A)^{C}=A\\cup B$<br>가 성립하기 위한 필요충분조건인 것은?", "key": "T07-09"}, "x07x39-056": {"id": "x07x39-056", "unit": "07", "theme": "09", "벌": "X07x39", "lvl": 2, "fix": true, "src": "문제집 고쟁이", "w": "두 조건 $p,\\;q$의 진리집합을 각각 $P,\\;Q$라 할 때<br>$p$가 $q$이기 위한 필요충분조건이기 위해선 $P=Q$이어야 한다.<br>ㄱ. $p\\,:\\,|\\,x-y\\,|=|\\,x+y\\,|$에서 $|\\,x-y\\,|=|\\,x+y\\,|$의 양변을 제곱하면<br>$(x-y)^{2}=(x+y)^{2}$, $x^{2}-2xy+y^{2}=x^{2}+2xy+y^{2}$<br>$\\therefore \\;xy=0\\;\\leftrightarrow \\;x=0$ 또는 $y=0$<br>즉, $P=Q$이므로 $p$는 $q$이기 위한 필요충분조건이다.<br>ㄴ. $p\\,:\\,|\\,x\\,|+|\\,y\\,|=|\\,x+y\\,|$에서<br>$|\\,x\\,|+|\\,y\\,|=|\\,x+y\\,|$의 양변을 제곱하면<br>$|\\,x\\,|^{2}+2|\\,x\\,||\\,y\\,|+|\\,y\\,|^{2}=(x+y)^{2}$<br>$x^{2}+2|\\,xy\\,|+y^{2}=x^{2}+2xy+y^{2}$, $|\\,xy\\,|=xy$<br>$\\therefore \\;xy\\ge 0$<br>즉, $Q\\subset P$이므로 $p$는 $q$이기 위한 필요조건이다.<br>ㄷ. $p\\,:\\,|\\,x+y\\,|<|\\,x-y\\,|$에서 $|\\,x+y\\,|\\ge 0,\\;|\\,x-y\\,|\\ge 0$이므로<br>$|\\,x+y\\,|,\\;|\\,x-y\\,|$와 $|\\,x+y\\,|^{2},\\;|\\,x-y\\,|^{2}$의 대소 관계는 같다.<br>$|\\,x+y\\,|^{2}-|\\,x-y\\,|^{2}=(x+y)^{2}-(x-y)^{2}=4xy<0$이므로<br>$xy<0$<br>즉, $P=Q$이므로 $p$는 $q$이기 위한 필요충분조건이다.<br>따라서 $p$가 $q$이기 위한 필요충분조건인 것은 ㄱ, ㄷ이다.", "k": "c5", "c": ["ㄱ", "ㄴ", "ㄱ, ㄴ", "ㄱ, ㄷ", "ㄱ, ㄴ, ㄷ"], "a": "ㄱ, ㄷ", "q": "<보기>에서 두 조건 $p,\\;q$에 대하여 $p$가 $q$이기 위한 필요충분조건인 것만을 있는 대로 고른 것은? (단, $x,\\;y$는 실수이다.)<br><b><보기><\/b><br>ㄱ. $p\\,:\\,|\\,x-y\\,|=|\\,x+y\\,|,\\;q\\,:\\,x=0$ 또는 $y=0$<br>ㄴ. $p\\,:\\,|\\,x\\,|+|\\,y\\,|=|\\,x+y\\,|,\\;q\\,:\\,x\\ge 0$이고 $y\\ge 0$<br>ㄷ. $p\\,:\\,|\\,x+y\\,|<|\\,x-y\\,|,\\;q\\,:\\,xy<0$", "key": "T07-09"}, "x07x39-057": {"id": "x07x39-057", "unit": "07", "theme": "09", "벌": "X07x39", "lvl": 2, "fix": true, "src": "문제집 고쟁이", "w": "$\\sim q$가 $p$이기 위한 필요조건이 되려면 명제 $p\\;\\to \\,\\sim q$가 참이어야 하므로 그 대우인 $q\\;\\to \\,\\sim p$가 참이면 된다.<br>두 조건 $p$, $q$의 진리집합을 각각 $P,\\;Q$라 할 때, $Q\\subset P^{C}$이어야 한다.<br>$x^{2}-2x-15=(x-5)(x+3)\\le 0$에서<br>$P^{C}=\\{x\\,\\left|\\,-3\\le x\\le 5\\right\\}$<br>$x^{2}=a,\\;x^{2}–a=(x-\\sqrt{a})(x+\\sqrt{a})=0$에서<br>$Q=\\{x\\,\\mid \\,x=\\sqrt{}$ 또는 $x=-\\sqrt{a}\\}$<br>따라서 $\\sqrt{a}\\le 3$에서 $a\\le 9$이므로 자연수 $a$는 $1,\\;2,\\;3,\\;\\cdots ,\\;9$의 $9$개이다.", "k": "c5", "c": ["$9$", "$11$", "$13$", "$15$", "$17$"], "a": "$9$", "q": "실수 $x$에 대하여 두 조건 $p$, $q$가<br> $p\\,:\\,x^{2}-2x-15>0,\\;q\\,:\\,x^{2}=a$<br>이다. $\\sim q$가 $p$이기 위한 필요조건이 되도록 하는 자연수 $a$의 개수는?", "key": "T07-09"}, "x07x39-058": {"id": "x07x39-058", "unit": "07", "theme": "09", "벌": "X07x39", "lvl": 2, "fix": true, "src": "문제집 고쟁이", "w": "세 조건 $p,\\;q,\\;r$의 진리집합을 각각 $P,\\;Q,\\;R$라 하자.<br>$p$가 $q$이기 위한 충분조건이기 위해선 $P\\subset Q$이어야 하고,<br>$p$가 $r$이기 위한 필요조건이기 위해선 $R\\subset P$이어야 하므로<br>이를 수직선에 나타내면 다음과 같다.<br>조건을 만족시키기 위해선 $a<-1$이고 $b\\ge 5$이어야 하므로 정수 $a$의 최댓값은 $-2$이고 정수 $b$의 최솟값은 $5$이다.<br>따라서 구하는 값은 $-2+5=3$이다.", "k": "c5", "c": ["$2$", "$3$", "$4$", "$5$", "$6$"], "a": "$3$", "q": "세 조건 $p,\\;q,\\;r$가<br> $p\\,:\\,-1\\le x<2$ 또는 $x\\ge 5$,<br> $q\\,:\\,x>a$,<br> $r\\,:\\,x\\ge b$<br>일 때, $p$는 $q$이기 위한 충분조건이면서 $r$이기 위한 필요조건이다. 두 정수 $a,\\;b$에 대하여 $a$의 최댓값과 $b$의 최솟값의 합은?", "key": "T07-09"}, "x07x47-037": {"id": "x07x47-037", "unit": "07", "theme": "09", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "$p\\,\\rightarrow \\,q$이므로 $\\sim q\\,\\rightarrow \\,\\sim p$<br>$r\\,\\rightarrow \\,\\sim q$이므로 $q\\,\\rightarrow \\,\\sim r$<br>$p\\,\\rightarrow \\,q,q\\,\\rightarrow \\,\\sim r$이므로<br>$p\\,\\rightarrow \\,\\sim r,\\;r\\,\\rightarrow \\,\\sim p$<br>따라서 <보기>에서 항상 참인 명제는 ㄱ, ㅁ, ㅂ이다.", "k": "c5", "c": ["ㄱ, ㄹ, ㅁ", "ㄱ, ㅁ, ㅂ", "ㄴ, ㄷ, ㅂ", "ㄴ, ㄹ, ㅁ", "ㄷ, ㅁ, ㅂ"], "a": "ㄱ, ㅁ, ㅂ", "q": "세 조건 $p,\\;q,\\;r$에 대하여 $p$는 $q$이기 위한 충분조건, $\\sim q$는 $r$이기 위한 필요조건일 때, <보기>에서 항상 참인 명제인 것만을 있는 대로 고른 것은?<br><b><보기><\/b><br>ㄱ. $p\\,\\to \\,\\sim r$       <br>ㄴ. $\\sim p\\,\\to \\,q$<br>ㄷ. $\\sim p\\,\\to \\,r$       <br>ㄹ. $q\\,\\to \\,r$<br>ㅁ. $\\sim q\\,\\to \\,\\sim p$      <br>ㅂ. $r\\,\\to \\,\\sim p$", "key": "T07-09"}, "x07x47-038": {"id": "x07x47-038", "unit": "07", "theme": "09", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "① $q$에서 $x=-1$ 또는 $x=1$<br>$p\\,\\rightarrow \\,q$이므로 $p$는 $q$이기 위한 충분조건이다.<br>② $p$에서 $x=-1$ 또는 $x=1$<br>$q$에서 $x=-1$ 또는 $x=1$<br>$p\\,\\leftrightarrow \\,q$이므로 $p$는 $q$이기 위한 필요충분조건이다.<br>③ $p$에서 $x=-1$ 또는 $x=1$<br>$q\\,\\rightarrow \\,p$이므로 $p$는 $q$이기 위한 필요조건이다.<br>④ $q$에서 $x<-1$ 또는 $x>1$<br>$p\\,\\rightarrow \\,q$이므로 $p$는 $q$이기 위한 충분조건이다.<br>⑤ $p$에서 $x<0$ 또는 $x>0$<br>$q\\,\\rightarrow \\,p$이므로 $p$는 $q$이기 위한 필요조건이다.<br>따라서 $p$가 $q$이기 위한 필요충분조건인 것은 ②이다.", "k": "c5", "c": ["$p\\,:\\,x=1,\\;q\\,:\\,x^{2}=1$", "$p\\,:\\,x^{2}=1,\\;q\\,:\\,|\\,x\\,|=1$", "$p\\,:\\,|\\,x\\,|=1,\\;q\\,:\\,x=1$", "$p\\,:\\,x>1,\\;q\\,:\\,|\\,x\\,|>1$", "$p\\,:\\,x^{2}>0,\\;q\\,:\\,x>0$"], "a": "$p\\,:\\,x^{2}=1,\\;q\\,:\\,|\\,x\\,|=1$", "q": "두 조건 $p,\\;q$에 대하여 다음 중 $p$가 $q$이기 위한 필요충분조건인 것은? (단, $x$는 실수)", "key": "T07-09"}, "x07x47-039": {"id": "x07x47-039", "unit": "07", "theme": "09", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "ㄱ. $p$에서 $x-3=-1$ 또는 $x-3=1$<br>$\\therefore \\;x=2$ 또는 $x=4$<br>$q$에서 $x(x-2)(x-4)=0$<br>$\\therefore \\;x=0$ 또는 $x=2$ 또는 $x=4$<br>$p\\,\\rightarrow \\,q$이므로 $p$는 $q$이기 위한 충분조건이다.<br>ㄴ. $p$에서 $-4\\le 2x\\le 6\\therefore \\;-2\\le x\\le 3$<br>$q$에서 $(x+2)(x-1)\\le 0\\therefore \\;-2\\le x\\le 1$<br>$q\\,\\rightarrow \\,p$이므로 $p$는 $q$이기 위한 필요조건이다.<br>ㄷ. 명제 $p\\,\\to \\,q:$[반례] $x=-2,\\;y=1$ (거짓)<br>$q\\,\\rightarrow \\,p$이므로 $p$는 $q$이기 위한 필요조건이다.<br>따라서 <보기>에서 $p$가 $q$이기 위한 필요조건이지만 충분조건은 아닌 것은 ㄴ, ㄷ이다.", "k": "c5", "c": ["ㄱ", "ㄴ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ"], "a": "ㄴ, ㄷ", "q": "두 조건 $p,\\;q$에 대하여 <보기>에서 $p$가 $q$이기 위한 필요조건이지만 충분조건은 아닌 것만을 있는 대로 고른 것은? (단, $x,\\;y$는 실수)<br><b><보기><\/b><br>ㄱ. $p\\,:\\,|\\,x-3\\,|=1,\\;q\\,:\\,x^{3}-6x^{2}+8x=0$<br>ㄴ. $p\\,:\\,-1\\le 2x+3\\le 9,\\;q\\,:\\,x^{2}+x-2\\le 0$<br>ㄷ. $p\\,:\\,x^{2}>y^{2},\\;q\\,:\\,x>y>0$", "key": "T07-09"}, "x07x47-040": {"id": "x07x47-040", "unit": "07", "theme": "09", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "$|\\,a\\,|+|\\,b\\,|=0$에서 $a=b=0$<br>$a^{2}-b^{2}=0$에서 $(a+b)(a-b)=0$<br>$\\therefore \\;a=-b$ 또는 $a=b$<br>따라서 $|\\,a\\,|+|\\,b\\,|=0$은 $a^{2}-b^{2}=0$이기 위한 ${\\boxed{\\,(가)\\,충분\\,}}$조건이다.<br>$ab=0$에서 $a=0$ 또는 $b=0$<br>$a+bi=0$에서 $a=b=0$<br>따라서 $ab=0$은 $a+bi=0$이기 위한 ${\\boxed{\\,(나)\\,필요\\,}}$조건이다.", "k": "c5", "c": ["(가) 충분 (나) 필요", "(가) 충분 (나) 필요충분", "(가) 필요 (나) 충분", "(가) 필요 (나) 필요충분", "(가) 필요충분 (나) 충분"], "a": "(가) 충분 (나) 필요", "q": "실수 $a,\\;b$에 대하여 다음 (가), (나)에 들어갈 알맞은 것은?<br>(단, $i=\\sqrt{-1}$)<br>$\\bullet |\\,a\\,|+|\\,b\\,|=0$은 $a^{2}-b^{2}=0$이기 위한 ${\\boxed{\\,(가)\\,}}$조건이다.$\\bullet ab=0$은 $a+bi=0$이기 위한 ${\\boxed{\\,(나)\\,}}$조건이다.", "key": "T07-09"}, "x07x47-041": {"id": "x07x47-041", "unit": "07", "theme": "09", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "$p$에서 $x=y$ 또는 $y=z$<br>$q$에서 $x=y=z$<br>$r$에서 $x^{2}+y^{2}=2xz+2yz-2z^{2}$<br>$(x-z)^{2}+(y-z)^{2}=0\\therefore \\;x=y=z$<br>ㄱ. $q\\,\\rightarrow \\,p$이므로 $p$는 $q$이기 위한 필요조건이다.<br>ㄴ. $r\\,\\rightarrow \\,p$이므로 $p$는 $r$이기 위한 필요조건이다.<br>ㄷ. $q\\,\\leftrightarrow \\,r$이므로 $q$는 $r$이기 위한 필요충분조건이다.<br>따라서 <보기>에서 옳은 것은 ㄴ, ㄷ이다.", "k": "c5", "c": ["ㄱ", "ㄴ", "ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "a": "ㄴ, ㄷ", "q": "세 조건 $p,\\;q,\\;r$가<br> $p\\,:\\,(x-y)(y-z)=0,$<br> $q\\,:\\,x=y=z$,<br> $r\\,:\\,x^{2}+y^{2}=2z(x+y-z)$<br>일 때, <보기>에서 옳은 것만을 있는 대로 고른 것은?<br>(단, $x,\\;y,\\;z$는 실수)<br><b><보기><\/b><br>ㄱ. $p$는 $q$이기 위한 충분조건이다.<br>ㄴ. $p$는 $r$이기 위한 필요조건이다.<br>ㄷ. $q$는 $r$이기 위한 필요충분조건이다.", "key": "T07-09"}, "x07x47-045": {"id": "x07x47-045", "unit": "07", "theme": "09", "벌": "X07x47", "lvl": 2, "fix": true, "src": "문제집 개념유형유형편", "w": "$p$는 $q$이기 위한 필요조건이므로 $q\\,\\rightarrow \\,p$에서 $Q\\subset P$<br>$p$는 $r$이기 위한 충분조건이므로 $p\\,\\rightarrow \\,r$에서 $P\\subset R$<br>$\\therefore \\;Q\\subset P\\subset R$", "k": "c5", "c": ["$P\\subset Q\\subset R$", "$P\\subset R\\subset Q$", "$Q\\subset P\\subset R$", "$Q\\subset R\\subset P$", "$R\\subset Q\\subset P$"], "a": "$Q\\subset P\\subset R$", "q": "세 조건 $p,\\;q,\\;r$의 진리집합을 각각 $P,\\;Q,\\;R$라 하자. $p$는 $q$이기 위한 필요조건이고, $p$는 $r$이기 위한 충분조건일 때, 세 집합 $P,\\;Q,\\;R$ 사이의 포함관계는?", "key": "T07-09"}, "x07x68-065": {"id": "x07x68-065", "unit": "07", "theme": "09", "벌": "X07x68", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "① 역 : 두 대각선의 길이가 같은 사각형은 직사각형이다. (거짓)<br>[반례] 등변사다리꼴은 두 대각선의 길이가 같지만 직사각형이 아니다.<br>대우 : 두 대각선의 길이가 같지 않은 사각형은 직사각형이 아니다. (참)<br>② 역 : $a>1$이고 $b>1$이면 $a+b>2$이다. (참)<br>대우 : $a{\\le }1$ 또는 $b{\\le }1$이면 $a+b{\\le }2$이다. (거짓)<br>[반례] $a=-1$, $b=4$이면 $a{\\le }1$이지만 $a+b>2$이다.<br>③ 역 : $|\\,ab\\,|=ab$이면 $a>0$, $b>0$이다. (거짓)<br>[반례] $a=-2$, $b=-3$이면 $|\\,ab\\,|=ab$이지만 $a<0$, $b<0$이다.<br>대우 : $|\\,ab\\,|\\ne ab$이면 $a{\\le }0$ 또는 $b{\\le }0$이다. (참)<br>④ 역 : $ab$가 유리수이면 $a$, $b$도 유리수이다. (거짓)<br>[반례] $a=\\sqrt{2}$, $b=\\sqrt{2}$이면 $ab$는 유리수이지만 $a$, $b$는 유리수가 아니다.<br>대우 : $ab$가 무리수이면 $a$ 또는 $b$가 무리수이다. (참)<br>⑤ 역 : $0$이 아닌 $a$, $b$에  대하여 $\\dfrac{1}{a}<\\dfrac{1}{b}$이면 $a>b$이다. (거짓)<br>[반례] $a=-1$, $b=2$이면 $\\dfrac{1}{a}<\\dfrac{1}{b}$이지만 $a<b$이다.<br>대우 : $0$이 아닌 $a$, $b$에 대하여 $\\dfrac{1}{a}{\\ge }\\dfrac{1}{b}$이면 $a{\\le }b$이다. (거짓)<br>[반례] $a=1$, $b=-2$이면 $\\dfrac{1}{a}{\\ge }\\dfrac{1}{b}$이지만 $a>b$이다.<br>따라서 역은 참이고 대우는 거짓인 명제는 ②이다.", "k": "c5", "c": ["직사각형은 두 대각선의 길이가 같다.", "$a+b>2$이면 $a>1$이고 $b>1$이다.", "$a>0$, $b>0$이면 $|\\,ab\\,|=ab$이다.", "$a$, $b$가 유리수이면 $ab$도 유리수이다.", "$0$이 아닌 $a$, $b$에 대하여 $a>b$이면 $\\dfrac{1}{a}<\\dfrac{1}{b}$이다."], "a": "$a+b>2$이면 $a>1$이고 $b>1$이다.", "q": "다음 중 역은 참이고 대우는 거짓인 명제는?<br>(단, $a$, $b$는 실수)", "key": "T07-09"}, "x07x68-068": {"id": "x07x68-068", "unit": "07", "theme": "09", "벌": "X07x68", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "주어진 명제의 역 ‘$x^{2}+ax-1\\ne 0$이면 $x-2\\ne 0$이다.’가 참이면 그 대우 ‘$x-2=0$이면 $x^{2}+ax-1=0$이다.’가 참이므로<br>$4+2a-1=0$<br>$\\therefore \\;a=-\\dfrac{3}{2}$", "k": "c5", "c": ["$-\\dfrac{3}{2}$", "$-1$", "$-\\dfrac{1}{2}$", "$\\dfrac{1}{2}$", "$1$"], "a": "$-\\dfrac{3}{2}$", "q": "명제 ‘$x-2\\ne 0$이면 $x^{2}+ax-1\\ne 0$이다.’의 역이 참일 때, 상수 $a$의 값은?", "key": "T07-09"}, "x07x68-069": {"id": "x07x68-069", "unit": "07", "theme": "09", "벌": "X07x68", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편", "w": "명제 $r\\,\\to \\,\\sim q$가 참이면 그 대우도 참이므로 명제 $q\\,\\to \\,\\sim r$가 참이다.<br>두 명제 $p\\,\\to \\,q$, $q\\,\\to \\,\\sim r$가 참이므로<br>명제 $p\\,\\to \\,\\sim r$와 그 대우 $r\\,\\to \\,\\sim p$가 참이다.<br>따라서 보기에서 항상 참인 명제인 것은 ㄷ이다.", "k": "c5", "c": ["ㄱ", "ㄴ", "ㄷ", "ㄱ, ㄷ", "ㄴ, ㄷ"], "a": "ㄷ", "q": "세 조건 $p$, $q$, $r$에 대하여 두 명제 $p\\,\\rightarrow \\,q$, $r\\,\\rightarrow \\,\\sim q$가 모두 참일 때, 보기에서 항상 참인 명제인 것만을 있는 대로 고른 것은?<br><b><보기><\/b><br>ㄱ. $q\\,\\to \\,p$     <br>ㄴ. $p\\,\\to \\,r$     <br>ㄷ. $r\\,\\to \\,\\sim p$", "key": "T07-09"}, "x07x68-071": {"id": "x07x68-071", "unit": "07", "theme": "09", "벌": "X07x68", "lvl": 2, "fix": true, "src": "문제집 개념유형개념편",
