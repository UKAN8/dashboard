x^{2}-6ax=3ax(x-2)$<br>$f' (x)=0$에서 $x=2\\;(\\because \\;1\\le x\\le 3)$<br>$x\\mathrm{1}\\cdots \\mathrm{2}\\cdots \\mathrm{3}f' (x)-\\mathrm{0}+f(x)-2a+b\\searrow -4a+b\\nearrow b$<br>이때 $a$, $b$가 양수이므로 함수 $f(x)$는 $x=3$일 때 최댓값 $b$, $x=2$일 때 최솟값 $-4a+b$를 갖는다.<br>따라서 $b=10$, $-4a+b=2$이므로<br>$a=2$, $b=10$<br>$\\therefore \\;a+b=12$", "k": "c5", "c": ["$\\mathrm{6}$", "$\\mathrm{8}$", "$\\mathrm{10}$", "$\\mathrm{12}$", "$\\mathrm{14}$"], "a": "$\\mathrm{12}$", "q": "삼차함수 $f(x)=ax^{3}-3ax^{2}+b$가 구간 $[1,\\,3]$에서 최댓값 $\\mathrm{10}$, 최솟값 $\\mathrm{2}$를 가질 때, 양수 $a$, $b$에 대하여 $a+b$의 값은?", "key": "Tm05-16"}, "x05x75-060": {"id": "x05x75-060", "unit": "m05", "theme": "16", "벌": "X05x75", "lvl": 2, "fix": true, "src": "문제집 바이블개념ON", "w": "$f(x)=ax^{3}-3ax+b$에서<br>$f' (x)=3ax^{2}-3a=3a(x+1)(x-1)$<br>$f'(x)=0$에서 $x=1(\\because \\;0\\le x\\le 3)$<br>$a<0$이므로 닫힌구간 $[\\,0,\\;3\\,]$에서 함수 $f(x)$의 증가와 감소를 표로 나타내면 다음과 같다. <br>${x}0{\\cdots }1{\\cdots }3{f' (x)}+0-{f(x)}b\\nearrow -2a+b\\searrow 18a+b$<br>이때 $a<0$이므로 $18a+b<b<-2a+b$<br>따라서 함수 $f(x)$는 $x=1$에서 최댓값 $-2a+b$, $x=3$에서 최솟값 $18a+b$를 갖는다.<br>그런데 $f(x)$의 최댓값이 $6$, 최솟값이 $-14$이므로<br>$-2a+b=6$, $18a+b=-14$<br>위 두 식을 연립하여 풀면<br>$a=-1,\\;b=4$<br>$\\therefore \\;ab=(-1)\\times 4=-4$", "k": "num", "a": "-4", "q": "닫힌구간 $[\\,0,\\;3\\,]$에서 함수 $f(x)=ax^{3}-3ax+b$의 최댓값이 $6$, 최솟값이 $-14$일 때, 상수 $a,\\;b$에 대하여 $ab$의 값을 구하시오.<br>(단, $a<0$)", "key": "Tm05-16"}, "x05x75-061": {"id": "x05x75-061", "unit": "m05", "theme": "16", "벌": "X05x75", "lvl": 2, "fix": true, "src": "문제집 바이블개념ON", "w": "$f(x)=x^{3}+x^{2}-x+k$에서<br>$f' (x)=3x^{2}+2x-1=(x+1)(3x-1)$<br>$f'(x)=0$에서 $x=-1(\\because \\;-2\\le x\\le 0)$<br>닫힌구간 $[\\,-2,\\;0\\,]$에서 함수 $f(x)$의 증가와 감소를 표로 나타내면 다음과 같다. <br>${x}-2{\\cdots }-1{\\cdots }0{f' (x)}+0-{f(x)}k-2\\nearrow k+1\\searrow k$<br>따라서 함수 $f(x)$는 $x=-1$에서 최댓값 $k+1$, $x=-2$에서 최솟값 $k-2$를 갖는다.<br>이때 $f(x)$의 최댓값과 최솟값의 합이 $5$이므로<br>$(k+1)+(k-2)=5$, $2k=6$<br>$\\therefore \\;k=3$<br>따라서 $f(x)=x^{3}+x^{2}-x+3$이므로<br>$f(1)=4$", "k": "num", "a": "4", "q": "닫힌구간 $[\\,-2,\\;0\\,]$에서 함수 $f(x)=x^{3}+x^{2}-x+k$의 최댓값과 최솟값의 합이 $5$일 때, $f(1)$의 값을 구하시오. (단, $k$는 상수이다.)", "key": "Tm05-16"}, "x05x75-062": {"id": "x05x75-062", "unit": "m05", "theme": "16", "벌": "X05x75", "lvl": 2, "fix": true, "src": "문제집 바이블개념ON", "w": "$f(x)=\\dfrac{1}{2}ax^{4}-2ax-2a$에서<br>$f' (x)=2ax^{3}-2a=2a(x-1)(x^{2}+x+1)$<br>$f'(x)=0$에서 $x=1(\\because \\;x^{2}+x+1>0)$<br>$a>0$이므로 닫힌구간 $[\\,-2,\\;2\\,]$에서 함수 $f(x)$의 증가와 감소를 표로 나타내면 다음과 같다. <br>${x}-2{\\cdots }1{\\cdots }2{f' (x)}+0-{f(x)}10a\\nearrow -\\dfrac{7}{2}a\\searrow 2a$<br>$a>0$이므로 $-\\dfrac{7}{2}a<2a<10a$<br>즉, 함수 $f(x)$는 $x=-2$에서 최댓값 $10a$, $x=1$에서 최솟값 $-\\dfrac{7}{2}a$를 갖는다.<br>이때 $f(x)$의 최댓값이 $20$이므로<br>$10a=20$<br>$\\therefore \\;a=2$<br>따라서 $f(x)$의 최솟값은<br>$-\\dfrac{7}{2}a=-7$", "k": "num", "a": "-7", "q": "양수 $a$에 대하여 닫힌구간 $[\\,-2,\\;2\\,]$에서 함수 $f(x)=\\dfrac{1}{2}ax^{4}-2ax-2a$의 최댓값이 $20$일 때, 최솟값을 구하시오.", "key": "Tm05-16"}, "x05x75-063": {"id": "x05x75-063", "unit": "m05", "theme": "16", "벌": "X05x75", "lvl": 2, "fix": true, "src": "문제집 바이블개념ON", "w": "$f(x)=3ax^{4}-8ax^{3}+b$에서<br>$f' (x)=12ax^{3}-24ax^{2}=12ax^{2}(x-2)$<br>$f'(x)=0$에서 $x=2(\\because \\;1\\le x\\le 4)$<br>$a<0$이므로 닫힌구간 $[\\,1,\\;4\\,]$에서 함수 $f(x)$의 증가와 감소를 표로 나타내면 다음과 같다. <br>${x}1{\\cdots }2{\\cdots }4{f' (x)}+0-{f(x)}-5a+b\\nearrow -16a+b\\searrow 256a+b$<br>이때 $a<0$이므로 $256a+b<-5a+b<-16a+b$<br>따라서 함수 $f(x)$는 $x=2$에서 최댓값 $-16a+b$, $x=4$에서 최솟값 $256a+b$를 갖는다.<br>그런데 $f(x)$의 최댓값이 $24$,. 최솟값이 $-44$이므로<br>$-16a+b=24$, $256a+b=-44$<br>위 두 식을 연립하여 풀면<br>$a=-\\dfrac{1}{4}$, $b=20$<br>$\\therefore \\;ab=\\left(-\\dfrac{1}{4}\\right)\\times 20=-5$", "k": "num", "a": "-5", "q": "닫힌구간 $[\\,1,\\;4\\,]$에서 함수 $f(x)=3ax^{4}-8ax^{3}+b$의 최댓값이 $24$, 최솟값이 $-44$일 때, 상수 $a,\\;b$에 대하여 $ab$의 값을 구하시오.<br>(단, $a<0$)", "key": "Tm05-16"}, "x05x53-114": {"id": "x05x53-114", "unit": "m05", "theme": "17", "벌": "X05x53", "lvl": 2, "fix": true, "src": "문제집 개념원리", "w": "원피스 $x$벌을 판매할 때 생기는 이익을 $f(x)$원이라 하면<br>$f(x)=-x^{3}+144x^{2}+1200x-200$<br>$\\therefore \\;f'(x)=-3x^{2}+288x+1200$<br>$=-3(x+4)(x-100)$<br>$f'(x)=0$에서 $x=100$ ($\\because \\;0<x<15$)<br>$0<x<150$에서 함수 $f(x)$의 증가와 감소를 표로 나타내면 다음과 같다.<br>${x}0{\\cdots }100{\\cdots }150{f' (x)}+0-{f(x)}\\nearrow $극대$\\searrow $<br>따라서 $f(x)$는 $x=100$에서 극대이면서 최대이므로 원피스를 판매한 이익이 최대가 되려면 원피스를 ③$100$벌 판매해야 한다.", "k": "c5", "c": ["$84$벌", "$96$벌", "$100$벌", "$120$벌", "$136$벌"], "a": "$100$벌", "q": "인터넷 쇼핑몰에서 어떤 원피스 $x$벌을 판매할 때 생기는 이익이 $(-x^{3}+144x^{2}+1200x-200)$원이라 한다. 이 원피스를 판매한 이익이 최대가 되려면 이 원피스를 몇 벌 판매해야 하는가? (단, $0<x<150$)", "key": "Tm05-17"}, "x05x53-122": {"id": "x05x53-122", "unit": "m05", "theme": "17", "벌": "X05x53", "lvl": 2, "fix": true, "src": "문제집 개념원리", "w": "$f(x)=x^{3}+ax^{2}+3x+1$에서<br>$f' (x)=3x^{2}+2ax+3$<br>함수 $f(x)$가 극값을 가지려면 이차방정식 $f'(x)=0$이 서로 다른 두 실근을 가져야 하므로 판별식을 $D_{1}$이라 하면<br>$\\dfrac{D_{1}}{4}=a^{2}-3\\times 3>0$<br>$(a+3)(a-3)>0$<br>$\\therefore \\;a<-3$ 또는 $a>3\\cdots \\cdots $㉠<br>$g(x)=x^{3}+ax^{2}-3ax+2$에서<br>$g' (x)=3x^{2}+2ax-3a$<br>함수 $g(x)$가 극값을 갖지 않으려면 이차방정식 $g'(x)=0$이 중근을 갖거나 허근을 가져야 하므로 판별식을 $D_{2}$라 하면<br>$\\dfrac{D_{2}}{4}=a^{2}-3\\times (-3a)\\le 0$<br>$a^{2}+9a\\le 0$, $a(a+9)\\le 0$<br>$\\therefore \\;-9\\le a\\le 0\\cdots \\cdots $㉡<br>㉠, ㉡에서 $-9\\le a<-3$<br>따라서 정수 $a$는 $-9$, $-8$, $-7$, $\\cdots $, $-4$의 $6$개이다.", "k": "num", "a": "6", "q": "두 함수 $f(x)=x^{3}+ax^{2}+3x+1$, $g(x)=x^{3}+ax^{2}-3ax+2$에 대하여 $f(x)$는 극값을 갖고, $g(x)$는 극값을 갖지 않도록 하는 정수 $a$의 개수를 구하시오.", "key": "Tm05-17"}, "x05x53-124": {"id": "x05x53-124", "unit": "m05", "theme": "17", "벌": "X05x53", "lvl": 2, "fix": true, "src": "문제집 개념원리", "w": "$f(x)=x^{3}-3x^{2}-3$에서<br>$f' (x)=3x^{2}-6x=3x(x-2)$<br>$f'(x)=0$에서 $x=0$ 또는 $x=2$<br>구간 $[\\,0,\\;4\\,]$에서 함수 $f(x)$의 증가와 감소를 표로 나타내면 다음과 같다.<br>${x}0{\\cdots }2{\\cdots }4{f' (x)}-0+{f(x)}-3\\searrow -7\\nearrow 13$<br>따라서 $f(x)$는 $x=4$에서 최댓값 $13$, $x=2$에서 최솟값 $-7$을 가지므로<br>$M=13$, $m=-7$<br>$\\therefore \\;M-m=20$", "k": "num", "a": "20", "q": "구간 $[\\,0,\\;4\\,]$에서 함수 $f(x)=x^{3}-3x^{2}-3$의 최댓값을 $M$, 최솟값을 $m$이라 할 때, $M-m$의 값을 구하시오.", "key": "Tm05-17"}, "x05x53-125": {"id": "x05x53-125", "unit": "m05", "theme": "17", "벌": "X05x53", "lvl": 2, "fix": true, "src": "문제집 개념원리", "w": "$f(x)=ax^{3}-3ax+2b$에서<br>$f' (x)=3ax^{2}-3a=3a(x+1)(x-1)$<br>$f'(x)=0$에서<br>$x=-1$ 또는 $x=1$<br>이때 $a>0$이므로 구간 $[\\,-1,\\;3\\,]$에서 함수 $f(x)$의 증가와 감소를 표로 나타내면 다음과 같다.<br>${x}-1{\\cdots }1{\\cdots }3{f' (x)}-0+{f(x)}2a+2b\\searrow -2a+2b\\nearrow 18a+2b$<br>따라서 $f(x)$는 $x=3$에서 최댓값 $18a+2b$, $x=1$에서 최솟값 $-2a+2b$를 가지므로<br>$18a+2b=22$, $-2a+2b=2$<br>두 식을 연립하여 풀면<br>$a=1$, $b=2$<br>$\\therefore \\;ab=2$", "k": "num", "a": "2", "q": "구간 $[\\,-1,\\;3\\,]$에서 함수 $f(x)=ax^{3}-3ax+2b$의 최댓값이 $22$, 최솟값이 $2$일 때, 상수 $a$, $b$에 대하여 $ab$의 값을 구하시오.<br>(단, $a>0$)", "key": "Tm05-17"}, "x05x53-126": {"id": "x05x53-126", "unit": "m05", "theme": "17", "벌": "X05x53", "lvl": 2, "fix": true, "src": "문제집 개념원리", "w": "$f(x)=x^{4}-4a^{3}x+1$에서<br>$f'(x)=4x^{3}-4a^{3}=4(x-a)(x^{2}+ax+a^{2})$<br>이때 $x^{2}+ax+a^{2}=\\left(x+\\dfrac{a}{2}\\right)^{2}+\\dfrac{3}{4}a^{2}>0$이므로<br>$f'\\,(x)=0$에서 $x=a$<br>함수 $f(x)$의 증가와 감소를 표로 나타내면 다음과 같다.<br>$x{\\cdots }a{\\cdots }f'(x)-0+f(x)\\searrow -3a^{4}+1\\nearrow $<br>따라서 $f(x)$는 $x=a$에서 최솟값 $-3a^{4}+1$을 가지므로<br>$-3a^{4}+1=-47$, $a^{4}-16=0$<br>$(a^{2}+4)(a+2)(a-2)=0$<br>$\\therefore \\;a=2$($\\because \\;a>0$)", "k": "num", "a": "2", "q": "함수 $f(x)=x^{4}-4a^{3}x+1$의 최솟값이 $-47$일 때, 상수 $a$의 값을 구하시오. (단, $a>0$)", "key": "Tm05-17"}, "x05x53-127": {"id": "x05x53-127", "unit": "m05", "theme": "17", "벌": "X05x53", "lvl": 2, "fix": true, "src": "문제집 개념원리", "w": "점 $\\mathrm{P}$의 $x$좌표를 $t$라 하면 세 점 $\\mathrm{A}(5,\\;-1)$, $\\mathrm{B}(9,\\;1)$, $\\mathrm{P}(t,\\;t^{2}+2)$에 대하여<br>$\\mathrm{\\overline{AP}}^{2}+\\mathrm{\\overline{BP}}^{2}$<br>$=(t-5)^{2}+(t^{2}+3)^{2}+(t-9)^{2}+(t^{2}+1)^{2}$<br>$=2t^{4}+10t^{2}-28t+116$<br>$f(t)=2t^{4}+10t^{2}-28t+116$이라 하면<br>$f'(t)=8t^{3}+20t-28$<br>$=4(t-1)(2t^{2}+2t+7)$<br>$f'(t)=0$에서<br>$t=1$($\\because \\;2t^{2}+2t+7>0$)<br>함수 $f(t)$의 증가와 감소를 표로 나타내면 다음과 같다.<br>$t{\\cdots }1{\\cdots }f'(t)-0+f(t)\\searrow 100\\nearrow $<br>따라서 $f(t)$는 $t=1$일 때 극소이면서 최소이므로 구하는 최솟값은 $100$이다.", "k": "num", "a": "100", "q": "두 점 $\\mathrm{A}(5,\\;-1)$, $\\mathrm{B}(9,\\;1)$과 곡선 $y=x^{2}+2$ 위의 점 $\\mathrm{P}$에 대하여 $\\mathrm{\\overline{AP}}^{2}+\\mathrm{\\overline{BP}}^{2}$의 최솟값을 구하시오.", "key": "Tm05-17"}, "x05x53-129": {"id": "x05x53-129", "unit": "m05", "theme": "17", "벌": "X05x53", "lvl": 2, "fix": true, "src": "문제집 개념원리", "w": "$f(x)=-3x^{4}+4ax^{3}-6(a+3)x^{2}-1$에서<br>$f'(x)=-12x^{3}+12ax^{2}-12(a+3)x$<br>$=-12x(x^{2}-ax+a+3)$<br>함수 $f(x)$가 극솟값을 갖지 않으려면 삼차방정식 $f'(x)=0$이 한 실근과 두 허근을 갖거나 중근과 다른 한 실근을 갖거나 삼중근을 가져야 한다.<br>(ⅰ) $f'(x)=0$이 한 실근과 두 허근을 갖는 경우<br>이차방정식 $x^{2}-ax+a+3=0$이 허근을 가져야 하므로 판별식을 $D$라 하면<br>$D=(-a)^{2}-4(a+3)<0$<br>$a^{2}-4a-12<0$, $(a+2)(a-6)<0$<br>$\\therefore \\;-2<a<6$<br>(ⅱ) $f'(x)=0$이 중근과 다른 한 실근을 갖는 경우<br>이차방정식 $x^{2}-ax+a+3=0$이 $x=0$을 근으로 갖거나 $0$이 아닌 실수를 중근으로 가져야 한다.<br>ⓐ 이차방정식 $x^{2}-ax+a+3=0$이 $x=0$을 근으로 가질 때<br>$a+3=0\\therefore \\;a=-3$<br>ⓑ 이차방정식 $x^{2}-ax+a+3=0$이 $0$이 아닌 실수를 중근으로 가질 때, 판별식 $D$라 하면<br>$D=(-a)^{2}-4(a+3)=0$<br>$a^{2}-4a-12=0$<br>$(a+2)(a-6)=0$<br>$\\therefore \\;a=-2$ 또는 $a=6$<br>(ⅰ), (ⅱ)에서<br>$a=-3$ 또는 $-2lea\\le 6$<br>따라서 정수 $a$는 $-3$, $-2$, $-1$, $\\cdots $, $6$이므로 구하는 합은<br>$-3+(-2)+(-1)+\\,\\cdots \\,+6=15$", "k": "num", "a": "15", "q": "함수 $f(x)=-3x^{4}+4ax^{3}-6(a+3)x^{2}-1$이 극솟값을 갖지 않도록 하는 모든 정수 $a$의 값의 합을 구하시오.", "key": "Tm05-17"}, "x05x53-131": {"id": "x05x53-131", "unit": "m05", "theme": "17", "벌": "X05x53", "lvl": 2, "fix": true, "src": "문제집 개념원리", "w": "하루에 $\\mathrm{A}$ 제품 $x$($x>0$)개를 판매하여 얻은 이익을 $P(x)$원이라 하면<br>$P(x)=1200x-f(x)$<br>$=1200x-(x^{3}-60x^{2}+1200x+5000)$<br>$=-x^{3}+60x^{2}-5000$<br>$\\therefore \\;P' (x)=-3x^{2}+120x=-3x(x-40)$<br>$P'(x)=0$에서 $x=40$($\\because \\;x>0$)<br>$x>0$에서 함수 $P(x)$의 증가와 감소를 표로 나타내면 다음과 같다.<br>$x0{\\cdots }40{\\cdots }P'(x)+0-P(x)\\nearrow $극대$\\searrow $<br>따라서 $P(x)$는 $x=40$에서 극대이면서 최대이므로 이익을 최대로 하기 위해 하루에 생산해야 할 $\\mathrm{A}$ 제품의 개수는 $40$이다.", "k": "num", "a": "40", "q": "하루에 $\\mathrm{A}$ 제품 $x$개를 생산하는 데 드는 비용이 $f(x)=x^{3}-60x^{2}+1200x+5000$(원)이고, 생산된 제품은 개당 $1200$원에 그날 모두 판매된다고 할 때, 이익을 최대로 하기 위해 하루에 생산해야 할 $\\mathrm{A}$ 제품의 개수를 구하시오.", "key": "Tm05-17"}, "x05x53-133": {"id": "x05x53-133", "unit": "m05", "theme": "17", "벌": "X05x53", "lvl": 2, "fix": true, "src": "문제집 개념원리", "w": "$x^{2}+3y^{2}=9$에서<br>$y^{2}=\\dfrac{1}{3}(9-x^{2})$ ($-3\\le x\\le 3$)<br>$\\therefore \\;x^{2}+xy^{2}=x^{2}+x\\times \\dfrac{1}{3}(9-x^{2})$<br>$=-\\dfrac{1}{3}x^{3}+x^{2}+3x$<br>$f(x)=-\\dfrac{1}{3}x^{3}+x^{2}+3x$라 하면<br>$f'(x)=-x^{2}+2x+3$<br>$=-(x+1)(x-3)$<br>$f'(x)=0$에서 $x=-1$ 또는 $x=3$<br>$-3\\le x\\le 3$에서 함수 $f(x)$의 증가와 감소를 표로 나타내면 다음과 같다.<br>${x}-3{\\cdots }-1{\\cdots }3f' (x)-0+f(x)9\\searrow -\\dfrac{5}{3}\\nearrow 9$<br>따라서 $f(x)$는 $x=-1$에서 극소이면서 최소이므로 $x^{2}+xy^{2}$의 최솟값은 $-\\dfrac{5}{3}$이다.", "k": "num", "a": "-5/3", "q": "$x^{2}+3y^{2}=9$를 만족시키는 실수 $x$, $y$에 대하여 $x^{2}+xy^{2}$의 최솟값을 구하시오.", "key": "Tm05-17"}, "x05x53-135": {"id": "x05x53-135", "unit": "m05", "theme": "17", "벌": "X05x53", "lvl": 2, "fix": true, "src": "문제집 개념원리", "w": "$f(x)=x(x-a)(x-6)$이라 하면<br>$f'(x)=(x-a)(x-6)+x(x-6)+x(x-a)$<br>이때 $f(0)=0$이므로 원점은 곡선 $y=f(x)$ 위의 점이고<br>원점에서의 접선의 기울기는 $f'(0)=6a$<br>또 원점이 아닌 접점의 좌표를 $(t,\\;f(t))$라 하면 점 $(t,\\;f(t))$에서의 접선의 기울기는 $f'(t)$이므로 접선의 방정식은<br>$y-f(t)=f'(t)(x-t)$<br>이 직선이 원점을 지나므로<br>$0-f(t)=f' (t)(0-t)$<br>$-t(t-a)(t-6)=-t\\left\\{(t-a)(t-6)+t(t-6)+t(t-a)\\right\\}$<br>$t^{2}(2t-6-a)=0\\therefore \\;t=\\dfrac{6+a}{2}$($\\because \\;t\\ne 0$)<br>$\\therefore \\;f'(t)=f'\\left(\\dfrac{6+a}{2}\\right)$<br>$=-\\dfrac{1}{4}(a^{2}-12a+36)$<br>따라서 원점에서 곡선 $y=f(x)$에 그은 두 접선의 기울기의 곱을 $g(a)$라 하면<br>$g(a)=6a\\times \\left\\{-\\dfrac{1}{4}(a^{2}-12a+36)\\right\\}$<br>$=-\\dfrac{3}{2}(a^{3}-12a^{2}+36a)$<br>$\\therefore \\;g'(a)=-\\dfrac{3}{2}(3a^{2}-24a+36)$<br>$=-\\dfrac{9}{2}(a-2)(a-6)$<br>$g'(a)=0$에서 $a=2$($\\because \\;0<a<6$)<br>$0<a<6$에서 함수 $g(a)$의 증가와 감소를 표로 나타내면 다음과 같다.<br>${x}0{\\cdots }2{\\cdots }6g'(a)-0+g(a)\\searrow -48\\nearrow $<br>따라서 $g(a)$는 $a=2$일 때 극소이면서 최소이므로 구하는 최솟값은 $-48$이다.", "k": "c5", "c": ["$-54$", "$-51$", "$-48$", "$-45$", "$-42$"], "a": "$-48$", "q": "$0<a<6$인 실수 $a$에 대하여 원점에서 곡선 $y=x(x-a)(x-6)$에 그은 두 접선의 기울기의 곱의 최솟값은?", "key": "Tm05-17"}, "x05x59-001": {"id": "x05x59-001", "unit": "m05", "theme": "17", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(x)=x^{3}-6x^{2}+x+1$이라 하면<br>$f' (x)=3x^{2}-12x+1=3(x-2)^{2}-11$<br>이므로 $f' (x)$는 $x=2$에서 최솟값 $\\mathrm{-11}$을 갖는다.<br>따라서 구하는 기울기 $m$의 최솟값은 $\\mathrm{-11}$이다.", "k": "c5", "c": ["$\\mathrm{-11}$", "$\\mathrm{-9}$", "$\\mathrm{-7}$", "$\\mathrm{-5}$", "$\\mathrm{-3}$"], "a": "$\\mathrm{-11}$", "q": "곡선 $y=x^{3}-6x^{2}+x+1$에 접하는 직선의 기울기를 $m$이라 할 때, $m$의 최솟값은?", "key": "Tm05-17"}, "x05x59-035": {"id": "x05x59-035", "unit": "m05", "theme": "17", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(x)=x^{3}+(a+1)x^{2}-2x$에서<br>$f' (x)=3x^{2}+2(a+1)x-2$<br>함수 $f(x)$가 $x=\\alpha $에서 극대이고 $x=\\beta $에서 극소라 하면 $\\alpha $, $\\beta $는 이차방정식 $3x^{2}+2(a+1)x-2=0$의 두 근이다.<br>이때 극대가 되는 점과 극소가 되는 점이 원점에 대하여 대칭이므로<br>$\\alpha =\\,-\\beta $, 즉 $\\alpha +\\beta =0$<br>따라서 이차방정식의 근과 계수의 관계에 의하여<br>$\\alpha +\\beta =\\,-\\dfrac{2(a+1)}{3}=0\\;\\therefore \\;a=\\,-1$", "k": "c5", "c": ["$\\mathrm{-2}$", "$\\mathrm{-1}$", "$\\mathrm{0}$", "$\\mathrm{1}$", "$\\mathrm{2}$"], "a": "$\\mathrm{-1}$", "q": "함수 $f(x)=x^{3}+(a+1)x^{2}-2x$에 대하여 $y=f(x)$의 그래프에서 극대가 되는 점과 극소가 되는 점이 원점에 대하여 대칭일 때, 상수 $a$의 값은?", "key": "Tm05-17"}, "x05x59-079": {"id": "x05x59-079", "unit": "m05", "theme": "17", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "점 $\\mathrm{P}$의 좌표를 $(t,\\,t^{2})$이라 하면 점 $\\mathrm{P}$와 점 $(3,\\,0)$ 사이의 거리는<br>$\\sqrt{(t-3)^{2}+t^{4}}=\\sqrt{t^{4}+t^{2}-6t+9}$<br>$f(t)=t^{4}+t^{2}-6t+9$라 하면<br>$f' (t)=4t^{3}+2t-6=2(t-1)(2t^{2}+2t+3)$<br>$f' (t)=0$에서<br>$t=1\\;(\\because \\;{{2t^{2}+2t+3>0}})$<br>$t\\cdots \\mathrm{1}\\cdots f' (t)-\\mathrm{0}+f(t)\\searrow \\mathrm{5}\\nearrow $따라서 $f(t)$는 $t=1$일 때 최솟값 $\\mathrm{5}$를 가지므로 구하는 거리의 최솟값은 $\\sqrt{5}$이다.", "k": "c5", "c": ["$\\mathrm{2}$", "$\\sqrt{5}$", "$\\sqrt{6}$", "$\\sqrt{7}$", "$2\\sqrt{2}$"], "a": "$\\sqrt{5}$", "q": "곡선 $y=x^{2}$ 위를 움직이는 점 ${\\mathrm{P}}$와 점 $(3,\\,0)$ 사이의 거리의 최솟값은?", "key": "Tm05-17"}, "x05x59-082": {"id": "x05x59-082", "unit": "m05", "theme": "17", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "점 $\\mathrm{P}$의 좌표를 $(a,\\,-a^{2}+3a)\\;(0<a<3)$이라 하면 $\\mathrm{H}(a,\\,0)$이므로 $\\triangle {\\mathrm{OPH}}$의 넓이를 $S\\,(a)$라 하면<br>$S\\,(a)=\\dfrac{1}{2}a(-a^{2}+3a)=\\,-\\dfrac{1}{2}a^{3}+\\dfrac{3}{2}a^{2}$<br>$\\therefore \\;S' (a)=\\,-\\dfrac{3}{2}a^{2}+3a=\\,-\\dfrac{3}{2}a(a-2)$<br>$S' (a)=0$에서 $a=2\\;(\\because \\;0<a<3)$<br>$a\\mathrm{0}\\cdots \\mathrm{2}\\cdots \\mathrm{3}S' (a)+\\mathrm{0}-S\\,(a)\\nearrow \\mathrm{2}\\searrow $<br>따라서 $S\\,(a)$는 $a=2$일 때 최대이므로 $\\triangle {\\mathrm{OPH}}$의 넓이의 최댓값은<br>$S\\,(2)=2$", "k": "c5", "c": ["$\\dfrac{3}{2}$", "$\\mathrm{2}$", "$\\dfrac{5}{2}$", "$\\mathrm{3}$", "$\\dfrac{7}{2}$"], "a": "$\\mathrm{2}$", "q": "곡선 $y=\\,-x^{2}+3x\\;(0<x<3)$ 위의 점 ${\\mathrm{P}}$에서 $x$축에 내린 수선의 발을 ${\\mathrm{H}}$라 할 때, 삼각형 $\\mathrm{OPH}$의 넓이의 최댓값은? (단, ${\\mathrm{O}}$는 원점이다.)", "key": "Tm05-17"}, "x05x59-099": {"id": "x05x59-099", "unit": "m05", "theme": "17", "벌": "X05x59", "lvl": 2, "fix": true, "src": "문제집 SSEN", "w": "$f(x)=x(x-4)(x-2k)$라 하면<br>$f'(x)=(x-4)(x-2k)+x(x-2k)+x(x-4)$<br>이때 $f(0)=0$이므로 원점은 곡선 $y=f(x)$ 위의 점이고 원점에서의 접선의 기울기는 $f'(0)=8k$<br>또 원점이 아닌 접점의 좌표를 $(t,\\,f(t))$라 하면 점 $(t,\\,f(t))$에서의 접선의 기울기는 $f'(t)$이므로 접선의 방정식은<br>$y-f(t)=f'(t)(x-t)$<br>이 직선이 원점을 지나므로<br>$0-f(t)=f'(t)(0-t)$, $tf'(t)-f(t)=0$<br>$t\\left\\{(t-4)(t-2k)+t(t-2k)+t(t-4)\\right\\}-t(t-4)(t-2k)$<br>$=0$<br>$2t^{2}(t-2-k)=0\\;\\therefore \\;t=2+k\\;(\\because \\;t\\ne 0)$<br>$\\therefore \\;f'(t)=f'(2+k)$<br>$=(2+k-4)(2+k-2k)+(2+k)(2+k-2k)+(2+k)(2+k-4)$<br>$=(k-2)(2-k)+(2+k)(2-k)+(2+k)(k-2)$<br>$=\\,-k^{2}+4k-4$<br>따라서 $0<k<2$인 실수 $k$에 대하여 원점에서 곡선 $y=f(x)$에 그은 두 접선의 기울기의 곱을 $g(k)$라 하면<br>$g(k)=8k\\cdot (-k^{2}+4k-4)=\\,-8k^{3}+32k^{2}-32k$<br>$\\therefore \\;g'(k)=\\,-24k^{2}+64k-32=\\,-8(3k-2)(k-2)$<br>$g'(k)=0$에서 $k=\\dfrac{2}{3}\\;(\\because \\;0<k<2)$<br>$k0\\cdots \\dfrac{2}{3}\\cdots 2g'(k)-0+g(k)\\searrow -\\dfrac{256}{27}\\nearrow $<br>즉 함수 $g(k)$는 $k=\\dfrac{2}{3}$에서 최소이므로 구하는 최솟값은<br>$g\\left(\\dfrac{2}{3}\\right)=\\,-\\dfrac{256}{27}$", "k": "c5", "c": ["$-\\dfrac{16}{3}$", "$-\\dfrac{169}{27}$", "$-\\dfrac{196}{27}$", "$-\\dfrac{25}{3}$", "$-\\dfrac{256}{27}$"], "a": "$-\\dfrac{256}{27}$", "q": "$0<k<2$인 실수 $k$에 대하여 원점에서 곡선 $y=x(x-4)(x-2k)$에 그은 두 접선의 기울기의 곱의 최솟값은?", "key": "Tm05-17"}, "t07-01-1": {"id": "t07-01-1", "unit": "07", "theme": "01", "벌": 1, "k": "num", "q": "실수 $x$에 대하여 조건 ‘$x<-2$ 또는 $x\\ge 3$’의 부정을 만족시키는 정수 $x$의 개수는?", "a": "5", "lvl": 2, "w": "[핵심] ‘또는’은 ‘그리고’로 바뀌고, 부등호는 등호가 반대쪽으로 옮겨 간다.\n$x<-2$의 부정은 $x\\ge -2$, $x\\ge 3$의 부정은 $x<3$이다.\n따라서 부정은 ‘$x\\ge -2$ 그리고 $x<3$’, 곧 $-2\\le x<3$이다.\n정수 $x$는 $-2,\\,-1,\\,0,\\,1,\\,2$의 $5$개이다.", "key": "T07-01"}, "t07-01-2": {"id": "t07-01-2", "unit": "07", "theme": "01", "벌": 2, "k": "c5", "q": "두 실수 $a$, $b$에 대하여 조건 ‘$ab=0$ 그리고 $a+b=0$’의 부정과 서로 같은 것은?", "a": "$a\\ne 0$ 또는 $b\\ne 0$", "c": ["$a\\ne 0$ 그리고 $b\\ne 0$", "$a\\ne 0$ 또는 $b\\ne 0$", "$ab\\ne 0$", "$a+b\\ne 0$", "$ab\\ne 0$ 그리고 $a+b\\ne 0$"], "lvl": 2, "w": "[핵심] 먼저 조건을 간단히 한 뒤 부정한다. ‘그리고’의 부정은 ‘또는’이다.\n$ab=0$이고 $a+b=0$이면 $a=0$ 또는 $b=0$인데, 어느 쪽이든 $a+b=0$에서 나머지도 $0$이다.\n곧 주어진 조건은 ‘$a=0$ 그리고 $b=0$’과 같다.\n그 부정은 ‘$a\\ne 0$ 또는 $b\\ne 0$’이다.\n‘$ab\\ne 0$ 그리고 $a+b\\ne 0$’은 ‘그리고’를 ‘또는’으로 바꾸지 않은 흔한 실수이다.", "key": "T07-01"}, "t07-01-3": {"id": "t07-01-3", "unit": "07", "theme": "01", "벌": 3, "k": "num", "q": "실수 $x$에 대하여 두 조건 $p$, $q$가 $p:|x-1|<4$, $q:x^{2}\\ge 4$일 때, 조건 ‘$\\sim p$ 또는 $q$’의 부정을 만족시키는 정수 $x$의 개수는?", "a": "3", "lvl": 3, "w": "[핵심] ‘$\\sim p$ 또는 $q$’의 부정은 ‘$p$ 그리고 $\\sim q$’이다. ($\\sim(\\sim p)=p$)\n$p:-3<x<5$, $\\sim q:x^{2}<4$, 곧 $-2<x<2$이다.\n‘$p$ 그리고 $\\sim q$’의 진리집합은 $\\{x\\mid -2<x<2\\}$이다.\n정수 $x$는 $-1,\\,0,\\,1$의 $3$개이다.", "key": "T07-01"}, "t07-02-1": {"id": "t07-02-1", "unit": "07", "theme": "02", "벌": 1, "k": "num", "q": "전체집합 $U=\\{x\\mid x\\text{는 }12\\text{ 이하의 자연수}\\}$에서 두 조건 $p$, $q$가 $p:x$는 $12$의 약수이다, $q:x$는 짝수이다 일 때, 조건 ‘$p$ 그리고 $\\sim q$’의 진리집합의 모든 원소의 합은?", "a": "4", "lvl": 2, "w": "[핵심] ‘$p$ 그리고 $\\sim q$’의 진리집합은 $P\\cap Q^{C}=P-Q$이다.\n$P=\\{1,\\,2,\\,3,\\,4,\\,6,\\,12\\}$, $Q$는 짝수의 집합이다.\n$P-Q=\\{1,\\,3\\}$이므로 원소의 합은 $1+3=4$이다.", "key": "T07-02"}, "t07-02-2": {"id": "t07-02-2", "unit": "07", "theme": "02", "벌": 2, "k": "num", "q": "두 실수 $x$, $y$에 대하여 다음 명제 중 참인 것의 개수는?<br>ㄱ. $x^{2}=x$이면 $x=1$이다.<br>ㄴ. $x>2$이면 $x^{2}>4$이다.<br>ㄷ. $|x|<1$이면 $x^{2}<1$이다.<br>ㄹ. $x+y>0$이면 $x>0$ 또는 $y>0$이다.<br>ㅁ. $xy>0$이면 $x>0$이다.", "a": "3", "lvl": 2, "w": "[핵심] 명제 $p\\to q$는 $P\\subset Q$일 때 참, 아니면 반례가 있다.\nㄱ. $x^{2}=x$의 진리집합은 $\\{0,\\,1\\}\\not\\subset\\{1\\}$. 반례 $x=0$, 거짓.\nㄴ. $\\{x\\mid x>2\\}\\subset\\{x\\mid x<-2$ 또는 $x>2\\}$, 참. ㄷ. $|x|<1$과 $x^{2}<1$은 같은 조건, 참.\nㄹ. $x\\le 0$이고 $y\\le 0$이면 $x+y\\le 0$이므로(대우) 참. ㅁ. $x=y=-1$이 반례, 거짓.\n참인 것은 ㄴ, ㄷ, ㄹ의 $3$개이다.", "key": "T07-02"}, "t07-02-3": {"id": "t07-02-3", "unit": "07", "theme": "02", "벌": 3, "k": "num", "q": "전체집합 $U=\\{x\\mid x\\text{는 }30\\text{ 이하의 자연수}\\}$에서 두 조건 $p$, $q$가 $p:x$는 $3$의 배수이다, $q:x$는 $5$의 배수이다 일 때, 조건 ‘$p$ 또는 $\\sim q$’의 진리집합의 원소의 개수는?", "a": "26", "lvl": 3, "w": "[핵심] 진리집합 $P\\cup Q^{C}$의 여집합은 $(P\\cup Q^{C})^{C}=P^{C}\\cap Q=Q-P$이다.\n$Q-P$는 $5$의 배수 중 $3$의 배수가 아닌 것: $5,\\,10,\\,20,\\,25$의 $4$개이다.\n따라서 $n(P\\cup Q^{C})=30-4=26$이다.", "key": "T07-02"}, "t07-03-1": {"id": "t07-03-1", "unit": "07", "theme": "03", "벌": 1, "k": "num", "q": "실수 $x$에 대하여 명제 ‘$x^{2}\\le 9$이면 $x\\ge -1$이다.’가 거짓임을 보이는 반례 중 정수인 것의 개수는?", "a": "2", "lvl": 2, "w": "[핵심] 반례는 가정은 만족시키고 결론은 만족시키지 않는 원소, 곧 $P-Q=P\\cap Q^{C}$의 원소이다.\n$P=\\{x\\mid -3\\le x\\le 3\\}$, $Q^{C}=\\{x\\mid x<-1\\}$이다.\n$P\\cap Q^{C}=\\{x\\mid -3\\le x<-1\\}$이므로 정수는 $-3,\\,-2$의 $2$개이다.", "key": "T07-03"}, "t07-03-2": {"id": "t07-03-2", "unit": "07", "theme": "03", "벌": 2, "k": "num", "q": "전체집합 $U=\\{x\\mid x\\text{는 }15\\text{ 이하의 자연수}\\}$에 대하여 명제 ‘$x$가 홀수이면 $x$는 소수이다.’의 반례의 개수는?", "a": "3", "lvl": 2, "w": "[핵심] 반례 = 가정(홀수)을 만족시키면서 결론(소수)을 만족시키지 않는 원소.\n$15$ 이하의 홀수: $1,3,5,7,9,11,13,15$.\n이 중 소수가 아닌 것은 $1,\\,9,\\,15$이다. ($1$은 소수가 아니다.)\n따라서 반례는 $3$개이다.", "key": "T07-03"}, "t07-03-3": {"id": "t07-03-3", "unit": "07", "theme": "03", "벌": 3, "k": "num", "q": "실수 $x$에 대하여 두 조건 $p$, $q$가 $p:x^{2}-2x-15>0$, $q:|x-3|>1$일 때, 명제 ‘$\\sim p\\to q$’가 거짓임을 보이는 반례 중 정수인 것의 합은?", "a": "9", "lvl": 3, "w": "[핵심] 명제 $\\sim p\\to q$의 반례는 $P^{C}\\cap Q^{C}$의 원소이다.\n$x^{2}-2x-15>0\\iff x<-3$ 또는 $x>5$이므로 $P^{C}=\\{x\\mid -3\\le x\\le 5\\}$.\n$Q^{C}=\\{x\\mid |x-3|\\le 1\\}=\\{x\\mid 2\\le x\\le 4\\}$.\n$P^{C}\\cap Q^{C}=\\{x\\mid 2\\le x\\le 4\\}$, 정수 $2,3,4$의 합은 $9$이다.", "key": "T07-03"}, "t07-04-1": {"id": "t07-04-1", "unit": "07", "theme": "04", "벌": 1, "k": "num", "q": "실수 $x$에 대하여 명제 ‘$|x-1|\\le 2$이면 $2x-a\\le 0$이다.’가 참이 되도록 하는 실수 $a$의 최솟값은?", "a": "6", "lvl": 2, "w": "[핵심] $p\\to q$가 참 $\\iff P\\subset Q$. 수직선에서 끝점을 비교한다.\n$P=\\{x\\mid -1\\le x\\le 3\\}$, $Q=\\{x\\mid x\\le \\frac{a}{2}\\}$.\n$P\\subset Q$이려면 $3\\le\\frac{a}{2}$, 곧 $a\\ge 6$.\n$a=6$이면 $x=3$에서 $2x-a=0\\le 0$으로 성립하므로 최솟값은 $6$이다.", "key": "T07-04"}, "t07-04-2": {"id": "t07-04-2", "unit": "07", "theme": "04", "벌": 2, "k": "num", "q": "실수 $x$에 대하여 명제 ‘$a-1\\le x\\le a+2$이면 $x^{2}-3x-10\\le 0$이다.’가 참이 되도록 하는 정수 $a$의 개수는?", "a": "5", "lvl": 2, "w": "[핵심] $P\\subset Q$가 되도록 양 끝점을 비교한다.\n$x^{2}-3x-10=(x+2)(x-5)\\le 0$이므로 $Q=\\{x\\mid -2\\le x\\le 5\\}$.\n$P=\\{x\\mid a-1\\le x\\le a+2\\}\\subset Q$이려면 $a-1\\ge -2$, $a+2\\le 5$.\n$-1\\le a\\le 3$이므로 정수 $a$는 $5$개이다.", "key": "T07-04"}, "t07-04-3": {"id": "t07-04-3", "unit": "07", "theme": "04", "벌": 3, "k": "num", "q": "실수 $x$에 대하여 두 조건 $p$, $q$가 $p:x^{2}-4x-12>0$, $q:|x-a|>3$일 때, 명제 $p\\to q$가 참이 되도록 하는 모든 정수 $a$의 값의 합은?", "a": "6", "lvl": 3, "w": "[핵심] $P\\subset Q$를 수직선에 그려 양쪽 끝점을 각각 비교하고, 등호를 따로 확인한다.\n$P=\\{x\\mid x<-2$ 또는 $x>6\\}$, $Q=\\{x\\mid x<a-3$ 또는 $x>a+3\\}$.\n$P\\subset Q$이려면 $-2\\le a-3$이고 $a+3\\le 6$ (등호일 때도 열린 구간끼리라 성립).\n$1\\le a\\le 3$이므로 정수 $a$의 합은 $1+2+3=6$이다.", "key": "T07-04"}, "t07-05-1": {"id": "t07-05-1", "unit": "07", "theme": "05", "벌": 1, "k": "num", "q": "전체집합 $U=\\{-2,\\,-1,\\,0,\\,1,\\,2\\}$에 대하여 다음 명제 중 참인 것의 개수는?<br>ㄱ. 모든 $x$에 대하여 $x^{2}\\le 4$이다.<br>ㄴ. 어떤 $x$에 대하여 $x^{2}-x-2=0$이다.<br>ㄷ. 모든 $x$에 대하여 $x+2>0$이다.<br>ㄹ. 어떤 $x$에 대하여 $x^{3}=x+1$이다.<br>ㅁ. 모든 $x$에 대하여 $|x|\\ge x$이다.", "a": "3", "lvl": 2, "w": "[핵심] ‘모든’은 $P=U$, ‘어떤’은 $P\\ne\\varnothing$일 때 참. 원소를 하나씩 대입해 본다.\nㄱ. $x^{2}\\le 4$는 $U$의 모든 원소에서 성립, 참. ㄴ. $x=-1,\\,2$에서 성립, 참.\nㄷ. $x=-2$이면 $x+2=0$, 거짓.\nㄹ. $x^{3}-x$의 값은 $-6,0,0,0,6$으로 $1$이 없다, 거짓. ㅁ. 항상 $|x|\\ge x$, 참.\n참인 것은 ㄱ, ㄴ, ㅁ의 $3$개이다.", "key": "T07-05"}, "t07-05-2": {"id": "t07-05-2", "unit": "07", "theme": "05", "벌": 2, "k": "c5", "q": "명제 ‘어떤 실수 $x$에 대하여 $x^{2}-2x+3\\le 0$이다.’의 부정과 그 부정의 참, 거짓을 바르게 나타낸 것은?", "a": "모든 실수 $x$에 대하여 $x^{2}-2x+3>0$이다. (참)", "c": ["모든 실수 $x$에 대하여 $x^{2}-2x+3>0$이다. (참)", "모든 실수 $x$에 대하여 $x^{2}-2x+3>0$이다. (거짓)", "어떤 실수 $x$에 대하여 $x^{2}-2x+3>0$이다. (참)", "모든 실수 $x$에 대하여 $x^{2}-2x+3\\ge 0$이다. (참)", "어떤 실수 $x$에 대하여 $x^{2}-2x+3>0$이다. (거짓)"], "lvl": 2, "w": "[핵심] ‘어떤 $x$에 대하여 $p$’의 부정은 ‘모든 $x$에 대하여 $\\sim p$’이다.\n$x^{2}-2x+3\\le 0$의 부정은 $x^{2}-2x+3>0$ (등호가 넘어간다).\n$x^{2}-2x+3=(x-1)^{2}+2>0$이 모든 실수에서 성립하므로 부정은 참이다.\n‘$\\ge 0$’으로 쓰면 부정이 아니다. 문장이 참이어도 부정을 바르게 쓴 것이 아니다.", "key": "T07-05"}, "t07-05-3": {"id": "t07-05-3", "unit": "07", "theme": "05", "벌": 3, "k": "num", "q": "명제 ‘어떤 실수 $x$에 대하여 $x^{2}-2ax+2a+3<0$이다.’가 거짓이 되도록 하는 정수 $a$의 개수는?", "a": "5", "lvl": 3, "w": "[핵심] 명제가 거짓 $\\iff$ 그 부정 ‘모든 실수 $x$에 대하여 $x^{2}-2ax+2a+3\\ge 0$’이 참.\n이차부등식이 모든 실수에서 성립하려면 판별식 $\\frac{D}{4}=a^{2}-(2a+3)\\le 0$.\n$(a+1)(a-3)\\le 0$에서 $-1\\le a\\le 3$.\n정수 $a$는 $-1,0,1,2,3$의 $5$개이다.", "key": "T07-05"}, "t07-06-1": {"id": "t07-06-1", "unit": "07", "theme": "06", "벌": 1, "k": "num", "q": "두 실수 $x$, $y$에 대하여 다음 명제 중 그 역이 참인 것의 개수는?<br>ㄱ. $x=2$이면 $x^{2}=4$이다.<br>ㄴ. $x>1$이고 $y>1$이면 $x+y>2$이다.<br>ㄷ. $x=0$이면 $xy=0$이다.<br>ㄹ. $x^{2}+y^{2}=0$이면 $x=0$이고 $y=0$이다.<br>ㅁ. $x>0$이면 $x^{3}>0$이다.", "a": "2", "lvl": 2, "w": "[핵심] $p\\to q$의 역은 $q\\to p$. 역은 원래 명제와 참·거짓이 따로 논다.\nㄱ의 역: $x^{2}=4\\to x=2$, 반례 $x=-2$. ㄴ의 역: 반례 $x=3,\\,y=0$.\nㄷ의 역: $xy=0\\to x=0$, 반례 $x=1,\\,y=0$.\nㄹ의 역: $x=y=0$이면 $x^{2}+y^{2}=0$, 참. ㅁ의 역: $x^{3}>0$이면 $x>0$, 참.\n역이 참인 것은 ㄹ, ㅁ의 $2$개이다.", "key": "T07-06"}, "t07-06-2": {"id": "t07-06-2", "unit": "07", "theme": "06", "벌": 2, "k": "c5", "q": "두 실수 $x$, $y$에 대하여 다음 명제 중 그 대우가 참인 것은?", "a": "$|x|+|y|=0$이면 $x=y$이다.", "c": ["$x^{2}=1$이면 $x=1$이다.", "$xy=0$이면 $x=0$이다.", "$x+y>0$이면 $x>0$이고 $y>0$이다.", "$|x|+|y|=0$이면 $x=y$이다.", "$x^{2}>y^{2}$이면 $x>y$이다."], "lvl": 2, "w": "[핵심] 명제와 그 대우는 참·거짓이 같다. 원래 명제의 참·거짓만 판정하면 된다.\n① $x=-1$, ② $x=1,\\,y=0$, ③ $x=2,\\,y=-1$, ⑤ $x=-2,\\,y=1$이 각각 반례이다.\n④ $|x|+|y|=0$이면 $x=y=0$이므로 $x=y$, 참.\n따라서 대우가 참인 것은 ④이다.", "key": "T07-06"}, "t07-06-3": {"id": "t07-06-3", "unit": "07", "theme": "06", "벌": 3, "k": "num", "q": "다음 세 명제 각각의 역과 대우, 모두 $6$개의 명제 중 참인 것의 개수는? (단, $n$은 자연수, $x$, $y$는 실수)<br>ㄱ. $n^{2}$이 $3$의 배수이면 $n$은 $3$의 배수이다.<br>ㄴ. $x>1$이면 $x^{2}>1$이다.<br>ㄷ. $x+y$가 정수이면 $x$, $y$는 모두 정수이다.", "a": "4", "lvl": 3, "w": "[핵심] 대우는 원래 명제와 참·거짓이 같고, 역은 따로 판정한다.\nㄱ: 참($n$이 $3$의 배수가 아니면 $n^{2}$도 아님). 대우 참. 역 ‘$n$이 $3$의 배수이면 $n^{2}$이 $3$의 배수’도 참.\nㄴ: 참이므로 대우 참. 역 ‘$x^{2}>1\\to x>1$’은 $x=-2$가 반례, 거짓.\nㄷ: $x=y=\\frac{1}{2}$이 반례, 거짓이므로 대우 거짓. 역 ‘둘 다 정수면 합도 정수’는 참.\n참인 것은 ㄱ의 역·대우, ㄴ의 대우, ㄷ의 역으로 $4$개이다.", "key": "T07-06"}, "t07-07-1": {"id": "t07-07-1", "unit": "07", "theme": "07", "벌": 1, "k": "num", "q": "실수 $x$에 대하여 명제 ‘$x^{2}-ax+8\\ne 0$이면 $x\\ne 2$이다.’가 참이 되도록 하는 상수 $a$의 값은?", "a": "6", "lvl": 2, "w": "[핵심] ‘$\\ne$’이 들어간 명제는 대우로 바꾸면 ‘$=$’의 명제가 된다.\n대우: ‘$x=2$이면 $x^{2}-ax+8=0$이다.’ 원래 명제가 참이면 대우도 참이다.\n$x=2$를 대입하면 $4-2a+8=0$, 곧 $a=6$이다.", "key": "T07-07"}, "t07-07-2": {"id": "t07-07-2", "unit": "07", "theme": "07", "벌": 2, "k": "num", "q": "두 실수 $x$, $y$에 대하여 명제 ‘$x+y>a$이면 $x>2$ 또는 $y>3$이다.’가 참이 되도록 하는 실수 $a$의 최솟값은?", "a": "5", "lvl": 2, "w": "[핵심] 결론이 ‘또는’이면 대우로 바꿔 ‘그리고’ 조건을 가정으로 쓴다.\n대우: ‘$x\\le 2$이고 $y\\le 3$이면 $x+y\\le a$이다.’\n$x\\le 2$, $y\\le 3$일 때 $x+y$는 최대 $5$ ($x=2,\\,y=3$).\n이 대우가 참이려면 $5\\le a$이므로 $a$의 최솟값은 $5$이다.", "key": "T07-07"}, "t07-07-3": {"id": "t07-07-3", "unit": "07", "theme": "07", "벌": 3, "k": "num", "q": "실수 $x$에 대하여 명제 ‘$x^{2}-x-20>0$이면 $|x-2|>a$이다.’가 참이 되도록 하는 모든 자연수 $a$의 값의 합은?", "a": "6", "lvl": 3, "w": "[핵심] 대우 ‘$|x-2|\\le a$이면 $x^{2}-x-20\\le 0$’으로 바꾸면 닫힌 구간의 포함 관계가 된다.\n$|x-2|\\le a\\iff 2-a\\le x\\le 2+a$, $x^{2}-x-20\\le 0\\iff -4\\le x\\le 5$.\n$[2-a,\\,2+a]\\subset[-4,\\,5]$이려면 $2-a\\ge -4$, $2+a\\le 5$, 곧 $a\\le 3$.\n자연수 $a=1,2,3$의 합은 $6$이다.", "key": "T07-07"}, "t07-08-1": {"id": "t07-08-1", "unit": "07", "theme": "08", "벌": 1, "k": "c5", "q": "세 조건 $p$, $q$, $r$에 대하여 두 명제 $p\\to\\sim q$, $r\\to q$가 모두 참일 때, 다음 중 항상 참인 명제는?", "a": "$p\\to\\sim r$", "c": ["$p\\to r$", "$q\\to p$", "$\\sim r\\to p$", "$p\\to\\sim r$", "$\\sim q\\to r$"], "lvl": 2, "w": "[핵심] 대우를 써서 화살표가 이어지도록 맞춘 뒤 삼단논법을 쓴다.\n$p\\to\\sim q$와 $\\sim q\\to\\sim r$ ($r\\to q$의 대우)가 참이다.\n삼단논법으로 $p\\to\\sim r$이 참이다. (대우 $r\\to\\sim p$도 참)\n나머지는 역이나 이 관계에서 끌어낼 수 없는 명제이다.", "key": "T07-08"}, "t07-08-2": {"id": "t07-08-2", "unit": "07", "theme": "08", "벌": 2, "k": "c5", "q": "어느 반 학생들에 대하여 다음 두 명제가 모두 참이다.<br>(가) 수학을 좋아하는 학생은 과학을 좋아한다.<br>(나) 체육을 좋아하는 학생은 과학을 좋아하지 않는다.<br>다음 중 항상 참인 명제는?", "a": "수학을 좋아하는 학생은 체육을 좋아하지 않는다.", "c": ["과학을 좋아하는 학생은 수학을 좋아한다.", "체육을 좋아하지 않는 학생은 과학을 좋아한다.", "수학을 좋아하는 학생은 체육을 좋아하지 않는다.", "과학을 좋아하지 않는 학생은 체육을 좋아한다.", "수학을 좋아하지 않는 학생은 체육을 좋아한다."], "lvl": 2, "w": "[핵심] 조건에 기호를 붙여 화살표로 옮긴다. $p$: 수학, $q$: 과학, $r$: 체육.\n(가) $p\\to q$, (나) $r\\to\\sim q$의 대우는 $q\\to\\sim r$.\n삼단논법으로 $p\\to\\sim r$: 수학을 좋아하는 학생은 체육을 좋아하지 않는다.\n나머지 보기는 주어진 명제에서 삼단논법으로 이어지지 않아 항상 참이라 할 수 없다.", "key": "T07-08"}, "t07-08-3": {"id": "t07-08-3", "unit": "07", "theme": "08", "벌": 3, "k": "num", "q": "네 조건 $p$, $q$, $r$, $s$에 대하여 세 명제 $p\\to q$, $\\sim r\\to\\sim q$, $s\\to\\sim r$가 모두 참일 때, 다음 명제 중 항상 참인 것의 개수는?<br>ㄱ. $p\\to r$<br>ㄴ. $s\\to\\sim p$<br>ㄷ. $r\\to p$<br>ㄹ. $q\\to\\sim s$<br>ㅁ. $\\sim s\\to q$<br>ㅂ. $\\sim r\\to\\sim p$", "a": "4", "lvl": 3, "w": "[핵심] 대우로 방향을 맞춰 한 줄로 잇는다.\n$\\sim r\\to\\sim q$의 대우 $q\\to r$, $s\\to\\sim r$의 대우 $r\\to\\sim s$.\n따라서 $p\\to q\\to r\\to\\sim s$로 이어진다.\nㄱ 참, ㄴ($p\\to\\sim s$의 대우) 참, ㄹ 참, ㅂ($p\\to r$의 대우) 참. ㄷ, ㅁ은 역 방향이라 항상 참이라 할 수 없다.\n참인 것은 $4$개이다.", "key": "T07-08"}, "t07-09-1": {"id": "t07-09-1", "unit": "07", "theme": "09", "벌": 1, "k": "num", "q": "실수 $x$, $y$에 대하여 두 조건 $p$, $q$가 다음과 같다. $p$가 $q$이기 위한 충분조건이지만 필요조건은 아닌 것의 개수를 구하시오.\nㄱ. $p: x=2$, $q: x^{2}=2x$\nㄴ. $p: x^{2}>4$, $q: x>2$\nㄷ. $p: |x|<1$, $q: x<1$\nㄹ. $p: xy=0$, $q: x=0$\nㅁ. $p: x>0$이고 $y>0$, $q: x+y>0$이고 $xy>0$", "a": "2", "lvl": 2, "w": "[핵심] 진리집합 $P\\subset Q$이고 $P\\ne Q$인 것을 찾는다.\nㄱ. $P=\\{2\\}$, $Q=\\{0,\\,2\\}$ → 충분조건만 (○)\nㄴ. $x=-3$은 $p$를 만족하지만 $q$는 아니다. $Q\\subset P$ → 필요조건\nㄷ. $-1<x<1$은 $x<1$에 포함 → 충분조건만 (○)\nㄹ. $x=0$이면 $xy=0$ → 필요조건. ㅁ. $xy>0$, $x+y>0$이면 $x$, $y$ 모두 양수 → 필요충분조건\n따라서 ㄱ, ㄷ의 2개", "key": "T07-09"}, "t07-09-2": {"id": "t07-09-2", "unit": "07", "theme": "09", "벌": 2, "k": "c5", "q": "전체집합 $U$에서 정의된 세 조건 $p$, $q$, $r$의 진리집합을 각각 $P$, $Q$, $R$이라 하자. $P\\cap Q=P$, $Q\\cup R=R$일 때, 다음 중 항상 옳은 것은?", "a": "$\\sim q$는 $\\sim r$이기 위한 필요조건이다.", "c": ["$p$는 $r$이기 위한 필요조건이다.", "$q$는 $p$이기 위한 충분조건이다.", "$\\sim p$는 $\\sim q$이기 위한 충분조건이다.", "$\\sim q$는 $\\sim r$이기 위한 필요조건이다.", "$\\sim r$은 $\\sim p$이기 위한 필요조건이다."], "lvl": 2, "w": "[핵심] $P\\cap Q=P$에서 $P\\subset Q$, $Q\\cup R=R$에서 $Q\\subset R$. 곧 $P\\subset Q\\subset R$, $R^{C}\\subset Q^{C}\\subset P^{C}$.\n'$\\sim q$는 $\\sim r$이기 위한 필요조건' ⇔ $R^{C}\\subset Q^{C}$ ⇔ $Q\\subset R$ → 항상 참.\n나머지는 각각 $R\\subset P$, $Q\\subset P$, $Q\\subset P$, $R\\subset P$가 필요해서 항상 옳지는 않다.\n이름은 '~이기 위한' 앞의 조건에 붙고, 그 조건의 진리집합이 큰 쪽이면 필요조건이다.", "key": "T07-09"}, "t07-09-3": {"id": "t07-09-3", "unit": "07", "theme": "09", "벌": 3, "k": "num", "q": "실수 $x$, $y$에 대하여 두 조건 $p$, $q$가 다음과 같다. $p$가 $q$이기 위한 필요충분조건인 것의 개수를 구하시오.\nㄱ. $p: |x|+|y|=0$, $q: x^{2}+y^{2}=0$\nㄴ. $p: |x+y|=|x|+|y|$, $q: xy\\ge 0$\nㄷ. $p: x\\ne 0$ 또는 $y\\ne 0$, $q: x+y\\ne 0$\nㄹ. $p: x>y$, $q: x^{3}>y^{3}$\nㅁ. $p: x>y$, $q: x^{2}>y^{2}$", "a": "3", "lvl": 3, "w": "[핵심] 두 진리집합이 같은지(서로 포함하는지) 본다.\nㄱ. 둘 다 $x=y=0$ → ○. ㄴ. $|x|+|y|\\ge|x+y|$의 등호 조건이 $xy\\ge 0$ → ○\nㄷ. $x=1$, $y=-1$은 $p$는 만족, $q$는 아님 → ×\nㄹ. $x^{3}-y^{3}=(x-y)(x^{2}+xy+y^{2})$이고 $x\\ne y$이면 $x^{2}+xy+y^{2}>0$ → ○\nㅁ. $x=1$, $y=-2$ → $p$는 참, $q$는 거짓 → ×. 따라서 3개", "key": "T07-09"}, "t07-10-1": {"id": "t07-10-1", "unit": "07", "theme": "10", "벌": 1, "k": "num", "q": "실수 $x$에 대하여 두 조건\n$p: x^{2}-2x-8\\le 0$, $q: |x-a|\\le 2$\n가 있다. $p$가 $q$이기 위한 필요조건이 되도록 하는 모든 정수 $a$의 값의 합을 구하시오.", "a": "3", "lvl": 2, "w": "[핵심] '$p$가 $q$이기 위한 필요조건' ⇔ $Q\\subset P$.\n$P=\\{x\\,|\\,-2\\le x\\le 4\\}$, $Q=\\{x\\,|\\,a-2\\le x\\le a+2\\}$\n$-2\\le a-2$이고 $a+2\\le 4$ → $0\\le a\\le 2$ (끝점은 등호 포함 가능)\n정수 $a=0,\\,1,\\,2$ → 합 $3$", "key": "T07-10"}, "t07-10-2": {"id": "t07-10-2", "unit": "07", "theme": "10", "벌": 2, "k": "num", "q": "실수 $x$에 대하여 두 조건\n$p: x^{2}+ax+b\\le 0$, $q: x<-1$ 또는 $x>5$\n가 있다. $\\sim p$가 $q$이기 위한 필요충분조건일 때, 두 상수 $a$, $b$에 대하여 $ab$의 값을 구하시오.", "a": "20", "lvl": 2, "w": "[핵심] $\\sim p$의 진리집합 $P^{C}$가 $Q$와 같다 ⇔ $P=Q^{C}$.\n$Q^{C}=\\{x\\,|\\,-1\\le x\\le 5\\}$이므로 $x^{2}+ax+b\\le 0$의 해가 $-1\\le x\\le 5$\n$x^{2}+ax+b=(x+1)(x-5)=x^{2}-4x-5$ → $a=-4$, $b=-5$\n$ab=20$", "key": "T07-10"}, "t07-10-3": {"id": "t07-10-3", "unit": "07", "theme": "10", "벌": 3, "k": "num", "q": "실수 $x$에 대하여 세 조건\n$p: |x-2|\\le a$, $q: x^{2}-2x-3\\le 0$, $r: |x+1|\\le b$\n가 있다. $p$는 $q$이기 위한 충분조건이고, $r$은 $q$이기 위한 필요조건이다. 양수 $a$의 최댓값을 $M$, 양수 $b$의 최솟값을 $m$이라 할 때, $M+m$의 값을 구하시오.", "a": "5", "lvl": 3, "w": "[핵심] 충분조건 → $P\\subset Q$, 필요조건 → $Q\\subset R$.\n$Q=\\{x\\,|\\,-1\\le x\\le 3\\}$, $P=\\{x\\,|\\,2-a\\le x\\le 2+a\\}$, $R=\\{x\\,|\\,-1-b\\le x\\le -1+b\\}$\n$P\\subset Q$: $2-a\\ge -1$, $2+a\\le 3$ → $a\\le 1$ → $M=1$\n$Q\\subset R$: $-1-b\\le -1$, $-1+b\\ge 3$ → $b\\ge 4$ → $m=4$\n$M+m=5$", "key": "T07-10"}, "t07-11-1": {"id": "t07-11-1", "unit": "07", "theme": "11", "벌": 1, "k": "num", "q": "다음은 자연수 $n$에 대하여 명제 '$n^{2}$이 3의 배수이면 $n$도 3의 배수이다.'가 참임을 대우를 이용하여 증명한 것이다.\n[증명] 대우 '$n$이 3의 배수가 아니면 $n^{2}$도 3의 배수가 아니다.'를 보이자.\n$n$이 3의 배수가 아니면 $n=3k+1$ 또는 $n=3k+2$ ($k$는 음이 아닌 정수)이다.\n(i) $n=3k+1$이면 $n^{2}=3\\times$ (가) $+1$\n(ii) $n=3k+2$이면 $n^{2}=3\\times$ (나) $+1$\n따라서 $n^{2}$은 3의 배수가 아니므로 대우가 참이고, 주어진 명제도 참이다.\n(가), (나)에 알맞은 식을 각각 $f(k)$, $g(k)$라 할 때, $f(1)+g(1)$의 값을 구하시오.", "a": "13", "lvl": 2, "w": "[핵심] 대우 $\\sim q\\to\\sim p$: '3의 배수가 아닌 $n$'을 나머지로 나누어 직접 제곱한다.\n$(3k+1)^{2}=9k^{2}+6k+1=3(3k^{2}+2k)+1$ → $f(k)=3k^{2}+2k$\n$(3k+2)^{2}=9k^{2}+12k+4=3(3k^{2}+4k+1)+1$ → $g(k)=3k^{2}+4k+1$\n$f(1)+g(1)=5+8=13$", "key": "T07-11"}, "t07-11-2": {"id": "t07-11-2", "unit": "07", "theme": "11", "벌": 2, "k": "c5", "q": "다음은 $\\sqrt{3}$이 무리수임을 귀류법으로 증명한 것이다.\n[증명] $\\sqrt{3}$이 유리수라고 가정하면 $\\sqrt{3}=\\dfrac{m}{n}$ ($m$, $n$은 (가)인 자연수)으로 나타낼 수 있다.\n양변을 제곱하면 $m^{2}=3n^{2}$이므로 $m^{2}$은 3의 배수이고, 따라서 $m$도 3의 배수이다.\n$m=3k$ ($k$는 자연수)라 하면 $9k^{2}=3n^{2}$, 곧 $n^{2}=$ (나) 이므로 $n$도 3의 배수이다.\n이것은 $m$, $n$이 (가)라는 가정에 모순이므로 $\\sqrt{3}$은 (다)이다.\n(가), (나), (다)에 알맞은 것을 차례대로 나열한 것은?", "a": "서로소, $3k^{2}$, 무리수", "c": ["서로소, $3k^{2}$, 무리수", "서로소, $3k$, 무리수", "서로소, $9k^{2}$, 무리수", "홀수, $3k^{2}$, 무리수", "서로소, $3k^{2}$, 유리수"], "lvl": 2, "w": "[핵심] 귀류법: 결론('무리수')을 부정해 '유리수 = 기약분수 $\\frac{m}{n}$'으로 두고 모순을 이끈다.\n(가) 기약분수로 놓으므로 $m$, $n$은 서로소\n(나) $9k^{2}=3n^{2}$의 양변을 3으로 나누면 $n^{2}=3k^{2}$\n$m$, $n$이 모두 3의 배수 → 서로소에 모순 → (다) 무리수", "key": "T07-11"}, "t07-11-3": {"id": "t07-11-3", "unit": "07", "theme": "11", "벌": 3, "k": "num", "q": "실수 $a$, $b$, $c$에 대하여 명제\n'$a+2b+3c\\ge k$이면 $a\\ge 1$ 또는 $b\\ge 2$ 또는 $c\\ge 3$이다.'\n가 참이 되도록 하는 실수 $k$의 최솟값을 구하시오.", "a": "14", "lvl": 3, "w": "[핵심] 결론에 '또는'이 있으면 대우로 바꾼다. 대우: '$a<1$이고 $b<2$이고 $c<3$이면 $a+2b+3c<k$'.\n$a<1$, $b<2$, $c<3$이면 $a+2b+3c<1+4+9=14$이고, 이 값은 14에 얼마든지 가까워질 수 있다.\n따라서 대우가 참 ⇔ $k\\ge 14$ ($k<14$이면 $a=b=c$를 각 상한에 충분히 가깝게 잡은 반례가 있다)\n최솟값 $14$", "key": "T07-11"}, "t07-12-1": {"id": "t07-12-1", "unit": "07", "theme": "12", "벌": 1, "k": "c5", "q": "다음은 $a>0$, $b>0$일 때 부등식 $\\dfrac{a+b}{2}\\ge\\dfrac{2ab}{a+b}$가 성립함을 증명한 것이다.\n[증명] $\\dfrac{a+b}{2}-\\dfrac{2ab}{a+b}=$ (가) $\\ge 0$\n따라서 주어진 부등식이 성립하고, 등호는 (나)일 때 성립한다.\n(가), (나)에 알맞은 것을 차례대로 나열한 것은?", "a": "$\\dfrac{(a-b)^{2}}{2(a+b)}$, $a=b$", "c": ["$\\dfrac{(a-b)^{2}}{2(a+b)}$, $a=b$", "$\\dfrac{(a-b)^{2}}{2(a+b)}$, $a=-b$", "$\\dfrac{(a-b)^{2}}{a+b}$, $a=b$", "$\\dfrac{(a-b)^{2}}{2ab}$, $a=b$", "$\\dfrac{(a+b)^{2}}{2(a+b)}$, $a=b$"], "lvl": 2, "w": "[핵심] 부등식의 증명 = (좌변)$-$(우변)을 통분해 부호가 정해지는 꼴로 만든다.\n$\\dfrac{(a+b)^{2}-4ab}{2(a+b)}=\\dfrac{a^{2}-2ab+b^{2}}{2(a+b)}=\\dfrac{(a-b)^{2}}{2(a+b)}$\n분모 $2(a+b)>0$, 분자 $\\ge 0$ → $\\ge 0$\n등호는 $(a-b)^{2}=0$, 곧 $a=b$일 때", "key": "T07-12"}, "t07-12-2": {"id": "t07-12-2", "unit": "07", "theme": "12", "벌": 2, "k": "num", "q": "모든 실수 $a$, $b$, $c$에 대하여 부등식\n$a^{2}+4b^{2}+9c^{2}\\ge 2ab+6bc+3ca$\n가 성립한다. 이 부등식에서 등호가 성립하고 $a+b+c=11$일 때, $a$의 값을 구하시오.", "a": "6", "lvl": 2, "w": "[핵심] 2배 하여 완전제곱식의 합으로 묶는다.\n$2\\{(\\text{좌변})-(\\text{우변})\\}=(a-2b)^{2}+(2b-3c)^{2}+(3c-a)^{2}\\ge 0$\n등호 ⇔ $a=2b=3c$. $a=6t$, $b=3t$, $c=2t$로 놓으면 $11t=11$ → $t=1$\n$a=6$", "key": "T07-12"}, "t07-12-3": {"id": "t07-12-3", "unit": "07", "theme": "12", "벌": 3, "k": "num", "q": "실수 $x$에 대하여 $|x-3|+|x+5|$의 최솟값을 $m$, 이 최솟값을 갖게 하는 정수 $x$의 개수를 $n$이라 할 때, $m+n$의 값을 구하시오.", "a": "17", "lvl": 3, "w": "[핵심] 절대부등식 $|a|+|b|\\ge|a+b|$ (등호 ⇔ $ab\\ge 0$)을 합이 상수가 되게 쓴다.\n$|x-3|+|x+5|=|3-x|+|x+5|\\ge|(3-x)+(x+5)|=8$ → $m=8$\n등호 ⇔ $(3-x)(x+5)\\ge 0$ ⇔ $-5\\le x\\le 3$ → 정수 9개, $n=9$\n$m+n=17$", "key": "T07-12"}, "t07-13-1": {"id": "t07-13-1", "unit": "07", "theme": "13", "벌": 1, "k": "num", "q": "두 양수 $a$, $b$에 대하여 $(a+2b)\\left(\\dfrac{2}{a}+\\dfrac{1}{b}\\right)$의 최솟값을 구하시오.", "a": "8", "lvl": 2, "w": "[핵심] 전개한 뒤 곱이 일정한 두 항에 산술·기하평균을 쓴다.\n$(a+2b)\\left(\\dfrac{2}{a}+\\dfrac{1}{b}\\right)=4+\\dfrac{a}{b}+\\dfrac{4b}{a}$\n$\\dfrac{a}{b}+\\dfrac{4b}{a}\\ge 2\\sqrt{4}=4$ → 전체 $\\ge 8$\n등호: $\\dfrac{a}{b}=\\dfrac{4b}{a}$, 곧 $a=2b$ (예: $a=2$, $b=1$)일 때 성립 → 최솟값 $8$", "key": "T07-13"}, "t07-13-2": {"id": "t07-13-2", "unit": "07", "theme": "13", "벌": 2, "k": "num", "q": "$x>1$일 때 $4x+\\dfrac{9}{x-1}$은 $x=\\alpha$에서 최솟값 $m$을 갖는다. $m+2\\alpha$의 값을 구하시오.", "a": "21", "lvl": 2, "w": "[핵심] 분모와 같은 꼴 $x-1(>0)$을 만들어 변형한다.\n$4x+\\dfrac{9}{x-1}=4(x-1)+\\dfrac{9}{x-1}+4\\ge 2\\sqrt{36}+4=16$\n등호: $4(x-1)=\\dfrac{9}{x-1}$ → $(x-1)^{2}=\\dfrac{9}{4}$, $x-1>0$이므로 $x=\\dfrac{5}{2}$ ($>1$ 확인)\n$m=16$, $\\alpha=\\dfrac{5}{2}$ → $m+2\\alpha=21$", "key": "T07-13"}, "t07-13-3": {"id": "t07-13-3", "unit": "07", "theme": "13", "벌": 3, "k": "num", "q": "$x>0$일 때 $\\dfrac{x}{x^{2}+x+4}$의 최댓값을 구하시오.", "a": "1/5", "lvl": 3, "w": "[핵심] 분자·분모를 $x$로 나누어 분모에 산술·기하평균을 쓴다.\n$\\dfrac{x}{x^{2}+x+4}=\\dfrac{1}{x+\\frac{4}{x}+1}$\n$x+\\dfrac{4}{x}\\ge 2\\sqrt{4}=4$ → 분모 $\\ge 5$ → 식 $\\le\\dfrac{1}{5}$\n등호: $x=\\dfrac{4}{x}$, 곧 $x=2$ ($>0$)일 때 → 최댓값 $\\dfrac{1}{5}$", "key": "T07-13"}, "t07-14-1": {"id": "t07-14-1", "unit": "07", "theme": "14", "벌": 1, "k": "num", "q": "두 양수 $x$, $y$에 대하여 $2x+3y=12$일 때, $xy$의 최댓값을 구하시오.", "a": "6", "lvl": 2, "w": "[핵심] 합 $2x+3y$가 일정 → 곱 $2x\\cdot 3y$의 최댓값.\n$12=2x+3y\\ge 2\\sqrt{6xy}$ → $\\sqrt{6xy}\\le 6$ → $xy\\le 6$\n등호: $2x=3y=6$, 곧 $x=3$, $y=2$일 때 성립\n최댓값 $6$", "key": "T07-14"}, "t07-14-2": {"id": "t07-14-2", "unit": "07", "theme": "14", "벌": 2, "k": "num", "q": "두 양수 $x$, $y$에 대하여 $x+y=3$일 때, $\\dfrac{1}{x}+\\dfrac{4}{y}$의 최솟값을 구하시오.", "a": "3", "lvl": 2, "w": "[핵심] 일정한 합을 곱해 전개한다: $(x+y)\\left(\\dfrac{1}{x}+\\dfrac{4}{y}\\right)$.\n$(x+y)\\left(\\dfrac{1}{x}+\\dfrac{4}{y}\\right)=5+\\dfrac{y}{x}+\\dfrac{4x}{y}\\ge 5+4=9$\n$3\\left(\\dfrac{1}{x}+\\dfrac{4}{y}\\right)\\ge 9$ → $\\dfrac{1}{x}+\\dfrac{4}{y}\\ge 3$\n등호: $y=2x$, $x+y=3$ → $x=1$, $y=2$ → 최솟값 $3$", "key": "T07-14"}, "t07-14-3": {"id": "t07-14-3", "unit": "07", "theme": "14", "벌": 3, "k": "num", "q": "두 양수 $x$, $y$에 대하여 $xy=x+4y+5$일 때, $xy$의 최솟값을 구하시오.", "a": "25", "lvl": 3, "w": "[핵심] $x+4y\\ge 2\\sqrt{4xy}$로 $xy$에 대한 부등식을 만든다.\n$xy=t$라 하면 $t=x+4y+5\\ge 4\\sqrt{t}+5$\n$(\\sqrt{t}-5)(\\sqrt{t}+1)\\ge 0$, $\\sqrt{t}+1>0$ → $\\sqrt{t}\\ge 5$ → $t\\ge 25$\n등호: $x=4y$, $xy=25$ → $y=\\dfrac{5}{2}$, $x=10$ (조건식 $25=10+10+5$ ✓) → 최솟값 $25$", "key": "T07-14"}, "t07-15-1": {"id": "t07-15-1", "unit": "07", "theme": "15", "벌": 1, "k": "num", "q": "실수 $x$, $y$에 대하여 $x^{2}+y^{2}=10$일 때, $3x+y$의 최댓값을 구하시오.", "a": "10", "lvl": 2, "w": "[핵심] $(3^{2}+1^{2})(x^{2}+y^{2})\\ge(3x+y)^{2}$\n$10\\times 10\\ge(3x+y)^{2}$ → $-10\\le 3x+y\\le 10$\n등호: $\\dfrac{x}{3}=\\dfrac{y}{1}$, $x^{2}+y^{2}=10$ → $x=3$, $y=1$\n최댓값 $10$", "key": "T07-15"}, "t07-15-2": {"id": "t07-15-2", "unit": "07", "theme": "15", "벌": 2, "k": "num", "q": "실수 $x$, $y$에 대하여 $x+y=5$일 때, $2x^{2}+3y^{2}$의 최솟값을 구하시오.", "a": "30", "lvl": 2, "w": "[핵심] $2x^{2}+3y^{2}=(\\sqrt2x)^{2}+(\\sqrt3y)^{2}$에 짝 $\\left(\\frac{1}{\\sqrt2},\\frac{1}{\\sqrt3}\\right)$을 곱해 $x+y$를 만든다.\n$\\left(\\dfrac12+\\dfrac13\\right)(2x^{2}+3y^{2})\\ge(x+y)^{2}=25$\n$\\dfrac56(2x^{2}+3y^{2})\\ge 25$ → $2x^{2}+3y^{2}\\ge 30$\n등호: $2x=3y$, $x+y=5$ → $x=3$, $y=2$ ($18+12=30$ ✓) → 최솟값 $30$", "key": "T07-15"}, "t07-15-3": {"id": "t07-15-3", "unit": "07", "theme": "15", "벌": 3, "k": "num", "q": "실수 $x$, $y$에 대하여 $x^{2}+4y^{2}=5$일 때, $x+y$의 최댓값을 $M$, 최솟값을 $m$이라 하자. $M-m$의 값을 구하시오.", "a": "5", "lvl": 3, "w": "[핵심] $x^{2}+(2y)^{2}$과 짝 $\\left(1,\\frac12\\right)$로 $x+y$를 만든다.\n$\\left(1+\\dfrac14\\right)\\{x^{2}+(2y)^{2}\\}\\ge\\left(x+\\dfrac12\\cdot 2y\\right)^{2}=(x+y)^{2}$\n$(x+y)^{2}\\le\\dfrac54\\times 5=\\dfrac{25}{4}$ → $-\\dfrac52\\le x+y\\le\\dfrac52$\n등호: $x=4y$ → $(x,y)=\\left(2,\\frac12\\right)$, $\\left(-2,-\\frac12\\right)$ → $M=\\dfrac52$, $m=-\\dfrac52$, $M-m=5$", "key": "T07-15"}, "tm05-01-1": {"id": "tm05-01-1", "unit": "m05", "theme": "01", "벌": 1, "k": "num", "q": "함수 $f(x)=x^{3}-6x^{2}+9x+1$이 감소하는 구간이 닫힌구간 $[a,\\,b]$일 때, $a+b$의 값을 구하시오.", "a": "4", "lvl": 2, "w": "[핵심] $f'(x)\\le 0$인 $x$의 범위가 감소하는 구간이다.\n$f'(x)=3x^{2}-12x+9=3(x-1)(x-3)$\n$f'(x)\\le 0$에서 $1\\le x\\le 3$이므로 $a=1$, $b=3$, $a+b=4$", "key": "Tm05-01"}, "tm05-01-2": {"id": "tm05-01-2", "unit": "m05", "theme": "01", "벌": 2, "k": "num", "q": "함수 $f(x)=-x^{3}+ax^{2}+bx$가 구간 $(-\\infty,\\,-1]$, $[3,\\,\\infty)$에서 감소하고 구간 $[-1,\\,3]$에서 증가할 때, 두 상수 $a$, $b$에 대하여 $a+b$의 값을 구하시오.", "a": "12", "lvl": 2, "w": "[핵심] 증가·감소가 바뀌는 $x=-1$, $x=3$은 $f'(x)=0$의 두 근이다.\n$f'(x)=-3x^{2}+2ax+b=-3(x+1)(x-3)=-3x^{2}+6x+9$\n계수를 비교하면 $2a=6$, $b=9$\n따라서 $a=3$, $b=9$, $a+b=12$", "key": "Tm05-01"}, "tm05-01-3": {"id": "tm05-01-3", "unit": "m05", "theme": "01", "벌": 3, "k": "num", "q": "함수 $f(x)=3x^{4}-4x^{3}-12x^{2}+1$이 감소하는 $x$의 값의 범위가 $x\\le\\alpha$ 또는 $\\beta\\le x\\le\\gamma$일 때, $\\alpha+\\beta+\\gamma$의 값을 구하시오.", "a": "1", "lvl": 3, "w": "[핵심] 사차함수도 $f'(x)$의 부호로 증가·감소를 판정한다.\n$f'(x)=12x^{3}-12x^{2}-24x=12x(x+1)(x-2)$\n부호는 $x<-1$에서 $-$, $-1<x<0$에서 $+$, $0<x<2$에서 $-$, $x>2$에서 $+$\n감소하는 범위는 $x\\le -1$ 또는 $0\\le x\\le 2$이므로 $\\alpha+\\beta+\\gamma=-1+0+2=1$", "key": "Tm05-01"}, "tm05-02-1": {"id": "tm05-02-1", "unit": "m05", "theme": "02", "벌": 1, "k": "num", "q": "함수 $f(x)=x^{3}+ax^{2}+3x+1$이 실수 전체의 집합에서 증가하도록 하는 정수 $a$의 개수를 구하시오.", "a": "7", "lvl": 2, "w": "[핵심] 최고차항의 계수가 양수인 삼차함수가 실수 전체에서 증가 $\\iff$ $f'(x)\\ge 0$ $\\iff$ $D\\le 0$\n$f'(x)=3x^{2}+2ax+3$에서 $\\frac{D}{4}=a^{2}-9\\le 0$\n$-3\\le a\\le 3$이므로 정수 $a$는 $7$개 (등호를 빼고 $D<0$으로 세우면 $5$개가 되니 주의)", "key": "Tm05-02"}, "tm05-02-2": {"id": "tm05-02-2", "unit": "m05", "theme": "02", "벌": 2, "k": "num", "q": "함수 $f(x)=-\\frac{1}{3}x^{3}+ax^{2}-(a+6)x$가 실수 전체의 집합에서 감소하도록 하는 실수 $a$의 최댓값을 $M$, 최솟값을 $m$이라 할 때, $M-m$의 값을 구하시오.", "a": "5", "lvl": 2, "w": "[핵심] 실수 전체에서 감소 $\\iff$ 모든 $x$에 대하여 $f'(x)\\le 0$\n$f'(x)=-x^{2}+2ax-(a+6)\\le 0$ 이려면 $x^{2}-2ax+(a+6)=0$의 $\\frac{D}{4}=a^{2}-a-6\\le 0$\n$(a+2)(a-3)\\le 0$에서 $-2\\le a\\le 3$\n$M-m=3-(-2)=5$", "key": "Tm05-02"}, "tm05-02-3": {"id": "tm05-02-3", "unit": "m05", "theme": "02", "벌": 3, "k": "num", "q": "함수 $f(x)=ax^{3}+3ax^{2}+12x$가 임의의 두 실수 $x_{1}$, $x_{2}$에 대하여 $x_{1}<x_{2}$이면 $f(x_{1})<f(x_{2})$를 만족시키도록 하는 정수 $a$의 개수를 구하시오.", "a": "5", "lvl": 3, "w": "[핵심] 조건은 실수 전체에서 증가한다는 뜻이고, 최고차항의 계수 $a$가 $0$인 경우를 따로 본다.\n$a=0$이면 $f(x)=12x$로 증가한다.\n$a<0$이면 $f'(x)$의 최고차항의 계수가 음수라 $f'(x)\\ge 0$이 항상 성립할 수 없다.\n$a>0$이면 $f'(x)=3ax^{2}+6ax+12$에서 $\\frac{D}{4}=9a^{2}-36a\\le 0$, $0<a\\le 4$\n따라서 $0\\le a\\le 4$, 정수 $a$는 $5$개", "key": "Tm05-02"}, "tm05-03-1": {"id": "tm05-03-1", "unit": "m05", "theme": "03", "벌": 1, "k": "num", "q": "함수 $f(x)=-x^{3}+3x^{2}+ax$가 닫힌구간 $[1,\\,3]$에서 증가하도록 하는 실수 $a$의 최솟값을 구하시오.", "a": "9", "lvl": 2, "w": "[핵심] 구간 안의 모든 $x$에서 $f'(x)\\ge 0$ $\\iff$ 그 구간에서 $f'(x)$의 최솟값 $\\ge 0$\n$f'(x)=-3x^{2}+6x+a=-3(x-1)^{2}+a+3$은 $[1,\\,3]$에서 감소하므로 최솟값은 $f'(3)=a-9$\n$a-9\\ge 0$에서 $a\\ge 9$, 최솟값 $9$", "key": "Tm05-03"}, "tm05-03-2": {"id": "tm05-03-2", "unit": "m05", "theme": "03", "벌": 2, "k": "num", "q": "함수 $f(x)=x^{3}-3x^{2}+ax+1$이 닫힌구간 $[-1,\\,1]$에서 감소하고 구간 $[3,\\,\\infty)$에서 증가할 때, 실수 $a$의 값을 구하시오.", "a": "-9", "lvl": 2, "w": "[핵심] $f'(x)=3(x-1)^{2}+a-3$의 축 $x=1$을 기준으로 각 구간의 최대·최소를 본다.\n$[-1,\\,1]$에서 $f'(x)$의 최댓값 $f'(-1)=a+9\\le 0$이므로 $a\\le -9$\n$[3,\\,\\infty)$에서 $f'(x)$의 최솟값 $f'(3)=a+9\\ge 0$이므로 $a\\ge -9$\n따라서 $a=-9$", "key": "Tm05-03"}, "tm05-03-3": {"id": "tm05-03-3", "unit": "m05", "theme": "03", "벌": 3, "k": "num", "q": "함수 $f(x)=x^{3}+ax^{2}-a^{2}x$가 열린구간 $(-1,\\,2)$에서 감소하도록 하는 실수 $a$의 값의 범위가 $a\\le p$ 또는 $a\\ge q$일 때, $q-p$의 값을 구하시오.", "a": "9", "lvl": 3, "w": "[핵심] $f'(x)=0$의 두 근 사이가 감소 구간이므로, 그 사이에 $(-1,\\,2)$가 들어가야 한다.\n$f'(x)=3x^{2}+2ax-a^{2}=(3x-a)(x+a)$\n$a>0$이면 감소 구간 $[-a,\\,\\frac{a}{3}]$: $-a\\le -1$, $\\frac{a}{3}\\ge 2$에서 $a\\ge 6$\n$a<0$이면 감소 구간 $[\\frac{a}{3},\\,-a]$: $\\frac{a}{3}\\le -1$, $-a\\ge 2$에서 $a\\le -3$ ($a=0$이면 $f'(x)=3x^{2}\\ge 0$이라 불가)\n따라서 $p=-3$, $q=6$, $q-p=9$", "key": "Tm05-03"}, "tm05-04-1": {"id": "tm05-04-1", "unit": "m05", "theme": "04", "벌": 1, "k": "num", "q": "함수 $f(x)=x^{3}-3x^{2}-9x+5$의 극댓값을 $M$, 극솟값을 $m$이라 할 때, $M-m$의 값을 구하시오.", "a": "32", "lvl": 2, "w": "[핵심] $f'(x)=0$인 $x$의 좌우에서 부호 변화를 보고 극대·극소를 정한다.\n$f'(x)=3x^{2}-6x-9=3(x+1)(x-3)$\n$x=-1$에서 $+\\to -$이므로 극대, $M=f(-1)=10$\n$x=3$에서 $-\\to +$이므로 극소, $m=f(3)=-22$\n$M-m=32$", "key": "Tm05-04"}, "tm05-04-2": {"id": "tm05-04-2", "unit": "m05", "theme": "04", "벌": 2, "k": "num", "q": "함수 $f(x)=x^{4}-4x^{3}+10$의 극값을 모두 더한 값을 구하시오.", "a": "-17", "lvl": 2, "w": "[핵심] $f'(a)=0$이어도 좌우에서 부호가 바뀌지 않으면 극값이 아니다.\n$f'(x)=4x^{3}-12x^{2}=4x^{2}(x-3)$\n$x=0$의 좌우에서 $f'(x)<0$으로 부호가 바뀌지 않으므로 극값이 아니다.\n$x=3$에서 $-\\to +$이므로 극솟값 $f(3)=81-108+10=-17$\n극값은 이것 하나뿐이므로 답은 $-17$", "key": "Tm05-04"}, "tm05-04-3": {"id": "tm05-04-3", "unit": "m05", "theme": "04", "벌": 3, "k": "num", "q": "함수 $f(x)=x^{4}-8x^{2}+a$의 극댓값과 모든 극솟값을 더한 값이 $10$일 때, 상수 $a$의 값을 구하시오.", "a": "14", "lvl": 3, "w": "[핵심] 사차함수는 극소가 두 번 생길 수 있다 — 극솟값을 빠짐없이 센다.\n$f'(x)=4x^{3}-16x=4x(x+2)(x-2)$\n극대: $x=0$, $f(0)=a$\n극소: $x=-2$, $x=2$, $f(\\pm 2)=a-16$\n$a+2(a-16)=10$에서 $3a=42$, $a=14$", "key": "Tm05-04"}, "tm05-05-1": {"id": "tm05-05-1", "unit": "m05", "theme": "05", "벌": 1, "k": "num", "q": "함수 $f(x)=x^{3}+ax^{2}+bx+1$이 $x=1$에서 극솟값 $-3$을 가질 때, 두 상수 $a$, $b$에 대하여 $a-b$의 값을 구하시오.", "a": "9", "lvl": 2, "w": "[핵심] $x=1$에서 극솟값 $-3$ $\\Rightarrow$ $f'(1)=0$, $f(1)=-3$\n$f'(1)=3+2a+b=0$, $f(1)=2+a+b=-3$\n두 식에서 $a=2$, $b=-7$\n확인: $f'(x)=3x^{2}+4x-7=(3x+7)(x-1)$, $x=1$에서 $-\\to +$이므로 극소 맞음\n$a-b=9$", "key": "Tm05-05"}, "tm05-05-2": {"id": "tm05-05-2", "unit": "m05", "theme": "05", "벌": 2, "k": "num", "q": "함수 $f(x)=2x^{3}+ax^{2}+bx+c$가 $x=-1$에서 극댓값 $10$을 갖고 $x=2$에서 극소일 때, $f(x)$의 극솟값을 구하시오. (단, $a$, $b$, $c$는 상수이다.)", "a": "-17", "lvl": 2, "w": "[핵심] 극값을 갖는 두 점이 주어지면 $f'(x)$를 인수분해 꼴로 바로 쓴다.\n$f'(x)=6(x+1)(x-2)=6x^{2}-6x-12$이므로 $a=-3$, $b=-12$\n$f(-1)=-2-3+12+c=10$에서 $c=3$\n극솟값 $f(2)=16-12-24+3=-17$", "key": "Tm05-05"}, "tm05-05-3": {"id": "tm05-05-3", "unit": "m05", "theme": "05", "벌": 3, "k": "num", "q": "함수 $f(x)=x^{3}+ax^{2}+(a^{2}-6)x$가 $x=1$에서 극값을 갖도록 하는 모든 실수 $a$의 값의 합을 구하시오.", "a": "1", "lvl": 3, "w": "[핵심] $f'(1)=0$은 필요조건일 뿐 — 구한 값마다 부호 변화를 확인한다.\n$f'(x)=3x^{2}+2ax+a^{2}-6$, $f'(1)=a^{2}+2a-3=0$에서 $a=1$ 또는 $a=-3$\n$a=1$: $f'(x)=3x^{2}+2x-5=(3x+5)(x-1)$, 부호가 바뀌므로 극값 ○\n$a=-3$: $f'(x)=3x^{2}-6x+3=3(x-1)^{2}\\ge 0$, 부호가 안 바뀌므로 극값 ×\n따라서 답은 $1$", "key": "Tm05-05"}, "tm05-06-1": {"id": "tm05-06-1", "unit": "m05", "theme": "06", "벌": 1, "k": "num", "q": "함수 $f(x)=x^{3}-3x^{2}+2$의 그래프에서 극대인 점을 $\\mathrm{A}$, 극소인 점을 $\\mathrm{B}$라 할 때, 원점 $\\mathrm{O}$에 대하여 삼각형 $\\mathrm{OAB}$의 넓이를 구하시오.", "a": "2", "lvl": 2, "w": "[핵심] 극대·극소인 점의 좌표를 먼저 구한다.\n$f'(x)=3x(x-2)$이므로 $\\mathrm{A}(0,\\,2)$, $\\mathrm{B}(2,\\,-2)$\n$\\mathrm{OA}$가 $y$축 위에 있으므로 밑변 $\\mathrm{OA}=2$, 높이는 $\\mathrm{B}$의 $x$좌표 $2$\n넓이 $=\\frac{1}{2}\\times 2\\times 2=2$", "key": "Tm05-06"}, "tm05-06-2": {"id": "tm05-06-2", "unit": "m05", "theme": "06", "벌": 2, "k": "num", "q": "함수 $f(x)=x^{3}-6x^{2}+9x+k$의 극댓값이 극솟값의 $3$배일 때, 상수 $k$의 값을 구하시오.", "a": "2", "lvl": 2, "w": "[핵심] 극댓값·극솟값을 $k$로 나타내 조건식을 세운다.\n$f'(x)=3(x-1)(x-3)$\n극댓값 $f(1)=4+k$, 극솟값 $f(3)=k$\n$4+k=3k$에서 $k=2$", "key": "Tm05-06"}, "tm05-06-3": {"id": "tm05-06-3", "unit": "m05", "theme": "06", "벌": 3, "k": "num", "q": "양수 $a$에 대하여 함수 $f(x)=x^{3}-3a^{2}x$의 그래프에서 극대인 점을 $\\mathrm{A}$, 극소인 점을 $\\mathrm{B}$라 하자. 점 $\\mathrm{A}$를 지나고 $x$축에 평행한 직선과 점 $\\mathrm{B}$를 지나고 $y$축에 평행한 직선이 만나는 점을 $\\mathrm{C}$라 할 때, 삼각형 $\\mathrm{ABC}$의 넓이가 $64$이다. $f(x)$의 극댓값을 구하시오.", "a": "16", "lvl": 3, "w": "[핵심] 극대·극소인 점을 $a$로 나타내면 넓이가 $a$의 식이 된다.\n$f'(x)=3(x+a)(x-a)$이므로 $\\mathrm{A}(-a,\\,2a^{3})$, $\\mathrm{B}(a,\\,-2a^{3})$, $\\mathrm{C}(a,\\,2a^{3})$\n직각삼각형: $\\mathrm{AC}=2a$, $\\mathrm{BC}=4a^{3}$\n넓이 $=\\frac{1}{2}\\cdot 2a\\cdot 4a^{3}=4a^{4}=64$, $a=2$\n극댓값 $2a^{3}=16$", "key": "Tm05-06"}, "tm05-07-1": {"id": "tm05-07-1", "unit": "m05", "theme": "07", "벌": 1, "k": "num", "q": "삼차함수 $f(x)=ax^{3}+bx^{2}+cx+d$가 $x=-1$에서 극대, $x=3$에서 극소이고 $f(0)<0$일 때, 네 상수 $a$, $b$, $c$, $d$ 중 양수인 것의 개수를 구하시오.", "a": "1", "lvl": 2, "w": "[핵심] 극대가 극소보다 왼쪽 $\\Rightarrow$ $a>0$, 그다음 $f'(x)=3a(x+1)(x-3)$을 전개해 비교한다.\n$f'(x)=3ax^{2}+2bx+c=3a(x^{2}-2x-3)$\n$2b=-6a<0$, $c=-9a<0$, $d=f(0)<0$\n양수는 $a$ 하나", "key": "Tm05-07"}, "tm05-07-2": {"id": "tm05-07-2", "unit": "m05", "theme": "07", "벌": 2, "k": "num", "q": "삼차함수 $f(x)=ax^{3}+bx^{2}+cx+d$는 $x=\\alpha$에서 극소, $x=\\beta$에서 극대이고 $0<\\alpha<\\beta$, $f(0)>0$이다. 다음 중 옳은 것의 개수를 구하시오. ㄱ. $ab>0$ ㄴ. $bc<0$ ㄷ. $ad<0$ ㄹ. $bd>0$", "a": "3", "lvl": 2, "w": "[핵심] 극소가 극대보다 왼쪽 $\\Rightarrow$ $a<0$, 근과 계수의 관계로 $b$, $c$의 부호를 정한다.\n$f'(x)=3ax^{2}+2bx+c=0$의 두 근이 $\\alpha$, $\\beta$\n$\\alpha+\\beta=-\\frac{2b}{3a}>0$에서 $b>0$, $\\alpha\\beta=\\frac{c}{3a}>0$에서 $c<0$, $d=f(0)>0$\nㄱ ×, ㄴ ○, ㄷ ○, ㄹ ○ → $3$개", "key": "Tm05-07"}, "tm05-07-3": {"id": "tm05-07-3", "unit": "m05", "theme": "07", "벌": 3, "k": "num", "q": "삼차함수 $f(x)=ax^{3}+bx^{2}+cx+d$가 다음 조건을 만족시킨다. (가) $f(x)$는 $x=\\alpha$에서 극대, $x=\\beta$에서 극소이고 $\\alpha<0<\\beta$이다. (나) $\\alpha+\\beta>0$ (다) $f(x)$의 극솟값은 양수이다. 다음 중 항상 양수인 것의 개수를 구하시오. $ab$, $ac$, $bc$, $bd$, $cd$, $b^{2}-3ac$", "a": "2", "lvl": 3, "w": "[핵심] $a$는 극대·극소의 순서, $b$·$c$는 두 근의 합·곱, $d=f(0)$은 증감으로 정한다.\n극대가 왼쪽이므로 $a>0$, $\\alpha+\\beta=-\\frac{2b}{3a}>0$에서 $b<0$, $\\alpha\\beta=\\frac{c}{3a}<0$에서 $c<0$\n$[\\alpha,\\,\\beta]$에서 감소하고 $\\alpha<0<\\beta$이므로 $d=f(0)>f(\\beta)>0$\n$f'(x)=0$이 서로 다른 두 실근 $\\Rightarrow$ $\\frac{D}{4}=b^{2}-3ac>0$\n양수: $bc$, $b^{2}-3ac$ → $2$개", "key": "Tm05-07"}, "tm05-08-1": {"id": "tm05-08-1", "unit": "m05", "theme": "08", "벌": 1, "k": "num", "q": "다항함수 $f(x)$의 도함수가 $f'(x)=(x+1)(x-2)^{2}(x-4)$일 때, $f(x)$가 극값을 갖는 모든 $x$의 값의 합을 구하시오.", "a": "3", "lvl": 2, "w": "[핵심] $f'(x)$의 부호가 바뀌는 점에서만 극값 — 짝수 번 곱해진 인수는 부호를 바꾸지 않는다.\n부호: $x<-1$에서 $+$, $-1<x<2$에서 $-$, $2<x<4$에서 $-$, $x>4$에서 $+$\n$x=-1$에서 극대, $x=4$에서 극소, $x=2$는 극값 아님\n합 $=-1+4=3$", "key": "Tm05-08"}, "tm05-08-2": {"id": "tm05-08-2", "unit": "m05", "theme": "08", "벌": 2, "k": "num", "q": "삼차함수 $f(x)=x^{3}+ax^{2}+bx+c$에 대하여 $y=f'(x)$의 그래프가 $x$축과 두 점 $(-1,\\,0)$, $(3,\\,0)$에서 만나고, $f(0)=2$이다. $f(x)$의 극댓값을 구하시오.", "a": "7", "lvl": 2, "w": "[핵심] $y=f'(x)$가 $x$축과 만나는 점 = $f'(x)=0$의 근, 위에서 아래로 지나는 점이 극대.\n$f'(x)=3x^{2}+2ax+b=3(x+1)(x-3)$에서 $a=-3$, $b=-9$, $c=f(0)=2$\n$f'(x)$는 최고차항의 계수가 양수인 이차함수라 $x=-1$에서 $+\\to -$, 극대\n극댓값 $f(-1)=-1-3+9+2=7$", "key": "Tm05-08"}, "tm05-08-3": {"id": "tm05-08-3", "unit": "m05", "theme": "08", "벌": 3, "k": "num", "q": "최고차항의 계수가 $1$인 사차함수 $f(x)=x^{4}+ax^{3}+bx^{2}+c$에 대하여 $y=f'(x)$의 그래프가 점 $(3,\\,0)$에서 $x$축에 접하고, $f(1)=4$이다. $f(x)$의 극솟값을 $m$, $f(x)$가 극값을 갖는 $x$의 개수를 $n$이라 할 때, $m+n$의 값을 구하시오.", "a": "-6", "lvl": 3, "w": "[핵심] $x$축에 접하기만 하는 점은 부호가 안 바뀌어 극값이 아니다.\n$f'(x)=4x^{3}+3ax^{2}+2bx=x(4x^{2}+3ax+2b)$이고 $x=3$에서 접하므로 $4x^{2}+3ax+2b=4(x-3)^{2}$\n$a=-8$, $b=18$, $f'(x)=4x(x-3)^{2}$\n$f(1)=1-8+18+c=4$에서 $c=-7$\n극값은 $x=0$에서 극소 하나: $m=f(0)=-7$, $n=1$\n$m+n=-6$", "key": "Tm05-08"}, "tm05-09-1": {"id": "tm05-09-1", "unit": "m05", "theme": "09", "벌": 1, "k": "num", "q": "다항함수 $f(x)$의 도함수가 $f'(x)=(x+1)(x-2)^{2}$일 때, 〈보기〉에서 옳은 것의 개수를 구하시오.\nㄱ. $f(x)$는 구간 $[-1,\\,\\infty)$에서 증가한다.\nㄴ. $f(x)$는 $x=2$에서 극값을 갖는다.\nㄷ. $f(x)$는 $x=-1$에서 극대이다.\nㄹ. $f(0)\\lt f(3)$", "a": "2", "lvl": 2, "w": "[핵심] $f'(x)$의 부호가 바뀌는 점에서만 극값이 생긴다.\n$(x-2)^{2}\\ge0$이므로 $f'(x)$의 부호는 $x+1$의 부호와 같다. $x\\lt -1$에서 $f'(x)\\lt 0$, $x\\gt -1$에서 $f'(x)\\ge0$($x=2$에서만 $0$).\nㄱ. 참. 다항함수이고 $f'(x)\\ge0$이므로 증가한다.\nㄴ. 거짓. $x=2$의 좌우에서 부호가 바뀌지 않는다.\nㄷ. 거짓. 음에서 양으로 바뀌므로 극소이다.\nㄹ. 참. ㄱ에서 $0\\lt 3$이므로 $f(0)\\lt f(3)$. 옳은 것은 ㄱ, ㄹ의 $2$개.", "key": "Tm05-09"}, "tm05-09-2": {"id": "tm05-09-2", "unit": "m05", "theme": "09", "벌": 2, "k": "num", "q": "다항함수 $f(x)$의 도함수가 $f'(x)=-x^{2}(x-2)(x+3)$일 때, 〈보기〉에서 옳은 것의 개수를 구하시오.\nㄱ. $f(x)$는 $x=0$에서 극값을 갖지 않는다.\nㄴ. $f(x)$의 극댓값은 $f(2)$이다.\nㄷ. $f(-4)\\lt f(-3)$\nㄹ. 방정식 $f(x)=f(0)$의 서로 다른 실근은 $3$개이다.", "a": "3", "lvl": 2, "w": "[핵심] $x^{2}\\ge0$은 부호에 영향을 주지 않으므로 $-(x-2)(x+3)$의 부호만 본다.\n$x\\lt -3$: $-$, $-3\\lt x\\lt 2$: $+$($x=0$에서만 $0$), $x\\gt 2$: $-$. 즉 감소→증가→감소, $x=-3$에서 극소, $x=2$에서 극대.\nㄱ 참, ㄴ 참. ㄷ 거짓: $x\\lt -3$에서 감소하므로 $f(-4)\\gt f(-3)$.\nㄹ 참: $f(-3)\\lt f(0)\\lt f(2)$이고 $x\\to-\\infty$일 때 $f(x)\\to\\infty$, $x\\to\\infty$일 때 $f(x)\\to-\\infty$($f'(x)$가 최고차항 계수가 음수인 사차식이므로 $f(x)$는 최고차항 계수가 음수인 5차함수)이므로 $x\\lt -3$, $-3\\lt x\\lt 2$, $x\\gt 2$에서 하나씩 $3$개. 옳은 것은 $3$개.", "key": "Tm05-09"}, "tm05-09-3": {"id": "tm05-09-3", "unit": "m05", "theme": "09", "벌": 3, "k": "num", "q": "함수 $f(x)=x^{4}-8x^{3}+16x^{2}$에 대하여 〈보기〉에서 옳은 것의 개수를 구하시오.\nㄱ. $f(0)=f(4)$\nㄴ. $f(1)\\lt f(3)$\nㄷ. 방정식 $f(x)=f(2)$의 서로 다른 실근은 $3$개이다.\nㄹ. $f(x)$는 구간 $(1,\\,3)$에서 증가한다.", "a": "2", "lvl": 3, "w": "[핵심] $f'(x)$의 부호로 증감을 정하고, 값의 비교는 $f(x)$에 직접 넣어 한다.\n$f'(x)=4x^{3}-24x^{2}+32x=4x(x-2)(x-4)$ → $x=0$ 극소, $x=2$ 극대, $x=4$ 극소.\nㄱ 참: $f(0)=0$, $f(4)=256-512+256=0$. ㄴ 거짓: $f(1)=9=f(3)$.\nㄷ 참: $f(2)=16$이고 $f(x)-16=(x-2)^{2}(x^{2}-4x-4)$이므로 실근은 $2,\\ 2\\pm2\\sqrt{2}$의 $3$개.\nㄹ 거짓: $(2,\\,4)$에서 $f'(x)\\lt 0$이므로 $(2,\\,3)$에서 감소한다. 옳은 것은 ㄱ, ㄷ의 $2$개.", "key": "Tm05-09"}, "tm05-10-1": {"id": "tm05-10-1", "unit": "m05", "theme": "10", "벌": 1, "k": "num", "q": "함수 $f(x)=x^{3}-3x^{2}-9x+5$에 대하여 곡선 $y=f(x)$와 직선 $y=k$가 서로 다른 세 점에서 만나도록 하는 정수 $k$의 개수를 구하시오.", "a": "31", "lvl": 2, "w": "[핵심] 도함수로 증감표를 만들고 극값을 구하면 그래프의 개형이 정해진다.\n$f'(x)=3x^{2}-6x-9=3(x+1)(x-3)$. $x=-1$에서 극대 $f(-1)=10$, $x=3$에서 극소 $f(3)=-22$.\n개형은 증가→감소→증가이므로 직선 $y=k$와 세 점에서 만나려면 $-22\\lt k\\lt 10$.\n정수 $k$는 $-21,\\,\\cdots,\\,9$의 $31$개.", "key": "Tm05-10"}, "tm05-10-2": {"id": "tm05-10-2", "unit": "m05", "theme": "10", "벌": 2, "k": "num", "q": "함수 $f(x)=x^{4}-4x^{3}+k$에 대하여 곡선 $y=f(x)$가 $x$축과 서로 다른 두 점에서 만나도록 하는 자연수 $k$의 개수를 구하시오.", "a": "26", "lvl": 2, "w": "[핵심] $f'(x)$가 $x=0$에서 $0$이어도 부호가 바뀌지 않으면 극값이 아니다.\n$f'(x)=4x^{3}-12x^{2}=4x^{2}(x-3)$. $x\\lt 3$에서 $f'(x)\\le0$($x=0$에서만 $0$), $x\\gt 3$에서 $f'(x)\\gt 0$이므로 $f(x)$는 $x\\le3$에서 감소, $x\\ge3$에서 증가. 극값은 극솟값 $f(3)=k-27$ 하나뿐이다.\n$x$축과 두 점에서 만나려면 $k-27\\lt 0$, 즉 $k\\lt 27$. 자연수 $k$는 $26$개.", "key": "Tm05-10"}, "tm05-10-3": {"id": "tm05-10-3", "unit": "m05", "theme": "10", "벌": 3, "k": "num", "q": "함수 $f(x)=3x^{4}-16x^{3}+18x^{2}$에 대하여 방정식 $f(x)=k$의 서로 다른 실근의 개수를 $g(k)$라 할 때, $g(-1)+g(0)+g(3)+g(5)$의 값을 구하시오.", "a": "12", "lvl": 3, "w": "[핵심] 증감표로 개형(W자)을 그린 뒤 직선 $y=k$를 위아래로 움직여 센다.\n$f'(x)=12x^{3}-48x^{2}+36x=12x(x-1)(x-3)$. 극소 $f(0)=0$, 극대 $f(1)=5$, 극소 $f(3)=-27$.\n$k=-1$: $-27\\lt k\\lt 0$이므로 $x=3$ 근처 골짜기에서만 $2$개.\n$k=0$: $x=0$에서 접하고 양옆에서 $2$개 더 $\\Rightarrow 3$개. $k=3$: $0\\lt k\\lt 5$이므로 $4$개. $k=5$: $x=1$에서 접하고 $2$개 더 $\\Rightarrow 3$개.\n$2+3+4+3=12$.", "key": "Tm05-10"}, "tm05-11-1": {"id": "tm05-11-1", "unit": "m05", "theme": "11", "벌": 1, "k": "num", "q": "함수 $f(x)=x^{3}+ax^{2}+(a+6)x+1$이 극값을 갖도록 하는 정수 $a$ 중에서 $|a|\\le10$인 것의 개수를 구하시오.", "a": "11", "lvl": 2, "w": "[핵심] 삼차함수가 극값을 가질 조건은 $f'(x)=0$의 판별식 $D\\gt 0$.\n$f'(x)=3x^{2}+2ax+a+6$, $\\frac{D}{4}=a^{2}-3(a+6)=(a-6)(a+3)\\gt 0$.\n$a\\lt -3$ 또는 $a\\gt 6$. $|a|\\le10$인 정수는 $-10,\\,\\cdots,\\,-4$의 $7$개와 $7,\\,\\cdots,\\,10$의 $4$개, 합하여 $11$개.", "key": "Tm05-11"}, "tm05-11-2": {"id": "tm05-11-2", "unit": "m05", "theme": "11", "벌": 2, "k": "num", "q": "함수 $f(x)=x^{3}-3ax^{2}+3(a+2)x$가 극값을 갖도록 하는 실수 $a$의 값의 범위가 $a\\lt \\alpha$ 또는 $a\\gt \\beta$일 때, $\\alpha^{2}+\\beta^{2}$의 값을 구하시오.", "a": "5", "lvl": 2, "w": "[핵심] $f'(x)=0$이 서로 다른 두 실근을 가져야 한다.\n$f'(x)=3x^{2}-6ax+3(a+2)$, $\\frac{D}{4}=9a^{2}-9(a+2)=9(a-2)(a+1)\\gt 0$.\n$a\\lt -1$ 또는 $a\\gt 2$이므로 $\\alpha=-1$, $\\beta=2$.\n$\\alpha^{2}+\\beta^{2}=1+4=5$.", "key": "Tm05-11"}, "tm05-11-3": {"id": "tm05-11-3", "unit": "m05", "theme": "11", "벌": 3, "k": "num", "q": "$6$ 이하의 두 자연수 $a$, $b$에 대하여 함수 $f(x)=x^{3}+ax^{2}+bx+1$이 극값을 갖도록 하는 순서쌍 $(a,\\,b)$의 개수를 구하시오.", "a": "20", "lvl": 3, "w": "[핵심] 극값을 가질 조건 $\\frac{D}{4}\\gt 0$을 $b$에 대한 부등식으로 바꿔 $a$별로 센다.\n$f'(x)=3x^{2}+2ax+b$, $\\frac{D}{4}=a^{2}-3b\\gt 0$, 즉 $b\\lt \\frac{a^{2}}{3}$.\n$a=1$: $b\\lt \\frac13$ → $0$개, $a=2$: $b\\lt \\frac43$ → $1$개, $a=3$: $b\\lt 3$ → $2$개,\n$a=4$: $b\\lt \\frac{16}{3}$ → $5$개, $a=5$: $b\\lt \\frac{25}{3}$ → $6$개, $a=6$: $b\\lt 12$ → $6$개.\n합 $0+1+2+5+6+6=20$.", "key": "Tm05-11"}, "tm05-12-1": {"id": "tm05-12-1", "unit": "m05", "theme": "12", "벌": 1, "k": "num", "q": "삼차함수 $f(x)=\\frac{1}{3}(a-1)x^{3}+(a-1)x^{2}+2x+3$이 극값을 갖지 않도록 하는 모든 정수 $a$의 값의 합을 구하시오.", "a": "5", "lvl": 2, "w": "[핵심] 극값을 갖지 않을 조건은 $D\\le0$ ($D\\lt 0$이 아니다). 삼차함수이므로 $a\\ne1$.\n$f'(x)=(a-1)x^{2}+2(a-1)x+2$, $\\frac{D}{4}=(a-1)^{2}-2(a-1)=(a-1)(a-3)\\le0$.\n$1\\le a\\le3$이고 $a\\ne1$이므로 $1\\lt a\\le3$. 정수 $a=2,\\,3$, 합은 $5$.\n($a=3$이면 $f'(x)=2(x+1)^{2}\\ge0$으로 부호가 바뀌지 않는다.)", "key": "Tm05-12"}, "tm05-12-2": {"id": "tm05-12-2", "unit": "m05", "theme": "12", "벌": 2, "k": "num", "q": "함수 $f(x)=x^{3}-3(a+1)x^{2}+12ax$가 극값을 갖지 않도록 하는 실수 $a$에 대하여 $f(2)$의 값을 구하시오.", "a": "8", "lvl": 2, "w": "[핵심] $\\frac{D}{4}\\le0$이 완전제곱식이면 등호가 되는 값 하나만 남는다.\n$f'(x)=3x^{2}-6(a+1)x+12a$, $\\frac{D}{4}=9(a+1)^{2}-36a=9(a-1)^{2}\\le0$.\n따라서 $a=1$이고 $f(x)=x^{3}-6x^{2}+12x$.\n$f(2)=8-24+24=8$.", "key": "Tm05-12"}, "tm05-12-3": {"id": "tm05-12-3", "unit": "m05", "theme": "12", "벌": 3, "k": "num", "q": "함수 $f(x)=x^{3}+3ax^{2}+3bx$가 극값을 갖지 않도록 하는 두 실수 $a$, $b$에 대하여 $f(1)$의 최솟값을 구하시오.", "a": "1/4", "lvl": 3, "w": "[핵심] 극값을 갖지 않을 조건 $D\\le0$을 두 미지수의 관계식으로 쓴다.\n$f'(x)=3x^{2}+6ax+3b$, $\\frac{D}{4}=9a^{2}-9b\\le0$이므로 $b\\ge a^{2}$.\n$f(1)=1+3a+3b\\ge1+3a+3a^{2}=3\\left(a+\\frac12\\right)^{2}+\\frac14$.\n$a=-\\frac12$, $b=\\frac14$일 때 최솟값 $\\frac14$.", "key": "Tm05-12"}, "tm05-13-1": {"id": "tm05-13-1", "unit": "m05", "theme": "13", "벌": 1, "k": "num", "q": "함수 $f(x)=x^{3}-6x^{2}+ax$가 열린구간 $(0,\\,5)$에서 극댓값과 극솟값을 모두 갖도록 하는 정수 $a$의 개수를 구하시오.", "a": "11", "lvl": 2, "w": "[핵심] $f'(x)=0$이 구간 안에서 서로 다른 두 실근: 판별식·축·양 끝 값.\n$f'(x)=3x^{2}-12x+a$, 축 $x=2$는 $(0,5)$ 안에 있다.\n$\\frac{D}{4}=36-3a\\gt 0$ → $a\\lt 12$, $f'(0)=a\\gt 0$, $f'(5)=15+a\\gt 0$.\n$0\\lt a\\lt 12$이므로 정수 $a$는 $11$개.", "key": "Tm05-13"}, "tm05-13-2": {"id": "tm05-13-2", "unit": "m05", "theme": "13", "벌": 2, "k": "num", "q": "함수 $f(x)=2x^{3}-3(a+2)x^{2}+12ax$가 열린구간 $(0,\\,4)$에서 극댓값과 극솟값을 모두 갖도록 하는 모든 정수 $a$의 값의 합을 구하시오.", "a": "4", "lvl": 2, "w": "[핵심] $f'(x)$가 인수분해되면 두 근의 위치를 직접 본다.\n$f'(x)=6x^{2}-6(a+2)x+12a=6(x-2)(x-a)$.\n두 근 $2$, $a$가 $(0,4)$ 안에 있고 서로 달라야 하므로 $0\\lt a\\lt 4$, $a\\ne2$.\n($a=2$이면 $f'(x)=6(x-2)^{2}$으로 극값이 없다.) 정수 $a=1,\\,3$, 합은 $4$.", "key": "Tm05-13"}, "tm05-13-3": {"id": "tm05-13-3", "unit": "m05", "theme": "13", "벌": 3, "k": "num", "q": "함수 $f(x)=x^{3}-3x^{2}-9x$가 열린구간 $(a,\\,a+6)$에서 극댓값은 갖지만 극솟값은 갖지 않도록 하는 모든 정수 $a$의 값의 합을 구하시오.", "a": "-18", "lvl": 3, "w": "[핵심] 극대·극소의 위치를 먼저 구하고, 열린구간이므로 끝점 포함 여부를 따진다.\n$f'(x)=3(x+1)(x-3)$: $x=-1$에서 극대, $x=3$에서 극소.\n극대점 포함: $a\\lt -1\\lt a+6$ → $-7\\lt a\\lt -1$.\n극소점 미포함: $a+6\\le3$ 또는 $a\\ge3$ → $a\\le-3$ (열린구간이라 $a+6=3$이면 $3$은 안 들어간다).\n$-7\\lt a\\le-3$: $a=-6,-5,-4,-3$, 합 $-18$.", "key": "Tm05-13"}, "tm05-14-1": {"id": "tm05-14-1", "unit": "m05", "theme": "14", "벌": 1, "k": "num", "q": "함수 $f(x)=x^{4}+4x^{3}+2ax^{2}$이 극댓값을 갖도록 하는 정수 $a$ 중에서 $|a|\\le5$인 것의 개수를 구하시오.", "a": "7", "lvl": 2, "w": "[핵심] 최고차항의 계수가 양수인 사차함수가 극댓값을 가질 조건: $f'(x)=0$이 서로 다른 세 실근.\n$f'(x)=4x(x^{2}+3x+a)$. $x^{2}+3x+a=0$이 $0$이 아닌 서로 다른 두 실근을 가져야 한다.\n$9-4a\\gt 0$ → $a\\lt \\frac94$, 그리고 $x=0$이 근이 아니어야 하므로 $a\\ne0$.\n$|a|\\le5$: $-5,\\cdots,-1,\\,1,\\,2$의 $7$개.", "key": "Tm05-14"}, "tm05-14-2": {"id": "tm05-14-2", "unit": "m05", "theme": "14", "벌": 2, "k": "num", "q": "함수 $f(x)=x^{4}-4ax^{3}+6x^{2}$이 극댓값을 갖지 않도록 하는 정수 $a$의 개수를 구하시오.", "a": "3", "lvl": 2, "w": "[핵심] 극댓값이 없으려면 $f'(x)=0$이 서로 다른 세 실근을 갖지 않아야 한다.\n$f'(x)=4x(x^{2}-3ax+3)$. $x=0$은 $x^{2}-3ax+3=0$의 근이 될 수 없으므로 조건은 $x^{2}-3ax+3=0$의 $D\\le0$.\n$9a^{2}-12\\le0$ → $a^{2}\\le\\frac43$.\n정수 $a=-1,\\,0,\\,1$의 $3$개.", "key": "Tm05-14"}, "tm05-14-3": {"id": "tm05-14-3", "unit": "m05", "theme": "14", "벌": 3, "k": "num", "q": "사차함수 $f(x)$의 도함수가 $f'(x)=4(x-1)(x^{2}-2ax+4)$일 때, $f(x)$가 극댓값을 갖지 않도록 하는 실수 $a$의 최댓값을 구하시오.", "a": "5/2", "lvl": 3, "w": "[핵심] 세 실근이 '서로 다른지'는 판별식과 '이미 있는 근과 겹치는지' 두 가지로 따진다.\n극댓값을 가질 조건: $x^{2}-2ax+4=0$이 $1$이 아닌 서로 다른 두 실근 → $a^{2}\\gt 4$이고 $1-2a+4\\ne0$.\n따라서 극댓값이 없으려면 $-2\\le a\\le2$ 또는 $a=\\frac52$.\n$a=\\frac52$이면 $f'(x)=4(x-1)^{2}(x-4)$로 부호가 한 번만 바뀐다. 최댓값은 $\\frac52$.", "key": "Tm05-14"}, "tm05-15-1": {"id": "tm05-15-1", "unit": "m05", "theme": "15", "벌": 1, "k": "num", "q": "닫힌구간 $[-1,\\,4]$에서 함수 $f(x)=x^{3}-6x^{2}+9x+1$의 최댓값을 $M$, 최솟값을 $m$이라 할 때, $M+m$의 값을 구하시오.", "a": "-10", "lvl": 2, "w": "[핵심] 후보는 구간 안의 극값과 양 끝 값.\n$f'(x)=3(x-1)(x-3)$. $f(-1)=-15$, $f(1)=5$, $f(3)=1$, $f(4)=5$.\n$M=5$, $m=-15$이므로 $M+m=-10$.", "key": "Tm05-15"}, "tm05-15-2": {"id": "tm05-15-2", "unit": "m05", "theme": "15", "벌": 2, "k": "num", "q": "닫힌구간 $[-1,\\,3]$에서 함수 $f(x)=x^{4}-8x^{2}+3$의 최댓값과 최솟값의 차를 구하시오.", "a": "25", "lvl": 2, "w": "[핵심] 구간 밖의 극값($x=-2$)은 후보가 아니다.\n$f'(x)=4x(x+2)(x-2)$. 구간 안의 후보 $x=0,\\,2$와 양 끝.\n$f(-1)=-4$, $f(0)=3$, $f(2)=-13$, $f(3)=12$.\n최댓값 $12$, 최솟값 $-13$, 차는 $25$.", "key": "Tm05-15"}, "tm05-15-3": {"id": "tm05-15-3", "unit": "m05", "theme": "15", "벌": 3, "k": "num", "q": "닫힌구간 $[0,\\,3]$에서 함수 $f(x)=(x^{2}-2x)^{3}-3(x^{2}-2x)$의 최댓값을 $M$, 최솟값을 $m$이라 할 때, $M+m$의 값을 구하시오.", "a": "16", "lvl": 3, "w": "[핵심] $t=x^{2}-2x$로 치환하고 $t$의 범위부터 구한다.\n$0\\le x\\le3$에서 $t=(x-1)^{2}-1$의 범위는 $-1\\le t\\le3$.\n$g(t)=t^{3}-3t$, $g'(t)=3(t+1)(t-1)$. $g(-1)=2$, $g(1)=-2$, $g(3)=18$.\n$M=18$, $m=-2$, $M+m=16$.", "key": "Tm05-15"}, "tm05-16-1": {"id": "tm05-16-1", "unit": "m05", "theme": "16", "벌": 1, "k": "num", "q": "닫힌구간 $[-1,\\,4]$에서 함수 $f(x)=x^{3}-3x^{2}+a$의 최솟값이 $-2$일 때, 최댓값을 구하시오. (단, $a$는 상수이다.)", "a": "18", "lvl": 2, "w": "[핵심] 최솟값 후보를 모두 $a$로 나타내 비교한다.\n$f'(x)=3x(x-2)$. $f(-1)=a-4$, $f(0)=a$, $f(2)=a-4$, $f(4)=a+16$.\n최솟값 $a-4=-2$ → $a=2$. 최댓값은 $f(4)=18$.", "key": "Tm05-16"}, "tm05-16-2": {"id": "tm05-16-2", "unit": "m05", "theme": "16", "벌": 2, "k": "num", "q": "닫힌구간 $[-1,\\,2]$에서 함수 $f(x)=ax^{4}-2ax^{2}+b$의 최댓값이 $13$, 최솟값이 $4$일 때, $a+b$의 값을 구하시오. (단, $a$, $b$는 상수이고 $a\\gt 0$이다.)", "a": "6", "lvl": 2, "w": "[핵심] $a\\gt 0$이므로 증감표가 정해지고, 후보값을 비교할 수 있다.\n$f'(x)=4ax(x+1)(x-1)$. $f(-1)=f(1)=b-a$, $f(0)=b$, $f(2)=8a+b$.\n$a\\gt 0$이므로 최댓값 $8a+b=13$, 최솟값 $b-a=4$.\n$a=1$, $b=5$, $a+b=6$.", "key": "Tm05-16"}, "tm05-16-3": {"id": "tm05-16-3", "unit": "m05", "theme": "16", "벌": 3, "k": "num", "q": "양수 $a$에 대하여 닫힌구간 $[0,\\,2]$에서 함수 $f(x)=x^{3}-3ax$의 최솟값이 $-28$일 때, $a$의 값을 구하시오.", "a": "6", "lvl": 3, "w": "[핵심] 극소점 $x=\\sqrt{a}$가 구간 안에 있는지로 경우를 나눈다.\n$f'(x)=3(x^{2}-a)$, 극소점 $x=\\sqrt a$.\n(i) $\\sqrt a\\le2$($0\\lt a\\le4$): 최솟값 $f(\\sqrt a)=-2a\\sqrt a=-28$ → $a\\sqrt a=14$ → $a=14^{\\frac23}\\gt 4$이므로 모순.\n(ii) $a\\gt 4$: 구간에서 감소하므로 최솟값 $f(2)=8-6a=-28$ → $a=6$ (조건 만족).\n$a=6$.", "key": "Tm05-16"}, "tm05-17-1": {"id": "tm05-17-1", "unit": "m05", "theme": "17", "벌": 1, "k": "num", "q": "곡선 $y=12-x^{2}$ $(0\\lt x\\lt 2\\sqrt3)$ 위의 점 $\\mathrm{P}$에서 $x$축, $y$축에 내린 수선의 발을 각각 $\\mathrm{H}$, $\\mathrm{K}$라 하자. 직사각형 $\\mathrm{OHPK}$의 넓이의 최댓값을 구하시오. (단, $\\mathrm{O}$는 원점이다.)", "a": "16", "lvl": 2, "w": "[핵심] 변수 $t$와 그 범위를 먼저 정하고 넓이를 $t$의 함수로 쓴다.\n$\\mathrm{P}(t,\\,12-t^{2})$ $(0\\lt t\\lt 2\\sqrt3)$, $S(t)=t(12-t^{2})=12t-t^{3}$.\n$S'(t)=12-3t^{2}=0$ → $t=2$. $t=2$의 좌우에서 $+$에서 $-$로 바뀌므로 극대이자 최대.\n$S(2)=2\\cdot8=16$.", "key": "Tm05-17"}, "tm05-17-2": {"id": "tm05-17-2", "unit": "m05", "theme": "17", "벌": 2, "k": "num", "q": "밑면이 정사각형인 직육면체의 모든 모서리의 길이의 합이 $48$일 때, 이 직육면체의 부피의 최댓값을 구하시오.", "a": "64", "lvl": 2, "w": "[핵심] 조건식으로 변수를 하나로 줄이고 범위를 적는다.\n밑면의 한 변을 $x$, 높이를 $h$라 하면 $8x+4h=48$, $h=12-2x$ $(0\\lt x\\lt 6)$.\n$V(x)=x^{2}(12-2x)=12x^{2}-2x^{3}$, $V'(x)=6x(4-x)=0$ → $x=4$.\n$x=4$에서 극대이자 최대, $V(4)=16\\cdot4=64$.", "key": "Tm05-17"}, "tm05-17-3": {"id": "tm05-17-3", "unit": "m05", "theme": "17", "벌": 3, "k": "c5", "q": "반지름의 길이가 $3$인 구에 내접하는 원뿔 중에서 부피가 최대인 원뿔의 부피는?", "a": "$\\dfrac{32}{3}\\pi$", "lvl": 3, "w": "[핵심] 높이 $h$를 변수로, 밑면의 반지름을 $h$로 나타낸다.\n구의 중심에서 밑면까지의 거리는 $|h-3|$이므로 $r^{2}=9-(h-3)^{2}=6h-h^{2}$ $(0\\lt h\\lt 6)$.\n$V(h)=\\frac{\\pi}{3}r^{2}h=\\frac{\\pi}{3}(6h^{2}-h^{3})$, $V'(h)=\\frac{\\pi}{3}(12h-3h^{2})=0$ → $h=4$.\n$h=4$에서 최대, $V(4)=\\frac{\\pi}{3}(96-64)=\\frac{32}{3}\\pi$.", "c": ["$9\\pi$", "$\\dfrac{32}{3}\\pi$", "$12\\pi$", "$\\dfrac{16}{3}\\pi$", "$32\\pi$"], "key": "Tm05-17"}}, "need": {"C": 2, "T": 1}, "gap": 3};
