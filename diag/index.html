<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{max-width:100%;overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--tx);

.brand{font-weight:800;color:var(--acc);font-size:14px;letter-spacing:.02em}

tr.row{cursor:pointer} tr.row:hover td{background:rgba(255,255,255,.03)}

.row-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--dim);margin:6px 0}

 sum:R`<b>명제</b>=참·거짓이 분명한 문장, <b>조건</b>=$x$ 값에 따라 참·거짓이 바뀌는 문장. <b>진리집합</b>은 조건을 참으로 만드는 원소 전체. '모든 $x$ … '의 부정은 '어떤 $x$ … 아니다'. '어떤 $x$에 대하여 $f(x)<0$'이 거짓 ⇔ '모든 $x$에 대하여 $f(x)\ge0$'(이차식이면 판별식으로).`,

{id:'B4',name:'함수와 일대일대응',sub:'함수의 뜻 · 치역 · 일대일함수',

{id:'B5',name:'합성함수',sub:'계산 · 성질 · 역추적',

/* 보기 순서: 문항마다 고정 섞기(정답이 ①에 몰리지 않게). 기록은 원래 번호로 한다 */
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;}
function order(id,n,fix){const ix=[...Array(n).keys()];if(fix)return ix;let h=hash(id);
 for(let i=n-1;i>0;i--){h=Math.imul(h^(h>>>13),1103515245)>>>0;const j=h%(i+1);[ix[i],ix[j]]=[ix[j],ix[i]];}return ix;}

/* ── 적응 엔진 (학생·교사 화면이 같은 함수를 쓴다) ─────────────────────── */
const good=(r,id)=>!!(r[id]&&r[id].ok&&r[id].conf!=='찍음');
const has=(r,id)=>!!r[id];
function nextStep(A,B){
  if(A.self==null||A.self[B]==null) return 'self';
  const r=A.r||{}, k=x=>B+'.'+x;
  if(!has(r,k('c1'))) return 'c1';
  if(!has(r,k('c2'))) return 'c2';
  const cs=good(r,k('c1'))+good(r,k('c2'));
  let toT = cs===2;
  if(!toT){ if(!has(r,k('b'))) return 'b'; toT = (cs===1 && good(r,k('b'))); }
  if(!toT) return null;
  if(!has(r,k('t'))) return 't';
  if(!good(r,k('t'))) return null;
  if(!has(r,k('h'))) return 'h';
  return null;
}
function levelOf(A,B){
  const r=A.r||{}, k=x=>B+'.'+x;
  if(!has(r,k('c1'))||!has(r,k('c2'))) return null;          // 아직
  const cs=good(r,k('c1'))+good(r,k('c2'));
  if(cs===2){
    if(!has(r,k('t'))) return nextStep(A,B)?null:2;
    if(!good(r,k('t'))) return 2;
    if(!has(r,k('h'))) return null;
    return good(r,k('h'))?4:3;
  }
  if(!has(r,k('b'))) return null;
  if(cs===0 && !good(r,k('b'))) return 0;
  if(has(r,k('t')) && good(r,k('t'))) return 2;
  if(cs===1 && good(r,k('b')) && !has(r,k('t'))) return null;
  return 1;
}
function flagsOf(A,B){
  const r=A.r||{}; let over=0,lucky=0,shaky=0,n=0,ms=0;
  for(const x of ['c1','c2','b','t','h']){const v=r[B+'.'+x]; if(!v) continue; n++; ms+=v.ms||0;
    if(!v.ok && v.conf==='확실') over++;
    if(v.ok && v.conf==='찍음') lucky++;
    if(v.ok && v.conf==='애매') shaky++;}
  return {over,lucky,shaky,n,ms};
}
function progress(A){let done=0;for(const b of BLOCKS) if(A.self&&A.self[b.id]!=null&&!nextStep(A,b.id)) done++;return done;}
function totalAnswered(A){return Object.keys(A.r||{}).length;}

function route(){
  if(!A.started) return intro();
  if(!A.pre||!A.pre.done) return pre();
  for(const b of BLOCKS){ const s=nextStep(A,b.id); if(s){ return s==='self'?selfRate(b):item(b,s); } }
  if(!A.fin) return fin();
  return result();
}

const norm=s=>String(s).replace(/\s/g,'').replace(/−/g,'-').replace(/^\+/,'');
function answer(conf,skip){
  const {b,it,id,t0}=cur; const ms=Date.now()-t0;

  A.r[id]={a,ok,conf:skip?'모름':conf,ms,at:new Date().toISOString()};
  const before=progress(A);
  let pv=''; if(PREVIEW){ const ca=it.type==='mc'? it.o[it.a-1] : it.a; pv=`<b style="color:${ok?'var(--good)':'var(--bad)'}">${ok?'○ 정답':'× 오답'}</b> · 정답: `+ca; }

}

let ROWS=[], SORT={k:'no',d:1}, OPEN=null, AUTO=null, EXTRA=[];
function given(n){ n=String(n||''); const two=['남궁','황보','제갈','선우','독고','사공','서문']; return two.some(s=>n.startsWith(s))&&n.length>3? n.slice(2) : (n.length>=3?n.slice(1):n); }
function batchim(ch){ const c=ch.charCodeAt(0)-0xac00; return c>=0&&c<=11171 && c%28!==0; }
function callName(n){ const g=given(n); return batchim(g.slice(-1))? g+'이' : g; }   // 주영→주영이, 서우→서우
function josa(w,a,b){ return batchim(w.slice(-1))?w+a:w+b; }

function summarize(A){
  const lv={}, fl={}; let sum=0,cnt=0,over=0,lucky=0,shaky=0,ms=0,metaGap=[];
  for(const b of BLOCKS){ const L=levelOf(A,b.id); lv[b.id]=L; const f=flagsOf(A,b.id); fl[b.id]=f;
    over+=f.over; lucky+=f.lucky; shaky+=f.shaky; ms+=f.ms;
    if(L!=null){sum+=L;cnt++; const s=A.self&&A.self[b.id]; if(s!=null) metaGap.push({b,gap:s-Math.min(L,3),s,L});} }
  const avg=cnt?sum/cnt:null;
  const status = !A.started?'미시작' : (A.fin?'완료' : `${progress(A)}/8`);
  return {lv,fl,avg,cnt,over,lucky,shaky,ms,metaGap,status,n:totalAnswered(A)};
}
function track(avg){ if(avg==null) return ['-','']; if(avg>=3) return ['심화 트랙','개념 설명 시간엔 심화 과제 병행 · 유형은 고난도 위주로'];
  if(avg>=2) return ['유형 트랙','흔들리는 단원만 개념 재확인 → 대표 유형 반복'];
  if(avg>=1) return ['개념 보강 트랙','개념 확인 → 기초·대표 유형 순서로 다시 쌓기'];
  return ['기초 재시작 트랙','처음 배운다는 전제로 개념부터 · 과제 분량 낮추고 확인 횟수 늘리기']; }

  L.push(`안녕하세요, 어머님. 수학은유강 박유강입니다.`);
  L.push('');
  L.push(`오늘 ${nm}가 기말고사 범위인 명제~무리함수 단원을 선행 때 배운 만큼 얼마나 기억하고 있는지 확인하는 개념 진단을 봤어요. 단원을 8개로 나눠서, 개념 문항을 맞히면 유형·심화 문항으로 올라가고 막히면 기초 문항으로 내려가는 방식이라 아이가 어디까지 알고 있는지 꽤 또렷하게 보였습니다.`);
  L.push('');
  if(strong.length) L.push(`잘 남아 있는 부분: ${strong.join(', ')}\n→ 개념뿐 아니라 대표 유형까지 스스로 풀어냈어요.`);
  if(ok2.length) L.push(`개념은 잡혀 있는 부분: ${ok2.join(', ')}\n→ 개념은 정확한데 유형 문제에서 한 번 더 손이 가야 하는 단계예요.`);
  if(weak.length) L.push(`다시 잡아야 할 부분: ${weak.join(', ')}\n→ 개념 문항에서 흔들려서, 수업에서 개념부터 다시 짚고 확인하겠습니다.`);
  if(notyet.length) L.push(`(${notyet.join(', ')} 단원은 시간이 모자라 다음 시간에 마저 확인할게요.)`);
  L.push('');
  const notes=[];
  if(S.over>=2) notes.push(`'확실하다'고 답했는데 틀린 문항이 ${S.over}개 있었어요. 안다고 생각하는 부분에서 실수가 나오는 편이라, 풀이를 말로 설명하게 하면서 확인하려고 해요.`);
  if(S.lucky>=2) notes.push(`맞힌 문항 중 스스로 '찍었다'고 표시한 게 ${S.lucky}개였어요. 솔직하게 표시해 준 덕분에 정답이어도 다시 봐야 할 곳을 정확히 알게 됐습니다.`);
  const under=S.metaGap.filter(g=>g.gap<=-2).length, overS=S.metaGap.filter(g=>g.gap>=2).length;
  if(overS>=2) notes.push(`풀기 전 '이 정도는 안다'고 한 단원 중 실제로는 흔들린 곳이 몇 군데 있어서, 기말 전에 꼭 짚고 넘어가겠습니다.`);
  else if(under>=2) notes.push(`본인은 자신 없다고 했는데 실제로는 잘 풀어낸 단원이 많았어요. 생각보다 탄탄하니 자신감을 가져도 된다고 이야기해 주었습니다.`);
  if(notes.length){ L.push(...notes); L.push(''); }
  const avg=S.avg;
  const plan = avg==null?'' : avg>=3 ? `전체적으로 개념이 탄탄하게 남아 있어서, 수업에서는 개념 설명을 짧게 듣고 심화 문항 위주로 따로 과제를 주려고 합니다. 기말에서 변별되는 고난도 문항까지 대비하는 게 목표예요.`
    : avg>=2 ? `개념의 큰 틀은 잡혀 있어서, 흔들리는 단원만 다시 짚고 대표 유형을 반복해서 손에 붙이는 데 집중하겠습니다.`
    : avg>=1 ? `개념이 군데군데 비어 있는 상태라, 기말 전까지 개념 확인 → 기본 유형 순서로 차근차근 다시 쌓아 가겠습니다. 매 수업 시작마다 지난 개념을 짧게 확인하는 리뷰를 하고 있어서 빈틈은 빠르게 메워질 거예요.`
    : `선행 때 배운 내용이 많이 흐려진 상태라, 처음 배운다는 생각으로 개념부터 천천히 다시 잡겠습니다. 지금 시점에 확인한 게 오히려 다행이고, 기말까지 시간은 충분합니다.`;
  if(plan) L.push(plan);
  L.push('');
  L.push(`궁금하신 점 있으시면 편하게 연락 주세요. 감사합니다.`);
  return L.join('\n');
}

function showDetail(silent){
  const r=allRows().find(x=>x.name===OPEN); const box=$('detail'); if(!r||!box) return;
  const S=r.S, A=r.A, p=A.pre||{};
  const tr=track(S.avg);
  const items=[];
  for(const b of BLOCKS) for(const s of ['c1','c2','b','t','h']){ const v=(A.r||{})[b.id+'.'+s]; if(!v) continue;
    const it=b.items[s]; const pos = it.type==='mc'&&v.a? order(b.id+'.'+s,it.o.length,it.fix).indexOf(v.a-1)+1 : null;
    items.push(`<tr><td class="l">${E(b.name)}</td><td>${KIND[it.k]}</td><td>${v.ok?'<b style="color:var(--good)">○</b>':'<b style="color:var(--bad)">×</b>'}</td><td>${E(v.conf)}</td><td>${v.a==null?'-':(it.type==='mc'?`원${v.a}${pos?` (화면 ${pos})`:''}`:E(v.a))}</td><td>${it.type==='mc'?'원'+it.a:E(it.a)}</td><td>${Math.round((v.ms||0)/1000)}초</td></tr>`); }
  const meta=S.metaGap.map(g=>`<span class="flag ${g.gap>=2?'r':g.gap<=-2?'g':''}">${E(g.b.name)} 자기${g.s}→실제${g.L}</span>`).join('');
  const talk=[];
  const weakB=BLOCKS.filter(b=>S.lv[b.id]!=null&&S.lv[b.id]<=1).map(b=>b.name);
  if(weakB.length) talk.push(`약한 단원(${weakB.join(', ')}): 선행 때 이 부분을 어떻게 배웠는지, 어디서부터 기억이 끊기는지 물어보기`);
  if(S.over>=2) talk.push(`과신 ${S.over}건 — '확실'인데 틀린 문항을 같이 열어 보고 오개념인지 계산 실수인지 구분`);
  if(S.lucky>=2) talk.push(`찍음 정답 ${S.lucky}건 — 정답이라도 근거를 말로 설명해 보게 하기`);
  if(p.stuck==='그냥 넘어간다'||p.stuck==='바로 해설을 본다') talk.push(`막힐 때 '${p.stuck}' — 고민 시간 규칙(예: 5분 고민 → 힌트 → 해설) 약속하기`);
  if(p.hours==='2시간 미만') talk.push('자습 시간 주 2시간 미만 — 루프 15분/일 루틴부터 확보');
  if(p.goal && S.avg!=null && ((p.goal==='1등급'&&S.avg<3)||(p.goal==='2등급'&&S.avg<2))) talk.push(`목표(${p.goal})와 현재 개념 상태 차이가 큼 — 기말까지 주차별 목표 같이 세우기`);
  if(A.fin&&A.fin.memo) talk.push(`학생 한마디: "${A.fin.memo}"`);
  if(p.worry) talk.push(`고민: "${p.worry}"`);
  box.innerHTML=`<div class="card"><div class="top"><h2 style="margin:0">${E(r.name)} — ${E(tr[0])}</h2><button class="btn ghost" style="width:auto;margin:0;padding:6px 12px" id="cls">닫기</button></div>
  <p class="dim sm">${E(tr[1])}</p>
  <div class="grid2"><div><h3>단원별 레벨</h3>${BLOCKS.map(b=>lvRow(b,S.lv[b.id])).join('')}
   <h3>자기 평가 vs 실제</h3><div>${meta||'<span class="dim">-</span>'}</div>
   <h3>문진</h3><div class="kv">${PRE.map(x=>`<div>${E(x.q.replace(/\(.*?\)/g,''))}</div><div>${E(Array.isArray(p[x.k])?p[x.k].join(', '):(p[x.k]||'-'))}</div>`).join('')}
   <div>자신 없는 단원</div><div>${E((A.fin&&A.fin.weak||[]).map(id=>BMAP[id].name).join(', ')||'-')}</div></div></div>
  <div><h3>상담 포인트</h3><div class="sum">${talk.length?talk.map(t=>'• '+E(t)).join('<br>'):'<span class="dim">특이사항 없음</span>'}</div>
   <h3>학부모 문구 (고쳐서 쓰세요)</h3><textarea class="msg" id="pm">${E(parentMsg(r))}</textarea>
   <div class="row-tools"><button class="btn" id="cp">복사</button></div></div></div>
  <h3>문항별</h3><div class="tw"><table><thead><tr><th class="nos">단원</th><th class="nos">종류</th><th class="nos">정오</th><th class="nos">확신</th><th class="nos">학생 답</th><th class="nos">정답</th><th class="nos">시간</th></tr></thead><tbody>${items.join('')||'<tr><td colspan="7" class="dim">아직 없음</td></tr>'}</tbody></table></div></div>`;
  tex(box);
  $('cls').onclick=()=>{OPEN=null;box.innerHTML='';};
  $('cp').onclick=async()=>{ const t=$('pm').value; try{ await navigator.clipboard.writeText(t); $('cp').textContent='복사됨 ✓'; }catch(e){ $('pm').select(); document.execCommand('copy'); $('cp').textContent='복사됨 ✓'; } };
  if(!silent) box.scrollIntoView({behavior:'smooth',block:'start'});
}

boot();
</script>
</body></html>
