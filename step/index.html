<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>단계 해설 · 수학은유강</title>
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="수학은유강 — 단계 해설">
<meta property="og:description" content="어려운 문항을 한 걸음씩.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<style>
:root{color-scheme:dark;
 --bg:#0a0a0f; --card:rgba(255,255,255,.03); --bd:rgba(255,255,255,.07);
 --tx:#f5f5fa; --tx2:#b8b8c5; --dim:#8a8a98; --acc:#f5a0a0;
 --ok:#8fe0b4; --okbg:rgba(143,224,180,.13); --no:#ff7a9c;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{max-width:100%;overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--tx);
 font:15px/1.65 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;
 padding:18px clamp(12px,4vw,28px) calc(60px + env(safe-area-inset-bottom))}
main{max-width:620px;margin:0 auto}
.brand{font-weight:800;color:var(--acc);font-size:15px;letter-spacing:.02em}
h1{font-size:21px;margin:8px 0 4px}
.sub{color:var(--dim);font-size:13px;margin-bottom:22px}
.pick{background:var(--card);border:1px solid var(--bd);border-radius:15px;padding:15px 16px;
 margin-bottom:10px;cursor:pointer;display:flex;align-items:center;gap:13px}
.pick .no{font-size:22px;font-weight:800;color:var(--acc);min-width:34px}
.pick .ti{flex:1;min-width:0}
.pick .ti b{display:block;font-size:15px}
.pick .ti span{color:var(--dim);font-size:12.5px}
.pick .st{font-size:12px;color:var(--dim);white-space:nowrap}
.pick .st.done{color:var(--ok)}
@media (hover:hover) and (pointer:fine){ .pick:hover{border-color:rgba(245,160,160,.35)} }
.back{font:inherit;font-size:13px;color:var(--tx2);background:none;border:1px solid var(--bd);
 border-radius:10px;padding:7px 14px;cursor:pointer;margin-bottom:16px}
.stem{background:var(--card);border:1px solid var(--bd);border-radius:15px;padding:15px 16px;margin-bottom:14px}
.stem .tag{font-size:11px;letter-spacing:.14em;color:var(--acc);margin-bottom:7px}
.cond{border:1px solid var(--bd);border-radius:11px;padding:11px 13px;margin-top:11px;
 background:rgba(255,255,255,.025);font-size:14px}
.cond p{margin:0 0 6px}.cond p:last-child{margin:0}
.fig{margin:12px 0 0;text-align:center}
.fig img{max-width:100%;border-radius:9px;background:#fff;padding:8px}
.ch{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:11px;color:var(--tx2);font-size:14px}
.prog{height:4px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;margin:0 0 14px}
.prog i{display:block;height:100%;width:0;background:var(--acc);transition:width .25s}
.step{background:var(--card);border:1px solid var(--bd);border-radius:15px;padding:15px 16px;margin-bottom:11px}
.step.past{opacity:.55}
.step .n{font-size:11px;letter-spacing:.14em;color:var(--acc);margin-bottom:6px}
.step .q{font-weight:700;margin-bottom:11px}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:14px;color:var(--tx2);
 background:rgba(255,255,255,.035);border:1px solid var(--bd);border-radius:11px;
 padding:11px 13px;cursor:pointer;margin-bottom:7px;transition:background .12s,border-color .12s}
.opt.ok{background:var(--okbg);border-color:rgba(143,224,180,.55);color:#dff6e9;font-weight:700}
.opt.no{border-color:rgba(255,122,156,.45);color:#ffc9d7;opacity:.65}
.opt[disabled]{cursor:default}
@media (hover:hover) and (pointer:fine){ .opt:not([disabled]):hover{border-color:rgba(245,160,160,.35);color:var(--tx)} }
.hint{margin-top:9px;padding:10px 12px;border-radius:10px;font-size:13.5px;
 background:rgba(252,232,200,.09);color:#f0e2cb;border:1px solid rgba(252,232,200,.2)}
.hint b{color:#ffe9c4}
.sol{margin-top:11px;padding:12px 13px;border-radius:11px;font-size:14px;line-height:1.75;
 background:rgba(255,255,255,.04);border:1px solid var(--bd);color:var(--tx2)}
.sol .h{font-size:11px;letter-spacing:.12em;color:var(--ok);margin-bottom:6px}
.next{width:100%;font:inherit;font-size:14px;font-weight:800;color:#1a0d12;background:var(--acc);
 border:none;border-radius:11px;padding:12px;cursor:pointer;margin-top:12px}
.fin{text-align:center;padding:34px 10px 10px}
.fin .k{font-size:40px;line-height:1}
.fin b{display:block;font-size:19px;margin:12px 0 6px}
.fin p{color:var(--tx2);font-size:14px;margin:0 0 18px}
.foot{color:var(--dim);font-size:11.5px;line-height:1.7;margin-top:26px;
 border-top:1px solid var(--bd);padding-top:14px}
.katex{font-size:1.02em}
</style></head>

 * 빠진 것은 분량이 아니라 **착상**이다 — 해설이 첫 수를 이미 둔 자리에서 시작한다.
 * 착상은 읽어서 안 생기고 그 갈림길에서 한 번 판단해 봐야 남는다. 그래서 읽는 해설이 아니라
 * **걸어가는 해설**로 만든다. 루프("판단과 근거만 묻는다")와 같은 결이다.
 *
 * ⚠ 인증도와 섞지 않는다. 여기서 맞혔다고 그 유형을 잡은 것이 아니다.
 * ⚠ 학생 데이터를 한 칸도 안 쓴다 — 시제품이라 토큰이 없다. 붙일 때 survey 와 같은 열쇠를 쓴다.
 * ⚠ 말투는 존댓말 + ~요 (0827 유강 확정). 반말·명령형 금지.
 *
 * 스텝 짜는 규칙 (이게 이 파일의 값어치다)
 *   · 1번 스텝은 언제나 **착상**을 묻는다. "무엇부터 보나" — 지금 해설이 비워 둔 자리.
 *   · 오답 선지는 학생이 실제로 빠지는 함정이어야 한다. 아무 말이나 넣으면 찍어서 넘어간다.
 *   · 계산 자체는 안 시킨다. 폰으로 푸는 것이 아니라 판단만 한다.

  {q:'$g$가 미분가능하지 않을 수 있는 자리는 어디일까요? 후보를 고르세요.',
   o:['$f$가 꺾이는 점, 그리고 두 거리가 같아지는 점',
      '$f$가 꺾이는 점만',
      '두 거리가 같아지는 점만',
      '$g(x)=0$이 되는 점'], a:0,
   hint:'$g$는 두 함수 중 작은 쪽이에요. 재료가 꺾여도 꺾이고, 작은 쪽이 뒤바뀌는 자리에서도 꺾입니다.',
   sol:`$g=\\min\\left(d_{\\mathrm{A}}^{\\,2},\\ d_{\\mathrm{B}}^{\\,2}\\right)$입니다. 꺾일 수 있는 자리는 둘뿐이에요.
     <br>① $f$ 자체가 꺾이는 점 — $x=-1$, $x=3$
     <br>② $d_{\\mathrm{A}}^{\\,2}=d_{\\mathrm{B}}^{\\,2}$가 되며 <b>작은 쪽이 바뀌는</b> 점
     <br>후보를 여기까지 좁히는 게 이 문제의 전부입니다. 나머지는 확인 작업이에요.`},
  {q:'$x=-1$에서는 어떤가요? ($\\mathrm{A}(-1,1)$ 바로 아래 자리)',
   o:['미분가능하지 않다','미분가능하다','판단할 수 없다','$g$가 정의되지 않는다'], a:0,
   hint:'그 근처에서 $g(x)=(x+1)^2+(|x+1|-1)^2$이에요. 좌·우 미분계수를 따로 구해 보세요.',
   sol:`$x=-1$ 근처에서는 $d_{\\mathrm{A}}^{\\,2}$가 더 작아
     $g(x)=(x+1)^2+\\left(|x+1|-1\\right)^2$입니다.
     좌미분계수는 $2$, 우미분계수는 $-2$로 서로 달라 미분가능하지 않습니다.`},
  {q:'$x=3$에서는요? $f$가 여기서도 꺾이는데, $\\mathrm{B}(3,4)$는 곡선 위의 점입니다.',
   o:['미분가능하다','미분가능하지 않다','$f$가 꺾이니 무조건 미분불가','좌우 미분계수가 $2$와 $-2$다'], a:0,
   hint:'$x=3$에서 $g$의 값은 얼마인가요? $g\\ge 0$인데 거기서 $0$이라면?',
   sol:`$\\mathrm{B}$가 곡선 위의 점이라 $x=3$에서 $d_{\\mathrm{B}}^{\\,2}=0$, 즉 $g(3)=0$입니다.
     $g\\ge 0$이므로 $x=3$은 $g$의 최솟값 자리이고, 좌·우 미분계수가 모두 $0$이에요.
     <b>$f$가 꺾여도 $g$는 미분가능합니다.</b> 여기가 이 문제가 파 놓은 함정입니다.`},
  {q:'이제 두 거리가 같아지는 점을 구간별로 찾으면?',
   o:['$x=\\dfrac{17}{14}$와 $x=\\dfrac{37}{4}$','$x=\\dfrac{17}{14}$만','$x=\\dfrac{37}{4}$만','$x=1$과 $x=9$'], a:0,
   hint:'$-1<x<3$에서는 $f(x)=x+1$, $x>3$에서는 $f(x)=-2x+10$을 넣고 각각 푸세요.',
   sol:`$-1<x<3$: $(x+1)^2+x^2=2(x-3)^2 \\Rightarrow 14x=17 \\Rightarrow x=\\dfrac{17}{14}$
     <br>$x>3$: $(x+1)^2+(9-2x)^2=5(x-3)^2 \\Rightarrow 4x=37 \\Rightarrow x=\\dfrac{37}{4}$
     <br>두 점 모두에서 작은 쪽이 실제로 바뀌므로 둘 다 미분가능하지 않습니다.`},
  {q:'$28p$의 값은?', final:true,
   o:['① $265$','② $266$','③ $267$','④ $268$','⑤ $269$'], a:0,
   hint:'미분불가능한 점은 셋입니다. $x=3$은 들어가지 않아요.',
   sol:`미분가능하지 않은 점은 $x=-1,\\ \\dfrac{17}{14},\\ \\dfrac{37}{4}$.
     $p=-1+\\dfrac{17}{14}+\\dfrac{37}{4}=\\dfrac{-28+34+259}{28}=\\dfrac{265}{28}$이므로
     $28p=265$.`}
 ]
}];

/* ── 화면 ───────────────────────────────────────────────────────────── */
const $=s=>document.querySelector(s);
const IMGS={IMG19,IMG20};
let cur=null, at=0, miss=0;

/* 진행 저장 — 폰에서 카톡 알림에 튕겨 나갔다 돌아와도 자리가 남아야 한다.
   ⚠ 사생활 모드·저장 차단이면 던진다. 실패해도 페이지는 그냥 돌아가야 한다. */
function load(){ try{ return JSON.parse(localStorage.getItem('step:chodang')||'{}'); }catch(e){ return {}; } }
function save(o){ try{ localStorage.setItem('step:chodang', JSON.stringify(o)); }catch(e){} }

function tex(el){
  try{ renderMathInElement(el,{delimiters:[{left:'$',right:'$',display:false}],throwOnError:false}); }
  catch(e){}
}

function list(){
  cur=null;
  const p=load();
  const H=[`<div class="brand">수학은유강</div>
    <h1>단계 해설</h1>
    <div class="sub">초당고 고2 2학기 중간 · 어려웠던 세 문항이에요.<br>
      한 번에 다 풀지 않아요. 갈림길마다 하나씩만 고르면 됩니다.</div>`];
  Q.forEach((q,i)=>{
    const d=p[q.n]||{};
    const st=d.done ? '<span class="st done">✓ 완료</span>'
        : d.at ? `<span class="st">${d.at}/${q.steps.length}</span>` : '<span class="st">시작하기</span>';
    H.push(`<div class="pick" data-i="${i}">
      <div class="no">${q.n}</div>
      <div class="ti"><b>${q.유형}</b><span>${q.steps.length}단계 · ${q.배점}</span></div>${st}</div>`);
  });
  H.push(`<div class="foot">이 페이지는 시험 삼아 만든 것이에요. 써 보고 어땠는지 알려주시면 고쳐 나갈게요.<br>
    답을 맞히는 게 목적이 아니라 <b>어디서부터 손대는지</b>를 잡는 게 목적입니다.</div>`);
  $('#app').innerHTML=H.join('');
  document.querySelectorAll('.pick').forEach(b=>b.onclick=()=>open(+b.dataset.i));
  tex($('#app'));
  window.scrollTo(0,0);
}

function open(i){
  cur=i; const p=load(); at=(p[Q[i].n]&&p[Q[i].n].at)||0; miss=0;
  if(at>=Q[i].steps.length) at=0;
  draw();
}

function draw(){
  const q=Q[cur];
  const H=[`<button class="back" id="back">← 목록</button>`,
    `<div class="stem"><div class="tag">${q.n}번 · ${q.배점}</div>${q.stem}`];
  if(q.cond) H.push(`<div class="cond">${q.cond.map(c=>`<p>${c}</p>`).join('')}</div>`);
  if(q.img)  H.push(`<div class="fig"><img src="${IMGS[q.img]}" alt="문항 그림"></div>`);
  H.push(`<div class="ch">${q.choices.map(c=>`<span>${c}</span>`).join('')}</div></div>`);
  H.push(`<div class="prog"><i style="width:${Math.round(at/q.steps.length*100)}%"></i></div>`);
  H.push(`<div id="steps"></div>`);
  $('#app').innerHTML=H.join('');
  $('#back').onclick=list;
  tex($('.stem'));
  paint();
  window.scrollTo(0,0);
}

function paint(){
  const q=Q[cur], H=[];
  for(let k=0;k<=at && k<q.steps.length;k++){
    const s=q.steps[k], done=k<at;
    H.push(`<div class="step${done?' past':''}" data-k="${k}">
      <div class="n">${s.final?'마지막':'STEP '+(k+1)}</div>
      <div class="q">${s.q}</div>
      ${s.o.map((o,j)=>`<button class="opt" data-k="${k}" data-j="${j}"${done?' disabled':''}>${o}</button>`).join('')}
      <div class="slot"></div></div>`);
  }
  if(at>=q.steps.length){
    H.push(`<div class="fin"><div class="k">✓</div><b>다 걸어왔어요</b>
      <p>다음에 비슷한 문항을 만나면 <b>첫 스텝</b>만 떠올려 보세요.<br>거기까지가 이 문제의 고비였어요.</p>
      <button class="back" id="tolist">목록으로</button></div>`);
  }
  $('#steps').innerHTML=H.join('');
  // 이미 끝낸 스텝은 정답·해설을 펼쳐 둔다 — 되돌아와 다시 읽는 게 이 페이지의 쓸모다
  for(let k=0;k<at;k++) reveal(k,true);
  document.querySelectorAll('.opt:not([disabled])').forEach(b=>b.onclick=()=>hit(+b.dataset.k,+b.dataset.j));
  const tl=$('#tolist'); if(tl) tl.onclick=list;
  tex($('#steps'));
}

function hit(k,j){
  const s=Q[cur].steps[k];
  const box=document.querySelector(`.step[data-k="${k}"]`);
  const btn=box.querySelector(`.opt[data-j="${j}"]`);
  if(j===s.a){ reveal(k,false); return; }
  miss++;
  btn.classList.add('no'); btn.disabled=true;
  if(miss>=2){ reveal(k,false, true); return; }
  const slot=box.querySelector('.slot');
  slot.innerHTML=`<div class="hint"><b>힌트</b> · ${s.hint}</div>`;
  tex(slot);
}

/* 정답 공개 + 해설 조각. quiet=true 는 되돌아왔을 때(다시 그리기)라 버튼을 안 만든다. */
function reveal(k, quiet, gaveup){
  const q=Q[cur], s=q.steps[k];
  const box=document.querySelector(`.step[data-k="${k}"]`);
  if(!box) return;
  box.querySelectorAll('.opt').forEach((b,j)=>{
    b.disabled=true;
    if(j===s.a) b.classList.add('ok');
  });
  const slot=box.querySelector('.slot');
  slot.innerHTML=`<div class="sol"><div class="h">${gaveup?'같이 봐요':'그래서'}</div>${s.sol}</div>`
    + (quiet?'':`<button class="next" data-k="${k}">${k+1<q.steps.length?'다음 단계':'끝내기'}</button>`);
  tex(slot);
  if(quiet) return;
  const nb=slot.querySelector('.next');
  if(nb) nb.onclick=()=>{
    at=k+1; miss=0;
    const p=load(); p[q.n]={at, done:at>=q.steps.length}; save(p);
    draw();
  };
}

list();
</script></body></html>
