<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MATHIS 수업 콘솔</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{ --key:#EA9090; --key-d:#d97777; --bg:#faf7f5; --card:#fff; --ink:#2b2b2b; --sub:#8a8078; --line:#eee3dd; --ok:#5cb85c; --warn:#e0a800; --bad:#d9534f; }
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{margin:0;font-family:'Paperlogy','Pretendard',system-ui,-apple-system,'Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);padding-bottom:90px;}
header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px;}
header h1{font-size:17px;margin:0;flex:1;} header h1 b{color:var(--key);}
.pill{font-size:12px;color:var(--sub);border:1px solid var(--line);border-radius:99px;padding:4px 10px;background:#fff;}
main{max-width:640px;margin:0 auto;padding:14px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;}
.card h2{font-size:14px;margin:0 0 10px;color:var(--sub);font-weight:600;letter-spacing:.02em;}
button{font-family:inherit;font-size:15px;border:none;border-radius:10px;padding:12px 14px;background:#f1e9e4;color:var(--ink);cursor:pointer;}
button:active{transform:scale(.97);}
@media (hover:hover) and (pointer:fine){ button:hover{filter:brightness(.96);} }
button.key{background:var(--key);color:#fff;font-weight:700;}
button.ghost{background:transparent;border:1px solid var(--line);}
input,textarea,select{font-family:inherit;font-size:15px;border:1px solid var(--line);border-radius:10px;padding:11px;width:100%;background:#fff;color:var(--ink);}
input:focus,textarea:focus{outline:2px solid var(--key);border-color:var(--key);}
.row{display:flex;gap:8px;align-items:center;}
.grow{flex:1;}
.classbtns{display:flex;flex-wrap:wrap;gap:8px;}
.classbtns button{flex:1 1 28%;padding:16px 8px;font-weight:700;font-size:16px;}
.classbtns button.on{background:var(--key);color:#fff;}
.stu{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff;}
.stu .name{font-weight:700;font-size:16px;}
.stu .school{font-size:12px;color:var(--sub);margin-left:6px;}
.seg{display:flex;gap:6px;margin:8px 0;}
.seg button{flex:1;padding:10px 4px;font-size:14px;background:#f6f0ec;}
.seg button.a1{background:var(--ok);color:#fff;} .seg button.a2{background:var(--warn);color:#fff;} .seg button.a3{background:var(--bad);color:#fff;}
.minirow{display:flex;gap:6px;margin-top:8px;}
.minirow input{padding:9px;font-size:14px;}
.lbl{font-size:11px;color:var(--sub);margin-bottom:3px;display:block;}
.savemark{font-size:11px;color:var(--ok);float:right;opacity:0;transition:opacity .3s;}
.savemark.show{opacity:1;}
.signal{border-left:4px solid var(--key);padding-left:10px;margin-bottom:10px;}
.signal .why{font-size:13px;color:var(--sub);}
.todayclass{display:flex;justify-content:space-between;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:#fff;}
.todayclass:active{background:#f9f1ed;}
.time{color:var(--sub);font-size:13px;}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 10px calc(6px + env(safe-area-inset-bottom));z-index:10;}
nav button{flex:1;background:transparent;font-size:13px;color:var(--sub);padding:10px 0;}
nav button.on{color:var(--key);font-weight:700;}
/* 학습현황으로 건너가는 링크 — 뷰가 아니라 다른 화면이라 .on 이 붙지 않는다 */
nav a.xlink{flex:1;display:flex;align-items:center;justify-content:center;font-size:13px;
 color:var(--sub);text-decoration:none;padding:10px 0;}
@media (hover:hover) and (pointer:fine){nav a.xlink:hover{color:var(--key);}}
.hidden{display:none!important;}
#login{max-width:380px;margin:12vh auto;padding:0 20px;}
#login .logo{font-size:26px;font-weight:800;text-align:center;margin-bottom:24px;}
#login .logo b{color:var(--key);}
.msg{font-size:13px;color:var(--sub);margin-top:10px;text-align:center;min-height:18px;}
.footbar{position:sticky;bottom:78px;display:flex;gap:8px;margin-top:14px;}
.footbar button{flex:1;padding:15px;font-size:16px;}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:30;}
.toast.show{opacity:.94;}
textarea{min-height:44px;resize:vertical;}
.badge{font-size:11px;border-radius:99px;padding:3px 8px;background:#f6e7e7;color:var(--key-d);font-weight:700;}
.prevhw{font-size:14px;background:#f9f4f1;border:1px dashed var(--line);border-radius:10px;padding:10px;color:var(--ink);white-space:pre-wrap;}
.items{display:flex;gap:5px;margin-top:8px;align-items:center;}
.items button{flex:1;padding:10px 0;font-size:14px;font-weight:700;background:#f6f0ec;color:var(--sub);}
.items button.s2{background:var(--ok);color:#fff;} .items button.s1{background:var(--warn);color:#fff;} .items button.s0{background:var(--bad);color:#fff;}
.items .sum{flex:0 0 62px;text-align:center;font-weight:800;font-size:16px;color:var(--key-d);}
.recent{font-size:11px;color:var(--sub);margin-left:8px;}
.indhw{color:#8a4b1f;font-weight:600;line-height:1.35;max-width:260px;}
.clinicrow{flex-wrap:wrap;}
.clinicrow>div{min-width:0;}
.clinicrow input{min-width:0;max-width:100%;}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;width:100%;min-width:0;height:44px;background:#fff;}
/* ── 데스크탑: 시트형 표 ──────────────────────────────────────────────
 * 입력은 전부 PC 에서 한다(0811 유강). 폰은 확인용이다.
 * 그래서 900px 이상에서는 폰 관용구를 걷어낸다:
 *   하단 고정 nav → 헤더 밑 가로 탭 (flex order 로 자리만 바꾼다. DOM 은 그대로)
 *   큼직한 터치 버튼 → 조밀한 버튼 · 화면에 한 반이 다 보이게
 *   표 머리 고정 → 20명을 훑어도 열 이름이 안 사라진다
 */
@media(min-width:900px){
  #app{display:flex;flex-direction:column;min-height:100vh;}
  header{order:0;} nav{order:1;} main{order:2;}
  body{padding-bottom:0;}
  /* ⚠ flex 컬럼 안에서 margin:0 auto 만 주면 stretch 가 꺼져 내용 너비로 쪼그라든다.
     width:100% 를 같이 줘야 화면을 채우고 max-width 로 가운데 정렬된다. */
  main{width:100%;max-width:1560px;padding:18px 24px 40px;}
  nav{position:static;border-top:none;border-bottom:1px solid var(--line);
      padding:0 24px;justify-content:flex-start;}
  nav button,nav a.xlink{flex:0 0 auto;padding:12px 18px;font-size:14px;}
  nav button.on{box-shadow:inset 0 -2px 0 var(--key);}
  nav a.xlink{margin-left:auto;}
  .classbtns button{flex:0 0 auto;padding:10px 20px;font-size:14px;}
  .footbar{position:static;margin-top:16px;}
  .footbar button{flex:0 0 auto;padding:12px 30px;font-size:15px;}
  /* ⚠ 표를 감싼 카드에 overflow-x:auto 가 있으면 그 카드가 스크롤 컨테이너가 되고,
     thead 의 sticky 가 화면이 아니라 그 카드를 기준으로 붙어 **표 한가운데에 떠서
     첫 줄을 덮는다**(0811 유강 스크린샷). 데스크탑에선 표가 화면에 다 들어오므로
     감싼 카드의 overflow 를 풀어 sticky 가 화면 기준으로 동작하게 한다. */
  #students .card{overflow:visible!important;}
  /* 출결 3버튼이 잘렸다(0811) — 표가 화면 폭에 맞춰지면서 이 칸부터 줄였다.
     width:1% + nowrap 이면 auto 레이아웃이 '내용만큼'으로 잡고 남는 폭은 글칸이 가져간다. */
  .grid td:nth-child(2),.grid th:nth-child(2){width:1%;white-space:nowrap;}
  .grid .seg{flex-wrap:nowrap;}
  .grid .seg button{white-space:nowrap;}
  .grid thead th{position:sticky;top:52px;z-index:5;box-shadow:0 1px 0 var(--line);}
  tr.stu:hover td{background:#fdfaf8;}
  .toast{bottom:28px;}
  .kbdhint{font-size:11px;color:var(--sub);margin:0 0 8px;}
}
@media(max-width:899px){ .kbdhint{display:none;} }
table.grid{width:100%;border-collapse:collapse;background:#fff;font-size:13px;}
.grid th{font-size:12px;color:var(--sub);font-weight:600;padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;background:#faf7f5;}
.grid td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top;}
tr.stu{border:none;padding:0;margin:0;}
.grid input,.grid textarea{padding:8px;font-size:13px;}
.grid .seg{gap:4px;}
.grid .seg button{flex:none;padding:8px 9px;font-size:12px;}
.grid .items{gap:4px;margin-top:0;}
.grid .items button{flex:none;width:30px;padding:8px 0;font-size:12px;}
.grid textarea{min-height:36px;min-width:180px;}   /* 200이면 최소폭 합이 화면을 4px 넘겼다 */
.grid input[type=date]{height:36px;}
.namecell{white-space:nowrap;}
.grid .savemark{float:none;margin-left:6px;}
/* 적재 화면 — 미리보기는 '무엇이 들어가는지'를 글로 보여준다(표로 안 만든다: 확인용이지 편집용이 아니다) */
.loadout{font-size:13px;line-height:1.55;background:#f9f4f1;border:1px dashed var(--line);border-radius:10px;padding:11px;white-space:pre-wrap;color:var(--ink);margin-top:10px;max-height:340px;overflow:auto;}
.loadout b{color:var(--key-d);}
.loadout .warn{color:#8a4b1f;}
input[type=file]{padding:8px;background:#fff;}
button:disabled{opacity:.45;cursor:default;}
</style>
</head>
<body>

<div id="login">
  <div class="logo">MATHIS <b>수업 콘솔</b></div>
  <div class="card">
    <div id="step1">
      <label class="lbl">이메일</label>
      <input id="email" type="email" autocomplete="email" placeholder="hay0680@gmail.com">
      <button class="key" style="width:100%;margin-top:10px" onclick="sendOtp()">인증 코드 받기</button>
    </div>
    <div id="step2" class="hidden">
      <label class="lbl">메일로 온 인증 코드</label>
      <input id="otp" inputmode="numeric" placeholder="000000">
      <button class="key" style="width:100%;margin-top:10px" onclick="verifyOtp()">로그인</button>
    </div>
    <div class="msg" id="loginmsg"></div>
  </div>
</div>

<div id="app" class="hidden">
<header>
  <h1>MATHIS <b id="viewtitle">오늘</b></h1>
  <span class="pill" id="who"></span>
  <button class="ghost" style="padding:6px 10px;font-size:12px" onclick="logout()">로그아웃</button>
</header>
<main>

  <section id="view-today">
    <div class="card">
      <h2 id="todaylabel">오늘 수업</h2>
      <div id="todayclasses"></div>
    </div>
    <div class="card">
      <h2>시그널 — 최근 2주 (탭하면 추가학습 지정)</h2>
      <div id="signals">불러오는 중…</div>
    </div>
  </section>

  <section id="view-console" class="hidden">
    <div class="card">
      <h2>반 선택</h2>
      <div class="classbtns" id="classbtns"></div>
    </div>
    <div id="consolebody" class="hidden">
      <div class="card">
        <h2>수업 정보 <span class="badge" id="sessionstate"></span></h2>
        <label class="lbl">진도 (엔터로 여러 줄)</label>
        <textarea id="c_progress" rows="2" placeholder="예: OPT:04 도형의 이동 파트2&#10;OPT:05 집합의 뜻 파트1" oninput="autoGrow(this)"></textarea>
        <div class="minirow">
          <div class="grow"><label class="lbl">이번 과제 (엔터로 여러 줄)</label><textarea id="c_hw" rows="2" oninput="autoGrow(this)"></textarea></div>
        </div>
        <div class="minirow">
          <div class="grow"><label class="lbl">테스트 유형</label><select id="c_test"><option value="">— 없음</option><option>리뷰테스트</option><option>기출테스트</option></select></div>
          <div style="flex:0 0 84px"><label class="lbl">문항 수</label><input id="c_nq" inputmode="numeric" value="5" onchange="renderStudents()"></div>
        </div>
        <div class="minirow">
          <div class="grow"><label class="lbl">지난 과제 (직전 수업에서 자동 — 과제검사 기준)</label><div id="c_prevhw" class="prevhw">—</div></div>
        </div>
        <div class="minirow"><button class="ghost" style="flex:1" onclick="allPresent()">전원 출석</button></div>
      </div>
      <div id="students"></div>
      <div class="footbar" style="bottom:auto;position:static;margin-top:14px">
        <button class="ghost" onclick="genComments()">✎ 코멘트 자동 생성 (빈 칸만)</button>
      </div>
      <div class="footbar">
        <button class="key" onclick="closeSession()">[마감] 수업 종료</button>
      </div>
      <div class="footbar" style="bottom:auto;position:static;margin-top:8px">
        <button class="ghost" style="color:var(--bad);border-color:var(--bad)" onclick="resetToday()">오늘 입력 전체 리셋</button>
      </div>
    </div>
  </section>

  <!-- ── 성적 적재 ───────────────────────────────────────────────────
   * 여기 오기 전까지 주간고사·내신 성적은 학원 PC 에서 wkappend.py·내신적재.py 를
   * 돌려야 DB 에 들어갔다. 규칙 작업인데 사람이 붙어 있었다.
   * 브라우저가 xlsx 를 직접 읽고 학생마스터로 조인해 DB 에 바로 쓴다 — Actions 를 안 깨운다.
   * ⚠ 학생ID 는 절대 조합하지 않는다. 마스터에 없으면 미매칭으로 남기고 적재하지 않는다.
   -->
  <section id="view-load" class="hidden">
    <div class="card">
      <h2>주간고사 성적 <span class="badge">성적 xlsx + 분석시트</span></h2>
      <div class="minirow">
        <div style="flex:0 0 88px"><label class="lbl">회차</label><input id="wk_rd" inputmode="numeric" placeholder="4"></div>
        <div style="flex:0 0 110px"><label class="lbl">학년</label><select id="wk_grade"><option>고1</option><option>고2</option></select></div>
        <div class="grow"><label class="lbl">성적 xlsx <span style="opacity:.7">(성적_N주차_고N.xlsx)</span></label><input id="wk_score" type="file" accept=".xlsx,.xlsm"></div>
      </div>
      <div class="minirow">
        <div class="grow"><label class="lbl">분석시트 xlsx <span style="opacity:.7">(주간고사_N회_분석시트.xlsx — 없으면 점수만 적재)</span></label><input id="wk_ana" type="file" accept=".xlsx,.xlsm"></div>
      </div>
      <div class="row" style="margin-top:10px;gap:8px">
        <button class="ghost" onclick="wkPreview()">미리보기</button>
        <button class="key" id="wk_go" disabled onclick="wkCommit()">적재</button>
      </div>
      <div id="wk_out" class="loadout">성적 xlsx 를 고르면 회차·학년을 파일 이름에서 읽고, 무엇이 들어갈지 먼저 보여준다.</div>
    </div>

    <div class="card">
      <h2>내신 성적표 <span class="badge">학교 중간·기말</span></h2>
      <div class="minirow">
        <div class="grow"><label class="lbl">성적표 xlsx <span style="opacity:.7">(강사별 시트)</span></label><input id="sc_file" type="file" accept=".xlsx,.xlsm"></div>
        <div style="flex:0 0 150px"><label class="lbl">시트</label><select id="sc_sheet"></select></div>
        <div style="flex:0 0 100px"><label class="lbl">기준년</label><input id="sc_base" inputmode="numeric" value="2026"></div>
      </div>
      <div class="row" style="margin-top:10px;gap:8px">
        <button class="ghost" onclick="scPreview()">미리보기</button>
        <button class="key" id="sc_go" disabled onclick="scCommit()">적재</button>
      </div>
      <div id="sc_out" class="loadout">시행년 = 기준년 − (현재학년 − 시험학년). 등급·석차·과목평균·수강자수는 손으로 채운 값을 덮지 않는다.</div>
    </div>
  </section>

</main>
<nav>
  <button id="nav-today" class="on" onclick="showView('today')">오늘</button>
  <button id="nav-console" onclick="showView('console')">수업 콘솔</button>
  <button id="nav-load" onclick="showView('load')">성적 적재</button>
  <a class="xlink" href="/dashboard/" title="반·학생 조회 (같은 로그인)">학습현황 ↗</a>
</nav>
</div>
<div class="toast" id="toast"></div>

<script>
const SB_URL='https://bkgerndnwukvuuqdgnxt.supabase.co';
const SB_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJrZ2VybmRud3VrdnV1cWRnbnh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyNjA3MzgsImV4cCI6MjEwMTgzNjczOH0.VcfcTc9QkecKWFPUiYVXKGEXLxmVp8ugfiF6EV5_kjk';
const sb=supabase.createClient(SB_URL,SB_ANON);
const $=id=>document.getElementById(id);
const DAYS=['일','월','화','수','목','금','토'];
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
let ROLE=null, CLS=null, STUDENTS=[], LOGMAP={};

function autoGrow(el){el.style.height='auto';el.style.height=(el.scrollHeight+2)+'px';}
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800);}

/* ── 로그인 ── */
async function sendOtp(){
  const email=$('email').value.trim();
  if(!email)return;
  $('loginmsg').textContent='코드 발송 중…';
  const {error}=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:false}});
  if(error){$('loginmsg').textContent='실패: '+error.message;return;}
  $('step1').classList.add('hidden');$('step2').classList.remove('hidden');
  $('loginmsg').textContent='메일함에서 6자리 코드를 확인하세요.';
}
async function verifyOtp(){
  const email=$('email').value.trim(), token=$('otp').value.trim();
  $('loginmsg').textContent='확인 중…';
  const {error}=await sb.auth.verifyOtp({email,token,type:'email'});
  if(error){$('loginmsg').textContent='실패: '+error.message;return;}
}
async function logout(){await sb.auth.signOut();location.reload();}

sb.auth.onAuthStateChange(async (ev,session)=>{
  if(session){ await boot(session); }
});

/* 초대·매직링크가 실패해 돌아오면 주소 끝에 #error=... 가 붙어 온다.
   그대로 두면 **아무 말 없이 로그인 화면**이 떠서 "링크를 눌렀는데 안 된다"가 된다.
   (0811 조교 계정에서 실제로 겪음 — 초대 토큰은 1회용이라 메일 미리보기·중복 클릭에

async function loadSignals(){
  const since=new Date(Date.now()-14*864e5).toISOString().slice(0,10);
  const {data:logs}=await sb.from('daily_log').select('학생ID,이름,반,날짜,점수,이행률').gte('날짜',since);
  const flags={};
  (logs||[]).forEach(r=>{
    const sc=parseFloat(r['점수']), ih=parseFloat(r['이행률']);
    const why=[];
    if(!isNaN(sc)&&sc<60)why.push(`리뷰 ${sc}점 (${r['날짜'].slice(5)})`);
    if(!isNaN(ih)&&ih<50)why.push(`이행률 ${ih}% (${r['날짜'].slice(5)})`);
    if(why.length){ (flags[r['학생ID']]=flags[r['학생ID']]||{name:r['이름'],cls:r['반'],why:[]}).why.push(...why); }
  });
  const box=$('signals');box.innerHTML='';
  const ids=Object.keys(flags);
  if(!ids.length){box.innerHTML='<div class="time">시그널 없음 — 깨끗합니다.</div>';return;}
  ids.forEach(id=>{
    const f=flags[id];
    const d=document.createElement('div');d.className='signal';
    d.innerHTML=`<div class="row"><div class="grow"><b>${f.name}</b> <span class="school">${f.cls}</span><div class="why">${f.why.slice(0,3).join(' · ')}</div></div><button>추가학습 부르기</button></div>`;
    d.querySelector('button').onclick=async ev=>{
      ev.target.disabled=true;
      const nx=await nextClinic(f.cls);
      const {error}=await sb.from('clinic_roster').insert({'학생ID':id,'이름':f.name,'반':f.cls,'사유':f.why.slice(0,3).join(' · '),'날짜':nx?nx.date:null,'시간':nx?nx.time:null,'상태':'지정','지정일':todayStr(),'기록일':todayStr()});
      if(error){toast('실패: '+error.message);ev.target.disabled=false;}
      else{ev.target.textContent='지정됨 ✓';toast(f.name+' 추가학습 지정');}
    };

  });
}

let PREVHW='', PREVHW_MAP={}, PREVHW_DATE={}, RECENT={}, NOTES={}, NEXT=null;
// 지난 과제가 반 공통과 다른 학생만 이름칸에 한 줄 — 과제검사 기준이 사람마다 다르다는 걸 눈으로 알아야 한다
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function prevHwLine(id){
  const v=(PREVHW_MAP[id]||'').trim();
  if(!v||v===(PREVHW||'').trim())return '';
  const d=(PREVHW_DATE[id]||'').slice(5);
  return `<div class="recent indhw" style="margin-left:0">📌 지난과제(개별${d?' '+d:''}): ${esc(v).replace(/\n/g,' / ')}</div>`;
}
const TTCACHE={};
/* 다음 수업일 + 반별 추가학습 기본 시간 규칙 */
async function nextClinic(cls){
  if(!(cls in TTCACHE)){
    const {data}=await sb.from('timetable').select('요일').eq('반',cls);
    TTCACHE[cls]=new Set((data||[]).map(r=>r['요일']));
  }
  const dows=TTCACHE[cls];
  if(!dows.size)return null;
  for(let i=1;i<=14;i++){
    const d=new Date(Date.now()+i*864e5), dw=DAYS[d.getDay()];
    if(dows.has(dw)){
      const date=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      let time='';
      if(cls==='고1A'||cls==='고1S')time='16-18';
      else if(cls==='고2A')time=dw==='토'?'14-16':'16-18';
      else if(cls==='고1T')time=dw==='토'?'12-15':dw==='일'?'15-18':'';
      return {date,dow:dw,time};
    }
  }
  return null;
}
async function selectClass(cls){
  CLS=cls;
  document.querySelectorAll('#classbtns button').forEach(b=>b.classList.toggle('on',b.dataset.cls===cls));
  $('consolebody').classList.remove('hidden');
  const today=todayStr();
  const since=new Date(Date.now()-30*864e5).toISOString().slice(0,10);
  const [{data:stu},{data:logs},{data:sess},{data:cl},{data:prev},{data:hist}]=await Promise.all([
    sb.from('students').select('*').eq('상태','재원'),
    sb.from('daily_log').select('*').eq('반',cls).eq('날짜',today),
    sb.from('class_sessions').select('*').eq('반',cls).eq('날짜',today),
    sb.from('class_log').select('*').eq('반',cls).eq('날짜',today),
    sb.from('class_log').select('날짜,진도원문,이번과제,테스트유형').eq('반',cls).lt('날짜',today).order('날짜',{ascending:false}).limit(1),
    sb.from('daily_log').select('학생ID,날짜,점수,특이사항,이번과제').eq('반',cls).gte('날짜',since).lt('날짜',today).order('날짜',{ascending:false}),
  ]);
  STUDENTS=(stu||[]).filter(r=>((r['학년']||'')+(r['반']||''))===cls).sort((a,b)=>(a['이름']||'').localeCompare(b['이름']||'','ko'));
  LOGMAP={};(logs||[]).forEach(r=>LOGMAP[r['학생ID']]=r);
  RECENT={};NOTES={};PREVHW_MAP={};PREVHW_DATE={};(hist||[]).forEach(r=>{
    if(r['점수'])(RECENT[r['학생ID']]=RECENT[r['학생ID']]||[]).push(r['점수']);
    if(r['특이사항'])(NOTES[r['학생ID']]=NOTES[r['학생ID']]||[]).push(r['날짜'].slice(5)+' '+r['특이사항']);
    if(r['이번과제']&&!(r['학생ID'] in PREVHW_MAP)){PREVHW_MAP[r['학생ID']]=r['이번과제'];PREVHW_DATE[r['학생ID']]=r['날짜']||'';}
  });
  PREVHW=(prev&&prev[0]&&prev[0]['이번과제'])||'';
  NEXT=await nextClinic(cls);
  $('c_prevhw').textContent=PREVHW||'— (직전 수업 기록 없음)';
  $('sessionstate').textContent=(sess&&sess[0]&&sess[0]['상태']==='closed')?'마감됨':'진행중';
  const setTest=v=>{
    const sel=$('c_test');
    if(v&&![...sel.options].some(o=>o.value===v)){const o=document.createElement('option');o.textContent=v;sel.appendChild(o);}
    sel.value=v||'';
  };
  if(cl&&cl[0]){
    $('c_progress').value=cl[0]['진도원문']||'';$('c_hw').value=cl[0]['이번과제']||'';setTest(cl[0]['테스트유형']);
  }else if(prev&&prev[0]){
    // 오늘 기록이 없으면 직전 수업 값을 제안 기본값으로 (수정해서 쓰기)
    $('c_progress').value=prev[0]['진도원문']||'';
    $('c_hw').value=prev[0]['이번과제']||'';
    setTest(prev[0]['테스트유형']);
  }else{
    $('c_progress').value='';$('c_hw').value='';setTest('');
  }
  autoGrow($('c_progress'));autoGrow($('c_hw'));
  renderStudents();
}

function itemBtnsHtml(log,nq){

  const raw=log['문항점수']||'';
  let itemVals=[];
  if(raw.includes(':')){
    raw.split(';').forEach(p=>{const[a,b]=p.split(':');if(a&&b!==undefined)itemVals[parseInt(a)-1]=b.trim();});
  }else itemVals=raw.split(',').map(v=>v.trim());
  return Array.from({length:nq},(_,i)=>{
    const v=itemVals[i]!==undefined&&itemVals[i]!==''?itemVals[i]:'';

/* 한 반 20명의 같은 항목(점수·이행률…)을 세로로 훑어 넣는 게 실제 입력 동선이다.
   Tab 은 옆으로만 가서 매번 한 줄을 가로질러야 했다. */
function wireGridKeys(t){
  t.addEventListener('keydown',e=>{
    const el=e.target;
    if(!el.matches||!el.matches('input[data-f],textarea[data-f]'))return;
    const ta=el.tagName==='TEXTAREA';
    let dir=0;
    if(e.key==='Enter'&&!ta)dir=e.shiftKey?-1:1;
    else if(e.key==='ArrowDown'&&(!ta||e.ctrlKey))dir=1;
    else if(e.key==='ArrowUp'&&(!ta||e.ctrlKey))dir=-1;
    if(!dir)return;
    const f=el.dataset.f;
    let r=el.closest('tr');
    while((r=dir>0?r.nextElementSibling:r.previousElementSibling)){
      const next=r.querySelector(`[data-f="${f}"]`);
      if(next){e.preventDefault();next.focus();
        if(next.select)next.select();
        next.scrollIntoView({block:'center',behavior:'smooth'});return;}
    }
  });
}

/* 입력 데이터 기반 코멘트 자동 생성 — 손으로 쓴 코멘트는 건드리지 않음 */

    const id=card.dataset.id;
    const ta=card.querySelector('[data-f="코멘트"]');
    if(ta.value.trim())return;
    const att=card.querySelector('.seg button[class*=a]');
    const attV=att?att.dataset.v:null;
    const reason=card.querySelector('[data-f="결석사유"]').value.trim();

      ta.value='금일 '+(reason?reason+' 사유로 ':'')+'결석하여 수업에 참여하지 못했습니다. 보강 일정을 잡아 진행하겠습니다.';
      ta.dispatchEvent(new Event('change'));n++;return;
    }

    const c=clinMap[id];
    if(c)parts.push('수업 전 추가학습으로 등원하여 '+(c['사유']?c['사유'].split('(')[0].trim()+' 보완':'복습')+'을 진행했습니다.');
    if(attV==='지각')parts.push('오늘은 다소 늦게 등원했습니다'+(reason?'('+reason+')':'')+'.');
    const score=parseFloat(card.querySelector('[data-f="점수"]').value);
    if(!isNaN(score)){
      const wrongCnt=[...card.querySelectorAll('.items button')].filter(b=>b.dataset.s==='0').length;
      const partCnt=[...card.querySelectorAll('.items button')].filter(b=>b.dataset.s==='1').length;
      const rec=(RECENT[id]||[]).map(v=>parseFloat(v)).filter(v=>!isNaN(v));
      // 반평균 (오늘 입력된 점수 기준)
      const allScores=[...document.querySelectorAll('.stu [data-f="점수"]')].map(i=>parseFloat(i.value)).filter(v=>!isNaN(v));
      const avg=allScores.length>=2?allScores.reduce((a,b)=>a+b,0)/allScores.length:null;
      let t;
      if(full&&score>=full){
        t='오늘 '+tname+'는 만점입니다. 현재 진도의 개념이 탄탄하게 잡혀 있습니다.';
      }else{
        const miss=[];
        if(wrongCnt)miss.push(wrongCnt+'문항 오답');
        if(partCnt)miss.push(partCnt+'문항 부분감점');
        t='오늘 '+tname+'는 '+(nq?nq+'문항 중 '+(miss.join('·')||'감점')
          :score+'점');
        if(avg!==null){
          if(score>avg+0.5)t+='으로, 반평균보다 좋은 결과입니다.';
          else if(score<avg-0.5)t+='으로, 반평균에 조금 못 미쳤습니다.';
          else t+='으로, 반평균 수준입니다.';
        }else t+='입니다.';
        if(wrongCnt)t+=' 틀린 유형은 복습 자료로 잡아 다음 테스트에서 다시 확인하겠습니다.';
      }
      if(rec.length>=2){
        const ravg=rec.slice(0,3).reduce((a,b)=>a+b,0)/Math.min(rec.length,3);
        if(score>ravg+0.5)t+=' 최근 흐름보다 좋아지고 있습니다.';
        else if(score<ravg-1.5)t+=' 최근 흐름 대비 아쉬워 원인을 점검하겠습니다.';

      parts.push(t);

    if(!isNaN(ih)){

    }

    ta.value=parts.join(' ');

    n++;

/* xlsx 파서는 900KB 다. 적재 화면을 처음 열 때만 받는다. */
let XLSXP=null;
function loadXlsx(){
  if(XLSXP)return XLSXP;
  XLSXP=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    s.onload=()=>res(window.XLSX); s.onerror=()=>rej(new Error('xlsx 로더를 못 받았다'));
    document.head.appendChild(s);
  });
  return XLSXP;
}
async function readWb(input){
  const f=input.files&&input.files[0];
  if(!f)return null;
  const XLSX=await loadXlsx();
  return {wb:XLSX.read(await f.arrayBuffer(),{type:'array'}),name:f.name};
}

/*<<PARSE ─ 이 구간은 _검증/parse_test.mjs 가 그대로 떼어다 node 에서 돌린다.
 * 파이썬 적재기(wkappend.py·내신적재.py)와 같은 답이 나오는지 대조하는 게 목적이라
 * 여기에는 DOM·DB 를 부르는 코드를 두지 않는다. 순수 함수만.                        */
const WK_SUBJ={'고1':'공통수학2','고2':'미적분1'};   // 26여름 학년별 과목 시트
const WK_SRC='주간고사26여름';
const SC_SLOTS=(()=>{const a=[];for(const g of[1,2,3])for(const s of[1,2])for(const e of['중간','기말'])a.push([g,s,e]);return a;})();
const SC_FIRST=5;      // 성적표 점수 첫 칸(F열)

function sheetRows(XLSX,wb,name){
  const ws=wb.Sheets[name];
  if(!ws)throw new Error('시트 없음: '+name+' (있는 시트: '+wb.SheetNames.join(', ')+')');
  return XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null,blankrows:true});
}
/* 파이썬 f'{x:g}' 와 같은 문자열을 만든다. 100.0→'100', 87.5→'87.5' */
function gfmt(x){return String(Number(Number(x).toPrecision(6)));}

/* 분석시트 → {문항번호: [유형, 중단원]}. 유형이 비면 소단원을 쓴다(wkappend 와 동일). */
function parseAnalysis(rows){
  const qt={};
  (rows||[]).slice(1).forEach(r=>{
    if(!r)return;
    const no=r[0];
    if(no===null||no===undefined||!/^\d+$/.test(String(no).trim()))return;
    qt[parseInt(no,10)]=[String(r[7]||r[6]||'').trim(),String(r[5]||'').trim()];
  });
  return qt;
}
/* 성적 시트 → {점수행, 오답행}. 학생ID 조인은 여기서 안 한다(마스터는 DB 에 있다). */
function parseWeekly(rows,qt,rd){
  const hdr=(rows&&rows[0])||[];
  const iSc=hdr.findIndex(h=>String(h===null||h===undefined?'':h).trim()==='최종점수');
  if(iSc<0)throw new Error("'최종점수' 열이 없다 — '성적 현황' 시트가 맞는지 확인");
  const qcols=[];
  hdr.forEach((h,i)=>{const m=/^(\d+)번$/.exec(String(h===null||h===undefined?'':h).trim());if(m)qcols.push([parseInt(m[1],10),i]);});
  const scores=[],wrongs=[],notTaken=[];
  rows.slice(1).forEach(r=>{
    if(!r)return;
    const name=String(r[0]===null||r[0]===undefined?'':r[0]).trim();
    if(!name)return;
    const ban=String(r[1]===null||r[1]===undefined?'':r[1]).trim();
    const typ=String(r[2]===null||r[2]===undefined?'':r[2]);
    // '시험 유형'에 회차 숫자가 들어간 행만 응시 (1회 / 2주차 / 주간고사_3회_분석시트 …)
    if(!typ.replace(/\D/g,'').includes(String(rd))){notTaken.push(name+(ban?'('+ban+')':''));return;}
    const raw=String(r[iSc]===null||r[iSc]===undefined?'':r[iSc]).replace('점','').trim();
    const sc=parseFloat(raw);
    if(isNaN(sc)){notTaken.push(name+(ban?'('+ban+')':'')+' 점수없음');return;}
    scores.push({이름:name,반:ban,점수:gfmt(sc)});
    qcols.forEach(([qno,ci])=>{
      const v=String(r[ci]===null||r[ci]===undefined?'':r[ci]).trim().toUpperCase();
      if(v==='O')return;                       // 응시자의 빈칸 = X (wkappend 와 같은 규칙)
      const t=qt[qno]||['',''];
      if(!t[0])return;                         // 분석시트에 유형이 없는 문항은 오답으로 안 쌓는다
      wrongs.push({이름:name,반:ban,문항:qno+'번',태그:t[0],단원:t[1]});
    });
  });
  return {scores,wrongs,notTaken};
}

/* 내신 성적표 셀 → [점수|null, 상태|null]. '-'·빈칸은 아예 행을 만들지 않는다. */
function scNum(v){
  if(v===null||v===undefined)return [null,null];
  const s=String(v).trim();
  if(!s||s==='-'||s==='—'||s==='–')return [null,null];
  if(s==='?'||s==='??')return [null,'미확보'];
  const n=parseFloat(s);
  if(isNaN(n)||!/^[-+]?[\d.]+$/.test(s))return [null,null];
  return [Math.round(n*10)/10,'확보'];
}
function schoolKey(s){const t=String(s||'').trim();return t.replace(/(고등학교|고)$/,'')||t;}
/* 성적표 시트 → [{반,이름,학교,학년,학기,시험구분,점수,상태}] */
function parseSchool(rows){
  let cls='';const out=[];
  (rows||[]).forEach(r0=>{
    const cells=(r0||[]).map(c=>c===null||c===undefined?'':String(c).trim());
    if(cells.length<SC_FIRST+1)return;
    if(cells[0]==='no'){cls=cells[1];return;}          // 컬럼 머리 — B열이 반 이름
    const name=cells[3],school=cells[4];
    if(!name||!/^\d/.test(cells[0]||''))return;        // 학년 머리·빈 줄
    SC_SLOTS.forEach(([g,se,ex],i)=>{
      const col=SC_FIRST+i;
      if(col>=cells.length)return;
      const [score,state]=scNum(cells[col]);
      if(!state)return;
      out.push({반:cls,이름:name,학교:school,학년:g,학기:se,시험구분:ex,점수:score,상태:state});
    });
  });
  return out;
}
/* 파일 이름에서 회차·학년을 읽는다 — 폴더(2026_N회)를 브라우저는 못 본다 */
function guessWeekly(fname){
  const rd=/(\d+)\s*(?:회|주차)/.exec(fname||''), gr=/고\s*([123])/.exec(fname||'');
  return {rd:rd?rd[1]:'',grade:gr?'고'+gr[1]:''};
}

/* ── 학생마스터 조인 ── 학생ID 는 조합하지 않는다. 마스터에 있는 것만 적재한다. */
/*<<JOIN ─ 여기도 _검증/join_test.mjs 가 그대로 떼어다 쓴다. 순수 함수만.  */
function buildMaster(data){
  const byCls={},byName={},byGrade={},bans={};
  (data||[]).forEach(r=>{
    const rank=r['상태']==='재원'?0:r['상태']==='휴원'?1:2;
    const k=r['이름']+'|'+(r['학년']||'')+(r['반']||'');
    if(!byCls[k]||rank<byCls[k]._r)byCls[k]=Object.assign({_r:rank},r);
    const n=r['이름']+'|'+schoolKey(r['학교']);
    if(!byName[n]||rank<byName[n]._r)byName[n]=Object.assign({_r:rank},r);
    const g=r['이름']+'|'+(r['학년']||'');
    if(!byGrade[g])byGrade[g]=[];
    byGrade[g].push(Object.assign({_r:rank},r));
    (bans[r['학년']]=bans[r['학년']]||new Set()).add(r['반']);
  });
  return {byCls,byName,byGrade,bans,all:data||[]};
}
/* 반이 어긋난 학생을 마스터의 현재 반으로 끌어온다.
   같은 학년에 같은 이름이 둘이면 손대지 않는다(누구인지 모르는 채로 적재하면 그게 사고다). */
function joinByName(M,name,grade){
  const c=(M.byGrade[name+'|'+grade]||[]).slice().sort((a,b)=>a._r-b._r);
  if(!c.length)return null;
  if(c.length>1&&c[0]._r===c[1]._r)return null;
  return c[0];
}
function gradeNum(g){const m=/고\s*(\d)/.exec(String(g||''));return m?parseInt(m[1],10):null;}
/* 성적 시트 한 장 → 적재 대상 + 제외 사유. 화면도 적재도 이 결과 하나만 본다. */
function joinWeekly(M,scores,wrongs,grade){
  const mine=M.bans[grade]||new Set();      // 담당 반 = 마스터에 그 학년으로 있는 반
  const hit=[],miss=[],drift=[],other={};
  scores.forEach(s=>{
    let m=M.byCls[s.이름+'|'+grade+s.반];
    if(!m){
      const alt=joinByName(M,s.이름,grade);  // 반 표류(이지환 T↔A) — 마스터 반이 정본
      if(alt){m=alt;drift.push(s.이름+' '+s.반+'→'+alt['반']);}
    }
    if(m){hit.push({s:Object.assign({},s,{반:m['반']||s.반}),m,원반:s.반});return;}
    if(mine.has(s.반))miss.push(s.이름+'('+grade+s.반+')');
    else other[s.반]=(other[s.반]||0)+1;     // 남의 반 — 원래 우리 DB 대상이 아니다
  });
  // 오답은 시트에 적힌 (이름·반) 그대로 붙인다 — 이름만으로 묶으면 동명이인이 섞인다
  const nameId={};hit.forEach(h=>nameId[h.s.이름+'|'+h.원반]=h);
  const wr=(wrongs||[]).filter(w=>nameId[w.이름+'|'+w.반])
    .map(w=>Object.assign({},w,{반:nameId[w.이름+'|'+w.반].s.반,_k:w.이름+'|'+w.반}));
  return {hit,wrongs:wr,miss,drift,other,nameId};
}
/*JOIN>>*/
let MASTER=null;
async function master(){
  if(MASTER)return MASTER;
  const {data,error}=await sb.from('students').select('학생ID,이름,학년,반,학교,상태');
  if(error)throw new Error('학생마스터 조회 실패: '+error.message);
  MASTER=buildMaster(data);
  return MASTER;
}
function gradeNum(g){const m=/고\s*(\d)/.exec(String(g||''));return m?parseInt(m[1],10):null;}
function chunkInsert(table,rows){
  const jobs=[];
  for(let i=0;i<rows.length;i+=400)jobs.push(rows.slice(i,i+400));
  return jobs.reduce((p,part)=>p.then(async()=>{
    const {error}=await sb.from(table).insert(part);
    if(error)throw new Error(table+' 적재 실패: '+error.message);
  }),Promise.resolve());
}
function out(id,html){$(id).innerHTML=html;}

/* ── 주간고사 ── */
let WK=null;
$('wk_score').addEventListener('change',async e=>{
  const g=guessWeekly((e.target.files[0]||{}).name||'');
  if(g.rd&&!$('wk_rd').value)$('wk_rd').value=g.rd;
  if(g.grade)$('wk_grade').value=g.grade;
});
async function wkPreview(){
  $('wk_go').disabled=true;WK=null;
  try{
    const rd=String(parseInt($('wk_rd').value,10)||'');
    if(!rd)return out('wk_out','<span class="warn">회차를 넣어야 한다.</span>');
    const grade=$('wk_grade').value;
    out('wk_out','읽는 중…');
    const XLSX=await loadXlsx();
    const sc=await readWb($('wk_score'));
    if(!sc)return out('wk_out','<span class="warn">성적 xlsx 를 고를 것.</span>');
    const shName=sc.wb.SheetNames.includes('성적 현황')?'성적 현황':sc.wb.SheetNames[0];
    let qt={},anaMsg='분석시트 없음 — <b>점수만</b> 적재하고 오답은 건너뛴다.';
    const ana=await readWb($('wk_ana'));
    if(ana){
      const want=WK_SUBJ[grade];
      const nm=ana.wb.SheetNames.includes(want)?want:ana.wb.SheetNames[0];
      qt=parseAnalysis(sheetRows(XLSX,ana.wb,nm));
      anaMsg='분석시트 <b>'+nm+'</b> · 유형 '+Object.keys(qt).length+'문항';
    }
    const p=parseWeekly(sheetRows(XLSX,sc.wb,shName),qt,rd);
    const M=await master();
    const {hit,wrongs,miss,drift,other,nameId}=joinWeekly(M,p.scores,p.wrongs,grade);
    WK={rd,grade,hit,wrongs,nameId};
    const others=Object.keys(other).sort().map(b=>b+' '+other[b]).join(' · ');
    out('wk_out',
      '<b>'+grade+' '+rd+'회</b> · 시트 '+shName+' · '+anaMsg+'\n'+
      '응시 '+p.scores.length+'명 중 <b>마스터 조인 '+hit.length+'명</b> · 오답 '+wrongs.length+'행\n'+
      '점수 '+(hit.length?Math.min(...hit.map(h=>+h.s.점수))+'~'+Math.max(...hit.map(h=>+h.s.점수)):'—')+
      ' · 반 '+[...new Set(hit.map(h=>h.s.반))].sort().join('/')+'\n'+
      (drift.length?'· 반 표류 정정(마스터 기준): '+drift.join(', ')+'\n':'')+
      (others?'· 다른 강사 반 '+others+' — 제외\n':'')+
      (miss.length?'<span class="warn">⚠ 담당반인데 마스터에 없다 ('+miss.length+'명) — 적재 제외: '+miss.join(', ')+
        '\n   → 학생마스터에 먼저 넣고 다시 미리보기 (학생ID 는 조합하지 않는다)</span>\n':'')+
      '적재하면 같은 회차·소스('+WK_SRC+')의 <b>그 학생 기존 행을 지우고</b> 새로 넣는다.');
    $('wk_go').disabled=!hit.length;
  }catch(e){out('wk_out','<span class="warn">읽기 실패: '+e.message+'</span>');}
}
async function wkCommit(){
  if(!WK)return;
  $('wk_go').disabled=true;
  try{
    const {rd,grade,hit,wrongs,nameId}=WK;
    const 회차=rd+'회';
    const rows=hit.map(({s,m})=>({'학생ID':m['학생ID'],'이름':s.이름,'학년':grade,'반':s.반,'회차':회차,'점수':s.점수,'소스':WK_SRC}));
    const ids=rows.map(r=>r['학생ID']);
    out('wk_out','적재 중… 점수 '+rows.length+'행');
    // 같은 회차·소스의 그 학생 행을 지우고 다시 넣는다(멱등). 남의 회차는 안 건드린다.
    const {error:d1}=await sb.from('weekly_exam').delete().eq('회차',회차).eq('소스',WK_SRC).in('학생ID',ids);
    if(d1)throw new Error('기존 행 정리 실패: '+d1.message);
    await chunkInsert('weekly_exam',rows);
    let wmsg='';
    if(wrongs.length){
      const wr=wrongs.map(w=>{const m=nameId[w._k].m;return {
        '학생ID':m['학생ID'],'이름':w.이름,'반':w.반,'시험종류':'주간테스트','단원':w.단원,
        '시험명':회차,'날짜':'','문항':w.문항,'틀린유형(태그)':w.태그,'실점구분':'오답','소스':WK_SRC};});
      // ⚠ 키 단위가 아니라 (학생×시험) 단위로 지운다 — O 로 고쳐진 문항의 옛 오답이 남으면 안 된다
      const {error:d2}=await sb.from('wrong_answers').delete()
        .eq('시험종류','주간테스트').eq('시험명',회차).eq('소스',WK_SRC).in('학생ID',ids);
      if(d2)throw new Error('기존 오답 정리 실패: '+d2.message);
      await chunkInsert('wrong_answers',wr);
      wmsg=' · 오답 '+wr.length+'행';
    }
    out('wk_out','<b>적재 완료</b> — '+grade+' '+회차+' 점수 '+rows.length+'행'+wmsg+
      '\n학습현황·주간고사 리포트에 바로 반영된다. 로컬 CSV 는 pull_export.py 로 받는다.');
    toast(grade+' '+회차+' 적재 완료');
    WK=null;
  }catch(e){out('wk_out','<span class="warn">적재 실패: '+e.message+'</span>');$('wk_go').disabled=false;}
}

/* ── 내신 ── */
let SC=null,SC_WB=null;
$('sc_file').addEventListener('change',async()=>{
  $('sc_go').disabled=true;
  try{
    const f=await readWb($('sc_file'));
    const sel=$('sc_sheet');sel.innerHTML='';
    if(!f)return;
    f.wb.SheetNames.forEach(n=>{const o=document.createElement('option');o.textContent=n;sel.appendChild(o);});
    const pref=f.wb.SheetNames.find(n=>/유강/.test(n));
    if(pref)sel.value=pref;
    SC_WB=f.wb;
  }catch(e){out('sc_out','<span class="warn">읽기 실패: '+e.message+'</span>');}
});
async function scPreview(){
  $('sc_go').disabled=true;SC=null;
  try{
    if(!SC_WB)return out('sc_out','<span class="warn">성적표 xlsx 를 고를 것.</span>');
    const XLSX=await loadXlsx();
    const sheet=$('sc_sheet').value;
    const base=parseInt($('sc_base').value,10)||2026;
    const raw=parseSchool(sheetRows(XLSX,SC_WB,sheet));
    const M=await master();
    const hit=[],miss=new Set();
    raw.forEach(r=>{
      const m=M.byName[r.이름+'|'+schoolKey(r.학교)]||M.byCls[r.이름+'|'+(r.반?String(r.반):'')];
      if(!m){miss.add(r.이름+'('+r.학교+'·'+r.반+')');return;}
      const cur=gradeNum(m['학년']);
      hit.push(Object.assign({},r,{m,시행년:cur===null?'':String(base-(cur-r.학년))}));
    });
    const 확보=hit.filter(r=>r.상태==='확보').length;
    const by={};hit.forEach(r=>{const k=r.시행년+'-'+r.학기+'학기 '+r.시험구분;by[k]=(by[k]||0)+1;});
    SC={hit,sheet};
    out('sc_out',
      '시트 <b>'+sheet+'</b> · 기준년 '+base+'\n'+
      '파싱 '+raw.length+'행 → <b>조인 '+hit.length+'행</b> (확보 '+확보+' / 미확보 '+(hit.length-확보)+')\n'+
      Object.keys(by).sort().map(k=>'  · '+k+' — '+by[k]+'명').join('\n')+'\n'+
      (miss.size?'<span class="warn">⚠ 마스터 미등록 '+miss.size+'명 — 적재 제외: '+[...miss].join(', ')+'</span>\n':'')+
      '등급·석차등급·과목평균·수강자수는 <b>기존 값을 유지</b>한다(성적표에 없는 칸).');
    $('sc_go').disabled=!hit.length;
  }catch(e){out('sc_out','<span class="warn">읽기 실패: '+e.message+'</span>');}
}
async function scCommit(){
  if(!SC)return;
  $('sc_go').disabled=true;
  try{
    const today=todayStr(),소스='성적표:'+SC.sheet;
    out('sc_out','적재 중…');
    const {data:ex,error:e0}=await sb.from('school_exam')
      .select('id,학생ID,학년,학기,시험구분,등급,석차등급,과목평균,수강자수');
    if(e0)throw new Error('기존 조회 실패: '+e0.message);
    const key=r=>[r['학생ID'],String(r['학년']),String(r['학기']),r['시험구분']].join('|');
    const old={};(ex||[]).forEach(r=>old[key(r)]=r);
    const rows=SC.hit.map(r=>{
      const o=old[[r.m['학생ID'],String(r.학년),String(r.학기),r.시험구분].join('|')]||{};
      return {'학생ID':r.m['학생ID'],'이름':r.이름,'학교':schoolKey(r.학교),
        '반':r.m['반']||r.반,'학년':String(r.학년),'시행년':r.시행년,'학기':String(r.학기),
        '시험구분':r.시험구분,'점수':r.점수===null?'':String(r.점수),
        '등급':o['등급']||'','석차등급':o['석차등급']||'','과목평균':o['과목평균']||'','수강자수':o['수강자수']||'',
        '상태':r.상태,'소스':소스,'기록일':today};
    });
    const kill=rows.map(r=>key(r)).filter(k=>old[k]).map(k=>old[k].id);
    if(kill.length){
      for(let i=0;i<kill.length;i+=200){
        const {error}=await sb.from('school_exam').delete().in('id',kill.slice(i,i+200));
        if(error)throw new Error('기존 행 정리 실패: '+error.message);
      }
    }
    await chunkInsert('school_exam',rows);
    out('sc_out','<b>적재 완료</b> — '+rows.length+'행 (갱신 '+kill.length+' · 신규 '+(rows.length-kill.length)+')\n'+
      '원점수만으로는 해석하지 않는다 — 시험메타(등급컷·난이도)와 조인해서 본다.');
    toast('내신 '+rows.length+'행 적재 완료');
    SC=null;
  }catch(e){out('sc_out','<span class="warn">적재 실패: '+e.message+'</span>');$('sc_go').disabled=false;}
}

function showView(v){
  Object.keys(VIEWS).forEach(k=>{
    $('view-'+k).classList.toggle('hidden',k!==v);
    $('nav-'+k).classList.toggle('on',k===v);
  });

}
