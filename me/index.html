 *   점수만 크게 띄우고 싶어질 때 이 주석을 다시 읽어라 — 컷 없이 낙폭을 판단하면 사고가 난다.

 */

/* '고림고등학교'·'고림고'·'고림' 을 한 학교로 본다 */
const 학교키 = s => (String(s || '').trim().replace(/(고등학교|고)$/, '') || String(s || '').trim());
const mi = (m, k) => { const v = m ? m[k] : null; return v === '' || v == null ? null : parseInt(v, 10); };

/* 성적 한 줄(r)에 맞는 시험메타를 찾는다. 학교·학년·시행년·학기·시험구분이 다 맞아야 한다 */
function metaFindIn(metas, r) {
  const y = parseInt(r['시행년'], 10), gr = parseInt(r['학년'], 10), sm = parseInt(r['학기'], 10);
  return (metas || []).find(m => 학교키(m['학교']) === 학교키(r['학교'])
    && mi(m, '학년') === gr && mi(m, '시행년') === y && mi(m, '학기') === sm
    && (m['시험구분'] || '') === (r['시험구분'] || '')) || null;
}

function metaGrade(score, m) {          // 시험메타조회.grade 이식
  if (!m || score == null) return null;
  const s = Number(score);
  if (!isFinite(s)) return null;
  for (const g of [1, 2, 3, 4]) { const c = mi(m, '등급컷' + g); if (c != null && s >= c) return g; }
  return mi(m, '등급컷5하한') != null ? 5 : null;
}
function metaRead(score, m) {           // 시험메타조회.해석 이식
  if (!m) return '시험 정보 없음 — 원점수만으로는 판단 불가';
  const g = metaGrade(score, m), nan = m['전체난이도'] || '?', c1 = mi(m, '등급컷1');
  if (g == null) return `등급컷 미확보 (난이도 ${nan})`;
  return `${g}등급권 (${c1 != null ? '1등급컷 ' + c1 : '컷 미확보'} · 난이도 ${nan} · 예상)`;
}
const gradeCls = g => g == null ? 'na' : (g <= 1 ? 'good' : g <= 3 ? 'mid' : 'bad');

/* ── portal_render.js (0908, v27 0916) — 포털·대시보드 학생 탭 공용 렌더러 ──────────────

 */
const PR = (() => {
  const E = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#x27;');
  const DOW = ['일', '월', '화', '수', '목', '금', '토'];
  const dfmt = s => { const m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})/); if (!m) return E(s); const [y, mo, d] = m.slice(1).map(Number); return `${mo}월 ${d}일(${DOW[new Date(y, mo - 1, d).getDay()]})`; };
  const paper = p => { const m = String(p || '').match(/^(.+?)_(고\d)_(\d{4})_(\d)_(중간|기말)$/); return m ? `${m[1]} ${m[3].slice(2)}년 ${m[4]}학기 ${m[5]}` : String(p || ''); };

/* (v27) 문항평가 3지점 — 궤적 한 줄과 '요즘 나' 카드 */
.pr .tr{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:7px;font-size:12.5px;color:var(--tx2)}

.pr .me .sub{color:var(--dim);font-size:12px;margin-top:3px;line-height:1.55}
@media (hover:hover) and (pointer:fine){.pr .rp a:hover{border-color:var(--acc)} .pr .q:hover{outline:1px solid var(--bd)}}
`;

  /* 점수 추이 — 숫자를 그대로 얹어 그래프만 보고 오해하지 않게 한다 */
  function spark(rounds) {
    const pts = rounds.filter(r => num(r.점수) != null);
    if (pts.length < 2) return '';
    const w = 320, h = 84, pad = 28, n = pts.length;
    const xs = pts.map((_, i) => pad + (w - 2 * pad) * i / (n - 1));
    const ys = pts.map(r => 66 - 44 * Math.max(0, Math.min(100, num(r.점수))) / 100);
    const path = xs.map((x, i) => `${i ? 'L' : 'M'}${x.toFixed(1)},${ys[i].toFixed(1)}`).join(' ');
    return `<svg class="spark" viewBox="0 0 ${w} ${h}" role="img" aria-label="기출테스트 점수 추이">`
      + `<path d="${path}" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linejoin="round"/>`
      + pts.map((r, i) => `<circle cx="${xs[i].toFixed(1)}" cy="${ys[i].toFixed(1)}" r="${i === n - 1 ? 4 : 3}" fill="var(--acc)"/>`
        + `<text x="${xs[i].toFixed(1)}" y="${(ys[i] - 9).toFixed(1)}" fill="var(--tx2)" font-size="11" text-anchor="middle">${fmt(num(r.점수))}</text>`
        + `<text x="${xs[i].toFixed(1)}" y="${h - 4}" fill="var(--dim)" font-size="10" text-anchor="middle">${E(school(r.시험ID))}</text>`).join('')
      + '</svg>';
  }

  /* 등급 범위 — DB 가 준 [좋은,나쁜]. 한 칸으로 붙으면 z 가 가까운 쪽 경계의 이웃 등급까지 넓힌다(늘 "2~3" 꼴, 0908 유강) */
  function widen(gr, z, model) {
    if (!gr || z == null || !model || !(model.경계 || []).length) return gr;
    if (gr[0] !== gr[1]) return gr;
    const near = model.경계.slice().sort((a, b) => Math.abs(z - a.z) - Math.abs(z - b.z))[0];
    return near.나쁜 === gr[0] ? [near.좋은, gr[0]] : near.좋은 === gr[0] ? [gr[0], near.나쁜] : gr;
  }
  /* 다음 등급까지 — 객관 지표. z 차이 × 풀 편차 = 점수, ÷ 문항당 배점 = 문제 수
     ⚠ v25 부터 z 는 주간고사 척도로 보정된 값이다(z_cal = m + s·z_기출). 기출 원점수로
     되돌리려면 s 로 나눠야 한다 — 안 나누면 고2(s≈0.29)에서 필요 점수가 1/3로 찍힌다. */
  function nextStep(g) {
    const F = g.흐름 || {}, gr = F.등급, M = g.모델, R = g.회차 || [];
    if (!gr || F.현재z == null || !M || !(M.경계 || []).length) return null;
    const last4 = R.slice(-4);
    const sd = last4.map(r => num(r.풀편차)).filter(v => v != null);
    const s = num((M.척도 || {}).s) || 1;
    const sdv = sd.length ? (sd.reduce((a, b) => a + b, 0) / sd.length) / s : null;
    const last = R[R.length - 1] || {};
    const per = last.문항 && last.문항.length && num(last.총점) ? num(last.총점) / last.문항.length : 4.5;
    if (!sdv) return null;
    const band = num(M.폭) || 0.25;
    if (gr[0] === 1 && gr[1] > 1) {                 // 1~2 걸침 → 1등급으로 굳히기
      const bb = M.경계.find(x => x.좋은 === 1);
      if (!bb) return null;
      const pts = ((bb.z + band) - num(F.현재z)) * sdv;
      return { kind: 'fix', target: 1, pts: Math.max(1, Math.round(pts)), q: Math.max(1, Math.ceil(pts / per)) };
    }
    const target = gr[0] - 1;                       // 지금 범위의 좋은 쪽보다 한 등급 위
    const b = M.경계.find(x => x.나쁜 === gr[0] && x.좋은 === target);
    if (!b) {                                       // 이미 1등급 흐름 — 여유 폭
      const bb = M.경계.find(x => x.좋은 === gr[0]);
      if (!bb) return null;
      const pts = (num(F.현재z) - (bb.z + band)) * sdv;
      return pts >= 0 ? { kind: 'keep', pts: Math.round(pts), q: Math.max(0, Math.floor(pts / per)) } : null;
    }
    const pts = ((b.z + band) - num(F.현재z)) * sdv;
    return { kind: 'up', target, pts: Math.max(1, Math.round(pts)), q: Math.max(1, Math.ceil(pts / per)) };
  }

  /* 흐름 카드 — 첫 화면. 지금 실력 추정 + 다음 등급까지 객관 지표 (지난 내신은 적지 않는다, 0908 유강) */
  function flowCard(g, staff) {
    const R = g.회차 || [], F = g.흐름 || {}, an = F.앵커;
    const gr = widen(F.등급, num(F.현재z), g.모델);
    const zs = R.map(r => num(r.z)).filter(v => v != null);
    const why = [];
    const step = nextStep(g);
    if (step && step.kind === 'up') why.push(`<b>${step.target}등급</b>까지: 회차마다 지금보다 <b>${step.q}문제(약 ${step.pts}점) 더</b> 맞히기`);
    if (step && step.kind === 'fix') why.push(`<b>1등급</b>으로 굳히기: 회차마다 지금보다 <b>${step.q}문제(약 ${step.pts}점) 더</b> 맞히기`);
    if (step && step.kind === 'keep') why.push(`1등급 흐름 유지 중 — 회차당 <b>${step.q}문제(약 ${step.pts}점)</b> 여유`);
    if (zs.length >= 3) {
      const a = zs.slice(0, Math.ceil(zs.length / 2)), b = zs.slice(-Math.floor(zs.length / 2));
      const d = b.reduce((s, x) => s + x, 0) / b.length - a.reduce((s, x) => s + x, 0) / a.length;
      why.push(d > 0.25 ? '최근 회차가 앞선 회차보다 <b class="good">올라가는 흐름</b>이에요'
        : d < -0.25 ? '최근 회차가 앞선 회차보다 <b class="bad">내려가는 흐름</b>이에요' : '최근 회차가 앞선 회차와 <b>비슷한 흐름</b>이에요');
    }
    const last = R[R.length - 1];
    /* (v27) 관찰만 — 예전엔 "개념부터 다시 봐야 해요" 로 단정했는데, 되짚기 원인을 보니 '확실했는데 오답'
       39건 중 20건을 학생 본인이 '계산'이라 답했다(0916). 이유는 아래 '요즘 나'·문항 궤적이 말한다. */
    if (last && num(last.확신오답수) > 0) why.push(`최근 시험에서 <b>확실하다고 했는데 틀린 문항이 ${last.확신오답수}개</b> 있었어요`);
    const band = [1, 2, 3, 4, 5].map(k => `<div class="${gr && k >= gr[0] && k <= gr[1] ? 'on' : ''}">${k}</div>`).join('');
    const head = gr
      ? `<div class="line"><span class="from">지금 실력은</span><b>${gradeTxt(gr)}</b><span class="dim">으로 예상돼요 · 추정</span></div><div class="band">${band}</div>`
      : `<div class="line"><b style="font-size:20px">${R.length ? '추정 등급 준비 중' : '아직 기록이 없어요'}</b></div>`
        + `<div class="dim">${R.length ? '회차가 더 쌓이면 지금 흐름의 등급이 나와요' : '기출테스트를 보면 여기에 흐름이 쌓여요'}</div>`;
    const staffLine = staff ? `<div class="staff">z 현재 ${F.현재z ?? '—'} · 회차 z ${zs.map(v => v.toFixed(2)).join(' / ') || '—'}`
      + (an ? ` · 앵커 ${E(an.시험)} ${an.등급}등급(${an.출처})` : ' · 앵커 없음') + (F.등급 ? ` · DB범위 ${F.등급.join('~')}` : '')
      + ` · 모델 ${g.모델 ? `${g.모델.학년} 쌍 ${g.모델.쌍}/풀 ${g.모델.풀} 경계 ${(g.모델.경계 || []).map(b => `${b.좋은}|${b.나쁜}@${b.z}`).join(' ')}${g.모델.유효 ? '' : ' (무효)'}` : '—'}</div>` : '';
    return `<div class="card flow"><div class="h">기출테스트 흐름${R.length ? ` · ${R.length}회` : ''}</div>${head}`
      + (why.length ? `<ul class="why">${why.map(w => `<li>${w}</li>`).join('')}</ul>` : '')
      + spark(R)
      + (gr ? '<div class="note">등급은 학교 컷이 아니라, 같은 학년 친구들의 지난 내신 결과와 기출 점수를 맞대어 본 추정이에요. 시험지 난이도에 따라 한 칸은 흔들릴 수 있어요.</div>' : '')
      + staffLine + '</div>';
  }

  /* ── (v27) 문항평가 3지점 ─────────────────────────────────────────────────
   * ① 자평 확신(시험 직후·강의 전) → ② 루프 되짚기 상태·원인(강의 들은 뒤) → ③ 다음 자평 재확신(N일 뒤)
   * 원칙(0916 유강): **관찰만 적는다.** '과신형'·'신중형' 같은 성향 이름은 붙이지 않는다 — 숫자와 사실만.
   * 표본이 얇은 축은 학생 화면에서 숨긴다(DB 가 축마다 '충분' 을 준다). staff 는 n 과 함께 늘 본다.
   */
  function traceMap(g) {
    const m = {};
    (((g || {}).궤적 || {}).문항 || []).forEach(t => { m[`${t.날짜}|${t.라벨}`] = t; });
    return m;
  }
  /* 문항 한 줄 — 두 지점 이상 찍힌 문항만 그린다(자평 하나뿐이면 기존 '자기평가' 칸으로 충분) */
  function traceLine(it, t) {
    const st = [];
    if (it.확신) st.push(`<span class="s"><i>시험 직후</i>${E(it.확신)}</span>`);
    if (t && t.되짚기) st.push(`<span class="s"><i>강의 후</i>${E(t.되짚기)}${t.원인 ? ` <em>· ${E(t.원인)}</em>` : ''}</span>`);
    if (t && t.재확신) st.push(`<span class="s"><i>${t.경과 != null ? `${t.경과}일 뒤` : '나중에'}</i>${E(t.재확신)}</span>`);
    return st.length < 2 ? '' : `<div class="tr">${st.join('<span class="ar">→</span>')}</div>`;
  }

  /* '요즘 나' 카드 — 점수로는 안 보이는 것만 적는다 */
  function selfCard(g, staff) {
    const T = g.궤적;
    if (!T) return '';
    const Z = T.자기인지 || {}, S = T.정착 || {}, R = T.회복 || {}, C = T.원인 || {};
    const rows = [];
    if (Z.충분 && num(Z.확실)) {
      const ok = num(Z.확실) - num(Z.확실오답);
      rows.push(`<div class="row"><span><b>확실하다고 고른 문항</b>`
        + `<div class="sub">${Z.확실}개 중 <b>${ok}개</b>를 맞혔어요.`
        + (num(Z.찍음) ? ` 잘 모르겠다고 한 ${Z.찍음}개 중에는 ${num(Z.찍맞) || 0}개가 맞았고요.` : '')
        + `</div></span><span class="n"><b>${Math.round(100 * ok / num(Z.확실))}%</b></span></div>`);
    }
    if (S.충분) {
      const bits = [];
      if (num(S.개선)) bits.push(`<b class="good">${S.개선}개</b>는 이제 확실해졌어요`);
      if (num(S.아직)) bits.push(`${S.아직}개는 아직 확실하지 않고요`);
      if (num(S.고착)) bits.push(`<b>${S.고착}개</b>는 그때도 지금도 확실하다고 느끼는데, 답은 틀렸던 문항이에요`);
      rows.push(`<div class="row"><span><b>틀린 문항을 며칠 뒤 다시 봤을 때</b>`
        + `<div class="sub">${bits.join(' · ')}.</div></span>`
        + `<span class="n"><b>${num(S.개선) || 0}</b><span class="dim">/${S.n}</span></span></div>`);
    }
    if (R.충분) {
      rows.push(`<div class="row"><span><b>수업을 들은 뒤</b>`
        + `<div class="sub">'이제 혼자 풀 수 있다'고 한 문항이 ${R.n}개 중 ${R.혼자가능}개였어요.</div></span>`
        + `<span class="n"><b>${Math.round(100 * num(R.혼자가능) / num(R.n))}%</b></span></div>`);
    }
    if (C.충분) {
      const ks = ['개념', '적용', '계산', '독해', '시간'].filter(k => num(C[k]));
      ks.sort((a, b) => num(C[b]) - num(C[a]));
      rows.push(`<div class="row"><span><b>틀린 이유로 고른 것</b>`
        + `<div style="margin-top:4px">${ks.map((k, i) => `<span class="chip${i === 0 ? ' b1' : ''}">${k} ${C[k]}</span>`).join('')}</div>`
        + `</span></div>`);
    }
    const st = staff ? `<div class="staff">자기인지 n ${Z.n ?? '—'}${Z.충분 ? '' : ' (얇음)'} · 확실 ${Z.확실 ?? '—'}(오답 ${Z.확실오답 ?? '—'}) · 찍음 ${Z.찍음 ?? '—'}(맞 ${Z.찍맞 ?? '—'})`
      + `<br>정착 n ${S.n ?? '—'}${S.충분 ? '' : ' (얇음)'} · 개선 ${S.개선 ?? '—'} · 고착 ${S.고착 ?? '—'} · 아직 ${S.아직 ?? '—'}`
      + `<br>회복 n ${R.n ?? '—'}${R.충분 ? '' : ' (얇음)'} · 혼자가능 ${R.혼자가능 ?? '—'} · 이해만 ${R.이해만 ?? '—'} · 모름 ${R.모름 ?? '—'}`
      + (num(R.미다룸) || num(R.미수강) ? ` · 미다룸 ${R.미다룸} · 미수강 ${R.미수강}` : '')
      + `<br>원인 n ${C.n ?? '—'}${C.충분 ? '' : ' (얇음)'} · ${['개념', '적용', '계산', '독해', '시간'].map(k => `${k} ${C[k] ?? '—'}`).join(' · ')}`
      + ((S.목록 || []).length ? `<br>고착 문항 — ${S.목록.map(x => `${dfmt(x.날짜)} ${E(x.라벨)}번${x.유형 ? `(${E(x.유형)})` : ''}${x.경과 != null ? ` +${x.경과}일` : ''}`).join(' · ')}` : '')
      + '</div>' : '';
    if (!rows.length && !st) return '';
    return '<h2>요즘 나<small>문항마다 남긴 자기평가</small></h2><div class="card me">'
      + (rows.join('') || '<div class="none">아직 모으는 중이에요</div>') + st + '</div>';
  }

  function topicCard(g) {
    const T = g.주제 || [];
    if (!T.length) return '';
    return '<h2>자주 틀리는 단원<small>기출테스트 누적</small></h2><div class="card">'
      + T.map((t, i) => `<div class="row"><span><span class="chip b${Math.max(1, 3 - i)}">${E(t.단원)} · ${t.횟수}/${t.문항수}문항</span>`
        + `<div class="dim" style="margin-top:3px">${(t.예시 || []).map(E).join(' · ')}</div></span></div>`).join('')
      + '</div>';
  }

  /* 회차 카드 — ‹ › 로 회차 이동, 칸을 누르면 그 문항 */
  function roundCard(g, idx, sel, staff) {
    const R = g.회차 || [];
    if (!R.length) return '';
    const r = R[idx], items = r.문항 || [];
    const cell = it => {
      const v = num(it.정오), cls = v == null ? '' : v >= 1 ? 'o' : v > 0 ? 'h' : 'x';
      const sure = v != null && v < 1 && it.확신 === '확실';
      return `<button type="button" class="q ${cls}${sure ? ' sure' : ''}${sel === it.라벨 ? ' sel' : ''}" data-pr-q="${E(it.라벨)}">${E(it.라벨)}</button>`;
    };
    const it = items.find(x => x.라벨 === sel);
    /* (v27) 이 문항에 3지점이 얼마나 찍혔나 — 있으면 판정 문장 대신 궤적을 보여준다 */
    const tr = it ? traceMap(g)[`${r.날짜}|${it.라벨}`] : null;
    const line = it ? traceLine(it, tr) : '';
    const det = it ? `<div class="det"><b>${E(it.라벨)}번${it.배점 != null ? ` · ${fmt(num(it.배점))}점` : ''}${it.유형 ? ` · ${E(it.유형)}` : ''}</b>`
      + `<div class="r">${it.내답 != null ? `<span>내 답</span>${E(it.내답)}` : ''}${it.정답 && it.정답 !== 'M' ? `<span>정답</span>${E(it.정답)}` : ''}`
      + `${it.확신 && !line ? `<span>자기평가</span>${E(it.확신)}` : ''}${it.단원 ? `<span>단원</span>${E(it.단원)}` : ''}</div>`
      + line
      + (!line && num(it.정오) != null && num(it.정오) < 1 && it.확신 === '확실' ? '<div class="r dim">시험 직후엔 확실하다고 골랐던 문항이에요</div>' : '') + '</div>' : '';
    const grade = r.등급 ? ` · 이 회차 추정 ${gradeTxt(widen(r.등급, num(r.z), g.모델))}` : '';
    return `<h2>회차별 시험<small>${dfmt(r.날짜)}</small></h2><div class="card">`

/* 주간고사 추이 — 선 하나. 숫자를 그대로 얹어 그래프만 보고 오해하지 않게 한다 */
function spark(pts,w=280,h=64){
  if(!pts.length) return '';
  const pad=16,lo=0,hi=100,n=pts.length;
  const xs=pts.map((_,i)=>pad+(w-2*pad)*(n>1?i/(n-1):0.5));
  const ys=pts.map(p=>h-14-(h-26)*(Math.max(lo,Math.min(hi,p[1]))-lo)/(hi-lo));
  const path=pts.map((_,i)=>`${i?'L':'M'}${xs[i].toFixed(1)},${ys[i].toFixed(1)}`).join(' ');
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="주간고사 추이">`
    +`<path d="${path}" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linejoin="round"/>`
    +pts.map((p,i)=>`<circle cx="${xs[i].toFixed(1)}" cy="${ys[i].toFixed(1)}" r="${i===n-1?4:3}" fill="var(--acc)"/>`
      +`<text x="${xs[i].toFixed(1)}" y="${(ys[i]-9).toFixed(1)}" fill="var(--tx2)" font-size="11" text-anchor="middle">${p[1]}</text>`
      +`<text x="${xs[i].toFixed(1)}" y="${h-2}" fill="var(--dim)" font-size="10" text-anchor="middle">${E(p[0])}</text>`).join('')
    +`</svg>`;
}

  try{ if(d.기출===undefined) $('pr-host').innerHTML='<div class="none">기출테스트 기록 화면을 준비하고 있습니다.</div>'; else PR.mount($('pr-host'), d, {staff:false}); }
  catch(e){ $('pr-host').innerHTML='<div class="none">기출테스트 기록을 그리지 못했습니다. 잠시 뒤 다시 열어 주세요.</div>'; }
  $('msg').style.display='none'; $('app').style.display='';
  document.title=`${d.학생.이름} · 수학은유강`;
}

/* ── 수업 자료 (0927) ──
 * lib.json = { 영상:[{id,제목,반:[..],종류,날짜,단원,길이}], 기출:[{키,학교,학년,과목,종류,시행:[{반,날짜}],시험,해설}] }
 * 영상은 youtu.be 링크(일부공개), PDF 는 mathis-lib 저장소(GitHub Pages). 둘 다 새 탭. */
const LIB_URL='https://ukan8.github.io/mathis-lib/';
const LIB={data:null,showN:15};   // (0928) 탭·검색·전체 보기 제거 — 내 반 것만
const mmss=s=>{s=Number(s)||0; return s>=3600?`${Math.floor(s/3600)}시간 ${Math.round(s%3600/60)}분`:`${Math.round(s/60)}분`;};
const md=s=>{const m=String(s||'').match(/(\d{4})-(\d{2})-(\d{2})/); return m?`${+m[2]}/${+m[3]}`:'';};
async function mountLib(host,ban,school){
  if(!host) return;
  LIB.ban=ban; LIB.school=school||'';
  try{
    const r=await fetch(LIB_URL+'lib.json?v='+Math.floor(Date.now()/6e5),{cache:'no-store'});
    if(!r.ok) throw new Error(r.status);
    LIB.data=await r.json();
  }catch(e){ host.innerHTML='<div class="none">자료 목록을 지금은 못 불러왔어요. 잠시 뒤 다시 열어 주세요.</div>'; return; }
  drawLib(host);
}
// (0928) 탭 없이 내 반 수업일 순 한 줄 목록: 날짜 · 수업 내용 · 시험지/손풀이/영상
function drawLib(host){
  const D=LIB.data, ban=LIB.ban;
  if(!ban){ host.innerHTML='<div class="none">반 정보가 없어 자료를 보여 줄 수 없어요.</div>'; return; }
  const rows=[];
  (D.기출||[]).forEach(g=>{
    const my=(g.시행||[]).filter(x=>x.반===ban).map(x=>x.날짜);
    const vs=(g.영상||[]).filter(v=>(v.반||[]).includes(ban));
    if(!my.length&&!vs.length) return;
    const d=(my.length?my:vs.map(v=>v.날짜)).slice().sort();
    rows.push({d:d[d.length-1],ds:d.filter((x,i,a)=>a.indexOf(x)===i),t:`${g.학교} ${g.학년} ${g.종류}`,sub:g.과목,g,vs});
  });
  rows.sort((a,b)=>String(b.d).localeCompare(String(a.d)));
  const H=[];
  // (1010) 학교프린트 해부 루프 — 수업 자료 목록이 아니라 맨 위 카드(#hb-card)로. 내 학교·학년 것만.
  const sc=LIB.school.replace(/고$/,''), gr=ban.slice(0,2);
  const hb=(D.학습||[]).filter(x=>sc&&x.학교&&sc.startsWith(x.학교)&&(!x.학년||x.학년===gr));
  const hc=$('hb-card');
  if(hc&&hb.length){
    const tk=new URLSearchParams(location.search).get('t')||'', tq=tk?'?t='+encodeURIComponent(tk):'';
    hc.innerHTML=`<div class="row"><span class="t"><b>${E(hb[0].학교명)} 프린트 해부 루프</b><span class="dim"> 단원을 골라 바로 시작</span></span></div>`
      +`<div id="hb-list" style="margin-top:8px">`
      +hb.map(x=>`<div class="grow"><div class="h"><b>${E(x.단원)}</b><span>${E(String(x.문항))}문항</span></div>`
        +`<div class="rp"><a href="${LIB_URL+x.원본판+tq}" target="_blank" rel="noopener">원본판</a>`
        +`<a href="${LIB_URL+x.변형판+tq}" target="_blank" rel="noopener">원본+변형판</a></div></div>`).join('')
      +`<div class="note">변형 문제를 아직 안 풀었으면 <b>원본판</b>, 변형까지 풀었으면 <b>원본+변형판</b>. 푼 기록은 선생님께 전달돼요.</div></div>`;
    hc.style.display='';
  }
  if(!rows.length) H.push(`<div class="none">아직 ${E(ban)} 수업 자료가 없어요.</div>`);
  else{
    const n=Math.min(rows.length,LIB.showN);
    H.push(rows.slice(0,n).map(r=>{
      const vbtn=r.vs.map(v=>`<a class="vid" href="https://youtu.be/${encodeURIComponent(v.id)}" target="_blank" rel="noopener">▶ 수업 영상${r.vs.length>1?' <small>'+E(md(v.날짜))+'</small>':''}</a>`).join('');
      return `<div class="grow"><div class="h"><b><span class="ld">${E(r.ds.map(md).join('·'))}</span>${E(r.t)}</b><span>${E(r.sub||'')}</span></div>`
        +`<div class="rp"><a class="${r.g.시험?'':'no'}" href="${r.g.시험?LIB_URL+r.g.시험:'#'}" target="_blank" rel="noopener">시험지 PDF</a>`
        +`<a class="${r.g.해설?'':'no'}" href="${r.g.해설?LIB_URL+r.g.해설:'#'}" target="_blank" rel="noopener">손풀이 해설 PDF</a>${vbtn}</div></div>`;}).join(''));
    if(rows.length>n) H.push(`<button type="button" class="lib-more">더 보기 (${rows.length-n}개 남음)</button>`);
  }
  H.push(`<div class="note">${E(ban)} 수업에서 본 기출테스트만 올라옵니다. 영상은 유튜브 '일부공개'라 이 링크로만 열립니다 — 공유하지 마세요.</div>`);
  host.innerHTML=H.join('');
  const m=host.querySelector('.lib-more'); if(m) m.onclick=()=>{LIB.showN+=20; drawLib(host);};
}

/* ── 오류 신고 (0913) ── */
function drawReports(list){
  const box=$('rpt-list'); if(!box) return;
  if(!Array.isArray(list)||!list.length){ box.innerHTML=''; return; }
  const ST={'접수':'접수됨 · 밤에 확인','처리완료':'처리 완료','확인중':'확인 중','해당없음':'이상 없음'};
  box.innerHTML=`<div class="dim" style="margin-top:14px;font-size:11.5px;letter-spacing:.07em">내 신고</div>`
    +list.map(r=>`<div class="rpt-item"><div class="hd"><span>${E(r.날짜)} · ${E(r.자료종류)}${r.자료식별?' · '+E(r.자료식별):''}${r.문항번호?' · '+E(r.문항번호):''}</span>`
      +`<span class="st s${E(r.상태)}">${E(ST[r.상태]||r.상태)}</span></div>`
      +`<div class="bd">${E(r.내용)}</div>`
      +(r.처리메모?`<div class="re">${E(r.처리메모)}${r.처리일?` <span class="dim">(${E(r.처리일)})</span>`:''}</div>`:'')
      +`</div>`).join('');
}
function wireReport(tok){
  const form=$('rpt-form'), msg=$('rpt-msg'); if(!form) return;
  $('rpt-open').onclick=()=>{ form.classList.toggle('open'); if(form.classList.contains('open')) form.querySelector('textarea').focus(); };
  $('rpt-cancel').onclick=()=>{ form.classList.remove('open'); msg.textContent=''; };
  form.onsubmit=async ev=>{
    ev.preventDefault();
    const fd=new FormData(form), p={};
    for(const [k,v] of fd.entries()) p[k]=String(v).trim();
    if(p.내용.length<2){ msg.className='bad'; msg.textContent='무엇이 이상한지 적어 주세요.'; return; }
    p.페이지url=location.href.replace(/([?&]t=)[^&]*/,'$1…');   // 토큰은 남기지 않는다
    const go=$('rpt-go'); go.disabled=true; msg.className='dim'; msg.textContent='보내는 중…';
    try{
      const {data,error}=await sb.rpc('portal_report',{tok,p});
      if(error) throw error;
      if(data&&data.오류){ msg.className='bad'; msg.textContent=data.오류; go.disabled=false; return; }
      form.reset(); form.classList.remove('open'); msg.textContent='';
      drawReports(data);
      const box=$('rpt-list'); if(box) box.insertAdjacentHTML('afterbegin',`<div class="good" style="font-size:13px;margin-top:10px">접수됐어요. 밤에 확인하고 결과를 여기에 적어 둘게요.</div>`);
    }catch(e){ msg.className='bad'; msg.textContent='지금은 보낼 수 없어요. 잠시 뒤 다시 시도해 주세요.'; }
    go.disabled=false;
  };
  // 내 신고 목록 — 함수가 아직 없으면(DB 미적용) 조용히 넘어간다
  sb.rpc('portal_report',{tok,p:null}).then(r=>{ if(r&&Array.isArray(r.data)) drawReports(r.data); }).catch(()=>{});
}

(async()=>{
  const tok=new URLSearchParams(location.search).get('t');
  if(!tok) return say('링크가 올바르지 않습니다.','받으신 문자·카톡의 주소를 그대로 열어 주세요.');
  let data,err;
  try{ ({data,error:err}=await sb.rpc('portal_view',{tok})); }
  catch(e){ err=e; }
  if(err) return say('지금은 열 수 없습니다.','잠시 뒤 다시 열어 주세요. 계속 같으면 원장에게 알려 주세요.');
  if(!data) return say('만료되었거나 잘못된 링크입니다.','새 링크가 필요하면 원장에게 말씀해 주세요.');
  // (0902) 오늘 기출 자기평가가 열려 있나 — 실패해도 포털은 그냥 뜬다. (학부모 토큰은 0902 폐기 → 분기 없음, 0906)
  try{ const r=await sb.rpc('gt_eval_open',{tok}); if(r&&r.data&&(r.data.문항||r.data.없음)){ data.자평=r.data; data.토큰=tok; } }catch(e){}
  render(data);
})();
