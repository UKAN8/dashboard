<style>
:root{color-scheme:dark;
 --bg:#0a0a0f; --card:rgba(255,255,255,.03); --bd:rgba(255,255,255,.07);

<body>
<div id="msg"><div class="logo">수학은유강</div><div class="dim">불러오는 중…</div></div>
<main id="app" style="display:none"></main>
<script>
/* 시험 점수를 해석하는 규칙 — 대시보드(app.js)와 학생 포털(portal)이 같이 쓴다.
 *
 * ⚠ **단일 진실원은 `01_운영/시험DB/시험메타조회.py`** 다. 이 파일은 그 이식본이고,
 *   규칙(컷 비교 순서·5등급 하한·학교키 정규화)을 고치면 두 쪽을 같이 고친다.
 *   0815 에 app.js 안에 있던 것을 여기로 빼냈다 — 포털이 같은 규칙을 써야 하는데
 *   복사해 가면 그날부터 학원 화면과 학부모 화면이 서로 다른 등급을 말한다.
 *
 * ⚠ **원점수 단독 해석 금지.** 그래서 이 파일이 주는 것은 늘 (등급 · 컷 · 난이도) 묶음이다.
 *   점수만 크게 띄우고 싶어질 때 이 주석을 다시 읽어라 — 컷 없이 낙폭을 판단하면 사고가 난다.
 *   컷은 전부 '예상 추정치'이고 화면에도 그렇게 적는다.
 */

/* '고림고등학교'·'고림고'·'고림' 을 한 학교로 본다 */
const 학교키 = s => (String(s || '').trim().replace(/(고등학교|고)$/, '') || String(s || '').trim());
const mi = (m, k) => { const v = m ? m[k] : null; return v === '' || v == null ? null : parseInt(v, 10); };

/* 성적 한 줄(r)에 맞는 시험메타를 찾는다. 학교·학년·시행년·학기·시험구분이 다 맞아야 한다 */
function metaFindIn(metas, r) {
  const y = parseInt(r['시행년'], 10), gr = parseInt(r['학년'], 10), sm = parseInt(r['학기'], 10);
  return (metas || []).find(m => 학교키(m['학교']) === 학교키(r['학교'])
    && mi(m, '학년') === gr && mi(m, '시행년') === y && mi(m, '학기') === sm
    && (m['시험구분'] || '') === (r['시험구분'] || '')) || null;
}

function metaGrade(score, m) {          // 시험메타조회.grade 이식
  if (!m || score == null) return null;
  const s = Number(score);
  if (!isFinite(s)) return null;
  for (const g of [1, 2, 3, 4]) { const c = mi(m, '등급컷' + g); if (c != null && s >= c) return g; }
  return mi(m, '등급컷5하한') != null ? 5 : null;
}
function metaRead(score, m) {           // 시험메타조회.해석 이식
  if (!m) return '시험 정보 없음 — 원점수만으로는 판단 불가';
  const g = metaGrade(score, m), nan = m['전체난이도'] || '?', c1 = mi(m, '등급컷1');
  if (g == null) return `등급컷 미확보 (난이도 ${nan})`;
  return `${g}등급권 (${c1 != null ? '1등급컷 ' + c1 : '컷 미확보'} · 난이도 ${nan} · 예상)`;
}
const gradeCls = g => g == null ? 'na' : (g <= 1 ? 'good' : g <= 3 ? 'mid' : 'bad');

/* ── portal_render.js (0908) — 포털·대시보드 학생 탭 공용 렌더러 ─────────────────────
 * 입력은 portal_view(tok) / portal_view_sid(학생ID) 가 주는 JSON 하나(schema_v18). 화면 규칙은 여기 한 곳.
 *   PR.mount(host, d, {staff:false})  → host 안에 그린다(이벤트 포함).  PR.css 는 mount 가 한 번 붙인다.
 * 포털 원칙: 반 평균·석차·다른 학생·재원생 수는 그리지 않는다. staff 모드에서만 z·모델·키를 덧붙인다.
 * 추정등급: 학교 컷이 아니라 우리 풀(같은 학년 전원)의 지난 내신 결과에 맞댄 추정(gt_grade_model). 범위로 적고 '추정'을 늘 붙인다.
 * 빌더: build_portal.py 가 portal.html 의 /*{PORTAL_RENDER_JS}* / 자리에, build_app.py 가 app_shell 에 각각 넣는다.
 */
const PR = (() => {
  const E = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#x27;');
  const DOW = ['일', '월', '화', '수', '목', '금', '토'];
  const dfmt = s => { const m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})/); if (!m) return E(s); const [y, mo, d] = m.slice(1).map(Number); return `${mo}월 ${d}일(${DOW[new Date(y, mo - 1, d).getDay()]})`; };
  const paper = p => { const m = String(p || '').match(/^(.+?)_(고\d)_(\d{4})_(\d)_(중간|기말)$/); return m ? `${m[1]} ${m[3].slice(2)}년 ${m[4]}학기 ${m[5]}` : String(p || ''); };
  const school = p => String(p || '').split('_')[0].replace(/고$/, '');
  const num = v => (v == null || v === '' || !isFinite(Number(v))) ? null : Number(v);
  const fmt = v => v == null ? '—' : (Math.round(v * 10) / 10).toString();
  const gradeTxt = g => !g ? null : (g[0] === g[1] ? `${g[0]}등급` : `${g[0]}~${g[1]}등급`);

  const css = `
.pr h2{font-size:12px;letter-spacing:.16em;color:var(--acc);margin:26px 0 10px;text-transform:uppercase}
.pr h2 small{color:var(--dim);letter-spacing:0;font-size:12px;margin-left:8px;text-transform:none}
.pr .card{background:var(--card);border:1px solid var(--bd);border-radius:15px;padding:14px 16px;margin-bottom:10px}
.pr .dim{color:var(--dim);font-size:13px}.pr .good{color:var(--good)}.pr .mid{color:var(--mid)}.pr .bad{color:var(--bad)}
.pr .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}
.pr .row:last-child{border-bottom:none}.pr .row .n{white-space:nowrap;font-variant-numeric:tabular-nums}
.pr .note{color:var(--dim);font-size:11.5px;margin-top:8px;line-height:1.6}
.pr .chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 10px;border-radius:9px;background:rgba(255,255,255,.05);color:var(--tx2);margin:3px 4px 0 0;max-width:100%;overflow-wrap:anywhere}
.pr .chip.b3{background:rgba(255,92,138,.22);color:#ffdce7;font-weight:700}.pr .chip.b2{background:rgba(245,160,160,.20);color:#ffe2e2}.pr .chip.b1{background:rgba(252,232,200,.13);color:#f3e6cf}
.pr .flow{background:rgba(245,160,160,.06);border:1px solid rgba(245,160,160,.28)}
.pr .flow .h{font-size:11px;letter-spacing:.12em;color:var(--acc);margin-bottom:8px}
.pr .flow .line{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.pr .flow .line b{font-size:30px;font-weight:800;line-height:1.1}.pr .flow .line .from{color:var(--dim);font-size:13px}.pr .flow .line .arrow{color:var(--tx2)}
.pr .flow .why{margin:10px 0 0;padding:0;list-style:none;font-size:13px;color:var(--tx2)}.pr .flow .why li{margin:2px 0}
.pr .band{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:12px}
.pr .band div{text-align:center;font-size:11px;color:var(--dim);padding:5px 0;border-radius:7px;background:rgba(255,255,255,.035)}
.pr .band div.on{background:rgba(245,160,160,.22);color:#ffe2e2;font-weight:700}
.pr svg.spark{display:block;margin-top:8px;width:100%;height:auto}
.pr .strip{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-top:6px}
.pr .q{aspect-ratio:1;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;position:relative;background:rgba(255,255,255,.05);color:var(--dim);cursor:pointer;border:0;font-family:inherit;padding:0}
.pr .q.o{background:rgba(200,240,218,.14);color:var(--good)}.pr .q.h{background:rgba(252,232,200,.16);color:var(--mid)}.pr .q.x{background:rgba(255,92,138,.22);color:#ffdce7}
.pr .q.sel{outline:2px solid var(--acc);outline-offset:1px}
.pr .q.sure::after{content:"!";position:absolute;top:-5px;right:-4px;width:14px;height:14px;border-radius:50%;background:var(--bad);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center}
.pr .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--dim);margin-top:8px}
.pr .det{margin-top:10px;border-top:1px solid var(--bd);padding-top:10px;font-size:13.5px}.pr .det b{color:var(--tx)}.pr .det .r{display:flex;gap:14px;flex-wrap:wrap;color:var(--tx2);margin-top:3px}.pr .det .r span{color:var(--dim);font-size:12px}
.pr .nav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.pr .nav b{font-size:13.5px;min-width:0;overflow-wrap:anywhere}.pr .nav button{background:none;border:1px solid var(--bd);color:var(--tx2);border-radius:8px;padding:2px 10px;font:inherit;font-size:14px;cursor:pointer}
.pr .nav button:disabled{opacity:.3;cursor:default}
.pr .rp{display:flex;flex-wrap:wrap;gap:7px}.pr .rp a{border:1px solid var(--bd);background:rgba(245,160,160,.08);color:#ffd9d9;border-radius:10px;padding:6px 12px;font-size:13px;text-decoration:none}
.pr .staff{font-size:11.5px;color:var(--dim);border-top:1px dashed var(--bd);margin-top:10px;padding-top:8px;font-variant-numeric:tabular-nums}
.pr .none{color:var(--dim);font-size:13px;padding:10px 2px}
@media (hover:hover) and (pointer:fine){.pr .rp a:hover{border-color:var(--acc)} .pr .q:hover{outline:1px solid var(--bd)}}
`;

  /* 점수 추이 — 숫자를 그대로 얹어 그래프만 보고 오해하지 않게 한다 */
  function spark(rounds) {
    const pts = rounds.filter(r => num(r.점수) != null);
    if (pts.length < 2) return '';
    const w = 320, h = 84, pad = 28, n = pts.length;
    const xs = pts.map((_, i) => pad + (w - 2 * pad) * i / (n - 1));
    const ys = pts.map(r => 66 - 44 * Math.max(0, Math.min(100, num(r.점수))) / 100);
    const path = xs.map((x, i) => `${i ? 'L' : 'M'}${x.toFixed(1)},${ys[i].toFixed(1)}`).join(' ');
    return `<svg class="spark" viewBox="0 0 ${w} ${h}" role="img" aria-label="기출테스트 점수 추이">`
      + `<path d="${path}" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linejoin="round"/>`
      + pts.map((r, i) => `<circle cx="${xs[i].toFixed(1)}" cy="${ys[i].toFixed(1)}" r="${i === n - 1 ? 4 : 3}" fill="var(--acc)"/>`
        + `<text x="${xs[i].toFixed(1)}" y="${(ys[i] - 9).toFixed(1)}" fill="var(--tx2)" font-size="11" text-anchor="middle">${fmt(num(r.점수))}</text>`
        + `<text x="${xs[i].toFixed(1)}" y="${h - 4}" fill="var(--dim)" font-size="10" text-anchor="middle">${E(school(r.시험ID))}</text>`).join('')
      + '</svg>';
  }

  /* 흐름 카드 — 첫 화면. 지난 내신(앵커) → 지금 흐름(추정등급) */
  function flowCard(g, staff) {
    const R = g.회차 || [], F = g.흐름 || {}, gr = F.등급, an = F.앵커;
    const zs = R.map(r => num(r.z)).filter(v => v != null);
    const why = [];
    if (zs.length >= 3) {
      const a = zs.slice(0, Math.ceil(zs.length / 2)), b = zs.slice(-Math.floor(zs.length / 2));
      const d = b.reduce((s, x) => s + x, 0) / b.length - a.reduce((s, x) => s + x, 0) / a.length;
      why.push(d > 0.25 ? '최근 회차가 앞선 회차보다 <b class="good">올라가는 흐름</b>이에요'
        : d < -0.25 ? '최근 회차가 앞선 회차보다 <b class="bad">내려가는 흐름</b>이에요' : '최근 회차가 앞선 회차와 <b>비슷한 흐름</b>이에요');
    }
    if (an && gr) {
      if (an.등급 < gr[0]) why.push(`${E(an.시험)} 때(${an.등급}등급${an.출처 === '예상' ? ' 예상' : ''})보다 <b class="bad">아래</b>예요`);
      else if (an.등급 > gr[1]) why.push(`${E(an.시험)} 때(${an.등급}등급${an.출처 === '예상' ? ' 예상' : ''})보다 <b class="good">위</b>예요`);
      else why.push(`${E(an.시험)} 때(${an.등급}등급${an.출처 === '예상' ? ' 예상' : ''})와 같은 자리예요`);
    }
    const last = R[R.length - 1];
    if (last && num(last.확신오답수) > 0) why.push(`최근 시험에서 <b>확실하다고 했는데 틀린 문항이 ${last.확신오답수}개</b> — 개념부터 다시 봐야 해요`);
    const band = [1, 2, 3, 4, 5].map(k => `<div class="${gr && k >= gr[0] && k <= gr[1] ? 'on' : ''}">${k}</div>`).join('');
    const head = gr
      ? `<div class="line">${an ? `<span class="from">${E(an.시험)} ${an.등급}등급${an.출처 === '예상' ? '(예상)' : ''}</span><span class="arrow">→</span>` : ''}`
        + `<b>${gradeTxt(gr)}</b><span class="dim">지금 흐름 · 추정</span></div><div class="band">${band}</div>`
      : `<div class="line"><b style="font-size:20px">${R.length ? '추정 등급 준비 중' : '아직 기록이 없어요'}</b></div>`
        + `<div class="dim">${R.length ? '회차가 더 쌓이면 지금 흐름의 등급이 나와요' : '기출테스트를 보면 여기에 흐름이 쌓여요'}</div>`;
    const staffLine = staff ? `<div class="staff">z 현재 ${F.현재z ?? '—'} · 회차 z ${zs.map(v => v.toFixed(2)).join(' / ') || '—'}`
      + ` · 모델 ${g.모델 ? `${g.모델.학년} 쌍 ${g.모델.쌍}/풀 ${g.모델.풀} 경계 ${(g.모델.경계 || []).map(b => `${b.좋은}|${b.나쁜}@${b.z}`).join(' ')}${g.모델.유효 ? '' : ' (무효)'}` : '—'}</div>` : '';
    return `<div class="card flow"><div class="h">기출테스트 흐름${R.length ? ` · ${R.length}회` : ''}</div>${head}`
      + (why.length ? `<ul class="why">${why.map(w => `<li>${w}</li>`).join('')}</ul>` : '')
      + spark(R)
      + (gr ? '<div class="note">등급은 학교 컷이 아니라, 같은 학년 친구들의 지난 내신 결과와 기출 점수를 맞대어 본 추정이에요. 시험지 난이도에 따라 한 칸은 흔들릴 수 있어요.</div>' : '')
      + staffLine + '</div>';
  }

  function topicCard(g) {
    const T = g.주제 || [];
    if (!T.length) return '';
    return '<h2>자주 틀리는 단원<small>기출테스트 누적</small></h2><div class="card">'
      + T.map((t, i) => `<div class="row"><span><span class="chip b${Math.max(1, 3 - i)}">${E(t.단원)} · ${t.횟수}/${t.문항수}문항</span>`
        + `<div class="dim" style="margin-top:3px">${(t.예시 || []).map(E).join(' · ')}</div></span></div>`).join('')
      + '</div>';
  }

  /* 회차 카드 — ‹ › 로 회차 이동, 칸을 누르면 그 문항 */
  function roundCard(g, idx, sel, staff) {
    const R = g.회차 || [];
    if (!R.length) return '';
    const r = R[idx], items = r.문항 || [];
    const cell = it => {
      const v = num(it.정오), cls = v == null ? '' : v >= 1 ? 'o' : v > 0 ? 'h' : 'x';
      const sure = v != null && v < 1 && it.확신 === '확실';
      return `<button type="button" class="q ${cls}${sure ? ' sure' : ''}${sel === it.라벨 ? ' sel' : ''}" data-pr-q="${E(it.라벨)}">${E(it.라벨)}</button>`;
    };
    const it = items.find(x => x.라벨 === sel);
    const det = it ? `<div class="det"><b>${E(it.라벨)}번${it.배점 != null ? ` · ${fmt(num(it.배점))}점` : ''}${it.유형 ? ` · ${E(it.유형)}` : ''}</b>`
      + `<div class="r">${it.내답 != null ? `<span>내 답</span>${E(it.내답)}` : ''}${it.정답 && it.정답 !== 'M' ? `<span>정답</span>${E(it.정답)}` : ''}`
      + `${it.확신 ? `<span>자기평가</span>${E(it.확신)}` : ''}${it.단원 ? `<span>단원</span>${E(it.단원)}` : ''}</div>`
      + (num(it.정오) != null && num(it.정오) < 1 && it.확신 === '확실' ? '<div class="r dim">확신했는데 틀린 문항은 개념을 다시 잡아야 해요</div>' : '') + '</div>' : '';
    const grade = r.등급 ? ` · 이 회차 추정 ${gradeTxt(r.등급)}` : '';
    return `<h2>회차별 시험<small>${dfmt(r.날짜)}</small></h2><div class="card">`
      + `<div class="nav"><button type="button" data-pr-nav="-1" ${idx === 0 ? 'disabled' : ''}>‹</button><b>${E(paper(r.시험ID))}</b><button type="button" data-pr-nav="1" ${idx === R.length - 1 ? 'disabled' : ''}>›</button></div>`
      + `<div class="row"><span>점수</span><span class="n"><b>${fmt(num(r.점수))}</b> <span class="dim">/ ${r.총점 != null ? fmt(num(r.총점)) : 100}${grade}</span></span></div>`
      + (items.length ? `<div class="strip">${items.map(cell).join('')}</div>`
        + '<div class="legend"><span class="good">■ 맞음</span><span class="mid">■ 부분</span><span class="bad">■ 틀림</span><span>! 확실하다고 했는데 틀림</span></div>' + det
        : '<div class="none">문항별 기록이 없는 회차예요</div>')
      + (staff && r.z != null ? `<div class="staff">z ${r.z} · 오답 ${r.오답수} · 확신오답 ${r.확신오답수}</div>` : '')
      + '</div>';
  }

  function todoCard(d, g, staff) {
    const rows = [];
    (g.PT || []).slice(0, 3).forEach(p => {
      const links = [];
      if (p.문제url) links.push(`<a href="${E(p.문제url)}" target="_blank" rel="noopener">문제${p.문제쪽 ? ` ${E(p.문제쪽)}쪽` : ''}</a>`);
      if (p.해설url) links.push(`<a href="${E(p.해설url)}" target="_blank" rel="noopener">해설${p.해설쪽 ? ` ${E(p.해설쪽)}쪽` : ''}</a>`);
      if (!links.length && p.url) links.push(`<a href="${E(p.url)}" target="_blank" rel="noopener">전체</a>`);
      if (!links.length && staff) links.push(...['키', '문제키', '해설키'].filter(k => p[k]).map(k => `<a href="#" data-pr-key="${E(p[k])}" data-pr-name="${E(k.replace('키', '') || '전체')}">${E(k.replace('키', '') || '전체')} (서명)</a>`));
      if (!links.length) return;
      rows.push(`<div class="row"><span>퍼스널트레이닝 <span class="dim">${E(paper(p.시험지명))}</span></span><span class="rp">${links.join('')}</span></div>`);
    });
    ((d.클리닉 || {}).예정 || []).slice(0, 3).forEach(c => {
      rows.push(`<div class="row"><span>추가학습 <span class="dim">${E(String(c.사유 || '').replace(/\([^)]*평균[^)]*\)/g, '').replace(/반\s*평균\s*(이하|미만|이상)?/g, '보충').trim())}</span></span>`
        + `<span class="n mid">${dfmt(c.날짜)}${c.시간 ? ` ${E(c.시간)}` : ''}</span></div>`);
    });
    if (!rows.length) return '';
    return '<h2>할 일</h2><div class="card">' + rows.join('') + '</div>';
  }

  function histCard(g) {
    const R = (g.회차 || []).slice().reverse();
    if (R.length < 2) return '';
    return '<h2>회차별</h2><div class="card">'
      + R.map((r, i) => `<div class="row"><span><a href="#" data-pr-go="${R.length - 1 - i}" style="text-decoration:none">${E(paper(r.시험ID))}</a> <span class="dim">${dfmt(r.날짜)}</span></span>`
        + `<span class="n"><b>${fmt(num(r.점수))}</b> <span class="dim">${r.등급 ? gradeTxt(r.등급).replace('등급', '') : '—'}</span></span></div>`).join('')
      + '<div class="note">등급 칸이 비어 있으면 그 회차는 응시 인원이 적어 흐름에 넣지 않은 회차예요</div></div>';
  }

  function render(d, st) {
    const g = (d && d.기출) || { 회차: [] };
    const R = g.회차 || [];
    if (st.idx == null || st.idx >= R.length) st.idx = R.length - 1;
    return `<div class="pr">${flowCard(g, st.staff)}${topicCard(g)}${roundCard(g, st.idx, st.sel, st.staff)}${todoCard(d, g, st.staff)}${histCard(g)}</div>`;
  }

  let cssOn = false;
  function mount(host, d, opts) {
    if (!cssOn) { const s = document.createElement('style'); s.textContent = css; document.head.appendChild(s); cssOn = true; }
    const st = { idx: null, sel: null, staff: !!(opts && opts.staff), sign: opts && opts.sign };
    const draw = () => { host.innerHTML = render(d, st); };
    host.onclick = e => {
      const q = e.target.closest('[data-pr-q]'); if (q) { st.sel = st.sel === q.dataset.prQ ? null : q.dataset.prQ; draw(); return; }
      const nv = e.target.closest('[data-pr-nav]'); if (nv && !nv.disabled) { st.idx += Number(nv.dataset.prNav); st.sel = null; draw(); return; }
      const go = e.target.closest('[data-pr-go]'); if (go) { e.preventDefault(); st.idx = Number(go.dataset.prGo); st.sel = null; draw(); host.querySelector('.nav') && host.querySelector('.nav').scrollIntoView({ block: 'center' }); return; }
      const k = e.target.closest('[data-pr-key]'); if (k && st.sign) { e.preventDefault(); st.sign(k.dataset.prKey, k.dataset.prName, k); }
    };
    draw();
  }
  return { mount, render, css };
})();
if (typeof window !== 'undefined') window.PR = PR;

const SB_URL='https://bkgerndnwukvuuqdgnxt.supabase.co';

const E=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')

const $=id=>document.getElementById(id);

const dfmt=s=>{const[y,m,d]=String(s).split('-').map(Number);
  return `${m}월 ${d}일(${DOW[new Date(y,m-1,d).getDay()]})`;};
/* 추가학습 사유가 반 통계를 실어 오면 걷어낸다 — 화면 원칙(반 평균 비노출).

function say(big,small){

/* 주간고사 추이 — 선 하나. 숫자를 그대로 얹어 그래프만 보고 오해하지 않게 한다 */
function spark(pts,w=280,h=64){
  if(!pts.length) return '';
  const pad=16,lo=0,hi=100,n=pts.length;
  const xs=pts.map((_,i)=>pad+(w-2*pad)*(n>1?i/(n-1):0.5));
  const ys=pts.map(p=>h-14-(h-26)*(Math.max(lo,Math.min(hi,p[1]))-lo)/(hi-lo));
  const path=pts.map((_,i)=>`${i?'L':'M'}${xs[i].toFixed(1)},${ys[i].toFixed(1)}`).join(' ');
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="주간고사 추이">`
    +`<path d="${path}" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linejoin="round"/>`
    +pts.map((p,i)=>`<circle cx="${xs[i].toFixed(1)}" cy="${ys[i].toFixed(1)}" r="${i===n-1?4:3}" fill="var(--acc)"/>`
      +`<text x="${xs[i].toFixed(1)}" y="${(ys[i]-9).toFixed(1)}" fill="var(--tx2)" font-size="11" text-anchor="middle">${p[1]}</text>`
      +`<text x="${xs[i].toFixed(1)}" y="${h-2}" fill="var(--dim)" font-size="10" text-anchor="middle">${E(p[0])}</text>`).join('')
    +`</svg>`;
}

/* ── 화면 ── */
const MINIMAL=true;   // (0902 유강) 자기평가 카드만. 0906 정리: 하위 전체 화면 코드는 07_보관/콘솔정리_0906/portal.html 에 있다
function render(d){

    +`<div class="asof">${E(dfmt(d.기준일))} 기준 · 이 화면은 나의 기록만 보여줍니다</div>`);

  // ⓪ 오늘 기출테스트 자기평가 (0902) — 시험 직후 답안지 걷자마자 폰으로.
  //    정보는 gt_eval_open 이 따로 준다(portal_view 는 손대지 않았다). 없으면 아무것도 안 그린다.
  const G=d.자평||null;

    const url=`https://ukan8.github.io/dashboard/eval/?t=${encodeURIComponent(d.토큰||'')}`;
    if(G.제출함)
      H.push(`<div class="card" style="border-color:rgba(126,224,163,.35)"><div class="row"><span class="t">오늘 기출테스트 자기평가 <b class="good">제출 완료</b></span>`
        +`<a class="n dim" href="${E(url)}" style="text-decoration:none">고치기</a></div></div>`);
    else
      H.push(`<div class="card" style="border-color:rgba(245,160,160,.5);background:rgba(245,160,160,.08)">`
        +`<div class="row"><span class="t"><b>오늘 기출테스트 자기평가</b><span class="dim"> 문항마다 내 답 + 확신 · 2분</span></span>`
        +`<a class="n mid" href="${E(url)}" style="text-decoration:none;font-weight:800">시작 →</a></div></div>`);
  }
  else
    H.push(`<div class="none">지금 열려 있는 자기평가가 없습니다. 기출테스트 본 날 답안지 걷은 뒤 다시 열어 주세요.</div>`);
  // ① 기출테스트 — 흐름·추정등급·회차·할 일 (0908). 화면 규칙은 portal_render.js 한 곳(대시보드 학생 탭과 공용).
  H.push(`<div id="pr-host"></div>`);
  H.push(`<div class="note">다른 기록(루프·리포트·유형맵)은 정비 중이라 잠시 숨겨 두었습니다.</div>`);
  H.push(`<div class="foot"><b>이 주소는 ${E(d.학생.이름)} 개인 링크입니다.</b> 다른 사람에게 전달하지 마세요.</div>`);
  $('app').innerHTML=H.join('');
  // d.기출 이 아예 없으면 DB 가 아직 v18 이전 — 빈 흐름 카드 대신 조용히 준비 중 한 줄
  try{ if(d.기출===undefined) $('pr-host').innerHTML='<div class="none">기출테스트 기록 화면을 준비하고 있습니다.</div>'; else PR.mount($('pr-host'), d, {staff:false}); }
  catch(e){ $('pr-host').innerHTML='<div class="none">기출테스트 기록을 그리지 못했습니다. 잠시 뒤 다시 열어 주세요.</div>'; }
  $('msg').style.display='none'; $('app').style.display='';
  document.title=`${d.학생.이름} · 수학은유강`;
}

(async()=>{

  if(err) return say('지금은 열 수 없습니다.','잠시 뒤 다시 열어 주세요. 계속 같으면 원장에게 알려 주세요.');
  if(!data) return say('만료되었거나 잘못된 링크입니다.','새 링크가 필요하면 원장에게 말씀해 주세요.');
  // (0902) 오늘 기출 자기평가가 열려 있나 — 실패해도 포털은 그냥 뜬다. (학부모 토큰은 0902 폐기 → 분기 없음, 0906)
  try{ const r=await sb.rpc('gt_eval_open',{tok}); if(r&&r.data&&(r.data.문항||r.data.없음)){ data.자평=r.data; data.토큰=tok; } }catch(e){}
  render(data);
})();
