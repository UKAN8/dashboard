<style>:root{--bg:#0c0b10;--bg2:#141218;--ink:#f4efe9;--sub:#9c97a3;--dim:#6d6873;--line:rgba(244,239,233,.10);--fill:rgba(244,239,233,.04);
--good:#9fe3c0;--mid:#f6d7a7;--bad:#ff5f7e;--rose:#f5a0a0;--f:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color-scheme:dark}
*{box-sizing:border-box}html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%;
padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px;
background-image:radial-gradient(600px 360px at 110% -5%,rgba(245,160,160,.14),transparent 60%),linear-gradient(180deg,var(--bg2),var(--bg) 420px);background-repeat:no-repeat}
.wrap{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:28px;padding-top:20px}
#app{display:flex;flex-direction:column;gap:28px}
.strip{height:5px;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));background:linear-gradient(90deg,var(--rose),rgba(245,160,160,.12))}
.hd{display:flex;flex-direction:column;gap:6px}
.hd .row1{display:flex;align-items:baseline;gap:12px;font-weight:900;font-size:40px;letter-spacing:-1px;line-height:1.1}
.hd .w{font-size:18px;font-weight:700;color:var(--sub);letter-spacing:0;margin-left:2px}
.hd .dot{width:7px;height:7px;border-radius:50%;background:var(--dim);align-self:center}
.hd .who{font-size:15px;color:var(--sub);font-weight:500}.hd .who b{color:var(--ink);font-weight:700;margin-right:6px}
.hd .why{font-size:14px;color:var(--sub)}
.kpi{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.kpi.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi>div{display:grid;grid-template-rows:auto 64px 20px auto;row-gap:8px;justify-items:center;text-align:center;padding:18px 6px;min-width:0}
.kpi>div+div{border-left:1px solid var(--line)}
.kpi .l{font-size:13px;font-weight:700;color:var(--sub);letter-spacing:2px}
.kpi .v{align-self:end;font-size:56px;font-weight:900;line-height:1;letter-spacing:-2px;font-variant-numeric:tabular-nums}
.kpi.n3 .v{font-size:42px}
.kpi .v small{font-size:18px;font-weight:700;letter-spacing:0;margin-left:3px;opacity:.75}
.kpi.n3 .v small{font-size:14px}
.kpi .avg{font-size:12px;color:var(--sub);font-weight:500;font-variant-numeric:tabular-nums}
.kpi .nt{align-self:center;font-size:12px;font-weight:700;color:var(--sub)}
.brk em.nc{font-style:normal;font-size:11px;font-weight:700;color:var(--mid);margin-top:2px}
.hd .dday{margin-left:10px;padding:2px 8px;border-radius:999px;background:rgba(245,160,160,.14);color:var(--rose);font-weight:700;font-size:13px}
.kv .due{font-size:13px;font-weight:700;color:var(--rose);margin-bottom:2px}
.fold .flg{font-size:12px;color:var(--sub);padding:2px 0 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.kpi .tm{align-self:center;font-size:14px;font-weight:700;color:var(--rose);opacity:.85}
.bar{align-self:center;width:64%;height:6px;border-radius:4px;background:var(--fill);overflow:hidden}.bar i{display:block;height:100%;border-radius:4px}
.exwhy{font-size:14px;color:var(--sub);margin-top:-18px;text-align:right}
section{display:flex;flex-direction:column;gap:12px}
h2{margin:0;font-size:13px;font-weight:700;color:var(--rose);letter-spacing:3px}
h2 span{color:var(--dim);letter-spacing:0;font-weight:500;margin-left:6px}
.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.item{display:grid;grid-template-columns:42px minmax(0,1fr) auto;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.tag{font-size:12px;font-weight:700;color:var(--dim);border:1px solid var(--line);border-radius:6px;text-align:center;padding:1px 0}
.item .t{font-weight:700}
.mk{display:flex;gap:4px}
.m{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:900}
.m.o{color:var(--good);background:rgba(159,227,192,.12);border:1.5px solid rgba(159,227,192,.5)}
.m.x{color:var(--bad);background:rgba(255,95,126,.12);border:1.5px solid rgba(255,95,126,.5)}
.m.a{color:var(--mid);background:rgba(246,215,167,.12);border:1.5px solid rgba(246,215,167,.5)}
.legend{font-size:12px;color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font-size:14px;font-weight:700;color:var(--rose);background:rgba(245,160,160,.10);border:1px solid rgba(245,160,160,.35);border-radius:999px;padding:5px 12px}
.more{font-size:13px;color:var(--dim)}
.cmt{background:var(--fill);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-weight:500;line-height:1.7}
.kv{display:grid;grid-template-columns:72px minmax(0,1fr);gap:4px 12px;border-top:1px solid var(--line);padding-top:12px;margin:0}
.kv dt{font-size:13px;color:var(--sub);font-weight:700;padding-top:2px}
.kv dd{margin:0 0 12px;font-weight:700;min-width:0;overflow-wrap:anywhere}
.kv dd ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px}
.loop{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.loop .p{font-weight:500;font-variant-numeric:tabular-nums}
.st{font-size:13px;font-weight:700;border-radius:999px;padding:2px 10px;white-space:nowrap}
.st.no{color:var(--bad);background:rgba(255,95,126,.12)}.st.ok{color:var(--good);background:rgba(159,227,192,.12)}.st.pre{color:var(--sub)}
.brk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line)}
.brk.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.brk.c1{grid-template-columns:1fr}
.brk>div{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 4px;border-bottom:1px solid var(--line)}
.brk>div+div{border-left:1px solid var(--line)}
.brk span{font-size:13px;color:var(--sub);font-weight:700}
.brk b{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.brk small{font-size:13px;color:var(--sub);font-weight:700;margin-left:4px}.brk small i{font-style:normal;margin:0 4px 0 0;opacity:.7}
.brk .sum{grid-column:1/-1;border-left:0!important;flex-direction:row;justify-content:space-between;padding:12px 2px}
.brk .sum b{display:flex;align-items:baseline;gap:18px}.brk .sum .cnt{color:var(--ink);font-size:18px}.brk .sum .pc{font-size:22px}
.charts{display:grid;grid-template-columns:1fr;gap:14px}
.ch{background:var(--fill);border:1px solid var(--line);border-radius:14px;padding:14px 14px 6px}
.chl{font-size:14px;font-weight:700}.chl span{font-size:12px;color:var(--dim);font-weight:500;margin-left:6px}
.ch svg{width:100%;height:auto;display:block;margin-top:6px}
.ch .base{stroke:var(--line);stroke-width:1}
.ch .avgl{stroke:var(--ink);stroke-width:2;stroke-dasharray:4 3;opacity:.75}
.ch .cv{fill:var(--ink);font-size:13px;font-weight:700;font-family:var(--f)}
.ch .cd{fill:var(--dim);font-size:12px;font-family:var(--f)}.ch .cd.now{fill:var(--ink);font-weight:700}
.attrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:8px 4px;padding:12px 0 8px}
.ad{display:flex;flex-direction:column;align-items:center;gap:6px}
.ad i{width:16px;height:16px;border-radius:50%;display:block}
.ad span{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}.ad span.now{color:var(--ink);font-weight:700}
.fold{background:var(--fill);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.fold>button{all:unset;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;box-sizing:border-box;padding:14px 16px}
.fold>button:focus-visible{outline:2px solid var(--rose);outline-offset:-2px}
.fold .s1{font-weight:700}.fold .s2{font-size:13px;color:var(--sub)}
.fold .arr{color:var(--sub);transition:transform .2s}.fold.open .arr{transform:rotate(180deg)}
.fold .body{display:none;padding:0 16px 14px}.fold.open .body{display:block}
.unit{font-size:13px;font-weight:700;color:var(--rose);margin:14px 0 4px}
.cn{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.cn .n{font-weight:500}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.p-grad{color:var(--bg);background:var(--good)}.p-pass{color:var(--good);border:1px solid rgba(159,227,192,.4)}
.p-re{color:var(--bad);border:1px solid rgba(255,95,126,.45);background:rgba(255,95,126,.08)}.p-pre{color:var(--sub);border:1px solid var(--line)}
.later{font-size:13px;color:var(--dim);padding-top:10px}
.foot{font-size:12px;color:var(--dim);text-align:center;border-top:1px solid var(--line);padding-top:16px}
.msg{padding:40px 0;color:var(--sub);text-align:center}

<script>(function(){
var box=document.getElementById('app');
function b64(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function fail(){box.innerHTML='<div class="msg">리포트를 열 수 없어요. 카톡으로 받은 링크를 그대로 눌러 주세요.</div>';}
var k=location.hash.slice(1);
if(!k||!window.crypto||!crypto.subtle){fail();return;}
try{
 var P=JSON.parse(document.getElementById('p').textContent);
 crypto.subtle.importKey('raw',b64(k),{name:'AES-GCM'},false,['decrypt']).then(function(key){
  return crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},key,b64(P.ct));
 }).then(function(buf){
  box.innerHTML=new TextDecoder().decode(buf);
  box.addEventListener('click',function(e){var b=e.target.closest('.fbtn');if(!b)return;var f=b.parentNode;var o=f.classList.toggle('open');b.setAttribute('aria-expanded',o?'true':'false');});
 }).catch(fail);
}catch(e){fail();}
})();</script></body></html>
