<style>
:root{color-scheme:dark;
 --bg:#0a0a0f; --card:rgba(255,255,255,.03); --bd:rgba(255,255,255,.08);
 --tx:#f5f5fa; --tx2:#b8b8c5; --dim:#8a8a98; --acc:#f5a0a0; --good:#c8f0da; --warn:#ffd48a;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.brand{font-weight:800;color:var(--acc)}
header .t{font-weight:700;font-size:16px}

select{font:inherit;color:var(--tx);background:#15151d;border:1px solid var(--bd);border-radius:8px;padding:6px 10px}
.wrap{display:grid;grid-template-columns:minmax(420px,520px) 1fr;gap:0;height:calc(100vh - 52px)}
.left{overflow:auto;padding:12px 14px;border-right:1px solid var(--bd)}
.right{background:#111118;display:flex;flex-direction:column}
.right .bar{padding:8px 12px;color:var(--tx2);font-size:13px;border-bottom:1px solid var(--bd);display:flex;gap:10px;align-items:center}

.right .empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--dim)}
table{width:100%;border-collapse:collapse}
th{font-size:11.5px;color:var(--dim);font-weight:600;text-align:left;padding:4px 6px;border-bottom:1px solid var(--bd);letter-spacing:.04em}
td{padding:7px 6px;border-bottom:1px solid var(--bd);vertical-align:middle}
tr.sel td{background:rgba(245,160,160,.07)}
td.nm{font-weight:700;font-size:15px}
td.nm small{display:block;font-weight:400;color:var(--dim);font-size:11.5px}
a.f{display:inline-block;font:inherit;font-size:13px;color:var(--tx);background:rgba(255,255,255,.05);border:1px solid var(--bd);
 border-radius:8px;padding:4px 9px;margin:0 3px 0 0;text-decoration:none;white-space:nowrap}
a.f.q{border-color:rgba(200,240,218,.35)} a.f.s{border-color:rgba(245,160,160,.35)}

<script>
/* ───────── (1115 P13) 오답 트레이닝 — 원장 계산 · 출제 패널 · 내 자료(결과 체크) · 기록 ─────────
 * 정본: 00_대시보드/_wr/wr_panel.js — 포털(build_portal.py)과 학생 자료실(build_files.py)이 빌드 때 그대로 끼워 넣는다.
 * 유강 1114: "학생별로 본인이 원하는 수준의 오답을 출제 · 다 풀면 결과 체크 · 보완과제/오답자료로 처리한 건 덮어쓰지 말고 따로 기록 ·
 *            다양한 선택지 · 예상 문항수 · 프리셋". 자율(마감·알림·이행률 없음).
 * 서버(schema_v80)는 원재료만 준다 — 원장(무엇이 오답인지·단계)은 여기서 계산한다. 만들 때 서버가 다시 확인한다(_wr_make).
 *
 * 원장 규칙 (P13 기획 §1)
 *  · 한 줄 = 문항ID. 과제 체크(써킷·개별과제)에서 처음상태·지금상태 중 하나라도 ②~⑤ 인 첫 행이 '원래 오답'.
 *  · 다시 푼 기록(시간 순): ① 그 행을 나중에 ①로 고친 것 ② 뒤에 같은 문항이 과제로 다시 나와 체크한 것(처음상태)
 *    ③ 클리닉 보완 체크(hw_fix) ④ 오답 트레이닝 결과 체크(wr_retry, 원문항만 — 비슷한 문제는 단계에 안 넣는다)
 *  · 한 번에 맞음 = 회복 1회. ③해설 보고·④질문·⑤모름 = 또 틀림(연속 회복이 끊긴다). ②고쳐서 = 그대로.
 *  · 졸업 = 한 번에 맞음 2번 연속, 첫 회복과 3일 이상 간격.
 */
var WR = (function () {
  'use strict';
  var E = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var LVR = { '하': 1, '기본': 1, '중': 2, '중상': 3, '상': 4, '최상': 5 };
  var MIN = { '하': 1, '기본': 1, '중': 2, '중상': 3, '상': 5, '최상': 7 };
  var LVG = function (lv) { return lv === '기본' ? '하' : lv === '최상' ? '상' : (LVR[lv] ? lv : '중'); };
  var KIND = { '2': '② 고쳐서', '3': '③ 해설 보고', '4': '④ 질문해서', '5': '⑤ 모름', easy: '쉬운데 틀림' };
  var STAGES = ['미처리', '또 틀림', '1회 회복', '졸업'];
  var ST = { 1: ['①', '한 번에 맞음'], 2: ['②', '고쳐서 맞음'], 3: ['③', '해설 보고 이해'], 5: ['⑤', '여전히 모름'], 7: ['⑦', '문항 오류'] };
  var DAY = 86400;
  var BASE = { src: ['써킷', '개별과제'], kinds: ['3', '4', '5'], stages: ['미처리', '또 틀림'], period: '14', units: [], types: [],
    levels: ['하', '중', '중상', '상'], ans: false, sim: false, order: 'easy', dens: 2, hands: true, cap: 20 };
  var PRESETS = [
    { 이름: '이번 주 털기', 설명: '최근 7일 ③④⑤', f: { period: '7', cap: 20 } },
    { 이름: '기말 직전 총정리', 설명: '이번 학기 ③④⑤ · 단원순', f: { period: 'all', order: 'unit', cap: 40 } },
    { 이름: '또 틀린 것만', 설명: '다시 풀었는데 또 틀린 문항', f: { period: 'all', kinds: ['2', '3', '4', '5', 'easy'], stages: ['또 틀림'], cap: 30 } },
    { 이름: '모르는 것 집중', 설명: '④⑤ + 조교쌤 손풀이', f: { period: 'all', kinds: ['4', '5'], stages: ['미처리', '또 틀림', '1회 회복'], hands: true, cap: 20 } },
    { 이름: '실수 잡기', 설명: '② 고쳐서 + 쉬운데 틀림', f: { period: '14', kinds: ['2', 'easy'], order: 'mix', cap: 20 } },
    { 이름: '가볍게 10문제', 설명: '중요한 것부터 10개', f: { period: '14', cap: 10 } }
  ];
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function withBase(f) { var o = clone(BASE); for (var k in (f || {})) o[k] = clone(f[k]); return o; }

  /* ── 원장 ── */
  function ledger(P) {
    var by = {}, rate = {}, ans = {}, fix = {}, re = {}, sims = {};
    (P.체크 || []).forEach(function (r) {
      var o = { q: r[0], aid: r[1], no: r[2], d: r[3], ind: !!r[4], s0: r[5] == null ? r[6] : r[5], s: r[6], t0: r[7], t1: r[8],
        u: r[9] || '', lv: r[10] || '', th: r[11], unit: r[12] || '', pan: r[13] };
      (by[o.q] = by[o.q] || []).push(o);
    });
    (P.반율 || []).forEach(function (x) { rate[x[0] + ':' + x[1]] = [x[2], x[3]]; });
    (P.답 || []).forEach(function (x) { if (x[2]) ans[x[2]] = (ans[x[2]] || 0) + 1; });
    (P.보완 || []).forEach(function (x) { (fix[x[0]] = fix[x[0]] || []).push({ st: x[3], t: x[4], src: '클리닉 보완' }); });
    (P.다시 || []).forEach(function (x) {
      var e = { st: x[5], t: x[7], src: '오답 트레이닝', pan: x[0] };
      if (x[4]) (sims[x[3]] = sims[x[3]] || []).push(e); else (re[x[3]] = re[x[3]] || []).push(e);
    });
    var out = [];
    Object.keys(by).forEach(function (q) {
      var rs = by[q], oi = -1, i;
      var bad = function (r) { return [r.s0, r.s].filter(function (v) { return v >= 2 && v <= 5; }); };
      for (i = 0; i < rs.length; i++) if (bad(rs[i]).length) { oi = i; break; }
      if (oi < 0) return;
      var o = rs[oi], worst = Math.max.apply(null, bad(o));
      var ev = [];
      if (o.s === 1 && o.s0 >= 2 && o.s0 <= 5) ev.push({ st: 1, t: o.t1, src: '과제 체크 고침' });
      rs.slice(oi + 1).forEach(function (r) { var st = r.s0 || r.s; if (st >= 1 && st <= 5) ev.push({ st: st, t: r.t0, src: r.ind ? '개별과제' : '써킷' }); });
      (fix[q] || []).forEach(function (e) { ev.push(e); });
      (re[q] || []).forEach(function (e) { ev.push(e); });
      ev.sort(function (a, b) { return a.t - b.t; });
      var streak = 0, first = 0, grad = false, fail = false;
      ev.forEach(function (e) {
        if (e.st === 1) { if (!streak) first = e.t; streak++; fail = false; if (streak >= 2 && e.t - first >= 3 * DAY) grad = true; }
        else if (e.st >= 3) { streak = 0; grad = false; fail = true; }
      });
      var info = rs.filter(function (r) { return r.u; }).pop() || o;
      var rr = !o.ind ? rate[o.aid + ':' + o.no] : null;
      out.push({ q: q, unit: info.unit || o.unit, u: info.u, lv: info.lv || o.lv, k: info.th != null ? (info.unit || o.unit) + '-T' + ('0' + info.th).slice(-2) : '',
        d: String(o.d || ''), src: o.ind ? '개별과제' : '써킷', worst: worst, easy: info.lv === '하' || info.lv === '기본',
        stage: grad ? '졸업' : fail ? '또 틀림' : streak >= 1 ? '1회 회복' : '미처리', ev: ev, sim: sims[q] || [],
        tries: (re[q] || []).length, ans: !!ans[q], rate: rr });
    });
    return out;
  }
  function daysAgo(d) { if (!d) return 9999; var t = new Date(d + 'T00:00:00+09:00').getTime(); return Math.floor((Date.now() - t) / 864e5); }
  function match(L, f) {
    return L.filter(function (x) {
      if (f.src.indexOf(x.src) < 0) return false;
      var kind = f.kinds.indexOf(String(x.worst)) >= 0 || (f.kinds.indexOf('easy') >= 0 && x.easy);
      if (!kind) return false;
      if (f.stages.indexOf(x.stage) < 0) return false;
      if (f.period !== 'all' && daysAgo(x.d) > +f.period) return false;
      if (f.units.length && f.units.indexOf(x.unit) < 0) return false;
      if (f.types.length && f.types.indexOf(x.u || x.k) < 0) return false;
      if (f.levels.indexOf(LVG(x.lv)) < 0) return false;
      if (f.ans && !x.ans) return false;
      return true;
    });
  }
  function prio(x) { return (x.stage === '또 틀림' ? 0 : 10) + ({ 5: 0, 4: 1, 3: 2 }[x.worst] != null ? { 5: 0, 4: 1, 3: 2 }[x.worst] : (x.easy ? 3 : 4)); }
  function hash(s) { var h = 2166136261; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function pick(L, f, seed) {
    var all = match(L, f);
    var sorted = all.slice().sort(function (a, b) { return prio(a) - prio(b) || (a.d < b.d ? 1 : a.d > b.d ? -1 : 0); });
    var per = f.sim ? 2 : 1, n = Math.max(1, Math.floor(f.cap / per)), got = sorted.slice(0, n);
    if (f.order === 'unit') got.sort(function (a, b) { return a.unit.localeCompare(b.unit) || String(a.k).localeCompare(String(b.k)) || (LVR[a.lv] || 2) - (LVR[b.lv] || 2); });
    else if (f.order === 'mix') got.sort(function (a, b) { return hash(seed + a.q) - hash(seed + b.q); });
    else got.sort(function (a, b) { return (LVR[a.lv] || 2) - (LVR[b.lv] || 2) || a.unit.localeCompare(b.unit); });
    var mins = got.reduce(function (s, x) { return s + (MIN[x.lv] || 2) * per; }, 0);
    var cnt = {}; got.forEach(function (x) { var k = x.easy && f.kinds.indexOf(String(x.worst)) < 0 ? 'easy' : String(x.worst); cnt[k] = (cnt[k] || 0) + 1; });
    return { all: all, got: got, n: got.length * per, mins: mins, cnt: cnt, cut: all.length > got.length };
  }
  function unitName(P, k) {
    var m = (P && P.단원명) || {}, n = m[k];
    if (!n && /^\d{4}$/.test(k)) { var a = m[k.slice(0, 2)], b = m[k.slice(2)]; n = a && b ? a.replace(/함수$/, '') + '·' + b : (a || b); }
    return n ? String(n).replace(/^\d+\s*/, '') : k + '단원';
  }
  function summary(L) {
    var s = { 남은: 0, 또: 0, 졸업: 0, 회복: 0 };
    L.forEach(function (x) { if (x.stage === '졸업') s.졸업++; else { s.남은++; if (x.stage === '또 틀림') s.또++; if (x.stage === '1회 회복') s.회복++; } });
    return s;
  }

  /* ── 스타일 (한 번만) ── */
  function css() {
    if (document.getElementById('wr-css')) return;
    var st = document.createElement('style'); st.id = 'wr-css';
    st.textContent = [
      '.wr{--wr-acc:var(--acc,#f5a0a0);--wr-bd:var(--bd,rgba(255,255,255,.1));--wr-dim:var(--dim,#8a8a98);--wr-tx2:var(--tx2,#b8b8c5);--wr-card:var(--card,rgba(255,255,255,.03))}',
      '.wr .wr-card{background:var(--wr-card);border:1px solid var(--wr-bd);border-radius:15px;padding:14px 16px;margin-bottom:12px}',
      '.wr .wr-sum{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--wr-tx2)}.wr .wr-sum b{font-size:18px;color:inherit;margin-right:2px}',
      '.wr .wr-sum .r b{color:#ff8fae}.wr .wr-sum .g b{color:#8fe0b0}',
      '.wr .wr-h{font-size:13px;font-weight:600;color:var(--wr-tx2);margin:14px 0 6px}',
      '.wr .wr-chips{display:flex;flex-wrap:wrap;gap:6px}',
      '.wr .wr-chips button{font:inherit;font-size:13px;color:var(--wr-tx2);background:none;border:1px solid var(--wr-bd);border-radius:999px;padding:6px 11px;cursor:pointer;white-space:nowrap}',
      '.wr .wr-chips button.on{background:rgba(245,160,160,.16);border-color:var(--wr-acc);color:#ffd9d9;font-weight:600}',
      '.wr .wr-chips button small{color:var(--wr-dim);margin-left:4px;font-weight:400}',
      '.wr .wr-pre{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}',
      '.wr .wr-pre button{font:inherit;text-align:left;color:var(--wr-tx2);background:none;border:1px solid var(--wr-bd);border-radius:12px;padding:10px 12px;cursor:pointer}',
      '.wr .wr-pre button b{display:block;font-size:14px;color:var(--tx,#f5f5fa)}.wr .wr-pre button small{display:block;font-size:12px;color:var(--wr-dim);margin-top:2px}',

    try { const r = await fetch(w.url); if (!r.ok) throw new Error(r.status); entries.push({ name: w.name, data: new Uint8Array(await r.arrayBuffer()) }); }
    catch (e) { failed.push(w.name); }

  if (entries.length) {
    entries.push({ name: '_print_all.bat', data: printBat() });   // (0916) 폴더째 인쇄 — ASCII 전용 bat

    try { dropFile(makeZip(entries), `기출과제_${g.반}_${g.날짜.replace(/-/g, '').slice(4)}_${kind}.zip`); }
    catch (e) { btn.disabled = false; btn.textContent = '압축 실패 — 이름을 눌러 한 명씩'; return; }
  }
  btn.disabled = false;
  btn.textContent = !entries.length ? '하나도 못 받았다 — 링크가 만료됐으면 ↻' : failed.length ? `${entries.length}개 저장 · 실패 ${failed.length}` : `${entries.length}개 zip 저장됨 ✓`;
  setTimeout(() => { btn.textContent = orig; }, 8000);

function printBat() {

}

}

}
const CRC_T = (() => { const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); t[n] = c >>> 0; }

    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true);
    ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, time, true); ch.setUint16(14, date, true);
    ch.setUint32(16, crc, true); ch.setUint32(20, sz, true); ch.setUint32(24, sz, true);
    ch.setUint16(28, nm.length, true); ch.setUint16(30, 0, true); ch.setUint16(32, 0, true);
    ch.setUint16(34, 0, true); ch.setUint16(36, 0, true); ch.setUint32(38, 0, true);
    ch.setUint32(42, off, true);

  eo.setUint32(0, 0x06054b50, true); eo.setUint16(4, 0, true); eo.setUint16(6, 0, true);
  eo.setUint16(8, entries.length, true); eo.setUint16(10, entries.length, true);
  eo.setUint32(12, cdSize, true); eo.setUint32(16, off, true); eo.setUint16(20, 0, true);

}

/* 학생 개인 자료 — 개별과제 판 · 퍼스널/리플레이/커스텀 트레이닝 (포털 portal_hw_files 와 같은 매칭, 기간은 150일) */
async function stuRows(s) {
  const since = new Date(Date.now() - 150 * 864e5).toISOString();
  const { data, error } = await sb.from('job_queue').select('id,종류,상태,파라미터,결과,완료시각,요청시각')
    .in('종류', ['개별과제', '커스텀트레이닝', '기출과제']).eq('상태', '완료').gte('요청시각', since)
    .or(`파라미터->>반.eq.${s.반키},파라미터->>학생ID.eq.${s['학생ID']}`)
    .order('id', { ascending: false }).limit(800);
  if (error) throw error;
  const seen = {}, rows = [];
  for (const j of (data || [])) {
    const p = j['파라미터'] || {}, r = j['결과'] || {};
    const mine = p['학생ID'] === s['학생ID'] || (!p['학생ID'] && p['반'] === s.반키 && (!p['학생'] || p['학생'] === s['이름']));
    if (!mine) continue;
    const cnt = {}; for (const x of (r['학생'] || [])) if (Array.isArray(x)) cnt[x[0]] = x[1];
    for (const u of (r['업로드'] || [])) {
      if (u['이름'] !== s['이름']) continue;
      const nm = p['시험지명'] || '';
      const kind = j['종류'] === '개별과제' ? '개별과제' : j['종류'] === '커스텀트레이닝' ? '커스텀 트레이닝'
        : /리플레이/.test(nm) ? '리플레이 트레이닝' : '퍼스널 트레이닝';
      const day = p['날짜'] || String(j['완료시각'] || j['요청시각'] || '').slice(0, 10);
      const dk = kind === '개별과제' ? 'J' + j.id : kind + '|' + day + '|' + nm;   // 다시 구운 잡은 최신(id 큰 것) 하나만
      if (seen[dk]) continue; seen[dk] = 1;
      const files = [];
      const add = (k, key, url) => { if (key || url) files.push({ k, key: key || null, url: key ? null : (url || null) }); };
      add('문제', u['문제키'], u['문제url']); add('해설', u['해설키'], u['해설url']);
      if (!files.length) add('전체', u['키'], u['url']);
      rows.push({ 반: s.반키, 날짜: day, 종류: kind, 자료: kind === '개별과제' ? 'No.' + j.id : nm, 단원: '',
        문항: Array.isArray(u['문항']) ? u['문항'].length : (cnt[u['이름']] || ''), files });
    }
  }
  const keys = [...new Set(rows.flatMap(x => x.files.filter(f => f.key).map(f => f.key)))];
  if (keys.length) {
    const { data: sg } = await sb.storage.from('reports').createSignedUrls(keys, 3600);
    const m = {}; for (const d of (sg || [])) if (d.signedUrl) m[d.path] = d.signedUrl;
    for (const x of rows) for (const f of x.files) if (f.key) f.url = m[f.key] || null;
  }
  return rows;
}

/* 정렬 — 누른 순서대로 1·2·3 순위(1031 유강 규칙). 같은 머리를 다시 누르면 방향만 바꾼다. 빈칸은 늘 맨 뒤. */
function sortRows(rows, order) {
  return rows.slice().sort((a, b) => {
    for (const o of order) {
      const x = a[o.k], y = b[o.k], ex = x === '' || x == null, ey = y === '' || y == null;
      if (ex || ey) { if (ex !== ey) return ex ? 1 : -1; continue; }
      const c = (typeof x === 'number' && typeof y === 'number') ? x - y : String(x).localeCompare(String(y), 'ko', { numeric: true });
      if (c) return c * o.dir;
    }
    return 0;
  });
}
const safe = s => String(s || '').replace(/[\\/:*?"<>|]+/g, '').replace(/\s+/g, '_').replace(/_+/g, '_').replace(/^_|_$/g, '');
function fname(x, k) {

}
function hrefOf(f, name) { return f.lib ? f.url : f.url + (f.url.includes('?') ? '&' : '?') + 'download=' + encodeURIComponent(name); }

function drawList() {

      + `<td><input type="checkbox" class="pick" data-i="${idx}"></td></tr>`;
  });
  h += '</table>';

  $('#selall').onchange = e => document.querySelectorAll('input.pick').forEach(c => c.checked = e.target.checked);

}

async function zipSel(btn) {
  const kind = $('#zk').value, picks = [...document.querySelectorAll('input.pick:checked')].map(c => LIST[+c.dataset.i]).filter(Boolean);
  if (!picks.length) { btn.textContent = '먼저 오른쪽 칸을 체크'; setTimeout(() => { btn.textContent = '⤓ 선택한 것 받기 (zip)'; }, 3000); return; }
  const want = [], used = {};
  for (const x of picks) for (const f of x.files) {
    if (!f.url) continue;
    if (f.k === '문제' && kind === 's') continue;
    if (f.k === '해설' && kind === 'q') continue;
    let name = fname(x, f.k);
    if (used[name]) name = name.replace(/\.pdf$/, `_${++used[name]}.pdf`); else used[name] = 1;
    want.push({ name, url: f.url });
  }
  if (!want.length) { btn.textContent = '받을 파일이 없다'; return; }
  const orig = '⤓ 선택한 것 받기 (zip)'; btn.disabled = true;
  const entries = [], failed = [];
  for (const w of want) {
    btn.textContent = `받는 중… ${entries.length + failed.length + 1}/${want.length}`;
    try { const r = await fetch(w.url); if (!r.ok) throw new Error(r.status); entries.push({ name: w.name, data: new Uint8Array(await r.arrayBuffer()) }); }
    catch (e) { failed.push(w.name); }
  }
  if (entries.length) {
    entries.push({ name: '_print_all.bat', data: printBat() });
    entries.push({ name: '_읽어주세요.txt', data: readMeTxt() });
    btn.textContent = '압축하는 중…'; await new Promise(r => setTimeout(r, 0));
    const d = new Date(), md = String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
    try { dropFile(makeZip(entries), safe(`${LISTCTX.zip}_${md}`) + '.zip'); }
    catch (e) { btn.disabled = false; btn.textContent = '압축 실패 — 파일을 하나씩 받아 주세요'; return; }
  }
  btn.disabled = false;
  btn.textContent = !entries.length ? '하나도 못 받았다 — 링크가 만료됐으면 ↻' : failed.length ? `${entries.length}개 저장 · 실패 ${failed.length}` : `${entries.length}개 zip 저장됨 ✓`;
  setTimeout(() => { btn.textContent = orig; }, 8000);
}

}

  const s = (STU || []).find(x => x['학생ID'] === id); if (!s) return;
  history.replaceState(null, '', '?s=' + encodeURIComponent(id));
  $('#left').innerHTML = '<div class="msg">불러오는 중…</div>';
  let jr = [], lr = [], err = '';
  try { jr = await stuRows(s); } catch (e) { err += '개인 자료를 못 읽었다: ' + e.message + ' '; }
  try { await getLib(); lr = libRows(s.반키); } catch (e) { err += '반 자료 목록을 못 읽었다: ' + e.message; }
  SORT = [];
  LIST = [...jr, ...lr];
  $('#left').innerHTML = '<div id="wr-stu-box"><h3>오답 트레이닝 <small style="font-weight:400;color:var(--dim)">— 이 학생 과제 오답으로 만들기</small></h3><div id="wr-stu"></div></div><div id="stu-list"></div>';
  LISTCTX = {
    who: s['이름'], zip: '학생자료_' + s['이름'], target: '#stu-list',
    head: `<b>${E(s['이름'])}</b> ${E(s.반키)}${s['학교'] ? ' · ' + E(s['학교']) : ''} · 자료 <b>${LIST.length}</b>개 (개인 ${jr.length} · 반 ${lr.length})`
      + (err ? `<br><span style="color:var(--warn)">${E(err)}</span>` : ''),
    cols: [{ k: '날짜' }, { k: '종류' }, { k: '자료' }, { k: '단원' }, { k: '문항', num: 1 }],
    defSort: [{ k: '날짜', dir: -1 }, { k: '종류', dir: 1 }],
    note: '개인 자료 = 그 학생 포털 「과제 파일」과 같은 규칙(최근 150일, 개별과제는 닫힌 판도 보인다). 반 자료 = 그 반에 나간 써킷·교재·기출. '
      + 'PDF 링크는 1시간 유효 — 오래 열어 뒀으면 ↻. [선택한 것 받기] zip 을 폴더에 푼 뒤 _print_all.bat 을 더블클릭하면 전부 기본 프린터로 나간다.'
  };
  drawList();
  mountWrStu(s);
}

/* 써킷·교재·기출 (반 자료) */
async function libInit() {
  $('#left').innerHTML = '<div class="msg">불러오는 중…</div>';
  try { await getLib(); } catch (e) { $('#left').innerHTML = '<div class="msg">수업 자료 목록(lib.json)을 못 읽었다: ' + E(e.message) + '</div>'; return; }
  const bans = [...new Set([...(LIB['정규'] || []), ...(LIB['교재'] || [])].flatMap(e => banOf(e['반']))
    .concat((LIB['기출'] || []).flatMap(e => (e['시행'] || []).map(s => s['반']))))].filter(Boolean).sort();
  const sel = $('#lban');
  if (!sel.options.length) sel.innerHTML = '<option value="">전체 반</option>' + bans.map(b => `<option value="${E(b)}">${E(b)}</option>`).join('');
  const want = new URLSearchParams(location.search).get('b');
  if (want != null && [...sel.options].some(o => o.value === want)) sel.value = want;
  showLib();
}
function showLib() {
  const ban = $('#lban').value, kinds = [...document.querySelectorAll('#ctl-lib input[data-lk]:checked')].map(x => x.dataset.lk);
  history.replaceState(null, '', '?m=lib' + (ban ? '&b=' + encodeURIComponent(ban) : ''));
  SORT = [];
  LIST = libRows(ban).filter(x => kinds.includes(x.종류));
  LISTCTX = {
    who: '', zip: '반자료_' + (ban || '전체'),
    head: `<b>${E(ban || '전체 반')}</b> · ${E(kinds.join('·') || '종류 없음')} <b>${LIST.length}</b>개 · 목록 ${E((LIB || {})['생성'] || '')} 기준`,
    cols: [{ k: '반' }, { k: '날짜' }, { k: '종류' }, { k: '자료' }, { k: '단원' }],
    defSort: [{ k: '날짜', dir: -1 }, { k: '반', dir: 1 }],
    note: '학생 포털 「수업 자료」와 같은 목록이다. 써킷은 반·DAY 책자 그대로. 체크한 것을 [선택한 것 받기] 로 한 번에 받아 _print_all.bat 으로 인쇄한다.'
  };
  drawList();
}

const HINT = {
  grp: '문제 = 문제~빠른정답 · 해설 = 빠른정답~해설 · 링크는 1시간 유효',
  stu: '그 학생 포털에 있는 자료 전부 · 보기·받기만(체크·설정은 못 바꾼다)',
  lib: '반에 나간 써킷·교재·기출 책자',
  wr: '학생·조교가 만든 오답 트레이닝 · 다시 푼 결과 · 반 공통 오답'
};
async function setMode(m, first) {
  MODE = m;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  document.body.classList.toggle('wide', m !== 'grp');
  ['grp', 'stu', 'lib', 'wr'].forEach(k => { $('#ctl-' + k).hidden = k !== m; });
  $('#hint').textContent = HINT[m];
  $('#right').innerHTML = '<div class="empty">[보기] 를 누르면 여기서 미리 본다</div>';
  if (m === 'grp') { if (!first) history.replaceState(null, '', location.pathname); return load(); }
  if (m === 'stu') return stuInit();
  if (m === 'wr') return wrInit();
  return libInit();
}
/* ───────── (1115 P13) 오답 트레이닝 — 학생별 탭 대리 출제 · 「오답 트레이닝」 현황 탭 ─────────
   유강 1114 "포털에 탑재되는 오답 출제 기능을 조교들이 상시로 사용 · 학생이 제작한 자료에 대한 조회 및 다운로드".
   화면·원장 계산 = WR(_wr/wr_panel.js, 포털과 공용). DB = schema_v80 wr_staff_get / wr_staff_make / wr_staff_list (app_role admin·staff).
   조교는 학생 체크를 못 바꾼다(보기만). '조교만' 으로 만들면 학생 포털 목록에 안 뜬다(portal_hw_files v80). */
function mountWrStu(s) {
  const host = $('#wr-stu'); if (!host || typeof WR === 'undefined') return;
  host.innerHTML = '<div class="msg" style="padding:8px 0">오답 트레이닝 불러오는 중…</div>';
  WR.mount(host, {
    mode: 'staff', title: false,
    load: async () => { const { data, error } = await sb.rpc('wr_staff_get', { p_sid: s['학생ID'] }); if (error) throw error; return data; },
    make: async (spec, portal) => { const { data, error } = await sb.rpc('wr_staff_make', { p_sid: s['학생ID'], spec, p_portal: portal }); return error ? { 오류: error.message } : data; },
    link: async (j, k) => {
      const key = k === '문제' ? j['문제키'] : j['해설키'];
      if (!key) return k === '문제' ? j['문제url'] : j['해설url'];
      const { data } = await sb.storage.from('reports').createSignedUrl(key, 3600);  // 1117: download 옵션 빼고 새 탭에서 바로 보기(빈 탭 남던 것)
      return data && data.signedUrl;
    }
  });
}

/* 작은 정렬 표 — 누른 순서대로 1·2·3 순위, 첫 열 번호 (1031 유강 규칙) */
function miniTable(el, rows, cols) {
  const sort = [];
  const draw = () => {
    const rs = sortRows(rows, sort.length ? sort : []);
    el.innerHTML = '<table class="lst"><tr><th class="no">#</th>' + cols.map(c => {
      const i = sort.findIndex(x => x.k === c.k);
      return `<th class="srt" data-k="${c.k}" data-num="${c.num ? 1 : ''}">${E(c.label || c.k)}${i >= 0 ? `<span class="sb">${i + 1}${sort[i].dir > 0 ? '▲' : '▼'}</span>` : ''}</th>`;
    }).join('') + '</tr>' + rs.map((x, i) => `<tr><td class="no">${i + 1}</td>` + cols.map(c => `<td class="c-${c.k}">${c.html ? c.html(x) : E(x[c.k] ?? '')}</td>`).join('') + '</tr>').join('') + '</table>';
    el.querySelectorAll('th.srt').forEach(th => th.onclick = () => {
      const k = th.dataset.k, i = sort.findIndex(x => x.k === k);
      if (i >= 0) sort[i].dir *= -1; else sort.push({ k, dir: th.dataset.num ? -1 : 1 });
      draw();
    });
  };
  if (!rows.length) { el.innerHTML = '<div class="note">없다</div>'; return; }
  draw();
}

async function wrInit() {
  if (!await hasSession()) return;
  history.replaceState(null, '', '?m=wr&d=' + $('#wdays').value);
  $('#left').innerHTML = '<div class="msg">불러오는 중…</div>';
  const { data, error } = await sb.rpc('wr_staff_list', { p_days: +$('#wdays').value });
  if (error || !data || data['오류']) { $('#left').innerHTML = '<div class="msg">오답 트레이닝 현황을 못 읽었다: ' + E((error && error.message) || (data && data['오류']) || '') + '</div>'; return; }
  const J = data['자료'] || [];
  const keys = [...new Set(J.flatMap(j => [j['문제키'], j['해설키']]).filter(Boolean))];
  const m = {};
  for (let i = 0; i < keys.length; i += 200) {
    const { data: sg } = await sb.storage.from('reports').createSignedUrls(keys.slice(i, i + 200), 3600);
    for (const d of (sg || [])) if (d.signedUrl) m[d.path] = d.signedUrl;
  }
  SORT = [];
  LIST = J.map(j => ({
    날짜: String(j['요청'] || '').slice(0, 10), 반: j['반'] || '', 이름: j['이름'] || '', 종류: '오답 트레이닝',
    자료: (j['프리셋'] || '오답 트레이닝') + ' No.' + j.id, 단원: '',
    문항: j['문항'] || '', 상태: j['상태'] === '완료' ? '완료' : j['상태'] === '실패' ? '실패' : '만드는 중',
    체크: j['문항'] ? `${j['체크']}/${j['문항']}` : '', 한번에: j['체크'] ? Math.round(j['한번에'] * 100 / j['체크']) : '',
    만든이: j['만든이'] === '학생' ? '학생' : '조교' + (j['포털'] === false ? '(조교만)' : ''),
    files: j['상태'] === '완료' ? [{ k: '문제', url: m[j['문제키']] || null }, { k: '해설', url: m[j['해설키']] || null }] : []
  }));
  const nOpen = data['열림'];
  LISTCTX = {
    who: '', zip: '오답트레이닝_' + $('#wdays').value + '일', target: '#wr-list',
    head: `오답 트레이닝 최근 <b>${E($('#wdays').value)}</b>일 · 자료 <b>${LIST.length}</b>개`
      + (nOpen ? '' : ' · <span style="color:var(--warn)">제작 서버 준비 중(아직 만들기 닫힘)</span>'),
    cols: [{ k: '날짜' }, { k: '반' }, { k: '이름' }, { k: '자료' }, { k: '문항', num: 1 }, { k: '상태' }, { k: '체크' }, { k: '한번에', label: '한 번에%', num: 1 }, { k: '만든이' }],
    defSort: [{ k: '날짜', dir: -1 }],
    note: '체크 = 학생이 결과를 체크한 문항 수 / 전체 · 한 번에% = 체크한 것 중 ①한 번에 맞음 비율. 만들기는 「학생별」 탭에서 학생을 고르면 위에 나온다.'
  };
  $('#left').innerHTML = '<div id="wr-list"></div>'
    + '<h3 class="wr-sec">학생별 참여</h3><div id="wr-part"></div>'
    + '<h3 class="wr-sec">다시 풀어도 또 틀리는 문항</h3><div id="wr-again"></div>'
    + '<h3 class="wr-sec">반 절반 이상이 틀린 공통과제 문항 <small>— 개인 오답보다 수업에서 다시 다룰 것</small></h3><div id="wr-common"></div>';
  drawList();
  miniTable($('#wr-part'), (data['참여'] || []).map(p => ({ 반: p['반'] || '', 이름: p['이름'] || '', 학생제작: p['학생제작'], 조교제작: p['조교제작'],
    다시푼원문항: p['원문항체크'], 한번에: p['원문항체크'] ? Math.round(p['한번에'] * 100 / p['원문항체크']) : '' })),
    [{ k: '반' }, { k: '이름' }, { k: '학생제작', label: '학생 제작', num: 1 }, { k: '조교제작', label: '조교 제작', num: 1 }, { k: '다시푼원문항', label: '다시 푼 원문항', num: 1 }, { k: '한번에', label: '한 번에%', num: 1 }]);
  miniTable($('#wr-again'), (data['또틀림'] || []).map(x => ({ 문항: x['문항ID'], 유형: x['유형'] || '', 학생: x['학생'], 횟수: x['횟수'] })),
    [{ k: '문항' }, { k: '유형' }, { k: '학생', label: '학생 수', num: 1 }, { k: '횟수', num: 1 }]);
  miniTable($('#wr-common'), (data['반공통'] || []).map(x => ({ 날짜: x['날짜'], 반: x['반'], 과제: x['과제'] || '', 번호: x['번호'], 유형: x['유형'] || '',
    오답률: x['체크'] ? Math.round(x['오답'] * 100 / x['체크']) : 0, 인원: `${x['오답']}/${x['체크']}` })),
    [{ k: '날짜' }, { k: '반' }, { k: '과제' }, { k: '번호', num: 1 }, { k: '유형' }, { k: '오답률', label: '오답률%', num: 1 }, { k: '인원' }]);
}
