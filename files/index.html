<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>과제 파일 · 수학은유강</title>
<meta name="robots" content="noindex, nofollow">
<!-- ⚠ 버전을 박는다 (콘솔·포털과 같은 버전) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2/dist/umd/supabase.min.js"></script>
<style>
:root{color-scheme:dark;
 --bg:#0a0a0f; --card:rgba(255,255,255,.03); --bd:rgba(255,255,255,.08);
 --tx:#f5f5fa; --tx2:#b8b8c5; --dim:#8a8a98; --acc:#f5a0a0; --good:#c8f0da; --warn:#ffd48a;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.brand{font-weight:800;color:var(--acc)}
header .t{font-weight:700;font-size:16px}
header .dim{color:var(--dim);font-size:12px}
select{font:inherit;color:var(--tx);background:#15151d;border:1px solid var(--bd);border-radius:8px;padding:6px 10px}
.wrap{display:grid;grid-template-columns:minmax(420px,520px) 1fr;gap:0;height:calc(100vh - 52px)}
.left{overflow:auto;padding:12px 14px;border-right:1px solid var(--bd)}
.right{background:#111118;display:flex;flex-direction:column}
.right .bar{padding:8px 12px;color:var(--tx2);font-size:13px;border-bottom:1px solid var(--bd);display:flex;gap:10px;align-items:center}
.right iframe{flex:1;border:0;width:100%;background:#fff}
.right .empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--dim)}
table{width:100%;border-collapse:collapse}
th{font-size:11.5px;color:var(--dim);font-weight:600;text-align:left;padding:4px 6px;border-bottom:1px solid var(--bd);letter-spacing:.04em}
td{padding:7px 6px;border-bottom:1px solid var(--bd);vertical-align:middle}
tr.sel td{background:rgba(245,160,160,.07)}
td.nm{font-weight:700;font-size:15px}
td.nm small{display:block;font-weight:400;color:var(--dim);font-size:11.5px}
a.f{display:inline-block;font:inherit;font-size:13px;color:var(--tx);background:rgba(255,255,255,.05);border:1px solid var(--bd);
 border-radius:8px;padding:4px 9px;margin:0 3px 0 0;text-decoration:none;white-space:nowrap}
a.f.q{border-color:rgba(200,240,218,.35)} a.f.s{border-color:rgba(245,160,160,.35)}
a.f small{color:var(--dim);margin-left:3px}
button.pv{font:inherit;font-size:12px;color:var(--tx2);background:transparent;border:1px solid var(--bd);border-radius:8px;padding:4px 8px;cursor:pointer}
button.pv.on{color:var(--acc);border-color:rgba(245,160,160,.5)}
@media (hover:hover) and (pointer:fine){ a.f:hover,button.pv:hover{border-color:rgba(255,255,255,.3)} }
.miss{margin:12px 0 0;padding:9px 11px;border:1px solid rgba(255,212,138,.35);border-radius:10px;color:var(--warn);font-size:13px}
.miss b{display:block;margin-bottom:3px}
.note{color:var(--dim);font-size:12px;margin:10px 0 0;line-height:1.55}
.msg{padding:40px 20px;color:var(--dim)} .msg a{color:var(--acc)}
.sum{color:var(--tx2);font-size:13px;margin:0 0 8px}
.sum b{color:var(--tx)}
@media (max-width:900px){ .wrap{grid-template-columns:1fr;height:auto} .right{min-height:70vh} }
</style></head>
<body>
<header>
  <span class="brand">수학은유강</span><span class="t">기출과제 파일</span>
  <select id="grp"></select>
  <button class="pv" id="reload" title="작업 현황 다시 읽기">↻</button>
  <span class="dim">문제 = 문제~빠른정답 · 해설 = 빠른정답~해설 · 링크는 1시간 유효</span>
</header>
<div class="wrap">
  <div class="left" id="left"><div class="msg">불러오는 중…</div></div>
  <div class="right" id="right"><div class="empty">이름 옆 [보기] 를 누르면 여기서 미리 본다</div></div>
</div>
<script>
const SB_URL = 'https://bkgerndnwukvuuqdgnxt.supabase.co';
const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJrZ2VybmRud3VrdnV1cWRnbnh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyNjA3MzgsImV4cCI6MjEwMTgzNjczOH0.VcfcTc9QkecKWFPUiYVXKGEXLxmVp8ugfiF6EV5_kjk';
/* 콘솔(/dashboard/)과 같은 오리진·같은 프로젝트라 로그인 세션을 그대로 쓴다 — 여기서 따로 로그인시키지 않는다. */
const sb = supabase.createClient(SB_URL, SB_ANON);
const E = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = s => document.querySelector(s);
let JOBS = [], GROUPS = {}, CUR = null;

async function load() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    $('#left').innerHTML = '<div class="msg">로그인이 필요하다. <a href="https://ukan8.github.io/dashboard/" target="_blank" rel="noopener">콘솔</a>에서 로그인한 뒤 이 페이지를 새로고침.</div>';
    return;
  }
  const { data, error } = await sb.from('job_queue').select('id,종류,상태,요청자,파라미터,결과,메시지,요청시각,완료시각')
    .eq('종류', '기출과제').order('id', { ascending: false }).limit(400);
  if (error) { $('#left').innerHTML = '<div class="msg">작업 현황을 못 읽었다: ' + E(error.message) + '</div>'; return; }
  JOBS = data || [];
  GROUPS = {};
  for (const j of JOBS) {
    const p = j['파라미터'] || {};
    if (!p['반'] || !p['날짜']) continue;
    const k = p['반'] + ' · ' + p['날짜'];
    (GROUPS[k] = GROUPS[k] || { 반: p['반'], 날짜: p['날짜'], 시험지명: p['시험지명'] || '', jobs: [] }).jobs.push(j);
  }
  const keys = Object.keys(GROUPS).sort((a, b) => GROUPS[b].날짜.localeCompare(GROUPS[a].날짜) || a.localeCompare(b));
  const sel = $('#grp');
  sel.innerHTML = keys.map(k => `<option value="${E(k)}">${E(k)}${GROUPS[k].시험지명 ? ' — ' + E(GROUPS[k].시험지명) : ''}</option>`).join('');
  const want = new URLSearchParams(location.search).get('g');
  sel.value = (want && GROUPS[want]) ? want : keys[0];
  await show(sel.value);
}

async function show(k) {
  const g = GROUPS[k]; CUR = k;
  if (!g) { $('#left').innerHTML = '<div class="msg">기출과제 작업이 없다</div>'; return; }
  history.replaceState(null, '', '?g=' + encodeURIComponent(k));
  /* 학생별 잡(자평 체인)과 반 전체 잡(마감 백스톱)이 섞여 있다 — 이름으로 합치고 최신 잡이 이긴다 */
  const rows = {}, fails = [], pending = [];
  const jobsAsc = g.jobs.slice().sort((a, b) => a.id - b.id);
  for (const j of jobsAsc) {
    const p = j['파라미터'] || {}, r = j['결과'] || {};
    if (j['상태'] === '완료' && Array.isArray(r['업로드']) && r['업로드'].length) {
      const cnt = {}; for (const s of (r['학생'] || [])) if (Array.isArray(s)) cnt[s[0]] = s[1];
      for (const f of r['업로드']) rows[f['이름']] = { ...f, 문항: cnt[f['이름']], 잡: j.id, 시각: j['완료시각'] };
    } else if (j['상태'] === '실패' || (j['상태'] === '완료' && p['학생'] && !(r['업로드'] || []).length)) {
      fails.push({ 이름: p['학생'] || '(반 전체)', 메시지: j['메시지'] || '', 잡: j.id });
    } else if (j['상태'] === '요청' || j['상태'] === '진행' || j['상태'] === '처리중') {
      pending.push({ 이름: p['학생'] || '(반 전체)', 상태: j['상태'], 잡: j.id });
    }
  }
  const names = Object.keys(rows).sort((a, b) => a.localeCompare(b, 'ko'));
  /* 서명 URL 은 한 번에 — 학생당 전체·문제·해설 세 개 */
  const paths = [];
  for (const n of names) for (const key of ['키', '문제키', '해설키']) if (rows[n][key]) paths.push(rows[n][key]);
  const urls = {};
  if (paths.length) {
    const { data } = await sb.storage.from('reports').createSignedUrls(paths, 3600);
    for (const d of (data || [])) if (d.signedUrl) urls[d.path] = d.signedUrl;
  }
  const dl = (u, name) => u ? u + '&download=' + encodeURIComponent(name) : '';
  let html = `<p class="sum"><b>${E(g.반)} ${E(g.날짜)}</b> · PDF <b>${names.length}</b>명` +
    (fails.length ? ` · <span style="color:var(--warn)">없음 ${fails.length}</span>` : '') +
    (pending.length ? ` · 만드는 중 ${pending.length}` : '') +
    (names.length ? ` <button class="pv" id="zipall" style="margin-left:8px">⤓ 전체 받기 (${names.length}명 · zip)</button>`
      + ` <select id="zipkind" style="padding:3px 8px;font-size:12px"><option value="q">문제만</option><option value="s">해설만</option><option value="qs">문제+해설</option><option value="all">전체 파일</option></select>` : '') + '</p>';
  html += '<table><tr><th>학생</th><th>파일</th><th></th></tr>';
  for (const n of names) {
    const f = rows[n], u0 = urls[f['키']], u1 = f['문제키'] && urls[f['문제키']], u2 = f['해설키'] && urls[f['해설키']];
    const nm = n.length >= 3 ? n.slice(1) : n;
    html += `<tr data-n="${E(n)}"><td class="nm">${E(nm)}<small>${f.문항 ? '유형 ' + E(f.문항) + '문항 · ' : ''}${f['문제쪽'] ? (f['문제쪽'] + f['해설쪽'] - 1) + '쪽' : ''}</small></td><td>` +
      (u1 ? `<a class="f q" href="${dl(u1, n + '_문제.pdf')}" target="_blank" rel="noopener">문제<small>${f['문제쪽']}쪽</small></a>` : '') +
      (u2 ? `<a class="f s" href="${dl(u2, n + '_해설.pdf')}" target="_blank" rel="noopener">해설<small>${f['해설쪽']}쪽</small></a>` : '') +
      (u0 ? `<a class="f" href="${dl(u0, n + '.pdf')}" target="_blank" rel="noopener" style="opacity:.75">전체</a>` : '<span class="dim">링크 실패</span>') +
      (!u1 && u0 ? ' <span style="color:var(--dim);font-size:11.5px">(분할 전 잡)</span>' : '') +
      `</td><td><button class="pv" data-u="${E(u1 || u0 || '')}" data-n="${E(nm)}">보기</button></td></tr>`;
  }
  html += '</table>';
  if (fails.length) html += '<div class="miss"><b>PT 없음 ' + fails.length + '명</b>' +
    fails.map(x => E(x.이름) + ' — ' + E((x.메시지 || '').slice(0, 90)) + ' <span style="opacity:.6">#' + x.잡 + '</span>').join('<br>') + '</div>';
  if (pending.length) html += '<div class="note">만드는 중: ' + pending.map(x => E(x.이름) + '(' + E(x.상태) + ')').join(', ') + ' — 1~2분 뒤 ↻</div>';
  html += '<div class="note">문제 파일과 해설 파일에 빠른정답 장이 둘 다 들어 있다. 파일명은 학생 이름으로 떨어진다. '
    + '"분할 전 잡"은 전체 파일만 있다 — 필요하면 세션에 재분할을 시킨다. [전체 받기] zip 안의 <b>_전체인쇄.bat</b> 을 더블클릭하면 그 폴더 PDF 가 전부 기본 프린터로 나간다(옆의 _print.ps1 이 본체 — 둘 다 같은 폴더에 풀 것. SumatraPDF 있으면 조용히, 없으면 Acrobat Reader).</div>';
  $('#left').innerHTML = html;
  document.querySelectorAll('button.pv[data-u]').forEach(b => b.onclick = () => preview(b));
  const zb = $('#zipall'); if (zb) zb.onclick = () => zipAll(zb, g, names, rows, urls);
}

/* ── 전체 받기 (0908 유강) — 서명 URL 로 하나씩 받아 무압축 zip 한 파일로. 파일명=학생이름_문제.pdf.
   조회(app.js) makeZip 과 같은 store zip. 브라우저 다운로드 한 번에 끝난다. */
async function zipAll(btn, g, names, rows, urls) {
  const kind = ($('#zipkind') || {}).value || 'q';
  const want = [];
  for (const n of names) {
    const f = rows[n];
    const add = (key, suf) => { const u = f[key] && urls[f[key]]; if (u) want.push({ name: n + suf + '.pdf', url: u }); };
    if (kind === 'q' || kind === 'qs') add('문제키', '_문제');
    if (kind === 's' || kind === 'qs') add('해설키', '_해설');
    if (kind === 'all' || (kind !== 'all' && !f['문제키'] && !f['해설키'])) add('키', '');   // 분할 전 잡은 전체 파일로
  }
  if (!want.length) { btn.textContent = '받을 파일이 없다'; return; }
  const orig = btn.textContent; btn.disabled = true;
  const entries = [], failed = [];
  for (const w of want) {
    btn.textContent = `받는 중… ${entries.length + failed.length + 1}/${want.length}`;
    try { const r = await fetch(w.url); if (!r.ok) throw new Error(r.status); entries.push({ name: w.name, data: new Uint8Array(await r.arrayBuffer()) }); }
    catch (e) { failed.push(w.name); }
  }
  if (entries.length) {
    entries.push({ name: '_전체인쇄.bat', data: new TextEncoder().encode(printBat()) });               // (0908 유강) 폴더째 인쇄 — ASCII 실행기
    entries.push({ name: '_print.ps1', data: new Uint8Array([0xEF, 0xBB, 0xBF, ...new TextEncoder().encode(printPs1())]) });   // (0909) 본체, UTF-8 BOM
    btn.textContent = '압축하는 중…'; await new Promise(r => setTimeout(r, 0));
    try { dropFile(makeZip(entries), `기출과제_${g.반}_${g.날짜.replace(/-/g, '').slice(4)}_${kind}.zip`); }
    catch (e) { btn.disabled = false; btn.textContent = '압축 실패 — 이름을 눌러 한 명씩'; return; }
  }
  btn.disabled = false;
  btn.textContent = !entries.length ? '하나도 못 받았다 — 링크가 만료됐으면 ↻' : failed.length ? `${entries.length}개 저장 · 실패 ${failed.length}` : `${entries.length}개 zip 저장됨 ✓`;
  setTimeout(() => { btn.textContent = orig; }, 8000);
}
/* zip 에 같이 들어가는 인쇄 배치 — 압축 푼 폴더에서 _전체인쇄.bat 더블클릭 → 그 폴더의 PDF 를 전부 기본 프린터로.
   SumatraPDF 가 있으면 그것(조용히 순서대로, 부수 1 강제), 없으면 기본 PDF 앱의 인쇄 동사(Acrobat Reader 권장 — Edge 는 창이 뜬다).
   (0909 실사고 ①) 조교컴에서 학생당 5부 — 사용자 인쇄 기본설정은 1이었다 → 시작 때 실제 적용 부수를 찍고 Sumatra 는 -print-settings "1x".
   (0909 실사고 ②) bat 에 한글 + chcp 65001 이면 cmd 가 다음 줄 읽기 위치를 틀려 엉뚱한 명령이 된다(Win11 실측) →
   bat 은 ASCII 실행기만(파일명도 ASCII: _print.ps1), 본체는 PowerShell(UTF-8 BOM). 두 파일이 같은 폴더에 있어야 한다. */
function printBat() {
  return [
    '@echo off', 'cd /d "%~dp0"',
    'if not exist "%~dp0_print.ps1" ( echo _print.ps1 missing - unzip ALL files into one folder & pause & exit /b 1 )',
    'powershell -NoProfile -ExecutionPolicy Bypass -File "%~dp0_print.ps1"',
    'pause', ''].join('\r\n');   // ⚠ bat 은 ASCII 만 — 한글 파일명·메시지 금지(chcp 없이 cp949 로 읽힌다)
}
function printPs1() {
  return [
    '# _print.ps1 — 이 폴더의 PDF 를 기본 프린터로 전부 인쇄 (_전체인쇄.bat 이 호출한다)',
    'Set-Location -LiteralPath $PSScriptRoot',
    '$pdfs = Get-ChildItem -LiteralPath . -Filter *.pdf | Sort-Object Name',
    'if (-not $pdfs) { Write-Host "  이 폴더에 PDF 가 없다. zip 을 전부 풀었는지 확인."; exit 1 }',
    '$d = (Get-CimInstance Win32_Printer | Where-Object Default).Name',
    '$c = (Get-CimInstance Win32_PrinterConfiguration | Where-Object Name -eq $d).Copies',
    'Write-Host ""',
    'Write-Host ("  이 폴더의 PDF {0}개를 기본 프린터로 전부 인쇄합니다." -f $pdfs.Count)',
    'Write-Host ("  기본 프린터: {0}   /   적용 부수: {1}" -f $d, $c)',
    'if ($c -and [int]$c -ne 1) { Write-Host "  !! 부수가 1이 아니다 — 프린터 속성 > 고급 > 인쇄 기본값도 확인할 것 (Sumatra 경로는 1부로 강제한다)" }',
    'Write-Host "  (양면 설정도 먼저 확인)"',
    'Write-Host ""',
    '$a = Read-Host "  시작할까요 (Y/N)"',
    'if ($a -notmatch "^[yY]") { exit }',
    '$sum = @("$env:LOCALAPPDATA\\SumatraPDF\\SumatraPDF.exe", "$env:ProgramFiles\\SumatraPDF\\SumatraPDF.exe", "${env:ProgramFiles(x86)}\\SumatraPDF\\SumatraPDF.exe") | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1',
    'foreach ($f in $pdfs) {',
    '  Write-Host ("  인쇄: {0}" -f $f.Name)',
    '  if ($sum) { & $sum -print-to-default -print-settings "1x" -silent -exit-when-done $f.FullName | Out-Null }',
    '  else { Start-Process -FilePath $f.FullName -Verb Print; Start-Sleep -Seconds 3 }',
    '}',
    'if (-not $sum) { Write-Host "  SumatraPDF 없음 - 기본 PDF 앱으로 보냈다 (Acrobat Reader 권장)" }',
    'Write-Host ""',
    'Write-Host "  끝. 프린터 대기열을 확인하세요."',
    ''].join('\r\n');
}
function dropFile(blob, filename) {
  const u = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = u; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 8000);
}
const CRC_T = (() => { const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); t[n] = c >>> 0; }
  return t; })();
function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function makeZip(entries) {                       // [{name, data:Uint8Array}] → Blob
  const enc = new TextEncoder(), d = new Date();
  const time = ((d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1)) & 0xFFFF;
  const date = (((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate()) & 0xFFFF;
  const body = [], cd = []; let off = 0, cdSize = 0;
  for (const e of entries) {
    const nm = enc.encode(e.name), crc = crc32(e.data), sz = e.data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
    lh.setUint16(8, 0, true);                     // 0 = store (무압축)
    lh.setUint16(10, time, true); lh.setUint16(12, date, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, sz, true); lh.setUint32(22, sz, true);
    lh.setUint16(26, nm.length, true); lh.setUint16(28, 0, true);
    body.push(new Uint8Array(lh.buffer), nm, e.data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true);
    ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, time, true); ch.setUint16(14, date, true);
    ch.setUint32(16, crc, true); ch.setUint32(20, sz, true); ch.setUint32(24, sz, true);
    ch.setUint16(28, nm.length, true); ch.setUint16(30, 0, true); ch.setUint16(32, 0, true);
    ch.setUint16(34, 0, true); ch.setUint16(36, 0, true); ch.setUint32(38, 0, true);
    ch.setUint32(42, off, true);
    cd.push(new Uint8Array(ch.buffer), nm);
    off += 30 + nm.length + sz; cdSize += 46 + nm.length;
  }
  const eo = new DataView(new ArrayBuffer(22));
  eo.setUint32(0, 0x06054b50, true); eo.setUint16(4, 0, true); eo.setUint16(6, 0, true);
  eo.setUint16(8, entries.length, true); eo.setUint16(10, entries.length, true);
  eo.setUint32(12, cdSize, true); eo.setUint32(16, off, true); eo.setUint16(20, 0, true);
  return new Blob([...body, ...cd, new Uint8Array(eo.buffer)], { type: 'application/zip' });
}


function preview(b) {
  const u = b.dataset.u; if (!u) return;
  document.querySelectorAll('button.pv.on').forEach(x => x.classList.remove('on'));
  document.querySelectorAll('tr.sel').forEach(x => x.classList.remove('sel'));
  b.classList.add('on'); b.closest('tr').classList.add('sel');
  $('#right').innerHTML = `<div class="bar"><b>${E(b.dataset.n)}</b> <span style="opacity:.7">문제 파일 미리보기</span>`
    + `<a class="f" href="${u}" target="_blank" rel="noopener" style="margin-left:auto">새 탭에서 열기</a></div>`
    + `<iframe src="${u}#toolbar=1"></iframe>`;
}

$('#grp').onchange = e => show(e.target.value);
$('#reload').onclick = () => load();
load();
</script>
