<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>학생 자료실 · 수학은유강</title>
<meta name="robots" content="noindex, nofollow">
<!-- ⚠ 버전을 박는다 (콘솔·포털과 같은 버전) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2/dist/umd/supabase.min.js"></script>
<style>
:root{color-scheme:dark;
 --bg:#0a0a0f; --card:rgba(255,255,255,.03); --bd:rgba(255,255,255,.08);
 --tx:#f5f5fa; --tx2:#b8b8c5; --dim:#8a8a98; --acc:#f5a0a0; --good:#c8f0da; --warn:#ffd48a;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.brand{font-weight:800;color:var(--acc)}
header .t{font-weight:700;font-size:16px}
header .dim{color:var(--dim);font-size:12px}
select{font:inherit;color:var(--tx);background:#15151d;border:1px solid var(--bd);border-radius:8px;padding:6px 10px}
.wrap{display:grid;grid-template-columns:minmax(420px,520px) 1fr;gap:0;height:calc(100vh - 52px)}
.left{overflow:auto;padding:12px 14px;border-right:1px solid var(--bd)}
.right{background:#111118;display:flex;flex-direction:column}
.right .bar{padding:8px 12px;color:var(--tx2);font-size:13px;border-bottom:1px solid var(--bd);display:flex;gap:10px;align-items:center}
.right iframe{flex:1;border:0;width:100%;background:#fff}
.right .empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--dim)}
table{width:100%;border-collapse:collapse}
th{font-size:11.5px;color:var(--dim);font-weight:600;text-align:left;padding:4px 6px;border-bottom:1px solid var(--bd);letter-spacing:.04em}
td{padding:7px 6px;border-bottom:1px solid var(--bd);vertical-align:middle}
tr.sel td{background:rgba(245,160,160,.07)}
td.nm{font-weight:700;font-size:15px}
td.nm small{display:block;font-weight:400;color:var(--dim);font-size:11.5px}
a.f{display:inline-block;font:inherit;font-size:13px;color:var(--tx);background:rgba(255,255,255,.05);border:1px solid var(--bd);
 border-radius:8px;padding:4px 9px;margin:0 3px 0 0;text-decoration:none;white-space:nowrap}
a.f.q{border-color:rgba(200,240,218,.35)} a.f.s{border-color:rgba(245,160,160,.35)}
a.f small{color:var(--dim);margin-left:3px}
button.pv{font:inherit;font-size:12px;color:var(--tx2);background:transparent;border:1px solid var(--bd);border-radius:8px;padding:4px 8px;cursor:pointer}
button.pv.on{color:var(--acc);border-color:rgba(245,160,160,.5)}
@media (hover:hover) and (pointer:fine){ a.f:hover,button.pv:hover{border-color:rgba(255,255,255,.3)} }
.miss{margin:12px 0 0;padding:9px 11px;border:1px solid rgba(255,212,138,.35);border-radius:10px;color:var(--warn);font-size:13px}
.miss b{display:block;margin-bottom:3px}
.note{color:var(--dim);font-size:12px;margin:10px 0 0;line-height:1.55}
.msg{padding:40px 20px;color:var(--dim)} .msg a{color:var(--acc)}
.sum{color:var(--tx2);font-size:13px;margin:0 0 8px}
.sum b{color:var(--tx)}
.tabs{display:inline-flex;gap:4px}
.tab{font:inherit;font-size:13px;color:var(--tx2);background:transparent;border:1px solid var(--bd);border-radius:8px;padding:5px 11px;cursor:pointer}
.tab.on{color:var(--tx);border-color:rgba(245,160,160,.6);background:rgba(245,160,160,.10);font-weight:700}
.ctl{display:inline-flex;gap:8px;align-items:center;font-size:13px;color:var(--tx2)}
.ctl[hidden]{display:none}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 8px;font-size:13px;color:var(--tx2)}
table.lst th.srt{cursor:pointer;user-select:none}
table.lst th.srt:hover{color:var(--tx)}
table.lst .sb{margin-left:3px;color:var(--acc);font-size:10.5px}
table.lst td,table.lst th.no{font-size:13px}
table.lst td.no,table.lst th.no{color:var(--dim);width:2.4em;text-align:right;padding-right:8px}
table.lst td.c-자료{font-weight:700}
table.lst td.c-날짜{white-space:nowrap;color:var(--tx2)}
table.lst td.fl{white-space:nowrap}
@media (max-width:900px){ .wrap{grid-template-columns:1fr;height:auto} .right{min-height:70vh} }
</style></head>
<body>
<header>
  <span class="brand">수학은유강</span><span class="t">학생 자료실</span>
  <span class="tabs"><button class="tab" data-m="stu">학생별</button><button class="tab" data-m="lib">써킷·교재·기출</button><button class="tab" data-m="grp">반·날짜별 과제</button></span>
  <span class="ctl" id="ctl-grp"><select id="grp"></select></span>
  <span class="ctl" id="ctl-stu" hidden><select id="sban"></select> <select id="sstu"></select></span>
  <span class="ctl" id="ctl-lib" hidden><select id="lban"></select>
    <label><input type="checkbox" data-lk="써킷" checked> 써킷</label>
    <label><input type="checkbox" data-lk="교재" checked> 교재</label>
    <label><input type="checkbox" data-lk="기출" checked> 기출</label></span>
  <button class="pv" id="reload" title="다시 읽기">↻</button>
  <span class="dim" id="hint">문제 = 문제~빠른정답 · 해설 = 빠른정답~해설 · 링크는 1시간 유효</span>
</header>
<div class="wrap">
  <div class="left" id="left"><div class="msg">불러오는 중…</div></div>
  <div class="right" id="right"><div class="empty">이름 옆 [보기] 를 누르면 여기서 미리 본다</div></div>
</div>
<script>
const SB_URL = 'https://bkgerndnwukvuuqdgnxt.supabase.co';
const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJrZ2VybmRud3VrdnV1cWRnbnh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyNjA3MzgsImV4cCI6MjEwMTgzNjczOH0.VcfcTc9QkecKWFPUiYVXKGEXLxmVp8ugfiF6EV5_kjk';
/* 콘솔(/dashboard/)과 같은 오리진·같은 프로젝트라 로그인 세션을 그대로 쓴다 — 여기서 따로 로그인시키지 않는다. */
const sb = supabase.createClient(SB_URL, SB_ANON);
const E = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = s => document.querySelector(s);
let JOBS = [], GROUPS = {}, CUR = null;

async function load() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    $('#left').innerHTML = '<div class="msg">로그인이 필요하다. <a href="https://ukan8.github.io/dashboard/" target="_blank" rel="noopener">콘솔</a>에서 로그인한 뒤 이 페이지를 새로고침.</div>';
    return;
  }
  const { data, error } = await sb.from('job_queue').select('id,종류,상태,요청자,파라미터,결과,메시지,요청시각,완료시각')
    .in('종류', ['기출과제', '커스텀트레이닝', '개별과제']).order('id', { ascending: false }).limit(400);   // (0924) 커스텀은 따로 묶는다
  if (error) { $('#left').innerHTML = '<div class="msg">작업 현황을 못 읽었다: ' + E(error.message) + '</div>'; return; }
  JOBS = data || [];
  GROUPS = {};
  for (const j of JOBS) {
    const p = j['파라미터'] || {};
    if (!p['반'] || !p['날짜']) continue;
    const ct = j['종류'] === '커스텀트레이닝';          // 같은 날 같은 학생의 PT 를 덮지 않게 묶음을 가른다
    const rp = /리플레이/.test(p['시험지명'] || '');    // (1005) 리플레이 트레이닝도 따로 — 1002 누적판이 같은 반·날짜 PT 를 이름으로 덮었다
    const hw = j['종류'] === '개별과제';               // (1021) 써킷 개별과제 — 잡 종류가 따로라 안 보였다
    const k = p['반'] + ' · ' + p['날짜'] + (hw ? ' · 개별과제' : ct ? ' · 커스텀' : rp ? ' · 리플레이' : '');
    (GROUPS[k] = GROUPS[k] || { 반: p['반'], 날짜: p['날짜'], 시험지명: hw ? '개별과제' : ct ? '커스텀 트레이닝' : (p['시험지명'] || ''), jobs: [] }).jobs.push(j);
  }
  const keys = Object.keys(GROUPS).sort((a, b) => GROUPS[b].날짜.localeCompare(GROUPS[a].날짜) || a.localeCompare(b));
  const sel = $('#grp');
  sel.innerHTML = keys.map(k => `<option value="${E(k)}">${E(k)}${GROUPS[k].시험지명 ? ' — ' + E(GROUPS[k].시험지명) : ''}</option>`).join('');
  const want = new URLSearchParams(location.search).get('g');
  sel.value = (want && GROUPS[want]) ? want : keys[0];
  await show(sel.value);
}

async function show(k) {
  const g = GROUPS[k]; CUR = k;
  if (!g) { $('#left').innerHTML = '<div class="msg">기출과제 작업이 없다</div>'; return; }
  history.replaceState(null, '', '?g=' + encodeURIComponent(k));
  /* 학생별 잡(자평 체인)과 반 전체 잡(마감 백스톱)이 섞여 있다 — 이름으로 합치고 최신 잡이 이긴다 */
  const rows = {}, fails = [], pending = [];
  const jobsAsc = g.jobs.slice().sort((a, b) => a.id - b.id);
  for (const j of jobsAsc) {
    const p = j['파라미터'] || {}, r = j['결과'] || {};
    if (j['상태'] === '완료' && Array.isArray(r['업로드']) && r['업로드'].length) {
      const cnt = {}; for (const s of (r['학생'] || [])) if (Array.isArray(s)) cnt[s[0]] = s[1];
      for (const f of r['업로드']) rows[f['이름']] = { ...f, 문항: cnt[f['이름']], 잡: j.id, 시각: j['완료시각'] };
    } else if (j['상태'] === '실패' || (j['상태'] === '완료' && p['학생'] && !(r['업로드'] || []).length)) {
      fails.push({ 이름: p['학생'] || '(반 전체)', 메시지: j['메시지'] || '', 잡: j.id });
    } else if (j['상태'] === '요청' || j['상태'] === '진행' || j['상태'] === '처리중') {
      pending.push({ 이름: p['학생'] || '(반 전체)', 상태: j['상태'], 잡: j.id });
    }
  }
  const names = Object.keys(rows).sort((a, b) => a.localeCompare(b, 'ko'));
  /* 서명 URL 은 한 번에 — 학생당 전체·문제·해설 세 개 */
  const paths = [];
  for (const n of names) for (const key of ['키', '문제키', '해설키']) if (rows[n][key]) paths.push(rows[n][key]);
  const urls = {};
  if (paths.length) {
    const { data } = await sb.storage.from('reports').createSignedUrls(paths, 3600);
    for (const d of (data || [])) if (d.signedUrl) urls[d.path] = d.signedUrl;
  }
  const dl = (u, name) => u ? u + '&download=' + encodeURIComponent(name) : '';
  let html = `<p class="sum"><b>${E(g.반)} ${E(g.날짜)}</b> · PDF <b>${names.length}</b>명` +
    (fails.length ? ` · <span style="color:var(--warn)">없음 ${fails.length}</span>` : '') +
    (pending.length ? ` · 만드는 중 ${pending.length}` : '') +
    (names.length ? ` <button class="pv" id="zipall" style="margin-left:8px">⤓ 전체 받기 (${names.length}명 · zip)</button>`
      + ` <select id="zipkind" style="padding:3px 8px;font-size:12px"><option value="q">문제만</option><option value="s">해설만</option><option value="qs">문제+해설</option><option value="all">전체 파일</option></select>` : '') + '</p>';
  html += '<table><tr><th>학생</th><th>파일</th><th></th></tr>';
  for (const n of names) {
    const f = rows[n], u0 = urls[f['키']], u1 = f['문제키'] && urls[f['문제키']], u2 = f['해설키'] && urls[f['해설키']];
    const nm = n.length >= 3 ? n.slice(1) : n;
    html += `<tr data-n="${E(n)}"><td class="nm">${E(nm)}<small>${f.문항 ? '유형 ' + E(f.문항) + '문항 · ' : ''}${f['문제쪽'] ? (f['문제쪽'] + f['해설쪽'] - 1) + '쪽' : ''}</small></td><td>` +
      (u1 ? `<a class="f q" href="${dl(u1, n + '_문제.pdf')}" target="_blank" rel="noopener">문제<small>${f['문제쪽']}쪽</small></a>` : '') +
      (u2 ? `<a class="f s" href="${dl(u2, n + '_해설.pdf')}" target="_blank" rel="noopener">해설<small>${f['해설쪽']}쪽</small></a>` : '') +
      (u0 ? `<a class="f" href="${dl(u0, n + '.pdf')}" target="_blank" rel="noopener" style="opacity:.75">전체</a>` : '<span class="dim">링크 실패</span>') +
      (!u1 && u0 ? ' <span style="color:var(--dim);font-size:11.5px">(분할 전 잡)</span>' : '') +
      `</td><td><button class="pv" data-u="${E(u1 || u0 || '')}" data-n="${E(nm)}">보기</button></td></tr>`;
  }
  html += '</table>';
  if (fails.length) html += '<div class="miss"><b>PT 없음 ' + fails.length + '명</b>' +
    fails.map(x => E(x.이름) + ' — ' + E((x.메시지 || '').slice(0, 90)) + ' <span style="opacity:.6">#' + x.잡 + '</span>').join('<br>') + '</div>';
  if (pending.length) html += '<div class="note">만드는 중: ' + pending.map(x => E(x.이름) + '(' + E(x.상태) + ')').join(', ') + ' — 1~2분 뒤 ↻</div>';
  html += '<div class="note">문제 파일과 해설 파일에 빠른정답 장이 둘 다 들어 있다. 파일명은 학생 이름으로 떨어진다. '
    + '"분할 전 잡"은 전체 파일만 있다 — 필요하면 세션에 재분할을 시킨다. [전체 받기] zip 을 <b>폴더에 푼 뒤</b> <b>_print_all.bat</b> 을 더블클릭하면 그 폴더 PDF 가 전부 기본 프린터로 나간다(압축 안에서 실행하면 PDF 0개. SumatraPDF 있으면 조용히 1부씩, 없으면 기본 PDF 앱). 자세한 건 zip 안 _읽어주세요.txt.</div>';
  $('#left').innerHTML = html;
  document.querySelectorAll('button.pv[data-u]').forEach(b => b.onclick = () => preview(b));
  const zb = $('#zipall'); if (zb) zb.onclick = () => zipAll(zb, g, names, rows, urls);
}

/* ── 전체 받기 (0908 유강) — 서명 URL 로 하나씩 받아 무압축 zip 한 파일로. 파일명=학생이름_문제.pdf.
   조회(app.js) makeZip 과 같은 store zip. 브라우저 다운로드 한 번에 끝난다. */
async function zipAll(btn, g, names, rows, urls) {
  const kind = ($('#zipkind') || {}).value || 'q';
  const want = [];
  for (const n of names) {
    const f = rows[n];
    const add = (key, suf) => { const u = f[key] && urls[f[key]]; if (u) want.push({ name: n + suf + '.pdf', url: u }); };
    if (kind === 'q' || kind === 'qs') add('문제키', '_문제');
    if (kind === 's' || kind === 'qs') add('해설키', '_해설');
    if (kind === 'all' || (kind !== 'all' && !f['문제키'] && !f['해설키'])) add('키', '');   // 분할 전 잡은 전체 파일로
  }
  if (!want.length) { btn.textContent = '받을 파일이 없다'; return; }
  const orig = btn.textContent; btn.disabled = true;
  const entries = [], failed = [];
  for (const w of want) {
    btn.textContent = `받는 중… ${entries.length + failed.length + 1}/${want.length}`;
    try { const r = await fetch(w.url); if (!r.ok) throw new Error(r.status); entries.push({ name: w.name, data: new Uint8Array(await r.arrayBuffer()) }); }
    catch (e) { failed.push(w.name); }
  }
  if (entries.length) {
    entries.push({ name: '_print_all.bat', data: printBat() });   // (0916) 폴더째 인쇄 — ASCII 전용 bat
    entries.push({ name: '_읽어주세요.txt', data: readMeTxt() });
    btn.textContent = '압축하는 중…'; await new Promise(r => setTimeout(r, 0));
    try { dropFile(makeZip(entries), `기출과제_${g.반}_${g.날짜.replace(/-/g, '').slice(4)}_${kind}.zip`); }
    catch (e) { btn.disabled = false; btn.textContent = '압축 실패 — 이름을 눌러 한 명씩'; return; }
  }
  btn.disabled = false;
  btn.textContent = !entries.length ? '하나도 못 받았다 — 링크가 만료됐으면 ↻' : failed.length ? `${entries.length}개 저장 · 실패 ${failed.length}` : `${entries.length}개 zip 저장됨 ✓`;
  setTimeout(() => { btn.textContent = orig; }, 8000);
}
/* zip 에 같이 들어가는 인쇄 배치 — 압축을 폴더에 푼 뒤 _print_all.bat 더블클릭 → 그 폴더 PDF 전부 기본 프린터로.
   SumatraPDF 가 있으면 그것(조용히 순서대로, -print-settings "1x" 로 부수 1 강제), 없으면 기본 PDF 앱의 인쇄 동사.
   (0909 실사고 ①) 조교컴에서 학생당 5부 — 사용자 인쇄 기본설정은 1이었다.
   (0909 실사고 ②) bat 에 UTF-8 한글 + chcp 65001 이면 cmd 가 다음 줄 읽기 위치를 틀린다(Win11 실측).
   (0909 실사고 ③) PowerShell 본체로 옮겼더니 유강 PC 에서 powershell.exe 가 0xc0000142 로 안 뜬다.
   (0916 실사고 ④) cp949 한글 bat 도 창이 켜졌다 바로 꺼졌다 — 콘솔 코드페이지가 949 가 아니면 같은 읽기위치 버그다.
   → ★ bat 안에는 한글을 한 글자도 넣지 않는다(파일명도 ASCII). 안내문은 zip 안 _읽어주세요.txt 로 따로 넣는다.
      %ProgramFiles(x86)% 도 for in-list 안에서 괄호로 파싱이 깨질 수 있어 if exist 나열로 풀었다.
      PDF 0개면(압축 안에서 실행) 이유를 찍고 멈춘다. 어떤 경로로 끝나든 :end 의 pause 를 지난다. */
const PRINT_BAT = `@echo off
setlocal enableextensions
cd /d "%~dp0"
set "N=0"
for %%f in ("*.pdf") do set /a N+=1
echo.
if "%N%"=="0" (
  echo   No PDF found in this folder.
  echo   Unzip the file FIRST, then run this from the unzipped folder.
  goto :end
)
echo   PDF files here : %N%
echo   All of them go to the DEFAULT printer, 1 copy each.
echo   Check the default printer / duplex setting before you start.
echo.
choice /c YN /n /m "  Start printing?  [Y/N] "
if errorlevel 2 goto :end
echo.
set "SUM="
if exist "%LOCALAPPDATA%\SumatraPDF\SumatraPDF.exe" set "SUM=%LOCALAPPDATA%\SumatraPDF\SumatraPDF.exe"
if not defined SUM if exist "%ProgramFiles%\SumatraPDF\SumatraPDF.exe" set "SUM=%ProgramFiles%\SumatraPDF\SumatraPDF.exe"

const CRC_T = (() => { const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); t[n] = c >>> 0; }
  return t; })();
function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function makeZip(entries) {                       // [{name, data:Uint8Array}] → Blob
  const enc = new TextEncoder(), d = new Date();
  const time = ((d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1)) & 0xFFFF;
  const date = (((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate()) & 0xFFFF;
  const body = [], cd = []; let off = 0, cdSize = 0;
  for (const e of entries) {
    const nm = enc.encode(e.name), crc = crc32(e.data), sz = e.data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
    lh.setUint16(8, 0, true);                     // 0 = store (무압축)
    lh.setUint16(10, time, true); lh.setUint16(12, date, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, sz, true); lh.setUint32(22, sz, true);
    lh.setUint16(26, nm.length, true); lh.setUint16(28, 0, true);
    body.push(new Uint8Array(lh.buffer), nm, e.data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true);
    ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, time, true); ch.setUint16(14, date, true);
    ch.setUint32(16, crc, true); ch.setUint32(20, sz, true); ch.setUint32(24, sz, true);
    ch.setUint16(28, nm.length, true); ch.setUint16(30, 0, true); ch.setUint16(32, 0, true);
    ch.setUint16(34, 0, true); ch.setUint16(36, 0, true); ch.setUint32(38, 0, true);
    ch.setUint32(42, off, true);
    cd.push(new Uint8Array(ch.buffer), nm);
    off += 30 + nm.length + sz; cdSize += 46 + nm.length;
  }
  const eo = new DataView(new ArrayBuffer(22));
  eo.setUint32(0, 0x06054b50, true); eo.setUint16(4, 0, true); eo.setUint16(6, 0, true);
  eo.setUint16(8, entries.length, true); eo.setUint16(10, entries.length, true);
  eo.setUint32(12, cdSize, true); eo.setUint32(16, off, true); eo.setUint16(20, 0, true);
  return new Blob([...body, ...cd, new Uint8Array(eo.buffer)], { type: 'application/zip' });
}

/* 학생 개인 자료 — 개별과제 판 · 퍼스널/리플레이/커스텀 트레이닝 (포털 portal_hw_files 와 같은 매칭, 기간은 150일) */
async function stuRows(s) {
  const since = new Date(Date.now() - 150 * 864e5).toISOString();
  const { data, error } = await sb.from('job_queue').select('id,종류,상태,파라미터,결과,완료시각,요청시각')
    .in('종류', ['개별과제', '커스텀트레이닝', '기출과제']).eq('상태', '완료').gte('요청시각', since)
    .or(`파라미터->>반.eq.${s.반키},파라미터->>학생ID.eq.${s['학생ID']}`)
    .order('id', { ascending: false }).limit(800);
  if (error) throw error;
  const seen = {}, rows = [];
  for (const j of (data || [])) {
    const p = j['파라미터'] || {}, r = j['결과'] || {};
    const mine = p['학생ID'] === s['학생ID'] || (!p['학생ID'] && p['반'] === s.반키 && (!p['학생'] || p['학생'] === s['이름']));
    if (!mine) continue;
    const cnt = {}; for (const x of (r['학생'] || [])) if (Array.isArray(x)) cnt[x[0]] = x[1];
    for (const u of (r['업로드'] || [])) {
      if (u['이름'] !== s['이름']) continue;
      const nm = p['시험지명'] || '';
      const kind = j['종류'] === '개별과제' ? '개별과제' : j['종류'] === '커스텀트레이닝' ? '커스텀 트레이닝'
        : /리플레이/.test(nm) ? '리플레이 트레이닝' : '퍼스널 트레이닝';
      const day = p['날짜'] || String(j['완료시각'] || j['요청시각'] || '').slice(0, 10);
      const dk = kind === '개별과제' ? 'J' + j.id : kind + '|' + day + '|' + nm;   // 다시 구운 잡은 최신(id 큰 것) 하나만
      if (seen[dk]) continue; seen[dk] = 1;
      const files = [];
      const add = (k, key, url) => { if (key || url) files.push({ k, key: key || null, url: key ? null : (url || null) }); };
      add('문제', u['문제키'], u['문제url']); add('해설', u['해설키'], u['해설url']);
      if (!files.length) add('전체', u['키'], u['url']);
      rows.push({ 반: s.반키, 날짜: day, 종류: kind, 자료: kind === '개별과제' ? 'No.' + j.id : nm, 단원: '',
        문항: Array.isArray(u['문항']) ? u['문항'].length : (cnt[u['이름']] || ''), files });
    }
  }
  const keys = [...new Set(rows.flatMap(x => x.files.filter(f => f.key).map(f => f.key)))];
  if (keys.length) {
    const { data: sg } = await sb.storage.from('reports').createSignedUrls(keys, 3600);
    const m = {}; for (const d of (sg || [])) if (d.signedUrl) m[d.path] = d.signedUrl;
    for (const x of rows) for (const f of x.files) if (f.key) f.url = m[f.key] || null;
  }
  return rows;
}

/* 정렬 — 누른 순서대로 1·2·3 순위(1031 유강 규칙). 같은 머리를 다시 누르면 방향만 바꾼다. 빈칸은 늘 맨 뒤. */
function sortRows(rows, order) {
  return rows.slice().sort((a, b) => {
    for (const o of order) {
      const x = a[o.k], y = b[o.k], ex = x === '' || x == null, ey = y === '' || y == null;
      if (ex || ey) { if (ex !== ey) return ex ? 1 : -1; continue; }
      const c = (typeof x === 'number' && typeof y === 'number') ? x - y : String(x).localeCompare(String(y), 'ko', { numeric: true });
      if (c) return c * o.dir;
    }
    return 0;
  });
}
const safe = s => String(s || '').replace(/[\\/:*?"<>|]+/g, '').replace(/\s+/g, '_').replace(/_+/g, '_').replace(/^_|_$/g, '');
function fname(x, k) {

}
function hrefOf(f, name) { return f.lib ? f.url : f.url + (f.url.includes('?') ? '&' : '?') + 'download=' + encodeURIComponent(name); }

function drawList() {

async function zipSel(btn) {
  const kind = $('#zk').value, picks = [...document.querySelectorAll('input.pick:checked')].map(c => LIST[+c.dataset.i]).filter(Boolean);
  if (!picks.length) { btn.textContent = '먼저 오른쪽 칸을 체크'; setTimeout(() => { btn.textContent = '⤓ 선택한 것 받기 (zip)'; }, 3000); return; }
  const want = [], used = {};
  for (const x of picks) for (const f of x.files) {
    if (!f.url) continue;
    if (f.k === '문제' && kind === 's') continue;
    if (f.k === '해설' && kind === 'q') continue;
    let name = fname(x, f.k);
    if (used[name]) name = name.replace(/\.pdf$/, `_${++used[name]}.pdf`); else used[name] = 1;
    want.push({ name, url: f.url });
  }
  if (!want.length) { btn.textContent = '받을 파일이 없다'; return; }
  const orig = '⤓ 선택한 것 받기 (zip)'; btn.disabled = true;
  const entries = [], failed = [];
  for (const w of want) {
    btn.textContent = `받는 중… ${entries.length + failed.length + 1}/${want.length}`;
    try { const r = await fetch(w.url); if (!r.ok) throw new Error(r.status); entries.push({ name: w.name, data: new Uint8Array(await r.arrayBuffer()) }); }
    catch (e) { failed.push(w.name); }
  }
  if (entries.length) {
    entries.push({ name: '_print_all.bat', data: printBat() });
    entries.push({ name: '_읽어주세요.txt', data: readMeTxt() });
    btn.textContent = '압축하는 중…'; await new Promise(r => setTimeout(r, 0));
    const d = new Date(), md = String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
    try { dropFile(makeZip(entries), safe(`${LISTCTX.zip}_${md}`) + '.zip'); }
    catch (e) { btn.disabled = false; btn.textContent = '압축 실패 — 파일을 하나씩 받아 주세요'; return; }
  }
  btn.disabled = false;
  btn.textContent = !entries.length ? '하나도 못 받았다 — 링크가 만료됐으면 ↻' : failed.length ? `${entries.length}개 저장 · 실패 ${failed.length}` : `${entries.length}개 zip 저장됨 ✓`;
  setTimeout(() => { btn.textContent = orig; }, 8000);
}

  const ws = want && st.find(s => s['학생ID'] === want);
  if (ws) sel.value = ws.반키;
  fillStu(ws ? ws['학생ID'] : null);
}
function fillStu(id) {
  const ban = $('#sban').value;
  const list = (STU || []).filter(s => s.반키 === ban).sort((a, b) => String(a['이름']).localeCompare(String(b['이름']), 'ko'));
  $('#sstu').innerHTML = '<option value="">학생 고르기</option>' + list.map(s => `<option value="${E(s['학생ID'])}">${E(s['이름'])}${s['학교'] ? ' · ' + E(s['학교']) : ''}</option>`).join('');
  if (id) $('#sstu').value = id;
  if ($('#sstu').value) showStu($('#sstu').value);
  else $('#left').innerHTML = '<div class="msg">반과 학생을 고르면 그 학생 포털에 있는 자료가 전부 나온다<br>(개별과제 판 · 퍼스널/리플레이/커스텀 트레이닝 · 그 반 써킷 · 교재 · 기출)</div>';
}
async function showStu(id) {
  const s = (STU || []).find(x => x['학생ID'] === id); if (!s) return;
  history.replaceState(null, '', '?s=' + encodeURIComponent(id));
  $('#left').innerHTML = '<div class="msg">불러오는 중…</div>';
  let jr = [], lr = [], err = '';
  try { jr = await stuRows(s); } catch (e) { err += '개인 자료를 못 읽었다: ' + e.message + ' '; }
  try { await getLib(); lr = libRows(s.반키); } catch (e) { err += '반 자료 목록을 못 읽었다: ' + e.message; }
  SORT = [];
  LIST = [...jr, ...lr];
  LISTCTX = {
    who: s['이름'], zip: '학생자료_' + s['이름'],
    head: `<b>${E(s['이름'])}</b> ${E(s.반키)}${s['학교'] ? ' · ' + E(s['학교']) : ''} · 자료 <b>${LIST.length}</b>개 (개인 ${jr.length} · 반 ${lr.length})`
      + (err ? `<br><span style="color:var(--warn)">${E(err)}</span>` : ''),
    cols: [{ k: '날짜' }, { k: '종류' }, { k: '자료' }, { k: '단원' }, { k: '문항', num: 1 }],
    defSort: [{ k: '날짜', dir: -1 }, { k: '종류', dir: 1 }],
    note: '개인 자료 = 그 학생 포털 「과제 파일」과 같은 규칙(최근 150일, 개별과제는 닫힌 판도 보인다). 반 자료 = 그 반에 나간 써킷·교재·기출. '
      + 'PDF 링크는 1시간 유효 — 오래 열어 뒀으면 ↻. [선택한 것 받기] zip 을 폴더에 푼 뒤 _print_all.bat 을 더블클릭하면 전부 기본 프린터로 나간다.'
  };
  drawList();
}

/* 써킷·교재·기출 (반 자료) */
async function libInit() {
  $('#left').innerHTML = '<div class="msg">불러오는 중…</div>';
  try { await getLib(); } catch (e) { $('#left').innerHTML = '<div class="msg">수업 자료 목록(lib.json)을 못 읽었다: ' + E(e.message) + '</div>'; return; }
  const bans = [...new Set([...(LIB['정규'] || []), ...(LIB['교재'] || [])].flatMap(e => banOf(e['반']))
    .concat((LIB['기출'] || []).flatMap(e => (e['시행'] || []).map(s => s['반']))))].filter(Boolean).sort();
  const sel = $('#lban');
  if (!sel.options.length) sel.innerHTML = '<option value="">전체 반</option>' + bans.map(b => `<option value="${E(b)}">${E(b)}</option>`).join('');
  const want = new URLSearchParams(location.search).get('b');
  if (want != null && [...sel.options].some(o => o.value === want)) sel.value = want;
  showLib();
}
function showLib() {
  const ban = $('#lban').value, kinds = [...document.querySelectorAll('#ctl-lib input[data-lk]:checked')].map(x => x.dataset.lk);
  history.replaceState(null, '', '?m=lib' + (ban ? '&b=' + encodeURIComponent(ban) : ''));
  SORT = [];
  LIST = libRows(ban).filter(x => kinds.includes(x.종류));
  LISTCTX = {
    who: '', zip: '반자료_' + (ban || '전체'),
    head: `<b>${E(ban || '전체 반')}</b> · ${E(kinds.join('·') || '종류 없음')} <b>${LIST.length}</b>개 · 목록 ${E((LIB || {})['생성'] || '')} 기준`,
    cols: [{ k: '반' }, { k: '날짜' }, { k: '종류' }, { k: '자료' }, { k: '단원' }],
    defSort: [{ k: '날짜', dir: -1 }, { k: '반', dir: 1 }],
    note: '학생 포털 「수업 자료」와 같은 목록이다. 써킷은 반·DAY 책자 그대로. 체크한 것을 [선택한 것 받기] 로 한 번에 받아 _print_all.bat 으로 인쇄한다.'
  };
  drawList();
}

const HINT = {
  grp: '문제 = 문제~빠른정답 · 해설 = 빠른정답~해설 · 링크는 1시간 유효',
  stu: '그 학생 포털에 있는 자료 전부 · 보기·받기만(체크·설정은 못 바꾼다)',
  lib: '반에 나간 써킷·교재·기출 책자'
};
async function setMode(m, first) {
  MODE = m;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  ['grp', 'stu', 'lib'].forEach(k => { $('#ctl-' + k).hidden = k !== m; });
  $('#hint').textContent = HINT[m];
  $('#right').innerHTML = '<div class="empty">[보기] 를 누르면 여기서 미리 본다</div>';
  if (m === 'grp') { if (!first) history.replaceState(null, '', location.pathname); return load(); }
  if (m === 'stu') return stuInit();
  return libInit();
}

$('#grp').onchange = e => show(e.target.value);
$('#reload').onclick = () => {
  if (MODE === 'grp') return load();
  if (MODE === 'stu') { const id = $('#sstu').value; STU = null; LIB = null; return stuInit(id); }
  LIB = null; return libInit();
};
document.querySelectorAll('.tab').forEach(b => b.onclick = () => setMode(b.dataset.m));
$('#sban').onchange = () => fillStu(null);
$('#sstu').onchange = e => { if (e.target.value) showStu(e.target.value); };
$('#lban').onchange = showLib;
document.querySelectorAll('#ctl-lib input[data-lk]').forEach(x => x.onchange = showLib);
{ const q = new URLSearchParams(location.search); setMode(q.get('s') ? 'stu' : q.get('m') === 'lib' ? 'lib' : 'grp', true); }
</script>
</body></html>
