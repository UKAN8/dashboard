<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>자기평가 · 수학은유강</title>
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="수학은유강 — 기출테스트 자기평가">
<meta property="og:description" content="개인 링크입니다. 다른 사람에게 전달하지 마세요.">
<!-- ⚠ 버전을 박는다 (포털·설문과 같은 버전) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2/dist/umd/supabase.min.js"></script>
<style>
:root{color-scheme:dark;
 --bg:#0a0a0f; --card:rgba(255,255,255,.03); --bd:rgba(255,255,255,.07);
 --tx:#f5f5fa; --tx2:#b8b8c5; --dim:#8a8a98; --acc:#f5a0a0; --good:#c8f0da;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{max-width:100%;overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--tx);
 font:15px/1.5 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;
 padding:16px clamp(10px,3.5vw,24px) calc(120px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto}
.brand{font-weight:800;color:var(--acc);font-size:15px;letter-spacing:.02em}
.who{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin:6px 0 4px}
.who b{font-size:22px}
.who .ban{font-size:12px;color:var(--acc);background:rgba(245,160,160,.12);padding:2px 9px;border-radius:9px}
.lead{color:var(--tx2);font-size:13px;margin:8px 0 4px}
.lead b{color:var(--tx)}
.note{color:var(--dim);font-size:12px;margin-bottom:14px;line-height:1.55}
.note b{color:var(--tx2)}
.q{background:var(--card);border:1px solid var(--bd);border-radius:13px;padding:10px 11px;margin-bottom:8px}
.q.ok{border-color:rgba(200,240,218,.28)}
.q.cur{border-color:rgba(245,160,160,.55);background:rgba(245,160,160,.05)}
.q .hd{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.q .no{font-weight:800;font-size:15px;min-width:34px;color:var(--acc)}
.q .pt{color:var(--dim);font-size:11.5px}
.q .key{color:var(--tx2);font-size:13px;margin-left:auto}
.q .key b{color:var(--tx);font-weight:700}
.row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px}
.row:last-child{margin-bottom:0}
.b{flex:1 1 0;min-width:44px;font:inherit;font-size:14px;color:var(--tx2);
 background:rgba(255,255,255,.035);border:1px solid var(--bd);border-radius:9px;
 padding:9px 4px;cursor:pointer;text-align:center;transition:background .1s,border-color .1s,color .1s}
.b.on{background:rgba(245,160,160,.18);border-color:rgba(245,160,160,.55);color:#ffe9e9;font-weight:700}
.row.cf .b.on{background:rgba(200,240,218,.14);border-color:rgba(200,240,218,.5);color:var(--good)}
/* ⚠ :hover 는 반드시 미디어쿼리 안에 — 폰에서 탭 뒤 호버가 남아 오답을 부른다 */
@media (hover:hover) and (pointer:fine){ .b:hover{border-color:rgba(245,160,160,.35);color:var(--tx)} }
input.num{flex:1 1 0;min-width:0;font:inherit;font-size:16px;color:var(--tx);
 background:rgba(255,255,255,.035);border:1px solid var(--bd);border-radius:9px;padding:8px 10px}
input.num:focus{outline:none;border-color:rgba(245,160,160,.55)}
input.num::placeholder{color:var(--dim);font-size:13px}
.lab{color:var(--dim);font-size:11px;letter-spacing:.06em;margin:0 0 4px 2px}
.bar{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(to top,#0a0a0f 62%,rgba(10,10,15,0));
 padding:12px clamp(10px,3.5vw,24px) calc(14px + env(safe-area-inset-bottom))}
.bar .in{max-width:560px;margin:0 auto}
.prog{height:4px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;margin-bottom:9px}
.prog i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
button.send{width:100%;font:inherit;font-size:15px;font-weight:800;color:#1a0d12;
 background:var(--acc);border:none;border-radius:13px;padding:14px;cursor:pointer}
button.send[disabled]{background:rgba(255,255,255,.08);color:var(--dim);cursor:default}
.msg{color:var(--dim);font-size:14px;padding:40px 2px}
.msg b{display:block;color:var(--tx);font-size:16px;margin-bottom:6px}
.done{text-align:center;padding:60px 10px}
.done .k{font-size:44px;line-height:1}
.done b{display:block;font-size:20px;margin:14px 0 6px}
.done p{color:var(--tx2);font-size:14px;margin:0 0 20px;line-height:1.6}
.again{font:inherit;font-size:13px;color:var(--tx2);background:none;border:1px solid var(--bd);
 border-radius:10px;padding:9px 16px;cursor:pointer}
.foot{color:var(--dim);font-size:11.5px;line-height:1.7;margin-top:22px;border-top:1px solid var(--bd);padding-top:14px}
.legend{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12px;color:var(--tx2);
 background:var(--card);border:1px solid var(--bd);border-radius:11px;padding:9px 12px;margin-bottom:12px}
.legend b{color:var(--tx)}
</style></head>
<body><main>
<div id="msg" class="msg">불러오는 중…</div>
<div id="app" style="display:none">
  <div class="brand">수학은유강</div>
  <div class="who"><b id="nm"></b><span class="ban" id="cl"></span></div>
  <div class="lead" id="lead"></div>
  <div class="note">문제지에 적어 둔 <b>내 답</b>과, 풀 때 <b>얼마나 확신했는지</b>만 골라주세요.
    점수랑은 상관없어요 — 오늘 받을 <b>개인 과제</b>를 여기에 맞춰 만들어요. 솔직할수록 과제가 딱 맞아요~</div>
  <div class="legend">
    <b>확실</b><span>풀이가 자신 있었다</span>
    <b>애매</b><span>풀긴 했는데 긴가민가했다</span>
    <b>찍음</b><span>모르겠어서 찍었다</span>
    <b>안 품</b><span>시간이 없었거나 손도 못 댔다</span>
  </div>
  <div id="qs"></div>
  <div class="foot" id="foot"></div>
</div>
<div id="bar" class="bar" style="display:none"><div class="in">
  <div class="prog"><i id="pg"></i></div>
  <button class="send" id="send" disabled>제출</button>
</div></div>
</main>
<script>
/* 기출테스트 직후 자기평가 — 학생 개인 링크(포털과 같은 토큰)로 연다. (2026-09-02)
 *
 * 주소: /eval/?t=<토큰>[&d=YYYY-MM-DD]   (d 없으면 오늘)
 *
 * 무엇을 받나: 문항마다 `내 답` + `확신(확실/애매/찍음/안 품)`. 문항당 두 탭, 20문항 2분.
 * 정답은 화면에 안 띄운다 — 같은 시험지를 다른 반이 나중에 본다(0831 지시서).
 *   객관식(정답 1~5) → ①~⑤ 버튼 / 단답(정수) → 숫자 칸 / 정답이 √·분수 같은 것('보임') →
 *   정답을 보여주고 맞음·아님 / M(수동채점 서술형) → 맞음·부분·아님 을 학생이 스스로.
 * 화면엔 점수도, 채점 결과도 안 띄운다 — 공식 점수는 조교 입력(OMR)이 정본이다.
 * 5분류(숙달·불안정·가짜정답·개념오해·미학습·미응시문항)는 서버(circuit_hw)가 만든다.
 *
 * ⚠ 여기에 박힌 것은 anon 키뿐이고, 열린 것은 함수 둘(gt_eval_open·gt_eval_submit)뿐이다.
 *   그 함수가 토큰→학생을 정한다. **sb.from(...) 을 새로 쓰지 마라** — build_eval.py 가 막는다.
 * ⚠ 말투 — 학생에게는 존댓말 + ~요.
 */
const SB_URL='https://bkgerndnwukvuuqdgnxt.supabase.co';
const SB_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJrZ2VybmRud3VrdnV1cWRnbnh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyNjA3MzgsImV4cCI6MjEwMTgzNjczOH0.VcfcTc9QkecKWFPUiYVXKGEXLxmVp8ugfiF6EV5_kjk';
const sb=supabase.createClient(SB_URL,SB_ANON);
const E=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#x27;');
const $=id=>document.getElementById(id);

const CONF=['확실','애매','찍음','안 품'];            // 화면 글자
const CV={'확실':'확실','애매':'애매','찍음':'찍음','안 품':'안품'};   // 저장 값 (공백 없음)
const CV_R=Object.fromEntries(Object.entries(CV).map(([k,v])=>[v,k]));
const CIRC=['①','②','③','④','⑤'];

let TOK='', DAY='', DATA=null, ITEMS=[], ANS={}, T0=Date.now();

/* 문항 하나가 '끝났다' = 확신이 있고, (안 품이 아니면) 답도 있다 */
function doneQ(it){
  const a=ANS[it.라벨]||{};
  if(!a.c) return false;
  if(a.c==='안품') return true;
  return !!(a.a&&String(a.a).trim());
}

function draw(){
  const H=[];
  ITEMS.forEach(it=>{
    const a=ANS[it.라벨]||{};
    const skip=a.c==='안품';
    let ansRow='';
    if(it.종류==='객관식'){
      ansRow=`<div class="row an">`+CIRC.map((c,i)=>`<button class="b${String(a.a)===String(i+1)?' on':''}${skip?' dis':''}" data-k="${E(it.라벨)}" data-a="${i+1}">${c}</button>`).join('')+`</div>`;
    }else if(it.종류==='단답'){
      ansRow=`<div class="row an"><input class="num" inputmode="decimal" enterkeyhint="next" placeholder="내가 적은 답 (숫자)" data-k="${E(it.라벨)}" value="${E(a.a||'')}"></div>`;
    }else if(it.종류==='보임'){
      ansRow=`<div class="row an">`+[['O','이렇게 적었다'],['X','다르게 적었다']].map(([v,t])=>
        `<button class="b${a.a===v?' on':''}" data-k="${E(it.라벨)}" data-a="${v}">${t}</button>`).join('')+`</div>`;
    }else{ // 수동(서술형)
      ansRow=`<div class="row an">`+[['O','맞은 것 같다'],['P','부분만'],['X','틀린 것 같다']].map(([v,t])=>
        `<button class="b${a.a===v?' on':''}" data-k="${E(it.라벨)}" data-a="${v}">${t}</button>`).join('')+`</div>`;
    }
    const key = it.종류==='보임' ? `<span class="key">정답 <b>${E(it.정답)}</b></span>`
              : it.종류==='수동' ? `<span class="key">서술형</span>` : '';
    H.push(`<div class="q${doneQ(it)?' ok':''}" id="q_${E(it.라벨)}">
      <div class="hd"><span class="no">${E(it.라벨)}번</span>${it.배점!=null?`<span class="pt">${it.배점}점</span>`:''}${key}</div>
      ${ansRow}
      <div class="row cf">`+CONF.map(c=>`<button class="b${a.c===CV[c]?' on':''}" data-k="${E(it.라벨)}" data-c="${CV[c]}">${c}</button>`).join('')+`</div>
    </div>`);
  });
  $('qs').innerHTML=H.join('');
  $('qs').querySelectorAll('button.b').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k; const cur=ANS[k]||(ANS[k]={});
    if(b.dataset.a!=null){ cur.a = (cur.a===b.dataset.a?'':b.dataset.a); if(cur.a&&cur.c==='안품') cur.c=''; }
    else { cur.c = (cur.c===b.dataset.c?'':b.dataset.c); if(cur.c==='안품') cur.a=''; }
    save(); draw(); advance(k);
  });
  $('qs').querySelectorAll('input.num').forEach(inp=>{
    inp.oninput=()=>{ const k=inp.dataset.k; const cur=ANS[k]||(ANS[k]={}); cur.a=inp.value; if(cur.a&&cur.c==='안품')cur.c=''; save(); gauge(); mark(k); };
    inp.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); inp.blur(); } };
  });
  gauge();
}
function mark(k){ const it=ITEMS.find(x=>x.라벨===k); const el=$('q_'+k); if(el&&it) el.classList.toggle('ok',doneQ(it)); }
/* 한 문항이 끝나면 다음 안 끝난 문항으로 시선을 옮긴다 — 스크롤 한 방향 */
function advance(k){
  const i=ITEMS.findIndex(x=>x.라벨===k);
  if(i<0||!doneQ(ITEMS[i])) return;
  const nx=ITEMS.slice(i+1).find(x=>!doneQ(x));
  if(!nx) return;
  const el=$('q_'+nx.라벨); if(!el) return;
  $('qs').querySelectorAll('.q.cur').forEach(x=>x.classList.remove('cur'));
  el.classList.add('cur');
  const r=el.getBoundingClientRect();
  if(r.bottom>window.innerHeight-140||r.top<60) el.scrollIntoView({behavior:'smooth',block:'center'});
}

function gauge(){
  const got=ITEMS.filter(doneQ).length, need=ITEMS.length;
  $('pg').style.width=Math.round(got/Math.max(need,1)*100)+'%';
  const b=$('send');
  b.disabled = got<need;
  b.textContent = got<need ? `${need-got}문항 남았어요` : '제출하기';
}

/* 임시 저장 — 카톡 알림에 튕겨 나갔다 돌아와도 답이 남아 있어야 한다. 실패해도 그냥 돌아간다. */
const LK=()=>'gteval:'+DAY+':'+TOK.slice(0,8);
function save(){ try{ localStorage.setItem(LK(), JSON.stringify(ANS)); }catch(e){} }
function load(){ try{ return JSON.parse(localStorage.getItem(LK())||'{}'); }catch(e){ return {}; } }

function say(t,s){ $('msg').innerHTML=`<b>${E(t)}</b>${E(s||'')}`; $('msg').className='msg'; $('msg').style.display=''; }

function 완료(수정){
  $('app').style.display='none'; $('bar').style.display='none';
  $('msg').style.display=''; $('msg').className='done';
  $('msg').innerHTML=`<div class="k">✓</div><b>${수정?'다시 제출됐어요~':'제출됐어요. 고마워요~'}</b>
    <p>오늘 개인 과제를 여기에 맞춰 만들어요.<br>잘못 누른 게 있으면 고쳐서 다시 내도 돼요.</p>
    <button class="again" id="again">답 고치기</button>`;
  $('again').onclick=()=>{ $('msg').style.display='none'; $('msg').className='msg';
    $('app').style.display=''; $('bar').style.display=''; draw(); };
}

async function send(){
  const b=$('send'); b.disabled=true; b.textContent='보내는 중이에요…';
  const 낼것={};
  ITEMS.forEach(it=>{ const a=ANS[it.라벨]; if(a&&a.c) 낼것[it.라벨]={a:(a.c==='안품'?'':String(a.a||'').trim()), c:a.c}; });
  낼것['_초']=Math.round((Date.now()-T0)/1000);
  let data,err;
  try{ ({data,error:err}=await sb.rpc('gt_eval_submit',{tok:TOK,ans:낼것,day:DAY})); }
  catch(e){ err=e; }
  if(err||!data||!data.ok){ b.disabled=false; b.textContent='다시 제출하기';
    return alert((data&&data.이유)?data.이유:'전송이 안 됐어요. 잠깐 뒤에 다시 눌러주세요~'); }
  save(); 완료(false);
}

(async()=>{
  const p=new URLSearchParams(location.search);
  TOK=p.get('t')||''; DAY=p.get('d')||'';
  if(!TOK) return say('링크가 올바르지 않아요.','포털(내 기록) 화면의 [시작 →] 버튼으로 들어와 주세요~');
  let data,err;
  try{ ({data,error:err}=await sb.rpc('gt_eval_open',{tok:TOK,day:DAY||null})); }
  catch(e){ err=e; }
  if(err) return say('지금은 열 수 없어요.','잠시 뒤에 다시 열어주세요. 계속 이러면 쌤한테 알려주세요~');
  if(!data) return say('만료되었거나 잘못된 링크예요.','새 링크가 필요하면 쌤한테 말해주세요~');
  if(data.없음) return say('오늘 자기평가할 기출테스트가 없어요.','시험 본 날, 답안지 걷은 뒤에 열어주세요~');
  DATA=data; DAY=data.날짜; ITEMS=data.문항||[];
  if(!ITEMS.length) return say('정답표가 아직 안 올라왔어요.','조교 쌤이 올리면 다시 열어주세요~');
  $('nm').textContent=data.이름||''; $('cl').textContent=data.반||'';
  $('lead').innerHTML=`<b>${E((data.시험지명||'기출테스트').replace(/_/g,' '))}</b> · ${ITEMS.length}문항`;
  $('foot').innerHTML=`이 주소는 ${E(data.이름||'')} 개인 링크예요. 다른 사람에게 전달하지 마세요.<br>
    여기 답은 쌤만 봅니다. 성적과 무관하고, 오늘 과제를 맞추는 데만 써요.`;
  ANS=Object.assign({}, data.지난답||{}, load()); delete ANS['_초'];
  $('msg').style.display='none'; $('app').style.display=''; $('bar').style.display='';
  draw();
  $('send').onclick=send;
  if(data.제출함 && !Object.keys(load()).length) 완료(true);
})();
</script></body></html>
