<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#2E2E2E"><meta name="robots" content="noindex"><meta name="theme-color" content="#0a0a0f"><title>대표유형 트레이닝 · 수학은유강</title><style>
:root{--key:#EA9090;--deep:#C0524E;--ink:#333;--mute:#8A8A8A;--tint:#FAE3E1;
 --soft:#F6F6F6;--line:#E6E6E6;--ok:#3E8E6E;--okbg:#E9F4EF;--no:#C0524E;--nobg:#FBEDEC;
 --warn:#B26A00;--warnbg:#FFF3E0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Paperlogy','Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
 background:#EFEFEF;color:var(--ink);font-size:16px;line-height:1.65;padding-bottom:64px}
.wrap{max-width:560px;margin:0 auto;background:#fff;min-height:100vh}
header{padding:22px 20px 16px;background:#2E2E2E;color:#fff;position:sticky;top:0;z-index:20}
.brand{font-size:12px;letter-spacing:.08em;color:var(--key);font-weight:700}
h1{margin:6px 0 2px;font-size:21px;font-weight:800;letter-spacing:-.01em}
.meta{font-size:12.5px;color:#B9B9B9}
.bar{display:flex;gap:5px;margin-top:14px}
.bar i{flex:1;height:4px;border-radius:2px;background:#4A4A4A;transition:background .25s}
.bar i.done{background:var(--key)}
.bar i.wrong{background:#7A4B49}
.guide{margin:0;padding:15px 20px;background:var(--tint);color:var(--deep);font-size:13.5px;line-height:1.6}
.guide b{display:block;font-size:14.5px;margin-bottom:3px}
.part{padding:22px 20px 4px}
.part .pl{font-size:12px;font-weight:800;color:var(--deep);letter-spacing:.04em}
.part .pt{font-size:17px;font-weight:800;margin-top:3px}
.part .pd{font-size:13px;color:var(--mute);margin-top:3px}
.q{padding:20px 20px 24px;border-bottom:10px solid #F1F1F1}
.qhead{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.qno{font-size:13px;font-weight:800;color:var(--deep)}
.tag{font-size:11px;padding:3px 9px;border-radius:20px;background:var(--tint);color:var(--deep);font-weight:600}
.tag.grey{background:var(--soft);color:var(--mute)}
.tag.warn{background:var(--warnbg);color:var(--warn)}
.tag.pct{background:#EDEDED;color:#6E6E6E}
.stem{font-size:15.5px;margin:0 0 4px}
/* (0908) 학교프린트 원문 조각 — hwpx2html 산출을 그대로 담는다 */
.print{font-size:15px;line-height:1.7}
.print p{margin:0 0 2px}
.print .lead,.print .box{background:var(--soft);border-left:3px solid #555;padding:6px 10px;margin:8px 0}
.print .bogi{border:1px solid #444;padding:12px 10px 6px;margin:12px 2px 8px;position:relative}
.print .bogi .lbl{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:#fff;padding:0 6px;font-weight:700;font-size:13px}
.print .bl{margin:0 0 2px}
.print .fig{text-align:center;margin:8px 0}
.print img{max-width:100%;height:auto}
.print .fl{float:right;margin:0 0 4px 8px;max-width:48%}
.print .fl.left{float:left;margin:0 8px 4px 0}
.print .pcs{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 10px;margin-top:10px;clear:both}
.print .pcs.c1{grid-template-columns:1fr}
.print .pch{display:flex;gap:4px;align-items:baseline}
.print .pcn{color:var(--mute);flex-shrink:0}
.print .tbl{border-collapse:collapse;margin:4px auto;font-size:14px}
.print .tbl td{border:1px solid #444;padding:2px 6px;text-align:center}
.print .tbl.grid td{border:none}
.print .tab{display:inline-block;width:14px}
.print .missing{color:var(--no)}
.disp{margin:14px 0;text-align:center;font-size:17px;overflow-x:auto}
.field{margin-top:16px}
.flabel{font-size:13px;color:var(--mute);margin-bottom:6px;display:block}
.row{display:flex;gap:8px;align-items:stretch}
input[type=text]{flex:1;min-width:0;font:inherit;font-size:17px;padding:13px 14px;
 border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input[type=text]:focus{outline:none;border-color:var(--key)}
input[type=text]:disabled{background:var(--soft);color:var(--mute)}
button{font:inherit;cursor:pointer;border:none}
.btn{padding:13px 20px;border-radius:10px;background:var(--ink);color:#fff;font-weight:700;
 font-size:15px;white-space:nowrap}
.btn:disabled{background:#CFCFCF;cursor:default}
.btn.wide{width:100%;padding:16px;font-size:16px}
.choices{display:grid;gap:8px;margin-top:8px}
.ch{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--line);
 border-radius:10px;font-size:14.5px;background:#fff;text-align:left;color:var(--ink);line-height:1.5}
.ch b{color:var(--mute);font-weight:700;flex-shrink:0}
.ch.sel{border-color:var(--key);background:var(--tint)}
.ch:disabled{opacity:1}
.ch.ans{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:700}
.ch.ans b{color:var(--ok)}
.ch.miss{border-color:var(--no);background:var(--nobg);color:var(--no)}
.ch.idk{border-style:dashed;color:var(--mute);background:var(--soft);font-size:13px;padding:9px 14px}
.ch.idk.sel{border-color:var(--warn);background:var(--warnbg);color:var(--warn)}
.ch.miss b{color:var(--no)}
.ch.dim{opacity:.45}
.steps{margin-top:8px;border-left:2px solid var(--tint);padding-left:14px}
.step{margin-bottom:18px}.step:last-child{margin-bottom:4px}
.sk{font-size:13px;font-weight:700;color:var(--deep);margin-bottom:7px}
.verdict{margin-top:16px;border-radius:12px;padding:14px 16px;font-size:14.5px;display:none}
.verdict.show{display:block}
.verdict.ok{background:var(--okbg);color:var(--ok)}
.verdict.no{background:var(--nobg);color:var(--no)}
.verdict .vt{font-weight:800;font-size:15px;margin-bottom:6px}
.sol{margin-top:12px;padding-top:12px;border-top:1px solid rgba(0,0,0,.08);color:var(--ink);font-size:14px}
.sol .sl{font-weight:700;font-size:12.5px;color:var(--mute);margin-bottom:6px}
.sol p{margin:0 0 7px}
.result{padding:26px 20px 34px;display:none;scroll-margin-top:132px}
.result.show{display:block}
.score{text-align:center;padding:18px 0 14px}
.score .n{font-size:46px;font-weight:800;color:var(--deep);line-height:1}
.score .l{font-size:13px;color:var(--mute);margin-top:6px}
.rsec{margin-top:20px}
.rsec .rh{font-size:12px;font-weight:800;color:var(--deep);letter-spacing:.04em;margin-bottom:2px}
.rlist{border-top:1px solid var(--line)}
.ri{display:flex;justify-content:space-between;gap:12px;padding:11px 2px;
 border-bottom:1px solid var(--line);font-size:14px}
.ri span:first-child{color:var(--mute);flex:1}
.ri .o{color:var(--ok);font-weight:700}.ri .x{color:var(--no);font-weight:700}
.next{margin-top:22px;background:var(--tint);border-radius:12px;padding:16px 18px;font-size:14px}
.next b{display:block;color:var(--deep);font-size:14.5px;margin-bottom:7px}
.next .nl{display:flex;justify-content:space-between;gap:10px;padding:4px 0}
.next .nl em{font-style:normal;color:var(--deep);font-weight:700;font-size:13px;white-space:nowrap}
.next .nl em.done{color:var(--ok)}
.next .nl em.zero{color:var(--no)}
.next .nn{margin-top:10px;padding-top:10px;border-top:1px solid rgba(192,82,78,.22);color:var(--deep);font-size:13px;font-weight:700}
details.dev{border-top:10px solid #F1F1F1;padding:18px 20px;background:#FAFAFA}
details.dev summary{font-size:13px;font-weight:700;color:var(--mute);cursor:pointer}
pre{background:#2E2E2E;color:#E8E8E8;padding:14px;border-radius:10px;overflow-x:auto;
 font-size:11.5px;line-height:1.6;font-family:ui-monospace,Menlo,Consolas,monospace}
.flag{margin-top:12px;text-align:right}
.flag .fl{font-size:12px;color:#BDBDBD;text-decoration:underline;cursor:pointer;
 background:none;border:none;padding:2px 0}
.flag textarea{width:100%;font:inherit;font-size:14.5px;padding:11px 12px;line-height:1.5;
 border:1.5px solid var(--line);border-radius:10px;margin-top:8px;resize:vertical;
 color:var(--ink);background:#fff;text-align:left}
.flag textarea:focus{outline:none;border-color:var(--key)}
.flag .sm{padding:9px 16px;font-size:13.5px;margin-top:7px;border-radius:9px;
 background:var(--ink);color:#fff;font-weight:700}
.flag .sent{font-size:12.5px;color:var(--ok);font-weight:700}
.foot{text-align:center;padding:22px;color:#B5B5B5;font-size:11.5px}
/* 제출 상태 바 (0907) — 학생이 '냈다'고 믿는 것과 서버에 남은 것이 어긋나던 사고.
   전송 성공·실패·남은 문항을 화면 아래에 항상 띄운다. */
.sbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;align-items:center;
 gap:10px;padding:11px 16px;font-size:13.5px;font-weight:700;line-height:1.45;
 background:#2E2E2E;color:#fff;box-shadow:0 -2px 10px rgba(0,0,0,.14)}
.sbar.ok{background:var(--ok)}
.sbar.no{background:var(--no)}
.sbar .st{flex:1}
.sbar button{padding:8px 14px;font:inherit;font-size:13px;border:none;border-radius:9px;
 background:#fff;color:var(--ink);font-weight:800;cursor:pointer;white-space:nowrap}
.card{margin:2px 20px 6px;padding:18px 18px 16px;background:var(--tint);border-radius:14px}
.card .cl{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--deep)}
.card .ct{font-size:17.5px;font-weight:800;margin:4px 0 12px;color:var(--ink);letter-spacing:-.01em}
.card h4{margin:15px 0 5px;font-size:14px;font-weight:800;color:var(--deep)}
.card h4:first-of-type{margin-top:0}
.card p{margin:0 0 6px;font-size:14.5px;line-height:1.7}
.card .eq{margin:10px 0;text-align:center;font-size:16.5px;overflow-x:auto}
.card .key{margin-top:13px;padding:12px 14px;background:#fff;border-radius:10px;
 font-size:14px;font-weight:700;color:var(--deep);line-height:1.6}
.ov{border-top:1.15px solid currentColor;padding-top:1px;margin:0 .06em;
 font-family:'Cambria Math','Times New Roman',Georgia,serif;font-style:normal;white-space:nowrap}
.ov+sup{font-style:normal;font-family:'Cambria Math','Times New Roman',Georgia,serif}
.card .fig{margin:12px 0 14px;text-align:center;line-height:0}
.card .fig svg{max-width:100%;height:auto;display:inline-block}
.card .fig .cap{display:block;line-height:1.5;margin-top:5px;font-size:12px;color:var(--mute)}
.card .cwarn{margin-top:9px;padding:11px 14px;background:var(--warnbg);color:var(--warn);
 border-radius:10px;font-size:13.5px;font-weight:700;line-height:1.6}
/* (0911) 되짚기(사후평가) — 풀지 않는다. 내 답·정답 한 줄 + 상태·원인 두 묶음 */
.pe-meta{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0 2px;font-size:13.5px;color:var(--mute)}
.pe-meta b{color:var(--ink);font-weight:700}
.pe-meta .no{color:var(--no)}
.pe-meta .yes{color:var(--ok)}
.pe .choices{gap:6px}
.pe .ch{padding:10px 13px;font-size:14px}
.pe .ch.sel:disabled{border-color:var(--key);background:var(--tint)}
/* (0913 유강) 문제 자세히보기 — 어떤 문제였는지 기억 안 나는 애들이 있다. 기본은 접힘(8문항이면 페이지가 길다)
   (0926) <details>/<summary> 를 버리고 버튼+클래스로 — 일부 폰 브라우저에서 summary 탭이 안 먹힌다는 신고. 버튼은 어디서나 먹는다 */
.peek{margin:8px 0 2px}
.peek>.pk{display:inline-flex;align-items:center;gap:5px;cursor:pointer;background:#fff;
 font-size:13px;font-weight:700;font-family:inherit;line-height:1.3;color:var(--key);border:1px solid var(--line);border-radius:9px;
 padding:7px 12px;user-select:none;-webkit-appearance:none;appearance:none}
.peek>.pk::before{content:'＋';font-weight:400}
.peek.open>.pk::before{content:'－'}
.peek>.stem{display:none;margin-top:9px;padding:11px 13px;background:var(--soft);border-radius:10px}
.peek.open>.stem{display:block}
math{font-family:'Cambria Math','STIX Two Math','Latin Modern Math','Times New Roman',serif;font-size:1.06em}
.disp math{font-size:1.18em}
.stem math,.ch math,.sk math,.sol math{vertical-align:-0.1em}

.prob{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:14px 14px 10px;margin:14px 0}
.prob .ph{font-size:12px;color:#6b7280;margin-bottom:6px;font-weight:600}
.prob .stem{font-size:15px}
.prob .fig img{max-width:100%;height:auto}
.prob.fold .stem{max-height:8.5em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 60%,transparent)}
.prob .tog{font-size:12px;color:#6b7280;background:none;border:0;padding:4px 0;cursor:pointer}
.dots{display:flex;gap:5px;margin:10px 0 0}
.dots i{flex:1;height:5px;border-radius:3px;background:#e5e7eb}
.dots i.cur{background:#111827}.dots i.o{background:#10b981}.dots i.t{background:#f59e0b}.dots i.x{background:#ef4444}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:13px 14px;margin:10px 0;animation:up .22s ease;scroll-margin-top:12px}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.lab{font-size:11px;font-weight:800;letter-spacing:.04em;color:#b45309;margin-bottom:6px}
.tools .lab{color:#7c3aed}
.tool{display:flex;flex-direction:column;gap:2px;padding:7px 0;border-top:1px dashed #e5e7eb;font-size:14.5px}
.tool:first-of-type{border-top:0}
.tool b{color:#6b7280;font-size:12.5px}
.cond{display:inline-block;background:#fef3c7;border-radius:8px;padding:3px 9px;font-size:13.5px;margin:0 0 8px;color:#78350f}
.cond:before{content:"문제 속 조건  ";font-weight:700;font-size:11px;color:#b45309}
.qq{font-size:15.5px;font-weight:600;line-height:1.85}
.opts{display:grid;gap:8px;margin-top:10px}
.op{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1px solid #e5e7eb;background:#fff;border-radius:12px;padding:12px 13px;font:inherit;font-size:15px;color:inherit;cursor:pointer}
.op b{flex:none;color:#9ca3af;font-weight:600}
.op.pick{border-color:#111827;background:#f9fafb}
.op.right{border-color:#10b981;background:#ecfdf5}
.op.wrong{border-color:#f97316;background:#fff7ed;opacity:.55;text-decoration:line-through;pointer-events:none}
.opts.done .op{pointer-events:none}
.hint{margin-top:10px;background:#fff7ed;border-left:3px solid #f97316;border-radius:10px;padding:10px 12px;font-size:14.5px}
.hint.sol{background:#eff6ff;border-left-color:#3b82f6}
.btn{display:block;width:100%;margin:12px 0 2px;border:0;border-radius:12px;padding:13px;font:inherit;font-weight:700;background:#111827;color:#fff;cursor:pointer}
.btn:disabled{background:#d1d5db;cursor:default}
.btn.cf{}
.btn.ghost{background:#fff;color:#111827;border:1px solid #d1d5db}
.note{display:flex;gap:10px;align-items:flex-start;background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14.5px;animation:up .22s ease}
.note .n{flex:none;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;background:#10b981;margin-top:2px}
.note.t .n{background:#f59e0b}.note.x .n{background:#ef4444}
.note .tt{font-size:11.5px;color:#64748b;font-weight:700;margin-bottom:2px}
.psheet{background:#fff;border:2px solid #111827;border-radius:14px;padding:14px;margin:14px 0}
.psheet h3{margin:0 0 6px;font-size:15px}
.psheet ol{margin:0;padding-left:1.3em;font-size:14.5px}
.psheet li{margin:6px 0}
.one{margin-top:10px;background:#ecfdf5;border-radius:10px;padding:10px 12px;font-size:14.5px}
.one b{color:#047857}
.tip{margin-top:8px;font-size:13.5px;color:#475569}
.chips{display:grid;gap:8px;margin-top:10px}
.chip{text-align:left;border:1px solid #d1d5db;background:#fff;border-radius:12px;padding:11px 12px;font:inherit;font-size:14.5px;cursor:pointer;color:inherit}
.chip.ok{border-color:#10b981;background:#ecfdf5;pointer-events:none}
.chip.ok:before{content:attr(data-k) ".  ";font-weight:800;color:#047857}
.chip.bad{animation:shake .3s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.res{display:flex;gap:8px;margin:8px 0 2px}

:root{--hb-ink:#262626;--hb-mute:#6b6b6b;--hb-line:#e7e5e4;--hb-bg:#efefef;--hb-card:#fff;
 --hb-ok:#2f8f6a;--hb-okbg:#e8f5ef;--hb-mid:#c27c0e;--hb-midbg:#fdf3e1;--hb-miss:#c8463f;--hb-missbg:#fbecea;
 --hb-hi:#ffe56b;--hb-key:#EA9090;--hb-tb:58px}
body{background:var(--hb-bg);padding-bottom:0}
.wrap.tw{padding:0 0 120px;background:var(--hb-bg)}
.tw>*:not(.intro):not(.tb){margin-left:14px;margin-right:14px}
.intro{background:#2E2E2E;color:#fff;padding:18px 18px 14px}
.intro .brand{font-size:11.5px;letter-spacing:.06em;color:var(--hb-key);font-weight:700}
.intro h1{font-size:19px;line-height:1.35;margin:6px 0 4px;font-weight:800}
.intro .lede{font-size:13px;color:#c9c9c9;line-height:1.6;margin:0}
.map{display:flex;gap:7px;overflow-x:auto;margin:14px -18px 0;padding:0 18px 2px;scrollbar-width:none}
.map::-webkit-scrollbar{display:none}
.mp{flex:none;display:flex;align-items:center;gap:6px;border:1px solid #4a4a4a;background:#383838;color:#e7e7e7;border-radius:999px;padding:6px 11px 6px 8px;font:inherit;font-size:12.5px;cursor:pointer;white-space:nowrap}
.mp i{width:16px;height:16px;border-radius:50%;border:1.5px solid #777;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:10px;font-weight:800}
.mp.cur{background:#fff;color:#222;border-color:#fff}
.mp.ok i{background:var(--hb-ok);border-color:var(--hb-ok);color:#fff}
.mp.mid i{background:var(--hb-mid);border-color:var(--hb-mid);color:#fff}
.mp.ing i{border-style:dashed;border-color:var(--hb-key)}
.tb{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-bottom:1px solid var(--hb-line);padding:8px 14px 8px}
.tb-row{display:flex;align-items:center;gap:10px}
.tb-t{flex:1;min-width:0;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-t small{font-weight:600;color:var(--hb-mute);margin-right:6px}
.tb-p{flex:none;border:1px solid #d6d3d1;background:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-size:12.5px;font-weight:700;color:var(--hb-ink);cursor:pointer}
.sv{flex:none;display:inline-flex;align-items:center;gap:5px;border:0;background:none;font:inherit;font-size:11px;color:var(--hb-mute);padding:4px 2px;cursor:default;white-space:nowrap}
.sv i{width:7px;height:7px;border-radius:50%;background:#a8a29e}
.sv.ok i,.sv.on i{background:var(--hb-ok)}.sv.ing i{background:var(--hb-mid)}
.sv.fail{color:var(--hb-miss);font-weight:700;cursor:pointer;text-decoration:underline}.sv.fail i{background:var(--hb-miss)}
.sv.bad{color:var(--hb-miss)}.sv.bad i{background:var(--hb-miss)}
@media (max-width:360px){.sv{font-size:0;gap:0}.sv i{width:9px;height:9px}}
.tb-s{display:flex;gap:4px;margin-top:7px}
.tb-s i{flex:1;height:6px;border-radius:3px;background:#e7e5e4;transition:background .2s}
.tb-s i.cur{background:var(--hb-hi);box-shadow:0 0 0 1px #e8c840 inset}
.tb-s i.o{background:var(--hb-ok)}.tb-s i.t{background:var(--hb-mid)}.tb-s i.x{background:var(--hb-miss)}
.tb-c{font-size:11.5px;color:var(--hb-mute);margin-top:4px;min-height:1.2em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-c b{color:var(--hb-ink);background:linear-gradient(transparent 55%,var(--hb-hi) 55%);padding:0 2px}
.prob{background:var(--hb-card);border:1px solid var(--hb-line);border-radius:16px;padding:14px 15px 12px;margin-top:14px;margin-bottom:6px}
.prob .ph{font-size:12px;color:var(--hb-mute);margin-bottom:6px;font-weight:700}
.prob.fold{cursor:pointer}
.prob.fold .stem{max-height:5.6em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 45%,transparent);mask-image:linear-gradient(#000 45%,transparent)}
.prob .tog{display:block;font-size:12.5px;font-weight:700;color:var(--hb-ink);background:#f5f5f4;border:0;border-radius:10px;padding:8px 10px;margin-top:8px;width:100%;cursor:pointer}
.bub,.card,.srow,.nx,.btn,.sum,.fin{scroll-margin-top:calc(var(--hb-tb) + 14px)}
.stepbox.fold>*:not(.srow){display:none}
.srow{display:none;align-items:center;gap:10px;background:var(--hb-card);border:1px solid var(--hb-line);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:13.5px;cursor:pointer;width:100%;font:inherit;text-align:left;color:inherit}
.stepbox.fold>.srow{display:flex}
.srow .mk{flex:none;width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;background:#a8a29e}
.srow .mk.o{background:var(--hb-ok)}.srow .mk.t{background:var(--hb-mid)}.srow .mk.x{background:var(--hb-miss)}
.srow .tx{flex:1;min-width:0}
.srow .tx small{display:block;color:var(--hb-mute);font-size:11.5px}
.srow .ar{color:#a8a29e;font-size:12px}
.stepbox.open>.srow{display:flex;background:#f5f5f4}
.bub.q .nx.cf,.card .btn.cf{position:sticky;bottom:12px;z-index:5;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.bub.q .nx.cf:disabled,.card .btn.cf:disabled{box-shadow:none}
.sh-bg{position:fixed;inset:0;background:rgba(0,0,0,.42);opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
.sh{position:fixed;left:0;right:0;bottom:0;max-height:86vh;max-width:560px;margin:0 auto;background:#fff;border-radius:18px 18px 0 0;transform:translateY(102%);transition:transform .24s ease;z-index:61;display:flex;flex-direction:column}
.sh.on{transform:none}.sh-bg.on{opacity:1;pointer-events:auto}
.sh-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--hb-line)}
.sh-h b{flex:1;font-size:14px}
.sh-h button{border:0;background:#f5f5f4;border-radius:999px;padding:7px 14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;color:inherit}
.sh-b{overflow:auto;padding:14px 16px 28px;font-size:15px;line-height:1.95;-webkit-overflow-scrolling:touch}
.sh-b img{max-width:100%;height:auto}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:#262626;color:#fff;border-radius:999px;padding:9px 16px;font-size:13px;opacity:0;transition:all .25s;z-index:70;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.fin{background:var(--hb-card);border:1px solid var(--hb-line);border-radius:16px;padding:16px;margin-top:16px}
.fin h3{margin:0 0 4px;font-size:16px}
.fin .sub{font-size:13px;color:var(--hb-mute);margin-bottom:10px}
.fin table{width:100%;border-collapse:collapse;font-size:13.5px}
.fin td{padding:9px 4px;border-top:1px solid var(--hb-line);vertical-align:middle}
.fin td.m{letter-spacing:2px;font-weight:800;white-space:nowrap}
.fin td.m .o{color:var(--hb-ok)}.fin td.m .t{color:var(--hb-mid)}.fin td.m .x{color:var(--hb-miss)}.fin td.m .s{color:#c4c4c4}
.fin td.g{text-align:right}
.fin td.g button{border:1px solid #d6d3d1;background:#fff;border-radius:999px;padding:5px 11px;font:inherit;font-size:12px;cursor:pointer;color:inherit}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
button:focus-visible{outline:2px solid #2563eb;outline-offset:2px}

:root{--p-bg:#f7f4ee;--p-card:#fffdf9;--p-raise:#efe9df;--p-line:rgba(31,27,22,.09);--p-line2:rgba(31,27,22,.16);
 --p-ink:#1f1b16;--p-ink2:#5e554a;--p-mute:#7b7266;--pen:#c2413a;--pen-soft:rgba(194,65,58,.08);--tri:#9a6a12;
 --hb-bg:var(--p-bg);--hb-card:var(--p-card);--hb-line:var(--p-line);--hb-ink:var(--p-ink);--hb-mute:var(--p-mute);
 --hb-ok:var(--pen);--hb-mid:var(--tri);--hb-miss:#57534e;--hb-key:#EA9090;--ease:cubic-bezier(.22,1,.36,1)}
html,body,button,input{font-family:Paperlogy,-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}
body,.wrap.tw{background:var(--p-bg);color:var(--p-ink);font-weight:400;-webkit-font-smoothing:antialiased}
b,strong{font-weight:500}
.tw>*:not(.intro):not(.tb){margin-left:16px;margin-right:16px}

/* 머리 — 수학은유강 바탕(#2E2E2E)은 브랜드로 둔다. 자간 벌린 라벨·800 굵기 제목만 걷는다 */
.intro{padding:20px 16px 16px}
.intro .brand{font-size:12px;letter-spacing:0;font-weight:500;color:#EA9090}
.intro h1{font-size:20px;line-height:1.4;margin:8px 0 4px;font-weight:500;letter-spacing:0}
.intro .lede{font-size:13px;line-height:1.6;color:#bdb6ab}
.map{gap:8px;margin:16px -16px 0;padding:0 16px 4px}
.mp{border-radius:8px;padding:0 12px 0 8px;height:32px;gap:8px;font-size:13px;font-weight:500;border-color:#4a4642;background:#383532;color:#e9e3d8;font-variant-numeric:tabular-nums;transition:background-color .15s var(--ease),color .15s var(--ease)}
.mp i{width:16px;height:16px;border-width:1.5px;border-color:#7b7266;font-size:10px;font-weight:600}
.mp.cur{background:var(--p-card);color:var(--p-ink);border-color:var(--p-card)}
.mp.ok i{background:none;border-color:#EA9090;color:#EA9090}
.mp.mid i{background:none;border-color:#d9b46a;color:#d9b46a}
.mp.ing i{border-style:dashed;border-color:#bdb6ab}

/* 고정 막대 */
.tb{background:rgba(247,244,238,.96);border-bottom:1px solid var(--p-line);padding:8px 16px}
.tb-t{font-size:14px;font-weight:500}.tb-t small{font-weight:400;color:var(--p-mute);font-variant-numeric:tabular-nums}
.tb-p{border-radius:8px;border-color:var(--p-line2);background:var(--p-card);font-weight:500;font-size:13px;padding:0 12px;height:32px}
.sv{font-size:12px}
.tb-s{gap:4px;margin-top:8px}
.tb-s i{height:4px;border-radius:2px;background:var(--p-raise)}
.tb-s i.cur{background:var(--p-ink);box-shadow:none}
.tb-s i.o{background:var(--pen)}.tb-s i.t{background:var(--tri)}.tb-s i.x{background:#a8a29e}
.tb-c{font-size:12px;margin-top:4px}
.tb-c b{background:none;padding:0;font-weight:500;color:var(--p-ink)}

/* 문제 카드 · 단계 카드 — 카드 12, 안쪽 16 */
.prob{border-radius:12px;padding:16px;margin-top:16px;margin-bottom:8px;border-color:var(--p-line);background:var(--p-card)}
.prob .ph{font-size:12px;font-weight:400;color:var(--p-mute);margin-bottom:8px}
.prob .stem{font-size:15px}
.prob .tog{border-radius:8px;background:var(--p-raise);font-weight:500;font-size:13px;padding:8px 12px;margin-top:8px}
.card{border-radius:12px;padding:16px;margin:12px 0;border-color:var(--p-line);background:var(--p-card);animation:rise .32s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.lab,.tools .lab{font-size:12px;font-weight:500;letter-spacing:0;color:var(--p-mute);margin-bottom:8px;font-variant-numeric:tabular-nums}
.tool{padding:8px 0;gap:4px;border-top:1px solid var(--p-line)}
.tool b{font-size:12px;font-weight:500;color:var(--p-ink2)}
.cond{background:var(--p-raise);border-radius:6px;padding:4px 8px;margin:0 0 8px;font-size:14px;color:var(--p-ink)}
.cond:before{content:"문제 속 조건";font-weight:500;font-size:11px;color:var(--p-mute);margin-right:8px}
.qq{font-size:16px;font-weight:500}
.opts{gap:8px;margin-top:12px}
.op{position:relative;border-radius:8px;padding:12px 40px 12px 12px;border-color:var(--p-line2);background:var(--p-card);font-size:15px;transition:border-color .15s var(--ease),background-color .15s var(--ease)}
.op b{color:var(--p-mute);font-weight:400;font-variant-numeric:tabular-nums}
.op:active{transform:scale(.98)}
.op.pick{border-color:var(--p-ink);background:var(--p-raise);box-shadow:inset 0 0 0 1px var(--p-ink)}
.op.right{border-color:var(--pen);background:var(--pen-soft)}
.op.right:after{content:"";position:absolute;right:12px;top:50%;width:18px;height:18px;margin-top:-9px;border:2px solid var(--pen);border-radius:50%}
.op.wrong{border-color:var(--p-line2);background:var(--p-raise);opacity:.6}
.op.wrong:after{content:"✕";position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--p-mute);font-size:14px}
.hint{margin-top:12px;border-left:2px solid var(--p-ink2);border-radius:0 8px 8px 0;background:var(--p-raise);padding:12px;font-size:14.5px}
.hint.sol{border-left-color:var(--pen);background:var(--p-raise)}
.btn{border-radius:8px;height:48px;padding:0 16px;margin:12px 0 0;font-weight:500;background:var(--p-ink);transition:background-color .15s var(--ease)}
.btn:disabled{background:#d6d0c6;color:#fffdf9}
.btn.ghost{background:var(--p-card);color:var(--p-ink);border:1px solid var(--p-line2)}
.btn:active{transform:scale(.98)}
.bub.q .nx.cf,.card .btn.cf{box-shadow:0 8px 24px rgba(31,27,22,.12)}

/* 접힌 단계 줄 — 서명: 채점 표시 */
.note{border-radius:8px;border-color:var(--p-line);background:var(--p-card);padding:12px;margin:8px 0;gap:12px;font-size:14.5px;animation:rise .32s var(--ease)}
.note .n,.note.t .n,.note.x .n{width:24px;height:24px;margin-top:0;border:0;border-radius:50%;background:var(--p-raise);color:var(--p-ink2);font-size:12px;font-weight:500;clip-path:none;position:static;font-variant-numeric:tabular-nums}
.note .n:before{content:none}
/* (1110 유강 "세 개 다 어색해") 기호 대신 번호(중립) + 제목 뒤 짧은 상태 글 — 한 번에(채점펜) · 도움 받고 맞힘 · 다시 보기 */
.note .tt .st{margin-left:8px;font-size:11px;font-weight:500;color:var(--pen)}
.note.t .tt .st{color:var(--tri)}
.note.x .tt .st{color:#57534e}
.note.x .n{background:#e4ded3}
.note .tt{font-size:12px;font-weight:500;color:var(--p-mute);margin-bottom:4px}

/* 순간: 풀이 한 장 — 줄 친 연습장 */
.psheet{position:relative;background:var(--p-card);border:1px solid var(--p-line2);border-radius:12px;padding:16px 16px 12px 44px;margin:16px 0;box-shadow:0 1px 2px rgba(31,27,22,.05)}
.psheet:before{content:"";position:absolute;left:32px;top:0;bottom:0;width:1px;background:rgba(194,65,58,.35)}
.psheet h3{margin:0 0 8px -28px;font-size:15px;font-weight:500}
.psheet ol{padding-left:0;list-style:none;counter-reset:pl;font-size:14.5px}
.psheet li{position:relative;counter-increment:pl;margin:0;padding:8px 0;border-bottom:1px solid var(--p-line)}
.psheet li:last-child{border-bottom:0}
.psheet li:before{content:counter(pl);position:absolute;left:-36px;top:8px;width:24px;text-align:center;font-size:12px;color:var(--p-mute);font-variant-numeric:tabular-nums}
.one{margin-top:12px;background:var(--p-raise);border-radius:8px;padding:12px;font-size:14.5px}
.one b{color:var(--p-ink);font-weight:500}

const REC=(()=>{
