<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- ⚠ 버전을 박는다. @2 는 CDN 이 언제든 새 2.x 로 갈아 끼워서, 우리가 아무것도 안 고친 날에도 로그인 동작이 바뀔 수 있다. 올릴 때는 로그인 한 번 해 보고 올린다. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2/dist/umd/supabase.min.js"></script>
<style>

:root{color-scheme:dark;
 --bg:#0a0a0f; --card:rgba(255,255,255,.03); --bd:rgba(255,255,255,.07);
 --tx:#f5f5fa; --tx2:#b8b8c5; --dim:#8a8a98;
 --good:#c8f0da; --mid:#fce8c8; --bad:#ff5c8a; --acc:#f5a0a0;}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--tx);
 font:14px/1.5 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;padding:20px clamp(12px,3.5vw,44px) 60px}
h1{font-size:22px;margin:8px 0 14px} h2{font-size:13px;letter-spacing:.14em;color:var(--acc);margin:26px 0 10px;text-transform:uppercase}
a{color:inherit;text-decoration:none} a.nm:hover{color:var(--acc)}
.dim{color:var(--dim);font-size:12px} .lbl{color:var(--dim);font-size:11px;letter-spacing:.08em;margin-bottom:4px}
.cnt{background:rgba(245,160,160,.15);color:#ffd9d9;font-size:12px;border-radius:9px;padding:1px 8px;vertical-align:2px}
.cnt2{display:inline-block;min-width:38px;text-align:center;background:rgba(245,160,160,.12);color:#ffd9d9;font-size:12px;border-radius:8px;padding:1px 6px;margin-right:8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;display:block}
.grid{display:grid;gap:12px} .sig-grid{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.ban-grid{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))} .one-grid{grid-template-columns:1fr}
.two{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
@media(max-width:900px){.two{grid-template-columns:1fr}}
/* 상단 메뉴 */
.topbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--bd);padding-bottom:12px}
.brand{font-weight:800;color:var(--acc);font-size:16px;white-space:nowrap}
.brand small{color:var(--dim);font-weight:400;font-size:12px;margin-left:8px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{padding:7px 15px;border-radius:10px;color:var(--tx2);font-size:14px}
nav a.on{background:rgba(245,160,160,.14);color:#ffd9d9;font-weight:700}
.view{display:none} .view.on{display:block}
.bk{margin:6px 0} .bk a{color:var(--dim);font-size:13px} .bk a:hover{color:var(--acc)}
/* 공통 요소 */
.sig-head{display:flex;gap:8px;align-items:baseline} .sig-head a{font-weight:700;font-size:15px}
.ban{font-size:11px;color:var(--acc);background:rgba(245,160,160,.12);padding:1px 7px;border-radius:8px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 9px;border-radius:9px;background:rgba(255,255,255,.05);color:var(--tx2)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.chip.good .dot{background:var(--good)} .chip.mid .dot{background:var(--mid)}
.chip.bad{background:rgba(255,92,138,.13);color:#ffd7e3} .chip.bad .dot{background:var(--bad)}
.chip.acc .dot{background:var(--acc)} .chip.na .dot{background:var(--dim)}
.cmt{margin-top:7px;font-size:12px;color:var(--tx2)}
.bc-top{display:flex;justify-content:space-between;align-items:baseline} .bc-top b{font-size:16px}
.bc-prog{margin:6px 0 10px;font-weight:600}
.bc-row{display:flex;gap:18px;align-items:flex-end} .bc-stats{margin-left:auto;text-align:right}
.big{font-size:21px;font-weight:800} .big small{font-size:12px;font-weight:400;color:var(--dim);margin-left:1px}
.big.good{color:var(--good)} .big.mid{color:var(--mid)} .big.bad{color:var(--bad)} .big.na{color:var(--tx2)}
.bc-hwv{font-size:12px;color:var(--tx2)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0 4px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 14px}
/* 학생 테이블 */
.toolbar{display:flex;gap:8px;align-items:center;margin:0 0 12px;flex-wrap:wrap}
.fbtn{background:var(--card);border:1px solid var(--bd);color:var(--tx2);border-radius:9px;padding:5px 13px;cursor:pointer;font-size:13px}
.fbtn.on{background:rgba(245,160,160,.15);border-color:var(--acc);color:#ffd9d9}
#q{background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:9px;padding:6px 12px;width:170px;font-size:13px}
.srow,.thead{display:grid;grid-template-columns:125px 150px 85px 150px 75px 65px 85px 1fr;gap:9px;align-items:center}
.srow{border-bottom:1px solid var(--bd);padding:9px 6px} .srow:hover{background:rgba(255,255,255,.025)}
.s-name b{font-size:14px;margin-right:7px} .s-extra{font-size:12px;color:var(--acc);text-align:right}
.thead{padding:4px 6px;color:var(--dim);font-size:11px;letter-spacing:.06em}
.sort{cursor:pointer;user-select:none} .sort:hover{color:var(--tx2)}
.sort.asc::after{content:' ▲';color:var(--acc)} .sort.desc::after{content:' ▼';color:var(--acc)}
/* 반 상세 */
.tl-row{display:flex;gap:12px;padding:7px 0;border-bottom:1px solid var(--bd)} .tl-row:last-child{border:none}
.tl-d{color:var(--dim);font-size:12px;white-space:nowrap;padding-top:2px} .tl-p{font-weight:600}
.crow{display:grid;grid-template-columns:110px 140px 90px 90px 80px 90px 70px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--bd)}
.crow:last-child{border:none} .chead{color:var(--dim);font-size:11px;letter-spacing:.06em}
@media(max-width:900px){.crow{grid-template-columns:90px 1fr 80px} .crow span:nth-child(n+4){display:none}}
/* 클리닉 */
.cl-day{margin-bottom:2px} .cl-date{font-weight:800;color:var(--acc);margin-bottom:8px}
.cl-row{display:flex;gap:10px;align-items:baseline;padding:4px 0} .cl-row b{min-width:58px}
/* 추가학습 명단 */
.ex-row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:7px 0;border-bottom:1px solid var(--bd)}
.ex-row:last-child{border:none} .ex-row>b{min-width:58px;color:var(--tx2);font-size:12px}
.ex-nm{min-width:120px;font-weight:600} .ex-why{flex:1;min-width:180px;color:var(--tx2);font-size:12.5px}
.ex-why .chip{margin-left:6px} .ex-lk{font-size:12px;color:var(--acc)}
/* 루프 */
.lp-row{display:grid;grid-template-columns:170px 110px 150px 1fr;gap:12px;align-items:center;
 padding:9px 0;border-bottom:1px solid var(--bd)} .lp-row:last-child{border:none}
/* min-width:0 이 없으면 flex 자식이 안 줄어들어 표가 화면 밖으로 밀린다 */
.lp-t{display:flex;flex-wrap:wrap;gap:5px;min-width:0}
.lp-row>*{min-width:0} .lp-t .chip{max-width:100%}
@media(max-width:900px){.lp-row{grid-template-columns:1fr 100px} .lp-row .dim,.lp-t{grid-column:1/-1}}
/* 리포트 */
.rp-day{margin-bottom:20px}
/* 출결 캘린더 */
.calrow{display:flex;gap:4px;margin-bottom:4px} .calhead i{color:var(--dim);font-size:10px;font-style:normal}
.calrow i{width:20px;height:20px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center}
.cal.c-g{background:rgba(200,240,218,.55)} .cal.c-m{background:rgba(252,232,200,.6)}
.cal.c-b{background:rgba(255,92,138,.65)} .cal.c-e{background:rgba(255,255,255,.045)}
/* 약점 */
.wk-row summary{cursor:pointer;list-style:none;padding:7px 0;border-bottom:1px solid var(--bd)}
.wk-row summary::-webkit-details-marker{display:none} .wk-row summary:hover{color:var(--acc)}
.wk-n{margin-right:6px} .wk-names{padding:6px 0 10px 46px;color:var(--tx2);font-size:13px}
.wr-row{padding:5px 0;border-bottom:1px solid var(--bd)} .wr-row:last-child{border:none}
#tip{position:fixed;pointer-events:none;background:#1c1c26;border:1px solid var(--bd);color:var(--tx);
 padding:4px 9px;border-radius:7px;font-size:12px;opacity:0;transition:opacity .1s;z-index:9}
@media(max-width:900px){.srow,.thead{grid-template-columns:105px 1fr 85px}
 .s-rspark,.s-rate,.s-att,.s-wk,.s-extra,.th4,.th5,.th6,.th7,.th8{display:none}}

/* ── DB 직결판 추가 스타일 (로그인·상태표시) ── */
#login{max-width:340px;margin:14vh auto}
#login .logo{font-weight:800;color:var(--acc);font-size:20px;margin-bottom:14px;text-align:center}
#login input{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--bd);color:var(--tx);
 border-radius:10px;padding:11px;font:inherit;margin-top:4px}
#login button{width:100%;margin-top:10px;background:var(--acc);color:#141018;border:none;
 border-radius:10px;padding:12px;font:inherit;font-weight:800;cursor:pointer}
#login .msg{color:var(--dim);font-size:12px;margin-top:10px;min-height:18px}
.hidden{display:none !important}
#state{margin-left:auto;display:flex;align-items:center;gap:10px}
#state .pill{font-size:11px;color:var(--dim);border:1px solid var(--bd);border-radius:99px;padding:3px 10px}
#state button{background:transparent;border:1px solid var(--bd);color:var(--tx2);border-radius:9px;
 padding:5px 10px;font:inherit;font-size:12px;cursor:pointer}
/* 콘솔로 건너가는 링크 — 탭(#nav)이 아니라 상태줄에 둔다. 뷰가 아니라 다른 사이트다 */
#state .xlink{border:1px solid var(--bd);color:var(--tx2);border-radius:9px;padding:5px 10px;
 font-size:12px;text-decoration:none;white-space:nowrap}
@media (hover:hover) and (pointer:fine){#state button:hover,#state .xlink:hover{color:var(--acc);border-color:var(--acc)}}
#boot{color:var(--dim);padding:30px 2px}
.warn{color:var(--bad);font-size:12px}
/* 리포트 이미지 갤러리 (DB 직결판에만 있는 기능) */
details.rp-imgs{margin-top:10px}
details.rp-imgs summary{cursor:pointer;list-style:none;color:var(--acc);font-size:12px}
details.rp-imgs summary::-webkit-details-marker{display:none}
details.rp-imgs summary:before{content:'▸ ';}
details.rp-imgs[open] summary:before{content:'▾ ';}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;color:var(--dim);font-size:12px}
.rp-lnk{display:inline-block;padding:4px 10px;border-radius:9px;font-size:12px;
 border:1px solid var(--bd);background:rgba(245,160,160,.08);color:#ffd9d9}
.rp-lnk.none{opacity:.4;background:none}
@media (hover:hover) and (pointer:fine){.rp-lnk:hover{border-color:var(--acc);background:rgba(245,160,160,.18)}}

/* ── 0811 병합: 유형맵(tm-)·영상색인(vx-) ──
   ⚠ 클래스 이름을 접두사로 가른다. 원본 정적 HTML 은 .cell·.grid·.kpi 같은 흔한 이름을
     썼는데 대시보드 CSS 에 같은 이름이 이미 있다 — 그대로 들이면 서로 먹는다.
   ⚠ :hover 는 반드시 미디어쿼리 안에. 폰에서 탭하면 호버가 남아 유령 선택이 된다. */
#v-typemap{--b0:rgba(255,255,255,.04);--b1:rgba(252,232,200,.15);
 --b2:rgba(245,160,160,.28);--b3:#ff5c8a}
.tm-bar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:9px}
#tm-find{background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:9px;
 padding:5px 12px;width:120px;font:inherit;font-size:13px}
#tm-find::placeholder{color:var(--dim)}
.tm-first{background:rgba(255,92,138,.09);border:1px solid rgba(255,92,138,.28);
 border-radius:13px;padding:11px 15px;margin:14px 0 4px}
.tm-first.ok{background:rgba(200,240,218,.06);border-color:rgba(200,240,218,.25)}
.tm-first .h{font-size:11px;letter-spacing:.1em;color:var(--acc);margin-bottom:7px}
.tm-first.ok .h{color:#c8f0da}
.tm-first ol{margin:0;padding-left:19px}.tm-first li{margin:2px 0;cursor:pointer}
.tm-first .why{color:var(--dim);font-size:11.5px;margin-left:5px}
.tm-unit{margin:16px 0 0}
.tm-uh{display:flex;align-items:baseline;gap:9px;border-bottom:1px solid var(--bd);
 padding-bottom:6px;margin-bottom:9px}
.tm-uh b{font-size:14px}.tm-uh .c{color:var(--dim);font-size:11px}
.tm-sub{margin:0 0 11px}
.tm-sl{color:var(--dim);font-size:11px;letter-spacing:.04em;margin:0 0 5px;
 display:flex;gap:7px;align-items:center}
.tm-bars{display:inline-flex;gap:2px}
.tm-bars i{width:9px;height:4px;border-radius:2px;background:var(--b0);display:inline-block}
.tm-bars i.b1{background:var(--b1)}.tm-bars i.b2{background:var(--b2)}.tm-bars i.b3{background:var(--b3)}
.tm-grid{display:flex;flex-wrap:wrap;gap:6px}
.tm-cell{border:1px solid var(--bd);border-radius:9px;padding:6px 11px;font-size:12.5px;
 cursor:pointer;background:var(--b0);color:var(--dim);max-width:290px;line-height:1.35}
.tm-cell .n{font-weight:800;margin-left:6px;font-size:11px;opacity:.85}
.tm-cell.b1{background:var(--b1);color:#f3e6cf;border-color:rgba(252,232,200,.2)}
.tm-cell.b2{background:var(--b2);color:#ffe2e2;border-color:rgba(245,160,160,.4)}
.tm-cell.b3{background:rgba(255,92,138,.26);color:#ffdce7;border-color:var(--b3);font-weight:700}
.tm-cell.mine::after{content:"단독";font-size:9px;margin-left:6px;padding:1px 4px;border-radius:5px;
 background:rgba(255,255,255,.13);vertical-align:1px;font-weight:600}
.tm-cell.on{outline:2px solid var(--acc)}
#tm-detail{position:sticky;bottom:0;background:#12121a;border:1px solid var(--bd);
 border-radius:13px;padding:12px 15px;margin-top:18px;display:none}
#tm-detail h3{margin:0 0 2px;font-size:15px}
#tm-detail .full{color:var(--dim);font-size:11px;margin-bottom:2px}
#tm-detail .p{color:var(--tx2);font-size:11.5px;margin-bottom:9px}
#tm-detail table{width:100%;border-collapse:collapse;font-size:12px}
#tm-detail td{padding:4px 6px;border-bottom:1px solid var(--bd);color:var(--tx2)}
#tm-detail td:first-child{color:var(--tx);white-space:nowrap}
#tm-detail .acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
#tm-detail .acts a,#tm-detail .acts button{font-size:12px;padding:4px 11px;border-radius:8px;
 border:1px solid var(--bd);background:var(--card);color:var(--tx2);text-decoration:none;
 cursor:pointer;font-family:inherit}
#tm-cmd{margin-top:8px;font-size:11px;color:var(--dim);font-family:ui-monospace,Menlo,Consolas,monospace;
 background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:7px;padding:6px 9px;
 display:none;word-break:break-all}
.tm-leg{display:flex;gap:12px;flex-wrap:wrap;color:var(--dim);font-size:11px;align-items:center}
.tm-sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;
 vertical-align:-1px;border:1px solid var(--bd)}
.tm-note{color:var(--dim);font-size:11px;margin-top:22px;border-top:1px solid var(--bd);padding-top:10px}
@media (hover:hover) and (pointer:fine){
 .tm-cell:hover{filter:brightness(1.22)}.tm-first li:hover b{color:var(--acc)}}
.tm-cell:active{filter:brightness(1.3)}

#vx-q{width:100%;max-width:640px;background:var(--card);border:1px solid var(--bd);color:var(--tx);
 border-radius:11px;padding:11px 14px;font:inherit;font-size:15px;margin:4px 0 10px}
#vx-q::placeholder{color:var(--dim)}
.vx-grp{margin:16px 0 0}
.vx-gh{display:flex;gap:8px;align-items:baseline;border-bottom:1px solid var(--bd);
 padding-bottom:5px;margin-bottom:7px}
.vx-gh b{font-size:13px}.vx-gh .c{color:var(--dim);font-size:11px}
.vx-row{display:block;border:1px solid transparent;border-radius:10px;padding:7px 10px;
 color:inherit;text-decoration:none}
.vx-row+.vx-row{margin-top:2px}
.vx-row .k{display:inline-block;min-width:56px;font-size:10px;letter-spacing:.05em;padding:1px 6px;

 margin-right:8px;vertical-align:1px}
.vx-row .k.개념설명{background:rgba(200,240,218,.14);color:#c8f0da}
.vx-row .k.문제풀이{background:rgba(245,160,160,.16);color:#ffd9d9}
.vx-row .k.명대사{background:rgba(252,232,200,.13);color:#fce8c8}
.vx-row .t{color:var(--acc);font-variant-numeric:tabular-nums;font-size:12px;margin-left:7px}

.vx-row .n{display:block;color:var(--dim);font-size:11.5px;margin:2px 0 0 64px}

 border-radius:11px;padding:9px 13px;font-size:12px;margin:12px 0}

#v-video mark{background:rgba(245,160,160,.35);color:#fff;border-radius:3px;padding:0 2px}
@media (hover:hover) and (pointer:fine){
 .vx-row:hover{background:rgba(255,255,255,.04);border-color:var(--bd)}
 .vx-wrow a:hover{text-decoration:underline}}
.vx-row:active{background:rgba(255,255,255,.06)}

 */
const SB_URL = 'https://bkgerndnwukvuuqdgnxt.supabase.co';
const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJrZ2VybmRud3VrdnV1cWRnbnh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyNjA3MzgsImV4cCI6MjEwMTgzNjczOH0.VcfcTc9QkecKWFPUiYVXKGEXLxmVp8ugfiF6EV5_kjk';

/* ───────── 기본 유틸 ───────── */
const E = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#x27;');
function fnum(v) {
  if (v == null) return null;
  const s = String(v).trim().replace('점', '').replace('%', '');
  if (!s || s === '-') return null;
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}
const rate100 = v => { const n = fnum(v); return n == null ? null : n / 100; };
const g = v => v == null ? '—' : String(Math.round(v * 100) / 100);   // 파이썬 :g 대응
// 파이썬 round() 흉내: '정확히 절반'일 때만 짝수로 내리고, 그 밖에는 실수값 그대로 반올림.
// ⚠ v*10 으로 판정하면 안 된다 — 7.65(실제 7.65000000000000036)가 정확한 절반으로 보여서
//   파이썬은 7.7, JS는 7.6 이 되는 어긋남이 실제로 났다. 십진 전개로 판정한다.
function pyR0(v) {
  const s = v.toFixed(20), dot = s.indexOf('.');
  const frac = s.slice(dot + 1).replace(/0+$/, '');
  if (frac === '5') { const f = Math.floor(v); return f % 2 === 0 ? f : f + 1; }
  return Math.round(v);
}
function r1(v) {
  const s = v.toFixed(20), dot = s.indexOf('.');
  const d2 = s.slice(dot + 1, dot + 3), rest = s.slice(dot + 3).replace(/0+$/, '');
  if (d2[1] === '5' && rest === '') { const f = Math.floor(v * 10); return (f % 2 === 0 ? f : f + 1) / 10; }
  return parseFloat(v.toFixed(1));
}
// 파이썬이 round(x,1) 결과를 그대로 문자열화하는 자리는 정수도 '69.0'으로 찍힌다
const py1 = v => v == null ? '—' : (Number.isInteger(v) ? v + '.0' : String(v));
const D = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); };
const ds = dt => dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
const days = (a, b) => Math.round((a - b) / 86400000);
function dfmt(d, wd = true) {
  const t = D(d);
  return String(t.getMonth() + 1).padStart(2, '0') + '/' + String(t.getDate()).padStart(2, '0')
    + (wd ? `(${DOW[t.getDay()]})` : '');
}
const scoreCls = v => v == null ? 'na' : (v >= 8 ? 'good' : v >= 5 ? 'mid' : 'bad');
const rateCls = v => v == null ? 'na' : (v >= 0.9 ? 'good' : v >= 0.6 ? 'mid' : 'bad');
const wkCls = v => v == null ? 'na' : (v >= 80 ? 'good' : v >= 60 ? 'mid' : 'bad');
const attCls = a => a === '출석' ? 'good' : (a === '지각' || a === '늦참') ? 'mid' : a === '결석' ? 'bad' : 'na';
const chip = (cls, label) => `<span class="chip ${cls}"><i class="dot"></i>${E(label)}</span>`;
const slink = s => `<a class="nm" href="#student/${s.sid}">${E(s.name)}</a>`;
const sid2id = sid => sid.replace(/[^0-9A-Za-z가-힣]/g, '_');

// 파이썬 f'{x:.1f}' 도 절반은 짝수로 내린다 (61.25 → 61.2). 스파크라인 좌표가 어긋난다.
const f1 = x => r1(x).toFixed(1);

function sparkline(pts, w = 150, h = 36, lo = 0, hi = 10, unit = '점') {
  if (!pts || !pts.length) return '<span class="dim">기록 없음</span>';
  const n = pts.length, pad = 5;
  const xs = pts.map((_, i) => pad + (w - 2 * pad) * (n > 1 ? i / (n - 1) : 0.5));
  const ys = pts.map(p => h - pad - (h - 2 * pad) * (Math.max(lo, Math.min(hi, p[1])) - lo) / (hi - lo));
  const path = pts.map((_, i) => `${i === 0 ? 'M' : 'L'}${f1(xs[i])},${f1(ys[i])}`).join(' ');
  const lab = d => /^\d{4}-\d{2}-\d{2}$/.test(String(d)) ? String(d).slice(5).replace('-', '/') : String(d);
  const dots = pts.map((p, i) =>
    `<circle class="sp" data-tip="${E(lab(p[0]))} · ${g(p[1])}${unit}" cx="${f1(xs[i])}" cy="${f1(ys[i])}" `
    + `r="${i === n - 1 ? 4 : 3}" fill="${ACC}" stroke="#0a0a0f" stroke-width="2"/>`).join('');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img">`
    + `<path d="${path}" fill="none" stroke="${ACC}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${dots}</svg>`;
}

/* ───────── 로그인 (콘솔과 같은 이메일 OTP) ───────── */
async function sendOtp() {
  const email = $('email').value.trim(); if (!email) return;
  $('loginmsg').textContent = '코드 발송 중…';
  const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: false } });
  if (error) { $('loginmsg').textContent = '실패: ' + error.message; return; }
  $('step1').classList.add('hidden'); $('step2').classList.remove('hidden');
  $('loginmsg').textContent = '메일함에서 6자리 코드를 확인하세요.';
}
async function verifyOtp() {
  const email = $('email').value.trim(), token = $('otp').value.trim();
  $('loginmsg').textContent = '확인 중…';
  const { error } = await sb.auth.verifyOtp({ email, token, type: 'email' });
  if (error) $('loginmsg').textContent = '실패: ' + error.message;
}
/* scope:'local' — 이 브라우저에서만 나간다. 기본값(global)은 폰·다른 PC 세션까지 지운다. */
async function logout() { await sb.auth.signOut({ scope: 'local' }); location.reload(); }
function reload() { location.reload(); }
sb.auth.onAuthStateChange((ev, session) => { if (session) boot(session); });

/* 초대·매직링크가 실패해 돌아오면 주소 끝에 #error=... 가 붙는다. 그대로 두면 아무 말 없이
   로그인 화면이 떠서 "링크를 눌렀는데 안 된다"가 된다(0811 조교 계정에서 실제로 겪음).
   ⚠ 콘솔(console.html)에도 같은 코드가 있다 — 고치면 두 쪽을 같이 고친다. */
(function () {
  const h = new URLSearchParams((location.hash || '').replace(/^#/, ''));
  const err = h.get('error_description') || h.get('error');
  if (!err) return;
  const el = $('loginmsg');
  if (el) el.textContent = /expired|invalid/i.test(err)
    ? '초대 링크가 만료됐거나 이미 사용됐습니다. 아래에서 인증 코드를 받아 로그인하세요.'
    : '로그인 실패: ' + err;
  history.replaceState(null, '', location.pathname + location.search);
})();

/* ⚠ 역할 읽기 실패로 로그아웃하지 않는다 (0811 사고).
   예전 코드는 `.single()` 이 돌려주는 것을 '역할 없음' 하나로 뭉뚱그려 **무조건 signOut** 했다.
   ①`.single()` 은 0행일 때도 에러를 낸다 ②네트워크 한 번 튀어도 같은 자리로 떨어진다
   ③supabase-js 의 signOut 은 기본이 **global** 이라 그 한 번이 **모든 기기의 세션을 지운다**.
   그래서 "로그인 → 실패 → 로그아웃 → 다시 로그인"이 무한히 돌았다.
   → 0행(maybeSingle 이 null)과 읽기 실패(error)를 가르고, 로그아웃은 local 로만 한다.
   ⚠ 콘솔(console.html)에도 같은 코드가 있다 — 고치면 두 쪽을 같이 고친다. */
async function boot(session) {
  const { data: prof, error: perr } = await sb.from('profiles').select('*')
    .eq('user_id', session.user.id).maybeSingle();
  if (perr) {
    $('loginmsg').textContent = '역할을 못 읽었다: ' + perr.message + ' — 새로고침해 보세요(로그아웃되지 않습니다).';
    return;
  }
  if (!prof) {
    $('loginmsg').textContent = '계정에 역할이 없습니다. 관리자에게 문의.';
    await sb.auth.signOut({ scope: 'local' }); return;
  }
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  try {
    const raw = await loadAll();
    const st = compute(raw);
    render(st);
    wire(st);
    $('boot').classList.add('hidden');
    $('hdr-date').textContent = `학습현황 · ${dfmt(st.REF)} 기준`;
    $('freshness').textContent = `데이터 최신 ${dfmt(st.LAST, false)} · ${new Date().toTimeString().slice(0, 5)} 조회`;
  } catch (e) {
    // permission denied = 세션이 없는 채로 읽었다는 뜻(anon 은 어느 표에도 권한이 없다).
    // "weekly_exam: permission denied" 만 띄우면 표가 깨진 줄 안다 — 실제 원인을 말한다.
    const msg = String(e.message || e);
    $('boot').innerHTML = /permission denied/i.test(msg)
      ? `<div class="warn">로그인이 풀렸습니다. 새로고침해서 다시 로그인하세요.<br>
         <span style="opacity:.7">(원문: ${E(msg)})</span></div>`
      : `<div class="warn">데이터를 못 읽었다: ${E(msg)}</div>`;
    throw e;
  }
}

/* ───────── 조회 ───────── */
const TABLES = ['daily_log', 'wrong_answers', 'weekly_exam', 'class_log', 'loop_box',
  'loop_submit', 'clinic_roster', 'type_map',
  // 0811 추가 — 정적판에 없던 뷰 3종(내신·클리닉 실시기록·시험메타)
  'school_exam', 'exam_meta', 'exam_source', 'clinic_log',
  // 0811 병합 — 유형맵·영상색인 (세션이 만들던 정적 HTML 두 장을 탭으로 들였다)
  // students(학생마스터)는 집계에 안 쓰고 **반 표기를 푸는 데만** 쓴다. 오답.csv 의 반은
  // 'A'·'S' 같은 축약이라 마스터를 안 보면 반 버튼이 '고1S'와 'S'로 갈라진다.
  'type_system', 'round_date', 'video_record', 'video_index', 'students'];
// 없어도 페이지가 죽지 않는 표. 스키마를 올리기 전에 앱이 먼저 배포돼도 그 탭만 비고
// 나머지는 멀쩡히 돈다. (0811 이전엔 표 하나가 없으면 boot 이 통째로 실패했다)
const OPTIONAL = new Set(['type_system', 'round_date', 'video_record', 'video_index', 'students']);
async function fetchAll(table) {
  const page = 1000; let from = 0, out = [];
  for (;;) {
    const { data, error } = await sb.from(table).select('*').range(from, from + page - 1);
    if (error) {
      if (OPTIONAL.has(table)) { console.warn(`${table} 없음/못 읽음 — 빈 값으로 진행:`, error.message); return out; }
      throw new Error(`${table}: ${error.message}`);
    }
    out = out.concat(data);
    if (data.length < page) return out;
    from += page;
  }
}
async function loadAll() {
  const res = await Promise.all(TABLES.map(fetchAll));
  const o = {};
  TABLES.forEach((t, i) => o[t] = res[i]);
  return o;
}

/* ───────── 집계 (dashboard.py '데이터 조립' 이식) ───────── */
function compute(raw) {
  const journal = raw.daily_log.filter(r => String(r['날짜'] || '').startsWith('20'));
  const dates = [...new Set(journal.map(r => r['날짜']))].sort();
  const LAST = dates[dates.length - 1];
  const TODAY = ds(new Date());
  const NEXT = ds(new Date(D(LAST).getTime() + 86400000));
  const REF = TODAY > NEXT ? TODAY : NEXT;
  const refdt = D(REF), anchor = D(LAST);
  const within = (d, n) => days(refdt, D(d)) < n;
  const withinData = (d, n) => days(anchor, D(d)) < n;

  const byStu = {};
  journal.forEach(r => {
    if (r['날짜'] > REF) return;
    (byStu[r['학생ID']] = byStu[r['학생ID']] || []).push(r);
  });
  Object.values(byStu).forEach(rows => rows.sort((a, b) => a['날짜'] < b['날짜'] ? -1 : 1));

  const TYPEMAP = {};
  raw.type_map.forEach(r => {
    const k = (r['원태그'] || '').trim();
    if (k) TYPEMAP[k] = [(r['정규유형'] || '').trim(), (r['정규단원'] || '').trim()];
  });

  const wrByStu = {};
  raw.wrong_answers.forEach(r => {
    let tag = (r['틀린유형(태그)'] || '').trim();
    if (!tag) return;
    let unit = (r['단원'] || '').trim();
    if (TYPEMAP[tag]) { unit = TYPEMAP[tag][1] || unit; tag = TYPEMAP[tag][0]; }
    (wrByStu[r['학생ID']] = wrByStu[r['학생ID']] || []).push([tag, unit, (r['시험종류'] || '').trim()]);
  });

  const wkByStu = {};
  raw.weekly_exam.forEach(r => {
    if (WK_EXCLUDE.has((r['소스'] || '').trim())) return;
    const sc = fnum(r['점수']), rd = String(r['회차'] || '').replace(/\D/g, '');
    if (sc == null || !rd) return;
    (wkByStu[r['학생ID']] = wkByStu[r['학생ID']] || []).push([parseInt(rd), sc]);
  });
  Object.values(wkByStu).forEach(a => a.sort((x, y) => x[0] - y[0]));

  const clsHist = {};
  raw.class_log.forEach(r => {
    const d = r['날짜'] || '';
    if (!d.startsWith('20') || d > REF) return;
    (clsHist[r['반']] = clsHist[r['반']] || []).push(r);
  });
  Object.values(clsHist).forEach(a => a.sort((x, y) => x['날짜'] < y['날짜'] ? -1 : 1));

  const students = [];
  Object.keys(byStu).forEach(sid => {
    const rows = byStu[sid];
    if (!withinData(rows[rows.length - 1]['날짜'], 14)) return;   // 활동 학생만
    const last = rows[rows.length - 1];
    const hist = rows.map(r => [r['날짜'], fnum(r['점수']), (r['테스트상태'] || '').trim(),
      rate100(r['이행률']), (r['출결'] || '').trim()]);
    const scored = hist.filter(h => h[1] != null && (h[2] === '응시' || h[2] === '늦참')).map(h => [h[0], h[1]]);
    const rates = hist.filter(h => h[3] != null).map(h => [h[0], h[3]]);
    const atts = hist.filter(h => h[4]).map(h => [h[0], h[4]]);
    const lastScore = (scored.length && scored[scored.length - 1][0] === last['날짜']) ? scored[scored.length - 1][1] : null;
    const lastRate = rate100(last['이행률']);
    const att = (last['출결'] || '').trim(), status = (last['테스트상태'] || '').trim();

    const flags = [];
    if (att === '결석') flags.push([0, '결석' + (last['결석사유'] ? `(${last['결석사유']})` : '')]);
    else if (att === '지각' || att === '늦참') flags.push([1, '지각']);
    if (status === '미응시' && att !== '결석') flags.push([1, '리뷰테스트 미응시']);
    if (lastScore != null && lastScore < 5) flags.push([0, `테스트 부진 ${g(lastScore)}점`]);
    if (lastRate != null && lastRate < 0.6) flags.push([0, `과제이행 ${pyR0(lastRate * 100)}%`]);
    if (scored.length >= 3) {
      const [a, b, c] = [scored[scored.length - 3][1], scored[scored.length - 2][1], scored[scored.length - 1][1]];
      if (c < b && b < a && c < 8) flags.push([1, '점수 연속 하락']);
    }

    const seenEd = {};
    rows.forEach(r => {
      const ad = String(r['추가학습날짜'] || '').trim().slice(0, 10);
      if (ad.startsWith('20')) seenEd[ad] = [(r['추가학습시간'] || '').trim(), (r['추가학습사유'] || '').trim()];
    });
    const extras = Object.keys(seenEd).sort().map(d => [d, seenEd[d][0], seenEd[d][1]]);
    const up = extras.find(e => e[0] >= REF);
    const upcoming = up ? `${dfmt(up[0])} ${up[1]}시` : '';

    const cnt = {};
    (wrByStu[sid] || []).forEach(([tag]) => cnt[tag] = (cnt[tag] || 0) + 1);
    const wrRank = Object.entries(cnt).sort((x, y) => y[1] - x[1]);

    const wk = wkByStu[sid] || [];
    const comments = rows.filter(r => (r['코멘트'] || '').trim()).map(r => [r['날짜'], (r['코멘트'] || '').trim()]);
    students.push({
      sid, name: last['이름'], ban: last['반'],
      school: (sid.split('_').length >= 3) ? sid.split('_').pop() : '',
      spark: scored.slice(-8), scored, rates, atts, wk,
      wkLast: wk.length ? wk[wk.length - 1][1] : null,
      lastDate: last['날짜'], lastScore, lastRate, att, status,
      avg: scored.length ? r1(scored.reduce((s, x) => s + x[1], 0) / scored.length) : null,
      flags, extras, upcoming,
      comment: ((last['코멘트'] || '').trim().split('\n')[0]) || '',
      comments, wrRank
    });
  });
  students.sort((a, b) => a.ban === b.ban ? (a.sid < b.sid ? -1 : 1) : (a.ban < b.ban ? -1 : 1));

  const smap = {}; students.forEach(s => smap[s.sid] = s);
  const bans = [...new Set(students.map(s => s.ban))].sort();
  const signal = students.filter(s => s.flags.length && withinData(s.lastDate, 4))
    .sort((a, b) => {
      const la = Math.min(...a.flags.map(f => f[0])), lb = Math.min(...b.flags.map(f => f[0]));
      return la !== lb ? la - lb : (a.ban < b.ban ? -1 : 1);
    });

  const clsTrend = {}, clsRateTrend = {};
  bans.forEach(b => {
    const pd = {}, pr = {};
    students.filter(s => s.ban === b).forEach(s => {
      s.scored.forEach(([d, sc]) => (pd[d] = pd[d] || []).push(sc));
      s.rates.forEach(([d, rt]) => (pr[d] = pr[d] || []).push(rt));
    });
    clsTrend[b] = Object.keys(pd).sort().map(d => [d, r1(pd[d].reduce((a, c) => a + c, 0) / pd[d].length)]);
    clsRateTrend[b] = Object.keys(pr).sort().map(d => [d, pyR0(100 * pr[d].reduce((a, c) => a + c, 0) / pr[d].length)]);
  });

  const clinic = [];
  students.forEach(s => s.extras.forEach(([d, t, why]) => clinic.push({ d, t, why, s })));
  clinic.sort((a, b) => a.d !== b.d ? (a.d < b.d ? -1 : 1) : (String(a.t) < String(b.t) ? -1 : 1));

  const wd = refdt.getDay();
  const todayBans = bans.filter(b => (clsHist[b] || []).some(
    r => within(r['날짜'], 21) && D(r['날짜']).getDay() === wd));

  // 이름 → 학생 (0811 신설 뷰가 이름밖에 없는 행을 학생 페이지로 잇는 데 쓴다.
  // ⚠ 학생ID를 조합하지 않는다 — 마스터(students)가 붙인 ID만 따라간다)
  const byName = {};
  students.forEach(s => { if (!(s.name in byName)) byName[s.name] = s; });

  return {
    raw, journal, students, smap, byName, bans, signal, clsHist, clsTrend, clsRateTrend,
    clinic, todayBans, wrByStu, REF, LAST, refdt, within, withinData
  };
}

function attCalendar(st, s) {
  const amap = {}; s.atts.forEach(([d, a]) => amap[d] = a);
  const ref = st.refdt;
  const pyWd = (ref.getDay() + 6) % 7;                       // 월=0 (파이썬 weekday)
  const start = new Date(ref.getTime() - (pyWd + 63) * 86400000);   // 10주 전 월요일
  let out = '<div class="calrow calhead">' + ['월', '화', '수', '목', '금', '토', '일'].map(x => `<i>${x}</i>`).join('') + '</div>';
  for (let w = 0; w < 10; w++) {
    let row = '';
    for (let i = 0; i < 7; i++) {
      const day = ds(new Date(start.getTime() + (w * 7 + i) * 86400000));
      const a = amap[day];
      const cls = 'c-' + (a === '출석' ? 'g' : (a === '지각' || a === '늦참') ? 'm' : a === '결석' ? 'b' : 'e');
      row += `<i class="cal ${cls} sp" data-tip="${dfmt(day)}${a ? ' ' + E(a) : ''}"></i>`;
    }
    out += `<div class="calrow">${row}</div>`;

/* 뷰 4: 추가학습 */
const ST_CLS = { '지정': 'mid', '발행': 'acc', '완료': 'good' };
function extRow(st, r) {
  const types = String(r['지정유형'] || '').split('·').filter(Boolean);
  const link = r['링크'] ? `<a class="nm" href="${E(r['링크'])}" target="_blank" rel="noopener">문항</a>` : '';
  const who = st.smap[r['학생ID'] || ''];
  const nm = who ? slink(who) : E(r['이름'] || '');
  const att = r['출석'] || '';
  return `<div class="ex-row"><b>${E(r['시간'] || '—')}</b>`
    + `<span class="ex-nm">${nm} <span class="ban">${E(r['반'] || '')}</span></span>`
    + `<span class="ex-why">${E(r['사유'] || '')}`
    + types.map(t => `<span class="chip">${E(t)}</span>`).join('') + '</span>'
    + chip(ST_CLS[r['상태']] || 'na', (r['상태'] || '') + (r['문항수'] ? ` ${r['문항수']}문항` : ''))
    + (att ? chip(att === '출석' ? 'good' : att === '결석' ? 'bad' : 'mid', att) : '')
    + (r['결과'] ? chip('acc', r['결과']) : '')
    + `<span class="ex-lk">${link}</span></div>`;
}
function group(items, empty, dateOf, rowOf, REF) {
  if (!items.length) return `<div class="dim">${E(empty)}</div>`;
  let out = '', cur = null;
  items.forEach(it => {
    const d = dateOf(it);
    if (d !== cur) {
      if (cur !== null) out += '</div></div>';
      out += `<div class="card cl-day"><div class="cl-date">${dfmt(d)}`
        + `${d === REF ? ' <span class="chip acc"><i class="dot"></i>오늘</span>' : ''}</div><div>`;
      cur = d;
    }
    out += rowOf(it);
  });
  return out + '</div></div>';
}
function viewClinic(st) {
  const rows = st.raw.clinic_roster.filter(r => String(r['날짜'] || '').startsWith('20'))
    .sort((a, b) => (a['날짜'] + (a['시간'] || '') + (a['이름'] || '')) < (b['날짜'] + (b['시간'] || '') + (b['이름'] || '')) ? -1 : 1);
  const up = rows.filter(r => r['날짜'] >= st.REF);
  const past = rows.filter(r => r['날짜'] < st.REF && st.within(r['날짜'], 15));
  const done = past.filter(r => r['출석']);
  const attRate = done.length ? `${pyR0(100 * done.filter(r => r['출석'] === '출석').length / done.length)}%` : '—';
  const clUp = st.clinic.filter(c => c.d >= st.REF);
  const clPast = st.clinic.filter(c => c.d < st.REF && st.within(c.d, 8));

    + `<h2>추가학습 — 지정한 대상자 <span class="cnt">${up.length}</span></h2>`

    + `<div class="grid one-grid">${group(up, '지정한 대상자가 없다. 루프 화면 5번에서 고른다', r => r['날짜'], r => extRow(st, r), st.REF)}</div>`
    + `<h2>지난 2주</h2><div class="grid one-grid">${group(past, '이력 없음', r => r['날짜'], r => extRow(st, r), st.REF)}</div>`

    + '</section>';
}

/* 뷰 5: 루프 */
function viewLoop(st) {
  const refdt = st.refdt;
  const loopRate = r => {
    const wrong = Math.max(1, parseInt(r['틀린횟수'] || 1) || 1), ok = parseInt(r['인증횟수'] || 0) || 0;
    return Math.min(10, Math.max(0.5, 1.5 * wrong / (1 + 0.5 * ok)));
  };
  const loopScore = r => {
    const base = fnum(r['인증도']) || 0;
    if (base < FULL) return base;
    const gap = days(refdt, D(r['기준일'] || st.REF));
    return Math.max(0, base - loopRate(r) * Math.max(0, gap));
  };
  const by = {};
  st.raw.loop_box.forEach(r => (by[r['학생ID']] = by[r['학생ID']] || []).push([loopScore(r), r]));
  const stat = Object.keys(by).map(sid => {
    const rows = by[sid], s = st.smap[sid];
    const waits = rows.filter(([sc]) => sc < LINE).sort((a, b) => a[0] - b[0]);
    return {
      sid, name: (s && s.name) || rows[0][1]['이름'], ban: (s && s.ban) || rows[0][1]['반'],
      n: rows.length, wait: waits.length,
      avg: pyR0(rows.reduce((a, c) => a + c[0], 0) / rows.length),
      top: waits.slice(0, 4).map(([sc, r]) => [r['정규유형'], Math.trunc(sc)]), stu: s
    };
  }).sort((a, b) => b.wait - a.wait || a.name.localeCompare(b.name, 'ko'));

  const row = x => `<div class="lp-row"><span class="lp-nm">${x.stu ? slink(x.stu) : E(x.name)} <span class="ban">${E(x.ban)}</span></span>`
    + `<span class="big ${x.wait >= 6 ? 'bad' : x.wait ? 'mid' : 'good'}">${x.wait}<small>개 대기</small></span>`
    + `<span class="dim">유형 ${x.n} · 평균 ${x.avg}%</span>`
    + `<span class="lp-t">${x.top.map(([t, sc]) => `<span class="chip">${E(String(t).replace('(서술)', ''))} ${sc}%</span>`).join('')
    || '<span class=dim>다 인증했다</span>'}</span></div>`;

  const seen = new Set(), cards = [];
  st.raw.loop_submit.slice().sort((a, b) => String(b['제출시각'] || '').localeCompare(String(a['제출시각'] || '')))
    .forEach(r => {
      const k = r['학생ID'] + '|' + r['루프ID'];
      if (seen.has(k) || cards.length >= 24) return;
      seen.add(k);
      const kind = r['종류'] || '루프';
      cards.push(`<div class="cl-row"><b>${E(String(r['제출시각'] || '').slice(5, 16))}</b>`
        + `${E(r['이름'] || '')} <span class="ban">${E(r['반'] || '')}</span>`
        + chip(kind === '추가학습' ? 'acc' : 'na', kind)
        + `<span class="dim">${E(r['맞은개수'])}/${E(r['총문항'])}</span></div>`);
    });

  return '<section class="view" id="v-loop"><h2>루프 — 유형별 인증 현황 '
    + '<span class="dim" style="font-size:12px">인증도 70% 밑이면 다시 나간다</span></h2>'
    + '<div class="kpis">'
    + `<div class="kpi"><div class="lbl">추적 중인 학생</div><div class="big">${stat.length}<small>명</small></div></div>`
    + `<div class="kpi"><div class="lbl">인증 대기 유형</div><div class="big">${stat.reduce((a, x) => a + x.wait, 0)}<small>개</small></div></div>`
    + `<div class="kpi"><div class="lbl">6개 넘게 밀린 학생</div><div class="big">${stat.filter(x => x.wait >= 6).length}<small>명</small></div></div>`
    + `<div class="kpi"><div class="lbl">루프함 전체</div><div class="big">${st.raw.loop_box.length}<small>행</small></div></div></div>`
    + (stat.length ? `<div class="card">${stat.map(row).join('')}</div>` : '<div class="dim">루프함이 비었다</div>')
    + '<h2>최근 제출</h2>'
    + (cards.length ? `<div class="card">${cards.join('')}</div>` : '<div class="dim">제출 기록 없음</div>')
    + '</section>';
}

/* 뷰 6: 리포트 */
function viewReport(st) {
  const dayRows = {};
  st.journal.forEach(r => {
    if (r['날짜'] > st.REF) return;
    const k = r['날짜'] + '|' + r['반'];
    (dayRows[k] = dayRows[k] || []).push(r);
  });
  const dayCard = (d, ban, rows) => {
    const sc = rows.filter(r => ['응시', '늦참'].includes((r['테스트상태'] || '').trim()))
      .map(r => fnum(r['점수'])).filter(v => v != null);
    const rt = rows.map(r => rate100(r['이행률'])).filter(v => v != null);
    const absent = rows.filter(r => (r['출결'] || '') === '결석').map(r => r['이름']);
    const miss = rows.filter(r => (r['테스트상태'] || '') === '미응시' && (r['출결'] || '') !== '결석').map(r => r['이름']);
    const scAvg = sc.length ? sc.reduce((a, c) => a + c, 0) / sc.length : null;
    const rtAvg = rt.length ? rt.reduce((a, c) => a + c, 0) / rt.length : null;
    const names = rows.map(r => r['이름']).filter(Boolean);
    return `<div class="card"><div class="bc-top"><b>${E(ban)}</b>`
      + `<span class="dim">${dfmt(d)} · ${rows.length}명</span></div>`
      + '<div class="bc-row" style="gap:22px;margin-top:8px">'
      + `<span><div class="lbl">리뷰 평균</div><div class="big ${scoreCls(scAvg)}">${scAvg != null ? py1(r1(scAvg)) : '—'}<small>점</small></div></span>`
      + `<span><div class="lbl">과제 이행</div><div class="big ${rateCls(rtAvg)}">${rtAvg != null ? pyR0(100 * rtAvg) : '—'}<small>%</small></div></span>`
      + '</div>'
      + (absent.length ? `<div class="chips">${chip('bad', '결석 ' + absent.join(' '))}</div>` : '')
      + (miss.length ? `<div class="chips">${chip('mid', '미응시 ' + miss.join(' '))}</div>` : '')
      // 서버 렌더된 리포트 이미지 (정적판에 없는 기능 → class="dbonly" 로 표시해 패리티 게이트에서 뺀다)
      + (names.length ? `<details class="dbonly rp-imgs" data-date="${d}" data-names="${E(names.join('|'))}">`
        + `<summary>리포트 이미지 ${names.length}장</summary><div class="thumbs">불러오는 중…</div></details>` : '')
      + '</div>';
  };
  const allDays = [...new Set(Object.keys(dayRows).map(k => k.split('|')[0]))].sort().reverse().slice(0, 20);
  const daily = allDays.map(d => {
    const bansOf = Object.keys(dayRows).filter(k => k.startsWith(d + '|')).map(k => k.split('|')[1]).sort();
    return `<div class="rp-day"><div class="cl-date">${dfmt(d)}</div><div class="grid ban-grid">`
      + bansOf.map(b => dayCard(d, b, dayRows[d + '|' + b])).join('') + '</div></div>';
  }).join('') || '<div class="dim">데일리 기록 없음</div>';

  const rounds = {};
  st.raw.weekly_exam.forEach(r => {
    if (WK_EXCLUDE.has((r['소스'] || '').trim())) return;
    const sc = fnum(r['점수']), rd = String(r['회차'] || '').replace(/\D/g, '');
    if (sc == null || !rd) return;
    (rounds[rd] = rounds[rd] || []).push([sc, r]);
  });
  const wkCard = rd => {
    const rows = rounds[rd], vals = rows.map(x => x[0]);
    const top = rows.slice().sort((a, b) => b[0] - a[0]).slice(0, 3);
    const avg = vals.reduce((a, c) => a + c, 0) / vals.length;
    return `<div class="card"><div class="bc-top"><b>${rd}회</b>`
      + `<span class="dim">${vals.length}명 응시</span></div>`
      + '<div class="bc-row" style="gap:22px;margin-top:8px">'
      + `<span><div class="lbl">평균</div><div class="big ${wkCls(avg)}">${py1(r1(avg))}<small>점</small></div></span>`
      + `<span><div class="lbl">최고</div><div class="big good">${g(Math.max(...vals))}<small>점</small></div></span>`
      + `<span><div class="lbl">80점 이상</div><div class="big">${vals.filter(v => v >= 80).length}<small>명</small></div></span></div>`
      + '<div class="chips">' + top.map(([v, r]) => chip('acc', `${r['이름'] || ''} ${g(v)}`)).join('') + '</div></div>';
  };
  const weekly = Object.keys(rounds).map(Number).sort((a, b) => b - a).map(rd => wkCard(String(rd))).join('')
    || '<div class="dim">주간고사 기록 없음</div>';

  return '<section class="view" id="v-report"><h2>주간고사 회차별</h2>'
    + `<div class="grid ban-grid">${weekly}</div>`
    + '<h2>데일리 — 날짜별 반 요약 <span class="dim" style="font-size:12px">'
    + '학생별 리포트 이미지는 카톡으로 나간 그대로 두고, 여기서는 수치만 다시 본다</span></h2>'
    + daily + '</section>';
}

/* 뷰 7: 약점 */
function weakBody(st, b) {
  const agg = {};
  st.students.forEach(s => {
    if (b !== '전체' && s.ban !== b) return;
    (st.wrByStu[s.sid] || []).forEach(([tag, unit]) => {
      const a = agg[tag] = agg[tag] || { n: 0, stu: new Set(), unit: unit };
      a.n++; a.stu.add(s.sid);
      if (unit) a.unit = unit;
    });
  });
  const rank = Object.entries(agg).sort((x, y) => y[1].stu.size - x[1].stu.size || y[1].n - x[1].n).slice(0, 15);
  if (!rank.length) return '<div class="dim">오답 데이터 없음</div>';
  return rank.map(([tag, v]) => {
    const names = [...v.stu].sort((a, b2) => st.smap[a].name.localeCompare(st.smap[b2].name, 'ko'))
      .map(sid => slink(st.smap[sid])).join(' · ');
    const unit = v.unit ? `<span class="dim">${E(v.unit)}</span> ` : '';
    return `<details class="wk-row"><summary><span class="cnt2">${v.stu.size}명</span>`
      + `<span class="wk-n dim">×${v.n}</span> ${unit}${E(tag)}</summary>`
      + `<div class="wk-names">${names}</div></details>`;
  }).join('');
}
function viewWeak(st) {
  const tabs = ['전체'].concat(st.bans);
  return '<section class="view" id="v-weak"><h2>약점 — 오답 유형 랭킹 <span class="dim" style="font-size:12px">틀린 학생 수 기준 · 유형을 누르면 학생 목록</span></h2>'
    + `<div class="toolbar">${tabs.map((b, i) => `<button class="fbtn wtab${i === 0 ? ' on' : ''}" data-w="${E(b)}">${E(b)}</button>`).join('')}</div>`
    + tabs.map(b => `<div class="card wbody" id="w-${E(b)}" style="${b === '전체' ? '' : 'display:none'}">${weakBody(st, b)}</div>`).join('')
    + '</section>';
}

/* ═════════ 0811 신설 3뷰 — 정적판에는 없다(패리티 대조 대상 아님) ═════════
 *
 * 내신·클리닉 실시기록·시험메타는 DB에 이미 들어와 있는데 화면이 없었다.
 * ⚠ 등급 판정 로직은 `01_운영/시험DB/시험메타조회.py` 가 단일 진실원이다. 여기 있는 것은
 *    그 이식본 — 규칙(컷 비교 순서·5등급 하한·학교키 정규화)을 고치면 두 쪽을 같이 고친다.
 * ⚠ **원점수 단독 해석 금지.** 등급컷·난이도 없이 낙폭을 말하지 않는다. 그래서 화면에
 *    점수만 크게 띄우지 않고 항상 등급·컷·난이도를 붙인다. 컷은 전부 '예상 추정치'다.
 */
const 학교키 = s => (String(s || '').trim().replace(/(고등학교|고)$/, '') || String(s || '').trim());
const META_INT = ['학년', '시행년', '학기', '문항수', '총점', '등급컷1', '등급컷2', '등급컷3',
  '등급컷4', '등급컷5하한', '응시자수'];

function metaFind(st, r) {
  const y = parseInt(r['시행년'], 10), gr = parseInt(r['학년'], 10), sm = parseInt(r['학기'], 10);
  return st.raw.exam_meta.find(m => 학교키(m['학교']) === 학교키(r['학교'])
    && mi(m, '학년') === gr && mi(m, '시행년') === y && mi(m, '학기') === sm
    && (m['시험구분'] || '') === (r['시험구분'] || '')) || null;
}
const mi = (m, k) => { const v = m[k]; return v === '' || v == null ? null : parseInt(v, 10); };

function metaGrade(score, m) {          // 시험메타조회.grade 이식
  if (!m || score == null) return null;
  const s = Number(score);
  if (!isFinite(s)) return null;
  for (const g of [1, 2, 3, 4]) { const c = mi(m, '등급컷' + g); if (c != null && s >= c) return g; }
  return mi(m, '등급컷5하한') != null ? 5 : null;
}
function metaRead(score, m) {           // 시험메타조회.해석 이식
  if (!m) return '시험 정보 없음 — 원점수만으로는 판단 불가';
  const g = metaGrade(score, m), nan = m['전체난이도'] || '?', c1 = mi(m, '등급컷1');
  if (g == null) return `등급컷 미확보 (난이도 ${nan})`;
  return `${g}등급권 (${c1 != null ? '1등급컷 ' + c1 : '컷 미확보'} · 난이도 ${nan} · 예상)`;
}
const gradeCls = g => g == null ? 'na' : (g <= 1 ? 'good' : g <= 3 ? 'mid' : 'bad');

/* 뷰 8: 내신 — 학교 시험 원점수에 등급을 붙여서 본다 */
function viewExam(st) {
  const rows = st.raw.school_exam.filter(r => (r['상태'] || '확보') === '확보' && r['점수'] !== '' && r['점수'] != null)
    .map(r => {
      const m = metaFind(st, r), sc = Number(r['점수']);
      const real = String(r['등급'] || '').trim();
      const g = real ? Math.round(Number(real)) : metaGrade(sc, m);
      return {
        r, m, sc, g, src: real ? '실측' : (g != null ? '추정' : null),
        read: real ? `${g}등급 (실측${m && mi(m, '등급컷1') != null ? ' · 예상컷 ' + mi(m, '등급컷1') : ''})` : metaRead(sc, m),
        gap: m && mi(m, '등급컷1') != null ? Math.round((sc - mi(m, '등급컷1')) * 10) / 10 : null,
        key: [r['시행년'], r['학기'], r['시험구분'] === '중간' ? 0 : 1].join('-'),
      };
    })
    .sort((a, b) => (b.key + b.r['이름']).localeCompare(a.key + a.r['이름'], 'ko'));
  const g1 = rows.filter(x => x.g === 1).length;
  const cut = rows.filter(x => x.m).length;
  const label = x => `${x.r['시행년']} ${x.r['학기']}학기 ${x.r['시험구분']}`;

  // 내신.csv 의 반은 축약(A·S·T·미적)이라 마스터의 반(고1A…)을 우선 쓴다
  const row = x => `<div class="cl-row"><b>${E(String(x.sc))}점</b> `
    + `${st.byName[x.r['이름']] ? slink(st.byName[x.r['이름']]) : `<span class="nm">${E(x.r['이름'])}</span>`}`
    + ` <span class="ban">${E((st.byName[x.r['이름']] || {}).ban || x.r['반'] || '')}</span>`
    + `${x.g != null ? chip(gradeCls(x.g), `${x.g}등급 ${x.src}`) : chip('na', '등급 미상')}`
    + `<span class="dim">${E(x.r['학교'] || '')} · ${E(x.read)}`
    + `${x.gap != null ? ` · 1등급컷 ${x.gap >= 0 ? '+' : ''}${x.gap}` : ''}</span></div>`;

  let out = '', cur = null;
  rows.forEach(x => {
    const L = label(x);
    if (L !== cur) { if (cur !== null) out += '</div></div>'; out += `<div class="card cl-day"><div class="cl-date">${E(L)}</div><div>`; cur = L; }
    out += row(x);
  });
  out = rows.length ? out + '</div></div>' : '<div class="dim">확보된 내신 기록이 없다</div>';

  return '<section class="view" id="v-exam">'
    + `<h2>내신 — 학교 시험 <span class="cnt">${rows.length}</span>`
    + '<span class="dim" style="font-size:12px"> 원점수만 보면 오독한다. 등급컷은 예상 추정치다</span></h2>'
    + '<div class="kpis">'
    + `<div class="kpi"><div class="lbl">확보 기록</div><div class="big">${rows.length}<small>건</small></div></div>`
    + `<div class="kpi"><div class="lbl">1등급권</div><div class="big">${g1}<small>건</small></div></div>`
    + `<div class="kpi"><div class="lbl">컷 붙은 기록</div><div class="big">${cut}<small>/${rows.length}</small></div></div>`
    + `<div class="kpi"><div class="lbl">학교</div><div class="big">${new Set(rows.map(x => 학교키(x.r['학교']))).size}<small>곳</small></div></div></div>`
    + `<div class="grid one-grid">${out}</div></section>`;
}

/* 뷰 9: 클리닉 실시기록 — 지정(추가학습 탭)이 아니라 **실제로 한 것** */
function viewClinicLog(st) {
  const rows = st.raw.clinic_log.filter(r => String(r['날짜'] || '').startsWith('20'))
    .sort((a, b) => (b['날짜'] + (b['시간'] || '')).localeCompare(a['날짜'] + (a['시간'] || '')));
  // ⚠ 날짜로 자르지 않는다. 회수한 기록이 02~06월(구 xlsx)이라 "최근 60일"로 자르면
  //   화면이 통째로 빈다. 최신 60건을 보여주고 기간을 KPI로 밝힌다.
  const recent = rows.slice(0, 60);
  const span = rows.length ? `${(rows[rows.length - 1]['날짜'] || '').slice(5)}~${(rows[0]['날짜'] || '').slice(5)}` : '—';
  const doneCnt = rows.filter(r => (r['실시여부'] || '') === '실시').length;
  const mine = rows.filter(r => (r['담당구분'] || '') === '유강').length;   // 값은 '유강'/'타강사'
  const byWhy = {};
  rows.forEach(r => { const k = (r['사유구분'] || r['사유'] || '기타').slice(0, 18); byWhy[k] = (byWhy[k] || 0) + 1; });
  const top = Object.entries(byWhy).sort((a, b) => b[1] - a[1]).slice(0, 8);

  const row = r => `<div class="cl-row"><b>${E(r['시간'] || '—')}</b> `
    + `${st.byName[r['이름']] ? slink(st.byName[r['이름']]) : `<span class="nm">${E(r['이름'])}</span>`}`
    + ` <span class="ban">${E(r['반'] || '')}</span>`
    + `${(r['실시여부'] || '') === '실시' ? chip('good', '실시') : chip('na', E(r['실시여부'] || '기록만'))}`
    + `<span class="dim">${E(r['사유'] || '')}${r['담당'] ? ' · ' + E(r['담당']) : ''}`
    + `${r['결과'] ? ' · ' + E(String(r['결과']).slice(0, 40)) : ''}</span></div>`;

  return '<section class="view" id="v-cliniclog">'
    + `<h2>클리닉 기록 — 실제로 한 것 <span class="cnt">${rows.length}</span>`
    + '<span class="dim" style="font-size:12px"> 지정 명단은 추가학습 탭. 여기는 실시 기록이다</span></h2>'
    + '<div class="kpis">'
    + `<div class="kpi"><div class="lbl">전체 기록</div><div class="big">${rows.length}<small>건</small></div></div>`
    + `<div class="kpi"><div class="lbl">실시</div><div class="big">${doneCnt}<small>건</small></div></div>`
    + `<div class="kpi"><div class="lbl">유강이 본 것</div><div class="big">${mine}<small>건</small></div></div>`
    + `<div class="kpi"><div class="lbl">기록 기간</div><div class="big" style="font-size:20px">${E(span)}</div></div></div>`
    + `<div class="card"><div class="lbl">사유 분포</div><div class="chips" style="margin-top:8px">`
    + (top.map(([k, v]) => chip('na', `${k} ${v}`)).join('') || '<span class="dim">—</span>') + '</div></div>'
    + `<h2>최근 ${recent.length}건</h2><div class="grid one-grid">${group(recent, '기록 없음', r => r['날짜'], row, st.REF)}</div>`
    + '</section>';
}

function viewExamMeta(st) {

      + `${m['학교평균'] ? chip('na', '평균 ' + m['학교평균']) : ''}`
      + `${n ? chip('acc', '출처 ' + n + '문항') : ''}</div>`
      + `<div class="lbl" style="margin-top:8px">예상 등급컷 ${m['컷출처'] ? `<span class="dim">(${E(m['컷출처'])})</span>` : ''}</div>`
      + `<div class="bc-hwv">${cs.length ? E(cs.join(' · ')) : '<span class="dim">미확보</span>'}</div>`
      + (m['범위'] ? `<div class="lbl" style="margin-top:8px">범위</div><div class="bc-hwv">${E(String(m['범위']).slice(0, 120))}</div>` : '')

    + `<h2>시험메타 — 점수를 해석하는 잣대 <span class="cnt">${metas.length}</span></h2>`

    + `<div class="kpi"><div class="lbl">등록 시험</div><div class="big">${metas.length}<small>건</small></div></div>`
    + `<div class="kpi"><div class="lbl">컷 확보</div><div class="big">${metas.filter(m => cuts(m).length).length}<small>건</small></div></div>`
    + `<div class="kpi"><div class="lbl">출처 기록</div><div class="big">${st.raw.exam_source.length}<small>문항</small></div></div>`
    + `<div class="kpi"><div class="lbl">학교</div><div class="big">${new Set(metas.map(m => 학교키(m['학교']))).size}<small>곳</small></div></div></div>`
    + `<div class="grid">${metas.map(card).join('') || '<div class="dim">등록된 시험이 없다</div>'}</div>`
    + '</section>';

/* ═════════ 0811 병합 ① 유형맵 — 학생별 약점 신호 지도 ═════════
 *
 * 세션이 `00_대시보드/유형맵.py` 로 만들던 정적 HTML 을 탭으로 들였다(정적판 은퇴 원칙).
 * ⚠ **성취도를 '정답률'이라 부르지 않는다.** 분모(시도수)가 없다. 여기서 재는 것은
 *    약점 신호 강도 S = Σ 0.5^(경과일/45) — 오답을 최근일수록 무겁게 센 값이다.
 * ⚠ 색 등급의 1순위는 **반복 여부**다. 1회 오답은 사고일 수 있다.
 * ⚠ 화면에 뜨는 유형(universe) = 같은 학년이 실제로 만난 유형(반 오답 ∪ 문항DB).
 *    '한 번도 안 틀림'과 '아직 안 배움'을 섞지 않으려는 장치다.
 * ⚠ 타일 이름은 유형체계 정식명에서 형제 유형을 가르는 일련번호를 뺀 것이다.
 *    데이터(조인 키)는 번호를 그대로 쓴다 — 화면에서만 숨긴다.
 */
const TM_HALF = 45;
const tmGrade = c => String(c || '').slice(0, 2);

function tmSplit(t) {                     // '접선의 방정식3 (원 밖의 점)' → ['접선의 방정식','원 밖의 점']
  const m = /^(.*?)(\d*)\s*\(([^)]*)\)\s*$/.exec(t);
  if (!m) return [String(t).replace(/\d+$/, '').trim(), ''];
  return [m[1].replace(/\d+$/, '').trim(), m[3].trim()];
}

function tmBuild(st) {
  const today = ds(new Date());
  const ROUND = {};
  (st.raw.round_date || []).forEach(r => { if (r['날짜']) ROUND[String(r['회차'] || '').trim()] = r['날짜']; });
  const TMAP = {};
  st.raw.type_map.forEach(r => {
    const k = (r['원태그'] || '').trim();
    if (k) TMAP[k] = [(r['정규단원'] || '').trim(), (r['정규유형'] || '').trim()];
  });
  const sysrows = st.raw.type_system || [];
  const SYS = {};
  sysrows.forEach(r => { if (!(r['유형'] in SYS)) SYS[r['유형']] = r; });

  // 학생 — 활동 명단(daily_log)이 기본, 오답에만 있는 학생은 마스터에서 반을 찾아 보탠다
  const stu = {};
  st.students.forEach(s => stu[s.sid] = { id: s.sid, name: s.name, cls: s.ban });
  const byName = {};
  Object.values(stu).forEach(s => { if (!(s.name in byName)) byName[s.name] = s; });
  // 마스터의 반은 축약(A·S·T)이라 학년을 앞에 붙여야 '고1S' 가 된다
  const mcls = {};
  (st.raw.students || []).forEach(r => {
    const nm = (r['이름'] || '').trim();
    const c = ((r['학년'] || '').trim() + (r['반'] || '').trim()).trim();
    if (nm && c && !(nm in mcls)) mcls[nm] = c;
  });

  const EV = [];
  st.raw.wrong_answers.forEach(r => {
    const tag = (r['틀린유형(태그)'] || '').trim();
    if (!tag) return;
    const mp = TMAP[tag], type = mp ? mp[1] : tag;
    const unit = (mp && mp[0]) || (SYS[type] || {})['중단원'] || '';
    let sid = (r['학생ID'] || '').trim() || (r['이름'] || '').trim();
    const name = (r['이름'] || '').trim();
    const dt = /^\d{4}-\d{2}-\d{2}/.test(String(r['날짜'] || '')) ? String(r['날짜']).slice(0, 10)
      : (ROUND[(r['시험명'] || '').trim()] || '');
    const age = dt ? Math.max(days(D(today), D(dt)), 0) : 60;
    // ⚠ 학생ID를 조합하지 않는다 — 마스터가 붙인 ID로만 이어 붙인다
    const known = stu[sid] || byName[name];
    const cls = (known && known.cls) || mcls[name] || (r['반'] || '').trim();
    if (known) sid = known.id;
    else if (!stu[sid]) stu[sid] = { id: sid, name, cls };
    EV.push({
      sid, type, unit, sub: (SYS[type] || {})['소단원'] || '',
      cls, date: dt, age,
      kind: (r['시험종류'] || '').trim(), exam: (r['시험명'] || '').trim(),
      qno: (r['문항'] || '').trim(), raw: tag, w: Math.pow(0.5, age / TM_HALF),
    });
  });

  // universe — 반이 실제로 만난 유형을 학년으로 합치고 문항DB로 보강
  const uniG = {};
  const add = (g, t) => { (uniG[g] = uniG[g] || new Set()).add(t); };
  EV.forEach(e => { if (e.cls) add(tmGrade(e.cls), e.type); });
  (st.raw.item_index || []).forEach(r => {
    const t = (r['정규유형'] || '').trim();
    if (t) add(String(r['자료명'] || '').includes('공통수학') ? '고1' : '고2', t);
  });

  // 표시 이름 — 소단원 안에서 겹치거나 앞머리가 소단원과 겉돌 때만 앞머리를 붙인다
  const LIVE = new Set();
  Object.values(uniG).forEach(s => s.forEach(t => LIVE.add(t)));
  const order = [], seenKey = new Set();
  sysrows.forEach(r => {
    if (!LIVE.has(r['유형'])) return;
    const k = [r['중단원'], r['소단원'], r['유형']].join('');
    if (seenKey.has(k)) return;
    seenKey.add(k);
    order.push({ u: r['중단원'], s: r['소단원'], t: r['유형'] });
  });
  const pre = {}, lab = {};
  order.forEach(o => { const [p, par] = tmSplit(o.t); pre[o.t] = p; lab[o.t] = par || p; });
  const bySub = {};
  order.forEach(o => (bySub[o.s] = bySub[o.s] || []).push(o.t));
  Object.entries(bySub).forEach(([s, ts]) => {
    const cnt = {};
    ts.forEach(t => cnt[lab[t]] = (cnt[lab[t]] || 0) + 1);
    ts.forEach(t => {
      const p = pre[t];
      if (p && lab[t] !== p && (cnt[lab[t]] > 1 || (!s.includes(p) && !p.includes(s))))
        lab[t] = `${p} · ${lab[t]}`;
    });
  });
  const sys = order.map(o => ({ u: o.u, s: o.s, t: o.t, l: lab[o.t] }));

  // 학생별 집계
  const per = {}, seenPair = new Set(), clsCnt = {}, clsN = {};
  EV.forEach(e => ((per[e.sid] = per[e.sid] || {})[e.type] = (per[e.sid][e.type] || [])).push(e));
  EV.forEach(e => {
    const k = [e.cls, e.type, e.sid].join('');
    if (!e.cls || seenPair.has(k)) return;
    seenPair.add(k);
    (clsCnt[e.cls] = clsCnt[e.cls] || {})[e.type] = ((clsCnt[e.cls] || {})[e.type] || 0) + 1;
  });
  Object.values(stu).forEach(s => { if (s.cls) clsN[s.cls] = (clsN[s.cls] || 0) + 1; });

  const band = (n, S, fresh) => (n >= 3 || (n === 2 && S >= 1.2)) ? 3
    : (n === 2 || (n === 1 && fresh)) ? 2 : (n ? 1 : 0);

  const students = [], map = {};
  Object.values(stu).sort((a, b) => (a.cls + a.name).localeCompare(b.cls + b.name, 'ko'))
    .forEach(s => {
      const rows = per[s.id] || {};
      if (!Object.keys(rows).length && !s.cls) return;
      const tmap = {};
      Object.entries(rows).forEach(([t, evs]) => {
        const S = evs.reduce((a, e) => a + e.w, 0);
        const share = s.cls ? ((clsCnt[s.cls] || {})[t] || 0) / Math.max(clsN[s.cls] || 0, 1) : 0;
        tmap[t] = {
          n: evs.length, S: Math.round(S * 100) / 100,
          b: band(evs.length, S, evs.some(e => e.age <= 21)),
          last: evs.map(e => e.date).filter(Boolean).sort().pop() || '',
          share: Math.round(share * 100) / 100,
          ev: evs.map(e => ({ d: e.date, k: e.kind, q: e.qno, x: e.exam, raw: e.raw }))
            .sort((a, b) => String(b.d).localeCompare(String(a.d))),
        };
      });
      students.push({
        id: s.id, name: s.name, cls: s.cls || '',
        n: Object.values(tmap).reduce((a, v) => a + v.n, 0),
        hot: Object.values(tmap).filter(v => v.b === 3).length,
      });
      map[s.id] = tmap;
    });

  return { today, students, sys, uniG, map, lab, evN: EV.length };
}

function viewTypemap(st) {
  return '<section class="view" id="v-typemap">'
    + '<h2>유형맵 — 약점 지도 <span class="dim" style="font-size:12px">'
    + '색이 진할수록 반복해서 틀린 유형이다. 정답률이 아니라 약점 신호다</span></h2>'
    + '<div class="tm-bar" id="tm-cls"></div>'
    + '<div class="tm-bar"><input id="tm-find" placeholder="이름 검색" autocomplete="off">'
    + '<span id="tm-stu" style="display:contents"></span></div>'
    + '<div class="kpis" id="tm-kpis"></div><div id="tm-first"></div>'
    + '<div class="tm-bar" style="margin-top:12px"><button class="fbtn" id="tm-only">구멍만 보기</button>'
    + '<span class="tm-leg">'
    + '<span><i class="tm-sw" style="background:rgba(255,92,138,.26);border-color:#ff5c8a"></i>반복</span>'
    + '<span><i class="tm-sw" style="background:rgba(245,160,160,.28)"></i>눈에 띔</span>'
    + '<span><i class="tm-sw" style="background:rgba(252,232,200,.15)"></i>한 번</span>'
    + '<span><i class="tm-sw" style="background:rgba(255,255,255,.04)"></i>이력 없음</span>'
    + '<span>· <b>단독</b> = 반에서 20% 미만만 틀린 개인 구멍</span></span></div>'
    + '<div id="tm-map"></div><div id="tm-detail"></div>'
    + '<div class="tm-note" id="tm-note"></div></section>';
}

function tmWire(st) {
  const D2 = tmBuild(st);
  const byId = {}; D2.students.forEach(s => byId[s.id] = s);
  const L = t => D2.lab[t] || t;
  const classes = [...new Set(D2.students.map(s => s.cls).filter(Boolean))].sort();
  let cls = classes[0] || null, sid = null, sel = null, only = false, find = '';

  const pick = c => {
    const f = D2.students.filter(x => x.cls === c).sort((a, b) => b.n - a.n);
    return f.length ? f[0].id : null;
  };
  sid = pick(cls);

  function bars() {
    $('tm-cls').innerHTML = classes.map(c =>
      `<button class="fbtn${c === cls ? ' on' : ''}" data-tc="${E(c)}">${E(c)}</button>`).join('');
    const list = D2.students.filter(s => s.cls === cls && (!find || s.name.includes(find)))
      .sort((a, b) => b.n - a.n);
    $('tm-stu').innerHTML = list.map(s =>
      `<button class="fbtn${s.id === sid ? ' on' : ''}" data-ts="${E(s.id)}">${E(s.name)}`
      + `<span class="dim" style="font-size:11px;margin-left:5px">${s.n}</span></button>`).join('')
      || '<span class="dim">해당 없음</span>';
  }

  function draw() {
    const s = byId[sid];
    if (!s) { $('tm-map').innerHTML = '<div class="dim">학생이 없다.</div>'; return; }
    const m = D2.map[sid] || {};
    const U = new Set(D2.uniG[tmGrade(s.cls)] || []);
    Object.keys(m).forEach(t => U.add(t));
    const ts = Object.keys(m), hot = ts.filter(t => m[t].b === 3);
    const recent = ts.reduce((a, t) => a + m[t].ev.filter(
      e => e.d && days(D(D2.today), D(e.d)) <= 30).length, 0);
    $('tm-kpis').innerHTML = [['총 오답', s.n], ['짚인 유형', ts.length],
      ['반복 구멍', hot.length], ['최근 30일', recent]]
      .map(([l, v]) => `<div class="kpi"><div class="lbl">${l}</div><div class="big">${v}</div></div>`).join('');

    const top = hot.slice().sort((a, b) => m[b].S - m[a].S || m[b].n - m[a].n).slice(0, 3);
    $('tm-first').innerHTML = top.length
      ? '<div class="tm-first"><div class="h">먼저 손볼 것</div><ol>' + top.map(t => {
        const v = m[t], solo = v.share > 0 && v.share < 0.2;
        return `<li data-tt="${encodeURIComponent(t)}"><b>${E(L(t))}</b><span class="why">${v.n}회`
          + `${v.last ? ' · 최근 ' + v.last : ''} · `
          + `${solo ? '반에서 나만' : '반 ' + Math.round(v.share * 100) + '%도 틀림'}</span></li>`;
      }).join('') + '</ol></div>'
      : '<div class="tm-first ok"><div class="h">먼저 손볼 것</div>같은 유형을 두 번 이상 틀린 곳이 없다.</div>';

    const units = [];
    D2.sys.forEach(r => {
      if (!U.has(r.t)) return;
      if (only && !(m[r.t] && m[r.t].b >= 2)) return;
      let u = units.find(x => x.u === r.u); if (!u) units.push(u = { u: r.u, subs: [] });
      let sg = u.subs.find(x => x.s === r.s); if (!sg) u.subs.push(sg = { s: r.s, ts: [] });
      sg.ts.push(r.t);
    });
    const sig = x => x.subs.reduce((n, g2) => n + g2.ts.reduce((k, t) => k + ((m[t] || {}).S || 0), 0), 0);
    units.sort((a, b) => sig(b) - sig(a));
    $('tm-map').innerHTML = units.map(u => {
      const tot = u.subs.reduce((n, g2) => n + g2.ts.reduce((k, t) => k + ((m[t] || {}).n || 0), 0), 0);
      return `<div class="tm-unit"><div class="tm-uh"><b>${E(u.u)}</b><span class="c">오답 ${tot}</span></div>`
        + u.subs.map(g2 => {
          const bs = g2.ts.map(t => `<i class="b${(m[t] || {}).b || 0}"></i>`).join('');
          return `<div class="tm-sub"><div class="tm-sl"><span>${E(g2.s)}</span>`
            + `<span class="tm-bars">${bs}</span></div><div class="tm-grid">`
            + g2.ts.map(t => {
              const v = m[t], b = v ? v.b : 0;
              const mine = v && v.share > 0 && v.share < 0.2 ? ' mine' : '';
              return `<div class="tm-cell b${b}${mine}${sel === t ? ' on' : ''}" `
                + `data-tt="${encodeURIComponent(t)}" title="${E(t)}">${E(L(t))}`
                + `${v ? `<span class="n">${v.n}</span>` : ''}</div>`;
            }).join('') + '</div></div>';
        }).join('') + '</div>';
    }).join('') || '<div class="dim">표시할 유형이 없다.</div>';
    detail();
  }

  function detail() {
    const el = $('tm-detail'), v = sel && (D2.map[sid] || {})[sel];
    if (!v) { el.style.display = 'none'; return; }
    const s = byId[sid];
    el.style.display = 'block';
    el.innerHTML = `<h3>${E(L(sel))}</h3><div class="full">유형체계 정식명 · ${E(sel)}</div>`
      + `<div class="p">오답 ${v.n}회 · 신호 ${v.S} · 최근 ${v.last || '-'} · `
      + `반에서 이 유형을 틀린 비율 ${Math.round(v.share * 100)}%</div>`
      + `<table>${v.ev.map(e => `<tr><td>${E(e.d || '-')}</td>`
        + `<td>${E(e.k)}${e.x ? ' ' + E(e.x) : ''}</td><td>${E(e.q)}</td><td>${E(e.raw)}</td></tr>`).join('')}</table>`
      + `<div class="acts"><a href="#video/${encodeURIComponent(L(sel))}">이 유형 수업영상 찾기</a>`
      + `<button id="tm-cmdbtn">보충 문항 뽑는 명령</button></div>`
      + `<div id="tm-cmd">python3 01_운영/학생DB/오답원문항조회.py ${E(s.name)}   # 유형: ${E(sel)}</div>`;
    $('tm-cmdbtn').onclick = () => {
      const c = $('tm-cmd');
      c.style.display = c.style.display === 'block' ? 'none' : 'block';
    };
  }

  document.addEventListener('click', ev => {
    const sec = ev.target.closest('#v-typemap'); if (!sec) return;
    const c = ev.target.closest('[data-tc]'), s = ev.target.closest('[data-ts]'),
      t = ev.target.closest('[data-tt]');
    if (c) { cls = c.dataset.tc; sid = pick(cls); sel = null; bars(); draw(); }
    else if (s) { sid = s.dataset.ts; sel = null; bars(); draw(); }
    else if (t) {
      const k = decodeURIComponent(t.dataset.tt);
      sel = sel === k ? null : k; draw();
      const d = $('tm-detail');
      if (sel && d.scrollIntoView) d.scrollIntoView({ block: 'nearest' });
    }
  });
  $('tm-only').onclick = e => { only = !only; e.target.classList.toggle('on', only); draw(); };
  $('tm-find').addEventListener('input', e => { find = e.target.value.trim(); bars(); });
  $('tm-note').textContent = `기준일 ${D2.today} · 신호 S = Σ 0.5^(경과일/${TM_HALF}) · `
    + '색 기준: 3회↑ 또는 2회+최근 = 반복 · 화면에 뜨는 유형 = 같은 학년이 실제로 만난 유형'
    + `(반 오답 ∪ 문항DB) · 오답 이벤트 ${D2.evN}건`;
  bars(); draw();
}

/* ═════════ 0811 병합 ② 영상 — 수업영상 색인 ═════════
 *
 * 개념 이름·문항 번호로 찾으면 **그 대목에서** 영상이 시작된다(youtu.be/<id>?t=초).
 * 영상ID는 유튜브 수집기(06_자동화/유튜브_수집)가 채운다 — 비어 있으면 링크가 죽은 채로
 * 색인만 보인다. 색인 자체가 이미 쓸모 있으므로 숨기지 않는다.
 * 유형맵 상세의 [이 유형 수업영상 찾기] 가 `#video/<검색어>` 로 들어온다.
 */
const VX_KINDS = ['전체', '개념설명', '문제풀이', '과제안내', '명대사'];
const mmss = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;

function viewVideo(st) {
  const rec = st.raw.video_record || [], idx = st.raw.video_index || [];
  const wait = rec.filter(r => String(r['레코드'] || '').startsWith('vid:'));
  const noid = rec.filter(r => !String(r['레코드'] || '').startsWith('vid:') && !r['영상ID']);
  return '<section class="view" id="v-video">'
    + `<h2>영상 — 수업영상 색인 <span class="cnt">${idx.length}</span>`
    + '<span class="dim" style="font-size:12px"> 개념 이름이나 문항 번호로 찾으면 그 대목에서 시작된다</span></h2>'
    + '<div class="kpis">'
    + `<div class="kpi"><div class="lbl">색인된 수업</div><div class="big">${rec.filter(r => r['분석'] === 'done').length}<small>개</small></div></div>`
    + `<div class="kpi"><div class="lbl">색인 대목</div><div class="big">${idx.length}<small>건</small></div></div>`
    + `<div class="kpi"><div class="lbl">영상ID 연결</div><div class="big">${rec.filter(r => r['영상ID']).length}<small>/${rec.length}</small></div></div>`
    + `<div class="kpi"><div class="lbl">자막 보유</div><div class="big">${rec.filter(r => r['자막'] === 'ok').length}<small>개</small></div></div></div>`
    + (noid.length ? `<div class="vx-warn">영상ID가 아직 안 붙은 수업 ${noid.length}개 — 링크가 눌리지 않는다. `
      + '유튜브 수집기가 제목으로 맞춰 붙인다(제목에 반·단원·파트를 적어 두면 자동).</div>' : '')
    + '<input id="vx-q" placeholder="예: 두 원의 교점 / 수직이등분선 / 무게중심 / 32번" autocomplete="off">'
    + `<div class="tm-bar" id="vx-kinds"></div><div id="vx-list"></div>`
    + (wait.length ? '<div class="vx-wait"><b>분석 대기</b> — 유튜브에는 있는데 아직 레코드가 없는 영상'
      + wait.sort((a, b) => String(b['업로드일']).localeCompare(String(a['업로드일']))).map(r =>
        `<div class="vx-wrow"><a href="https://youtu.be/${E(r['영상ID'])}" target="_blank" rel="noopener">${E(r['제목'] || r['영상ID'])}</a>`
        + `<span class="dim">${E(r['업로드일'] || '')}`
        + `${r['길이_초'] ? ' · ' + mmss(Number(r['길이_초'])) : ''}`
        + `${r['자막'] === 'ok' ? ' · 자막 있음' : ''}</span></div>`).join('') + '</div>' : '')
    + '</section>';
}

function vxWire(st) {
  const rec = st.raw.video_record || [], idx = st.raw.video_index || [];
  const V = {}; rec.forEach(r => V[r['레코드']] = r);
  let kind = '전체', q = '';
  const hl = s => {
    if (!q) return E(s);
    const i = String(s).toLowerCase().indexOf(q.toLowerCase());
    return i < 0 ? E(s) : E(String(s).slice(0, i)) + '<mark>' + E(String(s).slice(i, i + q.length))
      + '</mark>' + E(String(s).slice(i + q.length));
  };
  function draw() {
    $('vx-kinds').innerHTML = VX_KINDS.map(k =>
      `<button class="fbtn${k === kind ? ' on' : ''}" data-vk="${k}">${k}</button>`).join('');
    const hits = idx.filter(e => (kind === '전체' || e['종류'] === kind) && (!q ||
      [e['제목'], e['요지'], e['출처'], (V[e['레코드']] || {})['단원']].join(' ')
        .toLowerCase().includes(q.toLowerCase())));
    const by = {};
    hits.forEach(e => (by[e['레코드']] = by[e['레코드']] || []).push(e));
    const keys = Object.keys(by).sort((a, b) =>
      String((V[b] || {})['날짜'] || '').localeCompare(String((V[a] || {})['날짜'] || '')));
    $('vx-list').innerHTML = keys.length ? keys.map(k => {
      const v = V[k] || {};
      return `<div class="vx-grp"><div class="vx-gh"><b>${E(v['날짜'] || '')} ${E(v['반'] || '')}</b>`
        + `<span class="c">${E(v['단원'] || '')}</span><span class="c">· ${by[k].length}건</span></div>`
        + by[k].sort((a, b) => a['t'] - b['t']).map(e => {
          const inner = `<span class="k ${e['종류']}">${e['종류']}</span><b>${hl(e['제목'])}</b>`
            + (e['출처'] ? `<span class="src">${E(e['출처'])}</span>` : '')
            + `<span class="t">${mmss(Number(e['t']))}</span>`
            + (e['요지'] ? `<span class="n">${hl(e['요지'])}</span>` : '');
          return v['영상ID']
            ? `<a class="vx-row" href="https://youtu.be/${E(v['영상ID'])}?t=${Number(e['t'])}" target="_blank" rel="noopener">${inner}</a>`
            : `<div class="vx-row dead" title="영상ID 미등록">${inner}</div>`;
        }).join('') + '</div>';
    }).join('') : '<div class="dim">찾은 것이 없다.</div>';
  }
  $('vx-q').addEventListener('input', e => { q = e.target.value.trim(); draw(); });
  document.addEventListener('click', e => {
    const b = e.target.closest('#v-video [data-vk]');
    if (b) { kind = b.dataset.vk; draw(); }
  });
  window.vxSearch = s => { q = String(s || '').trim(); $('vx-q').value = q; draw(); };
  draw();
}

/* ───────── 리포트 이미지 (서버 렌더 → Storage) ─────────
 * 경로 규칙은 render_daily.py 와 한 몸이다: `<날짜>/<sha1(이름.jpg) 앞 16자>.jpg`.
 * (Storage 키에 한글을 못 써서 해시를 쓴다.) 그래서 매니페스트를 따로 읽지 않고
 * 화면에 있는 학생 이름으로 경로를 계산한다. 규칙을 바꾸면 두 쪽을 같이 고쳐야 한다.
 */
async function sha16(text) {
  const buf = await crypto.subtle.digest('SHA-1', new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('').slice(0, 16);
}
async function loadReportImages(el) {
  const box = el.querySelector('.thumbs');
  if (el.dataset.loaded) return;
  el.dataset.loaded = '1';
  const date = el.dataset.date, names = el.dataset.names.split('|').filter(Boolean);
  const sum = el.querySelector('summary');
  // 먼저 그 날짜 폴더에 **실제로 있는 파일**을 본다. 이름 수만 믿고 "N장"이라 적으면
  // 아직 렌더 안 한 날도 있는 것처럼 보인다(0811 실측).
  const ls = await sb.storage.from('reports').list(date, { limit: 300 });
  if (ls.error) {
    box.innerHTML = `<span class="warn">이미지를 못 읽었다: ${E(ls.error.message)}`
      + ' — Storage 읽기 정책이 없으면 이렇게 나온다(README 참고)</span>';
    return;
  }
  const have = new Set((ls.data || []).map(f => f.name));
  const hashes = [];
  for (const n of names) hashes.push(await sha16(n + '.jpg'));
  const idx = names.map((n, i) => i).filter(i => have.has(hashes[i] + '.jpg'));
  const missing = names.filter((n, i) => !have.has(hashes[i] + '.jpg'));
  if (sum) sum.textContent = idx.length ? `리포트 이미지 ${idx.length}장` : '리포트 이미지 없음 (아직 렌더 안 됨)';
  if (!idx.length) {
    box.innerHTML = '<span class="dim">이 날짜는 아직 서버에서 렌더되지 않았다</span>';
    return;
  }
  const paths = idx.map(i => `${date}/${hashes[i]}.jpg`);
  const { data, error } = await sb.storage.from('reports').createSignedUrls(paths, 3600);
  if (error) {
    box.innerHTML = `<span class="warn">서명 URL 실패: ${E(error.message)}</span>`;
    return;
  }
  names.length = 0;
  idx.forEach(i => names.push(el.dataset.names.split('|')[i]));
  if (missing.length) box.dataset.missing = missing.join(', ');
  // 썸네일은 쓰지 않는다. 리포트는 2430×4800 세로 이미지에 배경이 검정이라
  // 88px 로 줄이면 새까만 사각형이 된다(0811 실측). 이름을 눌러 원본을 여는 게 목적에 맞다
  // — 카톡으로 보낼 장을 고르는 화면이다.
  const items = data.map((d, i) => d.signedUrl
    ? `<a class="rp-lnk" href="${d.signedUrl}" target="_blank" rel="noopener">${E(names[i])}</a>`
    : `<span class="rp-lnk none">${E(names[i])}</span>`);
  if (box.dataset.missing) items.push(`<span class="dim">· 없는 학생: ${E(box.dataset.missing)}</span>`);
  box.innerHTML = items.join('') || '<span class="dim">렌더된 이미지 없음</span>';
}

/* ───────── 상호작용 (정적판 JS와 동일) ───────── */
function wire(st) {
  tmWire(st); vxWire(st);          // 0811 병합 — 유형맵·영상은 상태를 들고 스스로 그린다
  document.addEventListener('toggle', e => {
    const el = e.target;
    if (el.tagName === 'DETAILS' && el.classList.contains('rp-imgs') && el.open) loadReportImages(el);
  }, true);

  const tip = $('tip');
  document.addEventListener('mouseover', e => {
    const t = e.target.closest && e.target.closest('.sp'); if (!t) return;
    tip.textContent = t.dataset.tip; tip.style.opacity = 1;
  });
  document.addEventListener('mousemove', e => {
    tip.style.left = (e.clientX + 12) + 'px'; tip.style.top = (e.clientY - 30) + 'px';
  });
  document.addEventListener('mouseout', e => {
    if (e.target.closest && e.target.closest('.sp')) tip.style.opacity = 0;
  });

  function route() {
    let h = decodeURIComponent(location.hash || '#today').slice(1);
    let [main, sub] = h.split('/');
    if (!['today', 'class', 'student', 'clinic', 'loop', 'report', 'weak',
      'exam', 'cliniclog', 'exammeta', 'typemap', 'video'].includes(main)) main = 'today';
    let id = 'v-' + main;
    // 유형맵 상세에서 넘어온 검색어 (#video/두 원의 교점)
    if (main === 'video' && sub && window.vxSearch) window.vxSearch(sub);
    if (main === 'class' && sub && document.getElementById('v-class-' + sub)) id = 'v-class-' + sub;
    if (main === 'student' && sub && document.getElementById('v-stu-' + sid2id(sub))) id = 'v-stu-' + sid2id(sub);
    document.querySelectorAll('.view').forEach(v => v.classList.remove('on'));
    (document.getElementById(id) || document.getElementById('v-today')).classList.add('on');
    document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.dataset.v === main));
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route); route();

  let ban = '*'; const q = $('q');
  function apply() {
    const s = q.value.trim();
    document.querySelectorAll('.srow').forEach(el => {
      el.style.display = ((ban === '*' || el.dataset.ban === ban) && (!s || el.dataset.name.includes(s))) ? '' : 'none';
    });
  }
  document.querySelectorAll('#v-student .fbtn').forEach(b => b.onclick = () => {
    document.querySelectorAll('#v-student .fbtn').forEach(x => x.classList.remove('on'));
    b.classList.add('on'); ban = b.dataset.f; apply();
  });
  q.addEventListener('input', apply);

  const rowsEl = $('rows'); let sk = null, dir = 1;
  document.querySelectorAll('.sort').forEach(h => h.onclick = () => {
    const k = h.dataset.k;
    if (sk === k) dir = -dir; else { sk = k; dir = (k === 'name') ? 1 : -1; }
    document.querySelectorAll('.sort').forEach(x => x.classList.remove('asc', 'desc'));
    h.classList.add(dir === 1 ? 'asc' : 'desc');
    const rows = [...rowsEl.children];
    rows.sort((a, b) => {
      if (k === 'name') return dir * a.dataset.name.localeCompare(b.dataset.name, 'ko');
      const va = parseFloat(a.dataset[k]), vb = parseFloat(b.dataset[k]);
      if (va === -1 && vb === -1) return 0;
      if (va === -1) return 1;
      if (vb === -1) return -1;
      return dir * (va - vb);
    });
    rows.forEach(r => rowsEl.appendChild(r));
  });

  document.querySelectorAll('.wtab').forEach(b => b.onclick = () => {
    document.querySelectorAll('.wtab').forEach(x => x.classList.remove('on')); b.classList.add('on');
    document.querySelectorAll('.wbody').forEach(x => x.style.display = 'none');
    document.getElementById('w-' + b.dataset.w).style.display = '';
  });
}
