<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>학습현황 대시보드</title>
<style>
:root{color-scheme:dark}
body{margin:0;background:#0a0a0f;color:#f5f5fa;font:15px/1.6 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;
 display:flex;align-items:center;justify-content:center;min-height:100vh}
.box{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:16px;
 padding:36px 34px;width:min(360px,88vw);text-align:center}
.logo{font-weight:800;font-size:18px;color:#f5a0a0;margin-bottom:4px}
.sub{color:#8a8a98;font-size:13px;margin-bottom:22px}
input[type=password]{width:100%;box-sizing:border-box;background:#14141c;border:1px solid rgba(255,255,255,.1);
 color:#f5f5fa;border-radius:10px;padding:11px 14px;font-size:15px;text-align:center;letter-spacing:.2em}
input[type=password]:focus{outline:none;border-color:#f5a0a0}
button{width:100%;margin-top:12px;background:#f5a0a0;color:#1a1016;border:none;border-radius:10px;
 padding:11px;font-size:15px;font-weight:700;cursor:pointer}
button:disabled{opacity:.5}
.rm{margin-top:12px;font-size:12.5px;color:#8a8a98;display:flex;gap:6px;justify-content:center;align-items:center}
.err{color:#ff5c8a;font-size:13px;margin-top:12px;min-height:18px}
</style></head><body>
<div class="box">
<div class="logo">수학은유강</div>
<div class="sub">학습현황 대시보드 · 비밀번호를 입력하세요</div>
<input id="pw" type="password" autocomplete="current-password" autofocus>
<button id="go">열기</button>
<label class="rm"><input id="rm" type="checkbox" checked> 이 기기에서 기억</label>
<div class="err" id="err"></div>
</div>

const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function dec(pw){
 const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(P.s),iterations:P.it,hash:'SHA-256'},km,
  {name:'AES-GCM',length:256},false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(P.i)},key,b(P.c));
 return new TextDecoder().decode(pt);}
async function go(){
 const pw=document.getElementById('pw').value;
 if(!pw)return;
 document.getElementById('go').disabled=true;
 document.getElementById('err').textContent='';
 try{
  const html=await dec(pw);
  if(document.getElementById('rm').checked)localStorage.setItem('dbpw',pw);
  else localStorage.removeItem('dbpw');
  document.open();document.write(html);document.close();
 }catch(e){
  document.getElementById('err').textContent='비밀번호가 올바르지 않습니다';
  document.getElementById('go').disabled=false;}}
document.getElementById('go').onclick=go;
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')go();});
const saved=localStorage.getItem('dbpw');
if(saved){document.getElementById('pw').value=saved;go();}
</script></body></html>
